<script>
/* 互动脚本：照这个骨架改参数、公式、图形 */
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var GX = window.GX, el = GX.el, tx = GX.tx, n1 = GX.n1, $ = GX.$;
  var stage = $("gxStage");
  if (!stage) return;

  var WIDE = { vb: "0 0 880 440", fs: 1, g: { cx: 210, cy: 236, r: 150 }, t1: [24, 30], t2: [486, 66] };
  var NARROW = { vb: "0 0 360 520", fs: 1.02, g: { cx: 180, cy: 150, r: 104 }, t1: [20, 24], t2: [24, 286] };
  var L = WIDE, A = 5, REF = {};

  function build() {
    var gA = $("gxA"), gB = $("gxB");
    gA.textContent = ""; gB.textContent = "";
    tx(gA, L.t1[0], L.t1[1], "① 左侧图", "#151a21", "start", 11.5 * L.fs, 700);
    el("circle", { cx: L.g.cx, cy: L.g.cy, r: L.g.r, fill: "#eef6fb", stroke: "#b8d8e8" }, gA);
    REF.val = tx(gA, L.g.cx, L.g.cy, "", "#0b6580", "middle", 16 * L.fs, 700);
    tx(gB, L.t2[0], L.t2[1], "② 右侧图", "#151a21", "start", 11.5 * L.fs, 700);
  }

  function render() {
    REF.val.textContent = A.toFixed(1);
    $("gxVa").textContent = A.toFixed(1);
    $("gxVb").textContent = (A * 2).toFixed(0);
    var st, col, bg;
    if (A < 3) { st = "偏小"; col = "#3f6f92"; bg = "#eef6fb"; }
    else if (A > 7) { st = "偏大"; col = "#b8402f"; bg = "#fbeae7"; }
    else { st = "正常"; col = "#1e6640"; bg = "#e6f6ee"; }
    $("gxVs").textContent = st;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    $("gxSl").value = String(A);
  }

  function applyLayout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? WIDE : NARROW;
    stage.setAttribute("viewBox", L.vb);
    build(); render();
  }

  $("gxSl").addEventListener("input", function () { A = +this.value; render(); });
  $("gxP1").addEventListener("click", function () { A = 2; render(); });
  $("gxP2").addEventListener("click", function () { A = 8; render(); });
  stage.addEventListener("keydown", function (ev) {
    if (ev.key === "ArrowLeft" || ev.key === "ArrowRight") {
      ev.preventDefault();
      A = GX.clamp(A + (ev.key === "ArrowRight" ? 0.5 : -0.5), 0, 10);
      render();
    }
  });
  var tmr = null;
  window.addEventListener("resize", function () {
    clearTimeout(tmr); tmr = setTimeout(applyLayout, 180);
  });
  applyLayout();
});
</script>
