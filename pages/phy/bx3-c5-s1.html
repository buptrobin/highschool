<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本原话，拆成三句</h2>
<div class="q-src">人教版必修第三册 · 第十三章第1节</div>

<div class="q">
<p class="q-t">“磁体周围存在磁场，磁体间的相互作用就是通过磁场发生的。”</p>
<p class="q-b">两块磁体没接触也能互相推拉，靠的就是中间的磁场。它真实存在，能对磁体、通电导线、运动电荷施力。</p>
</div>

<div class="q">
<p class="q-t">“磁感线是为了形象描述磁场而假想的曲线。磁体外部，磁感线从 N 极出发回到 S 极；内部从 S 极到 N 极。磁感线是闭合曲线。”</p>
<p class="q-b">两条读数规则：切线方向是该点磁场方向，疏密表示强弱。没有单独的磁荷，线无处发出、无处终止，只能绕回去。</p>
</div>

<div class="q">
<p class="q-t">“奥斯特实验表明，通电导线周围存在磁场。安培定则可以判断电流的磁场方向。”</p>
<p class="q-b">用法：右手握导线，拇指指电流，四指弯曲方向就是磁感线的环绕方向。</p>
</div>

<p class="gx-note">三句话三个层次：磁场是什么 → 怎么画 → 怎么定向。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己写，再点“下一步”。关键：先把公式化成数字，再用比例，最后单独说方向。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 长直导线的磁感应强度<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">长直导线竖直放置，通有从下往上的电流。距导线 r = 0.1 m 的 P 点：
（1）I = 2 A 时 B 多大？（2）I = 4 A 时 B 多大？（3）P 点磁场方向怎么判断？俯视是顺时针还是逆时针？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 写公式，统一单位</p>
<p class="s-b">长直导线：<b>B = μ0I / (2πr)</b>，μ0 = 4π×10⁻⁷ T·m/A。I 用安培、r 用米、B 得特斯拉。分母先算好：2πr = 2π×0.1 = 0.2π ≈ 0.628 m。</p>
<p class="s-k">用到：B = μ0I/(2πr)，国际单位。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 代入 I = 2 A</p>
<p class="s-b">B = (4π×10⁻⁷ × 2) / (2π × 0.1) = (8π×10⁻⁷) / (0.2π) = 40×10⁻⁷ = <b>4×10⁻⁶ T</b>。π 上下约掉，不用计算器。</p>
<p class="s-k">用到：代入法；0.2π = 2π×0.1。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · I = 4 A，用比例更快</p>
<p class="s-b">r 不变时 B 与 I 成正比：I 从 2 A 增到 4 A，B 翻倍，<b>B′ = 8×10⁻⁶ T</b>。验算：(4π×10⁻⁷×4)/(0.2π) = 80×10⁻⁷ = 8×10⁻⁶ T。</p>
<p class="s-k">用到：B ∝ I；比例法验算。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 方向交给安培定则</p>
<p class="s-b">右手握导线，<b>拇指指向电流方向（竖直向上）</b>，四指弯曲方向即磁感线环绕方向，从上往下看是<b>逆时针</b>。P 点的 B 垂直于 OP、也垂直于导线，沿过 P 的圆的切线。</p>
<p class="s-k">用到：安培定则；B 沿切线，不沿半径。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 写答案，方向单独一句</p>
<p class="s-b">（1）<b>B = 4×10⁻⁶ T</b>；（2）<b>B = 8×10⁻⁶ T</b>；（3）用安培定则，右手握导线、拇指指电流，四指绕向即磁感线方向，<b>俯视逆时针</b>，沿过 P 的圆的切线。</p>
<p class="s-k">用到：大小管公式，方向管定则。</p>
</li>
</ol>
<div class="exbar">
  <button id="gxNext" type="button">下一步</button>
  <span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）B = μ0I/(2πr) = (4π×10⁻⁷×2)/(2π×0.1) = <b>4×10⁻⁶ T</b>。<br>
（2）r 不变时 B ∝ I，I 加倍则 B 加倍：<b>8×10⁻⁶ T</b>。<br>
（3）右手握导线，拇指指电流（竖直向上），四指绕向即磁感线方向，<b>俯视逆时针</b>；B 沿过 P 点的圆的切线。</p>
</div>
<p class="gx-note">高频扣分：把 r 写成 1 m；漏掉 μ0 里的 4π；用公式去“算”方向。</p>
</div>
</section>

<div class="gx-qa">
<div class="qac">
<p class="q">磁感应强度的方向是怎样规定的？</p>
<p class="a"><b>小磁针 N 极所受磁场力的方向</b>，也就是小磁针静止时 N 极所指的方向，还是该点磁感线的切线方向。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="小磁针N极受力方向">
  <line x1="20" y1="70" x2="212" y2="70" stroke="#7c3aed" stroke-width="2"/>
  <polygon points="212,70 198,64 198,76" fill="#7c3aed"/>

  <polygon points="92,62 148,70 92,78" fill="#b8402f"/>

<div class="qac">
<p class="q">磁感线为什么一定闭合？</p>
<p class="a"><b>自然界没有单独的磁荷，磁感线无处发出、无处终止。</b>它从 N 极出来回到 S 极，再在内部由 S 极回到 N 极。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="磁感线闭合成环">
  <ellipse cx="120" cy="64" rx="82" ry="34" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <rect x="96" y="52" width="24" height="24" fill="#f6ddd7" stroke="#c0503c" stroke-width="1.2"/>
  <rect x="120" y="52" width="24" height="24" fill="#d8e4f8" stroke="#2f6fd0" stroke-width="1.2"/>
  <text x="108" y="69" text-anchor="middle" font-size="9" fill="#b8402f">N</text>
  <text x="132" y="69" text-anchor="middle" font-size="9" fill="#2f6fd0">S</text>
  <polygon points="128,30 116,25 116,35" fill="#7c3aed"/>
  <line x1="140" y1="64" x2="108" y2="64" stroke="#1e6640" stroke-width="1.6"/>
  <polygon points="104,64 114,60 114,68" fill="#1e6640"/>
</svg>
</div>
<div class="qac">
<p class="q">直线电流周围的磁感线是什么形状？</p>
<p class="a"><b>一圈圈以导线为圆心的同心圆，圆面垂直于导线。</b>离导线越近越密、磁场越强。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="同心圆">
  <circle cx="106" cy="66" r="40" fill="none" stroke="#7c3aed" stroke-width="1.6"/>
  <circle cx="106" cy="66" r="22" fill="none" stroke="#7c3aed" stroke-width="1.6"/>
  <circle cx="106" cy="66" r="7" fill="#ffffff" stroke="#b8402f" stroke-width="2"/>
  <circle cx="106" cy="66" r="2.4" fill="#b8402f"/>
  <polygon points="98,26 108,19 108,33" fill="#7c3aed"/>
  <text x="168" y="66" font-size="8.5" fill="#6d28d9">同心圆</text>
</svg>
</div>
<div class="qac">
<p class="q">通电螺线管的 N 极怎么判断？</p>
<p class="a"><b>右手握螺线管，四指指电流环绕方向，拇指所指那端就是 N 极。</b>管内磁场从 S 极指向 N 极。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="右手握螺线管指N极">
  <line x1="40" y1="66" x2="208" y2="66" stroke="#cfd4da" stroke-dasharray="4 3"/>
  <ellipse cx="70" cy="66" rx="7" ry="26" fill="none" stroke="#b8791f" stroke-width="2.4"/>
  <ellipse cx="90" cy="66" rx="7" ry="26" fill="none" stroke="#b8791f" stroke-width="2.4"/>
  <ellipse cx="110" cy="66" rx="7" ry="26" fill="none" stroke="#b8791f" stroke-width="2.4"/>
  <ellipse cx="130" cy="66" rx="7" ry="26" fill="none" stroke="#b8791f" stroke-width="2.4"/>
  <ellipse cx="150" cy="66" rx="7" ry="26" fill="none" stroke="#b8791f" stroke-width="2.4"/>
  <ellipse cx="170" cy="66" rx="7" ry="26" fill="none" stroke="#b8791f" stroke-width="2.4"/>
  <polygon points="186,34 210,42 186,50" fill="#b8402f"/>
  <text x="200" y="28" text-anchor="middle" font-size="9" fill="#b8402f">N 极</text>
  <text x="120" y="112" text-anchor="middle" font-size="8.5" fill="#6b7280">四指指绕向，拇指指 N 极</text>
</svg>
</div>
<div class="qac">
<p class="q">地磁场与地理南北极是什么关系？</p>
<p class="a"><b>地磁 S 极在地理北极附近，地磁 N 极在地理南极附近。</b>所以小磁针 N 极指北，两者不重合，有磁偏角。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="地磁极与地理极">
  <circle cx="106" cy="66" r="40" fill="#fbfcfd" stroke="#cfd4da" stroke-width="1.4"/>
  <line x1="92" y1="96" x2="106" y2="66" stroke="#b8402f" stroke-width="7"/>
  <line x1="106" y1="66" x2="120" y2="36" stroke="#2f6fd0" stroke-width="7"/>
  <text x="86" y="110" font-size="9" fill="#b8402f">N</text>
  <text x="124" y="30" font-size="9" fill="#2f6fd0">S</text>
  <text x="170" y="40" font-size="8.5" fill="#6b7280">地理北极</text>
  <text x="170" y="98" font-size="8.5" fill="#6b7280">地理南极</text>
</svg>
</div>
<div class="qac">
<p class="q">两条磁感线能相交吗？</p>
<p class="a"><b>不能。</b>磁场中每点方向唯一，相交处会出现两个切线方向，自相矛盾。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="磁感线不能相交">
  <path d="M36 96 C90 96 150 36 204 36" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <path d="M36 36 C90 36 150 96 204 96" fill="none" stroke="#2f6fd0" stroke-width="2"/>
  <circle cx="120" cy="66" r="13" fill="none" stroke="#b8402f" stroke-width="1.4"/>
  <path d="M112 58 L128 74 M128 58 L112 74" stroke="#b8402f" stroke-width="2"/>
  <text x="120" y="122" text-anchor="middle" font-size="8.5" fill="#6b7280">相交处会有两个方向</text>
</svg>
</div>
</div>
<p class="gx-note">六问归成一条：<b>大小看疏密和公式，方向看安培定则，闭合看有没有磁荷</b>。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>六条易错，逐条改</h2>

<div class="er">
<p class="er-x">✗ 磁体外部磁感线从 S 极指向 N 极。</p>
<p class="er-v">✓ 外部从 N 极出发回到 S 极，内部才从 S 极到 N 极。</p>
<p class="er-w">把“小磁针 N 极指北”套到磁体上，就会记反。</p>
</div>
<div class="er">
<p class="er-x">✗ 两条磁感线可以相交。</p>
<p class="er-v">✓ 磁感线绝不相交，因为同一点磁场方向唯一。</p>
<p class="er-w">相交处会有两个切线方向，与“方向唯一”冲突。</p>
</div>
<div class="er">
<p class="er-x">✗ B 的方向就是磁场力的方向。</p>
<p class="er-v">✓ B 的方向是小磁针 N 极受力方向；导线受力方向与 B 垂直。</p>
<p class="er-w">安培力用左手定则，方向与 B 垂直，不能混用。</p>
</div>
<div class="er">
<p class="er-x">✗ 判断电流的磁场方向要用左手。</p>
<p class="er-v">✓ 电生磁用右手（安培定则），磁对电流的力用左手。</p>
<p class="er-w">两套手势对应两类问题，别对调。</p>
</div>
<div class="er">
<p class="er-x">✗ 地磁的 N 极在地理北极附近。</p>
<p class="er-v">✓ 地磁 S 极在地理北极附近，N 极在地理南极附近。</p>
<p class="er-w">小磁针 N 极指北，是被北方的地磁 S 极吸引。</p>
</div>
<div class="er">
<p class="er-x">✗ 磁感线真实存在，铁屑排出来就是它。</p>
<p class="er-v">✓ 磁感线是假想模型，铁屑只间接显示磁场分布。</p>
<p class="er-w">当成实物，就会去问“线是什么材料做的”。</p>
</div>

<p class="gx-note">记住“同心圆 + 右手”和“四指管电流、拇指管 N 极”，方向题基本不失分。</p>
</section>

<script>
document.addEventListener("DOMContentLoaded", function () {
  var $ = GX.$;
  var MU0 = 4 * Math.PI * 1e-7, R = 0.1;
  var stage = $("gxStage"), I = 1;
  var PX = 233.6, PY = 205, TX = 0.643, TY = -0.766;
  function Bv(i) { return MU0 * i / (2 * Math.PI * R); }
  function sci(b) {
    return b < 1e-5 ? (b * 1e6).toFixed(1) + "×10⁻⁶ T" : (b * 1e5).toFixed(1) + "×10⁻⁵ T";
  }
  function render() {
    var b = Bv(I), L = 20 + 2.2 * I;
    var ex = PX + L * TX, ey = PY + L * TY;
    var bx = ex - TX * 11, by = ey - TY * 11, nx = -TY, ny = TX;
    $("gxArrow").setAttribute("x2", ex.toFixed(1));
    $("gxArrow").setAttribute("y2", ey.toFixed(1));
    $("gxHead").setAttribute("points", ex.toFixed(1) + "," + ey.toFixed(1) + " " +
      (bx + nx * 4.6).toFixed(1) + "," + (by + ny * 4.6).toFixed(1) + " " +
      (bx - nx * 4.6).toFixed(1) + "," + (by - ny * 4.6).toFixed(1));
    $("gxBVal").setAttribute("x", (ex + 8).toFixed(1));
    $("gxBVal").setAttribute("y", (ey - 6).toFixed(1));
    $("gxBVal").textContent = (b * 1e6).toFixed(1) + " μT";
    Array.prototype.forEach.call(stage.querySelectorAll(".ring"), function (c) {
      c.setAttribute("stroke-opacity", (0.22 + 0.06 * I).toFixed(2));
    });
    $("gxVv").textContent = I + " A";
    $("gxVb").textContent = (b * 1e6).toFixed(1) + " μT";
    $("gxVbs").textContent = "= " + sci(b) + "；B ∝ I";
    $("gxTake").textContent = "I = " + I + " A 时 B = " + (b * 1e6).toFixed(1) +
      " μT（" + sci(b) + "）；I 加倍，B 也加倍——r 固定时 B 与 I 成正比。";
    $("gxStateNote").textContent = "状态：I 增大，B 增大；方向不变，仍是俯视逆时针。";
  }
  function setMode(m) {
    var b = $("gxAp"), t = $("gxApTxt");
    if (!b) return;
    b.classList.toggle("is-auto", m === "auto");
    b.classList.toggle("is-manual", m !== "auto");
    if (t) t.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }
  render();
  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 1 }, { t: 2, v: 1 }, { t: 3.5, v: 2 }, { t: 5.5, v: 2 },
           { t: 7, v: 5 }, { t: 9.5, v: 5 }, { t: 11.5, v: 10 }, { t: 13.5, v: 1 }],
    keys: [1, 2, 5, 10],
    value: 1, min: 1, max: 10, step: 1,
    idle: 5000,
    onChange: function (v) { I = Math.round(v); render(); },
    onMode: setMode
  });
  window.__ap = ap;
});
</script>
