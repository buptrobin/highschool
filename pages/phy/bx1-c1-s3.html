<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">四个词，一条主线：位移 ÷ 时间。先把「整段」和「瞬间」分开。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 速度<span class="q-src">人教版必修第一册 · 第一章第 3 节</span></p>
<p class="q-b">位移与发生这段位移所用时间之比，表示物体运动的快慢，叫作速度。</p>
<p class="q-n">→ 写成式子：<b>v = Δx / Δt</b>。分子必须是<b>位移</b>，不是路程；分母是发生这段位移所用的时间。
速度是<b>矢量</b>，既有大小又有方向；平均速度的方向与位移方向一致，曲线运动中瞬时速度沿轨迹切线。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 平均速度<span class="q-src">人教版必修第一册 · 第一章第 3 节</span></p>
<p class="q-b">平均速度表示物体在时间间隔 Δt 内的平均快慢程度。</p>
<p class="q-n">→ 关键词是<b>「时间间隔」</b>：它对应一段 Δt，不是某一瞬间。平均速度 = <b>总位移 / 总时间</b>，
不是「几段速度加起来除以几」。方向与总位移方向一致。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 瞬时速度与速率<span class="q-src">人教版必修第一册 · 第一章第 3 节</span></p>
<p class="q-b">瞬时速度表示物体在某一时刻（或某一位置）的速度；瞬时速度的大小叫作速率。</p>
<p class="q-n">→ 瞬时速度对应<b>一个时刻 / 一个位置</b>，可以看成平均速度在 Δt→0 时的极限：Δt 很小时，平均速度就逼近它。
速率只取大小，是<b>标量</b>；速度有方向，是矢量。汽车速度表显示的是<b>速率</b>，不是速度。</p>
</div>

<p class="gx-note">一条主线：<b>速度 = 位移 / 时间</b>。时间取「一段」→ 平均速度；时间取「一点」→ 瞬时速度；
分子换「路程」→ 平均速率。三个换法，考试就靠它们设陷阱。</p>
</section>

  <span class="lb">时间间隔 Δt</span>
  <input type="range" id="gxSl" min="0.1" max="2" step="0.1" value="2" aria-label="时间间隔 Delta t，单位秒">
  <p class="hint">键盘 ← → 微调；点画面跳到下一个 Δt。</p>
</div>
</div>
<div class="stats">
  <div class="st"><div class="k">① 时间间隔 Δt</div><div class="v" id="gxVa">2.0 s</div><div class="s">Q 点与 P 点的距离</div></div>
  <div class="st"><div class="k">② 平均速度</div><div class="v" id="gxVb">12.00 m/s</div><div class="s">割线的斜率</div></div>
  <div class="st state" id="gxStBox"><div class="k">③ 状态判断</div><div class="v" id="gxVs">差得多，只是平均</div><div class="s" id="gxVsn">瞬时速度 8.00 m/s，差 4.00</div></div>
</div>
<p class="gx-take">Δt 越小，Q 越靠近 P，割线越贴近切线：平均速度从 12.00 → 8.80 → 8.20，<b>逼近 P 点的瞬时速度 8.00 m/s</b>。</p>
<p class="gx-note">模型口径：x = 2t²（x 单位 m，t 单位 s），P 点 t₀ = 2.0 s，瞬时速度 8.00 m/s；
平均速度 = [2(t₀+Δt)² − 2t₀²] / Δt = 8 + 2Δt。Δt 取 0.1–2.0 s（步长 0.1 s）。
「Δt→0」是取极限的思想，不是让 Δt 真的等于 0；图中割线、切线按同一坐标比例绘制。</p>
</figure>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己画一条往返线段，再点「下一步」。这题专门抓「平均速度用位移、平均速率用路程」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 平均速度与平均速率<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">一辆汽车沿直线从 A 到 B，位移 100 m，用时 5 s；接着从 B 返回 20 m 到 C，用时 2 s。
求全程的平均速度大小和全程的平均速率。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 定正方向，画出去和回</p>
<p class="s-b">规定 A→B 为正方向。A 到 B 的位移是 +100 m；B 返回 20 m 到 C，位移是 −20 m。
全程的初位置是 A，末位置是 C，C 在 A 前方 80 m 处。</p>
<p class="s-k">用到：一维运动先定正方向，返回段的位移要带负号。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 总位移 = 100 − 20 = 80 m</p>
<p class="s-b">总位移 Δx = x<sub>C</sub> − x<sub>A</sub> = 80 − 0 = +80 m，方向 A→C（与初始方向相同）。
注意：不是 100 + 20 = 120 m，返回的 20 m 要从位移里减掉。</p>
<p class="s-k">用到：位移只看初、末位置，返回段会抵消一部分。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 总时间 = 5 + 2 = 7 s</p>
<p class="s-b">全程用时 7 s。平均速度 = 总位移 / 总时间 = 80 / 7 ≈ 11.4 m/s，方向 A→C。</p>
<p class="s-k">用到：平均速度 = Δx / Δt，分子是总位移，不是总路程。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 平均速率要用总路程</p>
<p class="s-b">全程路程 = 100 + 20 = 120 m。平均速率 = 总路程 / 总时间 = 120 / 7 ≈ 17.1 m/s。
平均速率是标量，只说大小，不说方向。</p>
<p class="s-k">用到：平均速率 = 路程 / 时间；它和平均速度不是同一个量。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口：为什么不能「两段速度取平均」</p>
<p class="s-b">去程平均速率 100/5 = 20 m/s，返回平均速率 20/2 = 10 m/s。若直接取平均得 15 m/s，<b>错了</b>。
两段时间不同，不能算术平均；必须回到定义：总位移 80 m、总时间 7 s，得 11.4 m/s。</p>
<p class="s-k">用到：平均速度的定义是「总位移 / 总时间」，不是「速度的平均」。</p>
</li>
</ol>
<div class="exbar">
  <button id="gxNext" type="button">下一步</button>
  <span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">全程位移 Δx = 100 m − 20 m = 80 m，方向 A→C；总时间 Δt = 5 s + 2 s = 7 s。<br>
平均速度 v = Δx / Δt = 80 / 7 ≈ <b>11.4 m/s</b>，方向 A→C。<br>
全程路程 s = 100 m + 20 m = 120 m；平均速率 = s / Δt = 120 / 7 ≈ <b>17.1 m/s</b>。</p>
</div>
<p class="gx-note">两问的分子不同：平均速度用 80 m（位移），平均速率用 120 m（路程）。只改一个数字，答案就从 11.4 变成 17.1。</p>
</div>
</section>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>考你会怎么考</h2>
<p class="gx-h2s">六种问法，陷阱都埋在「位移还是路程」「整段还是瞬间」这两个岔路口。</p>

<div class="gx-qa">
<div class="qac">
<p class="q">速度大，位移一定大吗？</p>
<p class="a"><b>不一定。</b>v = Δx / Δt，位移还取决于时间。速度很大但只跑了 0.1 s，位移也可能很小。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="速度大但时间短，位移不一定大">
  <rect x="28" y="30" width="26" height="72" fill="#7c3aed" opacity=".8"/>
  <text x="41" y="118" text-anchor="middle" font-size="10" fill="#6b7280">v 大</text>
  <rect x="80" y="30" width="26" height="18" fill="#b8791f"/>
  <text x="93" y="118" text-anchor="middle" font-size="10" fill="#6b7280">t 短</text>
  <text x="152" y="60" font-size="11" fill="#3a3a35">Δx = v·t</text>
  <text x="152" y="82" font-size="11" fill="#b8402f">可能很小</text>
</svg>
</div>
<div class="qac">
<p class="q">平均速度是各段速度的平均值吗？</p>
<p class="a"><b>不是。</b>平均速度 = 总位移 / 总时间。只有各段时间相等时，才恰好等于速度的算术平均。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="平均速度等于总位移除以总时间，不是速度的算术平均">
  <text x="120" y="52" text-anchor="middle" font-size="14" font-weight="700" fill="#6d28d9">v = Δx总 / Δt总</text>
  <text x="120" y="82" text-anchor="middle" font-size="11" fill="#b8402f">≠ (v₁ + v₂) / 2</text>
  <text x="120" y="110" text-anchor="middle" font-size="10.5" fill="#6b7280">时间不同，不能直接平均</text>
</svg>
</div>
<div class="qac">
<p class="q">平均速度的大小等于平均速率吗？</p>
<p class="a"><b>不一定。</b>平均速度用位移，平均速率用路程；只有单向直线运动时，两者大小才相等。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="平均速度用位移，平均速率用路程">
  <path d="M30 100 L120 44 L210 96" fill="none" stroke="#7c3aed" stroke-width="2.2"/>
  <line x1="30" y1="100" x2="210" y2="96" stroke="#2f8a5b" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="120" y="120" text-anchor="middle" font-size="10.5" fill="#1e6640">位移 80 m，路程 120 m</text>
</svg>
</div>
<div class="qac">
<p class="q">瞬时速度为 0，平均速度一定为 0 吗？</p>
<p class="a"><b>不一定。</b>汽车中途停一下，瞬时速度为 0，但整段仍有位移，平均速度不为 0。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="中途停车瞬时速度为零，但全程平均速度不为零">
  <line x1="20" y1="96" x2="220" y2="96" stroke="#cfd4da"/>
  <path d="M30 96 L80 50 L120 50 L170 96" fill="none" stroke="#7c3aed" stroke-width="2.2"/>
  <circle cx="100" cy="50" r="4" fill="#b8402f"/>
  <text x="100" y="38" text-anchor="middle" font-size="10" fill="#b8402f">停一下 v=0</text>
  <text x="120" y="120" text-anchor="middle" font-size="10.5" fill="#6b7280">全程仍有位移</text>
</svg>
</div>
<div class="qac">
<p class="q">速度方向改变、大小不变，速度变了吗？</p>
<p class="a"><b>变了。</b>速度是矢量，方向变了就是速度变了；速率只看大小，可以不变。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="速度方向改变大小不变，速度仍然改变">
  <circle cx="120" cy="66" r="44" fill="none" stroke="#d8ccfb" stroke-width="2"/>
  <line x1="120" y1="22" x2="170" y2="22" stroke="#7c3aed" stroke-width="2.6"/>
  <polygon points="180,22 168,17 168,27" fill="#7c3aed"/>
  <line x1="164" y1="66" x2="164" y2="112" stroke="#7c3aed" stroke-width="2.6"/>
  <polygon points="164,122 159,110 169,110" fill="#7c3aed"/>
  <text x="196" y="26" font-size="10" fill="#6d28d9">v</text>
  <text x="176" y="112" font-size="10" fill="#6d28d9">v</text>
</svg>
</div>
<div class="qac">
<p class="q">匀速直线运动的速度不变，指什么不变？</p>
<p class="a"><b>大小和方向都不变。</b>速度是矢量；只保住大小、改变方向，不是匀速直线运动。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="匀速直线运动速度大小方向都不变">
  <line x1="24" y1="76" x2="216" y2="76" stroke="#5a6472"/>
  <g fill="#7c3aed">
    <circle cx="48" cy="76" r="4"/><circle cx="88" cy="76" r="4"/><circle cx="128" cy="76" r="4"/><circle cx="168" cy="76" r="4"/>
  </g>
  <line x1="48" y1="100" x2="168" y2="100" stroke="#2f8a5b" stroke-width="2.4"/>
  <polygon points="180,100 166,94 166,106" fill="#2f8a5b"/>
  <text x="120" y="122" text-anchor="middle" font-size="10.5" fill="#1e6640">方向不变，间距相等</text>
</svg>
</div>
</div>
<p class="gx-note">这六问的共同解法：先问「这个量用位移还是路程」，再问「它对应一段时间还是一个瞬间」。两问定完，选项基本就排除了。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是考场高频错句，右边是能得分的表述。尤其注意「平均速度 ≠ 平均速率」。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 速度 v = 路程 ÷ 时间。</p>
<p class="er-v">✓ 速度 v = 位移 ÷ 时间；路程 ÷ 时间得到的是平均速率。</p>
<p class="er-w">定义里的分子是位移。拐弯、掉头时，两者会差很多。</p>
</div>
<div class="er">
<p class="er-x">✗ 平均速度 =（v₁ + v₂）÷ 2。</p>
<p class="er-v">✓ 平均速度 = 总位移 ÷ 总时间；只有各段时间相等时，才等于速度的算术平均。</p>
<p class="er-w">时间不同还直接平均，等于把短时间的速度「加权」错了。</p>
</div>
<div class="er">
<p class="er-x">✗ 平均速度的大小就是平均速率。</p>
<p class="er-v">✓ 平均速度大小 = 位移大小 ÷ 时间；平均速率 = 路程 ÷ 时间。</p>
<p class="er-w">只有单向直线运动时两者相等；有返回、拐弯时，平均速率更大。</p>
</div>
<div class="er">
<p class="er-x">✗ 速度不变，就是速率不变。</p>
<p class="er-v">✓ 速度不变要求大小和方向都不变；速率不变只保证大小不变。</p>
<p class="er-w">绕圈时速率可以不变，但速度方向一直在变，所以速度在变。</p>
</div>
<div class="er">
<p class="er-x">✗ 速度是负数，说明物体在减速。</p>
<p class="er-v">✓ 负号只表示速度方向与正方向相反；减速要看速度大小是否在减小。</p>
<p class="er-w">速度从 −2 m/s 变到 −6 m/s，速度大小在增大，是加速。</p>
</div>
<div class="er">
<p class="er-x">✗ 瞬时速度就是「很短时间内的平均速度」。</p>
<p class="er-v">✓ 瞬时速度描述某一时刻（或某一位置）；Δt 很小时的平均速度只是它的近似。</p>
<p class="er-w">Δt 再小也不是 0；瞬时速度是 Δt→0 的极限，不是随便取一小段。</p>
</div>
</div>
</section>

<p class="gx-note" style="border-top:1px solid var(--line);padding-top:14px">下一节：<b>速度变化快慢的描述——加速度</b>。速度变化的「快慢」，为什么不能只看速度变了多少？</p>

<div class="gx-foot">
<p>教材依据：人教版《物理》必修第一册（2019 年版）第一章第 3 节「位置变化快慢的描述——速度」。课文引文按教材表述整理，页码以纸质书为准。</p>
<p>数值口径：互动取 x = 2t²、P 点 t₀ = 2.0 s，瞬时速度 8.00 m/s 由 Δt→0 的极限得到；平均速度 8 + 2Δt 为模型计算结果。
例题中的 100 m、20 m、5 s、2 s 为题目数据；图 2 的 3 km、2/1/3 min 为示意数据，平均速度 30 km/h 由总位移与总时间算出，不是实测。</p>
<p>「Δt→0」是极限思想：Δt 可以越来越小，但不等同于 0；割线在极限位置成为切线。</p>
</div>

  <span class="gx-zoom-tip">双指放大看细节</span>

<script src="../../assets/page.js"></script>
<script src="../../assets/gx.js"></script>
<script src="../../assets/autopilot.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var $ = GX.$;
  var stage = $("gxStage");
  var DT = 2;
  var X0 = 42, X1 = 344, Y0 = 258, Y1 = 34, TMAX = 4.4, XMAX = 40;

  function px(t) { return X0 + t / TMAX * (X1 - X0); }
  function py(x) { return Y0 - x / XMAX * (Y0 - Y1); }

  function calc(dt) {
    var tq = 2 + dt, xq = 2 * tq * tq;
    var avg = (xq - 8) / dt;
    var diff = avg - 8;
    if (dt >= 0.95) return { avg: avg, diff: diff, st: "差得多，只是平均", col: "#b8791f", bg: "#fdf3e0" };
    if (dt >= 0.25) return { avg: avg, diff: diff, st: "越来越接近", col: "#2f6fd0", bg: "#eef5fc" };
    return { avg: avg, diff: diff, st: "几乎重合", col: "#2f8a5b", bg: "#e6f6ee" };
  }

  function setup() {
    var pts = [], t;
    for (t = 0; t <= 4.2001; t += 0.05) pts.push(px(t).toFixed(1) + "," + py(2 * t * t).toFixed(1));
    $("gxCurve").setAttribute("points", pts.join(" "));
    $("gxP").setAttribute("cx", px(2));
    $("gxP").setAttribute("cy", py(8));
    $("gxPlab").setAttribute("x", px(2) - 13);
    $("gxPlab").setAttribute("y", py(8) + 15);
    $("gxTan").setAttribute("x1", px(1.2));
    $("gxTan").setAttribute("y1", py(1.6));
    $("gxTan").setAttribute("x2", px(3.4));
    $("gxTan").setAttribute("y2", py(19.2));
    $("gxChord").setAttribute("x1", px(2));
    $("gxChord").setAttribute("y1", py(8));
  }

  function render() {
    var s = calc(DT), tq = 2 + DT, qx = px(tq), qy = py(2 * tq * tq);
    $("gxQ").setAttribute("cx", qx);
    $("gxQ").setAttribute("cy", qy);
    $("gxChord").setAttribute("x2", qx);
    $("gxChord").setAttribute("y2", qy);
    $("gxQlab").setAttribute("x", qx + (DT < 0.35 ? 8 : 9));
    $("gxQlab").setAttribute("y", qy - 8);

    $("gxVa").textContent = DT.toFixed(1) + " s";
    $("gxVb").textContent = s.avg.toFixed(2) + " m/s";
    $("gxVs").textContent = s.st;
    $("gxVsn").textContent = "瞬时速度 8.00 m/s，差 " + s.diff.toFixed(2);
    $("gxStBox").style.background = s.bg;
    $("gxStBox").style.borderColor = s.col + "44";
    $("gxVs").style.color = s.col;
  }

  var ap = null, dragging = false, moved = false, downX = 0, suppressTap = false;

  function xToDt(clientX) {
    var r = stage.getBoundingClientRect();
    var f = (clientX - r.left) / r.width;
    return Math.max(0.1, Math.min(2, Math.round((0.1 + f * 1.9) * 10) / 10));
  }

  stage.addEventListener("pointerdown", function (ev) {
    dragging = true; moved = false; downX = ev.clientX;
    if (ap) ap.take();
    DT = xToDt(ev.clientX);
    if (ap) ap.setValue(DT, false);
    render();
    try { stage.setPointerCapture(ev.pointerId); } catch (e) {}
  });
  stage.addEventListener("pointermove", function (ev) {
    if (!dragging) return;
    if (Math.abs(ev.clientX - downX) > 4) moved = true;
    DT = xToDt(ev.clientX);
    if (ap) ap.setValue(DT, false);
    render();
  });
  stage.addEventListener("pointerup", function () {
    if (moved) suppressTap = true;
    dragging = false;
  });
  stage.addEventListener("click", function (ev) {
    if (!suppressTap) return;
    suppressTap = false;
    ev.stopImmediatePropagation();
  });

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  setup();
  render();
  ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 2 }, { t: 2, v: 1 }, { t: 4, v: 0.4 }, { t: 6.5, v: 0.4 },
           { t: 8.5, v: 0.1 }, { t: 10.5, v: 0.1 }, { t: 12.5, v: 2 }],
    keys: [2, 1, 0.4, 0.1],
    value: DT, min: 0.1, max: 2, step: 0.1,
    idle: 5000,
    onChange: function (v) { DT = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc, px: px, py: py };
});
</script>
</body>
