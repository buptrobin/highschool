<script type="text/markdown" id="md">
<div class="gx">

<div class="gx-kicker">ELI5-HIGH · 讲给要考试的人</div>
<p class="gx-claim">功不是「有没有用力」，而是<b>力在位移方向上搬走了多少</b>；功率再给这件事加上时间。</p>
<div class="gx-meta">
  <span><i></i>人教版必修第二册 · 第八章第 1 节</span>
  <span><i></i>高一 · 功与功率</span>
  <span><i></i>阅读 15 分钟</span>
  <span><i></i>含 1 个互动模型</span>
</div>
<p class="gx-lede">一个人扛着箱子在水平地面上走 10 m，累得满头汗，物理却说他对箱子<b>不做功</b>——因为支持力竖直向上，
位移水平向前，两者垂直。功只认「力沿位移方向的分量」：<b>W = Fl cosα</b>。
α 是力与位移的夹角，不是力与水平面的夹角，也不是「力大不大」。
功率则问另一件事：这些功是<b>多快</b>做完的，<b>P = W/t</b>，或者 <b>P = Fv cosα</b>。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">三句话：功怎么算、正负怎么判、功率在问什么。</p>

<div class="gx-quote">
<p class="q-t">课本的表述 · 功<span class="q-src">人教版必修第二册 · 第八章第 1 节</span></p>
<p class="q-b">力对物体做的功，等于力的大小、位移的大小、力与位移夹角的余弦这三者的乘积，即 W = Fl cosα。</p>
<p class="q-n">→ α 是<b>力与位移方向</b>的夹角。l 是力的作用点沿力的方向的位移；本章处理恒力做功，物体可以看成质点。
把 F 拆成沿位移的 <b>F cosα</b> 和垂直位移的 <b>F sinα</b>，只有前者进入公式。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本的表述 · 正功与负功<span class="q-src">人教版必修第二册 · 第八章第 1 节</span></p>
<p class="q-b">当 0 ≤ α &lt; 90° 时，cosα &gt; 0，W &gt; 0，力对物体做正功；当 α = 90° 时，W = 0，力对物体不做功；
当 90° &lt; α ≤ 180° 时，cosα &lt; 0，W &lt; 0，力对物体做负功。</p>
<p class="q-n">→ 功是<b>标量</b>，正负不表示方向，只表示这个力是<b>动力</b>还是<b>阻力</b>。
说「摩擦力做负功」，等价于说「物体克服摩擦力做了同样多的正功」；两种说法数值相同、符号相反。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本的表述 · 功率<span class="q-src">人教版必修第二册 · 第八章第 1 节</span></p>
<p class="q-b">功 W 与完成这些功所用时间 t 的比值叫作功率，P = W/t。功率也可以用 P = Fv cosα 表示。
额定功率是指发动机正常工作时输出的最大功率，实际功率可以小于或等于额定功率。</p>
<p class="q-n">→ P = W/t 算的是<b>一段时间内的平均功率</b>。P = Fv cosα 里若 v 取瞬时速度，得到的就是<b>瞬时功率</b>；
若 F 恒定、v 取平均速度，得到的才是平均功率。同一个「P」，口径必须交代清楚。</p>
</div>

<p class="gx-note">这一节真正要练的是<b>三个判断</b>：① α 找对没有；② 正负功判对没有；③ 问的是平均功率还是瞬时功率。
公式只有两条，扣分几乎都扣在这三个判断上。</p>
</section>

<section class="gx-sec" id="c">
<h2><span class="sn">03</span>自己拖一下<span class="bdg bdg-must">核心</span></h2>
<p class="gx-h2s">F = 50 N 拉箱子前进 l = 5 m、用时 t = 2 s；拖夹角 α，看功和功率怎么跟着变。</p>

<figure class="gx-fig">
<div class="fig-cap"><span class="fig-no">互动 1</span><span class="fig-t">夹角 α 一过 90°，功就变号</span><span class="gx-ap" id="gxAp"><i></i><span id="gxApTxt">自动演示中</span></span></div>
<p class="fig-s">W = Fl cosα = 50 × 5 × cosα = <b>250cosα</b> J，P = W/t = <b>125cosα</b> W（t = 2 s）。
α = 0° 时 W = 250 J、P = 125 W；α = 60° 时 W = 125 J、P = 62.5 W；<b>α = 90° 时 W = P = 0</b>；
α = 120° 时 W = −125 J，力开始做负功；α = 180° 时 W = −250 J。
自走会在 <b>α = 90°</b> 停 2.6 秒——那是正功与负功的分界。</p>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己写，再点「下一步」。这题的关键是「先定夹角，再分平均功率和瞬时功率」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 拉力的功与功率<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">用 F = 50 N 的力沿与水平方向成 37° 的方向拉一个箱子，箱子由静止开始沿水平地面做匀加速直线运动，
前进 l = 10 m，用时 t = 5 s，cos37° = 0.8。求：（1）拉力做的功；（2）这段时间内拉力的平均功率；
（3）5 s 末拉力的瞬时功率。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 先把夹角找准</p>
<p class="s-b">位移沿水平方向向右，拉力斜向上、与水平方向成 37°，所以<b>力与位移的夹角 α = 37°</b>。
这一步最容易错：把 α 当成「力与竖直方向的夹角」，就会算出 cos53° = 0.6，整题数值全偏。</p>
<p class="s-k">用到：α 是力与位移方向的夹角，不是力与水平面的夹角。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 代 W = Fl cosα</p>
<p class="s-b">W = 50 × 10 × cos37° = 50 × 10 × 0.8 = <b>400 J</b>。
0° &lt; 37° &lt; 90°，cos37° &gt; 0，所以 W &gt; 0，拉力做正功，它是箱子前进的<b>动力</b>。</p>
<p class="s-k">用到：W = Fl cosα；cos37° = 0.8。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 平均功率看整段时间</p>
<p class="s-b">P̄ = W/t = 400/5 = <b>80 W</b>。这个 80 W 说的是「5 s 内平均每秒做功 80 J」，
不是「每一秒都做 80 J」，也不是「5 s 末的功率」。</p>
<p class="s-k">用到：P = W/t 对应一段时间，得到平均功率。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 匀加速：先求末速度</p>
<p class="s-b">由静止开始做匀加速直线运动，平均速度 v̄ = l/t = 10/5 = 2 m/s，末速度 v = 2v̄ = <b>4 m/s</b>。
（也可由 a = 2l/t² = 0.8 m/s²，v = at = 4 m/s 得到，结果相同。）</p>
<p class="s-k">用到：匀变速直线运动中 v̄ = (v₀ + v)/2；v₀ = 0 时 v = 2v̄。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 瞬时功率代瞬时速度</p>
<p class="s-b">P = Fv cosα = 50 × 4 × 0.8 = <b>160 W</b>。所以同一道题里出现了两个功率：
<b>平均功率 80 W</b>、<b>5 s 末瞬时功率 160 W</b>，它们不是矛盾，而是口径不同。
P = Fv cosα 中代平均速度，得到平均功率；代瞬时速度，才得到瞬时功率。</p>
<p class="s-k">用到：P = Fv cosα 的 v 必须交代是平均速度还是瞬时速度。</p>
</li>
</ol>
<div class="exbar">
  <button id="gxNext" type="button">下一步</button>
  <span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）力与位移的夹角 α = 37°，W = Fl cosα = 50 × 10 × 0.8 = <b>400 J</b>，拉力做正功。<br>
（2）平均功率 P̄ = W/t = 400/5 = <b>80 W</b>。<br>
（3）箱子由静止匀加速，v̄ = l/t = 2 m/s，末速度 v = 2v̄ = 4 m/s，
5 s 末瞬时功率 P = Fv cosα = 50 × 4 × 0.8 = <b>160 W</b>。</p>
</div>
<p class="gx-note">阅卷高频扣分：把 α 取成 53°；第（2）问写成「P = Fv = 50 × 2 = 100 W」（漏 cosα）；
第（3）问直接把 80 W 当成瞬时功率；不说明 v 是平均速度还是瞬时速度。</p>
</div>
</section>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>考你会怎么考</h2>
<p class="gx-h2s">六种问法，核心只有一条：功看投影，功率看时间口径。</p>

<div class="gx-qa">
<div class="qac">
<p class="q">功是标量还是矢量？正负表示方向吗？</p>
<p class="a"><b>功是标量。</b>正负只表示这个力是动力还是阻力，不表示方向。</p>

<div class="qac">
<p class="q">「摩擦力做负功」怎么理解？</p>
<p class="a">摩擦力方向与位移相反，α = 180°，W &lt; 0；也可以说<b>物体克服摩擦力做了同样多的正功</b>。</p>

  <text x="120" y="118" text-anchor="middle" font-size="9" fill="#6b7280">f 与位移反向 → W&lt;0</text>
</svg>
</div>
<div class="qac">
<p class="q">α = 90° 时，力很大，为什么不做功？</p>
<p class="a"><b>cos90° = 0</b>，力在位移方向没有分量。向心力、水平位移中的支持力都属于这种情形。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="力与位移垂直时不做功，cos90度为零">

</svg>
</div>
<div class="qac">
<p class="q">功率大，一定做功多吗？</p>
<p class="a"><b>不一定。</b>P = W/t 只说明做功快慢；W 还取决于时间，t 很小时 P 大而 W 未必大。</p>

<div class="qac">
<p class="q">汽车上坡为什么要换低挡？</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是卷面上真出现过的错句，右边是能得分的表述。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 功直接用 W = Fl 算，不用管夹角。</p>
<p class="er-v">✓ W = Fl cosα，α 是力与位移方向的夹角。</p>
<p class="er-w">力与位移垂直时 cosα = 0，功为零；夹角超过 90°，功为负。</p>
</div>
<div class="er">
<p class="er-x">✗ 负功就是「做了负数的功」，说明能量变成负的。</p>
<p class="er-v">✓ 负功表示该力是阻力，对物体做负功；物体克服它做正功，能量发生转化或转移。</p>
<p class="er-w">功是标量，负号只表示动力/阻力，不表示方向，也不会让能量为负。</p>
</div>
<div class="er">
<p class="er-x">✗ α = 90° 时力很大，所以做了很多功。</p>
<p class="er-v">✓ cos90° = 0，W = 0；力与位移垂直时不做功。</p>
<p class="er-w">进入公式的是 F cosα，不是 F 本身；垂直分量 F sinα 对功没有贡献。</p>
</div>
<div class="er">
<p class="er-x">✗ 功率大就是做功多。</p>
<p class="er-v">✓ P = W/t，功率表示做功的快慢；做功多少还要看时间。</p>
<p class="er-w">t 很小时，功率可以很大而总功并不大；两者不是同一个量。</p>
</div>
<div class="er">
<p class="er-x">✗ P = Fv 里的 v 随便代哪个速度都行。</p>
<p class="er-v">✓ 求瞬时功率代瞬时速度；F 恒定时求平均功率代平均速度；不同向时还要乘 cosα。</p>
<p class="er-w">同一道题里平均功率 80 W、瞬时功率 160 W 可以同时存在，口径必须写清。</p>
</div>
<div class="er">
<p class="er-x">✗ 汽车发动机功率越大，牵引力一定越大。</p>
<p class="er-v">✓ P = Fv：功率一定时，牵引力与速度成反比；同样功率下高速时牵引力反而小。</p>
<p class="er-w">牵引力由「功率」和「速度」共同决定，不能只看功率。</p>
</div>
</div>
</section>

<p class="gx-note" style="border-top:1px solid var(--line);padding-top:14px">下一节把「功」具体到重力：重力做功只与高度差有关，
于是可以引入<b>重力势能</b>，并用 W<sub>G</sub> = −ΔE<sub>p</sub> 把功和能量第一次接起来。</p>

<div class="gx-foot">
<p>教材依据：人教版《物理》必修第二册（2019 年版）第八章第 1 节「功与功率」。课文引文按教材表述整理，页码以纸质书为准。</p>
<p>数值口径：互动取 F = 50 N、l = 5 m、t = 2 s，W = Fl cosα = 250cosα J，P = W/t = 125cosα W，属<b>模型值</b>；
例题取 α = 37°、cos37° = 0.8、l = 10 m、t = 5 s，W = 400 J、平均功率 80 W；匀加速末速度 4 m/s 时瞬时功率 160 W。</p>
<p>本页把「平均功率」与「瞬时功率」分开标注：P = W/t 一律指该段时间内的平均功率；P = Fv cosα 未说明 v 的口径时，不能直接当作瞬时功率。
互动图只演示恒力、直线位移的情形，不涉及变力做功。</p>
</div>

</div>

<div class="gx-zoom" id="gxZoom" hidden>
  <span class="gx-zoom-tip">双指放大看细节</span>
  <button class="gx-zoom-x" type="button" aria-label="关闭">✕</button>
  <div id="gxZoomInner"></div>
</div>

<script src="../../assets/page.js"></script>
<script src="../../assets/gx.js"></script>
<script src="../../assets/autopilot.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var $ = GX.$;
  var stage = $("gxStage");
  var F = 50, L = 5, T = 2;
  var A = 0;

  function calc(a) {
    var rad = a * Math.PI / 180;
    var c = Math.cos(rad), s = Math.sin(rad);
    var W = F * L * c;
    var P = W / T;
    var st, col, bg, sn;
    if (a === 90) {
      st = "不做功"; col = "#5a6472"; bg = "#f4f7f9";
      sn = "α = 90°：cos90° = 0，W = 0，P = 0";
    } else if (a < 90) {
      st = "正功"; col = "#2f8a5b"; bg = "#e6f6ee";
      sn = "α < 90°，力是动力，W > 0";
    } else {
      st = "负功"; col = "#b8402f"; bg = "#fbeae7";
      sn = "α > 90°，力是阻力，W < 0";
    }
    if (a === 180) sn = "α = 180°：力与位移反向，W = −250 J";
    return { W: W, P: P, c: c, s: s, st: st, col: col, bg: bg, sn: sn };
  }

  function arrowHead(tipX, tipY, c, s, size) {
    var d = size || 10, h = 4;
    var bx = tipX - d * c, by = tipY + d * s;
    return tipX + "," + tipY + " " + (bx + h * s) + "," + (by + h * c) + " " + (bx - h * s) + "," + (by - h * c);
  }

  function render() {
    if (A < 0) A = 0; if (A > 180) A = 180;
    var m = calc(A);
    var ox = 115, oy = 200;
    var tipX = ox + 110 * m.c, tipY = oy - 110 * m.s;

    $("gxForce").setAttribute("x2", tipX.toFixed(1));
    $("gxForce").setAttribute("y2", tipY.toFixed(1));
    $("gxForceH").setAttribute("points", arrowHead(tipX, tipY, m.c, m.s, 10));

    var px = ox + 110 * m.c;
    $("gxProj").setAttribute("x2", px.toFixed(1));
    $("gxProjLab").setAttribute("x", ((ox + px) / 2).toFixed(1));
    var showProj = Math.abs(m.c) > 0.03;
    $("gxProj").style.opacity = showProj ? "1" : "0";
    $("gxProjLab").style.opacity = showProj ? "1" : "0";

    var arcEndX = ox + 34 * m.c, arcEndY = oy - 34 * m.s;
    $("gxArc").setAttribute("d", "M " + (ox + 34) + " " + oy + " A 34 34 0 0 0 " + arcEndX.toFixed(1) + " " + arcEndY.toFixed(1));
    $("gxArc").style.opacity = A > 2 ? "1" : "0";
    var half = A / 2 * Math.PI / 180;
    $("gxALab").setAttribute("x", (ox + 46 * Math.cos(half)).toFixed(1));
    $("gxALab").setAttribute("y", (oy - 46 * Math.sin(half) + 3).toFixed(1));
    $("gxALab").style.opacity = A > 2 ? "1" : "0";
    $("gxFLab").setAttribute("x", (ox + 55 * m.c).toFixed(1));
    $("gxFLab").setAttribute("y", (oy - 55 * m.s - 7).toFixed(1));

    $("gxWBig").textContent = (Math.abs(m.W) < 0.5 ? 0 : m.W).toFixed(0) + " J";
    $("gxWBig").setAttribute("fill", m.col);
    $("gxPBig").textContent = (Math.abs(m.P) < 0.5 ? 0 : m.P).toFixed(0) + " W";
    $("gxPBig").setAttribute("fill", m.col);
    $("gxState").textContent = m.st + (A === 90 ? "：W = 0" : (A < 90 ? "：W > 0" : "：W < 0"));
    $("gxState").setAttribute("fill", m.col);
    $("gxAngle").textContent = "α = " + A + "°";

    $("gxFormula").textContent = "W = 50 × 5 × cos" + A + "° = " + (Math.abs(m.W) < 0.5 ? 0 : m.W).toFixed(0) + " J";
    var hint;
    if (A === 0) hint = "α = 0°：力与位移同向，W 最大";
    else if (A < 90) hint = "α < 90°：F cosα 与位移同向，做正功";
    else if (A === 90) hint = "α = 90°：F cosα = 0，不做功";
    else if (A < 180) hint = "α > 90°：F cosα 与位移反向，做负功";
    else hint = "α = 180°：力与位移反向，W = −Fl";
    $("gxHint").textContent = hint;

    $("gxVa").textContent = A + "°";
    $("gxVb").textContent = (Math.abs(m.W) < 0.5 ? 0 : m.W).toFixed(0) + " J";
    $("gxVs").textContent = (Math.abs(m.P) < 0.5 ? 0 : m.P).toFixed(0) + " W";
    $("gxVst").textContent = m.st;
    $("gxVsn").textContent = m.sn;
    $("gxStBox").style.background = m.bg;
    $("gxStBox").style.borderColor = m.col + "44";
    $("gxVst").style.color = m.col;
  }

  var ap = null, dragging = false, moved = false, downX = 0, suppressTap = false;

  function xToA(clientX) {
    var r = stage.getBoundingClientRect();
    var f = (clientX - r.left) / r.width;
    return Math.round(Math.max(0, Math.min(1, f)) * 180);
  }

  stage.addEventListener("pointerdown", function (ev) {
    dragging = true; moved = false; downX = ev.clientX;
    if (ap) ap.take();
    A = xToA(ev.clientX);
    if (ap) ap.setValue(A, false);
    render();
    try { stage.setPointerCapture(ev.pointerId); } catch (e) {}
  });
  stage.addEventListener("pointermove", function (ev) {
    if (!dragging) return;
    if (Math.abs(ev.clientX - downX) > 4) moved = true;
    A = xToA(ev.clientX);
    if (ap) ap.setValue(A, false);
    render();
  });
  stage.addEventListener("pointerup", function () {
    if (moved) suppressTap = true;
    dragging = false;
  });
  stage.addEventListener("click", function (ev) {
    if (!suppressTap) return;
    suppressTap = false;
    ev.stopImmediatePropagation();
  });

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  render();
  ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 0 }, { t: 2.2, v: 60 }, { t: 4.2, v: 90 }, { t: 6.8, v: 90 },
           { t: 8.8, v: 120 }, { t: 11.2, v: 180 }, { t: 12.4, v: 180 }, { t: 14, v: 0 }],
    keys: [0, 60, 90, 120, 180],
    value: A, min: 0, max: 180, step: 1,
    idle: 5000,
    onChange: function (v) { A = Math.round(v); render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__probe = function () {
    return {
      a: $("gxVa").textContent,
      W: $("gxVb").textContent,
      P: $("gxVs").textContent,
      st: $("gxVst").textContent,
      cnt: $("gxCnt").textContent
    };
  };
});
</script>
</body>
