<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">三句话：怎么控制变量、怎么把摩擦力「抹掉」、怎么用图像下结论。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 控制变量<span class="q-src">人教版必修第一册 · 第四章第 2 节</span></p>
<p class="q-b">研究一个物理量与其他几个物理量的关系时，先保持其他物理量不变，只改变其中一个物理量，看这个物理量怎样影响我们要研究的量，这种方法叫作控制变量法。</p>
<p class="q-n">→ 这个实验分两步做：<b>先保持小车质量 m 不变，改变拉力 F，看 a 怎么变</b>；
<b>再保持 F 不变，改变 m，看 a 怎么变</b>。一次只动一个量，结论才归因得清。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 平衡摩擦力<span class="q-src">人教版必修第一册 · 第四章第 2 节</span></p>
<p class="q-b">把木板不带滑轮的一端适当垫高，使小车在不挂槽码时能沿木板匀速下滑，这时小车重力沿木板向下的分力与摩擦力平衡。</p>
<p class="q-n">→ 平衡之后，绳对小车向前的拉力就成了小车所受的<b>合力</b>，a 与 F 的关系才干净。
不垫高，拉力得先「还债」给摩擦力，图线就<b>不过原点</b>。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 用图像处理数据<span class="q-src">人教版必修第一册 · 第四章第 2 节</span></p>
<p class="q-b">以 a 为纵坐标、F 为横坐标作图，如果图线是一条过原点的直线，就说明 a 与 F 成正比。</p>
<p class="q-n">→ 第二步同理：以 a 为纵坐标、<b>1/m</b> 为横坐标作图，图线是一条过原点的直线，
说明 a 与 1/m 成正比，也就是 <b>a 与 m 成反比</b>。为什么不直接画 a–m？因为反比曲线看不出「是不是真的反比」。</p>
</div>

<p class="gx-note">两个前提条件要背下来：<b>① 平衡摩擦力；② 槽码质量 m₀ 远小于小车质量 m（记作 m₀ ≪ m）</b>。
第一条保证「绳的拉力就是合力」，第二条保证「绳的拉力近似等于槽码的重力 m₀g」。两条都不满足，图线就会歪。</p>

<p class="gx-note"><b>记号说明</b>：本页统一把<b>小车的质量记作 m</b>（含车上砝码），
把<b>槽码的质量记作 m₀</b>，重力加速度记作 g，绳的拉力记作 F 或 T。
教材和有些习题会把小车质量写成 M、槽码质量写成 m，两种记号含义完全相同——
读题时先看清哪个字母指小车，再往公式里代。</p>
</section>

<h2><span class="sn">03</span>自己拖一下<span class="bdg bdg-must">核心</span></h2>
<p class="gx-h2s">拉力固定 F = 0.50 N，拖小车质量 m，看点怎么沿着那条过原点的直线跑。</p>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己写，再点「下一步」。关键不是算 a，而是说清「为什么换横坐标」和「斜率是谁」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 数据与图像<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">某同学用图 1 的装置探究加速度与质量的关系，已经平衡好摩擦力，并保证槽码质量远小于小车质量。
保持槽码不变，绳对小车的拉力 F = 0.20 N。小车总质量 m = 0.50 kg 时，由纸带算出 a₁ = 0.40 m/s²。<br>
（1）把小车总质量改为 1.00 kg，求 a₂；（2）若以 a 为纵坐标、1/m 为横坐标作图，图线是什么形状？
斜率等于多少？（3）用（1）的数据验证这个斜率。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 先确认「谁不变、谁在变」</p>
<p class="s-b">这一步研究的是 a 与 m 的关系，所以 <b>F 必须保持不变</b>（题目已给 F = 0.20 N），
只改变小车总质量 m。控制变量法的第一句话永远是「保持××不变」。</p>
<p class="s-k">用到：控制变量法——一次只让一个量变，结论才能归因到它头上。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 用 a = F/m 算出 a₂</p>
<p class="s-b">m 从 0.50 kg 变成 1.00 kg，是原来的 2 倍；F 不变，所以 a 变成原来的一半：
a₂ = F/m = 0.20 / 1.00 = <b>0.20 m/s²</b>。也可以这样验算：0.40 ÷ 2 = 0.20 m/s²。</p>
<p class="s-k">用到：F 一定时 a 与 m 成反比；代入前先把单位统一成 kg、N。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 说明为什么要换成 1/m 作横坐标</p>
<p class="s-b">若以 a 为纵坐标、m 为横坐标，得到的是<b>曲线</b>；曲线只能说明「a 随 m 增大而减小」，
不能证明「a 与 m 成反比」。把 m 换成 1/m 后，关系式变成 <b>a = F·(1/m)</b>，这是正比例函数，
图线必然是<b>过原点的直线</b>——直线才能下「成正比」的结论。</p>
<p class="s-k">用到：图像法处理数据；正比 = 过原点的直线。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 找出斜率并说明它的物理意义</p>
<p class="s-b">由 a = F·(1/m) 可知，直线斜率 k = F = <b>0.20 N</b>。
所以 a–1/m 图的斜率不是「随便一个数」，它<b>就是绳的拉力</b>；F 越大，直线越陡。</p>
<p class="s-k">用到：把函数式与图像对应起来——y = kx 中的 k 就是斜率。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 用两组数据验证，并交代实验条件</p>
<p class="s-b">m = 0.50 kg 时 1/m = 2.0 kg⁻¹，a = 0.40 m/s²，比值 0.40 ÷ 2.0 = 0.20 N；
m = 1.00 kg 时 1/m = 1.0 kg⁻¹，a = 0.20 m/s²，比值 0.20 ÷ 1.0 = 0.20 N。两组比值相同，等于 F，图线过原点。
答题时补一句：以上结论以<b>已平衡摩擦力、且槽码质量远小于小车质量</b>为前提。</p>
<p class="s-k">用到：用比值恒定性验证正比关系；实验结论必须写明成立条件。</p>
</li>
</ol>
<div class="exbar">
  <button id="gxNext" type="button">下一步</button>
  <span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）F 不变，a 与 m 成反比。m 由 0.50 kg 变为 1.00 kg，
a₂ = F/m = 0.20/1.00 = <b>0.20 m/s²</b>。<br>
（2）以 a 为纵坐标、1/m 为横坐标，图线是<b>一条过原点的直线</b>；由 a = F·(1/m) 知斜率 k = F = <b>0.20 N</b>。<br>
（3）m = 0.50 kg 时 1/m = 2.0 kg⁻¹，a/(1/m) = 0.40/2.0 = 0.20 N；
m = 1.00 kg 时 1/m = 1.0 kg⁻¹，a/(1/m) = 0.20/1.0 = 0.20 N。比值恒为 0.20 N，
与斜率相符，说明 <b>a 与 1/m 成正比</b>（即 a 与 m 成反比）。</p>
</div>
<p class="gx-note">扣分点：只写「a 与 m 成反比」而不给图像依据；把斜率说成「1/m」；
忘记写「已平衡摩擦力、槽码质量远小于小车质量」这个前提。</p>
</div>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是实验报告里真出现过的写法，右边是能得分的表述。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 不垫高木板也能做，反正 a 和 F 都成正比。</p>
<p class="er-v">✓ 必须先把木板不带滑轮的一端垫高，使小车不挂槽码时能匀速下滑。</p>
<p class="er-w">摩擦力会占掉一部分拉力，a–F 图线出现正截距，结论就变成「a 与（F − f）成正比」。</p>
</div>
<div class="er">
<p class="er-x">✗ 槽码多重都行，反正绳的拉力就是 m₀g。</p>
<p class="er-v">✓ 只有槽码质量 m₀ 远小于小车质量 m 时，绳的拉力才近似等于 m₀g。</p>
<p class="er-w">m₀ 不小时槽码本身有明显加速度，绳上的拉力会明显小于 m₀g，系统误差变大。</p>
</div>
<div class="er">
<p class="er-x">✗ 直接画 a–m 图，看到曲线下降就说 a 与 m 成反比。</p>
<p class="er-v">✓ 换成 a–1/m 图，图线是过原点的直线，才能说 a 与 1/m 成正比、与 m 成反比。</p>
<p class="er-w">「下降的曲线」既可能是反比，也可能是别的反相关关系，图像本身区分不了。</p>
</div>
<div class="er">
<p class="er-x">✗ a–1/m 图线的斜率是 1/m。</p>
<p class="er-v">✓ 若纵轴是 a、横轴是 1/m，斜率等于拉力 F。</p>
<p class="er-w">先写出函数式 a = F·(1/m)，再对照 y = kx，斜率就是 F，不要凭坐标轴的名字猜。</p>
</div>
<div class="er">
<p class="er-x">✗ 纸带上量出的长度直接代进 a 的公式，不用换算单位。</p>
<p class="er-v">✓ 长度先由 cm 换成 m，时间用 0.02 s 的整数倍，再算 a，单位才是 m/s²。</p>
<p class="er-w">cm 与 m 混用会让 a 差 100 倍，而图像上只表现为「斜率不对」，很难回头查。</p>
</div>
<div class="er">
<p class="er-x">✗ 图线不过原点，一定是打点计时器不准。</p>
<p class="er-v">✓ 先查摩擦力是否平衡到位，再查是否满足 m₀ ≪ m，最后才考虑仪器因素。</p>
<p class="er-w">不过原点最常见的原因是摩擦力没平衡（截距在 F 轴正方向）或垫得过多（截距在负方向）。</p>
</div>
</div>
</section>

<script src="../../assets/autopilot.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var $ = GX.$;
  var stage = $("gxStage");
  var M = 0.4, F = 0.5;
  var X0 = 46, X1 = 340, AX0 = 252, AY0 = 44;
  var INVMAX = 5, AMAX = 2.6;

  function px(inv) { return X0 + inv / INVMAX * (X1 - X0); }
  function py(a) { return AX0 - a / AMAX * (AX0 - AY0); }

  function calc(m) {
    var a = F / m;
    var inv = 1 / m;
    var st, col, bg, sn;
    if (m <= 0.3) {
      st = "点在高处"; col = "#b8402f"; bg = "#fbeae7";
    } else if (m <= 0.6) {
      st = "点在直线中段"; col = "#b8791f"; bg = "#fdf3e0";
    } else {
      st = "点在低处"; col = "#2f8a5b"; bg = "#e6f6ee";
    }
    sn = "a ÷ (1/m) = " + (a / inv).toFixed(2) + " N = F（比值不变）";
    return { a: a, inv: inv, st: st, col: col, bg: bg, sn: sn };
  }

  function render() {
    var s = calc(M);
    var x = px(s.inv), y = py(s.a);
    $("gxPt").setAttribute("cx", x);
    $("gxPt").setAttribute("cy", y);
    $("gxGuideH").setAttribute("x1", X0);
    $("gxGuideH").setAttribute("y1", y);
    $("gxGuideH").setAttribute("x2", x);
    $("gxGuideH").setAttribute("y2", y);
    $("gxGuideV").setAttribute("x1", x);
    $("gxGuideV").setAttribute("y1", AX0);
    $("gxGuideV").setAttribute("x2", x);
    $("gxGuideV").setAttribute("y2", y);

    $("gxVa").textContent = M.toFixed(2) + " kg";
    $("gxVb").textContent = s.a.toFixed(2) + " m/s²";
    $("gxVs").textContent = s.inv.toFixed(2) + " kg⁻¹";
    $("gxVsn").textContent = s.sn;
    $("gxStBox").style.background = s.bg;
    $("gxStBox").style.borderColor = s.col + "44";
    $("gxVs").style.color = s.col;
  }

  var ap = null, dragging = false, moved = false, downX = 0, suppressTap = false;

  function xToM(clientX) {
    var r = stage.getBoundingClientRect();
    var f = (clientX - r.left) / r.width;
    var inv = Math.max(0, Math.min(1, f)) * INVMAX;
    var m = inv < 0.4 ? 1.0 : 1 / inv;
    return Math.max(0.2, Math.min(1, Math.round(m * 50) / 50));
  }

  stage.addEventListener("pointerdown", function (ev) {
    dragging = true; moved = false; downX = ev.clientX;
    if (ap) ap.take();
    M = xToM(ev.clientX);
    if (ap) ap.setValue(M, false);
    render();
    try { stage.setPointerCapture(ev.pointerId); } catch (e) {}
  });
  stage.addEventListener("pointermove", function (ev) {
    if (!dragging) return;
    if (Math.abs(ev.clientX - downX) > 4) moved = true;
    M = xToM(ev.clientX);
    if (ap) ap.setValue(M, false);
    render();
  });
  stage.addEventListener("pointerup", function () {
    if (moved) suppressTap = true;
    dragging = false;
  });
  stage.addEventListener("click", function (ev) {
    if (!suppressTap) return;
    suppressTap = false;
    ev.stopImmediatePropagation();
  });

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  render();
  ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 1.0 }, { t: 1.6, v: 0.8 }, { t: 3.0, v: 0.8 }, { t: 4.6, v: 0.6 },
           { t: 6.0, v: 0.6 }, { t: 7.4, v: 0.4 }, { t: 9.9, v: 0.4 }, { t: 11.4, v: 0.2 },
           { t: 13.0, v: 1.0 }],
    keys: [1.0, 0.8, 0.6, 0.4, 0.2],
    value: M, min: 0.2, max: 1, step: 0.02,
    idle: 5000,
    onChange: function (v) { M = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc };
  window.__probe = function () {
    return {
      m: $("gxVa").textContent,
      a: $("gxVb").textContent,
      inv: $("gxVs").textContent,
      cnt: $("gxCnt").textContent
    };
  };
});
</script>
</body>
