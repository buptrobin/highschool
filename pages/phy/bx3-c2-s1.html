<script type="text/markdown" id="md"><div class="gx"><div class="gx-kicker">ELI5-HIGH · 讲给要考试的人</div><p class="gx-claim">这一节只干一件事：把<b>电场力做的功</b>存成<b>电势能</b>，再用<b>电势</b>摊到每库仑电荷上。</p><nav class="gx-toc"><a href="#a">① 课本怎么说</a><a href="#b">② 拆开看</a><a href="#c">③ 自己拖一下</a><a href="#d">④ 一道题走一遍</a><a href="#e">⑤ 会怎么考</a><a href="#f">⑥ 易错清单</a></nav><section class="gx-sec" id="a"><h2><span class="sn">01</span>课本怎么说</h2><p class="gx-h2s">三条：静电力做功、电势的定义、电场线与等势面。<span class="q-src">人教版必修第三册 · 第十章第1节</span></p><div class="gx-quote"><p class="q-t">课本表述 · 静电力做功</p><p class="q-b">静电力做功与路径无关，只与初末位置有关；静电力做正功，电势能减少，做负功，电势能增加。</p><p class="q-n">→ 人话：只看起点和终点；电场力做正功，电势能就减少。</p></div><div class="gx-quote"><p class="q-t">课本表述 · 电势</p><p class="q-b">电荷在电场中某点的电势能与它的电荷量之比，叫该点的电势 φ = E_p/q；电势是标量，单位 V。</p><p class="q-n">→ 人话：电势是每库仑电荷分到的电势能，与试探电荷无关。</p></div><div class="gx-quote"><p class="q-t">课本表述 · 电场线与等势面</p><p class="q-b">电场线指向电势降低的方向；等势面与电场线垂直，同一等势面上任意两点电势相等。</p><p class="q-n">→ 人话：顺电场线电势降低；在等势面上走，静电力不做功。</p></div></section><section class="gx-sec" id="b"><h2><span class="sn">02</span>拆开看</h2><p class="gx-h2s">三张图：路径无关、正负怎么来、等势面长什么样。</p><figure class="gx-fig"><div class="fig-cap"><span class="fig-no">图 1</span><span class="fig-t">两条路径，静电力做的功一样多</span><span class="bdg bdg-must">必考</span></div><p class="fig-s">从 A 到 B，路径 1 沿直线，路径 2 先向下再向右；起点、终点相同。</p><p class="fig-s">匀强电场中 <b>W = qE·Δx</b>，只数沿场强方向的位移，所以 <b>W₁ = W₂</b>。</p><div class="gx-svgbox"><svg viewBox="0 0 900 280" role="img" aria-label="匀强电场中从A到B的两条路径，静电力做功相同"><text x="450" y="27" text-anchor="middle" font-size="16" font-weight="700" fill="#3a3a35">静电力做功与路径无关：两条路，一样多</text><rect x="30" y="48" width="840" height="170" rx="12" fill="#fbfcfd" stroke="#e6e9ee"/><g stroke="#b8c2cc" stroke-width="1.2"><line x1="65" y1="78" x2="825" y2="78"/><line x1="65" y1="178" x2="825" y2="178"/></g><g fill="#b8c2cc"><polygon points="825,74 839,78 825,82"/><polygon points="825,174 839,178 825,182"/></g><line x1="150" y1="128" x2="710" y2="128" stroke="#7c3aed" stroke-width="3"/><polygon points="710,122 726,128 710,134" fill="#7c3aed"/><polyline points="150,128 150,190 710,190 710,128" fill="none" stroke="#b8791f" stroke-width="2.2" stroke-dasharray="7 5"/><circle cx="150" cy="128" r="7" fill="#fff" stroke="#2f6fd0" stroke-width="2.2"/><circle cx="710" cy="128" r="7" fill="#7c3aed"/><text x="134" y="115" font-size="13" font-weight="700" fill="#2f6fd0">A</text><text x="719" y="115" font-size="13" font-weight="700" fill="#7c3aed">B</text><text x="420" y="114" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6">路径 1</text><text x="420" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#8a5c14">路径 2</text><text x="450" y="252" text-anchor="middle" font-size="12" fill="#3a3a35">W₁ = W₂ = qE·Δx = E_pA − E_pB</text></svg><span class="gx-zoomchip">点击放大</span></div><p class="gx-take">功只认初末位置，路径形状不影响结果；这正是能定义<b>电势能</b>的前提。</p></figure><figure class="gx-fig"><div class="fig-cap"><span class="fig-no">图 2</span><span class="fig-t">电势能的正负：先定零势点</span><span class="bdg bdg-warn">易错</span></div><p class="fig-s">选 B 为零势点，正电荷在 A 点有 <b>E_pA = qφ_A &gt; 0</b>；从 A 到 B 静电力做正功，E_p 降到 0。</p><p class="fig-s">若改选 A 为零势点，则 <b>E_pB = −qEd &lt; 0</b>；零势点不同，E_p 的数值和正负都会变。</p><div class="gx-svgbox"><svg viewBox="0 0 900 300" role="img" aria-label="正电荷沿场强方向移动，电势能从正值降到零"><text x="450" y="27" text-anchor="middle" font-size="16" font-weight="700" fill="#3a3a35">正电荷沿场强方向移动：E_p 从正值降到零</text><rect x="30" y="46" width="840" height="208" rx="12" fill="#fbfcfd" stroke="#e6e9ee"/><line x1="86" y1="232" x2="818" y2="232" stroke="#3a3a35" stroke-width="1.5"/><text x="60" y="62" font-size="11" fill="#5a6472">E_p</text><rect x="150" y="106" width="34" height="126" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/><text x="208" y="154" font-size="10.5" fill="#6d28d9">E_pA=qEd</text><circle cx="167" cy="92" r="7" fill="#fff" stroke="#2f6fd0" stroke-width="2.2"/><text x="155" y="78" font-size="13" font-weight="700" fill="#2f6fd0">A</text><circle cx="650" cy="232" r="7" fill="#2f8a5b"/><text x="638" y="218" font-size="13" font-weight="700" fill="#1e6640">B</text><text x="650" y="254" text-anchor="middle" font-size="10.5" fill="#1e6640">E_pB = 0（零势点）</text><line x1="220" y1="272" x2="590" y2="272" stroke="#b8791f" stroke-width="1.6"/><polygon points="590,267 606,272 590,277" fill="#b8791f"/><text x="405" y="292" text-anchor="middle" font-size="10.5" fill="#8a5c14">W = qEd &gt; 0</text><line x1="300" y1="74" x2="760" y2="74" stroke="#b8c2cc" stroke-width="1.2"/><polygon points="760,70 774,74 760,78" fill="#b8c2cc"/><text x="782" y="78" font-size="10" fill="#7b8490">E</text><text x="520" y="98" font-size="10.5" fill="#5a6472">沿场强方向，E_p 减小</text></svg><span class="gx-zoomchip">点击放大</span></div><p class="gx-take">电势能是<b>标量</b>，正负只表示比零势点多或少，不表示方向。</p></figure><figure class="gx-fig"><div class="fig-cap"><span class="fig-no">图 3</span><span class="fig-t">等势面：电场线垂直穿过</span><span class="bdg bdg-diff">辨析</span></div><p class="fig-s">点电荷的等势面是<b>同心球面</b>（图中画截面圆）；匀强电场的等势面是一组<b>平行平面</b>。</p><p class="fig-s">电场线从高电势指向低电势，并且<b>垂直</b>于等势面。</p><div class="gx-svgbox"><svg viewBox="0 0 900 300" role="img" aria-label="点电荷的同心球面与匀强电场的平行等势面，电场线垂直等势面"><text x="450" y="27" text-anchor="middle" font-size="16" font-weight="700" fill="#3a3a35">等势面：同一面上任意两点 φ 相等</text><rect x="30" y="50" width="390" height="220" rx="12" fill="#fbfcfd" stroke="#e6e9ee"/><text x="225" y="75" text-anchor="middle" font-size="12" font-weight="700" fill="#5a6472">点电荷：同心球面</text><circle cx="225" cy="166" r="20" fill="#fdf3e0" stroke="#b8791f" stroke-width="1.8"/><text x="225" y="171" text-anchor="middle" font-size="12" fill="#8a5c14">+Q</text><g fill="none" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="5 4"><circle cx="225" cy="166" r="48"/><circle cx="225" cy="166" r="80"/><circle cx="225" cy="166" r="112"/></g><g stroke="#2f6fd0" stroke-width="1.2"><line x1="225" y1="166" x2="225" y2="50"/><line x1="225" y1="166" x2="331" y2="166"/><line x1="225" y1="166" x2="225" y2="282"/><line x1="225" y1="166" x2="119" y2="166"/></g><g fill="#2f6fd0"><polygon points="221,52 225,40 229,52"/><polygon points="329,162 341,166 329,170"/><polygon points="221,280 225,292 229,280"/><polygon points="121,162 109,166 121,170"/></g><rect x="450" y="50" width="420" height="220" rx="12" fill="#fbfcfd" stroke="#e6e9ee"/><text x="660" y="75" text-anchor="middle" font-size="12" font-weight="700" fill="#5a6472">匀强电场：平行平面</text><g stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="5 4"><line x1="520" y1="98" x2="520" y2="250"/><line x1="605" y1="98" x2="605" y2="250"/><line x1="690" y1="98" x2="690" y2="250"/><line x1="775" y1="98" x2="775" y2="250"/></g><g stroke="#2f6fd0" stroke-width="1.2"><line x1="485" y1="128" x2="820" y2="128"/><line x1="485" y1="174" x2="820" y2="174"/><line x1="485" y1="220" x2="820" y2="220"/></g><g fill="#2f6fd0"><polygon points="820,124 834,128 820,132"/><polygon points="820,170 834,174 820,178"/><polygon points="820,216 834,220 820,224"/></g><text x="838" y="178" font-size="11" fill="#2f6fd0">E</text></svg><span class="gx-zoomchip">点击放大</span></div><p class="gx-take">沿等势面移动电荷，静电力不做功；电场线越密，等势面也越密。</p></figure></section><section class="gx-sec" id="c"><h2><span class="sn">03</span>自己拖一下<span class="bdg bdg-must">核心</span></h2><p class="gx-h2s">匀强电场 E = 1000 V/m，正电荷 q = 1×10⁻⁶ C 从 A 沿场强方向移动 d。</p><figure class="gx-fig"><div class="fig-cap"><span class="fig-no">互动 1</span><span class="fig-t">d 变，W 和 φ 一起变</span><span class="gx-ap" id="gxAp"><i></i><span id="gxApTxt">自动演示中</span></span></div><p class="fig-s">A 点取 φ_A = 0，则 <b>W = qEd</b>、<b>φ = Ed</b>、<b>ΔE_p = −W</b>。</p><div class="gx-board"><svg id="gxStage" class="gx-graph" viewBox="0 0 360 260" tabindex="0" role="application" aria-label="匀强电场互动：改变沿场强方向的距离d，观察静电力做功和电势"><text x="180" y="17" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3a3a35">W = qEd，φ_B = Ed</text><text x="180" y="33" text-anchor="middle" font-size="8.5" fill="#6b7280">E = 1000 V/m，q = +1×10⁻⁶ C</text><line x1="48" y1="55" x2="48" y2="180" stroke="#8e97a4" stroke-width="2.2"/><line x1="312" y1="55" x2="312" y2="180" stroke="#8e97a4" stroke-width="2.2"/><g stroke="#b8c2cc" stroke-width="1.1"><line x1="52" y1="75" x2="302" y2="75"/><line x1="52" y1="120" x2="302" y2="120"/><line x1="52" y1="165" x2="302" y2="165"/></g><g fill="#b8c2cc"><polygon points="302,71 314,75 302,79"/><polygon points="302,116 314,120 302,124"/><polygon points="302,161 314,165 302,169"/></g><text x="320" y="124" font-size="9" fill="#7b8490">E</text><circle cx="86" cy="120" r="5" fill="#fff" stroke="#2f6fd0" stroke-width="1.8"/><text x="77" y="108" font-size="9" font-weight="700" fill="#2f6fd0">A</text><circle id="gxB" cx="176" cy="120" r="6" fill="#7c3aed"/><text id="gxBLab" x="188" y="116" font-size="8.5" font-weight="700" fill="#6d28d9">B +q</text><line id="gxDist" x1="86" y1="144" x2="176" y2="144" stroke="#b8791f" stroke-width="1.4"/><line x1="86" y1="140" x2="86" y2="148" stroke="#b8791f" stroke-width="1.4"/><line id="gxDistEnd" x1="176" y1="140" x2="176" y2="148" stroke="#b8791f" stroke-width="1.4"/><text id="gxD" x="131" y="160" text-anchor="middle" font-size="8.5" font-weight="700" fill="#8a5c14">d = 0.50 m</text><text id="gxHint" x="180" y="197" text-anchor="middle" font-size="8.5" fill="#8a5c14">沿场强方向，电势降低</text><text x="180" y="220" text-anchor="middle" font-size="8" fill="#6b7280">d = 0.50 m 是关键帧，会停 2.5 s</text></svg><div class="bar"><span class="lb">移动距离 d</span><input type="range" id="gxSl" min="0" max="1" step="0.01" value="0" aria-label="沿场强方向移动的距离d，单位米"></div></div><div class="stats"><div class="st"><div class="k">① 距离 d</div><div class="v" id="gxVa">0.00 m</div><div class="s">A</div></div><div class="st"><div class="k">② 静电力做功 W</div><div class="v" id="gxVb">0 J</div><div class="s">W = qEd</div></div><div class="st"><div class="k">③ B 点电势 φ</div><div class="v" id="gxVc">0 V</div><div class="s">沿场强方向，电势降低</div></div></div><p class="gx-take">停在 d = 0.50 m：W = 5.00×10⁻⁴ J、φ_B = 500 V，<b>而 ΔE_p 是负的</b>。</p></figure></section><section class="gx-sec" id="d"><h2><span class="sn">04</span>一道题走一遍</h2><p class="gx-h2s">先自己写，再点「下一步」。这题考「沿场强方向移动时，W、ΔEp、U 怎么算」。</p><div class="gx-ex"><p class="ex-t">例题 · 匀强电场中的功与电势差<span class="bdg bdg-must">必考</span></p><p class="ex-q">匀强电场 E = 500 V/m，正电荷 q = 2×10⁻⁶ C 沿场强方向从 A 点移动到 B 点，移动距离 d = 0.4 m。求静电力做的功 W、电势能变化量 ΔE_p，以及 A、B 两点间的电势差 U_AB。</p><ol class="steps" id="gxSteps"><li class="step"><p class="s-h">第 1 步 · 判断做功正负</p><p class="s-b">正电荷受到的静电力方向与场强方向相同，位移也沿场强方向，所以静电力做<b>正功</b>。</p></li><li class="step" hidden><p class="s-h">第 2 步 · 算功 W</p><p class="s-b"><b>W = qEd</b> = 2×10⁻⁶ × 500 × 0.4 = <b>4×10⁻⁴ J</b>。</p></li><li class="step" hidden><p class="s-h">第 3 步 · 算电势能变化</p><p class="s-b">静电力做正功，电势能减少：<b>ΔE_p = −W = −4×10⁻⁴ J</b>。</p></li><li class="step" hidden><p class="s-h">第 4 步 · 算电势差</p><p class="s-b"><b>U_AB = Ed</b> = 500 × 0.4 = <b>200 V</b>；沿场强方向电势降低，所以 φ_A − φ_B = 200 V。</p></li><li class="step" hidden><p class="s-h">第 5 步 · 换定义式校验</p><p class="s-b">U_AB = W/q = 4×10⁻⁴ / (2×10⁻⁶) = <b>200 V</b>。</p></li></ol><div class="exbar"><button id="gxNext" type="button">下一步</button><span class="cnt" id="gxCnt">1 / 5</span></div><div class="ans" id="gxAns" hidden><p class="ans-t">标准答案（可抄进答题卡）</p><p class="ans-b">静电力做正功：W = qEd = <b>4×10⁻⁴ J</b>；电势能减少：ΔE_p = −W = <b>−4×10⁻⁴ J</b>；A、B 间电势差 U_AB = Ed = <b>200 V</b>。</p></div></div></section><section class="gx-sec" id="e"><h2><span class="sn">05</span>考你会怎么考</h2><p class="gx-h2s">六种问法，一半在问「正负号和零势点」。</p><div class="gx-qa"><div class="qac"><p class="q">电势能有正负，说明它是矢量吗？</p><p class="a"><b>不是。</b>电势能是标量，正负只表示比零势点多还是少。</p><svg viewBox="0 0 240 132" role="img" aria-label="电势能是标量，正负表示相对零势点的高低"><line x1="24" y1="66" x2="216" y2="66" stroke="#3a3a35" stroke-width="1.5"/><line x1="120" y1="18" x2="120" y2="114" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4 3"/><text x="120" y="16" text-anchor="middle" font-size="9" fill="#6d28d9">0</text><circle cx="72" cy="66" r="6" fill="#b8402f"/><text x="48" y="88" font-size="9" fill="#b8402f">负</text><circle cx="170" cy="66" r="6" fill="#2f8a5b"/><text x="182" y="88" font-size="9" fill="#1e6640">正</text></svg></div><div class="qac"><p class="q">零势点选在哪里有规定吗？</p><p class="a"><b>没有。</b>可任选，常选地面或无穷远；换零点，E_p 整体平移。</p><svg viewBox="0 0 240 132" role="img" aria-label="电势零点可以任选，电势能整体平移"><line x1="36" y1="26" x2="36" y2="106" stroke="#3a3a35" stroke-width="1.4"/><line x1="36" y1="106" x2="214" y2="106" stroke="#3a3a35" stroke-width="1.4"/><line x1="36" y1="66" x2="214" y2="66" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4 3"/><circle cx="98" cy="66" r="5" fill="#7c3aed"/><circle cx="164" cy="66" r="5" fill="#7c3aed"/><text x="140" y="84" font-size="9" fill="#6d28d9">零点可平移</text></svg></div><div class="qac"><p class="q">W 和 ΔE_p 是什么关系？</p><p class="a"><b>W = −ΔE_p。</b>静电力做正功，电势能减少，两者符号相反。</p><svg viewBox="0 0 240 132" role="img" aria-label="静电力做功等于电势能变化量的相反数"><rect x="28" y="44" width="72" height="34" rx="6" fill="#e6f6ee" stroke="#2f8a5b"/><text x="64" y="65" text-anchor="middle" font-size="10" fill="#1e6640">W &gt; 0</text><rect x="140" y="44" width="72" height="34" rx="6" fill="#fbeae7" stroke="#b8402f"/><text x="176" y="65" text-anchor="middle" font-size="10" fill="#8f3226">ΔE_p &lt; 0</text></svg></div><div class="qac"><p class="q">沿电场线方向，电势怎么变？</p><p class="a"><b>降低。</b>电场线指向电势降低的方向，与电荷正负无关。</p><svg viewBox="0 0 240 132" role="img" aria-label="沿电场线方向电势降低"><line x1="30" y1="64" x2="206" y2="64" stroke="#2f6fd0" stroke-width="1.6"/><polygon points="206,59 220,64 206,69" fill="#2f6fd0"/><text x="42" y="46" font-size="10" fill="#2f6fd0">φ 高</text><text x="178" y="46" font-size="10" fill="#2f6fd0">φ 低</text></svg></div><div class="qac"><p class="q">等势面与电场线是什么关系？</p><p class="a"><b>垂直。</b>同一等势面上任意两点 φ 相等，移动电荷静电力不做功。</p><svg viewBox="0 0 240 132" role="img" aria-label="等势面与电场线垂直"><g stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4 3"><line x1="66" y1="24" x2="66" y2="108"/><line x1="120" y1="24" x2="120" y2="108"/><line x1="174" y1="24" x2="174" y2="108"/></g><line x1="28" y1="66" x2="212" y2="66" stroke="#2f6fd0" stroke-width="1.6"/><polygon points="212,61 226,66 212,71" fill="#2f6fd0"/></svg></div><div class="qac"><p class="q">静电力做负功，电势能怎么变？</p><p class="a"><b>增加。</b>W &lt; 0，ΔE_p = −W &gt; 0，电势能变大。</p><svg viewBox="0 0 240 132" role="img" aria-label="静电力做负功时电势能增加"><line x1="34" y1="104" x2="206" y2="104" stroke="#3a3a35" stroke-width="1.4"/><line x1="34" y1="104" x2="34" y2="24" stroke="#3a3a35" stroke-width="1.4"/><line x1="50" y1="86" x2="150" y2="42" stroke="#b8402f" stroke-width="2.4"/><circle cx="50" cy="86" r="4" fill="#b8402f"/><circle cx="150" cy="42" r="4" fill="#b8402f"/><text x="166" y="40" font-size="9" fill="#8f3226">E_p 增大</text></svg></div></div></section><section class="gx-sec" id="f"><h2><span class="sn">06</span>易错清单</h2><p class="gx-h2s">左边是错句，右边是能得分的表述。</p><div class="gx-errs"><div class="er"><p class="er-x">✗ 电势能是矢量，正负表示方向。</p><p class="er-v">✓ 电势能是<b>标量</b>，正负只表示相对零势点的高低。</p><p class="er-w">只有大小和正负、没有方向，才是标量。</p></div><div class="er"><p class="er-x">✗ 电势零点必须选在无穷远。</p><p class="er-v">✓ 电势零点<b>可以任选</b>，常选地面或无穷远。</p><p class="er-w">零点变了，各点电势整体平移，差值不变。</p></div><div class="er"><p class="er-x">✗ 静电力做正功，W = ΔE_p。</p><p class="er-v">✓ <b>W = −ΔE_p</b>，做正功时 ΔE_p 为负。</p><p class="er-w">功是过程量，电势能变化是末减初，符号容易反。</p></div><div class="er"><p class="er-x">✗ 沿电场线方向，电势升高。</p><p class="er-v">✓ 沿电场线方向，电势<b>降低</b>。</p><p class="er-w">电场线指向电势降低的方向。</p></div><div class="er"><p class="er-x">✗ 等势面与电场线平行。</p><p class="er-v">✓ 等势面与电场线<b>垂直</b>。</p><p class="er-w">沿等势面移动电荷不做功，静电力必须垂直于等势面。</p></div><div class="er"><p class="er-x">✗ 电势能大的地方，电势一定高。</p><p class="er-v">✓ 由 φ = E_p/q 判断，还要看<b>电荷的正负</b>。</p><p class="er-w">负电荷在低电势处反而可能有更大的电势能。</p></div></div></section><div class="gx-foot"><p>人教版《物理》必修第三册（2019年版）第十章第1节</p></div></div><div class="gx-zoom" id="gxZoom" hidden><span class="gx-zoom-tip">双指放大看细节</span><button class="gx-zoom-x" type="button" aria-label="关闭">✕</button><div id="gxZoomInner"></div></div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  var $ = GX.$, E = 1000, Q = 1e-6, D = 0;
  function fmtW(w) {
    if (Math.abs(w) < 5e-7) return "0 J";
    if (Math.abs(w) >= 1e-3) return (w * 1e3).toFixed(2) + "×10⁻³ J";
    return (w * 1e4).toFixed(2) + "×10⁻⁴ J";
  }
  function render() {
    var W = Q * E * D, phi = E * D, bx = 86 + D * 180;
    $("gxB").setAttribute("cx", bx.toFixed(1));
    $("gxBLab").setAttribute("x", Math.min(300, bx + 12).toFixed(1));
    $("gxDist").setAttribute("x2", bx.toFixed(1));
    $("gxDistEnd").setAttribute("x1", bx.toFixed(1));
    $("gxDistEnd").setAttribute("x2", bx.toFixed(1));
    $("gxD").setAttribute("x", ((86 + bx) / 2).toFixed(1));
    $("gxD").textContent = "d = " + D.toFixed(2) + " m";
    $("gxVa").textContent = D.toFixed(2) + " m";
    $("gxVb").textContent = fmtW(W);
    $("gxVc").textContent = Math.round(phi) + " V";
    $("gxHint").textContent = Math.abs(D - 0.5) < 0.015 ? "d = 0.50 m：关键帧，停 2.5 s"
      : (D < 0.015 ? "d = 0：电荷还在 A 点" : (D > 0.985 ? "d = 1.00 m：走到最右端" : "沿场强方向，电势降低"));
  }
  var badge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!badge) return;
    badge.classList.toggle("is-auto", m === "auto");
    badge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }
  render();
  var ap = AutoPilot.create({
    mount: $("gxStage"), follow: $("gxSl"),
    loop: [{ t: 0, v: 0 }, { t: 1.2, v: 0 }, { t: 2.6, v: 0.25 }, { t: 3.6, v: 0.25 },
           { t: 5.0, v: 0.5 }, { t: 7.5, v: 0.5 }, { t: 8.9, v: 1.0 }, { t: 10.2, v: 1.0 },
           { t: 11.6, v: 0 }, { t: 12.8, v: 0 }],
    keys: [0, 0.25, 0.5, 1.0],
    value: D, min: 0, max: 1, step: 0.01, idle: 5000,
    onChange: function (v) { D = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
});
</script>
