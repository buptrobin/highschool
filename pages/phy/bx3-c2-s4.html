<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">三条：什么是电容器、C 怎么定义、平行板的 C 由什么决定。</p>

<div class="gx-quote">
<p class="q-t">课本表述 · 电容器<span class="q-src">人教版必修第三册 · 第十章第4节</span></p>
<p class="q-b">电容器是储存电荷的装置。两个彼此绝缘又相距很近的导体，组成一个电容器。</p>
<p class="q-n">→ 人话：两块不接触的金属板就能存电荷。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本表述 · 电容<span class="q-src">人教版必修第三册 · 第十章第4节</span></p>
<p class="q-b">电容器所带电荷量 Q 与两极板间电势差 U 的比值，叫作电容器的电容：C = Q/U。单位是法拉，符号 F，1 F = 1 C/V。</p>
<p class="q-n">→ 人话：C 量的是「每伏能装多少库仑」。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本表述 · 平行板电容器<span class="q-src">人教版必修第三册 · 第十章第4节</span></p>
<p class="q-b">平行板电容器的电容 C = εS/(4πkd)。两极板间距离 d 越大，电容越小；正对面积 S 越大，电容越大。</p>
<p class="q-n">→ 人话：板越近、相对面积越大，C 越大。</p>
</div>

<p class="gx-note">真空 ε₀ = 8.85×10⁻¹² F/m；忽略边缘效应。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己写，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 电容、电荷量与板间距<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">一个电容器的电容 C = 100 pF，接在 U = 10 V 的电源上。求：(1) 所带电荷量 Q；(2) 电压增到 20 V 时的 Q；(3) 若把板间距 d 加倍，C 和 Q 各怎样变？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 先认电容</p>
<p class="s-b">C = 100 pF = 100×10⁻¹² F = <b>1×10⁻¹⁰ F</b>。C 由电容器本身决定。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 用 Q = CU 求电荷量</p>
<p class="s-b">Q = CU = 1×10⁻¹⁰ × 10 = <b>1×10⁻⁹ C</b>。单位先统一成 F 和 V。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · U 变了，C 不变</p>
<p class="s-b">电压增到 20 V，电容仍是 1×10⁻¹⁰ F：Q′ = CU′ = <b>2×10⁻⁹ C</b>。</p>
<p class="s-k">用到：C 与 U 无关，Q 与 U 成正比。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · d 加倍，C 减半</p>
<p class="s-b">C ∝ 1/d，d 加倍则 C′ = 50 pF。U 仍为 10 V，Q′ = C′U = 5×10⁻¹⁰ C，<b>也减半</b>。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 写成能得分的句子</p>
<p class="s-b">「C 由电容器本身决定，与 Q、U 无关；电压变化只改变 Q。d 加倍使 C 减半，U 不变时 Q 也减半。」</p>
<p class="s-k">用到：C 的决定式与 Q = CU 的分工。</p>
</li>
</ol>
<div class="exbar">
  <button id="gxNext" type="button">下一步</button>
  <span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">(1) Q = CU = 1×10⁻¹⁰ × 10 = <b>1×10⁻⁹ C</b>。<br>
(2) C 不变，Q′ = CU′ = 1×10⁻¹⁰ × 20 = <b>2×10⁻⁹ C</b>。<br>
(3) C ∝ 1/d，d 加倍则 <b>C 减半</b>；U 不变，Q 也随之 <b>减半</b>。</p>
</div>
<p class="gx-note">扣分点：把「C 与 U 成反比」当结论；d 加倍只改 C 忘了 Q；pF 没换成 F。</p>
</div>
</section>

<div class="gx-qa">
<div class="qac">
<p class="q">C 与 Q、U 有关吗？</p>
<p class="a"><b>无关。</b>C 由本身决定，Q = CU 只用来算 Q。</p>

</svg>
</div>
<div class="qac">
<p class="q">Q = CU 怎么用？</p>
<p class="a"><b>先定 C，再乘 U。</b>同一个 C 下，Q 与 U 成正比。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="用Q等于CU计算电荷量，电荷量与电压成正比">
  <line x1="24" y1="104" x2="208" y2="104" stroke="#8e97a4" stroke-width="1.3"/>
  <line x1="24" y1="104" x2="24" y2="26" stroke="#8e97a4" stroke-width="1.3"/>
  <line x1="24" y1="104" x2="176" y2="40" stroke="#7c3aed" stroke-width="2"/>
  <text x="112" y="58" font-size="11" font-weight="700" fill="#6d28d9">Q = CU</text>
  <text x="190" y="112" font-size="9" fill="#5a6472">U</text>
  <text x="10" y="28" font-size="9" fill="#5a6472">Q</text>
</svg>
</div>
<div class="qac">
<p class="q">d 变大，C 怎么变？</p>
<p class="a"><b>变小。</b>C = εS/(4πkd)，d 在分母上。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="板间距越大电容越小">
  <line x1="26" y1="34" x2="82" y2="34" stroke="#2f6fd0" stroke-width="6"/>
  <line x1="26" y1="56" x2="82" y2="56" stroke="#2f6fd0" stroke-width="6"/>
  <text x="54" y="78" text-anchor="middle" font-size="8.5" fill="#5a6472">d 小 · C 大</text>
  <line x1="132" y1="30" x2="188" y2="30" stroke="#2f6fd0" stroke-width="6"/>
  <line x1="132" y1="98" x2="188" y2="98" stroke="#2f6fd0" stroke-width="6"/>
  <text x="160" y="120" text-anchor="middle" font-size="8.5" fill="#8a5c14">d 大 · C 小</text>
</svg>
</div>
<div class="qac">
<p class="q">击穿电压是什么？</p>
<p class="a"><b>板间电场过强</b>，电介质被击穿，电容器损坏。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="电压过高时板间电介质被击穿">
  <line x1="40" y1="38" x2="200" y2="38" stroke="#2f6fd0" stroke-width="6"/>
  <line x1="40" y1="94" x2="200" y2="94" stroke="#2f6fd0" stroke-width="6"/>
  <polyline points="96,46 110,62 94,74 118,90" fill="none" stroke="#b8402f" stroke-width="2"/>
  <text x="120" y="120" text-anchor="middle" font-size="9" fill="#b8402f">U 超过击穿电压 → 损坏</text>
</svg>
</div>
<div class="qac">
<p class="q">电容器储能怎么算？</p>
<p class="a"><b>E = ½CU²。</b>电压翻倍，储能变 4 倍。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="电容器储能等于二分之一CU平方">
  <line x1="30" y1="46" x2="86" y2="46" stroke="#2f6fd0" stroke-width="6"/>
  <line x1="30" y1="86" x2="86" y2="86" stroke="#2f6fd0" stroke-width="6"/>
  <text x="108" y="60" font-size="12" font-weight="700" fill="#6d28d9">E = ½CU²</text>
  <text x="108" y="80" font-size="9" fill="#5a6472">C = 100 pF，U = 10 V</text>
  <text x="108" y="98" font-size="9" fill="#1e6640">E = 5×10⁻⁹ J</text>
</svg>
</div>
<div class="qac">
<p class="q">充放电时电流方向？</p>
<p class="a"><b>充电</b>电流流向正极板；<b>放电</b>反过来，稳定后 I = 0。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="充电和放电时电流方向相反">
  <line x1="108" y1="40" x2="108" y2="88" stroke="#2f6fd0" stroke-width="3"/>
  <line x1="128" y1="40" x2="128" y2="88" stroke="#2f6fd0" stroke-width="3"/>
  <text x="66" y="52" text-anchor="middle" font-size="9" fill="#b8402f">充电 I →</text>
  <text x="174" y="76" text-anchor="middle" font-size="9" fill="#1e6640">← 放电 I</text>
  <text x="120" y="114" text-anchor="middle" font-size="8.5" fill="#5a6472">稳定后 I = 0：隔直流</text>
</svg>
</div>
</div>
<p class="gx-note">六问归成一条：<b>先问「谁决定 C」，再问「谁跟着变」</b>。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是错句，右边是能得分的表述。</p>
<div class="gx-errs">
<div class="er">
<p class="er-x">✗ C 与 Q 成正比，电荷越多电容越大。</p>
<p class="er-v">✓ C 由电容器本身决定，与 Q、U 无关。</p>
<p class="er-w">Q 与 U 同比例增大，比值不变。</p>
</div>
<div class="er">
<p class="er-x">✗ C 与 U 成反比，电压越高电容越小。</p>
<p class="er-v">✓ C = Q/U 是定义式，不是决定式。</p>
<p class="er-w">决定 C 的是 S、d 和电介质。</p>
</div>
<div class="er">
<p class="er-x">✗ 板间距 d 越大，C 越大。</p>
<p class="er-v">✓ d 越大，C <b>越小</b>（C ∝ 1/d）。</p>
<p class="er-w">d 在分母上。</p>
</div>
<div class="er">
<p class="er-x">✗ 正对面积 S 越大，C 越小。</p>
<p class="er-v">✓ S 越大，C <b>越大</b>（C ∝ S）。</p>
<p class="er-w">S 在分子上。</p>
</div>
<div class="er">
<p class="er-x">✗ 电容器能让直流电通过。</p>
<p class="er-v">✓ 电容器<b>隔直流、通交流</b>。</p>
<p class="er-w">稳定后极板间没有电流，交流则反复充放电。</p>
</div>
<div class="er">
<p class="er-x">✗ 电容的单位是 V（伏特）。</p>
<p class="er-v">✓ 电容的单位是 <b>F（法拉）</b>，1 F = 1 C/V。</p>
<p class="er-w">比值才是 C，不是电压。</p>
</div>
</div>
</section>

<script>
document.addEventListener("DOMContentLoaded", function () {
  var $ = GX.$, EPS = 8.85e-12, S = 0.01, U = 10, D = 2;
  function fC(v) { return v >= 100 ? v.toFixed(0) : v.toFixed(1); }
  function fQ(v) { return v >= 1 ? v.toFixed(2) : v.toFixed(3); }

  function render(mm) {
    var cp = EPS * S * 1e15 / Math.max(0.5, Math.min(5, mm)), qn = cp * U / 1000;
    var gap = 20 + (mm - 0.5) / 4.5 * 100;
    var topY = 150 - gap / 2 - 12, botY = 150 + gap / 2;
    var topIn = topY + 12, mid = (topIn + botY) / 2;

    $("gxTop").setAttribute("y", topY.toFixed(1));
    $("gxBot").setAttribute("y", botY.toFixed(1));
    $("gxTopQ").setAttribute("y", (topY + 10).toFixed(1));
    $("gxBotQ").setAttribute("y", (botY + 11).toFixed(1));
    for (var i = 1; i <= 4; i++) {
      $("gxL" + i).setAttribute("y1", topIn.toFixed(1));
      $("gxL" + i).setAttribute("y2", botY.toFixed(1));
    }
    $("gxD").setAttribute("y1", topIn.toFixed(1));
    $("gxD").setAttribute("y2", botY.toFixed(1));
    $("gxDLab").setAttribute("y", (mid + 3).toFixed(1));
    $("gxDT").setAttribute("d", "M294 " + topIn.toFixed(1) + " H306 M294 " + botY.toFixed(1) + " H306");

    $("gxFormula").textContent = "C = ε₀S/d = " + fC(cp) + " pF，Q = CU = " + fQ(qn) + " nC";
    $("gxHint").textContent = mm > 3 ? "d 大：C 小，Q 小" : (mm < 1 ? "d 小：C 大，Q 大" : "d 增大 → C 减小，Q 也减小");
    $("gxVa").textContent = mm.toFixed(1) + " mm";
    $("gxVb").textContent = fC(cp) + " pF";
    $("gxVc").textContent = fQ(qn) + " nC";
  }

  var badge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    badge.classList.toggle("is-auto", m === "auto");
    badge.classList.toggle("is-manual", m !== "auto");
    apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  $("gxSl").addEventListener("input", function () { D = parseFloat(this.value); render(D); });

  render(D);
  var ap = AutoPilot.create({
    mount: $("gxStage"), follow: $("gxSl"),
    loop: [{ t: 0, v: 5 }, { t: 1.6, v: 5 }, { t: 3.4, v: 3 }, { t: 4.4, v: 3 },
           { t: 6.4, v: 1 }, { t: 8.9, v: 1 }, { t: 10.6, v: 0.5 }, { t: 11.8, v: 0.5 },
           { t: 13.6, v: 5 }],
    keys: [5, 3, 1, 0.5],
    value: D, min: 0.5, max: 5, step: 0.1, idle: 5000,
    onChange: function (v) { D = v; render(v); },
    onMode: setMode
  });
  window.__ap = ap;
});
</script>
