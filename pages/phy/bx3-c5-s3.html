<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本原话，拆成三句</h2>
<div class="q-src">人教版必修第三册 · 第十三章第3节</div>

<div class="q">
<p class="q-t">“只要穿过闭合电路的磁通量发生变化，闭合电路中就有感应电流；这就是电磁感应现象。”</p>
<p class="q-b">三个关键词缺一不可：<b>闭合电路</b>、<b>磁通量</b>、<b>发生变化</b>。磁通量再大，只要不变就没有电流；电路断开，变得再快也只有电动势。</p>
</div>

<div class="q">
<p class="q-t">“导体切割磁感线时，感应电动势 E＝BLv（B、L、v 两两垂直）。”</p>
<p class="q-b">它只算<b>大小</b>。L 是导体在磁场中的有效长度，v 要取垂直于 B 的分量；三者不垂直却直接相乘，答案一定错。</p>
</div>

<div class="q">
<p class="q-t">“感应电流方向用右手定则判断：伸开右手，让磁感线穿入手心，拇指指导体运动方向，四指指感应电流方向。”</p>
<p class="q-b">右手只管方向，大小仍是 BLv。先看清 B 和 v 各指哪边；v 一反向，四指立刻反向。</p>
</div>

<p class="gx-note">读法：先问“闭合吗、φ 变了吗”，再问“大小怎么算”，最后才用右手定则定方向。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己写，再点“下一步”。套路：先确认两两垂直，再代数，最后单独判方向。</p>

<div class="gx-ex">
<p class="ex-t">例题 · E = BLv 的计算与方向<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">匀强磁场 B = 0.5 T，导体棒有效长度 L = 0.2 m，B、L、v 两两垂直，回路闭合。求：
（1）v = 2 m/s 时感应电动势 E；
（2）v = 4 m/s 时 E；
（3）若 v 反向、大小不变，E 的大小和方向如何变化？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 先确认能不能用 E = BLv</p>
<p class="s-b">回路闭合、棒在切割磁感线，所以<b>有</b>感应电动势；题里明确两两垂直，公式可直接用。
若棒沿 B 方向平动（不切割），速度再大 E 也是 0。</p>
<p class="s-k">用到：产生条件、两两垂直。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 代入 v = 2 m/s</p>
<p class="s-b">E = BLv = 0.5 × 0.2 × 2 = <b>0.2 V</b>。先把 BL = 0.1 V·s/m 算出来，后两问直接乘。</p>
<p class="s-k">用到：E = BLv，单位 V。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 代入 v = 4 m/s</p>
<p class="s-b">E = BLv = 0.1 × 4 = <b>0.4 V</b>。v 翻倍 E 也翻倍：B、L 不变时 E 与 v 成正比。</p>
<p class="s-k">用到：E ∝ v，系数 BL 固定。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · v 反向了怎么办</p>
<p class="s-b">公式只给大小：v 大小不变，E 仍是 <b>0.2 V</b>（或 0.4 V）。
方向重判：磁感线仍穿入手心，拇指改指反向，四指随之反向，<b>感应电流反向</b>。</p>
<p class="s-k">用到：右手定则；大小与方向分开处理。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 写答案</p>
<p class="s-b">（1）0.2 V；（2）0.4 V；（3）大小不变、方向相反。
把“BLv 只算大小、方向由右手定则判断”写出来，方向分才拿得稳。</p>
<p class="s-k">用到：公式管大小、定则管方向。</p>
</li>
</ol>
<div class="exbar">
  <button id="gxNext" type="button">下一步</button>
  <span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）E = BLv = 0.5 × 0.2 × 2 = <b>0.2 V</b>。<br>
（2）v = 4 m/s：E = 0.5 × 0.2 × 4 = <b>0.4 V</b>。<br>
（3）v 反向、大小不变：E 的<b>大小不变</b>（仍为 0.2 V / 0.4 V），<b>方向相反</b>——拇指反向、四指反向，感应电流反向。</p>
</div>
<p class="gx-note">阅卷高频扣分：不写“两两垂直”的前提；把 v 沿棒方向的分量算进去；用 E = BLv 判方向；第（3）问只答“不变”漏掉“方向相反”。</p>
</div>
</section>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>考你会怎么考</h2>
<p class="gx-h2s">六种问法，一半在考“条件”和“方向”。</p>

<div class="gx-qa">
<div class="qac">
<p class="q">产生感应电流的条件是什么？</p>
<p class="a"><b>回路闭合，且穿过回路的磁通量发生变化。</b>两条缺一不可：断开只有电动势没有电流；φ 不变连电动势都没有。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="闭合回路中磁通量变化才有感应电流">
  <ellipse cx="80" cy="62" rx="40" ry="30" fill="none" stroke="#7c3aed" stroke-width="3"/>
  <path d="M56 48q24-20 48 0" fill="none" stroke="#b8791f" stroke-width="2" stroke-dasharray="4 3"/>
  <polygon points="112,44 100,42 102,54" fill="#b8791f"/>
  <text x="126" y="40" font-size="9" fill="#8a5c14">φ 变化</text>
  <text x="126" y="82" font-size="9" fill="#6d28d9">回路闭合</text>
  <text x="120" y="120" text-anchor="middle" class="ms" font-size="9">两条缺一不可</text>
</svg>
</div>
<div class="qac">
<p class="q">导体棒在磁场中运动，E 一定是 BLv 吗？</p>
<p class="a"><b>不一定，要 B、L、v 两两垂直。</b>斜着拉只有垂直于 B 的分量 v⊥ 有效，E = BLv⊥；v 与 B 平行则 E = 0。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="只有垂直于B的速度分量有效">
  <line x1="24" y1="100" x2="216" y2="100" stroke="#cfd4da" stroke-width="1.5"/>
  <line x1="92" y1="28" x2="92" y2="100" stroke="#7c3aed" stroke-width="4"/>
  <path d="M102 62h72" stroke="#2f6fd0" stroke-width="2"/>
  <polygon points="184,62 170,56 170,68" fill="#2f6fd0"/>
  <path d="M102 62l54-26" stroke="#b8791f" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="140" y="88" font-size="8.5" fill="#2f6fd0">v⊥</text>
  <text x="160" y="32" font-size="8.5" fill="#8a5c14">v</text>
  <text x="120" y="122" text-anchor="middle" class="ms" font-size="9">只算垂直分量</text>
</svg>
</div>
<div class="qac">
<p class="q">感应电流方向怎么判？</p>
<p class="a"><b>右手定则：磁感线穿入手心，拇指指 v，四指指 I。</b>左手定则判安培力；切割生电用右手，通电受力用左手。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="右手定则：B穿掌心、拇指v、四指I">
  <rect x="44" y="42" width="76" height="58" rx="12" fill="#f7f5ff" stroke="#d8ccfb"/>
  <circle cx="82" cy="71" r="13" fill="#fff" stroke="#b8791f" stroke-width="1.6"/>
  <path d="M74 63l16 16m0-16L74 79" stroke="#b8791f" stroke-width="1.6"/>
  <text x="82" y="96" text-anchor="middle" font-size="8" fill="#8a5c14">B 穿掌心</text>
  <path d="M126 54h50" stroke="#2f6fd0" stroke-width="2"/>
  <polygon points="186,54 172,48 172,60" fill="#2f6fd0"/>
  <text x="178" y="45" font-size="8" fill="#2f6fd0">v</text>
  <path d="M82 36V18" stroke="#2f8a5b" stroke-width="2"/>
  <polygon points="82,10 76,22 88,22" fill="#2f8a5b"/>
  <text x="92" y="20" font-size="8" fill="#1e6640">I</text>
  <text x="120" y="122" text-anchor="middle" class="ms" font-size="9">右手：B 入手心，拇指 v，四指 I</text>
</svg>
</div>
<div class="qac">
<p class="q">磁铁插在线圈里不动，有感应电流吗？</p>
<p class="a"><b>没有。</b>φ 不变就没有感应电动势，只有插入、拔出的<b>过程</b>中才有。停在里面与拿走磁铁，对电流表一样。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="磁铁静止时磁通量不变，指针不动">
  <path d="M58 26a13 36 0 0 0 0 72M74 26a13 36 0 0 1 0 72" fill="none" stroke="#7c3aed" stroke-width="2.4"/>
  <rect x="84" y="50" width="24" height="24" fill="#c0392b"/>
  <rect x="108" y="50" width="24" height="24" fill="#2f6fd0"/>
  <circle cx="190" cy="62" r="22" fill="#fff" stroke="#5a6472" stroke-width="2"/>
  <text x="190" y="69" text-anchor="middle" font-size="12" fill="#3a3a35">G</text>
  <path d="M190 62V46" stroke="#2f8a5b" stroke-width="2"/>
  <text x="190" y="112" text-anchor="middle" font-size="8.5" fill="#2f8a5b">指针不动</text>
</svg>
</div>
<div class="qac">
<p class="q">发电机、变压器、电磁炉、无线充电各靠什么？</p>
<p class="a"><b>都靠电磁感应。</b>发电机靠线圈切割磁感线；变压器、无线充电靠<b>互感</b>；电磁炉靠交变磁场在锅底激起<b>涡流</b>。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="四种应用都靠电磁感应">
  <rect x="16" y="24" width="96" height="28" rx="6" fill="#f5f3ff" stroke="#d8ccfb"/>
  <text x="64" y="42" text-anchor="middle" font-size="9" fill="#6d28d9">发电机</text>
  <rect x="128" y="24" width="96" height="28" rx="6" fill="#fdf3e0" stroke="#f3cdc6"/>
  <text x="176" y="42" text-anchor="middle" font-size="9" fill="#8a5c14">变压器</text>
  <rect x="16" y="66" width="96" height="28" rx="6" fill="#e6f6ee" stroke="#c9e8d6"/>
  <text x="64" y="84" text-anchor="middle" font-size="9" fill="#1e6640">电磁炉</text>
  <rect x="128" y="66" width="96" height="28" rx="6" fill="#fff" stroke="#cfd4da"/>
  <text x="176" y="84" text-anchor="middle" font-size="9" fill="#3a3a35">无线充电</text>
  <text x="120" y="118" text-anchor="middle" class="ms" font-size="9">都是电磁感应</text>
</svg>
</div>
<div class="qac">
<p class="q">为什么快速插入磁铁，指针偏得更大？</p>
<p class="a"><b>因为 φ 变化得更快。</b>感应电动势由磁通量的<b>变化率</b>决定：慢插 Δφ 相同但耗时长，E 就小。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="磁通量变化越快，感应电动势越大">
  <rect x="18" y="26" width="92" height="26" rx="5" fill="#e6f6ee" stroke="#c9e8d6"/>
  <text x="64" y="44" text-anchor="middle" font-size="9" fill="#1e6640">慢插：E 小</text>
  <rect x="130" y="26" width="92" height="26" rx="5" fill="#fdf3e0" stroke="#f3cdc6"/>
  <text x="176" y="44" text-anchor="middle" font-size="9" fill="#8a5c14">快插：E 大</text>
  <path d="M30 76h58" stroke="#2f8a5b" stroke-width="2"/>
  <polygon points="96,76 84,71 84,81" fill="#2f8a5b"/>
  <path d="M130 76h72" stroke="#b8791f" stroke-width="2"/>
  <polygon points="210,76 198,71 198,81" fill="#b8791f"/>
  <text x="120" y="112" text-anchor="middle" class="ms" font-size="9">Δφ 相同，变化越快 E 越大</text>
</svg>
</div>
</div>
<p class="gx-note">六问归成一条：<b>闭合 + φ 变化</b>决定有没有，<b>BLv</b> 决定多大，<b>右手定则</b>决定哪边。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>六条易错，逐条改</h2>

<div class="er">
<p class="er-x">✗ 磁通量越大，感应电流就越大。</p>
<p class="er-v">✓ 产生感应电流的条件是 φ <b>变化</b>，不是 φ 大。</p>
<p class="er-w">磁铁插在线圈里不动时 φ 很大但不变，指针纹丝不动。</p>
</div>
<div class="er">
<p class="er-x">✗ 导体在磁场中运动，就一定有感应电流。</p>
<p class="er-v">✓ 必须回路闭合，且磁通量发生变化。</p>
<p class="er-w">回路断开时只有电动势、没有电流；沿 B 方向平动不切割。</p>
</div>
<div class="er">
<p class="er-x">✗ 只要切割磁感线，E 就是 BLv。</p>
<p class="er-v">✓ 必须 B、L、v 两两垂直，否则只取垂直分量。</p>
<p class="er-w">棒斜着拉时 E = BLv⊥，沿棒方向的分量不产生电动势。</p>
</div>
<div class="er">
<p class="er-x">✗ 判断感应电流方向用左手定则。</p>
<p class="er-v">✓ 感应电流方向用右手定则，安培力方向才用左手定则。</p>
<p class="er-w">切割生电用右手，通电受力用左手，两只手别混。</p>
</div>
<div class="er">
<p class="er-x">✗ 磁通量变化越大，感应电动势越大。</p>
<p class="er-v">✓ 是磁通量的<b>变化率</b>越大，E 才越大。</p>
<p class="er-w">慢插和快插 Δφ 相同，快插用时短，指针偏得更大。</p>
</div>
<div class="er">
<p class="er-x">✗ 感应电流的方向只由磁场方向决定。</p>
<p class="er-v">✓ 由 B 和 v 共同决定：v 反向 I 反向，B 反向 I 也反向。</p>
<p class="er-w">右手定则要同时看 B 和 v，只改一个方向，电流就变向。</p>
</div>

<p class="gx-note">把“变化”两个字圈出来，这一节一半的错题就不会再错。</p>
</section>

<script>
document.addEventListener("DOMContentLoaded", function () {
  var $ = GX.$;
  var B = 0.5, L = 0.2;
  var V = 0, dist = 0;
  var stage = $("gxStage");

  function calc(v) {
    v = GX.clamp(+v || 0, 0, 5);
    return { v: v, E: B * L * v };
  }
  function f1(x) { return (Math.round(x * 10) / 10).toFixed(1); }
  function f2(x) { return (Math.round(x * 100) / 100).toFixed(2); }

  function render() {
    var s = calc(V);
    dist = (dist + 0.12 * s.v) % 200;
    var g = $("gxRodG");
    if (g) g.setAttribute("transform", "translate(" + f1(dist) + " 0)");
    $("gxVv").textContent = f1(s.v) + " m/s";
    $("gxVe").textContent = f2(s.E) + " V";
    $("gxVst").textContent = s.v > 0.001 ? "有电动势" : "无电动势";
    $("gxStageTxt").textContent = "v = " + f1(s.v) + " m/s　E = 0.5 × 0.2 × " + f1(s.v) +
      " = " + f2(s.E) + " V";
    $("gxTake").textContent = "v = " + f1(s.v) + " m/s 时 E = " + f2(s.E) +
      " V；E 与 v 成正比，v 加倍到 4.0 m/s，E 就是 0.40 V。";
    $("gxStateNote").textContent = s.v > 0.001
      ? "状态：棒切割磁感线、回路闭合，E = " + f2(s.E) + " V；v 反向时 E 大小不变、方向相反。"
      : "状态：v = 0，棒不动，穿过回路的磁通量不变，E = 0，没有感应电流。";
  }

  function setMode(m) {
    var b = $("gxAp"), t = $("gxApTxt");
    if (!b) return;
    b.classList.toggle("is-auto", m === "auto");
    b.classList.toggle("is-manual", m !== "auto");
    if (t) t.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  render();
  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 0 }, { t: 1.6, v: 0 }, { t: 2.4, v: 2 }, { t: 4.9, v: 2 },
           { t: 6.2, v: 3.5 }, { t: 7.7, v: 3.5 }, { t: 9, v: 5 }, { t: 10.5, v: 5 },
           { t: 12, v: 0 }],
    keys: [0, 1, 2, 5],
    value: V, min: 0, max: 5, step: 0.1,
    idle: 5000,
    onChange: function (v) { V = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc };
});
</script>
