<script type="text/markdown" id="md"><div class="gx"><div class="gx-kicker">ELI5-HIGH · 讲给要考试的人</div><p class="gx-claim">这一节只干两件事：把 <b>qU</b> 换成 <b>½mv²</b>，再把偏转拆成<b>水平匀速 + 竖直匀加速</b>。</p><nav class="gx-toc"><a href="#a">① 课本怎么说</a><a href="#b">② 拆开看</a><a href="#c">③ 自己拖一下</a><a href="#d">④ 一道题走一遍</a><a href="#e">⑤ 会怎么考</a><a href="#f">⑥ 易错清单</a></nav><section class="gx-sec" id="a"><h2><span class="sn">01</span>课本怎么说</h2><p class="gx-h2s">三条：加速、偏转、要不要算重力。<span class="q-src">人教版必修第三册 · 第十章第5节</span></p><div class="gx-quote"><p class="q-t">课本表述 · 加速</p><p class="q-b">带电粒子在电场中加速：若初速度为零，电场力做的功全部转化为动能，qU = ½mv²，v = √(2qU/m)。</p><p class="q-n">→ 人话：电压 U 定末速度，与板间距无关。</p></div><div class="gx-quote"><p class="q-t">课本表述 · 偏转</p><p class="q-b">带电粒子以初速度 v₀ 垂直电场线射入匀强电场，沿初速度方向做匀速直线运动，沿电场方向做初速度为零的匀加速直线运动，轨迹与平抛运动类似。</p><p class="q-n">→ 人话：拆成两个互相垂直的方向，各算各的。</p></div><div class="gx-quote"><p class="q-t">课本表述 · 要不要算重力</p><p class="q-b">关键是判断是否考虑重力：电子、质子、离子等微观粒子一般忽略重力；带电小球、油滴等宏观带电体一般不能忽略。</p><p class="q-n">→ 人话：电子质子忽略，小球油滴必须算。</p></div></section><section class="gx-sec" id="b"><h2><span class="sn">02</span>拆开看</h2><p class="gx-h2s">三张图：怎么加速、怎么偏、示波管怎么用。</p><figure class="gx-fig"><div class="fig-cap"><span class="fig-no">图 1</span><span class="fig-t">加速电场：qU 全变成 ½mv²</span><span class="bdg bdg-must">必考</span></div><p class="fig-s">电子带负电，从静止被高电势极板吸引：电场线向左，电子向右。</p><p class="fig-s">电场力做功 W = qU 与板距无关，动能定理给出 <b>qU = ½mv²</b>。</p><div class="gx-svgbox"><svg viewBox="0 0 900 300" role="img" aria-label="加速电场"><defs><marker id="m1" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0L7,3.5L0,7Z" fill="#b9a7f7"/></marker></defs><rect x="1" y="1" width="898" height="298" rx="14" fill="#fbfcfd" stroke="#e8ebf0"/><g stroke="#b9a7f7" stroke-width="1.4" marker-end="url(#m1)"><line x1="750" y1="104" x2="160" y2="104"/><line x1="750" y1="152" x2="160" y2="152"/><line x1="750" y1="200" x2="160" y2="200"/></g><rect x="120" y="76" width="14" height="150" rx="4" fill="#c4b5fd"/><rect x="766" y="76" width="14" height="150" rx="4" fill="#7c3aed"/><g font-size="13" fill="#6d28d9"><text x="127" y="68" text-anchor="middle">−</text><text x="773" y="68" text-anchor="middle">+</text><text x="181" y="96" font-size="12" fill="#8b7cd8">E</text></g><line x1="134" y1="54" x2="766" y2="54" stroke="#b9a7f7" stroke-dasharray="6 4"/><text x="450" y="47" text-anchor="middle" font-size="12" fill="#8b7cd8">U</text><line x1="150" y1="152" x2="330" y2="152" stroke="#ddd6fe" stroke-width="7" stroke-linecap="round"/><circle cx="344" cy="152" r="13" fill="#7c3aed"/><text x="344" y="157" text-anchor="middle" font-size="12" fill="#fff">−</text><line x1="370" y1="152" x2="480" y2="152" stroke="#7c3aed" stroke-width="2" marker-end="url(#m1)"/><text x="424" y="142" text-anchor="middle" font-size="12" fill="#6d28d9">v</text><text x="450" y="280" text-anchor="middle" font-size="11" fill="#8a8f98">电场线向左，电子向右加速</text></svg><span class="gx-zoomchip">点击放大</span></div><p class="gx-take">记忆点：加速看 <b>U</b>，不看 E；U 翻倍，v 只变 √2 倍。</p></figure><figure class="gx-fig"><div class="fig-cap"><span class="fig-no">图 2</span><span class="fig-t">偏转电场：类平抛</span><span class="bdg bdg-key">高频</span></div><p class="fig-s">电子以 v₀ 垂直电场线射入板长 L、间距 d 的平行板，水平方向不受力，做匀速运动。</p><p class="fig-s">竖直方向受恒力 qE = qU偏/d，做初速为零的匀加速：t = L/v₀、y = ½at²。</p><div class="gx-svgbox"><svg viewBox="0 0 900 320" role="img" aria-label="偏转电场"><defs><marker id="m2" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0L7,3.5L0,7Z" fill="#7c3aed"/></marker></defs><rect x="1" y="1" width="898" height="318" rx="14" fill="#fbfcfd" stroke="#e8ebf0"/><rect x="280" y="80" width="380" height="12" rx="4" fill="#c4b5fd"/><rect x="280" y="214" width="380" height="12" rx="4" fill="#c4b5fd"/><line x1="280" y1="62" x2="660" y2="62" stroke="#b9a7f7"/><text x="470" y="56" text-anchor="middle" font-size="11" fill="#8b7cd8">板长 L</text><line x1="180" y1="152" x2="270" y2="152" stroke="#7c3aed" stroke-width="2" marker-end="url(#m2)"/><text x="214" y="142" text-anchor="middle" font-size="12" fill="#6d28d9">v₀</text><path d="M280,152C420,152 540,168 656,192" fill="none" stroke="#7c3aed" stroke-width="2.4"/><line x1="656" y1="192" x2="792" y2="214" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#m2)"/><line x1="470" y1="152" x2="800" y2="216" stroke="#b9a7f7" stroke-dasharray="6 4" stroke-width="1.4"/><circle cx="470" cy="152" r="4" fill="#8b7cd8"/><text x="606" y="138" font-size="11" fill="#8b7cd8">反向延长过板中心</text><text x="450" y="298" text-anchor="middle" font-size="11" fill="#8a8f98">水平定时间，竖直定偏移，再合成末速度</text></svg><span class="gx-zoomchip">点击放大</span></div><p class="gx-take">板间时间 <b>与偏转电压无关</b>；偏转电压只改 y，不改 t。</p></figure><figure class="gx-fig"><div class="fig-cap"><span class="fig-no">图 3</span><span class="fig-t">示波管：让光点听电压的话</span><span class="bdg bdg-ext">拓展</span></div><p class="fig-s">电子枪先加速射出电子，两对偏转电极分别控制水平、竖直位移。</p><p class="fig-s">偏转电压按锯齿波变化，光点匀速扫过荧光屏，扫出一条时间轴。</p><div class="gx-svgbox"><svg viewBox="0 0 900 320" role="img" aria-label="示波管"><rect x="1" y="1" width="898" height="318" rx="14" fill="#fbfcfd" stroke="#e8ebf0"/><rect x="78" y="132" width="9" height="36" rx="2" fill="#c4b5fd"/><rect x="156" y="118" width="10" height="26" rx="2" fill="#7c3aed"/><rect x="156" y="156" width="10" height="26" rx="2" fill="#7c3aed"/><rect x="340" y="104" width="82" height="10" rx="3" fill="#ddd6fe"/><rect x="340" y="196" width="82" height="10" rx="3" fill="#ddd6fe"/><rect x="470" y="102" width="10" height="106" rx="3" fill="#c4b5fd"/><rect x="542" y="102" width="10" height="106" rx="3" fill="#c4b5fd"/><line x1="820" y1="66" x2="820" y2="234" stroke="#94a3b8" stroke-width="4"/><path d="M166,150L340,150C414,150 474,126 552,118L816,96" fill="none" stroke="#7c3aed" stroke-width="2.2"/><circle cx="818" cy="96" r="13" fill="#f9a8d4" opacity=".45"/><circle cx="818" cy="96" r="6" fill="#ec4899"/><g font-size="11" fill="#8a8f98"><text x="118" y="228" text-anchor="middle">电子枪</text><text x="470" y="238" text-anchor="middle">偏转电极</text><text x="820" y="256" text-anchor="middle">荧光屏</text></g></svg><span class="gx-zoomchip">点击放大</span></div><p class="gx-take">示波管 = 加速 + 两对偏转板 + 屏，把<b>两段运动</b>接起来。</p></figure></section><section class="gx-sec" id="c"><h2><span class="sn">03</span>自己拖一下<span class="bdg bdg-must">核心</span></h2><p class="gx-h2s">电子 m = 9.1×10⁻³¹ kg、q = 1.6×10⁻¹⁹ C，初速 0，U 在 100–1000 V 之间。</p><figure class="gx-fig"><div class="fig-cap"><span class="fig-no">互动 1</span><span class="fig-t">U 变，v 和 Ek 跟着变</span><span class="gx-ap is-auto" id="gxAp"><i></i><span id="gxApTxt">自动演示中</span></span></div><p class="fig-s">只有电场力做功，<b>qU = ½mv²</b>，所以 v = √(2qU/m)、Ek = qU。</p><p class="fig-s">拖滑块或点图切换关键电压；停手 5 s 后自动接着演示。</p><div class="gx-board"><svg id="gxStage" class="gx-graph" viewBox="0 0 360 260" tabindex="0" role="application" aria-label="电子加速互动：改变加速电压U，观察速度和动能"><defs><marker id="m4" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0L6,3L0,6Z" fill="#b9a7f7"/></marker><marker id="m5" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0L6,3L0,6Z" fill="#7c3aed"/></marker></defs><rect x="1" y="1" width="358" height="258" rx="12" fill="#fbfcfd" stroke="#e8ebf0"/><text x="180" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#3a3a35">加速电场：qU = ½mv²</text><rect x="42" y="54" width="10" height="126" rx="3" fill="#c4b5fd"/><rect x="308" y="54" width="10" height="126" rx="3" fill="#7c3aed"/><g font-size="11" fill="#6d28d9"><text x="47" y="48" text-anchor="middle">−</text><text x="313" y="48" text-anchor="middle">+</text><text x="74" y="72" font-size="10" fill="#8b7cd8">E</text></g><g stroke="#b9a7f7" stroke-width="1.2" marker-end="url(#m4)"><line x1="300" y1="78" x2="62" y2="78"/><line x1="300" y1="116" x2="62" y2="116"/><line x1="300" y1="154" x2="62" y2="154"/></g><line id="gxTrail" x1="60" y1="136" x2="63" y2="136" stroke="#ddd6fe" stroke-width="6" stroke-linecap="round"/><circle id="gxE" cx="63" cy="136" r="8" fill="#7c3aed"/><line id="gxArrow" x1="60" y1="204" x2="165" y2="204" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#m5)"/><text id="gxVlab" x="112" y="196" text-anchor="middle" font-size="10" fill="#6d28d9">v</text><text id="gxHint" x="180" y="238" text-anchor="middle" font-size="11" fill="#6d28d9"></text></svg><div class="bar"><span class="lb">加速电压 U</span><input type="range" id="gxSl" min="100" max="1000" step="1" value="500" aria-label="加速电压U，单位伏特"></div></div><div class="stats"><div class="st"><div class="k">① 加速电压 U</div><div class="v" id="gxVa">500 V</div><div class="s">滑块 100–1000 V</div></div><div class="st"><div class="k">② 速度 v</div><div class="v" id="gxVb">1.33×10⁷ m/s</div><div class="s">v = √(2qU/m)</div></div><div class="st"><div class="k">③ 动能 Ek</div><div class="v" id="gxVc">8.0×10⁻¹⁷ J</div><div class="s">Ek = qU</div></div></div><p class="gx-take">U 从 500 V 到 1000 V：v 只从 1.33×10⁷ 涨到 1.87×10⁷ m/s（乘 √2），Ek 才从 8.0×10⁻¹⁷ 翻到 1.6×10⁻¹⁶ J。</p></figure></section><section class="gx-sec" id="d"><h2><span class="sn">04</span>一道题走一遍</h2><p class="gx-h2s">先自己写，再点“下一步”。</p><div class="gx-ex"><p class="ex-t">例题 · 加速电压与末速度<span class="bdg bdg-must">必考</span></p><p class="ex-q">电子从静止经 U₁ = 500 V 的电场加速。已知 m = 9.1×10⁻³¹ kg，q = 1.6×10⁻¹⁹ C。求：(1) 离开加速电场时的速度；(2) 若加速电压换成 1000 V，速度多大；(3) 500 V 时电子的动能。</p><ol class="steps" id="gxSteps"><li class="step"><p class="s-h">第 1 步 · 建模：只受电场力</p><p class="s-b">电子是微观粒子，重力可忽略；初速为 0，做功的只有 <b>qU</b>，不必管板距和场强。</p></li><li class="step" hidden><p class="s-h">第 2 步 · 500 V 时求 v</p><p class="s-b">v = √(2qU/m) = √(2×1.6×10⁻¹⁹×500 / 9.1×10⁻³¹) = √(1.76×10¹⁴) ≈ <b>1.33×10⁷ m/s</b>。</p></li><li class="step" hidden><p class="s-h">第 3 步 · 1000 V 时求 v</p><p class="s-b">v ∝ √U，U 翻倍 v 只乘 √2：v ≈ 1.33×10⁷×1.41 ≈ <b>1.87×10⁷ m/s</b>。</p></li><li class="step" hidden><p class="s-h">第 4 步 · 求动能</p><p class="s-b"><b>Ek = qU</b> = 1.6×10⁻¹⁹×500 = <b>8.0×10⁻¹⁷ J</b>。</p></li><li class="step" hidden><p class="s-h">第 5 步 · 用 ½mv² 校验</p><p class="s-b">½×9.1×10⁻³¹×(1.33×10⁷)² ≈ 8.0×10⁻¹⁷ J，与 qU 一致；v/c ≈ 4.4%，经典公式成立。</p></li></ol><div class="exbar"><button id="gxNext" type="button">下一步</button><span class="cnt" id="gxCnt">1 / 5</span></div><div class="ans" id="gxAns" hidden><p class="ans-t">标准答案（可抄进答题卡）</p><p class="ans-b">(1) v ≈ <b>1.33×10⁷ m/s</b>；(2) v ≈ <b>1.87×10⁷ m/s</b>；(3) Ek = qU = <b>8.0×10⁻¹⁷ J</b>。</p></div></div></section><section class="gx-sec" id="e"><h2><span class="sn">05</span>考你会怎么考</h2><p class="gx-h2s">六种问法：重力、公式、时间、位移、出射、相对论。</p><div class="gx-qa"><div class="qac"><p class="q">电子、质子要不要考虑重力？</p><p class="a"><b>一般忽略。</b>电场力常比重力大 10¹⁰ 量级；小球、油滴必须算。</p><svg viewBox="0 0 240 132" role="img" aria-label="电场力远大于重力"><rect x="1" y="1" width="238" height="130" rx="10" fill="#fbfcfd" stroke="#e9ebef"/><circle cx="96" cy="62" r="10" fill="#7c3aed"/><line x1="106" y1="62" x2="182" y2="62" stroke="#7c3aed" stroke-width="2"/><polygon points="182,58 192,62 182,66" fill="#7c3aed"/><text x="184" y="52" font-size="10" fill="#6d28d9">qE</text><line x1="96" y1="72" x2="96" y2="82" stroke="#9ca3af" stroke-dasharray="2 2"/><text x="104" y="92" font-size="9" fill="#8a8f98">mg</text><text x="120" y="116" text-anchor="middle" font-size="9" fill="#6d28d9">mg 可忽略</text></svg></div><div class="qac"><p class="q">加速后的速度用什么公式？</p><p class="a"><b>qU = ½mv²</b> → v = √(2qU/m)，只问首末速度，不求 a 和 t。</p><svg viewBox="0 0 240 132" role="img" aria-label="v 与 U 的平方根关系"><rect x="1" y="1" width="238" height="130" rx="10" fill="#fbfcfd" stroke="#e9ebef"/><line x1="36" y1="104" x2="212" y2="104" stroke="#94a3b8"/><line x1="36" y1="104" x2="36" y2="26" stroke="#94a3b8"/><path d="M36,100C94,50 150,34 206,30" fill="none" stroke="#7c3aed" stroke-width="2.2"/><text x="24" y="30" font-size="10" fill="#6b7280">v</text><text x="206" y="120" font-size="10" fill="#6b7280">U</text><text x="104" y="80" font-size="10" fill="#6d28d9">v ∝ √U</text></svg></div><div class="qac"><p class="q">电子在偏转电场里飞多久？</p><p class="a"><b>t = L/v₀</b>，只由板长和初速决定，<b>与偏转电压无关</b>。</p><svg viewBox="0 0 240 132" role="img" aria-label="板间时间由板长和初速决定"><rect x="1" y="1" width="238" height="130" rx="10" fill="#fbfcfd" stroke="#e9ebef"/><rect x="48" y="38" width="140" height="9" rx="3" fill="#c4b5fd"/><rect x="48" y="88" width="140" height="9" rx="3" fill="#c4b5fd"/><line x1="22" y1="66" x2="66" y2="66" stroke="#7c3aed" stroke-width="2"/><polygon points="66,62 76,66 66,70" fill="#7c3aed"/><line x1="86" y1="66" x2="176" y2="66" stroke="#b9a7f7" stroke-dasharray="4 3"/><line x1="48" y1="26" x2="188" y2="26" stroke="#b9a7f7"/><text x="118" y="20" text-anchor="middle" font-size="9" fill="#8b7cd8">L</text><text x="120" y="116" text-anchor="middle" font-size="10" fill="#6d28d9">t = L / v₀</text></svg></div><div class="qac"><p class="q">偏转位移 y 怎么算？</p><p class="a">y = ½at² = <b>qU偏L²/(2mv₀²d)</b>；v₀ 由 U₁ 加速时化为 y = U偏L²/(4U₁d)。</p><svg viewBox="0 0 240 132" role="img" aria-label="偏转位移由竖直匀加速决定"><rect x="1" y="1" width="238" height="130" rx="10" fill="#fbfcfd" stroke="#e9ebef"/><rect x="40" y="38" width="160" height="9" rx="3" fill="#c4b5fd"/><rect x="40" y="92" width="160" height="9" rx="3" fill="#c4b5fd"/><line x1="18" y1="58" x2="42" y2="58" stroke="#7c3aed" stroke-width="2"/><path d="M42,58Q140,62 196,84" fill="none" stroke="#7c3aed" stroke-width="2.2"/><line x1="196" y1="58" x2="196" y2="84" stroke="#9ca3af" stroke-dasharray="3 3"/><text x="201" y="75" font-size="9" fill="#6b7280">y</text><text x="120" y="120" text-anchor="middle" font-size="9" fill="#6d28d9">y = ½at²</text></svg></div><div class="qac"><p class="q">出了偏转电场还受力吗？</p><p class="a"><b>不再受力，做匀速直线运动</b>；出射方向的反向延长线过板中心。</p><svg viewBox="0 0 240 132" role="img" aria-label="出射后匀速直线"><rect x="1" y="1" width="238" height="130" rx="10" fill="#fbfcfd" stroke="#e9ebef"/><rect x="40" y="44" width="90" height="9" rx="3" fill="#c4b5fd"/><rect x="40" y="88" width="90" height="9" rx="3" fill="#c4b5fd"/><path d="M24,70Q77,70 130,58" fill="none" stroke="#7c3aed" stroke-width="2.2"/><line x1="130" y1="58" x2="204" y2="41" stroke="#7c3aed" stroke-width="2.2"/><line x1="204" y1="41" x2="24" y2="82" stroke="#b9a7f7" stroke-dasharray="4 3"/><circle cx="85" cy="68" r="3" fill="#8b7cd8"/><text x="120" y="118" text-anchor="middle" font-size="9" fill="#6d28d9">反向延长线过板中心</text></svg></div><div class="qac"><p class="q">什么时候要相对论修正？</p><p class="a"><b>v 大于 0.1c ≈ 3×10⁷ m/s</b> 就要修正；本页电子最大 1.88×10⁷ m/s，仍可忽略。</p><svg viewBox="0 0 240 132" role="img" aria-label="速度小于0.1倍光速"><rect x="1" y="1" width="238" height="130" rx="10" fill="#fbfcfd" stroke="#e9ebef"/><text x="120" y="30" text-anchor="middle" font-size="10" fill="#6b7280">v/c</text><rect x="34" y="56" width="172" height="16" rx="8" fill="#eceef2"/><rect x="34" y="56" width="15" height="16" rx="8" fill="#7c3aed"/><line x1="68" y1="48" x2="68" y2="80" stroke="#ef4444" stroke-dasharray="3 3"/><text x="68" y="42" text-anchor="middle" font-size="9" fill="#ef4444">0.1c</text><text x="56" y="94" text-anchor="middle" font-size="9" fill="#6d28d9">本页 4.4%</text><text x="120" y="116" text-anchor="middle" font-size="9" fill="#8a8f98">小于 0.1c，经典公式够用</text></svg></div></div></section><section class="gx-sec" id="f"><h2><span class="sn">06</span>易错清单</h2><p class="gx-h2s">左边是错句，右边是能得分的表述。</p><div class="gx-errs"><div class="er"><p class="er-x">✗ 所有带电粒子都忽略重力。</p><p class="er-v">✓ 电子、质子、离子等<b>微观粒子忽略</b>；小球、油滴必须算。</p><p class="er-w">质量差十几个数量级，先看是谁。</p></div><div class="er"><p class="er-x">✗ 加速后速度用 v = at 求。</p><p class="er-v">✓ 用 <b>qU = ½mv²</b>，v = √(2qU/m)；v = at 还得先找 E 和时间。</p><p class="er-w">只问首末速度，动能定理一步到位。</p></div><div class="er"><p class="er-x">✗ 偏转电压越大，板间飞得越久。</p><p class="er-v">✓ t = L/v₀，<b>与偏转电压无关</b>。</p><p class="er-w">水平方向不受力，竖直力改不了水平速度。</p></div><div class="er"><p class="er-x">✗ 电子带正电，顺电场线加速。</p><p class="er-v">✓ 电子带<b>负电</b>，受力与场强反向，向高电势加速。</p><p class="er-w">负电荷逆着电场线走，电势反而升高。</p></div><div class="er"><p class="er-x">✗ 加速电压 2 倍，速度也 2 倍。</p><p class="er-v">✓ v ∝ √U，电压翻倍速度只变 <b>√2 倍</b>。</p><p class="er-w">Ek = qU 才与 U 成正比。</p></div><div class="er"><p class="er-x">✗ 加速后动能与电压无关。</p><p class="er-v">✓ Ek = qU，<b>与 U 成正比</b>。</p><p class="er-w">电场力做的功全变成动能。</p></div></div></section><div class="gx-foot"><p>人教版《物理》必修第三册（2019年版）第十章第5节</p></div></div><div class="gx-zoom" id="gxZoom" hidden><span class="gx-zoom-tip">双指放大看细节</span><button class="gx-zoom-x" type="button" aria-label="关闭">✕</button><div id="gxZoomInner"></div></div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  var $ = GX.$, Q = 1.6e-19, M = 9.1e-31, C0 = 3e8, U = 500;
  var SUP = "⁰¹²³⁴⁵⁶⁷⁸⁹";
  function sup10(e) {
    var s = String(Math.abs(e)), o = "", i;
    for (i = 0; i < s.length; i++) o += SUP.charAt(+s.charAt(i));
    return (e < 0 ? "⁻" : "") + o;
  }
  function sci(x, d) {
    if (!(x > 0) || !isFinite(x)) return "0";
    var e = Math.floor(Math.log10(x)), m = x / Math.pow(10, e);
    if (m >= 10) { m /= 10; e += 1; }
    if (m < 1) { m *= 10; e -= 1; }
    return m.toFixed(d) + "×10" + sup10(e);
  }
  function render() {
    if (!isFinite(U)) U = 500;
    var v = Math.sqrt(2 * Q * U / M), ek = Q * U;
    var p = Math.max(0, Math.min(1, (U - 100) / 900)), ex = 63 + p * 231;
    $("gxE").setAttribute("cx", ex.toFixed(1));
    $("gxTrail").setAttribute("x2", ex.toFixed(1));
    var ax = 165 + Math.sqrt(p) * 130;
    $("gxArrow").setAttribute("x2", ax.toFixed(1));
    $("gxVlab").setAttribute("x", ((60 + ax) / 2).toFixed(1));
    $("gxVa").textContent = Math.round(U) + " V";
    $("gxVb").textContent = sci(v, 2) + " m/s";
    $("gxVc").textContent = sci(ek, 1) + " J";
    var h;
    if (Math.abs(U - 500) < 2) h = "U = 500 V：关键帧，停 2.5 s";
    else if (v > 0.1 * C0) h = "v 已过 0.1c，经典公式要修正";
    else h = "非相对论区：v/c ≈ " + (v / C0 * 100).toFixed(1) + "%";
    $("gxHint").textContent = h;
  }
  var badge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!badge) return;
    badge.classList.toggle("is-auto", m === "auto");
    badge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }
  render();
  var ap = AutoPilot.create({
    mount: $("gxStage"), follow: $("gxSl"),
    loop: [{ t: 0, v: 100 }, { t: 1.5, v: 100 }, { t: 3, v: 300 }, { t: 3.8, v: 300 },
           { t: 5.3, v: 500 }, { t: 7.8, v: 500 }, { t: 9.3, v: 1000 }, { t: 11, v: 1000 },
           { t: 12, v: 100 }],
    keys: [100, 300, 500, 1000],
    value: U, min: 100, max: 1000, step: 1, idle: 5000,
    onChange: function (v) { U = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
});
</script>
