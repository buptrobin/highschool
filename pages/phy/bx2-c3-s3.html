<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">三条：称地球、称中心天体、预言未知天体。</p>

<div class="gx-quote">
<p class="q-t">课本表述 · 称量地球的质量<span class="q-src">必修第二册 · 第七章</span></p>
<p class="q-b">不考虑自转，地面物体所受重力等于地球对它的万有引力：mg = GMm/R²，得 M = gR²/G。</p>
<p class="q-n">→ 人话：测出 g 和 R，就能称地球。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本表述 · 计算天体的质量<span class="q-src">必修第二册 · 第七章</span></p>
<p class="q-b">行星绕太阳做匀速圆周运动，万有引力提供向心力：GMm/r² = m(2π/T)²r，得 M = 4π²r³/(GT²)。</p>
<p class="q-n">→ 人话：知道 r 和 T，就能反推中心天体质量。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本表述 · 发现未知天体<span class="q-src">必修第二册 · 第七章</span></p>
<p class="q-b">天王星轨道与计算值有偏差，亚当斯、勒维耶据此预言新行星位置，伽勒观测到海王星；哈雷据此预言彗星回归。</p>
<p class="q-n">→ 人话：先算后看。</p>
</div>

<p class="gx-note">三条共用一个式子：<b>GMm/r² = mg</b>（地面）或 <b>GMm/r² = m·4π²r/T²</b>（天上）。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己写，再点「下一步」。这题考「用地面的 g 和 R 称地球」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 称量地球质量<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">已知 R = 6.4×10⁶ m，g = 9.8 m/s²，G = 6.67×10⁻¹¹ N·m²/kg²。不考虑地球自转，估算地球质量 M（两位有效数字）。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 选对象</p>
<p class="s-b">取地面上质量为 m 的物体：受重力 mg 与地球的万有引力 GMm/R²，<b>忽略自转</b>，两者视为同一个力。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 列式，约掉 m</p>
<p class="s-b"><b>mg = GMm/R²</b>，除以 m 得 g = GM/R²，变形 <b>M = gR²/G</b>。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 认准每个量</p>
<p class="s-b">R 是<b>地球半径</b>，不是离地高度；g 取<b>地面附近</b>的 9.8；G = 6.67×10⁻¹¹，都用国际单位。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 代数字</p>
<p class="s-b">M = 9.8×(6.4×10⁶)²/6.67×10⁻¹¹ = 9.8×4.096×10¹³/6.67×10⁻¹¹
= 4.01×10¹⁴/6.67×10⁻¹¹ ≈ <b>6.0×10²⁴ kg</b>。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 换条路校验</p>
<p class="s-b">月球绕地 r = 3.84×10⁸ m、T = 27.3 天 ≈ 2.36×10⁶ s，M = 4π²r³/(GT²) ≈ <b>6.0×10²⁴ kg</b>，两条路一致。</p>
<p class="s-k">用到：两种方法求的都是中心天体。</p>
</li>
</ol>
<div class="exbar">
  <button id="gxNext" type="button">下一步</button>
  <span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">不考虑自转，地面物体重力等于地球的万有引力：mg = GMm/R²，约去 m 得 M = gR²/G。<br>
M = 9.8×(6.4×10⁶)²/(6.67×10⁻¹¹) ≈ <b>6.0×10²⁴ kg</b>。</p>
</div>
<p class="gx-note">扣分点：R 写成高度 h；漏掉「忽略自转」；结果不带单位。</p>
</div>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是错句，右边是能得分的表述。</p>
<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 由 M = 4π²r³/(GT²) 算出的是卫星质量。</p>
<p class="er-v">✓ 算出的是被环绕的<b>中心天体</b>质量。</p>
<p class="er-w">m 已在两边约掉。</p>
</div>
<div class="er">
<p class="er-x">✗ 公式里的 r 就是离地高度 h。</p>
<p class="er-v">✓ r 是卫星到<b>地心</b>的距离，r = R + h。</p>
<p class="er-w">r 是两球心间距离。</p>
</div>
<div class="er">
<p class="er-x">✗ 卫星质量越大，周期越长。</p>
<p class="er-v">✓ T 只由 r 和中心天体质量决定。</p>
<p class="er-w">T²/r³ = 4π²/(GM)，没有 m。</p>
</div>
<div class="er">
<p class="er-x">✗ 用 M = gR²/G 时，R 可以取高度。</p>
<p class="er-v">✓ 用地面 g 时 R 必须取<b>地球半径</b>。</p>
<p class="er-w">g = GM/R² 与地面 g 才配套。</p>
</div>
<div class="er">
<p class="er-x">✗ 海王星先被看到，再解释天王星偏差。</p>
<p class="er-v">✓ 先由轨道偏差<b>算出位置</b>，再观测找到。</p>
<p class="er-w">顺序反了就失去预言意义。</p>
</div>
<div class="er">
<p class="er-x">✗ 由 T、r 只能求质量，求不了密度。</p>
<p class="er-v">✓ 若 r ≈ R，ρ = 3π/(GT²)。</p>
<p class="er-w">4π²R³/(GT²) 除以 4πR³/3，R³ 约掉。</p></div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  var $ = GX.$, RE = 6.4e6, GM = 3.98e14, G = 6.67e-11, K = 2.0;

  function calc(k) {
    var r = k * RE, T = 2 * Math.PI * Math.sqrt(r * r * r / GM);
    return { r: r, T: T, M: 4 * Math.PI * Math.PI * r * r * r / (G * T * T) };
  }

  function render() {
    var s = calc(K), rp = 28 + (K - 1.5) / 5.5 * 52, t = Math.round(s.T / 60);
    $("gxOrbit").setAttribute("r", rp.toFixed(1));
    $("gxR").setAttribute("x2", (110 + rp).toFixed(1));
    $("gxRLab").setAttribute("x", (110 + rp / 2).toFixed(1));
    $("gxSat").setAttribute("cx", (110 + rp).toFixed(1));
    $("gxSatLab").setAttribute("x", Math.min(300, 110 + rp + 8).toFixed(1));
    $("gxTBig").textContent = t + " 分钟";
    $("gxMBig").textContent = (s.M / 1e24).toFixed(2) + "×10²⁴ kg";
    $("gxFormula").textContent = "T = 2π√(r³/GM) = " + t + " 分钟 ≈ " + (s.T / 3600).toFixed(1) + " h";
    $("gxVa").textContent = (s.r / 1e6).toFixed(1) + "×10⁶ m";
    $("gxVb").textContent = t + " 分钟";
    $("gxVs").textContent = (s.M / 1e24).toFixed(2) + "×10²⁴ kg";
    $("gxHint").textContent = Math.abs(K - 6.6) < 0.06 ? "6.6R_E ≈ 4.2×10⁷ m：同步轨道附近，T ≈ 24 h"
      : Math.abs(K - 4.2) < 0.06 ? "4.2R_E：T ≈ 12 h，不是同步轨道" : "r 变，T 变，M 不变";
  }

  var ap = null, badge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!badge) return;
    badge.classList.toggle("is-auto", m === "auto");
    badge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  $("gxSl").addEventListener("input", function () { K = parseFloat(this.value); render(); });

  render();
  ap = AutoPilot.create({
    mount: $("gxStage"), follow: $("gxSl"),
    loop: [{ t: 0, v: 1.5 }, { t: 1.6, v: 1.5 }, { t: 3.2, v: 2 }, { t: 4.4, v: 2 },
           { t: 5.8, v: 4.2 }, { t: 7.0, v: 4.2 }, { t: 8.4, v: 6.6 }, { t: 10.9, v: 6.6 },
           { t: 12.2, v: 7 }, { t: 13.2, v: 7 }, { t: 14.2, v: 1.5 }],
    keys: [1.5, 2, 4.2, 6.6, 7],
    value: K, min: 1.5, max: 7, step: 0.1, idle: 5000,
    onChange: function (v) { K = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
});
</script>
