<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">三句话：哪些是基本单位、哪些是导出来的、牛顿是怎么被「造」出来的。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 基本单位与导出单位<span class="q-src">人教版必修第一册 · 第四章第 4 节</span></p>
<p class="q-b">力学中的基本量有三个：长度、质量、时间。它们的单位叫作基本单位；由基本量根据物理关系推导出来的其他物理量的单位，叫作导出单位。</p>
<p class="q-n">→ 力学里只需要记住三个基本单位：<b>米（m）、千克（kg）、秒（s）</b>。
其余全是「算出来的」：速度 m/s 是 m ÷ s，加速度 m/s² 是 m/s ÷ s，力 N 后面会看到是 kg·m/s²。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 单位制<span class="q-src">人教版必修第一册 · 第四章第 4 节</span></p>
<p class="q-b">基本单位和导出单位一起组成了单位制。国际单位制（SI）是国际上通用的单位制。</p>
<p class="q-n">→ 单位制的价值在于<b>统一</b>：全世界用同一套单位，公式里的系数才不会莫名多出 1000、3600。
课本强调，计算时<b>先把各量统一到国际单位制</b>，再代入公式，结果才带正确的单位。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 力的单位牛顿<span class="q-src">人教版必修第一册 · 第四章第 4 节</span></p>
<p class="q-b">使质量为 1 kg 的物体产生 1 m/s² 加速度的力，叫作 1 N，即 1 N = 1 kg·m/s²。</p>
<p class="q-n">→ 这句话把 F = ma 的三家单位锁在一起：<b>N = kg·m/s²</b>。
所以 N <b>不是</b>基本单位，它是导出单位；把 kg 说成「力的单位」、把 N 说成「基本单位」，都是概念错。</p>
</div>

<p class="gx-note">一条实用推论：既然 1 N = 1 kg·m/s²，那么 <b>N/kg 就等于 m/s²</b>。
以后看到重力加速度 g = 9.8 N/kg 和 g = 9.8 m/s²，别以为是两个量——它们是同一个东西的两种写法。</p>
</section>

<p class="fig-s">把 F = ma 里每一个量都换成国际单位：m 用 <b>kg</b>、a 用 <b>m/s²</b>，乘出来的单位就是 <b>kg·m/s²</b>。
课本规定「使 1 kg 的物体产生 1 m/s² 加速度的力」为 1 N，于是 <b>1 N = 1 kg·m/s²</b>。
反过来用也成立：<b>N/kg = m/s²</b>，所以 g 写成 9.8 N/kg 或 9.8 m/s² 都对。</p>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己写，再点「下一步」。这题练的是「用单位抓错」这套动作。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 单位检验与换算<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">（1）用量纲（单位）检验位移公式 x = ½at² 是否正确；
（2）质量 500 g 的物体受到 2.0 N 的水平合力，求加速度（要求用国际单位计算）；
（3）某车速度为 72 km/h，换算成 m/s。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 检验公式，只看单位不看数字</p>
<p class="s-b">右边 ½at²：系数 ½ 没有单位，a 的单位是 m/s²，t² 的单位是 s²。
乘起来 <b>(m/s²)×s² = m</b>。左边 x 的单位也是 m。<b>两边单位相同</b>，这个公式在单位上站得住。</p>
<p class="s-k">用到：单位（量纲）检验——公式两边单位必须一致，否则一定错。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 先把 500 g 换成 kg</p>
<p class="s-b">1 kg = 1000 g，所以 m = 500 g = 500 ÷ 1000 kg = <b>0.50 kg</b>。
这一步不做，后面的 a 会小 1000 倍——而且单位看着还「像对的」，极难发现。</p>
<p class="s-k">用到：国际单位制中质量的单位是 kg，不是 g。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 代入 F = ma 求 a</p>
<p class="s-b">a = F/m = 2.0 N ÷ 0.50 kg = <b>4.0 m/s²</b>。
顺手做一次单位验算：N/kg = (kg·m/s²)/kg = m/s²，与 a 的单位一致，结果可信。</p>
<p class="s-k">用到：a = F合/m；N/kg 与 m/s² 是同一个单位。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 72 km/h 换成 m/s</p>
<p class="s-b">72 km/h = 72 × 1000 m ÷ 3600 s = 72000/3600 m/s = <b>20 m/s</b>。
口算可以用「除以 3.6」：72 ÷ 3.6 = 20，但答题时要写出 1000/3600 的来历。</p>
<p class="s-k">用到：1 km = 1000 m、1 h = 3600 s；换算是「乘 1」。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 把三问合成一段能抄的答案</p>
<p class="s-b">三问的答案都要带单位：x 的单位 m、a 的单位 m/s²、v 的单位 m/s。
答题时先写「统一到国际单位」，再写数值，最后用单位检查一遍——这三步写在卷面上，本身就是得分点。</p>
<p class="s-k">用到：结果必须带单位；单位是答案的一部分，不是装饰。</p>
</li>
</ol>
<div class="exbar">
  <button id="gxNext" type="button">下一步</button>
  <span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）右边 ½at² 的单位为 (m/s²)·s² = <b>m</b>，与左边位移 x 的单位相同，
故公式在单位上正确。<br>
（2）m = 500 g = <b>0.50 kg</b>，由 F = ma 得 a = F/m = 2.0/0.50 = <b>4.0 m/s²</b>，
方向与合力方向相同。（单位验算：N/kg = m/s²。）<br>
（3）72 km/h = 72×1000 m ÷ 3600 s = <b>20 m/s</b>。</p>
</div>
<p class="gx-note">高频扣分：把 500 g 直接代入得 a = 0.004 m/s² 却仍写单位 m/s²；
把 72 km/h 直接当 72 m/s 用；答案只写数字不写单位。</p>
</div>
</section>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>考你会怎么考</h2>
<p class="gx-h2s">六种问法，本质都在问：这个单位能不能拆成 m、kg、s。</p>

<div class="gx-qa">
<div class="qac">
<p class="q">N 是基本单位吗？</p>
<p class="a"><b>不是。</b>N 是导出单位，1 N = 1 kg·m/s²，能一路拆到 kg、m、s。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="牛顿可以拆成千克米每二次方秒，所以不是基本单位">
  <rect x="60" y="24" width="120" height="34" rx="8" fill="#fdf3e0" stroke="#f0dcb4"/>
  <text x="120" y="46" text-anchor="middle" font-size="12" font-weight="700" fill="#8a5c14">N</text>
  <line x1="120" y1="60" x2="120" y2="76" stroke="#9aa3ae" stroke-width="1.6"/>
  <polygon points="120,84 115,72 125,72" fill="#9aa3ae"/>
  <rect x="40" y="88" width="160" height="30" rx="7" fill="#f5f3ff" stroke="#d8ccfb"/>
  <text x="120" y="108" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6d28d9">kg·m/s²</text>
</svg>
</div>
<div class="qac">
<p class="q">kg 和 N 有什么区别？</p>
<p class="a"><b>kg 是质量的单位，N 是力的单位。</b>说「这个箱子重 5 kg」是把质量和重力混了。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="千克是质量单位，牛是力的单位">
  <rect x="14" y="26" width="98" height="46" rx="8" fill="#f5f3ff" stroke="#d8ccfb"/>
  <text x="63" y="46" text-anchor="middle" font-size="11" font-weight="700" fill="#6d28d9">kg</text>
  <text x="63" y="63" text-anchor="middle" font-size="9" fill="#6b7280">质量的单位</text>
  <rect x="128" y="26" width="98" height="46" rx="8" fill="#fdf3e0" stroke="#f0dcb4"/>
  <text x="177" y="46" text-anchor="middle" font-size="11" font-weight="700" fill="#8a5c14">N</text>
  <text x="177" y="63" text-anchor="middle" font-size="9" fill="#6b7280">力的单位</text>
  <text x="120" y="102" text-anchor="middle" font-size="10" fill="#b8402f">不能说「重 5 kg」</text>
  <text x="120" y="120" text-anchor="middle" font-size="9.5" fill="#6b7280">重 5 kg 的物体，重力约 49 N</text>
</svg>
</div>
<div class="qac">
<p class="q">cm、g 能直接代进公式吗？</p>
<p class="a"><b>不能。</b>先换成 m、kg。单位不统一时，算出的数没有物理意义。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="厘米和克要先换成米和千克">
  <text x="120" y="40" text-anchor="middle" font-size="11" fill="#3a3a35">5 cm　500 g</text>
  <line x1="120" y1="52" x2="120" y2="70" stroke="#b8402f" stroke-width="1.6"/>
  <polygon points="120,80 114,68 126,68" fill="#b8402f"/>
  <text x="120" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#1e6640">0.05 m　0.50 kg</text>
  <text x="120" y="120" text-anchor="middle" font-size="9.5" fill="#6b7280">先统一，再计算</text>
</svg>
</div>
<div class="qac">
<p class="q">单位制到底有什么用？</p>
<p class="a"><b>两件事：让结果自动带对单位，让公式可以被检验。</b>单位对不上，公式或代入一定有问题。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="单位制可以检验公式两边是否一致">
  <rect x="20" y="28" width="200" height="34" rx="8" fill="#fff" stroke="#e6e9ee"/>
  <text x="120" y="50" text-anchor="middle" font-size="11" fill="#3a3a35">左边：m</text>
  <rect x="20" y="70" width="200" height="34" rx="8" fill="#fff" stroke="#e6e9ee"/>
  <text x="120" y="92" text-anchor="middle" font-size="11" fill="#3a3a35">右边：m</text>
  <text x="120" y="122" text-anchor="middle" font-size="10" fill="#1e6640">一致 → 公式可信</text>
</svg>
</div>
<div class="qac">
<p class="q">J 是怎么由基本单位组成的？</p>
<p class="a"><b>J = N·m = kg·m²/s²。</b>功 = 力 × 位移，单位也就跟着相乘。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="焦耳等于牛乘米等于千克米方每秒方">
  <rect x="30" y="26" width="180" height="32" rx="7" fill="#ecfbff" stroke="#b8e6f2"/>
  <text x="120" y="47" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0b6580">J = N·m</text>
  <rect x="18" y="68" width="204" height="34" rx="7" fill="#f5f3ff" stroke="#d8ccfb"/>
  <text x="120" y="90" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6d28d9">= kg·m²/s²</text>
  <text x="120" y="122" text-anchor="middle" font-size="9.5" fill="#6b7280">一路拆到 m、kg、s 为止</text>
</svg>
</div>
<div class="qac">
<p class="q">公式两边的单位必须怎样？</p>
<p class="a"><b>必须相同。</b>这是等式成立的必要条件，也是最快的自查手段。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="等式两边单位必须相同">
  <text x="66" y="66" text-anchor="middle" font-size="15" font-weight="700" fill="#6d28d9">a</text>
  <text x="120" y="66" text-anchor="middle" font-size="15" fill="#5a6472">=</text>
  <text x="174" y="66" text-anchor="middle" font-size="15" font-weight="700" fill="#6d28d9">F/m</text>
  <text x="66" y="94" text-anchor="middle" font-size="10" fill="#6b7280">m/s²</text>
  <text x="174" y="94" text-anchor="middle" font-size="10" fill="#6b7280">N/kg</text>
  <text x="120" y="120" text-anchor="middle" font-size="10" fill="#1e6640">N/kg = m/s²，两边一致</text>
</svg>
</div>
</div>
<p class="gx-note">六问其实只有一条判断：<b>能不能拆成 m、kg、s</b>——拆得动就是导出单位，拆不动就是基本单位。
换算只是在这条线上做乘除，别背结论，记住 1000 和 3600 的来路。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是卷面上真出现过的写法，右边是能得分的表述。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 牛顿是力学的基本单位之一。</p>
<p class="er-v">✓ 力学的基本单位是米、千克、秒；牛顿是导出单位，1 N = 1 kg·m/s²。</p>
<p class="er-w">N 能拆成 kg·m/s²，拆得动就不是基本单位。</p>
</div>
<div class="er">
<p class="er-x">✗ 这个箱子重 5 kg。</p>
<p class="er-v">✓ 这个箱子的质量是 5 kg，它受到的重力约为 49 N。</p>
<p class="er-w">kg 是质量单位，N 是力的单位；日常口语可以混，物理表述不能混。</p>
</div>
<div class="er">
<p class="er-x">✗ m = 500 g、x = 5 cm 直接代进 F = ma 和 x = ½at²。</p>
<p class="er-v">✓ 先换算：m = 0.50 kg，x = 0.05 m，再代入。</p>
<p class="er-w">单位不统一时，算出的数值没有物理意义，且错得不容易看出来。</p>
</div>
<div class="er">
<p class="er-x">✗ 72 km/h 就是 72 m/s。</p>
<p class="er-v">✓ 72 km/h = 72×1000/3600 m/s = 20 m/s。</p>
<p class="er-w">km/h 与 m/s 差 3.6 倍，直接把数字搬过去会大 3.6 倍。</p>
</div>
<div class="er">
<p class="er-x">✗ 单位符号随便写：kg 写成 KG，s 写成 S。</p>
<p class="er-v">✓ 单位符号有大小写规定：kg、m、s、N、J、W；只有以人名命名的单位符号大写。</p>
<p class="er-w">N、J、W 大写是因为来自牛顿、焦耳、瓦特；kg、m、s 不是人名，不大写。</p>
</div>
<div class="er">
<p class="er-x">✗ 算出 5，单位回头再「补」一个上去。</p>
<p class="er-v">✓ 单位跟着运算走：N ÷ kg 自动得到 m/s²，不需要事后猜。</p>
<p class="er-w">事后补单位是猜；跟着算出来的单位才是检验。</p>
</div>
</div>
</section>

<p class="gx-note" style="border-top:1px solid var(--line);padding-top:14px">下一节：<b>牛顿运动定律的应用</b>。
单位统一只是入场券，真正要练的是两类题：已知力求运动，已知运动求力。</p>

<script>
document.addEventListener("DOMContentLoaded", function () {
  var $ = GX.$;
  var stage = $("gxStage");
  var MV = 2, FS = 10;
  var X0 = 60, X1 = 330, Y0 = 286, Y1 = 176;
  var INVMAX = 2, AMAX = 20;

  function px(inv) { return X0 + inv / INVMAX * (X1 - X0); }
  function py(a) { return Y0 - Math.min(a, AMAX) / AMAX * (Y0 - Y1); }

  function calc(m) {
    var a = FS / m;
    var inv = 1 / m;
    var st, col, bg, sn;
    if (m >= 3.5) {
      st = "N/kg = m/s²"; col = "#2f8a5b"; bg = "#e6f6ee";
      sn = "质量大，a 小；单位始终是 m/s²";
    } else if (m >= 1) {
      st = "N/kg = m/s²"; col = "#2f8a5b"; bg = "#e6f6ee";
      sn = "10.0 N ÷ " + m.toFixed(1) + " kg = " + a.toFixed(1) + " m/s²";
    } else {
      st = "N/kg = m/s²"; col = "#b8791f"; bg = "#fdf3e0";
      sn = "质量很小，a 很大：10.0 ÷ " + m.toFixed(1) + " = " + a.toFixed(1) + " m/s²";
    }
    return { a: a, inv: inv, st: st, col: col, bg: bg, sn: sn };
  }

  function render() {
    var s = calc(MV);
    var x = px(s.inv), y = py(s.a);
    $("gxPt").setAttribute("cx", x);
    $("gxPt").setAttribute("cy", y);
    $("gxGuideH").setAttribute("x2", x);
    $("gxGuideH").setAttribute("y1", y);
    $("gxGuideH").setAttribute("y2", y);
    $("gxGuideV").setAttribute("x1", x);
    $("gxGuideV").setAttribute("x2", x);
    $("gxGuideV").setAttribute("y2", y);

    $("gxMNum").textContent = MV.toFixed(1) + " kg";
    $("gxANum").textContent = s.a.toFixed(1) + " m/s²";

    $("gxVa").textContent = MV.toFixed(1) + " kg";
    $("gxVb").textContent = s.a.toFixed(1) + " m/s²";
    $("gxVs").textContent = s.st;
    $("gxVsn").textContent = s.sn;
    $("gxStBox").style.background = s.bg;
    $("gxStBox").style.borderColor = s.col + "44";
    $("gxVs").style.color = s.col;
  }

  var ap = null, dragging = false, moved = false, downX = 0, suppressTap = false;

  function xToM(clientX) {
    var r = stage.getBoundingClientRect();
    var f = (clientX - r.left) / r.width;
    var inv = Math.max(0.1, Math.min(1, f)) * INVMAX;
    var m = 1 / inv;
    return Math.max(0.5, Math.min(5, Math.round(m * 10) / 10));
  }

  stage.addEventListener("pointerdown", function (ev) {
    dragging = true; moved = false; downX = ev.clientX;
    if (ap) ap.take();
    MV = xToM(ev.clientX);
    if (ap) ap.setValue(MV, false);
    render();
    try { stage.setPointerCapture(ev.pointerId); } catch (e) {}
  });
  stage.addEventListener("pointermove", function (ev) {
    if (!dragging) return;
    if (Math.abs(ev.clientX - downX) > 4) moved = true;
    MV = xToM(ev.clientX);
    if (ap) ap.setValue(MV, false);
    render();
  });
  stage.addEventListener("pointerup", function () {
    if (moved) suppressTap = true;
    dragging = false;
  });
  stage.addEventListener("click", function (ev) {
    if (!suppressTap) return;
    suppressTap = false;
    ev.stopImmediatePropagation();
  });

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  render();
  ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 5 }, { t: 1.6, v: 3 }, { t: 3.4, v: 3 }, { t: 5.0, v: 2 },
           { t: 7.5, v: 2 }, { t: 9.0, v: 1 }, { t: 10.6, v: 0.5 }, { t: 12.2, v: 0.5 },
           { t: 13.4, v: 5 }],
    keys: [5, 3, 2, 1, 0.5],
    value: MV, min: 0.5, max: 5, step: 0.1,
    idle: 5000,
    onChange: function (v) { MV = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc };
  window.__probe = function () {
    return {
      m: $("gxVa").textContent,
      a: $("gxVb").textContent,
      unit: $("gxVs").textContent,
      cnt: $("gxCnt").textContent
    };
  };
});
</script>
</body>
</html>
