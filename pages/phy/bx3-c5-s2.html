<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本原话，拆成三句</h2>
<div class="q-src">人教版必修第三册 · 第十三章第2节</div>

<div class="q">
<p class="q-t">“磁感应强度 B = F/(IL)，式中 F 是通电导线在磁场中受到的力，I 是导线中的电流，L 是导线的长度；导线要与磁场方向垂直。”</p>
<p class="q-b">B 是给“磁场有多强”定的一把尺：同一段导线、同样的电流，受力越大磁场越强。B 是矢量，方向规定为小磁针 N 极受力方向，单位特斯拉（T）。</p>
</div>

<div class="q">
<p class="q-t">“磁通量 Φ = BS，S 是垂直于磁场方向的有效面积。”</p>
<p class="q-b">磁通量数的是“穿过某个面的磁感线条数”。B 是单位面积上的条数，乘上迎着磁场的面积才是总数；单位韦伯（Wb），1 Wb = 1 T·m²。</p>
</div>

<div class="q">
<p class="q-t">“当磁感应强度 B 与平面法线成 θ 角时，Φ = BS cos θ。”</p>
<p class="q-b">面一斜，真正迎着磁场的只剩投影 S cosθ。θ = 0 时 Φ 最大；θ = 90° 时磁感线擦着面走，一条也穿不过去，Φ = 0。</p>
</div>

<p class="gx-note">读法：先问“这句在说磁场本身，还是某个面接到多少”，再看有没有 cosθ。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己算 θ = 60°，再看 θ = 0° 和 θ = 90°，后两个是送分的特殊角。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 磁通量的计算<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">匀强磁场的磁感应强度 B = 0.5 T，面积 S = 0.02 m² 的线圈放在磁场中，θ 为 B 与线圈平面法线的夹角。求：（1）θ = 60° 时穿过线圈的磁通量；（2）θ = 0° 时的磁通量；（3）θ = 90° 时的磁通量。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 认准三个量，公式只有一条</p>
<p class="s-b">B = 0.5 T、S = 0.02 m²，θ 是 B 与法线的夹角，Φ = BS cosθ。
S 就是线圈面积，cosθ 已把投影算进去，<b>不要再乘第二次</b>。</p>
<p class="s-k">用到：Φ = BS cosθ；θ 取 B 与法线的夹角。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 代 θ = 60°</p>
<p class="s-b">cos60° = 0.5，所以 <b>Φ = 0.5 × 0.02 × 0.5 = 5 × 10⁻³ Wb</b>（即 5 mWb）。</p>
<p class="s-k">用到：cos60° = 0.5。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · θ = 0°：面正对着磁场</p>
<p class="s-b">法线与 B 同向，线圈平面垂直于 B，磁感线垂直穿过整个面：
<b>Φ = 0.5 × 0.02 × 1 = 1 × 10⁻² Wb</b>，这是最大值。</p>
<p class="s-k">用到：cos0° = 1，此时 Φ = BS 最大。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · θ = 90°：面与磁场平行</p>
<p class="s-b">法线与 B 垂直，线圈平面与 B 平行，磁感线擦着面走：
<b>Φ = 0.5 × 0.02 × 0 = 0</b>。</p>
<p class="s-k">用到：cos90° = 0。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 写答案，说清 Φ 随谁变</p>
<p class="s-b">（1）5 × 10⁻³ Wb；（2）1 × 10⁻² Wb；（3）0。
只转了个角度，Φ 就从 1 × 10⁻² Wb 掉到 0——Φ 说的是“接到多少”，不是“磁场多强”。</p>
<p class="s-k">用到：Φ 随 θ 增大而减小，θ = 90° 时为 0。</p>
</li>
</ol>
<div class="exbar">
  <button id="gxNext" type="button">下一步</button>
  <span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）θ = 60°：<b>Φ = BS cos60° = 0.5 × 0.02 × 0.5 = 5 × 10⁻³ Wb</b>。<br>
（2）θ = 0°：<b>Φ = BS cos0° = 0.5 × 0.02 × 1 = 1 × 10⁻² Wb</b>。<br>
（3）θ = 90°：<b>Φ = BS cos90° = 0</b>，B 与线圈平面平行，没有磁感线穿过线圈。</p>
</div>
<p class="gx-note">高频扣分：S 再乘一次 cosθ；θ 取成 B 与线圈平面的夹角；θ = 90° 还写“Φ 最大”；单位写成 T。</p>
</div>
</section>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>考你会怎么考</h2>
<p class="gx-h2s">六个问法，一半在考“角度到底是谁和谁”。</p>

<div class="gx-qa">
<div class="qac">
<p class="q">B = F/(IL) 什么时候能用？</p>
<p class="a"><b>导线与磁场垂直、且磁场处处相同（匀强磁场）时。</b>不垂直时公式变为 B = F/(IL sinα)。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="导线与磁场垂直时才能用B等于F除以IL">
  <line x1="30" y1="66" x2="210" y2="66" stroke="#5a6472" stroke-width="5" stroke-linecap="round"/>
  <path d="M70 18V44M120 18V44M170 18V44" stroke="#2f6fd0" stroke-width="1.8" opacity=".7"/>
  <path d="M66 50l4-11 4 11zM116 50l4-11 4 11zM166 50l4-11 4 11z" fill="#2f6fd0" opacity=".7"/>
  <text x="188" y="32" font-size="9" fill="#2f6fd0">B</text>
  <text x="120" y="88" text-anchor="middle" font-size="9" fill="#6d28d9">F ⊥ B，I ⊥ B</text>
  <text x="120" y="116" text-anchor="middle" font-size="9.5" fill="#8a5c14">B = F / (IL)</text>
</svg>
</div>
<div class="qac">
<p class="q">Φ = BS 里的 S 指什么？</p>
<p class="a"><b>垂直于 B 的有效面积（投影面积），不是线圈本身的面积。</b>斜放时用 S cosθ，这就是 Φ = BS cosθ 的来历。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="斜放的面积要取垂直于磁场的投影">
  <line x1="50" y1="106" x2="190" y2="106" stroke="#cfd4da" stroke-width="1.3"/>
  <line x1="60" y1="106" x2="170" y2="46" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/>
  <line x1="170" y1="46" x2="170" y2="106" stroke="#8e97a4" stroke-width="1.2" stroke-dasharray="4 3"/>
  <path d="M60 114h110M60 110v8M170 110v8" stroke="#b8791f" stroke-width="1.6"/>
  <text x="112" y="128" text-anchor="middle" font-size="8.5" fill="#8a5c14">S⊥ = S cosθ</text>
  <text x="86" y="76" font-size="8.5" fill="#6d28d9">S</text>
</svg>
</div>
<div class="qac">
<p class="q">θ 是谁和谁的夹角？</p>
<p class="a"><b>B 与平面法线的夹角。</b>若给的是 B 与线圈平面的夹角 α，则 Φ = BS sinα（α + θ = 90°）。读题先找“法线”。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="θ是磁感应强度与法线的夹角">
  <line x1="40" y1="100" x2="200" y2="100" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
  <line x1="120" y1="100" x2="120" y2="26" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5 4"/>
  <polygon points="120,100 120,58 147,68" fill="#d8ccfb"/>
  <line x1="120" y1="100" x2="165" y2="48" stroke="#2f6fd0" stroke-width="2"/>
  <polygon points="171,42 159,46 165,56" fill="#2f6fd0"/>
  <text x="150" y="86" font-size="9" fill="#6d28d9">θ</text>
  <text x="127" y="34" font-size="8.5" fill="#6b7280">n 法线</text>
  <text x="176" y="44" font-size="9" fill="#2f6fd0">B</text>
  <text x="120" y="122" text-anchor="middle" font-size="8.5" fill="#6b7280">θ 取 B 与法线的夹角</text>
</svg>
</div>
<div class="qac">
<p class="q">磁通量的单位是什么？</p>
<p class="a"><b>韦伯，符号 Wb；1 Wb = 1 T·m²</b>，也可写成 1 V·s。写成 T 就把 B 和 Φ 混了。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="磁通量的单位是韦伯">
  <rect x="30" y="34" width="180" height="34" rx="9" fill="#f5f3ff" stroke="#d8ccfb"/>
  <text x="120" y="57" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">1 Wb = 1 T·m²</text>
  <text x="120" y="90" text-anchor="middle" font-size="9" fill="#6b7280">Φ 的单位：韦伯（Wb）</text>
  <text x="120" y="110" text-anchor="middle" font-size="9" fill="#a04437">T 是 B 的单位，别写混</text>
</svg>
</div>
<div class="qac">
<p class="q">B 和 Φ 到底差在哪？</p>
<p class="a"><b>B 描述磁场本身的强弱（磁感线疏密），放不放线圈都一样；Φ 描述穿过某个面的条数，与 B、S、θ 都有关。</b>换个大线圈，B 没变，Φ 变大。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="强磁场小线圈与弱磁场大线圈的对比">
  <path d="M42 28V92M58 28V92M74 28V92M90 28V92M160 28V92M206 28V92" stroke="#2f6fd0" stroke-width="1.6" opacity=".75"/>
  <circle cx="66" cy="62" r="13" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <ellipse cx="183" cy="62" rx="42" ry="20" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="66" y="116" text-anchor="middle" font-size="8.5" fill="#6b7280">B 强 · 面小</text>
  <text x="183" y="116" text-anchor="middle" font-size="8.5" fill="#6b7280">B 弱 · 面大</text>
</svg>
</div>
<div class="qac">
<p class="q">磁通量有正负吗？</p>
<p class="a"><b>有。</b>规定从某一侧穿过为正，反向穿过取负；算总条数时常取绝对值，Φ 是标量，正负只表示方向。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="磁通量有正负，取决于从哪一侧穿过">
  <line x1="40" y1="72" x2="200" y2="72" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/>
  <line x1="72" y1="44" x2="72" y2="68" stroke="#2f8a5b" stroke-width="2"/>
  <polygon points="72,34 66,48 78,48" fill="#2f8a5b"/>
  <text x="82" y="46" font-size="9" fill="#1e6640">+Φ</text>
  <line x1="168" y1="100" x2="168" y2="76" stroke="#a04437" stroke-width="2"/>
  <polygon points="168,110 162,96 174,96" fill="#a04437"/>
  <text x="178" y="104" font-size="9" fill="#a04437">−Φ</text>
  <text x="120" y="124" text-anchor="middle" font-size="8.5" fill="#6b7280">规定一侧为正，反向穿过取负</text>
</svg>
</div>
</div>
<p class="gx-note">六问归成一条：<b>B 只管磁场，Φ 一定要配一个面；θ 认准法线，单位认准 Wb</b>。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>六条易错，逐条改</h2>

<div class="er">
<p class="er-x">✗ 导线受力 F 越大 B 越大，所以 B 与 F 成正比。</p>
<p class="er-v">✓ B 由磁场本身决定，B = F/(IL) 是量它的办法，不是正比关系。</p>
<p class="er-w">换根长导线、加大电流，F 变大，B 没变——B 不由 F 决定。</p>
</div>
<div class="er">
<p class="er-x">✗ Φ = BS 什么情况都能直接用。</p>
<p class="er-v">✓ 只有 B 与面垂直时才能直接用 BS，斜放要换成 BS cosθ。</p>
<p class="er-w">S 本就是“垂直于 B 的有效面积”，面斜了要折 cosθ。</p>
</div>
<div class="er">
<p class="er-x">✗ θ 是 B 与线圈平面之间的夹角。</p>
<p class="er-v">✓ θ 是 B 与平面法线的夹角。</p>
<p class="er-w">若给的是 B 与平面的夹角 α，就要用 Φ = BS sinα。</p>
</div>
<div class="er">
<p class="er-x">✗ 磁通量的单位是特斯拉 T。</p>
<p class="er-v">✓ 磁通量的单位是韦伯 Wb，1 Wb = 1 T·m²。</p>
<p class="er-w">T 乘 m² 才是 Wb；单位写错说明概念没分清。</p>
</div>
<div class="er">
<p class="er-x">✗ B 大的地方，Φ 一定大。</p>
<p class="er-v">✓ Φ 还取决于面积 S 和夹角 θ，B 大而 Φ 小完全可能。</p>
<p class="er-w">强磁场配小线圈，可能还不如弱磁场配大线圈，见图 3。</p>
</div>
<div class="er">
<p class="er-x">✗ 磁通量是矢量，方向就是磁场方向。</p>
<p class="er-v">✓ Φ 是标量，正负只表示从哪一侧穿过。</p>
<p class="er-w">Φ 没有方向，不能按平行四边形合成，直接按正负代数相加。</p>
</div>

<p class="gx-note">把“B 管磁场、Φ 管这个面；θ 认法线；单位 Wb”记住，这一节的选择题基本不丢分。</p>
</section>

<p class="page-foot">教材依据：人教版《物理》必修第三册（2019年版）第十三章第2节“磁感应强度 磁通量”。课文引文按教材表述整理，页码以纸质书为准。</p>

<script src="../../assets/page.js"></script>
<script src="../../assets/gx.js"></script>
<script src="../../assets/autopilot.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var $ = GX.$;
  var S = 0.02, CX = 170, CY = 155, R = 78, B = 0.5, TH = 0;
  var slB = $("gxSlB"), slT = $("gxSlT"), ap = null;
  var DIG = "⁰¹²³⁴⁵⁶⁷⁸⁹";

  function f(v) { return (Math.round(v * 10) / 10).toFixed(1); }
  function flux() { return B * S * Math.cos(TH * Math.PI / 180); }
  function sup(n) {
    var s = n < 0 ? "⁻" : "", a = String(Math.abs(n)), o = "", i;
    for (i = 0; i < a.length; i++) o += DIG.charAt(+a.charAt(i));
    return s + o;
  }
  function sci(v) {
    if (!(v > 0)) return "0";
    var e = Math.floor(Math.log10(v)), m = v / Math.pow(10, e);
    if (m >= 9.95) { m = m / 10; e += 1; }
    return m.toFixed(1) + "×10" + sup(e);
  }

  function render() {
    var phi = flux(), rad = TH * Math.PI / 180;
    var ux = Math.cos(rad), uy = -Math.sin(rad);
    var nx = Math.sin(rad), ny = Math.cos(rad);
    var ax = f(CX - ux * R), ay = f(CY - uy * R);
    var bx = f(CX + ux * R), by = f(CY + uy * R);
    var s = "";
    if (TH > 5) {
      s += '<path d="M' + CX + ' ' + CY + ' L' + CX + ' ' + f(CY + 46) + ' L' +
        f(CX + nx * 46) + ' ' + f(CY + ny * 46) + ' Z" fill="#d8ccfb" opacity=".55"/>';
      s += '<text x="' + f(CX + nx * 60) + '" y="' + f(CY + 62 + ny * 6) +
        '" font-size="10" fill="#6d28d9">θ</text>';
    }
    s += '<line x1="' + f(CX - nx * 74) + '" y1="' + f(CY - ny * 74) + '" x2="' +
      f(CX + nx * 74) + '" y2="' + f(CY + ny * 74) +
      '" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5 4"/>';
    s += '<text x="' + f(CX + nx * 80 + 3) + '" y="' + f(CY + ny * 80 + 3) +
      '" font-size="9.5" fill="#6b7280">n</text>';
    s += '<line x1="' + ax + '" y1="' + ay + '" x2="' + bx + '" y2="' + by +
      '" stroke="#7c3aed" stroke-width="6" stroke-linecap="round"/>';
    s += '<circle cx="' + ax + '" cy="' + ay + '" r="5" fill="#7c3aed"/>';
    s += '<circle cx="' + bx + '" cy="' + by + '" r="5" fill="#7c3aed"/>';
    s += '<text x="' + f(CX - ux * (R + 18) - 4) + '" y="' + f(CY - uy * (R + 18) + 4) +
      '" font-size="10" fill="#6d28d9">S</text>';
    $("gxDyn").innerHTML = s;

    $("gxBar").setAttribute("width", f(250 * phi / 0.02));
    $("gxBarT").textContent = "Φ = " + sci(phi) + " Wb";
    $("gxVb").textContent = B.toFixed(2) + " T";
    $("gxVt").textContent = TH.toFixed(1) + "°";
    $("gxVf").textContent = sci(phi) + " Wb";
    $("gxTake").textContent = "θ = " + TH.toFixed(0) + "°，有效面积 S cosθ = " +
      (S * Math.cos(rad)).toFixed(3) + " m²，Φ = " + sci(phi) +
      " Wb；θ 增大，有效面积被压扁，Φ 减小。";
    $("gxStateNote").textContent = TH < 1
      ? "状态：θ = 0°，B 与法线同向，Φ 达到最大值 " + sci(phi) + " Wb。"
      : (TH > 89
        ? "状态：θ = 90°，B 与线圈平面平行，一条磁感线也穿不过去，Φ = 0。"
        : "状态：θ 增大，Φ 减小（cosθ 变小，有效面积变小）。");
  }

  function setMode(m) {
    var b = $("gxAp"), t = $("gxApTxt");
    if (!b) return;
    b.classList.toggle("is-auto", m === "auto");
    b.classList.toggle("is-manual", m !== "auto");
    if (t) t.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  if (slB) slB.addEventListener("input", function () {
    B = +slB.value; render(); if (ap) ap.take();
  });

  render();
  ap = AutoPilot.create({
    mount: $("gxStage"), follow: slT,
    loop: [{ t: 0, v: 0 }, { t: 2.2, v: 0 }, { t: 3.7, v: 30 }, { t: 5.7, v: 30 },
           { t: 7.2, v: 60 }, { t: 9.7, v: 60 }, { t: 11.2, v: 90 }, { t: 13.2, v: 90 },
           { t: 14.7, v: 0 }],
    keys: [0, 30, 60, 90], value: 0, min: 0, max: 90, step: 1, idle: 5000,
    onChange: function (v) { TH = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { flux: flux, sci: sci };
});
</script>
