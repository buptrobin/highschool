<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本原话，拆成三句</h2>
<div class="q-src">人教版必修第三册 · 第十二章第 1 节</div>

<div class="q">
<p class="q-t">“电功 W = UIt，电功率 P = UI；电流做功的过程就是电能转化为其他形式能的过程。”</p>
<p class="q-b">电流把电能搬成内能、机械能、化学能。搬多少看 W = UIt，搬多快看 P = UI：U 是每库仑电荷放出的能量，I 是每秒流过多少库仑。</p>
</div>

<div class="q">
<p class="q-t">“焦耳定律 Q = I²Rt；纯电阻电路中 W = Q，非纯电阻电路中 W &gt; Q。”</p>
<p class="q-b">电阻发热只由 I、R、t 决定。纯电阻没别处可去，W 全变 Q；电动机还要输出机械能，W 里有一部分不是热。</p>
</div>

<div class="q">
<p class="q-t">“纯电阻电路中欧姆定律成立 I = U/R；电动机、电解槽等非纯电阻电路中欧姆定律不成立。”</p>
<p class="q-b">前提是电能全变内能。电动机的 U 要分一份给机械能，不能被 R 全吃掉，只能分开算 P<sub>电</sub> = UI、P<sub>热</sub> = I²R。</p>
</div>

<p class="gx-note">判断链：<b>先问是不是纯电阻 → 再定 W 与 Q 等不等 → 最后才选公式</b>。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己写，再点“下一步”。关键是：<b>U = 6 V 不变，换成电动机，算法就完全不同</b>。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 电功、电热与机械功率<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">R = 2 Ω 的电阻接在 U = 6 V 两端，通电 10 s。求：（1）电流 I；（2）电功率 P；（3）10 s 内电功 W 与电热 Q。
（4）换成电动机，U = 6 V 时电流为 1 A、线圈电阻仍为 2 Ω，求发热功率与机械功率。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 先判电路性质</p>
<p class="s-b">前 3 问是纯电阻：<b>欧姆定律成立、W = Q</b>。第 4 问是电动机：电能还要变机械能，<b>欧姆定律不成立、W &gt; Q</b>。判错，后面全错。</p>
<p class="s-k">用到：纯电阻 I = U/R、W = Q。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 纯电阻求电流</p>
<p class="s-b">I = U/R = 6 / 2 = <b>3 A</b>。这个 3 A 只对电阻成立；第 4 问同样是 6 V、2 Ω，电流却只有 1 A。</p>
<p class="s-k">用到：I = U/R，仅限纯电阻。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 求电功率</p>
<p class="s-b">P = UI = 6 × 3 = <b>18 W</b>。纯电阻可换写成 P = I²R = 9 × 2 = 18 W，两路一致，用来验算。</p>
<p class="s-k">用到：P = UI 普适；I²R、U²/R 仅纯电阻。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 求电功与电热</p>
<p class="s-b">W = Pt = 18 × 10 = <b>180 J</b>；Q = I²Rt = 9 × 2 × 10 = <b>180 J</b>。两者相等，验证“纯电阻 W = Q”。</p>
<p class="s-k">用到：W = UIt、Q = I²Rt 都普适。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 换成电动机，改成分账</p>
<p class="s-b">P<sub>电</sub> = UI = 6 × 1 = <b>6 W</b>；P<sub>热</sub> = I²R = 1 × 2 = <b>2 W</b>；P<sub>机</sub> = 6 − 2 = <b>4 W</b>。
效率 η = 4 / 6 ≈ 67%。注意 U/R = 3 A ≠ 1 A，正好说明欧姆定律不成立。</p>
<p class="s-k">用到：P机 = UI − I²R。</p>
</li>
</ol>
<div class="exbar">
  <button id="gxNext" type="button">下一步</button>
  <span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）<b>I = U/R = 3 A</b>；（2）<b>P = UI = 18 W</b>；（3）<b>W = Pt = 180 J</b>，纯电阻 <b>Q = W = 180 J</b>；（4）<b>P热 = I²R = 2 W</b>，<b>P机 = UI − I²R = 4 W</b>。</p>
</div>
<p class="gx-note">扣分点：电动机也用 I = U/R；把 Q 写成 UIt；纯电阻题里把 W 和 Q 相加；机械功率忘了减发热。</p>
</div>
</section>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>考你会怎么考</h2>
<p class="gx-h2s">六种问法，一半在考“这个式子管不管用”。</p>

<div class="gx-qa">
<div class="qac">
<p class="q">电功用什么式子算？</p>
<p class="a"><b>W = UIt，任何用电器都适用。</b>它算的是“电能转化了多少”的总账，只看 U、I、t。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="电功等于电压乘电流乘时间">
  <rect x="38" y="24" width="50" height="28" rx="5" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="63" y="43" text-anchor="middle" font-size="10" fill="#6d28d9">U</text>
  <text x="98" y="44" font-size="10" fill="#6b7280">×</text>
  <rect x="108" y="24" width="50" height="28" rx="5" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="133" y="43" text-anchor="middle" font-size="10" fill="#6d28d9">I</text>
  <text x="168" y="44" font-size="10" fill="#6b7280">×</text>
  <rect x="178" y="24" width="34" height="28" rx="5" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="195" y="43" text-anchor="middle" font-size="10" fill="#6d28d9">t</text>
  <text x="120" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">W = UIt</text>
  <text x="120" y="106" text-anchor="middle" font-size="8.5" fill="#6b7280">普适，单位 J</text>
</svg>
</div>
<div class="qac">
<p class="q">电热用什么式子算？</p>
<p class="a"><b>Q = I²Rt，同样普适。</b>热量只跟 I、R、t 有关；纯电阻才能改写成 Q = UIt。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="电流通过电阻发热，热量等于电流平方乘电阻乘时间">
  <line x1="24" y1="54" x2="86" y2="54" stroke="#8e97a4" stroke-width="2"/>
  <rect x="86" y="38" width="60" height="32" rx="5" fill="#fdf3e0" stroke="#b8791f" stroke-width="1.5"/>
  <text x="116" y="59" text-anchor="middle" font-size="10" font-weight="700" fill="#8a5c14">R</text>
  <line x1="146" y1="54" x2="208" y2="54" stroke="#8e97a4" stroke-width="2"/>
  <path d="M100 26 Q108 16 116 26 Q124 16 132 26" fill="none" stroke="#e8590c" stroke-width="1.5"/>
  <path d="M100 82 Q108 72 116 82 Q124 72 132 82" fill="none" stroke="#e8590c" stroke-width="1.5"/>
  <text x="120" y="108" text-anchor="middle" font-size="12" font-weight="700" fill="#8a5c14">Q = I²Rt</text>
  <text x="120" y="126" text-anchor="middle" font-size="8.5" fill="#6b7280">只与 I、R、t 有关</text>
</svg>
</div>
<div class="qac">
<p class="q">纯电阻为什么 W = Q？</p>
<p class="a"><b>电能只有变内能一条路，电功与电热是同一笔账。</b>于是 W = UIt = I²Rt = Q，欧姆定律也成立。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="纯电阻中电能全部变为内能">
  <rect x="26" y="34" width="86" height="44" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="69" y="53" text-anchor="middle" font-size="9.5" fill="#6d28d9">电能 W</text>
  <text x="69" y="69" text-anchor="middle" font-size="8.5" fill="#6b7280">UIt</text>
  <polygon points="146,56 130,49 130,63" fill="#b8791f"/>
  <text x="138" y="45" text-anchor="middle" font-size="8" fill="#b8791f">100%</text>
  <rect x="156" y="34" width="58" height="44" rx="6" fill="#fdf3e0" stroke="#b8791f" stroke-width="1.3"/>
  <text x="185" y="53" text-anchor="middle" font-size="9.5" fill="#8a5c14">内能</text>
  <text x="185" y="69" text-anchor="middle" font-size="8.5" fill="#6b7280">I²Rt</text>
  <text x="120" y="104" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6d28d9">W = Q，I = U/R</text>
</svg>
</div>
<div class="qac">
<p class="q">电动机为什么不能用 I = U/R？</p>
<p class="a"><b>U 里有一部分变成了机械能，没有全压在 R 上。</b>实际电流比 U/R 小，只能分算 UI 与 I²R。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="电动机电流由题目给出，不能直接除以电阻">
  <circle cx="120" cy="44" r="20" fill="#eef5fc" stroke="#2f6fd0" stroke-width="1.5"/>
  <text x="120" y="48" text-anchor="middle" font-size="10" font-weight="700" fill="#2f6fd0">M</text>
  <text x="120" y="80" text-anchor="middle" font-size="8.5" fill="#6b7280">U = 6 V，I = 1 A，R = 2 Ω</text>
  <text x="76" y="102" text-anchor="middle" font-size="8.5" fill="#1e6640">机械 4 W</text>
  <text x="172" y="102" text-anchor="middle" font-size="8.5" fill="#a04437">发热 2 W</text>
  <text x="120" y="124" text-anchor="middle" font-size="8.5" fill="#6d28d9">U/R = 3 A ≠ 1 A</text>
</svg>
</div>
<div class="qac">
<p class="q">效率怎么算？会超过 100% 吗？</p>
<p class="a"><b>η = P有用/P总 × 100%，一定小于 100%。</b>算出大于 100%，就是把有用和总弄反了。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="效率等于有用功比总功">
  <rect x="34" y="34" width="172" height="22" rx="5" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.3"/>
  <rect x="34" y="34" width="118" height="22" rx="5" fill="#cfe4f7"/>
  <text x="93" y="49" text-anchor="middle" font-size="8.5" fill="#2f6fd0">有用</text>
  <text x="182" y="49" text-anchor="middle" font-size="8.5" fill="#6b7280">损失</text>
  <text x="120" y="80" text-anchor="middle" font-size="10" font-weight="700" fill="#6d28d9">η = P有用 / P总</text>
  <text x="120" y="104" text-anchor="middle" font-size="8.5" fill="#6b7280">4 W / 6 W ≈ 67%</text>
  <text x="120" y="124" text-anchor="middle" font-size="8.5" fill="#8a5c14">永远分不完</text>
</svg>
</div>
<div class="qac">
<p class="q">W 和 P 的单位怎么分？</p>
<p class="a"><b>W 是能量（J、kW·h），P 是功率（W、kW）。</b>1 kW·h = 3.6×10⁶ J，是能量不是功率。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="电功单位焦耳与千瓦时，电功率单位瓦">
  <rect x="18" y="30" width="96" height="42" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="66" y="47" text-anchor="middle" font-size="9.5" fill="#6d28d9">电功 W</text>
  <text x="66" y="63" text-anchor="middle" font-size="9" font-weight="700" fill="#6d28d9">J、kW·h</text>
  <rect x="126" y="30" width="96" height="42" rx="6" fill="#fdf3e0" stroke="#b8791f" stroke-width="1.3"/>
  <text x="174" y="47" text-anchor="middle" font-size="9.5" fill="#8a5c14">电功率 P</text>
  <text x="174" y="63" text-anchor="middle" font-size="9" font-weight="700" fill="#8a5c14">W、kW</text>
  <text x="120" y="98" text-anchor="middle" font-size="9" fill="#3a3a35">1 kW·h = 3.6 × 10⁶ J</text>
  <text x="120" y="120" text-anchor="middle" font-size="8.5" fill="#6b7280">能量 ≠ 功率</text>
</svg>
</div>
</div>
<p class="gx-note">六问归一句：<b>W = UIt 与 Q = I²Rt 永远对，其余式子先问“是不是纯电阻”</b>。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>六条易错，逐条改</h2>

<div class="er">
<p class="er-x">✗ 电功总等于电热，W = Q 到哪都能用。</p>
<p class="er-v">✓ 只有纯电阻 W = Q，非纯电阻 W &gt; Q。</p>
<p class="er-w">电动机有一部分电能转成了机械能，这份不发热。</p>
</div>
<div class="er">
<p class="er-x">✗ 电动机也能用 I = U/R 求电流。</p>
<p class="er-v">✓ 欧姆定律不成立，电流由题目给或由 P = UI 求。</p>
<p class="er-w">U 还要分给机械能，只有全压在 R 上才符合欧姆定律。</p>
</div>
<div class="er">
<p class="er-x">✗ W = UIt 只适用于纯电阻。</p>
<p class="er-v">✓ W = UIt 普适，纯电阻只是能改写成 I²Rt、U²t/R。</p>
<p class="er-w">不普适的是改写式，不是电功的定义。</p>
</div>
<div class="er">
<p class="er-x">✗ 电热可以用 Q = UIt 算。</p>
<p class="er-v">✓ 普适式是 Q = I²Rt，Q = UIt 只在纯电阻下成立。</p>
<p class="er-w">非纯电阻里 UIt 是总功，比发热大。</p>
</div>
<div class="er">
<p class="er-x">✗ 效率算得好可以超过 100%。</p>
<p class="er-v">✓ 效率一定小于 100%。</p>
<p class="er-w">总功包含所有损失，有用功只是其中一部分。</p>
</div>
<div class="er">
<p class="er-x">✗ kW·h 是电功率的单位。</p>
<p class="er-v">✓ kW·h 是电功（电能）的单位，功率用 W 或 kW。</p>
<p class="er-w">1 kW·h = 1000 W × 3600 s = 3.6×10⁶ J，量纲是能量。</p>
</div>

<p class="gx-note">压成一句：<b>先判纯电阻，再定 W 与 Q 等不等</b>；判断题里出现“都”“总”“一定”，多半是错的。</p>
</section>

<script>
document.addEventListener("DOMContentLoaded", function () {
  var $ = GX.$;
  var R = 2.0, U = 2.0;
  var stage = $("gxStage");

  function calc(u) {
    var i = u / R;
    return { i: i, p: u * i };
  }

  function render() {
    var s = calc(U);
    var k = (U - 1) / 9;
    $("gxVu").textContent = U.toFixed(1) + " V";
    $("gxVi").textContent = s.i.toFixed(2) + " A";
    $("gxVp").textContent = s.p.toFixed(1) + " W";
    $("gxRead").textContent = "U = " + U.toFixed(1) + " V　I = " + s.i.toFixed(2) +
      " A　P = " + s.p.toFixed(1) + " W";
    $("gxGlow").setAttribute("opacity", (0.08 + 0.82 * k).toFixed(2));
    $("gxUm").setAttribute("cx", (45 + 270 * k).toFixed(1));
    $("gxUbar").setAttribute("x2", (45 + 270 * k).toFixed(1));
    $("gxArr1").setAttribute("opacity", (0.35 + 0.65 * k).toFixed(2));
    $("gxArr2").setAttribute("opacity", (0.35 + 0.65 * k).toFixed(2));
    $("gxTake").textContent = "U = " + U.toFixed(1) + " V 时 I = " + s.i.toFixed(2) +
      " A、P = " + s.p.toFixed(1) + " W；电压翻一倍，电流翻倍，功率变四倍。";
    $("gxStateNote").textContent = "状态：纯电阻，W = Q；P = " + s.p.toFixed(1) +
      " W 全部变成内能，电压越高电阻越热。";
  }

  var ap = null;
  function setMode(m) {
    var b = $("gxAp"), t = $("gxApTxt");
    if (!b) return;
    b.classList.toggle("is-auto", m === "auto");
    b.classList.toggle("is-manual", m !== "auto");
    if (t) t.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  render();
  ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 1 }, { t: 1.2, v: 1 }, { t: 2.4, v: 3 }, { t: 3.6, v: 6 },
           { t: 6.1, v: 6 }, { t: 7.4, v: 10 }, { t: 8.8, v: 4 }, { t: 10.2, v: 1 }],
    keys: [1, 3, 6, 10],
    value: U, min: 1, max: 10, step: 0.1,
    idle: 5000,
    onChange: function (v) { U = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc, R: R };
});
</script>
