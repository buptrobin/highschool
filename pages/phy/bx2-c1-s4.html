<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">三句课本原意，配三句人话。抛体的全部公式都从这三句里长出来。</p>

<div class="gx-quote">
<p class="q-t">一 · 平抛运动的定义<span class="q-src">人教版必修第二册 · 第五章第 4 节</span></p>
<p class="q-b">将物体以一定的初速度沿水平方向抛出，如果物体只受重力作用，这样的运动叫平抛运动。</p>
<p class="q-n">人话：两个条件缺一不可——<b>初速度水平</b>（竖直分速为零）、<b>只受重力</b>（不计空气阻力）。斜向上或斜向下抛出，就不叫平抛，叫斜抛。</p>
</div>

<div class="gx-quote">
<p class="q-t">二 · 分解为两个方向<span class="q-src">人教版必修第二册 · 第五章第 4 节</span></p>
<p class="q-b">平抛运动可以分解为水平方向的匀速直线运动和竖直方向的自由落体运动。</p>
<p class="q-n">人话：水平方向没有力，所以 vx 从头到尾等于 v₀；竖直方向只有重力，所以 vy 从 0 开始每秒增加 g。两段运动共用同一个时间 t，这是列方程的接口。</p>
</div>

<div class="gx-quote">
<p class="q-t">三 · 斜抛的初速度<span class="q-src">人教版必修第二册 · 第五章第 4 节</span></p>
<p class="q-b">斜抛运动的初速度与水平方向成 θ 角，水平方向做匀速直线运动，竖直方向做匀变速直线运动，轨迹是抛物线。</p>
<p class="q-n">人话：斜抛和平抛的差别只在初速度方向。先把 v₀ 拆成 v₀cosθ（水平）与 v₀sinθ（竖直），之后照样分两列算，不用另背一套公式。</p>
</div>

<p class="gx-note">方向约定：本页水平向右为 x 正方向、竖直向上为 y 正方向，抛出点为原点。
速度方向用 tanθ = vy/vx 表示，θ 是速度与水平方向的夹角；抛射角也记作 θ，正文会说明指的是哪一个。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己写，再点「下一步」。这题把斜抛的三个特征量一次算完。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 斜抛的三个特征量<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">以 v₀ = 20 m/s 的初速度、与水平方向成 θ = 37° 角斜向上抛出一小球，g 取 10 m/s²，不计空气阻力，小球落回与抛出点等高的地面。求：（1）小球上升的最大高度；（2）小球在空中的飞行时间；（3）小球的水平射程；（4）落地速度的大小和方向。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 建坐标，拆初速度</p>
<p class="s-b">以抛出点为原点，水平向右为 x 正方向、竖直向上为 y 正方向。把 v₀ 拆成两个分量：
<b>vx = v₀cos37° = 20 × 0.8 = 16 m/s</b>，<b>vy = v₀sin37° = 20 × 0.6 = 12 m/s</b>。
水平方向没有力，vx 全程保持 16 m/s；竖直方向只受重力，vy 每秒减少 10 m/s。</p>
<p class="s-k">用到：sin37° = 0.6，cos37° = 0.8；分解后两列各算各的，靠时间 t 联系。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 求最大高度</p>
<p class="s-b">最高点处竖直分速度为零：0 = vy − gt上，得 t上 = vy/g = 12/10 = 1.2 s。
最大高度 <b>H = vy²/(2g) = 12²/20 = 7.2 m</b>。用斜抛公式核对：H = v₀²sin²θ/(2g) = 400 × 0.36 / 20 = 7.2 m，一致。</p>
<p class="s-k">用到：最高点的条件是 vy = 0，不是速度为零；H 只由竖直分量决定。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 求飞行时间</p>
<p class="s-b">落回与抛出点等高的地面，竖直位移为零：0 = vy·t − ½gt²，解得 t = 2vy/g = 2 × 12/10 = <b>2.4 s</b>。
上下对称，上升 1.2 s、下降 1.2 s。这里<b>不能用 t = v₀/g</b>：v₀ 是合速度，不是竖直分速度。</p>
<p class="s-k">用到：竖直方向是匀变速，回到同一高度时 t = 2vy/g。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 求水平射程</p>
<p class="s-b">水平方向是匀速直线运动：<b>R = vx·t = 16 × 2.4 = 38.4 m</b>。
用射程公式核对：R = v₀²sin2θ/g = 400 × sin74° / 10；由 sin74° = 2sin37°cos37° = 0.96，得 R = 38.4 m，一致。</p>
<p class="s-k">用到：射程由水平速度和总时间共同决定，两个方向在 t 上汇合。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 求落地速度</p>
<p class="s-b">落地时 vx = 16 m/s，vy = −12 m/s（与抛出时等大反向）。大小
<b>v = √(16² + 12²) = √400 = 20 m/s</b>，与抛出速度大小相同。
方向 tanα = 12/16 = 0.75，α = 37°，即<b>与水平方向成 37° 斜向下</b>。同一高度落地，速度大小不变、方向与抛出时关于水平线对称。</p>
<p class="s-k">用到：落地速度用勾股定理合成，方向用 tanα = |vy|/vx；不要只写「20 m/s」而漏掉方向。</p>
</li>
</ol>
<div class="exbar">
  <button id="gxNext" type="button">下一步</button>
  <span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">以抛出点为原点，水平向右为 x 正方向、竖直向上为 y 正方向。vx = v₀cos37° = 16 m/s，vy = v₀sin37° = 12 m/s。<br>
（1）最高点 vy = 0，t上 = vy/g = 1.2 s，<b>H = vy²/(2g) = 7.2 m</b>。<br>
（2）落回等高地面，<b>t = 2vy/g = 2.4 s</b>。<br>
（3）<b>R = vx·t = 16 × 2.4 = 38.4 m</b>。<br>
（4）落地时 vx = 16 m/s、vy = −12 m/s，<b>v = √(16² + 12²) = 20 m/s</b>，方向与水平方向成 37° 斜向下。</p>
</div>
<p class="gx-note">阅卷高频扣分：把最高点写成「速度为零」；用 v₀/g 求时间；射程只乘 sinθ 不乘 cosθ；
落地速度只给大小、不给方向。</p>
</div>
</section>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>考你会怎么考</h2>
<p class="gx-h2s">六种问法，一半在考「哪个量由哪个分量决定」。</p>

<div class="gx-qa">
<div class="qac">
<p class="q">平抛和斜抛的共同点是什么？</p>
<p class="a"><b>都只受重力，加速度都是 g 向下。</b>水平方向都做匀速直线运动，竖直方向都做匀变速直线运动；平抛只是斜抛在 θ = 0° 时的特例。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="平抛与斜抛都只受重力，水平匀速、竖直匀变速">
  <line x1="18" y1="110" x2="222" y2="110" stroke="#cfd4da" stroke-width="1.2"/>
  <path d="M30 82 Q100 82 150 108" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <path d="M60 104 Q110 50 190 104" fill="none" stroke="#2f6fd0" stroke-width="2"/>
  <text x="38" y="104" font-size="8.5" fill="#7c3aed">平抛</text>
  <text x="146" y="52" font-size="8.5" fill="#2f6fd0">斜抛</text>
  <line x1="30" y1="82" x2="68" y2="82" stroke="#2f8a5b" stroke-width="2"/>
  <polygon points="76,82 64,77 64,87" fill="#2f8a5b"/>
  <text x="34" y="74" font-size="9" fill="#1e6640">v₀ 水平</text>
  <line x1="120" y1="33" x2="120" y2="62" stroke="#b8402f" stroke-width="2.2"/>
  <polygon points="120,72 115,58 125,58" fill="#b8402f"/>
  <text x="128" y="56" font-size="9" fill="#b8402f">g</text>
  <text x="120" y="126" text-anchor="middle" font-size="9" fill="#6b7280">水平匀速 + 竖直匀变速</text>
</svg>
</div>
<div class="qac">
<p class="q">射程最大为什么在 45°？</p>
<p class="a"><b>因为 R = v₀²sin2θ/g，而 sin2θ 在 2θ = 90° 时取最大值 1。</b>θ = 45° 时 R = v₀²/g，其余角度都小于它；15° 与 75° 的 sin2θ 相同，射程也相同。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="射程正弦曲线在四十五度取最大值">
  <line x1="24" y1="104" x2="220" y2="104" stroke="#5a6472" stroke-width="1.2"/>
  <line x1="24" y1="104" x2="24" y2="26" stroke="#5a6472" stroke-width="1.2"/>
  <path d="M24 104 Q74 18 122 32 Q170 46 220 104" fill="none" stroke="#7c3aed" stroke-width="2.2"/>
  <line x1="122" y1="32" x2="122" y2="104" stroke="#b8791f" stroke-width="1.2" stroke-dasharray="4 3"/>
  <circle cx="122" cy="32" r="4" fill="#fff" stroke="#b8791f" stroke-width="2"/>
  <text x="122" y="24" text-anchor="middle" font-size="9" font-weight="700" fill="#8a5c14">45°，R max</text>
  <text x="30" y="118" font-size="8.5" fill="#6b7280">0°</text>
  <text x="208" y="118" text-anchor="end" font-size="8.5" fill="#6b7280">90°</text>
  <text x="72" y="60" font-size="9" fill="#6d28d9">R = 40sin2θ</text>
</svg>
</div>
<div class="qac">
<p class="q">最大高度在什么角度最大？</p>
<p class="a"><b>θ 越接近 90°，H 越大；θ = 90° 时 H = v₀²/(2g) = 20 m。</b>此时轨迹退化成竖直上抛，射程为 0。H = v₀²sin²θ/(2g)，只由竖直分量决定。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="抛射角越大最大高度越高，接近九十度时最高">
  <line x1="18" y1="116" x2="222" y2="116" stroke="#cfd4da" stroke-width="1.2"/>
  <path d="M34 116 Q100 96 176 116" fill="none" stroke="#2f6fd0" stroke-width="1.6"/>
  <path d="M34 116 Q86 56 148 116" fill="none" stroke="#7c3aed" stroke-width="1.8"/>
  <path d="M34 116 Q56 34 86 116" fill="none" stroke="#b8791f" stroke-width="2"/>
  <line x1="34" y1="116" x2="34" y2="34" stroke="#b8791f" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="40" y="44" font-size="9" fill="#8a5c14">H = 20sin²θ</text>
  <text x="186" y="108" font-size="8.5" fill="#2f6fd0">θ 小</text>
  <text x="98" y="50" font-size="8.5" fill="#6d28d9">θ 大</text>
  <text x="120" y="128" text-anchor="middle" font-size="9" fill="#6b7280">θ → 90°，H → 20 m</text>
</svg>
</div>
<div class="qac">
<p class="q">速度方向与位移方向相同吗？</p>
<p class="a"><b>不同。</b>速度方向 tanθ = vy/vx = gt/v₀，位移方向 tanα = y/x = gt/(2v₀)，所以 <b>tanθ = 2tanα</b>，速度方向总比位移方向陡，两者只在抛出瞬间重合。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="平抛轨迹上速度方向比位移方向更陡">
  <line x1="20" y1="112" x2="224" y2="112" stroke="#cfd4da" stroke-width="1.2"/>
  <path d="M26 30 Q120 40 200 110" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <line x1="26" y1="30" x2="150" y2="77" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="90" y1="58" x2="178" y2="96" stroke="#b8402f" stroke-width="2"/>
  <circle cx="150" cy="77" r="3.4" fill="#fff" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="90" y="94" font-size="8.5" fill="#6b7280">位移方向 α</text>
  <text x="150" y="62" font-size="8.5" fill="#b8402f">速度方向 θ</text>
  <text x="120" y="128" text-anchor="middle" font-size="9" font-weight="700" fill="#8a5c14">tanθ = 2tanα</text>
</svg>
</div>
<div class="qac">
<p class="q">落地速度怎么求？</p>
<p class="a"><b>先把两个分速度求出来，再合成。</b>水平 vx = v₀cosθ 不变；竖直 vy = v₀sinθ − gt。大小 v = √(vx² + vy²)，方向 tanα = |vy|/vx。同一高度落地时，速度大小等于抛出速度。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="落地速度由水平分速度和竖直分速度合成">
  <line x1="16" y1="104" x2="228" y2="104" stroke="#cfd4da" stroke-width="1.2"/>
  <path d="M34 94 Q120 24 206 104" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <line x1="206" y1="104" x2="206" y2="124" stroke="#b8402f" stroke-width="2"/>
  <polygon points="206,130 201,116 211,116" fill="#b8402f"/>
  <line x1="206" y1="104" x2="230" y2="104" stroke="#2f8a5b" stroke-width="2"/>
  <polygon points="236,104 224,99 224,109" fill="#2f8a5b"/>
  <text x="214" y="120" font-size="8.5" fill="#b8402f">vy</text>
  <text x="214" y="97" font-size="8.5" fill="#1e6640">vx</text>
  <text x="120" y="14" text-anchor="middle" font-size="9" fill="#6b7280">v = √(vx² + vy²)，方向看 tanα</text>
</svg>
</div>
<div class="qac">
<p class="q">空气阻力使射程变大还是变小？</p>
<p class="a"><b>变小。</b>阻力与运动方向相反，水平方向不再匀速、竖直方向加速度也不再等于 g，轨迹不再是抛物线，射程和最大高度都会减小；θ 的最佳值也会略小于 45°。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="有空气阻力时轨迹变低变短">
  <line x1="16" y1="112" x2="228" y2="112" stroke="#cfd4da" stroke-width="1.2"/>
  <path d="M26 106 Q120 30 214 106" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M26 106 Q110 62 168 106" fill="none" stroke="#b8402f" stroke-width="2.2"/>
  <text x="120" y="42" text-anchor="middle" font-size="8.5" fill="#6d28d9">无阻力：抛物线</text>
  <text x="120" y="82" text-anchor="middle" font-size="8.5" fill="#b8402f">有阻力：更矮更短</text>
  <text x="120" y="126" text-anchor="middle" font-size="9" fill="#6b7280">射程变小，最佳 θ 略小于 45°</text>
</svg>
</div>
</div>
<p class="gx-note">六问归成一条：<b>水平方向只有 v₀cosθ，竖直方向只有 v₀sinθ 与 g</b>。
R 由两个分量共同决定，H 和 t 只由竖直分量决定。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是卷面上真出现过的错句，右边是能得分的表述。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 任何情况下 45° 抛出的射程都最大。</p>
<p class="er-v">✓ 同一 v₀、同一抛出点与落地点高度时，45° 的射程最大。</p>
<p class="er-w">换一个 v₀ 或换一个落地高度，最大值仍在 45° 附近，但 R 的数值要按 R = v₀²sin2θ/g 重算。</p>
</div>
<div class="er">
<p class="er-x">✗ 射程直接用 R = v₀²/g。</p>
<p class="er-v">✓ R = v₀²sin2θ/g；R = v₀²/g 只是 θ = 45° 的特例。</p>
<p class="er-w">漏掉 sin2θ，等于默认每次都是 45° 抛出，θ = 30° 时会算大。</p>
</div>
<div class="er">
<p class="er-x">✗ 斜抛物体在最高点速度为零。</p>
<p class="er-v">✓ 最高点竖直分速度为零，水平分速度仍是 v₀cosθ。</p>
<p class="er-w">平抛没有「最高点」；斜抛最高点速度最小但不为零，方向水平。</p>
</div>
<div class="er">
<p class="er-x">✗ 飞行时间用 t = v₀/g。</p>
<p class="er-v">✓ 斜抛落回等高地面时 t = 2v₀sinθ/g；平抛由高度决定 t = √(2h/g)。</p>
<p class="er-w">v₀ 是合速度，进竖直方向公式前必须先乘 sinθ。</p>
</div>
<div class="er">
<p class="er-x">✗ 速度方向就是位移方向。</p>
<p class="er-v">✓ tanθ = gt/v₀，tanα = gt/(2v₀)，tanθ = 2tanα。</p>
<p class="er-w">位移是从抛出点指向当前点的弦，速度是轨迹的切线，二者不重合。</p>
</div>
<div class="er">
<p class="er-x">✗ 同一道题里 g 一会儿取 10、一会儿取 9.8。</p>
<p class="er-v">✓ 按题目给定值统一取；题目没给就按本页口径取 g = 10 m/s²。</p>
<p class="er-w">g 换一次，H 和 t 全部跟着变；中间步骤与最终答案必须用同一个 g。</p>
</div>
</div>
</section>

<div class="gx-foot">
<p>教材依据：人教版《物理》必修第二册（2019 年版）第五章第 4 节「抛体运动的规律」。课文引文按教材表述整理，页码以纸质书为准。</p>
<p>数值口径：全页取 v₀ = 20 m/s、g = 10 m/s²，忽略空气阻力，抛出点与落地点等高；互动模型的 θ 范围为 15°–75°。
R = v₀²sin2θ/g = 40sin2θ，H = v₀²sin²θ/(2g) = 20sin²θ，t = 2v₀sinθ/g = 4sinθ，
所有读数均为<b>模型计算值</b>，不是实测数据。</p>
<p>图中「45° 射程最大」只适用于同一 v₀ 且落地高度相同的条件；空气阻力会使射程与最大高度都变小，本页的抛物线均指无阻力情形。</p>
</div>

  <span class="gx-zoom-tip">双指放大看细节</span>

<script src="../../assets/gx.js"></script>
<script src="../../assets/autopilot.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var $ = GX.$;
  var V0 = 20, G = 10;
  var OX = 44, OY = 238, XS = 8.3, YS = 8.6;
  var TH = 15;

  function calc(th) {
    var r = th * Math.PI / 180;
    return {
      R: 40 * Math.sin(2 * r),
      H: 20 * Math.pow(Math.sin(r), 2),
      t: 4 * Math.sin(r)
    };
  }

  function render() {
    var th = Math.round(TH);
    var c = calc(th);
    var rad = th * Math.PI / 180;
    var vx = V0 * Math.cos(rad), vy = V0 * Math.sin(rad);
    var T = c.t, d = "", i, n = 48;

    for (i = 0; i <= n; i++) {
      var tt = T * i / n;
      var px = OX + vx * tt * XS;
      var py = OY - (vy * tt - 0.5 * G * tt * tt) * YS;
      d += (i ? " L " : "M ") + px.toFixed(1) + " " + py.toFixed(1);
    }
    $("gxPath").setAttribute("d", d);

    var landX = OX + c.R * XS;
    var apexX = OX + c.R / 2 * XS;
    var apexY = OY - c.H * YS;

    $("gxApex").setAttribute("cx", apexX.toFixed(1));
    $("gxApex").setAttribute("cy", apexY.toFixed(1));
    $("gxHLine").setAttribute("x1", apexX.toFixed(1));
    $("gxHLine").setAttribute("x2", apexX.toFixed(1));
    $("gxHLine").setAttribute("y1", apexY.toFixed(1));
    $("gxHLine").setAttribute("y2", OY);
    $("gxApexTag").setAttribute("x", (apexX + 7).toFixed(1));
    $("gxApexTag").setAttribute("y", (apexY - 4).toFixed(1));
    $("gxApexTag").textContent = "最高点 H = " + c.H.toFixed(1) + " m";

    $("gxRLine").setAttribute("x2", landX.toFixed(1));
    $("gxRTickR").setAttribute("x1", landX.toFixed(1));
    $("gxRTickR").setAttribute("x2", landX.toFixed(1));
    $("gxRVal").setAttribute("x", ((OX + landX) / 2).toFixed(1));
    $("gxRVal").textContent = "R = " + c.R.toFixed(1) + " m";

    $("gxVa").textContent = th + "°";
    $("gxVb").textContent = c.R.toFixed(1) + " m";
    $("gxVc").textContent = c.H.toFixed(1) + " m";

    var st, col;
    if (th < 45) { st = "θ < 45°：射程随 θ 增大"; col = "#2f6fd0"; }
    else if (th > 45) { st = "θ > 45°：射程回落"; col = "#b8402f"; }
    else { st = "θ = 45°：射程最大"; col = "#6d28d9"; }
    $("gxStateTxt").textContent = st;
    $("gxStateTxt").setAttribute("fill", col);
    $("gxStateNote").textContent = st + "　（R = 40sin2θ）";
    $("gxStateNote").style.color = col;

    $("gxFormula").textContent =
      "H = " + c.H.toFixed(1) + " m　t = " + c.t.toFixed(2) + " s";
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  render();
  var ap = AutoPilot.create({
    mount: $("gxStage"),
    follow: $("gxSl"),
    loop: [{ t: 0, v: 15 }, { t: 1.5, v: 30 }, { t: 3.0, v: 45 },
           { t: 5.5, v: 45 }, { t: 7.0, v: 60 }, { t: 8.5, v: 75 },
           { t: 10.0, v: 15 }],
    keys: [15, 30, 45, 60, 75],
    value: TH, min: 15, max: 75, step: 1,
    idle: 5000,
    onChange: function (v) { TH = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc };
  window.__probe = function () {
    var th = Math.round(TH), c = calc(th);
    return {
      th: th,
      R: c.R.toFixed(1),
      H: c.H.toFixed(1),
      mode: ap.mode
    };
  };
});
</script>
