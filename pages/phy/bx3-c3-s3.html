<script type="text/markdown" id="md"><div class="gx"><p class="gx-claim">这一节只干一件事：把 <b>L、S、R</b> 三个量测准，再用 <b>ρ = RS/L</b> 算电阻率。</p><nav class="gx-toc"><a href="#a">① 课本怎么说</a><a href="#b">② 拆开看</a><a href="#c">③ 自己拖一下</a><a href="#d">④ 一道题走一遍</a><a href="#e">⑤ 会怎么考</a><a href="#f">⑥ 易错清单</a></nav><section class="gx-sec" id="a"><h2><span class="sn">01</span>课本怎么说</h2><p class="gx-h2s">三条：测什么、用什么测、怎么接。<span class="q-src">人教版必修第三册 · 第十一章第3节</span></p><div class="gx-quote"><p class="q-t">课本表述 · 测量原理</p><p class="q-b">由 R = ρL/S 得 ρ = RS/L，所以要测长度 L、横截面积 S 和电阻 R。</p><p class="q-n">→ 人话：三个量测准，代公式就出 ρ。</p></div><div class="gx-quote"><p class="q-t">课本表述 · 测量工具</p><p class="q-b">直径用螺旋测微器测，电阻用伏安法测；长度用刻度尺，多次测量取平均值以减小误差。</p><p class="q-n">→ 人话：细丝刻度尺不够用，测几次取平均。</p></div><div class="gx-quote"><p class="q-t">课本表述 · 伏安法</p><p class="q-b">电流表外接适用于小电阻，内接适用于大电阻；量程应使指针偏转适当。</p><p class="q-n">→ 人话：小电阻外接，大电阻内接。</p></div></section><section class="gx-sec" id="b"><h2><span class="sn">02</span>拆开看</h2><p class="gx-h2s">三张图：读数、接法、量哪一段。</p><figure class="gx-fig"><div class="fig-cap"><span class="fig-no">图 1</span><span class="fig-t">螺旋测微器怎么读数</span><span class="bdg bdg-must">必考</span></div><p class="fig-s">主尺读半毫米，螺旋尺一格 0.01 mm，再估读到 0.001 mm。</p><p class="fig-s">主尺 5.5 mm、螺旋尺 23.0 格，读数 <b>5.730 mm</b>。</p><div class="gx-svgbox"><svg viewBox="0 0 900 200" role="img" aria-label="螺旋测微器：主尺读数加螺旋尺格数乘0.01毫米"><rect x="30" y="30" width="840" height="126" rx="10" fill="#fbfcfd" stroke="#e6e9ee"/><rect x="176" y="70" width="16" height="46" fill="#8e97a4"/><rect x="192" y="64" width="8" height="58" fill="#b8791f"/><rect x="200" y="80" width="110" height="26" fill="#c9d1da"/><rect x="310" y="74" width="200" height="38" fill="#f3f5f8" stroke="#b8c2cc"/><path d="M322 74v14M356 74v8M390 74v14M424 74v8M458 74v14M492 74v8" stroke="#6b7280"/><rect x="510" y="66" width="110" height="54" rx="5" fill="#eef2ff" stroke="#6d28d9"/><path d="M522 66v14M540 66v14M558 66v14M576 66v14M594 66v14" stroke="#6d28d9"/><rect x="620" y="80" width="44" height="26" rx="5" fill="#dfe4ea" stroke="#8e97a4"/><text x="330" y="142" font-size="10" fill="#3a3a35">主尺</text><text x="545" y="142" font-size="10" fill="#6d28d9">螺旋尺</text><text x="450" y="178" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">5.5 + 23.0 × 0.01 = 5.730 mm</text></svg><span class="gx-zoomchip">点击放大</span></div><p class="gx-take">精度 0.01 mm、估读到 0.001 mm；细丝测 3 次取平均。</p></figure><figure class="gx-fig"><div class="fig-cap"><span class="fig-no">图 2</span><span class="fig-t">电流表外接还是内接</span><span class="bdg bdg-diff">难点</span></div><p class="fig-s">甲 外接：电压表只并在 R_x 两端，量的是并联值，适合小电阻。</p><p class="fig-s">乙 内接：电压表并在 R_x 与电流表整体上，量的是两者串联值，适合大电阻。</p><div class="gx-svgbox"><svg viewBox="0 0 900 200" role="img" aria-label="伏安法：甲电流表外接适合小电阻，乙电流表内接适合大电阻"><path d="M60 66 H370 V166 H60 Z" fill="none" stroke="#3a3a35" stroke-width="2"/><line x1="84" y1="156" x2="84" y2="172" stroke="#3a3a35" stroke-width="2"/><line x1="96" y1="162" x2="96" y2="166" stroke="#3a3a35" stroke-width="4"/><circle cx="232" cy="66" r="13" fill="#fff" stroke="#3a3a35" stroke-width="2"/><text x="232" y="71" text-anchor="middle" font-size="11" font-weight="700">A</text><rect x="360" y="108" width="20" height="38" fill="#eef2ff" stroke="#6d28d9" stroke-width="2"/><circle cx="296" cy="136" r="13" fill="#fff" stroke="#6d28d9" stroke-width="2"/><text x="296" y="141" text-anchor="middle" font-size="11" font-weight="700" fill="#6d28d9">V</text><path d="M296 123 V66 M296 149 V166" stroke="#6d28d9"/><text x="225" y="192" text-anchor="middle" font-size="12" font-weight="700" fill="#1e6640">甲 外接 · 小电阻</text><path d="M500 66 H810 V166 H500 Z" fill="none" stroke="#3a3a35" stroke-width="2"/><line x1="524" y1="156" x2="524" y2="172" stroke="#3a3a35" stroke-width="2"/><line x1="536" y1="162" x2="536" y2="166" stroke="#3a3a35" stroke-width="4"/><rect x="800" y="78" width="20" height="36" fill="#eef2ff" stroke="#6d28d9" stroke-width="2"/><circle cx="810" cy="136" r="13" fill="#fff" stroke="#3a3a35" stroke-width="2"/><text x="810" y="141" text-anchor="middle" font-size="11" font-weight="700">A</text><circle cx="738" cy="136" r="13" fill="#fff" stroke="#6d28d9" stroke-width="2"/><text x="738" y="141" text-anchor="middle" font-size="11" font-weight="700" fill="#6d28d9">V</text><path d="M738 123 V66 M738 149 V166" stroke="#6d28d9"/><text x="665" y="192" text-anchor="middle" font-size="12" font-weight="700" fill="#b8402f">乙 内接 · 大电阻</text></svg><span class="gx-zoomchip">点击放大</span></div><p class="gx-take">R_x 小用外接、R_x 大用内接；金属丝几欧，用外接。</p></figure><figure class="gx-fig"><div class="fig-cap"><span class="fig-no">图 3</span><span class="fig-t">长度 L 量哪一段</span><span class="bdg bdg-warn">易错</span></div><p class="fig-s">米尺量<b>两个接线柱之间</b>的长度，不是整根导线。</p><p class="fig-s">夹子之外不导电，量进去 L 偏大、ρ 偏大。</p><div class="gx-svgbox"><svg viewBox="0 0 900 180" role="img" aria-label="用米尺测接入电路的金属丝长度"><rect x="50" y="104" width="800" height="38" fill="#fdf6e3" stroke="#d8c48f"/><g stroke="#8a6d1f"><line x1="90" y1="104" x2="90" y2="120"/><line x1="210" y1="104" x2="210" y2="116"/><line x1="330" y1="104" x2="330" y2="120"/><line x1="450" y1="104" x2="450" y2="116"/><line x1="570" y1="104" x2="570" y2="120"/><line x1="690" y1="104" x2="690" y2="116"/><line x1="810" y1="104" x2="810" y2="120"/></g><line x1="150" y1="84" x2="670" y2="84" stroke="#b8791f" stroke-width="6" stroke-linecap="round"/><rect x="132" y="72" width="18" height="24" rx="3" fill="#6b7280"/><rect x="670" y="72" width="18" height="24" rx="3" fill="#6b7280"/><line x1="150" y1="60" x2="670" y2="60" stroke="#6d28d9"/><line x1="150" y1="53" x2="150" y2="67" stroke="#6d28d9"/><line x1="670" y1="53" x2="670" y2="67" stroke="#6d28d9"/><text x="410" y="48" text-anchor="middle" font-size="11" font-weight="700" fill="#6d28d9">L = 两接线柱之间</text></svg><span class="gx-zoomchip">点击放大</span></div><p class="gx-take">L 只算接入电路的一段；量了夹子外，ρ 会偏大。</p></figure></section><section class="gx-sec" id="c"><h2><span class="sn">03</span>自己拖一下<span class="bdg bdg-must">核心</span></h2><p class="gx-h2s">R = 5 Ω、L = 1.0 m 固定，只改直径 d，看 S 与 ρ 怎么变。</p><figure class="gx-fig"><div class="fig-cap"><span class="fig-no">互动 1</span><span class="fig-t">d 变，S 与 ρ 一起变</span><span class="gx-ap" id="gxAp"><i></i><span id="gxApTxt">自动演示中</span></span></div><p class="fig-s">d 取 0.2–1.0 mm；<b>S = πd²/4</b>，<b>ρ = RS/L</b>。</p><div class="gx-board"><svg id="gxStage" class="gx-graph" viewBox="0 0 360 240" tabindex="0" role="application" aria-label="互动：拖动直径 d，观察横截面积 S 与电阻率 ρ 的变化"><text x="180" y="20" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3a3a35">d 变 → S 变 → ρ 跟着变</text><rect x="40" y="92" width="170" height="24" rx="4" id="gxWire" fill="#eef2ff" stroke="#6d28d9" stroke-width="1.6"/><circle id="gxCirc" cx="290" cy="104" r="26" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/><line x1="290" y1="104" x2="320" y2="88" stroke="#b8791f" stroke-width="1.3"/><text x="326" y="86" font-size="8.5" fill="#8a5c14">d</text><text id="gxCd" x="290" y="174" text-anchor="middle" font-size="9" font-weight="700" fill="#3a3a35">d = 0.50 mm</text><text id="gxHint" x="180" y="204" text-anchor="middle" font-size="8.5" fill="#8a5c14">d 变 → S ∝ d² → ρ 跟着变</text></svg><div class="bar"><span class="lb">直径 d</span><input type="range" id="gxSl" min="0.2" max="1" step="0.01" value="0.5" aria-label="金属丝直径 d，单位毫米"></div></div><div class="stats"><div class="st"><div class="k">① 直径 d</div><div class="v" id="gxVd">0.50 mm</div><div class="s">螺旋测微器读数</div></div><div class="st"><div class="k">② 横截面积 S</div><div class="v" id="gxVs">1.96×10⁻⁷ m²</div><div class="s">S = πd²/4</div></div><div class="st"><div class="k">③ 电阻率 ρ</div><div class="v" id="gxVr">9.82×10⁻⁷ Ω·m</div><div class="s">ρ = RS/L</div></div></div><p class="gx-take">停在 d = 0.50 mm：S = 1.96×10⁻⁷ m²、ρ ≈ 9.8×10⁻⁷ Ω·m。<b>d 增大，S 增大，ρ 减小</b>（R 固定）。</p></figure></section><section class="gx-sec" id="d"><h2><span class="sn">04</span>一道题走一遍</h2><p class="gx-h2s">先自己写，再点「下一步」。</p><div class="gx-ex"><p class="ex-t">例题 · 测金属丝的电阻率<span class="bdg bdg-must">必考</span></p><p class="ex-q">d = 0.50 mm，R = 5.0 Ω，L = 1.0 m。求 S 和 ρ；若保持 R 不变、d 减半到 0.25 mm，S 与 ρ 各变多少？</p><ol class="steps" id="gxSteps"><li class="step"><p class="s-h">第 1 步 · 统一单位</p><p class="s-b">d = 0.50 mm = <b>5.0×10⁻⁴ m</b>；L、R 直接代入。不换米，S 差 10⁶ 倍。</p></li><li class="step" hidden><p class="s-h">第 2 步 · 算横截面积</p><p class="s-b">S = πd²/4 = 3.14 × (5.0×10⁻⁴)² / 4 ≈ <b>1.96×10⁻⁷ m²</b>。</p></li><li class="step" hidden><p class="s-h">第 3 步 · 算电阻率</p><p class="s-b">ρ = RS/L = 5.0 × 1.96×10⁻⁷ / 1.0 ≈ <b>9.8×10⁻⁷ Ω·m</b>。</p></li><li class="step" hidden><p class="s-h">第 4 步 · d 减半</p><p class="s-b">S ∝ d²，故 S 变为 <b>1/4</b>：≈ <b>4.9×10⁻⁸ m²</b>。</p></li><li class="step" hidden><p class="s-h">第 5 步 · ρ 变多少</p><p class="s-b">R 固定时 ρ ∝ S，故也变 <b>1/4</b>：≈ <b>2.5×10⁻⁷ Ω·m</b>。（真实材料 ρ 不随 d 变，R 应变 4 倍。）</p></li></ol><div class="exbar"><button id="gxNext" type="button">下一步</button><span class="cnt" id="gxCnt">1 / 5</span></div><div class="ans" id="gxAns" hidden><p class="ans-t">标准答案</p><p class="ans-b">S = <b>1.96×10⁻⁷ m²</b>；ρ ≈ <b>9.8×10⁻⁷ Ω·m</b>。d 减半后 S 变 <b>1/4</b>（≈4.9×10⁻⁸ m²），按 R 固定，ρ 也变 <b>1/4</b>（≈2.5×10⁻⁷ Ω·m）。</p></div></div></section><section class="gx-sec" id="e"><h2><span class="sn">05</span>考你会怎么考</h2><p class="gx-h2s">六种问法：工具、读数、接法、平均、单位、误差</p><div class="gx-qa"><div class="qac"><p class="q">测 0.5 mm 的丝径能用刻度尺吗？</p><p class="a"><b>不能。</b>分度 1 mm 误差太大，要用螺旋测微器。</p><svg viewBox="0 0 240 132"><rect x="30" y="40" width="180" height="34" fill="#fdf6e3" stroke="#d8c48f"/><text x="120" y="104" text-anchor="middle" font-size="10">1 mm → 误差太大</text></svg></div><div class="qac"><p class="q">5.730 mm 怎么读出来的？</p><p class="a">主尺 <b>5.5 mm</b> + 螺旋尺 <b>23.0</b> 格 × 0.01 mm。</p><svg viewBox="0 0 240 132"><rect x="20" y="40" width="86" height="26" fill="#f3f5f8" stroke="#b8c2cc"/><text x="63" y="58" text-anchor="middle" font-size="10">5.5</text><rect x="106" y="34" width="56" height="38" rx="4" fill="#eef2ff" stroke="#6d28d9"/><text x="134" y="58" text-anchor="middle" font-size="10" fill="#6d28d9">23.0</text><text x="120" y="100" text-anchor="middle" font-size="10" font-weight="700" fill="#6d28d9">= 5.730 mm</text></svg></div><div class="qac"><p class="q">金属丝只有几欧，电流表怎么接？</p><p class="a"><b>外接。</b>R_x 远小于电压表内阻，分流误差小。</p><svg viewBox="0 0 240 132"><rect x="22" y="44" width="80" height="42" rx="8" fill="#e6f6ee" stroke="#2f8a5b"/><text x="62" y="70" text-anchor="middle" font-size="11" font-weight="700" fill="#1e6640">R 小→外接</text><rect x="136" y="44" width="80" height="42" rx="8" fill="#f3f5f8" stroke="#b8c2cc"/><text x="176" y="70" text-anchor="middle" font-size="11" font-weight="700" fill="#6b7280">R 大→内接</text></svg></div><div class="qac"><p class="q">为什么要多次测量取平均？</p><p class="a">减小<b>偶然误差</b>；直径、L 各测 3 次再平均。</p><svg viewBox="0 0 240 132"><line x1="28" y1="80" x2="212" y2="80" stroke="#b8c2cc"/><circle cx="58" cy="52" r="6" fill="#7c3aed" opacity="0.55"/><circle cx="106" cy="44" r="6" fill="#7c3aed" opacity="0.75"/><circle cx="154" cy="58" r="6" fill="#7c3aed" opacity="0.55"/><line x1="28" y1="52" x2="212" y2="52" stroke="#6d28d9" stroke-dasharray="5 4"/></svg></div><div class="qac"><p class="q">电阻率 ρ 的单位是什么？</p><p class="a"><b>Ω·m</b>。不是 Ω/m，也不是 Ω/m²。</p><svg viewBox="0 0 240 132"><rect x="40" y="38" width="160" height="50" rx="8" fill="#f5f3ff" stroke="#7c3aed"/><text x="120" y="70" text-anchor="middle" font-size="20" font-weight="700" fill="#6d28d9">Ω·m</text></svg></div><div class="qac"><p class="q">误差主要来自哪里？</p><p class="a"><b>直径。</b>S ∝ d²，d 差 1% 则 S 差约 2%。</p><svg viewBox="0 0 240 132"><rect x="30" y="66" width="40" height="38" fill="#b8402f" opacity="0.8"/><rect x="90" y="46" width="40" height="58" fill="#d99a2b" opacity="0.85"/><rect x="150" y="30" width="40" height="74" fill="#2f8a5b" opacity="0.8"/><text x="50" y="120" text-anchor="middle" font-size="9">d</text><text x="110" y="120" text-anchor="middle" font-size="9">S</text><text x="170" y="120" text-anchor="middle" font-size="9">ρ</text></svg></div></div></section><section class="gx-sec" id="f"><h2><span class="sn">06</span>易错清单</h2><p class="gx-h2s">六条，都是真扣分的地方。</p><div class="er"><p class="er-x">✗ 用刻度尺测金属丝直径。</p><p class="er-v">✓ 用<b>螺旋测微器</b>，估读到 0.001 mm。</p><p class="er-w">刻度尺分度 1 mm，误差太大。</p></div><div class="er"><p class="er-x">✗ 电流表外接适合大电阻。</p><p class="er-v">✓ 外接适合<b>小电阻</b>，内接适合大电阻。</p><p class="er-w">R 越小，分流影响越小。</p></div><div class="er"><p class="er-x">✗ 直径测一次就够了。</p><p class="er-v">✓ 不同位置测 <b>3 次</b>再取平均。</p><p class="er-w">丝粗细不均，S 按平方放大。</p></div><div class="er"><p class="er-x">✗ ρ 的单位是 Ω/m。</p><p class="er-v">✓ ρ 的单位是 <b>Ω·m</b>。</p><p class="er-w">ρ = RS/L，量纲 Ω·m²/m = Ω·m。</p></div><div class="er"><p class="er-x">✗ 螺旋测微器不用估读。</p><p class="er-v">✓ 螺旋尺估读到 <b>0.001 mm</b>。</p><p class="er-w">螺旋尺最小分度 0.01 mm，再往下估一位，读数才到 0.001 mm。</p></div><div class="er"><p class="er-x">✗ 电流表并联在待测电阻两端。</p><p class="er-v">✓ 电流表<b>串联</b>，电压表并联在 R_x 两端。</p><p class="er-w">电流表内阻小，并联会短路 R_x。</p></div></section><div class="gx-foot"><p>人教版《物理》必修第三册（2019年版）第十一章第3节</p></div></div><div class="gx-zoom" id="gxZoom" hidden><span class="gx-zoom-tip">双指放大看细节</span><button class="gx-zoom-x" type="button" aria-label="关闭">✕</button><div id="gxZoomInner"></div></div>
</script>

<script>
document.addEventListener("DOMContentLoaded", function () {
  var $ = GX.$, D = 0.5, R = 5, L = 1.0;
  function fmt(x, u) {
    if (!(x > 0)) return "—";
    var e = x >= 1e-6 ? -6 : x >= 1e-7 ? -7 : -8;
    return (x / Math.pow(10, e)).toFixed(2) + "×10⁻" + "⁶⁷⁸"[e + 8] + " " + u;
  }
  function render() {
    var dm = D / 1000, S = Math.PI * dm * dm / 4, rho = R * S / L;
    if (!isFinite(S) || S <= 0) S = 0;
    if (!isFinite(rho) || rho <= 0) rho = 0;
    $("gxVd").textContent = D.toFixed(2) + " mm";
    $("gxVs").textContent = fmt(S, "m²");
    $("gxVr").textContent = fmt(rho, "Ω·m");
    var k = (D - 0.2) / 0.8;
    if (!(k > 0)) k = 0;
    if (k > 1) k = 1;
    var h = 6 + k * 34;
    $("gxWire").setAttribute("height", h.toFixed(1));
    $("gxWire").setAttribute("y", (104 - h / 2).toFixed(1));
    $("gxCirc").setAttribute("r", (6 + k * 30).toFixed(1));
    $("gxCd").textContent = "d = " + D.toFixed(2) + " mm";
    $("gxHint").textContent = Math.abs(D - 0.5) < 0.006 ? "d = 0.50 mm：关键帧，停 2.5 s"
      : (D < 0.206 ? "d = 0.20 mm：最细" : (D > 0.994 ? "d = 1.00 mm：最粗" : "d 变 → S ∝ d² → ρ 跟着变"));
  }
  var badge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!badge) return;
    badge.classList.toggle("is-auto", m === "auto");
    badge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }
  render();
  window.__ap = AutoPilot.create({
    mount: $("gxStage"), follow: $("gxSl"),
    loop: [{ t: 0, v: 0.2 }, { t: 1.2, v: 0.2 }, { t: 2.6, v: 0.5 }, { t: 5.1, v: 0.5 },
           { t: 6.8, v: 0.8 }, { t: 8.2, v: 0.8 }, { t: 9.6, v: 1.0 }, { t: 11.0, v: 1.0 },
           { t: 12.4, v: 0.2 }, { t: 13.6, v: 0.2 }],
    keys: [0.2, 0.5, 0.8, 1.0],
    value: D, min: 0.2, max: 1, step: 0.01, idle: 5000,
    onChange: function (v) { D = v; render(); },
    onMode: setMode
  });
  var steps = Array.prototype.slice.call(document.querySelectorAll("#gxSteps .step"));
  var btn = $("gxNext"), cnt = $("gxCnt"), ans = $("gxAns"), idx = 0;
  if (btn && steps.length) btn.addEventListener("click", function () {
    if (idx < steps.length - 1) { idx++; steps[idx].hidden = false; }
    if (cnt) cnt.textContent = (idx + 1) + " / " + steps.length;
    if (idx === steps.length - 1 && ans) ans.hidden = false;
  });
});
</script>
</body>
</html>
