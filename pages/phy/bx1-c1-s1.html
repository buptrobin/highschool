<script type="text/markdown" id="md">
<div class="gx">

<div class="gx-kicker">ELI5-HIGH · 讲给要考试的人</div>
<p class="gx-claim">同一辆火车，跑长途时是<b>一个点</b>，过桥时是<b>一整段不能忽略的长度</b>——能不能看成质点，不看它多大，看你问什么。</p>
<div class="gx-meta">
  <span><i></i>人教版必修第一册 · 第一章第 1 节</span>
  <span><i></i>高一 · 运动的描述</span>
  <span><i></i>阅读 12 分钟</span>
  <span><i></i>含 1 个互动模型</span>
</div>
<p class="gx-lede">你大概听过一句话：「质点就是很小的点。」这句话只对了一半，而且是最容易丢分的那一半。
地球直径约 1.28 万千米，研究它绕太阳公转时，物理老师却说「地球可以看作质点」；一粒芝麻很小，研究它翻滚时却不能。
这一节只解决两个问题：<b>什么时候能把物体压成一个点</b>，以及<b>选谁当「观众」</b>才说得清它在动。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题写左边这句，不要写右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 质点<span class="q-src">人教版必修第一册 · 第一章第 1 节</span></p>
<p class="q-b">在某些情况下，可以忽略物体的大小和形状，把它简化为一个具有质量的点，这样的点叫作质点。</p>
<p class="q-n">→ 这句话有 <b>两个动作、一个不能丢</b>：① <b>忽略</b>大小和形状；② 简化成<b>一个点</b>；
但这个点<b>必须保留质量</b>。所以「质点没有质量」是错的，「质点就是几何点」也是错的。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 参考系<span class="q-src">人教版必修第一册 · 第一章第 1 节</span></p>
<p class="q-b">要描述一个物体的运动，首先要选定某个其他物体作为参考，观察物体相对于这个「其他物体」的位置是否随时间变化，以及怎样变化。这种用来作为参考的物体叫作参考系。</p>
<p class="q-n">→ 这句话有 <b>两个要素</b>：① 必须先选一个<b>「其他物体」</b>；② 看的是<b>相对位置</b>变没变。
所以「它是动还是静」不能脱离参考系空谈——先选参考系，才有动/静可言。</p>
</div>

<p class="gx-note">两个概念是一对：<b>质点</b>回答「把谁简化成什么」，<b>参考系</b>回答「站在谁的角度看」。
做题时先选参考系，再决定能不能把研究对象看成质点，顺序不要反。</p>
</section>

<section class="gx-sec" id="b">
<h2><span class="sn">02</span>拆开看</h2>
<p class="gx-h2s">三张图：一张给判断流程，一张比较同一辆火车的两种命运，一张换「观众」。</p>

<p class="fig-s">判断的对象从来不是「物体大不大」，而是<b>「这个问题里，大小和形状会不会改变答案」</b>。
三问走完，结论自然出来；跳过第二问直接看体积，就是最常见的丢分点。</p>

<p class="gx-take">能否看作质点，取决于<b>研究的问题</b>，不取决于物体的绝对大小；同一个物体，换个问题就可能换答案。</p>
</figure>

火车长度都按 <b>200 m</b> 计。车长占的距离越小，越有资格被压成一个点。</p>

<h2><span class="sn">03</span>自己拖一下<span class="bdg bdg-must">核心</span></h2>
<p class="gx-h2s">拖动「要研究的距离」，看同一列 200 m 长的火车怎样从「一个点」变成「一整段不能忽略的长度」。</p>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题想 30 秒，再点「下一步」。这题不考计算，只考你会不会把「问题」放在「物体」前面。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 判断能否看作质点<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">下列情形中，能否把加下划线的物体看作质点？说明理由。<br>
（1）研究<b>地球</b>绕太阳公转的周期；<br>
（2）研究<b>地球</b>自转的周期；<br>
（3）研究一列长 200 m 的<b>火车</b>通过一座长 400 m 的桥所用的时间；<br>
（4）研究这列<b>火车</b>从北京开往上海所用的时间（全程约 1318 km）。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 先写「研究问题」，不写「物体大小」</p>
<p class="s-b">四小问的研究对象都是地球或火车，但问题不同。判断质点的第一句话应该是「我要研究的是……」，而不是「它有多大」。把问题逐条写在草稿上，后面才有判据。</p>
<p class="s-k">用到：质点概念里的「在某些情况下」，情况指的就是研究问题。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · （1）地球公转：距离远大于直径</p>
<p class="s-b">日地平均距离约 1.5×10<sup>8</sup> km，地球直径约 1.28×10<sup>4</sup> km，比值约为 1/11700。研究公转周期时，地球的直径、形状对「走完一圈用多久」几乎没有影响，可以忽略。</p>
<p class="s-k">用到：当物体的大小、形状对研究的问题影响很小时，可简化为质点。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · （2）地球自转：大小形状正是研究对象</p>
<p class="s-b">自转研究的就是地球绕自身轴转一圈，地球各部分的「大小、形状」直接决定转动的描述。此时把地球压成一个点，自转这件事就消失了，所以不能看作质点。</p>
<p class="s-k">用到：同一个物体，换问题就可能换答案。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · （3）火车过桥：车长不能丢</p>
<p class="s-b">火车完全通过桥，车头上桥到车尾离桥，走过的距离是「桥长 + 车长」= 400 m + 200 m = 600 m。车长占桥长的一半，直接影响过桥时间，不能忽略，所以不能看作质点。</p>
<p class="s-k">用到：位移/路程与「物体长度」有关时，不能把长度抹掉。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · （4）火车跑长途：车长可以忽略</p>
<p class="s-b">1318 km = 1 318 000 m，车长 200 m，约占全程的 1/6590。研究「几点到」时，车头到还是车尾到只差几百米，对结果影响极小，可以看作质点。</p>
<p class="s-k">用到：判据是「相对研究距离」，不是「绝对大小」。</p>
</li>
</ol>
<div class="exbar">
  <button id="gxNext" type="button">下一步</button>
  <span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）<b>可以</b>。日地距离远大于地球直径，地球的大小和形状对公转周期的研究影响很小，可忽略。<br>
（2）<b>不可以</b>。自转研究的就是地球绕自身轴的转动，大小和形状正是研究对象，不能忽略。<br>
（3）<b>不可以</b>。火车通过桥的距离为桥长与车长之和，车长占桥长的一半，对过桥时间影响很大，不能忽略。<br>
（4）<b>可以</b>。车长 200 m 只占全程 1318 km 的约 1/6590，对运行时间的影响可忽略。</p>
</div>
<p class="gx-note">答题格式：每小问先写「可以/不可以」，再写「因为大小形状对……的影响可忽略/不可忽略」。只写结论不写理由，通常只给一半分。</p>
</div>
</section>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>考你会怎么考</h2>
<p class="gx-h2s">六种问法，其实都在问同一件事：你是在「看物体」，还是在「看问题」。</p>

<div class="gx-qa">
<div class="qac">
<p class="q">质点就是「很小的点」吗？</p>
<p class="a"><b>不是。</b>质点是有质量的点，「小」不是条件。大如地球，研究公转时也能看作质点；小如蚂蚁，研究它翻跟头时也不能。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="大物体和小物体都可能成为质点">
  <circle cx="62" cy="62" r="26" fill="#dce9fb" stroke="#2f6fd0"/>
  <text x="62" y="67" text-anchor="middle" font-size="12" fill="#1f4f96">地球</text>
  <circle cx="174" cy="62" r="7" fill="#fbeed7" stroke="#c8862a"/>
  <text x="174" y="86" text-anchor="middle" font-size="11" fill="#8a5c14">蚂蚁</text>
  <text x="120" y="116" text-anchor="middle" font-size="11" fill="#6b7280">大与小，都不是判据</text>
</svg>
</div>
<div class="qac">
<p class="q">地球那么大，研究公转时为什么能当质点？</p>
<p class="a">因为判据是<b>相对距离</b>：日地距离约为地球直径的 1.17 万倍，地球的「胖瘦」对公转周期几乎没有影响，可以忽略。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="日地距离远大于地球直径">
  <circle cx="40" cy="66" r="18" fill="#fbeed7" stroke="#c8862a"/>
  <text x="40" y="98" text-anchor="middle" font-size="11" fill="#8a5c14">太阳</text>
  <line x1="60" y1="66" x2="204" y2="66" stroke="#9aa3ae" stroke-dasharray="5 4"/>
  <circle cx="212" cy="66" r="4" fill="#2f6fd0"/>
  <text x="128" y="52" text-anchor="middle" font-size="11" fill="#6b7280">1.5×10⁸ km</text>
  <text x="120" y="118" text-anchor="middle" font-size="11" fill="#6b7280">地球直径只占约 1/11700</text>
</svg>
</div>
<div class="qac">
<p class="q">研究地球自转时，还能看作质点吗？</p>
<p class="a"><b>不能。</b>自转研究的就是「绕自身轴转」，大小和形状正是主角；压成一个点，自转就不存在了。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="地球自转时不能看作质点">
  <circle cx="120" cy="62" r="30" fill="#dce9fb" stroke="#2f6fd0"/>
  <path d="M120 26 A36 36 0 0 1 120 98" fill="none" stroke="#c8862a" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="114,30 126,34 118,42" fill="#c8862a"/>
  <text x="120" y="67" text-anchor="middle" font-size="12" fill="#1f4f96">地球</text>
  <text x="120" y="118" text-anchor="middle" font-size="11" fill="#b8402f">自转 → 形状不能丢</text>
</svg>
</div>
<div class="qac">
<p class="q">参考系可以随便选吗？</p>
<p class="a"><b>可以，但同一道题里要统一。</b>通常选地面或相对地面静止的物体；选了车厢，就要全程用车厢，不能中途偷偷换。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="参考系可选地面或车厢，但同一问题中要统一">
  <line x1="20" y1="96" x2="220" y2="96" stroke="#5a6472"/>
  <rect x="70" y="64" width="100" height="30" rx="6" fill="#fff" stroke="#9aa3ae"/>
  <circle cx="92" cy="100" r="7" fill="#3a3a35"/>
  <circle cx="148" cy="100" r="7" fill="#3a3a35"/>
  <text x="120" y="54" text-anchor="middle" font-size="11" fill="#6b7280">地面？车厢？</text>
  <text x="120" y="122" text-anchor="middle" font-size="11" fill="#1e6640">先定一个，再全程用它</text>
</svg>
</div>
<div class="qac">
<p class="q">参考系不同，物体的运动一定不同吗？</p>
<p class="a"><b>不一定「不同」，但描述可以不同。</b>坐在匀速直线行驶的车里，你相对车静止、相对地面运动；两种说法都对，只是参考系不同。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="同一乘客相对车厢静止、相对地面运动">

  <text x="120" y="124" text-anchor="middle" font-size="11" fill="#1f4f96">相对地面：随车运动</text>
</svg>
</div>
<div class="qac">
<p class="q">质点和参考系，先想哪一个？</p>
<p class="a">先选<b>参考系</b>，再判断能不能看成<b>质点</b>。参考系是「舞台」，质点是「把演员简化成什么」；舞台没定，动作就说不清。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="先选参考系，再决定质点">

  <text x="191" y="78" text-anchor="middle" font-size="10.5" fill="#3a3a35">简化演员</text>

<p class="gx-note">这六问其实是一件事：<b>质点看「问题」，参考系看「立场」</b>。把这两句话记住，选项里再花哨的描述也能拆开。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真实会写错的句子，右边是课本语言。逐条对照，别只划对错。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 质点就是体积很小的点。</p>
<p class="er-v">✓ 质点是有质量的点；能否看作质点由研究的问题决定。</p>
<p class="er-w">错在把「小」当条件。<b>地球</b>研究公转时可以看作质点，蚂蚁研究翻滚时不能。</p>
</div>
<div class="er">
<p class="er-x">✗ 地球太大，任何情况下都不能看作质点。</p>
<p class="er-v">✓ 研究地球公转时，地球的大小和形状影响可忽略，可以看作质点；研究自转时不可以。</p>
<p class="er-w">错在把物体大小绝对化，忽略了「在某些情况下」这个前提。</p>
</div>
<div class="er">
<p class="er-x">✗ 质点没有质量，只是一个几何点。</p>
<p class="er-v">✓ 质点保留了物体的质量，只忽略大小和形状。</p>
<p class="er-w">后面学牛顿第二定律、万有引力都要用质量；质点若没有质量，整个力学就断了。</p>
</div>
<div class="er">
<p class="er-x">✗ 参考系必须是静止的物体。</p>
<p class="er-v">✓ 参考系可以任意选择，通常选地面；运动的物体也能当参考系。</p>
<p class="er-w">「静止」本身就是相对某个参考系说的，用「静止」去定义参考系会循环论证。</p>
</div>
<div class="er">
<p class="er-x">✗ 同一道题里，前后可以换参考系。</p>
<p class="er-v">✓ 同一问题中参考系要统一；要换，就得重新描述全部运动。</p>
<p class="er-w">中途换参考系，速度、位移会突然变号，答案必错。换之前先写「以……为参考系」。</p>
</div>
<div class="er">
<p class="er-x">✗ 物体小，就一定可以看作质点。</p>
<p class="er-v">✓ 要看物体的大小、形状对所研究问题的影响是否可以忽略。</p>
<p class="er-w">研究蚂蚁翻跟头，蚂蚁再小，它的腿和身体也不能压成一个点。</p>
</div>
</div>
</section>
