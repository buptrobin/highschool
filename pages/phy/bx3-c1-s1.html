<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">三条：两种电荷、元电荷、电荷守恒。</p>
<div class="gx-quote">
<p class="q-t">课本表述 · 两种电荷<span class="q-src">人教版必修第三册 · 第九章第1节</span></p>
<p class="q-b">自然界只有两种电荷，同种电荷相互排斥，异种电荷相互吸引。</p>
<p class="q-n">→ 人话：电荷只有正、负两路；作用只有一条规律——同斥异吸。</p>
</div>
<div class="gx-quote">
<p class="q-t">课本表述 · 元电荷<span class="q-src">人教版必修第三册 · 第九章第1节</span></p>
<p class="q-b">电荷的多少叫电荷量，电荷量 e = 1.6×10⁻¹⁹ C 叫元电荷；任何带电体的电荷量都是元电荷的整数倍。</p>
<p class="q-n">→ 人话：电子带的就是这 1.6×10⁻¹⁹ C，电荷量只能一份一份地加。</p>
</div>
<div class="gx-quote">
<p class="q-t">课本表述 · 电荷守恒<span class="q-src">人教版必修第三册 · 第九章第1节</span></p>
<p class="q-b">摩擦起电、感应起电都不是创造电荷，而是电荷的转移；电荷既不会创生也不会消灭，只能从一个物体转移到另一个物体，或从物体的一部分转移到另一部分，电荷的总量保持不变。</p>
<p class="q-n">→ 人话：起电只是搬电子，总数一分没变。</p>
</div>
<p class="gx-note">三条连起来：<b>带电 = 电子多了或少了 n 个 → q = n·e</b>，n 必须是整数。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己写，再点「下一步」。这题考「由电荷量反推电子数」。</p>
<div class="gx-ex">
<p class="ex-t">例题 · 数电子<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">一个物体带电荷量 q = −4.8×10⁻¹⁹ C，求它多余多少个电子；若另一个物体带 q = +8.0×10⁻¹⁹ C，求它失去多少个电子。已知 e = 1.6×10⁻¹⁹ C。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 先读符号</p>
<p class="s-b">q 为负 = 电子多出来；q 为正 = 电子少了。符号定方向，绝对值才拿来算个数。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 列式</p>
<p class="s-b">电子只能整个地转移，所以 |q| = n·e，得 <b>n = |q|/e</b>，n 必须是整数。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 第一问</p>
<p class="s-b">n = 4.8×10⁻¹⁹ ÷ 1.6×10⁻¹⁹ = <b>3</b>。负号说明是<b>多余 3 个电子</b>。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 第二问</p>
<p class="s-b">n = 8.0×10⁻¹⁹ ÷ 1.6×10⁻¹⁹ = <b>5</b>。正号说明<b>失去 5 个电子</b>。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 回头检查</p>
<p class="s-b">两个 n 都是整数，与「电荷量是元电荷整数倍」对得上；算出 2.5 就是读错题或抄错数。</p>
<p class="s-k">用到：q = n·e 与电荷守恒。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）q = −4.8×10⁻¹⁹ C，负号表示多余电子，n = |q|/e = 4.8×10⁻¹⁹ ÷ 1.6×10⁻¹⁹ = <b>3</b>，即多余 3 个电子。<br>
（2）q = +8.0×10⁻¹⁹ C，正号表示失去电子，n = 8.0×10⁻¹⁹ ÷ 1.6×10⁻¹⁹ = <b>5</b>，即失去 5 个电子。</p>
</div>
<p class="gx-note">扣分点：把「多余」和「失去」写反；n 算出小数还照抄；答案只写 3 和 5、不写单位「个」。</p>
</div>

<text class="q14 qn" x="175" y="73">−</text>
<line x1="104" y1="66" x2="132" y2="66" stroke="#7c3aed" stroke-width="1.8"/>
<polygon points="136,66 126,61 126,71" fill="#7c3aed"/>
</svg>
</div>
<div class="qac">
<p class="q">感应起电，近端为什么带异种电？</p>
<p class="a"><b>异种相吸：</b>带电体把自由电子吸到近端，近端带异种电，远端带同种电。</p>
<svg viewBox="0 0 240 132">
<rect x="20" y="40" width="24" height="56" rx="5" fill="#fdf3e0" stroke="#b8791f" stroke-width="1.4"/>
<text class="q12 qr" x="32" y="74">＋</text>
<circle cx="120" cy="68" r="40" fill="#eef5fc" stroke="#2f6fd0" stroke-width="1.4"/>
<text class="qb qn" x="98" y="73">−</text>
<text class="qb qr" x="143" y="73">＋</text>
<text class="q85 qg" x="98" y="26">近端</text>
<text class="q85 qg" x="146" y="26">远端</text>
</svg>
</div>
<div class="qac">
<p class="q">电荷守恒到底在说什么？</p>
<p class="a"><b>总量不变：</b>电荷只转移不创生，转移前后电荷量的代数和相同。</p>
<svg viewBox="0 0 240 132">
<circle cx="66" cy="66" r="26" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/>
<text class="q12 qb qp" x="66" y="71">0</text>
<line x1="102" y1="66" x2="132" y2="66" stroke="#7c3aed" stroke-width="1.6"/>
<polygon points="138,66 128,61 128,71" fill="#7c3aed"/>
<circle cx="176" cy="66" r="26" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/>
<text class="q12 qb qp" x="176" y="71">0</text>
</svg>
</div>
<div class="qac">
<p class="q">元电荷是一个电子吗？</p>
<p class="a"><b>不是：</b>e = 1.6×10⁻¹⁹ C 是电荷量，电子带 −e，质子带 +e。</p>
<svg viewBox="0 0 240 132">
<text class="qb qp" x="120" y="48">e = 1.6×10⁻¹⁹ C</text>
<text class="q9 qg" x="120" y="74">q = n·e，n 为整数</text>
<path d="M40 102h160" stroke="#cfd4da" stroke-width="1.4"/>
<path d="M70 97v10M120 97v10M170 97v10" stroke="#7c3aed" stroke-width="2"/>
</svg>
</div>
<div class="qac">
<p class="q">验电器箔片为什么张开？</p>
<p class="a"><b>同种电荷相斥：</b>箔片带同种电互相推开，张开越大电荷量越多。</p>
<svg viewBox="0 0 240 132">
<circle cx="110" cy="30" r="10" fill="#eef5fc" stroke="#2f6fd0" stroke-width="1.5"/>
<line x1="110" y1="40" x2="110" y2="74" stroke="#2f6fd0" stroke-width="2"/>
<line x1="110" y1="74" x2="90" y2="112" stroke="#b8402f" stroke-width="3.5" stroke-linecap="round"/>
<line x1="110" y1="74" x2="130" y2="112" stroke="#b8402f" stroke-width="3.5" stroke-linecap="round"/>
<text class="q9 qg ql" x="150" y="96">同种电相斥</text>
</svg>
</div>
</div>
<p class="gx-note">六问归成一条：<b>先数电子差 n，再乘 e</b>；正负看符号，大小看绝对值。</p>
</section>
<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是错句，右边是能得分的表述。</p>
<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 摩擦创造了电荷。</p>
<p class="er-v">✓ 摩擦只是让电子从一个物体<b>转移</b>到另一个物体。</p>
<p class="er-w">电荷守恒：总量不变，没有新电荷。</p>
</div>
<div class="er">
<p class="er-x">✗ 电荷量可以取任意连续的值。</p>
<p class="er-v">✓ 任何带电体的电荷量都是 e 的<b>整数倍</b>。</p>
<p class="er-w">电子只能整个地转移，没有半个电子。</p>
</div>
<div class="er">
<p class="er-x">✗ 同种电荷相互吸引。</p>
<p class="er-v">✓ <b>同种相斥、异种相吸。</b></p>
<p class="er-w">记反了，验电器和感应起电全错。</p>
</div>
<div class="er">
<p class="er-x">✗ 感应起电不用分近端和远端。</p>
<p class="er-v">✓ 近端带<b>异种</b>电，远端带<b>同种</b>电。</p>
<p class="er-w">自由电子被吸到近端，远端就少了电子。</p>
</div>
<div class="er">
<p class="er-x">✗ 元电荷就是质子。</p>
<p class="er-v">✓ 元电荷是<b>电荷量</b> e，不是粒子；质子带 +e。</p>
<p class="er-w">一个是电荷量，一个是粒子。</p>
</div>
<div class="er">
<p class="er-x">✗ 验电器能测出电荷量的具体数值。</p>
<p class="er-v">✓ 只能判断<b>是否带电</b>、粗略比较电荷量多少。</p>
<p class="er-w">它没有刻度，只能靠箔片张角估。</p>
</div>
</div>

<script>
document.addEventListener("DOMContentLoaded",function(){
var $=GX.$,E=1.6e-19;
function fmtQ(q){
if(!isFinite(q)||q===0)return "0 C";
var sg=q<0?"−":"",a=Math.abs(q),e18=a>=1e-18,m=e18?a/1e-18:a/1e-19;
return sg+m.toFixed(1)+(e18?"×10⁻¹⁸ C":"×10⁻¹⁹ C");
}
var DOTS=[];
for(var i=0;i<10;i++){DOTS.push(GX.el("circle",{cx:62+i*26,cy:238,r:7,fill:"#f1f2f4",stroke:"#cfd4da","stroke-width":1.2},$("gxDots")));}
function render(raw){
var n=Math.round(raw);
if(!isFinite(n))n=0;
n=Math.max(-10,Math.min(10,n));
var q=n*E,neg=n<0,pos=n>0,mg=Math.abs(n),col=neg?"#2f6fd0":pos?"#b8402f":"#6b7280";
$("gxBall").setAttribute("fill",neg?"#edf4fc":pos?"#fdf0ee":"#f1f2f4");
$("gxBall").setAttribute("stroke",col);
$("gxSign").textContent=n===0?"0":(pos?"+"+n:"−"+mg);
$("gxSign").style.fill=col;
$("gxSignLab").textContent=n===0?"中性":(pos?"正电":"负电");
$("gxETip").textContent=n===0?"10 个电子位，一个不多、一个不少":(neg?"多出 "+mg+" 个电子（实心蓝点）":"缺少 "+mg+" 个电子（空心红圈）");
for(var i=0;i<10;i++){
var c=DOTS[i],on=i<mg;
if(on&&neg){c.setAttribute("fill","#2f6fd0");c.setAttribute("stroke","#2f6fd0");c.setAttribute("stroke-dasharray","none");}
else if(on&&pos){c.setAttribute("fill","none");c.setAttribute("stroke","#b8402f");c.setAttribute("stroke-dasharray","3 2");}
else{c.setAttribute("fill","#f1f2f4");c.setAttribute("stroke","#cfd4da");c.setAttribute("stroke-dasharray","none");}
}
$("gxFormula").textContent=n===0?"q = 0 × 1.6×10⁻¹⁹ C = 0 C":"q = "+(pos?"":"−")+mg+" × 1.6×10⁻¹⁹ C = "+fmtQ(q);
$("gxVa").textContent=n===0?"n = 0":"n = "+(pos?"+":"−")+mg;
$("gxVb").textContent=fmtQ(q);
$("gxVs").textContent=n===0?"中性":(pos?"带正电":"带负电");
$("gxStSub").textContent=n===0?"正负电荷等量":(pos?"少了 "+mg+" 个电子":"多出 "+mg+" 个电子");
}
var ap=null,badge=$("gxAp"),apTxt=$("gxApTxt");
function setMode(m){
if(!badge)return;
badge.classList.toggle("is-auto",m==="auto");
badge.classList.toggle("is-manual",m!=="auto");
if(apTxt)apTxt.textContent=m==="auto"?"自动演示中":"你接管了";
}
$("gxSl").addEventListener("input",function(){render(parseFloat(this.value));});
render(0);
ap=AutoPilot.create({
mount:$("gxStage"),follow:$("gxSl"),
loop:[{t:0,v:-10},{t:1.2,v:-10},{t:2.6,v:-5},{t:3.8,v:-5},{t:5.2,v:0},{t:6.4,v:0},{t:7.8,v:5},{t:10.3,v:5},{t:12,v:-10}],
keys:[0,1,5,10],
value:0,min:-10,max:10,step:1,idle:5000,
onChange:function(v){render(v);},
onMode:setMode
});
window.__ap=ap;
});
</script>
