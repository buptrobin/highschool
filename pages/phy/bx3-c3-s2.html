<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本原话，拆成三句</h2>
<div class="q-src">人教版必修第三册 · 第十一章第 2 节</div>

<div class="q">
<p class="q-t">“导体两端的电压与通过导体的电流之比，叫作导体的电阻，R = U/I。”</p>
<p class="q-b">人话：加电压 U、量电流 I，一除得 R。这是<b>测量式</b>——U 加倍时 I 也加倍，比值不变，所以不能说 R 与 U 成正比。</p>
</div>

<div class="q">
<p class="q-t">“同种材料的导体，其电阻与它的长度成正比，与它的横截面积成反比，即 R = ρL/S。”</p>
<p class="q-b">人话：这是<b>决定式</b>。导线拉长一倍，R 加倍；加粗一倍，R 减半。ρ 是材料系数，铜、铝、镍铬各不同。</p>
</div>

<div class="q">
<p class="q-t">“电阻率 ρ 是反映材料导电性能的物理量，单位是 Ω·m。金属的电阻率随温度升高而增大。”</p>
<p class="q-b">人话：ρ 只管材料，不管线多长多粗。温度升高，原子振动更凶，ρ 变大；再冷下去电阻突然消失，就是超导。</p>
</div>

</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>

<div class="gx-ex">
<p class="ex-t">例题 · 用电阻定律算三次<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">一根粗细均匀的铜导线，ρ = 1.7×10⁻⁸ Ω·m，S = 1×10⁻⁶ m²，温度保持不变。求：
（1）L = 2 m 时的电阻 R；（2）L 改为 4 m 时的电阻；（3）L 仍为 2 m、S 增大到 2×10⁻⁶ m² 时的电阻。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 先认清用哪个公式</p>
<p class="s-b">给了材料、长度、粗细就用<b>决定式 R = ρL/S</b>。三个量已是国际单位；若给 mm²，先换成 m²。</p>
<p class="s-k">用到：R = ρL/S；单位统一。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 代入 L = 2 m</p>
<p class="s-b">R = 1.7×10⁻⁸ × 2 ÷ 1×10⁻⁶：先算 1.7×10⁻⁸ ÷ 1×10⁻⁶ = 1.7×10⁻²，再乘 2，得 <b>0.034 Ω</b>。</p>
<p class="s-k">用到：指数相减，10⁻⁸ ÷ 10⁻⁶ = 10⁻²。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 长度变成 4 m</p>
<p class="s-b">ρ、S 不变，L 变成 2 倍，R 也加倍：<b>R′ = 2 × 0.034 = 0.068 Ω</b>。</p>
<p class="s-k">用到：同种材料、S 不变时 R ∝ L。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 面积增大到 2 倍</p>
<p class="s-b">L 回到 2 m，S 变成 2×10⁻⁶ m²，R 与 S 成反比，减半：<b>R″ = 0.034 ÷ 2 = 0.017 Ω</b>。</p>
<p class="s-k">用到：同种材料、L 不变时 R ∝ 1/S。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 写答案，点明控制变量</p>
<p class="s-b">（1）0.034 Ω；（2）0.068 Ω；（3）0.017 Ω。只让 L 或 S 变、其余不动，才能按比例缩放。</p>
<p class="s-k">用到：R = ρL/S 的比例关系；控制变量法。</p>
</li>
</ol>
<div class="exbar">
  <button id="gxNext" type="button">下一步</button>
  <span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）R = 1.7×10⁻⁸ × 2 ÷ 1×10⁻⁶ = <b>0.034 Ω</b>。<br>
（2）S 不变、L 加倍，R 加倍：<b>0.068 Ω</b>。<br>
（3）L 不变、S 加倍，R 减半：<b>0.017 Ω</b>。</p>
</div>
<p class="gx-note">高频扣分：mm² 当 m² 代；长度加倍算成电阻减半；用 R = U/I 硬算；答案漏单位。</p>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>考你会怎么考</h2>

<div class="gx-qa">
<div class="qac">
<p class="q">R = U/I 和 R = ρL/S 有什么区别？</p>
<p class="a"><b>前者是测量式，后者是决定式。</b>R 本身由 ρ、L、S 决定，与 U、I 无关。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="测量式与决定式">
<rect x="14" y="22" width="98" height="44" rx="7" fill="#f5f3ff" stroke="#d8ccfb"/>
<text x="63" y="41" text-anchor="middle" font-size="9.5" fill="#6d28d9">R = U/I</text>
<text x="63" y="57" text-anchor="middle" font-size="8" fill="#6b7280">量出来的</text>
<rect x="128" y="22" width="98" height="44" rx="7" fill="#fdf3e0" stroke="#f3cdc6"/>
<text x="177" y="41" text-anchor="middle" font-size="9.5" fill="#8a5c14">R = ρL/S</text>
<text x="177" y="57" text-anchor="middle" font-size="8" fill="#6b7280">定下来的</text>
<text x="120" y="96" text-anchor="middle" font-size="8.5" fill="#6b7280">U、I 只是探针，不改电阻</text>
<text x="120" y="116" text-anchor="middle" font-size="8.5" fill="#6d28d9">ρ、L、S 才是出身</text>
</svg>
</div>
<div class="qac">
<p class="q">电阻率 ρ 由什么决定？</p>
<p class="a"><b>只由材料和温度决定。</b>铜线剪短拉细，ρ 都不变；镍铬合金的 ρ 大，所以电炉丝不用铜。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="三种材料电阻率不同">
<rect x="18" y="24" width="110" height="16" rx="8" fill="#f6d7a8" stroke="#b8791f"/>
<text x="140" y="37" font-size="8.5" fill="#8a5c14">铜 小</text>
<rect x="18" y="54" width="160" height="16" rx="8" fill="#d7dde4" stroke="#8e97a4"/>
<text x="190" y="67" font-size="8.5" fill="#6b7280">铝 中</text>
<rect x="18" y="84" width="198" height="16" rx="8" fill="#e8c9a0" stroke="#b8791f"/>
<text x="120" y="120" text-anchor="middle" font-size="8.5" fill="#6b7280">镍铬合金 大 → 电炉丝</text>
</svg>
</div>
<div class="qac">
<p class="q">温度升高，金属导线的电阻怎么变？</p>
<p class="a"><b>变大。</b>ρ 随温度升高而增大，L、S 几乎不变。白炽灯刚接通时灯丝还冷，电流比正常发光时大得多。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="金属电阻随温度升高">
<line x1="30" y1="104" x2="212" y2="104" stroke="#5a6472" stroke-width="1.2"/>
<line x1="30" y1="104" x2="30" y2="22" stroke="#5a6472" stroke-width="1.2"/>
<path d="M30 98 Q100 86 150 62 T206 34" fill="none" stroke="#7c3aed" stroke-width="2.2"/>
<text x="204" y="120" text-anchor="end" font-size="8.5" fill="#6b7280">T 升高 → R 变大</text>
<text x="22" y="26" font-size="8" fill="#6b7280" text-anchor="end">R</text>
</svg>
</div>
<div class="qac">
<p class="q">超导体是怎么回事？</p>
<p class="a"><b>温度降到转变温度 Tc 以下，电阻率突然为 0，电阻为零。</b>电流不需电压维持、也不发热。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="超导在 Tc 以下电阻为零">
<line x1="26" y1="102" x2="212" y2="102" stroke="#5a6472" stroke-width="1.2"/>
<line x1="26" y1="102" x2="26" y2="20" stroke="#5a6472" stroke-width="1.2"/>
<path d="M26 40 L96 96 L206 98" fill="none" stroke="#2f8a5b" stroke-width="2.4"/>
<line x1="96" y1="102" x2="96" y2="30" stroke="#b8791f" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="100" y="118" font-size="8.5" fill="#8a5c14">Tc</text>
<text x="142" y="88" font-size="8.5" fill="#1e6640">ρ = 0</text>
</svg>
</div>
<div class="qac">
<p class="q">导线越粗，电阻越大还是越小？</p>
<p class="a"><b>越小。</b>R 与横截面积 S 成反比，加粗到 2 倍电阻减半。大电流的输电线做得很粗，就是为了减小发热。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="导线加粗电阻减半">
<rect x="18" y="28" width="200" height="14" rx="7" fill="#f6d7a8" stroke="#b8791f"/>
<text x="120" y="24" text-anchor="middle" font-size="8.5" fill="#8a5c14">细：S，R</text>
<rect x="18" y="66" width="200" height="34" rx="17" fill="#f6d7a8" stroke="#b8791f"/>
<text x="120" y="118" text-anchor="middle" font-size="8.5" fill="#1e6640">粗：2S，R/2</text>
</svg>
</div>
<div class="qac">
<p class="q">长度加倍、面积也加倍，电阻变几倍？</p>
<p class="a"><b>不变，仍是 1 倍。</b>长度加倍让 R 加倍，面积加倍让 R 减半，两次正好抵消。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="长度与面积同时加倍电阻不变">
<rect x="24" y="30" width="192" height="18" rx="9" fill="#f2c78f" stroke="#b8791f"/>
<text x="120" y="24" text-anchor="middle" font-size="8.5" fill="#8a5c14">2L</text>
<rect x="24" y="62" width="192" height="36" rx="18" fill="#f2c78f" stroke="#b8791f"/>
<text x="120" y="120" text-anchor="middle" font-size="8.5" fill="#1e6640">2S ⇒ R 不变</text>
</svg>
</div>
</div>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>六条易错，逐条改</h2>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 电阻 R 与电压 U 成正比，与电流 I 成反比。</p>
<p class="er-v">✓ R 由材料、长度、横截面积和温度决定，与 U、I 无关。</p>
<p class="er-w">U 加倍时 I 也加倍，比值不变。</p>
</div>
<div class="er">
<p class="er-x">✗ 电阻率 ρ 与导线的长度、粗细有关。</p>
<p class="er-v">✓ ρ 是材料属性，与 L、S 无关，只随材料和温度变。</p>
<p class="er-w">同一根铜线剪成两段，每段 ρ 一样；变的是 L、S，不是 ρ。</p>
</div>
<div class="er">
<p class="er-x">✗ 温度对电阻没有影响，算电阻时不用管。</p>
<p class="er-v">✓ 金属的 ρ 随温度升高而增大，电阻也跟着变大。</p>
<p class="er-w">灯丝冷态与发光时电阻能差十倍，题目要写明“温度不变”。</p>
</div>
<div class="er">
<p class="er-x">✗ 超导体是电阻很小、可以忽略的导体。</p>
<p class="er-v">✓ 超导体在 Tc 以下电阻严格为零，不是“很小”。</p>
<p class="er-w">零电阻意味着电流长期维持而不衰减、不发热。</p>
</div>
<div class="er">
<p class="er-x">✗ 导线越粗电阻越大，因为里面的东西更多。</p>
<p class="er-v">✓ 越粗电阻越小：R 与 S 成反比。</p>
<p class="er-w">加粗是把电子可走的通道放宽，碰撞机会少了，R 反而减小。</p>
</div>
<div class="er">
<p class="er-x">✗ 电阻率的单位和电阻一样，都是 Ω。</p>
<p class="er-v">✓ 电阻率用 Ω·m，电阻才用 Ω。</p>
<p class="er-w">由 R = ρL/S 反推 ρ = RS/L，单位 Ω·m²/m = Ω·m。</p>
</div>
</div>

</section>

<script>
document.addEventListener("DOMContentLoaded", function () {
  var $ = GX.$;
  var K = 1.7e-8 / 1e-6;   /* 0.017 Ω/m */
  var L = 1;
  var X0 = 46, Y0 = 236, X1 = 338, Y1 = 40, RMAX = 0.09;
  function px(l) { return X0 + l / 5 * (X1 - X0); }
  function py(r) { return Y0 - r / RMAX * (Y0 - Y1); }
  function fmtR(r) { return (r < 0.01 ? r.toFixed(4) : r.toFixed(3)); }
  function setA(id, a) { var n = $(id); for (var k in a) n.setAttribute(k, a[k]); }

  function drawLine() {
    var pts = [], i, l;
    for (i = 0; i <= 20; i++) { l = i / 20 * 5; pts.push(px(l).toFixed(1) + " " + py(K * l).toFixed(1)); }
    $("gxLine").setAttribute("d", "M " + pts.join(" L "));
  }

  function render() {
    var R = K * L, cx = px(L), cy = py(R);
    setA("gxDot", { cx: cx.toFixed(1), cy: cy.toFixed(1) });
    setA("gxGx", { x1: cx.toFixed(1), x2: cx.toFixed(1), y1: cy.toFixed(1), y2: Y0 });
    setA("gxGy", { x1: X0, x2: cx.toFixed(1), y1: cy.toFixed(1), y2: cy.toFixed(1) });
    var tag = $("gxTag"), right = cx > 250;
    tag.setAttribute("x", (right ? cx - 9 : cx + 9).toFixed(1));
    tag.setAttribute("text-anchor", right ? "end" : "start");
    tag.setAttribute("y", (cy - 9).toFixed(1));
    tag.textContent = "L = " + L.toFixed(1) + " m";
    $("gxV0").textContent = "L = " + L.toFixed(1) + " m，R = " + fmtR(R) + " Ω";
    $("gxVv").textContent = L.toFixed(1) + " m";
    $("gxVx").textContent = fmtR(R) + " Ω";
    $("gxVt").textContent = L.toFixed(2) + "×";
    $("gxTake").textContent = "L = " + L.toFixed(1) + " m 时 R = " + fmtR(R) + " Ω；长度变成几倍，电阻就跟着变成几倍。";
    $("gxStateNote").textContent = "状态：L 增大，R 增大；比值 R/L 恒为 0.017 Ω/m。";
  }

  var ap = null;
  function setMode(m) {
    var b = $("gxAp"), t = $("gxApTxt");
    if (!b) return;
    b.classList.toggle("is-auto", m === "auto");
    b.classList.toggle("is-manual", m !== "auto");
    if (t) t.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  drawLine();
  render();
  ap = AutoPilot.create({
    mount: $("gxStage"),
    follow: $("gxSl"),
    loop: [{ t: 0, v: 0.5 }, { t: 2, v: 1 }, { t: 4, v: 2 }, { t: 6.5, v: 2 },
           { t: 9, v: 5 }, { t: 11, v: 0.5 }],
    keys: [0.5, 1, 2, 5],
    value: L, min: 0.5, max: 5, step: 0.1,
    idle: 5000,
    onChange: function (v) { L = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
});
</script>
