<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">三条：电场是物质、E = F/q 是量度、点电荷的 E 有公式。</p>

<div class="gx-quote">
<p class="q-t">课本表述 · 电场的存在<span class="q-src">人教版必修第三册 · 第九章第3节</span></p>
<p class="q-b">电荷的周围存在着由它产生的电场，电场是物质存在的一种形式。电荷之间的相互作用是通过电场发生的。</p>
<p class="q-n">→ 人话：两个电荷不接触也能施力，因为中间有<b>电场</b>在传力。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本表述 · 电场强度<span class="q-src">人教版必修第三册 · 第九章第3节</span></p>
<p class="q-b">放入电场中某点的电荷所受的静电力 F 跟它的电荷量 q 的比值，叫做该点的电场强度，E = F/q。电场强度是矢量，方向规定为<b>正电荷</b>在该点所受静电力的方向。</p>
<p class="q-n">→ 人话：E 就是每 1 C 电荷受的力，方向跟正电荷受力走。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本表述 · 点电荷的场强与电场线<span class="q-src">人教版必修第三册 · 第九章第3节</span></p>
<p class="q-b">真空中点电荷的电场强度 E = kQ/r²。电场线从正电荷出发，终止于负电荷（或无穷远），电场线的疏密表示电场强度的大小。</p>
<p class="q-n">→ 人话：Q 越大、r 越小，场越强；线越密 E 越大。</p>
</div>

<p class="gx-note">一条链：<b>Q</b> → <b>E</b> → <b>F = qE</b>。E 描述场，F 描述力。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己写，再点「下一步」。这题考点电荷场强与静电力。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 点电荷的场强与静电力<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">场源电荷 Q = 2.0×10⁻⁶ C 为正点电荷。求 (1) 距 Q 0.30 m 的 P 点场强 E；(2) 放在 P 点的 q = 1.0×10⁻⁸ C 正试探电荷受的静电力 F。（k = 9.0×10⁹ N·m²/C²）</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 先选对公式</p>
<p class="s-b">已知<b>场源 Q</b> 和<b>距离 r</b>，用 <b>E = kQ/r²</b>；F 还不知道，E = F/q 不能先用。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 代数字算 E</p>
<p class="s-b">E = 9.0×10⁹ × 2.0×10⁻⁶ / 0.30² = 1.8×10⁴ / 0.090 = <b>2.0×10⁵ N/C</b>。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 判方向</p>
<p class="s-b">Q 是<b>正</b>电荷，P 在 Q 外侧，所以 E 沿 Q、P 连线<b>背离 Q</b>。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 再求静电力</p>
<p class="s-b">F = qE = 1.0×10⁻⁸ × 2.0×10⁵ = <b>2.0×10⁻³ N</b>；q 为正，F 与 E 同向。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 检查单位与依赖关系</p>
<p class="s-b">r 用米（0.30 m，不是 30）；单位 N/C 与 F/q 一致。换负电荷，<b>F 反向而 E 不变</b>。</p>
<p class="s-k">用到：E 由场源和位置决定。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">(1) E = kQ/r² = 9.0×10⁹×2.0×10⁻⁶/0.30² = <b>2.0×10⁵ N/C</b>，方向沿 Q、P 连线背离 Q。<br>(2) F = qE = 1.0×10⁻⁸×2.0×10⁵ = <b>2.0×10⁻³ N</b>，方向与 E 同向。</p>
</div>
<p class="gx-note">扣分点：r 写成 30；E 写成「指向 Q」；求 F 忘说方向。</p>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>考你会怎么考</h2>
<p class="gx-h2s">六种问法，一半在问「E 到底由谁决定」。</p>

<div class="gx-qa">
<div class="qac">
<p class="q">E = F/q 是定义式还是决定式？</p>
<p class="a"><b>定义式</b>（比值定义）：给出量度方法，不说 E 由谁决定。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="场强由力与电荷量之比定义">
<line x1="60" y1="56" x2="170" y2="56" stroke="#b8402f" stroke-width="2"/><polygon points="180,56 168,51 168,61" fill="#b8402f"/>
<text x="120" y="106" text-anchor="middle" font-size="12" font-weight="700" fill="#3a3a35">E = F / q</text>
</svg>
</div>
<div class="qac">
<p class="q">E 跟 F、q 的大小有关吗？</p>
<p class="a"><b>无关。</b>F 随 q 变，比值 F/q 不变；E 只由场源和位置决定。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="试探电荷增大，场强不变">
<line x1="24" y1="48" x2="78" y2="48" stroke="#2f6fd0" stroke-width="2"/><polygon points="86,48 75,44 75,52" fill="#2f6fd0"/>
<text x="24" y="36" font-size="9" fill="#2f6fd0">q → F</text>
<line x1="24" y1="86" x2="140" y2="86" stroke="#2f6fd0" stroke-width="2"/><polygon points="148,86 137,82 137,90" fill="#2f6fd0"/>
<text x="24" y="74" font-size="9" fill="#2f6fd0">2q → 2F</text>
<text x="156" y="48" font-size="9" fill="#b8402f">E 不变</text>
</svg>
</div>
<div class="qac">
<p class="q">E 的方向怎么定？</p>
<p class="a"><b>正电荷</b>在该点的受力方向；负电荷受力与 E <b>反向</b>。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="场强方向与电荷受力">
<line x1="70" y1="70" x2="172" y2="70" stroke="#7c3aed" stroke-width="2"/><polygon points="182,70 170,65 170,75" fill="#7c3aed"/>
<text x="176" y="58" text-anchor="end" font-size="9" fill="#6d28d9">E</text>
<text x="24" y="48" font-size="10" font-weight="700" fill="#1e6640">+q → F 同向</text>
<text x="24" y="104" font-size="10" font-weight="700" fill="#8f3226">−q → F 反向</text>
</svg>
</div>
<div class="qac">
<p class="q">点电荷场强为什么是 kQ/r²？</p>
<p class="a">把 E = F/q 与 F = kQq/r² 联立，<b>q 约掉</b>。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="点电荷场强的来源">
<circle cx="60" cy="70" r="16" fill="#fdf3e0" stroke="#b8791f" stroke-width="1.5"/>
<text x="60" y="74" text-anchor="middle" font-size="10" font-weight="700" fill="#8a5c14">Q</text>
<line x1="78" y1="70" x2="150" y2="70" stroke="#8a5c14" stroke-width="1.1" stroke-dasharray="3 3"/>
<text x="114" y="62" text-anchor="middle" font-size="9" fill="#8a5c14">r</text>
<circle cx="158" cy="70" r="5" fill="#7c3aed"/>
</svg>
</div>
<div class="qac">
<p class="q">电场线为什么不能相交？</p>
<p class="a">相交处有两个切线方向，同一点 E 就有两个方向，<b>矛盾</b>。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="电场线相交的矛盾">
<path d="M40 30 L200 100" stroke="#7c3aed" stroke-width="1.6" fill="none"/>
<path d="M40 100 L200 30" stroke="#7c3aed" stroke-width="1.6" fill="none"/>
<circle cx="120" cy="65" r="4" fill="#b8402f"/>
</svg>
</div>
<div class="qac">
<p class="q">匀强电场的电场线长什么样？</p>
<p class="a"><b>平行、等距、方向相同</b>；两平行金属板间（边缘除外）近似匀强。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="匀强电场的电场线平行等距">
<rect x="30" y="34" width="180" height="8" rx="2" fill="#fdf3e0" stroke="#b8791f" stroke-width="1.3"/>
<rect x="30" y="90" width="180" height="8" rx="2" fill="#eef5fc" stroke="#2f6fd0" stroke-width="1.3"/>
<g stroke="#7c3aed" stroke-width="1.4">
<line x1="70" y1="46" x2="70" y2="86"/>
<line x1="120" y1="46" x2="120" y2="86"/>
<line x1="170" y1="46" x2="170" y2="86"/>
</g>
</svg>
</div>
</div>
<p class="gx-note">六问归成一条：<b>先认场源，再认距离，最后认电荷正负</b>。E 描述场，F 描述力。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是错句，右边是能得分的表述。</p>
<div class="gx-errs">
<div class="er">
<p class="er-x">✗ E 与 F 成正比、与 q 成反比。</p>
<p class="er-v">✓ E = F/q 是<b>比值定义</b>，E 与 F、q 无关。</p>
<p class="er-w">q 变 F 同比变，比值不变。</p>
</div>
<div class="er">
<p class="er-x">✗ 某点的场强由试探电荷决定。</p>
<p class="er-v">✓ 由<b>场源电荷</b>和该点位置决定。</p>
<p class="er-w">换试探电荷，E 不变、F 变。</p>
</div>
<div class="er">
<p class="er-x">✗ 负电荷受力方向就是 E 的方向。</p>
<p class="er-v">✓ 负电荷受力与 E <b>反向</b>。</p>
<p class="er-w">方向规定里写的是正电荷。</p>
</div>
<div class="er">
<p class="er-x">✗ 电场线就是电荷的运动轨迹。</p>
<p class="er-v">✓ 电场线是<b>假想曲线</b>，只描述场。</p>
<p class="er-w">轨迹还取决于初速度。</p>
</div>
<div class="er">
<p class="er-x">✗ 电场线可以相交。</p>
<p class="er-v">✓ 电场线<b>不相交</b>。</p>
<p class="er-w">否则同一点有两个场强方向。</p>
</div>
<div class="er">
<p class="er-x">✗ 电场强度是标量。</p>
<p class="er-v">✓ 电场强度是<b>矢量</b>，有大小和方向。</p>
<p class="er-w">比大小看绝对值，方向另写。</p>
</div>
</div>
</section>

<div class="gx-foot">
<p>教材依据：人教版《物理》必修第三册（2019年版）第九章第3节。引文按教材整理。数值口径：k = 9.0×10⁹ N·m²/C²，Q = 2.0×10⁻⁶ C，取两位有效数字，均为<b>模型值</b>；本节只算场强大小，方向另行判断。</p>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  var $ = GX.$, KQ = 1.8e4, R = 1, SUP = "⁰¹²³⁴⁵⁶⁷⁸⁹";
  function sci(v) {
    if (!isFinite(v) || v <= 0) return "—";
    var e = Math.floor(Math.log10(v)), m = v / Math.pow(10, e);
    return m.toFixed(1) + "×10" + SUP.charAt(e) + " N/C";
  }
  function render() {
    var r = R, E = KQ / (r * r), rp = 30 + (r - 0.1) / 0.9 * 66;
    var px = 180 + 0.5 * rp, py = 146 - 0.866 * rp, al = 20 + 30 * Math.sqrt(E / 1.8e6);
    $("gxRing").setAttribute("r", rp.toFixed(1));
    $("gxRLine").setAttribute("x2", px.toFixed(1));
    $("gxRLine").setAttribute("y2", py.toFixed(1));
    $("gxRLab").setAttribute("x", (180 + 0.5 * rp - 10).toFixed(1));
    $("gxRLab").setAttribute("y", (146 - 0.866 * rp + 10).toFixed(1));
    $("gxP").setAttribute("cx", px.toFixed(1));
    $("gxP").setAttribute("cy", py.toFixed(1));
    $("gxEArrow").setAttribute("x1", px.toFixed(1));
    $("gxEArrow").setAttribute("y1", py.toFixed(1));
    $("gxEArrow").setAttribute("x2", (px + 0.5 * al).toFixed(1));
    $("gxEArrow").setAttribute("y2", (py - 0.866 * al).toFixed(1));
    $("gxVa").textContent = r.toFixed(2) + " m";
    $("gxVb").textContent = sci(E);
    $("gxVs").textContent = "远离场源";
    $("gxStS").textContent = E >= 2e5 ? "场强较大" : "场强较小";
    $("gxFormula").textContent = "E = 1.8×10⁴/" + r.toFixed(2) + "² = " + sci(E);
    $("gxHint").textContent = E >= 2e5 ? "场强较大：电场线密" : "场强较小：远处线疏";
  }
  var badge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!badge) return;
    badge.classList.toggle("is-auto", m === "auto");
    badge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }
  $("gxSl").addEventListener("input", function () { R = parseFloat(this.value); render(); });
  render();
  var ap = AutoPilot.create({
    mount: $("gxStage"), follow: $("gxSl"),
    loop: [{ t: 0, v: 1 }, { t: 2.2, v: 1 }, { t: 4, v: 0.5 }, { t: 5.2, v: 0.5 }, { t: 7, v: 0.2 },
           { t: 9.5, v: 0.2 }, { t: 10.7, v: 0.1 }, { t: 12.2, v: 0.1 }, { t: 13.6, v: 1 }],
    keys: [0.1, 0.2, 0.5, 1.0],
    value: R, min: 0.1, max: 1, step: 0.01, idle: 5000,
    onChange: function (v) { R = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
});
</script>
