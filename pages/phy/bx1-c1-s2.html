<p class="gx-claim">「走了 100 m」和「位置变了 100 m」不是同一句话——<b>一个数脚印，一个只看首尾</b>。</p>
<div class="gx-meta">
  <span><i></i>人教版必修第一册 · 第一章第 2 节</span>

</div>
<p class="gx-lede">体育课跑圈，你跑完 400 m 回到起点，喘得要命；老师却说「你的位移是 0」。
这不是老师故意气你，而是物理在区分两件事：<b>你走过多少路</b>，和<b>你从哪儿到了哪儿</b>。
这一节把时间轴、路程、位移这三个最容易混的词一次分开，后面学速度、加速度都靠它们打底。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">三个定义，三句人话。先把「点」和「线段」分清，后面就不容易乱。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 时刻与时间间隔<span class="q-src">人教版必修第一册 · 第一章第 2 节</span></p>
<p class="q-b">在表示时间的数轴上，时刻用点表示，时间间隔用线段表示。</p>
<p class="q-n">→ 一句话记：<b>时刻是「咔嚓」一下，时间间隔是「一段录像」</b>。
「第 3 s 末」「第 4 s 初」是同一个点；「第 4 s 内」是从第 3 s 末到第 4 s 末的一段，长度 1 s。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 路程<span class="q-src">人教版必修第一册 · 第一章第 2 节</span></p>
<p class="q-b">物体运动轨迹的长度，叫作路程。</p>
<p class="q-n">→ 关键词是<b>「轨迹的长度」</b>：你实际走过的每一条线都要加起来，拐几个弯就加几段。路程是<b>标量</b>，只有大小，没有方向。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 位移<span class="q-src">人教版必修第一册 · 第一章第 2 节</span></p>
<p class="q-b">由初位置指向末位置的有向线段，表示物体位置的变化，叫作位移。</p>
<p class="q-n">→ 关键词是<b>「初位置 → 末位置」</b>和<b>「有向线段」</b>。中间怎么绕、绕多远，位移都不管；它只认起点和终点。位移是<b>矢量</b>，有大小也有方向。</p>
</div>

<p class="gx-note">最容易混的三组：<b>时刻 / 时间间隔</b>、<b>路程 / 位移</b>、<b>标量 / 矢量</b>。
做题时先问「题目要的是点还是段」「要的是脚印还是首尾」，再动笔。</p>
</section>

<section class="gx-sec" id="b">
<h2><span class="sn">02</span>拆开看</h2>
<p class="gx-h2s">三张图：先在时间轴上分清「点」和「段」，再让同一次运动同时长出「路程」和「位移」。</p>

<figure class="gx-fig">
<div class="fig-cap"><span class="fig-no">图 1</span><span class="fig-t">时刻是点，时间间隔是线段</span><span class="bdg bdg-must">必考</span></div>
<p class="fig-s">同一根时间轴，三种常见说法：<b>第 3 s 末</b>是一个点，<b>第 4 s 内</b>是 1 s 的线段，<b>前 3 s</b>是 3 s 的线段。
「第 n s 末」永远等于「第 n+1 s 初」，这是读题时最值钱的一条换算。</p>
<div class="gx-svgbox">
<svg viewBox="0 0 900 270" role="img" aria-label="时间轴：第3秒末是点，第4秒内是1秒线段，前3秒是3秒线段">

<p class="gx-take">读题先看它给的是<b>点</b>还是<b>段</b>：给点就找位置，给段就算长度。把「第 3 s 末」读成「第 3 s 内」，后面所有运动学计算都会错位 1 s。</p>
</figure>

<figure class="gx-fig">

但位置只从 A 变到 C，所以<b>位移 = 从 A 指向 C 的有向线段</b>。虚线是位移，实线是路程。</p>

<figure class="gx-fig">

</div>
<div class="stats">
  <div class="st"><div class="k">① 位移 Δx</div><div class="v" id="gxVa">0 m</div><div class="s">A 指向当前点</div></div>
  <div class="st"><div class="k">② 路程 s</div><div class="v" id="gxVb">0 m</div><div class="s">走过的每段都相加</div></div>
  <div class="st state" id="gxStBox"><div class="k">③ 状态判断</div><div class="v" id="gxVs">还没出发</div><div class="s" id="gxVsn">t = 0 s</div></div>
</div>
<p class="gx-take">t = 5 s 时位移 = 路程 = 8 m；t = 10 s 时位移只有 3 m，路程却是 13 m——<b>位移看首尾，路程看脚印</b>。</p>
<p class="gx-note">模型口径：0–5 s 向右走 8 m（速度 1.6 m/s），5–10 s 掉头返回 5 m，最后停在 3 m 处（速度 1 m/s）；轨迹为直线。
图中「去程 / 已走回」两段颜色是按「是否已经掉头」上色，不代表速度大小。数值由分段函数算出，不是实测。</p>
</figure>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己画一条数轴，再点「下一步」。这题的关键不是算，而是先分清「位移」和「路程」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 位移与路程<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">某同学从操场 A 点出发，先向东走 6 m 到 B 点，再向西走 10 m 到 C 点。以向东为正方向。<br>
（1）求全程的位移；（2）求全程的路程；（3）若他从 C 点再向东走 4 m 回到 A 点，求整个过程的位移和路程。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 建坐标、定正方向、标位置</p>
<p class="s-b">以 A 为原点，向东为正方向。则 A 的坐标 x<sub>A</sub> = 0，B 在 A 东边 6 m，x<sub>B</sub> = +6 m；C 在 B 西边 10 m，x<sub>C</sub> = 6 − 10 = −4 m。</p>
<p class="s-k">用到：一维坐标系中，位置是带符号的数；向东为正，向西就为负。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 位移 = 末位置 − 初位置</p>
<p class="s-b">全程从 A 到 C，位移 Δx = x<sub>C</sub> − x<sub>A</sub> = −4 − 0 = −4 m。
负号表示方向与正方向相反，所以位移大小是 4 m，方向<b>向西</b>。</p>
<p class="s-k">用到：Δx = x末 − x初；负号只表示方向。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 路程 = 各段轨迹长度相加</p>
<p class="s-b">A→B 走 6 m，B→C 走 10 m，两段方向不同但都要算进路程：s = 6 + 10 = 16 m。
路程是标量，只问「一共走了多少」，不管往哪走。</p>
<p class="s-k">用到：路程 = 轨迹长度之和；掉头、拐弯都不能把路程相减。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 回到 A：位移归零，路程继续加</p>
<p class="s-b">若从 C 再向东走 4 m 回到 A，初位置和末位置都是 A，位移 Δx = 0 − 0 = 0。
但路程要再加 4 m：s = 16 + 4 = 20 m。<b>位移为 0，不等于没动过。</b></p>
<p class="s-k">用到：位移只看首尾；路程把每一步都记账。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口：把三个答案写成一句话</p>
<p class="s-b">（1）位移 4 m，方向向西；（2）路程 16 m；（3）回到 A 后，位移为 0，路程为 20 m。
答题卡上要分别写「位移」和「路程」，不要只写一个「4 m」或「16 m」。</p>
<p class="s-k">用到：矢量答方向，标量答大小；单位不能丢。</p>
</li>
</ol>
<div class="exbar">
  <button id="gxNext" type="button">下一步</button>
  <span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）位移 Δx = x<sub>C</sub> − x<sub>A</sub> = −4 m，即大小 4 m，方向<b>向西</b>。<br>
（2）路程 s = 6 m + 10 m = <b>16 m</b>。<br>
（3）回到 A 时，位移 Δx = 0；路程 s = 6 m + 10 m + 4 m = <b>20 m</b>。</p>
</div>
<p class="gx-note">易错点：第（1）问只写「4 m」会丢方向；第（3）问看到「回到起点」就写「什么都没发生」会丢路程。位移和路程必须分开答。</p>
</div>
</section>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>考你会怎么考</h2>
<p class="gx-h2s">六种问法，核心只有一句：先判断题目要「点」还是「段」，要「首尾」还是「脚印」。</p>

<div class="gx-qa">
<div class="qac">
<p class="q">「第 3 s 末」和「第 4 s 初」是同一时刻吗？</p>
<p class="a"><b>是。</b>第 3 s 结束的那一瞬间，就是第 4 s 开始的那一瞬间；在时间轴上，它们是同一个点。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="第3秒末与第4秒初是同一个点">
  <line x1="20" y1="72" x2="220" y2="72" stroke="#5a6472"/>
  <line x1="120" y1="64" x2="120" y2="80" stroke="#5a6472"/>
  <circle cx="120" cy="72" r="7" fill="#fff" stroke="#b8402f" stroke-width="3"/>
  <text x="120" y="52" text-anchor="middle" font-size="11" fill="#b8402f">同一个点</text>
  <text x="66" y="100" text-anchor="middle" font-size="10.5" fill="#6b7280">第 3 s 末</text>
  <text x="174" y="100" text-anchor="middle" font-size="10.5" fill="#6b7280">第 4 s 初</text>
</svg>
</div>
<div class="qac">
<p class="q">「第 4 s 内」是多长时间？</p>
<p class="a"><b>1 s。</b>从第 3 s 末到第 4 s 末，是时间轴上的一段；「第 n s 内」永远是 1 s 的间隔。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="第4秒内是1秒的时间间隔">
  <line x1="20" y1="72" x2="220" y2="72" stroke="#5a6472"/>
  <line x1="100" y1="64" x2="100" y2="80" stroke="#5a6472"/>
  <line x1="160" y1="64" x2="160" y2="80" stroke="#5a6472"/>
  <line x1="100" y1="88" x2="160" y2="88" stroke="#b8791f" stroke-width="6" stroke-linecap="round"/>
  <text x="130" y="112" text-anchor="middle" font-size="11" fill="#8a5c14">1 s</text>
  <text x="100" y="52" text-anchor="middle" font-size="10.5" fill="#6b7280">3 s 末</text>
  <text x="160" y="52" text-anchor="middle" font-size="10.5" fill="#6b7280">4 s 末</text>
</svg>
</div>
<div class="qac">
<p class="q">位移的大小一定等于路程吗？</p>
<p class="a"><b>不一定。</b>只有<b>单向直线运动</b>时两者大小才相等；拐弯、掉头、绕圈，路程都会更大。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="折线运动的路程大于位移">
  <path d="M30 100 L110 40 L210 96" fill="none" stroke="#7c3aed" stroke-width="2.4"/>
  <line x1="30" y1="100" x2="210" y2="96" stroke="#2f8a5b" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="120" y="118" text-anchor="middle" font-size="10.5" fill="#1e6640">虚线位移 &lt; 实线路程</text>
</svg>
</div>
<div class="qac">
<p class="q">位移是负数，说明位移在变小吗？</p>
<p class="a"><b>不是。</b>负号只表示方向与正方向相反。−4 m 的大小是 4 m，方向沿负方向。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="负位移表示方向与正方向相反">
  <line x1="30" y1="70" x2="210" y2="70" stroke="#5a6472"/>
  <polygon points="220,70 206,64 206,76" fill="#5a6472"/>
  <text x="214" y="90" text-anchor="middle" font-size="10.5" fill="#6b7280">正方向</text>
  <line x1="120" y1="96" x2="56" y2="96" stroke="#b8402f" stroke-width="3"/>
  <polygon points="46,96 60,90 60,102" fill="#b8402f"/>
  <text x="120" y="118" text-anchor="middle" font-size="10.5" fill="#b8402f">−4 m：向左 4 m</text>
</svg>
</div>
<div class="qac">
<p class="q">位移为 0，物体一定没动吗？</p>
<p class="a"><b>不一定。</b>绕操场跑一圈回到起点，位移是 0，但路程是 400 m；「没动」要看路程是不是也为 0。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="跑一圈回起点：位移为零，路程不为零">
  <ellipse cx="120" cy="62" rx="58" ry="30" fill="none" stroke="#7c3aed" stroke-width="2.4"/>
  <circle cx="120" cy="92" r="5" fill="#1b1b19"/>
  <text x="120" y="116" text-anchor="middle" font-size="10.5" fill="#6b7280">位移 0，路程 400 m</text>
</svg>
</div>
<div class="qac">
<p class="q">路程为 0，位移一定为 0 吗？</p>
<p class="a"><b>一定。</b>路程为 0 表示一步都没走，初位置和末位置只能相同，所以位移也为 0。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="路程为零时位移也为零">
  <circle cx="120" cy="62" r="6" fill="#1b1b19"/>
  <text x="120" y="42" text-anchor="middle" font-size="11" fill="#6b7280">没动</text>
  <text x="120" y="104" text-anchor="middle" font-size="10.5" fill="#1e6640">路程 0 → 位移 0</text>
</svg>
</div>
</div>
<p class="gx-note">反向不成立：位移为 0，路程不一定为 0；但路程为 0，位移一定为 0。<b>「路程 ≥ 位移大小」</b>这条不等式，考试很爱拿来出选择题。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是阅卷时真见过的写法，右边是能得分的表述。逐条对照，别只划对错。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 「第 3 s 末」就是「第 3 s 内」。</p>
<p class="er-v">✓ 「第 3 s 末」是时刻（点），「第 3 s 内」是 1 s 的时间间隔（段）。</p>
<p class="er-w">「第 n s 内」从第 n−1 s 末算到第 n s 末；「第 n s 末」只是末端那一下。</p>
</div>
<div class="er">
<p class="er-x">✗ 位移就是路程，只是叫法不同。</p>
<p class="er-v">✓ 位移是由初位置指向末位置的有向线段，路程是轨迹长度。</p>
<p class="er-w">位移是矢量，路程是标量；一个看首尾，一个看脚印。</p>
</div>
<div class="er">
<p class="er-x">✗ 位移的大小总等于路程。</p>
<p class="er-v">✓ 只有单向直线运动时，位移大小才等于路程；其他情况路程更大。</p>
<p class="er-w">拐弯、掉头、绕圈，都会让路程增加，而位移只认起点和终点。</p>
</div>
<div class="er">
<p class="er-x">✗ 位移是 −4 m，说明位移比 −2 m 小。</p>
<p class="er-v">✓ 负号表示方向与正方向相反；比较位移大小时要比绝对值。</p>
<p class="er-w">−4 m 的大小是 4 m，−2 m 的大小是 2 m；4 m &gt; 2 m。</p>
</div>
<div class="er">
<p class="er-x">✗ 位移为 0，说明物体一直没动。</p>
<p class="er-v">✓ 位移为 0 只说明初、末位置相同；物体可能绕了一圈，路程不为 0。</p>
<p class="er-w">跑圈回起点就是典型反例：位移 0，路程 400 m。</p>
</div>
<div class="er">
<p class="er-x">✗ 路程也有方向，只是不好画。</p>
<p class="er-v">✓ 路程是标量，只有大小，没有方向。</p>
<p class="er-w">说「向西走了 10 m」时，「向西」是运动方向，不是路程这个量本身的方向。</p>
</div>
</div>
</section>

<p class="gx-note" style="border-top:1px solid var(--line);padding-top:14px">下一节：<b>位置变化快慢的描述——速度</b>。位移 ÷ 时间，得到的为什么可能是「平均」，也可能是一瞬间？</p>

<div class="gx-foot">
<p>教材依据：人教版《物理》必修第一册（2019 年版）第一章第 2 节「时间 位移」。课文引文按教材表述整理，页码以纸质书为准。</p>
<p>数值口径：互动中的 8 m、3 m、5 s、10 s 是为演示「先前进再掉头」设的<b>模型参数</b>；例题中的 6 m、10 m、4 m 为题目数据，不涉及真实测量。</p>
<p>本页互动为分段匀速模型，图形按位置比例绘制；「位移 = 首尾、路程 = 轨迹和」是定义，不依赖具体速度。</p>
</div>

</div>

<div class="gx-zoom" id="gxZoom" hidden>
  <span class="gx-zoom-tip">双指放大看细节</span>

<script src="../../assets/page.js"></script>
<script src="../../assets/gx.js"></script>
<script src="../../assets/autopilot.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var $ = GX.$;
  var scene = $("gxStage"), track = $("tmTrack");
  var T = 0;

  function calc(t) {
    var x = t <= 5 ? 1.6 * t : 13 - t;
    var dist = t <= 5 ? x : 16 - x;
    var st, col, bg, sn;
    if (t < 0.05) {
      st = "还没出发"; col = "#5a6472"; bg = "#f4f7f9"; sn = "t = 0 s，位移和路程都是 0";
    } else if (t < 4.95) {
      st = "同向走：位移 = 路程"; col = "#2f8a5b"; bg = "#e6f6ee";
      sn = "还没掉头，两个数一起涨";
    } else if (t <= 5.05) {
      st = "最远点：两者都是 8 m"; col = "#b8791f"; bg = "#fdf3e0";
      sn = "一过这点，位移开始小于路程";
    } else {
      st = "掉头了：位移 < 路程"; col = "#b8402f"; bg = "#fbeae7";
      sn = "位移只看 A 到当前点";
    }
    return { x: x, dist: dist, st: st, col: col, bg: bg, sn: sn };
  }

  function fmt(v) {
    if (Math.abs(v) < 0.05) return "0.0";
    return (v > 0 ? "+" : "−") + Math.abs(v).toFixed(1);
  }

  function render() {
    var s = calc(T), pct = s.x / 10 * 100, outPct = Math.min(s.x, 8) / 10 * 100;
    var backPct = (T > 5 && s.x < 8) ? (8 - s.x) / 10 * 100 : 0;
    $("tmT").textContent = T.toFixed(1);
    $("tmX").textContent = "位置 x = " + fmt(s.x) + " m";
    $("tmOut").style.width = outPct + "%";
    $("tmBack").style.left = pct + "%";
    $("tmBack").style.width = backPct + "%";
    $("tmDot").style.left = pct + "%";
    $("tmBracket").style.width = pct + "%";
    $("tmBracketTxt").textContent = "Δx = " + fmt(s.x) + " m";
    $("tmBracket").style.opacity = s.x < 0.02 ? "0" : "1";

    $("gxVa").textContent = fmt(s.x) + " m";
    $("gxVb").textContent = s.dist.toFixed(1) + " m";
    $("gxVs").textContent = s.st;
    $("gxVsn").textContent = s.sn;
    $("gxStBox").style.background = s.bg;
    $("gxStBox").style.borderColor = s.col + "44";
    $("gxVs").style.color = s.col;
  }

  var ap = null, dragging = false, moved = false, downX = 0, suppressTap = false;

  function xToT(clientX) {
    var r = track.getBoundingClientRect();
    var f = (clientX - r.left) / r.width;
    return Math.max(0, Math.min(10, Math.round(f * 100) / 10));
  }

  scene.addEventListener("pointerdown", function (ev) {
    dragging = true; moved = false; downX = ev.clientX;
    if (ap) ap.take();
    T = xToT(ev.clientX);
    if (ap) ap.setValue(T, false);
    render();
    try { scene.setPointerCapture(ev.pointerId); } catch (e) {}
  });
  scene.addEventListener("pointermove", function (ev) {
    if (!dragging) return;
    if (Math.abs(ev.clientX - downX) > 4) moved = true;
    T = xToT(ev.clientX);
    if (ap) ap.setValue(T, false);
    render();
  });
  scene.addEventListener("pointerup", function () {
    if (moved) suppressTap = true;
    dragging = false;
  });
  scene.addEventListener("click", function (ev) {
    if (!suppressTap) return;
    suppressTap = false;
    ev.stopImmediatePropagation();
  });

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  render();
  ap = AutoPilot.create({
    mount: scene,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 0 }, { t: 2.5, v: 3 }, { t: 4.5, v: 5 }, { t: 7, v: 5 },
           { t: 9.5, v: 8 }, { t: 11.5, v: 10 }, { t: 13.5, v: 0 }],
    keys: [0, 2.5, 5, 7.5, 10],
    value: T, min: 0, max: 10, step: 0.1,
    idle: 5000,
    onChange: function (v) { T = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc };
});
</script>
</body>
