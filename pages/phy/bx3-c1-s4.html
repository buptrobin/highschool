<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">三条：静电平衡、尖端放电、静电屏蔽。</p>

<div class="gx-quote">
<p class="q-t">课本表述 · 静电平衡<span class="q-src">人教版必修第三册 · 第九章第4节</span></p>
<p class="q-b">导体内的自由电子在电场力作用下定向移动，直到导体内部场强处处为零，此时导体处于静电平衡状态；导体表面处的场强方向与表面垂直，整个导体是一个等势体。</p>
<p class="q-n">→ 人话：电荷在导体内部待不住，全跑到表面上；平衡之后，导体内部<strong>一点电场都没有</strong>。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本表述 · 尖端放电<span class="q-src">人教版必修第三册 · 第九章第4节</span></p>
<p class="q-b">导体尖端的电荷密度很大，附近的电场很强，使空气中残留的离子剧烈运动，空气被电离，形成导电通道，这就是尖端放电。</p>
<p class="q-n">→ 人话：同样的电荷挤在尖上，密度大、场强大，强到把空气“撑”穿，电荷就顺着空气漏走。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本表述 · 静电屏蔽<span class="q-src">人教版必修第三册 · 第九章第4节</span></p>
<p class="q-b">空腔导体（或金属网罩）能使空腔内部不受外部电场的影响；接地导体壳还可以把内部电场“关”在壳内，使壳外也不受影响。</p>
<p class="q-n">→ 人话：金属壳是一把伞，外电场落不到里面；接了地，里面的电场也跑不到外面。</p>
</div>

<p class="gx-note">三条是一条链：<b>静电平衡</b>把电荷赶到表面 → 表面越尖电荷越密 → 场强大到击穿空气就叫<b>尖端放电</b>；用导体把这块空间包起来，就是<b>静电屏蔽</b>。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己算，再点「下一步」。这题只考「E = kQ/r² + 和击穿场强比大小」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 尖端该不该放电<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">避雷针尖端可看成半径 r 的带电小球，尖端积累电荷 Q = 1.0×10⁻⁹ C。取 k = 9.0×10⁹ N·m²/C²，空气的击穿场强约为 3×10⁶ V/m。<br>
(1) r = 1 mm 时尖端附近的场强多大？(2) r = 2 mm 时呢？(3) 两种情况下会不会发生尖端放电？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 认模型</p>
<p class="s-b">尖端曲率很小，电荷几乎全挤在这一小块上。把它<b>等效成半径 r 的带电小球</b>，球外场强用点电荷公式 <b>E = kQ/r²</b>，r 用国际单位。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 代 r = 1 mm</p>
<p class="s-b">r = 1.0×10⁻³ m，r² = 1.0×10⁻⁶ m²；E = 9.0×10⁹×1.0×10⁻⁹ ÷ 1.0×10⁻⁶ = <b>9.0×10⁶ V/m</b>。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 代 r = 2 mm</p>
<p class="s-b">r 变 2 倍，r² 变 4 倍，E 变成 1/4：E = 9.0×10⁶ ÷ 4 = <b>2.25×10⁶ V/m</b>。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 和击穿场强比大小</p>
<p class="s-b">空气击穿场强 3×10⁶ V/m。1 mm 时 <b>9.0×10⁶ &gt; 3×10⁶</b>，空气被电离，<b>尖端放电</b>；2 mm 时 <b>2.25×10⁶ &lt; 3×10⁶</b>，<b>不放电</b>。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 写出临界半径</p>
<p class="s-b">令 kQ/r² = 3×10⁶，得 r = √(9.0×10⁻⁶) ≈ <b>1.7 mm</b>：尖端半径小于它才放电。这就是“尖端”二字的量化含义。</p>
<p class="s-k">用到：E = kQ/r²；击穿判据 E 与 3×10⁶ V/m 比大小。</p>
</li>
</ol>
<div class="exbar">
  <button id="gxNext" type="button">下一步</button>
  <span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">(1) E = kQ/r² = 9.0×10⁹×1.0×10⁻⁹/(1.0×10⁻³)² = <b>9×10⁶ V/m</b>。<br>
(2) E = kQ/r² = 9.0×10⁹×1.0×10⁻⁹/(2.0×10⁻³)² = <b>2.25×10⁶ V/m</b>。<br>
(3) r = 1 mm 时 E = 9×10⁶ V/m &gt; 3×10⁶ V/m，空气被击穿，<b>发生尖端放电</b>；r = 2 mm 时 E = 2.25×10⁶ V/m &lt; 3×10⁶ V/m，<b>不发生尖端放电</b>。临界半径约 1.7 mm。</p>
</div>
<p class="gx-note">扣分点：r 忘换成米；把 2 mm 也算成放电（2.25 比 3 小）；结论只写“放电”，不写和击穿场强比较的过程。</p>
</div>
</section>

        " L" + (CX - 5) + " " + (y0 - 23) + " L" + (CX + 4) + " " + (y0 - 30) : "");
    $("gxSpark").setAttribute("opacity", on ? "1" : "0");

    var h = Math.min(E / 1e6 / ETOP, 1) * (BASE - TOP);
    var bar = $("gxBar");
    bar.setAttribute("y", (BASE - h).toFixed(1));
    bar.setAttribute("height", h.toFixed(1));
    bar.setAttribute("fill", on ? "#b8402f" : "#2f6fd0");

    $("gxVa").textContent = (Math.round(RM * 10) / 10) + " mm";
    $("gxVb").textContent = fmtE(E);
    $("gxVs").textContent = on ? "尖端放电" : "不放电";
    $("gxVs").style.color = on ? "#b8402f" : "#1e6640";
    $("gxVc").textContent = on ? "E 超过 3×10⁶ V/m，空气被击穿" : "E 低于 3×10⁶ V/m，不击穿";
    $("gxHint").textContent = on ? "r 小 → 场强强 → 尖端放电" : "r 大 → 场强弱 → 不放电";
  }

  var badge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!badge) return;
    badge.classList.toggle("is-auto", m === "auto");
    badge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  $("gxSl").addEventListener("input", function () { RM = parseFloat(this.value); render(); });

  render();
  var ap = AutoPilot.create({
    mount: $("gxStage"), follow: $("gxSl"),
    loop: [{ t: 0, v: 5 }, { t: 1.4, v: 5 }, { t: 2.8, v: 2 }, { t: 4.0, v: 2 },
           { t: 5.4, v: 1 }, { t: 7.9, v: 1 }, { t: 9.3, v: 0.5 }, { t: 10.6, v: 0.5 },
           { t: 12.0, v: 5 }],
    keys: [5, 2, 1, 0.5],
    value: RM, min: 0.5, max: 5, step: 0.1, idle: 5000,
    onChange: function (v) { RM = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
});
</script>
</body>
</html>
