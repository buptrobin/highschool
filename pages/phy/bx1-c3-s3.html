<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">三句话：力的作用是相互的；这一对力等大反向共线；它和「平衡力」是两回事。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 力的相互性<span class="q-src">人教版必修第一册 · 第三章第 3 节</span></p>
<p class="q-b">物体之间力的作用是相互的。一个物体对另一个物体施加了力，受力物体同时也对施力物体施加了力。</p>
<p class="q-n">→ 这句话把「施力物体」和「受力物体」的相对性说清楚了：你推墙时，你是施力物体，同时也是受力物体。
所以受力分析时，<b>只画「作用在这个物体上」的力</b>，别把它对别人的力也画进来。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 牛顿第三定律<span class="q-src">人教版必修第一册 · 第三章第 3 节</span></p>
<p class="q-b">两个物体之间的作用力和反作用力总是大小相等，方向相反，作用在同一条直线上。</p>
<p class="q-n">→ 三个「同」：<b>同时产生、同时变化、同时消失</b>；两个「不同」：<b>作用在不同物体上、不能求合力</b>。
它们性质也相同：压力与支持力都是弹力，地球拉物体的力与物体拉地球的力都是引力。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 二力平衡（第 5 节，对比用）<span class="q-src">人教版必修第一册 · 第三章第 5 节</span></p>
<p class="q-b">作用在同一个物体上的两个力，如果大小相等、方向相反，并且在同一条直线上，这两个力就彼此平衡。</p>
<p class="q-n">→ 和牛顿第三定律长得几乎一样，区别只有一个：<b>作用在几个物体上</b>。
平衡力作用在<b>同一个</b>物体上，效果互相抵消；作用力与反作用力分居<b>两个</b>物体，各自产生效果，谁也抵消不了谁。</p>
</div>

<p class="gx-note">判断口诀只有一句：<b>先数「这两个力各作用在谁身上」</b>。同一个物体 → 平衡力（或都不是）；两个物体 → 才可能是作用力与反作用力。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">这题几乎每次考「牛顿第三定律」都会出现：书放在桌上，问 N 与 G 是不是作用力与反作用力。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 平衡力还是作用力与反作用力<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">一本书静止在水平桌面上。书受到的支持力 N 与书受到的重力 G，是不是一对作用力与反作用力？请说明理由，并写出 N 与 G 各自的反作用力。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 先看这两个力各作用在谁身上</p>
<p class="s-b">N 是桌面给书的，作用在<b>书</b>上；G 是地球给书的，也作用在<b>书</b>上。
两个力作用在<b>同一个物体</b>上——这一条就足以判定：它们不是作用力与反作用力。</p>
<p class="s-k">用到：作用力与反作用力必须作用在两个不同物体上。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 找 N 的反作用力</p>
<p class="s-b">N 是「桌对书」的力，它的反作用力就是「书对桌」的力，即书压桌面的压力 N′，作用在<b>桌面上</b>。
N 与 N′ 都是弹力，同时产生、同时消失。</p>
<p class="s-k">用到：一对作用力与反作用力性质相同、施受互换。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 找 G 的反作用力</p>
<p class="s-b">G 是「地球对书」的力，反作用力是「书对地球」的力，即书吸引地球的力 G′，作用在<b>地球上</b>。</p>
<p class="s-k">用到：重力的施力物体是地球，反作用力作用在地球上。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 判定 N 与 G 的关系</p>
<p class="s-b">N 与 G 作用在同一物体（书）上、大小相等、方向相反、在同一直线上，所以它们是一对<b>平衡力</b>。
书静止就是因为这两个力抵消了。</p>
<p class="s-k">用到：二力平衡条件；平衡力的合力为零。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 用「三个不同」收尾</p>
<p class="s-b">作用力与反作用力：作用在<b>两个</b>物体上、性质<b>相同</b>、同时产生同时消失、<b>不能</b>抵消。
平衡力：作用在<b>同一</b>物体上、性质<b>不一定相同</b>、可以抵消、撤掉一个另一个也消失（但不必同时产生）。</p>
<p class="s-k">用到：区分两对力的四条判据，答题时按「作用物体 → 能否抵消」写。</p>
</li>
</ol>
<div class="exbar">
  <button id="gxNext" type="button">下一步</button>
  <span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">不是。支持力 N 与重力 G 都作用在书这同一个物体上，而作用力与反作用力必须作用在两个不同的物体上，所以 N 与 G 是一对<b>平衡力</b>。<br>
N 的反作用力是书对桌面的压力 N′，作用在桌面上；G 的反作用力是书对地球的吸引力 G′，作用在地球上。<br>
N 与 N′ 是一对作用力与反作用力，G 与 G′ 是另一对作用力与反作用力。</p>
</div>
<p class="gx-note">答题卡上别只写「不是」，要把「作用在同一物体上」这句判据写出来。标准答案的三句话：判据、两对反作用力、结论。</p>
</div>
</section>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>考你会怎么考</h2>
<p class="gx-h2s">六种问法，每个都在问同一件事：这两个力到底作用在几个物体上。</p>

<div class="gx-qa">
<div class="qac">
<p class="q">作用力与反作用力能抵消吗？</p>
<p class="a"><b>不能。</b>它们作用在两个不同物体上，各干各的：地面推你，你才前进；你推地面，地面（地球）才被推。谈「抵消」必须作用在同一物体上。</p>

<p class="a"><b>同时。</b>同时产生、同时变化、同时消失，没有先后。撤掉作用力，反作用力在同一瞬间消失。</p>

<p class="a"><b>不一定。</b>只有静止或匀速直线运动、且没有别的竖直分力时才相等。电梯加速上升时 N &gt; G，加速下降时 N &lt; G。</p>

<p class="q">作用力与反作用力可以是不同性质的力吗？</p>
<p class="a"><b>不能。</b>一对作用力与反作用力性质相同：压力和支持力都是弹力，摩擦力的反作用力也是摩擦力，引力的反作用力也是引力。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是卷面上真出现过的句子，右边是能得分的表述。这一节几乎全部的错，都是「把两个物体当成一个」。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 先有作用力，后有反作用力，反作用力总是慢一步。</p>
<p class="er-v">✓ 作用力与反作用力同时产生、同时变化、同时消失。</p>
<p class="er-w">把「因果」和「相互作用」混了；两个力是同一事件的两面，没有先后。</p>
</div>
<div class="er">
<p class="er-x">✗ 作用力和反作用力大小相等，所以合力为零，物体不动。</p>
<p class="er-v">✓ 它们作用在两个不同物体上，不能求合力，谈不上抵消。</p>
<p class="er-w">求合力必须对同一个物体；把两个物体的力相加，是受力分析的低级错误。</p>
</div>
<div class="er">
<p class="er-x">✗ 书受的支持力 N 与书受的重力 G 是一对作用力与反作用力。</p>
<p class="er-v">✓ N 与 G 都作用在书上，是一对平衡力；N 的反作用力是书对桌面的压力。</p>
<p class="er-w">数值相等让人误以为是「一对」，判据是「作用物体」而不是「大小」。</p>
</div>
<div class="er">
<p class="er-x">✗ 作用力和反作用力作用在同一个物体上，方向相反。</p>
<p class="er-v">✓ 作用力与反作用力分别作用在两个物体上。</p>
<p class="er-w">「同一物体上、等大反向」是平衡力的定义，两句话只差一个词。</p>
</div>
<div class="er">
<p class="er-x">✗ 拔河时赢的一方拉力更大。</p>
<p class="er-v">✓ 绳两端拉力大小相等；赢的一方靠地面摩擦力更大。</p>
<p class="er-w">把「绳子对两队的拉力」和「地面对人的摩擦力」混了；决定胜负的是后者。</p>
</div>
<div class="er">
<p class="er-x">✗ 甲的质量比乙大，所以甲推乙的力比乙推甲的力大。</p>
<p class="er-v">✓ 两个力始终大小相等；质量不同导致的是加速度不同（a = F/m）。</p>
<p class="er-w">力与质量通过 a 联系，但不能用力的大小去「补偿」质量差异。</p>
</div>
</div>
</section>

<p class="gx-note" style="border-top:1px solid var(--line);padding-top:14px">这一节给了你一把尺子：<b>数作用物体</b>。下一节要用到它——把几个力合成时，只有作用在同一物体上的力才能相加。</p>

    $("gxReadA").textContent = txt;
    $("gxReadB").textContent = txt;
    $("gxVa").textContent = txt;
    $("gxVb").textContent = Fv.toFixed(1) + " N";

    var len = Fv / FTOP * 80;
    var aTip = 84 + len;
    $("gxArrowA").setAttribute("x2", aTip);
    $("gxArrowAHead").setAttribute("points", aTip + ",196 " + (aTip - 10) + ",191 " + (aTip - 10) + ",201");
    $("gxArrowA").style.opacity = Fv < 0.05 ? "0" : "1";
    $("gxArrowAHead").style.opacity = Fv < 0.05 ? "0" : "1";

    var bTip = 276 - len;
    $("gxArrowB").setAttribute("x2", bTip);
    $("gxArrowBHead").setAttribute("points", bTip + ",196 " + (bTip + 10) + ",191 " + (bTip + 10) + ",201");
    $("gxArrowB").style.opacity = Fv < 0.05 ? "0" : "1";
    $("gxArrowBHead").style.opacity = Fv < 0.05 ? "0" : "1";

    $("gxDiff").textContent = "读数差 = 0.0 N（" + Fv.toFixed(1) + " − " + Fv.toFixed(1) + "）";

    var col = Fv < 0.05 ? "#6b7280" : "#2f8a5b";
    $("gxVs").textContent = Fv < 0.05 ? "两个力都为零" : "一对作用力与反作用力";
    $("gxVsn").textContent = Fv < 0.05
      ? "没有拉，就没有这对力"
      : "同时产生、同时消失，作用在两个物体上";
    $("gxVs").style.color = col;
    $("gxStBox").style.background = Fv < 0.05 ? "#f4f5f7" : "#e6f6ee";
    $("gxStBox").style.borderColor = col + "44";
  }

  var ap = null, dragging = false, moved = false, downX = 0, suppressTap = false;

  function xToF(clientX) {
    var r = stage.getBoundingClientRect();
    var u = (clientX - r.left) / r.width;
    return Math.max(0, Math.min(FTOP, Math.round(u * 40) / 2));
  }

  stage.addEventListener("pointerdown", function (ev) {
    dragging = true; moved = false; downX = ev.clientX;
    if (ap) ap.take();
    F = xToF(ev.clientX);
    if (ap) ap.setValue(F, false);
    render();
    try { stage.setPointerCapture(ev.pointerId); } catch (e) {}
  });
  stage.addEventListener("pointermove", function (ev) {
    if (!dragging) return;
    if (Math.abs(ev.clientX - downX) > 4) moved = true;
    F = xToF(ev.clientX);
    if (ap) ap.setValue(F, false);
    render();
  });
  stage.addEventListener("pointerup", function () {
    if (moved) suppressTap = true;
    dragging = false;
  });
  stage.addEventListener("click", function (ev) {
    if (!suppressTap) return;
    suppressTap = false;
    ev.stopImmediatePropagation();
  });

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  render();
  ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 0 }, { t: 2, v: 5 }, { t: 4, v: 10 }, { t: 6.5, v: 10 },
           { t: 8.5, v: 15 }, { t: 10.5, v: 20 }, { t: 12, v: 0 }],
    keys: [0, 5, 10, 15, 20],
    value: F, min: 0, max: FTOP, step: 0.5,
    idle: 5000,
    onChange: function (v) { F = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { FTOP: FTOP };
});
</script>
</body>
</html>
