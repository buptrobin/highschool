<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本原话，拆成三句</h2>
<div class="q-src">人教版必修第三册 · 第十三章第5节</div>

<div class="q">
<p class="q-t">“黑体辐射的实验规律无法用经典电磁理论解释。普朗克提出：能量只能取分立的值，每一份能量叫能量子，ε = hν。”</p>
<p class="q-b">经典理论认为能量连续，短波端的曲线会冲向无穷（“紫外灾难”）；普朗克改成“一份一份地取”，每份 ε = hν，才与实验吻合。</p>
</div>

<div class="q">
<p class="q-t">“光由一个个光子组成，每个光子的能量 E = hν；h = 6.63×10⁻³⁴ J·s，叫普朗克常量。”</p>
<p class="q-b">爱因斯坦把量子化搬到光上：光能一份一份的，一份是一个光子。频率越高，单个光子能量越大；“光很强”是光子数多，不是每个光子更有劲。</p>
</div>

<div class="q">
<p class="q-t">“原子从高能级向低能级跃迁时放出光子，光子的能量等于两能级之差：hν = E_m − E_n。”</p>
<p class="q-b">原子能量只能取分立能级，跳级时才发光，频率由能级差唯一决定；吸收也必须正好等于能级差，所以原子光谱是几条分立的线。</p>
</div>

</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己写，再点“下一步”。公式只有一个 E = hf。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 光子能量与能级差<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">已知 h = 6.63×10⁻³⁴ J·s，1 eV = 1.6×10⁻¹⁹ J。（1）求 f = 5.0×10¹⁴ Hz 的光子能量 E（J 和 eV）；（2）f = 7.5×10¹⁴ Hz 时 E′ 是多少？（3）若（1）中光子是原子从 E_m 跃迁到 E_n 放出的，两能级差多少？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 认准公式和单位</p>
<p class="s-b">一个光子的能量 <b>E = hf</b>（也写 E = hν）。h = 6.63×10⁻³⁴ J·s，f 要用 Hz：5.0×10¹⁴ Hz 就代 5.0×10¹⁴，只写 5.0 会差 14 个数量级。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 代入 f = 5.0×10¹⁴ Hz</p>
<p class="s-b">6.63 × 5.0 = 33.15，10⁻³⁴ × 10¹⁴ = 10⁻²⁰，所以 <b>E = 3.315×10⁻¹⁹ J ≈ 3.3×10⁻¹⁹ J</b>。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 换算成 eV</p>
<p class="s-b"><b>3.315×10⁻¹⁹ ÷ 1.6×10⁻¹⁹ ≈ 2.07 eV</b>。可见光光子正好是几个 eV，所以原子跃迁发出的光落在可见光区。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 换 f = 7.5×10¹⁴ Hz 再算</p>
<p class="s-b">E′ = 6.63×10⁻³⁴ × 7.5×10¹⁴ ≈ <b>4.97×10⁻¹⁹ J</b>，÷ 1.6×10⁻¹⁹ ≈ <b>3.1 eV</b>。f 变 1.5 倍，E 也变 1.5 倍。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 回到能级</p>
<p class="s-b">（3）光子是跃迁放出的，<b>ΔE = hf = 3.315×10⁻¹⁹ J ≈ 2.07 eV</b>。谱线能量由一对能级差唯一决定，跟原子怎么被激发无关；吸收也要正好等于这个差。</p>
</li>
</ol>
<div class="exbar">
  <button id="gxNext" type="button">下一步</button>
  <span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）E = hf = 6.63×10⁻³⁴ × 5.0×10¹⁴ = <b>3.315×10⁻¹⁹ J ≈ 3.3×10⁻¹⁹ J</b>，3.315×10⁻¹⁹ ÷ 1.6×10⁻¹⁹ ≈ <b>2.07 eV</b>。<br>
（2）E′ = 6.63×10⁻³⁴ × 7.5×10¹⁴ = <b>4.97×10⁻¹⁹ J ≈ 3.1 eV</b>。<br>
（3）ΔE = hf = <b>3.315×10⁻¹⁹ J ≈ 2.07 eV</b>（放出光子时能级差等于光子能量）。</p>
</div>
<p class="gx-note">扣分点：f 漏 10¹⁴；h 写成 J；eV 换算写成乘 1.6×10⁻¹⁹。3.1 eV 取两位有效数字，写 3.10 或 3.11 都对。</p>
</div>
</section>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>考你会怎么考</h2>
<p class="gx-h2s">六种问法，一半在问“一份多大、等于哪个差”。</p>

<div class="gx-qa">
<div class="qac">
<p class="q">什么是能量量子化？</p>
<p class="a"><b>微观粒子的能量只能取分立值，不能连续变化。</b>最小的一份 ε = hν，能量只能是它的整数倍。</p>
<svg viewBox="0 0 240 132">
  <path d="M40 104V92H84V76H128V56H172V30H204" fill="none" stroke="#7c3aed" stroke-width="3"/>
  <circle cx="150" cy="50" r="6" fill="#b8791f"/>
  <text x="120" y="122" text-anchor="middle" font-size="9" fill="#6b7280">只能停在台阶上</text>
</svg>
</div>
<div class="qac">
<p class="q">普朗克常量 h 是多少？单位是什么？</p>
<p class="a"><b>h = 6.63×10⁻³⁴ J·s。</b>单位 J·s 保证 hf 得到 J：J·s × s⁻¹ = J。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="h的数值与单位">
  <rect x="24" y="34" width="192" height="38" rx="8" fill="#f5f3ff" stroke="#d8ccfb"/>
  <text x="120" y="59" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">h = 6.63×10⁻³⁴ J·s</text>
  <text x="120" y="96" text-anchor="middle" font-size="10" fill="#8a5c14">J·s × s⁻¹ = J</text>
</svg>
</div>
<div class="qac">
<p class="q">一个光子的能量由什么决定？</p>
<p class="a"><b>只由频率 f 决定：E = hf。</b>频率越高，一个光子能量越大；与光强、照射时间无关。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="频率高时光子能量大">
  <path d="M20 42q6-14 12 0t12 0t12 0t12 0t12 0t12 0t12 0t12 0" fill="none" stroke="#6d28d9" stroke-width="2"/>
  <text x="20" y="26" font-size="9" fill="#6d28d9">f 高 → 光子 E 大</text>
  <path d="M20 88q14-16 28 0t28 0t28 0t28 0t28 0t28 0" fill="none" stroke="#d64545" stroke-width="2"/>
  <text x="20" y="116" font-size="9" fill="#a04437">f 低 → 光子 E 小</text>
</svg>
</div>
<div class="qac">
<p class="q">光电效应里，光子能量和逸出功怎么用？</p>
<p class="a"><b>hf 是光子带来的能量，W₀ 是电子逃出金属最少要付的能量。</b>hf &gt; W₀ 才有光电子，剩下的是最大初动能 E_k = hf − W₀。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="光子打到金属，电子逃出">
  <rect x="24" y="92" width="192" height="24" fill="#e8eef6" stroke="#cfd4da"/>
  <text x="120" y="128" text-anchor="middle" font-size="9" fill="#6b7280">金属（逸出功 W₀）</text>
  <line x1="56" y1="24" x2="56" y2="86" stroke="#7c3aed" stroke-width="2.2"/>
  <polygon points="56,92 50,80 62,80" fill="#7c3aed"/>
  <text x="64" y="34" font-size="9" fill="#6d28d9">光子 hf</text>
  <circle cx="150" cy="44" r="6" fill="#b8791f"/>
  <text x="160" y="44" font-size="9" fill="#1e6640">E_k = hf − W₀</text>
</svg>
</div>
<div class="qac">
<p class="q">原子发光时，光子能量怎么算？</p>
<p class="a"><b>hν = E_m − E_n。</b>高能级跳到低能级放出光子，能量正好等于能级差；吸收时也必须正好相等。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="跃迁放出光子">
  <line x1="30" y1="40" x2="140" y2="40" stroke="#2f6fd0" stroke-width="2.5"/>
  <line x1="30" y1="96" x2="140" y2="96" stroke="#2f6fd0" stroke-width="2.5"/>
  <text x="146" y="44" font-size="9" fill="#2f6fd0">E₂</text>
  <text x="146" y="100" font-size="9" fill="#2f6fd0">E₁</text>
  <line x1="86" y1="44" x2="86" y2="88" stroke="#b8791f" stroke-width="2.2"/>
  <polygon points="86,94 80,82 92,82" fill="#b8791f"/>
  <text x="196" y="66" font-size="9" fill="#8a5c14">hν</text>
  <text x="120" y="122" text-anchor="middle" font-size="9" fill="#6b7280">hν = E₂ − E₁</text>
</svg>
</div>
<div class="qac">
<p class="q">能量分立，为什么日常看不出台阶？</p>
<p class="a"><b>因为 h 极小，台阶细到分辨不出。</b>宏观物体的能量子数 n 极大（可达 10²³），台阶间距远小于测量精度，看起来就像连续。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="极密的台阶看起来连续">
  <path d="M20 106h12v-6h12v-6h12v-6h12v-6h12v-6h12v-6h12v-6h12v-6h12v-6h12v-6h12v-6" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <text x="120" y="122" text-anchor="middle" font-size="9" fill="#6b7280">台阶极密 → 看起来连续</text>
</svg>
</div>
</div>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>六条易错，逐条改</h2>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 能量是连续的，想取多少取多少。</p>
<p class="er-v">✓ 微观粒子的能量只能取分立值，最小一份 ε = hν。</p>
<p class="er-w">“连续”只是 h 极小、份数极多时的宏观近似。</p>
</div>
<div class="er">
<p class="er-x">✗ E = hf 里的 f 表示光的强弱。</p>
<p class="er-v">✓ f 是频率，管“一份多大”；强弱看单位时间的光子数。</p>
<p class="er-w">频率和光子数各管一件事，别混。</p>
</div>
<div class="er">
<p class="er-x">✗ 光越强，每个光子的能量越大。</p>
<p class="er-v">✓ 光变强只是光子数变多，单个光子能量仍由 f 决定。</p>
<p class="er-w">灯调亮颜色不变，f 没变，E = hf 当然不变。</p>
</div>
<div class="er">
<p class="er-x">✗ 光子能量大，是因为它有静止质量。</p>
<p class="er-v">✓ 光子静止质量为零，E = hν 就是它的全部能量。</p>
<p class="er-w">光子以光速运动，没有静止参考系，能量来自频率。</p>
</div>
<div class="er">
<p class="er-x">✗ 紫外线的光子能量比红光小。</p>
<p class="er-v">✓ 紫外频率更高，E = hν 更大；红光只有 1.7～2 eV。</p>
<p class="er-w">由 E = hc/λ 看：波长越短，光子能量越大。</p>
</div>
<div class="er">
<p class="er-x">✗ h 只是一个数字，没有单位。</p>
<p class="er-v">✓ h = 6.63×10⁻³⁴ J·s，单位是 J·s。</p>
<p class="er-w">ε = hν 中 ν 的单位是 s⁻¹，要得到 J，h 必须带 J·s。</p>
</div>
</div>
</section>

<script>
document.addEventListener("DOMContentLoaded", function () {
  var $ = GX.$;
  var H = 6.63e-34, EV = 1.6e-19, HZ = 1e14, S14 = "×10¹⁴ Hz", S19 = "×10⁻¹⁹ J";
  var F = 4, stage = $("gxStage");
  function calc(v) { var f = v * HZ, E = H * f; return { f: f, E: E, eV: E / EV }; }
  function xOf(v) { return 30 + (v - 3.8) / 3.9 * 300; }
  function yOf(e19) { return 250 - e19 / 5 * 180; }
  function col(v) { return "hsl(" + Math.round(8 + (v - 4) / 3.5 * 264) + ",72%,46%)"; }
  function nameOf(v) { return v < 4.5 ? "红光" : v < 5.2 ? "黄绿光" : v < 6 ? "绿光" : v < 6.8 ? "蓝光" : "紫光"; }
  function waveD(v) {
    var n = 7 + Math.round((v - 4) * 9), d = "M", i;
    for (i = 0; i <= 80; i++) {
      d += (i ? " L " : " ") + (40 + i * 3.6).toFixed(1) + " " +
        (52 - 7 * Math.sin(i / 80 * n * Math.PI * 2)).toFixed(1);
    }
    return d;
  }
  function setA(id, o) { var n = $(id); for (var k in o) n.setAttribute(k, o[k]); }

  function render() {
    var s = calc(F), e19 = s.E * 1e19, c = col(F), x = +xOf(F).toFixed(1), y = +yOf(e19).toFixed(1);
    setA("gxWave", { d: waveD(F), stroke: c });
    setA("gxDot", { cx: x, cy: y, fill: c });
    setA("gxVD", { x1: x, x2: x, y1: y });
    setA("gxHD", { x2: x, y1: y, y2: y });
    $("gxRead").textContent = "f = " + F.toFixed(1) + S14 + "　E = " + e19.toFixed(2) + S19;
    $("gxVf").textContent = F.toFixed(1) + S14;
    $("gxVe").textContent = e19.toFixed(2) + S19;
    $("gxVev").textContent = s.eV.toFixed(2) + " eV";
    $("gxTake").textContent = "f = " + F.toFixed(1) + S14 + " 时 E = hf = " + e19.toFixed(2) + S19 +
      " ≈ " + s.eV.toFixed(2) + " eV；频率越高一份越大，而“光更亮”只是份数更多。";
    $("gxStateNote").textContent = "状态：" + nameOf(F) + "，f = " + F.toFixed(1) + S14 + "，约 " +
      s.eV.toFixed(2) + " eV；拖动或点画面切关键值，5 秒不操作自动继续演示。";
  }

  function setMode(m) {
    var b = $("gxAp"), t = $("gxApTxt");
    if (!b) return;
    b.classList.toggle("is-auto", m === "auto");
    b.classList.toggle("is-manual", m !== "auto");
    if (t) t.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  render();
  window.__ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 4 }, { t: 2, v: 4 }, { t: 4, v: 5 }, { t: 6.5, v: 5 },
           { t: 8.5, v: 6 }, { t: 10.5, v: 6 }, { t: 12.5, v: 7.5 }, { t: 14, v: 4 }],
    keys: [4, 5, 6, 7.5],
    value: 4, min: 4, max: 7.5, step: 0.1,
    idle: 5000,
    onChange: function (v) { F = v; render(); },
    onMode: setMode
  });
  window.__model = { calc: calc };
});
</script>
