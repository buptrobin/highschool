这一节要把<b>静摩擦</b>和<b>滑动摩擦</b>彻底分开，否则 f = μN 会被你套到不该套的地方。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">四个定义：静摩擦、最大静摩擦、滑动摩擦、方向。前两个说的都是「没动」，第三个才是「动了」。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 静摩擦力<span class="q-src">人教版必修第一册 · 第三章第 2 节</span></p>
<p class="q-b">两个相互接触的物体，当它们有相对运动的趋势时，在接触面上会产生一种阻碍相对运动趋势的力，这种力叫作静摩擦力。</p>
<p class="q-n">→ 关键词是「<b>相对运动的趋势</b>」：物体还没动，但「想动」。静摩擦力的大小<b>不是</b>用 μN 算出来的，
它由二力平衡决定：你推 20 N，它就还你 20 N；你不推，它就是 0。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 最大静摩擦力<span class="q-src">人教版必修第一册 · 第三章第 2 节</span></p>
<p class="q-b">静摩擦力的最大值叫作最大静摩擦力。</p>
<p class="q-n">→ 最大静摩擦力出现在物体<b>刚要开始运动</b>的那一瞬间；它是静摩擦的上限：<b>0 ≤ f ≤ fmax</b>。fmax 由接触面的粗糙程度和压力决定，
课本明确说它<b>略大于</b>滑动摩擦力——所以推箱子最费劲的是「推动的那一下」。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 滑动摩擦力<span class="q-src">人教版必修第一册 · 第三章第 2 节</span></p>
<p class="q-b">两个相互接触的物体，当它们相对滑动时，在接触面上会产生一种阻碍相对运动的力，这种力叫作滑动摩擦力。滑动摩擦力的大小跟压力的大小成正比，即 f = μN。</p>
<p class="q-n">→ 这才是 f = μN 的适用场合。μ 叫动摩擦因数，没有单位；N 是<b>接触面间的压力</b>，不是重力。
只要还在滑动、μ 和 N 不变，滑动摩擦力就<b>恒定</b>，跟你推得多快、接触面积多大都无关。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 摩擦力的方向<span class="q-src">人教版必修第一册 · 第三章第 2 节</span></p>
<p class="q-b">摩擦力的方向总与接触面相切，并且跟物体的相对运动（或相对运动趋势）方向相反。</p>
<p class="q-n">→ 注意是「<b>相对</b>」：相对地面、相对传送带、相对另一个物体。
所以摩擦力完全可以是<b>动力</b>——人走路时，地面给脚的静摩擦就指向前方。</p>
</div>

<p class="gx-note">一句话分家：<b>没动</b>找平衡（f = 外力，且有上限），<b>动了</b>用公式（f = μN，大小恒定）。
判断第一步永远是问「它和接触面之间，到底有没有相对滑动」。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">同一道题里，60 N 和 100 N 要走两条完全不同的路。先算门槛，再决定用哪个公式。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 静摩擦与滑动摩擦<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">质量 m = 20 kg 的箱子放在水平地面上，箱子与地面间的动摩擦因数 μ = 0.4，取 g = 10 m/s²，最大静摩擦力按 μN 估算。<br>
（1）用 60 N 的水平力推箱子，箱子受到的摩擦力多大？（2）用 100 N 的水平力推，摩擦力多大？加速度多大？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 先算压力 N</p>
<p class="s-b">水平地面、水平推力，竖直方向只有重力 G = mg = 20 × 10 = 200 N 和支持力 N，二力平衡，所以 <b>N = 200 N</b>。
这一步别急着代 μ，先把 N 找对。</p>
<p class="s-k">用到：竖直方向平衡 → N = mg（只在水平面上、无竖直分力时成立）。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 算出「门槛」最大静摩擦</p>
<p class="s-b">fmax ≈ μN = 0.4 × 200 N = <b>80 N</b>。这是箱子「刚要动」时需要的力，也是静摩擦的上限。
推力不到 80 N，箱子一定不动。</p>
<p class="s-k">用到：最大静摩擦力 fmax ≈ μN；它是静摩擦的天花板。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 60 N：没过门槛，用平衡求 f</p>
<p class="s-b">60 N &lt; 80 N，箱子静止，水平方向二力平衡：<b>f = F = 60 N</b>，方向与推力相反。
注意这里<b>不能</b>写 f = μN = 80 N——那是上限，不是当前值。</p>
<p class="s-k">用到：静摩擦大小由平衡条件决定，0 ≤ f ≤ fmax。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 100 N：过了门槛，换滑动摩擦公式</p>
<p class="s-b">100 N &gt; 80 N，箱子滑动，摩擦力换成 <b>f = μN = 0.4 × 200 N = 80 N</b>，方向仍与相对运动方向相反。
一滑动，摩擦力就不再随推力增大。</p>
<p class="s-k">用到：滑动摩擦力 f = μN，与推力大小无关。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 求加速度</p>
<p class="s-b">水平方向合力 F合 = F − f = 100 − 80 = 20 N，由 F合 = ma 得 a = 20 / 20 = <b>1 m/s²</b>，方向与推力相同。</p>
<p class="s-k">用到：牛顿第二定律 F合 = ma（下一章展开，这里先用合力求 a）。</p>
</li>
</ol>
<div class="exbar">
  <button id="gxNext" type="button">下一步</button>
  <span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">箱子对地面的压力 N = mg = 20 × 10 N = 200 N，最大静摩擦力 fmax ≈ μN = 0.4 × 200 N = 80 N。<br>
（1）F = 60 N &lt; 80 N，箱子静止，由二力平衡得 <b>f = F = 60 N</b>，方向与推力方向相反。<br>
（2）F = 100 N &gt; 80 N，箱子滑动，<b>f = μN = 80 N</b>，方向与相对运动方向相反。<br>
合力 F合 = 100 N − 80 N = 20 N，a = F合/m = 20/20 = <b>1 m/s²</b>，方向与推力方向相同。</p>
</div>
<p class="gx-note">两问的答案分别是 60 N 和 80 N，不是 60 N 和 100 N，也不是 80 N 和 80 N。第（1）问写 80 N 是本节最常见的失分点。</p>
</div>
</section>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>考你会怎么考</h2>
<p class="gx-h2s">六种问法，核心都是先问一句：「它到底动了没有？」</p>

<div class="gx-qa">
<div class="qac">
<p class="q">f = μN 什么时候能用？</p>
<p class="a"><b>只在滑动时用</b>（求最大静摩擦时可以近似用 μsN）。静摩擦阶段 f 由平衡决定，绝不能用 f = μN。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="f-F图：静摩擦段不能用f等于muN，只有平台段能用">
  <line x1="30" y1="106" x2="216" y2="106" stroke="#5a6472"/>

  <line x1="104" y1="66" x2="206" y2="66" stroke="#2f6fd0" stroke-width="2.2"/>

  <text x="112" y="60" font-size="9.5" fill="#2f6fd0">f = μN</text>
  <text x="120" y="122" text-anchor="middle" font-size="10" fill="#6b7280">只有右边平台段能代 μN</text>
</svg>
</div>
<div class="qac">
<p class="q">N 一定等于 mg 吗？</p>
<p class="a"><b>不一定。</b>斜向上拉、放在斜面上、被别的物体压着，N 都变。只有水平面上无竖直分力时才恰好 N = mg。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="斜向上拉时支持力小于重力">

  <line x1="112" y1="100" x2="112" y2="122" stroke="#b8402f" stroke-width="2.2"/>
  <polygon points="112,130 108,120 116,120" fill="#b8402f"/>

  <text x="120" y="124" font-size="9.5" fill="#b8402f">G</text>
</svg>
</div>
<div class="qac">
<p class="q">静摩擦的方向怎么判？</p>
<p class="a"><b>与相对运动趋势相反。</b>推箱子没推动，箱子想向右滑，静摩擦就向左；推着箱子匀速走，静摩擦也向左。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="推箱子没推动时静摩擦与推力相反">
  <line x1="24" y1="96" x2="216" y2="96" stroke="#5a6472"/>
  <rect x="90" y="60" width="60" height="36" rx="3" fill="#eef5fc" stroke="#2f6fd0"/>
  <line x1="154" y1="72" x2="206" y2="72" stroke="#b8791f" stroke-width="2.4"/>
  <polygon points="214,72 202,67 202,77" fill="#b8791f"/>
  <text x="208" y="62" text-anchor="end" font-size="9.5" fill="#8a5c14">F</text>
  <line x1="86" y1="84" x2="40" y2="84" stroke="#2f6fd0" stroke-width="2.4"/>
  <polygon points="32,84 44,79 44,89" fill="#2f6fd0"/>
  <text x="36" y="76" font-size="9.5" fill="#2f6fd0">f</text>
  <text x="120" y="120" text-anchor="middle" font-size="10" fill="#6b7280">没动，f 与 F 大小相等</text>
</svg>
</div>
<div class="qac">
<p class="q">最大静摩擦和滑动摩擦哪个大？</p>
<p class="a"><b>最大静摩擦略大。</b>所以推箱子最费劲的是「推动那一下」，动起来之后反而轻松些。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="最大静摩擦略大于滑动摩擦">
  <line x1="40" y1="106" x2="216" y2="106" stroke="#5a6472"/>

  <rect x="132" y="58" width="52" height="48" fill="#eef5fc" stroke="#2f6fd0"/>
  <text x="82" y="38" text-anchor="middle" font-size="10" fill="#8a5c14">fmax</text>
  <text x="158" y="52" text-anchor="middle" font-size="10" fill="#2f6fd0">f滑</text>
  <text x="120" y="124" text-anchor="middle" font-size="10" fill="#6b7280">差别不大，但方向不能弄反</text>
</svg>
</div>
<div class="qac">
<p class="q">摩擦力一定阻碍物体运动吗？</p>
<p class="a"><b>不一定。</b>人走路、汽车驱动轮、加速的传送带，摩擦力都是动力。它阻碍的是「相对运动」，不是「运动」。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="走路时地面给脚的静摩擦向前">

</div>
<div class="qac">
<p class="q">没有相对运动，就没有摩擦力吗？</p>
<p class="a"><b>不是。</b>只要接触面粗糙、有挤压、又有相对运动的<b>趋势</b>，就有静摩擦。斜面上没滑下来的物体就靠静摩擦。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="斜面上没滑下来的物体受沿斜面向上的静摩擦">

<p class="gx-note">六问的通用顺序：① 有没有相对滑动 → ② 没有就找平衡、有就用 μN → ③ 算 N 前先看竖直方向有没有别的分力 → ④ 方向认「相对」，不认「运动」。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是卷面上真出现过的句子，右边是能得分的表述。摩擦力这一节，错在「用错公式」比错在计算出更多。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 静摩擦也用 f = μN 算，所以推不动时摩擦力就是 80 N。</p>
<p class="er-v">✓ 静摩擦由平衡决定，0 ≤ f ≤ fmax；fmax ≈ μN 只是上限。</p>
<p class="er-w">用 60 N 推不动时，f 是 60 N，不是 80 N。把上限当成了当前值。</p>
</div>
<div class="er">
<p class="er-x">✗ 压力 N 永远等于重力 mg，直接代就行。</p>
<p class="er-v">✓ N 是接触面间的压力，要先看竖直方向：N = mg − F sinθ（斜向上拉）或 N = mg cosθ（斜面）。</p>
<p class="er-w">只有水平面且没有竖直分力时才恰好 N = mg。</p>
</div>
<div class="er">
<p class="er-x">✗ 摩擦力一定与物体的运动方向相反。</p>
<p class="er-v">✓ 摩擦力与「相对运动（或趋势）」方向相反，可以是动力。</p>
<p class="er-w">人走路、传送带上的物块，摩擦力都指向运动方向。</p>
</div>
<div class="er">
<p class="er-x">✗ 只要物体不动，静摩擦力就是一个定值。</p>
<p class="er-v">✓ 静摩擦随外力变化，你推多大它就多大，直到 fmax。</p>
<p class="er-w">把静摩擦当成「常数」，一遇到变力题就错。</p>
</div>
<div class="er">
<p class="er-x">✗ 最大静摩擦力等于滑动摩擦力。</p>
<p class="er-v">✓ 最大静摩擦略大于滑动摩擦（课本明确说明）。</p>
<p class="er-w">所以推箱子最费劲的是刚推动的那一下；计算时若题目没给，可按相等近似。</p>
</div>
<div class="er">
<p class="er-x">✗ 两个物体没有相对运动，就没有摩擦力。</p>
<p class="er-v">✓ 有相对运动趋势也可以有静摩擦力，斜面上静止的物体就是例子。</p>
<p class="er-w">「趋势」看不见，但它真实存在：拿掉静摩擦，物体就会滑下去。</p>
</div>
</div>
</section>

<p class="gx-note" style="border-top:1px solid var(--line);padding-top:14px">这一节最难的不是公式，是「先判断再计算」的顺序：<b>有没有滑动 → 求 N → 选公式</b>。
下一节换一个角度：两个物体互相推、互相拉时，这两个力到底是什么关系。</p>

<div class="gx-foot">
<p>教材依据：人教版《物理》必修第一册（2019 年版）第三章第 2 节「摩擦力」。课文引文按教材表述整理。</p>
<p>数值口径：互动取 N = 20 N、μs = 0.5（fmax = 10 N）、μk = 0.35（fk = 7 N），均为<b>示意值</b>；真实最大静摩擦只比滑动摩擦略大，本模型为看清分界放大了差值。
例题中的 m = 20 kg、μ = 0.4、g = 10 m/s² 为题目数据，fmax 按 μN 估算。</p>
<p>图 1 的 f–F 图中纵轴数值按 fmax = 10 N、f滑 = 7 N 绘制，与互动模型同一口径；图中未按真实比例画出「最大静摩擦略大于滑动摩擦」的差距。</p>
</div>

</div>

<div class="gx-zoom" id="gxZoom" hidden>
  <span class="gx-zoom-tip">双指放大看细节</span>
  <button class="gx-zoom-x" type="button" aria-label="关闭">✕</button>
  <div id="gxZoomInner"></div>
</div>
</script>
<script src="../../assets/page.js"></script>
<script src="../../assets/gx.js"></script>
<script src="../../assets/autopilot.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var $ = GX.$;
  var stage = $("gxStage");
  var N = 20, MUS = 0.5, MUK = 0.35, FMAX = N * MUS, FK = N * MUK, FTOP = 20;
  var GX0 = 52, GX1 = 340, GY0 = 292, GY1 = 200, FMAXY = 12;
  var F = 0;

  function calc(F) {
    var f, st, col, bg, sn;
    if (F < FMAX - 0.05) {
      f = F; st = "静止：静摩擦"; col = "#2f8a5b"; bg = "#e6f6ee";
      sn = "f = F = " + f.toFixed(1) + " N，箱子没动";
    } else if (F <= FMAX + 0.05) {
      f = FMAX; st = "临界：最大静摩擦"; col = "#b8791f"; bg = "#fdf3e0";
      sn = "f = fmax = 10.0 N，刚要滑动";
    } else {
      f = FK; st = "滑动：滑动摩擦"; col = "#b8402f"; bg = "#fbeae7";
      sn = "f = μkN = 7.0 N，不再随 F 增大";
    }
    return { f: f, st: st, col: col, bg: bg, sn: sn };
  }

  function gx(f) { return GX0 + f / FTOP * (GX1 - GX0); }
  function gy(f) { return GY0 - f / FMAXY * (GY0 - GY1); }

  function render() {
    var Fv = Math.round(F * 2) / 2;
    var s = calc(Fv), f = s.f;
    var lenF = Fv / FTOP * 90;
    var lenf = f / FTOP * 90;

    $("gxFArr").setAttribute("x2", 182 + lenF);
    $("gxFHead").setAttribute("points", (182 + lenF) + ",120 " + (182 + lenF - 9) + ",115 " + (182 + lenF - 9) + ",125");
    $("gxFLbl").setAttribute("x", 182 + lenF + 4);
    $("gxFArr").style.opacity = Fv < 0.05 ? "0" : "1";
    $("gxFHead").style.opacity = Fv < 0.05 ? "0" : "1";
    $("gxFLbl").style.opacity = Fv < 0.05 ? "0" : "1";

    $("gxFric").setAttribute("x2", 98 - lenf);
    $("gxFricHead").setAttribute("points", (98 - lenf) + ",136 " + (98 - lenf + 9) + ",131 " + (98 - lenf + 9) + ",141");
    $("gxFricLbl").setAttribute("x", 98 - lenf - 4);
    var showFric = f > 0.05;
    $("gxFric").style.opacity = showFric ? "1" : "0";
    $("gxFricHead").style.opacity = showFric ? "1" : "0";
    $("gxFricLbl").style.opacity = showFric ? "1" : "0";

    var sliding = Fv > FMAX + 0.05;
    $("gxStreaks").style.opacity = sliding ? "0.9" : "0";
    $("gxBlk").setAttribute("stroke", s.col);
    $("gxBlk").setAttribute("fill", s.bg);

    var px = gx(Fv), py = gy(f);
    $("gxPt").setAttribute("cx", px);
    $("gxPt").setAttribute("cy", py);
    $("gxGuideF").setAttribute("x1", px);
    $("gxGuideF").setAttribute("x2", px);
    $("gxGuideF").setAttribute("y2", py);
    $("gxGuidef").setAttribute("x2", px);
    $("gxGuidef").setAttribute("y1", py);
    $("gxGuidef").setAttribute("y2", py);

    $("gxVa").textContent = Fv.toFixed(1) + " N";
    $("gxVb").textContent = f.toFixed(1) + " N";
    $("gxVs").innerHTML = s.st;
    $("gxVsn").innerHTML = s.sn;
    $("gxStBox").style.background = s.bg;
    $("gxStBox").style.borderColor = s.col + "44";
    $("gxVs").style.color = s.col;
  }

  var ap = null, dragging = false, moved = false, downX = 0, suppressTap = false;

  function xToF(clientX) {
    var r = stage.getBoundingClientRect();
    var u = (clientX - r.left) / r.width;
    return Math.max(0, Math.min(FTOP, Math.round(u * 40) / 2));
  }

  stage.addEventListener("pointerdown", function (ev) {
    dragging = true; moved = false; downX = ev.clientX;
    if (ap) ap.take();
    F = xToF(ev.clientX);
    if (ap) ap.setValue(F, false);
    render();
    try { stage.setPointerCapture(ev.pointerId); } catch (e) {}
  });
  stage.addEventListener("pointermove", function (ev) {
    if (!dragging) return;
    if (Math.abs(ev.clientX - downX) > 4) moved = true;
    F = xToF(ev.clientX);
    if (ap) ap.setValue(F, false);
    render();
  });
  stage.addEventListener("pointerup", function () {
    if (moved) suppressTap = true;
    dragging = false;
  });
  stage.addEventListener("click", function (ev) {
    if (!suppressTap) return;
    suppressTap = false;
    ev.stopImmediatePropagation();
  });

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  render();
  ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 0 }, { t: 2, v: 5 }, { t: 4, v: 10 }, { t: 6.5, v: 10 },
           { t: 8.5, v: 15 }, { t: 10.5, v: 20 }, { t: 12, v: 0 }],
    keys: [0, 5, 10, 15, 20],
    value: F, min: 0, max: FTOP, step: 0.5,
    idle: 5000,
    onChange: function (v) { F = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc, FMAX: FMAX, FK: FK, N: N };
});
</script>
</body>
