<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本原话，拆成三句</h2>
<div class="q-src">人教版必修第三册 · 第十二章第4节</div>

<div class="q">
<p class="q-t">“能量既不会凭空产生，也不会凭空消失，只能从一种形式转化为另一种形式，或从一个物体转移到另一个物体，总量保持不变。”</p>
<p class="q-b">形式变叫转化（电能变内能），换个物体带着叫转移（热从铁块传给水），都不改总量。</p>
</div>

<div class="q">
<p class="q-t">“能源可分为可再生能源和不可再生能源。”</p>
<p class="q-b">太阳能、风能、水能能不断补充，是可再生；煤、石油、核燃料要上亿年形成，用完就没。</p>
</div>

<div class="q">
<p class="q-t">“能量的转化和转移具有方向性；提高能源利用效率、开发清洁能源是实现可持续发展的途径。”</p>
<p class="q-b">热自发从高温传到低温，却不会自发倒回来，所以每次转化都有“回不来”的部分。</p>
</div>

<p class="gx-note">读法：守恒 → 方向性 → 提高效率。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己写，再点“下一步”。只有一个公式，两个方向别写反。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 效率与能量账本<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">某电动机输入电能 1000 J，效率 η = 40%。求：
（1）输出的有用功 W有；（2）损失的能量 W损；
（3）若效率提高到 60%、输入仍为 1000 J，W有 和 W损 各变为多少？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 把“效率”翻译成式子</p>
<p class="s-b">η = W有 / W总 × 100%，本题 W总 = 1000 J，所以 <b>W有 = η × W总</b>。</p>
<p class="s-k">W总 是“输入”的那一份。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 代入求有用功</p>
<p class="s-b">W有 = 0.40 × 1000 J = <b>400 J</b>。百分数先化小数，是 0.40 不是 40。</p>
<p class="s-k">百分数化小数。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 剩下的就是损失</p>
<p class="s-b">W损 = 1000 J − 400 J = <b>600 J</b>，变成线圈和轴承处的内能散掉。</p>
<p class="s-k">W总 = W有 + W损。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 效率提高，重算</p>
<p class="s-b">η = 60% 时：W有 = <b>600 J</b>，W损 = 1000 J − 600 J = <b>400 J</b>。</p>
<p class="s-k">同一套式子再做一遍。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 写答案，补意义</p>
<p class="s-b">（1）400 J；（2）600 J；（3）600 J、400 J。效率高 20 个百分点，同样输入多干 200 J 的活。</p>
<p class="s-k">这就是“提高能源利用效率”的意义。</p>
</li>
</ol>
<div class="exbar">
  <button id="gxNext" type="button">下一步</button>
  <span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）W有 = ηW总 = 0.40 × 1000 J = <b>400 J</b>。<br>
（2）由能量守恒 W损 = <b>600 J</b>。<br>
（3）η = 60% 时：W有 = <b>600 J</b>，W损 = <b>400 J</b>。</p>
</div>
<p class="gx-note">高频扣分：η 直接乘成 40 J；拿 W损 去乘 η；认为效率提高后总能量变多。</p>
</div>
</section>

  <path d="M184 26 q14 22 0 44 q-14 22 0 44" fill="none" stroke="#2f8a5b" stroke-width="2.2"/>
  <g text-anchor="middle" font-size="8.5"><text x="56" y="94" fill="#8a5c14">太阳能</text><text x="144" y="94" fill="#2f6fd0">风能</text><text x="198" y="94" fill="#1e6640">水能</text></g>
  <text x="120" y="118" text-anchor="middle" font-size="8.5" fill="#6b7280">能不断补充 → 可再生</text>
</svg>
</div>
<div class="qac">
<p class="q">能量守恒定律怎么表述？</p>
<p class="a"><b>能量既不会凭空产生，也不会凭空消失，只能从一种形式转化为另一种形式，或从一个物体转移到另一个物体，总量保持不变。</b></p>
<svg viewBox="0 0 240 132" role="img" aria-label="能量守恒">
  <rect x="52" y="34" width="136" height="38" rx="8" fill="#f5f3ff" stroke="#d8ccfb" stroke-width="2"/>
  <text x="120" y="58" text-anchor="middle" font-size="10" fill="#6d28d9">总能量 1000 J</text>
  <path d="M120 76 v22" stroke="#7c3aed" stroke-width="1.8" fill="none"/><polygon points="120,102 114,90 126,90" fill="#7c3aed"/>
  <text x="120" y="120" text-anchor="middle" font-size="8.5" fill="#6b7280">形式变 / 物体变，总量不变</text>
</svg>
</div>
<div class="qac">
<p class="q">效率为什么不可能达到 100%？</p>
<p class="a"><b>能量转化具有方向性，总有部分能量变成环境中的内能，无法再全部利用。</b>摩擦、散热、电阻发热都不可避免。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="效率小于百分之百">
  <rect x="24" y="46" width="120" height="24" fill="#7c3aed" rx="4"/>
  <rect x="144" y="46" width="72" height="24" fill="#e9d9b8" rx="4"/>
  <text x="84" y="62" text-anchor="middle" font-size="9" fill="#fff">有用功 60%</text>
  <text x="180" y="62" text-anchor="middle" font-size="9" fill="#8a5c14">损失 40%</text>
  <text x="120" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#6d28d9">η &lt; 100%</text>
</svg>
</div>
<div class="qac">
<p class="q">化石能源为什么不可再生？</p>
<p class="a"><b>煤、石油、天然气由远古生物遗体经上亿年地质作用形成，储量有限。</b>燃烧还会排放 CO₂。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="化石能源形成需上亿年">
  <rect x="24" y="40" width="192" height="14" fill="#6b5b45"/>
  <rect x="24" y="54" width="192" height="10" fill="#cbb894"/>
  <text x="120" y="90" text-anchor="middle" font-size="9" fill="#8a5c14">遗体 + 上亿年地质作用</text>
  <text x="120" y="114" text-anchor="middle" font-size="9" fill="#a33a2c">形成速度 ≪ 消耗速度</text>
</svg>
</div>
<div class="qac">
<p class="q">电能为什么是二次能源？</p>
<p class="a"><b>电能必须由一次能源（煤、风、水、核等）加工转化而来，不能直接取自自然。</b>汽油、氢能同理。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="电能是二次能源">
  <rect x="20" y="34" width="80" height="26" rx="6" fill="#fdf3e0" stroke="#f3cdc6" stroke-width="1.6"/>
  <text x="60" y="51" text-anchor="middle" font-size="9" fill="#8a5c14">一次能源</text>
  <path d="M104 47 h34" stroke="#5a6472" stroke-width="2" fill="none"/><polygon points="140,47 128,41 128,53" fill="#5a6472"/>
  <rect x="144" y="34" width="76" height="26" rx="6" fill="#f5f3ff" stroke="#d8ccfb" stroke-width="1.6"/>
  <text x="182" y="51" text-anchor="middle" font-size="9" fill="#6d28d9">电能</text>
  <text x="120" y="96" text-anchor="middle" font-size="9" fill="#6b7280">加工转化 → 二次能源</text>
</svg>
</div>
<div class="qac">
<p class="q">“节能”只是少用电吗？</p>
<p class="a"><b>不只是少用，更重要的是提高利用效率。</b>效率从 40% 提到 60%，同样的有用功输入少三分之一。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="节能包括少用和提高效率">
  <rect x="24" y="30" width="192" height="32" rx="6" fill="#fdf3e0" stroke="#f3cdc6" stroke-width="1.4"/>
  <text x="120" y="51" text-anchor="middle" font-size="9" fill="#8a5c14">① 减少需求（少用）</text>
  <rect x="24" y="70" width="192" height="32" rx="6" fill="#e6f6ee" stroke="#c9e8d6" stroke-width="1.4"/>
  <text x="120" y="91" text-anchor="middle" font-size="9" fill="#1e6640">② 提高效率（少烧）</text>
</svg>
</div>
</div>
<p class="gx-note">六问归成一条：<b>总量守恒、方向不可逆，所以效率小于 100%，所以要节能</b>。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>六条易错，逐条改</h2>

<div class="er">
<p class="er-x">✗ 能量用掉就消失了，所以煤会“烧没”。</p>
<p class="er-v">✓ 能量不会消失，只是变成环境中的内能。</p>
<p class="er-w">消失的是“能用的形式”。</p>
</div>
<div class="er">
<p class="er-x">✗ 可再生能源完全没有污染。</p>
<p class="er-v">✓ 运行时不排 CO₂，但设备制造、占地、生态影响仍在。</p>
<p class="er-w">“清洁”说的是运行阶段。</p>
</div>
<div class="er">
<p class="er-x">✗ 技术进步以后，效率可以达到 100%。</p>
<p class="er-v">✓ 只要存在摩擦、散热、电阻，效率就小于 100%。</p>
<p class="er-w">选项里出现 η = 100%，先怀疑。</p>
</div>
<div class="er">
<p class="er-x">✗ 设计得巧妙，就能造出不断输出能量而不需输入的机器。</p>
<p class="er-v">✓ 不可能，能量守恒定律不允许凭空创造能量。</p>
<p class="er-w">永动机要求输出大于输入。</p>
</div>
<div class="er">
<p class="er-x">✗ 煤是可再生能源，因为地下还有新的煤在形成。</p>
<p class="er-v">✓ 煤是不可再生能源，形成需上亿年。</p>
<p class="er-w">“可再生”看短时间内能否补充。</p>
</div>
<div class="er">
<p class="er-x">✗ 节能就是少用电，跟效率没关系。</p>
<p class="er-v">✓ 减少需求和提升效率两条路，后者潜力更大。</p>
<p class="er-w">效率 40% → 60%，同样的活输入少得多。</p>
</div>

<p class="gx-note">把图 2 的转化链和“效率＜100%”绑在一起记，采分点就抓全了。</p>
</section>

<script>
document.addEventListener("DOMContentLoaded", function () {
  var $ = GX.$;
  var ETA = 20, X0 = 24, WT = 312, stage = $("gxStage");

  function calc(eta) {
    var e = Math.round(+eta);
    if (!isFinite(e)) e = 60;
    e = Math.min(90, Math.max(20, e));
    var wu = Math.round(e * 10);
    return { eta: e, wu: wu, wl: 1000 - wu };
  }

  function render() {
    var s = calc(ETA), w = WT * s.wu / 1000;
    var u = X0 + w / 2, l = X0 + w + (WT - w) / 2;
    $("gxUse").setAttribute("width", w.toFixed(1));
    $("gxLoss").setAttribute("x", (X0 + w).toFixed(1));
    $("gxLoss").setAttribute("width", (WT - w).toFixed(1));
    $("gxUseL").setAttribute("x", u.toFixed(1));
    $("gxLossL").setAttribute("x", l.toFixed(1));
    $("gxUseV").setAttribute("x", u.toFixed(1));
    $("gxLossV").setAttribute("x", l.toFixed(1));
    $("gxUseV").textContent = s.wu + " J";
    $("gxLossV").textContent = s.wl + " J";
    $("gxEtaSvg").textContent = "η = " + s.eta + "%";
    $("gxSv").textContent = s.eta + "%";
    $("gxVu").textContent = s.wu + " J";
    $("gxVl").textContent = s.wl + " J";
    $("gxTake").textContent = "η = " + s.eta + "% 时，1000 J 里只有 " + s.wu +
      " J 干成了活，其余 " + s.wl + " J 变成热散掉。";
    $("gxStateNote").textContent = "状态：输入固定 1000 J；效率越高，损失越少（当前 " + s.wl + " J）。";
  }

  function setMode(m) {
    var b = $("gxAp"), t = $("gxApTxt");
    if (!b) return;
    b.classList.toggle("is-auto", m === "auto");
    b.classList.toggle("is-manual", m !== "auto");
    if (t) t.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  render();
  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 20 }, { t: 2, v: 20 }, { t: 4, v: 40 }, { t: 6, v: 40 },
           { t: 8, v: 60 }, { t: 10.5, v: 60 }, { t: 12.5, v: 90 }, { t: 14.5, v: 90 },
           { t: 16, v: 20 }],
    keys: [20, 40, 60, 90],
    value: ETA, min: 20, max: 90, step: 1,
    idle: 5000,
    onChange: function (v) { ETA = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc };
});
</script>
