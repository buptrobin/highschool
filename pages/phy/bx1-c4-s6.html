<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">三句话：超重、失重、完全失重，全都在说「压力与重力谁大」。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 超重<span class="q-src">人教版必修第一册 · 第四章第 6 节</span></p>
<p class="q-b">物体对支持物的压力（或对悬挂物的拉力）大于物体所受重力的现象，叫作超重现象。</p>
<p class="q-n">→ 注意比较的是<b>两个力</b>：秤受到的压力 N（大小等于秤对人的支持力）与人的重力 mg。
超重时 <b>N &gt; mg</b>，但人的重力一点没变。秤显示的是 N，所以感觉「变重」。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 失重<span class="q-src">人教版必修第一册 · 第四章第 6 节</span></p>
<p class="q-b">物体对支持物的压力（或对悬挂物的拉力）小于物体所受重力的现象，叫作失重现象。</p>
<p class="q-n">→ 失重时 <b>N &lt; mg</b>。极端情况是 N = 0，也就是<b>完全失重</b>：
物体对支持物完全没有压力，人也「压」不住秤了。但重力仍然是 mg，只是没人「扛」它。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 完全失重<span class="q-src">人教版必修第一册 · 第四章第 6 节</span></p>
<p class="q-b">当物体以等于重力加速度的加速度竖直向下运动时，物体对支持物的压力（或对悬挂物的拉力）等于零，这种现象叫作完全失重现象。</p>
<p class="q-n">→ 条件是 <b>a = g 且方向竖直向下</b>。这时 N = m(g − g) = 0。
太空舱里的失重不是「没有重力」，而是舱和人在<b>一起自由下落</b>（绕着地球掉），所以彼此之间没有挤压。</p>
</div>

<p class="gx-note">判断口诀只有四个字：<b>看 a 的方向</b>。a 向上（加速上升 / 减速下降）→ 超重；
a 向下（减速上升 / 加速下降）→ 失重；a = g 向下 → 完全失重；a = 0（静止或匀速）→ N = mg。
<b>跟运动方向无关</b>，这是本节最爱设的陷阱。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己写，再点「下一步」。这题的关键是「先定正方向，再判 a 的符号」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 电梯里的支持力<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">质量 m = 50 kg 的人站在电梯里的体重秤上，g 取 9.8 m/s²。求下列三种情况下秤的读数（即支持力）：
（1）电梯以 a = 2 m/s² 加速上升；（2）电梯以 a = 2 m/s² 加速下降；
（3）电梯的缆绳突然断裂，人和电梯一起自由下落。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 规定正方向，先写方程</p>
<p class="s-b">取<b>竖直向上为正</b>。人受两个力：支持力 N（向上）、重力 mg（向下）。
由牛顿第二定律：<b>N − mg = ma</b>，移项得 <b>N = m(g + a)</b>。
这一步定了符号规则，后面三种情况都只往里代 a。</p>
<p class="s-k">用到：先定正方向再列式；a 的正负由方向决定，不由「上升/下降」决定。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 加速上升：a = +2 m/s²</p>
<p class="s-b">N = 50 × (9.8 + 2) = 50 × 11.8 = <b>590 N</b>。590 N &gt; 490 N，<b>超重</b>。
物理图像：电梯要「往上拽」人，必须比平时更用力地托他。</p>
<p class="s-k">用到：a 与正方向同号 → N &gt; mg → 超重。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 加速下降：a = −2 m/s²</p>
<p class="s-b">方向向下，代入负值：N = 50 × (9.8 − 2) = 50 × 7.8 = <b>390 N</b>。
390 N &lt; 490 N，<b>失重</b>。注意电梯在往下走，但真正决定失重的是「a 向下」，不是「在下降」。</p>
<p class="s-k">用到：a 与正方向反号 → N &lt; mg → 失重。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 自由下落：a = −g = −9.8 m/s²</p>
<p class="s-b">N = 50 × (9.8 − 9.8) = <b>0</b>，<b>完全失重</b>。人和秤之间没有挤压，任何东西都「浮」着。
此时人的重力仍然是 490 N，只是这个重力全部用于产生 a = g，没有余量去压秤。</p>
<p class="s-k">用到：完全失重的判据是 a = g 且方向向下，等价于 N = 0。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 反过来问：读数 440 N 时电梯在干什么？</p>
<p class="s-b">由 N = m(g + a) 得 a = N/m − g = 440/50 − 9.8 = 8.8 − 9.8 = <b>−1.0 m/s²</b>，
即加速度<b>向下</b>、大小 1.0 m/s²，处于<b>失重</b>状态。可能是加速下降，也可能是减速上升——
**单凭读数判不出运动方向**，只能判出 a 的方向。这是本节最爱考的一句。</p>
<p class="s-k">用到：N 只能反推 a，不能反推 v 的方向。</p>
</li>
</ol>
<div class="exbar">
  <button id="gxNext" type="button">下一步</button>
  <span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">取竖直向上为正方向，人受支持力 N 与重力 mg，由 N − mg = ma 得 N = m(g + a)。<br>
（1）a = +2 m/s²（向上）：N = 50×(9.8+2) = <b>590 N</b> &gt; mg，<b>超重</b>。<br>
（2）a = −2 m/s²（向下）：N = 50×(9.8−2) = <b>390 N</b> &lt; mg，<b>失重</b>。<br>
（3）a = −9.8 m/s²：N = 50×(9.8−9.8) = <b>0</b>，<b>完全失重</b>；人的重力仍为 490 N，只是全部用于产生加速度。</p>
</div>
<p class="gx-note">阅卷高频扣分：把「加速下降」当成超重（只看运动方向不看 a）；
把 N 与 mg 的比较写成「重力变了」；第（3）问答「重力消失」而不是「N = 0」。</p>
</div>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是卷面上真出现过的错句，右边是能得分的表述。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 超重时物体的重力变大了。</p>
<p class="er-v">✓ 重力始终是 mg；变大的是支持力（或拉力）N，即秤的读数。</p>
<p class="er-w">在地面附近，同一个物体的重力不会因为它被加速而改变。</p>
</div>
<div class="er">
<p class="er-x">✗ 失重就是重力消失了。</p>
<p class="er-v">✓ 失重只是 N &lt; mg；完全失重是 N = 0，重力仍然是 mg。</p>
<p class="er-w">a = g 时重力全部用于产生加速度，没有余量去压支持物。</p>
</div>
<div class="er">
<p class="er-x">✗ 电梯匀速上升，所以超重。</p>
<p class="er-v">✓ 匀速运动 a = 0，N = mg，读数不变，既不超重也不失重。</p>
<p class="er-w">超重失重由 a 决定，与 v 的大小、方向都无关。</p>
</div>
<div class="er">
<p class="er-x">✗ 物体向下运动，所以处于失重状态。</p>
<p class="er-v">✓ 看 a 的方向：向下运动但减速时 a 向上，属于超重。</p>
<p class="er-w">「向下」说的是 v，不是 a；这是本节最高频的陷阱。</p>
</div>
<div class="er">
<p class="er-x">✗ 体重秤读数等于重力，永远 N = mg。</p>
<p class="er-v">✓ 只有 a = 0 时 N = mg；一般情况 N = m(g + a)。</p>
<p class="er-w">秤测的是它受到的压力，不是重力；加速时两者不相等。</p>
</div>
<div class="er">
<p class="er-x">✗ 完全失重时加速度为零。</p>
<p class="er-v">✓ 完全失重时 a = g（向下），正是这个最大的加速度让 N 变成 0。</p>
<p class="er-w">a = 0 对应的是 N = mg（静止或匀速），正好相反。</p>

<div class="gx-zoom" id="gxZoom" hidden>
  <span class="gx-zoom-tip">双指放大看细节</span>

<script src="../../assets/page.js"></script>
<script src="../../assets/gx.js"></script>
<script src="../../assets/autopilot.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var $ = GX.$;
  var stage = $("gxStage");
  var M = 50, G = 9.8, AV = 0;
  var TICKS = 272, TICKE = 160, NMAX = 800;

  function calc(a) {
    var raw = M * (G + a);
    var N = Math.max(0, raw);
    var st, col, bg, sn;
    if (N <= 0.5) {
      st = "完全失重"; col = "#b8402f"; bg = "#fbeae7";
      sn = "a = 9.8 m/s² 向下，N = m(g − g) = 0";
    } else if (a > 0.05) {
      st = "超重"; col = "#b8791f"; bg = "#fdf3e0";
      sn = "a 向上：N = 50×(9.8+" + a.toFixed(1) + ") = " + N.toFixed(0) + " N";
    } else if (a < -0.05) {
      st = "失重"; col = "#2f6fd0"; bg = "#eef5fc";
      sn = "a 向下：N = 50×(9.8" + a.toFixed(1).replace("-", "−") + ") = " + N.toFixed(0) + " N";
    } else {
      st = "正常"; col = "#2f8a5b"; bg = "#e6f6ee";
      sn = "a = 0，N = mg = 490 N";
    }
    return { N: N, raw: raw, st: st, col: col, bg: bg, sn: sn };
  }

  function render() {
    if (Math.abs(AV) < 0.05) AV = 0;
    var s = calc(AV);
    var y = TICKS - (s.N / NMAX) * (TICKS - TICKE);

    $("gxTick").setAttribute("y1", y);
    $("gxTick").setAttribute("y2", y);
    $("gxTick").setAttribute("stroke", s.col);

    $("gxNBig").textContent = s.N.toFixed(0) + " N";
    $("gxNBig").setAttribute("fill", s.col);
    $("gxStateTxt").textContent = s.st + "：" + (s.N > 0 ? "N " + (s.N > 490 ? ">" : s.N < 490 ? "<" : "=") + " mg" : "N = 0");
    $("gxStateTxt").setAttribute("fill", s.col);

    var nLen = Math.min(84, 60 * s.N / 490);
    $("gxN").setAttribute("y2", 174 - nLen);
    $("gxNh").setAttribute("points", (140) + "," + (174 - nLen - 10) + " " + (135) + "," + (174 - nLen + 4) + " " + (145) + "," + (174 - nLen + 4));
    $("gxN").style.opacity = s.N > 0.5 ? "1" : "0";
    $("gxNh").style.opacity = s.N > 0.5 ? "1" : "0";
    $("gxNLab").textContent = "N = " + s.N.toFixed(0) + " N";
    $("gxNLab").setAttribute("y", 174 - nLen - 9);
    $("gxNLab").style.opacity = s.N > 0.5 ? "1" : "0";

    var aLen = Math.min(34, 8 + Math.abs(AV) / 12 * 26);
    var ay2 = 110 - (AV >= 0 ? aLen : -aLen);
    $("gxA").setAttribute("y2", ay2);
    $("gxAh").setAttribute("points", "186," + (ay2 + (AV >= 0 ? -10 : 10)) + " 181," + (ay2 + (AV >= 0 ? 4 : -4)) + " 191," + (ay2 + (AV >= 0 ? 4 : -4)));
    $("gxA").style.opacity = Math.abs(AV) > 0.05 ? "1" : "0";
    $("gxAh").style.opacity = Math.abs(AV) > 0.05 ? "1" : "0";
    $("gxALab").textContent = "a";
    $("gxALab").setAttribute("y", ay2 + 4);
    $("gxALab").setAttribute("x", 190);
    $("gxALab").style.opacity = Math.abs(AV) > 0.05 ? "1" : "0";

    var sign = AV >= 0 ? "+" : "−";
    var absA = Math.abs(AV).toFixed(1);
    $("gxFormula").textContent = "N = 50 × (9.8 " + (AV >= 0 ? "+ " : "− ") + absA + ") = " + s.N.toFixed(0) + " N";

    var hint;
    if (s.N <= 0.5) { hint = "a ≤ −9.8：人已离地，N = 0"; }
    else if (AV > 0.05) { hint = "a 向上：可能是加速上升，也可能是减速下降"; }
    else if (AV < -0.05) { hint = "a 向下：可能是加速下降，也可能是减速上升"; }
    else { hint = "a = 0：静止或匀速，N = mg"; }
    $("gxHint").textContent = hint;

    $("gxVa").textContent = AV.toFixed(1).replace("-", "−") + " m/s²";
    $("gxVb").textContent = s.N.toFixed(0) + " N";
    $("gxVs").textContent = s.st;
    $("gxVsn").textContent = s.sn;
    $("gxStBox").style.background = s.bg;
    $("gxStBox").style.borderColor = s.col + "44";
    $("gxVs").style.color = s.col;
  }

  var ap = null, dragging = false, moved = false, downX = 0, suppressTap = false;

  function xToA(clientX) {
    var r = stage.getBoundingClientRect();
    var f = (clientX - r.left) / r.width;
    var a = -12 + Math.max(0, Math.min(1, f)) * 18;
    return Math.round(a * 5) / 5;
  }

  stage.addEventListener("pointerdown", function (ev) {
    dragging = true; moved = false; downX = ev.clientX;
    if (ap) ap.take();
    AV = xToA(ev.clientX);
    if (ap) ap.setValue(AV, false);
    render();
    try { stage.setPointerCapture(ev.pointerId); } catch (e) {}
  });
  stage.addEventListener("pointermove", function (ev) {
    if (!dragging) return;
    if (Math.abs(ev.clientX - downX) > 4) moved = true;
    AV = xToA(ev.clientX);
    if (ap) ap.setValue(AV, false);
    render();
  });
  stage.addEventListener("pointerup", function () {
    if (moved) suppressTap = true;
    dragging = false;
  });
  stage.addEventListener("click", function (ev) {
    if (!suppressTap) return;
    suppressTap = false;
    ev.stopImmediatePropagation();
  });

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  render();
  ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 0 }, { t: 1.8, v: 2 }, { t: 3.6, v: 2 }, { t: 5.2, v: -2 },
           { t: 7.0, v: -2 }, { t: 8.6, v: -9.8 }, { t: 11.6, v: -9.8 }, { t: 12.8, v: -12 },
           { t: 14.0, v: 0 }],
    keys: [0, 2, -2, -9.8, -12],
    value: AV, min: -12, max: 6, step: 0.2,
    idle: 5000,
    onChange: function (v) { AV = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc };
  window.__probe = function () {
    return {
      a: $("gxVa").textContent,
      N: $("gxVb").textContent,
      st: $("gxVs").textContent,
      cnt: $("gxCnt").textContent
    };
  };
});
</script>
</body>
