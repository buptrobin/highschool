<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#7c3aed"><title>2. 重力势能 · 物理 · 俯瞰太阳系</title><link rel="stylesheet" href="../../assets/app.css"><link rel="stylesheet" href="../../assets/gx.css"><style> .gx{--blue:#7c3aed;--blue-soft:#f5f3ff;--blue-line:#d8ccfb} .gx h2 .sn,.gx .fig-no{color:#7c3aed} .gx .gx-claim b{color:#6d28d9} .gx-graph{display:block;width:100%;max-width:540px;height:auto;margin:0 auto} </style><link rel="stylesheet" href="../../assets/print.css" media="print"></head><body class="page" style="--accent:#7c3aed;--accent-soft:#f5f3ff"><header class="topbar"><div class="wrap topbar-in"><a class="back" href="../../subject.html?s=phy">‹ 物理</a><button class="done-btn" id="doneBtn" type="button" data-id="phy/bx2-c4-s2"><span class="done-box"></span><span class="done-txt">标记已复习</span></button></div></header><main class="wrap page-wrap"><nav class="crumbs"><a href="../../index.html">首页</a><span class="sep">/</span><a href="../../subject.html?s=phy">物理</a><span class="sep">/</span><span>必修第二册</span><span class="sep">/</span><span class="cur">第八章 机械能守恒定律</span></nav><h1 class="page-title">2. 重力势能</h1><div class="page-meta">物理 · 必修第二册 · 第八章 机械能守恒定律</div><article class="content" id="content"></article><nav class="pager"><a class="pager-link prev" href="bx2-c4-s1.html"><small>上一节</small><b>1. 功与功率</b></a><a class="pager-link next" href="bx2-c4-s3.html"><small>下一节</small><b>3. 动能和动能定理</b></a></nav></main><script>window.PAGE = {"sid": "phy", "slug": "bx2-c4-s2", "title": "2. 重力势能", "anchor": "#bx2-c4-s2"}; </script><script type="text/markdown" id="md"><div class="gx"><div class="gx-kicker">ELI5-HIGH · 讲给要考试的人</div><p class="gx-claim">E_p = mgh 的 h，是<b>相对零势能面</b>量的高度。换一条面，E_p 变，ΔE_p 不变。</p><div class="gx-meta"><span><i></i>人教版必修第二册 · 第八章第 2 节</span></div><section class="gx-sec" id="a"><h2><span class="sn">01</span>课本原话，翻成人话<span class="bdg bdg-key">必背</span></h2><div class="gx-quote"><p class="q-t">① 定义式<span class="q-src">教材</span></p><p class="q-b">重力势能等于所受重力与所处高度的乘积：<b>E_p = mgh</b>。</p><p class="q-n">人话：h 是<b>相对零势能面</b>的高度。同一本书，以桌面为面 E_p = 0，以地面为面 E_p = mgh<sub>桌</sub>。</p></div><div class="gx-quote"><p class="q-t">② 相对性<span class="q-src">教材</span></p><p class="q-b">选不同零势能面，同一位置的 E_p 不同；但<b>ΔE_p 与零势能面的选择无关</b>。</p><p class="q-n">人话：面上方 E_p &gt; 0，下方 E_p &lt; 0；正负只表示在面上方还是下方。</p></div><div class="gx-quote"><p class="q-t">③ 做功与路径无关<span class="q-src">教材</span></p><p class="q-b">重力做功只与初、末位置的高度差有关；重力势能是<b>物体与地球组成的系统所共有</b>的。</p><p class="q-n">人话：W<sub>G</sub> = mgh<sub>1</sub> − mgh<sub>2</sub> = −ΔE_p，高度差定了 W<sub>G</sub> 就定了。</p></div></section><section class="gx-sec" id="b"><h2><span class="sn">02</span>三张图看懂相对性<span class="bdg bdg-diff">易混</span></h2><figure class="gx-fig"><div class="fig-cap"><span class="fig-no">图 1</span><span class="fig-t">换一条面，E_p 就换个数</span><span class="bdg bdg-key">相对性</span></div><p class="fig-s">以地面为零势能面：h = 1.2 m，E_p = 2×10×1.2 = <b>24 J</b>。</p><p class="fig-s"></p><div class="gx-svgbox"><svg viewBox="0 0 900 200" role="img"><text x="30" y="22" font-size="11" font-weight="700" fill="#6d28d9">以地面为零势能面：E_p = 24 J</text><line x1="30" y1="176" x2="420" y2="176" stroke="#b9c1cb" stroke-width="2"/><rect x="170" y="80" width="80" height="30" fill="#f5f3ff" stroke="#7c3aed"/><line x1="140" y1="176" x2="140" y2="110" stroke="#b8791f" stroke-width="2"/><polygon points="140,110 135,121 145,121" fill="#b8791f"/><polygon points="140,176 135,165 145,165" fill="#b8791f"/><text x="130" y="148" text-anchor="end" font-size="10" fill="#8a5c14">h = 1.2 m</text><text x="470" y="22" font-size="11" font-weight="700" fill="#6d28d9">以桌面为零势能面：E_p = 0</text><line x1="470" y1="150" x2="860" y2="150" stroke="#8e97a4" stroke-width="2"/><rect x="630" y="120" width="80" height="30" fill="#f5f3ff" stroke="#7c3aed"/><text x="670" y="192" text-anchor="middle" font-size="10" fill="#6b7280">书在面上，h = 0</text></svg><span class="gx-zoomchip">点击放大</span></div><p class="gx-take">两法差 24 J，但书掉到地面的 ΔE_p 都是 <b>−24 J</b>。问"变化量"时面随便取。</p></figure><figure class="gx-fig"><div class="fig-cap"><span class="fig-no">图 2</span><span class="fig-t">两条路径，重力做功一样</span><span class="bdg bdg-must">必考</span></div><p class="fig-s">从 A 到 B，沿斜面与走楼梯，Δh 都是 4 m。</p><p class="fig-s">两种走法都得 W<sub>G</sub> = mgΔh = <b>80 J</b>：重力是恒力，只认高度差。</p><div class="gx-svgbox"><svg viewBox="0 0 900 200" role="img"><circle cx="120" cy="42" r="6" fill="#b8402f"/><text x="104" y="32" font-size="11" font-weight="700" fill="#b8402f">A</text><circle cx="700" cy="164" r="6" fill="#b8402f"/><text x="712" y="162" font-size="11" font-weight="700" fill="#b8402f">B</text><line x1="120" y1="42" x2="700" y2="164" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 4"/><text x="250" y="84" font-size="10" fill="#6d28d9">① 沿斜面</text><polyline points="120,42 290,42 290,100 460,100 460,164 700,164" fill="none" stroke="#2f6fd0" stroke-width="2"/><text x="298" y="32" font-size="10" fill="#2f6fd0">② 走楼梯</text><line x1="790" y1="164" x2="790" y2="42" stroke="#2f8a5b" stroke-width="2"/><polygon points="790,32 785,46 795,46" fill="#2f8a5b"/><text x="800" y="108" font-size="10" fill="#1e6640">Δh = 4 m</text><text x="450" y="192" text-anchor="middle" font-size="11" font-weight="700" fill="#3a3a35">W_G = mgΔh = 80 J（两条路都是 80 J）</text></svg><span class="gx-zoomchip">点击放大</span></div><p class="gx-take">路径只影响摩擦做功。要算 W<sub>G</sub> 就<b>只找高度差</b>，别追轨迹长度。</p></figure><figure class="gx-fig"><div class="fig-cap"><span class="fig-no">图 3</span><span class="fig-t">正负号与"系统共有"</span><span class="bdg bdg-warn">易错</span></div><p class="fig-s">面上方 h &gt; 0，E_p &gt; 0；面下方 h &lt; 0，E_p &lt; 0；负号不是方向。</p><p class="fig-s">E_p 属于<b>物体 + 地球</b>这个系统，因为 g 是系统给的。</p><div class="gx-svgbox"><svg viewBox="0 0 900 190" role="img"><text x="48" y="78" font-size="10" fill="#6d28d9">零势能面 h = 0</text><line x1="40" y1="86" x2="420" y2="86" stroke="#b9c1cb" stroke-width="2"/><line x1="620" y1="86" x2="860" y2="86" stroke="#b9c1cb" stroke-width="2"/><polyline points="420,86 420,152 620,152 620,86" fill="none" stroke="#b9c1cb" stroke-width="2"/><rect x="176" y="28" width="88" height="34" fill="#e6f6ee" stroke="#2f8a5b"/><text x="220" y="50" text-anchor="middle" font-size="11" font-weight="700" fill="#1e6640">E_p = +40 J</text><rect x="476" y="118" width="88" height="34" fill="#fdf3e0" stroke="#b8791f"/><text x="520" y="140" text-anchor="middle" font-size="11" font-weight="700" fill="#8a5c14">E_p = −40 J</text><line x1="40" y1="86" x2="860" y2="86" stroke="#7c3aed" stroke-width="2" stroke-dasharray="8 5"/></svg><span class="gx-zoomchip">点击放大</span></div><p class="gx-take">E_p 可以为负，但"负"不是向下。换一条面，同一位置的 E_p 又能变正。</p></figure></section><section class="gx-sec" id="c"><h2><span class="sn">03</span>自己拖一下<span class="bdg bdg-must">核心</span></h2><figure class="gx-fig"><div class="fig-cap"><span class="fig-no">互动 1</span><span class="fig-t">E_p 与 h 成正比</span><span class="gx-ap" id="gxAp"><i></i><span id="gxApTxt">自动演示中</span></span></div><p class="fig-s">取 m = 2 kg、g = 10 N/kg，<b>E_p = 20h</b>：h = 2 m 时 40 J，h = 5 m 时 <b>100 J</b>，h = 10 m 时 200 J。</p><p class="fig-s">滑块 0 → 10，柱高与 h <b>成正比</b>；h = 0 时柱高为 0，物体停在零势能面上。</p><div class="gx-board"><svg id="gxStage" class="gx-graph" viewBox="0 0 360 250" tabindex="0" role="application" aria-label="重力势能互动：拖动高度 h，观察 E_p 与状态"><text x="180" y="17" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3a3a35">E_p = mgh，h 从零势能面量起</text><line x1="24" y1="190" x2="230" y2="190" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 4"/><text x="26" y="204" font-size="8.5" fill="#6d28d9">零势能面 h = 0</text><rect id="gxObj" x="88" y="168" width="40" height="22" rx="3" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/><line id="gxH" x1="72" y1="190" x2="72" y2="178" stroke="#b8791f" stroke-width="2"/><polygon id="gxHa" points="72,178 67,187 77,187" fill="#b8791f"/><polygon id="gxHb" points="72,190 67,181 77,181" fill="#b8791f"/><text id="gxHlab" x="64" y="184" text-anchor="end" font-size="9" fill="#8a5c14">h = 0.0 m</text><line x1="264" y1="214" x2="296" y2="214" stroke="#e6e9ee"/><line x1="264" y1="76" x2="296" y2="76" stroke="#e6e9ee"/><text x="258" y="217" text-anchor="end" font-size="7.5" fill="#9aa3ae">0</text><text x="258" y="79" text-anchor="end" font-size="7.5" fill="#9aa3ae">200 J</text><rect id="gxBar" x="264" y="214" width="30" height="0" fill="#e6f6ee" stroke="#2f8a5b" stroke-width="1.4"/><text id="gxEplab" x="279" y="207" text-anchor="middle" font-size="9" font-weight="700" fill="#1e6640">0 J</text><text id="gxFormula" x="180" y="228" text-anchor="middle" font-size="9" fill="#3a3a35">E_p = 2 × 10 × 0.0 = 0 J</text><text id="gxHint" x="180" y="244" text-anchor="middle" font-size="8.5" fill="#6b7280">停在零势能面上：E_p = 0</text></svg><div class="bar"><span class="lb">高度 h</span><input type="range" id="gxSl" min="0" max="10" step="0.5" value="0" aria-label="物体相对零势能面的高度，单位米"><p class="hint">键盘 ← → 微调。</p></div></div><div class="stats"><div class="st"><div class="k">① 高度 h</div><div class="v" id="gxVh">0.0 m</div><div class="s">相对零势能面</div></div><div class="st"><div class="k">② 重力势能 E_p</div><div class="v" id="gxVe">0 J</div><div class="s">E_p = 20h</div></div><div class="st state" id="gxStBox"><div class="k">③ ΔE_p（相对 h = 0）</div><div class="v" id="gxVd">0 J</div><div class="s" id="gxVsn">h = 0，零势能面</div></div></div><p class="gx-take">停在 5 m 与 10 m 看一眼：100 J → 200 J，h 翻倍 E_p 翻倍。h = 0 时 E_p = 0，<b>但不是"没有能量"</b>。</p><p class="gx-note">模型口径：m = 2 kg、g = 10 N/kg，h ∈ [0, 10] m，E_p 为<b>模型计算值</b>。</p></figure></section><section class="gx-sec" id="d"><h2><span class="sn">04</span>一道题走一遍</h2><div class="gx-ex"><p class="ex-t">例题 · 下落的重力做功与势能变化<span class="bdg bdg-must">必考</span></p><p class="ex-q">m = 2 kg 的物体从 h<sub>1</sub> = 5 m 下落到 h<sub>2</sub> = 2 m，g 取 10 N/kg，以地面为零势能面。 求（1）W<sub>G</sub>；（2）ΔE<sub>p</sub>；（3）若改为从 2 m 升到 5 m，两者各是多少？</p><ol class="steps" id="gxSteps"><li class="step"><p class="s-h">第 1 步 · 先写两条关系式</p><p class="s-b">W<sub>G</sub> = mg(h<sub>1</sub> − h<sub>2</sub>)，ΔE<sub>p</sub> = mgh<sub>2</sub> − mgh<sub>1</sub>，合起来 <b>W<sub>G</sub> = −ΔE<sub>p</sub></b>。</p></li><li class="step" hidden><p class="s-h">第 2 步 · 算 W<sub>G</sub></p><p class="s-b">Δh = 3 m，W<sub>G</sub> = 2×10×3 = <b>60 J</b>。下降时重力与位移同向，是<b>正功</b>。</p></li><li class="step" hidden><p class="s-h">第 3 步 · 算 ΔE<sub>p</sub></p><p class="s-b">E<sub>p1</sub> = 100 J，E<sub>p2</sub> = 40 J，ΔE<sub>p</sub> = 40 − 100 = <b>−60 J</b>，势能减少 60 J。</p></li><li class="step" hidden><p class="s-h">第 4 步 · 对账 W<sub>G</sub> = −ΔE<sub>p</sub></p><p class="s-b">60 J 与 −(−60) J 相等。重力做多少正功，势能就减少多少，两者等大反号。</p></li><li class="step" hidden><p class="s-h">第 5 步 · 反过来：2 m 升到 5 m</p><p class="s-b">W<sub>G</sub> = 2×10×(2−5) = <b>−60 J</b>，ΔE<sub>p</sub> = <b>+60 J</b>。改走斜面仍是 −60 J，<b>与路径无关</b>。</p></li></ol><div class="exbar"><button id="gxNext" type="button">下一步</button><span class="cnt" id="gxCnt">1 / 5</span></div><div class="ans" id="gxAns" hidden><p class="ans-t">标准答案（可抄进答题卡）</p><p class="ans-b">（1）W<sub>G</sub> = mg(h<sub>1</sub> − h<sub>2</sub>) = 2×10×3 = <b>60 J</b>（正功）。<br> （2）ΔE<sub>p</sub> = 40 − 100 = <b>−60 J</b>，势能减少 60 J。<br> （3）上升时 W<sub>G</sub> = <b>−60 J</b>，ΔE<sub>p</sub> = <b>+60 J</b>，仍满足 W<sub>G</sub> = −ΔE<sub>p</sub>。</p></div><p class="gx-note">高频扣分：把 W<sub>G</sub> 写成 mg(h<sub>2</sub> − h<sub>1</sub>) 导致符号反；把"势能减少 60 J"写成"势能 −60 J"。</p></div></section><section class="gx-sec" id="e"><h2><span class="sn">05</span>考你会怎么考</h2><div class="gx-qa"><div class="qac"><p class="q">h 从哪量起？</p><p class="a">从选定的<b>零势能面</b>量起，不是从地面量起。</p><svg viewBox="0 0 240 132" role="img"><line x1="24" y1="100" x2="216" y2="100" stroke="#7c3aed" stroke-dasharray="6 4"/><text x="30" y="116" font-size="9" fill="#6d28d9">零势能面 h=0</text><rect x="100" y="48" width="44" height="26" fill="#f5f3ff" stroke="#7c3aed"/><line x1="76" y1="100" x2="76" y2="54" stroke="#b8791f" stroke-width="1.6"/><polygon points="76,46 72,60 80,60" fill="#b8791f"/><text x="64" y="82" text-anchor="end" font-size="9" fill="#8a5c14">h</text></svg></div><div class="qac"><p class="q">高度翻倍，E_p 也翻倍吗？</p><p class="a"><b>是。</b>m、g 不变时 E_p ∝ h。</p><svg viewBox="0 0 240 132" role="img"><line x1="30" y1="106" x2="210" y2="106" stroke="#8e97a4" stroke-width="1.6"/><rect x="58" y="78" width="34" height="20" fill="#e6f6ee" stroke="#2f8a5b"/><rect x="150" y="42" width="34" height="56" fill="#e6f6ee" stroke="#2f8a5b"/><text x="75" y="122" text-anchor="middle" font-size="8.5" fill="#6b7280">h → 20 J</text><text x="167" y="122" text-anchor="middle" font-size="8.5" fill="#6b7280">2h → 40 J</text><text x="120" y="22" text-anchor="middle" font-size="10" font-weight="700" fill="#1e6640">E_p ∝ h</text></svg></div><div class="qac"><p class="q">下落时重力做功多少？</p><p class="a">W<sub>G</sub> = mgh &gt; 0，<b>正功</b>，E_p 同时减少 mgh。</p><svg viewBox="0 0 240 132" role="img"><line x1="30" y1="104" x2="210" y2="104" stroke="#8e97a4" stroke-width="1.6"/><circle cx="86" cy="40" r="10" fill="#f5f3ff" stroke="#7c3aed"/><line x1="86" y1="56" x2="86" y2="88" stroke="#b8402f" stroke-width="1.8"/><polygon points="86,100 82,88 90,88" fill="#b8402f"/><text x="102" y="72" font-size="9" fill="#b8402f">mg 做正功</text></svg></div><div class="qac"><p class="q">沿斜面与竖直下落，做功一样吗？</p><p class="a"><b>一样。</b>只与高度差有关，与路径无关。</p><svg viewBox="0 0 240 132" role="img"><line x1="26" y1="104" x2="214" y2="104" stroke="#8e97a4" stroke-width="1.6"/><line x1="56" y1="36" x2="150" y2="104" stroke="#7c3aed" stroke-width="2"/><line x1="190" y1="36" x2="190" y2="98" stroke="#b8791f" stroke-width="2" stroke-dasharray="4 3"/><polygon points="190,104 186,92 194,92" fill="#b8791f"/><text x="96" y="80" font-size="9" fill="#6d28d9">斜面</text><text x="120" y="122" text-anchor="middle" font-size="9" fill="#1e6640">W 都是 mgΔh</text></svg></div><div class="qac"><p class="q">E_p 是物体单独具有的吗？</p><p class="a"><b>不是。</b>它属于"<b>物体 + 地球</b>"系统。</p><svg viewBox="0 0 240 132" role="img"><path d="M60 132 A78 78 0 0 1 180 132" fill="#eef5fc" stroke="#2f6fd0"/><rect x="104" y="26" width="32" height="22" fill="#f5f3ff" stroke="#7c3aed"/><line x1="120" y1="48" x2="120" y2="70" stroke="#b8402f" stroke-width="1.6"/><polygon points="120,84 115,72 125,72" fill="#b8402f"/><text x="120" y="104" text-anchor="middle" font-size="9" fill="#2f6fd0">地球</text><text x="120" y="122" text-anchor="middle" font-size="9" font-weight="700" fill="#1e6640">系统共有</text></svg></div><div class="qac"><p class="q">面下方的 E_p 为什么是负的？</p><p class="a">因为 h &lt; 0。<b>负号表示位置在面下方</b>，不是方向。</p><svg viewBox="0 0 240 132" role="img"><line x1="24" y1="60" x2="216" y2="60" stroke="#7c3aed" stroke-dasharray="6 4"/><text x="30" y="50" font-size="8.5" fill="#6d28d9">h = 0</text><rect x="70" y="24" width="30" height="20" fill="#e6f6ee" stroke="#2f8a5b"/><text x="85" y="18" text-anchor="middle" font-size="8.5" fill="#1e6640">+E_p</text><rect x="150" y="78" width="30" height="20" fill="#fdf3e0" stroke="#b8791f"/><text x="165" y="112" text-anchor="middle" font-size="8.5" fill="#8a5c14">−E_p</text></svg></div></div><p class="gx-note">六问归一条：<b>E_p 随零势能面变，ΔE_p 与 W<sub>G</sub> 不变</b>。题目没给面就自己声明一条。</p></section><section class="gx-sec" id="f"><h2><span class="sn">06</span>易错清单</h2><div class="gx-errs"><div class="er"><p class="er-x">✗ 重力势能是物体单独具有的。</p><p class="er-v">✓ 为物体与地球组成的系统所共有。</p><p class="er-w">g 来自地球，离开系统公式没有意义。</p></div><div class="er"><p class="er-x">✗ E_p 是负的，说明方向向下。</p><p class="er-v">✓ 负号只表示在零势能面下方；势能是标量。</p><p class="er-w">换一条更低的零势能面，它就能变正。</p></div><div class="er"><p class="er-x">✗ 沿斜面下滑重力做功更多。</p><p class="er-v">✓ 一样多，W<sub>G</sub> = mgΔh，与路径无关。</p><p class="er-w">路径变长只影响摩擦力做功。</p></div><div class="er"><p class="er-x">✗ 换零势能面，ΔE_p 也变了。</p><p class="er-v">✓ ΔE_p 与零势能面无关，变的只是 E_p 的数值。</p><p class="er-w">两条 h 同减一个常数，差不变。</p></div><div class="er"><p class="er-x">✗ 重力做正功，重力势能增加。</p><p class="er-v">✓ 做正功则势能减少，W<sub>G</sub> = −ΔE<sub>p</sub>。</p><p class="er-w">正功 → 减少；负功 → 增加。</p></div><div class="er"><p class="er-x">✗ 在零势能面上就没有机械能。</p><p class="er-v">✓ 只是 E_p = 0，动能可以不为零。</p><p class="er-w">"E_p = 0"是相对这条面说的。</p></div></div></section><div class="gx-foot"><p>教材依据：人教版《物理》必修第二册（2019 年版）第八章第 2 节「重力势能」。</p><p>数值口径：m = 2 kg、g = 10 N/kg 为<b>模型值</b>，E_p、W<sub>G</sub> 由 E_p = mgh、W<sub>G</sub> = mgΔh 算出。零势能面默认取地面（互动取 h = 0 处）：E_p 随该选择而变，ΔE_p 与它无关。</p></div></div><div class="gx-zoom" id="gxZoom" hidden><span class="gx-zoom-tip">双指放大看细节</span><button class="gx-zoom-x" type="button" aria-label="关闭">✕</button><div id="gxZoomInner"></div></div></script><script src="../../assets/page.js"></script><script src="../../assets/gx.js"></script><script src="../../assets/autopilot.js"></script><script> document.addEventListener("DOMContentLoaded", function () { var $ = GX.$, stage = $("gxStage"), M = 2, G = 10, H = 0, BASE = 190, PX = 10, BAR = 214; function calc(h) { h = Math.round(h * 10) / 10; var ep = M * G * h, z = h < 0.01; return { ep: ep, z: z, st: z ? "零势能面" : "重力势能为正", col: z ? "#2f8a5b" : "#b8791f", bg: z ? "#e6f6ee" : "#fdf3e0" }; } function render() { var s = calc(H), yB = BASE - H * PX; $("gxObj").setAttribute("y", yB - 22); $("gxH").setAttribute("y1", BASE); $("gxH").setAttribute("y2", yB); $("gxHa").setAttribute("points", "72," + yB + " 67," + (yB + 9) + " 77," + (yB + 9)); $("gxHb").setAttribute("points", "72," + BASE + " 67," + (BASE - 9) + " 77," + (BASE - 9)); var vis = H > 0.2 ? "1" : "0"; ["gxH", "gxHa", "gxHb"].forEach(function (id) { $(id).style.opacity = vis; }); $("gxHlab").setAttribute("y", (yB + BASE) / 2 + 3); $("gxHlab").textContent = "h = " + H.toFixed(1) + " m"; var bh = Math.min(138, s.ep * 0.69), bar = $("gxBar"); bar.setAttribute("y", BAR - bh); bar.setAttribute("height", bh); bar.setAttribute("fill", s.bg); bar.setAttribute("stroke", s.col); $("gxEplab").setAttribute("y", BAR - bh - 7); $("gxEplab").setAttribute("fill", s.col); $("gxEplab").textContent = s.ep.toFixed(0) + " J"; $("gxFormula").textContent = "E_p = 2 × 10
