<div class="gx-meta">
  <span><i></i>人教版必修第二册 · 第六章第 1 节</span>

<p class="gx-lede">描述「转得多快」有两把尺子：一把量<b>走过的弧长</b>，得到线速度 v；一把量<b>转过的角度</b>，得到角速度 ω。
两把尺子由 <b>v = ωr</b> 连起来，再由 <b>ω = 2π/T</b> 接到周期上。这一节真正要练的不是套公式，
而是分清题目给的是「同轴转动」（ω 相同）还是「皮带传动」（边缘 v 相同）——这两句话决定了你该让哪个量相等。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">四句话：什么叫匀速圆周运动、线速度、角速度、周期与 v = ωr。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 匀速圆周运动<span class="q-src">人教版必修第二册 · 第六章第 1 节</span></p>
<p class="q-b">质点沿圆周运动，如果在相等的时间内通过的圆弧长度都相等，这种运动叫作匀速圆周运动。</p>
<p class="q-n">「匀速」指的是<b>相等时间通过的弧长相等</b>，也就是速率不变；方向一刻也没停过变化。
所以课本把它归入<b>变速运动</b>，不是匀速运动。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 线速度<span class="q-src">人教版必修第二册 · 第六章第 1 节</span></p>
<p class="q-b">质点做圆周运动通过的弧长 Δs 与所用时间 Δt 的比值，叫作线速度的大小，v = Δs/Δt；线速度的方向沿圆周上该点的切线方向。</p>
<p class="q-n">注意分子是<b>弧长</b>，不是位移大小，也不是弦长。Δt 取得很小时，弧长趋近于沿切线的那一小段，
所以方向落在切线上——这也解释了为什么线速度<b>与半径垂直</b>。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 角速度<span class="q-src">人教版必修第二册 · 第六章第 1 节</span></p>
<p class="q-b">半径转过的角度 Δθ 与所用时间 Δt 的比值，叫作角速度，ω = Δθ/Δt，单位是弧度每秒（rad/s）。</p>
<p class="q-n">Δθ 必须用<b>弧度</b>。一圈对应 2π rad ≈ 6.28 rad，所以「转一圈用 T」就给出 <b>ω = 2π/T</b>。
用「度」代入这条式子，算出来的数会差 57.3 倍。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 周期、频率与 v = ωr<span class="q-src">人教版必修第二册 · 第六章第 1 节</span></p>
<p class="q-b">做圆周运动的物体转过一周所用的时间叫作周期 T；单位时间内转过的圈数叫作频率 f，f = 1/T。由 Δs = rΔθ 可得 v = ωr。</p>
<p class="q-n">v = ωr 是这一节的枢纽：<b>同轴转动时 ω 相同</b>，于是 v ∝ r，半径越大线速度越大；
<b>皮带传动时边缘 v 相同</b>，于是 ω ∝ 1/r，半径小的转得快。</p>
</div>

<p class="gx-note">四个量排成一条链：<b>T → ω = 2π/T → v = ωr</b>，频率只是 T 的倒数。
题目给任意两个量，都能顺着这条链把其余的量算出来；判断「谁和谁相等」比套公式更关键。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己写，再点「下一步」。这题的关键是「先由 T 求 ω，再由 ω 求 v」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 自行车轮边缘一点<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">自行车车轮的半径 r = 0.3 m，车轮绕轴匀速转动，周期 T = 0.2 s。
求车轮边缘一点的线速度大小 v、角速度 ω 和频率 f，并求该点在 1 s 内通过的路程。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 统一单位，认准已知量</p>
<p class="s-b">把已知写成同一套单位：<b>r = 0.3 m，T = 0.2 s</b>。T 是「转一整圈用的时间」，它与半径无关，
只由轮子转得多快决定。要求的是 v、ω、f 和 1 s 内的路程。</p>
<p class="s-k">用到：周期 T 的定义——转一周的时间，单位必须换成秒。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 由周期求角速度</p>
<p class="s-b">转一圈转过的角度是 2π rad，所以 <b>ω = 2π/T = 2 × 3.1416 ÷ 0.2 = 31.4 rad/s</b>。
这一步只用 T，用不到 r——角速度描述的是「转得多快」，与半径无关。</p>
<p class="s-k">用到：ω = 2π/T；一圈 = 2π rad。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 由角速度求线速度</p>
<p class="s-b"><b>v = ωr = 31.4 × 0.3 = 9.42 m/s</b>。也可以直接用 v = 2πr/T：
2 × 3.1416 × 0.3 ÷ 0.2 = 9.42 m/s，两条路结果一致。这就是 v = ωr 的用处。</p>
<p class="s-k">用到：v = ωr（等效于 v = 2πr/T）。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 频率与 1 s 内的路程</p>
<p class="s-b"><b>f = 1/T = 1 ÷ 0.2 = 5 Hz</b>，即每秒转 5 圈。1 s 内走过的路程等于 5 个圆周长：
5 × 2πr = 5 × 1.885 = <b>9.42 m</b>，与「路程 = v·t = 9.42 × 1」完全一致。</p>
<p class="s-k">用到：f = 1/T；路程 = 速率 × 时间。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 换个条件再问一次：T 减半会怎样</p>
<p class="s-b">若 T 从 0.2 s 减到 0.1 s：ω 加倍成 62.8 rad/s，v 也加倍成 18.8 m/s，f 从 5 Hz 变成 10 Hz。
原因是 v ∝ 1/T、ω ∝ 1/T，<b>T 与这些量都是反比</b>。答题时要写清「T 减半 ⇒ 转速加倍」，
不要写成「T 减半 ⇒ v 减半」。</p>
<p class="s-k">用到：T 与 f、ω、v 都成反比（r 不变时）。</p>
</li>
</ol>
<div class="exbar">
  <button id="gxNext" type="button">下一步</button>
  <span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">车轮边缘一点随轮做匀速圆周运动，r = 0.3 m，T = 0.2 s。<br>
（1）角速度：ω = 2π/T = 2π ÷ 0.2 = <b>31.4 rad/s</b>。<br>
（2）线速度：v = ωr = 31.4 × 0.3 = <b>9.42 m/s</b>（或 v = 2πr/T）。<br>
（3）频率：f = 1/T = <b>5 Hz</b>。<br>
（4）1 s 内通过的路程：s = vt = 9.42 × 1 = <b>9.42 m</b>（即 5 个圆周长）。<br>
方向：该点的线速度方向沿车轮在该处的切线方向，时刻改变，因此这是变速运动。</p>
</div>
<p class="gx-note">阅卷高频扣分：把 T 与 f 弄反（写成 f = T）；ω 用「度每秒」代入；
算出 v 后忘了写方向；把「1 s 内路程」当成位移（转 5 圈位移为 0，路程是 9.42 m）。</p>
</div>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是卷面上真出现过的错句，右边是能得分的表述。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 匀速圆周运动的速度不变，所以是匀速运动。</p>
<p class="er-v">✓ 速率不变，速度方向时刻改变；速度是矢量，所以它是变速运动。</p>
<p class="er-w">「匀速」在圆周运动里只约束大小。方向变了，速度就变了，加速度也不为零。</p>
</div>
<div class="er">
<p class="er-x">✗ 线速度的方向沿半径，指向圆心。</p>
<p class="er-v">✓ 线速度沿该点的切线方向，与半径垂直。</p>
<p class="er-w">沿半径指向圆心的是向心加速度（下一节），不是速度；把两者混在一起，后面的受力分析全错。</p>
</div>
<div class="er">
<p class="er-x">✗ v = ωr 里的 ω 用「度每秒」代入。</p>
<p class="er-v">✓ ω 必须用 rad/s；1 圈 = 2π rad ≈ 6.28 rad。</p>
<p class="er-w">用度代入会大 57.3 倍。看到 ω 的数值特别大（比如 360），先检查单位。</p>
</div>
<div class="er">
<p class="er-x">✗ 周期 T 越大，转速越快。</p>
<p class="er-v">✓ T 是转一圈用的时间，T 越小转得越快；f = 1/T。</p>
<p class="er-w">T 与 f、ω、v（r 不变时）都是反比关系，方向别弄反。</p>
</div>
<div class="er">
<p class="er-x">✗ 半径越大，线速度一定越大。</p>
<p class="er-v">✓ 只有 ω 相同时才有 v ∝ r；若 v 相同，则 r 越大 ω 越小。</p>
<p class="er-w">v = ωr 里 v 由 ω 和 r 共同决定，不能只看 r。皮带传动那一侧就是 ω 与 r 成反比。</p>
</div>
<div class="er">
<p class="er-x">✗ 同一转盘上各点的线速度都相同。</p>
<p class="er-v">✓ 同一转盘（同轴转动）各点 ω 相同，线速度 v = ωr 随半径不同而不同。</p>
<p class="er-w">「同轴看 ω，皮带看 v」这八个字能挡掉这一类错误。</p>
</div>
</div>
</section>

<p class="gx-note" style="border-top:1px solid var(--line);padding-top:14px">这一节只描述「怎么转」，没解释「为什么能转下去」。
下一节把转圈和力连起来：<b>向心力</b>——做匀速圆周运动的物体，合力必须指向圆心。</p>

<div class="gx-foot">
<p>教材依据：人教版《物理》必修第二册（2019 年版）第六章第 1 节「圆周运动」。课文引文按教材表述整理，页码以纸质书为准。</p>
<p>数值口径：互动取 r = 2 m 固定、T ∈ [0.5, 4] s、π 取 3.1416；v = 2πr/T、ω = 2π/T、f = 1/T
均为<b>公式计算值</b>（模型值），不是某次实测。例题取车轮 r = 0.3 m、T = 0.2 s，
算出 v = 9.42 m/s、ω = 31.4 rad/s、f = 5 Hz，取 π = 3.1416 时成立（用 3.14 会得 9.42 m/s，同样写法）。</p>
<p>本页把「弧长 Δs」与「位移」分开处理：线速度大小按弧长定义，方向取极限后的切线方向；
1 s 内转 5 圈时路程为 9.42 m，而位移为 0，两者不可混用。</p>
</div>

</div>

<div class="gx-zoom" id="gxZoom" hidden>
  <span class="gx-zoom-tip">双指放大看细节</span>
  <button class="gx-zoom-x" type="button" aria-label="关闭">✕</button>
  <div id="gxZoomInner"></div>

<script src="../../assets/page.js"></script>
<script src="../../assets/gx.js"></script>
<script src="../../assets/autopilot.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var $ = GX.$;
  var stage = $("gxStage");
  var R = 2, PI = Math.PI, TAU = 2 * PI;
  var T = 4;
  var ang = 0, lastMs = 0;

  function calc(t) {
    var v = 2 * PI * R / t;
    var w = 2 * PI / t;
    return { v: v, w: w, f: 1 / t };
  }

  function nowMs() {
    return (window.performance && performance.now) ? performance.now() : Date.now();
  }

  function render() {
    var t = nowMs();
    var dt = lastMs ? Math.min((t - lastMs) / 1000, 0.05) : 0;
    lastMs = t;

    var s = calc(T);
    ang += s.w * dt;
    while (ang >= TAU) ang -= TAU;
    while (ang < 0) ang += TAU;

    var cx = 108, cy = 138, Rpx = 74;
    var px = cx + Rpx * Math.cos(ang), py = cy + Rpx * Math.sin(ang);
    var nx = -Math.sin(ang), ny = Math.cos(ang);
    var ux = Math.cos(ang), uy = Math.sin(ang);

    var pt = $("gxPt");
    pt.setAttribute("cx", px.toFixed(1));
    pt.setAttribute("cy", py.toFixed(1));

    var rad = $("gxRad");
    rad.setAttribute("x2", px.toFixed(1));
    rad.setAttribute("y2", py.toFixed(1));
    $("gxRadLab").setAttribute("x", (cx + 0.52 * (px - cx) - 7 * ux).toFixed(1));
    $("gxRadLab").setAttribute("y", (cy + 0.52 * (py - cy) - 7 * uy).toFixed(1));

    var s0x = px + 11 * nx, s0y = py + 11 * ny;
    var s1x = px + 38 * nx, s1y = py + 38 * ny;
    var tan = $("gxTan");
    tan.setAttribute("x1", s0x.toFixed(1));
    tan.setAttribute("y1", s0y.toFixed(1));
    tan.setAttribute("x2", s1x.toFixed(1));
    tan.setAttribute("y2", s1y.toFixed(1));
    $("gxTanH").setAttribute("points",
      (s1x + 7 * nx).toFixed(1) + "," + (s1y + 7 * ny).toFixed(1) + " " +
      (s1x - 5 * ux + 5 * nx).toFixed(1) + "," + (s1y - 5 * uy + 5 * ny).toFixed(1) + " " +
      (s1x + 5 * ux + 5 * nx).toFixed(1) + "," + (s1y + 5 * uy + 5 * ny).toFixed(1));
    $("gxVlab").setAttribute("x", (s1x + 11 * nx + 3 * ux).toFixed(1));
    $("gxVlab").setAttribute("y", (s1y + 11 * ny + 3 * uy).toFixed(1));

    var arc = $("gxAngArc");
    if (ang > 0.04) {
      var ax = cx + 24 * Math.cos(ang), ay = cy + 24 * Math.sin(ang);
      arc.setAttribute("d", "M " + (cx + 24) + " " + cy +
        " A 24 24 0 " + (ang > PI ? 1 : 0) + " 1 " + ax.toFixed(1) + " " + ay.toFixed(1));
      arc.style.opacity = "1";
      var half = ang / 2;
      var angLab = $("gxAngLab");
      angLab.setAttribute("x", (cx + 35 * Math.cos(half)).toFixed(1));
      angLab.setAttribute("y", (cy + 35 * Math.sin(half) + 3).toFixed(1));
      angLab.style.opacity = "1";
    } else {
      arc.style.opacity = "0";
      $("gxAngLab").style.opacity = "0";
    }

    $("gxBigT").textContent = T.toFixed(1) + " s";
    $("gxBigV").textContent = "v = " + s.v.toFixed(1) + " m/s";
    $("gxBigW").textContent = "ω = " + s.w.toFixed(2) + " rad/s";
    $("gxBigF").textContent = "f = " + s.f.toFixed(2) + " Hz";
    $("gxTheta").textContent = "θ = " + (ang * 180 / PI).toFixed(0) + "°";
    $("gxArcS").textContent = "s = rθ = " + (R * ang).toFixed(1) + " m";

    var hint;
    if (T <= 1.05) hint = "T 很小：转得快，ω 和 v 都大";
    else if (T >= 3) hint = "T 很大：转得慢，ω 和 v 都小";
    else hint = "T 适中：ω = 2π/T，v = ωr";
    $("gxHint").textContent = hint;

    $("gxVt").textContent = T.toFixed(1) + " s";
    $("gxVf").textContent = "f = 1/T = " + s.f.toFixed(2) + " Hz";
    $("gxVv").textContent = s.v.toFixed(1) + " m/s";
    $("gxVw").textContent = s.w.toFixed(2) + " rad/s";
  }

  var ap = null, dragging = false, moved = false, downX = 0, suppressTap = false;

  function xToT(clientX) {
    var r = stage.getBoundingClientRect();
    var f = (clientX - r.left) / r.width;
    var t = 0.5 + Math.max(0, Math.min(1, f)) * 3.5;
    return Math.round(t * 10) / 10;
  }

  stage.addEventListener("pointerdown", function (ev) {
    dragging = true; moved = false; downX = ev.clientX;
    if (ap) ap.take();
    T = xToT(ev.clientX);
    if (ap) ap.setValue(T, false);
    render();
    try { stage.setPointerCapture(ev.pointerId); } catch (e) {}
  });
  stage.addEventListener("pointermove", function (ev) {
    if (!dragging) return;
    if (Math.abs(ev.clientX - downX) > 4) moved = true;
    T = xToT(ev.clientX);
    if (ap) ap.setValue(T, false);
    render();
  });
  stage.addEventListener("pointerup", function () {
    if (moved) suppressTap = true;
    dragging = false;
  });
  stage.addEventListener("click", function (ev) {
    if (!suppressTap) return;
    suppressTap = false;
    ev.stopImmediatePropagation();
  });

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  render();
  ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 4 }, { t: 1.8, v: 4 }, { t: 3.4, v: 2 }, { t: 4.6, v: 2 },
           { t: 6.2, v: 1 }, { t: 8.7, v: 1 }, { t: 10.3, v: 0.5 }, { t: 11.5, v: 0.5 },
           { t: 12.8, v: 4 }],
    keys: [0.5, 1, 2, 4],
    value: T, min: 0.5, max: 4, step: 0.1,
    idle: 5000,
    onChange: function (v) { T = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc };
  window.__probe = function () {
    return {
      T: $("gxVt").textContent,
      v: $("gxVv").textContent,
      w: $("gxVw").textContent,
      cnt: $("gxCnt").textContent
    };
  };
});
</script>
</body>
