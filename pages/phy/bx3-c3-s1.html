<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本原话，拆成三句</h2>
<div class="q-src">人教版必修第三册 · 第十一章第1节</div>

<div class="q">
<p class="q-t">“电源的作用是维持导体两端的电压，使导体中有持续的电流；电源把其他形式的能转化为电能。”</p>
<p class="q-b">电源不“制造电荷”。它靠非静电力把正电荷从负极搬到正极，让两极之间一直有电压；外电路一接通，电荷被这个电压推着走，才有持续电流。干电池消耗化学能，蓄电池放电时也是化学能，发电机则是机械能。</p>
</div>

<div class="q">
<p class="q-t">“电流 I=q/t，单位安培，符号 A；规定正电荷定向移动的方向为电流方向。”</p>
<p class="q-b">q 是时间 t 内通过某一横截面的电荷量，不是导体里一共有多少电荷。1 A=1 C/s。方向是人为规定的：正电荷往哪走，电流就往哪指；金属里真正移动的是带负电的电子，所以电子移动方向与电流方向相反。</p>
</div>

<div class="q">
<p class="q-t">“微观表达式 I=nqvS：n 为单位体积自由电荷数，q 为每个自由电荷的电荷量，v 为定向移动速率，S 为导体横截面积。”</p>
<p class="q-b">取一段长 vΔt、横截面 S 的导体，里面共有 n·S·vΔt 个自由电荷，总电荷量 nqvSΔt，除以 Δt 就得到 I=nqvS。n、q、S 由材料与导线决定，v 才是随电压、电阻改变的量。</p>
</div>

<p class="gx-note">读法：先问“电流方向怎么规定”，再问“q 和 t 分别指什么”，最后才套 I=nqvS。</p>
</section>

<p class="gx-note">模型口径：n=8.5×10²⁸ m⁻³、S=1×10⁻⁶ m²、q=1.6×10⁻¹⁹ C 固定，v∈[10⁻⁵,10⁻³] m/s，I=nqvS。动画中电子的移动速度按对数缩放，只示意“v 越大动得越快”，不代表真实速率比例。</p>
</figure>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">三个问分别考 I=q/t、电子数、I=nqvS。先自己写，再点“下一步”。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 定义式与微观式<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">一段导体两端加电压，3 s 内通过某一横截面的电荷量为 6 C。求：
（1）通过导体的电流 I；
（2）这 3 s 内通过横截面的电子数；
（3）若该导体 n=8.5×10²⁸ m⁻³、S=1×10⁻⁶ m²，电子定向移动速率 v=1.47×10⁻⁴ m/s，求 I，并与（1）比较。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 先认公式，别拿一个式子套三问</p>
<p class="s-b">（1）已知 q 和 t，求 I，用定义式 I=q/t；（2）已知总电荷量，求电子个数，用 N=q/e；（3）已知 n、q、S、v，求 I，用微观式 I=nqvS。
三个问都是国际单位，不用换算。</p>
<p class="s-k">用到：电流定义式、元电荷、微观表达式。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 定义式求电流</p>
<p class="s-b"><b>I=q/t=6 C ÷ 3 s=2 A</b>。1 A=1 C/s，意思是每秒钟有 2 C 的电荷通过这个横截面。</p>
<p class="s-k">用到：I=q/t。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 电子数用总电荷量除元电荷</p>
<p class="s-b">每个电子电荷量 e=1.6×10⁻¹⁹ C，<b>N=q/e=6 ÷ (1.6×10⁻¹⁹)=3.75×10¹⁹ 个</b>。
这里用的是 3 s 内的总电荷量 6 C，不是 1 s 的 2 C。</p>
<p class="s-k">用到：元电荷 e=1.6×10⁻¹⁹ C。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 微观式求电流</p>
<p class="s-b">I=nqvS=8.5×10²⁸×1.6×10⁻¹⁹×1×10⁻⁶×1.47×10⁻⁴。先合并常量：nqS=1.36×10⁴，
再乘 v：<b>I=1.36×10⁴×1.47×10⁻⁴≈2.0 A</b>。</p>
<p class="s-k">用到：I=nqvS，先合并常量再乘 v。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 对照答案，检查量级</p>
<p class="s-b">两种算法都得到 2 A：v=1.47×10⁻⁴ m/s 时，1 s 内正好有 2 C 电荷通过横截面。
若 v=1×10⁻⁴ m/s，I 只有 1.36 A——I 与 v 成正比，v 增到 1.47 倍，I 才到 2 A。</p>
<p class="s-k">用到：I∝v，n、q、S 不变。</p>
</li>
</ol>
<div class="exbar">
  <button id="gxNext" type="button">下一步</button>
  <span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）<b>I=q/t=6÷3=2 A</b>。<br>
（2）<b>N=q/e=6÷(1.6×10⁻¹⁹)=3.75×10¹⁹ 个</b>。<br>
（3）<b>I=nqvS=8.5×10²⁸×1.6×10⁻¹⁹×1×10⁻⁶×1.47×10⁻⁴≈2.0 A</b>，与（1）一致。</p>
</div>
<p class="gx-note">阅卷高频扣分：第（2）问用 2 C 而不是 6 C；第（3）问漏掉 S=1×10⁻⁶；把 v 当成热运动速率；算出数值不写单位。</p>
</div>
</section>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>考你会怎么考</h2>
<p class="gx-h2s">六种问法，一半在问“方向”和“v 到底是什么”。</p>

<div class="gx-qa">
<div class="qac">
<p class="q">电流方向是怎么规定的？</p>
<p class="a"><b>规定正电荷定向移动的方向为电流方向。</b>金属里移动的是电子（带负电），实际移动方向与电流方向相反，但规定不变。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="规定正电荷移动方向为电流方向">
  <line x1="24" y1="66" x2="196" y2="66" stroke="#cfd4da" stroke-width="2"/>
  <polygon points="212,66 196,60 196,72" fill="#7c3aed"/>
  <text x="100" y="54" font-size="9" fill="#7c3aed">I</text>
  <circle cx="60" cy="66" r="8" fill="#b8791f"/>
  <text x="60" y="70" text-anchor="middle" font-size="9" fill="#fff">＋</text>
  <text x="120" y="96" text-anchor="middle" font-size="8.5" fill="#6b7280">正电荷移动方向</text>
</svg>
</div>
<div class="qac">
<p class="q">电子向左移动，为什么电流方向向右？</p>
<p class="a"><b>电流方向是“正电荷会往哪走”的规定，不是“谁在动”。</b>负电荷向左移动，与正电荷向右移动等效，所以电流方向仍向右。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="电子移动方向与电流方向相反">
  <line x1="30" y1="44" x2="200" y2="44" stroke="#7c3aed" stroke-width="2"/>
  <polygon points="214,44 200,38 200,50" fill="#7c3aed"/>
  <text x="60" y="34" font-size="8.5" fill="#7c3aed">I</text>
  <line x1="210" y1="92" x2="40" y2="92" stroke="#2f6fd0" stroke-width="2"/>
  <polygon points="26,92 40,86 40,98" fill="#2f6fd0"/>
  <text x="120" y="110" text-anchor="middle" font-size="8.5" fill="#2f6fd0">电子</text>
</svg>
</div>
<div class="qac">
<p class="q">I=q/t 里的 q 是导体中所有电荷吗？</p>
<p class="a"><b>不是。q 是时间 t 内通过某一横截面的电荷量。</b>导体里电荷再多，没有通过这个横截面，就不计入 q。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="电荷通过横截面才计入q">
  <ellipse cx="100" cy="64" rx="16" ry="42" fill="none" stroke="#2f6fd0" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="70" cy="48" r="5" fill="#b8791f"/><circle cx="130" cy="48" r="5" fill="#b8791f"/>
  <circle cx="70" cy="82" r="5" fill="#b8791f"/><circle cx="130" cy="82" r="5" fill="#b8791f"/>
  <circle cx="100" cy="64" r="5" fill="#b8791f"/>
  <text x="172" y="68" font-size="8.5" fill="#6b7280">横截面</text>
  <text x="120" y="120" text-anchor="middle" font-size="8.5" fill="#6b7280">只算穿过去的</text>
</svg>
</div>
<div class="qac">
<p class="q">I=nqvS 里的 v 是热运动速率吗？</p>
<p class="a"><b>不是。v 是定向移动速率，约 10⁻⁴ m/s。</b>热运动速率约 10⁵ m/s，但方向杂乱，不形成电流。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="热运动杂乱，定向移动形成电流">
  <path d="M30 40 L54 66 L36 84 L64 104 L48 120" fill="none" stroke="#cfd4da" stroke-width="1.6"/>
  <text x="70" y="46" font-size="8" fill="#6b7280">热运动</text>
  <line x1="130" y1="66" x2="210" y2="66" stroke="#7c3aed" stroke-width="2.2"/>
  <polygon points="224,66 210,60 210,72" fill="#7c3aed"/>
  <text x="170" y="54" font-size="8" fill="#7c3aed">定向移动 v</text>
  <text x="120" y="120" text-anchor="middle" font-size="8.5" fill="#6b7280">方向杂乱不算电流</text>
</svg>
</div>
<div class="qac">
<p class="q">电源的作用是创造电荷吗？</p>
<p class="a"><b>不是。电源把其他形式的能转化为电能，靠非静电力搬运电荷、维持电压。</b>电荷总量守恒，电源只搬不造。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="电源搬运电荷并维持电压">
  <rect x="46" y="40" width="50" height="60" rx="6" fill="#fdf3e0" stroke="#b8791f"/>
  <text x="71" y="62" text-anchor="middle" font-size="9" fill="#8a5c14">电源</text>
  <text x="71" y="84" text-anchor="middle" font-size="12" fill="#b8791f">＋ −</text>
  <line x1="96" y1="56" x2="150" y2="56" stroke="#7c3aed" stroke-width="2"/>
  <polygon points="164,56 150,50 150,62" fill="#7c3aed"/>
  <circle cx="186" cy="56" r="12" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
  <text x="186" y="60" text-anchor="middle" font-size="9" fill="#7c3aed">灯</text>
  <text x="120" y="116" text-anchor="middle" font-size="8.5" fill="#6b7280">化学能 → 电能</text>
</svg>
</div>
<div class="qac">
<p class="q">“恒定电流”的“恒定”指什么？</p>
<p class="a"><b>大小和方向都不随时间变化。</b>不是电荷不动，而是每秒钟通过横截面的电荷量相同。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="恒定电流的大小和方向不随时间变化">
  <line x1="36" y1="100" x2="210" y2="100" stroke="#5a6472" stroke-width="1.4"/>
  <line x1="36" y1="100" x2="36" y2="30" stroke="#5a6472" stroke-width="1.4"/>
  <line x1="36" y1="60" x2="200" y2="60" stroke="#7c3aed" stroke-width="2.4"/>
  <text x="214" y="64" font-size="8" fill="#6b7280">I</text>
  <text x="200" y="116" text-anchor="end" font-size="8" fill="#6b7280">t</text>
  <text x="120" y="44" text-anchor="middle" font-size="8.5" fill="#6b7280">I 不变</text>
</svg>
</div>
</div>
<p class="gx-note">六问归成一条：<b>方向按正电荷规定，v 指定向移动，q 只算通过横截面的那部分</b>。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>六条易错，逐条改</h2>

<div class="er">
<p class="er-x">✗ 电流的传导速度等于光速，所以电子跑得跟光一样快。</p>
<p class="er-v">✓ 电场建立的速度接近光速，电子定向移动速率只有 10⁻⁵–10⁻³ m/s 量级。</p>
<p class="er-w">开灯瞬间亮，是电场几乎同时建立、各处电子同时开始移动，不是电子从开关跑到灯。</p>
</div>
<div class="er">
<p class="er-x">✗ 电子定向移动速率很大，所以电流很大。</p>
<p class="er-v">✓ I=nqvS：v 很小，但 n 极大（铜约 8.5×10²⁸ m⁻³），仍可有 1 A 以上。</p>
<p class="er-w">只盯 v 会漏掉 n；数量级是 n 补回来的，不是 v 大。</p>
</div>
<div class="er">
<p class="er-x">✗ 电流有方向，所以电流是矢量，合成要用平行四边形。</p>
<p class="er-v">✓ 电流是标量，方向只表示正电荷的流向；干路电流等于各支路电流之和。</p>
<p class="er-w">矢量要求合成遵守平行四边形，电流不满足；方向在这里只是“正负号”的约定。</p>
</div>
<div class="er">
<p class="er-x">✗ I=q/t，所以 q 越大 I 一定越大。</p>
<p class="er-v">✓ I 由 q 与 t 的比值决定；q 大但 t 更长时，I 可能更小。</p>
<p class="er-w">I 与 q 不成正比，比的是“单位时间通过多少”。</p>
</div>
<div class="er">
<p class="er-x">✗ 电源的作用是创造电荷，所以电路里电荷越用越多。</p>
<p class="er-v">✓ 电源把其他形式的能转化为电能，靠非静电力搬运电荷、维持电压。</p>
<p class="er-w">电荷守恒：电源不造电荷，只把电荷从负极搬到正极。</p>
</div>
<div class="er">
<p class="er-x">✗ 外电路中电流从负极流向正极。</p>
<p class="er-v">✓ 外电路从正极经用电器流向负极；电源内部才从负极到正极。</p>
<p class="er-w">把“内电路”和“外电路”的方向记反，是画电路图时最常见的错。</p>
</div>

<p class="gx-note">把“I 是标量、方向按正电荷、v 是定向速率”这三句背成一组，本节的选择题基本不会错。</p>
</section>

<script>
document.addEventListener("DOMContentLoaded", function () {
  var $ = GX.$;
  var N = 8.5e28, S = 1e-6, Q = 1.6e-19;
  var K = N * Q * S;
  var V = 1e-4;
  var SUP = { "-": "⁻", "0": "⁰", "1": "¹", "2": "²", "3": "³", "4": "⁴", "5": "⁵", "6": "⁶", "7": "⁷", "8": "⁸", "9": "⁹" };
  function sup(n) { return String(n).replace(/[-0-9]/g, function (c) { return SUP[c]; }); }
  function expo(x, d) {
    var p = x.toExponential(d).split("e");
    return p[0] + "×10" + sup(parseInt(p[1], 10));
  }
  function fmtI(I) { return (I < 10 ? I.toFixed(2) : I.toFixed(1)) + " A"; }

  function render(v) {
    if (!(v > 0) || !isFinite(v)) v = 1e-4;
    var I = K * v;
    var r = Math.max(0, Math.min(1, (v - 1e-5) / 9.9e-4));
    var ms = Math.log(v / 1e-5) / Math.LN10;
    var off = (performance.now() / 1000 * (16 + 20 * ms)) % 22;
    var dots = "";
    for (var i = 0; i < 12; i++) {
      var x = 40 + (((i * 22 - off) % 264) + 264) % 264;
      var y = 74 + (i % 3) * 22;
      dots += '<circle cx="' + x.toFixed(1) + '" cy="' + y + '" r="4.5" fill="#2f6fd0"/>';
    }
    $("gxEls").innerHTML = dots;
    var dx = 388 + 146 * r, dy = 240 - 176 * r;
    $("gxDot").setAttribute("cx", dx.toFixed(1));
    $("gxDot").setAttribute("cy", dy.toFixed(1));
    $("gxGx").setAttribute("x1", dx.toFixed(1));
    $("gxGx").setAttribute("x2", dx.toFixed(1));
    $("gxGy").setAttribute("y1", dy.toFixed(1));
    $("gxGy").setAttribute("y2", dy.toFixed(1));
    $("gxDotTxt").setAttribute("x", Math.min(dx + 8, 500).toFixed(1));
    $("gxDotTxt").setAttribute("y", Math.max(dy - 8, 62).toFixed(1));
    $("gxDotTxt").textContent = fmtI(I);
    $("gxVv").textContent = expo(v, 2) + " m/s";
    $("gxVI").textContent = fmtI(I);
    $("gxVs").textContent = I < 0.5 ? "偏小" : (I < 5 ? "常见" : "较大");
    $("gxVsNote").textContent = "1 s 通过 " + (I < 10 ? I.toFixed(2) : I.toFixed(1)) + " C 电荷";
    $("gxTake").textContent = "v = " + expo(v, 2) + " m/s 时 I = " + fmtI(I) +
      "；v 扩大 100 倍，I 也扩大 100 倍——n、q、S 不变时 I 与 v 成正比。";
    $("gxStateNote").textContent = "状态：" + (I < 0.5 ? "v 很小，I 不到 0.5 A" : (I < 5 ? "常见导线电流量级" : "v 接近上限，I 超过 5 A")) +
      "；n 极大，弥补了 v 很小。";
  }

  function setMode(m) {
    var b = $("gxAp"), t = $("gxApTxt");
    if (!b) return;
    b.classList.toggle("is-auto", m === "auto");
    b.classList.toggle("is-manual", m !== "auto");
    if (t) t.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  var stage = $("gxStage"), follow = $("gxSl");
  render(V);
  var ap = AutoPilot.create({
    mount: stage,
    follow: follow,
    /* keys: v = 1e-5, 1e-4, 5e-4, 1e-3 m/s（滑块单位 1e-5） */
    loop: [{ t: 0, v: 10 }, { t: 2.5, v: 10 }, { t: 5, v: 50 }, { t: 6.5, v: 50 },
           { t: 9, v: 100 }, { t: 10.5, v: 100 }, { t: 12, v: 1 }, { t: 12.5, v: 1 }, { t: 14, v: 10 }],
    keys: [1, 10, 50, 100],
    value: 10, min: 1, max: 100, step: 0.5,
    idle: 5000,
    onChange: function (u) { V = u * 1e-5; render(V); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { current: function (v) { return K * v; } };
  follow.addEventListener("input", function () {
    V = parseFloat(follow.value) * 1e-5;
    render(V);
  });
});
</script>
