<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">三句话：定律说了什么、惯性是什么、惯性大小由谁决定。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 牛顿第一定律<span class="q-src">人教版必修第一册 · 第四章第 1 节</span></p>
<p class="q-b">一切物体总保持匀速直线运动状态或静止状态，除非作用在它上面的力迫使它改变这种状态。</p>
<p class="q-n">→ 这句话里有两个「状态」：<b>静止</b>和<b>匀速直线运动</b>，物理上把它们合称「运动状态不变」。
所以定律真正说的是：<b>不受力（或合力为零）时，物体自己不会改变速度</b>；要改，必须有力。
注意「迫使」两个字——力是改变运动状态的原因，不是维持运动的原因。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 惯性<span class="q-src">人教版必修第一册 · 第四章第 1 节</span></p>
<p class="q-b">物体保持原来匀速直线运动状态或静止状态的性质，叫作惯性。</p>
<p class="q-n">→ 惯性是<b>性质</b>，不是力。它不需要「产生」，也不会「消失」，只要物体有质量，它就一直在。
牛顿第一定律因此又叫<b>惯性定律</b>：它描述的正是这种性质在不受力时的表现。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 惯性与质量<span class="q-src">人教版必修第一册 · 第四章第 1 节</span></p>
<p class="q-b">质量是物体惯性大小的唯一量度，质量越大，惯性越大。</p>
<p class="q-n">→ 「唯一量度」四个字是考点：速度大、位置高、受力大，都<b>不</b>影响惯性。
一辆 15 t 的卡车和一辆 1.5 t 的轿车都以 60 km/h 行驶，<b>若刹车时能提供的制动力一样大</b>，卡车停得更慢；
反过来，要让卡车产生和轿车相同的加速度，就得给它更大的力。这「两头都费劲」，就是惯性大。</p>
</div>

<p class="gx-note">这一节还有一句容易被跳过的前提：牛顿第一定律只在<b>惯性参考系</b>中成立。
以地面（或相对地面匀速直线运动的车厢）为参考系时，不受力的物体才「保持原状态」；
在以加速度运动的电梯里，你会看到小球自己加速、自己改变运动状态，那不是定律失效，是你选错了参考系。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己写一遍答案，再点「下一步」。这题的分数全在「谁受力、谁不受力」分得清不清。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 用惯性解释现象<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">公交车在平直公路上以 15 m/s 匀速行驶，司机突然发现前方有情况，紧急刹车。
车内站着的一位乘客身体明显向前倾。（1）请用惯性解释这一现象；（2）若乘客系着安全带，安全带的受力情况如何变化，
它起什么作用？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 锁定研究对象和研究过程</p>
<p class="s-b">研究对象是<b>乘客</b>，研究过程是「刹车前匀速」到「刹车后减速」这一小段时间。
刹车前，乘客与车<b>速度相同</b>，都是 15 m/s，这是后面一切判断的起点。</p>
<p class="s-k">用到：牛顿第一定律的前提是「原来的运动状态」，先把它写清楚。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 把人体分成「脚」和「上身」两段看</p>
<p class="s-b">刹车时，地板对鞋底产生<b>向后的摩擦力</b>，脚随车厢一起减速；而乘客的上身几乎不受水平方向的力，
它<b>由于惯性要保持原来 15 m/s 的运动状态</b>。一个减速、一个不减速，身体就以脚为支点向前倾。</p>
<p class="s-k">用到：惯性是物体保持原来运动状态的性质；它表现为「哪部分不受力，哪部分就不改状态」。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 把「相对运动」说清楚，避免说成受力</p>
<p class="s-b">正确说法：<b>以车厢为参考系，乘客上身相对车厢向前运动</b>，所以人看起来前倾。
不能说「乘客受到一个向前的惯性力」——惯性是性质，不是力，它没有施力物体，也不能写进受力分析。</p>
<p class="s-k">用到：惯性不是力；受力分析里不能出现「惯性力」这个条目。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 说明安全带改变了什么</p>
<p class="s-b">系上安全带后，安全带对乘客的<b>上身</b>施加一个向后的力，使上身也随车及时减速，
于是上身与车厢之间的<b>相对位移变小</b>，人不会撞到前方座椅或挡风玻璃。
注意：安全带<b>不能「消除惯性」</b>，它只是提供力，让速度及时改变。</p>
<p class="s-k">用到：力是改变运动状态的原因——要让人也减速，就得有向后的力。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口：把答案写成能得分的三条</p>
<p class="s-b">分点写：① 刹车前人与车同速；② 刹车时脚受向后摩擦力随车减速，上身因惯性保持原速度，相对车厢向前运动，故前倾；
③ 安全带对上身施加向后的力，使其及时减速，减小相对位移。三句话都要出现「惯性」「原来的运动状态」「相对车厢」。</p>
<p class="s-k">用到：解释惯性现象的四句套路：原状态 → 哪部分状态变了 → 哪部分没变 → 相对运动方向。</p>
</li>
</ol>
<div class="exbar">
  <button id="gxNext" type="button">下一步</button>
  <span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）刹车前，乘客与车以相同的速度 15 m/s 运动。刹车时，车厢减速，乘客的脚受到地板向后的摩擦力，
随车厢一起减速；而乘客的上身几乎不受水平方向的力，<b>由于惯性要保持原来的运动状态</b>，仍以接近原来的速度前进，
因此身体以脚为支点<b>向前倾</b>。<br>
（2）系上安全带后，安全带对乘客上身产生<b>向后的力</b>，使上身也随车及时减速，
<b>减小上身相对车厢的位移</b>，避免乘客撞向前方。安全带不能消除惯性，它只是提供了改变运动状态所需的力。</p>
</div>
<p class="gx-note">阅卷高频扣分点：写成「乘客受到惯性力的作用」「惯性使他向前冲」都不给分。
惯性只能作原因、不能作力；判断方向时要落到「<b>相对车厢</b>」上。</p>
</div>
</section>

<p class="gx-h2s">六种问法，全在考同一件事：你能不能把「力」和「惯性」分开。</p>

<div class="gx-qa">
<div class="qac">
<p class="q">物体运动一定需要力来维持吗？</p>
<p class="a"><b>不需要。</b>冰壶脱手后仍在冰面滑行，此时水平方向只有阻力，没有向前的推力。</p>

</div>
<div class="qac">
<p class="q">惯性是一种力吗？</p>
<p class="a"><b>不是。</b>惯性是物体保持原来运动状态的性质，没有施力物体、没有方向，不能写进受力分析。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="惯性是性质，力是物体间的相互作用，两者不同">

  <text x="177" y="62" text-anchor="middle" font-size="9" fill="#6b7280">物体间的相互作用</text>

</div>
<div class="qac">
<p class="q">速度越大，惯性越大吗？</p>
<p class="a"><b>不是。</b>惯性大小只由质量决定。同一辆车快开慢开，惯性一样大。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="同一物体速度不同，惯性相同">

</svg>
</div>
<div class="qac">
<p class="q">牛顿第一定律能直接用实验验证吗？</p>
<p class="a"><b>不能直接验证。</b>「完全不受力」做不到。它是在斜面实验基础上<b>外推</b>得到的，再由大量事实检验。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="伽利略斜面理想实验：阻力越来越小，外推到没有阻力">

<div class="qac">
<p class="q">静止的物体有惯性吗？</p>
<p class="a"><b>有。</b>「保持静止」本身就是惯性在起作用；要推动它，同样得克服惯性。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是考场高频错句，右边是能得分的表述。这一节丢分，几乎全在「惯性」和「力」混着说。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 力是维持物体运动的原因，没有力物体就会停下来。</p>
<p class="er-v">✓ 力是改变物体运动状态的原因；不受力时物体保持静止或匀速直线运动。</p>
<p class="er-w">「推着才走」是摩擦力造成的错觉。把阻力减小，同一个物体滑得越来越远。</p>
</div>
<div class="er">
<p class="er-x">✗ 物体不受力时一定处于静止状态。</p>
<p class="er-v">✓ 不受力时保持静止<b>或</b>匀速直线运动状态，两种都算运动状态不变。</p>
<p class="er-w">漏掉「匀速直线运动」，等于把牛顿第一定律砍掉一半。</p>
</div>
<div class="er">
<p class="er-x">✗ 刹车时乘客受到一个向前的惯性力，所以向前倾。</p>
<p class="er-v">✓ 乘客上身由于惯性保持原来的速度，相对车厢向前运动，所以前倾。</p>
<p class="er-w">惯性是性质不是力，没有施力物体；受力分析里写「惯性力」直接判错。</p>
</div>
<div class="er">
<p class="er-x">✗ 速度越大惯性越大，所以高速的车更难刹。</p>
<p class="er-v">✓ 惯性大小只由质量决定；高速的车难刹，是因为要改变的速度变化量更大。</p>
<p class="er-w">同一辆车快开慢开，质量没变，惯性就没变。</p>
</div>
<div class="er">
<p class="er-x">✗ 牛顿第一定律可以用实验直接验证。</p>
<p class="er-v">✓ 它是在理想实验基础上推理得出、并由大量事实检验的规律。</p>
<p class="er-w">「完全不受力」在现实中无法实现，所以只能靠外推，不能靠一次实验。</p>
</div>
<div class="er">
<p class="er-x">✗ 静止的物体没有惯性，运动起来才有惯性。</p>
<p class="er-v">✓ 任何物体在任何状态下都有惯性，惯性是物体的固有性质。</p>
<p class="er-w">「保持静止」正是惯性在起作用；把惯性当成「运动的属性」是把性质和状态混了。</p>
</div>
</div>
</section>

  var stage = $("gxStage");
  var MU = 0.5, V0 = 5, G = 10;
  var X0 = 40, X1 = 336, SPAN = 26;

  function pxOf(x) {
    return X0 + Math.min(x, SPAN) / SPAN * (X1 - X0);
  }
  function fmtX(x) {
    if (!isFinite(x)) return "∞（不停）";
    return (x < 10 ? x.toFixed(1) : x.toFixed(0)) + " m";
  }
  function fmtMu(m) {
    return (Math.round(m * 100) / 100).toFixed(2);
  }

  function calc(mu) {
    var a = mu * G;
    var stopped = mu >= 0.005;
    var x = stopped ? V0 * V0 / (2 * a) : Infinity;
    var st, col, bg, sn;
    if (!stopped) {
      st = "永远匀速运动"; col = "#2f6fd0"; bg = "#eef5fc";
      sn = "μ = 0：a = 0，按牛顿第一定律一直滑下去";
    } else if (mu >= 0.35) {
      st = "很快停下"; col = "#2f8a5b"; bg = "#e6f6ee";
      sn = "μ = " + fmtMu(mu) + "：a = " + a.toFixed(1) + " m/s²，" + fmtX(x) + " 后停止";
    } else if (mu >= 0.15) {
      st = "滑一段才停"; col = "#b8791f"; bg = "#fdf3e0";
      sn = "μ = " + fmtMu(mu) + "：a = " + a.toFixed(2) + " m/s²，" + fmtX(x) + " 后停止";
    } else {
      st = "几乎停不下来"; col = "#b8402f"; bg = "#fbeae7";
      sn = "μ = " + fmtMu(mu) + "：a = " + a.toFixed(2) + " m/s²，要滑 " + fmtX(x);
    }
    return { a: a, x: x, stopped: stopped, st: st, col: col, bg: bg, sn: sn };
  }

  function render() {
    var s = calc(MU);
    var cx = pxOf(s.x);
    $("gxStone").setAttribute("cx", cx);
    $("gxTrail").setAttribute("width", Math.max(0, cx - X0));
    $("gxStop").setAttribute("x1", cx);
    $("gxStop").setAttribute("x2", cx);
    $("gxStop").style.opacity = s.stopped ? "1" : "0";
    $("gxStopLab").setAttribute("x", cx < 90 ? cx + 6 : (cx > 286 ? cx - 6 : cx));
    $("gxStopLab").setAttribute("text-anchor", cx < 90 ? "start" : (cx > 286 ? "end" : "middle"));
    $("gxStopLab").textContent = s.stopped ? "x = " + fmtX(s.x) : "x → ∞";
    $("gxGo").style.opacity = s.stopped ? "0" : "1";
    $("gxAa").textContent = "a = " + s.a.toFixed(2) + " m/s²";
    $("gxFml").textContent = s.stopped
      ? "x = v₀²/(2μg) = 25/(20×" + fmtMu(MU) + ") = " + fmtX(s.x)
      : "μ = 0 → a = 0 → 永远不会停下来";

    $("gxVa").textContent = fmtMu(MU);
    $("gxVb").textContent = fmtX(s.x);
    $("gxVs").textContent = s.st;
    $("gxVsn").textContent = s.sn;
    $("gxStBox").style.background = s.bg;
    $("gxStBox").style.borderColor = s.col + "44";
    $("gxVs").style.color = s.col;
  }

  var ap = null, dragging = false, moved = false, downX = 0, suppressTap = false;

  function xToMu(clientX) {
    var r = stage.getBoundingClientRect();
    var f = (clientX - r.left) / r.width;
    return Math.max(0, Math.min(0.5, Math.round(f * 50) / 100));
  }

  stage.addEventListener("pointerdown", function (ev) {
    dragging = true; moved = false; downX = ev.clientX;
    if (ap) ap.take();
    MU = xToMu(ev.clientX);
    if (ap) ap.setValue(MU, false);
    render();
    try { stage.setPointerCapture(ev.pointerId); } catch (e) {}
  });
  stage.addEventListener("pointermove", function (ev) {
    if (!dragging) return;
    if (Math.abs(ev.clientX - downX) > 4) moved = true;
    MU = xToMu(ev.clientX);
    if (ap) ap.setValue(MU, false);
    render();
  });
  stage.addEventListener("pointerup", function () {
    if (moved) suppressTap = true;
    dragging = false;
  });
  stage.addEventListener("click", function (ev) {
    if (!suppressTap) return;
    suppressTap = false;
    ev.stopImmediatePropagation();
  });

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  render();
  ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 0.5 }, { t: 1.6, v: 0.3 }, { t: 3.4, v: 0.3 }, { t: 5.2, v: 0.15 },
           { t: 6.6, v: 0.15 }, { t: 8.2, v: 0.05 }, { t: 9.4, v: 0 }, { t: 12.4, v: 0 },
           { t: 13.6, v: 0.5 }],
    keys: [0.5, 0.3, 0.15, 0.05, 0],
    value: MU, min: 0, max: 0.5, step: 0.01,
    idle: 5000,
    onChange: function (v) { MU = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc };
  window.__probe = function () {
    return {
      mu: $("gxVa").textContent,
      x: $("gxVb").textContent,
      st: $("gxVs").textContent,
      cnt: $("gxCnt").textContent
    };
  };
});
</script>
</body>
</html>
