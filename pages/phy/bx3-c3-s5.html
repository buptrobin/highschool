<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本原话，拆成三句</h2>
<div class="q-src">人教版必修第三册 · 第十一章第5节</div>

<div class="q">
<p class="q-t">“多用电表可以用来测量电压、电流和电阻；使用前应观察指针是否指在零刻度，必要时进行机械调零。”</p>
<p class="q-b">上面是电压、电流刻度，下面是欧姆刻度。机械调零是<b>表笔断开时</b>把指针调到左端“0”，和测电阻时的欧姆调零不是一回事。</p>
</div>

<div class="q">
<p class="q-t">“测电阻时，应选择欧姆挡，先将红、黑表笔短接，进行欧姆调零，再测量电阻；换挡后要重新调零。”</p>
<p class="q-b">欧姆挡内部自带电源，短接时回路只剩 R内，指针满偏、指在右端 0 Ω。换倍率，R内 变了，满偏电流也变了，必须重新短接调零。</p>
</div>

<div class="q">
<p class="q-t">“测电阻时，待测电阻必须与电源断开；读数时指针指在刻度盘中央附近最准确。”</p>
<p class="q-b">带电测量相当于把外部电源并进欧姆表，读数不对还可能烧表头。指针太靠两端，同样的电流误差对应的电阻误差很大。</p>
</div>

<p class="gx-note">三句话对应三个动作：机械调零看左端 0，欧姆调零看右端 0，测量之前先断电。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己算，再点“下一步”。关键只有一条：欧姆挡的电流由闭合电路欧姆定律决定。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 欧姆挡的电流与刻度<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">某欧姆表内部电源电动势 E = 1.5 V，R内 = 15 kΩ。求：
（1）红黑表笔短接（Rx = 0）时通过表头的电流；
（2）接 Rx = 15 kΩ 时通过表头的电流；
（3）接 Rx = 30 kΩ 时通过表头的电流；
（4）说明欧姆刻度是否均匀。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 画出等效电路，写对公式</p>
<p class="s-b">电池、调零电阻、表头串成一条支路，总内阻记作 R内；待测电阻 Rx 串在外面。由闭合电路欧姆定律：<b>I = E/(R内 + Rx)</b>，三个问都套这一个式子。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 短接，求满偏电流</p>
<p class="s-b">Rx = 0：<b>I = 1.5/(15×10³) = 1.0×10⁻⁴ A = 100 μA</b>。这是满偏电流，指针指在右端 0 Ω。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 接 15 kΩ，电流减半</p>
<p class="s-b">Rx = 15 kΩ：<b>I = 1.5/(30×10³) = 50 μA</b>，正好是满偏的一半，指针在中央。<b>这个 15 kΩ 叫中值电阻，等于 R内。</b></p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 接 30 kΩ，再往下掉</p>
<p class="s-b">Rx = 30 kΩ：<b>I = 1.5/(45×10³) ≈ 33.3 μA</b>，约为满偏的三分之一，指针偏左。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 回答“刻度为什么不均匀”</p>
<p class="s-b">Rx 从 0 增到 15 kΩ，I 从 100 μA 降到 50 μA；再从 15 kΩ 增到 30 kΩ，I 只从 50 μA 降到 33.3 μA。同样的电阻增量，电流变化不一样，所以欧姆刻度不均匀：<b>右端稀、左端密</b>。I 与 Rx 不是线性关系。</p>
</li>
</ol>
<div class="exbar">
  <button id="gxNext" type="button">下一步</button>
  <span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）Rx = 0：<b>I = E/R内 = 1.5/(15×10³) = 100 μA</b>（满偏）。<br>
（2）Rx = 15 kΩ：<b>I = 1.5/(30×10³) = 50 μA</b>（半偏，指针中央）。<br>
（3）Rx = 30 kΩ：<b>I = 1.5/(45×10³) ≈ 33.3 μA</b>。<br>
（4）I 与 Rx 不成正比，<b>欧姆刻度不均匀</b>，右端稀、左端密。</p>
</div>
<p class="gx-note">阅卷高频扣分：漏掉 R内 只算 Rx；把 15 kΩ 当成电源内阻；说“刻度均匀”；忘写单位 μA。</p>
</div>
</section>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>考你会怎么考</h2>
<p class="gx-h2s">六种问法，全绕不开“调零”和“刻度”。</p>

<div class="gx-qa">
<div class="qac">
<p class="q">欧姆挡的红、黑表笔各接内部电源哪一极？</p>
<p class="a"><b>黑表笔接内部正极，红表笔接负极。</b>测电阻时电流从黑笔流出，经待测电阻流回红笔；测电压时红笔才接高电位。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="黑表笔接内部电池正极"><rect x="30" y="30" width="76" height="30" rx="5" fill="#f5f3ff" stroke="#d8ccfb"/><text x="68" y="50" text-anchor="middle" font-size="9" fill="#6d28d9">内部电池</text><line x1="106" y1="45" x2="180" y2="45" stroke="#3a3a35" stroke-width="2"/><line x1="145" y1="45" x2="145" y2="92" stroke="#3a3a35" stroke-width="2"/><text x="188" y="42" font-size="9" fill="#3a3a35">黑笔</text><text x="188" y="98" font-size="9" fill="#c0392b">红笔</text><text x="120" y="122" text-anchor="middle" font-size="8.5" fill="#6b7280">黑笔接内部正极</text></svg>
</div>
<div class="qac">
<p class="q">欧姆调零到底调什么？</p>
<p class="a"><b>短接红黑表笔，调节调零电阻，使指针指到右端 0 Ω（满偏）。</b>调的是内部电阻，不是表盘上的机械螺丝。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="短接表笔调零使指针满偏"><path d="M45 100 A75 75 0 0 1 195 100" fill="none" stroke="#cfd4da" stroke-width="6"/><line x1="120" y1="100" x2="188" y2="66" stroke="#c0392b" stroke-width="2"/><circle cx="120" cy="100" r="4" fill="#c0392b"/><text x="196" y="62" font-size="9" fill="#c0392b">0 Ω</text><text x="120" y="122" text-anchor="middle" font-size="8.5" fill="#6b7280">短接表笔，指针满偏</text></svg>
</div>
<div class="qac">
<p class="q">换挡后为什么必须重新调零？</p>
<p class="a"><b>不同倍率的 R内 不同，满偏电流也不同。</b>不重新调零，指针起点就偏了，读数会整体偏移。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="不同倍率内阻不同，必须重新调零"><rect x="24" y="34" width="86" height="40" rx="6" fill="#f5f3ff" stroke="#d8ccfb"/><text x="67" y="52" text-anchor="middle" font-size="9" fill="#6d28d9">×1 挡</text><text x="67" y="67" text-anchor="middle" font-size="8" fill="#6b7280">R内 = 15 kΩ</text><rect x="130" y="34" width="86" height="40" rx="6" fill="#fdf3e0" stroke="#f3cdc6"/><text x="173" y="52" text-anchor="middle" font-size="9" fill="#8a5c14">×10 挡</text><text x="173" y="67" text-anchor="middle" font-size="8" fill="#8a5c14">R内 = 150 kΩ</text><text x="120" y="104" text-anchor="middle" font-size="8.5" fill="#6b7280">换挡 → R内 变 → 重新调零</text></svg>
</div>
<div class="qac">
<p class="q">为什么指针要落在中央附近？</p>
<p class="a"><b>欧姆刻度不均匀，两端太密，同样的指针偏差对应很大的电阻误差。</b>中央附近刻度疏、相对误差小。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="欧姆刻度两端密中央疏"><path d="M40 96 A80 80 0 0 1 200 96" fill="none" stroke="#cfd4da" stroke-width="8"/><line x1="120" y1="16" x2="120" y2="28" stroke="#7c3aed" stroke-width="2"/><polygon points="120,38 114,26 126,26" fill="#7c3aed"/><text x="120" y="54" text-anchor="middle" font-size="9" fill="#6d28d9">中央附近</text><text x="120" y="118" text-anchor="middle" font-size="8.5" fill="#6b7280">两端密、中央疏</text></svg>
</div>
<div class="qac">
<p class="q">为什么不能带电测电阻？</p>
<p class="a"><b>外部电源会与表内电源一起作用，读数错误，还可能烧坏表头。</b>测量前必须把待测电阻与电源断开。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="测电阻前必须断开电源"><rect x="58" y="56" width="64" height="22" rx="4" fill="#fff" stroke="#b8791f" stroke-width="2"/><text x="90" y="92" text-anchor="middle" font-size="8.5" fill="#8a5c14">待测电阻</text><line x1="132" y1="67" x2="176" y2="67" stroke="#3a3a35" stroke-width="2"/><line x1="176" y1="55" x2="176" y2="79" stroke="#3a3a35" stroke-width="3"/><line x1="184" y1="61" x2="184" y2="73" stroke="#3a3a35" stroke-width="2"/><line x1="34" y1="28" x2="206" y2="116" stroke="#c0392b" stroke-width="3"/><text x="120" y="122" text-anchor="middle" font-size="8.5" fill="#c0392b">先断开电源</text></svg>
</div>
<div class="qac">
<p class="q">中值电阻和欧姆表内阻是什么关系？</p>
<p class="a"><b>中值电阻等于欧姆表内阻 R内。</b>指针半偏时 I = E/(2R内)，说明外接电阻正好等于 R内，表盘中央标的阻值就是 R内。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="半偏时外接电阻等于内阻"><path d="M40 96 A80 80 0 0 1 200 96" fill="none" stroke="#cfd4da" stroke-width="6"/><line x1="120" y1="96" x2="120" y2="32" stroke="#c0392b" stroke-width="2"/><circle cx="120" cy="96" r="4" fill="#c0392b"/><text x="120" y="24" text-anchor="middle" font-size="9" fill="#c0392b">半偏</text><text x="120" y="116" text-anchor="middle" font-size="8.5" fill="#6b7280">Rx = R内 = 15 kΩ</text></svg>
</div>
</div>
<p class="gx-note">六问归成一条：<b>欧姆挡自带电源，黑笔接正；短接调零看右端，换挡重调；中央读数最准。</b></p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>六条易错，逐条改</h2>

<div class="er">
<p class="er-x">✗ 测电阻时不用断开电源，表笔一碰就行。</p>
<p class="er-v">✓ 必须先断开电源，再接待测电阻。</p>
<p class="er-w">带电测量相当于把外部电源并进欧姆表，读数错，还可能损坏表头。</p>
</div>
<div class="er">
<p class="er-x">✗ 欧姆挡不用调零，直接测就行。</p>
<p class="er-v">✓ 选好挡后先短接表笔做欧姆调零。</p>
<p class="er-w">电池用久了 E 和内阻会变，不调零零点就偏，读数整体不准。</p>
</div>
<div class="er">
<p class="er-x">✗ 换挡后不用重新调零，刚才已经调过了。</p>
<p class="er-v">✓ 只要换挡，就必须重新短接调零。</p>
<p class="er-w">每个倍率的 R内 不同，满偏电流不同，零点的位置也跟着变。</p>
</div>
<div class="er">
<p class="er-x">✗ 欧姆挡的红表笔接内部电池正极。</p>
<p class="er-v">✓ 黑表笔接内部正极，红表笔接负极。</p>
<p class="er-w">测电阻时电流从黑笔流出；测电压时红笔才接高电位，两种挡位别混。</p>
</div>
<div class="er">
<p class="er-x">✗ 欧姆刻度是均匀的，可以按长度比例读。</p>
<p class="er-v">✓ 欧姆刻度不均匀，右端稀、左端密。</p>
<p class="er-w">I 与 Rx 是反比关系，不是线性；只有电压、电流刻度才均匀。</p>
</div>
<div class="er">
<p class="er-x">✗ 测电压时也可以用欧姆挡，反正都是表。</p>
<p class="er-v">✓ 测电压用电压挡，测电流用电流挡。</p>
<p class="er-w">欧姆挡内部有电源，接到带电电路上会读错，甚至损坏表头。</p>
</div>

<p class="gx-note">把“黑笔接正、短接调零、换挡重调、中央最准”背成一句，实验题的基础分就稳了。</p>
</section>

<script>
document.addEventListener("DOMContentLoaded", function () {
  var $ = GX.$;
  var E = 1.5, RIN = 15, CX = 180, CY = 205, NEEDLE = 112;
  var RX = 0;
  var stage = $("gxStage");

  function calc(rx) {
    var i = E * 1000 / (RIN + rx);
    return { i: i, ang: 180 - i * 1.8 };
  }
  function stateOf(rx) {
    if (rx < 8) return "偏角大";
    if (rx < 24) return "中央附近";
    return "偏角小";
  }
  function render() {
    var s = calc(RX);
    if (!isFinite(s.i)) return;
    var rad = s.ang * Math.PI / 180;
    $("gxNeedle").setAttribute("x2", (CX + NEEDLE * Math.cos(rad)).toFixed(1));
    $("gxNeedle").setAttribute("y2", (CY - NEEDLE * Math.sin(rad)).toFixed(1));
    $("gxNeedleLab").textContent = "I = " + s.i.toFixed(1) + " μA";
    $("gxRxLab").textContent = "Rx = " + RX + " kΩ";
    $("gxVx").textContent = RX + " kΩ";
    $("gxVi").textContent = s.i.toFixed(1) + " μA";
    $("gxVs").textContent = stateOf(RX);
    $("gxTake").textContent = "Rx = " + RX + " kΩ 时 I = " + s.i.toFixed(1) + " μA，" + stateOf(RX) + "；Rx 越大电流越小，指针越靠左。";
    $("gxStateNote").textContent = "状态：Rx = " + RX + " kΩ，" + stateOf(RX) + "；I = " + s.i.toFixed(1) + " μA。";
  }
  function setMode(m) {
    var b = $("gxAp"), t = $("gxApTxt");
    if (!b) return;
    b.classList.toggle("is-auto", m === "auto");
    b.classList.toggle("is-manual", m !== "auto");
    if (t) t.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  render();
  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 0 }, { t: 1.6, v: 0 }, { t: 3.4, v: 5 }, { t: 5.4, v: 5 },
           { t: 7.4, v: 15 }, { t: 9.9, v: 15 }, { t: 12.4, v: 30 },
           { t: 14.6, v: 30 }, { t: 16, v: 0 }],
    keys: [0, 5, 15, 30],
    value: RX, min: 0, max: 30, step: 1,
    idle: 5000,
    onChange: function (v) { RX = Math.round(v); render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc, stateOf: stateOf };
});
</script>
