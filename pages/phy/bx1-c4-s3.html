<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">三句话：定律的正身、它的式子、以及「F 到底指谁」。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 牛顿第二定律<span class="q-src">人教版必修第一册 · 第四章第 3 节</span></p>
<p class="q-b">物体加速度的大小跟它受到的作用力成正比，跟它的质量成反比，加速度的方向跟作用力的方向相同。</p>
<p class="q-n">→ 一句话拆三层：<b>大小</b>由 F 与 m 的比值决定，<b>方向</b>跟力走，<b>同时性</b>是力变 a 就变。
写成式子就是 <b>F合 = ma</b>。这里的「作用力」在中文表述里容易读漏，它的准确含义是<b>合力</b>。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 表达式与单位<span class="q-src">人教版必修第一册 · 第四章第 3 节</span></p>
<p class="q-b">牛顿第二定律的表达式可以写成 F = ma。式中 F 的单位是牛顿（N），m 的单位是千克（kg），a 的单位是米每二次方秒（m/s²）。</p>
<p class="q-n">→ 三个单位不是随便配的：<b>1 N = 1 kg·m/s²</b>。也就是说，让 1 kg 的物体产生 1 m/s² 的加速度，
所需的合力正好是 1 N。单位对不上，答案一定错。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 矢量性与瞬时性<span class="q-src">人教版必修第一册 · 第四章第 3 节</span></p>
<p class="q-b">加速度的方向与合力的方向相同；合力恒定，加速度就恒定；合力改变，加速度同时改变。</p>
<p class="q-n">→ 两个「同时」是考点：<b>力一出现，a 立刻有；力一撤，a 立刻没</b>。
但速度不会跟着立刻没——a 管的是「速度怎么变」，不是「速度是多少」。这就是刹车后车还会往前滑的原因。</p>
</div>

<p class="gx-note">把三句话合成一条判断顺序：<b>先受力分析求合力 → 再 F合 = ma 求 a → 最后用运动学公式求 v、x</b>。
凡是跳过第一步直接套 F = ma 的，十有八九把某个力当成了合力。</p>
</section>

<p class="gx-take">F 在 0～4 N 之间来回拖动，合力一直是 0、a 一直是 0——<b>推力再大，只要没超过摩擦力，箱子就不加速</b>。
一过 4 N，F 箭头开始比 f 箭头长，多出来的那一段才开始产生加速度。</p>
<p class="gx-note">模型口径：m = 2 kg，滑动摩擦力 f = 4 N 固定（此处把最大静摩擦按同一数值 4 N 处理，是简化模型，
真实情况最大静摩擦略大于滑动摩擦）。F ∈ [0, 20] N：F ≤ 4 N 时 a = 0；F &gt; 4 N 时 a = (F − 4)/2，
a ∈ [0, 8] m/s²。图中的箭头长度按 F、f、a 各自的比例缩放，只表示大小关系，不是同一标尺。</p>
</figure>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先写受力分析，再点「下一步」。这题的分数在「合力」两个字上。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 水平面上的动力学<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">一个质量 m = 2.0 kg 的箱子放在水平地面上，箱子与地面间的滑动摩擦力为 4.0 N。
用 F = 10 N 的水平力向右推箱子，g 取 10 m/s²。<br>
（1）求箱子所受的合力与加速度；（2）若推力减为 4.0 N，箱子还加速吗？（3）若推力仍为 10 N，
但地面变粗糙、摩擦力变为 6.0 N，加速度变成多少？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 受力分析，分清方向</p>
<p class="s-b">箱子受四个力：重力 G = mg = 20 N（竖直向下）、支持力 N（竖直向上）、推力 F = 10 N（水平向右）、
摩擦力 f = 4.0 N（水平向左，因为箱子相对地面向右滑）。竖直方向 G 与 N 平衡，所以 N = 20 N。</p>
<p class="s-k">用到：受力分析的顺序——重力、接触力（支持力、摩擦力）、已知外力。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 只算水平方向的合力</p>
<p class="s-b">竖直方向平衡，合力为零，不影响水平运动。水平方向两力反向：
<b>F合 = F − f = 10 − 4.0 = 6.0 N</b>，方向<b>向右</b>（与推力同向，因为推力更大）。</p>
<p class="s-k">用到：合力是矢量和；同一直线上反向的两个力，合力大小是两者之差，方向跟大的那个走。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 由 F合 = ma 求加速度</p>
<p class="s-b">a = F合 / m = 6.0 / 2.0 = <b>3.0 m/s²</b>，方向与合力相同，<b>向右</b>。
单位检查：N ÷ kg = (kg·m/s²) ÷ kg = m/s²，对得上。</p>
<p class="s-k">用到：F合 = ma；a 的方向由合力方向决定，不由速度方向决定。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 把推力减到 4.0 N：合力为零</p>
<p class="s-b">此时 F合 = 4.0 − 4.0 = 0，所以 <b>a = 0</b>。注意：a = 0 只表示速度不再变化，
箱子会<b>以原来的速度做匀速直线运动</b>，并不是「立刻停下来」；要让它停下，得有与运动反向的合力（比如撤掉推力后只剩摩擦力）。</p>
<p class="s-k">用到：合力为零 ↔ 加速度为零 ↔ 速度不变（静止或匀速直线运动）。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 摩擦变大到 6.0 N：a 由合力决定</p>
<p class="s-b">推力还是 10 N，f 变成 6.0 N，F合 = 10 − 6.0 = 4.0 N，a = 4.0/2.0 = <b>2.0 m/s²</b>。
推力没变，加速度却变了——因为<b>决定 a 的是合力，不是某一个力</b>。这一步就是本题的立意。</p>
<p class="s-k">用到：a 与合力一一对应；同一个推力在不同地面上产生的 a 可以不同。</p>
</li>
</ol>
<div class="exbar">
  <button id="gxNext" type="button">下一步</button>
  <span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）竖直方向 G = mg = 20 N 与支持力 N 平衡，N = 20 N；水平方向推力 10 N 向右、摩擦力 4.0 N 向左，
合力 F合 = 10 − 4.0 = <b>6.0 N，方向向右</b>；由 F合 = ma 得 a = 6.0/2.0 = <b>3.0 m/s²，方向向右</b>。<br>
（2）F = 4.0 N 时 F合 = 4.0 − 4.0 = <b>0</b>，故 <b>a = 0</b>，箱子不再加速，
将以原速度做匀速直线运动（若原本静止则保持静止）。<br>
（3）f = 6.0 N 时 F合 = 10 − 6.0 = 4.0 N，a = 4.0/2.0 = <b>2.0 m/s²</b>，方向向右。</p>
</div>
<p class="gx-note">阅卷高频扣分：把 10 N 直接代进 F = ma 得 5 m/s²；写「推力大于摩擦力所以加速」却不给合力的数值；
第（2）问写成「箱子立刻停下」。</p>
</div>
</section>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>考你会怎么考</h2>
<p class="gx-h2s">六种问法，核心只有一句：F 指合力，a 跟合力同向、同时。</p>

<div class="gx-qa">
<div class="qac">
<p class="q">F = ma 中的 F 是哪个力？</p>
<p class="a"><b>是合力。</b>不是推力、不是重力、也不是最大的那个力；要先把所有力合成再代入。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="两个力先合成合力，再用合力求加速度">
  <rect x="86" y="46" width="52" height="34" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
  <line x1="140" y1="58" x2="196" y2="58" stroke="#b8402f" stroke-width="2.4"/>
  <polygon points="206,58 194,53 194,63" fill="#b8402f"/>
  <line x1="84" y1="70" x2="46" y2="70" stroke="#2f6fd0" stroke-width="2.4"/>
  <polygon points="36,70 48,65 48,75" fill="#2f6fd0"/>
  <text x="120" y="104" text-anchor="middle" font-size="10" fill="#1e6640">F合 才是公式里的 F</text>
  <text x="120" y="122" text-anchor="middle" font-size="9.5" fill="#6b7280">先合成，再代入</text>
</svg>
</div>
<div class="qac">
<p class="q">a 的方向一定与 v 的方向相同吗？</p>
<p class="a"><b>不一定。</b>a 只跟合力同向。刹车时 a 与 v 反向，速度才减小。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="刹车时加速度与速度反向">
  <line x1="40" y1="56" x2="200" y2="56" stroke="#7c3aed" stroke-width="2.6"/>
  <polygon points="212,56 198,50 198,62" fill="#7c3aed"/>
  <text x="120" y="44" text-anchor="middle" font-size="10" fill="#6d28d9">v</text>
  <line x1="200" y1="88" x2="60" y2="88" stroke="#b8402f" stroke-width="2.6"/>
  <polygon points="48,88 62,82 62,94" fill="#b8402f"/>
  <text x="120" y="110" text-anchor="middle" font-size="10" fill="#b8402f">a（反向 → 减速）</text>
</svg>
</div>
<div class="qac">
<p class="q">力一撤掉，加速度立刻消失吗？速度呢？</p>
<p class="a"><b>加速度立刻变 0，速度不会。</b>a 是「速度的变化率」，力撤了只是不再变，不是归零。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="撤去推力后加速度为零但速度不为零">
  <line x1="24" y1="92" x2="216" y2="92" stroke="#cfd4da" stroke-width="1.4"/>
  <rect x="96" y="58" width="46" height="34" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
  <line x1="146" y1="70" x2="196" y2="70" stroke="#7c3aed" stroke-width="2.2" stroke-dasharray="5 4"/>
  <polygon points="206,70 194,65 194,75" fill="#7c3aed"/>
  <text x="120" y="40" text-anchor="middle" font-size="10" fill="#6b7280">F 已撤去</text>
  <text x="120" y="118" text-anchor="middle" font-size="10" fill="#1e6640">a = 0，v ≠ 0</text>
</svg>
</div>
<div class="qac">
<p class="q">质量变大，加速度怎么变？</p>
<p class="a"><b>同样合力下 a 变小。</b>a = F/m，m 越大 a 越小——这正是惯性大的表现。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="同样合力下质量越大加速度越小">
  <rect x="26" y="44" width="34" height="26" rx="3" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/>
  <line x1="62" y1="57" x2="96" y2="57" stroke="#2f8a5b" stroke-width="2"/>
  <polygon points="106,57 94,52 94,62" fill="#2f8a5b"/>
  <text x="120" y="61" font-size="9.5" fill="#6b7280">a 大</text>
  <rect x="26" y="84" width="72" height="26" rx="3" fill="#fdf3e0" stroke="#b8791f" stroke-width="1.4"/>
  <line x1="100" y1="97" x2="126" y2="97" stroke="#2f8a5b" stroke-width="2"/>
  <polygon points="136,97 124,92 124,102" fill="#2f8a5b"/>
  <text x="150" y="101" font-size="9.5" fill="#6b7280">a 小</text>
  <text x="120" y="124" text-anchor="middle" font-size="9.5" fill="#8a5c14">同样的力，质量大的那个 a 小</text>
</svg>
</div>
<div class="qac">
<p class="q">合力为零，加速度一定为零吗？</p>
<p class="a"><b>一定。</b>F合 = 0 则 a = 0；但速度不一定为零，物体可能在做匀速直线运动。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="合力为零时加速度为零，速度可以不为零">
  <rect x="70" y="46" width="60" height="34" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
  <line x1="132" y1="58" x2="176" y2="58" stroke="#b8402f" stroke-width="2.4"/>
  <polygon points="186,58 174,53 174,63" fill="#b8402f"/>
  <line x1="68" y1="70" x2="24" y2="70" stroke="#2f6fd0" stroke-width="2.4"/>
  <polygon points="14,70 26,65 26,75" fill="#2f6fd0"/>
  <text x="120" y="104" text-anchor="middle" font-size="10" fill="#1e6640">两个力大小相等、方向相反</text>
  <text x="120" y="122" text-anchor="middle" font-size="9.5" fill="#6b7280">F合 = 0 → a = 0，v 可以不变且不为 0</text>
</svg>
</div>
<div class="qac">
<p class="q">牛顿（N）是怎么定义出来的？</p>
<p class="a"><b>1 N = 1 kg·m/s²。</b>使 1 kg 的物体产生 1 m/s² 加速度的力，就是 1 N。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="1牛等于1千克米每二次方秒">
  <rect x="24" y="30" width="192" height="40" rx="8" fill="#f5f3ff" stroke="#d8ccfb"/>
  <text x="120" y="56" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">1 N = 1 kg·m/s²</text>
  <text x="120" y="94" text-anchor="middle" font-size="10" fill="#6b7280">1 kg 产生 1 m/s² 的力，叫 1 N</text>
  <text x="120" y="116" text-anchor="middle" font-size="9.5" fill="#8a5c14">单位换了，数值就跟着变</text>
</svg>
</div>
</div>
<p class="gx-note">六问其实在反复确认同一件事：<b>a 是「合力」的影子</b>——合力有它就有，合力没有它就没有；
方向跟着合力，大小等于 F合/m。抓住这一句，六问都能现场推出来。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是考场上真写过的错句，右边是能得分的表述。这一节错得最多的，是「F 是谁」。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 用 10 N 的推力推箱子，所以 a = F/m = 10/2 = 5 m/s²。</p>
<p class="er-v">✓ 先用合力：F合 = F − f = 10 − 4 = 6 N，再 a = F合/m = 3 m/s²。</p>
<p class="er-w">F = ma 里的 F 是合力；把某个力当合力，等于假装摩擦力不存在。</p>
</div>
<div class="er">
<p class="er-x">✗ 加速度的方向与速度方向相同。</p>
<p class="er-v">✓ 加速度的方向与<b>合力</b>方向相同；与速度同向只发生在加速时。</p>
<p class="er-w">刹车时 a 与 v 反向；把「a 跟合力」记成「a 跟 v」，减速题会全错。</p>
</div>
<div class="er">
<p class="er-x">✗ 推力撤掉后，箱子还会滑一段，说明它还在受向前的力。</p>
<p class="er-v">✓ 撤力后合力只有摩擦力（向后），a 与运动反向，物体做减速运动。</p>
<p class="er-w">「还在动」不等于「还在受力」；惯性让它继续动，力让它减速。</p>
</div>
<div class="er">
<p class="er-x">✗ 合力为零时，物体一定静止。</p>
<p class="er-v">✓ 合力为零时 a = 0，物体静止<b>或</b>做匀速直线运动。</p>
<p class="er-w">匀速直线运动的速度不变，同样是「合力为零」的状态。</p>
</div>
<div class="er">
<p class="er-x">✗ 质量越大，物体受到的力越大，所以 a 越大。</p>
<p class="er-v">✓ 在合力相同的条件下，a = F合/m，质量越大 a 越小。</p>
<p class="er-w">m 在分母上；把「质量大惯性大」误读成「质量大力大」，方向就反了。</p>
</div>
<div class="er">
<p class="er-x">✗ 斜面问题直接写 mg = ma，把重力当合力。</p>
<p class="er-v">✓ 沿斜面写 mg sinθ − f = ma，垂直斜面写 N = mg cosθ。</p>
<p class="er-w">重力不在沿斜面方向上，必须分解后才进方程；垂直方向的力不进沿斜面方程。</p>
</div>
</div>
</section>

<p class="gx-note" style="border-top:1px solid var(--line);padding-top:14px">下一节：<b>力学单位制</b>。
F = ma 里的 N 是从 kg、m、s 推出来的——单位不统一，公式算出来的数就没有意义。</p>

<script>
document.addEventListener("DOMContentLoaded", function () {
  var $ = GX.$;
  var stage = $("gxStage");
  var FV = 10, M = 2, FMAX = 4;
  var FSCALE = 130 / 20;   // 1 N -> 6.5 px（推力箭头）
  var ASCALE = 150 / 8;    // 1 m/s² -> 18.75 px（加速度箭头）

  function calc(F) {
    var f = Math.min(F, FMAX);
    var net = Math.max(0, F - FMAX);
    var a = net / M;
    var st, col, bg, sn;
    if (F < 3.9) {
      st = "F合 = 0"; col = "#2f6fd0"; bg = "#eef5fc";
      sn = "推力 " + F.toFixed(1) + " N 被静摩擦抵消，箱子不动";
    } else if (F <= 4.1) {
      st = "临界：F合 = 0"; col = "#b8791f"; bg = "#fdf3e0";
      sn = "推力恰好等于最大静摩擦，箱子刚要动";
    } else {
      st = "F合 = " + net.toFixed(1) + " N"; col = "#2f8a5b"; bg = "#e6f6ee";
      sn = F.toFixed(1) + " − " + f.toFixed(1) + " = " + net.toFixed(1) + " N，向右";
    }
    return { f: f, net: net, a: a, st: st, col: col, bg: bg, sn: sn };
  }

  function arrow(lineId, headId, x1, y1, x2, y2, visible) {
    var ln = $(lineId), hd = $(headId);
    ln.setAttribute("x1", x1);
    ln.setAttribute("y1", y1);
    ln.setAttribute("x2", visible ? x2 : x1);
    ln.setAttribute("y2", visible ? y2 : y1);
    ln.style.opacity = visible ? "1" : "0";
    if (!visible) {
      hd.setAttribute("points", x1 + "," + y1 + " " + x1 + "," + y1 + " " + x1 + "," + y1);
      hd.style.opacity = "0";
      return;
    }
    var dx = x2 - x1, dy = y2 - y1, L = Math.sqrt(dx * dx + dy * dy) || 1;
    var ux = dx / L, uy = dy / L;
    var bx = x2 - ux * 11, by = y2 - uy * 11;
    hd.setAttribute("points",
      x2 + "," + y2 + " " + (bx - uy * 5.5) + "," + (by + ux * 5.5) + " " +
      (bx + uy * 5.5) + "," + (by - ux * 5.5));
    hd.style.opacity = "1";
  }

  function render() {
    var s = calc(FV);
    var fLen = s.f * FSCALE;
    var aLen = s.a * ASCALE;

    arrow("gxF", "gxFh", 152, 150, 152 + Math.max(FV * FSCALE, 0.01), 150, FV > 0.2);
    arrow("gxFr", "gxFrh", 80, 176, 80 - fLen, 176, s.f > 0.2);
    arrow("gxA", "gxAh", 90, 96, 90 + aLen, 96, s.a > 0.05);

    $("gxFLab").textContent = "F = " + FV.toFixed(1) + " N";

    $("gxFLab").style.opacity = FV > 0.2 ? "1" : "0";
    $("gxFrLab").textContent = "f = " + s.f.toFixed(1) + " N";
    $("gxALab").textContent = "a = " + s.a.toFixed(1) + " m/s²";
    $("gxALab").setAttribute("x", 90 + aLen + 6);
    $("gxALab").style.opacity = s.a > 0.05 ? "1" : "0";

    $("gxInfo").textContent = FV <= FMAX
      ? "推力 " + FV.toFixed(1) + " N ≤ 最大静摩擦 4.0 N"
      : "F合 = " + FV.toFixed(1) + " − 4.0 = " + s.net.toFixed(1) + " N";
    $("gxInfo2").textContent = s.a > 0
      ? "a = F合/m = " + s.net.toFixed(1) + "/2 = " + s.a.toFixed(1) + " m/s²"
      : "合力为 0 → a = 0（推不动）";

    $("gxVa").textContent = FV.toFixed(1) + " N";
    $("gxVb").textContent = s.a.toFixed(1) + " m/s²";
    $("gxVs").textContent = s.st;
    $("gxVsn").textContent = s.sn;
    $("gxStBox").style.background = s.bg;
    $("gxStBox").style.borderColor = s.col + "44";
    $("gxVs").style.color = s.col;
  }

  var ap = null, dragging = false, moved = false, downX = 0, suppressTap = false;

  function xToF(clientX) {
    var r = stage.getBoundingClientRect();
    var f = (clientX - r.left) / r.width;
    return Math.max(0, Math.min(20, Math.round(f * 40) / 2));
  }

  stage.addEventListener("pointerdown", function (ev) {
    dragging = true; moved = false; downX = ev.clientX;
    if (ap) ap.take();
    FV = xToF(ev.clientX);
    if (ap) ap.setValue(FV, false);
    render();
    try { stage.setPointerCapture(ev.pointerId); } catch (e) {}
  });
  stage.addEventListener("pointermove", function (ev) {
    if (!dragging) return;
    if (Math.abs(ev.clientX - downX) > 4) moved = true;
    FV = xToF(ev.clientX);
    if (ap) ap.setValue(FV, false);
    render();
  });
  stage.addEventListener("pointerup", function () {
    if (moved) suppressTap = true;
    dragging = false;
  });
  stage.addEventListener("click", function (ev) {
    if (!suppressTap) return;
    suppressTap = false;
    ev.stopImmediatePropagation();
  });

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  render();
  ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 0 }, { t: 1.4, v: 4 }, { t: 3.6, v: 4 }, { t: 5.2, v: 10 },
           { t: 7.4, v: 10 }, { t: 8.8, v: 16 }, { t: 10.2, v: 20 }, { t: 11.6, v: 20 },
           { t: 13.4, v: 0 }],
    keys: [0, 4, 10, 16, 20],
    value: FV, min: 0, max: 20, step: 0.5,
    idle: 5000,
    onChange: function (v) { FV = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc };
  window.__probe = function () {
    return {
      F: $("gxVa").textContent,
      a: $("gxVb").textContent,
      net: $("gxVs").textContent,
      cnt: $("gxCnt").textContent
    };
  };
});
</script>
</body>
</html>
