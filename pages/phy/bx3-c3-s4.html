<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本原话，拆成三句</h2>
<div class="q-src">人教版必修第三册 · 第十一章第4节</div>

<div class="q">
<p class="q-t">“串联电路：电流处处相等，总电压等于各部分电压之和，总电阻等于各电阻之和。”</p>
<p class="q-b">只有一条路径，电荷没有别的去处，所以电流不增不减；每过一个电阻电势降落一次，总降落等于各段之和；电阻像串起来的关卡，长度直接相加。</p>
</div>

<div class="q">
<p class="q-t">“并联电路：各支路电压相等，总电流等于各支路电流之和，总电阻的倒数等于各电阻倒数之和。”</p>
<p class="q-b">所有支路的两端都接在同一对节点上，电压就是同一段电势差；电流在节点处分流、在另一端汇合；并联相当于把导体加粗，总电阻比任何一条支路都小。</p>
</div>

<div class="q">
<p class="q-t">“串联分压、并联分流；两个电阻并联 R = R1R2/(R1+R2)。”</p>
<p class="q-b">串联时电压按电阻正比分，电阻大的分得多；并联时电流按电阻反比分，电阻小的分得多。两个电阻并联用“积除以和”速算，结果一定小于较小的那个电阻。</p>
</div>

<p class="gx-note">读法：先问“一条路还是两条路”，再决定用“电流相同”还是“电压相同”，最后才动公式。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己写，再点“下一步”。同一组电阻，串联算一遍，并联再算一遍。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 先串联后并联<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">R1 = 10 Ω、R2 = 20 Ω，接在 U = 6 V 的电源两端，不计电源内阻。求：
（1）串联时的总电阻 R总、电流 I、R2 两端电压 U2；
（2）改为并联，求总电阻 R总′、总电流 I′、通过 R2 的电流 I2。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 先认电路，再选公式</p>
<p class="s-b">串联只有一条路径，先写 R总 = R1 + R2，再用 I = U/R总；并联两条支路电压相同，先写 1/R总 = 1/R1 + 1/R2。两问的公式不要混用。</p>
<p class="s-k">用到：串联相加、并联倒数和。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 串联总电阻</p>
<p class="s-b">R总 = 10 Ω + 20 Ω = <b>30 Ω</b>。串联总电阻一定大于其中任何一个电阻，可作检查点。</p>
<p class="s-k">用到：R总 = R1 + R2。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 串联电流与分压</p>
<p class="s-b">I = U/R总 = 6/30 = <b>0.2 A</b>，串联电流处处相等。
U2 = IR2 = 0.2 × 20 = <b>4 V</b>，U1 = 0.2 × 10 = 2 V；校验 U1 + U2 = 6 V。</p>
<p class="s-k">用到：I = U/R；串联分压 U ∝ R。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 改成并联</p>
<p class="s-b">R总′ = R1R2/(R1+R2) = 10×20/30 ≈ <b>6.67 Ω</b>，比 10 Ω 还小。
I′ = 6/6.67 ≈ <b>0.9 A</b>；I2 = U/R2 = 6/20 = <b>0.3 A</b>，I1 = 0.6 A，0.6 + 0.3 = 0.9 A，校验通过。</p>
<p class="s-k">用到：并联电压相同；I = I1 + I2。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 写答案，点出两条规律</p>
<p class="s-b">串联：R总 = 30 Ω，I = 0.2 A，U2 = 4 V；并联：R总′ ≈ 6.67 Ω，I′ ≈ 0.9 A，I2 = 0.3 A。
同样两个电阻，串联 30 Ω、并联 6.67 Ω；串联电阻大的分压多，并联电阻小的分流多。</p>
<p class="s-k">用到：串联分压、并联分流。</p>
</li>
</ol>

<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）串联：<b>R总 = 30 Ω</b>，<b>I = U/R总 = 0.2 A</b>，<b>U2 = IR2 = 4 V</b>。<br>
（2）并联：<b>R总′ ≈ 6.67 Ω</b>，<b>I′ ≈ 0.9 A</b>，<b>I2 = U/R2 = 0.3 A</b>。</p>
</div>
<p class="gx-note">高频扣分：并联总电阻写成 30 Ω；串联电流各算各的；U2 直接用 6 V 乘；算完不校验 U1 + U2。</p>
</div>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>考你会怎么考</h2>
<p class="gx-h2s">六种问法，核心都是“先判串并联，再挑电流或电压相同”。</p>

<div class="gx-qa">
<div class="qac">
<p class="q">串联电路中，通过 R1 和 R2 的电流为什么一定相等？</p>
<p class="a"><b>串联只有一条路径，电荷没有别的去处。</b>单位时间内流过每个截面的电荷量相同，所以 I = I1 = I2，与电阻大小无关。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="串联电路只有一条路径，电流处处相等">
  <line x1="18" y1="66" x2="60" y2="66" stroke="#5a6472" stroke-width="1.6"/>
  <rect x="60" y="50" width="50" height="32" rx="3" fill="#f5f3ff" stroke="#7c3aed"/>
  <rect x="130" y="50" width="50" height="32" rx="3" fill="#f5f3ff" stroke="#7c3aed"/>
  <line x1="180" y1="66" x2="222" y2="66" stroke="#5a6472" stroke-width="1.6"/>
  <text x="85" y="70" text-anchor="middle" font-size="8.5" fill="#3a3a35">R1</text>
  <text x="155" y="70" text-anchor="middle" font-size="8.5" fill="#3a3a35">R2</text>
  <line x1="95" y1="30" x2="140" y2="30" stroke="#2f6fd0" stroke-width="1.6"/>
  <polygon points="148,30 136,25 136,35" fill="#2f6fd0"/>
  <text x="124" y="22" text-anchor="middle" font-size="8.5" fill="#2f6fd0">I</text>
  <text x="120" y="106" text-anchor="middle" font-size="9" fill="#8a5c14">I = I1 = I2</text>
  <text x="120" y="122" text-anchor="middle" font-size="8" fill="#6b7280">一条路径，电流不增不减</text>
</svg>
</div>
<div class="qac">
<p class="q">并联的两个电阻，两端电压为什么相等？</p>
<p class="a"><b>两支路的两端分别接在同一对节点上。</b>同一对节点之间的电势差是同一个值，所以 U1 = U2 = U，与电阻大小无关。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="并联两支路接在同一对节点上，电压相等">
  <line x1="20" y1="48" x2="210" y2="48" stroke="#5a6472" stroke-width="1.6"/>
  <line x1="20" y1="92" x2="210" y2="92" stroke="#5a6472" stroke-width="1.6"/>
  <line x1="20" y1="48" x2="20" y2="92" stroke="#5a6472" stroke-width="1.6"/>
  <line x1="210" y1="48" x2="210" y2="92" stroke="#5a6472" stroke-width="1.6"/>
  <rect x="70" y="36" width="50" height="24" rx="3" fill="#f5f3ff" stroke="#7c3aed"/>
  <rect x="70" y="80" width="50" height="24" rx="3" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="95" y="52" text-anchor="middle" font-size="8" fill="#3a3a35">R1</text>
  <text x="95" y="96" text-anchor="middle" font-size="8" fill="#3a3a35">R2</text>
  <line x1="40" y1="52" x2="40" y2="88" stroke="#8a5c14" stroke-width="1" stroke-dasharray="2 2"/>
  <polygon points="40,52 37,60 43,60" fill="#8a5c14"/>
  <polygon points="40,88 37,80 43,80" fill="#8a5c14"/>
  <text x="54" y="73" font-size="8" fill="#8a5c14">U</text>
  <text x="120" y="114" text-anchor="middle" font-size="9" fill="#8a5c14">U1 = U2 = U</text>
  <text x="120" y="126" text-anchor="middle" font-size="8" fill="#6b7280">同一对节点，同一段电势差</text>
</svg>
</div>
<div class="qac">
<p class="q">两个电阻并联，总电阻为什么比任一个都小？</p>
<p class="a"><b>并联相当于把导体加粗，横截面积变大，电阻变小。</b>由 1/R = 1/R1 + 1/R2 得 R = R1R2/(R1+R2)，结果小于较小的电阻。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="串联电阻相加，并联总电阻小于任一支路">
  <text x="120" y="18" text-anchor="middle" font-size="8.5" fill="#6b7280">串联相加，并联反而变小</text>
  <rect x="30" y="32" width="40" height="18" rx="3" fill="#f5f3ff" stroke="#7c3aed"/>
  <rect x="72" y="32" width="40" height="18" rx="3" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="51" y="45" text-anchor="middle" font-size="8" fill="#3a3a35">R1</text>
  <text x="92" y="45" text-anchor="middle" font-size="8" fill="#3a3a35">R2</text>
  <text x="122" y="45" font-size="9" fill="#6d28d9">R = R1 + R2</text>
  <rect x="30" y="76" width="40" height="16" rx="3" fill="#f5f3ff" stroke="#7c3aed"/>
  <rect x="30" y="96" width="40" height="16" rx="3" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="50" y="88" text-anchor="middle" font-size="7.5" fill="#3a3a35">R1</text>
  <text x="50" y="108" text-anchor="middle" font-size="7.5" fill="#3a3a35">R2</text>
  <text x="78" y="101" font-size="9" fill="#6d28d9">R &lt; R1</text>
  <text x="166" y="86" text-anchor="middle" font-size="8" fill="#6b7280">1/R = 1/R1 + 1/R2</text>
  <text x="166" y="104" text-anchor="middle" font-size="8" fill="#6b7280">R = R1R2/(R1+R2)</text>
</svg>
</div>
<div class="qac">
<p class="q">串联分压：电阻越大，分得的电压越多吗？</p>
<p class="a"><b>是。</b>串联电流相同，U = IR，电压与电阻成正比：U1 : U2 = R1 : R2，U1 = U·R1/(R1+R2)。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="串联分压，电阻越大分得电压越多">
  <rect x="30" y="46" width="55" height="26" fill="#fdf3e0" stroke="#b8791f"/>
  <rect x="85" y="46" width="125" height="26" fill="#e6e9ff" stroke="#7c3aed"/>
  <text x="57" y="63" text-anchor="middle" font-size="8.5" fill="#8a5c14">U1 小</text>
  <text x="147" y="63" text-anchor="middle" font-size="8.5" fill="#6d28d9">U2 大</text>
  <text x="120" y="38" text-anchor="middle" font-size="8" fill="#6b7280">U = U1 + U2</text>
  <text x="120" y="94" text-anchor="middle" font-size="9" fill="#8a5c14">U1 : U2 = R1 : R2</text>
  <text x="120" y="114" text-anchor="middle" font-size="8" fill="#6b7280">电阻大的分得多</text>
</svg>
</div>
<div class="qac">
<p class="q">并联分流：电阻越小，分得的电流越大吗？</p>
<p class="a"><b>是。</b>并联电压相同，I = U/R，电流与电阻成反比：I1 : I2 = R2 : R1，I1 = I·R2/(R1+R2)。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="并联分流，电阻越小分得电流越大">
  <line x1="30" y1="44" x2="180" y2="44" stroke="#2f6fd0" stroke-width="2"/>
  <polygon points="190,44 176,38 176,50" fill="#2f6fd0"/>
  <text x="105" y="34" text-anchor="middle" font-size="8.5" fill="#2f6fd0">I1 大（R1 小）</text>
  <line x1="30" y1="84" x2="100" y2="84" stroke="#7c3aed" stroke-width="2"/>
  <polygon points="110,84 96,78 96,90" fill="#7c3aed"/>
  <text x="80" y="108" text-anchor="middle" font-size="8.5" fill="#6d28d9">I2 小（R2 大）</text>
  <text x="120" y="126" text-anchor="middle" font-size="9" fill="#8a5c14">I1 : I2 = R2 : R1</text>
</svg>
</div>
<div class="qac">
<p class="q">电表改装：为什么电压表要串联大电阻、电流表要并联小电阻？</p>
<p class="a"><b>电压表要分压且几乎不分流，所以串联大电阻；电流表要分流且几乎不分压，所以并联小电阻。</b>量程扩大，表头满偏电流不变。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="电压表串联大电阻分压，电流表并联小电阻分流">
  <circle cx="44" cy="36" r="15" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="44" y="40" text-anchor="middle" font-size="9" fill="#6d28d9">V</text>
  <line x1="59" y1="36" x2="100" y2="36" stroke="#5a6472" stroke-width="1.3"/>
  <rect x="100" y="28" width="42" height="16" rx="2" fill="#fdf3e0" stroke="#b8791f"/>
  <line x1="142" y1="36" x2="190" y2="36" stroke="#5a6472" stroke-width="1.3"/>
  <text x="121" y="40" text-anchor="middle" font-size="7" fill="#8a5c14">大 R</text>
  <text x="120" y="66" text-anchor="middle" font-size="8" fill="#6b7280">电压表：串联大电阻分压</text>
  <circle cx="44" cy="100" r="15" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="44" y="104" text-anchor="middle" font-size="9" fill="#6d28d9">A</text>
  <line x1="59" y1="100" x2="190" y2="100" stroke="#5a6472" stroke-width="1.3"/>
  <rect x="90" y="106" width="42" height="10" rx="2" fill="#e6f6ee" stroke="#2f8a5b"/>
  <line x1="90" y1="100" x2="90" y2="106" stroke="#5a6472" stroke-width="1"/>
  <line x1="132" y1="100" x2="132" y2="106" stroke="#5a6472" stroke-width="1"/>
  <text x="120" y="128" text-anchor="middle" font-size="8" fill="#6b7280">电流表：并联小电阻分流</text>
</svg>
</div>
</div>
<p class="gx-note">六问归成一条：<b>先判串并联，再抓“电流相同”或“电压相同”，最后才代公式</b>。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>六条易错，逐条改</h2>

<div class="er">
<p class="er-x">✗ 串联电路中，各电阻两端的电压相等。</p>
<p class="er-v">✓ 串联电流相等，电压与电阻成正比。</p>
<p class="er-w">电流相同才有 U = IR ∝ R；电阻不同，分得的电压就不同。</p>
</div>
<div class="er">
<p class="er-x">✗ 并联电路中，各支路的电流相等。</p>
<p class="er-v">✓ 并联电压相等，电流与电阻成反比。</p>
<p class="er-w">电阻大的支路电流反而小，别按“一样粗”去想。</p>
</div>
<div class="er">
<p class="er-x">✗ 两个电阻并联，总电阻等于 R1 + R2。</p>
<p class="er-v">✓ 并联总电阻的倒数是各电阻倒数之和，结果小于任一支路。</p>
<p class="er-w">R1 + R2 是串联的算法；并联相当于加粗导体。</p>
</div>
<div class="er">
<p class="er-x">✗ 串联分压，电阻越大分得的电压越少。</p>
<p class="er-v">✓ 电阻越大分得越多：U1 : U2 = R1 : R2。</p>
<p class="er-w">串联电流相同，U = IR 与 R 成正比。</p>
</div>
<div class="er">
<p class="er-x">✗ 并联分流，电阻越大分得的电流越大。</p>
<p class="er-v">✓ 电阻越大分得越少：I1 : I2 = R2 : R1。</p>
<p class="er-w">并联电压相同，I = U/R 与 R 成反比，电流走电阻小的支路。</p>
</div>
<div class="er">
<p class="er-x">✗ 改装电压表要并联电阻，改装电流表要串联电阻。</p>
<p class="er-v">✓ 电压表串联大电阻分压，电流表并联小电阻分流。</p>
<p class="er-w">电压表并在被测元件两端，必须几乎不分流；电流表串在电路里，必须几乎不分压。</p>
</div>

<p class="gx-note">把六个“✗”读一遍，再合上书复述六个“✓”；串并联的错，八成都出在这六条。</p>
</section>

<script>
document.addEventListener("DOMContentLoaded", function () {
  var $ = GX.$;
  var R1 = 10, U = 6, R2 = 10;

  function calc(r2) {
    r2 = parseFloat(r2);
    if (!isFinite(r2)) r2 = 10;
    r2 = Math.max(2, Math.min(20, r2));
    var rt = R1 + r2;
    var i = U / rt;
    return { r2: r2, rt: rt, i: i, u1: i * R1, u2: i * r2 };
  }
  function f1(x) { return x.toFixed(1); }
  function f2(x) { return x.toFixed(2); }

  function render() {
    var s = calc(R2), rr = Math.round(s.r2 * 10) / 10, rt = Math.round(s.rt * 10) / 10;
    $("gxR2").textContent = rr.toFixed(1) + " Ω";
    $("gxRt").textContent = rt.toFixed(1) + " Ω";
    $("gxU2").textContent = f1(s.u2) + " V";
    $("gxR2box").textContent = "R2 = " + rr.toFixed(1) + " Ω";
    $("gxI").textContent = "I = " + f2(s.i) + " A";
    $("gxU1v").textContent = "U1 = " + f1(s.u1) + " V";
    $("gxU2v").textContent = "U2 = " + f1(s.u2) + " V";
    $("gxTake").textContent = "R2 = " + rr.toFixed(1) + " Ω 时，R总 = " + rt.toFixed(1) + " Ω、I = " +
      f2(s.i) + " A、U2 = " + f1(s.u2) + " V；R2 增大，I 减小，U2 反而增大——串联分压。";
    $("gxStateNote").textContent = "状态：R2 增大 → U2 增大，U1 减小，U1 + U2 恒为 6 V。";
  }

  function setMode(m) {
    var b = $("gxAp"), t = $("gxApTxt");
    if (!b) return;
    b.classList.toggle("is-auto", m === "auto");
    b.classList.toggle("is-manual", m !== "auto");
    if (t) t.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  render();
  var ap = AutoPilot.create({
    mount: $("gxStage"),
    follow: $("gxSl"),
    loop: [{ t: 0, v: 2 }, { t: 1.2, v: 2 }, { t: 1.8, v: 5 }, { t: 3.6, v: 5 },
           { t: 4.2, v: 10 }, { t: 6.7, v: 10 }, { t: 7.3, v: 20 }, { t: 9.1, v: 20 },
           { t: 9.7, v: 2 }],
    keys: [2, 5, 10, 20],
    value: R2, min: 2, max: 20, step: 0.5,
    idle: 5000,
    onChange: function (v) { R2 = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc };
});
</script>
