<p class="gx-lede">汽车过拱形桥，速度越快，桥面对它的支持力越小；到 v = √(gr) 时支持力为 0，车就要离开桥面。

三件事共用一条方程：<b>沿半径方向的合力 = mv²/r</b>，要判断的只有「圆心在车的哪一侧」。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">三句话：拱形桥、凹形桥、火车转弯，都是在说「沿半径方向的合力提供向心力」。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 汽车过拱形桥<span class="q-src">人教版必修第二册 · 第六章第 4 节</span></p>
<p class="q-b">汽车通过拱形桥的最高点时，汽车所受的重力 mg 与桥面对汽车的支持力 N 的合力提供向心力，方向竖直向下；
由 mg − N = mv²/r 可知 N = mg − mv²/r，所以 N &lt; mg。</p>
<p class="q-n">→ 合力向下的原因：最高点的圆心在汽车<b>下方</b>。N 变小不等于重力变小，重力始终是 mg；
桥面受到的压力与 N 等大，也跟着变小，所以车「变轻」了。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 汽车过凹形桥<span class="q-src">人教版必修第二册 · 第六章第 4 节</span></p>
<p class="q-b">汽车通过凹形桥的最低点时，所受重力与支持力的合力提供向心力，方向竖直向上；
由 N − mg = mv²/r 可知 N = mg + mv²/r，所以 N &gt; mg。</p>
<p class="q-n">→ 最低点的圆心在汽车<b>上方</b>，合力必须向上，所以 N 必须大于 mg。
拱桥减、凹桥加，差别只在圆心在哪一侧，不是两个互不相干的公式。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 火车转弯<span class="q-src">人教版必修第二册 · 第六章第 4 节</span></p>
<p class="q-b">火车转弯时，如果内、外轨一样高，所需的向心力由外轨对轮缘的挤压提供，轮缘与钢轨都会严重磨损；
实际弯道处外轨略高于内轨，使重力与支持力的合力提供向心力，轮缘便不再挤压钢轨。</p>
<p class="q-n">→ 外轨抬高后，支持力 N 垂直于轨面、向内倾斜，N 与 mg 的合力水平指向圆心。
设计速度满足 <b>tanθ = v²/(gr)</b>；速度偏离设计值时，轮缘才重新挤压钢轨——那是补救，不是原理。</p>
</div>

<p class="gx-note">三处场景是一条方程：<b>沿半径方向的合力 = mv²/r</b>。拱桥最高点 mg − N = mv²/r；
凹桥最低点 N − mg = mv²/r；火车转弯 mg tanθ = mv²/r。
航天器里的失重也是这条方程：重力全部用来提供向心力，航天员对座椅没有压力，N = 0（详见下一章）。</p>
</section>

</svg>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己写，再点「下一步」。这题的关键是「先找圆心，再定合力方向」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 汽车过拱形桥<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">质量 m = 1000 kg 的汽车以速度 v 通过半径 r = 50 m 的拱形桥，g 取 10 m/s²。求：
（1）v = 10 m/s 时桥面对汽车的支持力；（2）v = 20 m/s 时的支持力；
（3）汽车脱离桥面的临界速度。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 找圆心，写径向方程</p>
<p class="s-b">汽车在最高点，圆心在它<b>下方</b>，所以合力必须向下。取竖直向下为正，沿半径方向只有两个力：
重力 mg（向下）、支持力 N（向上），合力为 mg − N，它提供向心力：<b>mg − N = mv²/r</b>，
移项得 <b>N = m(g − v²/r)</b>。后面两问都只往这个式子里代 v。</p>
<p class="s-k">用到：向心力的方向由圆心决定；最高点圆心在下方 ⇒ 合力向下 ⇒ mg − N。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 代入 v = 10 m/s</p>
<p class="s-b">v²/r = 100/50 = 2 m/s²，N = 1000 × (10 − 2) = <b>8000 N</b>。
8000 N &lt; 10000 N，支持力比重力小 2000 N，这就是拱桥上「变轻」的来源；
少的这 2000 N 正是 mv²/r = 1000 × 2。</p>
<p class="s-k">用到：N = m(g − v²/r)；N 与 mg 比大小判断「增重 / 减重」。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 代入 v = 20 m/s</p>
<p class="s-b">v²/r = 400/50 = 8 m/s²，N = 1000 × (10 − 8) = <b>2000 N</b>。
速度只翻了一倍，v² 却变成 4 倍，N 从 8000 N 掉到 2000 N——<b>N 随 v² 变，不是随 v 线性变</b>。
再过一点，N 就要归零了。</p>
<p class="s-k">用到：v 加倍 ⇒ 向心加速度变 4 倍；N 与 v² 是一次函数关系。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 令 N = 0，求临界速度</p>
<p class="s-b">令 N = 0：mg = mv²/r，得 v = <b>√(gr)</b> = √(10 × 50) = √500 ≈ <b>22.4 m/s</b>（22.36）。
此时车与桥面之间刚好没有压力。v 再大，桥面给不了足够的向心力，汽车会脱离桥面；
把 v 代回 N = m(g − v²/r) 会算出负值，但支持力不能为负，<b>物理上取 N = 0</b>。</p>
<p class="s-k">用到：N = 0 的临界条件；负的支持力没有物理意义，只能说明「已脱离」。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 反过来问：要 N 不小于 5000 N，车速上限多少？</p>
<p class="s-b">由 N = m(g − v²/r) 解出 v² = r(g − N/m) = 50 × (10 − 5) = 250，v ≈ <b>15.8 m/s</b>。
也就是说，要保证桥面受到的压力不小于 5000 N，过桥速度不能超过约 15.8 m/s。
这类「给 N 反求 v」的题，考的还是同一个式子，只是把未知量换了个位置。</p>
<p class="s-k">用到：同一方程反解；先算 N/m 再减，别把 N 直接代进 v²/r。</p>
</li>
</ol>
<div class="exbar">
  <button id="gxNext" type="button">下一步</button>
  <span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">汽车在拱形桥最高点，圆心在车下方，取竖直向下为正，沿半径方向的合力提供向心力：<br>
mg − N = mv²/r，故 N = m(g − v²/r) = 1000(10 − v²/50)。<br>
（1）v = 10 m/s：N = 1000 × (10 − 2) = <b>8000 N</b>，小于 mg，汽车处于失重状态。<br>
（2）v = 20 m/s：N = 1000 × (10 − 8) = <b>2000 N</b>。<br>
（3）令 N = 0：mg = mv²/r，v = √(gr) = √(10 × 50) = √500 ≈ <b>22.4 m/s</b>；速度再大，汽车将脱离桥面。<br>
追问：N = 5000 N 时，v = √(r(g − N/m)) = √(50 × 5) ≈ <b>15.8 m/s</b>。</p>
</div>
<p class="gx-note">阅卷高频扣分：把拱桥最高点的合力画成向上（圆心找错）；把 N = 0 说成「重力消失」；
临界速度写成 √(g/r)（单位都不对）；v 超过临界后仍代公式，答出「负的支持力」。</p>
</div>
</section>

钢轨与轮缘磨损加剧，速度过大还有脱轨风险。低于设计速度时，反过来挤内轨。</p>

  <path d="M 80 120 A 40 40 0 0 1 160 120" fill="none" stroke="#aeb6c2" stroke-width="4"/>
  <path d="M 62 120 A 58 58 0 0 1 178 120" fill="none" stroke="#aeb6c2" stroke-width="4"/>
  <rect x="106" y="64" width="28" height="13" rx="2" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
  <line x1="120" y1="78" x2="120" y2="64" stroke="#b8402f" stroke-width="2"/>
  <polygon points="120,58 116,68 124,68" fill="#b8402f"/>
  <line x1="110" y1="62" x2="130" y2="62" stroke="#b8402f" stroke-width="3"/>
  <text x="170" y="60" text-anchor="end" font-size="8" fill="#6b7280">外轨</text>
  <text x="170" y="88" text-anchor="end" font-size="8" fill="#6b7280">内轨</text>
  <text x="120" y="126" text-anchor="middle" font-size="9.5" fill="#b8402f">轮缘挤外轨 → 磨损、脱轨风险</text>
</svg>
</div>
<div class="qac">
<p class="q">航天器里的航天员为什么失重？</p>
<p class="a"><b>重力全用来提供向心力了。</b>航天器绕地球做圆周运动，万有引力（重力）恰好等于 mv²/r，
航天员与座椅之间没有挤压，N = 0——不是那里没有重力。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="航天器绕地球运动，重力全部提供向心力，航天员对座椅没有压力">
  <circle cx="62" cy="96" r="21" fill="#eef5fc" stroke="#2f6fd0" stroke-width="1.4"/>
  <text x="62" y="100" text-anchor="middle" font-size="8.5" fill="#2f6fd0">地球</text>
  <ellipse cx="150" cy="58" rx="62" ry="20" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="5 4"/>
  <rect x="204" y="50" width="18" height="12" rx="2" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
  <line x1="204" y1="56" x2="86" y2="86" stroke="#b8402f" stroke-width="1.6" stroke-dasharray="4 3"/>
  <polygon points="84,87 96,80 95,90" fill="#b8402f"/>
  <text x="98" y="108" font-size="8.5" fill="#b8402f">F引提供向心力</text>
  <text x="120" y="126" text-anchor="middle" font-size="9.5" fill="#3a3a35">N = 0，航天员「飘」在舱内</text>
</svg>
</div>
</div>
<p class="gx-note">六问归成一句：<b>先找圆心，再定沿半径方向的合力</b>。圆心在车下方 → mg − N；
圆心在车上方 → N − mg；圆心在水平方向 → 重力与支持力的合力（火车转弯）。
公式只有一条 mv²/r，剩下的是画图和比大小。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是卷面上真出现过的错句，右边是能得分的表述。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 汽车过拱桥最高点时，N = mg + mv²/r。</p>
<p class="er-v">✓ N = mg − mv²/r，所以 N &lt; mg。</p>
<p class="er-w">最高点圆心在下方，合力向下；重力向下、支持力向上，两者之差才是向心力。写成加号等于把圆心放到了上方。</p>
</div>
<div class="er">
<p class="er-x">✗ 汽车过凹桥最低点时，N = mg − mv²/r。</p>
<p class="er-v">✓ N = mg + mv²/r，所以 N &gt; mg。</p>
<p class="er-w">最低点圆心在上方，合力必须向上，支持力只能大于重力。把两个桥的符号弄反，是最常见的失分点。</p>
</div>
<div class="er">
<p class="er-x">✗ 拱桥上 N = 0 时，汽车的重力消失了。</p>
<p class="er-v">✓ 重力仍是 mg，只是全部用来产生向心加速度，车与桥面之间没有压力。</p>
<p class="er-w">把「支持力为零」当成「重力为零」。重力由地球吸引产生，不会因为车的运动状态而消失。</p>
</div>
<div class="er">
<p class="er-x">✗ 火车转弯的向心力由轮缘挤压外轨提供。</p>
<p class="er-v">✓ 设计速度下由重力与支持力的合力提供；轮缘挤压只在速度偏离设计值时出现，是磨损的来源。</p>
<p class="er-w">把「补救措施」当成「设计原理」。外轨抬高就是为了让轮缘不必参与提供向心力。</p>
</div>
<div class="er">
<p class="er-x">✗ 汽车过拱桥时速度越大，桥面受到的压力越大。</p>
<p class="er-v">✓ 速度越大，N = mg − mv²/r 越小，压力越小。</p>
<p class="er-w">把凹桥的结论套到拱桥：凹桥 N = mg + mv²/r 才随 v 增大，拱桥正好相反。</p>
</div>
<div class="er">
<p class="er-x">✗ 汽车脱离桥面的临界速度是 v = √(g/r)。</p>
<p class="er-v">✓ v = √(gr)，本题 √(10 × 50) ≈ 22.4 m/s。</p>
<p class="er-w">公式记混。用单位检查：√(g/r) 的单位是 1/s，不是 m/s；√(gr) 才是 m/s。</p>
</div>
</div>
</section>

<p class="gx-note" style="border-top:1px solid var(--line);padding-top:14px">第六章到此结束。下一章把圆周运动用到天上：
行星、卫星的向心力都由<b>万有引力</b>提供，方程还是 mv²/r = F，只是右边的力换了名字。</p>

<div class="gx-foot">
<p>教材依据：人教版《物理》必修第二册（2019 年版）第六章第 4 节「生活中的圆周运动」。课文引文按教材表述整理，页码以纸质书为准。</p>
<p>数值口径：互动、图 1、图 2 与例题统一取 m = 1000 kg、r = 50 m、g = 10 m/s²，均为<b>模型值</b>；
N = max(0, m(g − v²/r))，临界速度 v = √(gr) = √500 ≈ 22.4 m/s（22.36）。若取 g = 9.8 m/s²，临界值约为 22.1 m/s，
本页不混用两套 g。图 3 的算例取 r = 300 m、v = 20 m/s，tanθ = 400/3000 ≈ 0.133，θ ≈ 7.6°，同样按 g = 10 m/s² 计算。</p>
<p>边界口径：v ≥ 22.4 m/s 时模型把 N 截断为 0，页面不显示负值；此时汽车已脱离桥面，公式不再描述车的运动。
拱桥模型只取最高点，忽略空气阻力、轮胎形变与车的转动；图 3 中的 θ 已放大绘制，真实弯道的 h 只有几厘米到十几厘米。</p>
</div>

<script src="../../assets/page.js"></script>
<script src="../../assets/gx.js"></script>
<script src="../../assets/autopilot.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var $ = GX.$;
  var stage = $("gxStage");
  var M = 1000, R = 50, G = 10;
  var VC = Math.sqrt(G * R);
  var V = 0;
  var NMAX = 12000;

  function calc(v) {
    var raw = M * (G - v * v / R);
    var N = Math.max(0, raw);
    var st, col, bg, sn;
    if (N > 0.5) {
      st = "正常"; col = "#2f8a5b"; bg = "#e6f6ee";
      sn = v < 0.05 ? "v = 0，N = mg = 10000 N"
                    : "N = " + N.toFixed(0) + " N < mg，车仍压着桥面";
    } else if (v <= VC + 0.4) {
      st = "失重临界 N=0"; col = "#b8791f"; bg = "#fdf3e0";
      sn = "v ≈ 22.36 m/s，N = 0";
    } else {
      st = "脱离桥面"; col = "#b8402f"; bg = "#fbeae7";
      sn = "v > 22.36 m/s，N 保持 0";
    }
    return { N: N, raw: raw, st: st, col: col, bg: bg, sn: sn };
  }

  function render() {
    if (V < 0) V = 0;
    var v = Math.round(V * 10) / 10;
    var s = calc(v);
    var term = (v * v / R);
    var nLen = s.N > 0.5 ? 8 + 34 * (s.N / NMAX) : 0;

    $("gxVLab").textContent = "v = " + v.toFixed(1) + " m/s";

    $("gxNBig").textContent = "N = " + s.N.toFixed(0) + " N";
    $("gxNBig").setAttribute("fill", s.col);
    $("gxStateTxt").textContent = s.st;
    $("gxStateTxt").setAttribute("fill", s.col);

    $("gxN").style.opacity = s.N > 0.5 ? "1" : "0";
    $("gxNh").style.opacity = s.N > 0.5 ? "1" : "0";
    $("gxNLab").style.opacity = s.N > 0.5 ? "1" : "0";
    $("gxN").setAttribute("y2", 104 - nLen);
    $("gxNh").setAttribute("points",
      "146," + (104 - nLen - 10) + " 141," + (104 - nLen + 4) + " 151," + (104 - nLen + 4));
    $("gxNLab").setAttribute("y", 104 - nLen * 0.55 + 3);
    $("gxNLab").textContent = "N = " + s.N.toFixed(0) + " N";

    var w = 300 * Math.min(1, s.N / NMAX);
    $("gxBarFill").setAttribute("width", w);
    $("gxBarFill").setAttribute("fill", s.col);
    $("gxTick").setAttribute("x1", 40 + w);
    $("gxTick").setAttribute("x2", 40 + w);
    $("gxTick").setAttribute("stroke", s.col);

    $("gxFormula").textContent = s.N > 0.5
      ? "N = 1000 × (10 − " + term.toFixed(1) + ") = " + s.N.toFixed(0) + " N"
      : "v²/r = " + term.toFixed(1) + " m/s² ≥ g → N = 0（负值无意义）";

    var hint;
    if (s.N <= 0.5 && v > VC + 0.4) hint = "v 已超过 22.4 m/s：桥面给不了足够向心力，车已脱离桥面";
    else if (s.N <= 0.5) hint = "v ≈ 22.4 m/s：N = 0，车与桥面恰好不挤压";
    else if (v < 0.05) hint = "v = 0：N = mg = 10000 N，车稳稳压在桥面上";
    else if (v < VC - 6) hint = "v 还不大：N = " + s.N.toFixed(0) + " N，车仍被桥面托着";
    else hint = "快到临界了：N 只剩 " + s.N.toFixed(0) + " N，v = 22.4 时归零";
    $("gxHint").textContent = hint;

    $("gxCar").setAttribute("transform", s.N > 0.5 ? "" : "translate(0,-8)");
    $("gxLeave").setAttribute("opacity", s.N > 0.5 ? "0" : "1");

    $("gxVv").textContent = v.toFixed(1) + " m/s";
    $("gxVn").textContent = s.N.toFixed(0) + " N";
    $("gxVs").textContent = s.st;
    $("gxVsn").textContent = s.sn;
    $("gxStBox").style.background = s.bg;
    $("gxStBox").style.borderColor = s.col + "44";
    $("gxVs").style.color = s.col;
  }

  var ap = null, dragging = false, moved = false, downX = 0, suppressTap = false;

  function xToV(clientX) {
    var r = stage.getBoundingClientRect();
    var f = (clientX - r.left) / r.width;
    var v = Math.max(0, Math.min(1, f)) * 25;
    return Math.round(v * 10) / 10;
  }

  stage.addEventListener("pointerdown", function (ev) {
    dragging = true; moved = false; downX = ev.clientX;
    if (ap) ap.take();
    V = xToV(ev.clientX);
    if (ap) ap.setValue(V, false);
    render();
    try { stage.setPointerCapture(ev.pointerId); } catch (e) {}
  });
  stage.addEventListener("pointermove", function (ev) {
    if (!dragging) return;
    if (Math.abs(ev.clientX - downX) > 4) moved = true;
    V = xToV(ev.clientX);
    if (ap) ap.setValue(V, false);
    render();
  });
  stage.addEventListener("pointerup", function () {
    if (moved) suppressTap = true;
    dragging = false;
  });
  stage.addEventListener("click", function (ev) {
    if (!suppressTap) return;
    suppressTap = false;
    ev.stopImmediatePropagation();
  });

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  render();
  ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 0 }, { t: 1.8, v: 10 }, { t: 3.0, v: 10 },
           { t: 4.6, v: 20 }, { t: 5.8, v: 20 },
           { t: 7.4, v: 22.4 }, { t: 9.9, v: 22.4 },
           { t: 11.6, v: 25 }, { t: 13.2, v: 0 }],
    keys: [0, 10, 20, 22.4, 25],
    value: V, min: 0, max: 25, step: 0.1,
    idle: 5000,
    onChange: function (v) { V = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc, VC: VC };
  window.__probe = function () {
    return {
      v: $("gxVv").textContent,
      N: $("gxVn").textContent,
      st: $("gxVs").textContent,
      cnt: $("gxCnt").textContent
    };
  };
});
</script>
