<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本原话，拆成三句</h2>
<div class="q-src">人教版必修第二册 · 第五章第 3 节</div>

<div class="q">
<p class="q-t">“平抛运动可以分解为水平方向的匀速直线运动和竖直方向的自由落体运动。”</p>
<p class="q-b">水平方向没有力，速度保持 v₀ 不变；竖直方向初速度为 0、只受重力，按 g 加速。两个方向同时进行，用同一个时间 t 联系起来。</p>
</div>

<div class="q">
<p class="q-t">“实验时，斜槽末端必须水平。”</p>
<p class="q-b">只有末端水平，小球离开斜槽时的初速度才沿水平方向；否则小球一开始就带竖直分速度，不再是平抛运动，轨迹和公式都对不上。</p>
</div>

<div class="q">
<p class="q-t">“以抛出点为坐标原点，x 轴水平、y 轴竖直向下，平抛运动的轨迹是一条抛物线。”</p>
<p class="q-b">由 x = v₀t、y = ½gt² 消去 t，得 y = (g/2v₀²)x²。y 与 x² 成正比，所以 y–x² 图像是一条过原点的直线——这是实验数据处理最常用的一招。</p>
</div>

<p class="gx-note">读法：先问“初速度为什么必须水平”，再问“两个方向分别是什么运动”，最后才看轨迹方程。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己写，再点“下一步”。这题的关键是：竖直方向先定时间，水平方向再用时间。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 平抛的分解与计算<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">从高 h = 0.8 m 的水平桌面边缘，以 v₀ = 2 m/s 水平抛出一个小球，g 取 10 m/s²，不计空气阻力。求：
（1）小球在空中的飞行时间 t；
（2）落地点到桌边的水平距离 x；
（3）若初速度改为 4 m/s，t 和 x 分别变为多少？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 先分解，再各找各的“已知”</p>
<p class="s-b">平抛拆成两个方向：水平方向不受力，做匀速直线运动，速度恒为 v₀；竖直方向初速度为 0、只受重力，做自由落体运动。
两个方向共用同一个时间 t，但<b>竖直方向决定 t</b>，水平方向用这个 t 算 x。</p>
<p class="s-k">用到：水平匀速、竖直自由落体，等时性。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 竖直方向求时间</p>
<p class="s-b">竖直位移 h = 0.8 m，初速度为 0：
h = ½gt²，所以 <b>t = √(2h/g) = √(2×0.8/10) = √0.16 = 0.4 s</b>。
这个 0.4 s 只由高度决定，和水平初速度 v₀ 无关。</p>
<p class="s-k">用到：自由落体 h = ½gt²；先求 t，再算水平量。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 水平方向求位移</p>
<p class="s-b">水平方向匀速：<b>x = v₀t = 2 × 0.4 = 0.8 m</b>。
落地点在桌边前方 0.8 m 处。注意不能用 x = v₀√(2h/g) 里的 g 再乘一次，水平方向没有加速度。</p>
<p class="s-k">用到：x = v₀t，水平方向速度不变。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 初速度加倍，时间变不变？</p>
<p class="s-b">h 不变，所以 <b>t 仍是 0.4 s</b>；v₀ = 4 m/s 时，
<b>x′ = v₀′t = 4 × 0.4 = 1.6 m</b>。
时间不变、水平位移加倍——这正是“竖直方向与水平方向独立”的体现。</p>
<p class="s-k">用到：t 由 h 决定；x 与 v₀ 成正比。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 写答案，点明“同时落地”</p>
<p class="s-b">（1）t = 0.4 s；（2）x = 0.8 m；（3）v₀ = 4 m/s 时，t = 0.4 s、x = 1.6 m。
如果同时释放一个自由下落的小球，它会和平抛小球同时落地；平抛只是多了水平方向的匀速运动。</p>
<p class="s-k">用到：平抛 = 水平匀速 + 竖直自由落体，两个分运动同时进行。</p>
</li>
</ol>
<div class="exbar">
  <button id="gxNext" type="button">下一步</button>
  <span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）竖直方向自由落体：h = ½gt²，<b>t = √(2h/g) = 0.4 s</b>。<br>
（2）水平方向匀速：<b>x = v₀t = 2 × 0.4 = 0.8 m</b>。<br>
（3）h 不变，<b>t 仍为 0.4 s</b>；<b>x′ = 4 × 0.4 = 1.6 m</b>。</p>
</div>
<p class="gx-note">阅卷高频扣分：用水平速度去求时间；认为 v₀ 越大落地越晚；把 x 算成 v₀²/g；忘记写“同时落地”的物理解释。</p>
</div>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>考你会怎么考</h2>
<p class="gx-h2s">六种问法，一半在考“哪个方向决定时间”。</p>

<div class="gx-qa">
<div class="qac">
<p class="q">斜槽末端为什么必须水平？</p>
<p class="a"><b>保证小球离开斜槽时初速度沿水平方向。</b>末端不水平，小球一开始就有竖直分速度，不再是平抛，竖直方向也不是自由落体。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="斜槽末端水平，初速度沿水平方向">
  <line x1="20" y1="90" x2="220" y2="90" stroke="#cfd4da" stroke-width="1.2"/>
  <path d="M30 40 Q80 40 100 90" fill="none" stroke="#7c3aed" stroke-width="5"/>
  <line x1="100" y1="90" x2="170" y2="90" stroke="#2f6fd0" stroke-width="2.2"/>
  <polygon points="180,90 166,84 166,96" fill="#2f6fd0"/>
  <text x="130" y="80" font-size="8.5" fill="#2f6fd0">v₀ 水平</text>
  <text x="120" y="120" text-anchor="middle" font-size="8.5" fill="#6b7280">末端切线水平</text>
</svg>
</div>
<div class="qac">
<p class="q">为什么每次要从同一位置由静止释放？</p>
<p class="a"><b>保证每次平抛的初速度 v₀ 相同。</b>释放位置越高，到达末端的速度越大；位置不同，轨迹就不同，数据没法比较。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="同一位置释放，保证初速度相同">
  <line x1="30" y1="104" x2="210" y2="104" stroke="#cfd4da" stroke-width="1.2"/>
  <circle cx="70" cy="34" r="5" fill="#7c3aed"/>
  <circle cx="70" cy="34" r="15" fill="none" stroke="#d8ccfb" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="90" y="38" font-size="8.5" fill="#6d28d9">同一位置</text>
  <path d="M70 34 Q110 44 130 92" fill="none" stroke="#b8791f" stroke-width="2"/>
  <text x="120" y="120" text-anchor="middle" font-size="8.5" fill="#6b7280">v₀ 相同</text>
</svg>
</div>
<div class="qac">
<p class="q">频闪照片怎样说明竖直方向是自由落体？</p>
<p class="a"><b>竖直方向相邻点间距为 1 : 3 : 5 : 7，符合初速为零的匀加速直线运动。</b>水平方向相邻点间距相等，说明水平匀速。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="竖直间距一比三比五">
  <line x1="40" y1="20" x2="40" y2="112" stroke="#cfd4da" stroke-width="1.2"/>
  <circle cx="40" cy="20" r="4" fill="#b8791f"/>
  <circle cx="40" cy="32" r="4" fill="#b8791f"/>
  <circle cx="40" cy="56" r="4" fill="#b8791f"/>
  <circle cx="40" cy="92" r="4" fill="#b8791f"/>
  <text x="54" y="34" font-size="8" fill="#8a5c14">1</text>
  <text x="54" y="58" font-size="8" fill="#8a5c14">3</text>
  <text x="54" y="94" font-size="8" fill="#8a5c14">5</text>
  <text x="140" y="66" font-size="8.5" fill="#6b7280">竖直方向</text>
</svg>
</div>
<div class="qac">
<p class="q">平抛的轨迹为什么是抛物线？</p>
<p class="a"><b>因为 x = v₀t、y = ½gt²，消去 t 得 y = (g/2v₀²)x²。</b>y 与 x² 成正比，所以轨迹是抛物线；y–x² 图像是直线。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="平抛轨迹是抛物线">
  <line x1="24" y1="20" x2="24" y2="112" stroke="#5a6472" stroke-width="1.2"/>
  <line x1="24" y1="20" x2="216" y2="20" stroke="#5a6472" stroke-width="1.2"/>
  <path d="M24 20 Q100 24 180 108" fill="none" stroke="#7c3aed" stroke-width="2.2"/>
  <text x="128" y="72" font-size="8.5" fill="#6d28d9">y ∝ x²</text>
  <text x="120" y="126" text-anchor="middle" font-size="8" fill="#6b7280">抛物线</text>
</svg>
</div>
<div class="qac">
<p class="q">两个球同时释放，谁先落地？</p>
<p class="a"><b>同时落地。</b>竖直方向都只受重力、初速度都为 0，下落高度相同，所以时间相同；平抛球的水平速度不影响竖直运动。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="自由落体球与平抛球同时落地">
  <line x1="20" y1="110" x2="220" y2="110" stroke="#cfd4da" stroke-width="1.2"/>
  <circle cx="60" cy="30" r="6" fill="#b8791f"/>
  <circle cx="60" cy="104" r="6" fill="#b8791f"/>
  <path d="M60 30 L60 104" stroke="#b8791f" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="120" cy="30" r="6" fill="#7c3aed"/>
  <path d="M120 30 Q180 60 190 104" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="190" cy="104" r="6" fill="#7c3aed"/>
  <text x="120" y="126" text-anchor="middle" font-size="8.5" fill="#2f8a5b">同时落地</text>
</svg>
</div>
<div class="qac">
<p class="q">实验误差主要来自哪里？</p>
<p class="a"><b>斜槽摩擦、空气阻力、小球不是质点、描点位置不准、木板不竖直。</b>减小误差：同一位置释放、末端水平、重锤线校准、多测几次取平均。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="实验误差来源">
  <rect x="30" y="26" width="180" height="30" rx="6" fill="#fdf3e0" stroke="#f3cdc6"/>
  <text x="120" y="46" text-anchor="middle" font-size="9" fill="#8a5c14">摩擦 / 空气 / 描点</text>
  <rect x="30" y="70" width="180" height="30" rx="6" fill="#e6f6ee" stroke="#c9e8d6"/>
  <text x="120" y="90" text-anchor="middle" font-size="9" fill="#1e6640">同一位置 / 末端水平</text>
  <text x="120" y="120" text-anchor="middle" font-size="8.5" fill="#6b7280">多测几次取平均</text>
</svg>
</div>
</div>
<p class="gx-note">六问归成一条：<b>竖直定时间，水平定位移；末端水平和同一释放是实验的两条生命线</b>。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>六条易错，逐条改</h2>

<div class="er">
<p class="er-x">✗ 斜槽末端不水平，小球也能做平抛。</p>
<p class="er-v">✓ 末端必须水平，否则初速度有竖直分量，不是平抛。</p>
<p class="er-w">平抛的定义就是初速度水平、只受重力；末端不水平，第一个条件就不满足。</p>
</div>
<div class="er">
<p class="er-x">✗ 每次释放位置不同没关系，反正都会落下来。</p>
<p class="er-v">✓ 必须从同一位置由静止释放，保证每次 v₀ 相同。</p>
<p class="er-w">释放位置不同，到达末端的速度不同，轨迹不同，数据不可比。</p>
</div>
<div class="er">
<p class="er-x">✗ 竖直方向是匀速运动，所以相邻点间距相等。</p>
<p class="er-v">✓ 竖直方向是自由落体，相邻点间距为 1 : 3 : 5。</p>
<p class="er-w">水平方向才是匀速，相邻点间距相等；两个方向别记反。</p>
</div>
<div class="er">
<p class="er-x">✗ 水平方向受重力，所以越落越快。</p>
<p class="er-v">✓ 水平方向不受力，速度保持 v₀ 不变。</p>
<p class="er-w">重力竖直向下，不改变水平速度；平抛的“平”就是水平初速度。</p>
</div>
<div class="er">
<p class="er-x">✗ 平抛时间由水平速度决定，v₀ 越大落地越晚。</p>
<p class="er-v">✓ 时间只由高度决定：t = √(2h/g)。</p>
<p class="er-w">v₀ 只改变水平位移 x = v₀t；竖直方向与水平方向独立。</p>
</div>
<div class="er">
<p class="er-x">✗ 频闪照片上直接量出两点距离，就能算 v₀，不用比例尺。</p>
<p class="er-v">✓ 必须先根据实际长度定比例尺，再把图上距离换成实际距离。</p>
<p class="er-w">照片可放大缩小，没有比例尺的长度没有物理意义。</p>
</div>

<p class="gx-note">把图 2 的“水平等距、竖直 1 : 3 : 5”背成一句话，实验题一半的分就稳了。</p>
</section>

<script src="../../assets/page.js"></script>
<script src="../../assets/gx.js"></script>
<script src="../../assets/autopilot.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var $ = GX.$;
  var H = 0.8, G = 10, T = Math.sqrt(2 * H / G);
  var V0 = 1;
  var stage = $("gxStage");
  var X0 = 50, Y0 = 70, SY = 225, SX = 90;

  function yAt(t) { return Y0 + 0.5 * G * t * t * SY; }
  function calc(v0) {
    return { x: v0 * T, t: T };
  }

  function render() {
    var s = calc(V0);
    var pts = [], dots = "";
    for (var i = 0; i <= 4; i++) {
      var t = i * 0.1;
      var yy = yAt(t);
      var xx = X0 + V0 * t * SX;
      pts.push(xx.toFixed(1) + " " + yy.toFixed(1));
      dots += '<circle cx="' + xx.toFixed(1) + '" cy="' + yy.toFixed(1) +
        '" r="3" fill="#7c3aed" opacity=".75"/>';
      dots += '<circle cx="' + X0 + '" cy="' + yy.toFixed(1) +
        '" r="3" fill="#b8791f" opacity=".55"/>';
    }
    $("gxTraj").setAttribute("d", "M " + pts.join(" L "));
    $("gxDots").innerHTML = dots;
    var ex = X0 + V0 * T * SX;
    $("gxProj").setAttribute("cx", ex.toFixed(1));
    $("gxProj").setAttribute("cy", yAt(T).toFixed(1));
    $("gxProjT").setAttribute("x", (ex - 24).toFixed(1));
    $("gxFree").setAttribute("cy", yAt(T).toFixed(1));
    $("gxFreeT").setAttribute("y", (yAt(T) - 14).toFixed(1));

    $("gxV0").textContent = "v₀ = " + V0.toFixed(1) + " m/s";
    $("gxVv").textContent = V0.toFixed(1) + " m/s";
    $("gxVx").textContent = s.x.toFixed(1) + " m";
    $("gxVt").textContent = s.t.toFixed(1) + " s";
    $("gxTake").textContent = "v₀ = " + V0.toFixed(1) + " m/s 时 x = " + s.x.toFixed(1) +
      " m，但 t 始终 " + s.t.toFixed(1) + " s——竖直方向不知道水平方向有多快。";
    $("gxStateNote").textContent = "状态：两球同时落地；v₀ 只改变水平位移，不改变下落时间。";
  }

  var ap = null;
  function setMode(m) {
    var b = $("gxAp"), t = $("gxApTxt");
    if (!b) return;
    b.classList.toggle("is-auto", m === "auto");
    b.classList.toggle("is-manual", m !== "auto");
    if (t) t.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  render();
  ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 1 }, { t: 2, v: 1 }, { t: 4, v: 2 }, { t: 6, v: 2 },
           { t: 8, v: 3 }, { t: 10.5, v: 3 }, { t: 12.5, v: 5 }, { t: 14, v: 1 }],
    keys: [1, 2, 3, 5],
    value: V0, min: 1, max: 5, step: 0.1,
    idle: 5000,
    onChange: function (v) { V0 = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc };
});
</script>
