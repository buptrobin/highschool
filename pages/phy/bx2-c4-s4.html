<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本原话</h2>
<p class="gx-h2s">三句话：机械能是什么、何时守恒、写成什么等式。</p>

<div class="gx-quote">
<p class="q-t">教材表述 1 · 组成</p>
<p class="q-b">动能与势能（包括重力势能和弹性势能）统称为机械能。</p>
<p class="q-n"><b>人话：</b>就是「<b>Ek + Ep</b>」的总账；重力势能属于「物体 + 地球」，弹性势能属于「物体 + 弹簧」。</p>
</div>

<div class="gx-quote">
<p class="q-t">教材表述 2 · 守恒条件</p>
<p class="q-b">在只有重力或弹力做功的物体系统内，动能与势能可以相互转化，而总的机械能保持不变。</p>
<p class="q-n"><b>人话：</b>条件是「<b>只有重力或弹力做功</b>」，不是「只受重力」；N、绳拉力与 v 垂直时做零功。</p>
</div>

<div class="gx-quote">
<p class="q-t">教材表述 3 · 表达式</p>
<p class="q-b">机械能守恒定律：E<sub>1</sub> = E<sub>2</sub>，即 E<sub>k1</sub> + E<sub>p1</sub> = E<sub>k2</sub> + E<sub>p2</sub>。</p>
<p class="q-n"><b>人话：</b>挑初、末两状态，把动能、势能加齐再画等号；零势能面两边必须相同。</p>
</div>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己写，再点「下一步」。关键是先定零势能面，再用总能量减法。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 自由下落中的能量换算<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">m = 1 kg 从 H = 10 m 处自由下落，g = 10 m/s²，地面为零势能面。求 h = 4 m 时的 Ep、Ek 和速度，以及初始总机械能。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 定系统与零势能面</p>
<p class="s-b">系统取「物体 + 地球」，以地面为零势能面。只有重力做功，机械能守恒。初状态 v = 0、h = 10 m，E = mgH = <b>100 J</b>。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 算 h = 4 m 处的 Ep</p>
<p class="s-b">E<sub>p</sub> = mgh = 1 × 10 × 4 = <b>40 J</b>。从 10 m 落到 4 m，高度降 6 m，Ep 恰好减少 60 J。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 用总能量减法求 Ek</p>
<p class="s-b">E<sub>k</sub> = E − E<sub>p</sub> = 100 − 40 = <b>60 J</b>。也可算 W<sub>G</sub> = mg(H − h) = 60 J。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 由 Ek 反求速度</p>
<p class="s-b">由 E<sub>k</sub> = ½mv² 得 v = √(2 × 60 / 1) = √120 ≈ <b>10.95 m/s</b>。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 落地反查</p>
<p class="s-b">h = 0 时 E<sub>p</sub> = 0、E<sub>k</sub> = 100 J，v = √200 ≈ 14.14 m/s，总机械能仍是 <b>100 J</b>。</p>
</li>
</ol>
<div class="exbar">
  <button id="gxNext" type="button">下一步</button>
  <span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">取地面为零势能面，只有重力做功，机械能守恒。<br>
（1）E = mgH = <b>100 J</b>。<br>
（2）E<sub>p</sub> = mgh = <b>40 J</b>。<br>
（3）E<sub>k</sub> = E − E<sub>p</sub> = <b>60 J</b>。<br>
（4）v = √(2E<sub>k</sub>/m) = √120 ≈ <b>10.95 m/s</b>。</p>
</div>
<p class="gx-note">扣分点：把 h = 4 m 当成「下落了 4 m」；换零势能面后两边不统一。</p>
</div>
</section>

<p class="gx-h2s">六种问法，核心都是「系统、条件、零势能面」。</p>

<div class="gx-qa">
<div class="qac">
<p class="q">机械能包括哪几项？</p>
<p class="a"><b>Ek、重力势能、弹性势能。</b></p>

  <rect x="92" y="34" width="56" height="40" rx="6" fill="#fdf3e0" stroke="#b8791f"/>

  <text x="120" y="102" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3a3a35">E = Ek + Ep</text>
</svg>
</div>

<div class="qac">
<p class="q">匀速下落时机械能守恒吗？</p>
<p class="a"><b>不守恒。</b>Ek 不变、Ep 减少，阻力做负功。</p>
<svg viewBox="0 0 240 132">
  <line x1="50" y1="110" x2="190" y2="110" stroke="#8e97a4" stroke-width="2"/>

  <rect x="140" y="36" width="30" height="74" fill="#ecfbff" stroke="#0891b2"/>
  <text x="120" y="126" text-anchor="middle" font-size="10" font-weight="700" fill="#b8402f">总 E 减少</text>
</svg>
</div>

<div class="qac">
<p class="q">只有重力做功，等于只受重力吗？</p>
<p class="a"><b>不等于。</b>N、绳拉力与速度垂直时做零功。</p>
<svg viewBox="0 0 240 132">
  <polygon points="30,106 200,106 200,36" fill="#eef7f1" stroke="#2f8a5b"/>

</div>

<div class="qac">
<p class="q">弹簧弹力做功，机械能守恒吗？</p>

</svg>
</div>

<div class="qac">
<p class="q">三种写法怎么选？</p>
<p class="a"><b>两状态 E1 = E2；变化量 ΔEk = −ΔEp；判守恒 ΔE = 0。</b></p>
<svg viewBox="0 0 240 132">
  <text x="120" y="34" text-anchor="middle" font-size="11" fill="#0b6580">E1 = E2</text>

</svg>

<div class="qac">
<p class="q">解题前先定哪三件事？</p>
<p class="a"><b>系统、条件、零势能面。</b>顺序反了，符号就容易错。</p>
<svg viewBox="0 0 240 132">

</div>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>最容易错的六句</h2>
<p class="gx-h2s">每句先给错的说法，再给能得分的说法。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 机械能守恒就是动能不变。</p>
<p class="er-v">✓ 守恒的是 <b>Ek + Ep 的总和</b>。</p>
<p class="er-w">自由下落时动能涨、势能降，总和仍是 100 J。</p>
</div>
<div class="er">
<p class="er-x">✗ 只有重力做功，所以只受重力。</p>
<p class="er-v">✓ 其他力可以做<b>零功</b>。</p>
<p class="er-w">光滑斜面的 N、单摆绳拉力都与 v 垂直。</p>
</div>
<div class="er">
<p class="er-x">✗ 重力势能是物体单独具有的。</p>
<p class="er-v">✓ 它属于<b>物体与地球组成的系统</b>。</p>
<p class="er-w">「物体的重力势能」是简写，系统题要算上地球。</p>
</div>
<div class="er">
<p class="er-x">✗ 物体向下运动，机械能一定减少。</p>
<p class="er-v">✓ 只有重力做功时，<b>总机械能不变</b>。</p>
<p class="er-w">向下只说明高度降低；守恒看谁做功。</p>
</div>
<div class="er">
<p class="er-x">✗ 换零势能面后 E 不同，守恒式就错了。</p>
<p class="er-v">✓ 零势能面可任选，<b>前后统一</b>即可。</p>
<p class="er-w">换面后两态 Ep 同时平移，等号仍成立。</p>
</div>
<div class="er">
<p class="er-x">✗ 不必判条件，直接列 E1 = E2。</p>
<p class="er-v">✓ 先确认<b>只有重力或弹力做功</b>。</p>
<p class="er-w">有摩擦或拉力做功时改用动能定理。</p>
</div>
</div>
</section>

<p class="gx-note" style="border-top:1px solid var(--line);padding-top:14px">下一节实验：验证 Ep 减少量等于 Ek 增加量，重点是阻力做功。</p>

<div class="gx-foot">
<p>教材依据：人教版《物理》必修第二册（2019 年版）第八章第 4 节「机械能守恒定律」。</p>
<p>数值口径：互动取 m = 1 kg、H = 10 m、g = 10 m/s²，E<sub>p</sub> = 10h、E<sub>k</sub> = 10(10 − h)，总机械能 100 J；例题 h = 4 m 时 E<sub>p</sub> = 40 J、E<sub>k</sub> = 60 J、v ≈ 10.95 m/s。</p>
<p>系统默认为「物体 + 地球」；涉及弹簧时须计入弹簧。</p>
</div>

<script src="../../assets/page.js"></script>
<script src="../../assets/gx.js"></script>
<script src="../../assets/autopilot.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var $ = GX.$;
  var sl = $("gxSl"), hv = 10;
  function render() {
    var h = Math.max(0, Math.min(10, hv));
    var ep = 10 * h, ek = 10 * (10 - h), y = 290 - h * 24;
    $("gxBall").setAttribute("cy", y);
    $("gxHlab").setAttribute("y", y - 16);
    $("gxHlab").textContent = h.toFixed(1) + " m";
    var eph = h * 8, ekh = (10 - h) * 8;
    $("gxEpBar").setAttribute("y", 290 - eph);
    $("gxEpBar").setAttribute("height", eph);
    $("gxEkBar").setAttribute("y", 290 - ekh);
    $("gxEkBar").setAttribute("height", ekh);
    $("gxEpTxt").setAttribute("y", Math.max(204, 290 - eph - 5));
    $("gxEpTxt").textContent = ep.toFixed(0) + " J";
    $("gxEkTxt").setAttribute("y", Math.max(204, 290 - ekh - 5));
    $("gxEkTxt").textContent = ek.toFixed(0) + " J";
    var state = h > 9.95 ? "全势能" : (h < 0.05 ? "全动能" : "此消彼长");
    $("gxVh").textContent = h.toFixed(1) + " m";
    $("gxVep").textContent = ep.toFixed(0) + " J";
    $("gxVek").textContent = ek.toFixed(0) + " J";
    $("gxVhs").textContent = state + " · Ep + Ek = 100 J";
  }
  sl.addEventListener("input", function () { hv = parseFloat(sl.value); render(); });
  render();
  var ap = AutoPilot.create({
    mount: $("gxStage"), follow: sl,
    loop: [{ t: 0, v: 10 }, { t: 1.5, v: 10 }, { t: 3.5, v: 7 }, { t: 5.5, v: 5 },
           { t: 8, v: 5 }, { t: 10, v: 2 }, { t: 11.5, v: 0 }, { t: 13.5, v: 10 }],
    keys: [10, 7, 5, 2, 0],
    value: 10, min: 0, max: 10, step: 0.5, idle: 5000,
    onChange: function (v) { hv = v; render(); },
    onMode: function (m) {
      var b = $("gxAp"), t = $("gxApTxt");
      if (!b) return;
      b.classList.toggle("is-auto", m === "auto");
      b.classList.toggle("is-manual", m !== "auto");
      if (t) t.textContent = m === "auto" ? "自动演示中" : "你接管了";
    }
  });
  window.__ap = ap;
  window.__probe = function () {
    return { h: $("gxVh").textContent, ep: $("gxVep").textContent, ek: $("gxVek").textContent,
             cnt: $("gxCnt").textContent, steps: document.querySelectorAll("#gxSteps .step:not([hidden])").length };
  };
});
</script>
