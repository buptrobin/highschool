<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">四条：定律、公式、常量、适用条件。考试先问「r 是什么」。</p>

<div class="gx-quote">
<p class="q-t">课本表述 · 万有引力定律<span class="q-src">人教版必修第二册 · 第七章第 2 节</span></p>
<p class="q-b">自然界中任何两个物体都相互吸引，引力的方向在它们的连线上，引力的大小与物体的质量 m₁ 和 m₂ 的乘积成正比，与它们之间距离 r 的二次方成反比。</p>
<p class="q-n">→ 三个词各管一件事：<b>任何</b>（不只天体，两个人之间也有）、<b>连线上</b>（方向）、
<b>二次方</b>（r 翻倍，F 变 1/4，不是 1/2）。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本表述 · 公式<span class="q-src">人教版必修第二册 · 第七章第 2 节</span></p>
<p class="q-b">F = G m₁m₂/r²，式中 G 是比例系数，叫作引力常量。</p>
<p class="q-n">→ 代入前先统一单位：m 用 kg、r 用 m、F 用 N，G 才能取 6.67×10⁻¹¹ N·m²/kg²。
分子是两质量的<b>乘积</b>，不是和；分母是 r 的<b>平方</b>，不是 r。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本表述 · 引力常量<span class="q-src">人教版必修第二册 · 第七章第 2 节</span></p>
<p class="q-b">引力常量 G = 6.67×10⁻¹¹ N·m²/kg²，是英国物理学家卡文迪什在实验室里比较准确地测出的。</p>
<p class="q-n">→ G 很小，所以日常物体之间的引力察觉不到。卡文迪什的扭秤把极小的力放大成可观察的扭转，
他也因此被称为「第一个称量地球质量的人」。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本表述 · 适用条件<span class="q-src">人教版必修第二册 · 第七章第 2 节</span></p>
<p class="q-b">万有引力定律适用于两个质点间的相互作用；对两个质量分布均匀的球体，公式中的 r 是两球心间的距离。</p>
<p class="q-n">→ 地面上的物体到地心的距离是 <b>R + h</b>，不是高度 h；当 r 趋近 0 时，物体不能再当作质点，
公式本身失效，不能由此得出「F 趋于无穷」。</p>
</div>

<p class="gx-note">做题顺序：先确认能不能用（质点 / 均匀球体）→ 再确认 r 量的是哪两点 → 最后代公式。
顺序反了，数算得再对也拿不到分。</p>
</section>

<section class="gx-sec" id="c">
<h2><span class="sn">03</span>自己拖一下<span class="bdg bdg-must">核心</span></h2>
<p class="gx-h2s">两个 50 kg 的球，拖 r 从 0.5 m 到 3 m，看 F 怎么随 r² 缩小。</p>

<figure class="gx-fig">
<div class="fig-cap"><span class="fig-no">互动 1</span><span class="fig-t">距离翻倍，引力变成四分之一</span><span class="gx-ap" id="gxAp"><i></i><span id="gxApTxt">自动演示中</span></span></div>
<p class="fig-s">m₁ = m₂ = 50 kg，G = 6.67×10⁻¹¹ N·m²/kg²，所以 F = G×2500/r² = <b>1.6675×10⁻⁷/r²</b> N。
r = 1 m 时 F = 1.67×10⁻⁷ N；r = 2 m 时 F = 4.17×10⁻⁸ N，正好是 1/4。

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己写，再点「下一步」。这题的关键是「先确认 r 量哪里，再比较 r 的倍数」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 两个人之间的万有引力<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">两个质量都是 50 kg 的物体，相距 r = 1 m。已知 G = 6.67×10⁻¹¹ N·m²/kg²。求：
（1）它们之间的万有引力；（2）把距离改为 2 m 时，引力变为多少；（3）地球对 1 kg 物体的引力约为多少？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 先确认 r 量哪里，再统一单位</p>
<p class="s-b">两个物体相距 1 m，所以 r = 1 m；质量用 kg，G 用 6.67×10⁻¹¹ N·m²/kg²。
三个量都已经是国际单位，可以直接代入 <b>F = G m₁m₂/r²</b>。
如果题目给的是「离地高度 h」，那就要先换成 r = R + h，不能把 h 直接当 r。</p>
<p class="s-k">用到：先确认适用条件与 r 的含义；两个物体可看作质点。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 代 r = 1 m，求两个人之间的引力</p>
<p class="s-b">F = 6.67×10⁻¹¹ × (50×50)/1² = 6.67×10⁻¹¹ × 2500 = 1.6675×10⁻⁷ N ≈ <b>1.67×10⁻⁷ N</b>。
分子是两质量的乘积 2500 kg²，不是 100 kg；分母的 1² 也不要漏写平方。</p>
<p class="s-k">用到：F = G m₁m₂/r²；m₁m₂ 是乘积。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 距离改成 2 m：用倍数关系最快</p>
<p class="s-b">r 变为原来的 2 倍，分母 r² 就变为 4 倍，F 变为原来的 1/4：
F′ = 1.6675×10⁻⁷ / 4 = <b>4.17×10⁻⁸ N</b>。只改 r 时，不用重新乘 G 和 m，
直接把原来的 F 除以 4 即可。</p>
<p class="s-k">用到：F ∝ 1/r²；r 加倍 ⇒ F 变 1/4。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 地球对 1 kg 物体的引力</p>
<p class="s-b">这个力就是 1 kg 物体受到的重力：F = mg = 1 × 9.8 = <b>9.8 N</b>。
用万有引力定律核对：F = G M m/R²，取 M ≈ 6.0×10²⁴ kg、R ≈ 6.4×10⁶ m，
算得也约 9.8 N——地面上的重力就是万有引力的表现。</p>
<p class="s-k">用到：地面附近 mg 与 G M m/R² 描述的是同一个力。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 比一比量级，回答「为什么感觉不到」</p>
<p class="s-b">两个人之间的 1.67×10⁻⁷ N，只有地球对 1 kg 物体引力的
1.67×10⁻⁷ / 9.8 ≈ <b>1.7×10⁻⁸ 倍</b>。所以两个人站得很近也感觉不到彼此的引力，
但这条力并没有消失——卡文迪什正是用扭秤把这个极小的力测了出来。</p>
<p class="s-k">用到：量级比较；「感觉不到」不等于「不存在」。</p>
</li>
</ol>
<div class="exbar">
  <button id="gxNext" type="button">下一步</button>
  <span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）由 F = G m₁m₂/r²，得 F = 6.67×10⁻¹¹ × 50×50 / 1² = <b>1.67×10⁻⁷ N</b>。<br>
（2）r 变为 2 m，是原来的 2 倍，F 变为 1/4：F′ = 1.67×10⁻⁷ / 4 = <b>4.17×10⁻⁸ N</b>。<br>
（3）地球对 1 kg 物体的引力等于它受到的重力：F = mg = 1×9.8 = <b>9.8 N</b>。</p>
</div>
<p class="gx-note">阅卷高频扣分：把 50×50 写成 50+50；第（2）问把 F 写成 1/2；第（3）问用 G m₁m₂/r² 时
把 r 取成 0，或忘了把地球半径平方；最后单位不写、把 N 写成 kg。</p>
</div>
</section>

<div class="gx-qa">
<div class="qac">
<p class="q">万有引力和重力是一回事吗？</p>
<p class="a"><b>不是同一个力。</b>地面附近重力是万有引力的一个分力，另一个分力提供物体随地球自转的向心力；自转很慢，两者大小非常接近。</p>

<div class="qac">
<p class="q">G 是谁测出来的？</p>
<p class="a"><b>卡文迪什</b>用扭秤实验较准确地测出了 G = 6.67×10⁻¹¹ N·m²/kg²，这也是人类第一次「称」出地球的质量。</p>

</div>
<div class="qac">
<p class="q">r 趋近 0 时，F 会趋于无穷大吗？</p>
<p class="a"><b>不会。</b>公式只适用于质点或均匀球体；r→0 时物体不能再看作质点，公式失效。「F 趋于无穷」是把公式用到了适用条件之外。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是卷面上真出现过的错句，右边是能得分的表述。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ G = 9.8 N/kg。</p>
<p class="er-v">✓ G = 6.67×10⁻¹¹ N·m²/kg²，是引力常量；9.8 N/kg 是地面附近的 g。</p>
<p class="er-w">把「引力常量」和「重力加速度」两个符号混成一个，单位也对不上：G 的单位含 m²/kg²。</p>
</div>
<div class="er">
<p class="er-x">✗ 两个物体相距的高度 h 就是公式里的 r。</p>
<p class="er-v">✓ 对均匀球体，r 是两球心间距离；地面物体到地心是 R+h，卫星到地心也是 R+h。</p>
<p class="er-w">把「离地高度」当成「球心距」，少加了一个地球半径，算出的 F 会明显偏大。</p>
</div>
<div class="er">
<p class="er-x">✗ F 与 r 成反比，r 加倍 F 减半。</p>
<p class="er-v">✓ F 与 r² 成反比，r 加倍 F 变 1/4。</p>
<p class="er-w">漏看「二次方」，这是本节最高频的失分点；r 变 3 倍时对应的是 1/9。</p>
</div>
<div class="er">
<p class="er-x">✗ 太空站里没有引力，所以失重。</p>
<p class="er-v">✓ 太空站仍受地球引力，失重是因为它和舱内物体一起自由下落。</p>
<p class="er-w">把「失重（视重为零）」当成「引力为零」，两者不是一回事。</p>
</div>
<div class="er">
<p class="er-x">✗ 万有引力只存在于天体之间。</p>
<p class="er-v">✓ 任何两个有质量的物体之间都有万有引力，两个人之间也有，只是太小察觉不到。</p>
<p class="er-w">把定律里的「任何两个物体」缩成了「天体」，适用范围被自己改小了。</p>
</div>
<div class="er">
<p class="er-x">✗ 质量大的物体受到的引力大，质量小的受力小。</p>
<p class="er-v">✓ 两个物体受到的引力大小相等、方向相反；但质量小的加速度更大。</p>
<p class="er-w">把「力」和「加速度」混为一谈，忘了引力是一对相互作用力。</p>
</div>
</div>
</section>

<p class="gx-note" style="border-top:1px solid var(--line);padding-top:14px">下一节用这条定律去「称」天体：
只要测出环绕天体的轨道半径 r 和周期 T，就能反推出中心天体的质量。</p>

<div class="gx-foot">
<p>教材依据：人教版《物理》必修第二册（2019 年版）第七章第 2 节「万有引力定律」。课文引文按教材表述整理，页码以纸质书为准。</p>
<p>数值口径：互动取两个 50 kg 物体、G = 6.67×10⁻¹¹ N·m²/kg²，F = G×2500/r² = 1.6675×10⁻⁷/r² N，
属<b>模型值</b>；r = 1 m 时 1.67×10⁻⁷ N，r = 2 m 时 4.17×10⁻⁸ N；地球对 1 kg 物体约 9.8 N。
图中两球大小是示意、不按比例，r 指两球心间距离。</p>
<p>适用边界：公式只适用于质点或质量分布均匀的球体，r 趋近 0 时不能把公式外推为「F 趋于无穷」；
太空站失重是自由下落造成的视重为零，不是引力消失。</p>

<div class="gx-zoom" id="gxZoom" hidden>
  <span class="gx-zoom-tip">双指放大看细节</span>
  <button class="gx-zoom-x" type="button" aria-label="关闭">✕</button>
  <div id="gxZoomInner"></div>

<script src="../../assets/page.js"></script>
<script src="../../assets/gx.js"></script>
<script src="../../assets/autopilot.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var $ = GX.$;
  var stage = $("gxStage");
  var G = 6.67e-11, M1 = 50, M2 = 50;
  var K = G * M1 * M2;
  var R = 1;

  function fmtF(F) {
    return (F * 1e7).toFixed(2) + " × 10⁻⁷ N";
  }

  function calc(r) {
    var F = K / (r * r);
    var ratio = 1 / (r * r);
    var col, bg, sn;
    if (Math.abs(r - 1) < 0.005) {
      col = "#2f8a5b"; bg = "#e6f6ee";
      sn = "r = 1.00 m，取作基准";
    } else if (Math.abs(r - 2) < 0.026) {
      col = "#2f6fd0"; bg = "#eef5fc";
      sn = "r 加倍 → F 变 1/4（0.25 倍）";
    } else if (r < 1) {
      col = "#b8791f"; bg = "#fdf3e0";
      sn = "r 减半 → F 变 4 倍" + (Math.abs(r - 0.5) < 0.026 ? "（6.67×10⁻⁷ N）" : "");
    } else {
      col = "#2f6fd0"; bg = "#eef5fc";
      sn = "r 是 1 m 的 " + r.toFixed(2) + " 倍 → F 变 1/" + (r * r).toFixed(2);
    }
    return { F: F, ratio: ratio, col: col, bg: bg, sn: sn };
  }

  function arrowHeadLeft(tipX, y) {
    return tipX + "," + y + " " + (tipX + 12) + "," + (y - 5) + " " + (tipX + 12) + "," + (y + 5);
  }
  function arrowHeadRight(tipX, y) {
    return tipX + "," + y + " " + (tipX - 12) + "," + (y - 5) + " " + (tipX - 12) + "," + (y + 5);
  }

  function render() {
    if (R < 0.5) R = 0.5;
    if (R > 3) R = 3;
    var m = calc(R);
    var d = 120 + (R - 0.5) / 2.5 * 140;
    var x1 = 210 - d / 2, x2 = 210 + d / 2;

    $("gxB1").setAttribute("cx", x1.toFixed(1));
    $("gxB2").setAttribute("cx", x2.toFixed(1));
    $("gxM1").setAttribute("x", x1.toFixed(1));
    $("gxM2").setAttribute("x", x2.toFixed(1));

    $("gxFL").setAttribute("x1", (x1 + 20).toFixed(1));
    $("gxFL").setAttribute("x2", (x1 + 48).toFixed(1));
    $("gxFLH").setAttribute("points", arrowHeadRight(x1 + 58, 112));
    $("gxFLab").setAttribute("x", (x1 + 34).toFixed(1));

    $("gxFR").setAttribute("x1", (x2 - 20).toFixed(1));
    $("gxFR").setAttribute("x2", (x2 - 48).toFixed(1));
    $("gxFRH").setAttribute("points", arrowHeadLeft(x2 - 58, 112));
    $("gxFRab").setAttribute("x", (x2 - 34).toFixed(1));

    $("gxRuler").setAttribute("x1", x1.toFixed(1));
    $("gxRuler").setAttribute("x2", x2.toFixed(1));
    $("gxRulerL").setAttribute("points", (x1 - 10) + ",176 " + (x1 + 2) + ",172 " + (x1 + 2) + ",180");
    $("gxRulerR").setAttribute("points", (x2 + 10) + ",176 " + (x2 - 2) + ",172 " + (x2 - 2) + ",180");
    $("gxTickL").setAttribute("x1", x1.toFixed(1));
    $("gxTickL").setAttribute("x2", x1.toFixed(1));
    $("gxTickR").setAttribute("x1", x2.toFixed(1));
    $("gxTickR").setAttribute("x2", x2.toFixed(1));
    $("gxRLab").textContent = "r = " + R.toFixed(2) + " m";

    $("gxRBig").textContent = "r = " + R.toFixed(2) + " m";
    $("gxFBig").textContent = "F = " + fmtF(m.F);
    $("gxFormula").textContent = "F = 6.67×10⁻¹¹ × 2500 / " + R.toFixed(2) + "² = " + fmtF(m.F);

    var hint;
    if (Math.abs(R - 2) < 0.026) {
      hint = "r 从 1 m 到 2 m：F 变 1/4（1.67→0.42，×10⁻⁷ N）";
    } else if (Math.abs(R - 3) < 0.026) {
      hint = "r 是 1 m 的 3 倍：F 变成 1/9（0.19×10⁻⁷ N）";
    } else if (Math.abs(R - 0.5) < 0.026) {
      hint = "r 减半：F 变成 4 倍（6.67×10⁻⁷ N）";
    } else if (Math.abs(R - 1) < 0.005) {
      hint = "r = 1 m：取作比值基准，F = 1.67×10⁻⁷ N";
    } else {
      hint = "r 变 k 倍，F 变 1/k²：现在的 k = " + R.toFixed(2);
    }
    $("gxHint").textContent = hint;

    $("gxVa").textContent = R.toFixed(2) + " m";
    $("gxVb").textContent = fmtF(m.F);
    $("gxVbs").textContent = "以 ×10⁻⁷ N 为单位：" + (m.F * 1e7).toFixed(2);
    $("gxVs").textContent = m.ratio.toFixed(2) + "×";
    $("gxVsn").textContent = m.sn;
    $("gxStBox").style.background = m.bg;
    $("gxStBox").style.borderColor = m.col + "44";
    $("gxVs").style.color = m.col;
  }

  var ap = null, dragging = false, moved = false, downX = 0, suppressTap = false;

  function xToR(clientX) {
    var r = stage.getBoundingClientRect();
    var f = (clientX - r.left) / r.width;
    return Math.round((0.5 + Math.max(0, Math.min(1, f)) * 2.5) * 20) / 20;
  }

  stage.addEventListener("pointerdown", function (ev) {
    dragging = true; moved = false; downX = ev.clientX;
    if (ap) ap.take();
    R = xToR(ev.clientX);
    if (ap) ap.setValue(R, false);
    render();
    try { stage.setPointerCapture(ev.pointerId); } catch (e) {}
  });
  stage.addEventListener("pointermove", function (ev) {
    if (!dragging) return;
    if (Math.abs(ev.clientX - downX) > 4) moved = true;
    R = xToR(ev.clientX);
    if (ap) ap.setValue(R, false);
    render();
  });
  stage.addEventListener("pointerup", function () {
    if (moved) suppressTap = true;
    dragging = false;
  });
  stage.addEventListener("click", function (ev) {
    if (!suppressTap) return;
    suppressTap = false;
    ev.stopImmediatePropagation();
  });

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  render();
  ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 1 }, { t: 2.0, v: 0.5 }, { t: 4.0, v: 2 }, { t: 6.5, v: 2 },
           { t: 8.7, v: 3 }, { t: 10.2, v: 3 }, { t: 12.0, v: 1 }],
    keys: [0.5, 1, 2, 3],
    value: R, min: 0.5, max: 3, step: 0.05,
    idle: 5000,
    onChange: function (v) { R = Math.round(v * 100) / 100; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc };
  window.__probe = function () {
    return {
      r: $("gxVa").textContent,
      F: $("gxVb").textContent,
      ratio: $("gxVs").textContent,
      st: $("gxVsn").textContent,
      cnt: $("gxCnt").textContent
    };
  };
});
</script>
</body>
</html>
