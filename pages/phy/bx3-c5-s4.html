<script type="text/markdown" id="md"><div class="gx"><div class="gx-kicker">ELI5-HIGH · 讲给要考试的人</div><p class="gx-claim">只干一件事：把<b>变化的电磁场</b>变成向外跑的<b>电磁波</b>，再用 <b>λ = c/f</b> 算它多长。</p><nav class="gx-toc"><a href="#a">① 课本怎么说</a><a href="#b">② 拆开看</a><a href="#c">③ 自己拖一下</a><a href="#d">④ 一道题走一遍</a><a href="#e">⑤ 会怎么考</a><a href="#f">⑥ 易错清单</a></nav>
<section class="gx-sec" id="a"><h2><span class="sn">01</span>课本怎么说</h2><p class="gx-h2s">三条：预言、横波、波谱。<span class="q-src">人教版必修第三册 · 第十三章第4节</span></p><div class="gx-quote"><p class="q-t">课本表述 · 预言与证实</p><p class="q-b">麦克斯韦预言了电磁波的存在，赫兹用实验证实了电磁波的存在。</p><p class="q-n">→ 人话：先预言，后证实。</p></div><div class="gx-quote"><p class="q-t">课本表述 · 电磁波是横波</p><p class="q-b">电磁波是横波，电场和磁场相互垂直，且都垂直于传播方向；真空中传播速度 c = 3.0×10⁸ m/s。</p><p class="q-n">→ 人话：E、B 横着振动，不沿传播方向。</p></div><div class="gx-quote"><p class="q-t">课本表述 · 波速公式与波谱</p><p class="q-b">波速、波长、频率的关系为 c = λf；电磁波谱包括无线电波、红外线、可见光、紫外线、X 射线、γ 射线。</p><p class="q-n">→ 人话：频率越高，波长越短。</p></div></section>
<section class="gx-sec" id="b"><h2><span class="sn">02</span>拆开看</h2><p class="gx-h2s">三张图：E/B/传播方向、电磁波谱、生活里的应用。</p><figure class="gx-fig"><div class="fig-cap"><span class="fig-no">图 1</span><span class="fig-t">E、B、传播方向两两垂直</span><span class="bdg bdg-must">必考</span></div><p class="fig-s">E 与 B 相互垂直，且都垂直于传播方向——这就是<b>横波</b>。</p><p class="fig-s">E、B 同相位变化；真空中 <b>c = 3.0×10⁸ m/s</b>。</p><div class="gx-svgbox"><svg viewBox="0 0 900 300" role="img" aria-label="电磁波中电场E、磁场B与传播方向两两垂直"><rect x="20" y="14" width="860" height="272" rx="14" fill="#fbfcfd" stroke="#e6e9ee"/><text x="450" y="42" text-anchor="middle" font-size="14" font-weight="700" fill="#3a3a35">E ⊥ B，且都 ⊥ 传播方向</text><line x1="140" y1="215" x2="140" y2="98" stroke="#7c3aed" stroke-width="2.4"/><polygon points="135,98 140,84 145,98" fill="#7c3aed"/><text x="140" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#6d28d9">E</text><line x1="140" y1="215" x2="248" y2="152" stroke="#2563eb" stroke-width="2.4"/><polygon points="248,152 234,152 240,164" fill="#2563eb"/><text x="258" y="148" font-size="14" font-weight="700" fill="#2563eb">B</text><line x1="140" y1="215" x2="322" y2="215" stroke="#3a3a35" stroke-width="2"/><polygon points="322,210 335,215 322,220" fill="#3a3a35"/><text x="345" y="211" font-size="14" font-weight="700" fill="#3a3a35">v</text><line x1="380" y1="190" x2="862" y2="190" stroke="#b8c2cc" stroke-width="1.4"/><polygon points="862,185 874,190 862,195" fill="#b8c2cc"/><polyline points="380,190 400,158 420,145 440,158 460,190 480,222 500,235 520,222 540,190 560,158 580,145 600,158 620,190 640,222 660,235 680,222 700,190 720,158 740,145 760,158 780,190 800,222 820,235 840,222 860,190" fill="none" stroke="#7c3aed" stroke-width="2.4"/></svg><span class="gx-zoomchip">点击放大</span></div><p class="gx-take">横波只看一条：<b>振动方向是否垂直于传播方向</b>。</p></figure><figure class="gx-fig"><div class="fig-cap"><span class="fig-no">图 2</span><span class="fig-t">电磁波谱：频率由低到高</span><span class="bdg bdg-diff">辨析</span></div><p class="fig-s">按频率由低到高：无线电波、红外线、可见光、紫外线、X 射线、γ 射线。</p><p class="fig-s">频率越高波长越短；<b>可见光只占很窄一段</b>。</p><div class="gx-svgbox"><svg viewBox="0 0 900 300" role="img" aria-label="电磁波谱：无线电波、红外线、可见光、紫外线、X射线、γ射线"><text x="450" y="42" text-anchor="middle" font-size="14" font-weight="700" fill="#3a3a35">电磁波谱：频率由低到高，波长由长到短</text><rect x="60" y="100" width="220" height="70" fill="#dbeafe" stroke="#c7dbf5"/><rect x="280" y="100" width="150" height="70" fill="#fee2e2" stroke="#fecaca"/><rect x="430" y="100" width="90" height="70" fill="#fde68a"/><rect x="520" y="100" width="110" height="70" fill="#ede9fe" stroke="#ddd6fe"/><rect x="630" y="100" width="100" height="70" fill="#e0f2fe" stroke="#bae6fd"/><rect x="730" y="100" width="110" height="70" fill="#f3e8ff" stroke="#e9d5ff"/><g font-size="11" fill="#3a3a35" text-anchor="middle"><text x="170" y="140">无线电波</text><text x="355" y="140">红外线</text><text x="475" y="140" fill="#fff" font-size="10">可见光</text><text x="575" y="140">紫外线</text><text x="680" y="140">X 射线</text><text x="785" y="140">γ 射线</text></g></svg><span class="gx-zoomchip">点击放大</span></div><p class="gx-take">记谱顺序：<b>无、红、可、紫、X、γ</b>。</p></figure><figure class="gx-fig"><div class="fig-cap"><span class="fig-no">图 3</span><span class="fig-t">频率不同，本领不同</span><span class="bdg bdg-warn">高频</span></div><p class="fig-s">无线电波传信息，微波加热，红外遥感，紫外杀菌，X 射线透视，γ 治疗。</p><p class="fig-s">通信先<b>调制</b>（信号装到高频波上），接收端再<b>解调</b>。</p><div class="gx-svgbox"><svg viewBox="0 0 900 300" role="img" aria-label="电磁波的六种应用"><text x="450" y="42" text-anchor="middle" font-size="14" font-weight="700" fill="#3a3a35">六种应用：频率不同，本领不同</text><g font-size="12.5" font-weight="700"><text x="64" y="98" fill="#6d28d9">无线电通信</text><text x="64" y="120" font-size="10" font-weight="400" fill="#6b7280">广播、电视、手机</text><text x="340" y="98" fill="#2563eb">微波炉</text><text x="340" y="120" font-size="10" font-weight="400" fill="#6b7280">水分子振动升温</text><text x="616" y="98" fill="#b8402f">红外遥感</text><text x="616" y="120" font-size="10" font-weight="400" fill="#6b7280">测温、夜视、探地表</text><text x="64" y="208" fill="#6d28d9">紫外消毒</text><text x="64" y="230" font-size="10" font-weight="400" fill="#6b7280">破坏 DNA 杀菌</text><text x="340" y="208" fill="#0f766e">X 射线透视</text><text x="340" y="230" font-size="10" font-weight="400" fill="#6b7280">穿透软组织拍片</text><text x="616" y="208" fill="#b45309">γ 射线治疗</text><text x="616" y="230" font-size="10" font-weight="400" fill="#6b7280">聚焦射线杀肿瘤</text></g></svg><span class="gx-zoomchip">点击放大</span></div><p class="gx-take">频率不同，<b>穿透、加热、成像</b>的本领就不同。</p></figure></section>
<section class="gx-sec" id="c"><h2><span class="sn">03</span>自己拖一下<span class="bdg bdg-must">核心</span></h2><p class="gx-h2s">拖动滑块改 f（1 MHz–10 GHz），λ 和波段一起变。</p><figure class="gx-fig"><div class="fig-cap"><span class="fig-no">互动 1</span><span class="fig-t">f 变，λ 和波段跟着变</span><span class="gx-ap" id="gxAp"><i></i><span id="gxApTxt">自动演示中</span></span></div><p class="fig-s">真空中 <b>c = 3.0×10⁸ m/s</b> 不变，所以 <b>λ = c / f</b>：f 越大，λ 越短。</p><div class="gx-board"><svg id="gxStage" class="gx-graph" viewBox="0 0 720 320" tabindex="0" role="application" aria-label="电磁波互动：拖动改变频率f，观察波长λ和波段"><text x="360" y="38" text-anchor="middle" font-size="16" font-weight="700" fill="#3a3a35">频率变，波长跟着变：λ = c / f</text><text x="360" y="90" text-anchor="middle" font-size="12" fill="#6b7280">波长 λ</text><text id="gxLam" x="360" y="138" text-anchor="middle" font-size="40" font-weight="700" fill="#6d28d9">3.00 m</text><rect x="80" y="240" width="347" height="28" fill="#dbeafe"/><rect x="427" y="240" width="213" height="28" fill="#ede9fe"/><text x="253" y="258" text-anchor="middle" font-size="13" fill="#1e3a8a">无线电波</text><text x="533" y="258" text-anchor="middle" font-size="13" fill="#5b21b6">微波</text><polygon id="gxMark" points="360,240 353,228 367,228" fill="#7c3aed"/><text id="gxMarkT" x="360" y="222" text-anchor="middle" font-size="11" fill="#6d28d9">1.0×10⁸ Hz</text><g font-size="10" fill="#6b7280" text-anchor="middle"><text x="80" y="286">10⁶</text><text x="360" y="286">10⁸</text><text x="500" y="286">10⁹</text><text x="640" y="286">10¹⁰ Hz</text></g><text id="gxHint" x="360" y="306" text-anchor="middle" font-size="11" fill="#6b7280">f 增大，λ 减小</text></svg><div class="bar"><span class="lb">频率 f（对数刻度）</span><input type="range" id="gxSl" min="6" max="10" step="0.05" value="8" aria-label="电磁波频率的对数刻度，从1兆赫到10吉赫"></div></div><div class="stats"><div class="st"><div class="k">① 频率 f</div><div class="v" id="gxVf">1.0×10⁸ Hz</div></div><div class="st"><div class="k">② 波长 λ</div><div class="v" id="gxVl">3.00 m</div></div><div class="st"><div class="k">③ 波段</div><div class="v" id="gxVb">短波调频</div></div></div><p class="gx-take">f ×10，λ ÷10：<b>λ 与 f 成反比</b>。</p></figure></section>
<section class="gx-sec" id="d"><h2><span class="sn">04</span>一道题走一遍</h2><p class="gx-h2s">先自己写，再点「下一步」。这题只考一件事：用 λ = c / f 换波长。</p><div class="gx-ex"><p class="ex-t">例题 · 由频率求波长<span class="bdg bdg-must">必考</span></p><p class="ex-q">调频台 f₁ = 100 MHz、雷达 f₂ = 1 GHz，都按真空中的电磁波处理。求波长；f 增大时 λ 怎么变？</p><ol class="steps" id="gxSteps"><li class="step"><p class="s-h">第 1 步 · 统一单位</p><p class="s-b">100 MHz = 1×10⁸ Hz，1 GHz = 1×10⁹ Hz，c = 3.0×10⁸ m/s。</p></li><li class="step" hidden><p class="s-h">第 2 步 · 调频台的波长</p><p class="s-b">λ₁ = c / f₁ = 3.0×10⁸ ÷ 1×10⁸ = <b>3 m</b>。</p></li><li class="step" hidden><p class="s-h">第 3 步 · 雷达的波长</p><p class="s-b">λ₂ = c / f₂ = 3.0×10⁸ ÷ 1×10⁹ = <b>0.3 m</b>。</p></li><li class="step" hidden><p class="s-h">第 4 步 · 看变化</p><p class="s-b">f ×10，λ ÷10。</p></li><li class="step" hidden><p class="s-h">第 5 步 · 下结论</p><p class="s-b">c 不变时 λ 与 f 成反比：<b>f 增大，λ 减小</b>。</p></li></ol><div class="exbar"><button id="gxNext" type="button">下一步</button><span class="cnt" id="gxCnt">1 / 5</span></div><div class="ans" id="gxAns" hidden><p class="ans-t">标准答案（可抄进答题卡）</p><p class="ans-b">λ₁ = <b>3 m</b>，λ₂ = <b>0.3 m</b>；f 增大，λ 减小（λ = c/f）。</p></div></div></section>
<section class="gx-sec" id="e"><h2><span class="sn">05</span>考你会怎么考</h2><p class="gx-h2s">六种问法：产生、介质、公式、波谱、调制、危害。</p><div class="gx-qa"><div class="qac"><p class="q">电磁波是怎样产生的？</p><p class="a"><b>变化的电场和磁场交替产生。</b>变化的电场产生磁场，变化的磁场又产生电场，向外就形成电磁波。</p><svg viewBox="0 0 240 132" role="img" aria-label="变化的电场与磁场交替产生"><text x="52" y="56" text-anchor="middle" font-size="15" font-weight="700" fill="#6d28d9">E 变</text><path d="M80 50h70m-5-4 5 4-5 4" fill="none" stroke="#9aa3ad" stroke-width="1.4"/><text x="184" y="56" text-anchor="middle" font-size="15" font-weight="700" fill="#2563eb">B 变</text><text x="120" y="100" text-anchor="middle" font-size="10" fill="#6b7280">交替产生，向外传播</text></svg></div><div class="qac"><p class="q">传播需要介质吗？</p><p class="a"><b>不需要。</b>电磁波在真空中也能传播，c = 3.0×10⁸ m/s；需要介质的是声波这类机械波。</p><svg viewBox="0 0 240 132" role="img" aria-label="电磁波在真空中也能传播"><rect x="24" y="28" width="192" height="70" rx="10" fill="#fbfcfd" stroke="#cbd5e1" stroke-dasharray="5 4"/><path d="M40 63c10-18 20-18 30 0s20 18 30 0 20-18 30 0 20 18 30 0 20-18 30 0" fill="none" stroke="#7c3aed" stroke-width="2"/></svg></div><div class="qac"><p class="q">c = λf 中的 c 由什么决定？</p><p class="a"><b>由介质决定，与频率无关。</b>同一种介质中不同频率的电磁波速度近似相同，所以 λ 与 f 成反比。</p><svg viewBox="0 0 240 132" role="img" aria-label="波速由介质决定，真空中为光速"><text x="120" y="54" text-anchor="middle" font-size="22" font-weight="700" fill="#6d28d9">c = λ f</text><text x="120" y="82" text-anchor="middle" font-size="10" fill="#3a3a35">c 由介质决定，与 f 无关</text></svg></div><div class="qac"><p class="q">电磁波谱按什么排序？</p><p class="a"><b>按频率由低到高</b>（波长由长到短）：无线电波、红外线、可见光、紫外线、X 射线、γ 射线。</p><svg viewBox="0 0 240 132" role="img" aria-label="电磁波谱按频率由低到高排列"><g font-size="11" font-weight="700" text-anchor="middle"><text x="26" y="54" fill="#1e3a8a">无</text><text x="62" y="54" fill="#b8402f">红</text><text x="98" y="54" fill="#b45309">可</text><text x="134" y="54" fill="#6d28d9">紫</text><text x="170" y="54" fill="#2563eb">X</text><text x="206" y="54" fill="#0f766e">γ</text></g><path d="M18 70h206m-6-4 6 4-6 4" fill="none" stroke="#cbd5e1" stroke-width="1.2"/><text x="120" y="100" text-anchor="middle" font-size="10" fill="#6b7280">频率由低到高</text></svg></div><div class="qac"><p class="q">调制和解调分别是什么？</p><p class="a"><b>调制</b>是把信号加载到高频电磁波上；<b>解调</b>是接收端把信号再取出来。</p><svg viewBox="0 0 240 132" role="img" aria-label="调制把信号加载到高频波上"><text x="34" y="56" text-anchor="middle" font-size="12" fill="#6d28d9">信号</text><text x="120" y="56" text-anchor="middle" font-size="12" fill="#2563eb">调制</text><text x="206" y="56" text-anchor="middle" font-size="12" fill="#6d28d9">发射</text><path d="M58 50h38m-5-4 5 4-5 4" fill="none" stroke="#9aa3ad" stroke-width="1.4"/><path d="M146 50h38m-5-4 5 4-5 4" fill="none" stroke="#9aa3ad" stroke-width="1.4"/><text x="120" y="104" text-anchor="middle" font-size="10" fill="#6b7280">接收端反过来做，就是解调</text></svg></div><div class="qac"><p class="q">电磁波有危害吗？</p><p class="a"><b>过强辐射可能危害健康。</b>防护靠屏蔽、限时、保持距离；正常手机、Wi-Fi 在安全范围内。</p><svg viewBox="0 0 240 132" role="img" aria-label="过强电磁辐射有害，需要防护"><path d="M120 28 176 108H64Z" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.6"/><text x="120" y="88" text-anchor="middle" font-size="26" font-weight="700" fill="#b45309">!</text><text x="120" y="126" text-anchor="middle" font-size="10" fill="#6b7280">屏蔽 · 限时 · 保持距离</text></svg></div></div></section>
<section class="gx-sec" id="f"><h2><span class="sn">06</span>易错清单</h2><p class="gx-h2s">左边是错句，右边是能得分的表述。</p><div class="gx-errs"><div class="er"><p class="er-x">✗ 电磁波传播需要介质。</p><p class="er-v">✓ 电磁波<b>不需要介质</b>，真空中也能传播。</p><p class="er-w">需要介质的是声波这类机械波。</p></div><div class="er"><p class="er-x">✗ 声波也是电磁波。</p><p class="er-v">✓ 声波是<b>机械波</b>，电磁波是变化的电磁场。</p><p class="er-w">两者都能传能量，本质不同。</p></div><div class="er"><p class="er-x">✗ c = λf 中 c 随 f 变化。</p><p class="er-v">✓ 同种介质中 <b>c 由介质决定</b>，与 f 无关。</p><p class="er-w">f 变时 λ 跟着变，c 不变。</p></div><div class="er"><p class="er-x">✗ 所有电磁波的波长都相同。</p><p class="er-v">✓ 频率不同，波长就不同：<b>λ = c / f</b>。</p><p class="er-w">波谱就是按频率（波长）排的。</p></div><div class="er"><p class="er-x">✗ 频率越高，波长越长。</p><p class="er-v">✓ 频率越高，波长<b>越短</b>。</p><p class="er-w">c 不变时 λ 与 f 成反比。</p></div><div class="er"><p class="er-x">✗ 电磁波不能传递能量。</p><p class="er-v">✓ 电磁波<b>能传递能量和信息</b>。</p><p class="er-w">微波炉加热、无线电通信都是证据。</p></div></div></section><div class="gx-foot"><p>人教版《物理》必修第三册（2019年版）第十三章第4节</p></div></div><div class="gx-zoom" id="gxZoom" hidden><span class="gx-zoom-tip">双指放大看细节</span><button class="gx-zoom-x" type="button" aria-label="关闭">✕</button><div id="gxZoomInner"></div></div>

<script>
document.addEventListener("DOMContentLoaded",function(){
var $=GX.$,C=3e8,x=8,SUP="⁰¹²³⁴⁵⁶⁷⁸⁹";
function sup(n){return String(n).split("").map(function(d){return SUP[+d]}).join("")}
function fmtF(f){var e=Math.floor(Math.log10(f)+1e-9);return (f/Math.pow(10,e)).toFixed(1)+"×10"+sup(e)+" Hz"}
function fmtL(l){return l>=100?l.toFixed(0)+" m":l>=1?l.toFixed(2)+" m":l.toFixed(3)+" m"}
function band(f){return f<3e6?"长波":f<3e7?"中波":f<3e8?"短波调频":f<3e9?"分米波":f<3e10?"厘米波":"红外线"}
function render(){
var f=Math.pow(10,x),l=C/f,mx=80+(x-6)*140,tx=Math.min(616,Math.max(104,mx));
$("gxLam").textContent=fmtL(l);
$("gxMark").setAttribute("points",mx.toFixed(1)+",240 "+(mx-7).toFixed(1)+",228 "+(mx+7).toFixed(1)+",228");
$("gxMarkT").setAttribute("x",tx.toFixed(1));$("gxMarkT").textContent=fmtF(f);
$("gxVf").textContent=fmtF(f);$("gxVl").textContent=fmtL(l);$("gxVb").textContent=band(f);
$("gxHint").textContent=Math.abs(x-8)<.03?"100 MHz：调频广播，λ = 3 m":Math.abs(x-9)<.03?"1 GHz：雷达，λ = 0.3 m":Math.abs(x-10)<.03?"10 GHz：厘米波，λ = 0.03 m":"f 增大，λ 减小";
}
var badge=$("gxAp"),apTxt=$("gxApTxt");
function setMode(m){if(!badge)return;badge.classList.toggle("is-auto",m==="auto");badge.classList.toggle("is-manual",m!=="auto");if(apTxt)apTxt.textContent=m==="auto"?"自动演示中":"你接管了"}
render();
window.__ap=AutoPilot.create({mount:$("gxStage"),follow:$("gxSl"),
loop:[{t:0,v:8},{t:2.5,v:8},{t:3.3,v:9},{t:4.5,v:9},{t:5.2,v:10},{t:6.4,v:10},{t:7.0,v:6},{t:8.2,v:6},{t:8.8,v:8},{t:11.3,v:8}],
keys:[6,8,9,10],value:8,min:6,max:10,step:.05,idle:5000,
onChange:function(v){x=v;render()},onMode:setMode});
});
