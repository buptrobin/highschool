<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本原话，翻成人话<span class="bdg bdg-key">原文</span></h2>

<div class="gx-quote">
<p class="q-t">教材 ① · 第一宇宙速度</p>
<p class="q-b">「物体在地面附近绕地球做匀速圆周运动所必须具有的速度，叫做第一宇宙速度，其大小为 7.9 km/s。」</p>
<p class="q-n"><b>人话：</b>贴地转圈的速度 ≈ 7.9 km/s；最小发射、最大环绕都是它。</p>
</div>

<div class="gx-quote">
<p class="q-t">教材 ② · 第二、第三宇宙速度</p>
<p class="q-b">「发射速度达到 11.2 km/s，物体就能脱离地球引力，成为绕太阳运行的人造行星；达到 16.7 km/s，就能飞出太阳系。」</p>
<p class="q-n"><b>人话：</b>7.9 留在球边，11.2 离开地球，16.7 飞出太阳系；都从地面算起。</p>
</div>

<div class="gx-quote">
<p class="q-t">教材 ③ · 卫星的轨道</p>
<p class="q-b">「人造地球卫星绕地球做匀速圆周运动时，万有引力提供向心力：GMm/r² = mv²/r = m(4π²/T²)r。」</p>
<p class="q-n"><b>人话：</b>v = √(GM/r)、T = 2π√(r³/GM)，越高越慢；平面必过地心。</p>
</div>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>

<div class="gx-ex">
<p class="ex-t">例题 · 近地与同步<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">取 R_E = 6.4×10⁶ m、GM = 3.986×10¹⁴ m³/s²、自转周期 24 h。
求近地的 v、T，同步的 r、h、v，并解释「越高越慢」。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 一条式子管到底</p>
<p class="s-b">圆轨道上 <b>GMm/r² = mv²/r = m(4π²/T²)r</b>，解得 <b>v = √(GM/r)</b>、<b>T = 2π√(r³/GM)</b>。
m 被约掉，v、T 与质量无关。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 近地卫星：r 取最小</p>
<p class="s-b">r ≈ R：v = √(3.986×10¹⁴/6.4×10⁶) ≈ <b>7.9 km/s</b>，T = 2πr/v ≈ 5.1×10³ s ≈ <b>84 min</b>，
这也是最大环绕速度。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 同步卫星：T 先定，反解 r</p>
<p class="s-b">T = 8.64×10⁴ s，由 T = 2π√(r³/GM) 得 r ≈ <b>4.2×10⁷ m</b>（≈ 6.6 R_E），
h = r − R_E ≈ <b>3.6×10⁷ m</b>，v = 2πr/T ≈ <b>3.1 km/s</b>。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 「越高越慢」的定量版</p>
<p class="s-b">v ∝ r<sup>-1/2</sup>：r 变 6.6 倍，v 变 1/2.57，7.9 ÷ 2.57 ≈ 3.1 km/s；
T ∝ r<sup>3/2</sup>：84 min × 17 ≈ 24 h。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 反过来查：4.2 的两副面孔</p>
<p class="s-b">r = 4.2×10⁷ m 是<b>同步轨道</b>（24 h）；r = 4.2 R_E = 2.7×10⁷ m 只是<b>12 h 中轨道</b>。
先看单位再动笔。</p>
</li>
</ol>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>考你会怎么考</h2>

<div class="gx-qa">
<div class="qac">
<p class="q">卫星速度由什么决定？</p>
<p class="a"><b>只由中心天体和半径决定</b>：v = √(GM/r)，与质量无关。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="速度只由中心天体和半径决定">

  <text x="120" y="24" font-size="9" text-anchor="middle" fill="#3a3a35">v = √(GM/r)，与 m 无关</text>
</svg>
</div>

<div class="qac">
<p class="q">为什么它既最大环绕又最小发射？</p>
<p class="a"><b>环绕</b>：r 最小取 R_E，v 最大 7.9。<b>发射</b>：还须克服重力做功。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="半径越小环绕速度越大">

  <text x="120" y="24" font-size="9" text-anchor="middle" fill="#3a3a35">r 小 → v 大：7.9 &gt; 5.6</text>
</svg>
</div>

<div class="qac">
<p class="q">同步卫星为什么必须在赤道上方？</p>
<p class="a"><b>两个约束叠加</b>：相对静止 ⇒ T = 24 h、平面垂直地轴；引力指向地心 ⇒ 圆心必是地心。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="同步卫星只能在赤道上方">

</svg>
</div>

<div class="qac">
<p class="q">低轨点火加速，为什么反而变慢？</p>
<p class="a"><b>加速是「抬轨」不是「提速」</b>：抬高后按 v = √(GM/r) 重算，r 大 v 小。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="低轨点火抬升，高轨稳定后更慢">

</svg>
</div>

<div class="qac">
<p class="q">「发射 7.9」和「运行 7.9」一样吗？</p>
<p class="a"><b>不一样</b>：发射从地面算，运行在轨道上算，只有近地轨道相同。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="发射速度与运行速度含义不同">

<div class="qac">
<p class="q">航天员为什么会「飘」？</p>
<p class="a"><b>不是</b>：引力仍在，几乎全部提供向心加速度；与舱壁无挤压，视重为零。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="引力仍在，全部提供向心加速度">
  <circle cx="120" cy="170" r="72" fill="#eef5fc" stroke="#2f6fd0" stroke-width="1.4"/>
  <rect x="86" y="30" width="68" height="46" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
  
  <text x="120" y="20" font-size="9" text-anchor="middle" fill="#6b7280">视重为零 ≠ 不受引力</text>

</div>
</div>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>六个坑，对号入座</h2>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 轨道越高，运行得越快</p>
<p class="er-v">✓ v = √(GM/r)，越高越慢</p>
<p class="er-w">为什么错：把「发射费劲」和「运行越快」混成一句。</p>
</div>
<div class="er">
<p class="er-x">✗ 同步卫星可定点在北京上空</p>
<p class="er-v">✓ 只能定点在赤道正上方</p>
<p class="er-w">为什么错：引力指向地心 ⇒ 平面过地心；静止还要求平面垂直地轴。</p>
</div>
<div class="er">
<p class="er-x">✗ 7.9 是卫星能到达的最大速度</p>
<p class="er-v">✓ 最大环绕、最小发射</p>
<p class="er-w">为什么错：两个「最」的对象不同，发得更高还要更大速度。</p>
</div>
<div class="er">
<p class="er-x">✗ 飘起来是不受引力</p>
<p class="er-v">✓ 引力仍在，全部提供向心加速度</p>
<p class="er-w">为什么错：完全失重看「视重为零」，不是「引力为零」。</p>
</div>
<div class="er">
<p class="er-x">✗ 同步卫星 a 约 9.8 m/s²</p>
<p class="er-v">✓ a = g(R/r)² ≈ 0.23 m/s²</p>
<p class="er-w">为什么错：9.8 是地面附近的值，要除以 6.6²。</p>
</div>
<div class="er">
<p class="er-x">✗ 点火加速后新轨道速度更大</p>
<p class="er-v">✓ 轨道更高，稳定后反而更小</p>
<p class="er-w">为什么错：加速瞬间变快，但轨道被抬高，稳定后按 v = √(GM/r) 重算。</p>
</div>
</div>
</section>

<div class="gx-foot">
<p>教材依据：人教版《物理》必修二（2019 年版）第七章第 4 节。</p>
<p>数值口径：R_E = 6.4×10⁶ m、GM = 3.986×10¹⁴ m³/s²。7.9 / 11.2 / 16.7 km/s 取教材值，
7.89、3.07、84.9 min 为<b>模型值</b>；同步轨道 r = 4.2×10⁷ m 由 T = 24 h 反解，
与 4.2 R_E（2.7×10⁷ m）不同。公式只适用于圆轨道；
三个速度都从地面（r = R_E）起算。</p>
</div>

</div>

<div class="gx-zoom" id="gxZoom" hidden>
  <span class="gx-zoom-tip">双指放大看细节</span>
  <button class="gx-zoom-x" type="button" aria-label="关闭">✕</button>
  <div id="gxZoomInner"></div>
</div>

<script src="../../assets/page.js"></script>
<script src="../../assets/gx.js"></script>
<script src="../../assets/autopilot.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var $ = GX.$;
  var RE = 6.4e6, GM = 3.986e14;
  var sl = $("gxSl"), stage = $("gxStage");
  var apBox = $("gxAp"), apTxt = $("gxApTxt");
  var orbit = $("gxOrbit"), sat = $("gxSat"), rline = $("gxRline"), rlab = $("gxRlab");
  var mk = $("gxMk"), mkT = $("gxMkT");
  var vR = $("gxVr"), vRs = $("gxVrs"), vV = $("gxVv"), vT = $("gxVt"), vS = $("gxVs");
  var stT = $("gxState"), stS = $("gxStateSub");
  var CX = 235, CY = 215, R0 = 62, DR = 10.9;
  var X0 = 500, X1 = 860, YB = 330, VMIN = 2.4, VMAX = 8, HH = 240;

  function render(r) {
    r = +r;
    var rm = r * RE, v = Math.sqrt(GM / rm), T = 2 * Math.PI * rm / v;
    var rad = R0 + (r - 1) * DR, sx = CX + rad * 0.574, sy = CY - rad * 0.819;
    orbit.setAttribute("r", rad.toFixed(1));
    sat.setAttribute("cx", sx.toFixed(1));
    sat.setAttribute("cy", sy.toFixed(1));
    rline.setAttribute("x2", sx.toFixed(1));
    rline.setAttribute("y2", sy.toFixed(1));
    rlab.setAttribute("x", ((CX + sx) / 2 + 6).toFixed(1));
    rlab.setAttribute("y", ((CY + sy) / 2 - 6).toFixed(1));
    rlab.textContent = r.toFixed(1) + " R_E";
    var x = X0 + (r - 1) / 9 * (X1 - X0);
    var y = YB - ((v / 1000) - VMIN) / (VMAX - VMIN) * HH;
    mk.setAttribute("cx", x.toFixed(1));
    mk.setAttribute("cy", y.toFixed(1));
    mkT.setAttribute("x", (x + 10).toFixed(1));
    mkT.setAttribute("y", (y - 8).toFixed(1));
    mkT.textContent = (v / 1000).toFixed(2);
    vR.textContent = (rm / 1e6).toFixed(1) + " × 10⁶ m";
    vRs.textContent = "= " + r.toFixed(1) + " R_E";
    vV.textContent = (v / 1000).toFixed(2) + " km/s";
    vT.textContent = T < 7200 ? (T / 60).toFixed(1) + " min" : (T / 3600).toFixed(1) + " h";
    var col, txt, sub;
    if (Math.abs(r - 1) < 0.06) {
      col = "#2f8a5b"; txt = "近地轨道：v ≈ 7.9 km/s"; sub = "r ≈ R_E，周期最短 84 min";
    } else if (Math.abs(r - 6.6) < 0.09) {
      col = "#2f8a5b"; txt = "同步轨道：T = 24 h"; sub = "r ≈ 4.2×10⁷ m，赤道正上方";
    } else if (Math.abs(r - 4.2) < 0.09) {
      col = "#b8791f"; txt = "中轨道：T ≈ 12 h（不是同步）"; sub = "r ≈ 2.7×10⁷ m，只是 4.2 R_E";
    } else if (r < 6.6) {
      col = "#2f6fd0"; txt = "低中轨道：越高越慢"; sub = "r 变大 → v 变小、T 变大";
    } else {
      col = "#b8402f"; txt = "高轨：越高越慢"; sub = "r 越大 v 越小，发射越费劲";
    }
    vS.textContent = txt;
    stT.textContent = txt;
    stT.setAttribute("fill", col);
    stS.textContent = sub;
    stS.setAttribute("fill", col);
  }

  var ap = AutoPilot.create({
    mount: stage, follow: sl,
    loop: [
      { t: 0, v: 1 }, { t: 2.5, v: 1 }, { t: 3.8, v: 2 }, { t: 5, v: 2 },
      { t: 6.5, v: 4.2 }, { t: 7.7, v: 4.2 }, { t: 9.2, v: 6.6 }, { t: 10.2, v: 6.6 },
      { t: 11.2, v: 10 }, { t: 13.5, v: 1 }
    ],
    keys: [1, 2, 4.2, 6.6, 10],
    value: 1, min: 1, max: 10, step: 0.1, idle: 5000,
    onChange: render,
    onMode: function (m) {
      apBox.className = "gx-ap " + (m === "auto" ? "is-auto" : "is-manual");
      apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
    }
  });
  window.__ap = ap;
  render(sl.value);
});
</script>
</body>
</html>
