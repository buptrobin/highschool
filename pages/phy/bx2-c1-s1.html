<p class="gx-claim">曲线运动只有两句判据：<b>速度沿轨迹切线</b>，<b>合力指向轨迹凹侧</b>。其余结论都是这两句推出来的。</p>
<div class="gx-meta">
  <span><i></i>人教版必修第二册 · 第五章第 1 节</span>
  <span><i></i>高一 · 抛体运动</span>
  <span><i></i>阅读 15 分钟</span>
  <span><i></i>含 1 个互动模型</span>
</div>
<p class="gx-lede">把石子斜着丢出去，轨迹是一条弯线：它一边往前跑，一边被重力不断拽向下方。
这一节真正要分清的是两件事——<b>速率变不变</b>由合力的<b>切向分量</b>决定，<b>方向往哪弯</b>由合力的<b>法向分量</b>决定。
把合力沿切线和法线拆成两个互相垂直的分量，所有关于曲线运动的判断都落在这两个分量上。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">四句话：什么叫曲线运动、速度指向哪、什么条件才会弯、弯向哪一侧。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 曲线运动<span class="q-src">人教版必修第二册 · 第五章第 1 节</span></p>
<p class="q-b">物体的运动轨迹是曲线的运动，叫作曲线运动。</p>
<p class="q-n">→ 关键词是<b>轨迹</b>。轨迹是物体实际经过的路径，不是起点到终点的连线；
判断是不是曲线运动，只看轨迹的形状，与速度大小、与受几个力都无关。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 速度的方向<span class="q-src">人教版必修第二册 · 第五章第 1 节</span></p>
<p class="q-b">质点在某一点的速度方向，沿曲线在这一点的切线方向。</p>
<p class="q-n">→ 切线是一条直线，有正反两个方向；速度指向<b>运动前进的那一侧</b>。
既然每一点的切线方向都不一样，曲线运动的速度方向就时刻在变——这就是<b>曲线运动一定是变速运动</b>的由来。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 做曲线运动的条件<span class="q-src">人教版必修第二册 · 第五章第 1 节</span></p>
<p class="q-b">物体做曲线运动的条件是：物体所受合外力的方向与它的速度方向不在同一直线上。</p>
<p class="q-n">→ 反过来读更好用：合力与速度<b>共线</b>（同向或反向）时，轨迹是直线；
只要两者<b>不共线</b>，轨迹就会弯。合力与速度垂直时，切向分量为零，那一瞬间速率不变，但方向仍在改。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本的表述 · 轨迹向哪边弯<span class="q-src">人教版必修第二册 · 第五章第 1 节</span></p>
<p class="q-b">做曲线运动的物体，其轨迹总是向合外力所指的方向弯曲。</p>
<p class="q-n">→ 换成几何语言：合力指向轨迹的<b>凹侧</b>（弯曲的内侧）。
所以看到一条弯曲轨迹，只要判断出合力方向，就知道它该往哪边弯；反过来，已知轨迹形状也能反推合力大致指向哪一侧。</p>
</div>

<p class="gx-note">这四句话串成一条推理链：<b>合力与速度不共线 → 速度方向不断改变 → 轨迹弯曲 → 弯曲的内侧就是合力所指的凹侧</b>。
考试里凡是问「为什么」「向哪边」，答案都在这条链上，不在公式里。</p>
</section>

<section class="gx-sec" id="b">
<h2><span class="sn">02</span>拆开看</h2>
<p class="gx-h2s">三张图：切线怎么画、合力怎么拆、凹侧在哪一边。</p>

<figure class="gx-fig">
<div class="fig-cap"><span class="fig-no">图 1</span><span class="fig-t">轨迹上每一点的速度，沿该点的切线</span><span class="bdg bdg-must">必考</span></div>
<p class="fig-s">图中是一条弯曲轨迹，A、B 是轨迹上的两个位置。把该点的切线画出来，<b>速度箭头就落在切线上、指向运动前进的一侧</b>。
A 点的速度朝右上方，B 点的速度朝右下方，两个箭头长度画得一样，<b>方向却不同</b>。
速度是矢量，方向变就是速度变，所以曲线运动一定是变速运动，与速率变不变无关。</p>

<p class="gx-take">画速度箭头的唯一依据是<b>该点的切线</b>，不是「从起点指向该点」的那条线。
把速度画成沿轨迹方向（顺着曲线画一根弯箭头）是最常见的错法，箭头必须是直的，且与曲线只交于一点。</p>

<figure class="gx-fig">
<div class="fig-cap"><span class="fig-no">图 2</span><span class="fig-t">合力沿切线、法线拆成两个分量</span><span class="bdg bdg-diff">辨析</span></div>
<p class="fig-s">以速度方向为切线、以垂直速度为法线，把合力 F 拆成 <b>F cos θ</b>（切向）与 <b>F sin θ</b>（法向），θ 是合力与速度的夹角。
切向分量与速度共线，只改变<b>速率</b>；法向分量与速度垂直，只改变<b>方向</b>。
θ = 90° 时切向分量为零，速率在这一瞬间不变，可方向仍在改——这就是速度方向「被拧过去」的机制。</p>

再问「法向分量指向哪一侧」，轨迹往哪边弯也立刻可判。两个问题分开答，不要混成一句。</p>

<figure class="gx-fig">
<div class="fig-cap"><span class="fig-no">图 3</span><span class="fig-t">合力指向凹侧，不指向凸侧</span><span class="bdg bdg-warn">易错</span></div>
<p class="fig-s">同一条弯曲轨迹，左图把合力画在<b>凹侧</b>（弯曲的内侧）：速度箭头在每一瞬间被拉向合力那一侧，轨迹正好沿着这个方向弯，自洽。
右图把合力画在<b>凸侧</b>（外侧）：如果合力朝外，速度应当被拉向外侧，轨迹就该向反方向弯，与图上画出的轨迹自相矛盾。
所以「合力指向凸侧」不是一种少见的运动，而是一种<b>画不出来的运动</b>。</p>

<section class="gx-sec" id="c">
<h2><span class="sn">03</span>自己拖一下<span class="bdg bdg-must">核心</span></h2>
<p class="gx-h2s">v₀ = 6 m/s、F = 10 N、m = 2 kg 的质点，恒力与初速度成 θ 角，拖 θ 看轨迹怎么变。</p>

<figure class="gx-fig">
<div class="fig-cap"><span class="fig-no">互动 1</span><span class="fig-t">θ 决定加速还是减速</span><span class="gx-ap" id="gxAp"><i></i><span id="gxApTxt">自动演示中</span></span></div>
<p class="fig-s">合力大小不变，方向始终与初速度 v₀ 成 θ 角，所以加速度大小恒为 <b>a = F/m = 5 m/s²</b>，方向随 θ 一起转。
它的切向分量 <b>a_t = 5cos θ</b> 管速率，法向分量 <b>a_n = 5sin θ</b> 管方向。轨迹由 <b>r = v₀t + ½at²</b> 直接算出：
θ = 0° 时合力与 v₀ 同向，轨迹是<b>一条直线</b>（越走越快）；θ = 180° 时合力反向，轨迹还是<b>那条直线</b>（越走越慢，1.2 s 时掉头）；
只有 0° &lt; θ &lt; 180°，轨迹才弯成<b>抛物线</b>。</p>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己写，再点「下一步」。这题的关键是「先判运动性质，再分解，最后说弯曲方向」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 恒力下的曲线运动<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">一个质量 m = 2 kg 的质点，以 v₀ = 4 m/s 沿 x 轴正方向运动。从 t = 0 起，它受到一个沿 y 轴正方向、大小 F = 6 N 的恒力，其它力不计。
求 0.5 s 末速度的 x 分量、y 分量和速度大小；并说明这 0.5 s 内轨迹向哪一侧弯曲、速率是变大还是变小。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 先判运动性质，不急着代公式</p>
<p class="s-b">合力沿 y 轴，初速度沿 x 轴，两者<b>互相垂直、不共线</b>，所以质点做<b>曲线运动</b>。
又因为合力是恒力，加速度恒定，所以这是<b>匀变速曲线运动</b>——后面每一问都可以在两个方向上分别用匀变速的式子。
这一步只答「是什么运动」，不写数。</p>
<p class="s-k">用到：合力与速度不共线 → 轨迹是曲线；合力恒定 → 加速度恒定。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 沿两个方向分解</p>
<p class="s-b">x 方向：不受力，a<sub>x</sub> = 0，所以 <b>v<sub>x</sub> = v₀ = 4 m/s 保持不变</b>，x 方向是匀速直线运动。
y 方向：受恒力 F = 6 N，a<sub>y</sub> = F/m = 6/2 = <b>3 m/s²</b>，初速度为零，是初速为零的匀加速直线运动。
两个方向<b>各自独立</b>，这是下一节「运动的合成与分解」的全部基础。</p>
<p class="s-k">用到：运动可以沿两个互相垂直的方向分解，各方向独立计算。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 求 0.5 s 末的分速度</p>
<p class="s-b">x 方向不受力：v<sub>x</sub> = 4 m/s。
y 方向由 v<sub>y</sub> = a<sub>y</sub>t 得 v<sub>y</sub> = 3 × 0.5 = <b>1.5 m/s</b>。
注意 y 方向的初速度是 0，不能把 4 m/s 也带进 y 方向。</p>
<p class="s-k">用到：匀变速直线运动 v = v₀ + at，逐方向各用一次。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 合成速度</p>
<p class="s-b">两个分速度互相垂直，用勾股定理：
v = √(v<sub>x</sub>² + v<sub>y</sub>²) = √(4² + 1.5²) = √18.25 ≈ <b>4.27 m/s</b>，保留两位有效数字为 <b>4.3 m/s</b>。
方向：tan α = v<sub>y</sub>/v<sub>x</sub> = 1.5/4 = 0.375，α ≈ <b>20.6°</b>，即速度与 x 轴正方向夹角约 20.6°，偏向 y 轴一侧。
速度方向与 x 轴不再重合，说明速度方向已经改变。</p>
<p class="s-k">用到：速度的合成用平行四边形定则，垂直时退化为勾股定理。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 回答「向哪侧弯、速率怎么变」</p>
<p class="s-b">弯曲方向看合力：合力沿 <b>+y</b>，轨迹就向 <b>+y 一侧</b>（下侧）凹，速度方向不断向 +y 偏转。
速率看切向分量：t = 0 时合力与速度垂直，切向分量为零，速率暂时不变；之后速度方向逐渐向 +y 偏转，
合力与速度的夹角从 90° 减小，切向分量从 0 变大且与速度同向，所以<b>速率一直在增大</b>：
4 m/s → 4.27 m/s，与第 4 步算出的结果一致。</p>
<p class="s-k">用到：合力指向凹侧；切向分量与速度同向则速率增大。</p>
</li>
</ol>
<div class="exbar">
  <button id="gxNext" type="button">下一步</button>
  <span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">质点所受合力与初速度垂直，二者不共线，质点做曲线运动；合力恒定，故为匀变速曲线运动。<br>
沿 x 方向不受力：v<sub>x</sub> = 4 m/s；沿 y 方向 a<sub>y</sub> = F/m = 6/2 = 3 m/s²，v<sub>y</sub> = a<sub>y</sub>t = 3×0.5 = 1.5 m/s。<br>
0.5 s 末速度 v = √(v<sub>x</sub>² + v<sub>y</sub>²) = √(4² + 1.5²) ≈ <b>4.3 m/s</b>，
方向与 x 轴正方向夹角 α 满足 tan α = 1.5/4，α ≈ <b>20.6°</b>，偏 y 轴一侧。<br>
合力沿 +y 方向，轨迹向 +y 一侧弯曲（该侧为凹侧）；切向分量由零逐渐增大且与速度同向，速率由 4 m/s 增大到 4.3 m/s。</p>
</div>
<p class="gx-note">阅卷高频扣分：把「合力与速度垂直」当成「合力为零」；用 v = v₀ + at 时把 4 m/s 当成 y 方向的初速度；
答弯曲方向时写「向上弯」却没说清是<b>合力所指的那一侧</b>；只算出 4.27 就收笔，不回答「速率变大还是变小」。</p>
</div>
</section>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>考你会怎么考</h2>
<p class="gx-h2s">六种问法，四种都在考「方向变了算不算速度变了」。</p>

<div class="gx-qa">
<div class="qac">
<p class="q">曲线运动一定是变速运动吗？</p>
<p class="a"><b>一定是。</b>速度方向沿切线，而各点切线方向不同，方向变就是速度变。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="曲线上两点速度方向不同，说明速度变化">
  <path d="M 24 104 Q 120 30 216 92" fill="none" stroke="#7c3aed" stroke-width="2.2"/>
  <line x1="60" y1="72" x2="96" y2="42" stroke="#2f8a5b" stroke-width="2"/>
  <polygon points="96,42 90,44 93,49" fill="#2f8a5b"/>
  <line x1="170" y1="66" x2="212" y2="82" stroke="#2f8a5b" stroke-width="2"/>
  <polygon points="212,82 202,78 204,86" fill="#2f8a5b"/>
  <text x="120" y="124" text-anchor="middle" font-size="9.5" fill="#6b7280">方向一直在变 → 变速</text>
</svg>
</div>
<div class="qac">
<p class="q">某点速度方向怎么找？</p>
<p class="a"><b>沿该点切线，指向运动前进的一侧。</b>不是从起点连到该点。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="速度沿切线，不沿割线">
  <path d="M 30 96 Q 120 44 210 82" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <line x1="40" y1="104" x2="150" y2="66" stroke="#cfd4da" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="52" y="118" font-size="8.5" fill="#9aa3ae">割线（错）</text>
  <line x1="120" y1="66" x2="178" y2="42" stroke="#2f8a5b" stroke-width="2.2"/>
  <polygon points="178,42 170,44 173,49" fill="#2f8a5b"/>
  <text x="184" y="38" font-size="9" fill="#1e6640">切线 v</text>
  <circle cx="120" cy="66" r="3.4" fill="#7c3aed"/>
</svg>
</div>
<div class="qac">
<p class="q">合力沿切线方向，物体会怎样？</p>
<p class="a"><b>做直线运动。</b>法向分量为零，速度方向没有理由改变，只是速率在变。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="合力与速度共线时做直线运动">
  <line x1="40" y1="66" x2="200" y2="66" stroke="#2f8a5b" stroke-width="2.2"/>
  <polygon points="200,66 188,60 188,72" fill="#2f8a5b"/>
  <text x="46" y="56" font-size="9" fill="#1e6640">v</text>
  <line x1="40" y1="86" x2="150" y2="86" stroke="#b8791f" stroke-width="2.2"/>
  <polygon points="150,86 138,80 138,92" fill="#b8791f"/>
  <text x="156" y="90" font-size="9" fill="#8a5c14">F</text>
  <text x="120" y="116" text-anchor="middle" font-size="9.5" fill="#6b7280">共线 → 轨迹不弯</text>
</svg>
</div>
<div class="qac">
<p class="q">合力指向凹侧还是凸侧？</p>
<p class="a"><b>凹侧。</b>轨迹总是向合力所指的方向弯曲，弯曲的内侧就是合力那一侧。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="合力指向轨迹凹侧">
  <path d="M 30 104 Q 120 98 200 42" fill="none" stroke="#7c3aed" stroke-width="2.2"/>
  <line x1="118" y1="86" x2="118" y2="40" stroke="#b8791f" stroke-width="2.2"/>
  <polygon points="118,40 113,52 123,52" fill="#b8791f"/>
  <text x="126" y="62" font-size="9" fill="#8a5c14">F</text>
  <text x="120" y="122" text-anchor="middle" font-size="9.5" fill="#1e6640">力在凹侧</text>
</svg>
</div>
<div class="qac">
<p class="q">匀速圆周运动是「匀速运动」吗？</p>
<p class="a"><b>不是。</b>速率不变，但方向时刻在变，所以是变速运动，只是速率恒定。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="匀速圆周运动速度方向时刻改变">
  <circle cx="120" cy="66" r="44" fill="none" stroke="#7c3aed" stroke-width="1.8"/>
  <circle cx="120" cy="22" r="3.4" fill="#7c3aed"/>
  <line x1="124" y1="22" x2="176" y2="22" stroke="#2f8a5b" stroke-width="2"/>
  <polygon points="176,22 164,17 164,27" fill="#2f8a5b"/>
  <circle cx="164" cy="66" r="3.4" fill="#7c3aed"/>
  <line x1="164" y1="70" x2="164" y2="112" stroke="#2f8a5b" stroke-width="2"/>
  <polygon points="164,112 159,100 169,100" fill="#2f8a5b"/>
  <text x="120" y="126" text-anchor="middle" font-size="9.5" fill="#6b7280">速率不变，速度在变</text>
</svg>
</div>
<div class="qac">
<p class="q">曲线运动的合力能等于零吗？</p>
<p class="a"><b>不能。</b>合力为零则加速度为零，物体只能静止或做匀速直线运动。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="合力为零时只能是直线运动">
  <line x1="34" y1="66" x2="204" y2="66" stroke="#2f8a5b" stroke-width="2" stroke-dasharray="8 5"/>
  <polygon points="204,66 192,60 192,72" fill="#2f8a5b"/>
  <text x="120" y="52" text-anchor="middle" font-size="9.5" fill="#1e6640">F = 0 → a = 0</text>
  <text x="120" y="94" text-anchor="middle" font-size="9.5" fill="#6b7280">只能匀速直线（或静止）</text>
</svg>
</div>
</div>
<p class="gx-note">六问归成一条：<b>速度是矢量，方向变也算变；方向的改变只能由垂直于速度的那个力分量提供</b>。
判断任何一道题，先画该点的切线定出 v 的方向，再把合力拆成切向和法向，两句话就答完了。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是卷面上真出现过的错句，右边是能得分的表述。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 曲线运动中，速度的方向沿轨迹方向。</p>
<p class="er-v">✓ 某点的速度方向沿曲线在该点的<b>切线</b>方向。</p>
<p class="er-w">「沿轨迹方向」画出来是一根弯箭头，而速度是矢量，箭头必须是一条直线。</p>
</div>
<div class="er">
<p class="er-x">✗ 做曲线运动的物体，速度大小一定在变化。</p>
<p class="er-v">✓ 速度<b>方向</b>一定变化，大小不一定；匀速圆周运动的速率就不变。</p>
<p class="er-w">把「速度变」理解成「速率变」，是混淆了矢量与标量。</p>
</div>
<div class="er">
<p class="er-x">✗ 只要物体受力，就一定会做曲线运动。</p>
<p class="er-v">✓ 条件是合力方向与速度方向<b>不在同一直线上</b>；共线时仍是直线运动。</p>
<p class="er-w">漏掉了「不共线」三个字，把「受力」当成了「会拐弯」。</p>
</div>
<div class="er">
<p class="er-x">✗ 曲线运动时，合力指向轨迹的凸侧。</p>
<p class="er-v">✓ 合力指向轨迹的<b>凹侧</b>，轨迹向合力所指的方向弯曲。</p>
<p class="er-w">把凹、凸看反了。凸侧是弯出去的那一边，力不可能把人往弯外推。</p>
</div>
<div class="er">
<p class="er-x">✗ 曲线运动一定是匀变速运动。</p>
<p class="er-v">✓ 合力恒定才是匀变速；匀速圆周运动合力方向不断改变，不是匀变速。</p>
<p class="er-w">混淆了「曲线」与「匀变速曲线」：平抛是匀变速曲线运动，圆周运动不是。</p>
</div>
<div class="er">
<p class="er-x">✗ 匀速圆周运动中，速度不变。</p>
<p class="er-v">✓ 速率不变，<b>速度方向时刻改变</b>，所以速度在变，是变速运动。</p>
<p class="er-w">「匀速」修饰的是速率，不是速度；这是矢量与标量混淆的典型。</p>
</div>
</div>
</section>

<p class="gx-note" style="border-top:1px solid var(--line);padding-top:14px">这一节给的是<b>判据</b>，还没有给公式。下一节把「水平方向匀速 + 竖直方向匀变速」两个分运动合成起来，
就得到平抛运动的轨迹；用的正是本节的「速度方向沿切线」与「两个方向独立」。</p>

<div class="gx-foot">
<p>教材依据：人教版《物理》必修第二册（2019 年版）第五章第 1 节「曲线运动」。课文表述按教材原意整理，页码以纸质书为准。</p>
<p>数值口径：互动模型取 v = 6 m/s、F = 10 N、m = 2 kg（题干定值），a = F/m = 5 m/s² 为恒定值；
a_t = a cos θ、a_n = a sin θ 为<b>模型计算值</b>。画面中的紫色轨迹是<b>示意曲线</b>，按固定圆弧画出，不随 θ 求解运动方程，
它的作用只是给出「切线方向即速度方向」这一几何关系。</p>
<p>例题数据（v₀ = 4 m/s、F = 6 N、m = 2 kg、t = 0.5 s）为教材习题常用的一组整数，v ≈ 4.27 m/s 按 √18.25 取两位有效数字为 4.3 m/s。</p>
</div>

</div>

<div class="gx-zoom" id="gxZoom" hidden>
  <span class="gx-zoom-tip">双指放大看细节</span>
  <button class="gx-zoom-x" type="button" aria-label="关闭">✕</button>
  <div id="gxZoomInner"></div>
</div>
</script>
<script src="../../assets/page.js"></script>
<script src="../../assets/gx.js"></script>
<script src="../../assets/autopilot.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var $ = GX.$;
  var stage = $("gxStage");
  var RAD = Math.PI / 180;
  var A = 5;                       // a = F/m = 10/2
  var V0 = 6;                      // 初速度 m/s
  var PSI = -25 * RAD;             // v 的方向（屏幕坐标，y 向下）
  var PX = 96, PY = 182;           // 质点位置
  var FL = 46;                     // F 箭头长度（px）
  var VL = 56;                     // v 箭头长度（px）
  var UX = Math.cos(PSI), UY = Math.sin(PSI);              // 切向单位矢量
  var NX = Math.cos(PSI - Math.PI / 2), NY = Math.sin(PSI - Math.PI / 2); // 法向单位矢量
  var TH = 0;

  function line(id, x1, y1, x2, y2) {
    var n = $(id);
    n.setAttribute("x1", x1.toFixed(1)); n.setAttribute("y1", y1.toFixed(1));
    n.setAttribute("x2", x2.toFixed(1)); n.setAttribute("y2", y2.toFixed(1));
  }
  function head(id, x, y, ux, uy, len, wid) {
    len = len || 9; wid = wid || 4.6;
    var bx = x - len * ux, by = y - len * uy, px = -uy, py = ux;
    $(id).setAttribute("points",
      x.toFixed(1) + "," + y.toFixed(1) + " " +
      (bx + wid * px).toFixed(1) + "," + (by + wid * py).toFixed(1) + " " +
      (bx - wid * px).toFixed(1) + "," + (by - wid * py).toFixed(1));
  }

  function calc(th) {
    var c = Math.cos(th * RAD), s = Math.sin(th * RAD);
    var at = A * c, an = A * s;
    var st, col, bg, sn, hint;
    if (th < 0.5) {
      st = "加速直线"; col = "#2f8a5b"; bg = "#e6f6ee";
      sn = "θ = 0°，合力与 v 同向，法向分量为零";
      hint = "θ = 0°：合力全在切线上，轨迹不弯";
    } else if (th < 89.5) {
      st = "加速弯曲"; col = "#b8791f"; bg = "#fdf3e0";
      sn = "a_t 与 v 同向 → 速率增大；a_n ≠ 0 → 轨迹弯曲";
      hint = "θ ∈ (0°, 90°)：既加速，又转弯";
    } else if (th <= 90.5) {
      st = "速率不变，方向改变"; col = "#2f6fd0"; bg = "#eef5fc";
      sn = "a_t = 0 → 速率瞬时不变；a_n = 5 m/s² → 方向在改";
      hint = "θ = 90°：这一瞬间速率不变，方向仍在改";
    } else if (th < 179.5) {
      st = "减速弯曲"; col = "#b8402f"; bg = "#fbeae7";
      sn = "a_t 与 v 反向 → 速率减小；a_n ≠ 0 → 轨迹弯曲";
      hint = "θ ∈ (90°, 180°)：减速，同时转弯";
    } else {
      st = "减速直线"; col = "#b8402f"; bg = "#fbeae7";
      sn = "θ = 180°，合力与 v 反向，法向分量为零";
      hint = "θ = 180°：合力反向，轨迹是直线";
    }
    return { at: at, an: an, st: st, col: col, bg: bg, sn: sn, hint: hint };
  }

  function render() {
    var th = TH;
    var s = calc(th);
    var ang = PSI - th * RAD;
    var fx = Math.cos(ang), fy = Math.sin(ang);

    // 恒力下的轨迹：r(t) = v0 t + 1/2 a t^2
    var TMAX = 1.4, S = 12;
    var pts = [];
    for (var i = 0; i <= 70; i++) {
      var tt = TMAX * i / 70;
      var xx = PX + V0 * tt * UX + 0.5 * A * tt * tt * fx;
      var yy = PY + V0 * tt * UY + 0.5 * A * tt * tt * fy;
      pts.push(xx.toFixed(1) + " " + yy.toFixed(1));
    }
    $("gxTraj").setAttribute("d", "M " + pts.join(" L "));

    var dots = "";
    for (var j = 0; j <= 7; j++) {
      var td = j * 0.2;
      var dx = PX + V0 * td * UX + 0.5 * A * td * td * fx;
      var dy = PY + V0 * td * UY + 0.5 * A * td * td * fy;
      dots += '<circle cx="' + dx.toFixed(1) + '" cy="' + dy.toFixed(1) +
        '" r="2.4" fill="#7c3aed" opacity=".55"/>';
    }
    $("gxDots").innerHTML = dots;

    $("gxShapeTxt").textContent = (th < 0.5 || th > 179.5) ? "轨迹：直线" : "轨迹：曲线";

    // F 箭头
    var f2x = PX + FL * fx, f2y = PY + FL * fy;
    line("gxF", PX, PY, f2x, f2y);
    head("gxFh", f2x, f2y, fx, fy);
    $("gxFLab").setAttribute("x", (f2x + 11 * fx).toFixed(1));
    $("gxFLab").setAttribute("y", (f2y + 11 * fy + 3).toFixed(1));

    // 切向分量（可正可负）
    var ct = Math.cos(th * RAD);
    var fts = FL * ct;
    var ftx = PX + fts * UX, fty = PY + fts * UY;
    line("gxFt", PX, PY, ftx, fty);
    $("gxFt").style.opacity = Math.abs(ct) > 0.02 ? "1" : "0";
    // 法向分量
    var cnn = Math.sin(th * RAD);
    var fns = FL * cnn;
    var fnx = PX + fns * NX, fny = PY + fns * NY;
    line("gxFn", PX, PY, fnx, fny);
    $("gxFn").style.opacity = Math.abs(cnn) > 0.02 ? "1" : "0";
    // 平行四边形的两条辅助边
    line("gxFtc", ftx, fty, PX + fts * UX + fns * NX, PY + fts * UY + fns * NY);
    line("gxFnc", fnx, fny, PX + fts * UX + fns * NX, PY + fts * UY + fns * NY);

    // θ 圆弧
    var r = 26;
    var ax = PX + r * Math.cos(ang), ay = PY + r * Math.sin(ang);
    var bx = PX + r * UX, by = PY + r * UY;
    $("gxArc").setAttribute("d", "M " + bx.toFixed(1) + " " + by.toFixed(1) +
      " A " + r + " " + r + " 0 0 0 " + ax.toFixed(1) + " " + ay.toFixed(1));
    $("gxArc").style.opacity = th > 4 ? "1" : "0";
    $("gxThLab").style.opacity = th > 4 ? "1" : "0";
    var mid = PSI - th * RAD / 2;
    $("gxThLab").setAttribute("x", (PX + 40 * Math.cos(mid) - 4).toFixed(1));
    $("gxThLab").setAttribute("y", (PY + 40 * Math.sin(mid) + 4).toFixed(1));

    // 1.4 s 末的速度方向
    var ex = PX + V0 * TMAX * UX + 0.5 * A * TMAX * TMAX * fx;
    var ey = PY + V0 * TMAX * UY + 0.5 * A * TMAX * TMAX * fy;
    var vfx = V0 * UX + A * TMAX * fx;
    var vfy = V0 * UY + A * TMAX * fy;
    var vm = Math.sqrt(vfx * vfx + vfy * vfy) || 1;
    var vux = vfx / vm, vuy = vfy / vm;
    line("gxVf", ex, ey, ex + VL * vux, ey + VL * vuy);
    head("gxVfh", ex + VL * vux, ey + VL * vuy, vux, vuy, 8, 4);
    $("gxVfLab").setAttribute("x", (ex + VL * vux + 8).toFixed(1));
    $("gxVfLab").setAttribute("y", (ey + VL * vuy + 3).toFixed(1));

    // 右列数字
    $("gxThBig").textContent = th.toFixed(0) + "°";
    $("gxAtTxt").textContent = (s.at < 0 ? "−" : "") + Math.abs(s.at).toFixed(1) + " m/s²";
    $("gxAnTxt").textContent = s.an.toFixed(1) + " m/s²";
    $("gxStTxt").textContent = s.st;
    $("gxStTxt").setAttribute("fill", s.col);

    var cf = Math.cos(th * RAD), sf = Math.sin(th * RAD);
    $("gxFormula").textContent = "a_t = 5cos " + th.toFixed(0) + "° = " +
      (cf < 0 ? "−" : "") + Math.abs(5 * cf).toFixed(1) +
      "，a_n = 5sin " + th.toFixed(0) + "° = " + (5 * sf).toFixed(1);
    $("gxHint").textContent = s.hint;

    $("gxVa").textContent = th.toFixed(0) + "°";
    $("gxVb").textContent = (s.at < 0 ? "−" : "") + Math.abs(s.at).toFixed(1) + " m/s²";
    $("gxVs").textContent = s.st;
    $("gxVsn").textContent = "a_n = 5sin θ = " + s.an.toFixed(1) + " m/s²";
    $("gxStBox").style.background = s.bg;
    $("gxStBox").style.borderColor = s.col + "44";
    $("gxVs").style.color = s.col;
  }

  var ap = null;
  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  render();
  ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 0 }, { t: 2.4, v: 45 }, { t: 4.8, v: 90 }, { t: 7.3, v: 90 },
           { t: 9.8, v: 135 }, { t: 11.6, v: 180 }, { t: 14.0, v: 0 }],
    keys: [0, 45, 90, 135, 180],
    value: TH, min: 0, max: 180, step: 1,
    idle: 5000,
    onChange: function (v) { TH = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc };
  window.__probe = function () {
    return {
      th: $("gxVa").textContent,
      at: $("gxVb").textContent,
      st: $("gxVs").textContent,
      cnt: $("gxCnt").textContent
    };
  };
});
</script>
</body>
</html>
