<script type="text/markdown" id="md">
<div class="gx">

<div class="gx-kicker">ELI5-HIGH · 讲给要考试的人</div>
<p class="gx-claim">向心加速度只做一件事：<b>把速度的方向掰弯</b>。它永远指向圆心，永远与速度垂直，所以速率一点不变。</p>
<div class="gx-meta">
  <span><i></i>人教版必修第二册 · 第六章第 3 节</span>
  <span><i></i>高一 · 圆周运动</span>
  <span><i></i>阅读 15 分钟</span>
  <span><i></i>含 1 个互动模型</span>
</div>
<p class="gx-lede">匀速圆周运动的「匀速」只修饰<b>速率</b>：物体每秒走过的弧长一样，速度方向却一直在转。
速度是矢量，方向一变，速度就变了，于是必然有加速度。这个加速度没有切向分量，
整条都指向圆心，大小 aₙ = v²/r。本节要练的就三件事：<b>方向认准圆心</b>、<b>公式用对</b>、
<b>v 和 r 谁变时 aₙ 怎么跟着变</b>。</p>

<nav class="gx-toc">

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">四句话：它叫什么、多大、指向哪、为什么说匀速圆周运动是变速运动。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 向心加速度<span class="q-src">人教版必修第二册 · 第六章第 3 节</span></p>
<p class="q-b">做匀速圆周运动的物体，加速度的方向指向圆心，这个加速度叫作向心加速度。</p>
<p class="q-n">→ 名字就是结论：<b>指向圆心</b>。它不是另一种加速度，仍然是合力产生的加速度，
只不过在匀速圆周运动里，合力恰好没有切向分量，全部沿半径指向圆心。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 大小<span class="q-src">人教版必修第二册 · 第六章第 3 节</span></p>
<p class="q-b">向心加速度的大小与线速度、角速度的关系为 aₙ = v²/r = ω²r。</p>
<p class="q-n">→ 两式由 <b>v = ωr</b> 相连，是同一个结论的两种写法：已知线速度用 aₙ = v²/r，
已知角速度（或周期 T）用 aₙ = ω²r = 4π²r/T²。代入前先看清题目给的是 v 还是 ω。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 方向与作用<span class="q-src">人教版必修第二册 · 第六章第 3 节</span></p>
<p class="q-b">向心加速度的方向始终与线速度方向垂直，它只改变线速度的方向，不改变线速度的大小。</p>
<p class="q-n">→ 垂直意味着<b>切向分量为零</b>：沿速度方向没有加速度，速率自然不变；
所有加速度都用来转弯，所以物体被「掰」着走圆弧。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 匀速圆周运动是变速运动<span class="q-src">人教版必修第二册 · 第六章第 3 节</span></p>
<p class="q-b">匀速圆周运动的速度方向不断改变，因此匀速圆周运动是变速运动。</p>
<p class="q-n">→ 「匀速」说的是<b>速率</b>不变，「变速」说的是<b>速度</b>（矢量）在变。
方向不断变，就一定有加速度，aₙ = v²/r ≠ 0。</p>
</div>

<p class="gx-note">四个式子记成一串：<b>aₙ = v²/r = ω²r = 4π²r/T² = vω</b>。
判断「aₙ 变大还是变小」时，先看题目固定的是 v 还是 ω：固定 v 时 aₙ 与 r 成反比，
固定 ω 时 aₙ 与 r 成正比——这是本节最容易翻车的地方。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己写，再点「下一步」。这题的关键是「先认准是 v 变还是 r 变」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 汽车过弯的向心加速度<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">一辆汽车以 v = 20 m/s 的速率通过半径 r = 50 m 的水平弯道（汽车视为质点）。求：
（1）汽车过弯时的向心加速度大小和方向；（2）若车速降到 10 m/s，向心加速度变为多少？
（3）若想把车速提高到 40 m/s，而向心加速度仍不超过 8 m/s²，弯道半径至少要多大？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 先判断运动性质，画出示意</p>
<p class="s-b">汽车在水平面内做<b>匀速圆周运动</b>：速率 20 m/s 不变，轨迹是半径 50 m 的圆弧。
画图时只画两样东西：速度沿<b>切线</b>，向心加速度沿<b>半径指向圆心</b>，两者垂直。
题目给的是 v 和 r，所以用 <b>aₙ = v²/r</b>。</p>
<p class="s-k">用到：匀速圆周运动 → 速率不变、方向变 → 加速度全部指向圆心。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 代入求 aₙ（v = 20 m/s）</p>
<p class="s-b">aₙ = v²/r = 20²/50 = 400/50 = <b>8 m/s²</b>。
方向<b>指向圆心</b>（水平面内、与速度垂直），不是沿切线，也不是沿速度方向。</p>
<p class="s-k">用到：aₙ = v²/r；单位 m²/s² ÷ m = m/s²。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 车速降到 10 m/s</p>
<p class="s-b">aₙ = 10²/50 = 100/50 = <b>2 m/s²</b>，方向仍指向圆心。
注意 20 → 10 是<b>减半</b>，aₙ 却从 8 掉到 2，变成原来的 <b>1/4</b>。</p>
<p class="s-k">用到：v 减半 → aₙ 变 1/4，因为 aₙ ∝ v²。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 看清「平方」这一步</p>
<p class="s-b">若误以为 aₙ ∝ v，会得到「10 m/s 时 aₙ = 4 m/s²」，正好错一倍。
检验办法：把数值代回 aₙ = v²/r 再算一遍，或者用比例式
a₂/a₁ = (v₂/v₁)² = (1/2)² = 1/4，得 a₂ = 8 × 1/4 = 2 m/s²。</p>
<p class="s-k">用到：比例式比直接算更抗错，尤其在有「加倍/减半」字眼的题里。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 反过来求半径（v = 40 m/s，aₙ ≤ 8 m/s²）</p>
<p class="s-b">由 aₙ = v²/r 得 r = v²/aₙ = 40²/8 = 1600/8 = <b>200 m</b>。
也就是半径要做到原来的 4 倍，才扛得住 2 倍的车速——因为 aₙ 跟 v² 走。</p>
<p class="s-k">用到：同一个公式反解 r；「v 加倍、半径要 4 倍」是 aₙ ∝ v² 的直接推论。</p>
</li>
</ol>
<div class="exbar">
  <button id="gxNext" type="button">下一步</button>
  <span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">汽车做匀速圆周运动，向心加速度指向圆心，大小 aₙ = v²/r。<br>
（1）aₙ = 20²/50 = <b>8 m/s²</b>，方向指向圆心（与速度方向垂直）。<br>
（2）aₙ = 10²/50 = <b>2 m/s²</b>，方向仍指向圆心；v 减半，aₙ 变为原来的 1/4。<br>
（3）由 r = v²/aₙ = 40²/8 = <b>200 m</b>，弯道半径至少 200 m。</p>
</div>
<p class="gx-note">阅卷高频扣分：把 aₙ 算成 v/r；把「指向圆心」写成「沿切线」；
v 减半时把 aₙ 也写成减半；第（3）问忘了平方，直接用 r = v/aₙ。</p>
</div>
</section>

<p class="gx-h2s">左边是卷面上真出现过的错句，右边是能得分的表述。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 向心加速度沿切线方向。</p>
<p class="er-v">✓ 向心加速度指向圆心，与线速度垂直。</p>
<p class="er-w">沿切线的是速度方向。加速度的方向由 Δv 决定，而 Δv 在本节里始终指向圆心。</p>
</div>
<div class="er">
<p class="er-x">✗ 向心加速度会改变速度的大小。</p>
<p class="er-v">✓ 它只改变速度的方向，速率保持不变。</p>
<p class="er-w">aₙ 与 v 垂直，沿速度方向的分量为零，所以速率没有变化的原因。</p>
</div>
<div class="er">
<p class="er-x">✗ 用 a = v/r 计算向心加速度。</p>
<p class="er-v">✓ 用 aₙ = v²/r（或 aₙ = ω²r）。</p>
<p class="er-w">v/r 是角速度 ω，单位是 rad/s，不是 m/s²；量纲一眼就能否掉。</p>
</div>
<div class="er">
<p class="er-x">✗ v 加倍，aₙ 也加倍。</p>
<p class="er-v">✓ v 加倍，aₙ 变 4 倍。</p>
<p class="er-w">aₙ ∝ v²：v 乘 2，aₙ 乘 2² = 4。用比例式 a₂/a₁ = (v₂/v₁)² 检查最稳。</p>
</div>
<div class="er">
<p class="er-x">✗ r 加倍，aₙ 也加倍。</p>
<p class="er-v">✓ v 固定时 r 加倍，aₙ 减半。</p>
<p class="er-w">aₙ = v²/r，r 在分母上；只有 ω 固定时（aₙ = ω²r）才是 r 加倍、aₙ 加倍。</p>
</div>
<div class="er">
<p class="er-x">✗ 匀速圆周运动速度不变，所以 a = 0。</p>
<p class="er-v">✓ 速度方向在变，aₙ = v²/r ≠ 0，指向圆心。</p>
<p class="er-w">「匀速」只说明速率不变；速度是矢量，方向变了速度就变了，加速度不为零。</p>
</div>
</div>
</section>

<p class="gx-note" style="border-top:1px solid var(--line);padding-top:14px">下一节把这些结论用到真实场景：
拱桥、凹桥、火车转弯，都是「谁提供向心力、够不够」的问题。</p>

<div class="gx-foot">
<p>教材依据：人教版《物理》必修第二册（2019 年版）第六章第 3 节「向心加速度」。课文引文按教材表述整理，页码以纸质书为准。</p>
<p>数值口径：互动模型固定轨道半径 r = 2 m，线速度 v ∈ [0, 10] m/s（步长 0.1），aₙ = v²/r，T = 2πr/v，π 取 3.1416，所有读数均为<b>模型计算值</b>。v = 0 时物体静止，周期没有定义，页面显示「—」，不参与除法。</p>
<p>图 2、图 3 的曲线按 aₙ = v²/r 绘制；互动画面中箭头长度按数值线性缩放并保留最小可见长度，转动按 0.55 倍角速度放慢，只用于看清方向，不用于读数值。汽车转弯按质点模型处理，未讨论轮胎侧向摩擦的极限。</p>
</div>

</div>

<div class="gx-zoom" id="gxZoom" hidden>
  <span class="gx-zoom-tip">双指放大看细节</span>
  <button class="gx-zoom-x" type="button" aria-label="关闭">✕</button>
  <div id="gxZoomInner"></div>

<script src="../../assets/page.js"></script>
<script src="../../assets/gx.js"></script>
<script src="../../assets/autopilot.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var $ = GX.$;
  var stage = $("gxStage");
  var R = 2, CX = 150, CY = 140, RR = 72;
  var V = 0, theta = -0.6, lastT = 0;

  function calc(raw) {
    var v = Math.abs(raw) < 0.05 ? 0 : raw;
    var a = v * v / R;
    var T = v > 0 ? 2 * Math.PI * R / v : null;
    return { v: v, a: a, T: T };
  }

  function arrow(line, head, x1, y1, x2, y2) {
    line.setAttribute("x1", x1.toFixed(1));
    line.setAttribute("y1", y1.toFixed(1));
    line.setAttribute("x2", x2.toFixed(1));
    line.setAttribute("y2", y2.toFixed(1));
    var dx = x2 - x1, dy = y2 - y1;
    var len = Math.sqrt(dx * dx + dy * dy);
    if (len < 0.5) { head.setAttribute("points", "0,0 0,0 0,0"); return; }
    var ux = dx / len, uy = dy / len, px = -uy, py = ux;
    var bx = x2 - ux * 9, by = y2 - uy * 9;
    head.setAttribute("points",
      x2.toFixed(1) + "," + y2.toFixed(1) + " " +
      (bx + px * 4.4).toFixed(1) + "," + (by + py * 4.4).toFixed(1) + " " +
      (bx - px * 4.4).toFixed(1) + "," + (by - py * 4.4).toFixed(1));
  }

  function show(ids, on) {
    for (var i = 0; i < ids.length; i++) {
      var el = $(ids[i]);
      if (el) el.style.opacity = on ? "1" : "0";
    }
  }

  function render() {
    var now = performance.now();
    var dt = lastT ? Math.min(0.05, (now - lastT) / 1000) : 0;
    lastT = now;

    var s = calc(V);
    theta += (s.v / R) * dt * 0.55;
    if (theta > Math.PI * 2) theta -= Math.PI * 2;
    if (theta < 0) theta += Math.PI * 2;

    var px = CX + RR * Math.cos(theta);
    var py = CY - RR * Math.sin(theta);
    var tx = -Math.sin(theta), ty = -Math.cos(theta);
    var ux = (CX - px) / RR, uy = (CY - py) / RR;

    var dot = $("gxDot");
    dot.setAttribute("cx", px.toFixed(1));
    dot.setAttribute("cy", py.toFixed(1));

    var rad = $("gxRad");
    rad.setAttribute("x2", px.toFixed(1));
    rad.setAttribute("y2", py.toFixed(1));
    var rl = $("gxRlab");
    rl.setAttribute("x", (CX + RR * 0.5 * Math.cos(theta) + tx * 9).toFixed(1));
    rl.setAttribute("y", (CY - RR * 0.5 * Math.sin(theta) + ty * 9 + 3).toFixed(1));

    var vLen = s.v > 0 ? 10 + 44 * (s.v / 10) : 0;
    arrow($("gxVLine"), $("gxVHead"), px, py, px + tx * vLen, py + ty * vLen);
    show(["gxVLine", "gxVHead", "gxVLab"], vLen > 0);
    var vl = $("gxVLab");
    vl.setAttribute("x", (px + tx * (vLen + 10)).toFixed(1));
    vl.setAttribute("y", (py + ty * (vLen + 10) + 3).toFixed(1));

    var aLen = s.a > 0 ? 10 + 44 * Math.min(1, s.a / 50) : 0;
    arrow($("gxAline"), $("gxAHead"), px, py, px + ux * aLen, py + uy * aLen);
    show(["gxAline", "gxAHead", "gxALab"], aLen > 0);
    var al = $("gxALab");
    al.setAttribute("x", (px + ux * (aLen + 10)).toFixed(1));
    al.setAttribute("y", (py + uy * (aLen + 10) + 3).toFixed(1));

    $("gxFormula").textContent =
      "aₙ = v² / r = " + s.v.toFixed(1) + "² / 2 = " + s.a.toFixed(1) + " m/s²";
    $("gxTformula").textContent = s.T === null
      ? "v = 0，T 无定义（物体没有转动）"
      : "T = 2πr / v = 2π×2 / " + s.v.toFixed(1) + " ≈ " + s.T.toFixed(2) + " s";

    if (s.T === null) {
      $("gxState").textContent = "静止：v = 0，aₙ = 0";
      $("gxState").setAttribute("fill", "#6b7280");
      $("gxHint").textContent = "v = 0 时物体不动，T 没有定义";
      $("gxVt").textContent = "—";
      $("gxVt").style.color = "#8e97a4";
      $("gxVsn").textContent = "状态：静止（v = 0，T 无意义）";
    } else {
      $("gxState").textContent = "v 越大，a 增大得越快（aₙ ∝ v²）";
      $("gxState").setAttribute("fill", "#6d28d9");
      $("gxHint").textContent = "同样的 v 增量，速度越大 aₙ 涨得越多";
      $("gxVt").textContent = s.T.toFixed(2) + " s";
      $("gxVt").style.color = "#0b6580";
      $("gxVsn").textContent = "状态：v 越大 a 增大越快";
    }

    $("gxVv").textContent = s.v.toFixed(1) + " m/s";
    $("gxVacc").textContent = s.a.toFixed(1) + " m/s²";
  }

  var ap = null;
  var apBadge = $("gxAp"), apTxt = $("gxApTxt");

  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  render();
  ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 0 }, { t: 1.6, v: 2 }, { t: 3.4, v: 2 }, { t: 5.0, v: 4 },
           { t: 7.0, v: 4 }, { t: 9.5, v: 6 }, { t: 12.0, v: 6 },
           { t: 13.5, v: 10 }, { t: 14.0, v: 10 }],
    keys: [2, 4, 6, 10],
    value: V, min: 0, max: 10, step: 0.1,
    idle: 5000,
    onChange: function (val) { V = val; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc, R: R };
  window.__probe = function () {
    return {
      v: $("gxVv").textContent,
      a: $("gxVacc").textContent,
      T: $("gxVt").textContent,
      st: $("gxVsn").textContent,
      cnt: $("gxCnt").textContent
    };
  };
});
</script>
</body>
