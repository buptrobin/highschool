<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本原话，拆成三句</h2>
<div class="q-src">人教版必修第二册 · 第五章第 2 节</div>

<div class="q">
<p class="q-t">“一个物体同时参与几个运动，这几个运动叫分运动，物体的实际运动叫合运动。”</p>
<p class="q-b">你看到的小船实际走的那条斜线，是<b>合运动</b>；船 relative to 水往对岸走、水带着船往下游走，是两个<b>分运动</b>。实际运动只有一个，分运动是我们为了计算“拆”出来的。</p>
</div>

<div class="q">
<p class="q-t">“运动的合成与分解遵从平行四边形定则。”</p>
<p class="q-b">速度、位移都是矢量，合成时不能直接加减，要画平行四边形：两个分速度作邻边，对角线就是合速度。船头垂直河岸、水又往下冲时，合速度绝不等于 5 + 3 = 8 m/s。</p>
</div>

<div class="q">
<p class="q-t">“两个分运动具有等时性。”</p>
<p class="q-b">船在水里走的 20 s，就是它横渡的 20 s，也是它被水冲下去的 20 s。列方程时，两个方向用<b>同一个 t</b>，这是合成与分解能算题的关键。</p>
</div>

<p class="gx-note">读法：先问“实际运动是哪一个”，再问“它参与了哪几个分运动”，最后才画平行四边形。顺序反了，很容易把船速当成合速度。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己写，再点“下一步”。这题的关键是：先分清“最短时间”和“正对岸”两个目标。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 小船渡河的两个目标<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">河宽 d = 100 m，船在静水中的速度 v船 = 5 m/s，水流速度 v水 = 3 m/s。求：
（1）船头始终垂直河岸时，渡河时间 t₁ 和漂移 x₁；
（2）要使船到达正对岸，船头应偏向上游多少度？渡河时间 t₂ 是多少？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 先拆成两个分运动</p>
<p class="s-b">船同时参与两个运动：<b>船 relative 水</b>的速度 v船（方向由船头决定），<b>水 relative 岸</b>的速度 v水（沿河岸向下游）。船 relative 岸的实际速度是两者的矢量和。
设船头与垂直河岸方向的夹角为 θ（向上游偏为正），则：
横渡分速度 <b>v⊥ = v船cosθ</b>，沿河分速度 <b>v∥ = v水 − v船sinθ</b>。</p>
<p class="s-k">用到：分运动具有等时性；两个方向用同一个 t。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 最短时间：船头垂直河岸</p>
<p class="s-b">θ = 0°，v⊥ = 5 m/s 最大，所以时间最短：
<b>t₁ = d/v⊥ = 100/5 = 20 s</b>。
此时沿河方向只剩水速，漂移 <b>x₁ = v水t₁ = 3 × 20 = 60 m</b>，方向向下游。</p>
<p class="s-k">用到：最短时间看横渡分速度最大，不是看合速度最大。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 正对岸：让沿河分速度为零</p>
<p class="s-b">要到达正对岸，实际速度必须垂直河岸，即沿河分量为零：
<b>v水 − v船sinθ = 0</b>，所以 sinθ = v水/v船 = 3/5 = 0.6，<b>θ = 36.9°</b>。
这就是“船头偏向上游 36.9°”的来历，不是随便估一个角度。</p>
<p class="s-k">用到：正对岸条件是 v船sinθ = v水，θ 从垂直河岸方向量起。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 求正对岸的时间</p>
<p class="s-b">θ = 36.9° 时，横渡分速度只剩
<b>v⊥ = v船cosθ = 5 × 0.8 = 4 m/s</b>。
所以 <b>t₂ = d/v⊥ = 100/4 = 25 s</b>。
正对岸比最短时间多 5 s，因为船头斜着，横渡分量变小了。</p>
<p class="s-k">用到：正对岸时间用 v船cosθ，不能用 v船。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 对照两个结果，写答案</p>
<p class="s-b">最短时间：<b>t₁ = 20 s</b>，漂移 <b>60 m</b>（下游）。
正对岸：<b>θ = 36.9°</b>（船头偏上游），<b>t₂ = 25 s</b>，漂移 0。
两个目标不能同时达到：想快，就要接受被水冲；想正对岸，就得多花 5 s。</p>
<p class="s-k">用到：先判断题目问的是“最短时间”还是“正对岸”，再选公式。</p>
</li>
</ol>
<div class="exbar">
  <button id="gxNext" type="button">下一步</button>
  <span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">设船头与垂直河岸方向的夹角为 θ，向上游偏为正。<br>
（1）θ = 0° 时横渡分速度最大：<b>t₁ = d/v船 = 100/5 = 20 s</b>；漂移 <b>x₁ = v水t₁ = 3 × 20 = 60 m</b>，方向向下游。<br>
（2）正对岸要求沿河分速度为零：v船sinθ = v水，sinθ = 3/5，<b>θ = 36.9°</b>；此时 v⊥ = v船cosθ = 4 m/s，<b>t₂ = 100/4 = 25 s</b>。</p>
</div>
<p class="gx-note">阅卷高频扣分：把 20 s 和 25 s 弄反；正对岸条件写成“船头指向上游”却不给 sinθ = 3/5；把漂移方向写成“上游”。</p>
</div>
</section>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>考你会怎么考</h2>
<p class="gx-h2s">六种问法，一半在考“时间相同、方向独立”。</p>

<div class="gx-qa">
<div class="qac">
<p class="q">合运动的时间等于分运动的时间吗？</p>
<p class="a"><b>等于。</b>船横渡用 20 s，被水冲下去也用 20 s；两个分运动同时开始、同时结束，所以列式时共用一个 t。这就是“等时性”。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="合运动与两个分运动共用同一段时间">
  <line x1="24" y1="104" x2="216" y2="104" stroke="#cfd4da" stroke-width="1.2"/>
  <line x1="24" y1="104" x2="24" y2="28" stroke="#cfd4da" stroke-width="1.2"/>
  <path d="M24 104 L168 104" stroke="#2f8a5b" stroke-width="2"/>
  <path d="M24 104 L24 36" stroke="#2f6fd0" stroke-width="2"/>
  <path d="M24 104 L168 36" stroke="#b8791f" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="88" y="120" font-size="9" fill="#1e6640">v水 t</text>
  <text x="30" y="66" font-size="9" fill="#2f6fd0">v船 t</text>
  <text x="120" y="60" font-size="9" fill="#8a5c14">v合 t</text>
  <text x="120" y="126" text-anchor="middle" font-size="8.5" fill="#6b7280">同一个 t</text>
</svg>
</div>
<div class="qac">
<p class="q">船头垂直河岸，一定能到正对岸吗？</p>
<p class="a"><b>不能。</b>船头垂直河岸只保证横渡分速度最大、时间最短；水会把它冲向下游，漂移 x = v水t。想正对岸，船头必须偏向上游。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="船头垂直河岸时落点偏向下游">
  <line x1="20" y1="28" x2="220" y2="28" stroke="#cfd4da" stroke-width="1.2"/>
  <line x1="20" y1="104" x2="220" y2="104" stroke="#cfd4da" stroke-width="1.2"/>
  <line x1="60" y1="104" x2="60" y2="28" stroke="#2f6fd0" stroke-width="2"/>
  <path d="M60 104 Q100 70 160 28" fill="none" stroke="#b8791f" stroke-width="2" stroke-dasharray="5 3"/>
  <circle cx="160" cy="28" r="4" fill="#b8791f"/>
  <text x="66" y="70" font-size="8.5" fill="#2f6fd0">v船</text>
  <text x="108" y="86" font-size="8.5" fill="#8a5c14">实际路径</text>
  <text x="142" y="120" font-size="8" fill="#6b7280">落点偏下游</text>
</svg>
</div>
<div class="qac">
<p class="q">最短时间的条件是什么？</p>
<p class="a"><b>船头垂直河岸，θ = 0°。</b>此时横渡分速度 v船cosθ 最大，t = d/v船。注意：最短时间不是“合速度最大”，也不是“位移最短”。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="船头垂直河岸时横渡分速度最大">
  <line x1="20" y1="28" x2="220" y2="28" stroke="#cfd4da" stroke-width="1.2"/>
  <line x1="20" y1="104" x2="220" y2="104" stroke="#cfd4da" stroke-width="1.2"/>
  <line x1="80" y1="104" x2="80" y2="28" stroke="#2f6fd0" stroke-width="3"/>
  <polygon points="80,18 74,32 86,32" fill="#2f6fd0"/>
  <line x1="80" y1="104" x2="150" y2="104" stroke="#2f8a5b" stroke-width="2"/>
  <text x="88" y="64" font-size="9" fill="#2f6fd0">v船 全部横渡</text>
  <text x="98" y="120" font-size="8" fill="#1e6640">v水</text>
</svg>
</div>
<div class="qac">
<p class="q">正对岸的条件是什么？</p>
<p class="a"><b>v船sinθ = v水。</b>船头偏向上游，使沿河分速度恰好抵消水速；此时实际速度垂直河岸，t = d/(v船cosθ)。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="船头偏向上游，沿河分量抵消水速">
  <line x1="20" y1="28" x2="220" y2="28" stroke="#cfd4da" stroke-width="1.2"/>
  <line x1="20" y1="104" x2="220" y2="104" stroke="#cfd4da" stroke-width="1.2"/>
  <line x1="100" y1="104" x2="100" y2="28" stroke="#b8791f" stroke-width="2" stroke-dasharray="5 3"/>
  <line x1="100" y1="104" x2="70" y2="58" stroke="#2f6fd0" stroke-width="2.4"/>
  <text x="46" y="76" font-size="8.5" fill="#2f6fd0">v船</text>
  <text x="104" y="66" font-size="8.5" fill="#8a5c14">v合</text>
  <text x="76" y="120" font-size="8" fill="#6b7280">上游偏θ</text>
</svg>
</div>
<div class="qac">
<p class="q">水速变大，最短时间会变吗？</p>
<p class="a"><b>不会。</b>最短时间只由 d 和 v船 决定：t = d/v船。水速变大只改变漂移 x = v水t，让落点更偏下游；横渡本身不受影响。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="水速变大，横渡时间不变但漂移变大">
  <line x1="20" y1="28" x2="220" y2="28" stroke="#cfd4da" stroke-width="1.2"/>
  <line x1="20" y1="104" x2="220" y2="104" stroke="#cfd4da" stroke-width="1.2"/>
  <line x1="60" y1="104" x2="60" y2="28" stroke="#2f6fd0" stroke-width="2"/>
  <path d="M60 104 L120 28" fill="none" stroke="#2f8a5b" stroke-width="2"/>
  <path d="M60 104 L180 28" fill="none" stroke="#b8791f" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="70" y="70" font-size="8" fill="#2f6fd0">t 相同</text>
  <text x="130" y="60" font-size="8" fill="#8a5c14">水速大</text>
  <text x="76" y="120" font-size="8" fill="#6b7280">漂移更大</text>
</svg>
</div>
<div class="qac">
<p class="q">合速度一定比分速度大吗？</p>
<p class="a"><b>不一定。</b>两个分速度方向相反时，合速度可能比分速度小。例如船头偏上游很陡，沿河分量与水流反向，合速度只剩 2.83 m/s，小于船速 5 m/s。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="两个分速度方向相反时合速度可能更小">
  <line x1="30" y1="100" x2="210" y2="100" stroke="#5a6472" stroke-width="1.2"/>
  <line x1="30" y1="100" x2="140" y2="100" stroke="#2f6fd0" stroke-width="2.4"/>
  <polygon points="152,100 136,94 136,106" fill="#2f6fd0"/>
  <line x1="140" y1="100" x2="80" y2="100" stroke="#2f8a5b" stroke-width="2.4"/>
  <polygon points="68,100 84,94 84,106" fill="#2f8a5b"/>
  <text x="42" y="88" font-size="8.5" fill="#2f6fd0">v1</text>
  <text x="96" y="118" font-size="8.5" fill="#1e6640">v2 反向</text>
  <text x="120" y="126" text-anchor="middle" font-size="8" fill="#6b7280">合速度 = |v1 − v2|</text>
</svg>
</div>
</div>
<p class="gx-note">六问归成一条：<b>横渡看垂直分量，偏航看沿河分量，两个方向共用 t</b>。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>六条易错，逐条改</h2>

<div class="er">
<p class="er-x">✗ 船速 5 m/s、水速 3 m/s，合速度就是 8 m/s。</p>
<p class="er-v">✓ 两个速度垂直时，v合 = √(5² + 3²) ≈ 5.83 m/s。</p>
<p class="er-w">8 m/s 只在船头与水流同向时成立；渡河时两者通常垂直。</p>
</div>
<div class="er">
<p class="er-x">✗ 船头垂直河岸，船一定到正对岸。</p>
<p class="er-v">✓ 船头垂直只保证横渡分速度最大；水会把它冲向下游。</p>
<p class="er-w">要正对岸，必须让 v船sinθ = v水，船头偏向上游。</p>
</div>
<div class="er">
<p class="er-x">✗ 正对岸的时间也用 t = d/v船。</p>
<p class="er-v">✓ 正对岸时 t = d/(v船cosθ)，因为横渡分速度只剩 v船cosθ。</p>
<p class="er-w">θ = 36.9° 时 cosθ = 0.8，t = 100/4 = 25 s，不是 20 s。</p>
</div>
<div class="er">
<p class="er-x">✗ 水速越大，渡河时间越长。</p>
<p class="er-v">✓ 最短时间只由 d 和 v船 决定，与水速无关。</p>
<p class="er-w">水速变大只让漂移变大；横渡分速度不变，时间就不变。</p>
</div>
<div class="er">
<p class="er-x">✗ 合速度一定大于每一个分速度。</p>
<p class="er-v">✓ 分速度反向时，合速度可能小于任一分速度。</p>
<p class="er-w">矢量合成看方向，不看“两个数相加”。</p>
</div>
<div class="er">
<p class="er-x">✗ 正对岸时船头指向上游就行，角度随便。</p>
<p class="er-v">✓ 角度由 sinθ = v水/v船 唯一确定；本题 θ = 36.9°。</p>
<p class="er-w">角度不够，船会被冲下去；角度太大，船会偏到上游。</p>
</div>

<p class="gx-note">把这一页的图 2 和图 3 并排看：同样是“过河”，目标不同，船头方向和时间都不同。考试先圈出题目问的是哪一个。</p>
</section>

<div class="gx-zoom" id="gxZoom" hidden>
  <span class="gx-zoom-tip">双指放大看细节</span>
  <button class="gx-zoom-x" type="button" aria-label="关闭">✕</button>

<script src="../../assets/page.js"></script>
<script src="../../assets/gx.js"></script>
<script src="../../assets/autopilot.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var $ = GX.$;
  var D = 100, VB = 5, VC = 3, RAD = Math.PI / 180;
  var TH = 0;
  var stage = $("gxStage");

  function calc(th) {
    var c = Math.cos(th * RAD), s = Math.sin(th * RAD);
    var t = D / (VB * c);
    var x = (VC - VB * s) * t;
    var v = Math.sqrt(Math.pow(VB * c, 2) + Math.pow(VC - VB * s, 2));
    var st, col, note;
    if (th < 0.5) {
      st = "最短时间：船头垂直河岸"; col = "#2f8a5b";
      note = "状态：最短时间（船头垂直河岸），落点偏下游 " + x.toFixed(0) + " m。";
    } else if (Math.abs(x) < 0.6) {
      st = "正对岸：船头偏上游"; col = "#2f6fd0";
      note = "状态：正对岸，漂移 ≈ 0；船头偏上游 " + th.toFixed(1) + "°。";
    } else if (x < 0) {
      st = "偏上游：船头偏得太多"; col = "#b8791f";
      note = "状态：落点偏上游 " + Math.abs(x).toFixed(0) + " m；θ 再小一点才能正对岸。";
    } else {
      st = "偏下游：船头偏得不够"; col = "#b8402f";
      note = "状态：落点仍偏下游 " + x.toFixed(0) + " m；θ 再大一点才能正对岸。";
    }
    return { t: t, x: x, v: v, st: st, col: col, note: note };
  }

  function arrow(id, hid, x1, y1, x2, y2) {
    var n = $(id);
    n.setAttribute("x1", x1.toFixed(1)); n.setAttribute("y1", y1.toFixed(1));
    n.setAttribute("x2", x2.toFixed(1)); n.setAttribute("y2", y2.toFixed(1));
    var ux = x2 - x1, uy = y2 - y1, L = Math.sqrt(ux * ux + uy * uy) || 1;
    ux /= L; uy /= L;
    var bx = x2 - 11 * ux, by = y2 - 11 * uy, px = -uy, py = ux;
    $(hid).setAttribute("points",
      x2.toFixed(1) + "," + y2.toFixed(1) + " " +
      (bx + 4.5 * px).toFixed(1) + "," + (by + 4.5 * py).toFixed(1) + " " +
      (bx - 4.5 * px).toFixed(1) + "," + (by - 4.5 * py).toFixed(1));
  }

  function render() {
    var s = calc(TH);
    var c = Math.cos(TH * RAD), sn = Math.sin(TH * RAD);
    var bx = 70, by = 250;
    var ex = bx - 70 * sn, ey = by - 70 * c;
    arrow("gxBoat", "gxBoatH", bx, by, ex, ey);
    $("gxBoatT").setAttribute("x", (Math.max(12, ex - 4)).toFixed(1));
    $("gxBoatT").setAttribute("y", (ey + 16).toFixed(1));

    arrow("gxWater", "gxWaterH", ex, ey, ex + 42, ey);
    $("gxWaterT").setAttribute("x", (Math.min(318, ex + 14)).toFixed(1));
    $("gxWaterT").setAttribute("y", (ey - 8).toFixed(1));

    var rx = ex + 42, ry = ey;
    arrow("gxRes", "gxResH", bx, by, rx, ry);
    $("gxResT").setAttribute("x", (rx + 7).toFixed(1));
    $("gxResT").setAttribute("y", (ry + 12).toFixed(1));

    $("gxThTxt").textContent = TH.toFixed(1) + "°";
    $("gxVt").textContent = s.t.toFixed(1) + " s";
    $("gxVx").textContent = (s.x >= 0 ? "+" : "−") + Math.abs(s.x).toFixed(1) + " m";
    $("gxVv").textContent = s.v.toFixed(2) + " m/s";
    $("gxState").textContent = s.st;
    $("gxState").setAttribute("fill", s.col);
    $("gxTake").textContent = s.note;
    $("gxStateNote").textContent = s.note;
  }

  var ap = null;
  function setMode(m) {
    var b = $("gxAp"), t = $("gxApTxt");
    if (!b) return;
    b.classList.toggle("is-auto", m === "auto");
    b.classList.toggle("is-manual", m !== "auto");
    if (t) t.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  render();
  ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 0 }, { t: 2, v: 0 }, { t: 4, v: 20 }, { t: 6.5, v: 20 },
           { t: 8.5, v: 36.9 }, { t: 11, v: 36.9 }, { t: 13, v: 60 }, { t: 14.5, v: 0 }],
    keys: [0, 20, 36.9, 60],
    value: TH, min: 0, max: 60, step: 0.1,
    idle: 5000,
    onChange: function (v) { TH = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc };
});
</script>
</body>
