<script type="text/markdown" id="md">
<div class="gx">

<p class="gx-claim">功是<strong>过程量</strong>，动能是<strong>状态量</strong>：<b>合外力做了多少功，动能就变多少</b>，加速度与时间都不用管。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本原话<span class="bdg bdg-key">基础</span></h2>
<p class="gx-h2s">三句话，考试只考它们的边界。</p>

<div class="gx-quote">
  <p class="q-t">表述一 · 动能<span class="q-src">必修二 8.3</span></p>
  <p class="q-b">物体由于运动而具有的能叫<b>动能</b>，<b>Eₖ = ½mv²</b>，单位焦耳（J）。</p>
  <p class="q-n">人话：只认<b>质量</b>和<b>速率</b>；向左、向右 3 m/s 动能一样。</p>
</div>

<div class="gx-quote">
  <p class="q-t">表述二 · 动能定理<span class="q-src">必修二 8.3</span></p>
  <p class="q-b">合外力对物体做的功，等于物体<b>动能的变化</b>：<b>W合 = Eₖ₂ − Eₖ₁ = ΔEₖ</b>。</p>
  <p class="q-n">人话：W 是过程，ΔEₖ 是结果（末减初）。</p>
</div>

<div class="gx-quote">
  <p class="q-t">表述三 · 动能是标量<span class="q-src">教材旁批 + 习题归纳</span></p>
  <p class="q-b">动能是<b>标量</b>，只有大小没有方向，恒有 <b>Eₖ ≥ 0</b>；动能变化量可正可负。</p>
  <p class="q-n">人话：动能不能为负、不能分解；刹车 ΔEₖ &lt; 0。</p>
</div>

<p class="gx-note">接口：<b>Eₖ = ½mv²</b> 算「有多少」，<b>W = ΔEₖ</b> 算「变了多少」。</p>
</section>

<section class="gx-sec" id="c">
<h2><span class="sn">03</span>自己拖一下<span class="bdg bdg-must">核心</span></h2>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己写，再点「下一步」：先算总功，再让总功等于动能变化。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 恒力推木块<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">m = 2 kg 的木块静止在光滑水平面上，用 F = 10 N 的水平恒力推它，位移 x = 5 m。求功、末速度；位移加倍后各变几倍？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 定规律</p>
<p class="s-b">水平面光滑，竖直方向两力抵消，<b>合外力就是 F = 10 N</b>。已知力和位移、要末速度——用<b>动能定理</b>。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 算总功</p>
<p class="s-b">F 与位移同向，夹角 0°，W = Fx = 10 × 5 = <b>50 J</b>，正功。反向则做 −50 J，<b>符号由夹角定</b>。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 代入求 v</p>
<p class="s-b">Eₖ₁ = 0，Eₖ₂ = ½mv²。由 50 = ½ × 2 × v² 得 <b>v = √50 ≈ 7.07 m/s</b>，不是 25。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 验算</p>
<p class="s-b">a = F/m = 5 m/s²，v² = 2ax = 50，同样 7.07 m/s，两法自洽。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 位移加倍</p>
<p class="s-b">x = 10 m 时 W = <b>100 J</b>，<b>功加倍</b>（W ∝ x）；再由 100 = ½ × 2 × v² 得 v = <b>10 m/s</b>，是 7.07 的 <b>√2 ≈ 1.41 倍</b>。<b>W 加倍 → v 变 √2 倍</b>。</p>
</li>
</ol>
<div class="exbar">
  <button id="gxNext" type="button">下一步</button>
  <span class="cnt" id="gxCnt">1 / 5</span>
  </div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">答案</p>
<p class="ans-b">（1）W = <b>50 J</b>；（2）v = √50 ≈ <b>7.07 m/s</b>；（3）x 加倍 → W = <b>100 J</b>（2 倍）、v = <b>10 m/s</b>（√2 ≈ 1.41 倍）。<b>功随位移线性增长，速率随功按平方根增长。</b></p>
</div>
</div>
</section>

    <circle cx="42" cy="96" r="6" fill="#5b6470"/><circle cx="72" cy="96" r="6" fill="#5b6470"/>
    <text x="57" y="82" class="m f8">10 m/s</text>
    <path d="M138 76H92" stroke="#b8402f" stroke-width="2.2"/><polygon points="80,76 94,70 94,82" fill="#b8402f"/>
    <text x="118" y="68" class="m r f8">f</text>
    
  </svg>
  <p class="a"><b>−1.0×10⁵ J。</b>W = −fx = −5000 × 20。</p>
</div>
<div class="qac">
  <p class="q">6. 同速率不同方向，动能相同？</p>
  <svg viewBox="0 0 240 132">
    <circle cx="100" cy="66" r="7" fill="#7c3aed"/>
    <path d="M100 59V26" stroke="#b8402f" stroke-width="2.4"/><polygon points="100,16 95,30 105,30" fill="#b8402f"/>
    <path d="M107 66h44" stroke="#b8791f" stroke-width="2.4"/><polygon points="162,66 148,61 148,71" fill="#b8791f"/>

    <text x="128" y="58" class="m y">5 m/s</text>
    <text x="120" y="104" class="m d">Eₖ = ½mv²，与方向无关</text>
    
  </svg>
  <p class="a"><b>相同。</b>动能是标量。</p>
</div>
</div>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>六个错法<span class="bdg bdg-warn">易错</span></h2>
<p class="gx-h2s">本节选择题最常见的六个坑。</p>

<div class="gx-errs">
<div class="er">
  <p class="er-x">✗ 动能可以为负。</p>
  <p class="er-v">✓ Eₖ = ½mv² ≥ 0，最小是 0。</p>
  <p class="er-w">为什么错：v 在公式里是<b>平方</b>。</p>
</div>
<div class="er">
  <p class="er-x">✗ 速度方向变，动能一定变。</p>
  <p class="er-v">✓ 速率不变（匀速圆周）时动能不变。</p>
  <p class="er-w">为什么错：动能只看速度的<b>大小</b>，不看方向。</p>
</div>
<div class="er">
  <p class="er-x">✗ W = ΔEₖ 中的 W 是某一个力的功。</p>
  <p class="er-v">✓ 必须是<b>合外力</b>的功或各力功的<b>代数和</b>。</p>
  <p class="er-w">为什么错：漏掉某个力的功，ΔEₖ 就对不上。</p>
</div>
<div class="er">
  <p class="er-x">✗ 动能定理只适用于恒力直线。</p>
  <p class="er-v">✓ 变力、曲线运动同样成立，W 取总功。</p>
  <p class="er-w">为什么错：它与力的性质和轨迹形状无关。</p>
</div>
<div class="er">
  <p class="er-x">✗ 速度加倍，动能加倍。</p>
  <p class="er-v">✓ 速度加倍，动能变 <b>4 倍</b>；动能加倍，速度只变 √2 倍。</p>
  <p class="er-w">为什么错：Eₖ ∝ v² 是二次关系。</p>
</div>
<div class="er">
  <p class="er-x">✗ 摩擦力一定做负功。</p>
  <p class="er-v">✓ <b>静摩擦</b>可以做正功（传送带带动物体）。</p>
  <p class="er-w">为什么错：判功看<b>力与位移的夹角</b>，不看力的名称。</p>
</div>
</div>

<p class="gx-foot">口径：互动与例题统一取 m = 2 kg、F = 10 N、水平面光滑、初速 0，W = Fx、v = √(10x)，为模型计算值（v 保留两位小数），不计空气阻力；若考虑摩擦，须把 f 的负功计入 W合。表述据人教版必修第二册第八章第 3 节整理。</p>
</section>

<script>
document.addEventListener("DOMContentLoaded", function () {
  var $ = GX.$;
  var sl = $("gxSl"), stage = $("gxStage");
  var vx = $("gxVx"), vw = $("gxVw"), vv = $("gxVv"), vs = $("gxVs");
  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  var M = 2, F = 10;
  function att(id, k, v) { var n = $(id); if (n) n.setAttribute(k, v); }
  function f1(v) { return (Math.round(v * 10) / 10).toFixed(1); }
  function f2(v) { return (Math.round(v * 100) / 100).toFixed(2); }
  function render(x) {
    x = GX.clamp(x, 0, 10);
    var W = F * x, v = Math.sqrt(2 * W / M), px = 40 + 30 * x, mv = x > 0.05;
    att("gxBlock", "x", px - 15);
    att("gxFa", "d", "M" + (px + 15) + " 115h36");
    att("gxFh", "points", (px + 59) + ",115 " + (px + 45) + ",110 " + (px + 45) + ",120");
    att("gxFl", "x", px + 35);
    att("gxVa", "d", "M" + (px - 6) + " 96h24");
    att("gxVh", "points", (px + 24) + ",96 " + (px + 12) + ",92 " + (px + 12) + ",100");
    att("gxVl", "x", px + 6);
    att("gxBar", "width", (2.72 * W).toFixed(1));
    $("gxFormula").textContent = "W = 10 × " + f1(x) + " = " + f1(W) + " J，v = " + f2(v) + " m/s";
    $("gxHint").textContent = mv
      ? (x >= 9.95 ? "x = 10 m：W = 100 J，v = 10 m/s" : "W 全部变成动能，ΔEk = W = " + f1(W) + " J")
      : "x = 0：静止，合外力还没做功";
    vx.textContent = f1(x) + " m";
    vw.textContent = f1(W) + " J";
    vv.textContent = f2(v) + " m/s";
    vs.textContent = mv ? "W 全部变成动能" : "静止：W = 0，Ek = 0";
  }
  var ap = AutoPilot.create({
    mount: stage, follow: sl, keys: [0, 2, 5, 10],
    loop: [{ t: 0, v: 0 }, { t: 3, v: 5 }, { t: 5.5, v: 5 }, { t: 8.5, v: 10 }, { t: 11, v: 0 }],
    value: 0, min: 0, max: 10, step: 0.1, idle: 5000,
    onChange: render,
    onMode: function (m) {
      if (apBadge) apBadge.className = "gx-ap " + (m === "auto" ? "is-auto" : "is-manual");
      if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
    }
  });
  window.__ap = ap;
  sl.addEventListener("input", function () { render(parseFloat(sl.value)); });
  render(parseFloat(sl.value) || 0);
});
</script>
