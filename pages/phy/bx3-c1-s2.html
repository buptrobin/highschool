<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">三条：定律原话、表达式与常量、点电荷这个模型。</p>

<div class="gx-quote">
<p class="q-t">课本表述 · 库仑定律<span class="q-src">人教版必修第三册 · 第九章第2节</span></p>
<p class="q-b">真空中两个静止点电荷之间的相互作用力，与它们的电荷量的乘积成正比，与它们距离的二次方成反比，作用力的方向在它们的连线上。</p>
<p class="q-n">→ 人话：力 = 两个电荷量相乘 ÷ 距离平方，方向沿两点连线。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本表述 · 表达式与常量<span class="q-src">人教版必修第三册 · 第九章第2节</span></p>
<p class="q-b">F = k q₁q₂/r²，其中 k = 9.0×10⁹ N·m²/C²，叫静电力常量。</p>
<p class="q-n">→ 人话：k 是写死的常数；算大小代<b>绝对值</b>，方向另判。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本表述 · 点电荷<span class="q-src">人教版必修第三册 · 第九章第2节</span></p>
<p class="q-b">当带电体之间的距离比它们自身的大小大得多，以致形状、大小及电荷分布对作用力的影响可以忽略时，可看作点电荷。</p>
<p class="q-n">→ 人话：点电荷是<b>理想化模型</b>，条件是「离得远」，不是「体积小」。</p>
</div>

<p class="gx-note">一条链：<b>先判模型 → 代 F = kq₁q₂/r² 算大小 → 按同斥异吸定方向</b>。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己动笔，再点「下一步」。这题考「算大小 + 用平方反比省一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 两点电荷之间的力<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">真空中有两个静止点电荷，q₁ = 2×10⁻⁶ C，q₂ = 3×10⁻⁶ C，相距 r = 0.3 m，k = 9.0×10⁹ N·m²/C²。<br>
(1) 求静电力大小；(2) 若距离增大到 0.6 m，静电力变为多少？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 先判模型能不能用</p>
<p class="s-b">真空、静止、<b>点电荷</b>三条都满足：0.3 m 远大于带电体线度，形状与电荷分布的影响可忽略，才能代公式。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 列式，只算大小</p>
<p class="s-b"><b>F = k q₁q₂ / r²</b>，q₁、q₂ 取<b>绝对值</b>；方向另判。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 代数字算第 (1) 问</p>
<p class="s-b">kq₁q₂ = 9.0×10⁹ × 2×10⁻⁶ × 3×10⁻⁶ = 5.4×10⁻² N·m²；<br>
F = 5.4×10⁻² / 0.3² = 5.4×10⁻² / 0.09 = <b>0.6 N</b>。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 用平方反比省掉重算</p>
<p class="s-b">r 从 0.3 m 到 0.6 m 是<b>加倍</b>；F ∝ 1/r²，F 变为原来的 1/4：F′ = 0.6 / 4 = <b>0.15 N</b>。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 换条路校验，写进答题卡</p>
<p class="s-b">直接代 r = 0.6 m：5.4×10⁻² / 0.36 = 0.15 N，两条路一致。要方向就补「异种电荷相互吸引，沿连线指向对方」。</p>
<p class="s-k">用到：点电荷模型 + F = kq₁q₂/r² + F ∝ 1/r²</p>
</li>
</ol>
<div class="exbar">
  <button id="gxNext" type="button">下一步</button>
  <span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">(1) 由库仑定律 F = kq₁q₂/r²，得 F = 9.0×10⁹×2×10⁻⁶×3×10⁻⁶ / 0.3² = <b>0.6 N</b>。<br>
(2) 由 F ∝ 1/r²，r 加倍则 F 变为原来的 1/4，得 F′ = 0.6/4 = <b>0.15 N</b>。</p>
</div>
<p class="gx-note">扣分点：q 代成带符号的数再取「负的力」；r 量成两球表面间距；把 0.6 N 直接除以 2。</p>
</div>
</section>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>考你会怎么考</h2>
<p class="gx-h2s">六种问法，一半在问「什么情况下这个式子成立」。</p>

<div class="gx-qa">
<div class="qac">
<p class="q">什么情况下带电体能当点电荷？</p>
<p class="a"><b>距离远大于自身大小。</b>形状、大小、电荷分布的影响可忽略时才算。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="距离远大于自身尺寸">
  <circle class="cc" cx="68" cy="58" r="9"/>
  <circle class="cc" cx="172" cy="58" r="9"/>
  <line x1="68" y1="92" x2="172" y2="92" stroke="#8a5c14" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text class="s5" x="120" y="110" text-anchor="middle">r 远大于自身大小</text>
</svg>
</div>
<div class="qac">
<p class="q">r 趋近 0，F 会变成无穷大吗？</p>
<p class="a"><b>不会，不能外推。</b>r 与带电体尺寸相当时模型已失效。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="r 很小时模型失效">
  <line x1="30" y1="112" x2="212" y2="112" stroke="#8e97a4" stroke-width="1.4"/>
  <polyline points="124,112 150,76 170,52 190,34" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <line x1="124" y1="112" x2="124" y2="26" stroke="#b8402f" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text class="s6" x="130" y="30">模型失效</text>
</svg>
</div>
<div class="qac">
<p class="q">方向怎么定？</p>
<p class="a"><b>看电性：同斥异吸。</b>力落在两电荷的连线上。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="同斥异吸">
  <circle class="cc" cx="74" cy="40" r="12"/>
  <circle class="cc" cx="112" cy="40" r="12"/>
  <line class="fa" x1="60" y1="40" x2="44" y2="40"/>
  <polygon class="fh" points="32,40 44,36 44,44"/>
  <line class="fa" x1="126" y1="40" x2="142" y2="40"/>
  <polygon class="fh" points="154,40 142,36 142,44"/>
  <circle class="cc" cx="74" cy="92" r="12"/>
  <circle class="cn" cx="150" cy="92" r="12"/>
  <line class="fa" x1="88" y1="92" x2="110" y2="92"/>
  <polygon class="fh" points="122,92 110,88 110,96"/>
</svg>
</div>
<div class="qac">
<p class="q">k 的单位是什么？</p>
<p class="a"><b>N·m²/C²。</b>由 F = kq₁q₂/r² 反推，k 是常量。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="k 的单位">
  <rect x="34" y="44" width="172" height="40" rx="9" fill="#f5f3ff" stroke="#d8ccfb" stroke-width="1.4"/>
  <text x="120" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">N·m²/C²</text>
</svg>
</div>
<div class="qac">
<p class="q">和万有引力比，像在哪、不像在哪？</p>
<p class="a"><b>像在</b>平方反比、沿连线；<b>不像在</b>可斥可吸、强度大得多。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="库仑力远大于万有引力">
  <rect x="46" y="46" width="150" height="14" rx="5" fill="#7c3aed"/>
  <text class="s6" x="46" y="40" fill="#6d28d9">库仑力</text>
  <rect x="46" y="92" width="12" height="14" rx="5" fill="#8e97a4"/>
  <text class="s6" x="46" y="86" fill="#6b7280">万有引力</text>
  <text class="s5" x="202" y="58">大得多</text>
</svg>
</div>
<div class="qac">
<p class="q">三个电荷挤在一起怎么算？</p>
<p class="a"><b>两两算，再矢量合成。</b>每个电荷受另外两个的力。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="先分力再合成">
  <circle class="cc" cx="52" cy="72" r="12"/>
  <circle class="cc" cx="120" cy="72" r="12"/>
  <circle class="cc" cx="188" cy="72" r="12"/>
  <line class="fa" x1="66" y1="72" x2="100" y2="72"/>
  <polygon class="fh" points="112,72 100,68 100,76"/>
  <line class="fa" x1="174" y1="72" x2="140" y2="72"/>
  <polygon class="fh" points="128,72 140,68 140,76"/>
</svg>
</div>
</div>
<p class="gx-note">六问归成一条：<b>先看模型成不成立</b>，再算大小，最后定方向。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是错句，右边是能得分的表述。</p>
<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 只要带电就能当点电荷代公式。</p>
<p class="er-v">✓ 只有<b>距离远大于自身大小</b>时才能当点电荷。</p>
<p class="er-w">条件不满足时，形状和电荷分布会改变结果。</p>
</div>
<div class="er">
<p class="er-x">✗ r 取两球表面之间的距离。</p>
<p class="er-v">✓ r 取<b>连线上的间距</b>，球体取球心距。</p>
<p class="er-w">课本说的是「它们距离」，量到哪儿由模型定。</p>
</div>
<div class="er">
<p class="er-x">✗ F 与 r 成正比，r 大 F 大。</p>
<p class="er-v">✓ <b>F ∝ 1/r²</b>，r 大 F 小；r 加倍则 F 变 1/4。</p>
<p class="er-w">分母里是 r 的二次方，不是 r。</p>
</div>
<div class="er">
<p class="er-x">✗ 同种电荷相互吸引。</p>
<p class="er-v">✓ <b>同种电荷排斥，异种电荷吸引</b>。</p>
<p class="er-w">方向由电性直接决定，别和磁极搞混。</p>
</div>
<div class="er">
<p class="er-x">✗ 静电力常量 k 没有单位。</p>
<p class="er-v">✓ <b>k = 9.0×10⁹ N·m²/C²</b>，单位由公式反推。</p>
<p class="er-w">单位丢了，q 用 μC 时会差 10¹² 倍。</p>
</div>
<div class="er">
<p class="er-x">✗ 库仑力只存在于异种电荷之间。</p>
<p class="er-v">✓ 任何两个带电体之间都有库仑力，<b>同斥异吸</b>。</p>
<p class="er-w">同种电荷的斥力同样满足 F = kq₁q₂/r²。</p>
</div>
</div>
</section>

<div class="gx-foot">
<p>教材依据：人教版《物理》必修第三册（2019年版）第九章第2节。引文按教材整理。</p>
<p>数值口径：k = 9.0×10⁹ N·m²/C²；q₁ = 2×10⁻⁶ C、q₂ = 3×10⁻⁶ C，kq₁q₂ = 5.4×10⁻² N·m²；F 按<b>绝对值</b>算大小，方向另判。</p>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  var $ = GX.$, KR = 9.0e9 * 2e-6 * 3e-6, F0 = KR / 0.01, R = 0.4;

  function fmtF(v) { return v >= 0.1 ? v.toFixed(2) : v.toFixed(3); }

  function stateText(r) {
    if (r >= 0.5) return "距离较大，F 较小";
    if (r <= 0.15) return "距离很近，模型要谨慎";
    return "点电荷模型适用";
  }

  function render() {
    var F = KR / (R * R), ratio = F / F0;
    var px = 40 + (R - 0.1) / 0.9 * 130, x2 = 100 + px;
    $("gxQ2").setAttribute("cx", x2.toFixed(1));
    $("gxQ2L").setAttribute("x", x2.toFixed(1));
    $("gxQ2S").setAttribute("x", x2.toFixed(1));
    $("gxDim").setAttribute("x2", x2.toFixed(1));
    $("gxTick").setAttribute("x1", x2.toFixed(1));
    $("gxTick").setAttribute("x2", x2.toFixed(1));
    $("gxRLab").setAttribute("x", (100 + px / 2).toFixed(1));
    $("gxArwR").setAttribute("x1", (x2 + 14).toFixed(1));
    $("gxArwR").setAttribute("x2", (x2 + 32).toFixed(1));
    $("gxArwH").setAttribute("points",
      (x2 + 44).toFixed(1) + ",92 " + (x2 + 32).toFixed(1) + ",87 " + (x2 + 32).toFixed(1) + ",97");
    $("gxFormula").textContent = "F = 0.054 / " + R.toFixed(2) + "² = " + fmtF(F) + " N";
    $("gxFBig").textContent = fmtF(F) + " N";
    $("gxRatBig").textContent = ratio.toFixed(2);
    $("gxHint").textContent = stateText(R);
    $("gxVa").textContent = R.toFixed(2) + " m";
    $("gxVb").textContent = fmtF(F) + " N";
    $("gxVs").textContent = ratio.toFixed(2);
    $("gxVs2").textContent = stateText(R);
  }

  var badge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!badge) return;
    badge.classList.toggle("is-auto", m === "auto");
    badge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  $("gxSl").addEventListener("input", function () { R = parseFloat(this.value); render(); });

  render();
  window.__ap = AutoPilot.create({
    mount: $("gxStage"), follow: $("gxSl"),
    loop: [{ t: 0, v: 1 }, { t: 1.2, v: 1 }, { t: 3, v: 0.5 }, { t: 4, v: 0.5 },
           { t: 5.4, v: 0.2 }, { t: 7.9, v: 0.2 }, { t: 9, v: 0.1 },
           { t: 10.6, v: 0.1 }, { t: 12, v: 1 }],
    keys: [0.1, 0.2, 0.5, 1],
    value: R, min: 0.1, max: 1, step: 0.05, idle: 5000,
    onChange: function (v) { R = v; render(); },
    onMode: setMode
  });
});
</script>
