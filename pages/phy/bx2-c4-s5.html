</style><link rel="stylesheet" href="../../assets/print.css" media="print"></head><body class="page" style="--accent:#0b7285;--accent-soft:#eef9fb"><header class="topbar"><div class="wrap topbar-in"><a class="back" href="../../subject.html?s=phy">‹ 物理</a><button class="done-btn" id="doneBtn" type="button" data-id="phy/bx2-c4-s5"><span class="done-box"></span><span class="done-txt">标记已复习</span></button></div></header><main class="wrap page-wrap"><nav class="crumbs"><a href="../../index.html">首页</a><span class="sep">/</span><a href="../../subject.html?s=phy">物理</a><span class="sep">/</span><span>必修第二册</span><span class="sep">/</span><span class="cur">第八章 机械能守恒定律</span></nav><h1 class="page-title">5. 实验：验证机械能守恒定律</h1><div class="page-meta">物理 · 必修第二册 · 第八章 机械能守恒定律</div><article class="content" id="content"></article><nav class="pager"><a class="pager-link prev" href="bx2-c4-s4.html"><small>上一节</small><b>4. 机械能守恒定律</b></a><a class="pager-link next" href="bx3-c1-s1.html"><small>下一节</small><b>1. 电荷</b></a></nav></main><script>
window.PAGE = {"sid": "phy", "slug": "bx2-c4-s5", "title": "5. 实验：验证机械能守恒定律", "anchor": "#bx2-c4-s5"};
</script><script type="text/markdown" id="md"><div class="gx"><div class="gx-kicker">ELI5-HIGH · 讲给要考试的人</div><p class="gx-claim">这个实验只干一件事：让重物自由下落，量出<b>掉了多高</b>和<b>到了多快</b>，看 mgh 与 ½mv² 是否相等。</p><div class="gx-meta"><span><i></i>人教版必修第二册 · 第八章第 5 节</span><span><i></i>高一 · 实验验证机械能守恒</span><span><i></i>阅读 15 分钟</span><span><i></i>含 1 个互动模型</span></div><section class="gx-sec" id="a"><h2><span class="sn">01</span>教材怎么说</h2><p class="gx-h2s">先把课本的三句话钉住：原理、测法、误差。</p><div class="gx-quote"><p class="q-t">教材表述 01<span class="q-src">实验原理</span></p><p class="q-b">在只有重力做功的自由落体运动中，重力势能的减少量等于动能的增加量，即 <b>mgh = ½mv²</b>。</p><p class="q-n"><b>人话：</b>掉得越低速度越大；两边 m 约去，只需量 h 和 v，不必测质量。</p></div><div class="gx-quote"><p class="q-t">教材表述 02<span class="q-src">器材与操作</span></p><p class="q-b">用打点计时器记录下落过程，纸带上两点时间间隔 T = 0.02 s；用 AC 段平均速度代替 B 点瞬时速度，<b>v<sub>B</sub> = (x<sub>C</sub> − x<sub>A</sub>)/(2T)</b>。</p><p class="q-n"><b>人话：</b>用 B 前后两点 A、C 的距离除以 2T，比拿整条纸带除总时间靠谱得多。</p></div><div class="gx-quote"><p class="q-t">教材表述 03<span class="q-src">误差来源</span></p><p class="q-b">重物受到空气阻力和纸带与限位孔间的摩擦阻力，一部分机械能转化为内能，所以重力势能的减少量略大于动能的增加量。</p><p class="q-n"><b>人话：</b>实测 mgh 总略大、½mv² 总略小；结论写“误差允许范围内相等”，不能写“完全相等”。</p></div></section><section class="gx-sec" id="b"><h2><span class="sn">02</span>三张图看懂<span class="bdg bdg-diff">图解</span></h2><p class="gx-h2s">装置怎么装、纸带怎么读、数据怎么画。</p><figure class="gx-fig"><div class="fig-cap"><span class="fig-no">图 1</span><span class="fig-t">装置：重物拖着纸带竖直下落</span><span class="bdg bdg-must">必考</span></div><div class="gx-svgbox"><svg viewBox="0 0 900 200" role="img" aria-label="实验装置"><rect x="16" y="12" width="868" height="176" rx="10" fill="#fbfdfe" stroke="#dbe7ea"/><rect x="52" y="166" width="164" height="10" rx="3" fill="#d7dee5"/><rect x="92" y="32" width="8" height="138" fill="#aeb9c4"/><rect x="126" y="48" width="108" height="44" rx="6" fill="#eef9fb" stroke="#0b7285" stroke-width="2"/><text x="180" y="68" class="fs9 tc">打点计时器</text><rect x="176" y="92" width="8" height="56" fill="#fff" stroke="#b8791f"/><rect x="162" y="148" width="36" height="26" rx="5" fill="#0b7285"/><text x="180" y="166" class="fs11 wt tc">m</text><line x1="440" y1="166" x2="440" y2="34" stroke="#8e97a4" stroke-width="1.2"/><line x1="434" y1="166" x2="446" y2="166" stroke="#8e97a4"/><line x1="434" y1="34" x2="446" y2="34" stroke="#8e97a4"/><line x1="434" y1="100" x2="446" y2="100" stroke="#8e97a4"/><text x="450" y="169" class="fs8 mut">0</text><text x="450" y="37" class="fs8 mut">1.0 m</text><text x="450" y="103" class="fs9 mut">h</text><text x="500" y="96" class="fs9 mut">v 由纸带两点算出</text><text x="500" y="122" class="fs9 mut">比较 mgh 与 ½mv²</text></svg>
<span class="gx-zoomchip">点击放大</span></div><p class="fig-s">铁架台竖直固定计时器，纸带穿限位孔后拴重物；先通电，打点稳定后再释放。</p><p class="fig-s">重物选<b>质量大、体积小</b>的金属块；限位孔对齐可减小摩擦。</p><p class="gx-take">装置的目标只有一个：<b>让纸带尽可能只受重力</b>。</p></figure><figure class="gx-fig"><div class="fig-cap"><span class="fig-no">图 2</span><span class="fig-t">纸带：用前后两点算中间点速度</span><span class="bdg bdg-diff">方法</span></div><div class="gx-svgbox"><svg viewBox="0 0 900 190" role="img" aria-label="纸带取点"><rect x="16" y="12" width="868" height="166" rx="10" fill="#fbfdfe" stroke="#dbe7ea"/><rect x="50" y="74" width="560" height="48" rx="4" fill="#fffbf2" stroke="#b8791f"/><circle cx="204" cy="98" r="4" fill="#3a3a35"/><circle cx="318" cy="98" r="4" fill="#3a3a35"/><circle cx="432" cy="98" r="4" fill="#3a3a35"/><text x="204" y="66" class="fs11 tl tc">A</text><text x="318" y="66" class="fs11 am tc">B</text><text x="432" y="66" class="fs11 tl tc">C</text><line x1="204" y1="140" x2="432" y2="140" stroke="#0b7285" stroke-width="1.8"/><text x="318" y="158" class="fs9 tl tc">AC = 12.28 cm，2T = 0.04 s</text><text x="690" y="58" class="fs11 tl">求 B 点速度</text><text x="690" y="86" class="fs11">v_B = AC /（2T）</text><text x="690" y="116" class="fs13 am">≈ 3.07 m/s</text></svg>
<span class="gx-zoomchip">点击放大</span></div><p class="fig-s">相邻两点时间间隔 T = 0.02 s。取某点 B，量出前后两点 A、C 的距离，则 <b>v<sub>B</sub> = AC/(2T)</b>。</p><p class="fig-s">AC 跨两个间隔，分母是 <b>2T = 0.04 s</b>，不是 T；一次量 AC 比量两小段再相减误差小。</p><p class="gx-take">纸带题先认“中间点”：<b>算谁的速度，就取它左右相邻的两点</b>。给相邻间距 x<sub>1</sub>、x<sub>2</sub> 时，v = (x<sub>1</sub> + x<sub>2</sub>)/(2T)。</p></figure><figure class="gx-fig"><div class="fig-cap"><span class="fig-no">图 3</span><span class="fig-t">图像法：v²/2–h 应过原点</span><span class="bdg bdg-ext">提高</span></div><div class="gx-svgbox"><svg viewBox="0 0 900 200" role="img" aria-label="速度平方一半随高度变化的图像"><line x1="100" y1="166" x2="700" y2="166" stroke="#3a3a35" stroke-width="1.6"/><line x1="100" y1="166" x2="100" y2="30" stroke="#3a3a35" stroke-width="1.6"/><polygon points="100,30 95,40 105,40" fill="#3a3a35"/><text x="708" y="180" class="fs9">h/m</text><text x="64" y="32" class="fs9">v²/2</text><line x1="100" y1="166" x2="700" y2="42" stroke="#0b7285" stroke-width="2"/><circle cx="220" cy="137" r="4.5" fill="#fff" stroke="#0b7285" stroke-width="2"/><circle cx="460" cy="90" r="4.5" fill="#fff" stroke="#0b7285" stroke-width="2"/><circle cx="700" cy="42" r="4.5" fill="#fff" stroke="#0b7285" stroke-width="2"/><text x="220" y="184" class="fs8 mut tc">0.2</text><text x="460" y="184" class="fs8 mut tc">0.6</text><text x="700" y="184" class="fs8 mut tc">1.0</text><text x="500" y="36" class="fs11 tl">斜率 k = Δ(v²/2)/Δh = g</text><text x="500" y="53" class="fs9 mut">≈ 9.8 m/s²，图线过原点</text></svg>
<span class="gx-zoomchip">点击放大</span></div><p class="fig-s">把 h 作横轴、v²/2 作纵轴描点。由 ½mv² = mgh 得 <b>v²/2 = gh</b>，图线应<b>过原点、斜率约为 g</b>。</p><p class="fig-s">图线不过原点，先查 h 起点是否统一；斜率偏离 9.8 较多，查速度算法和读数。</p><p class="gx-take">一条直线同时检验“成正比”和“比例系数是 g”，比逐点算更稳，也是高频得分点。</p></figure></section><section class="gx-sec" id="c"><h2><span class="sn">03</span>自己拖一下<span class="bdg bdg-must">核心</span></h2><p class="gx-h2s">m = 0.2 kg 的重物自由下落，拖 h 看理论速度与实测速度差多少。</p><figure class="gx-fig"><div class="fig-cap"><span class="fig-no">互动 1</span><span class="fig-t">h 变了，v 怎么变</span><span class="gx-ap" id="gxAp"><i></i><span id="gxApTxt">自动演示中</span></span></div><p class="fig-s">理论值由 <b>½mv² = mgh</b> 得 <b>v<sub>理</sub> = √(2gh)</b>；实测值按 <b>v<sub>测</sub> = 0.98√(2gh)</b> 模拟约 4% 的能量损失。</p><div class="gx-board"><svg id="gxStage" class="gx-graph" viewBox="0 0 360 300" tabindex="0" role="application" aria-label="改变下落高度观察速度"><text x="180" y="17" class="fs11 tc">自由下落：mgh = ½mv²</text><text x="180" y="32" class="fs8 mut tc">m = 0.2 kg，g = 9.8 m/s²，h ∈ [0.2, 1.0] m</text><line x1="70" y1="48" x2="70" y2="230" stroke="#8e97a4" stroke-width="1.2"/><text x="56" y="51" class="fs8 te mut">1.0</text><text x="56" y="197" class="fs8 te mut">0.2</text><text x="56" y="233" class="fs8 te mut">0</text><rect x="34" y="230" width="142" height="4" fill="#d7dee5"/><rect id="gxW" x="56" y="102" width="28" height="24" rx="4" fill="#0b7285"/><text id="gxWLab" x="70" y="118" class="fs8 wt tc">m</text><line id="gxLine" x1="84" y1="114" x2="195" y2="114" stroke="#b8791f" stroke-width="1.4" stroke-dasharray="4 3"/><text id="gxHlab" x="90" y="106" class="fs8 am">h = 0.60 m</text><rect x="218" y="230" width="38" height="0" id="gxBarT" fill="#0b7285" opacity=".85"/><rect x="274" y="230" width="38" height="0" id="gxBarM" fill="#b8791f" opacity=".85"/><text id="gxBarTv" x="237" y="224" class="fs8 tl tc">3.43</text><text id="gxBarMv" x="293" y="224" class="fs8 am tc">3.36</text><text x="237" y="246" class="fs8 mut tc">v理</text><text x="293" y="246" class="fs8 mut tc">v测</text><text id="gxFormula" x="180" y="268" class="fs9 tc">v理 = √(2×9.8×0.60) = 3.43 m/s</text><text x="180" y="288" class="fs9 am tc">实测略小，摩擦/空气阻力</text></svg><div class="bar"><span class="lb">下落高度 h</span><input type="range" id="gxSl" min="0.2" max="1.0" step="0.05" value="0.6" aria-label="下落高度，单位米"><p class="hint">键盘 ← → 微调；点画面跳关键帧。</p></div></div><div class="stats"><div class="st"><div class="k">① 下落高度 h</div><div class="v" id="gxVa">0.60 m</div><div class="s">从起点量到 B 点</div></div><div class="st"><div class="k">② 理论速度 v理</div><div class="v" id="gxVb">3.43 m/s</div><div class="s">√(2gh)</div></div><div class="st state" id="gxStBox"><div class="k">③ 实测速度 v测</div><div class="v" id="gxVs">3.36 m/s</div><div class="s" id="gxVsn">实测略小，摩擦/空气阻力</div></div></div><p class="gx-take">h = 0.6 m 时 mgh = 1.176 J，½mv<sub>测</sub>² ≈ 1.129 J，差约 0.047 J。<b>不是算错，是阻力做的功</b>。</p></figure></section><section class="gx-sec" id="d"><h2><span class="sn">04</span>一道题走一遍</h2><p class="gx-h2s">先自己写，再点“下一步”。关键是：速度从纸带算，不从 v = gt 算。</p><div class="gx-ex"><p class="ex-t">例题 · 纸带数据验证守恒<span class="bdg bdg-must">必考</span></p><p class="ex-q">m = 0.2 kg 的重物自由下落，g 取 9.8 m/s²。纸带上连续三点 A、B、C，AC = 12.28 cm，T = 0.02 s；从起点 O 到 B 的高度 h = 0.500 m。求 v<sub>B</sub>、mgh 和 ½mv<sub>B</sub>²，并判断能否验证机械能守恒。</p><ol class="steps" id="gxSteps"><li class="step"><p class="s-h">第 1 步 · 写原理式</p><p class="s-b">验证 <b>mgh = ½mv²</b>。自由下落只有重力做功，重力势能减少量应等于动能增加量。两边 m 约去，只需测 h 和 v。</p></li><li class="step" hidden><p class="s-h">第 2 步 · 算减少的重力势能</p><p class="s-b">mgh = 0.2 × 9.8 × 0.500 = <b>0.980 J</b>。h 必须是从<b>同一悬点</b>量到 B 点的竖直距离，不是纸带长度。</p></li><li class="step" hidden><p class="s-h">第 3 步 · 从纸带求 B 点速度</p><p class="s-b">B 是 A、C 的中间时刻：v<sub>B</sub> = AC/(2T) = 0.1228 ÷ 0.04 = <b>3.07 m/s</b>。<b>不能用 v = gt</b>：t 难测准，且等于用结论反推，成了循环论证。</p></li><li class="step" hidden><p class="s-h">第 4 步 · 算动能并比较</p><p class="s-b">½mv<sub>B</sub>² = 0.5 × 0.2 × 3.07² = 0.1 × 9.4249 ≈ <b>0.942 J</b>。与 0.980 J 差约 <b>0.038 J</b>，相对差值约 <b>3.9%</b>。</p></li><li class="step" hidden><p class="s-h">第 5 步 · 下结论</p><p class="s-b">误差允许范围内二者近似相等，<b>机械能守恒得到验证</b>。差值来自空气阻力和纸带摩擦，机械能转化成了内能。改进：重物质量大体积小、限位孔对齐、多次取平均。</p></li></ol><div class="exbar"><button id="gxNext" type="button">下一步</button><span class="cnt" id="gxCnt">1 / 5</span></div><div class="ans" id="gxAns" hidden><p class="ans-t">参考答案</p><p class="ans-b">v<sub>B</sub> ≈ <b>3.07 m/s</b>；mgh = <b>0.980 J</b>；½mv<sub>B</sub>² ≈ <b>0.942 J</b>；相差约 3.9%。在误差允许范围内相等，可验证机械能守恒；差值由阻力造成。</p></div></div></section><section class="gx-sec" id="e"><h2><span class="sn">05</span>六个快问<span class="bdg bdg-diff">自测</span></h2><p class="gx-h2s">都是实验题的第一问。先自己答，再对照。</p><div class="gx-qa"><div class="qac"><p class="q">1. 重物为什么选质量大、体积小的？</p><p class="a">让重力远大于空气阻力，减小相对误差。</p><svg viewBox="0 0 240 132"><circle cx="60" cy="62" r="24" fill="#e8eef3" stroke="#8e97a4"/><circle cx="152" cy="62" r="14" fill="#0b7285"/><line x1="38" y1="34" x2="38" y2="22" stroke="#b8402f" stroke-width="2"/><text x="38" y="14" class="fs8 rd tc">阻力</text><text x="152" y="66" class="fs8 wt tc">重</text><text x="196" y="62" class="fs9 tl">比例小</text></svg></div><div class="qac"><p class="q">2. 两个限位孔为什么要在同一条竖直线上？</p><p class="a">让纸带竖直穿过、不蹭孔壁，减小摩擦。</p><svg viewBox="0 0 240 132"><rect x="48" y="26" width="80" height="12" rx="3" fill="#8e97a4"/><rect x="48" y="90" width="80" height="12" rx="3" fill="#8e97a4"/><line x1="88" y1="32" x2="88" y2="96" stroke="#b8791f" stroke-width="2.5"/><text x="142" y="60" class="gn">✓ 对齐</text><text x="142" y="94" class="rd">✗ 错位</text></svg></div><div class="qac"><p class="q">3. 为什么先接通电源，后释放纸带？</p><p class="a">先通电让打点稳定，再释放才不漏掉开头的点。</p><svg viewBox="0 0 240 132"><circle cx="40" cy="58" r="12" fill="#eef9fb" stroke="#0b7285"/><text x="40" y="61" class="fs8 tl tc">电源</text><line x1="54" y1="58" x2="140" y2="58" stroke="#0b7285" stroke-width="2"/><polygon points="140,58 132,54 132,62" fill="#0b7285"/><text x="72" y="46" class="fs9">接通、待稳定</text><text x="156" y="46" class="fs9 am">再释放</text><line x1="156" y1="58" x2="206" y2="58" stroke="#b8791f" stroke-width="2"/><polygon points="206,58 198,54 198,62" fill="#b8791f"/></svg></div><div class="qac"><p class="q">4. 能不能用 v = gt 求速度？</p><p class="a">不能。t 难测准，而且等于用结论验证结论。</p><svg viewBox="0 0 240 132"><text x="120" y="64" class="fs16 mut tc">v = gt</text><line x1="62" y1="88" x2="178" y2="40" stroke="#b8402f" stroke-width="3"/><text x="120" y="106" class="fs9 rd tc">循环论证 · 不可用</text></svg></div><div class="qac"><p class="q">5. 怎样挑一条合适的纸带？</p><p class="a">点迹清晰、无漏点；第 1、2 点间距接近 2 mm。</p><svg viewBox="0 0 240 132"><rect x="24" y="30" width="192" height="26" rx="3" fill="#fffbf2" stroke="#b8791f"/><circle cx="42" cy="43" r="3" fill="#3a3a35"/><circle cx="60" cy="43" r="3" fill="#3a3a35"/><circle cx="98" cy="43" r="3" fill="#3a3a35"/><circle cx="144" cy="43" r="3" fill="#3a3a35"/><text x="51" y="72" class="fs8 gn tc">≈2 mm</text><text x="120" y="98" class="fs9 gn tc">起点速度≈0</text></svg></div><div class="qac"><p class="q">6. v²/2–h 图像的斜率说明什么？</p><p class="a">图线应过原点，斜率 k = g；接近 9.8 就验证了守恒。</p><svg viewBox="0 0 240 132"><line x1="38" y1="100" x2="202" y2="100" stroke="#3a3a35"/><line x1="38" y1="100" x2="38" y2="26" stroke="#3a3a35"/><line x1="38" y1="100" x2="186" y2="34" stroke="#0b7285" stroke-width="2"/><circle cx="76" cy="81" r="3" fill="#fff" stroke="#0b7285" stroke-width="1.6"/><text x="190" y="110" class="fs8 mut">h</text><text x="18" y="32" class="fs8 mut">v²/2</text><text x="126" y="88" class="fs9 am">k = g</text></svg></div></div></section><section class="gx-sec" id="f"><h2><span class="sn">06</span>易错清单<span class="bdg bdg-warn">考前扫一眼</span></h2><div class="gx-errs"><div class="er"><p class="er-x">✗ 用 v = gt 算纸带上某点的速度</p><p class="er-v">✓ 用 v = (x<sub>后</sub> − x<sub>前</sub>)/(2T)</p><p class="er-w">等于把要验证的规律当已知条件，属于<b>循环论证</b>；t 也很难测准。</p></div><div class="er"><p class="er-x">✗ 先释放纸带，再接通电源</p><p class="er-v">✓ 先接通电源，打点稳定后再释放</p><p class="er-w">反过来会漏掉开头的点迹，起点和高度都定不下来。</p></div><div class="er"><p class="er-x">✗ 认为 mgh 与 ½mv² 必须完全相等</p><p class="er-v">✓ 在误差允许范围内近似相等</p><p class="er-w">阻力不可避免，重力势能减少量总略大于动能增加量。</p></div><div class="er"><p class="er-x">✗ 认为不用天平就做不了实验</p><p class="er-v">✓ m 在 mgh = ½mv² 两边约去，不必测质量</p><p class="er-w">只需 h 和 v；多测一个量反而多一份误差。</p></div><div class="er"><p class="er-x">✗ 把纸带长度当作下落高度 h</p><p class="er-v">✓ h 是从同一悬点量到该点的竖直距离</p><p class="er-w">纸带会弯、会斜，长度不等于高度；起点不统一，图线不过原点。</p></div><div class="er"><p class="er-x">✗ 纸带选点迹最密的一段，认为点越多越准</p><p class="er-v">✓ 选点迹清晰、第 1、2 点间距约 2 mm 的纸带</p><p class="er-w">开头漏点的纸带起点速度不为 0，后面全错。</p></div></div></section><div class="gx-foot"><p>教材依据：人教版《物理》必修第二册（2019 年版）第八章第 5 节「实验：验证机械能守恒定律」；引文按教材表述整理，页码以纸质书为准。</p><p>数值口径：互动取 m = 0.2 kg、g = 9.8 m/s²、h ∈ [0.2, 1.0] m，v<sub>测</sub> = 0.98√(2gh) 为<b>模型计算值</b>；例题数据为<b>教学常用数据</b>。</p></div></div><div class="gx-zoom" id="gxZoom" hidden><span class="gx-zoom-tip">双指放大看细节</span><button class="gx-zoom-x" type="button" aria-label="关闭">✕</button><div id="gxZoomInner"></div></div></script><script src="../../assets/page.js"></script><script src="../../assets/gx.js"></script><script src="../../assets/autopilot.js"></script><script>
