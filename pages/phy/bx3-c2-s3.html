<script type="text/markdown" id="md"><div class="gx"><div class="gx-kicker">ELI5-HIGH · 讲给要考试的人</div><p class="gx-claim">这一节只干一件事：<b>用场强 E 和距离 d 算电势差 U</b>。</p><nav class="gx-toc"> <a href="#a">① 课本怎么说</a><a href="#b">② 拆开看</a><a href="#c">③ 自己拖一下</a> <a href="#d">④ 一道题走一遍</a><a href="#e">⑤ 会怎么考</a><a href="#f">⑥ 易错清单</a></nav><section class="gx-sec" id="a"><h2><span class="sn">01</span>课本怎么说</h2><p class="gx-h2s">三条：公式、单位读法、成立条件。</p><div class="gx-quote"><p class="q-t">课本表述 · 匀强电场中的 U 与 E<span class="q-src">人教版必修第三册 · 第十章第3节</span></p><p class="q-b">匀强电场中，两点间的电势差等于电场强度与这两点沿电场方向的距离的乘积：<b>U = Ed</b>。</p><p class="q-n">→ 人话：沿场强方向每走 1 m，电势降低 E 伏。</p></div><div class="gx-quote"><p class="q-t">课本表述 · 场强的另一种读法<span class="q-src">人教版必修第三册 · 第十章第3节</span></p><p class="q-b">由 E = U/d 可知，电场强度在数值上等于沿电场方向每单位距离上降低的电势；单位 V/m 与 N/C 相同。</p><p class="q-n">→ 人话：E 既能读成「每米降几伏」，也能读成「每库仑受几牛」。</p></div><div class="gx-quote"><p class="q-t">课本表述 · 公式的适用条件<span class="q-src">人教版必修第三册 · 第十章第3节</span></p><p class="q-b">U = Ed 只适用于匀强电场；d 是两点沿电场方向的距离，不是两点间的距离。</p><p class="q-n">→ 人话：斜着量出来的距离，要先投影到场强方向上。</p></div><p class="gx-note">三条说的是同一个式子：<b>U = Ed</b>。E = U/d 只是把它解出来，判断方向仍看「沿场强电势降低」。</p></section><section class="gx-sec" id="b"><h2><span class="sn">02</span>拆开看</h2><p class="gx-h2s">三张图：匀强电场、非匀强电场、场强与等势面疏密。</p><figure class="gx-fig"><div class="fig-cap"><span class="fig-no">图 1</span><span class="fig-t">匀强电场：等势面平行等距</span><span class="bdg bdg-must">必考</span></div><p class="fig-s">电场线<b>平行等距</b>，等势面与它垂直，同样<b>平行等距</b>。</p><p class="fig-s">A、B 不在同一电场线上时，<b>d 取 AB 沿场强方向的投影</b>。</p><div class="gx-svgbox"><svg viewBox="0 0 900 300" role="img" aria-label="匀强电场中A、B两点沿场强方向的投影d，电势差等于E乘d"> <text x="450" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#3a3a35">匀强电场：等势面平行等距，U = E·d</text> <line x1="110" y1="66" x2="110" y2="250" stroke="#8e97a4" stroke-width="2.4"/> <line x1="790" y1="66" x2="790" y2="250" stroke="#8e97a4" stroke-width="2.4"/> <text x="110" y="56" text-anchor="middle" font-size="12" font-weight="700" fill="#b8402f">+</text> <text x="790" y="56" text-anchor="middle" font-size="12" font-weight="700" fill="#2f6fd0">−</text> <g class="ga"> <line x1="126" y1="92" x2="760" y2="92"/><polygon points="774,92 758,87 758,97" fill="#c9b8f5"/> <line x1="126" y1="150" x2="760" y2="150"/><polygon points="774,150 758,145 758,155" fill="#c9b8f5"/> </g> <text x="132" y="84" font-size="11" fill="#8a5c14">E</text> <g class="gb"> <line x1="300" y1="76" x2="300" y2="240"/><line x1="540" y1="76" x2="540" y2="240"/> <line x1="780" y1="76" x2="780" y2="240"/> </g> <circle cx="300" cy="120" r="5" fill="#7c3aed"/> <text x="288" y="112" text-anchor="end" font-size="13" font-weight="700" fill="#6d28d9">A</text> <circle cx="540" cy="205" r="5" fill="#7c3aed"/> <text x="552" y="219" font-size="13" font-weight="700" fill="#6d28d9">B</text> <g class="gc"> <line x1="300" y1="120" x2="540" y2="120"/><line x1="540" y1="120" x2="540" y2="205"/> </g> <text x="420" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#8a5c14" class="halo">d</text> <text x="450" y="284" text-anchor="middle" font-size="11.5" fill="#6d28d9">U = E·d = 500 × 0.2 = 100 V</text></svg><span class="gx-zoomchip">点击放大</span></div><p class="gx-take">d 缩小一半，U 就减半：<b>E 不变时 U 与 d 成正比</b>。</p></figure><figure class="gx-fig"><div class="fig-cap"><span class="fig-no">图 2</span><span class="fig-t">非匀强电场：等势面不等距</span><span class="bdg bdg-diff">辨析</span></div><p class="fig-s">点电荷的电场线越往外越稀，等势面也<b>越往外越疏</b>：同样的电势差，外面跨得更远。</p><p class="fig-s"><b>U = Ed 不能直接用于非匀强电场</b>；只有 d 很小时，才可用 E = ΔU/d 估某点的场强。</p><div class="gx-svgbox"><svg viewBox="0 0 900 300" role="img" aria-label="点电荷的非匀强电场，等势面越靠外越疏，不能直接用U等于Ed"> <text x="450" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#3a3a35">非匀强电场：等势面不等距，U = Ed 不能直接用</text> <circle cx="240" cy="150" r="14" fill="#fdf3e0" stroke="#b8791f" stroke-width="1.6"/> <text x="240" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#8a5c14">+</text> <g class="ga"> <line x1="254" y1="150" x2="388" y2="150"/><polygon points="394,150 380,145 380,155" fill="#c9b8f5"/> <line x1="250" y1="142" x2="375" y2="52"/><polygon points="381,48 369,46 374,58" fill="#c9b8f5"/> <line x1="250" y1="158" x2="375" y2="248"/><polygon points="381,252 374,242 369,254" fill="#c9b8f5"/> <line x1="226" y1="150" x2="92" y2="150"/><polygon points="86,150 100,145 100,155" fill="#c9b8f5"/> </g> <g class="gb" fill="none"> <circle cx="240" cy="150" r="40"/><circle cx="240" cy="150" r="70"/> <circle cx="240" cy="150" r="105"/><circle cx="240" cy="150" r="145"/> </g> <text x="470" y="92" font-size="12" fill="#8a5c14">同一 ΔU：越靠外，d 越大</text> <text x="470" y="114" font-size="12" fill="#8a5c14">→ E = ΔU/d 越小</text> <text x="470" y="156" font-size="13" font-weight="700" fill="#b8402f">不能用 U = Ed</text> <text x="470" y="178" font-size="11.5" fill="#6b7280">它只对匀强电场成立</text></svg><span class="gx-zoomchip">点击放大</span></div><p class="gx-take">看等势面疏密就能比场强：<b>越密的地方 E 越大</b>。</p></figure><figure class="gx-fig"><div class="fig-cap"><span class="fig-no">图 3</span><span class="fig-t">E 的两个单位与等势面疏密</span><span class="bdg bdg-ext">延伸</span></div><p class="fig-s"><b>1 V/m = 1 N/C</b>：一个从 U = Ed 来，一个从 F = qE 来。</p><p class="fig-s">取相邻电势差 ΔU = 20 V：<b>E 越大，d = ΔU/E 越小</b>，等势面越密。</p><div class="gx-svgbox"><svg viewBox="0 0 900 250" role="img" aria-label="同样电势差下，场强越大等势面间距越小，1伏每米等于1牛每库"> <text x="450" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#3a3a35">1 V/m = 1 N/C；场强越大，等势面越密</text> <rect x="80" y="80" width="320" height="150" rx="8" fill="#fbfcfd" stroke="#e6e9ee"/> <text x="240" y="68" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">E₁ = 200 V/m，间距 10 cm</text> <g class="ga"> <line x1="120" y1="92" x2="120" y2="218"/><line x1="200" y1="92" x2="200" y2="218"/> <line x1="280" y1="92" x2="280" y2="218"/><line x1="360" y1="92" x2="360" y2="218"/> </g> <rect x="500" y="80" width="320" height="150" rx="8" fill="#fbfcfd" stroke="#e6e9ee"/> <text x="660" y="68" text-anchor="middle" font-size="12" font-weight="700" fill="#b8402f">E₂ = 500 V/m，间距 4 cm</text> <g class="gd"> <line x1="560" y1="92" x2="560" y2="218"/><line x1="600" y1="92" x2="600" y2="218"/> <line x1="640" y1="92" x2="640" y2="218"/><line x1="680" y1="92" x2="680" y2="218"/> <line x1="720" y1="92" x2="720" y2="218"/><line x1="760" y1="92" x2="760" y2="218"/> </g></svg><span class="gx-zoomchip">点击放大</span></div><p class="gx-take">单位换算不是重点，<b>「等势面越密 E 越大」才是常考点</b>。</p></figure></section><section class="gx-sec" id="c"><h2><span class="sn">03</span>自己拖一下<span class="bdg bdg-must">核心</span></h2><p class="gx-h2s">d 固定 0.2 m，只改 E：看 U 怎么变、等势面怎么变密。</p><figure class="gx-fig"><div class="fig-cap"><span class="fig-no">互动 1</span><span class="fig-t">E 变，U 与等势面间距一起变</span><span class="gx-ap" id="gxAp"><i></i><span id="gxApTxt">自动演示中</span></span></div><p class="fig-s">沿场强方向取 A、B，<b>d = 0.2 m</b>。匀强电场中 <b>U = Ed</b>，E 翻倍 U 也翻倍。</p><p class="fig-s">相邻等势面取 <b>ΔU = 20 V</b>，间距 d = ΔU/E：E 越大线越密。E = 500 V/m 时 U = 100 V，正好 5 格。</p><div class="gx-board"><svg id="gxStage" class="gx-graph" viewBox="0 0 360 308" tabindex="0" role="application" aria-label="匀强电场互动：改变场强，观察电势差与等势面间距的变化"> <text x="180" y="16" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3a3a35">匀强电场：U = E·d，d = 0.2 m 沿场强方向</text> <line x1="45" y1="64" x2="45" y2="238" stroke="#8e97a4" stroke-width="2.4"/> <line x1="315" y1="64" x2="315" y2="238" stroke="#8e97a4" stroke-width="2.4"/> <text x="45" y="56" text-anchor="middle" font-size="11" font-weight="700" fill="#b8402f">+</text> <text x="315" y="56" text-anchor="middle" font-size="11" font-weight="700" fill="#2f6fd0">−</text> <g class="ga"> <line x1="55" y1="92" x2="294" y2="92"/><polygon points="300,92 289,88 289,96" fill="#c9b8f5"/> <line x1="55" y1="160" x2="294" y2="160"/><polygon points="300,160 289,156 289,164" fill="#c9b8f5"/> </g> <line x1="100" y1="70" x2="100" y2="232" stroke="#7c3aed" stroke-width="1.5"/> <line x1="250" y1="70" x2="250" y2="232" stroke="#7c3aed" stroke-width="1.5"/> <g id="gxEq"></g> <circle cx="100" cy="160" r="3.5" fill="#6d28d9"/> <circle cx="250" cy="160" r="3.5" fill="#6d28d9"/> <text id="gxPA" x="100" y="48" text-anchor="middle" font-size="8.5" fill="#6d28d9">A · φ_A = 20 V</text> <text x="250" y="48" text-anchor="middle" font-size="8.5" fill="#6b7280">B · φ_B = 0</text> <text id="gxSp" x="175" y="246" text-anchor="middle" font-size="8.5" fill="#6b7280">相邻等势面 20 cm</text> <line x1="100" y1="258" x2="250" y2="258" stroke="#8a5c14" stroke-width="1.1"/> <text x="175" y="278" text-anchor="middle" font-size="9" font-weight="700" fill="#8a5c14">d = 0.2 m</text> <text id="gxForm" x="180" y="298" text-anchor="middle" font-size="9" fill="#3a3a35">U = E·d = 100 × 0.2 = 20 V</text></svg><div class="bar"> <span class="lb">电场强度 E</span> <input type="range" id="gxSl" min="100" max="1000" step="10" value="100" aria-label="电场强度，单位伏每米"></div></div><div class="stats"> <div class="st"><div class="k">① 电场强度 E</div><div class="v" id="gxVa">100 V/m</div><div class="s">匀强电场，方向向右</div></div> <div class="st"><div class="k">② 电势差 U = Ed</div><div class="v" id="gxVb">20 V</div><div class="s">d = 0.2 m 沿场强方向</div></div> <div class="st"><div class="k">③ 相邻等势面间距</div><div class="v" id="gxVs">20 cm</div><div class="s">ΔU = 20 V；E 越大，等势面越密</div></div></div><p class="gx-take">停在 E = 500 V/m：U = 100 V、间距 4 cm；拉到 1000 V/m，<b>U 翻到 200 V，线也挤密一倍</b>。</p></figure></section><section class="gx-sec" id="d"><h2><span class="sn">04</span>一道题走一遍</h2><p class="gx-h2s">先自己写，再点「下一步」。这题考 U = Ed 的三次正比关系。</p><div class="gx-ex"><p class="ex-t">例题 · 匀强电场里的 U = Ed<span class="bdg bdg-must">必考</span></p><p class="ex-q">匀强电场方向水平向右，E = 500 V/m。A、B 两点沿场强方向相距 d = 0.2 m。求：(1) U_AB；(2) d 增到 0.4 m 时的 U_AB；(3) E 增到 1000 V/m、d 仍为 0.2 m 时的 U_AB。</p><ol class="steps" id="gxSteps"><li class="step"><p class="s-h">第 1 步 · 先认条件</p><p class="s-b">电场匀强，A、B 连线沿场强方向，所以 <b>d 就是 0.2 m</b>。沿场强方向电势降低，A 在高电势，<b>U_AB = φ_A − φ_B &gt; 0</b>。</p></li><li class="step" hidden><p class="s-h">第 2 步 · 第 (1) 问代入</p><p class="s-b"><b>U_AB = E·d = 500 × 0.2 = 100 V</b>，V/m 乘 m 得 V。</p></li><li class="step" hidden><p class="s-h">第 3 步 · 第 (2) 问：只改 d</p><p class="s-b">E 不变，U 与 d 成正比：<b>U_AB = 500 × 0.4 = 200 V</b>。d 翻倍，U 也翻倍。</p></li><li class="step" hidden><p class="s-h">第 4 步 · 第 (3) 问：只改 E</p><p class="s-b">d 不变，U 与 E 成正比：<b>U_AB = 1000 × 0.2 = 200 V</b>。E 翻倍，U 也翻倍。</p></li><li class="step" hidden><p class="s-h">第 5 步 · 回头校验</p><p class="s-b">(2)(3) 都得 200 V，但原因不同：一个靠<b>拉长距离</b>，一个靠<b>加场强</b>。若 A、B 连线与场强成 θ，d 要换成投影 <b>d·cosθ</b>。</p><p class="s-k">用到：d 只量沿场强方向的那一段。</p></li></ol><div class="exbar"> <button id="gxNext" type="button">下一步</button> <span class="cnt" id="gxCnt">1 / 5</span></div><div class="ans" id="gxAns" hidden><p class="ans-t">标准答案（可抄进答题卡）</p><p class="ans-b">匀强电场中 U_AB = Ed，d 为沿场强方向的距离。<br>(1) U_AB = 500 × 0.2 = <b>100 V</b>；<br>(2) U_AB = 500 × 0.4 = <b>200 V</b>；<br>(3) U_AB = 1000 × 0.2 = <b>200 V</b>。<br>沿场强方向电势降低，三种情形都有 U_AB &gt; 0。</p></div><p class="gx-note">扣分点：把 0.2 m 当成 A、B 的直线距离；算完不写单位；U_AB 符号写反。</p></div></section><section class="gx-sec" id="e"><h2><span class="sn">05</span>考你会怎么考</h2><p class="gx-h2s">六种问法，一半在问「d 到底量哪一段」。</p><div class="gx-qa"><div class="qac"><p class="q">U = Ed 什么时候能用？</p><p class="a"><b>只在匀强电场中。</b>非匀强电场里 E 各处不同，乘一个 E 没有意义。</p><svg viewBox="0 0 240 132" aria-hidden="true"> <line x1="40" y1="30" x2="40" y2="104" stroke="#8e97a4" stroke-width="2"/> <line x1="200" y1="30" x2="200" y2="104" stroke="#8e97a4" stroke-width="2"/> <text x="40" y="24" text-anchor="middle" font-size="10" fill="#b8402f">+</text> <text x="200" y="24" text-anchor="middle" font-size="10" fill="#2f6fd0">−</text> <g class="ga"> <line x1="52" y1="52" x2="190" y2="52"/><line x1="52" y1="68" x2="190" y2="68"/> <line x1="52" y1="84" x2="190" y2="84"/> </g></svg></div><div class="qac"><p class="q">d 是 A、B 的直线距离吗？</p><p class="a"><b>不是。</b>d 是两点沿场强方向的距离，斜着放要取投影 <b>d·cosθ</b>。</p><svg viewBox="0 0 240 132" aria-hidden="true"> <line x1="20" y1="104" x2="220" y2="104" stroke="#c9b8f5" stroke-width="1"/> <polygon points="226,104 214,99 214,109" fill="#c9b8f5"/> <circle cx="60" cy="88" r="4" fill="#6d28d9"/> <circle cx="170" cy="38" r="4" fill="#6d28d9"/> <line x1="60" y1="88" x2="170" y2="38" stroke="#8a5c14" stroke-width="1.2"/> <g class="gc"> <line x1="60" y1="88" x2="170" y2="88"/><line x1="170" y1="88" x2="170" y2="38"/> </g> <text x="115" y="82" text-anchor="middle" font-size="9" font-weight="700" fill="#8a5c14">d·cosθ</text></svg></div><div class="qac"><p class="q">E 的两个单位怎么换？</p><p class="a"><b>1 V/m = 1 N/C</b>，两者完全等价，只是来源不同。</p><svg viewBox="0 0 240 132" aria-hidden="true"> <rect x="24" y="44" width="82" height="42" rx="9" fill="#f5f3ff" stroke="#d8ccfb"/> <text x="65" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="#6d28d9">V/m</text> <text x="120" y="71" text-anchor="middle" font-size="14" fill="#8e97a4">=</text> <rect x="134" y="44" width="82" height="42" rx="9" fill="#e6f6ee" stroke="#bfe0cd"/> <text x="175" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="#1e6640">N/C</text></svg></div><div class="qac"><p class="q">非匀强电场一点也不能算吗？</p><p class="a"><b>不能直接 U = Ed。</b>取 d 很小，可用 <b>E ≈ ΔU/d</b> 估该处场强。</p><svg viewBox="0 0 240 132" aria-hidden="true"> <circle cx="60" cy="66" r="12" fill="#fdf3e0" stroke="#b8791f" stroke-width="1.3"/> <text x="60" y="70" text-anchor="middle" font-size="10" fill="#8a5c14">+</text> <line x1="72" y1="66" x2="205" y2="66" stroke="#c9b8f5" stroke-width="1"/> <circle cx="60" cy="66" r="40" fill="none" stroke="#cfd4da" stroke-width="1" stroke-dasharray="4 3"/> <line x1="150" y1="58" x2="176" y2="58" stroke="#b8402f" stroke-width="1.4"/> <text x="163" y="50" text-anchor="middle" font-size="9" fill="#b8402f">d 很小</text></svg></div><div class="qac"><p class="q">等势面越密说明什么？</p><p class="a">同样 ΔU 下 d 越小，<b>E = ΔU/d 越大</b>，等势面越密场强越大。</p><svg viewBox="0 0 240 132" aria-hidden="true"> <g class="gd"> <line x1="24" y1="26" x2="24" y2="104"/><line x1="44" y1="26" x2="44" y2="104"/> <line x1="64" y1="26" x2="64" y2="104"/> </g> <text x="54" y="120" text-anchor="middle" font-size="9" fill="#b8402f">密 → E 大</text> <g class="ga"> <line x1="150" y1="26" x2="150" y2="104"/><line x1="180" y1="26" x2="180" y2="104"/> </g> <text x="180" y="120" text-anchor="middle" font-size="9" fill="#0b6580">疏 → E 小</text></svg></div><div class="qac"><p class="q">U_AB 的正负怎么定？</p><p class="a"><b>U_AB = φ_A − φ_B。</b>沿场强方向电势降低；A 在高电势，U_AB &gt; 0。</p><svg viewBox="0 0 240 132" aria-hidden="true"> <circle cx="58" cy="44" r="4" fill="#6d28d9"/> <circle cx="184" cy="92" r="4" fill="#6d28d9"/> <text x="58" y="32" text-anchor="middle" font-size="9" fill="#6d28d9">A · φ 高</text> <text x="184" y="110" text-anchor="middle" font-size="9" fill="#6b7280">B · φ 低</text> <line x1="70" y1="50" x2="170" y2="84" stroke="#c9b8f5" stroke-width="1.4"/> <polygon points="178,86 164,86 169,74" fill="#c9b8f5"/> <text x="120" y="122" text-anchor="middle" font-size="9" fill="#1e6640">U_AB = φ_A − φ_B &gt; 0</text></svg></div></div><p class="gx-note">六问归成一条：<b>先确认是匀强电场，再把 d 投影到场强方向</b>，最后看符号。</p></section><section class="gx-sec" id="f"><h2><span class="sn">06</span>易错清单</h2><p class="gx-h2s">左边是错句，右边是能得分的表述。</p><div class="gx-errs"><div class="er"><p class="er-x">✗ d 取两点间的直线距离。</p><p class="er-v">✓ d 取两点<b>沿场强方向</b>的距离，斜着放用 d·cosθ。</p><p class="er-w">U 只由沿场强方向那一段决定。</p></div><div class="er"><p class="er-x">✗ U = Ed 适用于任何电场。</p><p class="er-v">✓ 只适用于<b>匀强电场</b>。</p><p class="er-w">E 处处相同，才能把 E 提到求和号外。</p></div><div class="er"><p class="er-x">✗ E 越大，U 一定越大。</p><p class="er-v">✓ U = Ed，还要看 d；d = 0 时 U 也是 0。</p><p class="er-w">U 由 E 和 d 两个量共同决定。</p></div><div class="er"><p class="er-x">✗ U 与 d 无关。</p><p class="er-v">✓ 同一条电场线上，<b>U 与 d 成正比</b>。</p><p class="er-w">E 不变时 d 翻倍，U 就翻倍。</p></div><div class="er"><p class="er-x">✗ V/m 与 N/C 不等价。</p><p class="er-v">✓ <b>1 V/m = 1 N/C</b>，是同一个单位。</p><p class="er-w">分别由 U = Ed 和 F = qE 推出。</p></div><div class="er"><p class="er-x">✗ 沿等势面移动电荷，也用 U = Ed。</p><p class="er-v">✓ 沿等势面 U = 0，电场力不做功，d 不进入公式。</p><p class="er-w">等势面上没有电势差，乘 E 也不会得到 U。</p></div></div></section><div class="gx-foot"><p>人教版《物理》必修第三册（2019年版）第十章第3节。引文按教材整理。</p><p>数值口径：匀强电场；d 为沿场强方向的距离；互动中 E 取 100–1000 V/m，d = 0.2 m，相邻等势面电势差取 ΔU = 20 V。</p></div></div><div class="gx-zoom" id="gxZoom" hidden> <span class="gx-zoom-tip">双指放大看细节</span> <button class="gx-zoom-x" type="button" aria-label="关闭">✕</button> <div id="gxZoomInner"></div></div></script>

<script>
document.addEventListener("DOMContentLoaded", function () {
var $ = GX.$, E = 100, D = 0.2, DU = 20, AX = 100, BX = 250, L = [], eq = $("gxEq");
for (var i = 0; i < 10; i++) {
var n = GX.el("line", { x1: AX, y1: 78, x2: AX, y2: 224, "class": "gb" }, eq);
n.style.display = "none";
L.push(n);
}
function render() {
var U = E * D, sp = DU / E * 100, px = (BX - AX) * DU / U;
var n = Math.floor((U - 0.0001) / DU);
for (var i = 0; i < L.length; i++) {
var k = i + 1, on = k <= n, x = (AX + k * px).toFixed(1);
L[i].style.display = on ? "" : "none";
if (on) { L[i].setAttribute("x1", x); L[i].setAttribute("x2", x); }
}
$("gxPA").textContent = "A · φ_A = " + GX.n1(U) + " V";
$("gxSp").textContent = "相邻等势面 " + GX.n1(sp) + " cm";
$("gxForm").textContent = "U = E·d = " + Math.round(E) + " × 0.2 = " + GX.n1(U) + " V";
$("gxVa").textContent = Math.round(E) + " V/m";
$("gxVb").textContent = GX.n1(U) + " V";
$("gxVs").textContent = GX.n1(sp) + " cm";
}
var badge = $("gxAp"), apTxt = $("gxApTxt");
function setMode(m) {
if (!badge) return;
badge.classList.toggle("is-auto", m === "auto");
badge.classList.toggle("is-manual", m !== "auto");
if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
}
$("gxSl").addEventListener("input", function () { E = parseFloat(this.value); render(); });
render();
window.__ap = AutoPilot.create({
mount: $("gxStage"), follow: $("gxSl"),
loop: [{ t: 0, v: 100 }, { t: 1.4, v: 100 }, { t: 3.0, v: 300 }, { t: 4.2, v: 300 },
{ t: 5.6, v: 500 }, { t: 8.1, v: 500 }, { t: 9.6, v: 1000 }, { t: 11.0, v: 1000 },
{ t: 12.6, v: 100 }],
keys: [100, 300, 500, 1000],
value: 100, min: 100, max: 1000, step: 10, idle: 5000,
onChange: function (v) { E = v; render(); },
onMode: setMode
});
});
