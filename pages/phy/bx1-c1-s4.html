<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">一句话：加速度是「速度的变化量 ÷ 时间」。分子是 Δv，不是 v；分母是 Δt，不是 t。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 加速度<span class="q-src">人教版必修第一册 · 第一章第 4 节</span></p>
<p class="q-b">速度的变化量与发生这一变化所用时间之比，叫作加速度。</p>
<p class="q-n">→ 写成式子：<b>a = Δv / Δt = (v₂ − v₁) / Δt</b>，单位是 <b>m/s²</b>（读作「米每二次方秒」）。
加速度是<b>矢量</b>，方向与 <b>Δv</b> 的方向相同。注意：分子是「速度的变化量」，不是「速度」。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 加速度的方向<span class="q-src">人教版必修第一册 · 第一章第 4 节</span></p>
<p class="q-b">加速度是矢量，其方向与速度变化量 Δv 的方向相同。</p>
<p class="q-n">→ 在直线运动中：<b>a 与 v 同向 → 速度增大（加速）；a 与 v 反向 → 速度减小（减速）</b>。
所以「a 为负」只说明 a 的方向与正方向相反，<b>不等于减速</b>；要看 v 的方向。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 从 v–t 图像看加速度<span class="q-src">人教版必修第一册 · 第一章第 4 节</span></p>
<p class="q-b">v–t 图像的斜率表示加速度。</p>
<p class="q-n">→ 斜率 = <b>Δv / Δt</b>：斜率的<b>正负</b>表示 a 的方向，斜率的<b>陡峭程度</b>表示 a 的大小。
图线越陡，速度变化越快，加速度越大；图线水平，a = 0，速度不变。</p>
</div>

<p class="gx-note">一层套一层：<b>位置 → 速度 → 加速度</b>。速度是位置的变化率，加速度是速度的变化率。
做题先问「题目给的是 v 还是 Δv」，再问「a 与 v 同向还是反向」，最后才代公式。</p>
</section>

<p class="gx-take">a 从 +5 拖到 −5，v 从 +22.5 一路降到 −2.5。注意 <b>a = −4</b> 时 v 恰好为 0；再往负，a 与 v 都向左，速度大小反而<b>增大</b>。</p>
<p class="gx-note">模型口径：v₀ = 10 m/s，观察时刻固定 t = 2.5 s，v = v₀ + aΔt = 10 + 2.5a；
a 取 −5.0 ~ +5.0 m/s²（步长 0.5）。图中直线按 y = 10 + at 绘制，超出 −5 ~ 25 m/s 的部分被裁剪。
a = −4 m/s² 时 v = 0，是「速度过零」的临界点；a 再小，速度就反向。</p>
</figure>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己规定正方向，再把两个速度写成带符号的数。这题的坑全在「Δv 不是 12 − 8」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 加速度的矢量性<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">足球以 8 m/s 的速度向右飞来，运动员一脚踢出，足球以 12 m/s 的速度向左飞回。
若脚与球的接触时间为 0.2 s，求足球在这段时间内的加速度。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 规定正方向，写出 v₁ 和 v₂</p>
<p class="s-b">规定向右为正方向。初速度 v₁ = +8 m/s；末速度向左，v₂ = −12 m/s。
两个速度方向相反，符号必须一正一负。</p>
<p class="s-k">用到：矢量在一维运动中用正负号表示方向，先定正方向再代数。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 求速度变化量 Δv</p>
<p class="s-b">Δv = v₂ − v₁ = −12 − (+8) = −20 m/s。
负号表示 Δv 的方向向左，大小是 20 m/s。<b>不是</b> 12 − 8 = 4 m/s。</p>
<p class="s-k">用到：Δv 是矢量差 v末 − v初，不是两个速度大小相减。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 代加速度定义式</p>
<p class="s-b">a = Δv / Δt = (−20 m/s) / 0.2 s = −100 m/s²。
负号表示加速度方向向左；大小是 100 m/s²。</p>
<p class="s-k">用到：a = Δv/Δt；单位是 m/s²，不是 m/s。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 把方向说清楚</p>
<p class="s-b">加速度方向与 Δv 方向相同，都是<b>向左</b>。
虽然末速度也向左，但「a 的方向由 Δv 决定」才是普遍规则；不要因为 v₂ 向左就说 a 向左。</p>
<p class="s-k">用到：a 的方向跟着 Δv 走，不跟着 v₂ 走。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口：为什么 100 m/s² 这么大</p>
<p class="s-b">0.2 s 内速度从 +8 变到 −12，改变了 20 m/s，平均每秒改变 100 m/s，所以 a 的大小是 100 m/s²。
答题卡上要同时写「大小 100 m/s²」和「方向向左」，只写 −100 会丢方向的文字说明。</p>
<p class="s-k">用到：矢量答大小 + 方向；负号只是方向，不是大小。</p>
</li>
</ol>
<div class="exbar">
  <button id="gxNext" type="button">下一步</button>
  <span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">规定向右为正方向，则 v₁ = +8 m/s，v₂ = −12 m/s。<br>
Δv = v₂ − v₁ = −12 − 8 = <b>−20 m/s</b>，即方向向左、大小 20 m/s。<br>
a = Δv / Δt = −20 / 0.2 = <b>−100 m/s²</b>，即加速度大小为 <b>100 m/s²</b>，方向<b>向左</b>。</p>
</div>
<p class="gx-note">如果只算「12 − 8 = 4」，再除以 0.2 得 20 m/s²，方向还会判反。矢量题的第一句永远是「规定正方向」。</p>
</div>
</section>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>考你会怎么考</h2>
<p class="gx-h2s">六种问法，核心都是「a 描述速度变化，不描述速度本身」。</p>

<div class="gx-qa">
<div class="qac">
<p class="q">速度大，加速度一定大吗？</p>
<p class="a"><b>不一定。</b>高铁以 300 km/h 匀速巡航，速度很大，但速度不变，a = 0。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="速度很大但匀速时加速度为零">
  <line x1="24" y1="82" x2="216" y2="82" stroke="#5a6472"/>
  <g fill="#7c3aed"><circle cx="50" cy="82" r="4"/><circle cx="94" cy="82" r="4"/><circle cx="138" cy="82" r="4"/><circle cx="182" cy="82" r="4"/></g>
  <text x="120" y="48" text-anchor="middle" font-size="12" fill="#6d28d9">v 很大，但间距相等</text>
  <text x="120" y="112" text-anchor="middle" font-size="11" fill="#2f8a5b">a = 0</text>
</svg>
</div>
<div class="qac">
<p class="q">速度变化大，加速度一定大吗？</p>
<p class="a"><b>不一定。</b>a = Δv/Δt，还要看用了多长时间。变化 10 m/s 用 10 s，a 只有 1 m/s²。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="速度变化大但时间长时加速度不一定大">
  <rect x="26" y="42" width="52" height="52" fill="#7c3aed" opacity=".75"/>
  <text x="52" y="114" text-anchor="middle" font-size="10" fill="#6b7280">Δv 大</text>
  <rect x="98" y="42" width="52" height="24" fill="#b8791f"/>
  <text x="124" y="114" text-anchor="middle" font-size="10" fill="#6b7280">Δt 也大</text>
  <text x="186" y="72" font-size="11" fill="#3a3a35">a 可能小</text>
</svg>
</div>
<div class="qac">
<p class="q">加速度为负，物体一定减速吗？</p>
<p class="a"><b>不一定。</b>要看 a 与 v 的方向。v = −10 m/s、a = −2 m/s² 时，两者都向左，速度大小在增大。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="速度和加速度都为负时，速度大小在增大">
  <line x1="200" y1="66" x2="40" y2="66" stroke="#7c3aed" stroke-width="3"/>
  <polygon points="28,66 42,60 42,72" fill="#7c3aed"/>
  <text x="120" y="54" text-anchor="middle" font-size="10.5" fill="#6d28d9">v（向左）</text>
  <line x1="200" y1="96" x2="40" y2="96" stroke="#b8402f" stroke-width="3"/>
  <polygon points="28,96 42,90 42,102" fill="#b8402f"/>
  <text x="120" y="118" text-anchor="middle" font-size="10.5" fill="#b8402f">a（也向左）</text>
</svg>
</div>
<div class="qac">
<p class="q">加速度减小，速度一定减小吗？</p>
<p class="a"><b>不一定。</b>只要 a 仍与 v 同向，速度就仍在增大，只是「增大得越来越慢」。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="加速度减小但仍与速度同向时，速度继续增大">
  <path d="M30 110 Q90 80 130 62 T210 44" fill="none" stroke="#7c3aed" stroke-width="2.6"/>
  <text x="120" y="124" text-anchor="middle" font-size="10.5" fill="#6b7280">斜率变小，但仍在上升</text>
</svg>
</div>
<div class="qac">
<p class="q">速度为零，加速度一定为零吗？</p>
<p class="a"><b>不一定。</b>竖直上抛的小球在最高点 v = 0，但 a 仍为 g，方向向下。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="最高点速度为零但加速度不为零">
  <line x1="120" y1="18" x2="120" y2="114" stroke="#cfd4da" stroke-dasharray="4 4"/>
  <circle cx="120" cy="48" r="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
  <line x1="120" y1="68" x2="120" y2="100" stroke="#b8402f" stroke-width="2.4"/>
  <polygon points="120,110 115,98 125,98" fill="#b8402f"/>
  <text x="150" y="50" font-size="10.5" fill="#b8402f">v=0，a≠0</text>
</svg>
</div>
<div class="qac">
<p class="q">v–t 图像的斜率表示什么？</p>
<p class="a"><b>加速度。</b>斜率 = Δv/Δt：正负表示 a 的方向，陡峭程度表示 a 的大小。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="v-t图像的斜率表示加速度">
  <line x1="30" y1="106" x2="210" y2="106" stroke="#5a6472"/>
  <line x1="30" y1="106" x2="30" y2="24" stroke="#5a6472"/>
  <line x1="30" y1="96" x2="190" y2="36" stroke="#7c3aed" stroke-width="2.6"/>
  <line x1="30" y1="96" x2="190" y2="96" stroke="#9aa3ae" stroke-dasharray="4 3"/>
  <line x1="190" y1="96" x2="190" y2="36" stroke="#9aa3ae" stroke-dasharray="4 3"/>
  <text x="110" y="120" text-anchor="middle" font-size="10" fill="#6b7280">斜率 = Δv/Δt = a</text>
</svg>
</div>
</div>
<p class="gx-note">六问的通用顺序：① 先看 a 与 v 同向还是反向；② 再看 a 是「变不变」，不是「大不大」；③ 矢量题先定正方向，再代符号。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是考场高频错句，右边是能得分的表述。加速度这一节，错得最多的不是公式，是「方向」。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ Δv = 12 − 8 = 4 m/s。</p>
<p class="er-v">✓ Δv = v₂ − v₁ = −12 − (+8) = −20 m/s。</p>
<p class="er-w">速度方向相反时，要先带符号再相减；两个大小直接减会丢方向。</p>
</div>
<div class="er">
<p class="er-x">✗ 速度变化越大，加速度一定越大。</p>
<p class="er-v">✓ a = Δv/Δt，还要看发生这一变化用了多长时间。</p>
<p class="er-w">变化大但时间很长，a 可能很小；变化小但时间极短，a 可能很大。</p>
</div>
<div class="er">
<p class="er-x">✗ 加速度为负，物体就在减速。</p>
<p class="er-v">✓ 负号只表示 a 的方向与正方向相反；减速要看 a 与 v 是否反向。</p>
<p class="er-w">v = −10 m/s、a = −2 m/s² 时，两者同向，速度大小在增大。</p>
</div>
<div class="er">
<p class="er-x">✗ 加速度减小，速度一定减小。</p>
<p class="er-v">✓ 只要 a 仍与 v 同向，速度就仍在增大，只是增大得慢一些。</p>
<p class="er-w">a 描述「速度变化的快慢」，不描述「速度变大还是变小」。</p>
</div>
<div class="er">
<p class="er-x">✗ 速度为零，加速度一定为零。</p>
<p class="er-v">✓ 速度为零只说明这一瞬间不动；加速度可以不为零，如竖直上抛的最高点。</p>
<p class="er-w">v = 0 是「速度过零」，不是「速度不再变化」。</p>
</div>
<div class="er">
<p class="er-x">✗ 加速度的方向与速度方向相同。</p>
<p class="er-v">✓ 加速度的方向与 Δv 的方向相同；与 v 同向只发生在加速时。</p>
<p class="er-w">减速时 a 与 v 反向；反向加速时 a 与 v 同向（都向左或都为负）。</p>
</div>
</div>
</section>

<p class="gx-note" style="border-top:1px solid var(--line);padding-top:14px">第一章到这里收口：<b>质点、参考系 → 时间、位移 → 速度 → 加速度</b>。
下一章从「实验：探究小车速度随时间变化的规律」开始，把 v–t 图变成定量关系。</p>

<script src="../../assets/autopilot.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var $ = GX.$;
  var stage = $("gxStage");
  var A = 5;
  var V0 = 10, T = 2.5;
  var X0 = 40, X1 = 346, Y0 = 258, Y1 = 30, TMAX = 4.4, VMIN = -5, VMAX = 25;

  function px(t) { return X0 + t / TMAX * (X1 - X0); }
  function py(v) { return Y0 - (v - VMIN) / (VMAX - VMIN) * (Y0 - Y1); }

  function calc(a) {
    var v = V0 + a * T;
    var dv = a * T;
    if (Math.abs(v) <= 0.05) {
      return { v: v, dv: dv, st: "速度恰好为 0", col: "#b8402f", bg: "#fbeae7",
               sn: "Δv = " + fmt(dv) + " m/s；下一刻将反向" };
    }
    if (v > 0 && a > 0.2) {
      return { v: v, dv: dv, st: "加速", col: "#2f8a5b", bg: "#e6f6ee",
               sn: "Δv = " + fmt(dv) + " m/s；a 与 v 同向" };
    }
    if (v > 0 && Math.abs(a) <= 0.2) {
      return { v: v, dv: dv, st: "匀速", col: "#2f6fd0", bg: "#eef5fc",
               sn: "a = 0，v 保持 10.0 m/s" };
    }
    if (v > 0) {
      return { v: v, dv: dv, st: "减速", col: "#b8791f", bg: "#fdf3e0",
               sn: "Δv = " + fmt(dv) + " m/s；a 与 v 反向" };
    }
    return { v: v, dv: dv, st: "已反向", col: "#b8402f", bg: "#fbeae7",
             sn: "Δv = " + fmt(dv) + " m/s；a 与 v 同向（都向左）" };
  }

  function fmt(v) {
    if (Math.abs(v) < 0.05) return "0.0";
    return (v > 0 ? "+" : "−") + Math.abs(v).toFixed(1);
  }

  function render() {
    var s = calc(A);
    var y0 = py(V0), yn = py(s.v), xnow = px(T);
    $("gxLine").setAttribute("x1", px(0));
    $("gxLine").setAttribute("y1", y0);
    $("gxLine").setAttribute("x2", px(4.2));
    $("gxLine").setAttribute("y2", py(V0 + A * 4.2));
    $("gxNow").setAttribute("cx", xnow);
    $("gxNow").setAttribute("cy", yn);
    $("gxTriV").setAttribute("x2", xnow);
    $("gxTriV").setAttribute("y2", yn);
    $("gxTriV").style.opacity = Math.abs(A) < 0.1 ? "0" : "1";
    $("gxDvLab").setAttribute("x", xnow + 6);
    $("gxDvLab").setAttribute("y", (y0 + yn) / 2 + 4);
    $("gxDvLab").style.opacity = Math.abs(A) < 0.1 ? "0" : "1";

    $("gxVa").textContent = fmt(A) + " m/s²";
    $("gxVb").textContent = fmt(s.v) + " m/s";
    $("gxVs").textContent = s.st;
    $("gxVsn").textContent = s.sn;
    $("gxStBox").style.background = s.bg;
    $("gxStBox").style.borderColor = s.col + "44";
    $("gxVs").style.color = s.col;
  }

  var ap = null, dragging = false, moved = false, downX = 0, suppressTap = false;

  function xToA(clientX) {
    var r = stage.getBoundingClientRect();
    var f = (clientX - r.left) / r.width;
    var a = -5 + f * 10;
    return Math.max(-5, Math.min(5, Math.round(a * 2) / 2));
  }

  stage.addEventListener("pointerdown", function (ev) {
    dragging = true; moved = false; downX = ev.clientX;
    if (ap) ap.take();
    A = xToA(ev.clientX);
    if (ap) ap.setValue(A, false);
    render();
    try { stage.setPointerCapture(ev.pointerId); } catch (e) {}
  });
  stage.addEventListener("pointermove", function (ev) {
    if (!dragging) return;
    if (Math.abs(ev.clientX - downX) > 4) moved = true;
    A = xToA(ev.clientX);
    if (ap) ap.setValue(A, false);
    render();
  });
  stage.addEventListener("pointerup", function () {
    if (moved) suppressTap = true;
    dragging = false;
  });
  stage.addEventListener("click", function (ev) {
    if (!suppressTap) return;
    suppressTap = false;
    ev.stopImmediatePropagation();
  });

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  render();
  ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 5 }, { t: 2, v: 0 }, { t: 3.5, v: 0 }, { t: 5, v: -3 },
           { t: 7, v: -3 }, { t: 8.5, v: -4 }, { t: 10.5, v: -4 }, { t: 12, v: -5 }, { t: 13.5, v: 5 }],
    keys: [5, 0, -3, -4, -5],
    value: A, min: -5, max: 5, step: 0.5,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc };
});
</script>
