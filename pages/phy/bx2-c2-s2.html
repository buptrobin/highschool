<p class="gx-claim">做圆周运动的物体，合力必须指向圆心。<b>这个“指向圆心的合力”就叫向心力</b>——它不是一种新的力，而是现有力的合力扮演的角色。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本原话，拆成三句</h2>
<div class="q-src">人教版必修第二册 · 第六章第 2 节</div>

<div class="q">
<p class="q-t">“做匀速圆周运动的物体所受的合力指向圆心。”</p>
<p class="q-b">速度大小不变，但方向一直改变，所以一定有加速度；加速度指向圆心，合力也指向圆心。<b>合力不是“额外多出来”的，它就是重力、支持力、摩擦力、绳的拉力等真实力的合力。</b></p>
</div>

<div class="q">
<p class="q-t">“向心力是按效果命名的力。”</p>
<p class="q-b">“向心”描述的是<b>作用效果</b>——把物体拉向圆心、改变速度方向；不是像重力、弹力、摩擦力那样的性质力。受力分析时不要画一个“向心力”，而要画真实的力，再求它们的合力。</p>
</div>

<div class="q">
<p class="q-t">“向心力的大小 F = mω²r，也可以写成 F = mv²/r。”</p>
<p class="q-b">同一个圆上，ω 越大、r 越大、m 越大，需要的向心力越大；用线速度写就是 F = mv²/r。两个式子本质相同，因为 v = ωr。</p>
</div>

<p class="gx-note">读法：先找“谁提供向心力”，再代公式。绳拉球是绳的拉力，汽车转弯是静摩擦力，圆锥摆是重力与拉力的合力。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己写，再点“下一步”。这题的关键是：先用 v 求 ω，再用 F = mω²r 或 F = mv²/r。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 绳拉小球的向心力<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">质量 m = 0.5 kg 的小球，用长 r = 2 m 的绳拉着，在光滑水平面上以 v = 4 m/s 做匀速圆周运动。求：
（1）小球的角速度 ω 和向心加速度 a；
（2）绳的拉力 F；
（3）若线速度增大到 8 m/s，绳的拉力变为多少？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 先判断谁提供向心力</p>
<p class="s-b">小球在光滑水平面上，竖直方向受重力与支持力，二者平衡；水平方向只有绳的拉力。
绳沿半径指向圆心，所以<b>绳的拉力就是向心力</b>。不要再额外画一个“向心力”，否则会多算一个力。</p>
<p class="s-k">用到：向心力是效果力，由真实的力（这里是小绳拉力）提供。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 由 v 求 ω 和 a</p>
<p class="s-b">ω = v/r = 4/2 = <b>2 rad/s</b>。
向心加速度 a = v²/r = 16/2 = <b>8 m/s²</b>，方向指向圆心。
用 a = ω²r 核对：2² × 2 = 8 m/s²，一致。</p>
<p class="s-k">用到：v = ωr，a = v²/r = ω²r。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 求绳的拉力</p>
<p class="s-b">由牛顿第二定律，合力提供向心力：
F = ma = 0.5 × 8 = <b>4 N</b>。
用 F = mv²/r 核对：0.5 × 16/2 = 4 N；用 F = mω²r 核对：0.5 × 4 × 2 = 4 N，三种算法一致。</p>
<p class="s-k">用到：F = ma = mv²/r = mω²r。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · v 加倍，F 变几倍</p>
<p class="s-b">r 不变、m 不变，F = mv²/r 中 F 与 v² 成正比。
v 从 4 m/s 增到 8 m/s，v 变为 2 倍，F 变为 <b>2² = 4 倍</b>：
F′ = 0.5 × 64/2 = <b>16 N</b>。</p>
<p class="s-k">用到：F ∝ v²（r 不变），不是 F ∝ v。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 写答案，标方向</p>
<p class="s-b">（1）ω = 2 rad/s，a = 8 m/s²，方向指向圆心；
（2）F = 4 N，方向沿绳指向圆心；
（3）v = 8 m/s 时 F = 16 N。
注意：绳的拉力是<b>指向圆心</b>的，不是沿速度方向；它只改变速度方向，不改变速率。</p>
<p class="s-k">用到：向心力方向始终指向圆心，与速度垂直。</p>
</li>
</ol>
<div class="exbar">
  <button id="gxNext" type="button">下一步</button>
  <span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）ω = v/r = 4/2 = <b>2 rad/s</b>；a = v²/r = 16/2 = <b>8 m/s²</b>，方向指向圆心。<br>
（2）绳的拉力提供向心力：F = ma = 0.5 × 8 = <b>4 N</b>，方向沿绳指向圆心。<br>
（3）r 不变时 F ∝ v²，v 加倍，F 变为 4 倍：<b>F′ = 16 N</b>。</p>
</div>
<p class="gx-note">阅卷高频扣分：把绳的拉力画成沿切线；漏写“指向圆心”；v 加倍时把 F 也算成 2 倍；把向心力当成独立的第三个力。</p>
</div>
</section>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>考你会怎么考</h2>
<p class="gx-h2s">六种问法，一半在考“谁提供向心力、方向指哪”。</p>

<div class="gx-qa">
<div class="qac">
<p class="q">向心力是一种新的力吗？</p>
<p class="a"><b>不是。</b>它是按效果命名的力，由重力、弹力、摩擦力等真实力的合力提供。受力分析时画真实力，不画“向心力”。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="向心力是真实力的合力，不是额外的力">
  <circle cx="120" cy="66" r="42" fill="none" stroke="#d8ccfb" stroke-width="1.5"/>
  <circle cx="162" cy="66" r="7" fill="#7c3aed"/>
  <line x1="162" y1="66" x2="128" y2="66" stroke="#b8402f" stroke-width="2.4"/>
  <polygon points="120,66 134,60 134,72" fill="#b8402f"/>
  <text x="120" y="18" text-anchor="middle" font-size="8.5" fill="#6b7280">真实力：绳的拉力</text>
  <text x="120" y="122" text-anchor="middle" font-size="8.5" fill="#8a5c14">合力效果 = 向心力</text>
</svg>
</div>
<div class="qac">
<p class="q">向心力的方向怎样？</p>
<p class="a"><b>始终指向圆心，与速度垂直。</b>所以它只改变速度方向，不改变速率；匀速圆周运动的速度大小才保持不变。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="向心力指向圆心，速度沿切线">
  <circle cx="120" cy="66" r="42" fill="none" stroke="#d8ccfb" stroke-width="1.5"/>
  <circle cx="162" cy="66" r="7" fill="#7c3aed"/>
  <line x1="162" y1="66" x2="128" y2="66" stroke="#b8402f" stroke-width="2.4"/>
  <polygon points="120,66 134,60 134,72" fill="#b8402f"/>
  <line x1="162" y1="66" x2="162" y2="26" stroke="#2f8a5b" stroke-width="2.2"/>
  <polygon points="162,18 156,30 168,30" fill="#2f8a5b"/>
  <text x="128" y="56" font-size="8.5" fill="#b8402f">F</text>
  <text x="170" y="40" font-size="8.5" fill="#1e6640">v</text>
</svg>
</div>
<div class="qac">
<p class="q">绳突然断了，小球沿什么方向飞？</p>
<p class="a"><b>沿断裂瞬间的切线方向。</b>绳的拉力消失，小球不再受向心力，合力为零，按惯性做匀速直线运动；不是沿半径向外飞。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="绳断后小球沿切线方向飞出">
  <circle cx="100" cy="66" r="34" fill="none" stroke="#d8ccfb" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="134" cy="66" r="7" fill="#7c3aed"/>
  <path d="M134 66 L206 26" stroke="#b8791f" stroke-width="2.4"/>
  <polygon points="214,22 198,26 204,36" fill="#b8791f"/>
  <text x="158" y="50" font-size="8.5" fill="#8a5c14">沿切线</text>
  <text x="120" y="122" text-anchor="middle" font-size="8.5" fill="#6b7280">不是沿半径向外</text>
</svg>
</div>
<div class="qac">
<p class="q">F = mv²/r 和 F = mω²r 有什么区别？</p>
<p class="a"><b>本质相同，看题目给的是 v 还是 ω。</b>给线速度用 mv²/r，给角速度用 mω²r；v = ωr 可以把两式互相转换。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="两个向心力公式通过线速度与角速度关系互相转换">
  <rect x="20" y="28" width="200" height="30" rx="6" fill="#f5f3ff" stroke="#d8ccfb"/>
  <text x="120" y="48" text-anchor="middle" font-size="11" fill="#6d28d9">F = mv²/r</text>
  <rect x="20" y="76" width="200" height="30" rx="6" fill="#eef5fc" stroke="#cfe0f7"/>
  <text x="120" y="96" text-anchor="middle" font-size="11" fill="#2f6fd0">F = mω²r</text>
  <text x="120" y="124" text-anchor="middle" font-size="8.5" fill="#6b7280">v = ωr</text>
</svg>
</div>
<div class="qac">
<p class="q">匀速圆周运动的合力为零吗？</p>
<p class="a"><b>不为零。</b>速度方向一直改变，加速度不为零，合力指向圆心。合力为零对应的是静止或匀速直线运动。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="匀速圆周运动合力不为零，指向圆心">
  <circle cx="120" cy="66" r="40" fill="none" stroke="#d8ccfb" stroke-width="1.5"/>
  <circle cx="160" cy="66" r="7" fill="#7c3aed"/>
  <line x1="160" y1="66" x2="124" y2="66" stroke="#b8402f" stroke-width="2.6"/>
  <polygon points="116,66 130,60 130,72" fill="#b8402f"/>
  <text x="120" y="20" text-anchor="middle" font-size="8.5" fill="#b8402f">合力 ≠ 0</text>
  <text x="120" y="122" text-anchor="middle" font-size="8.5" fill="#6b7280">方向指向圆心</text>
</svg>
</div>
<div class="qac">
<p class="q">向心力做功吗？</p>
<p class="a"><b>不做功。</b>向心力始终与速度垂直，W = F·s·cos90° = 0；所以它只改变速度方向，不改变动能和速率。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="向心力与速度垂直，不做功">
  <line x1="30" y1="100" x2="210" y2="100" stroke="#5a6472" stroke-width="1.2"/>
  <line x1="120" y1="100" x2="120" y2="36" stroke="#2f8a5b" stroke-width="2.2"/>
  <polygon points="120,28 114,42 126,42" fill="#2f8a5b"/>
  <line x1="120" y1="100" x2="60" y2="100" stroke="#b8402f" stroke-width="2.4"/>
  <polygon points="52,100 66,94 66,106" fill="#b8402f"/>
  <text x="128" y="52" font-size="8.5" fill="#1e6640">v</text>
  <text x="58" y="92" font-size="8.5" fill="#b8402f">F</text>
  <text x="120" y="124" text-anchor="middle" font-size="8.5" fill="#6b7280">F ⊥ v，W = 0</text>
</svg>
</div>
</div>
<p class="gx-note">六问归成一条：<b>先找真实力，再指向圆心，最后用 F = mv²/r 或 F = mω²r</b>。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>六条易错，逐条改</h2>

<div class="er">
<p class="er-x">✗ 向心力是物体受到的另一种力，要单独画。</p>
<p class="er-v">✓ 向心力是效果力，由真实力的合力提供。</p>
<p class="er-w">受力分析只画重力、弹力、摩擦力等；向心力是这些力的合力效果。</p>
</div>
<div class="er">
<p class="er-x">✗ 向心力的方向沿切线。</p>
<p class="er-v">✓ 向心力始终指向圆心，与速度垂直。</p>
<p class="er-w">沿切线的是速度方向；向心力负责把速度“拧”向圆心。</p>
</div>
<div class="er">
<p class="er-x">✗ 绳断后，小球沿半径向外飞。</p>
<p class="er-v">✓ 绳断后小球沿切线方向做匀速直线运动。</p>
<p class="er-w">向心力突然消失，合力为零，物体保持断裂瞬间的速度方向。</p>
</div>
<div class="er">
<p class="er-x">✗ 半径不变时，F 与 v 成正比。</p>
<p class="er-v">✓ F = mv²/r，F 与 v² 成正比；v 加倍，F 变 4 倍。</p>
<p class="er-w">这是本节最常设的“倍数陷阱”，先平方再比较。</p>
</div>
<div class="er">
<p class="er-x">✗ 向心力会改变物体的速率。</p>
<p class="er-v">✓ 向心力与速度垂直，不做功，只改变方向。</p>
<p class="er-w">匀速圆周运动的“匀速”指速率不变，速度方向一直在变。</p>
</div>
<div class="er">
<p class="er-x">✗ 向心力和“离心力”是一对平衡力。</p>
<p class="er-v">✓ 不存在与向心力平衡的“离心力”；合力就是向心力。</p>
<p class="er-w">“离心”只是惯性表现，不是物体受到的另一个力。</p>
</div>

<p class="gx-note">把图 1 的三个例子各说一遍“谁提供向心力”，比背十遍公式更有用。</p>
</section>

<script>
document.addEventListener("DOMContentLoaded", function () {
  var $ = GX.$;
  var M = 0.5, R = 1, RAD = 1;
  var W = 1;
  var stage = $("gxStage");

  function calc(w) {
    var v = w * R;
    var f = M * w * w * R;
    var st, note;
    if (f > 7.9) {
      st = "接近绳的限度"; note = "状态：F = " + f.toFixed(1) + " N，已接近模型设定的 8 N 上限。";
    } else if (f > 3) {
      st = "绳拉得较紧"; note = "状态：F = " + f.toFixed(1) + " N，绳的拉力明显增大。";
    } else {
      st = "绳的拉力较小"; note = "状态：F = " + f.toFixed(1) + " N，小球做匀速圆周运动。";
    }
    return { v: v, f: f, st: st, note: note };
  }

  function setArrow(id, hid, x1, y1, x2, y2) {
    var n = $(id);
    n.setAttribute("x1", x1.toFixed(1)); n.setAttribute("y1", y1.toFixed(1));
    n.setAttribute("x2", x2.toFixed(1)); n.setAttribute("y2", y2.toFixed(1));
    var ux = x2 - x1, uy = y2 - y1, L = Math.sqrt(ux * ux + uy * uy) || 1;
    ux /= L; uy /= L;
    var bx = x2 - 11 * ux, by = y2 - 11 * uy, px = -uy, py = ux;
    $(hid).setAttribute("points",
      x2.toFixed(1) + "," + y2.toFixed(1) + " " +
      (bx + 4.5 * px).toFixed(1) + "," + (by + 4.5 * py).toFixed(1) + " " +
      (bx - 4.5 * px).toFixed(1) + "," + (by - 4.5 * py).toFixed(1));
  }

  function render() {
    var s = calc(W);
    var cx = 150, cy = 160, rr = 86;
    var bx = cx + rr, by = cy;
    $("gxBall").setAttribute("cx", bx.toFixed(1));
    $("gxBall").setAttribute("cy", by.toFixed(1));
    $("gxRope").setAttribute("x1", cx); $("gxRope").setAttribute("y1", cy);
    $("gxRope").setAttribute("x2", bx); $("gxRope").setAttribute("y2", by);

    var fl = 20 + s.f * 5;
    setArrow("gxF", "gxFh", bx, by, bx - fl, by);
    $("gxFT").setAttribute("x", (bx - fl / 2 - 6).toFixed(1));
    $("gxFT").setAttribute("y", (by - 8).toFixed(1));

    var vl = 32 + s.v * 12;
    setArrow("gxV", "gxVh", bx, by, bx, by - vl);
    $("gxVT").setAttribute("x", (bx + 8).toFixed(1));
    $("gxVT").setAttribute("y", (by - vl + 4).toFixed(1));

    $("gxW").textContent = "ω = " + W.toFixed(1) + " rad/s";
    $("gxVw").textContent = W.toFixed(1) + " rad/s";
    $("gxVv").textContent = s.v.toFixed(1) + " m/s";
    $("gxVf").textContent = s.f.toFixed(1) + " N";
    $("gxTake").textContent = "ω = " + W.toFixed(1) + " rad/s 时 F = " + s.f.toFixed(1) +
      " N；ω 翻倍，F 变 4 倍——公式里 ω 是平方。";
    $("gxStateNote").textContent = s.note;
  }

  var ap = null;
  function setMode(m) {
    var b = $("gxAp"), t = $("gxApTxt");
    if (!b) return;
    b.classList.toggle("is-auto", m === "auto");
    b.classList.toggle("is-manual", m !== "auto");
    if (t) t.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  render();
  ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 1 }, { t: 2, v: 1 }, { t: 4, v: 2 }, { t: 6.5, v: 2 },
           { t: 8.5, v: 3 }, { t: 10.5, v: 3 }, { t: 12, v: 4 }, { t: 13.5, v: 1 }],
    keys: [1, 2, 3, 4],
    value: W, min: 1, max: 4, step: 0.1,
    idle: 5000,
    onChange: function (v) { W = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc };
});
</script>
