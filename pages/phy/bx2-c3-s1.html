<section class="gx-sec" id="a">
<h2><span class="sn">01</span>教材这么说</h2>
<p class="gx-h2s">开普勒三定律：原话 → 人话。</p>

<div class="gx-quote">
<p class="q-t">教材原话 · 第一定律（轨道）<span class="q-src">人教版必修第二册</span></p>
<p class="q-b">所有行星绕太阳运动的轨道都是椭圆，太阳处在椭圆的一个焦点上。</p>
<p class="q-n"><b>人话：</b>太阳只在一个焦点上，另一个空着；所以有近日点、远日点。</p>
</div>

<div class="gx-quote">
<p class="q-t">教材原话 · 第二定律（面积）</p>
<p class="q-b">对任意一个行星来说，它与太阳的连线在相等的时间内扫过相等的面积。</p>
<p class="q-n"><b>人话：</b>近日点半径短就走得快，远日点半径长就慢；速度变是为了面积不变。</p>
</div>

<div class="gx-quote">
<p class="q-t">教材原话 · 第三定律（周期）</p>
<p class="q-b">所有行星轨道的半长轴的三次方跟它的公转周期的二次方的比都相等。</p>
<p class="q-n"><b>人话：</b><b>a³/T² = k</b>。a 是半长轴，不是距离；k 只由中心天体决定。</p>
</div>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先认中心天体，再列比例。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 火星的公转周期<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">地球 T = 1 年、a = 1 AU。火星 a = 1.52 AU，求火星的公转周期（两位有效数字）。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 认中心天体</p>
<p class="s-b">都绕太阳，中心天体相同，所以 k 相同：
<b>T火²/T地² = a火³/a地³</b>。用比例式可以避开 k 的数值。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 化成 T火</p>
<p class="s-b"><b>T火 = (a火/a地)^{3/2} · T地 = 1.52^{3/2}</b> 年。指数是 3/2，不是 3 或 2/3。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 算数</p>
<p class="s-b">√1.52 ≈ 1.233，1.52 × 1.233 ≈ <b>1.87</b>，所以 <b>T火 ≈ 1.87 年</b>，约 1 年 10 个月。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 回答大小</p>
<p class="s-b">1.87 年 &gt; 1 年，<b>火星的一年更长</b>。a 越大，T 越大，定性结论一致。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 换个问法</p>
<p class="s-b">角速度用 <b>ω = 2π/T</b>，ω火/ω地 ≈ 0.53。若问火星表面的 g，<b>不能</b>用这个 k，要换 g = GM火/R火²。</p>
</li>
</ol>
<div class="exbar">
  <button id="gxNext" type="button">下一步</button>
  <span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">答案</p>
<p class="ans-b">T火 = 1.52^{3/2} 年 ≈ <b>1.87 年</b>，比地球的一年长。</p>
</div>
</div>
</section>

<div class="qac">
<p class="q">6. 圆轨道算椭圆吗？</p>
<p class="a"><b>算</b>：e = 0 的特例，两焦点重合，r_p = r_a = a。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>六个坑</h2>
<p class="gx-h2s">都是一句话看着像对的。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 太阳在椭圆中心</p>
<p class="er-v">✓ 太阳在一个焦点上，另一个焦点空着</p>
<p class="er-w">为什么错：中心不是焦点；画错则近日点、面积定律一起错。</p>
</div>
<div class="er">
<p class="er-x">✗ 行星做匀速运动</p>
<p class="er-v">✓ 近日点最快、远日点最慢</p>
<p class="er-w">为什么错：半径一变速度就得变；只有 e = 0 才匀速。</p>
</div>
<div class="er">
<p class="er-x">✗ 离太阳越远，周期越短</p>
<p class="er-v">✓ a 越大，T 越大，T ∝ a^{3/2}</p>
<p class="er-w">为什么错：海王星比地球远，一年也长；别把速度和周期混了。</p>
</div>
<div class="er">
<p class="er-x">✗ k 对所有天体都相同</p>
<p class="er-v">✓ 只对同一中心天体的系统相同</p>
<p class="er-w">为什么错：k = GM/4π²，M 变了 k 就变，不能跨系统套。</p>
</div>
<div class="er">
<p class="er-x">✗ a 是行星到太阳的距离</p>
<p class="er-v">✓ a 是半长轴，r 才是行星到太阳的距离</p>
<p class="er-w">为什么错：r 一直变，a 是常数；把 a 当 r 代入必错。</p>
</div>
<div class="er">
<p class="er-x">✗ 开普勒定律不适用于卫星</p>
<p class="er-v">✓ 卫星同样适用，只是 k 换成中心天体的 k</p>
<p class="er-w">为什么错：月球绕地球也能用 a³/T² = k。</p>
</div>
</div>

<div class="gx-foot">
<p><b>口径：</b>人教版《物理》必修第二册第七章第 1 节。a 用 AU、T 用年时，太阳系行星 k ≈ 1.00 AU³/年²，精确值 k = GM☉/4π²；行星数据取近似值（水星 0.387/0.241，地球 1/1，火星 1.524/1.881）。图均为示意，椭圆扁率放大；互动是 a = 1 AU、e ∈ [0, 0.8] 的模型值。</p>
<p>三定律是观测总结（1609、1619），牛顿用万有引力解释。</p>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  var $ = GX.$, n1 = GX.n1, sl = $("gxSl"), orb = $("gxOrbit"), sun = $("gxSun"),
      emp = $("gxEmpty"), pl = $("gxPlanet"), ray = $("gxRay"), st = $("gxState"),
      apEl = $("gxAp"), apTxt = $("gxApTxt");
  var vE = $("gxVe"), vP = $("gxVp"), vA = $("gxVa"), sE = $("gxVes");
  var CX = 280, CY = 180, A = 170;

  function point(E, e) {
    var b = A * Math.sqrt(1 - e * e);
    return [CX + A * Math.cos(E), CY + b * Math.sin(E)];
  }
  function solve(M, e) {
    var E = M, i;
    for (i = 0; i < 4; i++) E -= (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
    return E;
  }
  function render(e) {
    var sx = CX - A * e, p = point(solve(((performance.now() / 13000) % 1) * 6.2832, e), e);
    orb.setAttribute("ry", n1(A * Math.sqrt(1 - e * e)));
    sun.setAttribute("cx", n1(sx));
    emp.setAttribute("cx", n1(CX + A * e));
    pl.setAttribute("cx", n1(p[0]));
    pl.setAttribute("cy", n1(p[1]));
    ray.setAttribute("x1", n1(sx));
    ray.setAttribute("x2", n1(p[0]));
    ray.setAttribute("y2", n1(p[1]));
    vE.textContent = e.toFixed(2);
    vP.textContent = (1 - e).toFixed(2) + " AU";
    vA.textContent = (1 + e).toFixed(2) + " AU";
    sE.textContent = e < 0.005 ? "e = 0：圆轨道" : "e = " + e.toFixed(2) + "：越扁";
    st.textContent = e < 0.005 ? "圆轨道：r_p = r_a = 1.00 AU"
      : (e < 0.4 ? "椭圆轨道：太阳在焦点" : "越扁，近日点越快");
  }

  var ap = AutoPilot.create({
    value: 0, min: 0, max: 0.8, step: 0.01, follow: sl, mount: $("gxStage"),
    loop: [{t:0,v:0},{t:2,v:0},{t:3.5,v:0.3},{t:5,v:0.5},{t:7.5,v:0.5},{t:9,v:0.8},{t:12,v:0.8},{t:13,v:0}],
    keys: [0, 0.3, 0.5, 0.8], idle: 5000,
    onChange: render,
    onMode: function (m) {
      apEl.className = "gx-ap " + (m === "auto" ? "is-auto" : "is-manual");
      apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了（5 秒后自动）";
    }
  });
  window.__ap = ap;
  render(0);
});
</script>
