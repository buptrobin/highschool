<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">四个定义：重力的大小和方向、重心、弹力的条件、胡克定律。四条全是「一字之差就扣分」的地方。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 重力<span class="q-src">人教版必修第一册 · 第三章第 1 节</span></p>
<p class="q-b">由于地球的吸引而使物体受到的力叫作重力。重力的大小跟物体的质量成正比，即 G = mg，方向竖直向下。</p>
<p class="q-n">→ m 是质量，单位 kg；g 取 9.8 N/kg（粗略计算取 10 N/kg）；G 的单位是 N。
同一个物体在月球上 m 不变、G 约变为地球上的 1/6——变的是「地球的吸引」，不是「物体本身」。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 重心<span class="q-src">人教版必修第一册 · 第三章第 1 节</span></p>
<p class="q-b">从效果上看，可以认为物体各部分受到的重力集中于一点，这一点叫作物体的重心。重心的位置与物体的形状及质量分布有关。</p>
<p class="q-n">→ 「效果上」三个字是重点：重心是一个<b>等效作用点</b>，不是物体上真有一个「重力最集中的地方」。
质量分布均匀、形状规则的物体，重心在几何中心；圆环、直角尺这类物体，重心可以落在物体外面。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 弹力<span class="q-src">人教版必修第一册 · 第三章第 1 节</span></p>
<p class="q-b">发生弹性形变的物体，由于要恢复原状，对与它接触的物体会产生力的作用，这种力叫作弹力。</p>
<p class="q-n">→ 两个条件缺一不可：<b>接触</b> + <b>发生弹性形变</b>。方向：压力、支持力垂直于接触面；绳的拉力沿绳指向绳收缩的方向。
形变一消失，弹力同时消失——这也是弹力和重力最大的区别：重力不用接触，弹力必须接触。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 胡克定律<span class="q-src">人教版必修第一册 · 第三章第 1 节</span></p>
<p class="q-b">在弹性限度内，弹簧发生弹性形变时，弹力的大小 F 跟弹簧伸长（或缩短）的长度 x 成正比，即 F = kx。</p>
<p class="q-n">→ x 是<b>形变量</b>：x = |L − L₀|，不是弹簧长度 L，也不是原长 L₀。k 叫劲度系数，单位 N/m，由弹簧本身（材料、粗细、匝数、长度）决定。
这个式子只在<b>弹性限度内</b>成立，拉过头就不成正比了。</p>
</div>

<p class="gx-note">三个「不是」先记住：<b>G 不是质量</b>、<b>重心不一定在物体上</b>、<b>x 不是长度</b>。
这一节所有选择题，几乎都是在这三处换掉一个词。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">弹簧题只有三个坑：cm 没换 m、x 用了长度、最后把形变量当成长度交卷。跟着五步走，一个都躲得开。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 胡克定律<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">一根弹簧原长 10 cm，挂上 2 N 的钩码后长度变为 12 cm，弹簧始终在弹性限度内。求：<br>
（1）这根弹簧的劲度系数 k；（2）改挂 3 N 钩码时，弹簧的长度。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 先把三个长度分开写</p>
<p class="s-b">原长 L₀ = 10 cm；挂 2 N 后长度 L = 12 cm；形变量 x = L − L₀ = 2 cm。
公式 F = kx 里的 x 是第三个，不是 12 cm，也不是 10 cm。</p>
<p class="s-k">用到：胡克定律中 x 是形变量，x = |L − L₀|。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 把 cm 换成 m</p>
<p class="s-b">2 cm = 0.02 m。k 的单位是 N/m，用 cm 代进去会算出 100 N/cm，数值对、单位错，照样扣分。</p>
<p class="s-k">用到：统一到国际单位制，长度用 m、力用 N。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 由 F = kx 求 k</p>
<p class="s-b">k = F / x = 2 N ÷ 0.02 m = <b>100 N/m</b>。
含义是：这根弹簧每伸长 1 m，需要 100 N 的力；伸长 1 cm 需要 1 N。</p>
<p class="s-k">用到：F = kx 的变形；k 由弹簧本身决定。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 换 3 N，求新的形变量</p>
<p class="s-b">同一根弹簧 k 不变：x′ = F′ / k = 3 N ÷ 100 N/m = 0.03 m = 3 cm。
这一步只算出「伸长了 3 cm」，还不是题目要的「长度」。</p>
<p class="s-k">用到：同一条 F–x 直线上，F 与 x 成正比。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 形变量加回原长，才是长度</p>
<p class="s-b">L′ = L₀ + x′ = 10 cm + 3 cm = <b>13 cm</b>。
题目问「长度」答 13 cm，问「形变量」答 3 cm——看清问的是哪个词再落笔。</p>
<p class="s-k">用到：L = L₀ + x；答题卡上写清问的是长度还是形变量。</p>
</li>
</ol>
<div class="exbar">
  <button id="gxNext" type="button">下一步</button>
  <span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）形变量 x = L − L₀ = 12 cm − 10 cm = 2 cm = 0.02 m。<br>
由 F = kx 得 k = F/x = 2 N ÷ 0.02 m = <b>100 N/m</b>。<br>
（2）挂 3 N 钩码时，x′ = F′/k = 3 N ÷ 100 N/m = 0.03 m = 3 cm。<br>
弹簧长度 L′ = L₀ + x′ = 10 cm + 3 cm = <b>13 cm</b>。</p>
</div>
<p class="gx-note">这题的标准答案里，「形变量」和「长度」各出现一次，两个都要写。只写 13 cm 而不写 100 N/m，第一问就空了。</p>
</div>
</section>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>考你会怎么考</h2>
<p class="gx-h2s">六种问法，全部围着三个词转：质量 / 重力、竖直 / 垂直、长度 / 形变量。</p>

<div class="gx-qa">
<div class="qac">
<p class="q">质量和重力是一回事吗？</p>
<p class="a"><b>不是。</b>质量 m 是物体本身的属性，单位 kg，到哪里都不变；重力 G = mg 是地球的吸引，单位 N。同一个你在月球上 m 不变，G 约为地球上的 1/6。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="同一个物体在地球和月球上质量不变，重力变为六分之一">
  <circle cx="56" cy="58" r="24" fill="#e6f6ee" stroke="#2f8a5b" stroke-width="2"/>
  <text x="56" y="63" text-anchor="middle" font-size="11" fill="#1e6640">地球</text>
  <circle cx="168" cy="58" r="15" fill="#f2f4f6" stroke="#9aa3ae" stroke-width="2"/>
  <text x="168" y="62" text-anchor="middle" font-size="9.5" fill="#6b7280">月球</text>
  <text x="56" y="96" text-anchor="middle" font-size="10.5" fill="#3a3a35">G = mg</text>
  <text x="168" y="96" text-anchor="middle" font-size="10.5" fill="#3a3a35">G′ ≈ mg/6</text>
  <text x="120" y="120" text-anchor="middle" font-size="10.5" fill="#6b7280">m 不变，G 变了</text>
</svg>
</div>
<div class="qac">
<p class="q">重心一定在物体上吗？</p>
<p class="a"><b>不一定。</b>重心是重力的等效作用点。圆环的重心在圆心、直角尺的重心在拐角外侧，那里的位置是空的。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="圆环的重心在圆心的空气里">
  <circle cx="120" cy="62" r="38" fill="none" stroke="#7c3aed" stroke-width="13"/>
  <circle cx="120" cy="62" r="4.5" fill="#b8402f"/>
  <line x1="120" y1="62" x2="120" y2="30" stroke="#b8402f" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="128" y="34" font-size="10.5" fill="#b8402f">重心</text>
  <text x="120" y="120" text-anchor="middle" font-size="10.5" fill="#6b7280">圆心处没有材料</text>
</svg>
</div>
<div class="qac">
<p class="q">重力的方向是「垂直斜面向下」吗？</p>
<p class="a"><b>不是。</b>重力方向永远竖直向下。垂直于斜面向下的是重力的分力 mg cosθ，大小随倾角变化。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="重力竖直向下，垂直斜面的是分力">
  <polygon points="34,108 206,108 206,52" fill="#f2f4f6" stroke="#cfd4da"/>
  <line x1="34" y1="108" x2="206" y2="52" stroke="#5a6472" stroke-width="1.6"/>
  <line x1="120" y1="72" x2="120" y2="112" stroke="#b8402f" stroke-width="2.6"/>
  <polygon points="120,120 115,108 125,108" fill="#b8402f"/>
  <text x="128" y="92" font-size="10.5" font-weight="700" fill="#b8402f">G</text>
  <text x="120" y="30" text-anchor="middle" font-size="10.5" fill="#6b7280">竖直向下</text>
</svg>
</div>
<div class="qac">
<p class="q">F = kx 里的 x 是弹簧长度吗？</p>
<p class="a"><b>不是。</b>x 是形变量。原长 10 cm、现在 12 cm，x 是 2 cm，不是 12 cm。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="x是形变量，等于现长减原长">
  <line x1="60" y1="22" x2="180" y2="22" stroke="#b9c0c9" stroke-width="2"/>
  <path d="M120 22 L128 30 L112 38 L128 46 L112 54 L128 62 L112 70 L128 78 L120 84" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <line x1="96" y1="84" x2="96" y2="106" stroke="#2f8a5b" stroke-width="1.4"/>
  <line x1="88" y1="84" x2="104" y2="84" stroke="#2f8a5b" stroke-width="1.4"/>
  <line x1="88" y1="106" x2="104" y2="106" stroke="#2f8a5b" stroke-width="1.4"/>
  <text x="88" y="100" text-anchor="end" font-size="10.5" fill="#1e6640">x</text>
  <text x="120" y="126" text-anchor="middle" font-size="10.5" fill="#6b7280">x = L − L₀</text>
</svg>
</div>
<div class="qac">
<p class="q">弹簧剪成两半，劲度系数变吗？</p>
<p class="a"><b>变。</b>半根弹簧拉到同样的伸长量只需要一半的力，所以 k 约变为原来的 2 倍（延伸结论）。弹簧秤剪短了照原刻度读，读数会偏小。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="半根弹簧的劲度系数约为原来的两倍">
  <path d="M36 40 L46 48 L36 56 L46 64 L36 72 L46 80 L36 88 L46 96 L36 102" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <text x="42" y="120" text-anchor="middle" font-size="10.5" fill="#6d28d9">k</text>
  <path d="M140 40 L152 50 L140 60 L152 70 L140 80 L152 90 L140 100" fill="none" stroke="#2f8a5b" stroke-width="2"/>
  <text x="146" y="120" text-anchor="middle" font-size="10.5" fill="#1e6640">k′ ≈ 2k</text>
  <text x="190" y="70" font-size="10.5" fill="#6b7280">同样伸长</text>
  <text x="190" y="86" font-size="10.5" fill="#6b7280">力减半</text>
</svg>
</div>
<div class="qac">
<p class="q">超过弹性限度还能用 F = kx 吗？</p>
<p class="a"><b>不能。</b>超过后弹簧发生塑性形变，松手不能恢复原长，F 与 x 不再成正比，图线向下弯。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="超过弹性限度后F-x图线向下弯">
  <line x1="34" y1="106" x2="214" y2="106" stroke="#5a6472"/>
  <line x1="34" y1="106" x2="34" y2="24" stroke="#5a6472"/>
  <line x1="34" y1="106" x2="128" y2="54" stroke="#2f6fd0" stroke-width="2.4"/>
  <path d="M128 54 C 150 54 172 66 196 84" fill="none" stroke="#b8402f" stroke-width="2.4" stroke-dasharray="5 4"/>
  <line x1="128" y1="54" x2="128" y2="106" stroke="#b8791f" stroke-dasharray="4 3"/>
  <text x="132" y="122" font-size="10" fill="#8a5c14">弹性限度</text>
  <text x="120" y="40" text-anchor="middle" font-size="10.5" fill="#6b7280">超过后变弯</text>
</svg>
</div>
</div>
<p class="gx-note">六问其实是一件事：<b>先分清是哪个量，再看它受什么条件限制</b>。质量与重力分不清，单位就错；竖直与垂直分不清，方向就错；长度与形变量分不清，k 就错；限度不管，公式就错。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是作业和卷面上真出现过的写法，右边是能得分的表述。逐条对照，别只划对错。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 重力的单位是 kg，G = mg 算出几 kg 就是多重。</p>
<p class="er-v">✓ 重力 G 的单位是 N，质量 m 的单位是 kg；G = mg 中 g = 9.8 N/kg。</p>
<p class="er-w">kg 是质量的单位，N 是力的单位；1 kg 的物体重约 9.8 N，两者数值差一个 g。</p>
</div>
<div class="er">
<p class="er-x">✗ 重力方向垂直于斜面向下。</p>
<p class="er-v">✓ 重力方向竖直向下；垂直于斜面向下的是重力的一个分力 mg cosθ。</p>
<p class="er-w">「竖直」指指向地心方向，与斜面倾角无关；把分力当重力，受力分析就会多画一条线。</p>
</div>
<div class="er">
<p class="er-x">✗ F = kx 中 x 就是弹簧现在的长度。</p>
<p class="er-v">✓ x 是形变量，x = |L − L₀|，用现长减原长。</p>
<p class="er-w">原长 10 cm、现长 12 cm 代 0.12 m，k 会从 100 N/m 变成约 16.7 N/m，差 6 倍。</p>
</div>
<div class="er">
<p class="er-x">✗ 重心一定在物体上，找不到就是题出错了。</p>
<p class="er-v">✓ 重心是重力的等效作用点，可以在物体外，如圆环、直角尺。</p>
<p class="er-w">「等效」意味着它只是把各部分重力合成后的作用点，不必有材料。</p>
</div>
<div class="er">
<p class="er-x">✗ 两个物体挨在一起，就一定有弹力。</p>
<p class="er-v">✓ 弹力需要接触，并且发生弹性形变，两者缺一不可。</p>
<p class="er-w">并排靠着、没有相互挤压的两个木块，接触面没有形变，之间没有弹力。</p>
</div>
<div class="er">
<p class="er-x">✗ 弹簧拉得越长，F = kx 算得越准。</p>
<p class="er-v">✓ 胡克定律只在弹性限度内成立，超过后 F 与 x 不再成正比。</p>
<p class="er-w">超过弹性限度会发生塑性形变，弹簧不能恢复原长，公式失效。</p>
</div>
</div>
</section>

<p class="gx-note" style="border-top:1px solid var(--line);padding-top:14px">这一节把「力」这个字拆成了两种：<b>不用接触的重力</b>，和<b>必须接触的弹力</b>。
下一节摩擦力同样要求接触，但它还多一个条件——两个物体之间得有相对运动或相对运动的趋势。</p>

    $("gxXLine").setAttribute("y2", bottom);
    $("gxXLbl").setAttribute("y", mid + 4);
    $("gxXLbl").textContent = "x = " + xr.toFixed(3) + " m";
    var show = xr > 0.005;
    $("gxXTop").style.opacity = show ? "1" : "0";
    $("gxXBot").style.opacity = show ? "1" : "0";
    $("gxXLine").style.opacity = show ? "1" : "0";
    $("gxXLbl").style.opacity = show ? "1" : "0";

    $("gxVa").textContent = xr.toFixed(3) + " m";
    $("gxVb").textContent = (K * xr).toFixed(1) + " N";
    $("gxVs").innerHTML = s.st;
    $("gxVsn").innerHTML = s.sn;
    $("gxStBox").style.background = s.bg;
    $("gxStBox").style.borderColor = s.col + "44";
    $("gxVs").style.color = s.col;
  }

  var ap = null, dragging = false, moved = false, downX = 0, suppressTap = false;

  function xToX(clientX) {
    var r = stage.getBoundingClientRect();
    var f = (clientX - r.left) / r.width;
    return Math.max(0, Math.min(XMAX, Math.round(f * 40) / 100));
  }

  stage.addEventListener("pointerdown", function (ev) {
    dragging = true; moved = false; downX = ev.clientX;
    if (ap) ap.take();
    X = xToX(ev.clientX);
    if (ap) ap.setValue(X, false);
    render();
    try { stage.setPointerCapture(ev.pointerId); } catch (e) {}
  });
  stage.addEventListener("pointermove", function (ev) {
    if (!dragging) return;
    if (Math.abs(ev.clientX - downX) > 4) moved = true;
    X = xToX(ev.clientX);
    if (ap) ap.setValue(X, false);
    render();
  });
  stage.addEventListener("pointerup", function () {
    if (moved) suppressTap = true;
    dragging = false;
  });
  stage.addEventListener("click", function (ev) {
    if (!suppressTap) return;
    suppressTap = false;
    ev.stopImmediatePropagation();
  });

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  render();
  ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 0 }, { t: 2, v: 0.10 }, { t: 4, v: 0.20 }, { t: 6.5, v: 0.20 },
           { t: 8.5, v: 0.30 }, { t: 10, v: 0.40 }, { t: 12, v: 0 }],
    keys: [0, 0.10, 0.20, 0.30, 0.40],
    value: X, min: 0, max: XMAX, step: 0.01,
    idle: 5000,
    onChange: function (v) { X = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc, K: K, L0: L0, LIMIT: LIMIT };
});
</script>
</body>
</html>
