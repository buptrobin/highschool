<div class="gx-meta">

<p class="gx-lede">灯挂在天花板上不动，是平衡；电梯匀速上升，也是平衡；小球被扔到最高点的那一瞬间速度为零，却<b>不是</b>平衡。

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">三句话：什么是平衡状态、共点力平衡的条件、二力与三力平衡的推论。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 平衡状态<span class="q-src">人教版必修第一册 · 第三章第 5 节</span></p>
<p class="q-b">物体受到几个力作用时，如果保持静止或匀速直线运动状态，我们就说这个物体处于平衡状态。</p>
<p class="q-n">→ 平衡状态有<b>两种</b>：静止，和匀速直线运动。后者容易漏——匀速上升的电梯、匀速直线行驶的汽车，合力都是零。
「速度为零」不等于「平衡」，因为加速度可能不为零。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 共点力平衡的条件<span class="q-src">人教版必修第一册 · 第三章第 5 节</span></p>
<p class="q-b">物体在共点力作用下处于平衡状态的条件是：合力为零，即 F合 = 0。</p>
<p class="q-n">→ 写成两个分量式就是 <b>Fx = 0 且 Fy = 0</b>——这就是正交分解法的全部依据。
反过来，只要合力为零，物体要么静止、要么匀速直线运动，不会转弯也不会加速。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 二力平衡（三力平衡由此推出）<span class="q-src">人教版必修第一册 · 第三章第 5 节</span></p>
<p class="q-b">物体在两个力作用下处于平衡状态时，这两个力大小相等、方向相反、作用在同一条直线上。</p>
<p class="q-n">→ 三个共点力平衡时，任意两个力的合力与第三个力大小相等、方向相反——这不是另一条新定律，而是把「二力平衡」用在「两个力的合力」与「第三个力」之间。
三个力不平行时，它们的延长线必交于一点，所以「共点」这个前提基本自动满足。</p>
</div>

<p class="gx-note">解题模板固定成三步：<b>受力分析 → 建坐标（或合成两个力）→ 列 Fx = 0、Fy = 0</b>。
本章所有平衡题，都是这三步的不同排列。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">10 kg 的广告牌，两根绳与水平方向都成 30°。先别急着算，先把「与水平 30°」换成「与竖直 60°」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 三力平衡<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">质量 m = 10 kg 的广告牌用两根等长的绳悬挂，两根绳与水平方向的夹角均为 30°，广告牌静止。取 g = 9.8 m/s²，求每根绳的拉力大小。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 换算角度：把「与水平 30°」变成「与竖直 60°」</p>
<p class="s-b">绳与水平方向成 30°，那么它与<b>竖直方向</b>就成 90° − 30° = <b>60°</b>。
公式 T = mg/(2cosθ) 里的 θ 是「与竖直方向的夹角」，这一步弄错，整题全错。</p>
<p class="s-k">用到：互余关系；先统一角度的参考方向。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 受力分析</p>
<p class="s-b">广告牌受三个力：重力 G = mg = 10 × 9.8 = <b>98 N</b>，竖直向下；两根绳的拉力 T₁、T₂，沿绳方向斜向上。
两根绳对称，所以 T₁ = T₂ = T。</p>
<p class="s-k">用到：受力分析只画作用在广告牌上的力；绳的拉力沿绳。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 选方法：把两个 T 合成，与 G 等大反向</p>
<p class="s-b">两个 T 大小相等、夹角 120°（各与竖直成 60°，左右对称），它们的合力竖直向上，大小 2T cos60° = T。
这个合力与重力等大反向，所以 <b>T = G = 98 N</b>。</p>
<p class="s-k">用到：三力平衡 → 两个力的合力与第三个力等大反向。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 用正交分解再算一遍（考场上更稳）</p>
<p class="s-b">竖直方向：2T cos60° − G = 0 → 2T × 0.5 = 98 → <b>T = 98 N</b>。
水平方向：T sin60° − T sin60° = 0，自动满足，说明「对称」这个条件是自洽的。</p>
<p class="s-k">用到：Fx = 0、Fy = 0；对称时水平分量自动抵消。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 检查与讨论</p>
<p class="s-b">T = 98 N，恰好等于重力。若两绳更平（θ 更大），T 会继续增大；若两绳几乎竖直（θ → 0），T → 49 N。
答题时要写「大小 98 N，方向沿绳斜向上」。</p>
<p class="s-k">用到：T = mg/(2cosθ) 的单调性；结论要带方向。</p>
</li>
</ol>
<div class="exbar">
  <button id="gxNext" type="button">下一步</button>
  <span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">广告牌受重力 G = mg = 10 × 9.8 N = 98 N 和两根绳的拉力，两绳对称，拉力大小相等，设为 T。<br>
绳与水平方向成 30°，与竖直方向成 60°。由竖直方向合力为零得 2T cos 60° = G，即 2T × 0.5 = 98 N，<br>
解得 <b>T = 98 N</b>，方向沿绳斜向上。<br>
（水平方向 T sin 60° = T sin 60°，自动平衡。）</p>
</div>
<p class="gx-note">两个坑：① 把 30° 直接代进 cosθ，会得到 T = 56.6 N；② 忘记「两根绳」，写成 T = G = 98 N 却说不清为什么。标准答案要把「2T cosθ」写出来。</p>
</div>
</section>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>考你会怎么考</h2>
<p class="gx-h2s">六种问法，前三个问「是不是平衡」，后三个问「怎么算」。</p>

<div class="gx-qa">
<div class="qac">
<p class="q">平衡状态就是静止吗？</p>
<p class="a"><b>不是。</b>静止和匀速直线运动都是平衡状态。电梯匀速上升、列车匀速直线行驶，合力都为零。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="静止和匀速直线运动都是平衡状态">
  <rect x="36" y="40" width="60" height="52" rx="4" fill="#eef5fc" stroke="#2f6fd0"/>
  <text x="66" y="72" text-anchor="middle" font-size="11" fill="#2f6fd0">静止</text>
  <rect x="140" y="40" width="60" height="52" rx="4" fill="#e6f6ee" stroke="#2f8a5b"/>
  <text x="170" y="72" text-anchor="middle" font-size="11" fill="#1e6640">匀速</text>
  <line x1="140" y1="106" x2="196" y2="106" stroke="#2f8a5b" stroke-width="2.2"/>
  <polygon points="206,106 194,102 194,110" fill="#2f8a5b"/>
  <text x="120" y="126" text-anchor="middle" font-size="10" fill="#6b7280">两种都叫平衡，v 可以不为零</text>
</svg>
</div>
<div class="qac">
<p class="q">合力为零，物体一定静止吗？</p>
<p class="a"><b>不一定。</b>合力为零 → 加速度为零 → 速度不变。原来静止就继续静止，原来在动就做匀速直线运动。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="合力为零时物体可能匀速运动">
  <line x1="30" y1="96" x2="210" y2="96" stroke="#5a6472"/>
  <circle cx="80" cy="80" r="14" fill="#eef5fc" stroke="#2f6fd0"/>
  <line x1="98" y1="80" x2="150" y2="80" stroke="#2f8a5b" stroke-width="2.4"/>
  <polygon points="160,80 148,76 148,84" fill="#2f8a5b"/>
  <text x="120" y="64" text-anchor="middle" font-size="10" fill="#6b7280">v ≠ 0，但 a = 0</text>
  <text x="120" y="120" text-anchor="middle" font-size="10" fill="#6b7280">合力为零 ≠ 速度为零</text>
</svg>
</div>
<div class="qac">
<p class="q">三个力平衡，任意两个力的合力与第三个力什么关系？</p>
<p class="a"><b>等大反向。</b>F₁ + F₂ = −F₃。所以求第三个力，只要把另外两个合成再取反方向。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="三力平衡时两个力的合力与第三个力等大反向">
  <line x1="40" y1="100" x2="140" y2="100" stroke="#2f6fd0" stroke-width="2.6"/>
  <polygon points="150,100 138,96 138,104" fill="#2f6fd0"/>
  <line x1="40" y1="100" x2="80" y2="40" stroke="#b8791f" stroke-width="2.6"/>
  <polygon points="86,32 80,44 90,46" fill="#b8791f"/>
  <line x1="40" y1="100" x2="120" y2="62" stroke="#b8402f" stroke-width="2.6"/>
  <polygon points="130,58 117,57 120,68" fill="#b8402f"/>
  <text x="120" y="94" font-size="9.5" fill="#2f6fd0">F₁</text>
  <text x="86" y="36" font-size="9.5" fill="#8a5c14">F₂</text>
  <text x="106" y="52" font-size="9.5" fill="#b8402f">F₁+F₂</text>
  <text x="150" y="126" text-anchor="middle" font-size="10" fill="#6b7280">合力与 F₃ 等大反向</text>
</svg>
</div>
<div class="qac">
<p class="q">三力平衡一定「共点」吗？</p>
<p class="a">三个力不平行时，它们的作用线（延长线）必交于一点，所以共点条件自动满足。但若三个力平行（如三根竖直绳），就谈不上交点。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="三个不平行的力作用线交于一点">
  <circle cx="120" cy="70" r="4" fill="#3a3a35"/>
  <line x1="120" y1="70" x2="50" y2="100" stroke="#2f6fd0" stroke-width="2"/>
  <line x1="120" y1="70" x2="196" y2="96" stroke="#b8791f" stroke-width="2"/>
  <line x1="120" y1="70" x2="120" y2="20" stroke="#2f8a5b" stroke-width="2"/>
  <line x1="50" y1="100" x2="30" y2="108" stroke="#cfd4da" stroke-dasharray="3 3"/>
  <line x1="196" y1="96" x2="214" y2="104" stroke="#cfd4da" stroke-dasharray="3 3"/>
  <text x="120" y="122" text-anchor="middle" font-size="10" fill="#6b7280">作用线交于一点 → 共点力</text>
</svg>
</div>
<div class="qac">
<p class="q">绳与竖直方向的夹角越大，拉力越大吗？</p>
<p class="a"><b>是。</b>T = mg/(2cosθ)，θ 越大 cosθ 越小，T 越大；θ → 90° 时拉力趋于无穷大（绳子会被拉断）。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="夹角越大绳的拉力越大">
  <line x1="40" y1="40" x2="200" y2="40" stroke="#5a6472"/>
  <line x1="120" y1="40" x2="66" y2="94" stroke="#8a5c14" stroke-width="2"/>
  <line x1="120" y1="40" x2="174" y2="94" stroke="#8a5c14" stroke-width="2"/>
  <circle cx="120" cy="100" r="10" fill="#fdf3e0" stroke="#b8791f"/>
  <line x1="120" y1="110" x2="120" y2="126" stroke="#b8402f" stroke-width="2"/>
  <polygon points="120,132 117,124 123,124" fill="#b8402f"/>
  <text x="120" y="30" text-anchor="middle" font-size="9.5" fill="#6b7280">θ 越大，T 越大</text>
</svg>
</div>
<div class="qac">
<p class="q">解平衡题，什么时候用合成、什么时候用正交分解？</p>
<p class="a">三个力、其中有直角或特殊角 → <b>合成</b>（快）；三个以上、方向杂乱 → <b>正交分解</b>（稳）。两者本质都是「合力为零」。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="三力用合成，多力用正交分解">
  <text x="60" y="30" text-anchor="middle" font-size="10" fill="#2f6fd0">三力 → 合成</text>
  <line x1="30" y1="96" x2="90" y2="96" stroke="#2f6fd0" stroke-width="2"/>
  <line x1="30" y1="96" x2="60" y2="56" stroke="#b8791f" stroke-width="2"/>
  <line x1="30" y1="96" x2="76" y2="70" stroke="#b8402f" stroke-width="2"/>
  <text x="180" y="30" text-anchor="middle" font-size="10" fill="#2f8a5b">多力 → 正交分解</text>
  <line x1="140" y1="96" x2="220" y2="96" stroke="#5a6472"/>
  <line x1="180" y1="96" x2="180" y2="46" stroke="#5a6472"/>
  <line x1="180" y1="96" x2="216" y2="62" stroke="#b8402f" stroke-width="2"/>
  <line x1="180" y1="96" x2="216" y2="96" stroke="#2f6fd0" stroke-dasharray="3 3"/>
  <line x1="180" y1="62" x2="216" y2="62" stroke="#b8791f" stroke-dasharray="3 3"/>
  <text x="120" y="126" text-anchor="middle" font-size="9.5" fill="#6b7280">都归结为 F合 = 0</text>
</svg>
</div>
</div>
<p class="gx-note">六问的共同点：平衡题的唯一依据是<b>合力为零</b>，其余都是「怎么把合力为零写得方便算」。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是卷面上真出现过的句子，右边是能得分的表述。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 平衡状态就是静止状态。</p>
<p class="er-v">✓ 静止和匀速直线运动都是平衡状态，共同点是加速度为零。</p>
<p class="er-w">漏掉「匀速直线运动」，是本节最常见的一句话失分。</p>
</div>
<div class="er">
<p class="er-x">✗ 物体速度为零，所以它处于平衡状态。</p>
<p class="er-v">✓ 平衡看合力是否为零；竖直上抛到最高点时 v = 0，但合力是 mg，不是平衡。</p>
<p class="er-w">「速度为零」是一瞬间，「平衡」要求这段时间合力一直为零。</p>
</div>
<div class="er">
<p class="er-x">✗ 三个力平衡时，任意两个力的合力与第三个力方向相同。</p>
<p class="er-v">✓ 等大<b>反向</b>：F₁ + F₂ = −F₃。</p>
<p class="er-w">方向写反，整道题的结果就反了。</p>
</div>
<div class="er">
<p class="er-x">✗ 正交分解时，沿斜面的分量写 mg cosθ。</p>
<p class="er-v">✓ 沿斜面是 mg sinθ，垂直斜面是 mg cosθ（θ 为斜面倾角）。</p>
<p class="er-w">和上一节同一个坑：θ 越大越容易下滑，所以沿斜面配 sinθ。</p>
</div>
<div class="er">
<p class="er-x">✗ 一根绳吊着物体静止，绳的拉力总等于重力的一半。</p>
<p class="er-v">✓ 只有在「两根对称绳、θ = 0」时每根才是 mg/2；一根绳竖直吊着时 T = mg。</p>
<p class="er-w">被「两根绳「」这个条件搞混，公式乱套。</p>
</div>
<div class="er">
<p class="er-x">✗ 题目给「绳与水平方向成 30°」，就直接代 cos30° 进 T = mg/(2cosθ)。</p>
<p class="er-v">✓ 公式里的 θ 是绳与<b>竖直</b>方向的夹角，30° 要换成 60° 再代。</p>
<p class="er-w">代错会得到 56.6 N，而正确答案是 98 N，差别很大。</p>
</div>
</div>
</section>

<p class="gx-note" style="border-top:1px solid var(--line);padding-top:14px">第三章到这里收口：重力、弹力、摩擦力是「三种力」，牛顿第三定律管「成对」，合成与分解是「工具」，
平衡是「用工具解的那类题」。下一章开始研究「力怎么改变运动」。</p>

      (t1x + 3 * c + 4 * s) + "," + (t1y - 3 * s + 4 * c) + " " +
      (t1x - 3 * c + 4 * s) + "," + (t1y + 3 * s + 4 * c));
    $("gxT1Lbl").setAttribute("x", t1x - 4); $("gxT1Lbl").setAttribute("y", t1y - 2);

    $("gxT2").setAttribute("x1", HX); $("gxT2").setAttribute("y1", hy);
    $("gxT2").setAttribute("x2", t2x); $("gxT2").setAttribute("y2", t2y);
    $("gxT2Head").setAttribute("points",
      (t2x + 7 * s) + "," + (t2y - 7 * c) + " " +
      (t2x - 3 * c + 4 * s) + "," + (t2y + 3 * s + 4 * c) + " " +
      (t2x + 3 * c + 4 * s) + "," + (t2y - 3 * s + 4 * c));
    $("gxT2Lbl").setAttribute("x", t2x + 4); $("gxT2Lbl").setAttribute("y", t2y - 2);

    $("gxVert").setAttribute("y1", hy);
    $("gxVert").setAttribute("y2", hy - 46);

    var r = 40;
    if (th > 2) {
      $("gxArc").setAttribute("d",
        "M" + HX + " " + (hy - r) + " A" + r + " " + r + " 0 0 0 " +
        (HX - r * s) + " " + (hy - r * c));
    } else {
      $("gxArc").setAttribute("d", "");
    }
    var sb = hy + 50;
    $("gxG").setAttribute("y1", sb);
    $("gxG").setAttribute("y2", sb + 34);
    $("gxGHead").setAttribute("points", "180," + (sb + 44) + " 174," + (sb + 30) + " 186," + (sb + 30));
    $("gxGLbl").setAttribute("y", sb + 36);
    $("gxNote").setAttribute("y", sb + 66);
    $("gxRead").setAttribute("y", sb + 88);

    $("gxRead").textContent = "T = " + T.toFixed(1) + " N（θ = " + th + "°）";
    $("gxRead").setAttribute("fill", T > MG ? "#b8402f" : "#3a3a35");

    $("gxVa").textContent = th + "°";
    $("gxVb").textContent = T.toFixed(1) + " N";

    var st = status(th, T);
    $("gxVs").textContent = st.st;
    $("gxVsn").textContent = st.sn;
    $("gxVs").style.color = st.col;
    $("gxStBox").style.background = st.bg;
    $("gxStBox").style.borderColor = st.col + "44";
  }

  var ap = null, dragging = false, moved = false, downX = 0, suppressTap = false;

  function xToTh(clientX) {
    var r0 = stage.getBoundingClientRect();
    var u = (clientX - r0.left) / r0.width;
    return Math.max(0, Math.min(THMAX, Math.round(u * 80)));
  }

  stage.addEventListener("pointerdown", function (ev) {
    dragging = true; moved = false; downX = ev.clientX;
    if (ap) ap.take();
    TH = xToTh(ev.clientX);
    if (ap) ap.setValue(TH, false);
    render();
    try { stage.setPointerCapture(ev.pointerId); } catch (e) {}
  });
  stage.addEventListener("pointermove", function (ev) {
    if (!dragging) return;
    if (Math.abs(ev.clientX - downX) > 4) moved = true;
    TH = xToTh(ev.clientX);
    if (ap) ap.setValue(TH, false);
    render();
  });
  stage.addEventListener("pointerup", function () {
    if (moved) suppressTap = true;
    dragging = false;
  });
  stage.addEventListener("click", function (ev) {
    if (!suppressTap) return;
    suppressTap = false;
    ev.stopImmediatePropagation();
  });

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  render();
  ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 0 }, { t: 2.5, v: 30 }, { t: 5, v: 60 }, { t: 7, v: 75 },
           { t: 9.5, v: 75 }, { t: 11.5, v: 80 }, { t: 13, v: 0 }],
    keys: [0, 30, 60, 75],
    value: TH, min: 0, max: THMAX, step: 1,
    idle: 5000,
    onChange: function (v) { TH = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { Tof: Tof, MG: MG };
});
</script>
</body>
</html>
