<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">三个定义：合力与分力、平行四边形定则、分解。第三句是前两句的逆运算。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 合力与分力<span class="q-src">人教版必修第一册 · 第三章第 4 节</span></p>
<p class="q-b">如果一个力单独作用的效果跟某几个力共同作用的效果相同，这个力就叫作那几个力的合力，那几个力就叫作这个力的分力。求几个力的合力叫作力的合成，求一个力的分力叫作力的分解。</p>
<p class="q-n">→ 「效果相同」是全部关键：合力不是「多出来的力」，而是<b>等效替换</b>。所以合力与分力<b>不能同时画</b>在同一个受力图里，
画了合力就不能再画那两个分力。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 平行四边形定则<span class="q-src">人教版必修第一册 · 第三章第 4 节</span></p>
<p class="q-b">两个力合成时，以表示这两个力的线段为邻边作平行四边形，这两个邻边之间的对角线就表示合力的大小和方向。</p>
<p class="q-n">→ 两个分力<b>从同一点出发</b>，合力是那条对角线。大小关系：<b>R² = F₁² + F₂² + 2F₁F₂cosθ</b>。
θ = 0 时 R = F₁ + F₂；θ = 90° 时 R = √(F₁² + F₂²)；θ = 180° 时 R = |F₁ − F₂|。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 力的分解<span class="q-src">人教版必修第一册 · 第三章第 4 节</span></p>
<p class="q-b">力的分解是力的合成的逆运算，同样遵从平行四边形定则。</p>
<p class="q-n">→ 正因为是「逆运算」，同一个力可以分解成<b>无数对</b>分力——除非你按「实际效果」分解，或者用<b>正交分解</b>（沿两个互相垂直的方向）。
正交分解是最省事、最通用的那一种。</p>
</div>

<p class="gx-note">三条定则一句话串起来：<b>效果相同才能替换（合力），替换的画法是平行四边形，反过来找分力就是分解</b>。
考试里 90% 的合成题只需要「同向、反向、垂直、120°」四种特殊角。</p>
</section>

θ = 0° 时两个力重合，θ = 180° 时合力为 0（图中 R 箭头随之消失）。平行四边形只是作图的辅助线，不表示额外的力。</p>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">两个 30 N、夹角 120°——这题有个不用计算器就能算完的捷径，先把捷径讲清楚，再用正交分解验证一遍。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 夹角 120° 的合成<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">两个力 F₁ = F₂ = 30 N，夹角为 120°。求它们的合力大小和方向。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 画图：两个力等大，平行四边形是菱形</p>
<p class="s-b">F₁、F₂ 从同一点 O 出发，夹角 120°。因为两边等长，这个平行四边形是<b>菱形</b>，
菱形的一条性质是<b>对角线平分对角</b>——所以合力一定沿两力夹角的平分线。</p>
<p class="s-k">用到：平行四边形定则；菱形对角线平分对角。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 用公式直接算大小</p>
<p class="s-b">R = 2F cos(θ/2) = 2 × 30 × cos 60° = 2 × 30 × 0.5 = <b>30 N</b>。
cos 60° = 0.5 是必须背下来的特殊值，所以这题根本不用计算器。</p>
<p class="s-k">用到：两个等大的力合成，R = 2F cos(θ/2)。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 用平行四边形定则的公式核对</p>
<p class="s-b">R² = F₁² + F₂² + 2F₁F₂cosθ = 900 + 900 + 2 × 900 × cos 120° = 1800 − 900 = 900，
所以 R = 30 N。注意 cos 120° = −0.5，是<b>负的</b>，这一步最容易漏掉符号。</p>
<p class="s-k">用到：R² = F₁² + F₂² + 2F₁F₂cosθ；cos 120° = −0.5。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 用正交分解验证方向</p>
<p class="s-b">取 x 轴沿两力的角平分线，则 F₁ 与 x 轴成 60°、F₂ 与 x 轴成 −60°。
x 方向：30cos60° + 30cos60° = 15 + 15 = 30 N；y 方向：30sin60° − 30sin60° = 0。合力 30 N，沿角平分线，与计算一致。</p>
<p class="s-k">用到：正交分解；对称时垂直方向自动抵消。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 写结论</p>
<p class="s-b">合力大小 <b>30 N</b>，方向沿两个力的夹角平分线。
顺便记住三个数：两个 30 N 的力，同向 60 N、垂直约 42.4 N、夹角 120° 时 30 N。</p>
<p class="s-k">用到：特殊角结论；答题要写「大小 + 方向」，只写大小会扣分。</p>
</li>
</ol>
<div class="exbar">
  <button id="gxNext" type="button">下一步</button>
  <span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">两个力大小相等，平行四边形为菱形，合力沿两力夹角的平分线。<br>
由 R² = F₁² + F₂² + 2F₁F₂cosθ 得 R² = 30² + 30² + 2 × 30 × 30 × cos 120° = 900，所以 <b>R = 30 N</b>。<br>
方向：沿 F₁ 与 F₂ 夹角的平分线，与每个力都成 60°。</p>
</div>
<p class="gx-note">只答「30 N」是不完整的，必须补方向。若题目问「合力与 F₁ 的夹角」，答案就是 60°，不是 120°。</p>
</div>
</section>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>考你会怎么考</h2>
<p class="gx-h2s">六种问法，前四种考「合成」，后两种考「分解」。</p>

<div class="gx-qa">
<div class="qac">
<p class="q">合力一定大于每一个分力吗？</p>
<p class="a"><b>不一定。</b>夹角 120° 且两力等大时，合力等于分力；夹角更大时，合力比每个分力都小，甚至可以接近 0。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="夹角很大时合力小于分力">
  <line x1="40" y1="96" x2="150" y2="96" stroke="#2f6fd0" stroke-width="2.6"/>
  <polygon points="160,96 148,92 148,100" fill="#2f6fd0"/>
  <line x1="40" y1="96" x2="60" y2="24" stroke="#b8791f" stroke-width="2.6"/>
  <polygon points="63,16 59,28 69,26" fill="#b8791f"/>
  <line x1="40" y1="96" x2="86" y2="86" stroke="#b8402f" stroke-width="2.6"/>
  <polygon points="96,84 84,82 86,92" fill="#b8402f"/>
  <text x="120" y="88" font-size="9.5" fill="#2f6fd0">F₁</text>
  <text x="66" y="24" font-size="9.5" fill="#8a5c14">F₂</text>
  <text x="86" y="76" font-size="9.5" fill="#b8402f">R</text>
  <text x="120" y="120" text-anchor="middle" font-size="10" fill="#6b7280">夹角越大，R 越短</text>
</svg>
</div>
<div class="qac">
<p class="q">两个分力大小不变，夹角越大，合力越小吗？</p>
<p class="a"><b>是。</b>R = 2F cos(θ/2)，θ 从 0° 到 180°，cos(θ/2) 一路减小。夹角 0° 时最大，180° 时为零。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="合力随夹角增大而减小">
  <line x1="30" y1="106" x2="216" y2="106" stroke="#5a6472"/>
  <line x1="30" y1="106" x2="30" y2="20" stroke="#5a6472"/>
  <path d="M34 30 C 80 34, 130 70, 196 102" fill="none" stroke="#b8402f" stroke-width="2.6"/>
  <text x="196" y="118" text-anchor="end" font-size="9.5" fill="#6b7280">θ 增大 →</text>
  <text x="34" y="24" font-size="9.5" fill="#6b7280">R</text>
  <text x="120" y="122" text-anchor="middle" font-size="9.5" fill="#6b7280">单调递减，不是直线</text>
</svg>
</div>
<div class="qac">
<p class="q">两个力的合力范围是多少？</p>
<p class="a"><b>|F₁ − F₂| ≤ R ≤ F₁ + F₂</b>。同向取最大，反向取最小，中间连续变化。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="合力范围的数轴">
  <line x1="30" y1="70" x2="216" y2="70" stroke="#5a6472"/>
  <line x1="60" y1="62" x2="60" y2="78" stroke="#2f6fd0" stroke-width="2.4"/>
  <line x1="180" y1="62" x2="180" y2="78" stroke="#b8402f" stroke-width="2.4"/>
  <line x1="60" y1="86" x2="180" y2="86" stroke="#2f8a5b" stroke-width="3"/>
  <text x="60" y="54" text-anchor="middle" font-size="9.5" fill="#2f6fd0">|F₁−F₂|</text>
  <text x="180" y="54" text-anchor="middle" font-size="9.5" fill="#b8402f">F₁+F₂</text>
  <text x="120" y="108" text-anchor="middle" font-size="9.5" fill="#1e6640">R 落在这段区间内</text>
</svg>
</div>
<div class="qac">
<p class="q">两个 30 N 的力，能合成 100 N 吗？</p>
<p class="a"><b>不能。</b>最大值是 30 + 30 = 60 N。看到「合成结果超出范围和」的选项，直接排除。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="两个30牛的力最大合力60牛，不能合成100牛">
  <line x1="30" y1="80" x2="150" y2="80" stroke="#2f6fd0" stroke-width="2.8"/>
  <polygon points="160,80 148,75 148,85" fill="#2f6fd0"/>
  <line x1="30" y1="80" x2="90" y2="80" stroke="#2f8a5b" stroke-width="2.8"/>
  <text x="18" y="76" font-size="9.5" fill="#2f6fd0">30 N</text>
  <text x="18" y="98" font-size="9.5" fill="#1e6640">R max</text>
  <text x="120" y="52" text-anchor="middle" font-size="11" font-weight="700" fill="#b8402f">100 N ×</text>
  <text x="120" y="118" text-anchor="middle" font-size="9.5" fill="#6b7280">最大只有 30 + 30 = 60 N</text>
</svg>
</div>
<div class="qac">
<p class="q">一个力分解成两个分力，结果是唯一的吗？</p>
<p class="a"><b>不唯一。</b>不加限制可以分解成无数对；只有「按效果分解」或「已知两个方向」时才唯一。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="同一个力可以分解成不同的两对分力">
  <line x1="40" y1="100" x2="140" y2="40" stroke="#b8402f" stroke-width="2.6"/>
  <polygon points="150,34 138,36 143,46" fill="#b8402f"/>
  <line x1="40" y1="100" x2="120" y2="100" stroke="#2f6fd0" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="120" y1="100" x2="140" y2="40" stroke="#2f6fd0" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="40" y1="100" x2="56" y2="52" stroke="#b8791f" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="56" y1="52" x2="140" y2="40" stroke="#b8791f" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="150" y="30" font-size="9.5" fill="#b8402f">F</text>
  <text x="90" y="116" text-anchor="middle" font-size="9.5" fill="#6b7280">两种拆法都成立</text>
</svg>
</div>
<div class="qac">
<p class="q">什么时候该用正交分解？</p>
<p class="a">力多于两个、方向又不整齐时。<b>沿两个互相垂直的方向拆</b>，每个方向单独列平衡或牛顿第二定律，最稳。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="斜向力分解成水平和竖直两个分量">
  <line x1="40" y1="100" x2="190" y2="100" stroke="#5a6472"/>
  <line x1="40" y1="100" x2="40" y2="24" stroke="#5a6472"/>
  <line x1="40" y1="100" x2="150" y2="40" stroke="#b8402f" stroke-width="2.6"/>
  <polygon points="160,35 147,37 152,47" fill="#b8402f"/>
  <line x1="40" y1="100" x2="150" y2="100" stroke="#2f6fd0" stroke-width="2.2" stroke-dasharray="4 3"/>
  <line x1="40" y1="58" x2="150" y2="58" stroke="#b8791f" stroke-width="2.2" stroke-dasharray="4 3"/>
  <line x1="150" y1="100" x2="150" y2="58" stroke="#cfd4da" stroke-dasharray="4 3"/>
  <text x="90" y="114" text-anchor="middle" font-size="9.5" fill="#2f6fd0">x 方向</text>
  <text x="26" y="80" font-size="9.5" fill="#8a5c14">y</text>
  <text x="150" y="30" font-size="9.5" fill="#b8402f">F</text>
</svg>
</div>
</div>
<p class="gx-note">合成题的两个快检：① 结果是否落在 |F₁−F₂| ~ F₁+F₂ 之间；② 特殊角（0° / 90° / 120° / 180°）直接代结论，别硬算 cos。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是卷面上真出现过的句子，右边是能得分的表述。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 合力就是 F₁ + F₂，直接相加即可。</p>
<p class="er-v">✓ 力是矢量，必须用平行四边形定则；只有同向时才等于代数和。</p>
<p class="er-w">同向相加只是 θ = 0 的特例，不是普遍规则。</p>
</div>
<div class="er">
<p class="er-x">✗ 公式 R² = F₁² + F₂² + 2F₁F₂cosθ 里的 θ 随便代，夹角大小无所谓。</p>
<p class="er-v">✓ θ 是两个力的夹角；钝角时 cosθ 为负，合力会变小。</p>
<p class="er-w">120° 时 cos = −0.5，这是最容易漏负号的一步。</p>
</div>
<div class="er">
<p class="er-x">✗ 合力一定比分力大。</p>
<p class="er-v">✓ 夹角大时合力可以小于每个分力，甚至接近 0。</p>
<p class="er-w">同向最大、反向最小；把「合力」当成「总和」是概念错误。</p>
</div>
<div class="er">
<p class="er-x">✗ 一个力分解成两个分力，答案唯一。</p>
<p class="er-v">✓ 不加限制时有无数种分解；只有按效果或给定两个方向时才唯一。</p>
<p class="er-w">所以题目一定会给「沿什么方向分解」，否则没法算。</p>
</div>
<div class="er">
<p class="er-x">✗ 合力和分力都画在同一个受力图上。</p>
<p class="er-v">✓ 合力与分力是等效替换关系，同一个图里只能画一套。</p>
<p class="er-w">画了合力又画分力，等于把力算了两遍。</p>
</div>
<div class="er">
<p class="er-x">✗ 斜面上重力沿斜面方向的分量是 mg cosθ。</p>
<p class="er-v">✓ 沿斜面的是 mg sinθ，垂直压向斜面的是 mg cosθ（θ 为斜面倾角）。</p>
<p class="er-w">记法：θ 越大，越容易下滑，所以「沿斜面」的一定配 sinθ。</p>
</div>
</div>
</section>

<p class="gx-note" style="border-top:1px solid var(--line);padding-top:14px">这一节给了你两件工具：<b>平行四边形</b>（合成）和<b>正交分解</b>（分解）。下一节把工具用在「物体不动」的场合——共点力的平衡。</p>

    var a0 = 0, a1 = rad(th);
    var r = 34;
    $("gxArc").setAttribute("d",
      "M" + (OX + r) + " " + OY + " A" + r + " " + r + " 0 0 0 " +
      (OX + r * Math.cos(a1)) + " " + (OY - r * Math.sin(a1)));
    var mid = rad(th) / 2;
    $("gxThLbl").setAttribute("x", OX + 46 * Math.cos(mid) - 3);
    $("gxThLbl").setAttribute("y", OY - 46 * Math.sin(mid) + 3);
    $("gxThLbl").style.opacity = th > 8 ? "1" : "0.35";

    $("gxVa").textContent = th + "°";
    $("gxVb").textContent = R.toFixed(1) + " N";
    $("gxRead").textContent = "R = " + R.toFixed(1) + " N（θ = " + th + "°）";
    $("gxRead").setAttribute("fill", R < 5 ? "#b8402f" : "#3a3a35");

    var s = status(th);
    $("gxVs").textContent = s.st;
    $("gxVsn").textContent = s.sn;
    $("gxVs").style.color = s.col;
    $("gxStBox").style.background = s.bg;
    $("gxStBox").style.borderColor = s.col + "44";
  }

  var ap = null, dragging = false, moved = false, downX = 0, suppressTap = false;

  function xToTh(clientX) {
    var r0 = stage.getBoundingClientRect();
    var u = (clientX - r0.left) / r0.width;
    return Math.max(0, Math.min(THMAX, Math.round(u * 180)));
  }

  stage.addEventListener("pointerdown", function (ev) {
    dragging = true; moved = false; downX = ev.clientX;
    if (ap) ap.take();
    TH = xToTh(ev.clientX);
    if (ap) ap.setValue(TH, false);
    render();
    try { stage.setPointerCapture(ev.pointerId); } catch (e) {}
  });
  stage.addEventListener("pointermove", function (ev) {
    if (!dragging) return;
    if (Math.abs(ev.clientX - downX) > 4) moved = true;
    TH = xToTh(ev.clientX);
    if (ap) ap.setValue(TH, false);
    render();
  });
  stage.addEventListener("pointerup", function () {
    if (moved) suppressTap = true;
    dragging = false;
  });
  stage.addEventListener("click", function (ev) {
    if (!suppressTap) return;
    suppressTap = false;
    ev.stopImmediatePropagation();
  });

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  render();
  ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 0 }, { t: 2.5, v: 60 }, { t: 5, v: 90 }, { t: 7, v: 120 },
           { t: 9.5, v: 120 }, { t: 12, v: 180 }, { t: 14, v: 0 }],
    keys: [0, 60, 90, 120, 180],
    value: TH, min: 0, max: THMAX, step: 1,
    idle: 5000,
    onChange: function (v) { TH = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { Rof: Rof, F: F };
});
</script>
</body>
</html>
