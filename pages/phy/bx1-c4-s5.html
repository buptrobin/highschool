<p class="gx-claim">动力学题只有两类，而两类题中间都卡着同一个东西：<b>加速度</b>。</p>
<div class="gx-meta">
  <span><i></i>人教版必修第一册 · 第四章第 5 节</span>
  <span><i></i>高一 · 动力学两类问题</span>
  <span><i></i>阅读 17 分钟</span>
  <span><i></i>含 1 个互动模型</span>
</div>
<p class="gx-lede">题目给你力，让你求速度、位移、时间——这叫「已知力求运动」；
题目给你运动，让你求摩擦力、求质量、求拉力——这叫「已知运动求力」。
两条路的接口是同一个公式 <b>F合 = ma</b>：它把「力」翻译成「加速度」，运动学公式再把「加速度」翻译成「v、x、t」。
所以动力学题的正确姿势是<b>先a后运动</b>，而不是看见数字就往公式里塞。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">三句话：两类问题怎么分、桥梁是什么、程序怎么走。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 两类基本问题<span class="q-src">人教版必修第一册 · 第四章第 5 节</span></p>
<p class="q-b">一类是已知物体的受力情况，求物体的运动情况；另一类是已知物体的运动情况，求物体的受力情况。</p>
<p class="q-n">→ 只有两类，没有第三类。判断方法很简单：<b>题目给的是力还是运动</b>？
给力求运动，走「力 → a → 运动」；给运动求力，走「运动 → a → 力」。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 加速度是桥梁<span class="q-src">人教版必修第一册 · 第四章第 5 节</span></p>
<p class="q-b">牛顿第二定律确定了运动和力的关系，加速度是联系运动和力的桥梁。</p>
<p class="q-n">→ 这句话解释了为什么所有动力学题都要先算 a：<b>a 是唯一同时出现在两边公式里的量</b>。
受力分析能求出 a（F合 = ma），运动学公式也要用 a（v = v₀ + at、x = v₀t + ½at²）。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本表述 · 解题程序<span class="q-src">人教版必修第一册 · 第四章第 5 节</span></p>
<p class="q-b">解决这类问题时，先确定研究对象，对它进行受力分析并画出受力示意图；再根据牛顿第二定律求出加速度；最后由运动学公式求出所要求的量。</p>
<p class="q-n">→ 这四步的顺序不能反：<b>确定对象 → 受力分析 → 求 a → 运动学公式</b>。
很多题卡住，不是不会算，而是受力分析漏了一个力，或者把加速度方向画反了。</p>
</div>

<p class="gx-note">还有一条「隐藏前提」：<b>刹车问题要先判断车什么时候停</b>。
如果题目给的时间比刹车时间长，剩下的时间里车已经停了，速度保持为 0，不能继续代 v = v₀ + at 让速度变成负的。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己写，再点「下一步」。这题两个坑：反应距离、以及「两段运动分开算」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 反应距离 + 刹车距离<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">汽车以 v₀ = 20 m/s 在平直公路上行驶，驾驶员的反应时间为 0.5 s（反应时间内车做匀速运动）。
刹车后车轮抱死滑行，轮胎与路面间的动摩擦因数 μ = 0.5，g 取 10 m/s²。<br>
（1）求反应距离；（2）求刹车时的加速度大小与刹车距离；（3）求从发现情况到停下的总距离。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 把全过程切成两段</p>
<p class="s-b">从发现情况到停下，其实是两段完全不同的运动：<b>反应时间内</b>驾驶员还没踩刹车，车做<b>匀速直线运动</b>；
<b>刹车后</b>合力只有摩擦力，车做<b>匀减速直线运动</b>。两段各有各的位移，最后相加。
不分段直接用一个公式算，是这题最常见的错。</p>
<p class="s-k">用到：多过程问题要分段；每段单独做受力分析、单独选公式。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 第 1 段：反应距离</p>
<p class="s-b">反应时间 t₁ = 0.5 s 内速度保持 20 m/s，所以
x₁ = v₀t₁ = 20 × 0.5 = <b>10 m</b>。这段里没有加速度（a = 0），不能用 x = ½at²。</p>
<p class="s-k">用到：匀速直线运动 x = vt；反应距离只与车速和反应时间有关，与 μ 无关。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 第 2 段：先求加速度</p>
<p class="s-b">刹车后水平方向只有摩擦力 f = μN = μmg（竖直方向平衡，N = mg），
由 f = ma 得 <b>a = μg = 0.5 × 10 = 5.0 m/s²</b>，方向与速度相反。
注意：质量 m 在两边约掉了，所以加速度与车的质量无关。</p>
<p class="s-k">用到：F合 = ma；a = μg 是水平面上刹车加速度的标准结论。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 第 2 段：用 v² = 2ax 求刹车距离</p>
<p class="s-b">末速度为 0，初速度 20 m/s，a = 5.0 m/s²：
v₀² = 2ax ⟹ x₂ = v₀²/(2a) = 400/(2×5.0) = <b>40 m</b>。
（若先求 t = v₀/a = 4 s，再 x = ½·v₀·t = 40 m，结果相同，但多一步。）</p>
<p class="s-k">用到：不涉及时间的问法优先用 v² − v₀² = 2ax。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 相加，并检查数量级</p>
<p class="s-b">总距离 x = x₁ + x₂ = 10 + 40 = <b>50 m</b>。
检查一下：50 m 大约是十几辆小汽车首尾相接的长度，在市区道路上完全合理；
如果算出 5 m 或 500 m，就该回头查单位或分段。</p>
<p class="s-k">用到：结果要带单位，并用常识判断数量级；总距离 = 反应距离 + 制动距离。</p>
</li>
</ol>
<div class="exbar">
  <button id="gxNext" type="button">下一步</button>
  <span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）反应时间内车做匀速直线运动，x₁ = v₀t₁ = 20 × 0.5 = <b>10 m</b>。<br>
（2）刹车后竖直方向平衡，N = mg；水平方向合力为摩擦力 f = μmg。
由 f = ma 得 a = μg = 0.5 × 10 = <b>5.0 m/s²</b>，方向与速度方向相反。
由 v₀² = 2ax₂ 得 x₂ = v₀²/(2a) = 400/10 = <b>40 m</b>。<br>
（3）总距离 x = x₁ + x₂ = 10 + 40 = <b>50 m</b>。</p>
</div>
<p class="gx-note">阅卷高频扣分：把反应距离漏掉只答 40 m；反应时间内也用 a = 5 m/s² 去算；
把 a = μg 里的 m 保留下来当变量，算出 f = μmg 后又不知道约掉。</p>
</div>
</section>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>考你会怎么考</h2>
<p class="gx-h2s">六种问法，全都绕不开「先求 a」这一步。</p>

<div class="gx-qa">
<div class="qac">
<p class="q">做题时先受力分析还是先套运动学公式？</p>
<p class="a"><b>先受力，求出 a，再套运动学公式。</b>a 是两条线唯一的接口，跳过它必错。</p>

  <text x="51" y="65" text-anchor="middle" font-size="10" fill="#8a5c14">受力</text>
  <line x1="88" y1="60" x2="104" y2="60" stroke="#5a6472" stroke-width="1.6"/>

  <text x="142" y="65" text-anchor="middle" font-size="10" fill="#6d28d9">a</text>
  <line x1="170" y1="60" x2="186" y2="60" stroke="#5a6472" stroke-width="1.6"/>
  <polygon points="196,60 184,55 184,65" fill="#5a6472"/>
  <rect x="198" y="40" width="30" height="40" rx="8" fill="#ecfbff" stroke="#b8e6f2"/>

</div>
<div class="qac">
<p class="q">刹车时摩擦力方向朝哪？</p>
<p class="a"><b>与车相对地面的运动方向相反，也就是向后。</b>它和速度反向，才让车减速。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="刹车时摩擦力向后，与速度方向相反">
  <line x1="30" y1="90" x2="212" y2="90" stroke="#cfd4da" stroke-width="1.4"/>
  <rect x="86" y="56" width="52" height="32" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <line x1="140" y1="66" x2="192" y2="66" stroke="#7c3aed" stroke-width="2.4"/>
  <polygon points="204,66 190,60 190,72" fill="#7c3aed"/>

  <polygon points="26,82 40,76 40,88" fill="#b8402f"/>
  <text x="56" y="106" text-anchor="middle" font-size="10" fill="#b8402f">f 向后</text>
</svg>
</div>
<div class="qac">
<p class="q">车速变为原来的 2 倍，刹车距离变几倍？</p>
<p class="a"><b>4 倍。</b>由 x = v₀²/(2μg)，x 与 v₀ 的平方成正比。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="车速加倍，刹车距离变为四倍">
  <text x="62" y="34" text-anchor="middle" font-size="10" fill="#3a3a35">v₀ → x</text>
  <rect x="24" y="44" width="38" height="11" rx="3" fill="#b8402f"/>
  <text x="68" y="53" font-size="9.5" fill="#b8402f">x</text>
  <text x="62" y="82" text-anchor="middle" font-size="10" fill="#8a5c14">2v₀ → 4x</text>
  <rect x="24" y="92" width="152" height="11" rx="3" fill="#b8402f"/>

  <text x="120" y="122" text-anchor="middle" font-size="9.5" fill="#6b7280">平方关系，不是 2 倍</text>
</svg>
</div>
<div class="qac">
<p class="q">反应距离由什么决定？</p>
<p class="a"><b>车速和反应时间：x = v₀t。</b>与摩擦因数、车重都无关。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="反应距离等于车速乘反应时间">
  <rect x="24" y="30" width="86" height="40" rx="8" fill="#fdf3e0" stroke="#f0dcb4"/>

</svg>
</div>
<div class="qac">
<p class="q">斜面上滑下，加速度怎么求？</p>
<p class="a"><b>a = g(sinθ − μcosθ)。</b>沿斜面 mg sinθ − μmg cosθ = ma，两边约掉 m。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="斜面上加速度等于g乘以sinθ减μcosθ">

<p class="a"><b>因为支持力变大了。</b>竖直方向 N − mg = ma，所以 N = m(g + a) &gt; mg——这就是超重。</p>

<p class="gx-note">六问归成一条流程：<b>判类型（给力还是给运动）→ 受力分析 → 求 a → 选公式 → 查单位与数量级</b>。
按这五步走，动力学题很少会「完全不会」，最多是某个力画错了。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是卷面上真出现过的错解，右边是能得分的表述。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 刹车问题只算 x = v₀²/(2μg)，忘了反应距离。</p>
<p class="er-v">✓ 总距离 = 反应距离（匀速 v₀t）+ 制动距离（v₀²/2μg）。</p>
<p class="er-w">题目问「从发现情况到停下」时，反应距离必须算进去，通常是十几米。</p>
</div>
<div class="er">
<p class="er-x">✗ 刹车的摩擦力向前，帮车停下。</p>
<p class="er-v">✓ 摩擦力与相对运动方向相反：车向前滑，摩擦力向后。</p>
<p class="er-w">摩擦力永远是「阻碍相对运动」，不是「帮助运动」。</p>
</div>
<div class="er">
<p class="er-x">✗ 加速度方向与速度方向相同，所以车在减速。</p>
<p class="er-v">✓ 减速时加速度与速度<b>反向</b>；a 的方向由合力决定。</p>
<p class="er-w">a 与 v 同向 → 加速；反向 → 减速；这是判断加减速的唯一标准。</p>
</div>
<div class="er">
<p class="er-x">✗ 车速变 2 倍，刹车距离也变 2 倍。</p>
<p class="er-v">✓ x ∝ v₀²，车速变 2 倍，刹车距离变<b>4 倍</b>。</p>
<p class="er-w">公式里是 v₀ 的平方，别按一次方估。</p>
</div>
<div class="er">
<p class="er-x">✗ 斜面上直接写 mg = ma，得 a = g。</p>
<p class="er-v">✓ 沿斜面：mg sinθ − μmg cosθ = ma，得 a = g(sinθ − μcosθ)。</p>
<p class="er-w">重力不在沿斜面方向上；垂直方向的 N 与 mg cosθ 平衡，不进沿斜面方程。</p>
</div>
<div class="er">
<p class="er-x">✗ 题目给的时间比刹车时间长，还继续用 v = v₀ + at 算速度。</p>
<p class="er-v">✓ 先算出停车时间 t停 = v₀/a；若给定时间超过 t停，速度取 0、位移取刹车距离。</p>
<p class="er-w">车停了以后不会「倒着加速」，公式在这里失效，要分段讨论。</p>
</div>
</div>
</section>

<p class="gx-note" style="border-top:1px solid var(--line);padding-top:14px">下一节：<b>超重和失重</b>。
把「竖直方向的加速度」单独拎出来看，就是 N 与 mg 谁大谁小的问题。</p>

    var st, col, bg, sn;
    if (x >= 120) {
      st = Math.round(x) + " m"; col = "#b8402f"; bg = "#fbeae7";
      sn = "x = v₀²/(2μg) = 400/(2×10×" + mu.toFixed(2) + ") = " + x.toFixed(0) + " m";
    } else if (x >= 45) {
      st = Math.round(x) + " m"; col = "#b8791f"; bg = "#fdf3e0";
      sn = "x = v₀²/(2μg) = 400/(2×10×" + mu.toFixed(2) + ") = " + x.toFixed(0) + " m";
    } else {
      st = Math.round(x) + " m"; col = "#2f8a5b"; bg = "#e6f6ee";
      sn = "x = v₀²/(2μg) = 400/(2×10×" + mu.toFixed(2) + ") = " + x.toFixed(0) + " m";
    }
    return { a: a, x: x, st: st, col: col, bg: bg, sn: sn };
  }

  function render() {
    var s = calc(MU);
    var xEnd = Math.min(XMAX, s.x);
    var w = (xEnd / XMAX) * (BX1 - BX0);

    $("gxBar").setAttribute("width", Math.max(0, w));
    $("gxEnd").setAttribute("x1", BX0 + w);
    $("gxEnd").setAttribute("x2", BX0 + w);
    $("gxBarLab").setAttribute("x", BX0 + w + 4);
    $("gxBarLab").textContent = "x = " + s.x.toFixed(0) + " m";

    $("gxFormula").textContent = "a = " + s.a.toFixed(1) + " m/s²";
    $("gxInfo").textContent = "μ = " + MU.toFixed(2) + "：a = " + s.a.toFixed(1) +
      " m/s²，x = " + s.x.toFixed(0) + " m";
    $("gxInfo2").textContent = "x = v₀²/(2a) = 400/(2×" + s.a.toFixed(1) + ") = " + s.x.toFixed(0) + " m";

    $("gxVa").textContent = MU.toFixed(2);
    $("gxVb").textContent = s.a.toFixed(1) + " m/s²";
    $("gxVs").textContent = s.st;
    $("gxVsn").textContent = s.sn;
    $("gxStBox").style.background = s.bg;
    $("gxStBox").style.borderColor = s.col + "44";
    $("gxVs").style.color = s.col;
  }

  var ap = null, dragging = false, moved = false, downX = 0, suppressTap = false;

  function xToMu(clientX) {
    var r = stage.getBoundingClientRect();
    var f = (clientX - r.left) / r.width;
    return Math.max(0.1, Math.min(0.9, Math.round(f * 45) / 50));
  }

  stage.addEventListener("pointerdown", function (ev) {
    dragging = true; moved = false; downX = ev.clientX;
    if (ap) ap.take();
    MU = xToMu(ev.clientX);
    if (ap) ap.setValue(MU, false);
    render();
    try { stage.setPointerCapture(ev.pointerId); } catch (e) {}
  });
  stage.addEventListener("pointermove", function (ev) {
    if (!dragging) return;
    if (Math.abs(ev.clientX - downX) > 4) moved = true;
    MU = xToMu(ev.clientX);
    if (ap) ap.setValue(MU, false);
    render();
  });
  stage.addEventListener("pointerup", function () {
    if (moved) suppressTap = true;
    dragging = false;
  });
  stage.addEventListener("click", function (ev) {
    if (!suppressTap) return;
    suppressTap = false;
    ev.stopImmediatePropagation();
  });

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  render();
  ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 0.9 }, { t: 1.6, v: 0.7 }, { t: 3.2, v: 0.7 }, { t: 4.6, v: 0.5 },
           { t: 7.1, v: 0.5 }, { t: 8.6, v: 0.3 }, { t: 10.2, v: 0.3 }, { t: 11.6, v: 0.1 },
           { t: 13.0, v: 0.9 }],
    keys: [0.9, 0.7, 0.5, 0.3, 0.1],
    value: MU, min: 0.1, max: 0.9, step: 0.02,
    idle: 5000,
    onChange: function (v) { MU = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc };
  window.__probe = function () {
    return {
      mu: $("gxVa").textContent,
      a: $("gxVb").textContent,
      x: $("gxVs").textContent,
      cnt: $("gxCnt").textContent
    };
  };
});
</script>
</body>
</html>
