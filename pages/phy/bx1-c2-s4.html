<p class="gx-claim">自由落体不是「重的落得快」，而是<b>只受重力、从静止开始</b>；g 是加速度，不是力。</p>
<div class="gx-meta">
  <span><i></i>人教版必修第一册 · 第二章第 4 节</span>
  <span><i></i>高一 · 匀变速直线运动的研究</span>
  <span><i></i>阅读 14 分钟</span>
  <span><i></i>含 1 个互动模型</span>
</div>
<p class="gx-lede">把一张纸摊平、再把另一张揉成团，同一高度松手，纸团先落地。这不是「重的落得快」——两张纸一样重。
真正的差别是<b>空气阻力</b>：摊平的纸迎风面积大，阻力把下落拖慢了。把空气抽走，一根羽毛和一枚硬币会同时落到底，
这就是真空管里那个著名的实验。这一节要把这件事写成公式：<b>v = gt、h = ½gt²</b>，它们只是上一节匀变速公式的特例。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">四条：定义、g、三个公式、与质量无关。定义管条件，g 管数值，公式管计算。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 自由落体运动<span class="q-src">人教版必修第一册 · 第二章第 4 节</span></p>
<p class="q-b">物体只在重力作用下从静止开始下落的运动，叫作自由落体运动。</p>
<p class="q-n">→ 两个条件都要满足：<b>① 只受重力</b>（空气阻力可以忽略，或已抽成真空）；
<b>② 初速度为零</b>（是「从静止开始下落」，不是「用力往下扔」）。少一个条件，就不能套这一节的公式。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 自由落体加速度<span class="q-src">人教版必修第一册 · 第二章第 4 节</span></p>
<p class="q-b">自由落体加速度也叫重力加速度，用 g 表示，方向竖直向下，通常取 g = 9.8 m/s²。</p>
<p class="q-n">→ g 是<b>加速度</b>，单位 m/s²，意思是「每下落 1 s，速度增加 9.8 m/s」。
粗略计算可取 g = 10 m/s²，但<b>卷面上必须写一句「取 g = 10 m/s²」</b>，否则按 9.8 判。
g 的方向<b>竖直向下</b>，不是「垂直斜面向下」。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 速度、位移与时间的关系<span class="q-src">人教版必修第一册 · 第二章第 4 节</span></p>
<p class="q-b">v = gt，h = ½gt²，v² = 2gh</p>
<p class="q-n">→ 把匀变速公式里的 v₀ 取 0、a 换成 g，就得到这三条：<b>v = 0 + gt</b>、<b>h = 0 + ½gt²</b>。
第三式由前两式消去 t 得到（把 t = v/g 代进 h）。三个式子里只有两个是独立的，
已知任意两个量就能求第三个。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 与质量无关<span class="q-src">人教版必修第一册 · 第二章第 4 节</span></p>
<p class="q-b">在同一地点，一切物体自由下落的加速度都相同。</p>
<p class="q-n">→ 「同一地点」四个字很关键：g 随纬度和海拔略有变化（赤道约 9.78、两极约 9.83），
但在同一间实验室里可以认为相同。所以<b>同一高度同时释放的两个物体，忽略空气阻力就同时落地</b>，与轻重无关。</p>
</div>

<p class="gx-note">这一节在考试里的位置：它是<b>匀变速公式的第一个应用场景</b>。
所有刹车、追及题的解题套路（定正方向、代符号、看边界），在这里都能复用；区别只是 a 恒为 g、v₀ = 0。</p>
</section>

<section class="gx-sec" id="c">
<h2><span class="sn">03</span>自己拖一下<span class="bdg bdg-must">核心</span></h2>
<p class="gx-h2s">拖时间 t，看小球真的掉下去：<b>h = 4.9t²、v = 9.8t</b>，3 s 落 44.1 m、速度到 29.4 m/s。</p>

<figure class="gx-fig">
<div class="fig-cap"><span class="fig-no">互动 1</span><span class="fig-t">自由落体：每秒掉得越来越远</span><span class="gx-ap" id="gxAp"><i></i><span id="gxApTxt">自动演示中</span></span></div>

左边的刻度尺是下落高度，1 s 对应 4.9 m、2 s 对应 19.6 m、3 s 对应 44.1 m。

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">五个判断，最后一步最值钱：<b>换一个 g，答案会差多少</b>。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 45 m 自由落体<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">一个小球从 45 m 高的楼顶由静止自由落下，忽略空气阻力，取 g = 10 m/s²。求：<br>
（1）小球落地所用的时间；（2）落地时的速度；（3）若改取 g = 9.8 m/s²，时间和速度各是多少？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 先确认「是不是自由落体」</p>
<p class="s-b">从静止释放（v₀ = 0），下落过程中只受重力（空气阻力忽略），所以是自由落体运动。
取竖直向下为正方向，a = g = 10 m/s²（题目已给定）。</p>
<p class="s-k">用到：自由落体的两个条件——只受重力、初速度为零。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 用位移公式反解时间</p>
<p class="s-b">h = ½gt²，所以 t = √(2h/g) = √(2 × 45 / 10) = √9 = <b>3 s</b>。
这一步不需要知道末速度，只要 h 和 g。</p>
<p class="s-k">用到：h = ½gt² 的反解；开方时只取正根。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 求落地速度（两条路都通）</p>
<p class="s-b">方法一：v = gt = 10 × 3 = <b>30 m/s</b>。
方法二：v² = 2gh = 2 × 10 × 45 = 900，v = 30 m/s。两法一致，方向竖直向下。</p>
<p class="s-k">用到：v = gt 与 v² = 2gh 是同一件事的两种写法。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 换成 g = 9.8，看差多少</p>
<p class="s-b">t = √(2 × 45 / 9.8) = √9.18 ≈ <b>3.03 s</b>；v = 9.8 × 3.03 ≈ <b>29.7 m/s</b>。
与 g = 10 相比，时间只差 0.03 s（约 1%），速度差 0.3 m/s。所以粗略计算用 10 是合理的，
但<b>必须写明取了 10</b>。</p>
<p class="s-k">用到：g 是「当地常量」，取近似值要在卷面上声明。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口：答案与高频追问</p>
<p class="s-b">（1）3 s；（2）30 m/s，方向竖直向下；（3）约 3.03 s、29.7 m/s。
若追问「最后 1 s 下落多少」：h(3) − h(2) = 45 − 20 = <b>25 m</b>，占全程的 5/9，不是 1/3。</p>
<p class="s-k">用到：某段时间内的位移 = 两个时刻位移之差。</p>
</li>
</ol>
<div class="exbar">
  <button id="gxNext" type="button">下一步</button>
  <span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">取竖直向下为正方向，v₀ = 0，a = g。<br>
（1）由 h = ½gt² 得 t = √(2h/g) = √(2 × 45 / 10) = <b>3 s</b>。<br>
（2）v = gt = 10 × 3 = <b>30 m/s</b>，方向竖直向下（也可由 v² = 2gh 得 v = 30 m/s）。<br>
（3）取 g = 9.8 m/s² 时：t = √(2 × 45 / 9.8) ≈ <b>3.03 s</b>，v = gt ≈ <b>29.7 m/s</b>，方向竖直向下。</p>
</div>
<p class="gx-note">第 4 步那两行数字别只看结论：<b>同一个 h，g 越小，t 越大</b>（t ∝ 1/√g）。
月球上 g ≈ 1.6 m/s²，同样 45 m 要落 √(90/1.6) ≈ 7.5 s。</p>
</div>
</section>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>考你会怎么考</h2>
<p class="gx-h2s">六种问法，核心都是「条件对不对、g 取多少、公式有没有代错项」。</p>

<div class="gx-qa">
<div class="qac">
<p class="q">重的物体下落得更快吗？</p>
<p class="a"><b>不。</b>忽略空气阻力时，同一地点一切物体下落加速度都是 g，同一高度同时释放就同时落地。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="轻重两球同一高度同时落地">

  <line x1="154" y1="58" x2="154" y2="92" stroke="#2f8a5b" stroke-width="2" stroke-dasharray="4 3"/>

<div class="qac">
<p class="q">g 和 G 有什么区别？</p>
<p class="a"><b>g 是加速度（m/s²），G = mg 是重力（N）。</b>数值上 9.8 N/kg 与 9.8 m/s² 相等，但物理意义不同。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="g是加速度单位米每二次方秒，G是力单位牛">
  <rect x="20" y="26" width="94" height="40" rx="6" fill="#f5f3ff" stroke="#d8ccfb"/>
  <text x="67" y="44" text-anchor="middle" font-size="10" font-weight="700" fill="#6d28d9">g</text>
  <text x="67" y="58" text-anchor="middle" font-size="8.5" fill="#6d28d9">m/s²（加速度）</text>
  <rect x="126" y="26" width="94" height="40" rx="6" fill="#fdf3e0" stroke="#f0dcb4"/>
  <text x="173" y="44" text-anchor="middle" font-size="10" font-weight="700" fill="#8a5c14">G = mg</text>
  <text x="173" y="58" text-anchor="middle" font-size="8.5" fill="#8a5c14">N（力）</text>
  <text x="120" y="88" text-anchor="middle" font-size="9.5" fill="#3a3a35">g 描述「速度每秒加多少」</text>
  <text x="120" y="106" text-anchor="middle" font-size="9.5" fill="#3a3a35">G 描述「地球拉它多用力」</text>
  <text x="120" y="124" text-anchor="middle" font-size="9" fill="#6b7280">单位不同，不能互换</text>
</svg>
</div>
<div class="qac">
<p class="q">自由落体必须满足什么条件？</p>
<p class="a"><b>只受重力 + 初速度为零。</b>「往下扔」有初速度，不是自由落体；有风、有降落伞也不算。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="自由落体需要只受重力和初速度为零两个条件">
  <text x="120" y="20" text-anchor="middle" font-size="9.5" fill="#3a3a35">两个条件，缺一不可</text>
  <rect x="22" y="34" width="196" height="28" rx="6" fill="#f6fbf8" stroke="#bfe0cd"/>

  <rect x="22" y="70" width="196" height="28" rx="6" fill="#f6fbf8" stroke="#bfe0cd"/>
  <text x="120" y="88" text-anchor="middle" font-size="9.5" fill="#1e6640">② v₀ = 0（从静止开始）</text>
  <text x="120" y="118" text-anchor="middle" font-size="9" fill="#b8402f">用力向下扔 → 不是自由落体</text>
</svg>
</div>
<div class="qac">
<p class="q">自由落体 1 s 内下落多少？</p>
<p class="a"><b>约 4.9 m（g = 9.8）；取 g = 10 时是 5 m。</b>由 h = ½gt² 得，与物体的质量、形状无关。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="1秒内下落4.9米，2秒19.6米，3秒44.1米">
  <line x1="40" y1="106" x2="220" y2="106" stroke="#5a6472"/>

    <rect x="58" y="94" width="26" height="12"/><rect x="106" y="58" width="26" height="48"/>
    <rect x="154" y="1" width="26" height="105"/>
  </g>
  <text x="71" y="90" text-anchor="middle" font-size="8" fill="#6d28d9">4.9</text>
  <text x="119" y="52" text-anchor="middle" font-size="8" fill="#6d28d9">19.6</text>
  <text x="167" y="30" text-anchor="middle" font-size="8" fill="#fff">44.1</text>
  <text x="120" y="122" text-anchor="middle" font-size="9" fill="#6b7280">1 s、2 s、3 s 末的下落高度 / m</text>
</svg>
</div>
<div class="qac">
<p class="q">最后 1 s 的位移怎么算？</p>
<p class="a"><b>用总位移减去前面那段。</b>3 s 落 44.1 m，前 2 s 落 19.6 m，最后 1 s 就是 <b>24.5 m</b>（g = 10 时 25 m）。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="最后1秒位移等于总位移减去前2秒位移">

<div class="qac">
<p class="q">在月球上会怎样？</p>
<p class="a"><b>下落变慢。</b>月球 g ≈ 1.6 m/s²，同样高度 t = √(2h/g) 变大；但没有空气，羽毛与锤子仍同时落地。</p>

<p class="gx-note">这六问其实是同一件事：<b>把匀变速公式的 v₀ 换成 0、a 换成 g</b>。
质量不进公式，空气阻力不进公式（除非题目特意给），g 的取值必须写在卷面上。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是考场高频错句，右边是能得分的表述。这一节的错，多半来自生活经验和单位。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 重的物体下落得快，轻的落得慢。</p>
<p class="er-v">✓ 忽略空气阻力时，同一地点一切物体自由下落的加速度都是 g。</p>
<p class="er-w">日常看到的差别来自空气阻力（迎风面积、形状），不是重力大小；真空管里羽毛与硬币同时到底。</p>
</div>
<div class="er">
<p class="er-x">✗ g 就是重力，单位是 N。</p>
<p class="er-v">✓ g 是重力加速度，单位 m/s²；重力 G = mg，单位 N。</p>
<p class="er-w">「9.8 N/kg」与「9.8 m/s²」数值相同但含义不同，写单位时混用直接扣分。</p>
</div>
<div class="er">
<p class="er-x">✗ 从楼上「往下扔」也是自由落体。</p>
<p class="er-v">✓ 自由落体要求 v₀ = 0，是「由静止释放」，不是「向下抛出」。</p>
<p class="er-w">有初速度就要用 v = v₀ + gt、h = v₀t + ½gt²，直接套 h = ½gt² 会算小。</p>
</div>
<div class="er">
<p class="er-x">✗ h = gt。</p>
<p class="er-v">✓ h = ½gt²。½ 来自 v–t 图下方三角形的面积。</p>
<p class="er-w">漏掉 ½，高度会算成 2 倍；这是把速度公式和位移公式混在一起的典型错。</p>
</div>
<div class="er">
<p class="er-x">✗ 取 g = 10 计算，卷面上不写。</p>
<p class="er-v">✓ 开头写一句「取 g = 10 m/s²」，后面的数值才站得住。</p>
<p class="er-w">同一题按 9.8 算是 44.1 m、按 10 算是 45 m；不声明就会被判「与标准答案不符」。</p>
</div>
<div class="er">
<p class="er-x">✗ 有空气阻力也直接当自由落体算。</p>
<p class="er-v">✓ 只有阻力远小于重力、可以忽略时，才能按自由落体处理。</p>
<p class="er-w">纸片、羽毛、降落伞这些阻力明显的物体，落地时间会明显大于理论值。</p>
</div>
</div>
</section>

<p class="gx-note" style="border-top:1px solid var(--line);padding-top:14px">第二章到这里收口：<b>纸带 → v = v₀ + at → x = v₀t + ½at² → 自由落体</b>。
下一章换一个方向：不再问「怎么动」，而问「为什么这样动」——力。</p>

<p>数值口径：<b>互动用 g = 9.8 m/s²</b>（教材取值），得 4.9t² 与 9.8t；<b>图 3 与例题用 g = 10 m/s²</b> 作近似，分别得 5、20、45 m 与 3 s、30 m/s。
两种取值都在图注与题干中明确写出，例题第（3）问又用 g = 9.8 复核（3.03 s、29.7 m/s），误差约 1%。</p>
<p>月球 g ≈ 1.6 m/s²、赤道 9.78 与两极 9.83 为常见参考值，仅用于说明「g 随地点略有变化」，不参与计算。</p>

  <span class="gx-zoom-tip">双指放大看细节</span>
  <button class="gx-zoom-x" type="button" aria-label="关闭">✕</button>

<script src="../../assets/page.js"></script>
<script src="../../assets/gx.js"></script>
<script src="../../assets/autopilot.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var $ = GX.$;
  var stage = $("gxStage");
  var T = 0, G = 9.8, TMAX = 3;
  var YTOP = 44, HMAX = 45, HSPAN = 196;

  function yOf(h) { return YTOP + Math.min(h, HMAX) / HMAX * HSPAN; }

  function calc(t) {
    var v = G * t;
    var h = 0.5 * G * t * t;
    var st, col, bg, sn;
    if (t < 0.05) {
      st = "刚释放"; col = "#5a6472"; bg = "#f4f7f9";
      sn = "v = 0，h = 0，加速度为 g";
    } else {
      st = "加速下落"; col = "#2f8a5b"; bg = "#e6f6ee";
      sn = "h = 4.9t²，" + (t * t * 4.9).toFixed(1) + " m";
    }
    return { v: v, h: h, st: st, col: col, bg: bg, sn: sn };
  }

  function render() {
    var s = calc(T), y = yOf(s.h);
    $("gxBall").setAttribute("cy", y);
    $("gxBallDot").setAttribute("cy", y);
    $("gxVArrow").setAttribute("y1", y + 12);
    $("gxVArrow").setAttribute("y2", y + 12 + s.v * 1.5);
    $("gxVHead").setAttribute("points",
      "200," + (y + 12 + s.v * 1.5) + " 195," + (y + 4 + s.v * 1.5) + " 205," + (y + 4 + s.v * 1.5));
    $("gxVLab").setAttribute("y", y + 24);
    $("gxVLab").textContent = "v = " + s.v.toFixed(1) + " m/s";
    $("gxHLab").setAttribute("y", y - 12);
    $("gxHLab").textContent = "h = " + s.h.toFixed(1) + " m";

    $("gxVa").textContent = T.toFixed(1) + " s";
    $("gxVb").textContent = s.v.toFixed(1) + " m/s";
    $("gxVc").textContent = s.h.toFixed(1) + " m";
    $("gxVc").style.color = s.col;
    $("gxVcn").textContent = s.sn;
    $("gxStBox").style.background = s.bg;
    $("gxStBox").style.borderColor = s.col + "44";
  }

  var ap = null, dragging = false, moved = false, downX = 0, suppressTap = false;

  function xToT(clientX) {
    var r = stage.getBoundingClientRect();
    var f = (clientX - r.left) / r.width;
    return Math.max(0, Math.min(TMAX, Math.round(f * TMAX * 10) / 10));
  }

  stage.addEventListener("pointerdown", function (ev) {
    dragging = true; moved = false; downX = ev.clientX;
    if (ap) ap.take();
    T = xToT(ev.clientX);
    if (ap) ap.setValue(T, false);
    render();
    try { stage.setPointerCapture(ev.pointerId); } catch (e) {}
  });
  stage.addEventListener("pointermove", function (ev) {
    if (!dragging) return;
    if (Math.abs(ev.clientX - downX) > 4) moved = true;
    T = xToT(ev.clientX);
    if (ap) ap.setValue(T, false);
    render();
  });
  stage.addEventListener("pointerup", function () {
    if (moved) suppressTap = true;
    dragging = false;
  });
  stage.addEventListener("click", function (ev) {
    if (!suppressTap) return;
    suppressTap = false;
    ev.stopImmediatePropagation();
  });

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  render();
  ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 0 }, { t: 3, v: 1 }, { t: 6, v: 3 }, { t: 8, v: 3 },
           { t: 10, v: 2 }, { t: 12, v: 0 }],
    keys: [3, 2, 1, 0],
    value: T, min: 0, max: 3, step: 0.1,
    idle: 5000,
    onChange: function (v) { T = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc };

  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    $("gxSl").addEventListener("input", function () {
      T = Math.max(0, Math.min(3, +this.value));
      render();
    });
  }
});
</script>
</body>
</html>
