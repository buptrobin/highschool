<h1 class="page-title">2. 电势差</h1>

<script type="text/markdown" id="md">
<div class="gx">
<div class="gx-kicker">ELI5-HIGH · 讲给要考试的人</div>
<p class="gx-claim">电势差只问一件事：<b>两点之间差多少伏</b>。它等于每库仑电荷从一点搬到另一点时，静电力做的功。</p>
<nav class="gx-toc"><a href="#a">① 课本怎么说</a><a href="#b">② 拆开看</a><a href="#c">③ 自己拖一下</a><a href="#d">④ 一道题走一遍</a><a href="#e">⑤ 会怎么考</a><a href="#f">⑥ 易错清单</a></nav>

<section class="gx-sec" id="a"><h2><span class="sn">01</span>课本怎么说</h2><p class="gx-h2s">三条：定义、做功、与路径无关。<span class="q-src">人教版必修第三册 · 第十章第2节</span></p>
<div class="gx-quote"><p class="q-t">课本表述 · 电势差</p><p class="q-b">电场中两点间电势的差值叫电势差，U_AB = φ_A − φ_B；电势差是标量，单位伏特（V）。</p><p class="q-n">→ 人话：U_AB 就是 A 比 B 高多少伏；U_AB 为负，说明 B 比 A 高。</p></div>
<div class="gx-quote"><p class="q-t">课本表述 · 静电力做功</p><p class="q-b">电荷从 A 移到 B，静电力做的功 W_AB = qU_AB；U_AB = −U_BA。</p><p class="q-n">→ 人话：正电荷从高电势到低电势，静电力做正功；负电荷反过来。</p></div>
<div class="gx-quote"><p class="q-t">课本表述 · 与路径无关</p><p class="q-b">电势差由电场本身决定，与试探电荷无关；静电力做功也与路径无关，只与初末位置有关。</p><p class="q-n">→ 人话：U_AB 是电场的“地势差”，换条路走，差值不变。</p></div></section>

<section class="gx-sec" id="b"><h2><span class="sn">02</span>拆开看</h2><p class="gx-h2s">三张图：高度差、W=qU、等势面。</p>
<figure class="gx-fig"><div class="fig-cap"><span class="fig-no">图 1</span><span class="fig-t">U_AB 就是两点电势的差值</span><span class="bdg bdg-must">必考</span></div><p class="fig-s">把电势想成海拔：φ_A = 10 V、φ_B = 4 V，高度差就是 <b>U_AB = 10 − 4 = 6 V</b>。</p><p class="fig-s">若反过来写 U_BA = φ_B − φ_A = −6 V；<b>U_AB = −U_BA</b>，负号表示方向反了。</p><div class="gx-svgbox"><svg viewBox="0 0 900 250" role="img" aria-label="电势差是两点电势的差值"><text x="450" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#3a3a35">U_AB = φ_A − φ_B：A 比 B 高 6 V</text><line x1="90" y1="190" x2="810" y2="190" stroke="#3a3a35" stroke-width="1.6"/><line x1="90" y1="70" x2="90" y2="206" stroke="#3a3a35" stroke-width="1.6"/><line x1="220" y1="190" x2="220" y2="90" stroke="#7c3aed" stroke-width="3"/><line x1="650" y1="190" x2="650" y2="142" stroke="#2f6fd0" stroke-width="3"/><text x="220" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#6d28d9">A · φA = 10 V</text><text x="650" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#2f6fd0">B · φB = 4 V</text><line x1="220" y1="106" x2="650" y2="106" stroke="#b8791f" stroke-width="1.8" stroke-dasharray="6 4"/><polygon points="650,101 666,106 650,111" fill="#b8791f"/><text x="435" y="94" text-anchor="middle" font-size="12" font-weight="700" fill="#8a5c14">U_AB = 6 V</text><text x="450" y="232" text-anchor="middle" font-size="11" fill="#6b7280">高度差只认起点、终点，不认路径</text></svg><span class="gx-zoomchip">点击放大</span></div><p class="gx-take">U_AB 是<b>标量</b>，但有正负；正负只说明哪边电势高。</p></figure>
<figure class="gx-fig"><div class="fig-cap"><span class="fig-no">图 2</span><span class="fig-t">W = qU：功与电势差直接挂钩</span><span class="bdg bdg-warn">易错</span></div><p class="fig-s">正电荷 q 从 A 到 B，U_AB &gt; 0，静电力做正功 <b>W = qU_AB</b>。</p><p class="fig-s">若电荷为负，q 带负号代入，W 变成负值；<b>不能只代绝对值</b>。</p><div class="gx-svgbox"><svg viewBox="0 0 900 260" role="img" aria-label="正电荷从高电势到低电势，静电力做正功"><text x="450" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#3a3a35">W_AB = qU_AB：正电荷顺电势降落走，做正功</text><rect x="60" y="56" width="780" height="150" rx="12" fill="#fbfcfd" stroke="#e6e9ee"/><line x1="110" y1="130" x2="790" y2="130" stroke="#2f6fd0" stroke-width="2"/><polygon points="790,125 806,130 790,135" fill="#2f6fd0"/><circle cx="210" cy="130" r="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="210" y="135" text-anchor="middle" font-size="12" fill="#6d28d9">+q</text><text x="210" y="106" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">A</text><text x="650" y="106" text-anchor="middle" font-size="12" font-weight="700" fill="#2f6fd0">B</text><line x1="238" y1="160" x2="610" y2="160" stroke="#b8791f" stroke-width="2"/><polygon points="610,155 626,160 610,165" fill="#b8791f"/><text x="430" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#8a5c14">W = qU_AB &gt; 0</text><text x="450" y="230" text-anchor="middle" font-size="11" fill="#6b7280">正电荷：高电势 → 低电势，电势能减少</text></svg><span class="gx-zoomchip">点击放大</span></div><p class="gx-take">先判正负，再代数；<b>W = qU</b> 里的 q、U 都带符号，结果才有方向意义。</p></figure>
<figure class="gx-fig"><div class="fig-cap"><span class="fig-no">图 3</span><span class="fig-t">等势面：同一面上 U = 0</span><span class="bdg bdg-diff">辨析</span></div><p class="fig-s">同一等势面上任意两点电势相等，所以两点间 <b>U = 0</b>，移动电荷静电力不做功。</p><p class="fig-s">等势面越密，说明相同距离上电势降得越快，场强越大。</p><div class="gx-svgbox"><svg viewBox="0 0 900 250" role="img" aria-label="等势面上两点电势相等，电势差为零"><text x="450" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#3a3a35">同一等势面：φ 相等，U = 0</text><g stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="6 4"><line x1="250" y1="60" x2="250" y2="210"/><line x1="450" y1="60" x2="450" y2="210"/><line x1="650" y1="60" x2="650" y2="210"/></g><circle cx="250" cy="120" r="8" fill="#7c3aed"/><circle cx="250" cy="180" r="8" fill="#7c3aed"/><text x="270" y="116" font-size="12" fill="#6d28d9">A</text><text x="270" y="184" font-size="12" fill="#6d28d9">B</text><line x1="250" y1="150" x2="250" y2="150" stroke="#b8791f"/><text x="320" y="154" font-size="12" font-weight="700" fill="#8a5c14">φA = φB ⇒ U_AB = 0</text><text x="450" y="232" text-anchor="middle" font-size="11" fill="#6b7280">等势面与电场线垂直；沿等势面走，静电力不做功</text></svg><span class="gx-zoomchip">点击放大</span></div><p class="gx-take">U_AB = 0 不代表电场为零；只说明 A、B 在同一条“地势线”上。</p></figure></section>

<section class="gx-sec" id="c"><h2><span class="sn">03</span>自己拖一下<span class="bdg bdg-must">核心</span></h2><p class="gx-h2s">φ_A = 10 V 固定，拖 φ_B；看 U_AB 和 W 怎么变。</p><figure class="gx-fig"><div class="fig-cap"><span class="fig-no">互动 1</span><span class="fig-t">φ_B 变，U_AB 和 W 一起变</span><span class="gx-ap" id="gxAp"><i></i><span id="gxApTxt">自动演示中</span></span></div><p class="fig-s">q = +2×10⁻⁶ C；<b>U_AB = φ_A − φ_B</b>，<b>W = qU_AB</b>。</p><div class="gx-board"><svg id="gxStage" class="gx-graph" viewBox="0 0 360 270" tabindex="0" role="application" aria-label="改变B点电势，观察电势差和静电力做功"><text x="180" y="18" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3a3a35">U_AB = φA − φB，W = qU_AB</text><text x="180" y="34" text-anchor="middle" font-size="8.5" fill="#6b7280">φA = 10 V，q = +2×10⁻⁶ C</text><line x1="54" y1="200" x2="306" y2="200" stroke="#3a3a35" stroke-width="1.6"/><line x1="54" y1="76" x2="54" y2="212" stroke="#3a3a35" stroke-width="1.6"/><line x1="70" y1="200" x2="70" y2="92" stroke="#2f6fd0" stroke-width="4"/><text x="70" y="80" text-anchor="middle" font-size="9" font-weight="700" fill="#2f6fd0">A 10 V</text><line id="gxBLine" x1="180" y1="200" x2="180" y2="140" stroke="#7c3aed" stroke-width="4"/><circle id="gxB" cx="180" cy="118" r="5" fill="#7c3aed"/><text id="gxBLab" x="192" y="114" font-size="9" font-weight="700" fill="#6d28d9">B 5 V</text><line id="gxUline" x1="70" y1="102" x2="180" y2="102" stroke="#b8791f" stroke-width="1.6" stroke-dasharray="5 3"/><text id="gxUlab" x="125" y="94" text-anchor="middle" font-size="8.5" font-weight="700" fill="#8a5c14">U = 5 V</text><text id="gxHint" x="180" y="232" text-anchor="middle" font-size="8.5" fill="#8a5c14">A 比 B 高，正电荷从 A 到 B 做正功</text></svg><div class="bar"><span class="lb">B 点电势 φB</span><input type="range" id="gxSl" min="0" max="10" step="1" value="5" aria-label="B点电势，0到10伏"></div></div><div class="stats"><div class="st"><div class="k">① B 点电势 φB</div><div class="v" id="gxVa">5 V</div><div class="s">φA = 10 V 固定</div></div><div class="st"><div class="k">② 电势差 U_AB</div><div class="v" id="gxVb">5 V</div><div class="s">U_AB = φA − φB</div></div><div class="st"><div class="k">③ 静电力做功 W</div><div class="v" id="gxVc">10 μJ</div><div class="s">W = qU_AB</div></div></div><p class="gx-take" id="gxTake">φB = 5 V：U_AB = 5 V、W = 1.0×10⁻⁵ J；φB = 10 V 时 U_AB = 0，W = 0。</p><p class="gx-note" id="gxStateNote">状态：φB 越小，U_AB 越大，正电荷从 A 到 B 做的正功越多。</p></figure></section>

<section class="gx-sec" id="d"><h2><span class="sn">04</span>一道题走一遍</h2><p class="gx-h2s">先自己写，再点“下一步”。这题把 U_AB 的正负和 W 的符号一次走完。</p><div class="gx-ex"><p class="ex-t">例题 · 两点间电势差与做功<span class="bdg bdg-must">必考</span></p><p class="ex-q">电场中 A 点电势 φ_A = 10 V，B 点电势 φ_B = 4 V。把 q = +2×10⁻⁶ C 的电荷从 A 移到 B。求 U_AB、静电力做的功 W_AB；若从 B 移到 A，W_BA 为多少？</p><ol class="steps" id="gxSteps"><li class="step"><p class="s-h">第 1 步 · 先写 U_AB 的定义</p><p class="s-b">U_AB = φ_A − φ_B = 10 V − 4 V = <b>6 V</b>。顺序不能反，U_BA = −6 V。</p><p class="s-k">用到：U_AB = φ_A − φ_B。</p></li><li class="step" hidden><p class="s-h">第 2 步 · 判断正负</p><p class="s-b">φ_A &gt; φ_B，U_AB &gt; 0；正电荷从高电势到低电势，静电力做<b>正功</b>。</p><p class="s-k">用到：沿电场线电势降低，正电荷受力同场强方向。</p></li><li class="step" hidden><p class="s-h">第 3 步 · 算 W_AB</p><p class="s-b">W_AB = qU_AB = 2×10⁻⁶ × 6 = <b>1.2×10⁻⁵ J</b>。</p><p class="s-k">用到：W = qU，q、U 都带符号。</p></li><li class="step" hidden><p class="s-h">第 4 步 · 反向过程</p><p class="s-b">从 B 到 A，U_BA = −6 V，W_BA = qU_BA = <b>−1.2×10⁻⁵ J</b>，静电力做负功。</p><p class="s-k">用到：U_AB = −U_BA，W 也跟着变号。</p></li><li class="step" hidden><p class="s-h">第 5 步 · 检查</p><p class="s-b">W_AB + W_BA = 0，往返一周静电力做功为零；这正说明静电力做功与路径无关。</p><p class="s-k">用到：静电力是保守力。</p></li></ol><div class="exbar"><button id="gxNext" type="button">下一步</button><span class="cnt" id="gxCnt">1 / 5</span></div><div class="ans" id="gxAns" hidden><p class="ans-t">标准答案（可抄进答题卡）</p><p class="ans-b">U_AB = φ_A − φ_B = <b>6 V</b>；W_AB = qU_AB = <b>1.2×10⁻⁵ J</b>；W_BA = qU_BA = <b>−1.2×10⁻⁵ J</b>。</p></div></div></section>

<section class="gx-sec" id="e"><h2><span class="sn">05</span>考你会怎么考</h2><p class="gx-h2s">六问里，三问都在考“顺序和正负”。</p><div class="gx-qa"><div class="qac"><p class="q">U_AB 和 U_BA 是什么关系？</p><p class="a"><b>互为相反数</b>：U_AB = −U_BA。交换下标，顺序反了。</p><svg viewBox="0 0 240 132" role="img" aria-label="U_AB与U_BA互为相反数"><line x1="30" y1="66" x2="210" y2="66" stroke="#3a3a35" stroke-width="1.5"/><polygon points="210,61 224,66 210,71" fill="#3a3a35"/><text x="48" y="50" font-size="10" fill="#6d28d9">A</text><text x="184" y="50" font-size="10" fill="#2f6fd0">B</text><text x="120" y="88" text-anchor="middle" font-size="9" fill="#8a5c14">U_AB = −U_BA</text></svg></div><div class="qac"><p class="q">电势差有方向吗？</p><p class="a"><b>没有方向，是标量</b>；正负只表示两点谁高谁低。</p><svg viewBox="0 0 240 132" role="img" aria-label="电势差是标量，正负表示高低"><line x1="120" y1="20" x2="120" y2="112" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4 3"/><circle cx="76" cy="66" r="6" fill="#b8402f"/><circle cx="164" cy="66" r="6" fill="#2f8a5b"/><text x="76" y="88" text-anchor="middle" font-size="9" fill="#b8402f">负</text><text x="164" y="88" text-anchor="middle" font-size="9" fill="#1e6640">正</text></svg></div><div class="qac"><p class="q">W = qU 里，q 要带正负号吗？</p><p class="a"><b>要。</b>q 为负时 W 变号；只代绝对值会判反做功正负。</p><svg viewBox="0 0 240 132" role="img" aria-label="W=qU中q要带符号"><rect x="38" y="44" width="70" height="34" rx="6" fill="#e6f6ee" stroke="#2f8a5b"/><text x="73" y="65" text-anchor="middle" font-size="10" fill="#1e6640">q &gt; 0</text><rect x="132" y="44" width="70" height="34" rx="6" fill="#fbeae7" stroke="#b8402f"/><text x="167" y="65" text-anchor="middle" font-size="10" fill="#8f3226">q &lt; 0</text><text x="120" y="104" text-anchor="middle" font-size="9" fill="#6b7280">W 的正负跟着 q 变</text></svg></div><div class="qac"><p class="q">零势点变了，U_AB 变吗？</p><p class="a"><b>不变。</b>φA、φB 同时平移，差值不变。</p><svg viewBox="0 0 240 132" role="img" aria-label="零势点平移，电势差不变"><line x1="34" y1="96" x2="206" y2="96" stroke="#3a3a35" stroke-width="1.4"/><line x1="34" y1="96" x2="34" y2="24" stroke="#3a3a35" stroke-width="1.4"/><line x1="50" y1="80" x2="180" y2="80" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="5 3"/><line x1="50" y1="56" x2="180" y2="56" stroke="#2f6fd0" stroke-width="1.4" stroke-dasharray="5 3"/><text x="120" y="118" text-anchor="middle" font-size="9" fill="#6b7280">整体平移，差不变</text></svg></div><div class="qac"><p class="q">沿电场线方向，U_AB 是正还是负？</p><p class="a">A 在前、B 在后时 <b>U_AB &gt; 0</b>，因为沿场强方向电势降低。</p><svg viewBox="0 0 240 132" role="img" aria-label="沿电场线方向电势降低"><line x1="28" y1="66" x2="212" y2="66" stroke="#2f6fd0" stroke-width="1.6"/><polygon points="212,61 226,66 212,71" fill="#2f6fd0"/><text x="42" y="48" font-size="9" fill="#2f6fd0">φ 高</text><text x="182" y="48" font-size="9" fill="#2f6fd0">φ 低</text></svg></div><div class="qac"><p class="q">电子从 A 到 B，W 怎么算？</p><p class="a">q = −e 代入：<b>W = −eU_AB</b>，与正电荷结果反号。</p><svg viewBox="0 0 240 132" role="img" aria-label="电子带负电，做功与正电荷反号"><circle cx="92" cy="62" r="18" fill="#eef5fc" stroke="#2f6fd0" stroke-width="1.8"/><text x="92" y="67" text-anchor="middle" font-size="12" fill="#2f6fd0">−e</text><line x1="116" y1="62" x2="184" y2="62" stroke="#b8791f" stroke-width="2"/><polygon points="184,57 198,62 184,67" fill="#b8791f"/><text x="120" y="94" text-anchor="middle" font-size="9" fill="#8a5c14">W = −eU_AB</text></svg></div></div></section>

<section class="gx-sec" id="f"><h2><span class="sn">06</span>易错清单</h2><p class="gx-h2s">左边是错句，右边是能得分的表述。</p><div class="gx-errs"><div class="er"><p class="er-x">✗ U_AB = φ_B − φ_A。</p><p class="er-v">✓ <b>U_AB = φ_A − φ_B</b>，下标顺序就是“末减初”的反向。</p><p class="er-w">写成 φB−φA 会把正负号整体弄反。</p></div><div class="er"><p class="er-x">✗ U_AB = U_BA。</p><p class="er-v">✓ <b>U_AB = −U_BA</b>。</p><p class="er-w">交换 A、B 的顺序，差值变号。</p></div><div class="er"><p class="er-x">✗ 电势差与试探电荷的电荷量有关。</p><p class="er-v">✓ 电势差由<b>电场本身</b>决定，与 q 无关。</p><p class="er-w">q 只影响电势能，不影响两点间电势差。</p></div><div class="er"><p class="er-x">✗ 零势点变了，U_AB 也变。</p><p class="er-v">✓ 零势点可任选，<b>U_AB 不变</b>。</p><p class="er-w">φA、φB 同时平移，差值抵消。</p></div><div class="er"><p class="er-x">✗ W = qU 只代绝对值。</p><p class="er-v">✓ q、U 都<b>带符号</b>代入，W 的正负才有意义。</p><p class="er-w">负电荷从高电势到低电势，静电力做负功。</p></div><div class="er"><p class="er-x">✗ 沿电场线方向电势升高。</p><p class="er-v">✓ 沿电场线方向电势<b>降低</b>。</p><p class="er-w">这是判断 U_AB 正负最快的一步。</p></div></div></section>
<div class="gx-foot"><p>人教版《物理》必修第三册（2019年版）第十章第2节</p></div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  var $ = GX.$, QA = 10, Q = 2e-6, phiB = 5;
  function render() {
    var pb = Math.round(phiB * 10) / 10, U = Math.round((QA - pb) * 10) / 10, W = Q * U, x = 70 + pb * 22, y = 200 - pb * 10;
    $("gxBLine").setAttribute("x1", x.toFixed(1)); $("gxBLine").setAttribute("x2", x.toFixed(1)); $("gxBLine").setAttribute("y1", 200); $("gxBLine").setAttribute("y2", Math.max(92, y).toFixed(1));
    $("gxB").setAttribute("cx", x.toFixed(1)); $("gxB").setAttribute("cy", Math.max(92, y).toFixed(1));
    $("gxBLab").setAttribute("x", Math.min(300, x + 12).toFixed(1)); $("gxBLab").setAttribute("y", Math.max(88, y - 6).toFixed(1));
    $("gxBLab").textContent = "B " + pb.toFixed(1) + " V";
    $("gxUline").setAttribute("x1", 70); $("gxUline").setAttribute("x2", x.toFixed(1)); $("gxUlab").setAttribute("x", ((70 + x) / 2).toFixed(1)); $("gxUlab").textContent = "U = " + U.toFixed(1) + " V";
    $("gxVa").textContent = pb.toFixed(1) + " V"; $("gxVb").textContent = U.toFixed(1) + " V";
    $("gxVc").textContent = (W * 1e6).toFixed(0) + " μJ";
    $("gxHint").textContent = U > 0 ? "A 比 B 高，正电荷从 A 到 B 做正功" : (U < 0 ? "B 比 A 高，正电荷从 A 到 B 做负功" : "φA = φB，U_AB = 0");
    $("gxTake").textContent = "φB = " + pb.toFixed(1) + " V：U_AB = " + U.toFixed(1) + " V、W = " + (W * 1e6).toFixed(0) + " μJ；φB = 10 V 时 U_AB = 0，W = 0。";
    $("gxStateNote").textContent = U > 0 ? "状态：A 比 B 高，正电荷从 A 到 B 电势能减少。" : (U < 0 ? "状态：B 比 A 高，正电荷从 A 到 B 电势能增加。" : "状态：A、B 等势，移动电荷静电力不做功。");
  }
  function setMode(m) { var b = $("gxAp"), t = $("gxApTxt"); if (!b) return; b.classList.toggle("is-auto", m === "auto"); b.classList.toggle("is-manual", m !== "auto"); if (t) t.textContent = m === "auto" ? "自动演示中" : "你接管了"; }
  render();
  var ap = AutoPilot.create({
    mount: $("gxStage"), follow: $("gxSl"),
    loop: [{ t: 0, v: 0 }, { t: 1.2, v: 0 }, { t: 2.8, v: 4 }, { t: 5.3, v: 4 }, { t: 6.8, v: 7 }, { t: 8.0, v: 7 }, { t: 9.4, v: 10 }, { t: 11.2, v: 10 }, { t: 12.4, v: 0 }],
    keys: [0, 2, 5, 10], value: phiB, min: 0, max: 10, step: 1, idle: 5000,
    onChange: function (v) { phiB = v; render(); }, onMode: setMode
  });
  window.__ap = ap;
});
</script>
