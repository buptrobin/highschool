<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本原话，拆成三句</h2>
<div class="q-src">人教版必修第三册 · 第十二章第2节</div>

<div class="q">
<p class="q-t">“闭合电路由外电路和内电路组成；电源的电动势 E 等于内、外电路电压之和：E = U外 + U内。”</p>
<p class="q-b">电源像带内阻的搬运工：把 1 C 电荷“举高”给的能量是 E，可电荷在电源内部要走一段有阻力的路，先消耗一部分，剩下的才加在外电路上。所以量到的 U外 总比 E 小，差的那点就是 U内 = Ir。</p>
</div>

<div class="q">
<p class="q-t">“闭合电路欧姆定律：I = E/(R+r)；路端电压 U = E − Ir。”</p>
<p class="q-b">电流不是 E/R，而是 E 除以总电阻 R+r——分母里多出的 r 就是内阻。同一股电流先过外电阻、再过内阻，两段都要分电压；U 是外电路两端真正量到的电压。</p>
</div>

<div class="q">
<p class="q-t">“路端电压随外电阻增大而增大；短路时 R = 0，I短 = E/r，路端电压为零。”</p>
<p class="q-b">R 变大 → 总电阻变大 → I 变小 → Ir 变小 → U = E − Ir 变大。R = 0 时内阻成了唯一电阻，6 V 全压在内阻上，外电路一点也拿不到；R → ∞ 时 I → 0、U → E，但仍不等于 E。</p>
</div>

<p class="gx-note">读法：先问“E 和 U 到底差在哪”，再问“电流由谁决定”，最后看 R 变化把 U 推向哪边。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己写，再点“下一步”。这题的关键只有一句：分母永远是 R+r。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 闭合电路的电流与路端电压<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">电源电动势 E = 6 V、内阻 r = 1 Ω，外接一个可变电阻 R，导线电阻不计。求：
（1）R = 2 Ω 时，电流 I 和路端电压 U；
（2）R = 5 Ω 时，电流 I 和路端电压 U；
（3）R 被一根导线直接短接（R = 0）时，短路电流 I短 和路端电压 U。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 先认电路，再选公式</p>
<p class="s-b">最简单的闭合电路：电源（E、r）加一个外电阻 R，只有一条回路，外电路和内电路的电流相同。两个公式必须一起用：
<b>I = E/(R+r)</b>，<b>U = E − Ir</b>（也等于 IR，可互相验算）。分母永远是 R+r，不是 R。</p>
<p class="s-k">用到：闭合电路欧姆定律、E = U外 + U内。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · R = 2 Ω：先求电流，再求电压</p>
<p class="s-b">I = E/(R+r) = 6/(2+1) = <b>2 A</b>。
U = IR = 2 × 2 = <b>4 V</b>；换条路验算：U = E − Ir = 6 − 2 × 1 = 4 V，一致。内电压 Ir = 2 V，4 V + 2 V 正好是 E。</p>
<p class="s-k">用到：I = E/(R+r)；U = IR = E − Ir。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · R = 5 Ω：R 变大，I 变小、U 变大</p>
<p class="s-b">I = 6/(5+1) = <b>1 A</b>，U = 1 × 5 = <b>5 V</b>（验算 6 − 1 × 1 = 5 V）。
R 从 2 Ω 增到 5 Ω，I 从 2 A 减到 1 A，U 从 4 V 增到 5 V——路端电压朝 E 靠近了，但还没到。</p>
<p class="s-k">用到：R 增大 → I 减小 → Ir 减小 → U 增大。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 短路：R = 0 的极限</p>
<p class="s-b">R = 0 时 <b>I短 = E/r = 6/1 = 6 A</b>，路端电压 <b>U = I短 R = 0</b>（也就是 6 − 6 × 1 = 0）。
此刻 6 V 全落在内阻上，外电路一点电压也拿不到，持续下去会烧坏电源——短路只做数值分析，不真的去接。</p>
<p class="s-k">用到：短路 I短 = E/r，U = 0。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 写答案，收成一条规律</p>
<p class="s-b">（1）I = 2 A，U = 4 V；（2）I = 1 A，U = 5 V；（3）I短 = 6 A，U = 0。
三个结论出自同一条链：<b>R 增大 → 总电阻增大 → I 减小 → Ir 减小 → U 增大</b>。</p>
<p class="s-k">用到：U = E − Ir 的定性推论，短路与断路两个极限。</p>
</li>
</ol>
<div class="exbar">
  <button id="gxNext" type="button">下一步</button>
  <span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）R = 2 Ω：I = E/(R+r) = 6/(2+1) = <b>2 A</b>，U = IR = <b>4 V</b>（验算 6 − 2 × 1 = 4 V）。<br>
（2）R = 5 Ω：I = 6/(5+1) = <b>1 A</b>，U = 1 × 5 = <b>5 V</b>（验算 6 − 1 × 1 = 5 V）。<br>
（3）R = 0：I短 = E/r = <b>6 A</b>，U = <b>0</b>。</p>
</div>
<p class="gx-note">阅卷高频扣分：把 I 写成 E/R；算 U 时忘了减 Ir；认为路端电压一定等于电动势；短路一问算出一个“很大的电压”。</p>
</div>
</section>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>考你会怎么考</h2>
<p class="gx-h2s">六种问法，一半在问“E 和 U 差在哪”。</p>

<div class="gx-qa">
<div class="qac">
<p class="q">电动势 E 和路端电压 U 有什么区别？</p>
<p class="a"><b>E 是电源“给”的，U 是外电路“量到”的。</b>E 由电源决定、与电路无关；U = E − Ir 随电流变，只有断路时 U 才等于 E。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="电动势在电源内部，路端电压量在外电路上">
<rect x="24" y="26" width="86" height="58" rx="8" fill="#fdf3e0" stroke="#f3cdc6"/>
<rect x="130" y="26" width="86" height="58" rx="8" fill="#f5f3ff" stroke="#d8ccfb"/>
<g text-anchor="middle" font-size="10"><text x="67" y="52" fill="#8a5c14">电源内部</text><text x="173" y="52" fill="#6d28d9">外电路</text></g>
<g text-anchor="middle" font-size="10.5" font-weight="700"><text x="67" y="72" fill="#8a5c14">E = 6 V</text><text x="173" y="72" fill="#6d28d9">U = 4 V</text></g>
<path d="M112 55h12" stroke="#6b7280" stroke-width="1.4"/><path d="M124 51l10 4-10 4z" fill="#6b7280"/>
<text x="120" y="108" text-anchor="middle" font-size="9" fill="#6b7280">内阻先扣掉 Ir</text>
</svg>
</div>
<div class="qac">
<p class="q">为什么是 I = E/(R+r)，不是 I = E/R？</p>
<p class="a"><b>内阻也在这条回路里，电流必须穿过它。</b>总电阻是 R+r，E 要按总电阻分；少写 r，电流偏大，U 就会算错。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="电流的分母是外电阻与内阻之和">
<rect x="30" y="34" width="180" height="64" rx="8" fill="none" stroke="#cfd4da" stroke-width="1.2"/>
<rect x="86" y="22" width="68" height="24" rx="5" fill="#fff" stroke="#7c3aed" stroke-width="1.4"/>
<rect x="86" y="86" width="68" height="24" rx="5" fill="#fff" stroke="#b8791f" stroke-width="1.4"/>
<g text-anchor="middle" font-size="9.5"><text x="120" y="38" fill="#6d28d9">R = 2 Ω</text><text x="120" y="102" fill="#8a5c14">r = 1 Ω</text></g>
<text x="120" y="68" text-anchor="middle" font-size="10.5" fill="#3a3a35">I = E/(R+r)</text>
<text x="120" y="126" text-anchor="middle" font-size="9" fill="#6b7280">分母是总电阻</text>
</svg>
</div>
<div class="qac">
<p class="q">短路时电流为什么最大？</p>
<p class="a"><b>R = 0 时回路里只剩内阻，I短 = E/r 是电流上限。</b>此时 U = 0，6 V 全落在内阻上，功率全在电源内部发热。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="短路时外电阻为零，电流由内阻限制">
<path d="M40 92 H96 M144 92 H200 V44 H40 V92" fill="none" stroke="#5a6472" stroke-width="1.8"/>
<rect x="96" y="76" width="48" height="32" rx="4" fill="#fdf3e0" stroke="#b8791f"/>
<text x="120" y="97" text-anchor="middle" font-size="9.5" fill="#8a5c14">E, r</text>
<text x="120" y="66" text-anchor="middle" font-size="10" font-weight="700" fill="#a04437">I短 = 6/1 = 6 A</text>
<text x="120" y="120" text-anchor="middle" font-size="9" fill="#6b7280">U = 0，电压全压在 r 上</text>
</svg>
</div>
<div class="qac">
<p class="q">外电阻变大，路端电压怎么变？</p>
<p class="a"><b>U 跟着变大，逐渐靠近 E 但不会超过它。</b>U = ER/(R+r)：R 越大，外电路分到的份额越大；断路趋于 E，短路为零。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="路端电压随外电阻增大而增大">
<path d="M40 106 H200 M40 106 V26" fill="none" stroke="#5a6472" stroke-width="1.2"/>
<path d="M40 38 H200" stroke="#d8ccfb" stroke-width="1.2" stroke-dasharray="4 3"/>
<path d="M40 106 C74 106 88 58 120 48 L196 42" fill="none" stroke="#7c3aed" stroke-width="2.2"/>
<text x="200" y="32" text-anchor="end" font-size="8.5" fill="#6d28d9">E = 6 V</text>
<text x="120" y="124" text-anchor="middle" font-size="9" fill="#6b7280">R 增大 → U 增大，趋近 E</text>
</svg>
</div>
<div class="qac">
<p class="q">电源效率怎么算？</p>
<p class="a"><b>η = U/E = R/(R+r)，R 越大效率越高。</b>R = 2 Ω、r = 1 Ω 时 η = 4/6 ≈ 67%；只有 r = 0 才可能到 100%。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="电源效率是路端电压占电动势的比例">
<rect x="40" y="46" width="160" height="22" rx="4" fill="#eef0f3"/>
<rect x="40" y="46" width="107" height="22" rx="4" fill="#7c3aed"/>
<g font-size="9.5"><text x="52" y="61" fill="#fff">U = 4 V</text><text x="154" y="61" fill="#6b7280">Ir = 2 V</text></g>
<text x="120" y="90" text-anchor="middle" font-size="10" fill="#6d28d9">η = U/E = R/(R+r)</text>
<text x="120" y="114" text-anchor="middle" font-size="9" fill="#6b7280">R = 2 Ω 时 η ≈ 67%</text>
</svg>
</div>
<div class="qac">
<p class="q">U–I 图像怎么读？</p>
<p class="a"><b>纵截距是 E，斜率绝对值是 r。</b>图像是直线 U = E − Ir，向右下倾斜；给两点坐标就能联立求 E 和 r。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="U-I 图像的纵截距与横截距">
<path d="M44 104 H204 M44 104 V26" fill="none" stroke="#5a6472" stroke-width="1.2"/>
<path d="M44 34 L196 104" stroke="#7c3aed" stroke-width="2.2"/>
<circle cx="44" cy="34" r="3.4" fill="#fff" stroke="#6d28d9" stroke-width="2"/>
<text x="54" y="32" font-size="8.5" fill="#6d28d9">纵截距 E</text>
<text x="200" y="118" text-anchor="end" font-size="8.5" fill="#8a5c14">横截距 I短</text>
<text x="100" y="126" text-anchor="middle" font-size="9" fill="#6b7280">斜率绝对值 = r</text>
</svg>
</div>
</div>
<p class="gx-note">六问归成一条：<b>E 是电源给的，U 是外电路量到的，差额 Ir 花在内阻上</b>。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>六条易错，逐条改</h2>

<div class="er">
<p class="er-x">✗ 路端电压总是等于电动势，U = E 永远成立。</p>
<p class="er-v">✓ 只有断路（I = 0）时 U = E，一般情况 U = E − Ir。</p>
<p class="er-w">只要回路里有电流，内阻就分走 Ir；U 只在 I 为零这个极限上才追上 E。</p>
</div>
<div class="er">
<p class="er-x">✗ 电流 I = E/R，把外电阻代进去就行。</p>
<p class="er-v">✓ I = E/(R+r)，分母是总电阻。</p>
<p class="er-w">内阻和 R 串在同一条回路上、电流相同；漏掉 r，算出的 I 偏大。</p>
</div>
<div class="er">
<p class="er-x">✗ 忽略内阻没关系，r 取 0 结果一样。</p>
<p class="er-v">✓ r = 0 只是理想电源；真实电源 r ≠ 0，U 会随 R 变。</p>
<p class="er-w">r 取 0 就得到 U = E 处处成立，本节“U 随 R 变”的结论会整体消失。</p>
</div>
<div class="er">
<p class="er-x">✗ 短路时外电路断开，电流应该是 0。</p>
<p class="er-v">✓ 短路是 R = 0，I短 = E/r 最大；电流为 0 的是断路。</p>
<p class="er-w">短路与断路是两头：短路电流最大、U = 0；断路电流为零、U → E。</p>
</div>
<div class="er">
<p class="er-x">✗ 电流越大，路端电压越大。</p>
<p class="er-v">✓ U = E − Ir，电流越大 U 越小。</p>
<p class="er-w">U–I 图像向右下倾斜，就是因为 Ir 这一项随 I 增大而变大。</p>
</div>
<div class="er">
<p class="er-x">✗ 电源效率能做到 100%。</p>
<p class="er-v">✓ η = U/E = R/(R+r)，只有 r = 0 才是 100%。</p>
<p class="er-w">真实电池总有内阻，R 越大效率越高，但永远达不到 100%。</p>
</div>

<p class="gx-note">把“E 是给的、Ir 是内耗、U 才是拿到的”背成一句话，U–I 图像和效率题就都通了。</p>
</section>

<script>
document.addEventListener("DOMContentLoaded", function () {
  var $ = GX.$;
  var E = 6, r = 1, IMAX = 3;
  var R = 2;
  var stage = $("gxStage");

  function calc(Rx) {
    var I = E / (Rx + r);
    return { I: I, U: E - I * r };
  }

  function render() {
    var s = calc(R);
    $("gxRVal").textContent = "R = " + R + " Ω";
    $("gxI").textContent = "I = " + s.I.toFixed(2) + " A";
    $("gxU").textContent = "U = " + s.U.toFixed(2) + " V";
    $("gxBarI").setAttribute("width", (110 * s.I / IMAX).toFixed(1));
    $("gxBarU").setAttribute("width", (110 * s.U / E).toFixed(1));
    $("gxUin").textContent = "U内 = Ir = " + (s.I * r).toFixed(2) + " V";
    $("gxUout").textContent = "U外 = IR = " + (s.I * R).toFixed(2) + " V";
    $("gxRv").textContent = R + " Ω";
    $("gxIv").textContent = s.I.toFixed(2) + " A";
    $("gxUv").textContent = s.U.toFixed(2) + " V";
    $("gxStateNote").textContent = "状态：R = " + R + " Ω 时 I = " + s.I.toFixed(2) +
      " A、U = " + s.U.toFixed(2) + " V；R 增大，U 增大。";
  }

  function setMode(m) {
    var b = $("gxAp"), t = $("gxApTxt");
    if (!b) return;
    b.classList.toggle("is-auto", m === "auto");
    b.classList.toggle("is-manual", m !== "auto");
    if (t) t.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  render();
  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 1 }, { t: 2, v: 1 }, { t: 3.5, v: 2 }, { t: 6, v: 2 },
           { t: 7.5, v: 5 }, { t: 9.5, v: 5 }, { t: 11, v: 10 }, { t: 13, v: 10 },
           { t: 14.5, v: 1 }],
    keys: [1, 2, 5, 10],
    value: R, min: 1, max: 10, step: 1,
    idle: 5000,
    onChange: function (v) { R = Math.round(v); render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc };
});
</script>
