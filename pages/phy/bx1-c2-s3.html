<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">三条：位移公式、面积等于位移、匀变速的平均速度。后两条是第一条的理由。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 位移与时间的关系式<span class="q-src">人教版必修第一册 · 第二章第 3 节</span></p>
<p class="q-b">x = v₀t + ½at²</p>
<p class="q-n">→ 拆成两块看：<b>v₀t</b> 是「如果一直按初速度走会走多远」（矩形），
<b>½at²</b> 是「加速额外多走的那一块」（三角形）。a 要<b>带符号</b>代：减速时它让位移变小，
若减到反向，x 甚至会变小（位移可以为负）。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 用图像求位移<span class="q-src">人教版必修第一册 · 第二章第 3 节</span></p>
<p class="q-b">v–t 图线与时间轴围成的面积表示位移。</p>
<p class="q-n">→ 为什么？把时间切成很多小段，每一小段里速度几乎不变，位移 ≈ v·Δt，就是那一小条矩形的面积；
把所有小矩形加起来，正好铺满图线下面的区域。匀变速时这块区域是<b>梯形</b>：
面积 = (v₀ + v)t / 2，和 x = v₀t + ½at² 是同一件事。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 匀变速直线运动的平均速度<span class="q-src">人教版必修第一册 · 第二章第 3 节</span></p>
<p class="q-b">在匀变速直线运动中，某段时间内的平均速度等于这段时间初、末速度的算术平均值，即 v̄ = (v₀ + v)/2。</p>
<p class="q-n">→ 这条只对<b>匀变速</b>成立：速度随时间均匀变化，「中间时刻的速度」恰好等于首末速度的平均。
对非匀变速（比如先快后慢），这个公式会算错。</p>
</div>

<p class="gx-note">三句话是一件事的三种说法：<b>公式</b>是代数、<b>面积</b>是几何、<b>平均速度</b>是平均。
考试时挑最省事的那条：给 v₀、a、t 用公式；给 v–t 图用面积；给首末速度用平均速度。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">同一道题两条路：先算 a 再代公式，或者直接用平均速度。两条都要会，用来互相验算。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 匀加速的加速度与位移<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">一辆汽车在平直公路上做匀加速直线运动，速度从 5 m/s 增加到 13 m/s 用时 4 s。<br>
（1）求汽车的加速度；（2）求这 4 s 内的位移（用两种方法）。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 规定正方向，把已知量写整齐</p>
<p class="s-b">取汽车运动方向为正方向：v₀ = 5 m/s，v = 13 m/s，t = 4 s。
速度在增大，说明 a 与 v 同向，a 应为正。</p>
<p class="s-k">用到：匀变速的已知量只有 v₀、v、a、t、x 五个，任给三个可求另外两个。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 由速度公式求 a</p>
<p class="s-b">由 v = v₀ + at 得 a = (v − v₀)/t = (13 − 5)/4 = <b>2 m/s²</b>。
正号表示与运动方向相同，确实在加速。</p>
<p class="s-k">用到：a = Δv/Δt，即 v–t 图的斜率。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 方法一：代位移公式</p>
<p class="s-b">x = v₀t + ½at² = 5 × 4 + ½ × 2 × 4² = 20 + 16 = <b>36 m</b>。
注意 ½at² 这一项是 16 m，正是「加速多走的距离」。</p>
<p class="s-k">用到：x = v₀t + ½at²，a 与 v₀ 同号时两项相加。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 方法二：用平均速度验算</p>
<p class="s-b">匀变速的平均速度 v̄ = (v₀ + v)/2 = (5 + 13)/2 = 9 m/s，
于是 x = v̄t = 9 × 4 = <b>36 m</b>，与方法一一致。
几何上这就是梯形面积：(5 + 13)/2 × 4 = 36。</p>
<p class="s-k">用到：v̄ = (v₀ + v)/2 只对匀变速成立。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口：答题卡上怎么摆</p>
<p class="s-b">（1）a = 2 m/s²，方向与运动方向相同；（2）x = 36 m。两问都要写单位。
若再追问「第 4 s 内的位移」，就先算前 3 s：x₃ = 5×3 + ½×2×3² = 15 + 9 = 24 m，
于是第 4 s 内位移 = 36 − 24 = 12 m。注意是「第 4 s 内」，不是「4 s 内」。</p>
<p class="s-k">用到：分段位移相减求「第 n 秒内」的位移。</p>
</li>
</ol>
<div class="exbar">
  <button id="gxNext" type="button">下一步</button>
  <span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">取运动方向为正方向，v₀ = 5 m/s，v = 13 m/s，t = 4 s。<br>
（1）a = (v − v₀)/t = (13 − 5)/4 = <b>2 m/s²</b>，方向与运动方向相同。<br>
（2）方法一：x = v₀t + ½at² = 5 × 4 + ½ × 2 × 4² = <b>36 m</b>；<br>
方法二：v̄ = (v₀ + v)/2 = 9 m/s，x = v̄t = 9 × 4 = <b>36 m</b>，两种方法结果一致。</p>
</div>
<p class="gx-note">第 5 步里那个「第 4 s 内」是高频追问：x₃ = 5×3 + ½×2×3² = 15 + 9 = 24 m，
所以第 4 s 内的位移是 36 − 24 = <b>12 m</b>，不是 36 m。<b>「几秒内」和「第几秒内」差一整段时间。</b></p>
</div>
</section>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>考你会怎么考</h2>
<p class="gx-h2s">六种问法，考的是「面积、公式、平均速度」三者能不能随时互相翻译。</p>

<div class="gx-qa">
<div class="qac">
<p class="q">x = v₀t + ½at² 里的 a 要带符号吗？</p>
<p class="a"><b>要。</b>减速时 a 代负值，½at² 这一项会把位移「扣掉」一部分；不代符号，位移一定算大。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="减速时a代负值，位移公式第二项为负">
  <rect x="22" y="14" width="196" height="30" rx="6" fill="#f5f3ff" stroke="#d8ccfb"/>
  <text x="120" y="34" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">x = v₀t + ½at²</text>
  <text x="120" y="62" text-anchor="middle" font-size="10" fill="#b8402f">减速时 a 代负值，第二项把位移扣掉一块</text>
  <line x1="30" y1="104" x2="150" y2="104" stroke="#5a6472"/>
  <line x1="30" y1="104" x2="30" y2="76" stroke="#5a6472"/>
  <line x1="30" y1="80" x2="144" y2="102" stroke="#b8402f" stroke-width="2.4"/>
  <text x="158" y="100" font-size="9.5" fill="#6b7280">v 一直减小</text>
</svg>
</div>
<div class="qac">
<p class="q">平均速度 (v₀ + v)/2 什么时候能用？</p>
<p class="a"><b>只在匀变速直线运动时。</b>速度随时间均匀变化，中间时刻的速度才等于首末平均；速度变化不均匀就不能用。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="匀变速可用平均速度公式，非匀变速不可用">
  <text x="66" y="22" text-anchor="middle" font-size="9.5" fill="#2f8a5b">✓ 匀变速</text>
  <line x1="24" y1="96" x2="112" y2="96" stroke="#5a6472"/>
  <line x1="24" y1="96" x2="24" y2="32" stroke="#5a6472"/>
  <line x1="24" y1="88" x2="104" y2="44" stroke="#2f8a5b" stroke-width="2.4"/>
  <text x="66" y="116" text-anchor="middle" font-size="9" fill="#1e6640">直线：可用</text>
  <text x="180" y="22" text-anchor="middle" font-size="9.5" fill="#b8402f">✗ 非匀变速</text>
  <line x1="132" y1="96" x2="220" y2="96" stroke="#5a6472"/>
  <line x1="132" y1="96" x2="132" y2="32" stroke="#5a6472"/>
  <path d="M132 90 Q166 40 216 62" fill="none" stroke="#b8402f" stroke-width="2.4"/>
  <text x="180" y="116" text-anchor="middle" font-size="9" fill="#b8402f">曲线：不可用</text>
</svg>
</div>
<div class="qac">
<p class="q">为什么 v–t 图线与 t 轴围成的面积等于位移？</p>
<p class="a"><b>把时间切成很多小段</b>，每段内速度几乎不变，位移 ≈ v·Δt，正好是一条细矩形；所有细矩形拼起来就是整块面积。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="把面积切成细矩形求和得到位移">
  <line x1="24" y1="104" x2="220" y2="104" stroke="#5a6472"/>
  <line x1="24" y1="104" x2="24" y2="28" stroke="#5a6472"/>
  <line x1="24" y1="84" x2="200" y2="44" stroke="#7c3aed" stroke-width="2.2"/>
  <g fill="#7c3aed" opacity=".22">
    <rect x="24" y="84" width="22" height="20"/><rect x="46" y="80" width="22" height="24"/>
    <rect x="68" y="76" width="22" height="28"/><rect x="90" y="72" width="22" height="32"/>
    <rect x="112" y="68" width="22" height="36"/><rect x="134" y="64" width="22" height="40"/>
    <rect x="156" y="60" width="22" height="44"/><rect x="178" y="56" width="22" height="48"/>
  </g>
  <text x="120" y="124" text-anchor="middle" font-size="9.5" fill="#6b7280">v·Δt 的小矩形，加起来 = 面积</text>
</svg>
</div>
<div class="qac">
<p class="q">面积在 t 轴下方怎么算？</p>
<p class="a"><b>算负位移。</b>问位移就把正负面积相加；问路程就把每块面积取绝对值再加。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="t轴下方面积为负，位移与路程不同">
  <line x1="24" y1="62" x2="216" y2="62" stroke="#5a6472"/>
  <line x1="24" y1="26" x2="24" y2="104" stroke="#5a6472"/>
  <polygon points="24,62 24,34 110,62" fill="#2f8a5b" opacity=".3"/>
  <polygon points="110,62 110,90 196,62" fill="#b8402f" opacity=".28"/>
  <line x1="24" y1="34" x2="196" y2="90" stroke="#7c3aed" stroke-width="2.2"/>
  <text x="62" y="58" font-size="9" fill="#1e6640" class="halo">+S</text>
  <text x="152" y="82" font-size="9" fill="#b8402f" class="halo">−S</text>
  <text x="120" y="122" text-anchor="middle" font-size="9.5" fill="#6b7280">位移 = 0，路程 = 2S</text>
</svg>
</div>
<div class="qac">
<p class="q">x–t 图的切线斜率表示什么？</p>
<p class="a"><b>瞬时速度。</b>切线越陡，那一瞬间速度越大；要加速度得去 v–t 图看斜率。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="x-t图切线斜率为瞬时速度">
  <line x1="24" y1="104" x2="216" y2="104" stroke="#5a6472"/>
  <line x1="24" y1="104" x2="24" y2="26" stroke="#5a6472"/>
  <path d="M24 100 Q100 86 204 36" fill="none" stroke="#2f8a5b" stroke-width="2.4"/>
  <line x1="70" y1="90" x2="170" y2="56" stroke="#b8791f" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="120" cy="73" r="4.5" fill="#fff" stroke="#b8791f" stroke-width="2.2"/>
  <text x="120" y="122" text-anchor="middle" font-size="9.5" fill="#8a5c14">切线斜率 = v</text>
</svg>
</div>
<div class="qac">
<p class="q">初速度为 0 时，公式变成什么？</p>
<p class="a"><b>x = ½at²、v = at、v² = 2ax。</b>三式同源，都是 v₀ = 0 时的特例，自由落体就是这套。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="初速度为零时面积是三角形">
  <line x1="26" y1="102" x2="216" y2="102" stroke="#5a6472"/>
  <line x1="26" y1="102" x2="26" y2="28" stroke="#5a6472"/>
  <polygon points="26,102 200,40 200,102" fill="#7c3aed" opacity=".18"/>
  <line x1="26" y1="102" x2="200" y2="40" stroke="#7c3aed" stroke-width="2.4"/>
  <text x="130" y="86" text-anchor="middle" font-size="10" fill="#6d28d9">面积 = ½ · t · v</text>
  <text x="120" y="122" text-anchor="middle" font-size="9.5" fill="#6b7280">v₀ = 0 → 梯形退化成三角形</text>
</svg>
</div>
</div>
<p class="gx-note">这六问其实是同一件事：<b>v–t 图的面积就是位移</b>。公式是面积的代数写法，
平均速度是面积的另一种算法；只要面积对了，三个答案不会打架。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是考场高频错句，右边是能得分的表述。位移这一节，错得最多的是「拿匀速公式套变速」。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 位移就用 x = vt，速度取末速度。</p>
<p class="er-v">✓ 变速运动要用 x = v₀t + ½at² 或 x = v̄t（v̄ = (v₀ + v)/2）。</p>
<p class="er-w">用末速度乘时间，等于假设全程都以最快的速度跑，位移一定算大。</p>
</div>
<div class="er">
<p class="er-x">✗ 减速时 a 取大小 2 代进去，反正位移是正的。</p>
<p class="er-v">✓ 规定正方向后，减速的 a 代负值：x = v₀t − ½|a|t²。</p>
<p class="er-w">不代符号，½at² 会把位移加上去；减到反向时，位移的正负也会判错。</p>
</div>
<div class="er">
<p class="er-x">✗ 任何运动都能用 v̄ = (v₀ + v)/2。</p>
<p class="er-v">✓ 这条只对匀变速直线运动成立。</p>
<p class="er-w">速度变化不均匀时，「首末平均」不等于真实平均，用它算位移会偏大或偏小。</p>
</div>
<div class="er">
<p class="er-x">✗ v–t 图的面积就是路程。</p>
<p class="er-v">✓ 面积是位移；t 轴下方的面积算负，求路程要取绝对值再相加。</p>
<p class="er-w">往返运动时位移可以比路程小得多，甚至为 0（图 3 就是 0 对 9 m）。</p>
</div>
<div class="er">
<p class="er-x">✗ x–t 图越陡，加速度越大。</p>
<p class="er-v">✓ x–t 图的斜率是瞬时速度；加速度要看 v–t 图的斜率。</p>
<p class="er-w">两张图的纵轴不同，斜率的含义就不同，这是本章最常见的「看图串台」。</p>
</div>
<div class="er">
<p class="er-x">✗ 题目给 km/h，直接代进公式，最后位移单位写 m。</p>
<p class="er-v">✓ 先换成 m/s（÷3.6），再代公式，位移才是 m。</p>
<p class="er-w">36 km/h = 10 m/s；不换算，算出的位移会大 3.6 倍，量纲还对不上。</p>
</div>
</div>
</section>

<p class="gx-note" style="border-top:1px solid var(--line);padding-top:14px">下一节把 v₀ = 0、a = g 代进这两个公式，就得到<b>自由落体运动</b>：
v = gt、h = ½gt²。匀变速这一套，会在那里第一次派上大用场。</p>

      sn = "v = 4 m/s，位移还没产生";
    } else {
      st = "面积 = 位移"; col = "#6d28d9"; bg = "#f5f3ff";
      sn = "梯形 (4 + " + v.toFixed(1) + ")/2 × " + t.toFixed(1) + " = " + x.toFixed(1) + " m";
    }
    return { v: v, x: x, st: st, col: col, bg: bg, sn: sn };
  }

  function render() {
    var s = calc(T);
    var x = px(T), yv = py(s.v);
    $("gxLine").setAttribute("x1", px(0));
    $("gxLine").setAttribute("y1", py(V0));
    $("gxLine").setAttribute("x2", px(TMAX));
    $("gxLine").setAttribute("y2", py(V0 + ACC * TMAX));
    $("gxArea").setAttribute("points",
      px(0) + "," + py(0) + " " + px(0) + "," + py(V0) + " " + x + "," + yv + " " + x + "," + py(0));
    $("gxNow").setAttribute("cx", x);
    $("gxNow").setAttribute("cy", yv);
    $("gxDrop").setAttribute("x1", x);
    $("gxDrop").setAttribute("x2", x);
    $("gxDrop").setAttribute("y1", py(0));
    $("gxDrop").setAttribute("y2", yv);
    $("gxVLab").setAttribute("x", x + 9);
    $("gxVLab").setAttribute("y", yv + 4);
    $("gxVLab").textContent = "v = " + s.v.toFixed(1);

    var lab = $("gxAreaLab");
    lab.setAttribute("x", (px(0) + x) / 2);
    lab.setAttribute("y", (py(0) + yv) / 2 + 12);
    lab.setAttribute("opacity", T < 0.8 ? "0" : "1");

    $("gxVa").textContent = T.toFixed(1) + " s";
    $("gxVb").textContent = s.v.toFixed(1) + " m/s";
    $("gxVc").textContent = s.x.toFixed(1) + " m";
    $("gxVc").style.color = s.col;
    $("gxVcn").textContent = s.sn;
    $("gxStBox").style.background = s.bg;
    $("gxStBox").style.borderColor = s.col + "44";
  }

  var ap = null, dragging = false, moved = false, downX = 0, suppressTap = false;

  function xToT(clientX) {
    var r = stage.getBoundingClientRect();
    var f = (clientX - r.left) / r.width;
    return Math.max(0, Math.min(5, Math.round(f * 5 * 10) / 10));
  }

  stage.addEventListener("pointerdown", function (ev) {
    dragging = true; moved = false; downX = ev.clientX;
    if (ap) ap.take();
    T = xToT(ev.clientX);
    if (ap) ap.setValue(T, false);
    render();
    try { stage.setPointerCapture(ev.pointerId); } catch (e) {}
  });
  stage.addEventListener("pointermove", function (ev) {
    if (!dragging) return;
    if (Math.abs(ev.clientX - downX) > 4) moved = true;
    T = xToT(ev.clientX);
    if (ap) ap.setValue(T, false);
    render();
  });
  stage.addEventListener("pointerup", function () {
    if (moved) suppressTap = true;
    dragging = false;
  });
  stage.addEventListener("click", function (ev) {
    if (!suppressTap) return;
    suppressTap = false;
    ev.stopImmediatePropagation();
  });

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  render();
  ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 0 }, { t: 2, v: 1.5 }, { t: 4, v: 3 }, { t: 6, v: 3 },
           { t: 8, v: 5 }, { t: 10.5, v: 0 }],
    keys: [3, 1.5, 5, 0],
    value: T, min: 0, max: 5, step: 0.1,
    idle: 5000,
    onChange: function (v) { T = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc };

  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    $("gxSl").addEventListener("input", function () {
      T = Math.max(0, Math.min(5, +this.value));
      render();
    });
  }
});
</script>
</body>
</html>
