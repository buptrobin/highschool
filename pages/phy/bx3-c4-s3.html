<script type="text/markdown" id="md"><div class="gx"><div class="gx-kicker">ELI5-HIGH · 讲给要考试的人</div><p class="gx-claim">这一节只干一件事：把电池的<b>电动势 E</b>和<b>内阻 r</b>，从一条<b>U–I 直线</b>里读出来。</p><nav class="gx-toc"><a href="#a">① 课本怎么说</a><a href="#b">② 拆开看</a><a href="#c">③ 自己拖一下</a><a href="#d">④ 一道题走一遍</a><a href="#e">⑤ 会怎么考</a><a href="#f">⑥ 易错清单</a></nav>

<section class="gx-sec" id="a"><h2><span class="sn">01</span>课本怎么说</h2><p class="gx-h2s">三条：怎么测、读什么、误差在哪。<span class="q-src">人教版必修第三册 · 第十二章第3节</span></p><div class="gx-quote"><p class="q-t">课本表述 · 伏安法测 E、r</p><p class="q-b">由 E = U + Ir，改变外电阻测多组 U 和 I，就能求出电动势和内阻。</p><p class="q-n">→ 人话：R 每改一次记一组 (I, U)。</p></div><div class="gx-quote"><p class="q-t">课本表述 · U–I 图像</p><p class="q-b">U = E − Ir 是直线：纵截距为 E，斜率绝对值为 r。</p><p class="q-n">→ 人话：碰 U 轴的高度是 E，多陡是 r。</p></div><div class="gx-quote"><p class="q-t">课本表述 · 电流表外接的误差</p><p class="q-b">电流表外接时电压表分流，I 测偏小，E 和 r 的测量值都偏小。</p><p class="q-n">→ 人话：电压表偷分电流，线整体偏低偏平。</p></div></section>

<section class="gx-sec" id="b"><h2><span class="sn">02</span>拆开看</h2><p class="gx-h2s">三张图：怎么接、怎么读、误差从哪来。</p><figure class="gx-fig"><div class="fig-cap"><span class="fig-no">图 1</span><span class="fig-t">伏安法测 E、r 的电路</span><span class="bdg bdg-must">必考</span></div><p class="fig-s">电压表并在电源两端量<b>路端电压 U</b>；电流表串在外电路量<b>干路电流 I</b>。</p><p class="fig-s">R 每改一次多一组 (I, U)；先按<b>理想电表</b>算。</p><div class="gx-svgbox"><svg viewBox="0 0 900 300" role="img" aria-label="伏安法测电源电动势和内阻：电压表并在电源两端，电流表串在外电路"><g fill="none" stroke="#3a3a35" stroke-width="2"><path d="M170 96H382M418 96H700M700 96V150M700 200V236M700 236H470M420 236H170M170 236V161M170 145V96"/></g><line x1="148" y1="145" x2="192" y2="145" stroke="#7c3aed" stroke-width="3"/><line x1="158" y1="161" x2="182" y2="161" stroke="#7c3aed" stroke-width="5"/><text x="202" y="154" font-size="12" font-weight="700" fill="#5b21b6">E、r</text><circle cx="400" cy="96" r="19" fill="#fff" stroke="#2f6fd0" stroke-width="2"/><text x="400" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#2f6fd0">A</text><rect x="684" y="150" width="32" height="50" rx="3" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/><text x="726" y="182" font-size="12" font-weight="700" fill="#6d28d9">R</text><line x1="420" y1="236" x2="462" y2="214" stroke="#3a3a35" stroke-width="2.2"/><circle cx="420" cy="236" r="3.5" fill="#3a3a35"/><circle cx="470" cy="236" r="3.5" fill="#3a3a35"/><g fill="none" stroke="#2f8a5b" stroke-width="2"><path d="M170 110H96V130M96 166V210H170"/></g><circle cx="96" cy="148" r="18" fill="#fff" stroke="#2f8a5b" stroke-width="2"/><text x="96" y="154" text-anchor="middle" font-size="13" font-weight="700" fill="#1e6640">V</text><circle cx="170" cy="110" r="3" fill="#3a3a35"/><circle cx="170" cy="210" r="3" fill="#3a3a35"/></svg><span class="gx-zoomchip"></span></div><p class="gx-take"><b>接法口诀</b>：V 跨电源、A 串干路、R 铺点。</p></figure><figure class="gx-fig"><div class="fig-cap"><span class="fig-no">图 2</span><span class="fig-t">U–I 图像：截距是 E，斜率是 −r</span><span class="bdg bdg-must">必考</span></div><p class="fig-s">I = 0 时 U = E，所以<b>纵截距 = 电动势</b>。</p><p class="fig-s"><b>斜率绝对值 = r</b>；U = 0 对应的电流是短路电流。</p><div class="gx-svgbox"><svg viewBox="0 0 900 300" role="img" aria-label="U-I图像：纵截距电动势1.5伏，斜率绝对值内阻0.5欧，短路电流3安"><line x1="110" y1="66" x2="110" y2="240" stroke="#3a3a35" stroke-width="1.6"/><line x1="110" y1="240" x2="782" y2="240" stroke="#3a3a35" stroke-width="1.6"/><text x="96" y="58" text-anchor="end" font-size="11" fill="#5a6472">U/V</text><text x="792" y="256" font-size="11" fill="#5a6472">I/A</text><line x1="110" y1="81" x2="650" y2="240" stroke="#7c3aed" stroke-width="2.6"/><line x1="110" y1="81" x2="200" y2="81" stroke="#b8c2cc" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="200" y1="81" x2="200" y2="107.5" stroke="#b8c2cc" stroke-width="1.2" stroke-dasharray="5 4"/><circle cx="200" cy="107.5" r="4.5" fill="#7c3aed"/><circle cx="110" cy="81" r="4.5" fill="#7c3aed"/><circle cx="650" cy="240" r="4.5" fill="#b8402f"/><text x="100" y="78" text-anchor="end" font-size="12" font-weight="700" fill="#5b21b6">E = 1.5 V</text><text x="150" y="214" font-size="12.5" font-weight="700" fill="#6d28d9">r = ΔU/ΔI = 0.5 Ω</text><text x="650" y="266" text-anchor="middle" font-size="11" fill="#8f3226">短路电流 I短 = E/r = 3 A</text></svg><span class="gx-zoomchip"></span></div><p class="gx-take"><b>读图两步</b>：先看截距（E），再算 ΔU/ΔI（r）。</p></figure><figure class="gx-fig"><div class="fig-cap"><span class="fig-no">图 3</span><span class="fig-t">误差：电压表一分流，线就偏低偏平</span><span class="bdg bdg-warn">易错</span></div><p class="fig-s">电压表分走的 <b>U/R_V</b> 不进电流表，所以 I 测偏小。</p><p class="fig-s">线<b>纵截距更低、也更平</b>：E测 &lt; E、r测 &lt; r。</p><div class="gx-svgbox"><svg viewBox="0 0 900 300" role="img" aria-label="误差分析：测量线比真实线偏低偏平"><line x1="90" y1="70" x2="90" y2="240" stroke="#3a3a35" stroke-width="1.5"/><line x1="90" y1="240" x2="470" y2="240" stroke="#3a3a35" stroke-width="1.5"/><line x1="90" y1="84" x2="420" y2="240" stroke="#7c3aed" stroke-width="2.4"/><line x1="90" y1="100" x2="420" y2="231" stroke="#b8791f" stroke-width="2.4" stroke-dasharray="7 5"/><circle cx="90" cy="84" r="4" fill="#7c3aed"/><circle cx="90" cy="100" r="4" fill="#b8791f"/><text x="96" y="80" font-size="10.5" font-weight="700" fill="#5b21b6">真实 E</text><text x="96" y="118" font-size="10.5" font-weight="700" fill="#8a5c14">测量 E′</text><text x="520" y="96" font-size="12" font-weight="700" fill="#3a3a35">① 电压表分流：I测 = I真 − U/R_V</text><text x="520" y="136" font-size="12" font-weight="700" fill="#3a3a35">② 结果：E测 &lt; E、r测 &lt; r</text><text x="520" y="176" font-size="12" font-weight="700" fill="#3a3a35">③ 内阻越小，相对误差越明显</text></svg><span class="gx-zoomchip"></span></div><p class="gx-take"><b>一句话</b>：画图压不掉电压表分流带来的系统误差。</p></figure></section>

<section class="gx-sec" id="c"><h2><span class="sn">03</span>自己拖一下<span class="bdg bdg-must">核心</span></h2><p class="gx-h2s">E = 1.5 V、r = 0.5 Ω；拖 I，看 U 和 P 怎么变。</p><figure class="gx-fig"><div class="fig-cap"><span class="fig-no">互动 1</span><span class="fig-t">I 变，U 和 P 一起变</span><span class="gx-ap" id="gxAp"><i></i><span id="gxApTxt">自动演示中</span></span></div><p class="fig-s">改外电阻，<b>I 从 0 增到 1.0 A</b>，U 沿直线下滑。</p><p class="fig-s">U = <b>E − Ir</b>、P = <b>UI</b>；I = 0.5 A 时 U = 1.25 V、P = 0.625 W。</p><div class="gx-board"><svg id="gxStage" class="gx-graph" viewBox="0 0 360 260" tabindex="0" role="application" aria-label="电池U-I互动：拖I看U和P"><text x="180" y="17" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3a3a35">电池的 U–I 直线：I 越大，U 越低</text><line x1="64" y1="52" x2="64" y2="204" stroke="#8e97a4" stroke-width="1.6"/><line x1="64" y1="204" x2="304" y2="204" stroke="#8e97a4" stroke-width="1.6"/><text x="54" y="44" text-anchor="end" font-size="8.5" fill="#5a6472">U/V</text><text x="304" y="218" font-size="8.5" fill="#5a6472">I/A</text><line x1="64" y1="54" x2="280" y2="114" stroke="#7c3aed" stroke-width="2.4"/><circle cx="64" cy="54" r="3.5" fill="#7c3aed"/><line id="gxDrop" x1="64" y1="54" x2="64" y2="204" stroke="#b8791f" stroke-width="1" stroke-dasharray="3 3"/><line id="gxFlat" x1="64" y1="54" x2="64" y2="54" stroke="#b8791f" stroke-width="1" stroke-dasharray="3 3"/><circle id="gxPt" cx="64" cy="54" r="5.5" fill="#b8791f" stroke="#fff" stroke-width="1.4"/><text x="154" y="220" text-anchor="middle" font-size="8" fill="#8e97a4">0.5</text><text x="244" y="220" text-anchor="middle" font-size="8" fill="#8e97a4">1.0</text><text id="gxHint" x="180" y="240" text-anchor="middle" font-size="8.5" fill="#8a5c14">I 增大，U 减小</text></svg><div class="bar"><span class="lb">电流 I</span><input type="range" id="gxSl" min="0" max="1" step="0.01" value="0" aria-label="电流 I（A）"></div></div><div class="stats"><div class="st"><div class="k">① 电流 I</div><div class="v" id="gxVa">0.00 A</div></div><div class="st"><div class="k">② 路端电压 U</div><div class="v" id="gxVb">1.50 V</div></div><div class="st"><div class="k">③ 输出功率 P</div><div class="v" id="gxVc">0.000 W</div></div></div><p class="gx-take"><b>关键帧</b>：I = 0.5 A 时 U = 1.25 V、P = 0.625 W。</p></figure></section>

<section class="gx-sec" id="d"><h2><span class="sn">04</span>一道题走一遍</h2><p class="gx-h2s">先自己写，再点「下一步」。考「由图像求 E、r，再回代算 U」。</p><div class="gx-ex"><p class="ex-t"><span class="bdg bdg-must">例题</span>伏安法测一节干电池的电动势和内阻</p><p class="ex-q">测得多组 U、I，U–I 图像与纵轴交于 1.5 V，且过点（0.2 A，1.4 V）与（0.5 A，1.25 V）。求 I = 0.5 A、0.2 A 时的 U，以及 E、r。</p><ol class="steps" id="gxSteps"><li class="step"><p class="s-h">第 1 步 · 认清两个表</p><p class="s-b">电压表量<b>路端电压 U</b>，电流表量<b>总电流 I</b>，U = E − Ir 直接可用。</p></li><li class="step" hidden><p class="s-h">第 2 步 · 从纵截距读 E</p><p class="s-b">I = 0 时 U = E；图像与纵轴交于 1.5 V，所以 <b>E = 1.5 V</b>。</p></li><li class="step" hidden><p class="s-h">第 3 步 · 用两点求 r</p><p class="s-b">r = |ΔU/ΔI| = (1.4 − 1.25) / (0.5 − 0.2) = 0.15 / 0.3 = <b>0.5 Ω</b>。</p></li><li class="step" hidden><p class="s-h">第 4 步 · 回代两个电流</p><p class="s-b">I = 0.5 A：U = 1.5 − 0.25 = <b>1.25 V</b>；I = 0.2 A：U = 1.5 − 0.1 = <b>1.4 V</b>。</p></li><li class="step" hidden><p class="s-h">第 5 步 · 顺手求短路电流</p><p class="s-b">U = 0 时 I短 = E/r = <b>3 A</b>；横轴只到 1.0 A，别把图末端当短路点。</p></li></ol><div class="exbar"><button id="gxNext" type="button">下一步</button><span class="cnt" id="gxCnt">1 / 5</span></div><div class="ans" id="gxAns" hidden><p class="ans-t">标准答案（可抄进答题卡）</p><p class="ans-b">截距 <b>E = 1.5 V</b>、斜率绝对值 <b>r = 0.5 Ω</b>；代回 U = E − Ir 得 I = 0.5 A 时 <b>U = 1.25 V</b>、I = 0.2 A 时 <b>U = 1.4 V</b>，I短 = 3 A。</p></div></div></section>

<section class="gx-sec" id="e"><h2><span class="sn">05</span>考你会怎么考</h2><p class="gx-h2s">六种问法，一半在问「截距是谁、斜率是谁」。</p><div class="gx-qa"><div class="qac"><p class="q">U–I 图像与纵轴的交点表示什么？</p><p class="a"><b>电动势 E。</b>I = 0 时 U = E，所以纵截距就是 1.5 V。</p><svg viewBox="0 0 240 132" role="img" aria-label="纵截距是电动势"><line x1="34" y1="104" x2="210" y2="104" stroke="#3a3a35" stroke-width="1.4"/><line x1="34" y1="104" x2="34" y2="26" stroke="#3a3a35" stroke-width="1.4"/><line x1="34" y1="40" x2="190" y2="104" stroke="#7c3aed" stroke-width="2"/><circle cx="34" cy="40" r="4.5" fill="#7c3aed"/><text x="42" y="34" font-size="9" fill="#6d28d9">E</text></svg></div><div class="qac"><p class="q">图像的斜率为什么是负的？</p><p class="a"><b>U = E − Ir。</b>I 每增 1 A，U 减少 r；取绝对值才是内阻。</p><svg viewBox="0 0 240 132" role="img" aria-label="斜率绝对值是内阻"><line x1="34" y1="104" x2="210" y2="104" stroke="#3a3a35" stroke-width="1.4"/><line x1="34" y1="104" x2="34" y2="26" stroke="#3a3a35" stroke-width="1.4"/><line x1="34" y1="42" x2="190" y2="104" stroke="#7c3aed" stroke-width="2"/><text x="128" y="70" font-size="9" fill="#8a5c14">−r</text></svg></div><div class="qac"><p class="q">短路电流怎么求？</p><p class="a"><b>I短 = E/r。</b>U = 0 时 I = 1.5/0.5 = 3 A，是横轴交点。</p><svg viewBox="0 0 240 132" role="img" aria-label="横轴交点是短路电流"><line x1="30" y1="100" x2="216" y2="100" stroke="#3a3a35" stroke-width="1.4"/><line x1="30" y1="100" x2="30" y2="30" stroke="#3a3a35" stroke-width="1.4"/><line x1="30" y1="42" x2="196" y2="100" stroke="#7c3aed" stroke-width="2"/><circle cx="196" cy="100" r="4.5" fill="#b8402f"/><text x="120" y="122" text-anchor="middle" font-size="9" fill="#8f3226">I短 = 3 A</text></svg></div><div class="qac"><p class="q">电流表外接时，测出的 E、r 偏大还是偏小？</p><p class="a"><b>都偏小。</b>电压表分流让 I 测偏小，线偏低偏平。</p><svg viewBox="0 0 240 132" role="img" aria-label="测量线比真实线偏低偏平"><line x1="30" y1="104" x2="214" y2="104" stroke="#3a3a35" stroke-width="1.4"/><line x1="30" y1="104" x2="30" y2="28" stroke="#3a3a35" stroke-width="1.4"/><line x1="30" y1="40" x2="200" y2="104" stroke="#7c3aed" stroke-width="2"/><line x1="30" y1="52" x2="200" y2="99" stroke="#b8791f" stroke-width="2" stroke-dasharray="6 4"/><text x="205" y="46" font-size="9" fill="#6d28d9">真</text><text x="205" y="64" font-size="9" fill="#8a5c14">测</text></svg></div><div class="qac"><p class="q">电池用久了，U–I 线怎么变？</p><p class="a"><b>整体下移、更陡。</b>E 变小、r 变大，截距更低。</p><svg viewBox="0 0 240 132" role="img" aria-label="老化后直线下移更陡"><line x1="30" y1="104" x2="214" y2="104" stroke="#3a3a35" stroke-width="1.4"/><line x1="30" y1="104" x2="30" y2="28" stroke="#3a3a35" stroke-width="1.4"/><line x1="30" y1="40" x2="180" y2="104" stroke="#7c3aed" stroke-width="2"/><line x1="30" y1="56" x2="146" y2="104" stroke="#b8402f" stroke-width="2" stroke-dasharray="6 4"/><text x="184" y="52" font-size="9" fill="#6d28d9">新</text><text x="150" y="88" font-size="9" fill="#8f3226">旧</text></svg></div><div class="qac"><p class="q">电源效率怎么算？</p><p class="a"><b>η = U/E = R/(R+r)。</b>外电阻越大，U 占 E 的比例越高。</p><svg viewBox="0 0 240 132" role="img" aria-label="效率是路端电压与电动势之比"><rect x="54" y="42" width="46" height="64" rx="4" fill="#f5f3ff" stroke="#7c3aed"/><rect x="54" y="42" width="46" height="46" rx="4" fill="#7c3aed" opacity=".35"/><text x="77" y="120" text-anchor="middle" font-size="9" fill="#5b21b6">E</text><rect x="142" y="42" width="46" height="64" rx="4" fill="#fdf3e0" stroke="#b8791f"/><rect x="142" y="60" width="46" height="46" rx="4" fill="#e8a33d" opacity=".55"/><text x="165" y="120" text-anchor="middle" font-size="9" fill="#8a5c14">U</text></svg></div></div></section>

<section class="gx-sec" id="f"><h2><span class="sn">06</span>易错清单</h2><p class="gx-h2s">六个说法，全是把 E 和 r 的位置搞反了。</p><div class="gx-errs"><div class="er"><p class="er-x">纵截距是内阻 r。</p><p class="er-v"><b>错，纵截距是电动势 E。</b></p><p class="er-w">I = 0 时 U 就是 E。</p></div><div class="er"><p class="er-x">图像的斜率就是电动势 E。</p><p class="er-v"><b>错，斜率是 −r。</b></p><p class="er-w">E 看截距，r 看斜率绝对值。</p></div><div class="er"><p class="er-x">电流表外接时，E 和 r 的测量值都偏大。</p><p class="er-v"><b>错，都偏小。</b></p><p class="er-w">I 测偏小，截距和斜率都变小。</p></div><div class="er"><p class="er-x">短路电流为 0，所以图像不碰横轴。</p><p class="er-v"><b>错，I短 = E/r = 3 A。</b></p><p class="er-w">U = 0 时 I = E/r，交点常被画在图外。</p></div><div class="er"><p class="er-x">路端电压 U 随电流 I 增大而增大。</p><p class="er-v"><b>错，U = E − Ir，是减小。</b></p><p class="er-w">I 越大，内阻上分走的 Ir 越多。</p></div><div class="er"><p class="er-x">电池老化后，E 变大、r 变小。</p><p class="er-v"><b>错，E 变小、r 变大。</b></p><p class="er-w">图像整体下移、更陡，短路电流变小。</p></div></div></section>

<div class="gx-foot"><p>人教版《物理》必修第三册（2019年版）第十二章第3节</p></div></div><div class="gx-zoom" id="gxZoom" hidden><span class="gx-zoom-tip">双指放大看细节</span><button class="gx-zoom-x" type="button" aria-label="关闭">✕</button><div id="gxZoomInner"></div></div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  var $ = GX.$, E = 1.5, R = 0.5, I = 0;
  function render() {
    var U = E - I * R, P = U * I, px = (64 + 180 * I).toFixed(1), py = (204 - 100 * U).toFixed(1);
    $("gxPt").setAttribute("cx", px);
    $("gxPt").setAttribute("cy", py);
    $("gxDrop").setAttribute("x1", px);
    $("gxDrop").setAttribute("x2", px);
    $("gxDrop").setAttribute("y1", py);
    $("gxFlat").setAttribute("x2", px);
    $("gxFlat").setAttribute("y1", py);
    $("gxFlat").setAttribute("y2", py);
    $("gxVa").textContent = I.toFixed(2) + " A";
    $("gxVb").textContent = U.toFixed(2) + " V";
    $("gxVc").textContent = P.toFixed(3) + " W";
    $("gxHint").textContent = Math.abs(I - 0.5) < 0.015 ? "I = 0.50 A：关键帧，停 2.5 s，U = 1.25 V"
      : (I < 0.015 ? "I = 0：断路，U = E = 1.50 V" : (I > 0.985 ? "I = 1.00 A：U = 1.00 V，P = 1.000 W" : "I 增大，U 减小：U = E − Ir"));
  }
  var badge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!badge) return;
    badge.classList.toggle("is-auto", m === "auto");
    badge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }
  render();
  var ap = AutoPilot.create({
    mount: $("gxStage"), follow: $("gxSl"),
    loop: [{ t: 0, v: 0 }, { t: 1.2, v: 0 }, { t: 2.4, v: 0.2 }, { t: 3.4, v: 0.2 },
           { t: 4.6, v: 0.5 }, { t: 7.1, v: 0.5 }, { t: 8.4, v: 1.0 }, { t: 9.6, v: 1.0 },
           { t: 10.8, v: 0 }, { t: 12.0, v: 0 }],
    keys: [0, 0.2, 0.5, 1.0],
    value: I, min: 0, max: 1, step: 0.01, idle: 5000,
    onChange: function (v) { I = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;

  var step = 1;
  function paint() {
    var ls = $("gxSteps").children;
    for (var i = 0; i < ls.length; i++) ls[i].hidden = i >= step;
    $("gxCnt").textContent = step + " / 5";
    $("gxNext").textContent = step < 5 ? "下一步" : "看答案";
  }
  $("gxNext").addEventListener("click", function () {
    if (step < 5) { step++; paint(); return; }
    $("gxAns").hidden = false;
    this.textContent = "答案已显示";
    this.disabled = true;
  });
  paint();
});
</script>
