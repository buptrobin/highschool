<h2><span class="sn">01</span>先把话说明白<span class="bdg bdg-must">必背</span></h2>
<p class="gx-h2s">三条教材表述，每条配一句人话。</p>

<div class="gx-quote">
<p class="q-t">教材表述 ① 两条基本假设<span class="q-src">必修第二册 · 第七章</span></p>
<p class="q-b">相对性原理：不同的惯性参考系中物理规律的形式相同。光速不变原理：真空中的光速在不同惯性参考系中都相同。</p>
<p class="q-n"><b>人话：</b>火车上和站台上测光速都是 <b>c = 3.00×10⁸ m/s</b>，追光也不会变小；这条最反直觉，却是一切结论的源头。</p>
</div>

<div class="gx-quote">
<p class="q-t">教材表述 ② 时间延缓与长度收缩<span class="q-src">必修第二册 · 第七章</span></p>
<p class="q-b">Δt = Δt₀ / √(1 − v²/c²)，l = l₀ √(1 − v²/c²)；Δt₀、l₀ 为固有时间和长度。</p>
<p class="q-n"><b>人话：</b><b>γ = 1/√(1 − β²)</b>：时间乘 γ、长度除 γ；<b>固有时最短</b>。</p>
</div>

<div class="gx-quote">
<p class="q-t">教材表述 ③ 牛顿力学的局限性<span class="q-src">必修第二册 · 第七章</span></p>
<p class="q-b">牛顿力学只适用于低速、宏观物体，不适用于高速运动和微观世界。</p>
<p class="q-n"><b>人话：</b>它是相对论在 <b>v ≪ c</b> 时的近似：0.1c 修正仅 0.5%，0.99c 时 γ=7.09。</p>
</div>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>六个坑，逐条对答案</h2>
<p class="gx-h2s">✗ 是错误说法，✓ 是正确说法，末句说为什么错。</p>
<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 运动的钟坏了，所以走得慢。</p>
<p class="er-v">✓ 钟没坏，是不同惯性系测同一过程的时间不同。</p>
<p class="er-w"><b>为什么错：</b>固有时间是与物体同行的钟测得的<b>最短</b>时间。</p>
</div>
<div class="er">
<p class="er-x">✗ 长度收缩是物体被压扁了。</p>
<p class="er-v">✓ 是“同时测两端”在不同参考系中对应不同事件。</p>
<p class="er-w"><b>为什么错：</b>尺子没受力，垂直方向长度也不变。</p>
</div>
<div class="er">
<p class="er-x">✗ 相对论证明牛顿力学完全错了。</p>
<p class="er-v">✓ 牛顿力学是相对论在 v ≪ c 时的极限。</p>
<p class="er-w"><b>为什么错：</b>β = 0.01 时 γ − 1 ≈ 0.005%，工程上测不出。</p>
</div>
<div class="er">
<p class="er-x">✗ 推力足够大，总能达到光速。</p>
<p class="er-v">✓ 速度只能渐近 c，所需能量趋于无穷。</p>
<p class="er-w"><b>为什么错：</b>γ → ∞ 时惯性急剧增大。</p>
</div>
<div class="er">
<p class="er-x">✗ μ 子寿命 15.6 μs，说明固有寿命变长了。</p>
<p class="er-v">✓ 固有寿命仍是 2.2 μs，15.6 μs 是地面测得的。</p>
<p class="er-w"><b>为什么错：</b>固有寿命是原时，不随参考系改变。</p>
</div>
<div class="er">
<p class="er-x">✗ 相对论只跟宇宙学有关。</p>
<p class="er-v">✓ GPS 卫星每天要修正约 38 μs，否则定位每天偏约 10 km。</p>
<p class="er-w"><b>为什么错：</b>卫星的时间延缓与弱引力场效应都要算。</p>
</div>

<script>
window.addEventListener('DOMContentLoaded', function () {
  var $ = function (id) { return document.getElementById(id); };
  var MU = 2.2, sl = $('gxSl'), mark = $('gxMark'), lab = $('gxMarkLab');
  if (!sl || !window.AutoPilot) return;
  function gamma(b) { return 1 / Math.sqrt(1 - b * b); }
  function px(b) { return 44 + b * 296; }
  function py(g) { return 210 - Math.min(g, 8) * 20.75; }
  function set(id, s) { var n = $(id); if (n) n.textContent = s; }
  function render(v) {
    var b = Math.max(0, Math.min(0.99, +v)), g = gamma(b), dt = g * MU;
    set('gxVb2', b.toFixed(2)); set('gxVg2', g.toFixed(2));
    set('gxVdt2', dt.toFixed(1) + ' μs');
    set('gxFml', 'γ = 1/√(1−' + b.toFixed(2) + '²) = ' + g.toFixed(2));
    var mx = px(b), my = py(g);
    mark.setAttribute('cx', mx.toFixed(1)); mark.setAttribute('cy', my.toFixed(1));
    if (b > 0.84) { lab.setAttribute('x', (mx - 8).toFixed(1)); lab.setAttribute('text-anchor', 'end'); }
    else { lab.setAttribute('x', (mx + 8).toFixed(1)); lab.setAttribute('text-anchor', 'start'); }
    lab.setAttribute('y', Math.max(my - 7, 56).toFixed(1));
    lab.textContent = 'β=' + b.toFixed(2);
    var st, col;
    if (b < 0.1) { st = '近似牛顿'; col = '#1e6640'; }
    else if (b > 0.8) { st = '相对论效应显著'; col = '#8f3226'; }
    else { st = '过渡区'; col = '#8a5c14'; }
    set('gxStateBig', st); set('gxStateWhy', 'β = ' + b.toFixed(2) + '，γ = ' + g.toFixed(2));
    var big = $('gxStateBig'); if (big) big.style.color = col;
  }
  window.__ap = AutoPilot.create({
    mount: $('gxStage'), follow: sl,
    loop: [
      { t: 0, v: 0 }, { t: 2.4, v: 0.5 },
      { t: 4.4, v: 0.8 }, { t: 6.9, v: 0.8 },
      { t: 9.1, v: 0.99 }, { t: 11.6, v: 0.99 },
      { t: 13.6, v: 0 }
    ],
    keys: [0, 0.5, 0.8, 0.99],
    value: 0, min: 0, max: 0.99, step: 0.01, idle: 5000,
    onChange: render,
    onMode: function (m) {
      var el = $('gxAp'), t = $('gxApTxt');
      if (!el || !t) return;
      el.classList.toggle('is-auto', m === 'auto');
      el.classList.toggle('is-manual', m === 'manual');
      t.textContent = m === 'auto' ? '自动演示中' : '你接管了 · 5 秒后自动';
    }
  });
  render(0);
});
</script>
