<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">三句话撑起这一节：计时靠打点计时器，测速靠「很短时间内的平均速度」，结论靠 v–t 图的斜率。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 打点计时器<span class="q-src">人教版必修第一册 · 第二章第 1 节</span></p>
<p class="q-b">打点计时器是一种使用交变电源的计时仪器。当电源频率是 50 Hz 时，它每隔 0.02 s 打一次点。</p>
<p class="q-n">→ 关键在「<b>计时仪器</b>」四个字：它自己就是秒表，纸带上的点自带时间戳。
相邻两点间隔 0.02 s，这是<b>打点间隔</b>；为了少算几个数，通常每 5 个间隔取一个<b>计数点</b>，
于是相邻计数点的时间间隔 <b>T = 5 × 0.02 s = 0.1 s</b>。这两个「间隔」是本节第一个坑。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 怎样求某点的瞬时速度<span class="q-src">人教版必修第一册 · 第二章第 1 节</span></p>
<p class="q-b">用很短时间内的平均速度代替瞬时速度。</p>
<p class="q-n">→ 纸带上某一点的瞬时速度是测不出来的（那一瞬间没有「一段距离」可量），
但可以取它<b>前一个点</b>和<b>后一个点</b>，把这一小段的平均速度当成它的瞬时速度：
<b>v<sub>n</sub> = (x<sub>n+1</sub> − x<sub>n−1</sub>) / (2T)</b>。时间取得越短，代替得越准。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · v–t 图像<span class="q-src">人教版必修第一册 · 第二章第 1 节</span></p>
<p class="q-b">以速度 v 为纵轴、时间 t 为横轴建立直角坐标系，小车的 v–t 图像是一条倾斜的直线，直线的斜率表示加速度。</p>
<p class="q-n">→ 直线意味着「每过一个 T，速度增加的量都一样多」，这正是<b>加速度不变</b>。
斜率 = <b>Δv / Δt = a</b>：线越陡，速度变化越快；线水平，a = 0，小车在匀速。</p>
</div>

<p class="gx-note">实验的逻辑链只有三环：<b>纸带（位置）→ 逐差（速度）→ 斜率（加速度）</b>。
每一环都只用到上一环的结果，任何一环算错，最后那条直线就歪了。所以判卷时先看你有没有把 T 认对。</p>
</section>

<section class="gx-sec" id="c">
<h2><span class="sn">03</span>自己拖一下<span class="bdg bdg-must">核心</span></h2>
<p class="gx-h2s">拖加速度 a，看同一台计时器打出的纸带怎么变：<b>点距一段比一段大，比例永远是 1 : 3 : 5 : 7 : 9</b>。</p>

<figure class="gx-fig">
<div class="fig-cap"><span class="fig-no">互动 1</span><span class="fig-t">纸带模拟器：a 变，点距跟着变</span><span class="gx-ap" id="gxAp"><i></i><span id="gxApTxt">自动演示中</span></span></div>
<p class="fig-s">计数点间隔 <b>T = 0.1 s</b>、初速度 <b>v₀ = 0</b>，第 n 个点距起点的距离 <b>x<sub>n</sub> = ½a(nT)²</b>。
取第 3 个点的速度 v₃ = a·3T（也就是 0.3a），再看第 3–4 段的点距 Δx = x₄ − x₃ = 3.5a（cm）。

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">一条纸带、四个数据、五个判断。坑全在「T 到底是多少」和「cm 有没有换成 m」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 由纸带求速度和加速度<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">实验中每 5 个打点间隔取一个计数点，测得各计数点到起点 0 的距离为：
x₀ = 0，x₁ = 0.60 cm，x₂ = 1.60 cm，x₃ = 3.00 cm，x₄ = 4.80 cm。
打点计时器接 50 Hz 交变电源。<br>
（1）求打第 1、2、3 个计数点时小车的速度 v₁、v₂、v₃；（2）求小车的加速度 a。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 先认时间：T = 0.1 s，不是 0.02 s</p>
<p class="s-b">电源 50 Hz，打点间隔 0.02 s。每 5 个间隔取一个计数点，所以相邻计数点的时间间隔
<b>T = 5 × 0.02 s = 0.1 s</b>。题目给的 x₀…x₄ 是各计数点到起点的距离，单位是 cm。</p>
<p class="s-k">用到：打点间隔 0.02 s 与计数点间隔 T 的区别。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 求 v₁：用 0 到 2 这一小段的平均速度</p>
<p class="s-b">第 1 个点是 0 与 2 的中点，取它前后各一个点，跨两个间隔：
v₁ = (x₂ − x₀) / (2T) = (1.60 − 0.00) cm / 0.2 s = 8.0 cm/s = <b>0.080 m/s</b>。</p>
<p class="s-k">用到：v<sub>n</sub> = (x<sub>n+1</sub> − x<sub>n−1</sub>)/(2T)，分母是两个间隔。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 同样办法求 v₂、v₃</p>
<p class="s-b">v₂ = (x₃ − x₁)/(2T) = (3.00 − 0.60)/0.2 = 12.0 cm/s = <b>0.120 m/s</b>；
v₃ = (x₄ − x₂)/(2T) = (4.80 − 1.60)/0.2 = 16.0 cm/s = <b>0.160 m/s</b>。</p>
<p class="s-k">用到：同一条纸带上每个点都用「前后两点、除以 2T」。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 用 v–t 图的斜率求 a</p>
<p class="s-b">a = Δv/Δt = (v₃ − v₂)/T = (0.160 − 0.120)/0.1 = <b>0.40 m/s²</b>。
换一条路验算：相邻点距 0.60、1.00、1.40、1.80 cm，每次多 0.40 cm，
a = Δ(Δx)/T² = 0.0040 m / (0.1 s)² = 0.40 m/s²，两条路一致。</p>
<p class="s-k">用到：斜率 = Δv/Δt；匀变速中 Δ(Δx) = aT²。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口：单位、方向、还能读出什么</p>
<p class="s-b">所有速度写成 m/s（0.080、0.120、0.160），加速度 0.40 m/s²，方向与小车运动方向相同。
图线与 v 轴的交点约 0.04 m/s，就是 v₀；于是这段运动可以写成 v = 0.04 + 0.40t。
<b>答题卡上必须写单位</b>：cm/s 也对，但 a 写成 0.40 cm/s² 就错了。</p>
<p class="s-k">用到：a 的单位是 m/s²；截距是 v₀，斜率是 a。</p>
</li>
</ol>
<div class="exbar">
  <button id="gxNext" type="button">下一步</button>
  <span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">相邻计数点时间间隔 T = 5 × 0.02 s = 0.1 s。<br>
（1）v₁ = (x₂ − x₀)/(2T) = 8.0 cm/s = <b>0.080 m/s</b>；v₂ = (x₃ − x₁)/(2T) = <b>0.120 m/s</b>；v₃ = (x₄ − x₂)/(2T) = <b>0.160 m/s</b>。<br>
（2）a = (v₃ − v₂)/T = (0.160 − 0.120)/0.1 = <b>0.40 m/s²</b>，方向与小车运动方向相同。<br>
（也可由 Δ(Δx) = 0.40 cm 得 a = 0.0040 m /(0.1 s)² = 0.40 m/s²。）</p>
</div>
<p class="gx-note">最容易丢分的两处：把 T 当成 0.02 s（a 会算出 2.0 m/s²，差 5 倍）；v₁ 除以 T 而不是 2T（v 全部翻倍）。
写答案前先问自己一句：<b>这个分母，跨了几个间隔？</b></p>
</div>
</section>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>考你会怎么考</h2>
<p class="gx-h2s">六种问法，考的都是「你有没有把纸带读成时间 + 位置」。</p>

<div class="gx-qa">
<div class="qac">
<p class="q">为什么能用平均速度代替瞬时速度？</p>
<p class="a"><b>因为时间取得足够短。</b>Δt 越小，这一小段内的速度变化越小，平均速度就越接近该点的瞬时速度。</p>

<div class="qac">
<p class="q">T 到底代 0.02 s 还是 0.1 s？</p>
<p class="a"><b>看题目取的是「打点」还是「计数点」。</b>每 5 个间隔取一个计数点，T = 5 × 0.02 s = 0.1 s；直接量相邻打点，才是 0.02 s。</p>

<div class="qac">
<p class="q">为什么必须先接通电源再释放小车？</p>
<p class="a"><b>为了拿到完整的一段点。</b>先放车后通电，纸带开头的那几个点根本不会被打上，v₁ 就无从算起。</p>

</div>
<div class="qac">
<p class="q">v–t 图的斜率为负，说明什么？</p>
<p class="a"><b>加速度方向与正方向相反，小车在减速（若 v 为正）。</b>斜率只给方向，不直接说「加速还是减速」。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="v-t图线向下倾斜表示加速度为负">

</div>
<div class="qac">
<p class="q">纸带上点距越来越大，说明什么？</p>
<p class="a"><b>相同时间内位移越来越大，速度在增大，小车做加速运动。</b>若点距均匀增大（差相等），就是匀加速。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="点距越来越大表示速度增大">

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是阅卷时真见过的写法，右边是能得分的表述。这一节的分数，基本都丢在「分母」和「单位」上。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ T 一律代 0.02 s。</p>
<p class="er-v">✓ 题目说「每 5 个间隔取一个计数点」，T = 5 × 0.02 s = 0.1 s。</p>
<p class="er-w">打点间隔是 0.02 s，计数点间隔由题目规定；两者混用，a 会差 5 倍甚至 25 倍。</p>
</div>
<div class="er">
<p class="er-x">✗ 0.60 cm 直接代进公式，最后 a 写成 0.40 cm/s²。</p>
<p class="er-v">✓ 先换单位：0.60 cm = 6.0 × 10⁻³ m，a = 0.40 m/s²。</p>
<p class="er-w">x 用 cm、T 用 s，算出来的 v 是 cm/s；再往下算 a，单位就串了。</p>
</div>
<div class="er">
<p class="er-x">✗ v₁ = (x₂ − x₀) / T。</p>
<p class="er-v">✓ v₁ = (x₂ − x₀) / (2T)，因为从 x₀ 到 x₂ 跨了两个时间间隔。</p>
<p class="er-w">分母少乘 2，所有速度翻倍；这条错误在卷面上最隐蔽，因为数值「看起来很正常」。</p>
</div>
<div class="er">
<p class="er-x">✗ v–t 图线与 t 轴围成的面积就是加速度。</p>
<p class="er-v">✓ 面积是位移，斜率才是加速度。</p>
<p class="er-w">面积和斜率两种读图方式，从这一节起要一直分到第二章第 3 节。</p>
</div>
<div class="er">
<p class="er-x">✗ 先释放小车，再接通电源，省点时间。</p>
<p class="er-v">✓ 先接通电源，等打点稳定后再释放小车。</p>
<p class="er-w">反序会让纸带开头缺一段点，第一个速度算不出来，整条 v–t 图少一个点。</p>
</div>
<div class="er">
<p class="er-x">✗ 用整段的平均速度 (x₄ − x₀)/(4T) 当作 v₂。</p>
<p class="er-v">✓ 求哪一点的速度，就取它相邻的前后两点，用 (x<sub>n+1</sub> − x<sub>n−1</sub>)/(2T)。</p>
<p class="er-w">整段平均速度对应的是整段时间的「中点时刻」，不是第 2 个点；两者数值不同。</p>
</div>

<p class="gx-note" style="border-top:1px solid var(--line);padding-top:14px">下一节把这根直线翻译成公式：<b>v = v₀ + at</b>。
纸带只告诉你「速度均匀增加」，公式告诉你「增加多少」。</p>

<div class="gx-foot">
<p>教材依据：人教版《物理》必修第一册（2019 年版）第二章第 1 节「实验：探究小车速度随时间变化的规律」。课文引文按教材表述整理，页码以纸质书为准。</p>
<p>数值口径：本页纸带数据（0.60、1.60、3.00、4.80 cm，T = 0.1 s）是<b>为教学设计的模拟数据</b>，不是某次真实实验的测量值；
由它算出的 v₁、v₂、v₃、a 均为模型计算结果。互动中的 a ∈ [0, 4.0] m/s²、v₀ = 0、T = 0.1 s 同样为模型参数。</p>
<p>图 2 下排的 36、72、108 是「相邻点距之差」的示意值，只用来说明「差相等」，与例题数据无关。</p>

  <span class="gx-zoom-tip">双指放大看细节</span>

<script src="../../assets/page.js"></script>
<script src="../../assets/gx.js"></script>
<script src="../../assets/autopilot.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var $ = GX.$;
  var stage = $("gxStage");
  var A = 2.5, T = 0.1;
  var X0 = 24, SPAN = 312, CMAX = 50;          /* 固定 0–50 cm 标尺 */
  function px(cm) { return X0 + cm / CMAX * SPAN; }
  function barX(i) { return 46 + i * 56.8 + 12.4; }

  var gTicks = $("gxTicks"), gDots = $("gxDots"), gBars = $("gxBars");
  var dots = [], ticks = [], bars = [], bnums = [], i;
  for (i = 0; i <= 5; i++) {
    ticks.push(GX.el("line", { y1: 40, y2: 62, stroke: "#b9c0c9", "stroke-width": 1 }, gTicks));
    dots.push(GX.el("circle", { cy: 51, r: 3.6, fill: "#1b1b19" }, gDots));
  }
  for (i = 0; i < 5; i++) {
    bars.push(GX.el("rect", { x: barX(i), y: 272, width: 32, height: 0.8, rx: 1.5, fill: "#7c3aed" }, gBars));
    bnums.push(GX.el("text", { x: barX(i) + 16, y: 262, "font-size": 9, fill: "#3a3a35", "text-anchor": "middle" }, gBars));
    GX.el("text", { x: barX(i) + 16, y: 286, "font-size": 9, fill: "#6b7280", "text-anchor": "middle" }, gBars).textContent = "第" + (i + 1) + "段";
  }

  function calc(a) {
    var xs = [], dxs = [], k;
    for (k = 0; k <= 5; k++) xs.push(Math.round(0.5 * a * Math.pow(k * T, 2) * 100 * 1000) / 1000);   /* cm */
    for (k = 1; k <= 5; k++) dxs.push(Math.round((xs[k] - xs[k - 1]) * 1000) / 1000);
    return { xs: xs, dxs: dxs, v3: 3 * a * T, dx34: Math.round((xs[4] - xs[3]) * 1000) / 1000 };
  }

  function render() {
    var s = calc(A), k, x;
    for (k = 0; k <= 5; k++) {
      x = px(s.xs[k]);
      dots[k].setAttribute("cx", x);
      ticks[k].setAttribute("x1", x);
      ticks[k].setAttribute("x2", x);
    }
    var xl = px(s.xs[3]), xr = px(s.xs[4]);
    $("gxBkL").setAttribute("x1", xl); $("gxBkL").setAttribute("x2", xl);
    $("gxBkR").setAttribute("x1", xr); $("gxBkR").setAttribute("x2", xr);
    $("gxBkH").setAttribute("x1", xl); $("gxBkH").setAttribute("x2", xr);
    var btxt = $("gxBkT"), bx = (xl + xr) / 2;
    if (bx < 62) bx = 62;
    btxt.setAttribute("x", bx);
    btxt.textContent = "Δx₃₋₄ = " + s.dx34.toFixed(1) + " cm";

    for (k = 0; k < 5; k++) {
      var hh = Math.min(s.dxs[k] / 18, 1) * 100;
      bars[k].setAttribute("y", 272 - hh);
      bars[k].setAttribute("height", Math.max(hh, 0.8));
      bars[k].setAttribute("fill", A < 0.05 ? "#b9c0c9" : "#7c3aed");
      bnums[k].setAttribute("y", 272 - hh - 5);
      bnums[k].textContent = s.dxs[k].toFixed(1);
    }

    var zero = A < 0.05;
    $("gxVa").textContent = A.toFixed(1) + " m/s²";
    $("gxVb").textContent = s.v3.toFixed(2) + " m/s";
    $("gxVc").textContent = s.dx34.toFixed(1) + " cm";
    $("gxVc").style.color = zero ? "#b8791f" : "#1e6640";
    $("gxVcn").textContent = zero ? "点距为 0：a = 0，小车没动" : "点距逐段变大：1 : 3 : 5 : 7 : 9";
    $("gxStBox").style.background = zero ? "#fdf3e0" : "#f6fbf8";
    $("gxStBox").style.borderColor = zero ? "#f0dcb444" : "#bfe0cd44";
  }

  var ap = null, dragging = false, moved = false, downX = 0, suppressTap = false;

  function xToA(clientX) {
    var r = stage.getBoundingClientRect();
    var f = (clientX - r.left) / r.width;
    return Math.max(0, Math.min(4, Math.round(f * 4 * 10) / 10));
  }

  stage.addEventListener("pointerdown", function (ev) {
    dragging = true; moved = false; downX = ev.clientX;
    if (ap) ap.take();
    A = xToA(ev.clientX);
    if (ap) ap.setValue(A, false);
    render();
    try { stage.setPointerCapture(ev.pointerId); } catch (e) {}
  });
  stage.addEventListener("pointermove", function (ev) {
    if (!dragging) return;
    if (Math.abs(ev.clientX - downX) > 4) moved = true;
    A = xToA(ev.clientX);
    if (ap) ap.setValue(A, false);
    render();
  });
  stage.addEventListener("pointerup", function () {
    if (moved) suppressTap = true;
    dragging = false;
  });
  stage.addEventListener("click", function (ev) {
    if (!suppressTap) return;
    suppressTap = false;
    ev.stopImmediatePropagation();
  });

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  render();
  ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 4 }, { t: 3, v: 2.5 }, { t: 5.5, v: 2.5 }, { t: 7.5, v: 1.5 },
           { t: 9.5, v: 0 }, { t: 11, v: 0 }, { t: 13, v: 4 }],
    keys: [2.5, 4, 1.5, 0],
    value: A, min: 0, max: 4, step: 0.1,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc };

  /* 减弱动效时不跑 rAF，滑块需要自己接一条输入线 */
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    $("gxSl").addEventListener("input", function () {
      A = Math.max(0, Math.min(4, +this.value));
      render();
    });
  }
});
</script>
</body>
