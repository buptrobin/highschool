<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">一个定义、一个公式、一张图。定义管「什么算」，公式管「算多少」，图管「长什么样」。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 匀变速直线运动<span class="q-src">人教版必修第一册 · 第二章第 2 节</span></p>
<p class="q-b">沿着一条直线，且加速度不变的运动，叫作匀变速直线运动。</p>
<p class="q-n">→ 两个条件缺一不可：<b>轨迹是直线</b>、<b>加速度不变</b>。「不变」指大小和方向都不变，
所以速度可以增大（a 与 v 同向），也可以减小（a 与 v 反向）。<b>匀减速</b>也是匀变速的一种。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 速度与时间的关系式<span class="q-src">人教版必修第一册 · 第二章第 2 节</span></p>
<p class="q-b">v = v₀ + at</p>
<p class="q-n">→ 它是从 a = (v − v₀)/t 变形来的：<b>末速度 = 初速度 + 每秒增加的那一份 × 秒数</b>。
v₀ 是 t = 0 时的速度，a 是每秒变化多少。a 与 v₀ <b>同号</b>时速度大小增大，<b>异号</b>时减小。
公式里的 a 要<b>带符号</b>代，减速就代负值。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · v–t 图像<span class="q-src">人教版必修第一册 · 第二章第 2 节</span></p>
<p class="q-b">匀变速直线运动的 v–t 图像是一条倾斜的直线。</p>
<p class="q-n">→ 直线 ⇔ 斜率不变 ⇔ 加速度不变。看图抓两个数：<b>与 v 轴的交点 = v₀</b>，
<b>斜率 = a</b>。线往下走只说明 a 为负，速度到底在增大还是减小，还要看它落在 t 轴上方还是下方。</p>
</div>

<p class="gx-note">这一节最容易混的不是公式，是「<b>公式能用到哪一刻</b>」。
v = v₀ + at 描述的是<b>匀变速还在进行</b>的那段时间；一旦物体停下（或被挡住），后面的运动就不再服从这个式子。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">五个判断，第一个就把大多数人拦下：<b>先算停，再算远</b>。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 刹车：停止时间、刹车距离与追尾判断<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">汽车以 20 m/s 的速度在平直公路上行驶，司机发现前方 40 m 处有障碍物后立即刹车，
刹车过程中加速度大小为 4 m/s²，方向与运动方向相反。不计反应时间。<br>
（1）求汽车从刹车到停止所用的时间；（2）求刹车距离；（3）汽车是否会撞上障碍物？若撞上，撞上时的速度多大？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 规定正方向，把 a 写成带符号的数</p>
<p class="s-b">取汽车运动方向为正方向。则 v₀ = +20 m/s；加速度与运动方向相反，
a = −4 m/s²。刹车过程中速度每秒减少 4 m/s。</p>
<p class="s-k">用到：一维运动中方向用正负号表示，减速时 a 代负值。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 先求停止时间，别急着代 t = 7</p>
<p class="s-b">停止时 v = 0，由 v = v₀ + at 得
t = (v − v₀)/a = (0 − 20)/(−4) = <b>5 s</b>。也就是说，5 s 之后车就不再按这个式子运动了。</p>
<p class="s-k">用到：v = v₀ + at 反解时间；先定「公式的有效期」。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 用这 5 s 算刹车距离</p>
<p class="s-b">x = v₀t + ½at² = 20 × 5 + ½ × (−4) × 5² = 100 − 50 = <b>50 m</b>。
用 v² − v₀² = 2ax 验算：0 − 400 = 2 × (−4) × x，同样得 x = 50 m。</p>
<p class="s-k">用到：位移公式里 a 带符号；两种算法互相校验。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 把 50 m 和 40 m 摆在一起判断</p>
<p class="s-b">车要滑 50 m 才停，障碍物只有 40 m 远，所以<b>会撞上</b>，而且在停下之前就撞上。
撞上时已走过 40 m：由 v² = v₀² + 2ax 得 v² = 400 + 2 × (−4) × 40 = 80，
v = √80 ≈ <b>8.9 m/s</b>，方向仍与运动方向相同。</p>
<p class="s-k">用到：v² − v₀² = 2ax 不含 t，专门用来求「某个位移处的速度」。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口：答案怎么写才满</p>
<p class="s-b">三问三答：t = 5 s；x = 50 m；会撞上，撞上时约 8.9 m/s。
再补一句检验：最后 2 s 的初速度 v₃ = 20 − 4 × 3 = 8 m/s，平均速度 (8 + 0)/2 = 4 m/s，
位移 4 × 2 = 8 m；而 x(5) − x(3) = 50 − 42 = 8 m，两边一致。</p>
<p class="s-k">用到：匀变速的平均速度 v̄ = (v₀ + v)/2，可用来交叉验算。</p>
</li>
</ol>
<div class="exbar">
  <button id="gxNext" type="button">下一步</button>
  <span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">取运动方向为正方向，v₀ = 20 m/s，a = −4 m/s²。<br>
（1）由 v = v₀ + at，令 v = 0，得 t = −v₀/a = 5 s，即刹车 <b>5 s</b> 后停止。<br>
（2）x = v₀t + ½at² = 20 × 5 − ½ × 4 × 25 = <b>50 m</b>（或由 v² − v₀² = 2ax 得 x = 50 m）。<br>
（3）因为 50 m &gt; 40 m，汽车<b>会撞上障碍物</b>；撞上时 v = √(v₀² + 2ax) = √(400 − 320) ≈ <b>8.9 m/s</b>，方向与运动方向相同。</p>
</div>
<p class="gx-note">这题最容易错成：把 t = 7 s（或题目给的任意时间）直接代进 v = v₀ + at，算出负速度还接着算位移。
<b>凡是有「刹车」「制动」「停下」的题，第一句话就该写「先求停止时间」。</b></p>
</div>
</section>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>考你会怎么考</h2>
<p class="gx-h2s">六种问法，核心只有一句：<b>先看 a 与 v 的方向，再看公式有没有越界</b>。</p>

<div class="gx-qa">
<div class="qac">
<p class="q">加速度为负，物体一定在减速吗？</p>
<p class="a"><b>不一定。</b>要看 a 与 v 是否反向。v = −10 m/s、a = −2 m/s² 时两者同向，速度大小反而在增大。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="v和a都为负时速度大小在增大">
  <line x1="200" y1="60" x2="40" y2="60" stroke="#7c3aed" stroke-width="2.8"/>
  <polygon points="28,60 42,54 42,66" fill="#7c3aed"/>
  <text x="120" y="48" text-anchor="middle" font-size="10.5" fill="#6d28d9">v = −10 m/s（向左）</text>
  <line x1="200" y1="92" x2="40" y2="92" stroke="#b8402f" stroke-width="2.8"/>

  <text x="120" y="26" text-anchor="middle" font-size="10" fill="#2f8a5b">同向 → 越走越快</text>
</svg>
</div>
<div class="qac">
<p class="q">刹车停下后，会按公式反向加速吗？</p>
<p class="a"><b>不会。</b>摩擦力的方向随相对运动改变，车一停，刹车就把它按住了。公式算出的负速度只是「外推出来的假象」。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="刹车v-t图在5秒后保持为零，公式外推的负速度不存在">
  <line x1="30" y1="66" x2="216" y2="66" stroke="#5a6472"/>

  <line x1="120" y1="66" x2="206" y2="96" stroke="#b8402f" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="146" y="112" text-anchor="middle" font-size="9.5" fill="#b8402f">虚线不存在</text>
  <text x="74" y="100" text-anchor="middle" font-size="9.5" fill="#6b7280">5 s 停止</text>
  <circle cx="120" cy="66" r="4" fill="#fff" stroke="#b8402f" stroke-width="2.2"/>
</svg>
</div>
<div class="qac">
<p class="q">刹车距离与速度成正比吗？</p>
<p class="a"><b>不成正比，与 v² 成正比。</b>由 v² = 2ax 得 x = v²/(2a)：速度加倍，刹车距离变成 <b>4 倍</b>。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="速度加倍时刹车距离变成四倍">
  <rect x="44" y="34" width="30" height="26" fill="#2f6fd0"/>
  <text x="59" y="76" text-anchor="middle" font-size="9.5" fill="#2f6fd0">v</text>
  <text x="59" y="90" text-anchor="middle" font-size="9" fill="#6b7280">x</text>
  <rect x="120" y="34" width="30" height="26" fill="#b8791f"/>
  <text x="135" y="76" text-anchor="middle" font-size="9.5" fill="#b8791f">2v</text>
  <rect x="120" y="90" width="104" height="20" fill="#b8791f" opacity=".5"/>
  <text x="172" y="122" text-anchor="middle" font-size="9" fill="#8a5c14">4x</text>
  <text x="120" y="24" text-anchor="middle" font-size="9.5" fill="#3a3a35">v 变 2 倍 → x 变 4 倍</text>
</svg>
</div>
<div class="qac">
<p class="q">为什么题目总要给「反应时间」？</p>
<p class="a"><b>因为那段时间车还在匀速前进。</b>反应距离 = v × t<sub>反应</sub>，要单独加上，不能算进刹车距离。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="反应距离加刹车距离等于总停车距离">
  <rect x="30" y="52" width="48" height="24" fill="#2f6fd0" opacity=".3" stroke="#2f6fd0"/>

  <text x="120" y="114" text-anchor="middle" font-size="9.5" fill="#1e6640">总停车距离</text>
</svg>
</div>
<div class="qac">
<p class="q">v–t 图线水平，表示什么？</p>
<p class="a"><b>加速度为 0，速度不变，做匀速直线运动。</b>这时的 v 值就是全程的速度。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="水平的v-t线表示匀速运动">
  <line x1="30" y1="100" x2="214" y2="100" stroke="#5a6472"/>

</svg>
</div>
<div class="qac">
<p class="q">v–t 图线在 t 轴下方，表示什么？</p>
<p class="a"><b>速度方向与正方向相反。</b>这时 a 若仍为负，物体反而在加速（反向加速），速度大小在增大。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="v-t线在t轴下方表示速度为负方向">
  <line x1="30" y1="62" x2="216" y2="62" stroke="#5a6472"/>
  <line x1="30" y1="30" x2="30" y2="108" stroke="#5a6472"/>
  <line x1="30" y1="62" x2="196" y2="106" stroke="#b8402f" stroke-width="2.6"/>
  <text x="120" y="52" text-anchor="middle" font-size="9.5" fill="#6b7280">t 轴（v = 0）</text>
  <text x="128" y="122" text-anchor="middle" font-size="10" fill="#b8402f">v &lt; 0：反向运动</text>
</svg>
</div>
</div>
<p class="gx-note">这六问其实是同一件事：<b>先定正方向，再把 a 与 v 的符号摆在一起</b>。
同号加速、异号减速；遇到「停下」就立刻去算停止时间，别让公式跑出它的有效期。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是考场高频错句，右边是能得分的表述。刹车题丢分，一半丢在「公式用过头」。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ v = v₀ + at 里，t 想代多大就代多大。</p>
<p class="er-v">✓ 先求停止时间 t = −v₀/a，题目问的时刻超过它，速度就取 0、位移取停止时的值。</p>
<p class="er-w">越过停止点还代公式，会算出负速度，进而算出「越刹越往回走」的位移。</p>
</div>
<div class="er">
<p class="er-x">✗ a 为负，所以物体在减速。</p>
<p class="er-v">✓ a 为负只表示方向与正方向相反；减速要看 a 与 v 是否反向。</p>
<p class="er-w">v = −10 m/s、a = −2 m/s² 时同向，速度大小在增大，这是「反向加速」。</p>
</div>
<div class="er">
<p class="er-x">✗ 刹车停下后会按公式反向加速，所以位移会减小。</p>
<p class="er-v">✓ 停下后车保持静止，位移不再变化；公式算出的负速度只是外推的假象。</p>
<p class="er-w">摩擦力和刹车装置不会推着车往回走；把数学结果当物理事实，是这类题最典型的错。</p>
</div>
<div class="er">
<p class="er-x">✗ 题目给了反应时间，直接忽略，只算刹车距离。</p>
<p class="er-v">✓ 总停车距离 = 反应距离（v × t<sub>反应</sub>）+ 刹车距离（v²/2a）。</p>
<p class="er-w">反应时间内车仍在匀速前进，20 m/s × 0.5 s 就是 10 m，漏掉它安全距离就少算一大截。</p>
</div>
<div class="er">
<p class="er-x">✗ v–t 图线的斜率就是速度。</p>
<p class="er-v">✓ 纵坐标才是速度，斜率是加速度。</p>
<p class="er-w">看图先看纵轴读数得到 v，再用斜率判断 a；把两者混起来，方向一定判错。</p>
</div>
<div class="er">
<p class="er-x">✗ 20 m/s、4 m/s² 直接代，单位不用管。</p>
<p class="er-v">✓ 先把 km/h 换成 m/s、cm 换成 m，再代公式，结果单位才自动是 m 和 m/s。</p>
<p class="er-w">72 km/h 是 20 m/s，不是 72；单位不统一，算出的距离会差 3.6 倍。</p>
</div>
</div>
</section>

<p class="gx-note" style="border-top:1px solid var(--line);padding-top:14px">下一节把这条直线「围出的面积」翻译成位移：<b>x = v₀t + ½at²</b>。
速度公式管「多快」，位移公式管「多远」，两张图是同一根线。</p>

<div class="gx-foot">
<p>教材依据：人教版《物理》必修第一册（2019 年版）第二章第 2 节「匀变速直线运动的速度与时间的关系」。课文引文按教材表述整理，页码以纸质书为准。</p>
<p>数值口径：互动与例题中的 20 m/s、4 m/s² 都是<b>教学模型值</b>，不是某辆车的实测数据；x = 20t − 2t² 由 v₀t + ½at² 算出。
图 3 的 0.5 s 反应时间为<b>示意值</b>，对应反应距离 10 m、刹车距离 50 m、总停车距离 60 m；例题中明确「不计反应时间」，两处口径不同，已在各自图注中写明。</p>
<p>本页不涉及位移公式的推导，只用到 v = v₀ + at 与 v² − v₀² = 2ax；后者在下一节会由面积法正式给出。</p>
</div>

</div>

<div class="gx-zoom" id="gxZoom" hidden>
  <span class="gx-zoom-tip">双指放大看细节</span>
  <button class="gx-zoom-x" type="button" aria-label="关闭">✕</button>
  <div id="gxZoomInner"></div>
</div>

<script src="../../assets/page.js"></script>
<script src="../../assets/gx.js"></script>
<script src="../../assets/autopilot.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var $ = GX.$;
  var stage = $("gxStage");
  var T = 0, TSTOP = 5, V0 = 20, ACC = -4;
  var X0 = 44, X1 = 346, TMAX = 7;
  var Y0 = 250, Y1 = 30, VMIN = 0, VMAX = 22;

  function px(t) { return X0 + t / TMAX * (X1 - X0); }
  function py(v) { return Y0 - (v - VMIN) / (VMAX - VMIN) * (Y0 - Y1); }

  function calc(t) {
    var v = Math.max(0, V0 + ACC * t);
    var x = t <= TSTOP ? V0 * t + 0.5 * ACC * t * t : 50;
    var st, col, bg, sn;
    if (t < TSTOP - 0.05) {
      st = "正在减速"; col = "#b8791f"; bg = "#fdf3e0";
      sn = "a 与 v 反向，每秒 −4 m/s";
    } else if (t <= TSTOP + 0.05) {
      st = "恰好停止"; col = "#b8402f"; bg = "#fbeae7";
      sn = "v = 0，位移停在 50 m";
    } else {
      st = "已停止"; col = "#2f6fd0"; bg = "#eef5fc";
      sn = "车保持静止，不能倒车";
    }
    return { v: v, x: x, st: st, col: col, bg: bg, sn: sn };
  }

  function render() {
    var s = calc(T);
    $("gxNow").setAttribute("cx", px(T));
    $("gxNow").setAttribute("cy", py(s.v));
    $("gxNowV").setAttribute("x1", px(T));
    $("gxNowV").setAttribute("x2", px(T));
    $("gxNowV").setAttribute("y2", py(s.v));
    $("gxNowT").setAttribute("x", px(T));
    $("gxNowT").textContent = T.toFixed(1) + " s";

    $("gxVa").textContent = T.toFixed(1) + " s";
    $("gxVb").textContent = s.v.toFixed(1) + " m/s";
    $("gxVc").textContent = s.x.toFixed(1) + " m";
    $("gxVc").style.color = s.col;
    $("gxVcn").textContent = s.sn;
    $("gxStBox").style.background = s.bg;
    $("gxStBox").style.borderColor = s.col + "44";
  }

  var ap = null, dragging = false, moved = false, downX = 0, suppressTap = false;

  function xToT(clientX) {
    var r = stage.getBoundingClientRect();
    var f = (clientX - r.left) / r.width;
    return Math.max(0, Math.min(TMAX, Math.round(f * TMAX * 10) / 10));
  }

  stage.addEventListener("pointerdown", function (ev) {
    dragging = true; moved = false; downX = ev.clientX;
    if (ap) ap.take();
    T = xToT(ev.clientX);
    if (ap) ap.setValue(T, false);
    render();
    try { stage.setPointerCapture(ev.pointerId); } catch (e) {}
  });
  stage.addEventListener("pointermove", function (ev) {
    if (!dragging) return;
    if (Math.abs(ev.clientX - downX) > 4) moved = true;
    T = xToT(ev.clientX);
    if (ap) ap.setValue(T, false);
    render();
  });
  stage.addEventListener("pointerup", function () {
    if (moved) suppressTap = true;
    dragging = false;
  });
  stage.addEventListener("click", function (ev) {
    if (!suppressTap) return;
    suppressTap = false;
    ev.stopImmediatePropagation();
  });

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  render();
  ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 0 }, { t: 2.5, v: 2.5 }, { t: 5, v: 5 }, { t: 7.5, v: 5 },
           { t: 9.5, v: 7 }, { t: 11.5, v: 0 }],
    keys: [2.5, 5, 7, 0],
    value: T, min: 0, max: 7, step: 0.1,
    idle: 5000,
    onChange: function (v) { T = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc };

  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    $("gxSl").addEventListener("input", function () {
      T = Math.max(0, Math.min(7, +this.value));
      render();
    });
  }
});
</script>
</body>
