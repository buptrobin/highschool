<p class="gx-claim">传统发酵只考一件事：<b>谁在干活（菌种）</b> + <b>要不要氧气（通气/密封）</b>，温度只是配角。</p>
<div class="gx-meta">
<span><i></i>人教版（2019）选择性必修3 第1章第1节</span>
<span><i></i>高二 · 发酵工程</span>
<span><i></i>阅读 13 分钟</span>
<span><i></i>含 1 个互动模型</span>
</div>
<p class="gx-lede">这一节是「发酵工程」的起点：先用人手边现成的微生物，不接种纯种、不控温控氧设备，靠原料自带的菌群把糖变成酒、把酒变成醋、把菜变成泡菜。整节最容易错的一件事是<b>把氧气的账记反</b>——酵母菌有氧无氧都能活，醋酸菌一刻离不开氧，乳酸菌一遇氧就吃亏。把这三个「氧」分清，选择题和填空题就都稳了。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 发酵的概念<span class="q-src">人教版（2019）选择性必修3 · 第1章第1节</span></p>
<p class="q-b">发酵是指人们利用微生物，在适宜的条件下，将原料通过微生物的代谢转化为人类所需要的产物的过程。</p>
<p class="q-n">→ 翻成人话：这句话由<b>四个条件</b>组成——①有<b>人</b>在利用（目的性，不是自然腐败）；②用<b>微生物</b>（不是化学催化剂）；③条件<b>适宜</b>（温度、氧气、pH 都要对）；④产物是<b>人需要的</b>。少掉③，微生物照样代谢，但产物不是你要的，那就成了腐败而不是发酵。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 果酒与果醋<span class="q-src">人教版（2019）选择性必修3 · 第1章第1节</span></p>
<p class="q-b">果酒的制作利用酵母菌的无氧呼吸，果醋的制作利用醋酸菌的有氧发酵。</p>
<p class="q-n">→ 翻成人话：一句话里藏了<b>两个条件</b>——菌种不同（酵母菌 / 醋酸菌）、氧气要求相反（<b>无氧</b> / <b>有氧</b>）。注意「有氧发酵」这四个字是课本原文，说明发酵<b>不等于</b>无氧，醋酸菌就是靠有氧把乙醇氧化成醋酸的。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 泡菜<span class="q-src">人教版（2019）选择性必修3 · 第1章第1节</span></p>
<p class="q-b">泡菜的制作利用乳酸菌的无氧发酵，产生乳酸。</p>
<p class="q-n">→ 翻成人话：乳酸菌是<b>严格厌氧</b>——不是「有氧也能凑合」，而是氧气一多就被抑制。所以泡菜坛要<b>密封</b>，且坛沿要用水封住：既挡氧气进来，又让发酵产生的 CO₂ 能顶出去。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>果酒（葡萄酒）</th><th>果醋</th><th>泡菜</th></tr></thead>
<tbody>
<tr><td>菌种</td><td>酵母菌</td><td>醋酸菌</td><td>乳酸菌</td></tr>
<tr><td>细胞类型</td><td>真核生物 · 真菌</td><td>原核生物 · 细菌</td><td>原核生物 · 细菌</td></tr>
<tr><td>适宜温度</td><td>18–30 ℃</td><td>30–35 ℃</td><td>室温（约 20–30 ℃）</td></tr>
<tr><td>反应实质</td><td>无氧呼吸（酒精发酵）</td><td>有氧氧化乙醇</td><td>无氧发酵产乳酸</td></tr>
<tr class="key"><td>通气要求</td><td>先通气扩繁，后<b>密封</b>发酵</td><td><b>必须持续通气</b></td><td><b>严格密封</b></td></tr>
</tbody>
</table>
</div>
<p class="gx-note">背法：把表竖着背成一句「<b>酵母两头都行、醋酸非氧不可、乳酸见氧就弱</b>」。整张表只有「通气要求」这一行是真正区分三种发酵的判据，其余都能从它推出来：要通气的是醋酸菌，要密封的是乳酸菌，先通后封的才是酵母菌。</p>
</section>

<section class="gx-sec" id="b">
<h2><span class="sn">02</span>拆开看</h2>
<p class="gx-h2s">四张图：各讲一件事，按「是什么 → 怎么变 → 怎么用」排。</p>

<figure class="gx-fig">
<div class="fig-cap">
<span class="fig-no">图 1</span><span class="fig-t">三种传统发酵的菌种与条件对照</span>

</div>
<p class="fig-s">先看每格的<b>菌种</b>，再看<b>细胞类型</b>（真核 / 原核），最后核对<b>通气与温度</b>。三列分别是果酒、果醋、泡菜，正是本节全部实验的底座；考试常把三种发酵的菌种互换来设错。</p>

<text x="46" y="147" font-size="9.4" fill="#3a3a35">反应：无氧呼吸</text>
<text x="46" y="164" font-size="9.4" fill="#3a3a35">产物：乙醇 + CO₂</text>

<text x="302" y="113" font-size="9.4" fill="#3a3a35">细胞类型：原核生物 · 细菌</text>
<text x="302" y="130" font-size="9.4" fill="#3a3a35">条件：30–35 ℃、持续通气</text>
<text x="302" y="147" font-size="9.4" fill="#3a3a35">反应：乙醇 → 醋酸（有氧）</text>
<text x="302" y="164" font-size="9.4" fill="#3a3a35">产物：醋酸（乙酸）+ H₂O</text>
<text x="302" y="187" font-size="9.4" font-weight="700" fill="#b8402f">判据：一断气就不产酸</text>

<rect x="544" y="56" width="236" height="170" rx="8" fill="#ffffff" stroke="#c9d8ea"/>

<text x="558" y="113" font-size="9.4" fill="#3a3a35">细胞类型：原核生物 · 细菌</text>
<text x="558" y="130" font-size="9.4" fill="#3a3a35">条件：密封、室温、加盐</text>
<text x="558" y="147" font-size="9.4" fill="#3a3a35">反应：无氧发酵（乳酸发酵）</text>
<text x="558" y="164" font-size="9.4" fill="#3a3a35">产物：乳酸</text>
<text x="558" y="187" font-size="9.4" font-weight="700" fill="#b8791f">判据：坛沿水封，不能开盖</text>

<p class="gx-take">三种发酵的区别不在「有没有微生物」，而在<b>菌种 + 氧气要求</b>：醋酸菌必须有氧，乳酸菌必须无氧，酵母菌先有氧扩繁再无氧产酒。</p>
<p class="gx-note">口径提醒：「发酵」在课本里<b>包含有氧过程</b>，别把发酵等同于无氧呼吸；这一点每年都有选择题拿它设错。</p>
</figure>

<figure class="gx-fig">
<div class="fig-cap">
<span class="fig-no">图 2</span><span class="fig-t">酵母菌的有氧与无氧两条去向</span>
<span class="bdg bdg-key">辨析</span>
</div>
<p class="fig-s">同一种菌、同一份葡萄糖，<b>有没有氧气</b>就分成两条路：有氧走彻底氧化、放能多、菌体大量增殖；无氧走酒精发酵、放能少、产乙醇。判断时先问「现在有没有氧」，再定产物。</p>
<div class="gx-svgbox">
<svg viewBox="0 0 820 250" role="img" aria-label="酵母菌兼性厌氧：有氧呼吸生成二氧化碳和水，无氧呼吸生成酒精和二氧化碳">
<rect x="16" y="16" width="788" height="218" rx="10" fill="#f8fbfd" stroke="#dbe7ef"/>
<text x="36" y="42" font-size="11.5" font-weight="700" fill="#151a21">酵母菌（兼性厌氧）：同一个菌，两条去向</text>

<rect x="330" y="54" width="160" height="50" rx="8" fill="#eef7f1" stroke="#2f8a5b"/>
<text x="410" y="74" font-size="10.4" font-weight="700" fill="#151a21" text-anchor="middle">酵母菌</text>
<text x="410" y="91" font-size="9" fill="#3a3a35" text-anchor="middle">兼性厌氧 · 真核生物</text>

<path d="M352 104 L232 146" stroke="#2f8a5b" stroke-width="1.4" fill="none"/>
<path d="M228 140 L240 146 L230 151 Z" fill="#2f8a5b"/>
<text x="262" y="120" font-size="10" font-weight="700" fill="#2f8a5b">有氧</text>

<path d="M468 104 L588 146" stroke="#b8791f" stroke-width="1.4" fill="none"/>
<path d="M592 140 L580 146 L590 151 Z" fill="#b8791f"/>
<text x="530" y="120" font-size="10" font-weight="700" fill="#b8791f">无氧</text>

<rect x="44" y="152" width="330" height="70" rx="8" fill="#ffffff" stroke="#b8e6d0"/>
<text x="58" y="172" font-size="10" font-weight="700" fill="#151a21">有氧呼吸（通气培养）</text>
<text x="58" y="189" font-size="9.4" fill="#3a3a35">C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + 大量能量</text>
<text x="58" y="206" font-size="9.4" fill="#3a3a35">用途：发酵前期扩繁菌种，菌体数量迅速增加</text>

<rect x="446" y="152" width="330" height="70" rx="8" fill="#ffffff" stroke="#e8d5ae"/>
<text x="460" y="172" font-size="10" font-weight="700" fill="#151a21">无氧呼吸（密封发酵）</text>
<text x="460" y="189" font-size="9.4" fill="#3a3a35">C₆H₁₂O₆ → 2C₂H₅OH + 2CO₂ + 少量能量</text>
<text x="460" y="206" font-size="9.4" fill="#3a3a35">用途：酒精发酵，把糖变成酒</text>
</svg>
<span class="gx-zoomchip">点击放大</span>
</div>
<p class="gx-take">酵母菌<b>不是</b>「只进行无氧呼吸」：氧气充足时它进行有氧呼吸（产 CO₂ 和水、放能多、繁殖快），只有在无氧条件下才进行无氧呼吸产酒精。</p>
<p class="gx-note">这也解释了果酒为什么要「先通气、后密封」：前期通气是为了让酵母菌<b>繁殖到足够数量</b>，后期密封才是为了让它<b>产酒精</b>。</p>
</figure>

<figure class="gx-fig">

<span class="fig-no">图 4</span><span class="fig-t">从果酒到果醋的流程与通气要求</span>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 简答（条件 + 原因）<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">某同学用新鲜葡萄制作果酒，几天后又想接着做果醋。请回答：（1）制作果酒时需要哪些条件？（2）为什么果醋制作后期要通气？（3）若把发酵温度一直控制在 40 ℃，结果会怎样？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 定位菌种</p>
<p class="s-b">先认菌，再谈条件。果酒靠<b>酵母菌</b>（兼性厌氧的真核生物），果醋靠<b>醋酸菌</b>（好氧的原核生物）。菌种一换，氧气和温度的要求全变。</p>
<p class="s-k">用到：果酒—酵母菌；果醋—醋酸菌。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 逐条列条件</p>
<p class="s-b">果酒四个条件：①菌种——酵母菌；②氧气——<b>无氧</b>（密封，先通气扩繁再密封）；③温度——18–30 ℃；④原料与卫生——新鲜葡萄、榨汁后装瓶留 1/3 空间、器具消毒。</p>
<p class="s-k">用到：无氧呼吸产乙醇；温度影响酶活性。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 解释通气</p>
<p class="s-b">醋酸菌是<b>好氧细菌</b>，它把乙醇氧化成醋酸的过程需要氧气参与；通气还给发酵液供氧、帮助散热。一旦密封，醋酸菌因缺氧而死亡，产酸停止。所以「后期通气」不是可选操作，而是产醋的前提。</p>
<p class="s-k">用到：醋酸菌必须有氧；缺氧会死亡。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 处理 40 ℃ 的陷阱</p>
<p class="s-b">温度过高不会「发酵更快」：酶和菌体蛋白质变性，<b>菌种被杀死</b>，两种发酵都进行不下去；且高温更适合杂菌繁殖，容易腐败。</p>
<p class="s-k">用到：温度过高 → 蛋白质变性 → 菌种死亡。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 写成答题卡</p>
<p class="s-b">按「条件分点 + 原因一句」的结构落笔，不要把原因塞进条件里，也不要漏掉温度区间。</p>
<p class="s-k">用到：分点作答、术语到位。</p>
</li>
</ol>

</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）①菌种：酵母菌；②氧气：无氧（密封发酵，前期通气使菌体大量繁殖）；③温度：18–30 ℃；④原料：新鲜葡萄，榨汁后装瓶并留约 1/3 空间。<br>（2）醋酸菌是好氧细菌，把乙醇氧化为醋酸需要氧气；持续通气才能保证醋酸菌正常代谢，密封会因缺氧使醋酸菌死亡、停止产酸。<br>（3）40 ℃ 超出两种菌的适宜温度，酶和蛋白质变性，菌种被杀死，发酵停止（且易被杂菌污染而腐败）。</p>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">酵母菌在有氧和无氧时，产物有什么不同？</p>
<p class="a">有氧时进行<b>有氧呼吸</b>：葡萄糖彻底氧化成 <b>CO₂ 和 H₂O</b>，释放大量能量，菌体大量繁殖；无氧时进行<b>无氧呼吸</b>：葡萄糖分解成<b>酒精和 CO₂</b>，只释放少量能量。同一份糖，氧气决定走哪条路。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="酵母菌有氧产二氧化碳和水，无氧产酒精和二氧化碳">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="18" y="30" font-size="9" font-weight="700" fill="#2f8a5b">有氧 →</text>
<text x="70" y="30" font-size="8.4" fill="#3a3a35">CO₂ + H₂O + 大量能量</text>
<text x="18" y="54" font-size="9" font-weight="700" fill="#b8791f">无氧 →</text>
<text x="70" y="54" font-size="8.4" fill="#3a3a35">酒精 + CO₂ + 少量能量</text>
<text x="18" y="80" font-size="8.2" fill="#6b7683">用途：有氧扩繁菌种，无氧产酒</text>
<text x="18" y="98" font-size="8.2" fill="#6b7683">共性：两个过程都产生 CO₂</text>
<text x="18" y="114" font-size="8.2" fill="#b8402f">所以「酵母菌只进行无氧呼吸」是错的</text>
</svg>
</div>

<div class="qac">
<p class="q">醋酸菌需要氧气吗？</p>
<p class="a">需要，而且是<b>必需</b>：醋酸菌是<b>好氧细菌</b>，只有在氧气充足时才能把乙醇氧化成醋酸；缺氧时它不能进行正常代谢，甚至会死亡。因此果醋发酵要<b>持续通气</b>。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="醋酸菌在有氧条件下把乙醇氧化为醋酸">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<rect x="18" y="44" width="74" height="38" rx="6" fill="#ffffff" stroke="#b8402f"/>
<text x="55" y="60" font-size="8.6" font-weight="700" fill="#151a21" text-anchor="middle">醋酸菌</text>
<text x="55" y="74" font-size="8" fill="#3a3a35" text-anchor="middle">好氧细菌</text>
<path d="M96 63 L150 63" stroke="#8a939d" stroke-width="1.1"/>
<path d="M150 59 L156 63 L150 67 Z" fill="#8a939d"/>
<text x="106" y="55" font-size="8.2" font-weight="700" fill="#2f8a5b">O₂ + 乙醇</text>
<rect x="158" y="44" width="60" height="38" rx="6" fill="#ffffff" stroke="#c9d8ea"/>
<text x="188" y="60" font-size="8.6" font-weight="700" fill="#151a21" text-anchor="middle">醋酸</text>
<text x="188" y="74" font-size="8" fill="#3a3a35" text-anchor="middle">+ H₂O</text>
<text x="18" y="102" font-size="8.2" fill="#6b7683">通气 = 供氧 + 散热，断气就停产</text>
</svg>
</div>

<div class="qac">
<p class="q">泡菜坛为什么要密封，还要用水封住坛沿？</p>
<p class="a">乳酸菌是<b>严格厌氧</b>菌，氧气会抑制它、却利于杂菌和霉菌繁殖。密封造成无氧环境，让乳酸菌独占发酵；坛沿水封既<b>阻止外界氧气进入</b>，又允许发酵产生的 CO₂ 顶出（气泡从水中逸出），避免坛内气压过高。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="泡菜坛水封阻止氧气进入，保证乳酸菌无氧发酵">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<path d="M84 88 L84 52 Q84 38 100 38 L140 38 Q156 38 156 52 L156 88 Z" fill="#ffffff" stroke="#6b7683"/>
<rect x="72" y="34" width="96" height="10" rx="3" fill="#dbe7ef" stroke="#8a939d"/>
<text x="120" y="104" font-size="8.4" fill="#3a3a35" text-anchor="middle">坛沿水封：挡氧、放气</text>
<text x="30" y="30" font-size="8.2" fill="#b8402f">O₂ ✗</text>
<text x="168" y="30" font-size="8.2" fill="#2f8a5b">CO₂ ↑</text>
<text x="120" y="122" font-size="8.2" fill="#6b7683" text-anchor="middle">乳酸菌严格厌氧 → 产乳酸</text>
</svg>
</div>

<div class="qac">
<p class="q">温度越高，发酵是不是越快？</p>
<p class="a">不是。温度升高在一定范围内确实加快反应，但超过适宜温度后，酶和菌体的<b>蛋白质变性</b>，菌种被<b>杀死</b>，发酵反而停止，还会给杂菌可乘之机。所以果酒控在 18–30 ℃、果醋 30–35 ℃，不是「越高越好」。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="温度超过最适点后活性骤降，高温使菌种死亡">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<path d="M26 108 L26 92 Q52 60 74 52 Q96 46 110 62 Q124 80 132 96 L150 104" stroke="#2f8a5b" stroke-width="1.6" fill="none"/>
<path d="M196 66 L196 108" stroke="#b8402f" stroke-width="1" stroke-dasharray="3 3"/>
<text x="150" y="52" font-size="8.2" fill="#2f8a5b">最适</text>
<text x="200" y="60" font-size="8.2" fill="#b8402f">40 ℃</text>
<text x="26" y="122" font-size="8" fill="#6b7683">适宜温度</text>
<text x="150" y="122" font-size="8" font-weight="700" fill="#b8402f">高温失活</text>
</svg>
</div>

<div class="qac">
<p class="q">果酒「变」成果醋，需要什么条件？</p>
<p class="a">三个条件同时变：<b>换菌种</b>（酵母菌→醋酸菌）、<b>换氧气</b>（密封→持续通气）、<b>升温度</b>（18–30 ℃→30–35 ℃）。三者缺一，乙醇就氧化不成醋酸。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="果酒在通气和适宜温度下经醋酸菌变成醋">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<rect x="16" y="48" width="62" height="36" rx="6" fill="#ffffff" stroke="#2f8a5b"/>
<text x="47" y="70" font-size="8.8" font-weight="700" fill="#151a21" text-anchor="middle">果酒</text>
<rect x="162" y="48" width="62" height="36" rx="6" fill="#ffffff" stroke="#b8402f"/>
<text x="193" y="70" font-size="8.8" font-weight="700" fill="#151a21" text-anchor="middle">果醋</text>
<path d="M82 66 L148 66" stroke="#8a939d" stroke-width="1.1"/>
<path d="M148 62 L154 66 L148 70 Z" fill="#8a939d"/>
<text x="115" y="52" font-size="7.8" fill="#3a3a35" text-anchor="middle">醋酸菌</text>
<text x="115" y="44" font-size="7.6" fill="#b8402f" text-anchor="middle">通气 + 30–35 ℃</text>
<text x="18" y="102" font-size="8.2" fill="#6b7683">酒味变淡、出现酸味 = 转醋信号</text>
</svg>
</div>

<div class="qac">
<p class="q">传统发酵为什么强调用新鲜原料？</p>
<p class="a">传统发酵靠原料<b>自带的菌群</b>自然发酵，不接种纯种。新鲜原料<b>杂菌少、营养充足</b>，有利菌能迅速成为优势种；原料不新鲜则杂菌基数大，容易腐败、产异味或有毒物质（如亚硝酸盐、霉菌毒素）。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="新鲜原料杂菌少，有利菌容易成为优势种">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="18" y="30" font-size="8.6" font-weight="700" fill="#2f8a5b">新鲜原料</text>
<text x="80" y="30" font-size="8.2" fill="#3a3a35">杂菌少 + 营养足</text>
<text x="18" y="56" font-size="8.6" font-weight="700" fill="#2f8a5b">→</text>
<text x="40" y="56" font-size="8.2" fill="#3a3a35">有利菌迅速成为优势种</text>
<text x="18" y="82" font-size="8.2" fill="#b8402f">原料不新鲜 → 杂菌基数大</text>
<text x="18" y="100" font-size="8.2" fill="#6b7683">→ 腐败、异味、亚硝酸盐超标</text>
<text x="18" y="118" font-size="8" fill="#6b7683">传统发酵 ≠ 纯种发酵，靠的是菌群竞争</text>
</svg>
</div>
</div>
<p class="gx-note">收尾点明：这六问其实是同一件事——<b>先认清菌种，再算氧气的账，最后核对温度</b>。凡是「菌种 + 氧气 + 温度」三件事都对上的选项，才是对的。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 醋酸菌是厌氧菌，果醋要密封发酵。</p>
<p class="er-v">✓ 醋酸菌是好氧细菌，果醋制作要持续通气；缺氧时醋酸菌会死亡。</p>
<p class="er-w">错在哪：把醋酸菌的氧气要求记反了。三种菌里只有乳酸菌是严格厌氧，醋酸菌恰恰离不开氧。</p>
</div>
<div class="er">
<p class="er-x">✗ 酵母菌只进行无氧呼吸，所以果酒要密封。</p>
<p class="er-v">✓ 酵母菌是兼性厌氧菌：有氧时有氧呼吸（产 CO₂ 和 H₂O、繁殖快），无氧时无氧呼吸产酒精。</p>
<p class="er-w">错在哪：漏掉「兼性」。正因为兼性，果酒才要「先通气扩繁、后密封产酒」。</p>
</div>
<div class="er">
<p class="er-x">✗ 泡菜坛要经常开盖放气，不然会爆。</p>
<p class="er-v">✓ 泡菜坛要密封，坛沿用水封：既隔绝氧气，又让 CO₂ 自行逸出。</p>
<p class="er-w">错在哪：开盖会让氧气进入，抑制乳酸菌、促进杂菌和霉菌繁殖，泡菜会烂。</p>
</div>
<div class="er">
<p class="er-x">✗ 温度越高，发酵越快，产酒越多。</p>
<p class="er-v">✓ 温度过高会使酶和蛋白质变性、菌种死亡，发酵停止；果酒应控在 18–30 ℃。</p>
<p class="er-w">错在哪：把「升温加快反应」外推到所有温度，忽略了高温使菌失活这一上限。</p>
</div>
<div class="er">
<p class="er-x">✗ 果醋制作后期不需要通气，反正酒精已经在了。</p>
<p class="er-v">✓ 果醋后期必须持续通气，因为醋酸菌把乙醇氧化成醋酸的过程需要氧气。</p>
<p class="er-w">错在哪：把「有乙醇」当成产醋的充分条件，忽略了醋酸菌必须有氧。</p>
</div>
<div class="er">
<p class="er-x">✗ 果酒发酵要先密封、再通气，这样酒才香。</p>
<p class="er-v">✓ 果酒发酵是先通气（使酵母菌大量繁殖）、后密封（无氧产酒精）。</p>
<p class="er-w">错在哪：顺序颠倒。先密封则菌体数量不足，发酵缓慢、易被杂菌污染。</p>
</div>
<div class="er">
<p class="er-x">✗ 发酵就是腐败，都是微生物把东西弄坏了。</p>
<p class="er-v">✓ 发酵是人们利用微生物、在适宜条件下把原料转化为所需产物的过程；腐败是产物不为人类所需的过程。</p>
<p class="er-w">错在哪：丢了「人利用」「条件适宜」「产物有用」三个限定，两者只差在目的与产物。</p>
</div>
</div>

<script>
/* xx3-c1-s1 传统发酵技术的应用：温度 T → 酵母菌 / 乳酸菌相对活性 */
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var GX = window.GX, el = GX.el, tx = GX.tx, $ = GX.$;
  var stage = $("gxStage");
  if (!stage || !window.AutoPilot) return;
  var W = { vb: "0 0 880 470" }, N = { vb: "0 0 360 700" };
  var L = W, A = 28, G = null, GR = "#2f8a5b", AM = "#b8791f";

  /* 纯函数：T（℃）→ 两种菌的相对活性（%） */
  function calc(T) {
    var y = 100 * Math.exp(-Math.pow(T - 28, 2) / 50);
    var l = 100 * Math.exp(-Math.pow(T - 37, 2) / 60);
    return { T: T, yeast: Math.round(y * 10) / 10, lacto: Math.round(l * 10) / 10 };
  }

  function geom() {
    if (L === W) return {
      lp: { x: 16, y: 16, w: 424, h: 438 }, rp: { x: 456, y: 16, w: 408, h: 438 },
      plot: { x0: 66, x1: 408, y0: 76, y1: 396 },
      bar: { x: 476, w: 252, y1: 104, y2: 194, h: 24 },
      note: { x: 476, y: 250, lh: 24 }, tl: 422, fs: 9.6
    };
    return {
      lp: { x: 8, y: 8, w: 344, h: 300 }, rp: { x: 8, y: 320, w: 344, h: 372 },
      plot: { x0: 54, x1: 332, y0: 62, y1: 246 },
      bar: { x: 28, w: 210, y1: 404, y2: 494, h: 22 },
      note: { x: 28, y: 552, lh: 22 }, tl: 268, fs: 8.8
    };
  }

  function px(T) { var p = G.plot; return p.x0 + (T - 15) / 25 * (p.x1 - p.x0); }
  function py(v) { var p = G.plot; return p.y1 - v / 100 * (p.y1 - p.y0); }

  function state(T) {
    if (T >= 39) return { k: "菌种危险", s: "高温使蛋白质变性", c: "#b8402f", bg: "#fbeae7" };
    if (T < 20) return { k: "两种都慢", s: "低于最适，发酵缓慢", c: AM, bg: "#fdf3e0" };
    if (T < 25) return { k: "酵母偏优", s: "酵母活跃，乳酸受抑", c: AM, bg: "#fdf3e0" };
    if (T <= 30) return { k: "酵母最适", s: "适合果酒 18–30 ℃", c: GR, bg: "#e6f6ee" };
    if (T < 35) return { k: "交替区间", s: "酵母降、乳酸升", c: AM, bg: "#fdf3e0" };
    if (T <= 38) return { k: "乳酸最适", s: "适合泡菜、酸奶", c: GR, bg: "#e6f6ee" };
    return { k: "交替区间", s: "酵母降、乳酸升", c: AM, bg: "#fdf3e0" };
  }

  function draw(s) {
    var gA = $("gxA"), gB = $("gxB"), p = G.plot, b = G.bar, i, t, d, pts, rows;
    gA.textContent = ""; gB.textContent = "";
    el("rect", { x: G.lp.x, y: G.lp.y, width: G.lp.w, height: G.lp.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    el("rect", { x: G.rp.x, y: G.rp.y, width: G.rp.w, height: G.rp.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    tx(gA, G.lp.x + 20, G.lp.y + 28, "温度 → 相对活性（%）：两条最适温度不同的曲线", "#5a6472", "start", 10.5, 700);
    tx(gB, G.rp.x + 20, G.rp.y + 28, "此刻两种菌的活性", "#5a6472", "start", 10.5, 700);

    /* 坐标轴与刻度 */
    [0, 50, 100].forEach(function (v) {
      el("line", { x1: p.x0, y1: py(v), x2: p.x1, y2: py(v), stroke: "#e8eef4" }, gA);
      tx(gA, p.x0 - 8, py(v) + 3.4, String(v), "#8a939d", "end", 8.6, 400);
    });
    el("path", { d: "M" + p.x0 + " " + p.y0 + " L" + p.x0 + " " + p.y1 + " L" + p.x1 + " " + p.y1, fill: "none", stroke: "#8a939d" }, gA);
    for (t = 15; t <= 40; t += 5) {
      el("line", { x1: px(t), y1: p.y1, x2: px(t), y2: p.y1 + 4, stroke: "#8a939d" }, gA);
      tx(gA, px(t), G.tl, String(t), "#8a939d", "middle", 8.6, 400);
    }
    tx(gA, p.x1, G.tl + 18, "温度 / ℃", "#8a939d", "end", 8.6, 400);

    /* 两条曲线与最适点 */
    [[function (x) { return calc(x).yeast; }, GR], [function (x) { return calc(x).lacto; }, AM]].forEach(function (q) {
      pts = [];
      for (i = 15; i <= 40.001; i += 0.5) pts.push(px(i).toFixed(1) + " " + py(q[0](i)).toFixed(1));
      el("path", { d: "M" + pts.join(" L"), fill: "none", stroke: q[1], "stroke-width": 2, "stroke-linejoin": "round" }, gA);
    });
    el("circle", { cx: px(28), cy: py(100), r: 3.4, fill: GR }, gA);
    el("circle", { cx: px(37), cy: py(100), r: 3.4, fill: AM }, gA);
    tx(gA, px(28) - 8, py(100) - 10, "酵母菌 28 ℃", GR, "end", 9.4, 700);
    tx(gA, px(37) + 6, py(100) + 16, "乳酸菌 37 ℃", AM, "start", 9.4, 700);

    /* 当前温度：竖线 + 两个交点 */
    d = { x1: px(A), y1: p.y0, x2: px(A), y2: p.y1, stroke: "#151a21", "stroke-dasharray": "3 3" };
    el("line", d, gA);
    el("circle", { cx: px(A), cy: py(s.yeast), r: 4, fill: "#fff", stroke: GR, "stroke-width": 2 }, gA);
    el("circle", { cx: px(A), cy: py(s.lacto), r: 4, fill: "#fff", stroke: AM, "stroke-width": 2 }, gA);
    tx(gA, px(A) + (A > 33 ? -6 : 6), p.y0 - 6, "T = " + Math.round(A) + " ℃", "#151a21", A > 33 ? "end" : "start", 9.4, 700);

    /* 两根活性条 */
    rows = [{ k: "酵母菌", v: s.yeast, c: GR, y: b.y1, d: "最适 28 ℃" }, { k: "乳酸菌", v: s.lacto, c: AM, y: b.y2, d: "最适 37 ℃" }];
    rows.forEach(function (r) {
      tx(gB, b.x, r.y - 12, r.k + "（" + r.d + "）", "#3a3a35", "start", 9.6, 700);
      el("rect", { x: b.x, y: r.y, width: b.w, height: b.h, rx: 4, fill: "#f2f5f8", stroke: "#e2e8ee" }, gB);
      el("rect", { x: b.x, y: r.y, width: Math.max(1, b.w * r.v / 100), height: b.h, rx: 4, fill: r.c, opacity: 0.82 }, gB);
      tx(gB, b.x + b.w + 8, r.y + b.h * 0.68, r.v.toFixed(0) + "%", r.c, "start", 9.6, 700);
    });

    /* 结论区 */
    ["T=28 ℃：酵母菌 100%，乳酸菌 26%", "T=37 ℃：乳酸菌 100%，酵母菌 20%", "峰位不同 → 控温决定谁占优势"].forEach(function (s2, k) {
      tx(gB, G.note.x, G.note.y + k * G.note.lh, s2, k === 2 ? "#6b7683" : "#3a3a35", "start", G.fs, 400);
    });
    tx(gB, G.note.x, G.note.y + 3 * G.note.lh, "超过 39 ℃ 两条都低：菌被杀死，不是更快", "#b8402f", "start", G.fs, 400);
  }

  function render() {
    if (!G) { L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N; G = geom(); }
    var s = calc(A), st = state(A);
    $("gxVa").textContent = String(Math.round(A));
    $("gxVb").textContent = s.yeast.toFixed(0) + "%";
    $("gxVc").textContent = s.lacto.toFixed(0) + "%";
    $("gxVs").textContent = st.k;
    $("gxVsn").textContent = st.s;
    $("gxStBox").style.background = st.bg;
    $("gxStBox").style.borderColor = st.c + "44";
    $("gxVs").style.color = st.c;
    draw(s);
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    G = geom();
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  var sl = $("gxSl");
  sl.addEventListener("input", function () { A = +sl.value; render(); });
  stage.addEventListener("click", function () {
    var keys = [15, 25, 28, 37, 40], i;
    for (i = 0; i < keys.length; i++) if (keys[i] > A) { A = keys[i]; sl.value = A; render(); return; }
    A = keys[0]; sl.value = A; render();
  });

  /* 停留帧 T=28（4–6.5 s）：酵母 100%，乳酸菌 26% */
  var ap = AutoPilot.create({
    mount: stage, follow: sl,
    loop: [{ t: 0, v: 15 }, { t: 1.2, v: 15 }, { t: 4, v: 28 }, { t: 6.5, v: 28 }, { t: 9, v: 40 }, { t: 11, v: 35 }, { t: 13, v: 15 }],
    keys: [15, 25, 28, 37, 40], value: A, min: 15, max: 40, step: 1, idle: 5000,
    onChange: function (v) { A = v; render(); }, onMode: setMode
  });
  window.__ap = ap;

  /* 断言：数值全部来自 calc */
  window.__model = window.__bio = { calc: calc, cases: [
    { v: 28, eq: { yeast: 100 } },
    { v: 37, eq: { lacto: 100 } },
    { v: 25, eq: { yeast: 83.5 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
