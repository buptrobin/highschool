<p class="gx-lede">上一节讲清了反射弧的五个环节，这一节把镜头推进到一条神经纤维的膜上：同一张膜，静息时是「外正内负」，兴奋时翻转成「外负内正」，靠的是两种离子走两个方向。整节最容易错的只有三件事——把 K⁺ 和 Na⁺ 记反、以为刺激越强动作电位越高、以为兴奋在神经纤维上也单向跑。这三件事在这一页里各出现两次以上，读完请自己复述一遍。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 静息电位<span class="q-src">人教版（2019）选择性必修1 · 第2章第3节</span></p>
<p class="q-b">静息时，神经纤维膜电位表现为外正内负，称为静息电位，主要由 K⁺ 外流形成。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个条件</b>组成：① 状态是「静息」（没有刺激）；② 表现是「外正内负」；③ 原因是「K⁺ 外流」——不是 Na⁺ 内流，也不是「膜内外没有离子」。少写第③条，「主要由」就变成了「仅仅由」，遇到「还与其他离子有关」的选项会判错。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 动作电位<span class="q-src">人教版（2019）选择性必修1 · 第2章第3节</span></p>
<p class="q-b">受刺激后，Na⁺ 内流，膜电位变为外负内正，形成动作电位。</p>
<p class="q-n">→ 翻成人话：同样是<b>三个条件</b>：① 前提是「受刺激且达到阈值」；② 原因是「Na⁺ 内流」；③ 结果是「外负内正」，即膜内电位由负变正、膜外由正变负。注意「内流」两个字是判分点——写「Na⁺ 外流」或「K⁺ 内流」一律零分。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 全或无<span class="q-src">人教版（2019）选择性必修1 · 第2章第3节</span></p>
<p class="q-b">动作电位具有「全或无」的特点：刺激达到阈值就产生，且幅度不随刺激强度增大而增大。</p>
<p class="q-n">→ 翻成人话：两个条件缺一不可：① 「达到阈值就产生」说的是<b>有无</b>——阈值以下一点都没有，一到阈值立刻满幅；② 「幅度不随强度增大」说的是<b>大小</b>——阈值以上的刺激只改变放电频率，不改变单个动作电位的高度。很多人只记住前半句，于是答成「刺激越强幅度越大」。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>静息电位</th><th>动作电位</th></tr></thead>
<tbody>

<tr class="key"><td>主要离子与流向</td><td>K⁺ 外流（膜内 → 膜外）</td><td>Na⁺ 内流（膜外 → 膜内）</td></tr>
<tr><td>通道状态</td><td>K⁺ 通道开放，Na⁺ 通道关闭</td><td>Na⁺ 通道大量开放，随后 K⁺ 通道开放</td></tr>
<tr><td>典型数值</td><td><span class="gx-fml">约 −70 mV</span></td><td><span class="gx-fml">峰值约 +30 mV</span></td></tr>
<tr><td>与刺激强度的关系</td><td>与刺激无关，始终维持</td><td>全或无：幅度不随强度增大</td></tr>
<tr><td>恢复靠什么</td><td>K⁺ 外流达到平衡</td><td>Na⁺-K⁺ 泵主动运输，耗 ATP</td></tr>

</div>
<p class="gx-note">背法：整张表只看高亮那一行——<b>静息 K⁺ 往外走，兴奋 Na⁺ 往里走</b>。写反了，后面所有推导都跟着错。口径提醒：「主要由 K⁺ 外流形成」里的「主要」不能删，膜上还有少量其他离子参与，但中学阶段只考 K⁺。</p>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>

<div class="gx-ex">
<p class="ex-t">例题 · 全或无与传导方向<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">给一条离体的神经纤维施加刺激：<br>（1）刺激强度刚好达到阈值后，再增大到 3 倍，动作电位的幅度会增大吗？说明理由。<br>（2）若刺激强度低于阈值，会出现什么现象？<br>（3）在纤维中段刺激，兴奋向哪个方向传导？若在突触处，又能向哪个方向传递？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性</p>
<p class="s-b">题目问的是「幅度」，不是「有没有」。凡是问幅度、峰高、大小的，直接锁定课本那句话：动作电位具有全或无的特点。</p>
<p class="s-k">用到：动作电位的全或无。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 分两种情况作答</p>
<p class="s-b">阈值以下：没有动作电位，只有局部电位，幅度为 0；阈值及以上：立即产生动作电位，且幅度恒定。所以「刚好阈值」和「阈值的 3 倍」产生的是同一个高度的动作电位。</p>
<p class="s-k">用到：<span class="gx-fml">I ≥ 阈值 → 幅度恒定</span>。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 说清「那变的是什么」</p>
<p class="s-b">刺激增强真正改变的是单位时间内动作电位的次数，也就是放电频率；幅度不变。答题时补上这一句，才不会被追问扣分。</p>
<p class="s-k">用到：幅度与频率是两个量。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 分开写传导方向</p>
<p class="s-b">神经纤维上：兴奋由刺激点向两侧传导，是双向的。突触处：递质只能由突触前膜释放作用于后膜受体，是单向的。两个空各占一分，不要合并成一句「单向传导」。</p>
<p class="s-k">用到：纤维双向、突触单向。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 4</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）不会增大。动作电位具有全或无的特点：刺激未达到阈值时不产生动作电位；一旦达到阈值即产生动作电位，且其幅度不随刺激强度的增大而增大。刺激增强只会使单位时间内产生的动作电位次数（频率）增多。<br>（2）不产生动作电位，仅在刺激部位出现局部电位（电位变化幅度小、不能远距离传导）。<br>（3）在神经纤维中段刺激，兴奋沿纤维向两侧传导，即双向传导；在突触处，神经递质只能由突触前膜释放并作用于突触后膜上的受体，因此只能单向传递。</p>

<p class="er-w">错在哪：把静息和兴奋的离子记反了。静息往外（K⁺ 出），兴奋往里（Na⁺ 进）——「静出兴进」四个字先记牢。</p>
</div>
<div class="er">
<p class="er-x">✗ 动作电位是由 K⁺ 外流形成的。</p>
<p class="er-v">✓ 受刺激后 Na⁺ 内流，膜电位变为外负内正，形成动作电位。</p>
<p class="er-w">错在哪：K⁺ 外流负责的是<b>复极化</b>（下降段）和静息电位，不是动作电位的上升段。一个动作电位里两种离子都要出场，别只认一个。</p>
</div>
<div class="er">
<p class="er-x">✗ 刺激越强，动作电位的幅度越大。</p>
<p class="er-v">✓ 动作电位具有全或无的特点，达到阈值后幅度不随刺激强度增大而增大，刺激增强只使放电频率升高。</p>
<p class="er-w">错在哪：把「频率」当成了「幅度」。作图题里画出「刺激越强峰越高」，这一整问的分就没了。</p>
</div>
<div class="er">
<p class="er-x">✗ 兴奋在神经纤维上是单向传导的。</p>
<p class="er-v">✓ 兴奋在神经纤维上双向传导，在突触处才单向传递。</p>
<p class="er-w">错在哪：把突触的性质套到了纤维上。题干只要出现「离体神经纤维中段刺激」，答案一定是双向。</p>
</div>
<div class="er">
<p class="er-x">✗ 兴奋在突触处可以双向传递。</p>
<p class="er-v">✓ 神经递质只能由突触前膜释放，作用于突触后膜上的受体，故突触处单向传递。</p>
<p class="er-w">错在哪：只看「间隙很窄、递质能扩散」，没看递质装在谁家里。方向由结构决定，不由距离决定。</p>
</div>
<div class="er">
<p class="er-x">✗ 静息电位就是零，膜内外电位相等。</p>
<p class="er-v">✓ 静息电位是外正内负的电位差，约 −70 mV，不是零。</p>
<p class="er-w">错在哪：把「电荷总量大致相等」当成「电位相等」。有电位差才有「外正内负」这个说法，写成零就自相矛盾。</p>
</div>
<div class="er">
<p class="er-x">✗ 静息电位的形成需要消耗 ATP，所以静息时也在耗能。</p>
<p class="er-v">✓ 静息电位主要由 K⁺ 外流（协助扩散）形成，不直接耗能；恢复和维持膜内外离子浓度差靠 Na⁺-K⁺ 泵主动运输，才消耗 ATP。</p>
<p class="er-w">错在哪：把「维持浓度差」和「形成电位差」混成一件事。前者耗能，后者不耗能。</p>
</div>
</div>
