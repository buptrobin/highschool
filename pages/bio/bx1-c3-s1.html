<span><i></i>人教版（2019）必修1 第3章第1节</span>

<p class="gx-lede">第3章从「边界」讲起：细胞里的细胞器要先有膜，才有内外之分，才有分工。这一节把三件事一次讲完——细胞膜<b>有哪些功能</b>、<b>由什么组成</b>（流动镶嵌模型）、以及<b>结构特点与功能特性</b>这对最容易写反的词。真正扣分的不是概念本身，而是把「流动性」和「选择透过性」的位置写反、把糖蛋白画到膜内侧、把蛋白质说成基本支架。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 细胞膜的功能<span class="q-src">人教版（2019）必修1 · 第3章第1节</span></p>
<p class="q-b">细胞膜的功能是：将细胞与外界环境分隔开；控制物质进出细胞；进行细胞间的信息交流。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个并列的动词短语</b>组成（①分隔 ②控制进出 ③信息交流），少写一个就丢一个采分点。写法上有两处必须抠字：<b>「控制」不是「阻止」</b>——写「阻止所有物质进出」全句作废；<b>「信息交流」</b>不能说成「物质交换」，那是运输功能，不是信息功能。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 成分与支架<span class="q-src">人教版（2019）必修1 · 第3章第1节</span></p>
<p class="q-b">细胞膜主要由脂质和蛋白质组成，此外，还有少量的糖类。磷脂双分子层构成了膜的基本支架。</p>
<p class="q-n">→ 翻成人话：两个「主要/基本」的位置不能挪。搭骨架的是<b>磷脂双分子层</b>；蛋白质是<b>镶在表面、部分或全部嵌入、贯穿</b>在支架上的功能分子（运输、识别、催化）；糖类量很少，只以糖蛋白、糖脂的形式挂在<b>膜的外侧</b>。凡是把「基本支架」写成蛋白质的，都是把承重墙和家电换了位置。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 结构特点与功能特性<span class="q-src">人教版（2019）必修1 · 第3章第1节</span></p>
<p class="q-b">细胞膜的结构特点是具有一定的流动性，功能特性是选择透过性。</p>
<p class="q-n">→ 翻成人话：同一句话里套着两个判断，主语不同。流动性回答<b>「膜本身长什么样、能不能动」</b>（结构）；选择透过性回答<b>「什么能过、什么不能过」</b>（功能）。答题必须写成「结构特点是……，功能特性是……」，两个词一换位，整句零分。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>甲：结构特点</th><th>乙：功能特性</th></tr></thead>
<tbody>
<tr><td>叫什么</td><td>具有一定的流动性</td><td>选择透过性</td></tr>
<tr><td>回答什么</td><td>膜本身是什么样、会不会动</td><td>膜允许什么通过、不允许什么通过</td></tr>
<tr><td>证据</td><td>人鼠细胞融合，荧光标记 40 分钟后均匀分布</td><td>细胞需要的物质能进入，不需要的、有害的不易进入，代谢废物排出</td></tr>
<tr class="key"><td>一句话区分</td><td>「会动」——磷脂和大多数蛋白质能运动</td><td>「会挑」——有选择、有方向</td></tr>
<tr><td>受温度影响</td><td>低温变「僵」，超过一定温度结构受损</td><td>随结构受损而下降，载体蛋白决定「挑什么」</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">背法：<b>结构＝会动，功能＝会挑</b>。判断题里看到「结构特点」就想到磷脂双分子层和膜蛋白的运动，看到「功能特性」就想到跨膜运输的选择性。整张表只有一行是真正的分界线，其余都是它的展开。</p>
</section>

<h2><span class="sn">04</span>一道题走一遍</h2>

<div class="gx-ex">
<p class="ex-t">例题 · 实验结论表述（人鼠细胞融合）<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">用荧光染料分别标记人细胞和鼠细胞的膜蛋白，将两种细胞融合，40 分钟后发现两种荧光在融合细胞表面均匀分布。<br>（1）该实验说明细胞膜具有什么特点？<br>（2）若把融合细胞放在低温下培养，均匀分布需要更长时间，说明什么？<br>（3）该实验能否说明细胞膜的选择透过性？为什么？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题：抓住「标记的是谁」</p>
<p class="s-b">荧光染料标记的是<b>膜蛋白</b>，不是磷脂，也不是整个膜。所以荧光出现在哪里，就说明膜蛋白在哪里。</p>
<p class="s-k">用到：膜蛋白的存在与位置</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 定性：从「各在各的」到「均匀」</p>
<p class="s-b">融合初期，人源蛋白和鼠源蛋白各占半边；40 分钟后两种荧光混匀，说明膜蛋白<b>从一侧移动到了整个膜表面</b>。只有能运动的膜才能出现这个结果。</p>
<p class="s-k">用到：流动镶嵌模型——蛋白质可以运动</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 落到术语：这是「结构特点」</p>
<p class="s-b">膜蛋白能运动，说明构成膜的分子不是固定不动的，细胞膜<b>具有一定的流动性</b>。这是<b>结构特点</b>，回答「膜本身是什么样」。</p>
<p class="s-k">用到：结构特点＝具有一定的流动性</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 第（2）问：温度变了，变的是「快慢」</p>
<p class="s-b">低温下均匀分布需要更长时间，说明<b>低温使膜流动性降低</b>，膜蛋白运动变慢。注意只答「变慢」，不要答成「低温下膜不流动了」——低温是减慢，不是取消。</p>
<p class="s-k">用到：流动性受温度影响</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 第（3）问：别把两个特性混用</p>
<p class="s-b">不能。选择透过性是<b>功能特性</b>，要看细胞对<b>不同物质</b>能否通过、通过多少；本实验只观察了膜蛋白的<b>位置变化</b>，没有测任何物质的跨膜运输。看到「荧光均匀分布」就写「选择透过性」，是把结构现象当功能证据。</p>
<p class="s-k">用到：结构特点 ≠ 功能特性</p>
</li>
</ol>

<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 糖蛋白分布在细胞膜的内侧，可以用来识别细胞内的物质。</p>
<p class="er-v">✓ 糖蛋白（糖链）只分布在细胞膜的外侧，与细胞识别、信息交流有关。</p>
<p class="er-w">错在哪：<b>糖链朝细胞外</b>，因为它面对的是外界环境中的信号分子和其他细胞。这一条几乎每年都在「判断膜内外」题里出现，画反了整题连带失分。</p>
</div>
<div class="er">
<p class="er-x">✗ 细胞膜的功能特性是具有一定的流动性。</p>
<p class="er-v">✓ 细胞膜的结构特点是具有一定的流动性，功能特性是选择透过性。</p>
<p class="er-w">错在哪：两个特性<b>换位</b>了。记法：结构＝会动，功能＝会挑。填空题按空给分，写反即零分。</p>
</div>
<div class="er">
<p class="er-x">✗ 蛋白质构成了细胞膜的基本支架。</p>
<p class="er-v">✓ 磷脂双分子层构成了细胞膜的基本支架，蛋白质镶在表面、嵌入或贯穿其中。</p>
<p class="er-w">错在哪：把承重墙和家电换了位置。<b>基本支架＝磷脂双分子层</b>，蛋白质是功能分子，糖类量很少。</p>
</div>
<div class="er">
<p class="er-x">✗ 温度越高，细胞膜的流动性越好，功能也越强。</p>
<p class="er-v">✓ 在一定范围内温度升高使膜流动性增大；超过一定温度，蛋白质变性、膜结构受损，选择透过性下降。</p>
<p class="er-w">错在哪：只看了流动性这一条曲线。流动性一直在升，<b>功能完整性</b>在高温段是往下掉的——「流动」不等于「能用」。</p>

<div class="er">
<p class="er-x">✗ 细胞膜是静止不动的，所以能起到保护作用。</p>
<p class="er-v">✓ 细胞膜具有一定的流动性，磷脂分子和大多数蛋白质都可以运动。</p>
<p class="er-w">错在哪：「静止」是旧模型的说法。流动镶嵌模型的核心就是<b>流动</b>二字，人鼠细胞融合实验就是为了证明它。</p>
</div>
<div class="er">
<p class="er-x">✗ 细胞膜把细胞与外界环境完全隔开，所有物质都不能自由通过。</p>
<p class="er-v">✓ 细胞膜将细胞与外界环境分隔开，并通过选择透过性控制物质进出。</p>
<p class="er-w">错在哪：混淆了<b>分隔</b>和<b>隔绝</b>。真隔绝了细胞就活不了；膜的功能恰恰是「该进的进、该出的出」。</p>
</div>
<div class="er">
<p class="er-x">✗ 因为细胞膜有流动性，所以物质都能自由通过。</p>
<p class="er-v">✓ 流动性是结构特点，选择透过性是功能特性；能否通过由膜的选择性决定，不由流动性决定。</p>
<p class="er-w">错在哪：用一个结构特点去推一个功能结论，逻辑断层。<b>流动性</b>只说明膜能变形、能运动，不说明膜让谁过。</p>

     光靠 click 不够稳，这里补一个 pointerdown 兜底（只接管，不跳关键帧） */
  stage.addEventListener("pointerdown", function () {
    if (ap.mode === "auto") ap.take();
  });

  window.__bio = { calc: calc, cases: [
    { v: 0, eq: { flu: 0, func: 70 } },
    { v: 20, eq: { flu: 47.4, func: 100 } },
    { v: 40, eq: { flu: 100, func: 100 } },
    { v: 55, eq: { flu: 100, func: 32.5 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
