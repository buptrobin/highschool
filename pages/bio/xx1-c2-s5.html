<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 大脑皮层的高级功能<span class="q-src">人教版（2019）选择性必修1 · 第2章第5节</span></p>
<p class="q-b">大脑皮层具有语言、学习、记忆和情绪等高级功能。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个条件</b>组成——①部位限定在<b>大脑皮层</b>（不是小脑、脑干）；②功能是<b>语言、学习、记忆、情绪</b>这一组；③「等」字说明不止这四项。少写「大脑皮层」，只写「大脑」，判卷时就算表述不到位。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 语言功能与言语区<span class="q-src">人教版（2019）选择性必修1 · 第2章第5节</span></p>
<p class="q-b">语言功能是人脑特有的高级功能，与大脑皮层的言语区（W 区、S 区、H 区、V 区）有关。</p>
<p class="q-n">→ 翻成人话：<b>两个条件</b>同时成立才算对——①「<b>人脑特有</b>」：动物有信息交流，但没有语言功能，这一句是选择题的固定陷阱；②「<b>与言语区有关</b>」：语言不是弥漫在整个皮层，而是落在四个相对明确的区域上，所以损一处、缺一样。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 记忆与海马区<span class="q-src">人教版（2019）选择性必修1 · 第2章第5节</span></p>
<p class="q-b">记忆的形成与多个脑区有关，其中海马区与短期记忆转化为长期记忆有关。</p>
<p class="q-n">→ 翻成人话：这句是<b>一句话拆两半</b>——前半句否掉「记忆只存在一个地方」，后半句给出海马区的具体分工（管<b>转化</b>，不是「存长期记忆的仓库」）。答题写成「记忆只存在海马区」，两半都错。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>言语区</th><th>大致位置（按课本表述）</th><th>受损后的表现</th><th>一句记法</th></tr></thead>
<tbody>
<tr><td>S 区 · 运动性言语区</td><td>中央前回下部</td><td>不能讲话（运动性失语症）</td><td>要「动嘴」的区</td></tr>
<tr class="key"><td>W 区 · 书写言语区</td><td>颞中回后部附近</td><td>不能写字（失写症）</td><td>手不瘫，却写不出字</td></tr>
<tr><td>V 区 · 视觉性言语区</td><td>枕叶</td><td>看不懂文字（失读症）</td><td>眼不瞎，却不认字</td></tr>
<tr><td>H 区 · 听觉性言语区</td><td>颞上回后部</td><td>听不懂话（感觉性失语症）</td><td>耳不聋，却听不懂</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只高亮 1 行，就是 W 区：它是四个里最容易被张冠李戴的一个——患者<b>能听懂</b>、<b>能说话</b>，偏偏<b>写不出字</b>。位置只按课本那几句话写，别自己补「第几回、第几层」的细节；判分看的是「区—症状」<b>一一对应</b>：<span class="gx-fml">S 区 ⇒ 不能讲话，W 区 ⇒ 不能写字，V 区 ⇒ 看不懂文字，H 区 ⇒ 听不懂话</span>。</p>
</section>

<h2><span class="sn">04</span>一道题走一遍</h2>

<div class="gx-ex">
<p class="ex-t">例题 · 言语区定位<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">某患者能听懂别人说话，也能正常写字，但说话含糊、不成句，想说的话说不出来。经检查，他的声带和发音器官并无损伤。据此回答：<br>（1）最可能是哪个言语区受损？写出该区的名称与病名。<br>（2）能否据此判断他的 V 区也受损？说明理由。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 先列「还能做什么」</p>
<p class="s-b">能听懂 → H 区（听觉性言语区）正常；能写字 → W 区（书写言语区）正常。剩下的可疑区只剩 S 区与 V 区。</p>
<p class="s-k">用到：一个区只负责一样言语功能，功能在，说明该区没坏。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 再看「缺了什么」</p>
<p class="s-b">缺的是「说出来」这一样，而且声带、发音器官没有损伤，说明不是发声器官的毛病，而是「把话组织成句子说出来」这一环坏了。</p>
<p class="s-k">用到：S 区（运动性言语区）位于中央前回下部，受损后不能讲话，即运动性失语症。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 排掉 V 区</p>
<p class="s-b">V 区（视觉性言语区）在枕叶，管的是「看懂文字」。题干没提阅读障碍，反而明确能写字，所以没有证据指向 V 区。</p>
<p class="s-k">用到：V 区受损＝失读症（看不懂文字），与「说不出话」不是一回事。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 说清「其他功能完好」</p>
<p class="s-b">四个言语区各管一段，坏一处只缺一样。本例听、写、读都在，正说明损伤局限在 S 区，其他功能多半完好。</p>
<p class="s-k">用到：四个言语区的症状一一对应，不能互相替代。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 写成答题卡上的句子</p>
<p class="s-b">先定位、再写病名、最后补一句判据，三句话就够，不要展开成散文。</p>
<p class="s-k">用到：答题模板「区名＋病名＋判据」。</p>
</li>
</ol>
