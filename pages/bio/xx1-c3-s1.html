<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 内分泌腺<span class="q-src">人教版（2019）选择性必修1 · 第3章第1节</span></p>
<p class="q-b">内分泌腺没有导管，分泌的激素直接进入腺体内的毛细血管，随血液运输到全身。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个条件</b>组成——① <b>没有导管</b>（所以叫「内分泌」，分泌物不外排）；② 激素先进<b>腺体内的毛细血管</b>（不是先进组织液再慢慢渗）；③ 靠<b>血液</b>送到全身。少任何一个，「随血液运输到全身」就接不上了。注意「运输到全身」不等于「作用于全身」。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 三个特点<span class="q-src">人教版（2019）选择性必修1 · 第3章第1节</span></p>
<p class="q-b">激素调节具有微量高效、通过体液运输、作用于靶器官靶细胞的特点。</p>
<p class="q-n">→ 翻成人话：这里也是<b>三个条件</b>，考试按点给分，缺一个扣一个的分。① <b>微量高效</b>：血液中含量极低就能起明显作用，所以「量多才有效」是错的；② <b>通过体液运输</b>：血液、组织液都算体液；③ <b>作用于靶器官、靶细胞</b>：只有带相应受体的细胞才响应，不是全身所有细胞。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 作用后<span class="q-src">人教版（2019）选择性必修1 · 第3章第1节</span></p>
<p class="q-b">激素一经靶细胞接受并起作用后就被灭活。</p>
<p class="q-n">→ 翻成人话：这句话含<b>两个条件</b>：① 先被<b>靶细胞接受</b>（与受体结合），② 起作用之后<b>被灭活</b>。由此推出两条判据：激素<b>不能反复使用</b>；激素<b>不起催化作用</b>（酶才在反应前后不变、可反复利用），它只把信息递过去，传完就销毁。</p>
</div>

<div style="overflow-x:auto">

<tr><td>运输途径</td><td>直接进入毛细血管，随血液运输到全身</td><td>激素被直接送到靶细胞门口</td></tr>
<tr><td>作用范围</td><td>只作用于靶器官、靶细胞</td><td>作用于全身所有细胞</td></tr>
<tr class="key"><td>量的特点</td><td>微量高效：含量极低即可引起明显反应</td><td>激素量越多，效果越好</td></tr>
<tr><td>作用后</td><td>一经靶细胞接受并起作用后就被灭活</td><td>激素可以反复使用</td></tr>
<tr><td>是否催化</td><td>不起催化作用，只起调节作用</td><td>激素是酶，直接催化代谢反应</td></tr>

</div>
<p class="gx-note">背法：把这张表按「在哪产 → 怎么走 → 找谁 → 用多少 → 用完怎样 → 干不干活」六步过一遍。只有「量的特点」这一行是本节最高频的陷阱——<b>微量高效</b>四个字必须原样写出，写成「量多高效」直接判错。</p>

<section class="gx-sec" id="b">
<h2><span class="sn">02</span>拆开看</h2>
<p class="gx-h2s">四张图：各讲一件事，按「是什么 → 怎么变 → 怎么用」排。</p>

<figure class="gx-fig">
<div class="fig-cap">
<span class="fig-no">图 1</span><span class="fig-t">内分泌腺与外分泌腺：判据只有「有无导管」</span>

<p class="fig-s">先看分泌物<b>往哪走</b>：外分泌腺的分泌物经导管排到体表或管腔（唾液腺、汗腺、胃腺）；内分泌腺<b>没有导管</b>，分泌物（激素）直接进入腺体内的毛细血管。判据只有一条，别看腺体大小。</p>

<text x="54" y="80" font-size="10.2" font-weight="700" fill="#2f8a5b">内分泌腺 · 无导管</text>
<text x="54" y="102" font-size="9.4" fill="#3a3a35">分泌物：激素（如甲状腺激素、胰岛素）</text>
<text x="54" y="119" font-size="9.4" fill="#3a3a35">去向：直接进入腺体内的毛细血管</text>
<text x="54" y="136" font-size="9.4" fill="#3a3a35">运输：随血液运输到全身</text>
<text x="54" y="153" font-size="9.4" fill="#3a3a35">结果：只与靶器官、靶细胞的受体结合</text>

<text x="442" y="102" font-size="9.4" fill="#3a3a35">分泌物：消化液、汗液、泪液、乳汁等</text>
<text x="442" y="119" font-size="9.4" fill="#3a3a35">去向：经导管排到体表或管腔</text>
<text x="442" y="136" font-size="9.4" fill="#3a3a35">运输：不进血液，不靠血液送</text>
<text x="442" y="153" font-size="9.4" fill="#3a3a35">结果：在管腔或体表就地起作用</text>
<text x="442" y="170" font-size="9.4" fill="#3a3a35">例子：唾液腺、汗腺、胃腺、肠腺</text>
<text x="442" y="196" font-size="9.2" fill="#b8791f">导管是外分泌腺的「标志物」</text>

<text x="52" y="265" font-size="9.6" font-weight="700" fill="#2b5f8f">判据一句话：分泌物有导管可走 → 外分泌腺；无导管、直接入血 → 内分泌腺。</text>

<p class="gx-take">内分泌腺与外分泌腺的区别不在大小和位置，只在<b>有没有导管</b>：无导管、激素直接入血的是内分泌腺。</p>
<p class="gx-note">常见误解：胰腺既是外分泌腺（分泌胰液，经胰管排入小肠）又是内分泌腺（胰岛分泌胰岛素、胰高血糖素，直接入血）。所以「胰腺是外分泌腺」这个说法不完整，答题要写「胰腺既有外分泌部又有内分泌部」。</p>

<li class="step">

<p class="s-k">用到：激素调节的三个特点之一「微量高效」；激素起<b>调节</b>作用，不是提供能量、不是原料。</p>

<p class="s-k">用到：图 3 的饱和段；受体与激素的结合具有<b>特异性</b>且数量有限。</p>

<p class="s-b">按本节模型 <span class="gx-fml">resp = 100d / (d + 10)</span>：d=10 时 resp=50%，正好是最大值的一半；d=100 时 resp≈90.9%，剂量涨到 10 倍，反应只从 50% 抬到 90.9%。也就是说，把剂量从 10 加到 100（多 9 倍），反应只多 40.9 个百分点——这就是「加量收益越来越小」。</p>

<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 激素量越大，效果越好，多注射一点更保险。</p>
<p class="er-v">✓ 激素调节具有<b>微量高效</b>的特点，极低含量即可引起明显反应；剂量过高时受体饱和，反应不再增加。</p>
<p class="er-w">错在哪：把「补营养」的思路搬到激素上。曲线先陡后平，量多不等于效果好。</p>
</div>
<div class="er">
<p class="er-x">✗ 激素随血液运输到全身，所以作用于全身所有细胞。</p>

<p class="er-w">错在哪：把「运输到」当成「作用于」。运得到 ≠ 起作用，受体是门槛。</p>
</div>
<div class="er">
<p class="er-x">✗ 激素是一种酶，能催化细胞内的代谢反应。</p>
<p class="er-v">✓ 激素<b>不起催化作用</b>、只起调节作用；起催化作用的是酶，酶反应前后自身不变。</p>
<p class="er-w">错在哪：化学本质同为蛋白质就混为一谈。作用方式才是判据。</p>
</div>
<div class="er">
<p class="er-x">✗ 激素起作用后还能被回收，反复使用。</p>
<p class="er-v">✓ 激素一经靶细胞接受并<b>起作用后就被灭活</b>，不能反复利用，需持续分泌补充。</p>
<p class="er-w">错在哪：把激素当酶。可反复利用是酶的性质，不是激素的。</p>
</div>
<div class="er">
<p class="er-x">✗ 内分泌腺有导管，分泌物经导管排出体外。</p>
<p class="er-v">✓ 内分泌腺<b>没有导管</b>，激素直接进入腺体内的毛细血管；有导管的是外分泌腺。</p>
<p class="er-w">错在哪：把内分泌腺和外分泌腺的结构搞反，「内分泌」三个字本身就指不外排。</p>
</div>
<div class="er">
<p class="er-x">✗ 激素直接参与代谢反应，被消耗后需要重新合成。</p>
<p class="er-v">✓ 激素只传递<b>调节信息</b>，不直接参与代谢反应、不提供能量；起作用后被灭活。</p>
<p class="er-w">错在哪：混淆「传递信息」和「参与反应」，激素是信使不是原料。</p>
</div>
<div class="er">
<p class="er-x">✗ 激素靠血液运输，所以激素调节比神经调节更迅速。</p>
<p class="er-v">✓ 激素调节反应较<b>缓慢</b>、作用范围较广、作用时间较长；神经调节更迅速、更准确、更短暂。</p>
<p class="er-w">错在哪：速度与「微量高效」是两件事。高效指用少量就有效，不指快。</p>
