<div class="gx-meta">
<span><i></i>人教版（2019）选择性必修3 第1章第3节</span>
<span><i></i>高二 · 发酵工程及其应用</span>

<span><i></i>含 1 个互动模型</span>
</div>
<p class="gx-lede">这一节把「实验室里养菌」升级成「工厂里造产品」：同样是用微生物，一旦放大到吨级发酵罐，你要盯的就不再是试管，而是温度、pH、溶氧、罐压四个参数。最容易错的是顺序——产品分离提纯在发酵之后，先发酵、再分离，不能倒；其次是定位，发酵工程是工业化规模化生产，不是把三角瓶做大一点。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 发酵工程的一般步骤<span class="q-src">人教版（2019）选择性必修3 · 第1章第3节</span></p>
<p class="q-b">发酵工程一般包括菌种的选育、扩大培养、培养基的配制、灭菌、接种、发酵、产品的分离与提纯等步骤。</p>
<p class="q-n">→ 拆成六个动作：①<b>菌种选育</b>（挑出高产、稳定的菌株）→ ②<b>扩大培养</b>（把一小管菌变成够用的种子液）→ ③<b>培养基配制</b>（碳源、氮源、水、无机盐按需配比）→ ④<b>灭菌</b>（培养基、设备、空气一起灭）→ ⑤<b>接种与发酵</b>（无菌操作，控温控 pH 控溶氧）→ ⑥<b>分离与提纯</b>（在发酵之后才做）。六个动作少一个都出不了产品，顺序错了直接丢分。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 发酵过程的控制<span class="q-src">人教版（2019）选择性必修3 · 第1章第3节</span></p>
<p class="q-b">发酵过程中要严格控制温度、pH、溶氧、罐压等条件。</p>
<p class="q-n">→ 四个被控量，对应四套检测装置：温度计、pH 电极、溶氧电极、罐压表。为什么非控不可？微生物代谢自己会产热、自己会改变 pH，一旦偏离最适范围，代谢速率下降甚至菌体死亡，产物就掉下来了。<b>中心环节是发酵过程控制</b>，这句话就是这四个参数的另一种说法。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 产品与用途<span class="q-src">人教版（2019）选择性必修3 · 第1章第3节</span></p>
<p class="q-b">发酵工程的产品包括微生物细胞本身、代谢产物等，广泛应用于食品、医药、能源等领域。</p>
<p class="q-n">→ 产品分两类：<b>菌体本身</b>（如单细胞蛋白、酵母）和<b>代谢产物</b>（如青霉素、味精、酒精、柠檬酸）。正因为要拿到成千上万吨的产品，发酵工程是工业化规模化生产，而不是实验室里为了发一篇文章的小量培养。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>发酵工程</th><th>实验室培养</th></tr></thead>
<tbody>
<tr><td>目的</td><td>获得产品，稳定、可重复</td><td>获得菌体或研究代谢规律</td></tr>
<tr><td>规模</td><td>吨级发酵罐，分批或连续生产</td><td>试管、三角瓶，毫克级</td></tr>
<tr><td>无菌要求</td><td>培养基、设备、空气全程灭菌</td><td>主要在接种和开口时防污染</td></tr>
<tr><td>条件控制</td><td>温度、pH、溶氧、罐压实时检测并调控</td><td>培养箱给个恒定条件，少干预</td></tr>
<tr><td>产品获得</td><td>发酵之后分离、提纯</td><td>离心收集菌体即可</td></tr>
<tr class="key"><td>本质区别</td><td>发酵工程是工业化规模化生产</td><td>实验室培养是少量、探索性的</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">背法：先背六个动作的顺序（选育→扩大→配制→灭菌→接种发酵→分离提纯），再记「中心环节是发酵过程控制」，最后记「产品分离提纯在发酵之后」。三句话按这个次序想，答题时不会漏。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 原因分析<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">某氨基酸发酵厂在 50 t 发酵罐中生产，操作工会不断查看罐上的温度表和 pH 计，一旦偏离就开冷却水或补加碱液。<br>（1）为什么发酵过程中要不断检测温度和 pH？<br>（2）有同学说「菌种选好了，条件差不多就行」。这句话错在哪？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定位</p>
<p class="s-b">题目问的是「为什么检测」，落点在发酵工程的中心环节——发酵过程控制，不是菌种选育。</p>
<p class="s-k">用到：中心环节是发酵过程控制。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 温度为什么会变</p>
<p class="s-b">微生物代谢释放热量，罐内温度会升高；温度超出最适范围，酶活性下降，代谢速率降低，过高还会导致菌体死亡。</p>
<p class="s-k">用到：温度影响酶活性。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · pH 为什么会变</p>
<p class="s-b">代谢产物有酸有碱（乳酸、乙酸、氨等），会改变培养液的 pH；pH 偏离最适范围同样使酶活性下降，还会让杂菌趁机繁殖。</p>
<p class="s-k">用到：pH 影响酶活性与纯种培养。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 回到生产目的</p>
<p class="s-b">发酵工程是工业化规模化生产，一罐就是几十吨，条件失控不是「产量低一点」，而是整罐报废。所以必须实时监测、及时调控。</p>
<p class="s-k">用到：工业化、规模化生产要求稳定高产。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 组织答案</p>
<p class="s-b">按「代谢产热/产酸产碱 → 偏离最适 → 酶活性下降、菌体死亡 → 实时监测并调控 → 保证稳定高产」的顺序写，一句一个得分点。</p>
<p class="s-k">用到：监测 → 调控 → 稳定高产。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）① 微生物代谢会释放热量，使罐内温度升高；代谢产物会改变培养液的 pH。② 温度和 pH 偏离最适范围，酶活性下降，代谢速率降低，甚至导致菌体死亡、杂菌繁殖。③ 因此必须实时监测温度和 pH，并及时调控（开冷却水降温、补加酸或碱回调 pH），才能保证产物稳定高产。<br>（2）错。发酵工程是工业化规模化生产，中心环节就是发酵过程控制：温度、pH、溶氧、罐压任一条件失控，整罐都会报废，不能「差不多就行」。</p>
</div>
</div>
</section>
<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">发酵工程的步骤顺序是怎样的？先灭菌还是先接种？</p>
<p class="a">菌种的选育 → 扩大培养 → 培养基的配制 → <b>灭菌</b> → <b>接种</b> → 发酵 → 产品的分离与提纯。必须<b>先灭菌、后接种</b>，否则杂菌会随接种一起进入培养基。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="灭菌在接种之前">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<rect x="20" y="40" width="60" height="30" rx="6" fill="#fff8ea" stroke="#e8c98a"/>
<text x="50" y="59" text-anchor="middle" font-size="9" fill="#8a5a11">灭菌</text>
<rect x="90" y="40" width="60" height="30" rx="6" fill="#eaf7f0" stroke="#7cc7a1"/>
<text x="120" y="59" text-anchor="middle" font-size="9" fill="#1d6b4a">接种</text>
<rect x="160" y="40" width="60" height="30" rx="6" fill="#eaf2fb" stroke="#b8d9ea"/>
<text x="190" y="59" text-anchor="middle" font-size="9" fill="#3a5f88">发酵</text>
<path d="M82 55 h6" stroke="#8aa2b5" stroke-width="1.6"/>
<path d="M152 55 h6" stroke="#8aa2b5" stroke-width="1.6"/>
<text x="120" y="98" text-anchor="middle" font-size="9" fill="#5a6472">顺序不能倒：先灭菌，再接种</text>
</svg>
</div>
<div class="qac">
<p class="q">发酵工程的中心环节是哪一步？</p>
<p class="a">是<b>发酵过程的控制</b>：严格控制温度、pH、溶氧、罐压。菌种选育决定「上限」，过程控制决定「能不能稳定拿到这个上限」。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="发酵过程控制的四个条件">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<rect x="30" y="30" width="64" height="72" rx="8" fill="#eaf7f0" stroke="#7cc7a1"/>
<text x="62" y="70" text-anchor="middle" font-size="9" fill="#1d6b4a">发酵罐</text>
<text x="112" y="44" font-size="9" fill="#5a6472">温度</text>
<text x="112" y="64" font-size="9" fill="#5a6472">pH</text>
<text x="112" y="84" font-size="9" fill="#5a6472">溶氧</text>
<text x="112" y="104" font-size="9" fill="#5a6472">罐压</text>
<text x="170" y="70" font-size="9" font-weight="700" fill="#b8791f">实时调控</text>
</svg>
</div>
<div class="qac">
<p class="q">延滞期产物最多吗？三个时期怎么区分？</p>
<p class="a">错。延滞期菌体少、产物很少，但代谢活跃、正在合成酶类；对数期数量快速增长、产物开始积累；<b>稳定期产物量最多</b>，活菌数基本稳定。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="三阶段曲线">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<path d="M20 104 C 50 104, 66 102, 86 96 C 120 84, 156 58, 190 52 L 228 50" fill="none" stroke="#2f8a5b" stroke-width="2"/>
<line x1="20" y1="108" x2="228" y2="108" stroke="#9db0bf" stroke-width="1"/>
<text x="40" y="122" font-size="8.5" fill="#8a5a11">延滞</text>
<text x="106" y="122" font-size="8.5" fill="#1d6b4a">对数</text>
<text x="180" y="122" font-size="8.5" fill="#3a5f88">稳定</text>
</svg>
</div>
<div class="qac">
<p class="q">为什么要扩大培养？直接用一支试管的菌接种不行吗？</p>
<p class="a">不行。接种量太小，菌体要花很长时间才长起来，延滞期被拉长，杂菌也更容易占优势。<b>扩大培养</b>把少量菌种逐级放大到足够数量，缩短延滞期、提高产量。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="逐级扩大培养">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<circle cx="52" cy="66" r="7" fill="#b8e6d0" stroke="#2f8a5b"/>
<circle cx="112" cy="66" r="12" fill="#b8e6d0" stroke="#2f8a5b"/>
<circle cx="188" cy="66" r="18" fill="#b8e6d0" stroke="#2f8a5b"/>
<text x="120" y="108" text-anchor="middle" font-size="9" fill="#5a6472">逐级放大到足够的接种量</text>
</svg>
</div>
<div class="qac">
<p class="q">产品的分离提纯在发酵之前还是之后？</p>
<p class="a">在<b>发酵之后</b>。发酵结束先得到含菌体和代谢产物的培养液，再经过滤、离心、萃取、层析等分离提纯，最后质检、包装。产品分离提纯在发酵之后，顺序倒过来写就是硬伤。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="先发酵后分离提纯">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<rect x="22" y="40" width="70" height="30" rx="6" fill="#eaf7f0" stroke="#7cc7a1"/>
<text x="57" y="59" text-anchor="middle" font-size="9" fill="#1d6b4a">发酵</text>
<path d="M96 55 h26" stroke="#8aa2b5" stroke-width="1.6"/>
<path d="M128 55 l-7 -4 v8 z" fill="#8aa2b5"/>
<rect x="132" y="40" width="82" height="30" rx="6" fill="#eaf2fb" stroke="#b8d9ea"/>
<text x="173" y="59" text-anchor="middle" font-size="9" fill="#3a5f88">分离提纯</text>
<text x="120" y="98" text-anchor="middle" font-size="9" fill="#5a6472">先发酵，后分离提纯</text>
</svg>
</div>
<div class="qac">
<p class="q">发酵工程就是实验室的小量培养，只是瓶子大一点吗？</p>
<p class="a">不是。发酵工程是<b>工业化规模化生产</b>：全过程纯种培养，罐体、管路、空气都要灭菌，温度、pH、溶氧、罐压靠在线检测实时调控，还要考虑成本、产率和批次稳定性。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="实验室培养与发酵工程的规模对比">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<rect x="34" y="72" width="44" height="16" rx="3" fill="#dce9f2" stroke="#b8d9ea"/>
<rect x="120" y="26" width="72" height="62" rx="6" fill="#eaf7f0" stroke="#7cc7a1"/>
<text x="56" y="102" text-anchor="middle" font-size="8.5" fill="#5a6472">三角瓶</text>
<text x="156" y="102" text-anchor="middle" font-size="8.5" fill="#5a6472">吨级发酵罐</text>
<text x="120" y="118" text-anchor="middle" font-size="8.5" fill="#5a6472">规模差几个数量级</text>
</svg>
</div>
</div>
<p class="gx-note">这六问其实是同一件事的三个面：<b>顺序</b>（先灭菌后接种、先发酵后提纯）、<b>中心</b>（过程控制）、<b>定位</b>（工业化、规模化）。答题时先亮出这三句，再补细节。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 先分离提纯，再把产物拿去发酵。</p>
<p class="er-v">✓ 发酵结束后，再对培养液进行产品的分离与提纯。</p>
<p class="er-w">错在哪：顺序倒了。产品分离提纯在发酵之后，没有发酵液就没有可分离的东西。</p>
</div>
<div class="er">
<p class="er-x">✗ 发酵过程不需要控温，微生物自己会调节。</p>
<p class="er-v">✓ 发酵过程中要严格控制温度、pH、溶氧、罐压等条件。</p>
<p class="er-w">错在哪：这是发酵工程的中心环节。代谢产热会让罐温升高，偏离最适范围酶活性下降，甚至菌体死亡。</p>
</div>
<div class="er">
<p class="er-x">✗ 发酵工程就是实验室里的小量培养，只是瓶子大一点。</p>
<p class="er-v">✓ 发酵工程是工业化规模化生产，全过程纯种培养并在线调控。</p>
<p class="er-w">错在哪：把「放大」理解成「换大瓶子」。规模放大后灭菌、通气、搅拌、控温都要重新设计。</p>
</div>
<div class="er">
<p class="er-x">✗ 延滞期产物最多，因为菌刚接进去活性最高。</p>
<p class="er-v">✓ 稳定期产物量最多；延滞期菌体少、产物很少，但代谢活跃。</p>
<p class="er-w">错在哪：把「代谢活跃」当成「产物多」。延滞期菌体正在合成酶类，数量还没起来。</p>
</div>
<div class="er">
<p class="er-x">✗ 溶氧对所有菌都一样，越多越好。</p>
<p class="er-v">✓ 不同菌对溶氧的需求不同，溶氧要按菌种需要控制。</p>
<p class="er-w">错在哪：厌氧菌（如乳酸菌、甲烷菌）要隔绝氧气；好氧菌才需要通气搅拌提高溶氧。</p>

<p class="er-w">错在哪：漏掉了「产品的分离与提纯」这一步，发酵液里还有菌体、杂蛋白和副产物。</p>
</div>
<div class="er">
<p class="er-x">✗ 扩大培养只是为了多攒点菌，和产量没关系。</p>
<p class="er-v">✓ 扩大培养提供足够数量的接种量，可缩短延滞期、抑制杂菌、提高产量。</p>
<p class="er-w">错在哪：接种量太小，延滞期被拉长，杂菌更容易占优势，产量和批次稳定性都下降。</p>

<script>
/* 互动脚本：发酵时间 t → 产物相对量 P（S 形）与增长速率 r。t=20 h 为拐点（50%、r 最大） */
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var GX = window.GX, el = GX.el, tx = GX.tx, $ = GX.$;
  var stage = $("gxStage");
  if (!stage || !window.AutoPilot) return;

  /* 两套坐标：宽屏 880×470，窄屏独立 360×700 */
  var W = {
    vb: "0 0 880 470", wide: 1,
    left: { x: 16, y: 16, w: 424, h: 438 }, right: { x: 456, y: 16, w: 408, h: 438 },
    px0: 68, px1: 412, py0: 390, py1: 92,
    qx0: 500, qx1: 844, qy0: 300, qy1: 84,
    fs: 9.6, ts: 8.6, tt: 10.5, rmax: 6.6, gap: 28, ty: 344
  };
  var N = {
    vb: "0 0 360 700", wide: 0,
    left: { x: 8, y: 8, w: 344, h: 300 }, right: { x: 8, y: 320, w: 344, h: 372 },
    px0: 46, px1: 334, py0: 252, py1: 74,
    qx0: 46, qx1: 334, qy0: 566, qy1: 388,
    fs: 8.4, ts: 7.8, tt: 9.4, rmax: 6.6, gap: 24, ty: 612
  };
  var L = W, A = 20, G = null;
  var CG = "#2f8a5b", CA = "#b8791f", CB = "#3a5f88", CR = "#b8402f";
  var CT = "#5a6472", CD = "#3a3a35", CL = "#7a8494";

  /* 唯一真值：render() 与 __model.cases 共用 */
  function calc(v) {
    var p = 100 / (1 + Math.exp(-(v - 20) / 4));
    return { prod: p, rate: p * (1 - p / 100) / 4 };
  }

  function geom() {
    var l = L.left, m = L.right;
    return {
      lx: l.x, ly: l.y, lw: l.w, lh: l.h, rx: m.x, ry: m.y, rw: m.w, rh: m.h,
      px0: L.px0, px1: L.px1, py0: L.py0, py1: L.py1,
      qx0: L.qx0, qx1: L.qx1, qy0: L.qy0, qy1: L.qy1,
      fs: L.fs, ts: L.ts, tt: L.tt, rmax: L.rmax, gap: L.gap, ty: L.ty
    };
  }

  function X(t) { return G.px0 + (G.px1 - G.px0) * t / 40; }
  function Y(p) { return G.py0 - (G.py0 - G.py1) * p / 100; }
  function RX(t) { return G.qx0 + (G.qx1 - G.qx0) * t / 40; }
  function RY(r) { return G.qy0 - (G.qy0 - G.qy1) * r / G.rmax; }

  function ln(g, x1, y1, x2, y2, c, w, d) {
    el("line", { x1: x1, y1: y1, x2: x2, y2: y2, stroke: c, "stroke-width": w || 1, "stroke-dasharray": d || "none" }, g);
  }

  function pathOf(f, fx, fy, g) {
    var d = "", i;
    for (i = 0; i <= 40; i++) d += (i ? " L " : "M ") + fx(i).toFixed(1) + " " + fy(f(i)).toFixed(2);
    el("path", { d: d, fill: "none", stroke: CG, "stroke-width": 2.4 }, g);
  }

  function drawLeft(a) {
    var s = calc(A);
    el("rect", { x: G.lx, y: G.ly, width: G.lw, height: G.lh, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, a);
    tx(a, G.lx + 16, G.ly + (G.wide ? 28 : 20), "产物的 S 形曲线（相对量 %）", CT, "start", G.tt, 700);

    var b1 = X(10), b2 = X(32);
    el("rect", { x: X(0), y: G.py1, width: b1 - X(0), height: G.py0 - G.py1, fill: "#fdf6e6" }, a);
    el("rect", { x: b1, y: G.py1, width: b2 - b1, height: G.py0 - G.py1, fill: "#eaf7f0" }, a);
    el("rect", { x: b2, y: G.py1, width: X(40) - b2, height: G.py0 - G.py1, fill: "#eaf2fb" }, a);

    ln(a, X(0), Y(50), X(40), Y(50), "#cfd9e2", 1, "4 4");
    ln(a, X(0), Y(0), X(40), Y(0), "#9aa7b4", 1.2);
    ln(a, X(0), Y(0), X(0), Y(100), "#9aa7b4", 1.2);

    tx(a, (X(0) + b1) / 2, G.py1 + 14, "延滞期", "#8a5a11", "middle", G.ts, 700);
    tx(a, (b1 + b2) / 2, G.py1 + 14, "对数期", "#1d6b4a", "middle", G.ts, 700);
    tx(a, (b2 + X(40)) / 2, G.py1 + 14, "稳定期", "#3a5f88", "middle", G.ts, 700);

    tx(a, X(0) - 6, Y(0) + 3, "0", CL, "end", G.ts, 400);
    tx(a, X(0) - 6, Y(50) + 3, "50", CL, "end", G.ts, 400);
    tx(a, X(0) - 6, Y(100) + 3, "100", CL, "end", G.ts, 400);
    tx(a, X(0), G.py0 + 14, "0", CL, "middle", G.ts, 400);
    tx(a, X(20), G.py0 + 14, "20", CL, "middle", G.ts, 400);
    tx(a, X(40), G.py0 + 14, "40", CL, "middle", G.ts, 400);
    tx(a, X(20), G.py0 + (G.wide ? 32 : 28), "发酵时间 t / h", CL, "middle", G.ts, 400);

    pathOf(function (t) { return calc(t).prod; }, X, Y, a);

    var mx = X(A), my = Y(s.prod), right = A <= 22;
    ln(a, mx, my, mx, Y(0), CR, 1, "4 4");
    el("circle", { cx: mx, cy: my, r: 4.6, fill: CR, stroke: "#ffffff", "stroke-width": 1.4 }, a);
    tx(a, right ? mx + 9 : mx - 9, my < G.py1 + 26 ? my + 17 : my - 9,
      "P=" + s.prod.toFixed(1) + "%", CR, right ? "start" : "end", G.fs, 700);
  }

  function drawRight(b) {
    var s = calc(A);
    el("rect", { x: G.rx, y: G.ry, width: G.rw, height: G.rh, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, b);
    tx(b, G.rx + 16, G.ry + (G.wide ? 28 : 20), "增长速率 r（%/h，示意）", CT, "start", G.tt, 700);

    ln(b, RX(0), RY(0), RX(40), RY(0), "#9aa7b4", 1.2);
    ln(b, RX(0), RY(0), RX(0), RY(G.rmax), "#9aa7b4", 1.2);
    tx(b, RX(0) - 6, RY(0) + 3, "0", CL, "end", G.ts, 400);
    tx(b, RX(0) - 6, RY(6.25) + 3, "6.25", CL, "end", G.ts, 400);

    var i, d = "";
    for (i = 0; i <= 40; i++) d += (i ? " L " : "M ") + RX(i).toFixed(1) + " " + RY(calc(i).rate).toFixed(2);
    el("path", { d: d, fill: "none", stroke: CA, "stroke-width": 2.2 }, b);

    ln(b, RX(20), RY(6.25), RX(20), RY(0), "#d8c49a", 1, "3 4");
    el("circle", { cx: RX(20), cy: RY(6.25), r: 3.4, fill: "#ffffff", stroke: CA, "stroke-width": 1.6 }, b);
    tx(b, RX(20), RY(6.25) - 9, "峰值 6.25（t=20）", CA, "middle", G.ts, 700);

    var mx = RX(A), my = RY(s.rate);
    ln(b, mx, my, mx, RY(0), CR, 1, "4 4");
    el("circle", { cx: mx, cy: my, r: 4.4, fill: CR, stroke: "#ffffff", "stroke-width": 1.4 }, b);
    tx(b, mx, my - 9, s.rate.toFixed(2), CR, "middle", G.ts, 700);

    tx(b, G.rx + 16, G.ty, "t < 10 h　延滞期：菌体少，产物很少", "#8a5a11", "start", G.fs, 400);
    tx(b, G.rx + 16, G.ty + G.gap, "10–30 h　对数期：产物快速积累", "#1d6b4a", "start", G.fs, 400);
    tx(b, G.rx + 16, G.ty + G.gap * 2, "t > 32 h　稳定期：趋于饱和", CB, "start", G.fs, 400);
    tx(b, G.rx + 16, G.ty + G.gap * 3 + (G.wide ? 6 : 4), "r 峰值在 t=20 h：这一段加料、控温收益最高", CD, "start", G.fs, 400);
  }

  function render() {
    if (!G) { L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N; G = geom(); }
    var s = calc(A), st, col, bg, sn;
    $("gxVa").textContent = String(Math.round(A));

    else { st = "稳定期"; col = "#3a5f88"; bg = "#eaf2fb"; sn = "趋于饱和"; }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;

    $("gxStBox").style.borderColor = col + "44";

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    stage.setAttribute("viewBox", L.vb);
    G = null;

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");

    apBadge.classList.toggle("is-auto", m === "auto");

  }

  /* loop 必须是 {t,v} 对象数组：停留帧 v=20（t=20 h，50%，增长最快） */
  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 0 }, { t: 1.2, v: 0 }, { t: 4, v: 20 }, { t: 6.5, v: 20 }, { t: 9, v: 40 }, { t: 11, v: 30 }, { t: 13, v: 0 }],
    keys: [0, 10, 20, 40],
    value: A, min: 0, max: 40, step: 1,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;

  window.__model = window.__bio = {
    calc: calc,
    cases: [
      { v: 10, eq: { prod: 7.6 } },
      { v: 20, eq: { prod: 50 } },
      { v: 30, eq: { prod: 92.4 } }
    ]
  };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
