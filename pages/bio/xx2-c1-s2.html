<p class="gx-lede">上一节数清了种群有多少个体，这一节要算它<b>怎么变</b>。教材只给两条曲线：理想条件下按 <span class="gx-fml">Nₜ = N₀λᵗ</span> 一直翻上去的「J」形，和资源有限时被环境容纳量拽住的「S」形。最容易错的一件事是：把 K 当成增长最快的点——真正最快的是 K/2，到 K 时增长速率已经降为 0。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 「J」形增长<span class="q-src">人教版（2019）选择性必修2 · 第1章第2节</span></p>
<p class="q-b">种群在理想条件下，数量呈「J」形增长，可用公式 Nₜ = N₀λᵗ 表示。</p>
<p class="q-n">→ 翻成人话：这句话其实压着<b>四个条件</b>——①食物和空间充裕 ②气候适宜 ③没有敌害 ④没有传染病。天然种群几乎不可能同时满足，所以「J 形是理想条件」下的模型，不是自然状态下的常态；少任何一个条件，曲线就得往下弯成 S 形。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 「S」形增长<span class="q-src">人教版（2019）选择性必修2 · 第1章第2节</span></p>
<p class="q-b">在资源和空间有限的环境中，种群经过一定时间的增长后，数量趋于稳定，呈「S」形增长。</p>
<p class="q-n">→ 翻成人话：<b>三个条件</b>——①资源有限 ②空间有限 ③存在环境阻力。三者合起来产生一个上限，种群数量就稳定在这个上限附近，这个上限就是环境容纳量，记作 K。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · K 与 K/2<span class="q-src">人教版（2019）选择性必修2 · 第1章第2节</span></p>
<p class="q-b">「S」形增长曲线中，种群数量达到环境容纳量（K 值）后不再增加；在 K/2 时增长速率最大。</p>
<p class="q-n">→ 翻成人话：前后两句管的是两件事。K 管「数量最后停在哪里」，K/2 管「哪一代长得最快」。K 处的增长速率是 0，不是最大——把这两句读成一句，就是最常见的丢分点。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>「J」形增长</th><th>「S」形增长</th></tr></thead>
<tbody>
<tr><td>发生条件</td><td>理想条件：食物空间充裕、气候适宜、无敌害、无传染病</td><td>有限环境：资源空间有限，存在环境阻力</td></tr>
<tr><td>有无 K 值</td><td><b>没有</b> K 值，理论上一直上升</td><td><b>有</b>环境容纳量 K</td></tr>
<tr><td>数量公式</td><td><span class="gx-fml">Nₜ = N₀λᵗ</span></td><td><span class="gx-fml">N = K ÷ (1 + ((K − N₀) ÷ N₀) × e^(−rt))</span></td></tr>
<tr><td>相邻两代关系</td><td>λ 恒定，每代都是上一代的固定倍数</td><td>相邻两代的倍数越来越小，趋近 1</td></tr>
<tr class="key"><td>增长速率最大处</td><td>随 N 增大一直加快，没有峰值</td><td><b>在 N = K/2 时最大</b>，到 K 时降为 0</td></tr>
<tr><td>典型实例</td><td>实验室条件、入侵初期、培养初期</td><td>自然界中大多数种群</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">λ 只写在 J 形里：<b>λ 是相邻两代的倍数，不是增长率</b>。两者的换算只有一步——增长率 = λ − 1。λ = 1.5 时增长率是 50%，λ = 1 时增长率是 0（数量不增不减），λ 小于 1 时数量下降。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 两模型代入计算<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">某种群在理想条件下每代数量是上一代的 1.5 倍，起始数量 N₀ = 10。求：<br>（1）第 5 代的数量是多少？<br>（2）若改为有限环境（K = 1000，r = 0.5），第 5 代约是多少？<br>（3）由（1）（2）能得出什么结论？<br>陷阱：题干给的是「每代是上一代的 1.5 倍」，这个 1.5 是 λ 还是增长率？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题：先定模型</p>
<p class="s-b">「理想条件」+「每代是上一代的固定倍数」是两个信号，直接锁定 J 形模型 Nₜ = N₀λᵗ；第（2）问给出 K，锁定 S 形模型（logistic）。</p>
<p class="s-k">用到：J 形是理想条件下的模型；只要题目出现 K，就是 S 形。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 认准 λ 的含义</p>
<p class="s-b">「每代是上一代的 1.5 倍」说的是相邻两代的倍数，所以 λ = 1.5，不是增长率。若当成增长率 1.5，会算出 10×2.5⁵ 这种离谱结果。</p>
<p class="s-k">用到：λ 是相邻两代的倍数，不是增长率；增长率 = λ − 1 = 50%。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 代公式算 J 形</p>
<p class="s-b">N₅ = 10 × 1.5⁵ = 10 × 7.59375 ≈ 75.9（个）。指数是「经过了 5 代」，不是 6。</p>
<p class="s-k">用到：Nₜ = N₀λᵗ，t 是经历的代（时间）数。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 换模型算 S 形</p>
<p class="s-b">先算 (K − N₀) ÷ N₀ = (1000 − 10) ÷ 10 = 99；再算 e^(−0.5×5) = e^(−2.5) ≈ 0.0821；N = 1000 ÷ (1 + 99 × 0.0821) ≈ 1000 ÷ 9.13 ≈ 109.5（个）。</p>
<p class="s-k">用到：S 形公式 N = K ÷ (1 + ((K − N₀) ÷ N₀) × e^(−rt))。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 下结论（这一步才给分）</p>
<p class="s-b">两问初值相同、时间相同，结果 75.9 与 109.5 只差 1.4 倍，说明<b>早期两者差别小</b>；差别要靠时间放大——同一代继续往后算，J 形会远超 K。所以判断「J 形还是 S 形」不能只看前几代，要看长期趋势。</p>
<p class="s-k">用到：J 形无上限、S 形有 K；10 代左右才开始明显分岔。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）理想条件下种群呈「J」形增长，Nₜ = N₀λᵗ，λ = 1.5，则 N₅ = 10 × 1.5⁵ ≈ 75.9，第 5 代约 76 个。<br>（2）有限环境中种群呈「S」形增长，N = K ÷ (1 + ((K − N₀) ÷ N₀) × e^(−rt)) = 1000 ÷ (1 + 99 × e^(−2.5)) ≈ 109.5，第 5 代约 110 个。<br>（3）两种模型初值相同，前几代数量接近；随时间的推移，J 形持续按固定倍数增加、无上限，S 形增长速率在 K/2 时最大、达到 K 后不再增加。因此「J 形」只适用于理想条件，自然种群多为「S」形增长。</p>
</div>
</div>
</section>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「J 形和 S 形到底差在哪一句话上？」</p>
<p class="a">差在<b>条件</b>：J 形是理想条件（无环境阻力、无 K），S 形是资源空间有限（有环境阻力、有 K）。所以 <b>J 形是理想条件下的模型</b>，自然种群在长期看多为 S 形。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="J 形与 S 形曲线对比">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="34" y1="104" x2="216" y2="104" stroke="#b8c4cf" stroke-width="1"/>
<line x1="34" y1="24" x2="34" y2="104" stroke="#b8c4cf" stroke-width="1"/>
<polyline points="34,100 70,98 106,90 142,70 178,38 206,22" fill="none" stroke="#b8402f" stroke-width="2"/>
<polyline points="34,100 70,98 106,88 142,72 178,64 206,62" fill="none" stroke="#2f8a5b" stroke-width="2"/>
<text x="180" y="34" font-size="8.4" fill="#b8402f">J</text>
<text x="150" y="58" font-size="8.4" fill="#2f8a5b">S</text>
<text x="42" y="122" font-size="8" fill="#7a828c">时间 →</text>
</svg>
</div>

<div class="qac">
<p class="q">「K 值是种群能达到的最大数量吗？」</p>
<p class="a">是<b>环境容纳量</b>：在环境条件不受破坏的情况下，一定空间中所能维持的种群最大数量。注意三个词——<b>环境条件不受破坏</b>、<b>一定空间</b>、<b>维持</b>。超过 K 会因资源不足、疾病扩散而回落。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="S 形曲线在 K 值处水平">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="34" y1="104" x2="216" y2="104" stroke="#b8c4cf" stroke-width="1"/>
<line x1="34" y1="24" x2="34" y2="104" stroke="#b8c4cf" stroke-width="1"/>
<line x1="34" y1="46" x2="216" y2="46" stroke="#2f8a5b" stroke-width="1" stroke-dasharray="4 3"/>
<polyline points="34,100 76,96 112,84 148,60 184,48 212,47" fill="none" stroke="#2f8a5b" stroke-width="2"/>
<text x="186" y="40" font-size="8.4" fill="#2f8a5b">K</text>
<text x="100" y="122" font-size="8" fill="#7a828c">超过 K 会回落</text>
</svg>
</div>

<div class="qac">
<p class="q">「增长速率最大是在种群数量最多的时候吗？」</p>
<p class="a">不是。<b>K/2 时增长速率最大（不是 K 时）</b>，因为增长速率 = 出生率 − 死亡率，K/2 处这个差值最大；到 K 时出生率与死亡率相等，增长速率为 0，数量才稳定。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="增长速率峰值在 K/2">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="34" y1="104" x2="216" y2="104" stroke="#b8c4cf" stroke-width="1"/>
<line x1="34" y1="24" x2="34" y2="104" stroke="#b8c4cf" stroke-width="1"/>
<polyline points="34,104 70,70 106,46 142,46 178,72 212,104" fill="none" stroke="#b8791f" stroke-width="2"/>
<circle cx="124" cy="46" r="3" fill="#b8402f"/>
<text x="112" y="36" font-size="8.4" fill="#b8402f">峰值在 K/2</text>
<text x="186" y="36" font-size="8.4" fill="#2f8a5b">K 处为 0</text>
<text x="40" y="122" font-size="8" fill="#7a828c">N →</text>
</svg>
</div>

<div class="qac">
<p class="q">「题目说每代是上一代的 1.5 倍，λ 就是 1.5，那增长率也是 1.5 吗？」</p>
<p class="a">不是。<b>λ 是相邻两代的倍数，不是增长率</b>。增长率 = λ − 1 = 0.5，即 50%。把 λ 当增长率，会把「1.5 倍」算成「增长 150%」，数值直接翻倍出错。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="λ 与增长率换算">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<rect x="22" y="30" width="86" height="30" rx="5" fill="#fff" stroke="#e2b7ad"/>
<text x="65" y="50" font-size="9" fill="#b8402f" text-anchor="middle">λ = 1.5</text>
<rect x="132" y="30" width="86" height="30" rx="5" fill="#fff" stroke="#e2d3bc"/>
<text x="175" y="50" font-size="9" fill="#b8791f" text-anchor="middle">增长率 50%</text>
<text x="120" y="52" font-size="10" fill="#7a828c" text-anchor="middle">−1</text>
<text x="120" y="84" font-size="8.6" fill="#3a3a35" text-anchor="middle">倍数 → 增长率，只减 1</text>
<text x="120" y="102" font-size="8.4" fill="#7a828c" text-anchor="middle">λ=1 时增长率为 0</text>
</svg>
</div>

<div class="qac">
<p class="q">「为什么 S 形曲线一定会趋于稳定？」</p>
<p class="a">因为资源空间有限，种群越大，<b>环境阻力越大</b>：食物不足、天敌增多、疾病易传播，出生率下降、死亡率上升。当出生率等于死亡率时增长速率为 0，数量稳定在 K。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="出生率上升死亡率下降后相等">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="26" y1="102" x2="214" y2="102" stroke="#b8c4cf" stroke-width="1"/>
<polyline points="26,30 70,40 110,58 150,74 200,80" fill="none" stroke="#2f8a5b" stroke-width="2"/>
<polyline points="26,88 70,82 110,74 150,70 200,68" fill="none" stroke="#b8402f" stroke-width="2"/>
<text x="120" y="118" font-size="8" fill="#7a828c" text-anchor="middle">出生率 ↓ 死亡率 ↑ → 相交即 K</text>
<text x="206" y="58" font-size="8" fill="#2f8a5b">出生率</text>
<text x="206" y="70" font-size="8" fill="#b8402f">死亡率</text>
</svg>
</div>

<div class="qac">
<p class="q">「K/2 这个数考试里怎么用？」</p>
<p class="a">两条应用：① <b>渔业捕捞</b>后把剩余量维持在 K/2，增长速率最大、恢复最快；② <b>有害动物防治</b>要在数量远低于 K/2 时动手，一旦超过 K/2，增长速率变大、更难控制。核心还是那句：K/2 时增长速率最大。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="捕捞后维持在 K/2">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="30" y1="104" x2="216" y2="104" stroke="#b8c4cf" stroke-width="1"/>
<polyline points="30,100 70,94 106,76 142,54 178,46 212,45" fill="none" stroke="#2f8a5b" stroke-width="2"/>
<line x1="30" y1="70" x2="212" y2="70" stroke="#b8791f" stroke-width="1" stroke-dasharray="4 3"/>
<circle cx="124" cy="70" r="3.2" fill="#b8791f"/>
<text x="130" y="64" font-size="8.4" fill="#b8791f">维持 K/2</text>
<text x="196" y="40" font-size="8.4" fill="#2f8a5b">K</text>
<text x="40" y="122" font-size="8" fill="#7a828c">捕捞后剩余量</text>
</svg>
</div>
</div>
<p class="gx-note">这六问其实是一件事：<b>J 形是理想条件的模型</b>，<b>S 形才有 K</b>；K 说上限、K/2 说最快；λ 只说倍数，说增长率要减 1。四句话背下来，本节的选择题和填空题都能落到同一套判据上。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 种群数量达到 K 值时增长最快</p>
<p class="er-v">✓ K/2 时增长速率最大；达到 K 后增长速率为 0，数量不再增加</p>
<p class="er-w">错在哪：把「数量最多」当成「长得最快」。K 处出生率 = 死亡率，增长速率是 0。</p>
</div>
<div class="er">
<p class="er-x">✗ 「J」形增长是自然状态下的常态</p>
<p class="er-v">✓ 「J」形增长出现在理想条件下，自然界中种群多呈「S」形增长</p>
<p class="er-w">错在哪：丢掉了「理想条件」这个前提。食物空间充裕、无敌害、无传染病同时成立才画得出 J 形。</p>
</div>
<div class="er">
<p class="er-x">✗ λ 就是增长率，λ=1.5 表示增长了 1.5</p>
<p class="er-v">✓ λ 是相邻两代的倍数，增长率 = λ − 1 = 0.5</p>
<p class="er-w">错在哪：倍数与增长率差 1。J 形公式里用 λ，说增长率时必须减 1。</p>
</div>
<div class="er">
<p class="er-x">✗ 「S」形增长没有上限，只是暂时变慢</p>
<p class="er-v">✓ 「S」形增长有环境容纳量 K，数量达到 K 后不再增加</p>
<p class="er-w">错在哪：把「增长变慢」读成「还会冲到无限」，忽略了 K 的存在。</p>
</div>
<div class="er">
<p class="er-x">✗ 一个环境的 K 值是固定不变的</p>
<p class="er-v">✓ K 值随环境改变：环境改善升高，环境破坏降低</p>

<script>
/* 互动脚本本体（由 build-page.mjs 包进 <script> 里，所以这里不要写 <script> 标签） */
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var GX = window.GX, el = GX.el, tx = GX.tx, $ = GX.$;
  var stage = $("gxStage");
  if (!stage || !window.AutoPilot) return;

  /* 两套坐标：宽屏 880×470，窄屏独立 360×700 */
  var W = { vb: "0 0 880 470", left: { x: 16, y: 16, w: 424, h: 438 }, right: { x: 456, y: 16, w: 408, h: 438 } };
  var N = { vb: "0 0 360 700", left: { x: 8, y: 8, w: 344, h: 300 }, right: { x: 8, y: 320, w: 344, h: 372 } };
  var L = W, A = 0, G = null;

  var N0 = 10, LAM = 1.5, K = 1000, R = 0.5, TMAX = 15, YMAX = 4600;

  function J(t) { return N0 * Math.pow(LAM, t); }
  function S(t) { return K / (1 + (K - N0) / N0 * Math.exp(-R * t)); }

  /* 纯函数：时间 t → 两个模型的数量。render() 和 __bio.cases 都用它 */
  function calc(v) {
    return { t: v, J: J(v), S: S(v) };
  }

  function geom() {
    var a = L.left, b = L.right;
    var px = a.x + 46, py = a.y + 48, pw = a.w - 62, ph = a.h - 92;
    var rb = { x: b.x + 16, y: b.y + 46, w: b.w - 32, h: b.h - 70 };
    var lab = b.w >= 380 ? 46 : 34;
    return {
      px: px, py: py, pw: pw, ph: ph,
      bt: py + ph,
      x: function (t) { return px + t / TMAX * pw; },
      y: function (n) { return py + ph - Math.min(n, YMAX) / YMAX * ph; },
      rb: rb,
      ax: rb.x + lab,
      len: Math.max(40, rb.w - lab - 58)
    };
  }

  /* 中文按字数换行，避免长句冲出面板 */
  function wrap(parent, x, y, s, maxW, fs, col, lh) {
    var per = Math.max(6, Math.floor(maxW / fs)), lines = [], cur = "";
    for (var i = 0; i < s.length; i++) { cur += s.charAt(i); if (cur.length >= per) { lines.push(cur); cur = ""; } }
    if (cur) lines.push(cur);
    for (var k = 0; k < lines.length; k++) tx(parent, x, y + k * lh, lines[k], col, "start", fs, 400);
  }

  function num(n) { return n >= 1000 ? String(Math.round(n)) : String(Math.round(n * 10) / 10); }

  function draw() {
    var gA = $("gxA"), gB = $("gxB");
    gA.textContent = ""; gB.textContent = "";
    var a = L.left, b = L.right, s = calc(A), i, p, pts;

    /* ---- 左：两条曲线 ---- */
    el("rect", { x: a.x, y: a.y, width: a.w, height: a.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    tx(gA, a.x + 16, a.y + 26, "两种增长模型：N 随 t 变化", "#5a6472", "start", 10.5, 700);
    tx(gA, a.x + 16, a.y + 42, "N₀=10，J 形 λ=1.5，S 形 K=1000、r=0.5", "#8a939e", "start", 8.6, 400);

    el("line", { x1: G.px, y1: G.py, x2: G.px, y2: G.bt, stroke: "#b8c4cf", "stroke-width": 1.1 }, gA);
    el("line", { x1: G.px, y1: G.bt, x2: G.px + G.pw, y2: G.bt, stroke: "#b8c4cf", "stroke-width": 1.1 }, gA);
    tx(gA, G.px - 8, G.py + 4, "N", "#8a939e", "end", 8.6, 700);
    tx(gA, G.px + G.pw - 4, G.bt + 34, "t/代", "#8a939e", "end", 8.6, 400);
    for (i = 0; i <= 4; i++) {
      var nv = i * 1000, yy = G.y(nv);
      el("line", { x1: G.px, y1: yy, x2: G.px + G.pw, y2: yy, stroke: "#e6edf3", "stroke-width": 1 }, gA);
      tx(gA, G.px - 8, yy + 3, String(nv), "#8a939e", "end", 8, 400);
    }
    for (i = 0; i <= 3; i++) tx(gA, G.x(i * 5), G.bt + 16, String(i * 5), "#8a939e", "middle", 8, 400);

    /* K 与 K/2 参考线 */
    el("line", { x1: G.px, y1: G.y(K), x2: G.px + G.pw, y2: G.y(K), stroke: "#2f8a5b", "stroke-width": 1, "stroke-dasharray": "4 3" }, gA);
    tx(gA, G.px + G.pw, G.y(K) - 5, "K=1000", "#2f8a5b", "end", 8.4, 700);
    el("line", { x1: G.px, y1: G.y(K / 2), x2: G.px + G.pw, y2: G.y(K / 2), stroke: "#b8791f", "stroke-width": 1, "stroke-dasharray": "4 3" }, gA);
    tx(gA, G.px + G.pw, G.y(K / 2) - 5, "K/2=500", "#b8791f", "end", 8.4, 400);

    /* 曲线 */
    pts = [];
    for (i = 0; i <= 60; i++) { var t0 = i * TMAX / 60; pts.push(G.x(t0).toFixed(1) + "," + G.y(J(t0)).toFixed(1)); }
    el("polyline", { points: pts.join(" "), fill: "none", stroke: "#b8402f", "stroke-width": 2.2 }, gA);
    pts = [];
    for (i = 0; i <= 60; i++) { var t1 = i * TMAX / 60; pts.push(G.x(t1).toFixed(1) + "," + G.y(S(t1)).toFixed(1)); }
    el("polyline", { points: pts.join(" "), fill: "none", stroke: "#2f8a5b", "stroke-width": 2.2 }, gA);

    /* 当前 t 的竖线与两点 */
    var cx = G.x(s.t), yJ = G.y(s.J), yS = G.y(s.S);
    el("line", { x1: cx, y1: G.py, x2: cx, y2: G.bt, stroke: "#c9d2db", "stroke-width": 1, "stroke-dasharray": "3 3" }, gA);
    el("circle", { cx: cx, cy: yJ, r: 4, fill: "#b8402f" }, gA);
    el("circle", { cx: cx, cy: yS, r: 4, fill: "#2f8a5b" }, gA);
    tx(gA, cx + 9, yJ - 7, "J " + num(s.J), "#b8402f", "start", 8.8, 700);
    tx(gA, cx + 9, yS + 15, "S " + num(s.S), "#2f8a5b", "start", 8.8, 700);

    /* ---- 右：同一 t 的两个读数 ---- */
    el("rect", { x: b.x, y: b.y, width: b.w, height: b.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    tx(gB, b.x + 16, b.y + 26, "同一个 t，两个模型的差值", "#5a6472", "start", 10.5, 700);
    tx(gB, b.x + 16, b.y + 42, "条形长度按 √N 画，只为看清 0–15 代的差别", "#8a939e", "start", 8.2, 400);

    var y1 = G.rb.y + 96, y2 = y1 + 66, bh = 24;
    var lenK = Math.sqrt(K / YMAX) * G.len, lenH = Math.sqrt(K / 2 / YMAX) * G.len;
    el("line", { x1: G.ax + lenK, y1: y1 - 34, x2: G.ax + lenK, y2: y2 + 34, stroke: "#2f8a5b", "stroke-width": 1, "stroke-dasharray": "4 3" }, gB);
    tx(gB, G.ax + lenK, y1 - 40, "K", "#2f8a5b", "middle", 9, 700);
    el("line", { x1: G.ax + lenH, y1: y1 - 34, x2: G.ax + lenH, y2: y2 + 34, stroke: "#b8791f", "stroke-width": 1, "stroke-dasharray": "4 3" }, gB);
    tx(gB, G.ax + lenH, y1 - 40, "K/2", "#b8791f", "middle", 9, 400);
    el("line", { x1: G.ax, y1: y1 - 30, x2: G.ax, y2: y2 + 30, stroke: "#d5dbe2", "stroke-width": 1.2 }, gB);

    var lj = Math.sqrt(s.J / YMAX) * G.len, ls = Math.sqrt(s.S / YMAX) * G.len;
    tx(gB, G.ax - 8, y1 + 16, "J 形", "#b8402f", "end", 9.4, 700);
    el("rect", { x: G.ax, y: y1, width: lj, height: bh, rx: 4, fill: "#f6d5ce", stroke: "#b8402f", "stroke-width": 1 }, gB);
    tx(gB, G.ax + lj + 7, y1 + 16, num(s.J), "#b8402f", "start", 9, 700);
    tx(gB, G.ax - 8, y2 + 16, "S 形", "#2f8a5b", "end", 9.4, 700);
    el("rect", { x: G.ax, y: y2, width: ls, height: bh, rx: 4, fill: "#d6efe2", stroke: "#2f8a5b", "stroke-width": 1 }, gB);
    tx(gB, G.ax + ls + 7, y2 + 16, num(s.S), "#2f8a5b", "start", 9, 700);

    var ratio = s.S > 0 ? s.J / s.S : 1;
    tx(gB, b.x + 16, y2 + 70, "J ÷ S = ×" + ratio.toFixed(2) + (ratio > 1.05 ? "（J 已甩开 S）" : "（两条线还挨着）"), "#3a3a35", "start", 9.2, 700);
    tx(gB, b.x + 16, y2 + 94, "J 形是理想条件：λ 恒定，没有上限", "#b8402f", "start", 9, 400);
    tx(gB, b.x + 16, y2 + 112, "S 形在 K/2 时增长速率最大，到 K 时为 0", "#2f8a5b", "start", 9, 400);
  }

  function render() {
    if (!G) { L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N; G = geom(); }
    var s = calc(A), st, col, bg, sn;
    $("gxVa").textContent = String(Math.round(A * 10) / 10);
    $("gxVb").textContent = num(s.J);
    $("gxVc").textContent = num(s.S);
    if (A <= 5) { st = "两条线还挨着"; sn = "差别小于 10%"; col = "#2f8a5b"; bg = "#e6f6ee"; }
    else if (A < 8) { st = "开始分岔"; sn = "J 形开始甩开 S 形"; col = "#b8791f"; bg = "#fdf3e0"; }
    else { st = "J 形继续翻倍"; sn = "S 形趋向 K"; col = "#b8402f"; bg = "#fbeae7"; }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    draw();
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    stage.setAttribute("viewBox", L.vb);
    G = geom();
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 0 }, { t: 1.2, v: 0 }, { t: 4, v: 10 }, { t: 6.5, v: 10 }, { t: 9, v: 15 }, { t: 11, v: 7 }, { t: 13, v: 0 }],
    keys: [0, 7, 10, 15],
    value: A, min: 0, max: 15, step: 1,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__bio = { calc: calc, cases: [
    { v: 5, eq: { J: 75.9, S: 109.5 } },
    { v: 10, eq: { J: 576.7, S: 600 } },
    { v: 15, eq: { J: 4378.9, S: 999.9 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
