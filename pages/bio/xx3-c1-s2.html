<p class="gx-lede">这一节是「发酵工程」的地基：先会给微生物配饭（培养基），再保证饭里只有一种客人（无菌技术），最后把客人清点出来（计数）。三件事对应三个扣分点：消毒与灭菌混为一谈、用平板划线法统计活菌、以为平板计数结果偏大。把这三个坑填平，本节的选择题和填空题基本就稳了。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 培养基的成分<span class="q-src">人教版（2019）选择性必修3 · 第1章第2节</span></p>
<p class="q-b">培养基一般都含有水、碳源、氮源和无机盐，此外还要满足微生物对 pH、特殊营养物质以及氧气的需求。</p>
<p class="q-n">→ 翻成人话：这句话由<b>两组条件</b>组成——① 四类基础营养（水、碳源、氮源、无机盐）；② 三个环境条件（pH、特殊营养物质、氧气）。少写一组就丢分：只写「碳源、氮源」的答案，漏了水和无机盐；只写四类营养的答案，漏了 pH 和氧气。碳源不一定是糖（自养型可用 CO₂），氮源不一定是蛋白质（固氮菌可用 N₂）。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 无菌技术<span class="q-src">人教版（2019）选择性必修3 · 第1章第2节</span></p>
<p class="q-b">获得纯净培养物的关键是防止杂菌污染，方法包括消毒和灭菌。</p>
<p class="q-n">→ 翻成人话：消毒和灭菌是<b>两个不同的概念</b>，判据只有一条——<b>能不能杀死芽孢</b>。消毒只杀死物体表面或内部的一部分微生物（包括病原体），不保证杀死芽孢；灭菌要杀死包括芽孢在内的所有微生物。所以「消毒就是灭菌」是错句；「灭菌只杀死细菌繁殖体」也是错句。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 活菌计数<span class="q-src">人教版（2019）选择性必修3 · 第1章第2节</span></p>
<p class="q-b">稀释涂布平板法可以用于统计样品中的活菌数目。</p>
<p class="q-n">→ 翻成人话：统计活菌只能用<b>稀释涂布平板法</b>，不能用平板划线法——划线只是为了分离纯化，长出的菌落连成片，没法数。计数公式是 <span class="gx-fml">活菌数 = 平均菌落数 ÷ 涂布体积 × 稀释倍数</span>；两个菌落长在一起时只算一个，所以结果通常<b>偏小</b>。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>消毒</th><th>灭菌</th></tr></thead>
<tbody>
<tr><td>目的</td><td>杀死物体表面或内部的一部分微生物</td><td>杀死包括芽孢在内的所有微生物</td></tr>
<tr><td>对象</td><td>操作者手部、空气、牛奶、餐具</td><td>培养基、玻璃器皿、接种环、金属用具</td></tr>
<tr><td>典型方法</td><td>煮沸、巴氏消毒、紫外线照射、酒精擦拭</td><td>高压蒸汽、干热、灼烧</td></tr>
<tr class="key"><td>真正的区别</td><td>不要求杀死芽孢，处理后仍可能有活菌</td><td>必须杀死芽孢，处理后无活菌</td></tr>
<tr><td>强度</td><td>较温和，可对活体或食品使用</td><td>较强烈，只能对器具和培养基使用</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">背法：先问「要不要连芽孢一起杀」——要，就是灭菌；不要，才是消毒。培养基、培养皿、接种环一律按灭菌处理；双手、桌面、空气按消毒处理。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 稀释涂布平板法估算活菌数<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">某样品稀释 10⁵ 倍后，取 0.1 mL 涂布到平板上，培养后平板上长出 100 个菌落。估算该样品中活菌的数量（个/mL），并说明该结果可能偏大还是偏小。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题：抓三个量</p>
<p class="s-b">稀释倍数 10⁵、涂布体积 0.1 mL、平均菌落数 100 个。三个量缺一不可，尤其别把 0.1 mL 当成 1 mL。</p>
<p class="s-k">用到：稀释涂布平板法的计数公式。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 先算 1 mL 稀释液</p>
<p class="s-b">100 个菌落来自 0.1 mL，所以 1 mL 稀释液中有 100 ÷ 0.1 = 1000 个活菌。</p>
<p class="s-k">用到：菌落数 ÷ 涂布体积。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 再乘回稀释倍数</p>
<p class="s-b">稀释液由原样品稀释 10⁵ 倍得到，所以原样品中活菌数为 1000 × 10⁵ = 1×10⁸ 个/mL。</p>
<p class="s-k">用到：<span class="gx-fml">活菌数 = 平均菌落数 ÷ 涂布体积 × 稀释倍数</span>。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 判断偏大还是偏小</p>
<p class="s-b">两个菌落长在一起时，计数时只算一个，所以统计值通常比实际值小。若菌落数不在 30–300 内，误差还会更大，需要重新稀释。</p>
<p class="s-k">用到：平板计数结果偏小的原因。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 组织答案</p>
<p class="s-b">先写公式，再代入数据，最后补一句「结果可能偏小」。三句话就是满分结构，别只丢一个数字。</p>
<p class="s-k">用到：计算 + 误差分析。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">① 活菌数 = 平均菌落数 ÷ 涂布体积 × 稀释倍数 = 100 ÷ 0.1 × 10⁵ = 1×10⁸ 个/mL。② 由于两个菌落连在一起时只算一个，该结果可能偏小；为保证准确，应选择菌落数在 30–300 之间的平板进行计数。</p>

<h2><span class="sn">05</span>会怎么考</h2>

<div class="gx-qa">
<div class="qac">
<p class="q">「消毒和灭菌到底差在哪？不都是杀死微生物吗？」</p>
<p class="a">差在<b>要不要杀死芽孢</b>。消毒只杀死物体表面或内部的一部分微生物；灭菌要杀死包括芽孢在内的所有微生物。培养基、接种环必须灭菌，双手和桌面只能消毒。</p>

<p class="a">不够。培养基一般都含<b>水、碳源、氮源、无机盐</b>，还要满足微生物对 <b>pH、特殊营养物质和氧气</b> 的需求。缺水和无机盐配不出培养基，缺 pH 和氧气则长不好。</p>

<p class="q">「统计活菌为什么非得用稀释涂布平板法，平板划线法不行吗？」</p>

<p class="q">「平板计数算出来的数，是不是比实际活菌数偏大？」</p>

<p class="a">靠<b>营养或条件的选择性</b>：缺氮源只让固氮菌长，加抗生素只让抗性菌长，高温只让耐热菌长。目标菌能活、其他菌被抑制，这就是「选择」；它不靠颜色区分，靠<b>活不活</b>。</p>

<div class="qac">
<p class="q">「菌落数不是越多越好数吗？为什么非要 30–300？」</p>
<p class="a">太多会<b>连成片</b>，彼此重叠，数不清也数不准；太少则<b>偶然误差大</b>，一个菌落的差别就能让结果翻倍。30–300 是统计上比较可靠的区间，超出就重新稀释。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="30 到 300 是可数区间，太少或太多都不适合计数">

<rect x="92" y="54" width="70" height="28" fill="#e8f6ee" stroke="#b8e6d0"/>
<text x="127" y="72" text-anchor="middle" font-size="8" font-weight="700" fill="#2f8a5b">30–300</text>
<circle cx="127" cy="82" r="4" fill="#2f8a5b"/>
<text x="40" y="102" font-size="7.8" fill="#b8402f">太少：误差大</text>
<text x="168" y="102" font-size="7.8" fill="#b8402f">太多：连成片</text>
</svg>
</div>
</div>
<p class="gx-note">这六问其实是同一件事的两面：<b>无菌</b>保证只有目标菌，<b>计数</b>保证数得准。消毒与灭菌的分界在芽孢，计数方法的分界在「能不能逐个菌落数」，结果偏小的原因在「两个菌落只算一个」。</p>
</section>

<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 消毒就是灭菌，只是叫法不同</p>
<p class="er-v">✓ 消毒只杀死一部分微生物，灭菌要杀死包括芽孢在内的所有微生物</p>
<p class="er-w">错在哪：把两个概念合并了。<b>芽孢</b>是判据——消毒拿芽孢没办法，灭菌必须杀死芽孢。</p>
</div>
<div class="er">
<p class="er-x">✗ 用平板划线法统计样品中的活菌数</p>
<p class="er-v">✓ 统计活菌数用稀释涂布平板法，平板划线法只用于分离纯化</p>
<p class="er-w">错在哪：划线后菌落沿划线连成片，无法逐个计数；能计数的是<b>稀释涂布平板法</b>。</p>
</div>
<div class="er">
<p class="er-x">✗ 平板计数结果通常偏大</p>
<p class="er-v">✓ 平板计数结果通常偏小，因为两个菌落连在一起时只算一个</p>
<p class="er-w">错在哪：方向记反了。连片、重叠都会让统计值变小，所以教材说结果可能<b>偏小</b>。</p>
</div>
<div class="er">
<p class="er-x">✗ 培养基只需要碳源和氮源</p>
<p class="er-v">✓ 培养基一般都含水、碳源、氮源、无机盐，还要满足 pH、特殊营养物质和氧气的需求</p>
<p class="er-w">错在哪：漏了水和无机盐，也漏了三个环境条件。答题要写全两组。</p>
</div>
<div class="er">
<p class="er-x">✗ 菌落数越多，计数结果越准</p>
<p class="er-v">✓ 应选择菌落数在 30–300 之间的平板计数</p>
<p class="er-w">错在哪：菌落太多会连成片，彼此遮挡，反而数不准；太少则偶然误差大。</p>
</div>
<div class="er">
<p class="er-x">✗ 灭菌只杀死细菌的繁殖体</p>
<p class="er-v">✓ 灭菌要杀死包括芽孢在内的所有微生物</p>
<p class="er-w">错在哪：繁殖体容易被杀死，真正难杀的是<b>芽孢</b>；只杀繁殖体的那是消毒。</p>
</div>
<div class="er">
<p class="er-x">✗ 用紫外线照射培养基来灭菌</p>
<p class="er-v">✓ 培养基用高压蒸汽灭菌；紫外线只用于接种室空气和操作台表面</p>
<p class="er-w">错在哪：紫外线穿透力弱，照不到培养基内部；培养基灭菌的标准方法是高压蒸汽灭菌。</p>
</div>
