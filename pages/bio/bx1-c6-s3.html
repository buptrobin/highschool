<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 细胞衰老的特征<span class="q-src">人教版（2019）必修1 · 第6章第3节</span></p>
<p class="q-b">细胞内水分减少，细胞萎缩，体积变小；多种酶的活性降低；色素逐渐积累；呼吸速率减慢，细胞核体积增大，染色质收缩，染色加深；细胞膜通透性改变，使物质运输功能降低。</p>
<p class="q-n">→ 翻成人话：这句话是<b>五个条件</b>并列，考试按点给分。<b>①</b>「水分减少」推出「细胞萎缩、体积变小」，说的是<b>细胞整体</b>变小；<b>②</b>「多种酶的活性降低」不是「所有酶都失活」，别写成「酶全部失去活性」；<b>③</b>「色素逐渐积累」——老年斑就落在这一条；<b>④</b>「呼吸速率减慢」，同时<b>细胞核体积增大</b>，染色质收缩、染色加深；<b>⑤</b> 细胞膜通透性改变，结果是物质运输功能<b>降低</b>。五条里只有核体积是「增大」，写反就是本节第一号扣分点。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 细胞凋亡<span class="q-src">人教版（2019）必修1 · 第6章第3节</span></p>
<p class="q-b">细胞凋亡是由基因所决定的细胞自动结束生命的过程。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个条件</b>组成。<b>①</b>「由基因决定」= 程序性，细胞有固定的遗传程序，不是被外界弄坏的；<b>②</b>「自动结束」= 细胞自己启动，不是被动死亡；<b>③</b> 这个过程的<b>结果对个体有利</b>——清除多余、衰老、受损或被病原体感染的细胞。少写「基因决定」，就分不清凋亡和坏死；少写「对个体有利」，就会把它当成病理性死亡。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 细胞坏死<span class="q-src">人教版（2019）必修1 · 第6章第3节</span></p>
<p class="q-b">细胞坏死是在种种不利因素影响下，由于细胞正常代谢活动受损或中断引起的细胞损伤和死亡。</p>
<p class="q-n">→ 翻成人话：这句话也由<b>三个条件</b>组成。<b>①</b> 有<b>不利因素</b>：缺氧、高温、强酸强碱、机械损伤等；<b>②</b> 机制是<b>正常代谢活动受损或中断</b>，不是基因编程；<b>③</b> 结果是细胞损伤和死亡，<b>对个体有害</b>，还常引起炎症。与凋亡对照记：一个「按程序自己死」，一个「被弄坏而死」。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>细胞凋亡</th><th>细胞坏死</th></tr></thead>
<tbody>
<tr><td>触发因素</td><td>正常的生理信号（发育、清除衰老或受损细胞）</td><td>缺氧、高温、强酸强碱、机械损伤等不利因素</td></tr>
<tr><td>谁在控制</td><td>由基因决定，按程序进行</td><td>不受基因编程控制，代谢活动受损或中断</td></tr>
<tr class="key"><td>对个体</td><td>有利：完成正常发育、维持内部环境稳定</td><td>有害：细胞损伤，常引起炎症</td></tr>
<tr><td>典型例子</td><td>蝌蚪尾消失、胎儿手指间蹼消失、被病原体感染细胞的清除</td><td>烧伤、冻伤、缺血造成的细胞死亡</td></tr>
<tr><td>细胞结局</td><td>细胞解体成凋亡小体，被吞噬，不引起炎症</td><td>细胞膜破裂，内容物外溢，引起炎症</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只高亮 1 行：<b>对个体</b>。这一行才是凋亡与坏死的分水岭——「谁启动」和「按不按程序」都是过程，考试最后落到的往往是「对个体有利还是有害」。一句话记：<b>凋亡是「按程序自己死」，坏死是「被弄坏而死」</b>。另外别忘了：细胞衰老仍然属于活细胞的生命历程，<b>衰老 ≠ 死亡</b>。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。这类题的分不在背诵，在「把哪一条特征调到题干上」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 用细胞衰老解释老年斑<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">老年人皮肤上常出现老年斑。请从细胞衰老的角度解释老年斑形成的原因。（4 分）<br>（陷阱：只写「皮肤老化」或「色素增多」拿不到全分——题目要的是「细胞衰老」这个角度，并且要写出积累的过程。）</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题：先锁定「细胞衰老」这个角度</p>
<p class="s-b">题干问的是机制，不是现象描述。老年斑长在皮肤上，但原因要落到细胞层面——<b>皮肤细胞衰老</b>。不要答成「因为人老了，所以长老年斑」，那是循环论证，等于没说。</p>
<p class="s-k">用到：细胞衰老的特征。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 调取对应特征：五条里只挑「色素」</p>
<p class="s-b">细胞衰老有五条特征，与「斑」直接对应的是<b>色素逐渐积累</b>。其余四条——水分减少、酶活性降低、呼吸速率减慢、细胞核体积增大、膜通透性改变——都不是「斑」的直接原因，全写上去不加分，还会冲淡要点。</p>
<p class="s-k">用到：衰老细胞中色素逐渐积累。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 把「积累」讲成过程</p>
<p class="s-b">衰老细胞中色素（如脂褐素）逐渐积累；随年龄增长，皮肤中衰老细胞增多，色素积累也增多，沉积在皮肤细胞中，皮肤表面就出现老年斑。关键词是「逐渐」「积累」「沉积」——缺一个都显得跳步。</p>
<p class="s-k">用到：色素逐渐积累；衰老细胞随年龄增长而增多。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 组织成答题卡语言</p>
<p class="s-b">按「判据 → 机制 → 落到题干」三句话写：先点明这是细胞衰老，再写色素逐渐积累、随年龄增多，最后写沉积在皮肤细胞中形成老年斑。4 分的题写到这三点就够，不要展开成细胞坏死或凋亡。</p>
<p class="s-k">用到：细胞衰老的特征；个体衰老与细胞衰老有关但不等同。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 4</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">① 老年斑是皮肤细胞衰老的结果。<br>② 细胞衰老的特征之一是<b>色素逐渐积累</b>；随年龄增长，皮肤中衰老细胞增多，色素积累增多。<br>③ 色素（如脂褐素）沉积在皮肤细胞中，使皮肤表面出现老年斑。</p>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。每问都按「先给判据、再给结论」答。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「衰老细胞的细胞核，是变大还是变小？」</p>
<p class="a">变大。细胞衰老时<b>细胞核体积增大</b>，染色质收缩、染色加深；同时细胞整体<b>萎缩、体积变小</b>。两句话不矛盾：前者说核，后者说整个细胞。所以「细胞变小所以核也变小」是推错的。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="细胞整体体积变小，而细胞核体积增大">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<rect x="22" y="30" width="82" height="58" rx="6" fill="#eef7f2" stroke="#7fc3a2"/>
<text x="63" y="54" text-anchor="middle" class="ms">细胞整体</text>
<text x="63" y="72" text-anchor="middle" class="ms">体积变小</text>
<text x="120" y="66" text-anchor="middle" class="ms">→</text>

<text x="178" y="54" text-anchor="middle" class="ms">细胞核</text>
<text x="178" y="72" text-anchor="middle" class="ms">体积增大</text>
<text x="120" y="108" text-anchor="middle" class="ms">核体积增大与细胞萎缩并存</text>
</svg>
</div>
<div class="qac">
<p class="q">「细胞凋亡和细胞坏死怎么区分？」</p>
<p class="a">看三件事：<b>谁启动</b>（基因程序 / 外界不利因素）、<b>按不按程序</b>（程序性 / 代谢受损或中断）、<b>对个体有没有利</b>（有利 / 有害）。凋亡由基因决定、对个体有利；坏死由缺氧高温损伤等引起、对个体有害。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="凋亡与坏死的三项判据对照">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="60" y="40" text-anchor="middle" class="ms">细胞凋亡</text>
<text x="60" y="58" text-anchor="middle" class="ms">基因决定</text>
<text x="60" y="76" text-anchor="middle" class="ms">程序性</text>
<text x="60" y="94" text-anchor="middle" class="ms">对个体有利</text>
<text x="180" y="40" text-anchor="middle" class="ms">细胞坏死</text>
<text x="180" y="58" text-anchor="middle" class="ms">不利因素</text>
<text x="180" y="76" text-anchor="middle" class="ms">病理性</text>
<text x="180" y="94" text-anchor="middle" class="ms">对个体有害</text>
<line x1="120" y1="26" x2="120" y2="58" stroke="#dde4ea" stroke-width="1"/>
<line x1="120" y1="84" x2="120" y2="104" stroke="#dde4ea" stroke-width="1"/>
<text x="120" y="76" text-anchor="middle" class="ms">vs</text>
</svg>
</div>
<div class="qac">
<p class="q">「细胞凋亡对个体有害吗？要不要避免？」</p>
<p class="a">不是。细胞凋亡是<b>正常的生命历程</b>，对个体<b>有利</b>：清除多余、衰老、受损以及被病原体感染的细胞，完成正常发育、维持内部环境稳定。蝌蚪尾消失、胎儿手指间蹼消失都是凋亡，不是病。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="细胞凋亡对个体有利的三个理由">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="24" y="38" class="ms">✓ 清除多余、衰老、受损细胞</text>
<text x="24" y="60" class="ms">✓ 完成正常发育</text>
<text x="24" y="82" class="ms">✓ 维持内部环境稳定</text>
<text x="120" y="108" text-anchor="middle" class="ms">结论：对个体有利，不是坏事</text>
</svg>
</div>
<div class="qac">
<p class="q">「多细胞生物个体衰老，和细胞衰老是一回事吗？」</p>
<p class="a">不是。多细胞生物个体衰老是<b>组成个体的细胞普遍衰老</b>的过程，但老年个体中也有幼嫩细胞，年轻个体中也有衰老、死亡的细胞，所以二者<b>有关，但不等同</b>。只有单细胞生物才能说细胞衰老 = 个体衰老。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="单细胞生物与多细胞生物中个体衰老和细胞衰老的关系">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<rect x="18" y="28" width="96" height="58" rx="6" fill="#eef7f2" stroke="#7fc3a2"/>

<text x="66" y="66" text-anchor="middle" class="ms">细胞衰老</text>
<text x="66" y="80" text-anchor="middle" class="ms">=个体衰老</text>
<rect x="126" y="28" width="96" height="58" rx="6" fill="#eef7f2" stroke="#7fc3a2"/>
<text x="174" y="48" text-anchor="middle" class="ms">多细胞</text>
<text x="174" y="66" text-anchor="middle" class="ms">有关</text>
<text x="174" y="80" text-anchor="middle" class="ms">但不等同</text>
<text x="120" y="108" text-anchor="middle" class="ms">「普遍衰老」不等于「全部衰老」</text>
</svg>
</div>
<div class="qac">
<p class="q">「为什么老年人伤口愈合慢？」</p>
<p class="a">因为皮肤细胞衰老后<b>多种酶的活性降低</b>、呼吸速率减慢、代谢减慢，<b>细胞增殖能力下降</b>，组织修复所需的细胞补充不过来，所以愈合慢。这是细胞衰老在个体上的表现，不是「细胞都死了」。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="老年人伤口愈合慢的细胞层面原因链">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>

<text x="24" y="78" class="ms">代谢减慢、细胞增殖能力下降</text>
<text x="24" y="100" class="ms">→ 组织修复慢，愈合延迟</text>
<text x="120" y="118" text-anchor="middle" class="ms">不是「细胞都死了」</text>
</svg>
</div>
<div class="qac">
<p class="q">「被病原体感染的细胞被清除，属于凋亡还是坏死？」</p>
<p class="a">属于<b>细胞凋亡</b>。这是由基因决定的程序性死亡，免疫系统把被感染的细胞清除掉，<b>对个体有利</b>；不缺氧、不是代谢受损，所以不是坏死。</p>

<p class="gx-note">这六问其实是同一件事：<b>先分清「谁的事」和「哪种死」</b>。涉及衰老，先问是个体还是细胞、是整体还是细胞核；涉及死亡，先问基因程序还是外界损伤、对个体有利还是有害。判据对了，例子和理由都能自己推出来。</p>

<p class="er-v">✓ 细胞衰老时细胞核体积增大，染色质收缩、染色加深；细胞整体萎缩、体积变小。</p>
<p class="er-w">错在哪：把「细胞变小」推成「核也变小」。核体积增大是五条特征里结构上唯一「变大」的一项，方向写反必扣分。</p>

<p class="er-w">错在哪：只抓「都死了」这个共同结果，丢掉启动机制和对个体的意义。两者不能互相替换。</p>

<p class="er-w">错在哪：把「坏死」当成「细胞死亡」的全部。细胞死亡包括凋亡和坏死，前者正常、后者病理。</p>

<p class="er-w">错在哪：方向反了，「改变」不等于「增强」。五条特征里，下降的写成上升、上升的写成下降，都是这一类错误。</p>

<script>
/* 互动脚本本体（由 build-page.mjs 包进 <script> 里，所以这里不要写 <script> 标签） */
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var GX = window.GX, el = GX.el, tx = GX.tx, poly = GX.poly, $ = GX.$;
  var stage = $("gxStage");
  if (!stage || !window.AutoPilot) return;

  /* 两套坐标：宽屏 880×470，窄屏独立 360×700 */
  var W = { vb: "0 0 880 470", left: { x: 16, y: 16, w: 424, h: 438 }, right: { x: 456, y: 16, w: 408, h: 438 } };
  var N = { vb: "0 0 360 700", left: { x: 8, y: 8, w: 344, h: 300 }, right: { x: 8, y: 320, w: 344, h: 372 } };
  var L = W, A = 0;

  /* 纯函数：衰老程度 a → 四项相对值。render() 和 __bio.cases 都用它 */
  function calc(v) {
    return {
      water: 100 - 0.45 * v,   /* 细胞内水分（相对） */
      enzyme: 100 - 0.60 * v,  /* 多种酶的活性（相对） */
      pigment: 0.8 * v,        /* 色素积累（相对） */
      nucleus: 100 + 0.50 * v  /* 细胞核体积（相对） */
    };
  }

  var DOTS = [
    [-0.62, -0.38], [0.58, -0.46], [-0.30, 0.62], [0.66, 0.28],
    [-0.72, 0.10], [0.10, -0.70], [0.38, 0.66], [-0.48, 0.50],
    [0.74, -0.10], [-0.10, 0.24], [0.26, 0.44], [-0.38, -0.66],
    [0.60, 0.54], [-0.68, -0.12]
  ];

  function draw() {
    var s = calc(A), gA = $("gxA"), gB = $("gxB");
    var p = L.left, r = L.right;
    gA.textContent = ""; gB.textContent = "";

    el("rect", { x: p.x, y: p.y, width: p.w, height: p.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    el("rect", { x: r.x, y: r.y, width: r.w, height: r.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    tx(gA, p.x + 20, p.y + 30, "① 衰老中的细胞（示意，随 a 变化）", "#5a6472", "start", 10.5, 700);
    tx(gB, r.x + 20, r.y + 30, "② 四项相对值（年轻细胞 = 100）", "#5a6472", "start", 10.5, 700);

    /* ---- 左：细胞整体缩小，细胞核反而增大 ---- */
    var k = A / 100;
    var cx = p.x + p.w * 0.5;
    var cy = p.y + p.h * 0.47;
    var rx0 = Math.min(p.w * 0.40, p.h * 0.36);
    var ry0 = p.h * 0.27;
    var shrink = 1 - 0.34 * k;
    var rx = rx0 * shrink, ry = ry0 * shrink;
    var nr = Math.min(rx, ry) * (0.24 + 0.30 * k);

    el("ellipse", { cx: cx, cy: cy, rx: rx, ry: ry, fill: "#eef7f2", stroke: "#7fc3a2", "stroke-width": 1.3 }, gA);

    var n = Math.round((A / 100) * DOTS.length);
    for (var i = 0; i < n; i++) {
      el("circle", {
        cx: cx + DOTS[i][0] * rx * 0.84,
        cy: cy + DOTS[i][1] * ry * 0.84,
        r: 3, fill: "#b8791f"
      }, gA);
    }

    el("circle", { cx: cx, cy: cy, r: nr, fill: "#dfe9f5", stroke: "#8fa6c4", "stroke-width": 1.1 }, gA);
    el("path", {
      d: poly([
        [cx - nr * 0.58, cy - nr * 0.30], [cx - nr * 0.18, cy - nr * 0.48],
        [cx + nr * 0.22, cy - nr * 0.16], [cx + nr * 0.52, cy - nr * 0.34]
      ]),
      fill: "none", stroke: "#6d7f99", "stroke-width": 1, opacity: 0.7
    }, gA);
    el("path", {
      d: poly([
        [cx - nr * 0.46, cy + nr * 0.34], [cx - nr * 0.10, cy + nr * 0.16],
        [cx + nr * 0.26, cy + nr * 0.40]
      ]),
      fill: "none", stroke: "#6d7f99", "stroke-width": 1, opacity: 0.7
    }, gA);
    tx(gA, cx, cy + 3.4, "核", "#44546a", "middle", 9.5, 700);

    tx(gA, p.x + 20, p.y + p.h - 54, "细胞整体：萎缩、体积变小（水分↓）", "#3a3a35", "start", 9.6, 400);
    tx(gA, p.x + 20, p.y + p.h - 32, "细胞核：体积增大、染色加深（与萎缩反向）", "#b8402f", "start", 9.6, 700);

    /* ---- 右：四条相对值，核体积与细胞整体萎缩反向 ---- */
    var bx = r.x + (p.w < 400 ? 84 : 104);
    var bw = r.w - (bx - r.x) - 70;
    var y0 = r.y + r.h * 0.20;
    var gap = r.h * 0.16;
    var bh = p.w < 400 ? 14 : 18;
    var rows = [
      { k: "细胞内水分", v: s.water, f: "#a8d8ef", st: "#5e9fc4" },
      { k: "酶活性", v: s.enzyme, f: "#9fd8bb", st: "#5fb98c" },
      { k: "色素积累", v: s.pigment, f: "#f0c07a", st: "#c98a2c" },
      { k: "细胞核体积", v: s.nucleus, f: "#b9c6dc", st: "#7d8ea8" }
    ];

    var refX = bx + bw * (100 / 150);
    el("line", { x1: refX, y1: y0 - 12, x2: refX, y2: y0 + 3 * gap + bh + 8, stroke: "#c3ccd4", "stroke-width": 1, "stroke-dasharray": "3 3" }, gB);
    tx(gB, refX, y0 - 16, "基准 100", "#8a949e", "middle", 8.8, 400);

    for (var j = 0; j < rows.length; j++) {
      var y = y0 + j * gap;
      var w = Math.max(4, bw * rows[j].v / 150);
      el("rect", { x: bx, y: y, width: w, height: bh, rx: 4, fill: rows[j].f, stroke: rows[j].st }, gB);
      tx(gB, r.x + 20, y + bh - 4, rows[j].k, "#3a3a35", "start", 9.6, 400);
      tx(gB, bx + w + 8, y + bh - 4, rows[j].v.toFixed(1), "#151a21", "start", 9.4, 700);
    }

    tx(gB, r.x + 20, r.y + r.h - 58,
      "a=" + Math.round(A) + "：水 " + s.water.toFixed(1) + " · 酶 " + s.enzyme.toFixed(1) +
      " · 色素 " + s.pigment.toFixed(1) + " · 核 " + s.nucleus.toFixed(1),
      "#3a3a35", "start", 9.2, 700);
    tx(gB, r.x + 20, r.y + r.h - 36, "水分、酶下降，核体积反而最大", "#b8402f", "start", 9.2, 400);
  }

  function render() {
    var s = calc(A), st, col, bg, sn;
    $("gxVa").textContent = String(Math.round(A));
    $("gxVb").textContent = s.water.toFixed(1);
    $("gxVc").textContent = s.nucleus.toFixed(1);
    if (A < 20) { st = "年轻细胞"; col = "#2f8a5b"; bg = "#e6f6ee"; sn = "水分充足，酶活性高"; }
    else if (A <= 60) { st = "衰老早期"; col = "#b8791f"; bg = "#fdf3e0"; sn = "水分、酶活性开始下降"; }
    else if (A < 100) { st = "明显衰老"; col = "#b8402f"; bg = "#fbeae7"; sn = "水分、酶下降，核体积已增大"; }
    else { st = "濒临凋亡"; col = "#b8402f"; bg = "#fbeae7"; sn = "核体积 150，与细胞萎缩反向"; }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    draw();
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 0 }, { t: 1, v: 0 }, { t: 3.5, v: 50 }, { t: 6, v: 100 }, { t: 8.5, v: 100 }, { t: 11, v: 0 }],
    keys: [0, 20, 60, 100],
    value: A, min: 0, max: 100, step: 1,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__bio = { calc: calc, cases: [
    { v: 0, eq: { water: 100, enzyme: 100, pigment: 0, nucleus: 100 } },
    { v: 50, eq: { water: 77.5, enzyme: 70, pigment: 40, nucleus: 125 } },
    { v: 100, eq: { water: 55, enzyme: 40, pigment: 80, nucleus: 150 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
