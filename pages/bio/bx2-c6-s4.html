<span><i></i>人教版（2019）必修2 第6章第4节</span>

<span><i></i>含 1 个互动模型</span>

<p class="gx-lede">这一节是第6章的收尾：前几节讲「一个种群怎么变」，这一节把镜头拉到「物种与物种、生物与环境之间怎么互相改」。全章最容易丢分的一句话是「协同进化只有生物与生物之间」——课本原话里明明还写着「生物与无机环境之间」。第二容易丢的是把生物多样性窄化成「物种多」，忘了基因和生态系统两个层次，也忘了物种多不等于多样性高（还要看均匀度）。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 协同进化<span class="q-src">人教版（2019）必修2 · 第6章第4节</span></p>
<p class="q-b">不同物种之间、生物与无机环境之间在相互影响中不断进化和发展，这就是协同进化。</p>
<p class="q-n">→ 翻成人话：这句话由<b>两个条件</b>组成（①不同物种之间 ②生物与无机环境之间），而且是「<b>相互</b>影响、<b>不断</b>进化」——不是一方改造另一方。少写第②个方向，就是最常见的扣分点：协同进化包括生物与生物、生物与无机环境两个方向。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 生物多样性的层次<span class="q-src">人教版（2019）必修2 · 第6章第4节</span></p>
<p class="q-b">生物多样性包括基因多样性（遗传多样性）、物种多样性和生态系统多样性。</p>
<p class="q-n">→ 翻成人话：层次数是<b>固定的三个</b>，且顺序由小到大：基因 → 物种 → 生态系统。答题只写「物种多样性」等于只答三分之一；写「生物多样性有三个层次」时，后面必须把三个名字都摆出来。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 结论句<span class="q-src">人教版（2019）必修2 · 第6章第4节</span></p>
<p class="q-b">生物多样性是协同进化的结果。</p>
<p class="q-n">→ 翻成人话：这句是<b>因果句</b>，考试常倒过来问「为什么说生物多样性是协同进化的结果」。答题必须落到「物种之间相互选择 + 生物与环境相互改造 + 长期相互影响」这三步，只说「因为进化了」不得分。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>层次</th><th>看的是什么</th><th>课本例子</th><th>最常见的错认</th></tr></thead>
<tbody>
<tr><td>基因多样性</td><td>同一物种内基因（等位基因）的差异</td><td>一个物种的不同品种、不同抗性个体</td><td>以为「同一物种就没有多样性」</td></tr>
<tr><td>物种多样性</td><td>群落中物种数目的多少</td><td>群落里物种越丰富，物种多样性越高</td><td>以为物种数就是多样性的全部</td></tr>
<tr class="key"><td>生态系统多样性</td><td>生物群落 + 无机环境构成的生态系统类型的差异</td><td>森林、草原、湿地、荒漠等不同类型</td><td>最容易漏答；也最容易被当成物种多样性</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只高亮 1 行（<code>tr class="key"</code>），因为「生态系统多样性」是最容易漏的第三层。背法一句话：<b>基因看「种内」、物种看「种数」、生态系统看「生境类型」</b>——三层各管一段，谁也不能替谁。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 原因解释类简答题<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">某地有传粉昆虫与其访问的多种虫媒花，也有捕食者与被捕食者。<br>（1）从协同进化的角度，说明该地生物多样性是怎样形成的。<br>（2）有同学说「捕食者的存在会使猎物走向灭绝，所以对多样性只有坏处」。请评价并说明理由。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 定性：先摆出「两个方向」</p>
<p class="s-b">协同进化的定义里含两个方向：不同物种之间、生物与无机环境之间，都是「在相互影响中不断进化和发展」。答题第一句就要把这两个方向写全，不能只写物种之间。</p>
<p class="s-k">用到：协同进化的概念边界。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 生物与生物：相互选择</p>
<p class="s-b">传粉昆虫从花中取食花蜜、花粉，同时替花传粉；花的结构、花色、开花时间与昆虫的形态、行为互相匹配，是长期相互选择的结果。捕食者与被捕食者同样如此：捕食者淘汰猎物中的弱者，猎物变难捕又淘汰捕食者中的弱者。</p>
<p class="s-k">用到：相互选择（不是单向）。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 生物与无机环境：相互改造</p>
<p class="s-b">生物的活动改变无机环境（如植被改变土壤、水分、光照），改变后的环境又对生物进行选择。这一步是最容易被漏写的第二个方向。</p>
<p class="s-k">用到：协同进化的第二个方向。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 落到三个层次</p>
<p class="s-b">长期相互影响使种内的基因（等位基因）差异积累 → 基因多样性；使物种数目与类群增多 → 物种多样性；使不同生境上形成不同类型的生态系统 → 生态系统多样性。生物多样性有三个层次，三句都要答到。</p>
<p class="s-k">用到：生物多样性的三个层次。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 评价第二问：不能单向看</p>
<p class="s-b">捕食者确实会淘汰猎物中的弱者，但猎物中不易被捕食的个体被保留并繁殖，猎物种群因此改变；猎物改变后又对捕食者形成新的选择压力。二者相互选择、共同进化，不会出现「捕食者单方面把猎物选择到灭绝」的必然结果。</p>
<p class="s-k">用到：捕食者与被捕食者相互选择，不是单向的。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）① 协同进化包括生物与生物、生物与无机环境两个方向。② 不同物种之间相互影响、相互选择：传粉昆虫与虫媒花在花蜜供应与传粉上互相匹配；捕食者与被捕食者相互选择，不是单向的。③ 生物与无机环境之间相互影响：生物改变环境，改变后的环境又选择生物。④ 长期相互影响使差异不断积累，形成基因多样性、物种多样性、生态系统多样性三个层次。⑤ 因此，生物多样性是协同进化的结果。<br>（2）该说法错误。捕食者与被捕食者相互选择，不是单向的：捕食者淘汰猎物中的弱者，同时猎物中防御、逃避能力强的个体被保留，猎物种群发生改变，又反过来对捕食者形成选择压力；二者共同进化，有利于维持较高的物种多样性。</p>
</div>
</div>
</section>

<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 协同进化就是不同物种之间相互影响、共同进化。</p>
<p class="er-v">✓ 不同物种之间、生物与无机环境之间在相互影响中不断进化和发展，这就是协同进化。</p>
<p class="er-w">错在漏方向：协同进化包括生物与生物、生物与无机环境两个方向，只写前者一半分。</p>
</div>

<div class="er">
<p class="er-x">✗ 生物多样性就是物种多样性。</p>
<p class="er-v">✓ 生物多样性包括基因多样性（遗传多样性）、物种多样性和生态系统多样性。</p>
<p class="er-w">错在窄化：生物多样性有三个层次（基因、物种、生态系统），漏写即失分。</p>
</div>

<div class="er">
<p class="er-x">✗ 捕食者的存在对猎物只有害处，会把猎物选择到灭绝。</p>
<p class="er-v">✓ 捕食者与被捕食者相互选择，不是单向的；二者共同进化，有利于维持物种多样性。</p>
<p class="er-w">错在单向看：猎物中不易被捕食的个体被保留，又反过来选择捕食者。</p>
</div>

<div class="er">
<p class="er-x">✗ 一个群落里物种数越多，生物多样性就一定越高。</p>
<p class="er-v">✓ 物种数多通常多样性高，但还要看均匀度；个体数极不均匀时多样性指数明显下降。</p>
<p class="er-w">错在只看 S 不看均匀度：均匀时 <span class="gx-fml">H′ = lnS</span>，不均匀时 H′ 明显低于 lnS。</p>
</div>

<div class="er">
<p class="er-x">✗ 生物多样性是自然界偶然形成的，与进化无关。</p>
<p class="er-v">✓ 生物多样性是协同进化的结果。</p>
<p class="er-w">错在割裂因果：多样性的三个层次都是长期相互影响、差异不断积累的产物。</p>
</div>

<div class="er">
<p class="er-x">✗ 保护生物多样性就是保护珍稀濒危物种。</p>
<p class="er-v">✓ 保护生物多样性要保护基因、物种、生态系统三个层次，其中保护生境是基础。</p>
<p class="er-w">错在只保一个层次：生境没了，物种和基因都无处存身。</p>
</div>

<div class="er">
<p class="er-x">✗ 协同进化就是趋同进化，反正都是「一起进化」。</p>
<p class="er-v">✓ 协同进化强调不同物种之间、生物与无机环境之间的相互影响；趋同进化是不同物种在相似环境下出现相似性状，两者不是一回事。</p>
<p class="er-w">错在把「相互影响」偷换成「性状相似」：判据是「有没有互为选择压力」。</p>
</div>
</div>

<script>
/* 互动脚本本体（bx2-c6-s4：物种数 S → Shannon / Simpson） */
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var GX = window.GX, el = GX.el, tx = GX.tx, $ = GX.$;
  var stage = $("gxStage");
  if (!stage || !window.AutoPilot) return;

  /* 两套坐标：宽屏 880×470，窄屏独立 360×700 */
  var W = { vb: "0 0 880 470", left: { x: 16, y: 16, w: 424, h: 438 }, right: { x: 456, y: 16, w: 408, h: 438 } };
  var N = { vb: "0 0 360 700", left: { x: 8, y: 8, w: 344, h: 300 }, right: { x: 8, y: 320, w: 344, h: 372 } };
  var L = W, A = 6, G = null;

  /* 每个物种一种形状＋一种颜色；个体数用个数表示（这里各 3 个） */
  var SHAPE = ["circle", "square", "triangle", "diamond", "hex", "star"];
  var COLOR = ["#7fb3d5", "#e0a35c", "#8fb98a", "#c78ab0", "#8c9ec0", "#d98a6a",
    "#6fae9e", "#b0a0c8", "#d9b44a", "#7f9ad0", "#c98a8a", "#87b57a"];

  /* 纯函数：参数 → 数值。render() 和 __bio.cases 都用它 */
  function calc(v) {
    var S = Math.max(2, Math.min(12, Math.round(v)));
    return { s: S, h: Math.log(S), sim: 1 - 1 / S };
  }

  function shape(g, kind, cx, cy, r, fill) {
    var st = { fill: fill, stroke: "#3a4a5a", "stroke-width": 0.9 };
    if (kind === "circle") { st.cx = cx; st.cy = cy; st.r = r; el("circle", st, g); return; }
    if (kind === "square") { st.x = cx - r; st.y = cy - r; st.width = 2 * r; st.height = 2 * r; st.rx = 1.4; el("rect", st, g); return; }
    var p;
    if (kind === "triangle") { p = cx + "," + (cy - r) + " " + (cx + r * 0.9) + "," + (cy + r * 0.62) + " " + (cx - r * 0.9) + "," + (cy + r * 0.62); }
    else if (kind === "diamond") { p = cx + "," + (cy - r) + " " + (cx + r) + "," + cy + " " + cx + "," + (cy + r) + " " + (cx - r) + "," + cy; }
    else if (kind === "hex") { p = cx + "," + (cy - r) + " " + (cx + r * 0.9) + "," + (cy - r * 0.5) + " " + (cx + r * 0.9) + "," + (cy + r * 0.5) + " " + cx + "," + (cy + r) + " " + (cx - r * 0.9) + "," + (cy + r * 0.5) + " " + (cx - r * 0.9) + "," + (cy - r * 0.5); }
    else { p = ""; for (var i = 0; i < 10; i++) { var a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.46 : r; p += (cx + rr * Math.cos(a)) + "," + (cy + rr * Math.sin(a)) + " "; } }
    st.points = p; el("polygon", st, g);
  }

  function geom() {
    var p = L.left, cols = 3;
    return { cols: cols, cellW: (p.w - 26) / cols, cellH: (p.h - 96) / 4, x0: p.x + 13, y0: p.y + 62 };
  }

  function drawCells(g, s) {
    for (var i = 0; i < s; i++) {
      var col = i % 3, row = Math.floor(i / 3);
      var cx = G.x0 + G.cellW * (col + 0.5), cy = G.y0 + G.cellH * (row + 0.5);
      tx(g, G.x0 + G.cellW * col + 1, cy - G.cellH * 0.36, "物种" + (i + 1), COLOR[i % 12], "start", 8, 700);
      for (var j = 0; j < 3; j++) shape(g, SHAPE[i % 6], cx + (j - 1) * Math.min(24, G.cellW * 0.27), cy + 5, 6.2, COLOR[i % 12]);
    }
  }

  function drawCurve(g, s) {
    var r = L.right, px0 = r.x + 46, px1 = r.x + r.w - 18, py0 = r.y + 58, py1 = r.y + r.h - 44;
    var X = function (S) { return px0 + (S - 2) / 10 * (px1 - px0); };
    var Y = function (v) { return py1 - v / 2.6 * (py1 - py0); };
    el("line", { x1: px0, y1: py1, x2: px1, y2: py1, stroke: "#9aa7b4", "stroke-width": 1.2 }, g);
    el("line", { x1: px0, y1: py1, x2: px0, y2: py0 - 6, stroke: "#9aa7b4", "stroke-width": 1.2 }, g);
    tx(g, px0 - 8, py1 + 3, "0", "#5a6472", "end", 8.4, 400);
    tx(g, px0 - 8, Y(1) + 3, "1.0", "#5a6472", "end", 8.4, 400);
    tx(g, px0 - 8, Y(2) + 3, "2.0", "#5a6472", "end", 8.4, 400);
    for (var S = 2; S <= 12; S += 2) tx(g, X(S), py1 + 14, String(S), "#5a6472", "middle", 8.4, 400);
    tx(g, px1, py1 + 28, "物种数 S", "#5a6472", "end", 8.6, 400);
    tx(g, px0 - 30, py0 - 6, "指数", "#5a6472", "start", 8.6, 400);

    var pa = "", pb = "", k, c;
    for (k = 2; k <= 12; k++) {
      c = calc(k);
      pa += X(k) + "," + Y(c.h).toFixed(1) + " ";
      pb += X(k) + "," + Y(c.sim).toFixed(1) + " ";
    }
    el("polyline", { points: pa, fill: "none", stroke: "#2f8a5b", "stroke-width": 2.1 }, g);
    el("polyline", { points: pb, fill: "none", stroke: "#c2703a", "stroke-width": 2.1 }, g);

    var c0 = calc(s), xm = X(c0.s);
    el("line", { x1: xm, y1: py0 - 2, x2: xm, y2: py1, stroke: "#b8402f", "stroke-width": 0.9, "stroke-dasharray": "4 4" }, g);
    el("circle", { cx: xm, cy: Y(c0.h), r: 3.6, fill: "#2f8a5b" }, g);
    el("circle", { cx: xm, cy: Y(c0.sim), r: 3.6, fill: "#c2703a" }, g);
    tx(g, xm, py0 - 8, "S = " + c0.s, "#b8402f", "middle", 9.2, 700);

    tx(g, px1 - 4, py1 - 8, "Simpson = 1 − 1/S", "#8a4a20", "end", 8.6, 400);
    tx(g, px1 - 4, py1 - 22, "H′ = lnS", "#1f6b45", "end", 8.6, 700);
  }

  function draw(s) {
    var gA = $("gxA"), gB = $("gxB");
    gA.textContent = ""; gB.textContent = "";
    el("rect", { x: L.left.x, y: L.left.y, width: L.left.w, height: L.left.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    tx(gA, L.left.x + 16, L.left.y + 28, "群落：共 " + s + " 个物种（形状＋颜色各不相同）", "#5a6472", "start", 10, 700);
    tx(gA, L.left.x + 16, L.left.y + 46, "每个物种画 3 个个体，个数＝个体数（假设相等）", "#8792a0", "start", 8.4, 400);
    drawCells(gA, s);

    el("rect", { x: L.right.x, y: L.right.y, width: L.right.w, height: L.right.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    tx(gB, L.right.x + 16, L.right.y + 28, "物种数 → 多样性指数", "#5a6472", "start", 10, 700);
    drawCurve(gB, s);
  }

  function render() {
    if (!G) { L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N; G = geom(); }
    stage.setAttribute("viewBox", L.vb);
    var s = calc(A), st, col, bg, sn;
    $("gxVa").textContent = String(s.s);
    $("gxVb").textContent = s.h.toFixed(2);
    $("gxVc").textContent = s.sim.toFixed(2);
    if (s.s <= 3) { st = "低 · 物种太少"; col = "#b8402f"; bg = "#fbeae7"; sn = "S 小，H′ 只有 " + s.h.toFixed(2); }
    else if (s.s <= 5) { st = "偏低 · 接近临界"; col = "#b8791f"; bg = "#fdf3e0"; sn = "物种数偏少，指数偏低"; }
    else if (s.s <= 8) { st = "中等 · 典型群落"; col = "#2f8a5b"; bg = "#e6f6ee"; sn = "S=6 是中等群落的典型值"; }
    else { st = "高 · 物种丰富"; col = "#2f8a5b"; bg = "#e6f6ee"; sn = "S 再大，H′ 也只是对数式上升"; }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    draw(s.s);
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    G = geom();
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 2 }, { t: 1.2, v: 2 }, { t: 4.6, v: 6 }, { t: 6.8, v: 6 },
      { t: 9.8, v: 12 }, { t: 11.4, v: 8 }, { t: 13.4, v: 2 }],
    keys: [2, 6, 8, 12],
    value: A, min: 2, max: 12, step: 1,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__bio = {
    calc: calc, cases: [
      { v: 2, eq: { h: 0.6931, sim: 0.5 } },
      { v: 6, eq: { h: 1.7918, sim: 0.8333 } },
      { v: 12, eq: { h: 2.4849, sim: 0.9167 } }
    ]
  };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
