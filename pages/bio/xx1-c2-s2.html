<p class="gx-claim">反射是神经调节的基本方式：非条件反射<b>生来就有</b>，条件反射<b>以非条件反射为基础、需要大脑皮层参与、长期不强化就会消退</b>。</p>
<div class="gx-meta">
<span><i></i>人教版（2019）选择性必修1 第2章第2节</span>
<span><i></i>高二 · 神经调节</span>
<span><i></i>阅读 12 分钟</span>
<span><i></i>含 1 个互动模型</span>
</div>
<p class="gx-lede">上一节讲的是神经调节的「硬件」：神经元、神经纤维、突触。这一节问的是「软件怎么跑起来」——神经系统到底用什么方式调节生命活动？答案是反射。整节最容易错的一件事：把「条件反射」当成一种独立的本领，忘了它必须<b>长在非条件反射身上</b>，还必须<b>靠大脑皮层</b>才成立；一旦不再强化，它会消退，不是存进硬盘里永久保存。判断一个反射属于哪一类，只看三件事：生来就有还是练出来的、要不要大脑皮层、撤掉强化会不会消退。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 反射的概念<span class="q-src">人教版（2019）选择性必修1 · 第2章第2节</span></p>
<p class="q-b">反射是神经调节的基本方式，分为非条件反射和条件反射。</p>
<p class="q-n">→ 翻成人话：这句话定了<b>两件事</b>。① 神经系统调节生命活动，主要方式就是反射，不是「激素式」的缓慢调节；② 反射不是一个整体，它被分成两类，分类的标准是<b>怎么来的</b>。所以题目问「属于哪种反射」，其实是在问「它是生来就有的，还是后来练出来的」。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 两类反射的关系<span class="q-src">人教版（2019）选择性必修1 · 第2章第2节</span></p>
<p class="q-b">非条件反射是出生后无需训练就有的，条件反射是在非条件反射的基础上通过学习和训练建立的。</p>
<p class="q-n">→ 翻成人话：这句话有<b>三个条件</b>。① 非条件反射：出生就有、不用学；② 条件反射：必须<b>以非条件反射为基础</b>——先有「食物→唾液」这条现成的通路，铃声才可能挂上去，凭空建不起来；③ 建立手段是「学习和训练」，也就是<b>无关刺激与非条件刺激多次结合</b>。少掉第②条，就成了「条件反射可以独立存在」，这是本题最常见的失分写法。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 条件反射的两个特点<span class="q-src">人教版（2019）选择性必修1 · 第2章第2节</span></p>
<p class="q-b">条件反射需要大脑皮层的参与，建立后若长期不强化会逐渐消退。</p>
<p class="q-n">→ 翻成人话：又是<b>两个条件</b>，而且都是必考。① 中枢：条件反射<b>需要大脑皮层参与</b>，因为「铃声」和「食物」这两个中枢的暂时联系建在皮层上；② 命运：条件反射不是永久保存的，长期只响铃不给食物，它<b>会逐渐消退</b>。注意「消退」不等于「忘记声音」，是这条暂时联系不再被强化而变弱。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>非条件反射</th><th>条件反射</th></tr></thead>
<tbody>
<tr><td>形成时间</td><td>出生后就有</td><td>出生后个体生活中形成</td></tr>
<tr><td>要不要训练</td><td>无需训练</td><td>必须学习和训练（多次结合）</td></tr>
<tr><td>典型例子</td><td>缩手反射、膝跳反射、眨眼反射、吃东西分泌唾液</td><td>望梅止渴、谈虎色变、铃声引起狗分泌唾液</td></tr>
<tr><td>刺激性质</td><td>直接的非条件刺激（针刺、叩击、食物入口）</td><td>无关刺激经强化后变成条件刺激（铃声、梅子的样子）</td></tr>
<tr class="key"><td>神经中枢</td><td>脊髓、脑干等皮层下中枢即可完成</td><td>需要大脑皮层参与（皮层上建立暂时联系）</td></tr>
<tr><td>是否消退</td><td>一般不消退，反射弧在反应就在</td><td>长期不强化会逐渐消退</td></tr>
<tr><td>数量与意义</td><td>数量有限、固定，保证基本生存</td><td>数量几乎无限、可塑，增强适应环境的能力</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只有 1 行是「真正的区别」：中枢那一行。答「两类反射有什么区别」时，先写「是否需要大脑皮层参与」，再补「是否需要训练」「是否会消退」。别把「有没有反射弧」当区别——两者都<b>必须</b>经过完整的反射弧，这是最容易写反的一处。</p>
</section>

<p class="gx-note">顺序有讲究：一般先给无关刺激（铃声），随即给非条件刺激（食物），让前者成为后者的「预告」。两者顺序颠倒、间隔过长，都很难建立。</p>

<p class="ex-t">例题 · 条件反射的建立与消退<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">巴甫洛夫的实验中，每次先摇铃、随即给狗喂食，重复多次后，只摇铃不给食物，狗也会分泌唾液。请回答：<br>（1）只摇铃引起唾液分泌，这个反射的建立需要什么条件？<br>（2）若此后长期只摇铃而不给食物，会出现什么现象？为什么？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 定性：这是哪一类反射</p>
<p class="s-b">刺激是铃声，不是食物入口；中枢必须有大脑皮层参与。两个判据都指向：这是<b>条件反射</b>，不是非条件反射。</p>
<p class="s-k">用到：条件反射需要大脑皮层参与；非条件反射是出生后无需训练就有的。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 说清「怎么建」：两刺激多次结合</p>
<p class="s-b">铃声本来与唾液分泌无关，是<b>无关刺激</b>；食物是天生能引起唾液分泌的<b>非条件刺激</b>。把两者多次结合（先铃后食），铃声才变成条件刺激。</p>
<p class="s-k">用到：条件反射是在非条件反射的基础上通过学习和训练建立的——这句话必须出现「基础」二字。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 说清「建在哪」：大脑皮层暂时联系</p>
<p class="s-b">铃声经听觉通路到皮层听觉中枢，食物经味觉通路到皮层味觉中枢，两者反复同时兴奋，在<b>大脑皮层</b>建立暂时联系。此后单独响铃，也能沿这条联系引起唾液分泌。</p>
<p class="s-k">用到：需要大脑皮层参与；建立的是「暂时联系」，不是新建一条反射弧。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 撤掉强化：消退</p>
<p class="s-b">长期只响铃不给食物，铃声不再伴随非条件刺激，皮层上的暂时联系得不到强化而逐渐变弱，唾液分泌越来越少直至不分泌——这是<b>消退</b>。</p>
<p class="s-k">用到：建立后若长期不强化会逐渐消退；消退不等于忘记铃声，反射弧没有消失。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 自查：别写这三句</p>
<p class="s-b">不写「条件反射是生来就有的」，不写「条件反射不需要大脑皮层」，不写「条件反射建立后会永久保存」。三句各自对应一个必考扣分点。</p>
<p class="s-k">用到：本节三个扣分点；答案里「基础—皮层—消退」三要素齐了才给满分。</p>
</li>

<h2><span class="sn">06</span>易错清单</h2>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 条件反射是生来就有的，属于先天行为。</p>

<p class="er-x">✗ 条件反射由脊髓等皮层下中枢完成，不需要大脑皮层。</p>

<p class="er-w">错在哪：中枢这一行正是两类反射的分界线。写「不需要大脑皮层」就直接丢掉必考分。</p>
</div>
<div class="er">
<p class="er-x">✗ 条件反射一旦建立就会永久保存。</p>
<p class="er-v">✓ 条件反射建立后若长期不强化，会逐渐消退；消退不等于遗忘刺激，反射弧依然完整。</p>
<p class="er-w">错在哪：忘了「强化」是维持条件反射的条件。把「会消退」写成「忘记铃声」也是错。</p>

<p class="er-v">✓ 消退是暂时联系得不到强化而变弱，反射弧结构并未受损，给以强化还可恢复。</p>
<p class="er-w">错在哪：把「功能变弱」当成「结构损坏」。若反射弧真受损，再给食物也不会分泌唾液。</p>
</div>
<div class="er">

<p class="er-w">错在哪：把「感觉到痛」当成「反射需要皮层」。感觉和反射的通路不是同一条。</p>

<div class="er">
<p class="er-x">✗ 非条件反射是天生的，所以不需要反射弧。</p>
<p class="er-v">✓ 任何反射都必须经过完整的反射弧；非条件反射只是不需要训练、不需要大脑皮层参与。</p>
<p class="er-w">错在哪：把「不需要训练」偷换成「不需要结构基础」。反射弧缺一环，谁都不行。</p>
</div>
<div class="er">
