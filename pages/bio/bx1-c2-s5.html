<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 核酸的两大类<span class="q-src">人教版（2019）必修1 · 第2章第5节</span></p>
<p class="q-b">核酸包括脱氧核糖核酸（DNA）和核糖核酸（RNA）两大类。</p>
<p class="q-n">→ 翻成人话：这句话只有<b>一个判据</b>——五碳糖是脱氧核糖还是核糖。糖是脱氧核糖的，叫脱氧核糖核酸（DNA）；糖是核糖的，叫核糖核酸（RNA）。注意「两大类」说的是核酸内部分类，不是两种互不相干的东西：两者的基本单位都叫核苷酸，都由磷酸、五碳糖、含氮碱基三部分构成。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 基本组成单位<span class="q-src">人教版（2019）必修1 · 第2章第5节</span></p>
<p class="q-b">核苷酸是核酸的基本组成单位，一分子核苷酸由一分子磷酸、一分子五碳糖和一分子含氮碱基组成。</p>
<p class="q-n">→ 翻成人话：这句话有<b>三个条件</b>，缺一个就不是核苷酸：①一分子磷酸，②一分子五碳糖，③一分子含氮碱基。三部分中，<b>五碳糖只有两种</b>（脱氧核糖、核糖），所以核苷酸先按糖分成脱氧核苷酸和核糖核苷酸两类；<b>碱基有五种</b>（A、T、G、C、U），所以同一类核苷酸内部还按碱基分种。答题时把「三种成分」和「两种糖、五种碱基」分开写，才不会被扣「表述不清」。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 核酸的功能<span class="q-src">人教版（2019）必修1 · 第2章第5节</span></p>
<p class="q-b">核酸是细胞内携带遗传信息的物质，在生物体的遗传、变异和蛋白质的生物合成中具有极其重要的作用。</p>
<p class="q-n">→ 翻成人话：这句话里有<b>三个作用</b>——遗传（亲代传给子代）、变异（信息改变）、蛋白质的生物合成（信息用来造蛋白质）。「携带」的实体不是磷酸，也不是五碳糖，而是<b>碱基（核苷酸）的排列顺序</b>：顺序变了，信息就变了，这就是变异的来源。所以问到「遗传信息储存在哪里」，答案只能是碱基排列顺序。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>原核细胞</th><th>真核细胞</th><th>病毒</th></tr></thead>
<tbody>
<tr><td>核酸种类</td><td>DNA 和 RNA 都有</td><td>DNA 和 RNA 都有</td><td>只有 DNA 或只有 RNA 中的一种</td></tr>

<tr><td>核酸分布</td><td>拟核和细胞质</td><td>细胞核、线粒体、叶绿体、细胞质</td><td>蛋白质外壳内</td></tr>
</tbody>

<p class="gx-note">整张表只高亮一行：<b>遗传物质</b>。细胞生物（原核、真核）一律是 DNA，病毒才可能是 RNA。「有 RNA」不等于「RNA 是遗传物质」——原核细胞两种核酸都有，遗传物质仍然是 DNA。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 双链 DNA 的碱基比例计算<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">某双链 DNA 分子中，A 占全部碱基的 20%。回答：(1) G 占全部碱基的百分比是多少？该 DNA 的 GC 含量是多少？(2) 若其中一条链上 A 占该链碱基的 30%，能否确定另一条链上 A 的比例？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 先定「双链」这个前提</p>
<p class="s-b">题干第一句就是「双链 DNA」。有这一句，才能用碱基互补配对的两个等式：A=T、G=C。紧接着要分清：20% 是「全部碱基」的百分比（双链总量），不是某一条链上的比例。这一步写错，后面全错。</p>
<p class="s-k">用到：双链 DNA 中 A=T、G=C；全部碱基 = 两条链之和。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 用 A=T 求 T，再算 G 和 C</p>
<p class="s-b">A=20%，由 A=T 得 T=20%，所以 A+T=40%。全部碱基是 100%，剩下 G+C=100%−40%=60%。又由 G=C，得 G=30%、C=30%。不要写成「G=60%」——60% 是 G 和 C 的合计。</p>
<p class="s-k">用到：A+T+G+C=100%；G=C。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 求 GC 含量并核对</p>
<p class="s-b">GC 含量指 G 与 C 合计占全部碱基的比例，等于 30%+30%=60%。用公式核对：GC 含量=100−2a=100−2×20=60（%），两法一致。答「G 占 30%，GC 含量为 60%」。</p>
<p class="s-k">用到：GC 含量 = G+C = 100−2a。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 第二问先拆「单链」和「双链」</p>
<p class="s-b">「一条链上 A 占该链的 30%」是单链数据，不能直接搬到另一条链，也不能直接和 20% 相减。要确定另一条链的 A，必须把两条链的 A 加起来，用双链总量这个「桥」。</p>
<p class="s-k">用到：A=T 是双链总量关系，不是同一条链内部的等式。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 用双链总量算一遍</p>
<p class="s-b">设两条链各 n 个碱基，则全部碱基 2n 个，A 的总数是 2n×20%=0.4n。一条链的 A 是 0.3n，另一条链的 A 只能是 0.4n−0.3n=0.1n，占该链的 10%。所以本题能算出 10%，但依据是「单链 30% + 双链 20%」两条信息；<b>只给单链那一条信息，无法确定</b>。</p>
<p class="s-k">用到：A₁+A₂ = 2×（双链 A 的比例）。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">(1) 因为该 DNA 是双链 DNA，所以 A=T、G=C。A=20%，则 T=20%，A+T=40%，G+C=60%，故 G=C=30%；GC 含量=G+C=60%（也可用 100−2a=100−2×20=60% 核对）。<br>(2) 不能只凭「一条链上 A 占该链 30%」这一条信息确定另一条链的 A。A=T 只是双链总量的关系，必须再用双链总量作桥：A₁+A₂=2×20%=40%，A₂=40%−30%=10%。即本题能算出 10%，但依据是单链比例与双链总量两条信息。</p>
</div>
</div>

<p class="er-w">错在哪：把「双链的配对关系」当成「所有核酸的普遍规律」，题目没写「双链」就不能用这两个等式。</p>
