<p class="gx-lede">第6章从「谁在进化」讲到「怎么形成新物种」，本节是整章的枢纽：先把进化的单位从个体换成种群，再把「进化」翻译成可算的基因频率，最后用隔离把「种群分化」升级成「新物种」。最容易错的一件事：把个体的性状变化当成进化——个体再能适应，基因频率不变就不算进化。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 种群与基因库<span class="q-src">人教版（2019）必修2 · 第6章第3节</span></p>
<p class="q-b">种群是生物进化的基本单位；种群中全部个体所含有的全部基因，叫作这个种群的基因库。</p>
<p class="q-n">→ 翻成人话：这句话由<b>两个条件</b>组成——①「一群」同种个体，不是一只；②「全部基因」，不是全部基因的<b>种类</b>。所以进化的基本单位是<b>种群</b>，不是个体：个体只活一代，基因随种群一代代传下去。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 基因频率<span class="q-src">人教版（2019）必修2 · 第6章第3节</span></p>
<p class="q-b">基因频率是某个基因占该位点全部等位基因数的比率。</p>
<p class="q-n">→ 分母是「全部等位基因数」＝个体数 × 2（每个个体含 2 个等位基因）；分子是「某个基因的数目」。算的是<b>基因</b>，不是基因型：<span class="gx-fml">p = A 的数目 ÷ 2N</span>。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 原材料、方向与隔离<span class="q-src">人教版（2019）必修2 · 第6章第3节</span></p>
<p class="q-b">突变和基因重组产生进化的原材料；自然选择使种群的基因频率发生定向改变；隔离是物种形成的必要条件。</p>
<p class="q-n">→ 三个条件分工不同：突变和重组提供<b>原材料</b>（不定向），自然选择决定<b>方向</b>，隔离负责<b>物种形成</b>。少一个会怎样：没有选择，频率只会随机波动；没有隔离，分化再大也还是一个物种。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>基因频率</th><th>基因型频率</th></tr></thead>
<tbody>
<tr><td>定义</td><td>某基因占该位点全部等位基因数的比率</td><td>某基因型个体占种群全部个体的比率</td></tr>
<tr><td>分母</td><td>全部等位基因数（2N）</td><td>全部个体数（N）</td></tr>
<tr><td>举例：p = 0.5 的群体</td><td>A = 0.5，a = 0.5</td><td>AA = 0.25，Aa = 0.5，aa = 0.25</td></tr>
<tr class="key"><td>谁决定「进化」</td><td>进化看它：基因频率改变 = 进化</td><td>它会随交配方式变，变了也不一定是进化</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">背法：<b>频率看基因，进化看频率；物种看隔离，隔离看生殖</b>。做题先问「题目给的是个体数还是基因数」，分母别用错。</p>
</section>

<p class="ex-t">例题 · 基因频率与携带者频率<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">某人群中白化病的发病率为 1/10000。白化病由常染色体隐性基因 a 控制，求该人群中 a 的基因频率和携带者（Aa）的频率。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 定性：发病率对应哪种频率</p>
<p class="s-b">白化病是常染色体隐性遗传，只有 aa 才发病，所以 1/10000 是 aa 的<b>基因型频率</b>，即 <span class="gx-fml">q² = 1/10000</span>，不是 q。</p>
<p class="s-k">用到：基因型频率 ≠ 基因频率。</p>

<li class="step" hidden>
<p class="s-h">第 2 步 · 开方求 q</p>
<p class="s-b"><span class="gx-fml">q² = 1/10000 → q = 1/100</span>。开方只取正值，频率不能为负。</p>
<p class="s-k">用到：q² → q。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 用 p + q = 1 求 p</p>
<p class="s-b"><span class="gx-fml">p = 1 − q = 1 − 1/100 = 99/100</span>。</p>
<p class="s-k">用到：一对等位基因频率之和为 1。</p>
</li>
<li class="step" hidden>

<p class="s-b">携带者是 Aa：<span class="gx-fml">2pq = 2 × 99/100 × 1/100 = 198/10000 ≈ 2/100 = 1/50</span>。</p>
<p class="s-k">用到：Aa = 2pq，别漏掉系数 2。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 回读检查</p>
<p class="s-b">发病率 1/10000，携带者约 1/50，相差约 200 倍。隐性病「患者少、携带者多」，这是遗传咨询的常考点。</p>
<p class="s-k">用到：q² 与 2pq 的数量级差别。</p>
</li>

<script>
/* 互动脚本本体（由 build-page.mjs 包进 <script> 里，所以这里不要写 <script> 标签） */
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var GX = window.GX, el = GX.el, tx = GX.tx, $ = GX.$;
  var stage = $("gxStage");
  if (!stage || !window.AutoPilot) return;

  /* 两套坐标：宽屏 880×470，窄屏独立 360×700 */
  var W = { vb: "0 0 880 470", left: { x: 16, y: 16, w: 424, h: 438 }, right: { x: 456, y: 16, w: 408, h: 438 } };
  var N = { vb: "0 0 360 700", left: { x: 8, y: 8, w: 344, h: 300 }, right: { x: 8, y: 320, w: 344, h: 372 } };
  var L = null, G = null, A = 0.5;

  function geom() {
    return stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
  }

  /* 纯函数：p → 三个基因型频率。render() 和 __bio.cases 都用它 */
  function calc(v) {
    var p = Math.max(0, Math.min(1, Number(v) || 0));
    var q = 1 - p;
    return { p: p, q: q, AA: p * p, Aa: 2 * p * q, aa: q * q };
  }

  function draw() {
    var gA = $("gxA"), gB = $("gxB");
    gA.textContent = ""; gB.textContent = "";
    var s = calc(A), l = L.left, r = L.right, wide = l.h > 350;

    el("rect", { x: l.x, y: l.y, width: l.w, height: l.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    tx(gA, l.x + 18, l.y + 26, "种群与基因库（球色 = 等位基因）", "#5a6472", "start", 10.5, 700);

    /* 一群个体 */
    var n = 5, ir = wide ? 24 : 15;
    var gap = (l.w - 36 - ir * 2) / (n - 1);
    var cy = l.y + (wide ? 92 : 58);
    for (var i = 0; i < n; i++) {
      var cx = l.x + 18 + ir + i * gap;
      el("circle", { cx: cx, cy: cy, r: ir, fill: "#ffffff", stroke: "#c9d4de", "stroke-width": 1.2 }, gA);
      var c1 = ((i * 37) % 100) / 100 < s.p ? "#c0392b" : "#2f6fb3";
      var c2 = ((i * 61 + 17) % 100) / 100 < s.p ? "#c0392b" : "#2f6fb3";
      var dr = wide ? 6 : 4;
      el("circle", { cx: cx - dr, cy: cy, r: dr, fill: c1 }, gA);
      el("circle", { cx: cx + dr, cy: cy, r: dr, fill: c2 }, gA);
    }
    tx(gA, l.x + 18, cy + ir + 14, "5 个个体，每个个体 2 个等位基因", "#7b8794", "start", 9, 400);

    /* 基因库：一堆小球 */
    var cols = 5, rows = 4, cnt = cols * rows;
    var cell = wide ? 44 : 30, br = wide ? 11 : 7.5;
    var top = cy + ir + (wide ? 40 : 34);
    var sx = l.x + (l.w - (cols - 1) * cell) / 2;
    tx(gA, l.x + 18, top - 10, "基因库：全部等位基因", "#5a6472", "start", 9.5, 700);
    var redN = Math.round(s.p * cnt);
    for (var k = 0; k < cnt; k++) {
      var cc = k % cols, rr = Math.floor(k / cols);
      var isRed = ((k * 7) % cnt) < redN;
      el("circle", { cx: sx + cc * cell, cy: top + rr * cell, r: br, fill: isRed ? "#c0392b" : "#2f6fb3" }, gA);
    }

    var ny = l.y + l.h - (wide ? 88 : 56);
    tx(gA, l.x + 18, ny, "红球 = A，蓝球 = a；红球占比就是 p。", "#5a6472", "start", 9, 400);
    tx(gA, l.x + 18, ny + 22, "当前 p = " + s.p.toFixed(2) + "（红球 " + Math.round(s.p * 100) + "%）", "#5a6472", "start", 9, 400);

    /* 右：三个基因型频率 */
    var base = r.y + r.h - (wide ? 122 : 102), maxH = wide ? 200 : 160;
    el("rect", { x: r.x, y: r.y, width: r.w, height: r.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    tx(gB, r.x + 18, r.y + 26, "基因型频率（哈代-温伯格平衡）", "#5a6472", "start", 10.5, 700);
    el("rect", { x: r.x + 36, y: base, width: r.w - 62, height: 1.2, fill: "#c9d4de" }, gB);

    var bw = wide ? 54 : 46;
    var bars = [
      { c: r.x + (wide ? 90 : 84), f: s.AA, col: "#c0392b", k: "AA = p²" },
      { c: r.x + (wide ? 204 : 172), f: s.Aa, col: "#b8791f", k: "Aa = 2pq" },
      { c: r.x + (wide ? 318 : 260), f: s.aa, col: "#2f6fb3", k: "aa = q²" }
    ];
    for (var j = 0; j < bars.length; j++) {
      var b = bars[j], h = Math.max(2, b.f * maxH);
      el("rect", { x: b.c - bw / 2, y: base - h, width: bw, height: h, rx: 4, fill: b.col }, gB);
      tx(gB, b.c, base - h - 9, Math.round(b.f * 100) + "%", b.col, "middle", 10, 700);
      tx(gB, b.c, base + 20, b.k, "#5a6472", "middle", wide ? 9.5 : 8.6, 400);
    }

    tx(gB, r.x + r.w / 2, r.y + r.h - 58, "p² + 2pq + q² = 1", "#5a6472", "middle", 11.5, 700);
    tx(gB, r.x + r.w / 2, r.y + r.h - 32, "当前 p = " + s.p.toFixed(2) + "，q = " + s.q.toFixed(2), "#7b8794", "middle", 9.2, 400);
  }

  function render() {
    if (!G) { L = geom(); G = geom(); }
    var s = calc(A), st, col, bg, sn;
    $("gxVa").textContent = s.p.toFixed(2);
    $("gxVb").textContent = Math.round(s.Aa * 100) + "%";
    $("gxVc").textContent = Math.round(s.AA * 100) + "% / " + Math.round(s.aa * 100) + "%";
    if (s.p < 0.001 || s.p > 0.999) { st = "多样性为 0"; col = "#b8402f"; bg = "#fbeae7"; sn = "只剩一个等位基因"; }
    else if (Math.abs(s.p - 0.5) < 0.001) { st = "杂合子最多"; col = "#2f8a5b"; bg = "#e6f6ee"; sn = "p = 0.5，Aa = 50%"; }
    else { st = "偏离 0.5"; col = "#b8791f"; bg = "#fdf3e0"; sn = "Aa = " + Math.round(s.Aa * 100) + "%，低于 50%"; }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    draw();
  }

  function layout() {
    L = geom(); G = L;
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 0 }, { t: 1, v: 0 }, { t: 4.8, v: 0.5 }, { t: 7, v: 0.5 }, { t: 9.4, v: 1 }, { t: 11.4, v: 0.8 }, { t: 13, v: 0 }],
    keys: [0, 0.25, 0.5, 0.75, 1],
    value: A, min: 0, max: 1, step: 0.05,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__bio = { calc: calc, cases: [
    { v: 0.2, eq: { AA: 0.04, Aa: 0.32 } },
    { v: 0.5, eq: { AA: 0.25, Aa: 0.5 } },
    { v: 0.8, eq: { AA: 0.64, Aa: 0.32 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
</body>
</html>
