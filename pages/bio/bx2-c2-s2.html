<p class="gx-claim">这一节只判两件事：<b>萨顿的类比推理只是假说</b>，<b>摩尔根的果蝇实验才是证明</b>；记住<b>一条染色体上有许多个基因</b>，同一条染色体上的基因<b>连锁、不遵循自由组合</b>。</p>
<div class="gx-meta">
<span><i></i>人教版（2019）必修2 第2章第2节</span>
<span><i></i>高一 · 第2章 基因和染色体的关系</span>
<span><i></i>阅读 12 分钟</span>
<span><i></i>含 1 个互动模型</span>
</div>
<p class="gx-lede">上一节孟德尔的两个定律只管「基因」，从没说过基因住在哪里；这一节把它按在染色体上。考点集中在三处：谁提出假说、谁做出证明；一条染色体上到底有几个基因；连锁的基因为什么写不出 9∶3∶3∶1。全节最容易被扣分的一句是「萨顿实验证明了基因在染色体上」——萨顿只做了类比推理，那是假说，不是证明；真正的证明来自摩尔根的红眼 × 白眼果蝇杂交实验。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 萨顿的假说<span class="q-src">人教版（2019）必修2 · 第2章第2节</span></p>
<p class="q-b">萨顿发现基因和染色体行为存在着明显的平行关系，提出基因位于染色体上的假说。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个条件</b>组成：① 基因与染色体行为平行（体细胞中成对、配子中成单、形成配子时分开、受精后恢复成对）；② 萨顿用的方法是<b>类比推理</b>，它只能<b>提出假说</b>；③ 假说必须再被实验证明，做证明的人是摩尔根。答题少写「假说」两个字就丢分。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 摩尔根的证明<span class="q-src">人教版（2019）必修2 · 第2章第2节</span></p>
<p class="q-b">摩尔根用果蝇杂交实验证明了基因在染色体上。</p>
<p class="q-n">→ 三个条件：① 杂交后代中白眼性状总是与性别连在一起（白眼只出现在雄性）；② 假设控制白眼的基因在 X 染色体上、Y 染色体上没有它的等位基因；③ 用测交实验验证，结果与假设相符。所以课本用的词是「<b>证明</b>」，不是「提出」。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 基因在染色体上的排列<span class="q-src">人教版（2019）必修2 · 第2章第2节</span></p>
<p class="q-b">一条染色体上有许多个基因，基因在染色体上呈线性排列。</p>
<p class="q-n">→ 两个条件：① 数量上是「<b>一对多</b>」——一条染色体上有许多个基因，不是一条染色体配一个基因；② 位置上是「<b>线性</b>」——一个接一个排成一行，不重叠、不分叉。少了「许多个」或「线性」，这句话就不完整。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>萨顿（1903）</th><th>摩尔根（1910）</th></tr></thead>
<tbody>
<tr><td>研究对象</td><td>蝗虫精母细胞的减数分裂</td><td>果蝇的红眼 × 白眼杂交</td></tr>
<tr><td>方法</td><td>类比推理：基因行为与染色体行为平行</td><td>杂交实验 + 假说—演绎</td></tr>

<tr class="key"><td>课本表述</td><td>提出基因位于染色体上的<b>假说</b></td><td><b>证明</b>基因在染色体上</td></tr>
<tr><td>顺带解决</td><td>推测一条染色体上有许多个基因</td><td>后经证实基因呈线性排列</td></tr>

</table>
</div>
<p class="gx-note">整张表只高亮 1 行。背法：萨顿「提假说」，摩尔根「做证明」，两人别写反；凡是题干说「萨顿实验证明」，直接判错。类比推理不是实验，它给出的结论只是假说。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 连锁与交换率<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">果蝇的灰身（B）对黑身（b）显性，长翅（V）对残翅（v）显性。用灰身长翅（BbVv）与黑身残翅（bbvv）测交，后代中灰身长翅 40%、黑身残翅 40%、灰身残翅 10%、黑身长翅 10%。请回答：（1）B、b 与 V、v 是否遵循自由组合定律？（2）B 与 V 之间的图距约为多少？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题/定性</p>
<p class="s-b">测交后代出现四种表现型，但比例是 40∶40∶10∶10，不是 1∶1∶1∶1。这说明两对基因不独立，必须怀疑连锁。</p>
<p class="s-k">用到：测交后代的种类与比例 = 亲本产生配子的种类与比例。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 分亲本型与重组型</p>
<p class="s-b">比例高的两类（灰长 40%、黑残 40%）是亲本型配子，比例低的两类（灰残 10%、黑长 10%）是重组型配子。亲本型里 B 与 V 搭在一起、b 与 v 搭在一起。</p>
<p class="s-k">用到：亲本型 = 保持亲本组合的配子；重组型 = 交换后产生的新组合。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 落在染色体上</p>
<p class="s-b">亲本型远多于重组型，说明 B 与 V 位于同一对同源染色体上，b 与 v 位于另一条上。一条染色体上有许多个基因，所以两对基因常常一起传递。</p>
<p class="s-k">用到：基因在染色体上呈线性排列，同一条染色体上的基因连锁。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 算交换率与图距</p>
<p class="s-b">交换率 = 两种重组型比例之和 = 10% + 10% = 20%。1 cM ≈ 1% 交换率，所以图距约 20 cM。</p>
<p class="s-k">用到：<span class="gx-fml">交换率 = 重组型比例之和</span>；图距（cM）≈ 交换率（%）。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口，防陷阱</p>
<p class="s-b">回答「是否遵循」要先给结论再给理由：不遵循。因为后代不是 9∶3∶3∶1，也没有 1∶1∶1∶1；交换率 20% &lt; 50%，连锁成立。</p>
<p class="s-k">用到：连锁的基因不遵循自由组合；交换率达到 50% 才表现如独立。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>

</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）不遵循。测交后代四种表现型比例为 40∶40∶10∶10，亲本型远多于重组型，后代不是 9∶3∶3∶1，说明 B、b 与 V、v 位于同一对同源染色体上，属于连锁遗传。（2）交换率 = 10% + 10% = 20%，图距约为 20 cM。因为交换率 20% 小于 50%，两基因连锁，不遵循自由组合定律。</p>

<div class="gx-errs">

<p class="er-w">错在哪：把「假说」写成「证明」。萨顿没有做杂交实验，类比推理不是实验证据。</p>

<div class="er">
<p class="er-x">✗ 一条染色体上只有一个基因。</p>
<p class="er-v">✓ 一条染色体上有许多个基因，基因在染色体上呈线性排列。</p>
<p class="er-w">错在哪：基因数远多于染色体数。一对同源染色体上就有许多对等位基因。</p>

<div class="er">
<p class="er-x">✗ 两对基因在同一对同源染色体上，测交后代仍是 9∶3∶3∶1。</p>

<p class="er-w">错在哪：9∶3∶3∶1 是两对基因独立遗传时的自交比例，连锁时这个前提不成立。</p>
</div>
<div class="er">
<p class="er-x">✗ 交换率可以达到 60%，图距就是 60 cM。</p>
<p class="er-v">✓ 交换率最大为 50%，达到 50% 时表现如独立（自由组合）；图距可以超过 50 cM。</p>
<p class="er-w">错在哪：把交换率当成可以无限增大的百分数。两次交换会把重组抵消，实测交换率封顶 50%。</p>
</div>
<div class="er">
<p class="er-x">✗ 同源染色体上的基因都相同。</p>
<p class="er-v">✓ 同源染色体上等位基因的位置相同，但基因可以不同，如 A 与 a。</p>
<p class="er-w">错在哪：混淆「位置相同」与「基因相同」。同源染色体一条来自父方、一条来自母方，可以携带不同等位基因。</p>
</div>

<p class="er-v">✓ 图距可以相加来估计距离，但交换率不能直接相加，超过 50% 时按 50% 表现（如独立）。</p>
<p class="er-w">错在哪：两个相邻区段各发生一次交换时，双交换会抵消，实际重组率低于两段之和。</p>

<p class="er-v">✓ 白眼基因在 X 染色体上，Y 染色体上没有它的等位基因，因此白眼只出现在雄性。</p>
<p class="er-w">错在哪：若在 Y 上，则只有雄性有白眼、且父传子；但实验中白眼雄蝇与红眼雌蝇杂交，F1 雌蝇全为红眼且可携带 w，符合 X 连锁。</p>

<script>
/* 互动脚本本体（由 build-page.mjs 包进 <script> 里，所以这里不要写 <script> 标签） */
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var GX = window.GX, el = GX.el, tx = GX.tx, $ = GX.$;
  var stage = $("gxStage");
  if (!stage || !window.AutoPilot) return;

  /* 两套坐标：宽屏 880×470，窄屏独立 360×700 */
  var W = { vb: "0 0 880 470", left: { x: 16, y: 16, w: 424, h: 438 }, right: { x: 456, y: 16, w: 408, h: 438 } };
  var N = { vb: "0 0 360 700", left: { x: 8, y: 8, w: 344, h: 300 }, right: { x: 8, y: 320, w: 344, h: 372 } };
  var L = W, G = null, A = 20;

  /* 纯函数：图距 d(0–50 cM) → 交换率 / 亲本型 / 重组型 / 是否连锁 */
  function calc(v) {
    var d = Math.max(0, Math.min(50, v));
    var cross = d / 100;
    return { d: d, cross: cross, parental: (1 - cross) / 2, recomb: cross / 2, linked: d < 50 ? 1 : 0 };
  }

  function geom() {
    var lp = L.left, rp = L.right;
    return {
      lp: lp, rp: rp,
      cx: lp.x + 26, cw: lp.w - 52, barY: lp.y + lp.h * 0.40, barH: 18,
      aF: 0.30, span: 0.30, fixed: [0.06, 0.15, 0.68, 0.82, 0.93],
      rowY0: rp.y + 72, rowH: Math.min(52, (rp.h - 190) / 4),
      barX: rp.x + 106, maxBW: rp.w - 156
    };
  }

  function sq(g, x, y, s, fill) {
    el("rect", { x: x - s / 2, y: y - s / 2, width: s, height: s, rx: 2, fill: fill }, g);
  }

  function drawLeft(s) {
    var g = $("gxA"), lp = G.lp, bx = G.cx, bw = G.cw, by = G.barY, i;
    el("rect", { x: lp.x, y: lp.y, width: lp.w, height: lp.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, g);
    tx(g, lp.x + 20, lp.y + 30, "一条染色体（长条）上的基因（小方块）", "#5a6472", "start", 10.5, 700);
    el("rect", { x: bx, y: by, width: bw, height: G.barH, rx: 9, fill: "#e6f0f7", stroke: "#a9c9dd" }, g);
    for (i = 0; i < G.fixed.length; i++) sq(g, bx + bw * G.fixed[i], by + G.barH / 2, 11, "#a9c9dd");
    var xA = bx + bw * G.aF, xB = bx + bw * (G.aF + s.d / 50 * G.span), cy = by + G.barH / 2;
    sq(g, xA, cy, 13, "#2f8a5b");
    tx(g, xA - 8, by - 7, "A", "#2f6b4a", "end", 9.6, 700);
    if (s.d < 2) {
      el("rect", { x: xB - 10, y: cy - 10, width: 20, height: 20, rx: 3, fill: "none", stroke: "#b8402f", "stroke-width": 1.8 }, g);
    } else {
      sq(g, xB, cy, 13, "#b8402f");
    }
    tx(g, xB + 8, by - 7, "B", "#b8402f", "start", 9.6, 700);
    var y1 = by + G.barH + 4, y2 = by + G.barH + 30;
    el("line", { x1: xA, y1: y1, x2: xA, y2: y2, stroke: "#9aa7b4", "stroke-width": 1 }, g);
    el("line", { x1: xB, y1: y1, x2: xB, y2: y2, stroke: "#9aa7b4", "stroke-width": 1 }, g);
    el("line", { x1: xA, y1: y2, x2: xB, y2: y2, stroke: "#7f8c99", "stroke-width": 1.2 }, g);
    tx(g, (xA + xB) / 2, y2 + 15, "d = " + Math.round(s.d) + " cM", "#3a3a35", "middle", 9.2, 700);
    tx(g, lp.x + 20, by + 84, "间隔 = 图距 " + (s.cross * 100).toFixed(0) + " cM → 交换率 " + (s.cross * 100).toFixed(0) + "%", "#3a3a35", "start", 8.4, 400);
    tx(g, lp.x + 20, by + 104, s.cross > 0 ? "两基因之间可发生交换，产生少量重组型" : "d = 0：两基因完全连锁，不产生重组型", "#3a3a35", "start", 8.4, 400);
    tx(g, lp.x + 20, by + 128, "同一根长条上的基因一起传递 → 连锁", "#b8791f", "start", 8.4, 600);
    tx(g, lp.x + 20, lp.y + lp.h - 40, "一条染色体上有许多个基因，呈线性排列。", "#2f6b4a", "start", 8.4, 700);
    tx(g, lp.x + 20, lp.y + lp.h - 22, "图中只画 7 个基因作示意，真实染色体上有几百个。", "#8a95a3", "start", 8.2, 400);
  }

  function drawRight(s) {
    var g = $("gxB"), rp = G.rp, bx = G.barX, bw = G.maxBW, i;
    el("rect", { x: rp.x, y: rp.y, width: rp.w, height: rp.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, g);
    tx(g, rp.x + 20, rp.y + 30, "测交后代的四种配子比例", "#5a6472", "start", 10.5, 700);
    var rows = [
      { k: "亲本型 AB", v: s.parental, c: "#2f8a5b" },
      { k: "亲本型 ab", v: s.parental, c: "#2f8a5b" },
      { k: "重组型 Ab", v: s.recomb, c: "#b8791f" },
      { k: "重组型 aB", v: s.recomb, c: "#b8791f" }
    ];
    var pctX = rp.x + rp.w - 42;
    for (i = 0; i < 4; i++) {
      var y = G.rowY0 + i * G.rowH;
      el("rect", { x: bx, y: y, width: bw, height: 15, rx: 7, fill: "#eef2f6" }, g);
      el("rect", { x: bx, y: y, width: Math.max(2, bw * (rows[i].v / 0.5)), height: 15, rx: 7, fill: rows[i].c }, g);
      tx(g, rp.x + 18, y + 11, rows[i].k, "#3a3a35", "start", 8.6, 600);
      tx(g, pctX, y + 11, (rows[i].v * 100).toFixed(1) + "%", "#3a3a35", "start", 8.5, 600);
    }
    var sy = rp.y + rp.h - 96, col = s.linked ? "#b8791f" : "#2f8a5b";
    tx(g, rp.x + 20, sy, s.linked ? "d = " + Math.round(s.d) + " cM < 50 cM：两基因连锁" : "d = 50 cM：表现如独立（自由组合）", col, "start", 8.8, 700);
    tx(g, rp.x + 20, sy + 22, "亲本型各 " + (s.parental * 100).toFixed(0) + "%，重组型各 " + (s.recomb * 100).toFixed(0) + "%", "#3a3a35", "start", 8.4, 400);
    tx(g, rp.x + 20, sy + 44, "连锁的基因不遵循自由组合：不是 9∶3∶3∶1", "#8a95a3", "start", 8.2, 400);
  }

  function draw() {
    $("gxA").textContent = "";
    $("gxB").textContent = "";
    var s = calc(A);
    drawLeft(s);
    drawRight(s);
  }

  function render() {
    if (!G) { L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N; G = geom(); }
    var s = calc(A), st, col, bg, sn;
    $("gxVa").textContent = String(Math.round(s.d));
    $("gxVb").textContent = (s.cross * 100).toFixed(1) + "%";
    $("gxVbs").textContent = "= d ÷ 100";
    $("gxVc").textContent = (s.recomb * 100).toFixed(1) + "%";
    $("gxVcs").textContent = "每种亲本型 " + (s.parental * 100).toFixed(1) + "%";
    if (s.linked) { st = "两基因连锁"; col = "#b8791f"; bg = "#fdf3e0"; sn = "交换率 " + (s.cross * 100).toFixed(0) + "% < 50%，亲本型多"; }
    else { st = "表现如独立"; col = "#2f8a5b"; bg = "#e6f6ee"; sn = "交换率 50%，四种配子各 1/4"; }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    draw();
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    G = geom();
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 0 }, { t: 0.6, v: 0 }, { t: 2.4, v: 20 }, { t: 3.9, v: 50 }, { t: 5.4, v: 50 }, { t: 7.4, v: 20 }, { t: 9.9, v: 20 }, { t: 11.5, v: 35 }, { t: 13, v: 0 }],
    keys: [0, 20, 35, 50],
    value: A, min: 0, max: 50, step: 1,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__bio = { calc: calc, cases: [
    { v: 0, eq: { cross: 0, linked: 1 } },
    { v: 20, eq: { cross: 0.2, recomb: 0.1 } },
    { v: 50, eq: { cross: 0.5, linked: 0 } }
  ] };
  window.__model = window.__bio;

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
