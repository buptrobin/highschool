<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 细胞分化的概念<span class="q-src">人教版（2019）必修1 · 第6章第2节</span></p>
<p class="q-b">细胞分化是指在个体发育中，由一个或一种细胞增殖产生的后代，在形态、结构和生理功能上发生稳定性差异的过程。</p>
<p class="q-n">→ 翻成人话：这句定义由<b>三个条件</b>组成（①起点是「一个或一种细胞」增殖产生的后代，②变的是形态、结构、生理功能三样，③差异必须是「稳定」的）。少一个都不叫分化：只变形状不持久，是形态改变；遗传物质变了，那是突变；由一个细胞直接长成另一个物种，课本里没有这回事。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 分化的原因与特点<span class="q-src">人教版（2019）必修1 · 第6章第2节</span></p>
<p class="q-b">细胞分化是基因选择性表达的结果；细胞分化具有普遍性、持久性和稳定性。</p>
<p class="q-n">→ 翻成人话：「选择性表达」是<b>唯一原因</b>——所有体细胞都带着同一套基因，只是每个细胞打开的「开关」不同，于是造出的蛋白质不同。三个特点分开背：普遍性＝多细胞生物发育过程中普遍存在；持久性＝贯穿整个生命进程，不是只在胚胎期；稳定性＝分化后一般不再回到原来的状态。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 细胞的全能性<span class="q-src">人教版（2019）必修1 · 第6章第2节</span></p>
<p class="q-b">细胞的全能性是指已经分化的细胞，仍然具有发育成完整个体的潜能。</p>
<p class="q-n">→ 翻成人话：抓两个词。<b>「已经分化」</b>——不是只有受精卵才有全能性；<b>「潜能」</b>——是能力、不是必然发生。潜能能不能表现出来，要看条件：植物细胞要离体培养，动物体细胞要核移植。所以「有全能性」和「表现出全能性」是两件事。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>受精卵</th><th>造血干细胞</th><th>神经细胞</th></tr></thead>
<tbody>
<tr><td>分化程度</td><td>最低（d≈0）</td><td>较高，可多向分化</td><td>最高（d≈100）</td></tr>
<tr><td>形态结构功能</td><td>未特化</td><td>开始特化</td><td>突起长、能传导兴奋</td></tr>
<tr><td>表达的基因</td><td>几乎全部打开</td><td>部分打开</td><td>只开干活要用的少数</td></tr>
<tr class="key"><td>遗传物质</td><td>一套 DNA</td><td>完全相同</td><td>完全相同（除非突变）</td></tr>
<tr><td>全能性</td><td>最高</td><td>有，低于受精卵</td><td>最低；植物细胞可表现</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只高亮一行：<b>遗传物质</b>。背法是一套基因、不同开关——分化不改 DNA，只改表达。所以「遗传物质相同」和「形态功能差别很大」可以同时成立，这是本节所有选择题的第一判据。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 遗传物质是否改变<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">同一个人的神经细胞和肌肉细胞，形态、结构、生理功能差别很大。它们的遗传物质相同吗？为什么？如果追问一句「神经细胞的全能性比受精卵低，是不是因为它的基因变少了」，又该怎么答？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题：问的是「遗传物质」，不是「形态功能」</p>
<p class="s-b">题干给了两件事：同一个人的两种细胞、形态功能差别很大。问题只落在「遗传物质」上。先把「差别大」和「遗传物质变了」切开——差别大是现象，遗传物质有没有变才是要判断的量。</p>
<p class="s-k">用到：细胞分化的概念——差异发生在形态、结构和生理功能上，不是遗传物质上。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 追来源：同一个受精卵，经有丝分裂</p>
<p class="s-b">同一个体的所有体细胞都来自同一个受精卵。受精卵靠有丝分裂增殖，复制后的 DNA 平均分给两个子细胞，所以亲子代细胞的遗传物质相同（除非发生基因突变）。这一句是答案的根。</p>
<p class="s-k">用到：有丝分裂的意义——保持亲子代细胞遗传性状的稳定性。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 解释差异：基因的选择性表达</p>
<p class="s-b">基因相同、造出的蛋白质不同，只能有一个解释：不同细胞里打开的基因不同。神经细胞打开神经递质、受体那一类基因，肌肉细胞打开肌动蛋白、肌球蛋白那一类基因——同一套 DNA，不同的开关。</p>
<p class="s-k">用到：细胞分化是基因选择性表达的结果。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 堵漏洞：一个前提 + 一个替换</p>
<p class="s-b">①「相同」有前提：不发生基因突变（也不涉及染色体变异）；②「基因变少」是错的——高度分化只是让大部分基因关闭，DNA 并没有丢失；人成熟红细胞无核是特例，不能拿来推所有体细胞。</p>
<p class="s-k">用到：稳定性 ≠ 遗传物质改变；特例不能当通例。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 写成答题卡语言</p>
<p class="s-b">先给判断（相同），再给两个理由（来源相同 + 差异来自选择性表达），最后补一句前提（除非突变）。三句话，判断、依据、边界都在，不用再多写。</p>
<p class="s-k">用到：判断句 + 依据 + 前提的答题结构。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">① 相同（除非发生基因突变）。② 因为它们由同一个受精卵经有丝分裂增殖而来，有丝分裂使亲子代细胞的遗传物质保持相同。③ 二者形态、结构、生理功能的差异，是基因选择性表达的结果，不是遗传物质改变。④ 神经细胞全能性较低，是因为高度分化后大部分基因关闭、难以表达出发育成完整个体所需的全部信息，而不是基因数量减少。</p>
</div>
</div>

<section class="gx-sec" id="e">

<div class="gx-qa">
<div class="qac">
<p class="q">「细胞分化以后，遗传物质是不是就变得不一样了？」</p>
<p class="a">没变。同一个体的体细胞由<b>同一个受精卵经有丝分裂</b>产生，遗传物质完全相同（除非发生基因突变）；分化改变的是<b>基因的表达情况</b>，不是基因本身。</p>

<div class="qac">
<p class="q">「受精卵、生殖细胞、体细胞，全能性从高到低怎么排？」</p>
<p class="a"><b>受精卵 &gt; 生殖细胞 &gt; 体细胞</b>；同一物种内再套一条<b>植物细胞 &gt; 动物细胞</b>。排序的根据是分化程度：分化程度越低，越容易恢复到能发育成完整个体的状态。</p>

<div class="qac">
<p class="q">「都是已分化的细胞，为什么植物细胞比动物细胞容易表现全能性？」</p>
<p class="a">植物细胞在<b>离体培养</b>下能脱分化、再分化，直接长成完整植株；动物体细胞整体做不到，只能取<b>细胞核</b>做核移植，才证明核有全能性。所以植物「容易表现」，不等于动物「没有」。</p>

<p class="a">一般<b>稳定、难以逆转</b>，但不是绝对：植物细胞可以<b>脱分化</b>，动物细胞核移植后也能被重编程。教材说的「稳定性」是「一般不再改变」，不是「永远不能改变」。</p>

<p class="q">「细胞分裂和细胞分化是什么关系？」</p>
<p class="a">分裂负责<b>数量</b>，分化负责<b>种类</b>：先靠分裂把细胞变多，再靠分化让它们分工。分化程度越高的细胞，分裂能力通常越弱——高度分化的神经细胞基本不再分裂。</p>

<h2><span class="sn">06</span>易错清单</h2>

<div class="er">
<p class="er-x">✗ 细胞分化以后基因发生了改变，所以神经细胞和肌肉细胞不一样。</p>

<div class="er">
<p class="er-x">✗ 动物细胞没有全能性。</p>
<p class="er-v">✓ 已分化的动物体细胞的细胞核仍具有全能性（核移植实验）。</p>

<p class="er-x">✗ 细胞分化程度越高，全能性越强。</p>

<p class="er-w">错在哪：两条线反向，和「分化程度越高、表达的基因越少」同向。</p>

<p class="er-w">错在哪：把「退回去」和「往前走」当成一回事。</p>

<div class="er">
<p class="er-x">✗ 所有细胞都能表现出全能性。</p>
<p class="er-v">✓ 要有条件才能表现：植物细胞需离体培养，动物体细胞需核移植，难度差别很大。</p>

      tx(g, x0 + 10, y0 - 6, "pot", "#0f5f43", "start", 8, 600);
      tx(g, x0 + 10, y0 + 8, "expr", "#24558a", "start", 8, 600);
      tx(g, P.x + 20, y1 + 40, "d=0：pot 100、expr 90", "#3a3a35", "start", 8.4, 400);
      tx(g, P.x + 20, y1 + 58, "d=100：pot 15、expr 20", "#3a3a35", "start", 8.4, 400);
      tx(g, P.x + 20, y1 + 82, "分化程度↑ → 全能性↓", "#0f5f43", "start", 8.4, 700);
      tx(g, P.x + 20, y1 + 100, "最低不是 0：仍有潜能。", MID, "start", 8.4, 400);
      tx(g, P.x + 20, y1 + 118, "遗传物质始终不变。", MID, "start", 8.4, 400);
    }
  }

  function draw() {
    var gA = $("gxA"), gB = $("gxB");
    gA.textContent = ""; gB.textContent = "";
    var s = calc(A);
    el("rect", { x: L.left.x, y: L.left.y, width: L.left.w, height: L.left.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    el("rect", { x: L.right.x, y: L.right.y, width: L.right.w, height: L.right.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    drawCells(gA, s);
    drawPlot(gB, s);
  }

  function render() {
    var s = calc(A), st, col, bg, sn;
    $("gxVa").textContent = String(Math.round(A));
    $("gxVb").textContent = fmt1(s.pot);
    $("gxVc").textContent = fmt1(s.expr);
    if (A < 20) { st = "受精卵级"; col = "#2f8a5b"; bg = "#e6f6ee"; sn = "全能性最高，pot≈100"; }
    else if (A <= 70) { st = "干细胞级"; col = "#b8791f"; bg = "#fdf3e0"; sn = "多向分化，pot 居中"; }
    else { st = "高度分化"; col = "#b8402f"; bg = "#fbeae7"; sn = "最低，但 DNA 未变"; }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    draw();
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  /* 停留帧在结论格 d=100（全能性最低、DNA 未变）：7→9.5 秒同值，
     循环回到 0 时与开头 0→1.2 秒接上，合计约 3.7 秒；
     开场 1.2 秒内即开始上升，满足 2.6 秒体检。 */
  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 0 }, { t: 1.2, v: 0 }, { t: 4, v: 60 }, { t: 7, v: 100 }, { t: 9.5, v: 100 }, { t: 12.5, v: 0 }],
    keys: [0, 30, 60, 100],
    value: A, min: 0, max: 100, step: 1,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__bio = { calc: calc, cases: [
    { v: 0, eq: { pot: 100, expr: 90 } },
    { v: 50, eq: { pot: 57.5, expr: 55 } },
    { v: 100, eq: { pot: 15, expr: 20 } }
  ] };

  /* 画布每帧重建节点，mousedown 与 mouseup 之间目标可能被换掉 → click 偶尔不触发 */
  if (stage.parentElement) {
    stage.parentElement.addEventListener("pointerdown", function () { ap.take(); });
  }

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
</body>
</html>
