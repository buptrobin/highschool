<p class="gx-claim">动物细胞工程的三件事：把细胞<b>养起来</b>（培养的条件）、把两个细胞<b>并起来</b>（融合）、把并起来的细胞<b>用起来</b>（两次筛选 → 单克隆抗体）。</p>
<div class="gx-meta">
<span><i></i>人教版（2019）选择性必修3 第2章第2节</span>
<span><i></i>高二 · 细胞工程</span>
<span><i></i>阅读 13 分钟</span>
<span><i></i>含 1 个互动模型</span>
</div>
<p class="gx-lede">这一节是第 2 章「细胞工程」里唯一同时考「培养条件」和「流程步骤」的一节：前半节讲动物细胞怎么在体外活下来，后半节讲怎么用它造出单克隆抗体。最容易丢分的不是流程背不下来，而是<b>把两次筛选合成一次</b>、把<b>单克隆抗体的优点写成「特异性差」</b>。下面四张图把流程和两次筛选各筛掉什么分开画清楚。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 动物细胞培养的条件<span class="q-src">人教版（2019）选择性必修3 · 第2章第2节</span></p>
<p class="q-b">动物细胞培养需要适宜的营养、温度、pH 和渗透压，以及无菌、无毒的环境。</p>
<p class="q-n">→ 翻成人话：这句话由<b>五个条件</b>组成（①营养 ②温度 ③pH ④渗透压 ⑤无菌无毒）。少一个就养不成：缺营养细胞不分裂，温度或 pH 不对酶失活，渗透压不对细胞皱缩或涨破，有菌有毒则细胞被污染死掉。再加上动物细胞特有的<b>贴壁生长</b>和<b>胰蛋白酶消化传代</b>，才是完整答案。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 单克隆抗体的制备步骤<span class="q-src">人教版（2019）选择性必修3 · 第2章第2节</span></p>
<p class="q-b">单克隆抗体的制备要经过细胞融合、筛选杂交瘤细胞、克隆化培养和抗体检测等步骤。</p>
<p class="q-n">→ 翻成人话：四步里<b>有两步都在「筛」</b>——先筛出杂交瘤细胞（是不是杂交瘤），再筛出能产生特定抗体的那一株（产不产我要的抗体）。把两步写成一步，就是这一节最常见的扣分点。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 动物细胞融合的用途<span class="q-src">人教版（2019）选择性必修3 · 第2章第2节</span></p>
<p class="q-b">动物细胞融合技术最重要的用途是制备单克隆抗体。</p>
<p class="q-n">→ 翻成人话：融合本身只是手段，考试问「融合有什么用」，标准答法是<b>制备单克隆抗体</b>，不是「让细胞变大」也不是「获得新品种」。融合的原理是<b>细胞膜的流动性</b>。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>B 淋巴细胞</th><th>骨髓瘤细胞</th><th>杂交瘤细胞</th></tr></thead>
<tbody>
<tr><td>能否在体外无限增殖</td><td>不能，在体外很快死亡</td><td>能，可无限传代</td><td>能，继承了骨髓瘤细胞</td></tr>
<tr><td>能否产生特定抗体</td><td>能，但一个细胞只产一种</td><td>不能，不产生抗体</td><td>能，继承了 B 淋巴细胞</td></tr>
<tr class="key"><td>能否直接用来生产单克隆抗体</td><td>不能：数量太少、活不长</td><td>不能：它根本不产抗体</td><td>能：既能无限增殖又能产特定抗体</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">背法：这张表只高亮最后一行——<b>杂交瘤细胞是「两条能力各取一半」的产物</b>，缺任何一半都不能用来生产单克隆抗体。答题时先说「既…又…」，再落到「所以能大量生产特异性强的单克隆抗体」。</p>
</section>

<section class="gx-sec" id="b">
<h2><span class="sn">02</span>拆开看</h2>
<p class="gx-h2s">四张图：①养细胞的条件 → ②制备流程 → ③两次筛选各筛掉什么 → ④杂交瘤细胞的特点。</p>

<figure class="gx-fig">
<div class="fig-cap">

<p class="gx-take">动物细胞培养要同时满足营养、温度、pH、渗透压、无菌无毒五个条件，并且因贴壁生长而必须用胰蛋白酶消化传代。</p>
<p class="gx-note">常见误解：把「胰蛋白酶」说成「纤维素酶」。动物细胞没有细胞壁，不需要去壁；纤维素酶是植物原生质体融合时才用的。</p>

<div class="gx-svgbox">

<text x="428" y="122" font-size="9" fill="#3a3a35">每个系只产生一种抗体</text>

<text x="616" y="122" font-size="9" fill="#3a3a35">抗原—抗体杂交验货</text>
<text x="616" y="138" font-size="9" fill="#3a3a35">选出产特定抗体的系</text>

<p class="gx-note">顺序不能颠倒：先有杂交瘤细胞，才谈得上克隆化培养；先克隆化培养到足够数量，才谈得上检测它产不产抗体。</p>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>

<div class="gx-ex">
<p class="ex-t">例题 · 原因分析类简答<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">科学家把小鼠的 B 淋巴细胞与骨髓瘤细胞融合，经两次筛选后得到一株杂交瘤细胞，用它生产单克隆抗体。（1）为什么用杂交瘤细胞，而不用 B 淋巴细胞或骨髓瘤细胞直接生产？（2）从融合到获得可用于生产的细胞，为什么要经过两次筛选？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定位</p>
<p class="s-b">两问的落点不同：第（1）问比的是「三种细胞各自的能力」，第（2）问比的是「两次筛选各筛掉什么」。别把两问写成一问。</p>
<p class="s-k">用到：杂交瘤细胞的特点、两次筛选的目的。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 拆开两个亲本</p>
<p class="s-b">B 淋巴细胞：能产生特定抗体，但在体外不能无限增殖，数量上不去。骨髓瘤细胞：能在体外无限增殖，但不产生抗体。两个都不合格，各缺一半。</p>
<p class="s-k">用到：B 淋巴细胞与骨髓瘤细胞的能力差异。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 合成第（1）问的答案</p>
<p class="s-b">杂交瘤细胞既具有 B 淋巴细胞产生特定抗体的能力，又具有骨髓瘤细胞在体外大量增殖的能力，因此能大量生产特异性强、纯度高的单克隆抗体。</p>
<p class="s-k">用到：杂交瘤细胞「既能…又能…」的固定句式。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 说清两次筛选</p>
<p class="s-b">第一次：融合是随机的，体系里有未融合的细胞和同种融合的细胞，用选择培养基只让杂交瘤细胞存活。第二次：活下来的杂交瘤细胞并非都能产生所需抗体，需经克隆化培养和抗体检测，选出能产生特定抗体的细胞系。</p>
<p class="s-k">用到：第一次筛「身份」，第二次筛「产品」。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口检查</p>
<p class="s-b">检查三件事：有没有写「两次」筛选；优点有没有写全「特异性强、灵敏度高、可大量制备」；有没有把产抗体说成骨髓瘤细胞的功能。</p>
<p class="s-k">用到：三个高频扣分点。</p>
</li>
</ol>

<p class="ans-b">（1）B 淋巴细胞能产生特定抗体，但在体外不能无限增殖；骨髓瘤细胞能在体外无限增殖，但不产生抗体。杂交瘤细胞既具有 B 淋巴细胞产生特定抗体的能力，又具有骨髓瘤细胞在体外大量增殖的能力，因此能大量生产特异性强、纯度高的单克隆抗体。<br>（2）第一次筛选：用选择培养基筛选出杂交瘤细胞，淘汰未融合的细胞和同种融合的细胞；第二次筛选：经克隆化培养和抗体检测，筛选出能产生特定抗体的杂交瘤细胞系。</p>

<div class="gx-qa">
<div class="qac">
<p class="q">动物细胞培养到底需要哪些条件？我只写「营养和温度」够吗？</p>
<p class="a">不够。要写全<b>营养、温度、pH、渗透压</b>和<b>无菌、无毒的环境</b>五个条件，再加上动物细胞<b>贴壁生长</b>、传代时用<b>胰蛋白酶</b>处理使细胞分散。</p>

<text class="ms" x="18" y="88" font-size="9">＋ 贴壁生长</text>
<text class="ms" x="18" y="106" font-size="9">＋ 胰蛋白酶消化传代</text>

<div class="qac">
<p class="q">杂交瘤细胞到底特殊在哪？</p>
<p class="a">它<b>既能无限增殖，又能产生特定抗体</b>：无限增殖来自骨髓瘤细胞，产生特定抗体来自 B 淋巴细胞。两条能力缺一条，都不能用来生产单克隆抗体。</p>

<p class="a">不行，两次筛的是不同层面：第一次用选择培养基筛出<b>杂交瘤细胞</b>（淘汰未融合和同种融合的细胞）；第二次用克隆化培养和抗体检测筛出<b>能产生特定抗体</b>的细胞系。第一次筛完的细胞里还有大量「活着但不产目标抗体」的。</p>

<h2><span class="sn">06</span>易错清单</h2>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 杂交瘤细胞筛选一次就够了，用选择培养基就能直接得到能生产抗体的细胞</p>
<p class="er-v">✓ 单克隆抗体的制备要经过两次筛选：第一次筛出杂交瘤细胞，第二次经克隆化培养和抗体检测筛出能产生特定抗体的细胞系</p>
<p class="er-w">错在哪：选择培养基只能筛「是不是杂交瘤」，管不了「产不产我要的抗体」，两次筛选目的不同。</p>
</div>
<div class="er">
<p class="er-x">✗ 单克隆抗体特异性差，是多种抗体混在一起</p>
<p class="er-v">✓ 单克隆抗体特异性强、灵敏度高、可大量制备，因为一个杂交瘤细胞系只产生一种抗体</p>
<p class="er-w">错在哪：把「单克隆」理解成了「多克隆」。血清里的抗体才是多种抗体的混合物。</p>
</div>
<div class="er">
<p class="er-x">✗ 动物细胞培养和植物组织培养一样，不需要严格无菌</p>
<p class="er-v">✓ 动物细胞培养需要无菌、无毒的环境，器材要灭菌，培养基中常加抗生素并定期换液</p>
<p class="er-w">错在哪：动物细胞没有细胞壁、培养时间长、培养基营养丰富，一旦污染细菌繁殖更快，整瓶报废。</p>
</div>
<div class="er">
<p class="er-x">✗ 杂交瘤细胞只能无限增殖，产生抗体还得另外加 B 淋巴细胞</p>
<p class="er-v">✓ 杂交瘤细胞既能无限增殖，又能产生特定抗体，可以单独用于生产单克隆抗体</p>
<p class="er-w">错在哪：把融合当成「拼装」而不是「合并」。融合后两条能力在同一个小胞里，不需要再补 B 淋巴细胞。</p>
</div>
<div class="er">
<p class="er-x">✗ 骨髓瘤细胞能产生抗体，所以用它生产单克隆抗体</p>
<p class="er-v">✓ 骨髓瘤细胞在体外能无限增殖，但不产生抗体；它只提供无限增殖的能力</p>
<p class="er-w">错在哪：把两条能力的来源记反了。产抗体的是 B 淋巴细胞，能无限增殖的是骨髓瘤细胞。</p>
</div>
<div class="er">
<p class="er-x">✗ 动物细胞传代时用纤维素酶去掉细胞壁</p>

<p class="er-w">错在哪：纤维素酶是植物细胞去壁用的；动物细胞要解决的是「贴壁和细胞间连接」，不是细胞壁。</p>
</div>

<p class="er-w">错在哪：融合靠膜，不靠壁。把「膜」写成「壁」，是原理题的典型笔误。</p>
