<p class="gx-lede">上一节讲水和无机盐，这一节讲两类有机物：糖类和脂质。它们在整章里的位置是「能源与结构」——后面讲细胞膜（磷脂）、讲呼吸作用（葡萄糖、脂肪的氧化分解）都要回来用。最容易错的一件事：把<b>「糖类」当成「都能供能、都是甜的」</b>，把<b>「脂质」当成「脂肪」</b>。这两处一错，选择题的「下列说法正确的是」几乎必错。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 糖类<span class="q-src">人教版（2019）必修1 · 第2章第3节</span></p>
<p class="q-b">糖类是主要的能源物质。</p>
<p class="q-n">→ 翻成人话：这句话由<b>两个条件</b>组成。①「主要」不是「唯一」——脂肪才是主要的<b>储能</b>物质，糖类是主要的<b>能源</b>物质，两个词不能互换；② 说的是「能源物质」，糖类里还有不供能的成员（核糖、脱氧核糖组成核酸，纤维素构成细胞壁）。所以反过来推「糖类都能供能」就错了，少一个条件，结论就反了。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 脂肪<span class="q-src">人教版（2019）必修1 · 第2章第3节</span></p>
<p class="q-b">脂肪是细胞内良好的储能物质；与糖类相比，脂肪分子中氧的含量远远低于糖类，而氢的含量更高。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个条件</b>组成。①「良好的储能物质」是<b>相对糖类</b>比较出来的，单独说没有意义；② 判据是<b>氧和氢的比例</b>，不是元素种类——两者都只有 C、H、O；③ 只能推出「同质量放能多」，而它同时推出「耗氧多」，两句必须一起写。只写前半句，就是易错清单里的第 5 条。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 脂质<span class="q-src">人教版（2019）必修1 · 第2章第3节</span></p>
<p class="q-b">磷脂是构成细胞膜和细胞器膜的重要成分；固醇类物质包括胆固醇、性激素和维生素 D 等。</p>
<p class="q-n">→ 翻成人话：这句话由<b>两个条件</b>组成。① 磷脂管「膜」，不能说成储能，也不能说成「脂肪的一种」；② 固醇是<b>一类</b>，胆固醇、性激素、维生素 D 是它的代表物，答题要写「固醇类物质包括……」，只写其中一个会被判漏点。这三句话合起来，正好把脂质分成脂肪、磷脂、固醇三块。</p>
</div>

<p class="gx-note">整张表只高亮 1 行：<b>氧、氢比例</b>。背法——「同质量的脂肪放能多、耗氧也多」，这两个「多」是同一件事的两面：氢多，脱下来的氢就多，就需要更多 O₂ 来接手。会写这一句，2.3 倍和 2.7 倍都能自己推出来，不用硬记。</p>
</section>

<p class="gx-h2s">四张图：各讲一件事，按「是什么 → 怎么变 → 怎么用」排。先看糖怎么分，再看脂质怎么分，然后比能量，最后落到膜上。</p>

<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题：先把两个角度拆开</p>
<p class="s-b">题干有两个限定词：「能量」和「代谢」，答案必须分成对应的两块，不能混成一段。先定性：驼峰是脂肪组织，主要成分是脂肪，不是糖原。</p>
<p class="s-k">用到：脂肪是细胞内良好的储能物质。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 能量角度：把 2.3 倍摆出来</p>
<p class="s-b">同质量下脂肪放能约 39 kJ/g、糖类约 17 kJ/g，比值约 2.3。也就是说，带同样多的能量，脂肪的质量只有糖类的约 43%；反过来，同样的体重能带约 2.3 倍的能量。驼峰要长期背着走，这个差别直接决定「背得动多少天的口粮」。</p>
<p class="s-k">用到：脂肪分子中氧的含量远远低于糖类，而氢的含量更高。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 代谢角度：先写有利的一面，再写代价</p>
<p class="s-b">有利：脂肪氧化时脱下的氢多，生成的代谢水也多，对缺水环境有利。代价：耗氧约 2.05 L/g，是糖类（0.75 L/g）的约 2.7 倍，而且脂肪动员慢、不能应急供能。所以答案要写成「有利 + 代价」，只写「放能多、耗氧少」是两条同时错。</p>
<p class="s-k">用到：脂肪完全氧化耗氧多；糖类是主要的能源物质。</p>

<p class="s-b">三句话分三点，每点先给判据再给结论，不写「因为脂肪好」这种没有判据的话。最后补一句「糖类仍是主要能源物质，供能快、能应急」，把两者关系写完整，防止被追问。</p>
<p class="s-k">用到：主要能源物质（糖类）与良好储能物质（脂肪）的分工。</p>

<p class="q">「纤维素不能被人体消化，为什么还算是必需的？」</p>

<p class="q">「单糖、二糖、多糖到底怎么区分？」</p>
<p class="a">按<b>水解产物</b>分，不按甜味、也不按分子大小猜：不能水解的是单糖（葡萄糖、果糖、核糖、脱氧核糖）；水解成 2 分子单糖的是二糖（蔗糖、麦芽糖、乳糖）；水解成多个单糖的是多糖（淀粉、糖原、纤维素、几丁质）。所以「糖类都是甜的」和「糖类都能供能」两条都错。</p>

<p class="gx-note">这六问其实是同一件事：<b>先确定分类和判据，再谈功能</b>。分类错了（把纤维素当能源、把磷脂当脂肪），功能一定跟着写错；判据对了，2.3 倍、2.7 倍这些数字都能自己推出来。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。考前只看这一节也够。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 糖类都是甜的，甜的就是糖。</p>
<p class="er-v">✓ 糖类不都甜：淀粉、纤维素、糖原等多糖没有甜味；有甜味的糖精并不是糖。</p>
<p class="er-w">错在哪：把「甜味」当成分类依据。分类判据是<b>能否水解、水解成几分子单糖</b>。</p>
</div>
<div class="er">
<p class="er-x">✗ 脂肪就是脂质。</p>
<p class="er-v">✓ 脂质包括脂肪、磷脂和固醇，脂肪只是其中一类。</p>
<p class="er-w">错在哪：把大类当小类。反过来说「脂质就是脂肪」同样错，两者是包含关系。</p>
</div>
<div class="er">
<p class="er-x">✗ 磷脂属于脂肪，因为它也是甘油和脂肪酸组成的。</p>
<p class="er-v">✓ 磷脂是脂质中与脂肪并列的一类，还含磷酸基团，是细胞膜和细胞器膜的重要成分。</p>
<p class="er-w">错在哪：只看共同骨架（甘油 + 脂肪酸），忽略了磷酸基团这个关键差别，功能也就跟着写错。</p>
</div>
<div class="er">
<p class="er-x">✗ 纤维素能被人体消化，所以蔬菜能提供能量。</p>
<p class="er-v">✓ 人体没有分解纤维素的酶，不能消化吸收、不供能；纤维素是植物细胞壁的成分，属于膳食纤维。</p>
<p class="er-w">错在哪：把「植物能利用」当成「人能消化」。纤维素对人体是结构性和功能性作用，不是能源。</p>
</div>
<div class="er">
<p class="er-x">✗ 脂肪氧化放能多，而且耗氧少。</p>
<p class="er-v">✓ 同质量脂肪放能约为糖类的 2.3 倍，但完全氧化耗氧约为糖类的 2.7 倍（约 2.05 L/g）。</p>
<p class="er-w">错在哪：只记一半。氧少氢多的结果是「放能多」和「耗氧多」同时成立，两个倍数必须成对写。</p>
</div>
<div class="er">
<p class="er-x">✗ 胆固醇只有坏处，食物里一点都不能有。</p>
<p class="er-v">✓ 胆固醇是动物细胞膜的组成成分，还参与脂质运输；过多时才会沉积在血管壁。</p>
<p class="er-w">错在哪：绝对化。正确的口径是「适量必需、过多有害」。</p>
</div>
<div class="er">
<p class="er-x">✗ 糖类都是能源物质。</p>
<p class="er-v">✓ 糖类中只有葡萄糖等能供能；核糖、脱氧核糖参与核酸组成，纤维素是结构物质，都不供能。</p>
<p class="er-w">错在哪：把课本的「主要」写成「都」。课本说的是「糖类是主要的能源物质」，不是「所有糖类都是能源物质」。</p>
</div>
