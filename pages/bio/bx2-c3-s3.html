<script type="text/markdown" id="md">
<div class="gx">

<div class="gx-kicker">ELI5-HIGH · 讲给要考试的人</div>
<p class="gx-claim">DNA 复制是<b>半保留复制</b>：<b>边解旋边复制</b>，每个子代 DNA 一条旧链一条新链；复制 n 次得 <span class="gx-fml">2ⁿ</span> 个分子，含 15N 的恒为 <span class="gx-fml">2</span> 个。</p>
<div class="gx-meta">
<span><i></i>人教版（2019）必修2 第3章第3节</span>
<span><i></i>高一 · 基因的本质</span>
<span><i></i>阅读 12 分钟</span>
<span><i></i>含 1 个互动模型</span>
</div>
<p class="gx-lede">上一节把 DNA 拆成了双螺旋，这一节讲它怎样被原样拷贝一份。整节只有一个核心结论：<b>半保留复制</b>——每个子代 DNA 都保留亲代的一条链。最容易错的是把它想成「全保留」：那样含 15N 的分子只会剩 1 个，和密度梯度离心看到的<b>中带</b>对不上。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 复制的过程<span class="q-src">人教版（2019）必修2 · 第3章第3节</span></p>
<p class="q-b">DNA 复制以亲代 DNA 的两条链为模板，边解旋边复制。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个条件</b>组成：①以亲代 DNA 的<b>两条链</b>分别作模板（不是把整条双链当模板）；②<b>边解旋边复制</b>——解旋一段、复制一段，不是先全解开再复制；③子链与模板链严格<b>碱基互补配对</b>。少写一个，表述就不完整；第②条还是简答题的高频采分点。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 复制的条件<span class="q-src">人教版（2019）必修2 · 第3章第3节</span></p>
<p class="q-b">复制需要模板、原料、能量和酶，遵循碱基互补配对原则。</p>
<p class="q-n">→ 四个条件一个都不能少：<b>模板</b>（亲代 DNA 的两条链）、<b>原料</b>（四种游离的脱氧核苷酸）、<b>能量</b>（ATP）、<b>酶</b>（解旋酶、DNA 聚合酶）。缺能量或缺聚合酶，链就延伸不下去；原料只供应新链，旧链一条也不消耗。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 半保留复制<span class="q-src">人教版（2019）必修2 · 第3章第3节</span></p>
<p class="q-b">新合成的每个 DNA 分子中，都保留了原来 DNA 的一条链。</p>
<p class="q-n">→ 这就是<b>半保留</b>：每个子代 DNA 一条旧链一条新链，旧的那一半被「保留」下来。关键推论：亲代只有 <span class="gx-fml">2</span> 条旧链，所以不管复制多少次，含 15N 的分子<b>恒为 2 个</b>，其余 <span class="gx-fml">2ⁿ−2</span> 个是纯 14N。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>半保留复制（课本）</th><th>全保留复制（错，最常见）</th></tr></thead>
<tbody>
<tr><td>1 个子代 DNA 的两条链</td><td>一条旧链 + 一条新链</td><td>两条都是新链</td></tr>
<tr><td>复制 3 次后的分子数</td><td>2³ = 8 个</td><td>8 个（这一步不会错）</td></tr>
<tr><td>含 15N 的分子数</td><td>恒为 2 个</td><td>恒为 1 个</td></tr>
<tr><td>纯 14N 的分子数</td><td>2ⁿ − 2 个</td><td>2ⁿ − 1 个</td></tr>
<tr class="key"><td>真正的判据：离心后看到几条带</td><td>中带 + 随代数增多的轻带</td><td>只有轻带</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只高亮 1 行。判是不是半保留，只看一件事：<b>2ⁿ 个分子里有几个含旧链</b>——是 2 个，不随 n 变大。把「含 15N 的比例在变小」误当成「个数在变小」，是这一节最常见的失分。</p>
</section>

<p class="ex-t">例题 · 半保留复制 + 原料计算<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">将 1 个两条链都被 15N 标记的 DNA 分子，放在只含 14N 的培养基中连续复制 3 次。请回答：(1) 共得到多少个 DNA 分子？(2) 含 15N 的 DNA 分子有几个？(3) 只含 14N 的 DNA 分子有几个？(4) 这次复制共需要游离的脱氧核苷酸相当于多少个 DNA 分子的量？<span style="color:#b8402f">注意第 (4) 问问的是「新合成几个」，不是「一共有几个」。</span></p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 定次数，写总数</p>
<p class="s-b">复制 n 次得 <span class="gx-fml">2ⁿ</span> 个分子，n=3，所以 2³ = 8 个。不是 3 个——复制是 1→2→4→8 的翻倍，不是每复制一次加一个。</p>
<p class="s-k">用到：复制 n 次得 2ⁿ 个 DNA 分子。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 数旧链，定含 15N 的个数</p>
<p class="s-b">亲代只有 2 条 15N 链。半保留复制让这 2 条旧链各自进入一个子代分子，所以含 15N 的分子恒为 2 个，而且这 2 个都是「一条 15N 旧链 + 一条 14N 新链」的杂合分子。</p>
<p class="s-k">用到：半保留——每个子代 DNA 一条旧链一条新链。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 总数减掉带 15N 的</p>
<p class="s-b">8 − 2 = 6 个纯 14N 分子，即 <span class="gx-fml">2ⁿ−2</span> = 2³ − 2 = 6。这 6 个分子的两条链都是新合成的。</p>
<p class="s-k">用到：纯 14N 的分子数 = 2ⁿ − 2。</p>
</li>
<li class="step" hidden>

<p class="s-k">用到：需要原料 = 2ⁿ − 1 个 DNA 分子的量。</p>
</li>
<li class="step" hidden>

<p class="s-b">四问四答，每问先给数字再给理由。第 (2) 问一定要写出「2 条旧链各进一个分子」这句因果，只写「2 个」会丢分。</p>

<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「半保留到底保留了什么？」</p>

<p class="a">相当于 <b>2³ − 1 = 7 个 DNA 分子</b>的脱氧核苷酸。原来的 1 个分子不需要再合成，新合成的只有 7 个；写成 8 是把「总数」当成了「新合成数」。</p>

<p class="a">不行。整条双链全打开会让<b>单链长时间暴露</b>，容易出错，也慢。边解旋边复制是解旋一段、复制一段，<b>效率更高、也更稳</b>。</p>

<p class="gx-note">六问其实是同一件事：<b>亲代只有 2 条旧链</b>。由它推出含 15N 的恒为 2 个、纯 14N 的 2ⁿ−2 个、原料 2ⁿ−1 个；再往下推，就是中带为什么永远在。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ DNA 复制是全保留复制，子代 DNA 的两条链都是新合成的。</p>
<p class="er-v">✓ 半保留复制：每个子代 DNA 一条旧链一条新链。</p>
<p class="er-w">错在哪：全保留的话含 15N 的分子只会剩 1 个，离心只看到轻带——与课本的中带结果直接冲突。</p>
</div>
<div class="er">
<p class="er-x">✗ 复制次数越多，含 15N 的 DNA 分子就越多。</p>
<p class="er-v">✓ 含 15N 的分子恒为 2 个，纯 14N 的是 2ⁿ − 2 个。</p>
<p class="er-w">错在哪：旧链只有 2 条，个数不会增加，被稀释的是比例（2/2ⁿ）而不是个数。</p>
</div>
<div class="er">
<p class="er-x">✗ 复制 3 次得到 3 个 DNA 分子。</p>
<p class="er-v">✓ 复制 n 次得 2ⁿ 个 DNA 分子，3 次是 8 个。</p>
<p class="er-w">错在哪：把「次数」当成「个数」。复制是 1→2→4→8 翻倍，不是每次加 1。</p>
</div>
<div class="er">
<p class="er-x">✗ 先把整条 DNA 完全解旋，再开始复制。</p>
<p class="er-v">✓ 边解旋边复制：解旋一段就复制一段。</p>
<p class="er-w">错在哪：全解旋会让单链长时间暴露，既慢又容易出错；课本的表述是「边解旋边复制」。</p>
</div>
<div class="er">
<p class="er-x">✗ 子代 DNA 的两条链都是新的，旧链被丢掉了。</p>
<p class="er-v">✓ 每个子代 DNA 都保留原来 DNA 的一条链。</p>
<p class="er-w">错在哪：这句话和「半保留」正好相反。数一数就知道：8 个分子里必须有 2 个带 15N。</p>
</div>
<div class="er">
<p class="er-x">✗ DNA 复制只要有酶就行，不需要能量。</p>
<p class="er-v">✓ 复制需要模板、原料、能量和酶，四个条件缺一不可。</p>
<p class="er-w">错在哪：把脱氧核苷酸接成链要消耗能量（ATP），缺能量链就延伸不下去。</p>
</div>
<div class="er">
<p class="er-x">✗ DNA 复制只发生在细胞核里。</p>
<p class="er-v">✓ 真核细胞主要在细胞核内复制，线粒体和叶绿体中的 DNA 也能复制。</p>
<p class="er-w">错在哪：把「主要场所」说成「唯一场所」。半保留复制对这三种 DNA 都成立。</p>
</div>

<script>
/* 互动：滑块 = 复制次数 n；2ⁿ 个分子里恒有 2 个含 15N */
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var GX = window.GX, el = GX.el, tx = GX.tx, $ = GX.$;
  var stage = $("gxStage");
  if (!stage || !window.AutoPilot) return;

  var W = { vb: "0 0 880 470", left: { x: 16, y: 16, w: 520, h: 438 }, right: { x: 552, y: 16, w: 312, h: 438 } };
  var N = { vb: "0 0 360 700", left: { x: 8, y: 8, w: 344, h: 300 }, right: { x: 8, y: 320, w: 344, h: 372 } };
  var L = W, A = 1, G = null, MAX = 32;
  var OLD = "#b8402f", NEW = "#2f6fb0", TICK = "#9fb3c4", MUT = "#5a6472";

  /* 唯一真值：复制次数 → 分子构成 */
  function calc(v) {
    var n = Math.max(1, Math.min(5, Math.round(v))), t = Math.pow(2, n);
    return { n: n, total: t, hybrid: 2, pure: t - 2 };
  }

  /* 网格几何：按总数选列数，n=5 的 32 个分子才不会挤成一团 */
  function geom(v) {
    var s = calc(v), c = s.total;
    var cols = c <= 4 ? 2 : c <= 16 ? 4 : 8, rows = Math.ceil(c / cols);
    return { s: s, cols: cols, cw: (L.left.w - 44) / cols, ch: (L.left.h - 84) / rows,
      ox: L.left.x + 22, oy: L.left.y + 50 };
  }

  function wrap(parent, x, y, s, maxW, lh) {
    var per = Math.max(6, Math.floor(maxW / 9)), cur = "", lines = [], i;
    for (i = 0; i < s.length; i++) { cur += s.charAt(i); if (cur.length >= per) { lines.push(cur); cur = ""; } }
    if (cur) lines.push(cur);
    for (i = 0; i < lines.length; i++) tx(parent, x, y + i * lh, lines[i], MUT, "start", 9, 400);
  }

  /* 一个 DNA 分子：两条平行线 + 碱基对小横线；旧链红、新链蓝 */
  function mol(parent, cx, cy, w, hybrid) {
    var g = 5, x1 = cx - w / 2, x2 = cx + w / 2, i, x;
    el("line", { x1: x1, y1: cy - g, x2: x2, y2: cy - g, stroke: hybrid ? OLD : NEW, "stroke-width": 2.2 }, parent);
    el("line", { x1: x1, y1: cy + g, x2: x2, y2: cy + g, stroke: NEW, "stroke-width": 2.2 }, parent);
    for (i = 0; i < 4; i++) {
      x = x1 + 6 + i * (w - 12) / 3;
      el("line", { x1: x, y1: cy - g + 1.5, x2: x, y2: cy + g - 1.5, stroke: TICK, "stroke-width": 1.3 }, parent);
    }
  }

  function draw() {
    var gA = $("gxA"), gB = $("gxB"), c, r, i, ry, rx, bw, s, w, LX = L.left.x, LY = L.left.y, LH = L.left.h, RX = L.right.x, RY = L.right.y;
    gA.textContent = ""; gB.textContent = "";
    G = geom(A); s = G.s; w = Math.min(G.cw - 12, 74);

    el("rect", { x: LX, y: LY, width: L.left.w, height: LH, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    tx(gA, LX + 20, LY + 28, "n = " + s.n + " 时的子代 DNA（共 " + s.total + " 个）", "#151a21", "start", 10.5, 700);
    tx(gA, LX + 20, LY + 44, "每条双链：一条旧链（红）+ 一条新链（蓝）；纯新的全是蓝", MUT, "start", 8.6, 400);
    for (c = 0; c < s.total; c++) {
      r = Math.floor(c / G.cols);
      mol(gA, G.ox + G.cw * ((c % G.cols) + 0.5), G.oy + G.ch * (r + 0.5), w, c < s.hybrid);
    }
    el("line", { x1: LX + 20, y1: LY + LH - 22, x2: LX + 40, y2: LY + LH - 22, stroke: OLD, "stroke-width": 2.4 }, gA);
    tx(gA, LX + 46, LY + LH - 14, "含 15N：2 个", OLD, "start", 8.8, 700);
    el("line", { x1: LX + 170, y1: LY + LH - 22, x2: LX + 190, y2: LY + LH - 22, stroke: NEW, "stroke-width": 2.4 }, gA);
    tx(gA, LX + 196, LY + LH - 14, "纯 14N：2ⁿ − 2 = " + s.pure + " 个", NEW, "start", 8.8, 700);

    el("rect", { x: RX, y: RY, width: L.right.w, height: L.right.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    tx(gB, RX + 18, RY + 28, "三个数怎么跟着 n 变", "#151a21", "start", 10.5, 700);
    rx = RX + 18; bw = L.right.w - 46;
    var rows = [["① 总数 = 2ⁿ = " + s.total, s.total, "#8fa3b5"],
      ["② 含 15N = 2（恒定，不随 n 变）", s.hybrid, OLD],
      ["③ 纯 14N = 2ⁿ − 2 = " + s.pure, s.pure, NEW]];
    for (i = 0; i < 3; i++) {
      ry = RY + 60 + i * 76;
      tx(gB, rx, ry, rows[i][0], "#3a3a35", "start", 8.8, 400);
      el("rect", { x: rx, y: ry + 8, width: Math.max(5, rows[i][1] / MAX * bw), height: 12, rx: 3, fill: rows[i][2] }, gB);
    }
    tx(gB, rx, RY + 300, "红条永远一样长——", MUT, "start", 9, 400);
    tx(gB, rx, RY + 316, "这就是「含 15N 恒为 2 个」。", MUT, "start", 9, 400);
    wrap(gB, rx, RY + 344, "n 每加 1，总数与纯 14N 都翻倍，只有红条不动：半保留复制把 2 条旧链永久保存下来。", bw, 15);
  }

  function render() {
    if (!G) { L = (stage.parentElement && stage.parentElement.getBoundingClientRect().width >= 640) ? W : N; G = geom(A); }
    var s = calc(A), st, col, bg, sn;
    $("gxVa").textContent = String(s.n);
    $("gxVb").textContent = String(s.total);
    $("gxVc").textContent = String(s.pure);
    if (s.n === 3) { st = "半保留成立"; col = "#2f8a5b"; bg = "#e6f6ee"; sn = "8 个里 2 个带 15N"; }
    else if (s.n < 3) { st = "刚开始"; col = "#b8791f"; bg = "#fdf3e0"; sn = "含 15N 仍为 2 个"; }
    else { st = "已稀释"; col = "#2f8a5b"; bg = "#e6f6ee"; sn = "个数不变，比例变小"; }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    draw();
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    stage.setAttribute("viewBox", L.vb);
    G = null;
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  /* 停留帧压在 n=3（8 个分子里 2 个带 15N），停 2.4 秒 */
  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 1 }, { t: 1.4, v: 1 }, { t: 4.4, v: 3 }, { t: 6.8, v: 3 }, { t: 9.2, v: 5 }, { t: 11, v: 4 }, { t: 13, v: 1 }],
    keys: [1, 3, 4, 5],
    value: A, min: 1, max: 5, step: 1,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__bio = { calc: calc, cases: [
    { v: 1, eq: { total: 2, hybrid: 2, pure: 0 } },
    { v: 3, eq: { total: 8, hybrid: 2, pure: 6 } },
    { v: 5, eq: { total: 32, pure: 30 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
