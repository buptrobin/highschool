<p class="gx-claim">基因突变改的是<b>基因内部的碱基序列</b>，基因重组换的是<b>基因之间的搭配</b>——只有前者产生<b>新基因</b>。</p>
<div class="gx-meta">
<span><i></i>人教版（2019）必修2 第5章第1节</span>
<span><i></i>高一 · 第5章 基因突变及其他变异</span>
<span><i></i>阅读 12 分钟</span>
<span><i></i>含 1 个互动模型</span>
</div>
<p class="gx-lede">这一节是必修2「变异」一章的地基：后面三节讲染色体变异、育种、进化，判断「是不是新基因」全靠这一节的两句话。最容易被扣分的是一个数法——<b>替换只动一个密码子，增添或缺失只要不是 3 的倍数，从那一点起后面三格一组全部重新划分</b>，这叫移码突变。很多人把「插入 3 个碱基对」当成「没什么影响」，其实它多编码 1 个氨基酸，属于整码突变。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 基因突变的定义<span class="q-src">人教版（2019）必修2 · 第5章第1节</span></p>
<p class="q-b">基因突变是指 DNA 分子中发生碱基的替换、增添或缺失，而引起的基因碱基序列的改变。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个条件</b>组成：① 变的是 DNA 分子上的碱基；② 动作只有三种——替换、增添、缺失；③ 结果必须是「基因碱基序列」真的改了。少第③条就不算：只是碱基被甲基化修饰、序列没动，不叫基因突变。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 基因突变的地位<span class="q-src">人教版（2019）必修2 · 第5章第1节</span></p>
<p class="q-b">基因突变产生新基因，是生物变异的根本来源。</p>
<p class="q-n">→ 两个关键词：「产生新基因」和「根本来源」。A 变成 a 是基因内部序列改了，所以是<b>新基因</b>；而基因重组只是把已有的基因重新搭配，<b>不产生新基因</b>，所以「根本来源」四个字只能给基因突变。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 基因重组的定义<span class="q-src">人教版（2019）必修2 · 第5章第1节</span></p>
<p class="q-b">基因重组是指在生物体进行有性生殖的过程中，控制不同性状的基因的重新组合。</p>
<p class="q-n">→ 也是三个条件：① 必须发生在<b>有性生殖</b>过程（减数分裂）中；② 重组的是「控制不同性状的基因」，也就是<b>非等位基因</b>；③ 结果是「重新组合」，基因本身一个没少、一个没新。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>突变方式</th><th>碱基序列怎么变</th><th>密码子怎么读</th><th>后果</th></tr></thead>
<tbody>
<tr><td>替换</td><td>一个碱基被另一个碱基换掉</td><td>只有被换的那 1 个密码子变，读码框不动</td><td>影响最小，可能只改 1 个氨基酸</td></tr>
<tr><td>增添 / 缺失 3 个（3 的倍数）</td><td>插入或删掉的碱基数能被 3 整除</td><td>多出或少了整码的密码子，读码框不动</td><td>整码突变，只多（少）1 个氨基酸</td></tr>
<tr class="key"><td>增添 / 缺失非 3 的倍数</td><td>插入或删掉的碱基数不能被 3 整除</td><td>从突变点起，后面三格一组全部重新划分</td><td>移码突变，后面所有氨基酸都变</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">背法：先数「变几个碱基」，再看「能不能被 3 整除」。能整除 → 只动局部；不能整除 → 从这一点起全乱。替换只影响一个密码子，所以它永远属于「能整除」那一档的轻微版。</p>
</section>

<div class="gx-ex">
<p class="ex-t">例题 · 插入碱基数与移码判断<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">某基因共 900 bp，编码 300 个氨基酸。现人为地在编码区第 300 bp 处（即第 100 个密码子之后）分别插入 1 个碱基对、3 个碱基对。<br>（1）两种情况分别属于哪种突变？<br>（2）分别有多少个氨基酸会受影响？请写出推算过程。<br>（3）有人说「插入 3 个碱基对不改变蛋白质结构，所以没有影响」，这句话错在哪？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题：先把碱基数换成密码子数</p>
<p class="s-b">900 bp 的编码区，三个碱基一个密码子，所以共 <span class="gx-fml">900 ÷ 3 = 300</span> 个密码子。插入点在第 300 bp，正好是第 100 个密码子读完的位置，所以上游 100 个密码子不动，下游还有 <span class="gx-fml">300 − 100 = 200</span> 个密码子。</p>
<p class="s-k">用到：碱基数与密码子数的换算，1 个密码子＝3 个碱基。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 定性：看 k 能不能被 3 整除</p>
<p class="s-b">插 1 个：<span class="gx-fml">1 mod 3 = 1 ≠ 0</span>，读码框整体错位，是移码突变。插 3 个：<span class="gx-fml">3 mod 3 = 0</span>，读码框不动，是整码突变。</p>
<p class="s-k">用到：移码突变与整码突变的判据。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 定量：算受影响的氨基酸数</p>
<p class="s-b">插 1 个：从插入点起三格一组全部重新划分，下游 200 个密码子全部改变，所以受影响 200 个。插 3 个：只多编码 <span class="gx-fml">3 ÷ 3 = 1</span> 个氨基酸，其余 200 个原样不变。</p>
<p class="s-k">用到：<span class="gx-fml">受影响氨基酸数 = k ÷ 3</span>（k 为 3 的倍数时）。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 下结论：变异类型 + 后果</p>
<p class="s-b">插 1 个 → 移码突变，插入点之后的全部密码子改变，可能提前出现终止密码子，蛋白质结构可能完全改变。插 3 个 → 整码突变，多 1 个氨基酸，其余不变，影响较小。</p>
<p class="s-k">用到：突变方式 → 读码框 → 蛋白质结构，三级因果链。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 核对陷阱</p>
<p class="s-b">那句话错在把「读码框不变」偷换成「没有影响」。插入 3 个碱基对确实不影响下游读码框，但多出的 3 个碱基会多编码 1 个氨基酸，蛋白质仍然改变，只是改变小。另外，如果插入的是终止密码子，后果同样严重。</p>
<p class="s-k">用到：整码突变 ≠ 无影响；突变后果取决于位置和序列，不只是读码框。</p>
</li>
</ol>

<p class="ans-b">（1）插入 1 个碱基对属于移码突变；插入 3 个碱基对属于整码突变（均属基因突变中的增添）。<br>（2）该基因 900 bp＝300 个密码子，插入点之后有 200 个密码子。<br>① 插入 1 个：1 不是 3 的倍数，插入点之后三格一组全部重新划分，200 个密码子全部改变，受影响氨基酸数为 200 个。<br>② 插入 3 个：3 是 3 的倍数，读码框不变，只多编码 3÷3＝1 个氨基酸，受影响氨基酸数为 1 个。<br>（3）错在把「读码框不变」当成「没有影响」。整码突变虽不改变下游读码框，但多编码了 1 个氨基酸，蛋白质的氨基酸数目和序列仍然改变；只是相比移码突变，影响范围小。<br>补充：替换只影响一个密码子，是三种方式中影响最小的一种；增添、缺失若不是 3 的倍数，后果最严重。</p>

    for (i = 0; i < 5; i++) {
      x = g.sx + i * 3 * g.cw;
      el("line", { x1: x + 2, y1: g.sy + g.ch + 3, x2: x + 3 * g.cw - 3, y2: g.sy + g.ch + 3, stroke: "#8fa0b0", "stroke-width": 1.5 }, gA);
    }
    tx(gA, g.bx, g.ly, sh && k ? "插入点之后三格一组的字母整体右移 → 移码" : "三格一组＝1 个密码子，界线不动",
      sh && k ? "#a8402c" : "#2f8a5b");
    tx(gA, g.bx, g.ly + g.lh, "橙色异色格＝刚才插进来的碱基（k = " + k + "）", "#8a5a00");
    tx(gA, g.bx, g.ly + 2 * g.lh, "替换只影响 1 个密码子；增添/缺失不是 3 的倍数就移码", "#3a3a35");

    /* 右侧：受影响的氨基酸数 + 300 个密码子的分布 */
    var bw = Rx.w - 40, bx = Rx.x + 20, cx = Rx.x + Rx.w / 2, y = Rx.y;
    tx(gB, bx, y + 30, "受影响的氨基酸数", "#5a6472", "start", 10.5, 700);
    tx(gB, cx, y + 90, String(s.changed), !s.changed ? "#2f8a5b" : (sh ? "#b8402f" : "#b8791f"), "middle", 40, 700);
    tx(gB, cx + (s.changed > 99 ? 40 : 26), y + 90, "个", "#6b7580", "start", 12, 400);
    tx(gB, cx, y + 112, "全基因共编码 300 个氨基酸", "#6b7580", "middle", 8.8, 400);

    var by = y + 136, x100 = bx + bw / 3;
    el("rect", { x: bx, y: by, width: bw, height: 20, rx: 4, fill: "#eafaf0", stroke: "#bfe0cd" }, gB);
    if (sh) el("rect", { x: x100, y: by, width: bw * 2 / 3, height: 20, rx: 4, fill: "#f7d9d0", stroke: "#c9705a" }, gB);
    else if (k) el("rect", { x: x100, y: by, width: Math.max(8, (k / 3) * bw / 300), height: 20, rx: 3, fill: "#f6c76a", stroke: "#d99a1f" }, gB);
    tx(gB, bx, by + 34, "0", "#6b7580", "start", 8.4);
    tx(gB, x100, by + 34, "100", "#6b7580", "middle", 8.4);
    tx(gB, bx + bw, by + 34, "300", "#6b7580", "end", 8.4);
    tx(gB, x100 + 6, by + 16, "插入点", "#8a5a00", "start", 8.4, 700);
    tx(gB, bx, by + 56, "k = " + k + "，k mod 3 = " + (k % 3), "#3a3a35", "start", 9);
    tx(gB, bx, by + 76, sh ? "不是 3 的倍数 → 移码突变" : (k ? "是 3 的倍数 → 整码突变" : "没有插入 → 序列不变"),
      sh ? "#a8402c" : "#2f8a5b", "start", 9, 700);
    tx(gB, bx, by + 96, sh ? "下游 200 个密码子全部重新划分" : (k ? "只多编码 " + (k / 3) + " 个氨基酸" : "受影响 0 个氨基酸"));
  }

  function render() {
    if (!G) { L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N; G = geom(); }
    var s = calc(A), col, bg, st, sn;
    $("gxVa").textContent = String(s.k);
    $("gxVb").textContent = s.k === 0 ? "否（未插入）" : (s.shifted ? "是 · 移码" : "否 · 整码");
    $("gxVc").textContent = String(s.changed);
    if (s.k === 0) { st = "没有突变"; col = "#2f8a5b"; bg = "#e6f6ee"; sn = "序列与读码框都不变"; }
    else if (!s.shifted) { st = "整码突变"; col = "#b8791f"; bg = "#fdf3e0"; sn = "读码框不动，多 " + (s.k / 3) + " 个氨基酸"; }
    else { st = "移码突变"; col = "#b8402f"; bg = "#fbeae7"; sn = "三格重新划分，后面 200 个全变"; }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    draw();
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    stage.setAttribute("viewBox", L.vb);
    G = geom();
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  var ap = AutoPilot.create({
    mount: stage, follow: $("gxSl"),
    loop: [{ t: 0, v: 0 }, { t: 1.2, v: 0 }, { t: 4, v: 1 }, { t: 6.5, v: 1 }, { t: 9, v: 3 }, { t: 11, v: 2 }, { t: 13, v: 0 }],
    keys: [0, 1, 2, 3], value: A, min: 0, max: 6, step: 1, idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  var model = { calc: calc, cases: [
    { v: 0, eq: { changed: 0 } }, { v: 3, eq: { changed: 1 } }, { v: 1, eq: { changed: 200 } },
    { v: 2, eq: { changed: 200 } }, { v: 6, eq: { changed: 2 } }
  ] };
  window.__bio = model;
  window.__model = model;

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
</body>
