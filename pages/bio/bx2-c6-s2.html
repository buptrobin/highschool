<p class="gx-claim">自然选择学说的核心判断：<b>自然选择直接作用于表现型，不直接改变基因</b>；<b>变异不定向、选择定向</b>。</p>
<div class="gx-meta">
<span><i></i>人教版（2019）必修2 第6章第2节</span>
<span><i></i>高一 · 生物的进化</span>
<span><i></i>阅读 12 分钟</span>
<span><i></i>含 1 个互动模型</span>
</div>
<p class="gx-lede">上一节讲种群是进化的基本单位，这一节回答「进化靠什么机制推动」——达尔文的自然选择学说。全节只有一个易错核心：选择的对象是<b>表现型</b>，被选择留下的是<b>基因</b>；变异本来就存在且不定向，方向是选择给的。记住这一条，本节的选择题和简答题就都能写对。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 自然选择学说<span class="q-src">人教版（2019）必修2 · 第6章第2节</span></p>
<p class="q-b">达尔文的自然选择学说包括过度繁殖、生存斗争、遗传变异、适者生存四个要点。适应是自然选择的结果；适应的形成是种群中有利变异逐代积累的过程。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个环节</b>组成——① 先有<b>不定向的变异</b>（遗传变异）；② 环境用<b>生存斗争</b>筛一遍，筛的是<b>表现型</b>；③ 活下来的把基因传下去，<b>有利变异逐代积累</b>，于是形成适应。少掉「变异先存在」这一环，就会错写成「环境让生物产生有利变异」；少掉「逐代积累」，就会错写成「一代就适应了」。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 选择的对象<span class="q-src">人教版（2019）必修2 · 第6章第2节</span></p>
<p class="q-b">自然选择直接作用于个体的表现型，使种群的基因频率发生定向改变。</p>
<p class="q-n">→ 翻成人话：<b>鸟看见的是蛾子的颜色（表现型），看不见基因</b>。深色蛾被吃、浅色蛾活下来，深色基因才跟着变少——基因频率的改变是<b>结果</b>，不是选择<b>直接动手</b>的对象。写「自然选择使基因发生定向改变」是错的，写「自然选择使种群基因频率发生定向改变」才对：前者是直接作用，后者是统计结果。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 适应的相对性<span class="q-src">人教版（2019）必修2 · 第6章第2节</span></p>
<p class="q-b">适应是相对的：环境条件改变后，原来适应的性状可能变得不适应。</p>
<p class="q-n">→ 翻成人话：适应不是「越变越高级」，而是「<b>对当前环境的匹配度</b>」。尺蛾的浅色在浅色树干上是适应，树干一熏黑，同一个浅色就成了靶子。所以判断适应必须带一个前提——<b>在什么环境下</b>；离开环境谈「更适应」是没有意义的一句话。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>达尔文 · 自然选择学说</th><th>拉马克 · 用进废退</th></tr></thead>
<tbody>
<tr><td>变异从哪里来</td><td>本来就存在，与环境是否变化无关</td><td>环境变化引起生物产生变异</td></tr>
<tr><td>变异有没有方向</td><td>不定向，各种变异同时存在</td><td>定向，朝着适应环境的方向变</td></tr>
<tr class="key"><td>适应是怎么形成的</td><td>自然选择<b>保留</b>有利变异，逐代<b>积累</b></td><td>器官用进废退，<b>获得性遗传</b>给后代</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">背法：把「不定向 / 定向」当成分水岭——达尔文说<b>变异不定向、选择定向</b>，拉马克说<b>变异本身就定向</b>。考试只要出现「环境使生物产生……以适应环境」「用进废退」，一律判拉马克、判错。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 用自然选择解释一种性状的变化<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">19 世纪工业革命后，某地树干被煤烟熏黑，桦尺蛾的深色个体比例由不到 5% 迅速上升到 90% 以上。<br>（1）请用自然选择学说解释这一现象。<br>（2）有同学说「是污染使蛾子产生了深色变异，以适应环境」。这个说法错在哪里？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性：这是「解释」题，套三段式</p>
<p class="s-b">只要题目出现「用自然选择学说解释」，答题骨架固定为三段：<b>变异本来就存在 → 环境选择 → 逐代积累</b>。先写哪一段都不能乱，因为阅卷按点给分，顺序乱了容易漏点。</p>
<p class="s-k">用到：自然选择学说的四个要点＝变异的来源、生存斗争、适者生存、积累。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 第一段：变异先存在，而且不定向</p>
<p class="s-b">种群中<b>原本就存在</b>浅色和深色两种变异（由基因突变产生），深色个体在污染前就已出现，只是比例很低。变异是<b>不定向</b>的，不是污染引起的，也不是蛾子「为了适应」主动变的。</p>
<p class="s-k">用到：变异是不定向的——这一句话就是本题的得分点之一。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 第二段：环境筛选的是表现型</p>
<p class="s-b">煤烟把树干熏黑后，<b>浅色个体在深色树干上容易被鸟发现</b>而被捕食，深色个体不易被发现、存活并留下后代的机会更大。注意措辞：鸟吃的是蛾子的<b>颜色</b>，选择直接作用于<b>表现型</b>，不是直接改变基因。</p>
<p class="s-k">用到：自然选择直接作用于表现型；生存斗争通过捕食实现。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 第三段：结果是基因频率定向改变</p>
<p class="s-b">深色个体留下的后代多，深色基因在种群中的频率<b>逐代上升</b>；这个过程是定向的、可积累的，于是深色个体比例迅速升高。注意：上升的是<b>种群的基因频率</b>，不是「个体的基因变了」。<br>口径对照：本页模型只算 10 代（s=0.5 → 86.5%），而真实工业黑化经历了几十代，所以题干里能升到 90% 以上——代数越多，模型值越接近 100%。</p>
<p class="s-k">用到：有利变异逐代积累 → 种群基因频率定向改变 → 进化。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 第（2）问：把「因果」倒过来就是错</p>
<p class="s-b">错在把因果颠倒了：污染<b>没有</b>让蛾子产生深色变异，它只是<b>改变了选择的方向</b>（原来深色吃亏，现在深色占便宜）。另外「以适应环境」暗示变异有目的、有方向，这是拉马克的说法。再补一句边界：如果树干重新变浅，深色的优势会消失——<b>适应是相对的</b>。</p>
<p class="s-k">用到：变异不定向、选择定向；适应是相对的；达尔文与拉马克的分歧。</p>
</li>
</ol>

<p class="ans-b">（1）① 种群中<b>原本就存在</b>浅色和深色的变异，变异是<b>不定向</b>的；② 树干被熏黑后，浅色个体易被鸟捕食，深色个体不易被发现，<b>生存和繁殖的机会更多</b>（自然选择直接作用于<b>表现型</b>）；③ 深色个体留下的后代多，<b>深色基因频率逐代上升</b>，有利变异逐代积累，因此深色个体比例迅速升高。<br>（2）错在把因果颠倒：污染没有使蛾子产生深色变异（变异本来就有、且不定向），污染只是<b>改变了选择的方向</b>，使深色变异由不利变为有利；「以适应环境」的说法暗示变异有方向，属于拉马克的用进废退，不是达尔文的自然选择。</p>
