<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边的原话，不要写右边的口语版。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 免疫系统的组成<span class="q-src">人教版（2019）选择性必修1 · 第4章第1节</span></p>
<p class="q-b">免疫系统包括免疫器官、免疫细胞和免疫活性物质。</p>
<p class="q-n">→ 翻成人话：这句话是<b>三个并列成分</b>，缺一个就答不全。①免疫器官（骨髓、胸腺、脾、淋巴结、扁桃体）是细胞生成、成熟或集中分布的场所；②免疫细胞（树突状细胞、巨噬细胞等吞噬细胞，以及 T 细胞、B 细胞等淋巴细胞）；③免疫活性物质——注意<b>不只有抗体</b>，还包括细胞因子、溶菌酶等。只写「抗体」是本节第一个扣分点。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 免疫系统的功能<span class="q-src">人教版（2019）选择性必修1 · 第4章第1节</span></p>
<p class="q-b">免疫系统具有免疫防御、免疫自稳和免疫监视三大功能。</p>
<p class="q-n">→ 翻成人话：三个功能各自盯住<b>不同的对象</b>。免疫防御盯「外来病原体」；<b>免疫自稳清除衰老、损伤的细胞</b>；<b>免疫监视识别并清除突变细胞（以及被病原体感染的细胞）</b>。把自稳和监视的对象互换，是选择题最爱设的坑：清除突变细胞的是监视，不是自稳。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 人体的三道防线<span class="q-src">人教版（2019）选择性必修1 · 第4章第1节</span></p>
<p class="q-b">人体的三道防线：皮肤和黏膜及其分泌物、体液中的杀菌物质和吞噬细胞、特异性免疫。</p>
<p class="q-n">→ 翻成人话：按「在哪拦」分成三层，前两层是<b>生来就有的非特异性免疫</b>，对多种病原体都有作用；<b>第一、二道是非特异性，只有第三道是特异性</b>，专门针对某一种病原体、后天获得。答题时若只写「三道防线」不标特异性，多半拿不到分。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>第一道防线</th><th>第二道防线</th><th>第三道防线</th></tr></thead>
<tbody>
<tr><td>由什么承担</td><td>皮肤、黏膜及其分泌物（如胃酸、泪液中的溶菌酶）</td><td>体液中的杀菌物质（如溶菌酶）和吞噬细胞</td><td>特异性免疫：B 细胞产生的抗体、细胞毒性 T 细胞等</td></tr>
<tr class="key"><td>是否特异性</td><td><b>非特异性</b>（生来就有，对多种病原体都起作用）</td><td><b>非特异性</b>（生来就有，对多种病原体都起作用）</td><td><b>特异性</b>（后天获得，只针对某一特定病原体）</td></tr>
<tr><td>典型失守后果</td><td>烧伤、创伤后病原体直接侵入</td><td>病原体在体液中扩散、大量繁殖</td><td>反复感染、肿瘤发生风险升高</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只高亮 1 行：<b>是否特异性</b>。背法：「前两道 = 生来就有、来者都挡；第三道 = 认准一个、专杀一个」。另外注意溶菌酶<b>在两道防线里都出现</b>（泪液、唾液等分泌物里属第一道，体液里属第二道），考题常拿它做两栖陷阱。</p>
</section>

<section class="gx-sec" id="b">

<p class="gx-h2s">四张图：先看「由什么组成」→「三层怎么排」→「三个功能各盯谁」→「第一道破了会怎样」。</p>

<p class="gx-take">判断句：判断一个结构是不是免疫器官，看它是不是「免疫细胞生成、成熟或集中分布的场所」，不是看它里面有没有病原体。</p>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 免疫防线与功能<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">皮肤大面积烧伤的病人为什么容易发生感染？请从人体三道防线的角度作答，并说明此时机体主要依靠哪些防线。（6 分）</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题/定性</p>
<p class="s-b">问的是「屏障没了会怎样」，落点是<b>第一道防线</b>的组成与作用，不是特异性免疫的细节。先给皮肤黏膜定性：它属于第一道防线，是非特异性免疫。</p>
<p class="s-k">用到：皮肤和黏膜及其分泌物构成第一道防线。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 说清「破损」意味着什么</p>
<p class="s-b">大面积烧伤使皮肤（及黏膜）这一物理屏障<b>结构破坏、屏障功能丧失</b>，病原体不再被阻挡，可以直接侵入体内——第一道防线基本失守。</p>
<p class="s-k">用到：第一道防线的作用是阻挡、清扫病原体。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 交代后两道为什么不够</p>
<p class="s-b">进入体内的病原体先由体液中的杀菌物质和吞噬细胞（第二道防线）清除，但第二道是<b>非特异性</b>的、清除能力有限；残余病原体只能靠特异性免疫（第三道）应对，而特异性免疫需要时间建立。</p>
<p class="s-k">用到：第一、二道是非特异性，只有第三道是特异性。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 补一句「负担」的因果</p>
<p class="s-b">屏障缺口越大，进入量越多，第二道的负担越重、第二道顶不完的部分越多，最终大量病原体压向第三道，感染风险显著增加。写「其他防线失效」是错的，只能写「负担加重」。</p>
<p class="s-k">用到：三道防线是层层设防，不是互相替代。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 组织答案</p>
<p class="s-b">按「第一道是什么 → 破了丢什么 → 后两道为何不够 → 结论」四层写，每层一句，术语照课本，不用比喻。</p>
<p class="s-k">用到：分点作答，术语优先。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">① 皮肤和黏膜及其分泌物构成人体的第一道防线，属于非特异性免疫，能阻挡病原体侵入。② 大面积烧伤使皮肤、黏膜大面积损伤，屏障功能丧失，病原体容易侵入体内。③ 进入体内的病原体主要由体液中的杀菌物质和吞噬细胞（第二道防线）清除，两道防线均为非特异性免疫、清除能力有限。④ 机体最终需依靠第三道防线（特异性免疫）清除残余病原体，故感染风险显著增加。</p>
</div>
</div>

<script>
/* 互动脚本本体（由 build-page.mjs 包进 <script> 里，所以这里不要写 <script> 标签） */
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var GX = window.GX, el = GX.el, tx = GX.tx, $ = GX.$;
  var stage = $("gxStage");
  if (!stage || !window.AutoPilot) return;

  /* 两套坐标：宽屏 880×470，窄屏独立 360×700 */
  var W = { vb: "0 0 880 470", left: { x: 16, y: 16, w: 424, h: 438 }, right: { x: 456, y: 16, w: 408, h: 438 } };
  var N = { vb: "0 0 360 700", left: { x: 8, y: 8, w: 344, h: 300 }, right: { x: 8, y: 320, w: 344, h: 372 } };
  var L = W, A = 50, G = null;

  /* 纯函数：参数 → 数值。render() 和 __bio.cases 都用它 */
  function calc(v) {
    var b = Math.max(0, Math.min(100, Number(v) || 0));
    var enter = 100 - b;
    return { enter: enter, remain: enter * 0.1 };
  }

  function geom() {
    var l = L.left, r = L.right, h = l.h;
    return {
      x0: l.x + 14, x1: l.x + l.w - 14, cx: l.x + l.w / 2,
      tY: l.y + Math.round(h * 0.085),
      wT: l.y + Math.round(h * 0.26),
      wH: Math.max(14, Math.round(h * 0.058)),
      b2: l.y + Math.round(h * 0.48),
      bH: Math.max(24, Math.round(h * 0.11)),
      b3: l.y + Math.round(h * 0.66),
      ft: l.y + Math.round(h * 0.93),
      bw: r.w - 82,
      rY: r.y + Math.round(r.h * 0.20),
      rH: Math.round(r.h * 0.20)
    };
  }

  function wall(x, w, gA) {
    if (w <= 1) return;
    el("rect", { x: x, y: G.wT, width: w, height: G.wH, rx: 4, fill: "#dbeef8", stroke: "#a9cfe3" }, gA);
    el("line", { x1: x + 2, y1: G.wT + G.wH / 2, x2: x + w - 2, y2: G.wT + G.wH / 2, stroke: "#b9d9ea", "stroke-width": 1 }, gA);
  }

  function draw() {
    var s = calc(A), gA = $("gxA"), gB = $("gxB");
    gA.textContent = ""; gB.textContent = "";
    el("rect", { x: L.left.x, y: L.left.y, width: L.left.w, height: L.left.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    tx(gA, G.x0, G.tY, "第一道防线：一堵有缺口的墙", "#5a6472", "start", 10.5, 700);

    /* 墙：缺口宽度 ∝ enter */
    var span = G.x1 - G.x0;
    var gapW = s.enter <= 0 ? 0 : Math.max(6, span * (s.enter / 100) * 0.88);
    var g0 = G.cx - gapW / 2, g1 = G.cx + gapW / 2;
    wall(G.x0, g0 - G.x0, gA);
    wall(g1, G.x1 - g1, gA);
    if (g0 > G.x0 + 1) tx(gA, G.x0 + 6, G.wT - 8, "皮肤、黏膜", "#2f7fa8", "start", 9.2, 700);
    if (gapW > 40) tx(gA, G.cx, G.wT + G.wH / 2 + 3, "缺口 " + s.enter.toFixed(0) + "%", "#b8402f", "middle", 9, 700);

    /* 病原体：数量 ∝ enter，穿过缺口落入体内 */
    var n = Math.round(s.enter / 17), k, px;
    for (k = 0; k < n; k++) {
      px = gapW > 12 ? g0 + gapW * (k + 1) / (n + 1) : G.cx + (k - n / 2) * 8;
      el("circle", { cx: px, cy: G.wT - 16, r: 3.2, fill: "#b8402f" }, gA);
      el("line", { x1: px, y1: G.wT - 11, x2: px, y2: G.b2 - 6, stroke: "#b8402f", "stroke-width": 1 }, gA);
    }

    el("rect", { x: G.x0, y: G.b2, width: span, height: G.bH, rx: 6, fill: "#e9f7f0", stroke: "#a8ddc4" }, gA);
    tx(gA, G.x0 + 10, G.b2 + G.bH * 0.42, "第二道：杀菌物质 + 吞噬细胞", "#2f8a5b", "start", 9.4, 700);
    tx(gA, G.x0 + 10, G.b2 + G.bH * 0.78, "非特异性，顶掉进入量的约九成", "#5a6472", "start", 8.8, 400);
    el("rect", { x: G.x0, y: G.b3, width: span, height: G.bH, rx: 6, fill: "#fdf5e6", stroke: "#e8cf9a" }, gA);
    tx(gA, G.x0 + 10, G.b3 + G.bH * 0.42, "第三道：特异性免疫", "#b8791f", "start", 9.4, 700);
    tx(gA, G.x0 + 10, G.b3 + G.bH * 0.78, "抗体 + 细胞毒性 T 细胞，专杀残余", "#5a6472", "start", 8.8, 400);

    /* 残余病原体 */
    var m = Math.round(s.remain / 2), q;
    for (q = 0; q < m; q++) el("circle", { cx: G.cx + (q - m / 2) * 9, cy: G.b3 - 9, r: 2.8, fill: "#b8791f" }, gA);
    tx(gA, G.x0, G.ft, "b 越小 → 缺口越宽 → 后两道负担越重", "#5a6472", "start", 9, 400);

    /* 右：各道防线承担的量 */
    el("rect", { x: L.right.x, y: L.right.y, width: L.right.w, height: L.right.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    tx(gB, L.right.x + 16, G.rY - 26, "各道防线承担的量（占病原体总量 %）", "#5a6472", "start", 10, 700);
    var rows = [
      { t: "① 进入体内 enter", v: s.enter, c: "#b8402f" },
      { t: "② 第二道清掉（九成）", v: s.enter - s.remain, c: "#2f8a5b" },
      { t: "③ 残余 → 第三道", v: s.remain, c: "#b8791f" }
    ], a, ry, rw;
    for (a = 0; a < rows.length; a++) {
      ry = G.rY + a * G.rH; rw = Math.max(0, G.bw * rows[a].v / 100);
      tx(gB, L.right.x + 16, ry, rows[a].t, "#3a3a35", "start", 9.2, 400);
      el("rect", { x: L.right.x + 16, y: ry + 7, width: G.bw, height: 12, rx: 3, fill: "#eef2f6" }, gB);
      el("rect", { x: L.right.x + 16, y: ry + 7, width: rw, height: 12, rx: 3, fill: rows[a].c }, gB);
      tx(gB, L.right.x + 24 + G.bw, ry + 17, rows[a].v.toFixed(1) + "%", rows[a].c, "start", 9, 700);
    }
    var axY = G.rY + 3 * G.rH + 4, axX = L.right.x + 16;
    el("line", { x1: axX, y1: axY, x2: axX + G.bw, y2: axY, stroke: "#c9d6e0", "stroke-width": 1 }, gB);
    tx(gB, axX, axY + 14, "0", "#8b97a4", "middle", 8.5, 400);
    tx(gB, axX + G.bw / 2, axY + 14, "50", "#8b97a4", "middle", 8.5, 400);
    tx(gB, axX + G.bw, axY + 14, "100", "#8b97a4", "middle", 8.5, 400);
  }

  function render() {
    if (!G) { L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N; G = geom(); }
    var s = calc(A), st, col, bg, sn;
    $("gxVa").textContent = String(Math.round(A));
    $("gxVb").textContent = s.enter.toFixed(0);
    $("gxVc").textContent = s.remain.toFixed(1);
    if (A >= 80) { st = "第一道基本完好"; col = "#2f8a5b"; bg = "#e6f6ee"; sn = "进入量不足两成"; }
    else if (A >= 50) { st = "有破损，第二道负担加重"; col = "#b8791f"; bg = "#fdf3e0"; sn = "靠第二道顶住"; }
    else { st = "大量病原体进入"; col = "#b8402f"; bg = "#fbeae7"; sn = "必须依赖特异性免疫"; }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    draw();
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    stage.setAttribute("viewBox", L.vb);
    G = geom();
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 100 }, { t: 1.2, v: 100 }, { t: 4, v: 50 }, { t: 6.5, v: 50 }, { t: 9, v: 0 }, { t: 11, v: 25 }, { t: 13, v: 100 }],
    keys: [0, 25, 50, 100],
    value: A, min: 0, max: 100, step: 5,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__bio = { calc: calc, cases: [
    { v: 100, eq: { enter: 0, remain: 0 } },
    { v: 50, eq: { enter: 50, remain: 5 } },
    { v: 0, eq: { enter: 100, remain: 10 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
