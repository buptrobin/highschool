<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 定义<span class="q-src">人教版（2019）选择性必修1 · 第5章第3节</span></p>
<p class="q-b">植物生长调节剂是人工合成的对植物生长发育有调节作用的化学物质。</p>
<p class="q-n">→ 这句话由<b>三个条件</b>组成：① <b>人工合成</b>（不是植物自己产的）；② 对植物的生长发育<b>有调节作用</b>；③ 是<b>化学物质</b>。三条同时满足才算，少第一条就成了植物激素——这是本节第一个扣分点。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 优点<span class="q-src">人教版（2019）选择性必修1 · 第5章第3节</span></p>
<p class="q-b">植物生长调节剂具有容易合成、原料广泛、效果稳定等优点。</p>
<p class="q-n">→ 三个优点里，考试最常问「为什么效果稳定」。答案不是「浓度高、作用强」，而是<b>植物体内没有分解它的酶</b>；植物自己的激素会被相应的酶分解掉，所以效果短而波动，调节剂不会被这样分解，效果才稳定、持久。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 使用原则<span class="q-src">人教版（2019）选择性必修1 · 第5章第3节</span></p>
<p class="q-b">使用植物生长调节剂要综合考虑浓度、时期、植物种类等因素，否则可能产生副作用。</p>
<p class="q-n">→ 注意「综合考虑」和「否则」：<b>三要素缺一项</b>，结果就从有效变成无效、药害或残留。浓度不是越高越好，时期不是随便挑，同一种药也不能对所有植物通用。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>植物激素</th><th>植物生长调节剂</th></tr></thead>
<tbody>

<tr><td>常见例子</td><td>生长素、赤霉素、乙烯、脱落酸</td><td>萘乙酸、2,4-D、乙烯利、青鲜素</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只高亮 1 行：<b>来源</b>。判断是不是调节剂，只看「人工合成还是植物合成」，不看名字里有没有「素」——乙烯利、青鲜素都带「素」，却都是人工合成的调节剂。</p>
</section>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「植物生长调节剂不就是植物激素吗？名字都带『素』。」</p>
<p class="a">不是。植物激素由<b>植物体内合成</b>；植物生长调节剂是<b>人工合成</b>的对植物生长发育有调节作用的化学物质。乙烯利、青鲜素名字带「素」，却是人工合成的调节剂，进入植物体后起作用的是它释放的乙烯。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="植物激素与调节剂的来源对比">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<rect x="20" y="24" width="94" height="46" rx="6" fill="#e6f6ee" stroke="#b8e6d0"/>
<text x="67" y="44" text-anchor="middle" font-size="8.5" fill="#2f6b4a">植物合成</text>
<text x="67" y="60" text-anchor="middle" font-size="8.5" fill="#2f6b4a">→ 植物激素</text>
<rect x="126" y="24" width="94" height="46" rx="6" fill="#eef3fb" stroke="#cfdcec"/>
<text x="173" y="44" text-anchor="middle" font-size="8.5" fill="#2c4f7c">人工合成</text>
<text x="173" y="60" text-anchor="middle" font-size="8.5" fill="#2c4f7c">→ 调节剂</text>
<text x="120" y="98" text-anchor="middle" font-size="8.5" fill="#5a6472">判据是来源，不是名字</text>
</svg>
</div>
<div class="qac">
<p class="q">「为什么调节剂的效果比植物自己的激素稳定？」</p>
<p class="a">因为<b>植物体内没有分解它的酶</b>。<b>植物激素</b>作用后会被相应的酶分解，所以效果短、波动大；调节剂不遇上这种酶，作用时间长、效果稳定。这是「效果稳定」的唯一正确解释。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="激素被酶分解而调节剂不被分解">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="20" y="34" font-size="8.5" fill="#3a3a35">植物激素 → 酶分解</text>
<text x="20" y="58" font-size="8.5" fill="#3a3a35">调节剂 → 无酶可分解</text>
<line x1="20" y1="72" x2="220" y2="72" stroke="#cfd8e0" stroke-width="1"/>
<text x="20" y="96" font-size="8.5" fill="#b8402f">所以：效果稳定 ≠ 浓度高</text>
</svg>
</div>
<div class="qac">
<p class="q">「用调节剂只要浓度对就行了吧？」</p>
<p class="a">不够。要综合考虑<b>浓度、时期、植物种类</b>：时期不对（如催熟过早）品质差甚至无效，种类不对（双子叶与单子叶敏感度不同）可能直接药害。三要素缺一项就会出问题。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="浓度、时期、植物种类三要素">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<rect x="20" y="26" width="60" height="26" rx="6" fill="#fff" stroke="#cfdcec"/>
<text x="50" y="43" text-anchor="middle" font-size="8.5" fill="#3a3a35">浓度</text>
<rect x="90" y="26" width="60" height="26" rx="6" fill="#fff" stroke="#cfdcec"/>
<text x="120" y="43" text-anchor="middle" font-size="8.5" fill="#3a3a35">时期</text>
<rect x="160" y="26" width="60" height="26" rx="6" fill="#fff" stroke="#cfdcec"/>
<text x="190" y="43" text-anchor="middle" font-size="8.5" fill="#3a3a35">种类</text>
<text x="120" y="78" text-anchor="middle" font-size="8.5" fill="#5a6472">三项同时满足</text>
<text x="120" y="100" text-anchor="middle" font-size="8.5" fill="#b8791f">缺一项 → 无效或药害</text>
</svg>
</div>
<div class="qac">
<p class="q">「2,4-D 为什么能除双子叶杂草，却不伤小麦？」</p>
<p class="a">因为不同植物对同一调节剂的<b>敏感程度不同</b>。双子叶杂草敏感，高浓度 2,4-D 会抑制其生长甚至使其死亡；单子叶作物不敏感，同一浓度下基本正常。这是选择性，不是「对所有植物都有害」。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="2,4-D 对双子叶杂草敏感、对单子叶作物安全">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<ellipse cx="62" cy="62" rx="30" ry="14" fill="#c9dca6"/>

<path d="M170 100 L170 46" stroke="#4f8a5b" stroke-width="3"/>
<path d="M170 100 L150 62" stroke="#4f8a5b" stroke-width="3"/>
<path d="M170 100 L190 62" stroke="#4f8a5b" stroke-width="3"/>
<text x="172" y="118" text-anchor="middle" font-size="8.5" fill="#2f6b4a">单子叶：耐受</text>
</svg>
</div>
<div class="qac">
<p class="q">「多加一点有什么后果？大不了多洗几遍。」</p>
<p class="a">过量会让<b>残留增加</b>，还可能产生<b>药害</b>：果实软化过度、品质下降、不耐储运，作物生长受抑制。洗涤去不掉已经进入组织的残留，所以关键是<b>控制浓度和时期</b>，不是事后补救。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="过量使用导致残留与药害">

<text x="20" y="62" font-size="8.5" fill="#6b4a16">成熟度趋于饱和</text>
<text x="20" y="84" font-size="8.5" fill="#6b4a16">残留 ↑　药害 ↑　品质 ↓</text>
<text x="20" y="106" font-size="8.5" fill="#b8402f">洗不掉：已进入组织</text>
</svg>
</div>
<div class="qac">
<p class="q">「植物生长调节剂算农药吗？随便买来用行不行？」</p>
<p class="a"><b>算，按农药管理</b>。购买和使用要遵守国家有关规定，看清登记作物和用量，不能凭「颜色深一点」随意加量；蔬菜、水果上使用还要注意安全间隔期，避免残留超标。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="植物生长调节剂按农药管理">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<rect x="26" y="30" width="42" height="62" rx="5" fill="#eef3fb" stroke="#7c93b3"/>

</div>
<p class="gx-note">这六问其实是同一件事：<b>来源决定身份，酶决定稳定性，三要素决定用法</b>。答题时先判「是不是人工合成」，再答「为什么稳定」，最后落到「控浓度、控时期」。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 植物生长调节剂就是植物激素，只是名字不同。</p>

<p class="er-w">错在哪：把「调节作用」当成「同一来源」。判据是来源——人工合成，不是植物合成。</p>

<div class="er">
<p class="er-x">✗ 效果稳定是因为调节剂浓度高、作用强。</p>

<div class="er">
<p class="er-x">✗ 浓度越高，催熟效果越好。</p>
<p class="er-v">✓ 超过适宜浓度后成熟度趋于饱和，收益递减，还会使果实软化过度、残留增加。</p>

</div>
<div class="er">
<p class="er-x">✗ 什么时候用都一样，只要喷上去就行。</p>

</div>
<div class="er">
<p class="er-x">✗ 调节剂是植物本来就有的东西，没有副作用。</p>
<p class="er-v">✓ 过量使用会残留或产生药害，使用要控制浓度和时期。</p>
<p class="er-w">错在哪：「天然」不等于「无害」，调节剂恰恰是人工合成的，用量和残留都要管。</p>
</div>
<div class="er">
<p class="er-x">✗ 2,4-D 对所有植物都有害，喷了就死。</p>
<p class="er-v">✓ 2,4-D 对双子叶杂草敏感，单子叶作物不敏感，可作选择性除草剂。</p>
<p class="er-w">错在哪：忽略植物种类差异。选择性正来自「敏感程度不同」。</p>
</div>
<div class="er">
<p class="er-x">✗ 乙烯利就是乙烯，喷上去等于给果实补激素。</p>
<p class="er-v">✓ 乙烯利是人工合成的调节剂，被植物吸收后释放乙烯，乙烯才是起作用的激素。</p>

function calc(c){var r=100*(1-Math.exp(-c/25));return{ripe:r,gain:100*(1-Math.exp(-(c+10)/25))-r}}

if(c<15)return{t:"催熟不足",col:"#b8791f",bg:"#fdf3e0",s:"青涩，成熟度低"};
if(c<=40)return{t:"催熟合适",col:"#2f8a5b",bg:"#e6f6ee",s:"性价比最高的一段"};
if(c<=60)return{t:"接近饱和",col:"#b8791f",bg:"#fdf3e0",s:"再加浓度提升很小"};
return{t:"过量",col:"#b8402f",bg:"#fbeae7",s:"品质与残留风险上升"}}
function bc(f){return"hsl("+(95-65*f)+",55%,"+(50+4*f)+"%)"}
function ln(a,b,c,d,g){el("line",{x1:a,y1:b,x2:c,y2:d,stroke:"#9aa7b2","stroke-width":1},g)}
function box(g,x,y,w,h,fill,st){el("rect",{x:x,y:y,width:w,height:h,rx:9,fill:fill,stroke:st},g)}
function geom(){
var g={left:L.left,right:L.right,berries:[]},r,c;
if(L.wide){g.rows=5;g.cols=4;g.br=13;g.bx=L.left.x+L.left.w/2;g.by=L.left.y+96;g.dx=40;g.dy=44;g.ly=L.left.y+336;
g.p={x0:L.right.x+64,x1:L.right.x+L.right.w-30,y0:L.right.y+80,y1:L.right.y+L.right.h-92}}
else{g.rows=4;g.cols=4;g.br=10;g.bx=L.left.x+L.left.w/2;g.by=L.left.y+78;g.dx=32;g.dy=36;g.ly=L.left.y+232;
g.p={x0:L.right.x+44,x1:L.right.x+L.right.w-22,y0:L.right.y+62,y1:L.right.y+L.right.h-64}}
for(r=0;r<g.rows;r++)for(c=0;c<g.cols;c++)g.berries.push({x:g.bx+(c-(g.cols-1)/2)*g.dx,y:g.by+r*g.dy});
return g}
function draw(){
var gA=$("gxA"),gB=$("gxB"),g=G,p=g.p,s=calc(A),i,k,f,b,pts=[],lab,right,X,Y,cv,rv,xx,yy,ft=L.wide?10.5:9.4,fs=L.wide?9.2:8.2;
function px(c){return p.x0+c/100*(p.x1-p.x0)}function py(r){return p.y1-r/100*(p.y1-p.y0)}
gA.textContent="";gB.textContent="";
box(gA,L.left.x,L.left.y,L.left.w,L.left.h,"#f8fbfd","#dbe7ef");
tx(gA,L.left.x+16,L.left.y+28,"一串果实：颜色 = 成熟度","#5a6472","start",ft,700);
for(i=0;i<g.berries.length;i++){f=Math.min(1,Math.max(0,A/100*g.berries.length-i));b=g.berries[i];
el("circle",{cx:b.x,cy:b.y,r:g.br,fill:bc(f),stroke:"#5f6b4a","stroke-width":.8},gA)}
for(k=0;k<3;k++)el("circle",{cx:L.left.x+34+k*26,cy:g.ly,r:7,fill:bc(k/2),stroke:"#5f6b4a","stroke-width":.8},gA);
tx(gA,L.left.x+112,g.ly+3,"青 → 黄 → 橙：成熟度升高","#5a6472","start",fs,400);
tx(gA,L.left.x+16,g.ly+30,"浓度越高，变色的果实越多","#5a6472","start",fs,400);
box(gB,L.right.x,L.right.y,L.right.w,L.right.h,"#ffffff","#e6e9ee");
tx(gB,L.right.x+16,L.right.y+28,"成熟度随浓度变化","#5a6472","start",ft,700);
el("rect",{x:px(60),y:p.y0,width:p.x1-px(60),height:p.y1-p.y0,fill:"#fbeae7",opacity:.6},gB);
ln(p.x0,p.y0,p.x0,p.y1,gB);ln(p.x0,p.y1,p.x1,p.y1,gB);
tx(gB,p.x0+4,p.y0-8,"成熟度 %","#8a949f","start",8.4,400);
tx(gB,p.x1,p.y1+32,"浓度 c (mg/L)","#8a949f","end",8.4,400);
for(k=0;k<=4;k++){cv=k*25;xx=px(cv);ln(xx,p.y1,xx,p.y1+4,gB);tx(gB,xx,p.y1+15,String(cv),"#8a949f","middle",8,400)}
for(k=0;k<=2;k++){rv=k*50;yy=py(rv);ln(p.x0-4,yy,p.x0,yy,gB);tx(gB,p.x0-7,yy+3,String(rv),"#8a949f","end",8,400)}
tx(gB,p.x1-6,p.y0+14,">60 过量区","#b8402f","end",8,400);
for(k=0;k<=20;k++)pts.push(px(k*5).toFixed(1)+","+py(100*(1-Math.exp(-k/5))).toFixed(1));
el("polyline",{points:pts.join(" "),fill:"none",stroke:"#2f6b4a","stroke-width":2},gB);
X=px(A);Y=py(s.ripe);
el("line",{x1:X,y1:Y,x2:X,y2:p.y1,stroke:"#b8791f","stroke-width":1,"stroke-dasharray":"3 3"},gB);
el("line",{x1:p.x0,y1:Y,x2:X,y2:Y,stroke:"#b8791f","stroke-width":1,"stroke-dasharray":"3 3"},gB);
el("circle",{cx:X,cy:Y,r:5,fill:"#ffffff",stroke:"#b8791f","stroke-width":2},gB);
lab="c="+Math.round(A)+"，"+s.ripe.toFixed(1)+"%";right=X<p.x1-96;
tx(gB,right?X+10:X-10,Y-10,lab,"#6b4a16",right?"start":"end",8.6,700);
}
function render(){
if(!G){L=stage.parentElement.getBoundingClientRect().width>=640?W:N;G=geom();}
var s=calc(A),z=zone(A);
$("gxVa").textContent=String(Math.round(A));
$("gxVb").textContent=s.ripe.toFixed(1);
$("gxVc").textContent=s.gain.toFixed(1);
$("gxVs").textContent=z.t;$("gxVsn").textContent=z.s;
$("gxStBox").style.background=z.bg;$("gxStBox").style.borderColor=z.col+"44";$("gxVs").style.color=z.col;
draw();
}
function layout(){L=stage.parentElement.getBoundingClientRect().width>=640?W:N;stage.setAttribute("viewBox",L.vb);G=geom();render()}
var apBadge=$("gxAp"),apTxt=$("gxApTxt");
function setMode(m){if(!apBadge)return;apBadge.classList.toggle("is-auto",m==="auto");apBadge.classList.toggle("is-manual",m!=="auto");if(apTxt)apTxt.textContent=m==="auto"?"自动演示中":"你接管了"}
var ap=AutoPilot.create({mount:stage,follow:$("gxSl"),
loop:[{t:0,v:0},{t:.9,v:0},{t:1.4,v:25},{t:3.6,v:25},{t:5.2,v:100},{t:7.2,v:100},{t:8.8,v:50},{t:10.2,v:50},{t:11.8,v:0}],
keys:[0,25,50,100],value:A,min:0,max:100,step:5,idle:5000,
onChange:function(v){A=v;render()},onMode:setMode});
window.__ap=ap;
window.__bio={calc:calc,cases:[{v:0,eq:{ripe:0}},{v:25,eq:{ripe:63.2}},{v:50,eq:{ripe:86.5}},{v:100,eq:{ripe:98.2}}]};
var tmr=null;
window.addEventListener("resize",function(){clearTimeout(tmr);tmr=setTimeout(layout,150)});
layout();
});
</script>
</body>
</html>
