<p class="gx-claim">生态系统的稳定性 = 保持原状的能力（<b>抵抗力</b>）+ 破坏后回到原状的能力（<b>恢复力</b>），两者<b>往往呈负相关</b>；而支撑这两种能力的<b>自我调节能力有上限</b>。</p>
<div class="gx-meta">
<span><i></i>人教版（2019）选择性必修2 第3章第5节</span>
<span><i></i>高二 · 生物与环境</span>
<span><i></i>阅读 13 分钟</span>
<span><i></i>含 1 个互动模型</span>
</div>
<p class="gx-lede">第 3 章从种群、群落一路讲到生态系统：前几节把「结构」和「功能」拆开讲完了，这一节收口——整套结构功能被扰动之后，还能不能稳住。最容易错的一件事不是背不下定义，而是把两种稳定性当成「同向的两个指标」：以为物种越丰富、两种稳定性就都越强。事实恰恰相反，<b>一个升，另一个往往降</b>。这一页就围绕这句话把定义、曲线、阈值、例题、易错一次讲透。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 稳定性的定义<span class="q-src">人教版（2019）选择性必修2 · 第3章第5节</span></p>
<p class="q-b">生态系统所具有的保持或恢复自身结构和功能相对稳定的能力，叫做生态系统的稳定性。</p>
<p class="q-n">→ 翻成人话：这一句里藏了<b>两个能力、一个对象、一个程度</b>。两个能力是「<b>保持</b>」和「<b>恢复</b>」——一个管扰动来时别乱，一个管乱了之后回得来；一个对象是「<b>结构和功能</b>」——不是只保住物种数量，能量流动和物质循环也得跟着稳住；一个程度是「<b>相对</b>」——不是绝对不变，是在一定范围内波动。少写「结构和功能」只写「物种不变」，或把「相对」写成「绝对」，都是原话层面的失分。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 靠什么稳住<span class="q-src">人教版（2019）选择性必修2 · 第3章第5节</span></p>
<p class="q-b">生态系统之所以能维持相对稳定，是由于生态系统具有自我调节能力。</p>
<p class="q-n">→ 翻成人话：稳定性是<b>结果</b>，自我调节能力是<b>原因</b>，答题时「因为……所以……」的方向不能反。自我调节能力的物质基础是<b>负反馈调节</b>：一个量升高，就通过链条反过来压低它自己（草原上鼠多 → 食鼠的动物多 → 鼠被压回去）。这条因果链是本节所有解释题的万能骨架，先写因，再写果。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 两个结论<span class="q-src">人教版（2019）选择性必修2 · 第3章第5节</span></p>
<p class="q-b">生态系统的自我调节能力有限，抵抗力稳定性与恢复力稳定性往往呈负相关。</p>
<p class="q-n">→ 翻成人话：这半句是两个互相独立的结论，考试分开考。「<b>自我调节能力有上限</b>」说的是<b>幅度</b>——干扰强度一旦超过阈值，负反馈拉不回来，结构和功能崩溃且往往不可逆；「<b>抵抗力与恢复力往往呈负相关</b>」说的是<b>两种能力之间的取舍</b>——把资源投在「抗」上，就必然牺牲「快」。注意课本用的是「<b>往往</b>」，不是「一定」，绝对化的表述在选择题里就是错误项。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>抵抗力稳定性</th><th>恢复力稳定性</th></tr></thead>
<tbody>
<tr><td>课本定义</td><td>受到干扰时，保持自身结构和功能相对稳定的能力</td><td>受到干扰破坏后，恢复到原状的能力</td></tr>
<tr><td>关键词抓哪个字</td><td><b>抗</b>——干扰正在进行中</td><td><b>恢</b>——干扰已经过去</td></tr>
<tr><td>看的是哪段时间</td><td>干扰<b>期间</b>偏离原状的程度（偏离越小越强）</td><td>干扰<b>之后</b>恢复所需的时间（用时越短越强）</td></tr>
<tr><td>典型代表</td><td>热带雨林、苔原（物种多、营养结构复杂）</td><td>荒漠草原、农田（物种少、结构简单）</td></tr>
<tr class="key"><td>真正的区别</td><td>比的是「<b>守得住</b>」——不被打乱</td><td>比的是「<b>回得快</b>」——乱了能复原</td></tr>
<tr><td>二者关系</td><td colspan="2">同一生态系统的两种能力<b>往往呈负相关</b>：一个强，另一个通常弱；但只是「往往」，不是绝对规律</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只高亮 1 行。背法：<b>抗 = 干扰中守住，恢 = 干扰后复原</b>；判据不是「物种多少」，而是「<b>偏离量</b>」和「<b>恢复时间</b>」这两个可观测的指标。凡题目问「哪个稳定性高」，先在题干里找有没有「干扰进行中」或「破坏之后」的时间状语，时间状语就是判据。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 两种稳定性的比较<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">热带雨林和荒漠草原相比：(1) 哪一个抵抗力稳定性高？哪一个恢复力稳定性高？分别说明理由。(2) 有同学总结「所以荒漠草原的稳定性更好，因为它恢复得快」。这个结论对吗？请评价。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题：先切时间</p>
<p class="s-b">题干里「抵抗力」对应干扰<b>进行中</b>，「恢复力」对应破坏<b>之后</b>。两个小问必须分开答，不能合成一句「雨林更稳定」。</p>
<p class="s-k">用到：抵抗力看偏离量，恢复力看恢复时间。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 比结构：物种与营养结构</p>
<p class="s-b">热带雨林物种丰富度高、营养结构（食物链食物网）复杂；荒漠草原物种少、营养结构简单。这一步只描述结构，先不下结论。</p>
<p class="s-k">用到：物种组成越复杂 → 自我调节能力越强。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 由结构推能力</p>
<p class="s-b">营养结构复杂，某一条食物链上的生物数量变动可以被其他链条缓冲，负反馈通路多，所以干扰下偏离小 → 热带雨林抵抗力稳定性高。荒漠草原链条少、缓冲余地小，一干扰就大幅偏离，但结构简单、恢复所需时间短 → 恢复力稳定性高。</p>
<p class="s-k">用到：自我调节能力是稳定性的原因；抵抗力与恢复力往往呈负相关。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 评价那个「更好」</p>
<p class="s-b">「更好」是偷换了概念：两种稳定性衡量的是不同的事，没有统一的「总分」。荒漠草原恢复快，恰恰因为它的结构简单、抵抗力弱；把「恢复快」当成「整体更稳定」，等于把负相关读成了同向。</p>
<p class="s-k">用到：两种稳定性不可通约，不能相加或排名。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 补一句边界</p>
<p class="s-b">还要补上「往往」二字：负相关是普遍趋势而非绝对规律，某些生态系统在特定干扰下可以两者都不弱；同时任何生态系统的自我调节能力都有上限，干扰超过阈值，两者都无从谈起。</p>
<p class="s-k">用到：自我调节能力有上限；课本用「往往」不用「一定」。</p>
</li>
</ol>

</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">(1) 抵抗力稳定性：热带雨林高。热带雨林物种丰富度高、营养结构复杂，自我调节能力强，受到干扰时能保持自身结构和功能相对稳定，偏离原状小。<br>恢复力稳定性：荒漠草原高。荒漠草原物种少、营养结构简单，被破坏后恢复所需时间短。<br>(2) 不对。两种稳定性衡量的不是同一件事，不能合并成「谁更好」；荒漠草原恢复力强正是以抵抗力弱为代价，二者往往呈负相关。且负相关只是「往往」，不是绝对规律；干扰一旦超过自我调节能力的上限，生态系统崩溃，两种稳定性都不再成立。</p>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「两种稳定性到底怎么区分？我总把两个词用反。」</p>
<p class="a">只看<b>时间状语</b>：干扰<b>进行中</b>还能保持原状 → 抵抗力稳定性；干扰<b>结束之后</b>回到原状 → 恢复力稳定性。判据也不同：前者看<b>偏离量</b>，后者看<b>恢复时间</b>。</p>

<div class="qac">
<p class="q">「为什么抵抗力与恢复力往往呈负相关？这不是反直觉吗？」</p>
<p class="a">因为两者花的是<b>同一笔资源</b>：物种多、营养结构复杂，负反馈通路多，干扰下<b>偏离小</b>（抵抗力强），但链条一断要重建整张网，<b>恢复慢</b>（恢复力弱）；结构简单者缓冲少、易被破坏，却也只需要少数物种回来就能复原。所以<b>抵抗力与恢复力往往呈负相关</b>。</p>

<div class="qac">
<p class="q">「生态系统有自我调节能力，那它是不是迟早都能恢复？」</p>
<p class="a">不是。<b>自我调节能力有上限</b>，上限对应一个<b>阈值</b>：阈值以内负反馈能把干扰抵消，阈值以外调节失效，结构和功能崩溃且往往<b>不可逆</b>。所以「有调节能力」≠「什么干扰都能扛」。</p>

<div class="qac">
<p class="q">「物种越多是不是越稳定？那雨林岂不是什么都最强？」</p>
<p class="a">只对一半。<b>物种组成越复杂，抵抗力稳定性越强</b>，但<b>恢复力稳定性往往越弱</b>。所以不能说「雨林整体最稳定」，只能说「雨林<u>抵抗力</u>最稳定」。答题时必须点明是哪一个稳定性。</p>

<div class="qac">
<p class="q">「哪些生态系统抵抗力高？热带雨林、苔原、还是荒漠草原？」</p>
<p class="a">看<b>物种组成与营养结构</b>：物种丰富、食物网复杂的（热带雨林、常绿阔叶林、苔原）抵抗力稳定性高；物种少、结构简单的（荒漠草原、农田）抵抗力低。<b>别用「环境恶劣」当判据</b>，判据是结构复杂程度。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗「两种稳定性都高，才是好的生态系统。」</p>
<p class="er-v">✓ 抵抗力稳定性与恢复力稳定性往往呈负相关，评价某个生态系统时必须<b>指明是哪一个稳定性</b>。</p>
<p class="er-w">错在哪：把两个反向指标当成「分数相加」。同一个系统很难两样都强，说「都好」等于没答。</p>
</div>

<div class="er">
<p class="er-x">✗「物种越多，两种稳定性都越强。」</p>
<p class="er-v">✓ 物种组成越复杂，<b>抵抗力</b>稳定性越强，但恢复力稳定性往往越弱。</p>
<p class="er-w">错在哪：漏掉负相关这半句。热带雨林是抵抗力强、恢复力弱的典型，不是「全面最强」。</p>
</div>

<div class="er">
<p class="er-x">✗「生态系统有自我调节能力，被破坏后总能恢复。」</p>
<p class="er-v">✓ <b>自我调节能力有上限</b>，干扰超过阈值，结构和功能崩溃，往往不可逆。</p>
<p class="er-w">错在哪：把「有能力」读成「能力无限」。恢复力稳定性只在上限以内成立。</p>
</div>

<div class="er">
<p class="er-x">✗「森林物种最多，所以恢复力稳定性最强。」</p>
<p class="er-v">✓ 森林营养结构复杂，<b>抵抗力</b>稳定性强而恢复力稳定性弱；恢复快的是结构简单的荒漠草原。</p>
<p class="er-w">错在哪：用「物种多」这个判据去量恢复力。恢复力的判据是恢复所需时间，物种多恰恰拖慢重建。</p>
</div>

<script>

document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var GX = window.GX, el = GX.el, tx = GX.tx, $ = GX.$;
  var stage = $("gxStage");
  if (!stage || !window.AutoPilot) return;

  /* 两套坐标：宽屏 880×470，窄屏独立 360×700 */
  var W = { vb: "0 0 880 470", left: { x: 16, y: 16, w: 424, h: 438 }, right: { x: 456, y: 16, w: 408, h: 438 } };
  var N = { vb: "0 0 360 700", left: { x: 8, y: 8, w: 344, h: 300 }, right: { x: 8, y: 320, w: 344, h: 372 } };
  var L = W, A = 13, G = null;

  /* 纯函数：物种丰富度 S → 两种稳定性。render() 和 __bio.cases 都用它 */
  function calc(v) {
    return { resist: 1 - Math.exp(-v / 15), recov: Math.exp(-v / 25) };
  }

  /* 布局相关的几何量，只在 layout() 或首帧算一次 */
  function geom() {
    var wide = (L === W), l = L.left, r = L.right, ry = r.y;
    return {
      wide: wide,
      P: {
        x0: l.x + (wide ? 62 : 48), x1: l.x + l.w - (wide ? 26 : 22),
        y0: l.y + (wide ? 84 : 50), y1: l.y + l.h - (wide ? 98 : 56)
      },
      rx: r.x + 20, rw: r.w - 40,
      r1t: ry + 64, r1b: ry + 72, r1v: ry + 108,
      r2t: ry + 144, r2b: ry + 152, r2v: ry + 188,
      rd: ry + 212, rs: ry + 238, rn: ry + 308
    };
  }

  function sx(g, S) { return g.P.x0 + (S - 5) / 45 * (g.P.x1 - g.P.x0); }
  function sy(g, v) { return g.P.y1 - v * (g.P.y1 - g.P.y0); }

  /* 中文按字数换行，避免长句冲出面板 */
  function wrap(parent, x, y, s, maxW, fs, col, lh) {
    var per = Math.max(6, Math.floor(maxW / fs)), lines = [], cur = "";
    for (var i = 0; i < s.length; i++) { cur += s.charAt(i); if (cur.length >= per) { lines.push(cur); cur = ""; } }
    if (cur) lines.push(cur);
    for (var k = 0; k < lines.length; k++) tx(parent, x, y + k * lh, lines[k], col, "start", fs, 400);
    return lines.length;
  }

  function draw() {
    var g = G, P = g.P, gA = $("gxA"), gB = $("gxB"), s = calc(A), i, S, rp = [], cp = [];
    gA.textContent = ""; gB.textContent = "";
    el("rect", { x: L.left.x, y: L.left.y, width: L.left.w, height: L.left.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    tx(gA, L.left.x + 20, L.left.y + 32, "两条曲线的走向：一条升、一条降", "#5a6472", "start", 11, 700);
    el("rect", { x: L.left.x + 20, y: L.left.y + 46, width: 11, height: 3, rx: 1.5, fill: "#1f6fa8" }, gA);
    tx(gA, L.left.x + 37, L.left.y + 50, "抵抗力稳定性", "#1f6fa8", "start", 9.6, 700);
    el("rect", { x: L.left.x + 118, y: L.left.y + 46, width: 11, height: 3, rx: 1.5, fill: "#b8791f" }, gA);
    tx(gA, L.left.x + 135, L.left.y + 50, "恢复力稳定性", "#b8791f", "start", 9.6, 700);

    el("line", { x1: P.x0, y1: P.y0, x2: P.x0, y2: P.y1, stroke: "#c9d4de", "stroke-width": 1.1 }, gA);
    el("line", { x1: P.x0, y1: P.y1, x2: P.x1, y2: P.y1, stroke: "#c9d4de", "stroke-width": 1.1 }, gA);
    tx(gA, P.x0 - 9, P.y0 + 4, "1", "#8a94a3", "end", 8.6, 400);
    tx(gA, P.x0 - 9, P.y1 + 4, "0", "#8a94a3", "end", 8.6, 400);
    for (i = 0; i < 46; i++) {
      S = 5 + i; rp.push(sx(g, S) + "," + sy(g, calc(S).resist).toFixed(1));
      cp.push(sx(g, S) + "," + sy(g, calc(S).recov).toFixed(1));
    }
    el("line", { x1: sx(g, 13), y1: P.y0, x2: sx(g, 13), y2: P.y1, stroke: "#8a94a3", "stroke-width": 1, "stroke-dasharray": "4 4" }, gA);
    el("polyline", { points: rp.join(" "), fill: "none", stroke: "#1f6fa8", "stroke-width": 2.2 }, gA);
    el("polyline", { points: cp.join(" "), fill: "none", stroke: "#b8791f", "stroke-width": 2.2 }, gA);
    el("circle", { cx: sx(g, 13), cy: sy(g, calc(13).resist), r: 3.6, fill: "#8a94a3" }, gA);
    el("line", { x1: sx(g, A), y1: sy(g, s.resist) + 8, x2: sx(g, A), y2: sy(g, s.recov) - 8, stroke: "#b8402f", "stroke-width": 1.4, "stroke-dasharray": "3 3" }, gA);
    el("circle", { cx: sx(g, A), cy: sy(g, s.resist), r: 4.4, fill: "#1f6fa8", stroke: "#ffffff", "stroke-width": 1.4 }, gA);
    el("circle", { cx: sx(g, A), cy: sy(g, s.recov), r: 4.4, fill: "#b8791f", stroke: "#ffffff", "stroke-width": 1.4 }, gA);

    tx(gA, P.x0, P.y1 + 18, "5", "#8a94a3", "middle", 8.8, 400);
    tx(gA, sx(g, 13), P.y1 + 18, "13", "#8a94a3", "middle", 8.8, 400);
    tx(gA, sx(g, 20), P.y1 + 18, "20", "#8a94a3", "middle", 8.8, 400);
    tx(gA, sx(g, 35), P.y1 + 18, "35", "#8a94a3", "middle", 8.8, 400);
    tx(gA, P.x1, P.y1 + 18, "50", "#8a94a3", "middle", 8.8, 400);
    tx(gA, P.x0, P.y1 + 40, "物种丰富度 S", "#5a6472", "start", 9.2, 700);
    tx(gA, P.x1, P.y1 + 40, "S≈13 两线交叉", "#8a94a3", "end", 9.2, 400);

    el("rect", { x: L.right.x, y: L.right.y, width: L.right.w, height: L.right.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    tx(gB, g.rx, L.right.y + 30, "当下的数值与判断", "#5a6472", "start", 11, 700);
    tx(gB, g.rx, g.r1t, "① 抵抗力稳定性 resist", "#1f6fa8", "start", 10, 700);
    el("rect", { x: g.rx, y: g.r1b, width: g.rw, height: 18, rx: 9, fill: "#eef1f5" }, gB);
    el("rect", { x: g.rx, y: g.r1b, width: Math.max(3, g.rw * s.resist), height: 18, rx: 9, fill: "#1f6fa8" }, gB);
    tx(gB, g.rx, g.r1v, s.resist.toFixed(2), "#1f6fa8", "start", 15, 700);
    tx(gB, g.rx + g.rw, g.r1t + 4, "越高越抗干扰", "#8a94a3", "end", 9, 400);
    tx(gB, g.rx, g.r2t, "② 恢复力稳定性 recov", "#b8791f", "start", 10, 700);
    el("rect", { x: g.rx, y: g.r2b, width: g.rw, height: 18, rx: 9, fill: "#eef1f5" }, gB);
    el("rect", { x: g.rx, y: g.r2b, width: Math.max(3, g.rw * s.recov), height: 18, rx: 9, fill: "#b8791f" }, gB);
    tx(gB, g.rx, g.r2v, s.recov.toFixed(2), "#b8791f", "start", 15, 700);
    tx(gB, g.rx + g.rw, g.r2t + 4, "越高越回得快", "#8a94a3", "end", 9, 400);
    el("line", { x1: g.rx, y1: g.rd, x2: g.rx + g.rw, y2: g.rd, stroke: "#e6e9ee", "stroke-width": 1 }, gB);
    var st = A < 10 ? "恢复力强、抵抗力弱（荒漠型）" : (A <= 16 ? "两者大致相当（交叉点附近）" : "抵抗力强、恢复力弱（森林型）");
    var col = (A >= 10 && A <= 16) ? "#2f8a5b" : "#b8791f";
    wrap(gB, g.rx, g.rs, st, g.rw, 10.4, col, 17);
    tx(gB, g.rx, g.rn, "绿色条长 = 抗体力高", "#8a94a3", "start", 9, 400);
    tx(gB, g.rx, g.rn + 16, "橙色条长 = 恢复力高", "#8a94a3", "start", 9, 400);
    tx(gB, g.rx, g.rn + 32, "两种稳定性往往负相关", "#8a94a3", "start", 9, 400);
  }

  function render() {
    if (!G) { L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N; G = geom(); }
    var s = calc(A), col, bg, sn, st;
    $("gxVa").textContent = String(Math.round(A));
    $("gxVb").textContent = s.resist.toFixed(2);
    $("gxVc").textContent = s.recov.toFixed(2);
    if (A < 10) { st = "恢复力强"; col = "#b8791f"; bg = "#fdf3e0"; sn = "抵抗力弱（荒漠型）"; }
    else if (A <= 16) { st = "两者相当"; col = "#2f8a5b"; bg = "#e6f6ee"; sn = "两线在 S≈13 交叉"; }
    else { st = "抵抗力强"; col = "#b8791f"; bg = "#fdf3e0"; sn = "恢复力弱（森林型）"; }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    draw();
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    stage.setAttribute("viewBox", L.vb);
    G = null;
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 5 }, { t: 1, v: 5 }, { t: 3, v: 13 }, { t: 5.5, v: 13 }, { t: 7.5, v: 20 }, { t: 9.5, v: 20 }, { t: 11, v: 35 }, { t: 12.5, v: 50 }, { t: 14.5, v: 5 }],
    keys: [5, 13, 20, 35, 50],
    value: A, min: 5, max: 50, step: 1,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__bio = { calc: calc, cases: [
    { v: 5, eq: { resist: 0.283, recov: 0.819 } },
    { v: 20, eq: { resist: 0.736, recov: 0.449 } },
    { v: 50, eq: { resist: 0.964, recov: 0.135 } }
  ] };
  window.__model = window.__bio;

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
