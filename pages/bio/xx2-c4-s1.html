<p class="gx-lede">这一节是第4章「人与环境」的开头：先把人对生态的影响换算成一把统一的尺子——面积，再用「几个地球」把全球超载说清楚，最后落到可持续发展的定义上。最容易错的一件事：把生态足迹当成「排放量」或「污染量」。它是把资源消耗和废物吸纳都折算成的土地与水域面积，单位是全球公顷。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 生态足迹的概念<span class="q-src">人教版（2019）选择性必修2 · 第4章第1节</span></p>
<p class="q-b">生态足迹（生态占用）是指维持某一人口单位生存所需的生产资源和吸纳废物的土地及水域面积。</p>
<p class="q-n">→ 翻成人话：这句话由<b>四个条件</b>组成：①一个「人口单位」（一个人、一座城、一个国家、全球）；②要维持它<b>生存</b>；③既算消耗的<b>生产资源</b>，也算<b>吸纳废物</b>；④最后统一折算成<b>土地及水域面积</b>。少掉第④个条件，就写成了「排放量」——这是本页第一号扣分点。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 足迹大小的意义<span class="q-src">人教版（2019）选择性必修2 · 第4章第1节</span></p>
<p class="q-b">生态足迹越大，对生态环境的影响越大。</p>
<p class="q-n">→ 翻成人话：足迹是<b>影响大小的度量</b>，不是「好坏的评价」。所以题目问「影响大小」答足迹；问「是否超载」要拿足迹和<b>生态承载力</b>比，两个量比出来才叫赤字。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 全球现状与出路<span class="q-src">人教版（2019）选择性必修2 · 第4章第1节</span></p>
<p class="q-b">全球生态足迹已超过地球的生态承载力，需要走可持续发展道路。</p>
<p class="q-n">→ 翻成人话：这句话有三个条件：①比较的对象是<b>全球</b>；②比较的结果是<b>足迹 &gt; 承载力</b>；③结论是「走可持续发展道路」。注意结论<b>不是</b>「停止发展」——可持续发展是发展不越过承载力，不是不发展。</p>
</div>

<div style="overflow-x:auto">

<tbody>
<tr><td>是什么</td><td>维持生存所需的资源与吸纳废物折算的面积</td><td>一定区域内能持续提供的生物生产性面积</td><td>足迹超出承载力的那部分差额</td></tr>

<tr><td>能不能单独下结论</td><td>只能说明影响大小</td><td>只能说明可支撑的限度</td><td>必须两者相减或相除才得到</td></tr>
<tr class="key"><td>判据（只记这一行）</td><td>足迹 = 需求侧的面积</td><td>承载力 = 供给侧的面积</td><td>足迹 &gt; 承载力 → 赤字；足迹 &lt; 承载力 → 盈余</td></tr>

<p class="er-w">错在哪：把「面积」写成「排放量」。足迹的单位是面积（全球公顷），排放量只是被折算的原料之一。</p>

<p class="er-w">错在哪：判据方向反了。赤字永远对应「需求 &gt; 供给」。</p>
</div>
<div class="er">
<p class="er-x">✗ 可持续发展就是为了保护环境而停止发展。</p>
<p class="er-v">✓ 可持续发展是既满足当代人的需求，又不危及后代人满足其需求的能力的发展。</p>
<p class="er-w">错在哪：<b>可持续发展不是停止发展</b>，约束的是「不越过承载力」，不是「不发展」。</p>
</div>
<div class="er">
<p class="er-x">✗ 生态承载力是固定不变的常数，全球就是 1.7。</p>
<p class="er-v">✓ 生态承载力会随土地状况、技术水平、投入和气候变化；1.7 只是本节用于比较的全球人均参照值。</p>
<p class="er-w">错在哪：把口径当常数。换区域、换年份，参照值要换。</p>
</div>
<div class="er">
<p class="er-x">✗ 只有工业排放的 CO₂ 才计入生态足迹。</p>
<p class="er-v">✓ 生态足迹包括耕地、牧地、林地、建设用地和碳足迹五类，碳足迹只是其中一项。</p>
<p class="er-w">错在哪：漏掉四类资源型面积，也把「碳足迹」当成全部。</p>
</div>
<div class="er">

<p class="er-v">✓ 生态赤字可通过贸易与资源输入转嫁，全球尺度上超载是共同的；全球足迹已超过承载力。</p>
<p class="er-w">错在哪：忽略贸易转移与全球性。全球比较的结论才落到「走可持续发展道路」。</p>
</div>
<div class="er">
<p class="er-x">✗ 生态足迹越大说明经济越发达，所以越大越好。</p>
<p class="er-v">✓ 生态足迹越大，对生态环境的影响越大；超过承载力即生态赤字。</p>
<p class="er-w">错在哪：把「影响大小」当成「发展好坏」。足迹是度量，不是评价。</p>
