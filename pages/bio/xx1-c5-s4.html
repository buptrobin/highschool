<p class="gx-lede">前几节讲的是植物「身体里」的激素怎么调生长，这一节把视角搬到「身体外」：光、温度、重力怎样把环境信息送进植物体内。最容易被扣分的一件事——把光只当成光合作用的能量，忘了光还是决定「开不开花」的信号；把长日照植物说成「光照越久越好」。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 环境因素与植物生命活动<span class="q-src">人教版（2019）选择性必修1 · 第5章第4节</span></p>
<p class="q-b">光、温度、重力等环境因素参与调节植物的生命活动。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个条件</b>组成——①有光（强度和时长）②有温度（尤其低温）③有重力方向。少一个，植物就少一条「知道外界在发生什么」的通道；三者都是<b>信号</b>，不是营养。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 光的两层作用<span class="q-src">人教版（2019）选择性必修1 · 第5章第4节</span></p>
<p class="q-b">光不仅为植物提供能量，还作为一种信号影响种子的萌发、植株的生长与开花。</p>
<p class="q-n">→ 翻成人话：<b>两层作用都要写</b>。第一层是能量：光合作用把光能变成有机物里的化学能；第二层是信号：植物用光敏色素「量」日照长短，再决定萌发、生长和开花。只写能量，这问必扣分。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 日照长度与开花<span class="q-src">人教版（2019）选择性必修1 · 第5章第4节</span></p>
<p class="q-b">植物的开花与日照长度有关：长日照植物需要较长日照才开花，短日照植物需要较短日照才开花。</p>
<p class="q-n">→ 翻成人话：所谓「长日照」，准确说法是<b>日照长于临界日长才开花</b>，不是「光照时间越长越好」；短日照植物则要日照短于临界日长。判据是跟临界日长比大小（<span class="gx-fml">开花 ⇔ h &gt; 临界日长</span>），比的是「长/短」，不是「多/少」。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>长日照植物</th><th>短日照植物</th></tr></thead>
<tbody>
<tr><td>代表植物</td><td>菠菜、拟南芥、冬小麦</td><td>菊花、大豆、烟草</td></tr>
<tr class="key"><td>真正的区别（判据）</td><td>日照 <b>长于</b>临界日长才开花</td><td>日照 <b>短于</b>临界日长才开花</td></tr>
<tr><td>临界日长为 12 h、日照 14 h 时</td><td>开花</td><td>不开花</td></tr>
<tr><td>常见错说法</td><td>「光照越久越好」</td><td>「不需要光、越黑越好」</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只高亮 1 行。背法：先找「临界日长」这个数，再看实际日照落在它哪一边——落在长边，长日照植物开；落在短边，短日照植物开。植物「量」日照靠的是光敏色素，不是光合作用的强弱。</p>
</section>

<p class="ex-t">例题 · 光信号与开花的原因分析<span class="bdg bdg-must">必考</span></p>

<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性</p>
<p class="s-b">圈出三个数：短日照植物、临界日长 13 h、实际日照 15 h。这是「拿实际日照跟临界日长比大小」的题，不是算光合速率的题。</p>
<p class="s-k">用到：临界日长的含义。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 比大小</p>
<p class="s-b">15 h &gt; 13 h，日照<b>长于</b>临界日长。短日照植物要日照<b>短于</b>临界日长才开花，信号条件不满足，所以不开花。</p>
<p class="s-k">用到：短日照植物 = 日照短于临界日长才开花。</p>
</li>
<li class="step" hidden>

<p class="s-b">题干说「其他条件均适宜」，15 h 日照下光合作用照常进行，有机物不缺。所以不开花不是能量问题，而是信号问题——这一步是本题的分水岭。</p>
<p class="s-k">用到：光的两层作用（能量 / 信号）。</p>
</li>
<li class="step" hidden>

<p class="s-b">既然能量层正常、开花却没发生，说明光在这里起的是信号作用：日照长度作为信息被感受（光敏色素），再改变基因表达，决定开不开花。</p>
<p class="s-k">用到：光既是能量也是信号。</p>
</li>
<li class="step" hidden>

<p class="s-b">两问分开写：第（1）问按「判据 → 不满足 → 结论」三步；第（2）问写两层作用，先能量、后信号，别只写一层。</p>

</li>

<div class="er">
<p class="er-x">✗ 光只为植物提供能量，进行光合作用。</p>

<p class="er-w">错在哪：漏了信号这一层；「光既是能量也是信号」两层都要写。</p>
</div>
<div class="er">

<p class="er-w">错在哪：把两类植物的条件记反了；先比大小，再判开花。</p>
</div>
<div class="er">
<p class="er-x">✗ 温度对植物的影响只是改变酶的活性。</p>
<p class="er-v">✓ 温度还通过春化作用影响开花，低温可诱导开花相关基因表达。</p>
<p class="er-w">错在哪：只知道温度影响代谢，漏了温度作为信号通过春化作用影响开花。</p>

<div class="er">

<p class="er-w">错在哪：重力是信号，靠改变生长素分布实现，不是机械压迫。</p>
</div>
<div class="er">
<p class="er-x">✗ 植物的开花只由激素决定。</p>
<p class="er-v">✓ 开花还受光照（日照长度）、温度（春化）等环境因素调节。</p>
<p class="er-w">错在哪：把「内部激素」和「外部环境信号」对立起来，漏掉环境因素这一半。</p>
</div>
<div class="er">
<p class="er-x">✗ 临界日长是一个固定不变的数值，所有植物都一样。</p>
