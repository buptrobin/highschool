<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 元素种类<span class="q-src">人教版（2019）必修1 · 第2章第1节</span></p>
<p class="q-b">组成细胞的化学元素，常见的有 20 多种。</p>
<p class="q-n">→ 翻成人话：这句由<b>两个限定</b>组成。①「组成细胞的」——只统计细胞里能检出的元素，不是自然界全部元素；②「常见」——20 多种指的是考试和教材列出的那一批，不是精确总数。少一个限定，就会写出「细胞中只含 20 多种元素」这种错句。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 含量最多的化合物<span class="q-src">人教版（2019）必修1 · 第2章第1节</span></p>
<p class="q-b">细胞中含量最多的化合物是水；含量最多的有机化合物是蛋白质。</p>
<p class="q-n">→ 翻成人话：这里有<b>两个不同的范围</b>，必须分开背。全部化合物里排第一的是水（85–90%）；把水这类无机物排除、只看有机物，排第一的才是蛋白质（7–10%）。题干删掉「有机」两个字，答案就从蛋白质变成水——这是本节最高频的偷换。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 最基本元素<span class="q-src">人教版（2019）必修1 · 第2章第1节</span></p>
<p class="q-b">C 是构成细胞的最基本元素，生物大分子以碳链为骨架。</p>
<p class="q-n">→ 翻成人话：这句话说的是<b>地位</b>，不是<b>含量</b>。C 能连成链、链再连成糖类/脂质/蛋白质/核酸这些大分子，所以叫「最基本」；而它在鲜重里只占约 18%，烘干后才升到 48.4% 排第一。凡是「最基本元素就是含量最多的元素」的推理，都把两个维度混成了一个。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>鲜重（新鲜材料）</th><th>干重（烘干后）</th></tr></thead>
<tbody>
<tr><td>含量第一的元素</td><td>O（约 65%）</td><td>C（约 48.4%）</td></tr>
<tr class="key"><td>为什么换人</td><td>水占 85–90%，水里的 O 把总量顶上去</td><td>水被烘走，剩下的主要是碳骨架</td></tr>
<tr><td>含量第二的元素</td><td>C（约 18%）</td><td>O（约 23.7%）</td></tr>
<tr><td>含量最多的化合物</td><td>水</td><td>蛋白质</td></tr>
<tr><td>含量最多的有机化合物</td><td>蛋白质</td><td>蛋白质</td></tr>

</tbody>

<p class="gx-note">整张表只高亮 1 行：换人的原因只有一句话——烘干只带走水，元素本身一个都没少。做题前先在题干里圈出「鲜重 / 干重」，圈错这个词，后面全错。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 元素与化合物含量<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">某小组把同一份人体细胞样本分成两份：一份直接测定（鲜重），一份在 105 ℃ 下烘至恒重后测定（干重）。结果：鲜重中 O 65%、C 18%、H 10%、N 3%；干重中 C 48.4%、O 23.7%、N 12.4%、H 6.6%。请回答：<br>（1）该细胞干重中含量最多的元素是____，含量最多的化合物是____。<br>（2）该细胞鲜重中含量最多的元素是____，含量最多的化合物是____。<br>（3）同一份样本，为什么干重和鲜重的「含量第一」不是同一个元素？<br>（4）该细胞中最基本的元素是____，判断依据是____。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题：先圈出「鲜重 / 干重」</p>
<p class="s-b">题干给了两组数据，四个小问分别问「干重」和「鲜重」。先在题干上把这两个词圈出来，再决定看哪一行。第（1）问只看干重那一行：C 48.4% 最大。</p>
<p class="s-k">用到：同一份材料，称量方式不同，百分比的分母就不同。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 干重：水被烘走，看碳骨架</p>
<p class="s-b">干重里水基本为 0，剩下的主要是蛋白质、脂质、糖类、核酸这些以碳链为骨架的有机物，所以 C 占 48.4% 排第一。干重中含量最多的化合物不是水，而是蛋白质。</p>
<p class="s-k">用到：干重的「干」= 除去自由水，不是把元素也除去。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 鲜重：水占八成多，看 O</p>
<p class="s-b">鲜重里水占 85–90%，而水中 O 的质量分数约 89%，所以 O 被水顶到 65% 排第一，C 只有 18%。鲜重中含量最多的化合物是水——注意这里问的是「化合物」，不是「有机化合物」。</p>
<p class="s-k">用到：O 在鲜重第一，靠的是水；C 在干重第一，靠的是有机物。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 追问：最基本元素另算一套</p>
<p class="s-b">第（4）问与含量无关。C 能形成四个共价键、连成碳链，糖类、脂质、蛋白质、核酸都以碳链为骨架，所以 C 是构成细胞的最基本元素——即使它在鲜重里只排第二，也不影响这个结论。</p>
<p class="s-k">用到：最基本元素看「骨架」，含量第一看「百分比」，两个判据不能互相推出。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 4</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）C（48.4%）；蛋白质。<br>（2）O（65%）；水。<br>（3）鲜重中水占 85–90%，水中 O 的质量分数高，故 O 的含量居第一；烘干后水被除去，剩余物质以碳链为骨架的有机物为主，故 C 的含量（48.4%）居第一。元素的种类没有改变，改变的是计算百分比时所用总质量（分母）。<br>（4）C；生物大分子以碳链为骨架（C 能连成链，是构成有机物骨架的元素）。</p>

<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「最基本元素和含量最多的元素，到底各是谁？」</p>
<p class="a">最基本元素是 <b>C</b>（生物大分子以碳链为骨架）；含量最多的元素要分口径：<b>鲜重是 O（约 65%），干重是 C（约 48.4%）</b>。「最基本」看骨架，「含量最多」看百分比，两套判据不能互相推。</p>

<div class="qac">
<p class="q">「干重里为什么没有水？水去哪儿了？」</p>
<p class="a">干重是把材料<b>烘至恒重</b>后称的质量：自由水先蒸发，结合水在 105 ℃ 左右也基本被除去。所以干重不是「绝对 0 水」，而是<b>水少到可以忽略</b>；剩下的干物质是有机物和无机盐。</p>

<text x="120" y="70" font-size="14" fill="#6b7280" text-anchor="middle">→</text>
<rect x="132" y="34" width="86" height="60" rx="6" fill="#f1f3f5" stroke="#d3d9df"/>
<text x="175" y="54" font-size="8.6" fill="#5a6472" text-anchor="middle">干重</text>
<text x="175" y="76" font-size="9" font-weight="700" fill="#5a6472" text-anchor="middle">水 ≈ 0</text>
<text x="120" y="112" font-size="8.6" fill="#6b7280" text-anchor="middle">105 ℃ 烘至恒重</text>

<div class="qac">
<p class="q">「微量元素含量那么少，是不是不重要？」</p>
<p class="a"><b>不是。含量少 ≠ 作用小。</b>Fe 是血红蛋白的成分，缺 Fe 会贫血；Mn、Zn、Cu、B、Mo 多是酶的组成成分或激活剂，缺了会直接影响代谢。微量元素是<b>必需</b>的，只是需要量小。</p>

<p class="a">斐林试剂与还原糖反应生成<b>砖红色氧化亚铜沉淀</b>，这个反应需要在 <b>50–65 ℃ 水浴</b>中才能较快进行。直接加、不加热，短时间内看不到砖红色，实验者就会误判成「没有还原糖」。</p>

<p class="q">「双缩脲试剂为什么要先加 A 液、再加 B 液？」</p>
<p class="a">A 液是 NaOH 溶液，先加是为了<b>造碱性环境</b>；B 液是 CuSO₄ 溶液，后加提供 Cu²⁺，Cu²⁺ 在碱性条件下与肽键形成<b>紫色络合物</b>。顺序反了会先生成 Cu(OH)₂ 沉淀，干扰观察。整个过程<b>不需要加热</b>。</p>

<p class="q">「组成细胞的元素在无机自然界都能找到，说明什么？」</p>
<p class="a">说明<b>生物界与非生物界具有统一性</b>：没有一种元素是细胞特有的。但同一元素在两边的<b>含量差别很大</b>（差异性），说明细胞对元素的吸收是有选择的。答题要写「统一性 + 差异性」两条，只写一条会被扣分。</p>
