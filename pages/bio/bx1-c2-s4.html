<p class="gx-lede">上一节讲糖类和脂质，这一节讲细胞内含量最多的有机物——蛋白质。它在整章里的位置是「结构与功能」的中枢：后面讲酶（绝大多数是蛋白质）、载体、抗体、细胞膜的结构，都要回到这里。最容易错的一件事：把<b>「肽键数 = 氨基酸数」</b>背成了公式，忘了减去肽链数；以及算相对分子质量时<b>只乘 128、不减水</b>。这两处一错，蛋白质的计算题几乎全错。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 氨基酸<span class="q-src">人教版（2019）必修1 · 第2章第4节</span></p>
<p class="q-b">氨基酸是组成蛋白质的基本单位；每种氨基酸分子至少都含有一个氨基和一个羧基，并且都有一个氨基和一个羧基连接在同一个碳原子上。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个条件</b>组成。①「至少」一个氨基、一个羧基——R 基上可能还有，不能数成「只有一个」；② 这两个基团必须连在<b>同一个碳原子</b>上，这个碳叫中心碳原子；③ 同时满足前两条的才是组成蛋白质的氨基酸，R 基不同就是不同的氨基酸。少写「同一个碳原子」，氨基酸通式题就画错。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 脱水缩合<span class="q-src">人教版（2019）必修1 · 第2章第4节</span></p>
<p class="q-b">氨基酸分子之间通过脱水缩合形成肽键（—CO—NH—）。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个条件</b>组成。① 反应发生在相邻氨基酸的氨基和羧基之间；② 脱去一分子水（—OH 来自羧基，—H 来自氨基）；③ 剩下的部分连成肽键 —CO—NH—。一条链上 n 个氨基酸只连 n−1 次，所以<b>肽键数 = n − m</b>（m 为肽链数）。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 结构多样与功能<span class="q-src">人教版（2019）必修1 · 第2章第4节</span></p>
<p class="q-b">蛋白质的结构多种多样，与氨基酸的种类、数目、排列顺序以及肽链的空间结构有关；蛋白质是生命活动的主要承担者。</p>
<p class="q-n">→ 翻成人话：这句话由<b>两个条件</b>组成。① 结构多样有四个来源：氨基酸的<b>种类、数目、排列顺序</b>，以及<b>肽链的空间结构</b>——前三个在氨基酸层面，第四个在肽链层面；② 结构多样决定功能多样，「主要承担者」不是说蛋白质只干一件事，而是催化、运输、免疫、调节、结构都靠它。答题时四个来源要写全，缺一个就漏点。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>一条肽链（m=1）</th><th>两条肽链（m=2）</th><th>环状肽</th></tr></thead>
<tbody>
<tr class="key"><td>肽键数</td><td>n − 1</td><td>n − 2</td><td>n</td></tr>
<tr><td>脱去水分子数</td><td>n − 1</td><td>n − 2</td><td>n</td></tr>
<tr><td>游离氨基 / 羧基（至少）</td><td>各 1 个</td><td>各 2 个</td><td>各 0 个</td></tr>
<tr><td>n = 10 时肽键数</td><td>9</td><td>8</td><td>10</td></tr>
<tr><td>相对分子质量（平均 128）</td><td>128n − 18(n−1)</td><td>128n − 18(n−2)</td><td>128n − 18n</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只高亮一行：<b>肽键数</b>。背法——把每条肽链想成一根有头有尾的线：m 条链就有 m 个「链端缺口」，所以比 n 少 m 个肽键。环状肽首尾也连上，没有链端，肽键数才等于 n。相对分子质量永远是先算 128n，再减 18×脱水数。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 肽键数、脱水数与相对分子质量<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">某蛋白质由 2 条肽链组成，共 100 个氨基酸，氨基酸的平均相对分子质量为 128。求：(1) 该蛋白质分子中的肽键数；(2) 形成该蛋白质时脱去的水分子数；(3) 该蛋白质的相对分子质量。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题，先把三个量摆出来</p>
<p class="s-b">n = 100（氨基酸数），m = 2（肽链数），平均相对分子质量 128。题目问的是「肽键数、脱水数、蛋白质相对分子质量」，不是氨基酸数。先把两条公式写在草稿上：肽键数 = n − m；相对分子质量 = 128n − 18×脱水数。</p>
<p class="s-k">用到：n、m 的定义；一条肽链的肽键数 = n − 1。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 算肽键数</p>
<p class="s-b">n 个氨基酸连成 m 条链，要连的次数比 n 少 m 次，所以肽键数 = 100 − 2 = 98。这里的「2」不是 2 个肽键，而是 2 条链各留下一个链端缺口。</p>
<p class="s-k">用到：肽键数 = 氨基酸数 − 肽链数。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 算脱水数</p>
<p class="s-b">每形成一个肽键就脱去一分子水，所以脱水数 = 肽键数 = 98。不是 100：肽链两端的氨基和羧基没有参与缩合。</p>
<p class="s-k">用到：脱水数 = 肽键数 = n − m。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 算相对分子质量</p>
<p class="s-b">先假设 100 个氨基酸都没脱水：128 × 100 = 12800；再减掉 98 分子水：18 × 98 = 1764；12800 − 1764 = 11036。</p>
<p class="s-k">用到：相对分子质量 = 128n − 18(n − m)，减水这一步不能漏。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 回头检查，顺带防一个坑</p>
<p class="s-b">98 个肽键、98 分子水、11036，三个数互相对得上。再看链端：2 条链，每条链一端 1 个游离氨基、另一端 1 个游离羧基，所以至少各 2 个；R 基上如果还有，就更多。题目若问「至少」，答 2，不是 100。</p>
<p class="s-k">用到：游离氨基 / 羧基至少 = 肽链数（R 基上的另计）。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">① 肽键数 = 100 − 2 = <b>98 个</b>；② 脱去水分子数 = 肽键数 = <b>98 个</b>；③ 相对分子质量 = 128×100 − 18×98 = 12800 − 1764 = <b>11036</b>。另：该蛋白质至少含 <b>2 个游离氨基、2 个游离羧基</b>（每条肽链各 1 个，R 基上的未计入）。</p>

<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「肽键数到底怎么算？」</p>
<p class="a">肽键数 = 氨基酸数 − 肽链数 = n − m。一条链 n−1，两条链 n−2；<b>环状肽没有链端，肽键数 = n</b>。脱水数永远等于肽键数。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="三个氨基酸连成一条链，形成两个肽键，说明肽键数等于氨基酸数减肽链数">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<circle cx="60" cy="58" r="9" fill="#dff2e8" stroke="#2f8a5b" stroke-width="1.4"/>
<circle cx="110" cy="58" r="9" fill="#dff2e8" stroke="#2f8a5b" stroke-width="1.4"/>
<circle cx="160" cy="58" r="9" fill="#dff2e8" stroke="#2f8a5b" stroke-width="1.4"/>
<line x1="69" y1="58" x2="101" y2="58" stroke="#9cc9b3" stroke-width="2"/>
<line x1="119" y1="58" x2="151" y2="58" stroke="#9cc9b3" stroke-width="2"/>
<text class="ms" x="120" y="98" text-anchor="middle" style="fill:#2f8a5b">3 个氨基酸 → 2 个肽键 = n − m</text>
</svg>
</div>

<div class="qac">
<p class="q">「两条链为什么比一条链少一个肽键？」</p>
<p class="a">n 个氨基酸连成一条链要连 n−1 次；分成两条链，每条链各留一个链端不连，合起来少连 1 次，所以是 n−2。<b>每多一条链，就多一个链端缺口</b>。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="10个氨基酸一条链有9个肽键，两条链有8个肽键">

<text class="ms" x="120" y="92" text-anchor="middle">m = 2 → 肽键 8 个</text>
<text class="ms" x="120" y="114" text-anchor="middle" style="fill:#b8791f">每多一条链，少 1 个</text>
</svg>
</div>

<div class="qac">
<p class="q">「脱水缩合脱的是哪一部分？」</p>
<p class="a">羧基脱 —OH、氨基脱 —H，合起来是一分子 H₂O；剩下的部分连成 <b>—CO—NH—</b>。水里的两个 H 分别来自氨基和羟基，不是都来自氨基。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="羧基脱羟基、氨基脱氢，脱去一分子水后形成肽键">

<text class="ms" x="16" y="68" style="fill:#151a21">氨基 H₂N— 脱 —H</text>
<text class="ms" x="16" y="96" style="fill:#b8402f">合起来脱去 1 分子 H₂O</text>
<text class="ms" x="16" y="116" style="fill:#2f8a5b">剩下 —CO—NH—（肽键）</text>
</svg>
</div>

<div class="qac">
<p class="q">「组成蛋白质的氨基酸是 21 种还是 20 种？」</p>
<p class="a">按人教版（2019）新教材写<b>约 21 种</b>；旧题里的 20 种是旧版说法。<b>答题以教材为准</b>，遇到旧题可注明这个差异。</p>

<p class="a">没有。<b>变性破坏的是空间结构</b>，肽键仍然存在；所以变性后的蛋白质仍能与双缩脲试剂发生紫色反应，但失去原有活性。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="蛋白质变性只破坏空间结构，肽键没有断裂">

<p class="a">因为结构多样：氨基酸的<b>种类、数目、排列顺序</b>和<b>肽链的空间结构</b>四个来源都可能不同；结构不同，功能就不同，于是有催化、运输、免疫、调节、结构等分工。</p>

<p class="gx-note">这六问是一条线：n 个氨基酸 → 脱水缩合连成 m 条链 → 肽键数和分子量按 n−m 算 → 结构多样决定功能多样。计算题错，多半错在「少减 m」或「少减水」。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 肽键数 = 氨基酸数。</p>
<p class="er-v">✓ 肽键数 = 氨基酸数 − 肽链数 = n − m。</p>
<p class="er-w">错在哪：n 个氨基酸连成 1 条链只形成 n−1 个肽键；m 条链少 m 个。环状肽例外，等于 n。</p>
</div>
<div class="er">
<p class="er-x">✗ 蛋白质相对分子质量 = 128n。</p>
<p class="er-v">✓ 相对分子质量 = 128n − 18(n − m)。</p>
<p class="er-w">错在哪：每形成一个肽键脱去 1 分子水，必须减 18×脱水数；只乘 128 是把「未脱水」的假设当成了答案。</p>
</div>
<div class="er">
<p class="er-x">✗ 蛋白质变性就是肽键断裂。</p>
<p class="er-v">✓ 变性是空间结构被破坏，肽键没有断。</p>
<p class="er-w">错在哪：肽键很稳定，加热、强酸强碱破坏的是空间结构；变性后仍能与双缩脲试剂发生紫色反应。</p>
</div>
<div class="er">
<p class="er-x">✗ 组成蛋白质的氨基酸有 20 种。</p>
<p class="er-v">✓ 新教材：约 21 种；旧题里的 20 种是旧版说法。</p>
<p class="er-w">错在哪：按教材答 21；遇到旧题可注明差异，不能把旧版的 20 当成新教材的结论。</p>
</div>
<div class="er">
<p class="er-x">✗ 氨基酸的种类由 R 基以外的部分决定。</p>
<p class="er-v">✓ 氨基酸的种类由 R 基决定。</p>
<p class="er-w">错在哪：通式部分（氨基、羧基、氢、中心碳）都一样，R 基不同才是不同的氨基酸。</p>
</div>
<div class="er">
<p class="er-x">✗ 一条肽链至少含 2 个游离氨基和 2 个游离羧基。</p>
<p class="er-v">✓ 一条肽链至少各 1 个；m 条链至少各 m 个。</p>
<p class="er-w">错在哪：链的两端各 1 个——一端是游离氨基，另一端是游离羧基，不是各 2 个；R 基上的另计。</p>
</div>
<div class="er">
<p class="er-x">✗ n 个氨基酸形成 m 条肽链，脱去 n 分子水。</p>
<p class="er-v">✓ 脱去 n − m 分子水。</p>
<p class="er-w">错在哪：脱水数 = 肽键数 = n−m；只有环状肽没有链端，脱水数才等于 n。</p>
</div>

<script>
/* 互动脚本本体（由 build-page.mjs 包进 <script> 里，所以这里不要写 <script> 标签） */
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var GX = window.GX, el = GX.el, tx = GX.tx, $ = GX.$;
  var stage = $("gxStage");
  if (!stage || !window.AutoPilot) return;

  /* 两套坐标：宽屏 880×470，窄屏独立 360×700 */
  var LAY_W = { vb: "0 0 880 470", left: { x: 16, y: 16, w: 424, h: 438 }, right: { x: 456, y: 16, w: 408, h: 438 } };
  var LAY_N = { vb: "0 0 360 700", left: { x: 8, y: 8, w: 344, h: 300 }, right: { x: 8, y: 320, w: 344, h: 372 } };
  var L = LAY_W;

  var nAA = 10;      /* 氨基酸数 n：2–30 */
  var mChain = 1;    /* 肽链数 m：1/2/3，且 m ≤ n */

  /* 纯函数：参数 → 数值。render() 和 __bio.cases 都用它 */
  function calc(n, m) {
    m = m || 1;
    var bond = n - m;                 /* 肽键数 */
    var water = n - m;                /* 脱去水分子数 */
    var mw = 128 * n - 18 * (n - m);  /* 平均相对分子质量按 128 计 */
    return { bond: bond, water: water, mw: mw };
  }

  /* 中文按字数换行，避免长句冲出面板 */
  function wrap(parent, x, y, s, maxW, fs, col, lh) {
    var per = Math.max(6, Math.floor(maxW / fs)), lines = [], cur = "";
    for (var i = 0; i < s.length; i++) { cur += s.charAt(i); if (cur.length >= per) { lines.push(cur); cur = ""; } }
    if (cur) lines.push(cur);
    for (var k = 0; k < lines.length; k++) tx(parent, x, y + k * lh, lines[k], col, "start", fs, 400);
  }

  /* 左栏：把 n 个氨基酸画成 m 条链，每条链标出「几个氨基酸 → 几个肽键」 */
  function drawChains(g, box, n, m) {
    tx(g, box.x + 20, box.y + 30, "肽链：n 个氨基酸连成 m 条链", "#5a6472", "start", 10.5, 700);
    tx(g, box.x + 20, box.y + 48, "n = " + n + " · m = " + m + " · 每条链 = 一串圆点", "#0f8a5f", "start", 9.4, 600);

    var pad = 16;
    var top = box.y + 64;
    var bottom = box.y + box.h - 34;
    var laneH = (bottom - top) / m;
    var base = Math.floor(n / m), rem = n % m;
    var maxLen = base + (rem ? 1 : 0);
    var avail = box.w - pad * 2;
    var step = Math.min(24, avail / Math.max(1, maxLen));
    var r = Math.min(8, Math.max(3.2, step * 0.36));

    for (var i = 0; i < m; i++) {
      var len = base + (i < rem ? 1 : 0);
      var cy = top + laneH * (i + 0.5);
      var x0 = box.x + pad + (avail - (len - 1) * step) / 2;
      tx(g, box.x + pad, cy - r - 12,
        "链 " + (i + 1) + " · " + len + " 个氨基酸 · 肽键 " + Math.max(0, len - 1),
        "#5a6472", "start", 9.2, 600);
      for (var j = 0; j < len - 1; j++) {
        el("line", { x1: x0 + j * step, y1: cy, x2: x0 + (j + 1) * step, y2: cy, stroke: "#9cc9b3", "stroke-width": 2.2 }, g);
      }
      for (j = 0; j < len; j++) {
        el("circle", {
          cx: x0 + j * step, cy: cy, r: r,
          fill: i === 0 ? "#dff2e8" : "#e6f6ee", stroke: "#2f8a5b", "stroke-width": 1.2
        }, g);
      }
    }
    tx(g, box.x + pad, box.y + box.h - 14, "每条链两端：1 个游离 —NH₂ + 1 个游离 —COOH", "#5a6472", "start", 9, 400);
  }

  /* 右栏：同一 n 下，m=1/2/3 的对照 + 两条公式 */
  function drawLedger(g, box, n, m) {
    tx(g, box.x + 20, box.y + 30, "同一 n，换 m 会怎样", "#5a6472", "start", 10.5, 700);
    tx(g, box.x + 20, box.y + 48, "n = " + n + " · 环状肽不在本模型内", "#3a3a35", "start", 9, 400);

    var rowTop = box.y + 60, rowH = 58;
    var names = ["", "一条", "两条", "三条"];
    for (var k = 1; k <= 3; k++) {
      if (k > n) continue;
      var ry = rowTop + (k - 1) * rowH;
      var on = k === m;
      el("rect", {
        x: box.x + 14, y: ry, width: box.w - 28, height: 50, rx: 8,
        fill: on ? "#e6f6ee" : "#ffffff", stroke: on ? "#7cc9a4" : "#e6e9ee"
      }, g);
      var s = calc(n, k);
      tx(g, box.x + 26, ry + 20, "m = " + k + " · " + names[k] + "肽链", on ? "#1e6640" : "#3a3a35", "start", 9.6, 700);
      tx(g, box.x + box.w - 26, ry + 20, "肽键 " + s.bond, on ? "#1e6640" : "#3a3a35", "end", 10, 700);
      tx(g, box.x + 26, ry + 38, "脱水 " + s.water + " · 相对分子质量 " + s.mw, "#5a6472", "start", 9, 400);
    }

    var fy = rowTop + 3 * rowH + 6;
    el("rect", { x: box.x + 14, y: fy, width: box.w - 28, height: 86, rx: 8, fill: "#ffffff", stroke: "#e6e9ee" }, g);
    tx(g, box.x + 26, fy + 20, "公式（先写这两行）", "#8a5c14", "start", 9.4, 700);
    tx(g, box.x + 26, fy + 40, "肽键数 = 脱水数 = n − m", "#151a21", "start", 9.8, 600);
    tx(g, box.x + 26, fy + 58, "相对分子质量 = 128n − 18(n − m)", "#151a21", "start", 9.8, 600);
    tx(g, box.x + 26, fy + 76, "128 = 平均氨基酸相对分子质量", "#5a6472", "start", 8.8, 400);

    tx(g, box.x + 20, fy + 106, "每多一条链：肽键 −1、脱水 −1、分子量 +18。", "#3a3a35", "start", 9, 600);
    tx(g, box.x + 20, fy + 124, "环状肽：没有链端，肽键数 = n。", "#5a6472", "start", 9, 400);
  }

  function draw() {
    var gA = $("gxA"), gB = $("gxB");
    gA.textContent = ""; gB.textContent = "";
    el("rect", { x: L.left.x, y: L.left.y, width: L.left.w, height: L.left.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    el("rect", { x: L.right.x, y: L.right.y, width: L.right.w, height: L.right.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    drawChains(gA, L.left, nAA, mChain);
    drawLedger(gB, L.right, nAA, mChain);
  }

  var btns = [$("gxM1"), $("gxM2"), $("gxM3")];
  function syncBtns() {
    for (var i = 0; i < btns.length; i++) {
      var b = btns[i];
      if (!b) continue;
      var m = +b.getAttribute("data-m");
      var on = m === mChain, dis = m > nAA;
      b.disabled = dis;
      b.style.opacity = dis ? "0.4" : "1";
      b.style.cursor = dis ? "not-allowed" : "pointer";
      b.style.background = on ? "#e6f6ee" : "#f4f7f9";
      b.style.borderColor = on ? "#7cc9a4" : "#dde2e8";
      b.style.color = on ? "#1e6640" : "#151a21";
    }
  }

  function render() {
    if (mChain > nAA) mChain = nAA;   /* n < m 的组合不存在，自动回落到有效链数 */
    var s = calc(nAA, mChain), st, col, bg, sn;
    $("gxVa").textContent = String(nAA);
    $("gxVb").textContent = s.bond + " / " + s.water;
    $("gxVc").textContent = String(s.mw);

    if (mChain === 1) {
      st = "一条肽链"; col = "#2f8a5b"; bg = "#e6f6ee"; sn = "肽键 = n − 1";
    } else if (mChain === 2) {
      st = "两条肽链"; col = "#b8791f"; bg = "#fdf3e0"; sn = "比 m=1 少 1 个肽键";
    } else {
      st = "三条肽链"; col = "#b8791f"; bg = "#fdf3e0"; sn = "链越多，肽键越少、分子量越大";
    }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;

    syncBtns();
    draw();
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? LAY_W : LAY_N;
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  /* 点「1/2/3 条链」：真的改 m，立即重算，并接管自动演示 */
  for (var bi = 0; bi < btns.length; bi++) {
    (function (b) {
      if (!b) return;
      b.addEventListener("click", function () {
        var m = +b.getAttribute("data-m");
        if (m > nAA) return;
        mChain = m;
        if (window.__ap) window.__ap.take();
        render();
      });
    })(btns[bi]);
  }

  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 4 }, { t: 3, v: 10 }, { t: 6, v: 10 }, { t: 9, v: 20 }, { t: 12, v: 10 }],
    keys: [4, 10, 20],
    value: 4, min: 2, max: 30, step: 1,
    idle: 5000,
    onChange: function (v) { nAA = Math.round(v); render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__bio = { calc: calc, cases: [
    { v: 10, eq: { bond: 9, water: 9, mw: 1118 } },
    { v: 20, eq: { bond: 19, water: 19, mw: 2218 } },
    { v: 30, eq: { bond: 29, water: 29, mw: 3318 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
