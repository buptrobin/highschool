<p class="gx-claim">一句话说清本节最该记住的判断：<b>格里菲思只发现「转化因子」</b>，<b>艾弗里证明转化因子是 DNA</b>，<b>噬菌体实验证明 DNA 在亲子代间有连续性</b>——所以 DNA 是「主要」的遗传物质，<b>不是唯一</b>。</p>
<div class="gx-meta">
<span><i></i>人教版（2019）必修2 第3章第1节</span>
<span><i></i>高一 · 基因的本质</span>
<span><i></i>阅读 14 分钟</span>
<span><i></i>含 1 个互动模型</span>
</div>
<p class="gx-lede">这一节是「基因的本质」的开篇：先要回答「到底什么东西在亲子代之间传下去」。三个实验是递进的——格里菲思只知道「有东西」，艾弗里把「东西」提纯到 DNA，赫尔希和蔡斯再换一种材料，把 DNA 和蛋白质彻底分开追踪。最容易错的一处是结论的力度：噬菌体实验只证明「DNA 是遗传物质」，<b>没有</b>证明「蛋白质不是遗传物质」；本节标题里的「主要」二字也不是随手加的。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 肺炎链球菌的转化实验<span class="q-src">人教版（2019）必修2 · 第3章第1节</span></p>
<p class="q-b">格里菲思的肺炎链球菌体内转化实验说明，加热杀死的 S 型细菌中含有某种促使 R 型细菌转化为 S 型细菌的「转化因子」。</p>
<p class="q-n">→ 翻成人话：这句话只说「<b>有某种物质</b>」，由三个条件组成：① 加热杀死 S 型细菌后它仍能起作用（说明不是活菌在干活）；② R 型细菌变成了 S 型，而且<b>这种变化能遗传</b>给后代；③ 但格里菲思<b>不知道</b>这种物质是什么、是不是 DNA。少掉第③点，就会把「转化因子」直接写成「DNA」——这正是本节第一个扣分点。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 艾弗里的体外转化实验<span class="q-src">人教版（2019）必修2 · 第3章第1节</span></p>
<p class="q-b">艾弗里等人的实验表明，DNA 才是使 R 型细菌产生稳定遗传变化的物质。</p>
<p class="q-n">→ 翻成人话：这句话能成立靠「<b>分开做、各自做</b>」——把 S 型细菌的 DNA、蛋白质、多糖等分别加到 R 型细菌的培养基里，只有加 DNA 的那一组出现 S 型；再补一组「DNA + DNA 酶」，DNA 被水解后就不再转化。少了 DNA 酶这一组，「也许是 DNA 里混着的蛋白质干的」就堵不住。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 噬菌体侵染细菌的实验<span class="q-src">人教版（2019）必修2 · 第3章第1节</span></p>
<p class="q-b">赫尔希和蔡斯的实验表明，噬菌体的 DNA 在亲子代之间具有连续性，DNA 才是噬菌体的遗传物质。</p>
<p class="q-n">→ 翻成人话：注意这句写的是「<b>DNA 才是</b>」，不是「蛋白质<b>不是</b>」。实验只让 DNA 这一个变量被追踪到子代，没有单独做出「只有蛋白质进入而 DNA 不进入」的对照组，所以<b>不能</b>由它推出「蛋白质不是遗传物质」。这是本节第三个扣分点，简答题最爱在这里扣。</p>
</div>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。每一步只推进一个判断。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 噬菌体侵染实验的放射性分布<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">用 32P 标记的 T2 噬菌体侵染未被标记的大肠杆菌，保温一段时间后搅拌、离心。请回答：<br>（1）放射性主要出现在上清液还是沉淀物中？原因是什么？<br>（2）若保温时间过长，上清液的放射性会怎样变化？为什么？<br>（3）该实验能否证明「蛋白质不是遗传物质」？说明理由。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题：先定位「标记的是谁」</p>
<p class="s-b">32P 标记的是噬菌体的 DNA（DNA 含 P，蛋白质不含 P）。所以这道题追踪的对象是 DNA，不是外壳。第（1）问问的是「DNA 去哪了」。</p>
<p class="s-k">用到：噬菌体的组成只有蛋白质外壳和 DNA；DNA 含 P 而蛋白质不含。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 定性：把「搅拌」「离心」各管什么分清</p>
<p class="s-b">搅拌让吸附在大肠杆菌外壁的蛋白质外壳脱落；离心让轻的噬菌体颗粒留在上清液、重的大肠杆菌沉到沉淀物。所以「上清液 vs 沉淀物」分的是「外壳 vs 菌体」，不是「蛋白质 vs DNA」。</p>
<p class="s-k">用到：搅拌 = 让外壳脱落；离心 = 按密度分层。两者都不能写成「让噬菌体进入细菌」。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 推理第（1）问：DNA 进了菌体</p>
<p class="s-b">DNA 进入大肠杆菌，随菌体一起沉到沉淀物，所以放射性主要在沉淀物。上清液里只有少量，来自还没侵染的噬菌体或没脱净的外壳。</p>
<p class="s-k">用到：DNA 在亲子代间的连续性——只有进入菌体的 DNA 才能传给子代。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 推理第（2）问：过长会裂解</p>
<p class="s-b">保温过长，大肠杆菌被裂解，子代噬菌体释放到培养液中；这些子代带着 32P 标记的 DNA，离心后留在上清液，于是上清液放射性升高、沉淀物占比下降。反过来保温过短，噬菌体还没来得及把 DNA 注进去，同样让上清液偏高。</p>
<p class="s-k">用到：保温时间过短或过长都会让上清液放射性升高，峰值在 t≈15 min。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 推理第（3）问：结论的边界</p>
<p class="s-b">不能。实验只追踪到「DNA 进入菌体并传给子代」，没有设置「蛋白质单独进入而 DNA 不进入」的对照组，因此只能证明 DNA 是遗传物质，不能证明蛋白质不是遗传物质。</p>
<p class="s-k">用到：噬菌体实验只证明 DNA 是遗传物质、不能证明蛋白质不是——这是简答题最常见的扣分点。</p>
</li>
</ol>

<p class="ans-b">（1）主要在<b>沉淀物</b>中。32P 标记的是噬菌体的 DNA，侵染时 DNA 进入大肠杆菌，随菌体一起离心到沉淀物。<br>（2）上清液放射性<b>升高</b>。保温时间过长，大肠杆菌裂解，子代噬菌体释放到培养液中，离心后留在上清液。（若保温过短，噬菌体还未完成侵染，DNA 未进入菌体，上清液放射性同样偏高。）<br>（3）<b>不能</b>。该实验只能说明 DNA 在亲子代间具有连续性、DNA 是噬菌体的遗传物质；没有设置证明蛋白质不能起遗传作用的对照，故不能推出「蛋白质不是遗传物质」。</p>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">

<div class="qac">
<p class="q">「为什么课本标题写『主要』？直接写『DNA 是遗传物质』不行吗？」</p>
<p class="a">不行。<b>绝大多数生物</b>的遗传物质是 DNA，但<b>少数病毒只含 RNA</b>（如烟草花叶病毒、流感病毒），它们的遗传物质是 RNA。所以准确表述是「DNA 是<b>主要</b>的遗传物质」——<b>不是唯一</b>。少写「主要」二字就是硬伤。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="主要的遗传物质：绝大多数生物是DNA，少数病毒是RNA">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="38" text-anchor="middle" font-size="9.5" font-weight="700" fill="#151a21">「主要」两字不能删</text>
<text x="120" y="60" text-anchor="middle" font-size="9" fill="#3a3a35">绝大多数生物：DNA</text>
<text x="120" y="80" text-anchor="middle" font-size="9" fill="#3a3a35">少数病毒：只有 RNA</text>
<text x="120" y="104" text-anchor="middle" font-size="9" font-weight="700" fill="#b8402f">→ 不是「唯一」</text>
</svg>
</div>

<div class="qac">
<p class="q">「噬菌体实验到底用什么同位素标记什么？为什么偏偏选 P 和 S？」</p>
<p class="a">32P 标记 <b>DNA</b>、35S 标记<b>蛋白质</b>。因为 DNA 含 P 不含 S，蛋白质含 S 而几乎不含 P，两种元素正好各占一边，才能把 DNA 和蛋白质<b>彻底分开追踪</b>。写成「35S 标记 DNA」就是零分句。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="同位素标记：32P标记DNA，35S标记蛋白质">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="36" text-anchor="middle" font-size="9.5" font-weight="700" fill="#151a21">元素各占一边</text>
<text x="120" y="60" text-anchor="middle" font-size="9.4" fill="#b8402f">32P → DNA（含 P）</text>
<text x="120" y="80" text-anchor="middle" font-size="9.4" fill="#2f5d7c">35S → 蛋白质（含 S）</text>
<text x="120" y="104" text-anchor="middle" font-size="9" fill="#6b7480">两种元素互补，互不干扰</text>
</svg>
</div>

<div class="qac">
<p class="q">「搅拌和离心分别是为了什么？能合起来写吗？」</p>
<p class="a"><b>搅拌</b>：让吸附在大肠杆菌外壁的<b>蛋白质外壳脱落</b>，使「进入菌体的」和「留在外面的」分开。<b>离心</b>：按密度分层，轻的噬菌体颗粒在上清液、重的大肠杆菌在沉淀物。一个是「剥壳」，一个是「分层」，<b>不能写成「让噬菌体进入细菌」</b>——侵染是保温阶段自己完成的。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="搅拌让外壳脱落，离心让上清液与沉淀物分层">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="34" text-anchor="middle" font-size="9.5" font-weight="700" fill="#151a21">两步各管一件事</text>
<text x="120" y="58" text-anchor="middle" font-size="9" fill="#3a3a35">搅拌：外壳脱落</text>
<text x="120" y="80" text-anchor="middle" font-size="9" fill="#3a3a35">离心：上清液 / 沉淀物</text>
<text x="120" y="104" text-anchor="middle" font-size="9" font-weight="700" fill="#b8791f">都用「保温」阶段完成</text>
</svg>
</div>

<div class="qac">
<p class="q">「32P 组放射性明明主要在沉淀物，为什么上清液还有一点点？」</p>
<p class="a">三个常见来源：① 保温时间<b>过短</b>，部分噬菌体还没把 DNA 注进去；② 搅拌不充分，外壳没脱干净、仍挂在菌体上被一起沉下去（这会让沉淀物偏高，反而不是上清液）；③ 保温时间<b>过长</b>，细菌裂解、子代噬菌体释放。凡是问「上清液为什么还有放射性」，先分清是「太短」还是「太长」。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="上清液仍有少量放射性的原因">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="32" text-anchor="middle" font-size="9.5" font-weight="700" fill="#151a21">上清液的少量放射性</text>
<text x="120" y="54" text-anchor="middle" font-size="9" fill="#b8402f">太短：DNA 没进去</text>
<text x="120" y="74" text-anchor="middle" font-size="9" fill="#b8402f">太长：细菌裂解了</text>
<text x="120" y="96" text-anchor="middle" font-size="9" fill="#3a3a35">两头都会让上清液升高</text>
<text x="120" y="114" text-anchor="middle" font-size="8.6" fill="#6b7480">峰值在 t≈15 min</text>
</svg>
</div>

<div class="qac">
<p class="q">「艾弗里已经分离提纯出 DNA 了，为什么还要加一组 DNA 酶？」</p>
<p class="a">为了排除「起作用的其实是混在 DNA 里的<b>杂质</b>」这一可能。<b>DNA 酶专一水解 DNA</b>：加了酶之后转化能力消失，就说明转化能力确实来自 DNA 本身，而不是别的成分。这一组是<b>对照</b>，不能删；因此「艾弗里实验没有对照」是错句。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="DNA酶对照：DNA被水解后转化能力消失">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="34" text-anchor="middle" font-size="9.5" font-weight="700" fill="#151a21">DNA 酶组的作用</text>
<text x="120" y="58" text-anchor="middle" font-size="9" fill="#3a3a35">DNA + DNA 酶 → 水解</text>
<text x="120" y="80" text-anchor="middle" font-size="9" fill="#3a3a35">结果：不再发生转化</text>
<text x="120" y="104" text-anchor="middle" font-size="9" font-weight="700" fill="#2f8a5b">→ 排除杂质，锁定 DNA</text>
</svg>
</div>

<div class="qac">
<p class="q">「格里菲思那四组实验，能直接得出『DNA 是遗传物质』吗？」</p>
<p class="a"><b>不能</b>。他只知道加热杀死的 S 型细菌里有某种「转化因子」，<b>既没提纯、也没鉴定成分</b>，说不出它是 DNA、蛋白质还是别的。把它写成「格里菲思证明 DNA 是遗传物质」是把三级台阶跳了一级——这也是「DNA 是<b>主要</b>的遗传物质、不是唯一」这条结论需要三个实验接力才立得住的原因。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="格里菲思只能证明存在转化因子">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="34" text-anchor="middle" font-size="9.5" font-weight="700" fill="#151a21">三级台阶，不能跳</text>
<text x="120" y="56" text-anchor="middle" font-size="9" fill="#3a3a35">格里菲思：有「转化因子」</text>
<text x="120" y="78" text-anchor="middle" font-size="9" fill="#3a3a35">艾弗里：它是 DNA</text>
<text x="120" y="100" text-anchor="middle" font-size="9" fill="#3a3a35">噬菌体：DNA 能传代</text>
<text x="120" y="116" text-anchor="middle" font-size="8.6" fill="#6b7480">只有前两级会写错</text>
</svg>
</div>

</div>
<p class="gx-note">六问其实是同一件事：<b>结论的力度必须和实验的力度匹配</b>。格里菲思只有「有东西」，艾弗里能说「是 DNA」，噬菌体实验能说「DNA 传代但蛋白质没进去」——所以能写「DNA 是<b>主要</b>的遗传物质」，不能写「DNA 是唯一」，也不能凭空加一句「蛋白质不是遗传物质」。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">

<div class="er">
<p class="er-x">✗ DNA 是唯一的遗传物质。</p>
<p class="er-v">✓ DNA 是<b>主要</b>的遗传物质，少数病毒以 RNA 为遗传物质。</p>
<p class="er-w">错在哪：把「主要」写成「唯一」。课本标题里的「主要」是结论的一部分，去掉就错。</p>
</div>

<div class="er">
<p class="er-x">✗ 用 35S 标记噬菌体的 DNA。</p>
<p class="er-v">✓ 用 32P 标记 DNA，用 35S 标记蛋白质。</p>
<p class="er-w">错在哪：DNA 含 P 不含 S，蛋白质含 S 不含 P；记反了整道题的推理全塌。</p>
</div>

<div class="er">
<p class="er-x">✗ 噬菌体侵染细菌实验证明蛋白质不是遗传物质。</p>
<p class="er-v">✓ 该实验证明 DNA 在亲子代间具有连续性、DNA 是噬菌体的遗传物质；<b>不能</b>证明蛋白质不是遗传物质。</p>
<p class="er-w">错在哪：实验没设「蛋白质单独进入而 DNA 不进入」的对照，结论只能停在「DNA 是」，不能推到「蛋白质不是」。</p>
</div>

<div class="er">
<p class="er-x">✗ 搅拌是为了让噬菌体进入大肠杆菌。</p>
<p class="er-v">✓ 搅拌是让吸附在细菌外壁的蛋白质外壳脱落；侵染在保温阶段已经完成。</p>
<p class="er-w">错在哪：把「剥壳」写成「进入」。离心也不是「让噬菌体进入」，而是按密度分层。</p>
</div>

<div class="er">
<p class="er-x">✗ 保温时间越长，沉淀物放射性越高，所以越长越好。</p>
<p class="er-v">✓ 保温时间过短或过长都会让上清液放射性升高，峰值在 t≈15 min。</p>
<p class="er-w">错在哪：忽略「细菌会裂解」这一头。过长时子代噬菌体释放到上清液，沉淀物占比反而下降（t=30 时降到约 50%）。</p>
</div>

<div class="er">
<p class="er-x">✗ 艾弗里的实验没有对照，所以结论不可靠。</p>
<p class="er-v">✓ 艾弗里设置了多组对照：DNA 组、蛋白质组、多糖组，以及 DNA + DNA 酶组。</p>
<p class="er-w">错在哪：把「互相作对照」当成了「没有对照」。加了 DNA 酶那一组正是最关键的对照。</p>
</div>

<div class="er">
<p class="er-x">✗ 格里菲思的肺炎链球菌转化实验证明了 DNA 是遗传物质。</p>
<p class="er-v">✓ 格里菲思只证明加热杀死的 S 型细菌中存在「转化因子」，未鉴定其化学本质。</p>
<p class="er-w">错在哪：把三级台阶压成一级。鉴定成分是艾弗里的工作。</p>
</div>

</div>

    tx(gB, f.x, f.y, "峰值 t=15：80%，侵染完成、未裂解", "#3a3a35", "start", 9, 700);
    tx(gB, f.x, f.y + f.lh, "过短→DNA 未进入；过长→细菌裂解", "#3a3a35", "start", 9, 400);
    tx(gB, f.x, f.y + f.lh * 2, "两头都让上清液放射性升高", "#b8402f", "start", 9, 700);
    tx(gB, f.x, f.y + f.lh * 3, "35S 组沉淀物恒 20%（绿虚线）", "#2f8a5b", "start", 9, 400);
  }

  function render() {
    if (!G) { L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N; stage.setAttribute("viewBox", L.vb); G = geom(); }
    var p = calc(A), st, col, bg, sn;
    $("gxVa").textContent = String(p.t);
    $("gxVb").textContent = String(p.p32);
    $("gxVc").textContent = String(p.p35);
    if (p.t < 10) { st = "侵染不充分"; col = "#b8402f"; bg = "#fbeae7"; sn = "DNA 还没进菌体，上清液偏高"; }
    else if (p.t <= 22) { st = "最适窗口"; col = "#2f8a5b"; bg = "#e6f6ee"; sn = "侵染完成、细菌未裂解"; }
    else { st = "细菌裂解"; col = "#b8791f"; bg = "#fdf3e0"; sn = "子代噬菌体释放，上清液又升高"; }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    draw();
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    stage.setAttribute("viewBox", L.vb);
    G = geom();
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 0 }, { t: 1.2, v: 0 }, { t: 4, v: 15 }, { t: 6.5, v: 15 }, { t: 9, v: 30 }, { t: 11, v: 24 }, { t: 13, v: 0 }],
    keys: [0, 15, 24, 30],
    value: A, min: 0, max: 30, step: 2,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__bio = { calc: calc, cases: [
    { v: 0, eq: { p32: 20 } },
    { v: 15, eq: { p32: 80 } },
    { v: 30, eq: { p32: 50 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
