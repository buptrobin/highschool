<div class="gx-meta">
<span><i></i>人教版（2019）必修2 第3章第2节</span>

<p class="gx-lede">这一节是第3章的“地基”：后面讲 DNA 的复制、基因的表达，都要先有“两条链反向平行、碱基互补配对”这个结构。最容易错的一件事：把 <span class="gx-fml">A = T</span>、<span class="gx-fml">G = C</span> 当成“任意两个碱基相等”，或者把两条链说成“同向平行”。记住，<span class="gx-fml">A = T</span>、<span class="gx-fml">G = C</span> 是<b>碱基数量</b>关系，由配对规则推出来的，不是结构形状。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边的原话，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 双螺旋的两条链<span class="q-src">人教版（2019）必修2 · 第3章第2节</span></p>
<p class="q-b">DNA 由两条脱氧核苷酸链组成，这两条链按反向平行方式盘旋成双螺旋结构。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个条件</b>组成——①两条链（不是一条）；②<b>反向平行</b>（一条 5′→3′，另一条 3′→5′，并排走）；③盘旋成双螺旋。少写“反向”两个字，整句就错：同向平行不是 DNA 的真实结构。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 基本骨架与碱基的位置<span class="q-src">人教版（2019）必修2 · 第3章第2节</span></p>
<p class="q-b">磷酸和脱氧核糖交替连接，排列在外侧，构成基本骨架；碱基排列在内侧。</p>
<p class="q-n">→ 翻成人话：<b>两个条件</b>——①外侧必须是“磷酸—脱氧核糖”交替连接，这两样才是骨架；②碱基在内侧，两两配对。写成“骨架由碱基构成”，等于把内外侧对调，直接扣分。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 碱基互补配对与氢键<span class="q-src">人教版（2019）必修2 · 第3章第2节</span></p>
<p class="q-b">碱基通过氢键连接成碱基对：A 与 T 配对（2 个氢键）、G 与 C 配对（3 个氢键）。</p>
<p class="q-n">→ 翻成人话：<b>三个条件</b>——①配对关系固定，只有 A—T、G—C；②靠氢键连接（不是共价键）；③氢键数是 2 个和 3 个。由这条规则才推出 <span class="gx-fml">A = T</span>、<span class="gx-fml">G = C</span> 的<b>数量</b>关系，进一步才有 <span class="gx-fml">A + G = T + C</span>。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>教材表述（该写）</th><th>常见错写（别写）</th></tr></thead>
<tbody>
<tr><td>两条链的方向</td><td>反向平行</td><td>同向平行、方向相同</td></tr>
<tr class="key"><td>碱基的数量关系</td><td><span class="gx-fml">A = T</span>、<span class="gx-fml">G = C</span>，由此 <span class="gx-fml">A + G = T + C</span></td><td><span class="gx-fml">A + G = A + T</span>、四个碱基都相等</td></tr>
<tr><td>A—T / G—C 的氢键数</td><td>2 个 / 3 个</td><td>都是 2 个、G—C 只有 2 个</td></tr>
<tr><td>基本骨架的成分</td><td>磷酸和脱氧核糖交替连接</td><td>碱基对、脱氧核苷酸</td></tr>
<tr><td>GC 含量与稳定性</td><td>G-C 对越多，氢键越多，DNA 越稳定</td><td>GC 含量高说明不稳定</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表背面只有一句话：结构决定数量关系，数量关系决定稳定性。考试要么问“结构是什么”，要么问“算数量”，两条线都从上面三句原话出发。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 碱基比例计算<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">某 DNA 分子中，腺嘌呤（A）占全部碱基的 28%。求：(1) 鸟嘌呤（G）所占的比例；(2) <span class="gx-fml">(A + T) / (G + C)</span> 的值。陷阱：28% 是“占全部碱基”的比例，不是“占某一条链”的比例。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题：先写下数量关系</p>
<p class="s-b">题干只给了一个数 A 占 28%，但双链 DNA 自带两条等式：<span class="gx-fml">A = T</span>、<span class="gx-fml">G = C</span>。先把它们写在草稿纸最上面，再动笔算。</p>
<p class="s-k">用到：碱基互补配对 → A = T、G = C 是数量关系。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 由 A 求 T</p>
<p class="s-b">A 占 28%，则 T 也占 28%（成对相等）。两者合计已经占掉 56%。</p>
<p class="s-k">用到：A = T；百分比可以直接相加。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 剩下的给 G 和 C</p>
<p class="s-b">全部碱基是 100%，所以 G + C = 100% − 28% − 28% = 44%；又因为 G = C，故 G = C = 22%。</p>
<p class="s-k">用到：G = C，且 A + T + G + C = 100%。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 代入求比值</p>
<p class="s-b"><span class="gx-fml">(A + T) / (G + C) = (28% + 28%) / (22% + 22%) = 56 / 44 ≈ 1.27</span>。因为 A = T、G = C，这个比值其实就等于 <span class="gx-fml">A / G</span>。</p>
<p class="s-k">用到：分子分母各自成对相等，可以约成单碱基之比。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 回代检查</p>
<p class="s-b">验算：A + G = 28% + 22% = 50%，T + C = 50%，两边相等，说明没算错。若有人写成 A + G = A + T，会得到 1，就是这条等式用错了。</p>
<p class="s-k">用到：A + G = T + C，各占一半——最快的验算工具。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">(1) 因为双链 DNA 中 A = T、G = C，且四种碱基共占 100%，所以 A = T = 28%，G = C = (100% − 56%) / 2 = 22%。<br>(2) (A + T) / (G + C) = (28% + 28%) / (22% + 22%) = 56 / 44 ≈ 1.27。<br>答：G 占 22%，(A + T) / (G + C) 约为 1.27。</p>
</div>
</div>
</section>
<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「A 与 T 为什么一定相等？是不是所有碱基都相等？」</p>
<p class="a">因为双链中 A 只与 T 配对，每一个 A 都必然对着一个 T，所以整条 DNA 上 A 的数目等于 T 的数目——这是<b>配对规则推出来的数量关系</b>，不是四个碱基都相等。同理 G = C。注意：单条链内部 A 与 T <b>不一定</b>相等。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="两条链上 A 与 T 一一配对">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="80" y1="26" x2="80" y2="106" stroke="#9aa7b4" stroke-width="1.6"/>
<line x1="160" y1="26" x2="160" y2="106" stroke="#9aa7b4" stroke-width="1.6"/>
<line x1="80" y1="42" x2="160" y2="42" stroke="#2f8a5b" stroke-width="1.4"/>
<line x1="80" y1="68" x2="160" y2="68" stroke="#2f8a5b" stroke-width="1.4"/>
<line x1="80" y1="94" x2="160" y2="94" stroke="#2f8a5b" stroke-width="1.4"/>
<text x="64" y="46" text-anchor="end" font-size="9.5" font-weight="700" fill="#2c5f96">A</text>
<text x="176" y="46" font-size="9.5" font-weight="700" fill="#a8394a">T</text>
<text x="120" y="122" text-anchor="middle" font-size="8.6" fill="#5a6472">一个 A 必配一个 T</text>
</svg>
</div>
<div class="qac">
<p class="q">「两条链的方向相同吗？」</p>
<p class="a"><b>不相同，是反向平行。</b>一条链是 5′→3′，另一条是 3′→5′，两条链并排但走向相反。答“同向平行”“方向相同”都算结构描述错误；反向平行才使两条链上的碱基能一一正对、稳定配对。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="两条链走向相反，反向平行">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>

<line x1="196" y1="44" x2="184" y2="38" stroke="#2c5f96" stroke-width="1.8"/>
<line x1="196" y1="44" x2="184" y2="50" stroke="#2c5f96" stroke-width="1.8"/>
<line x1="196" y1="84" x2="40" y2="84" stroke="#a8394a" stroke-width="1.8"/>
<line x1="40" y1="84" x2="52" y2="78" stroke="#a8394a" stroke-width="1.8"/>
<line x1="40" y1="84" x2="52" y2="90" stroke="#a8394a" stroke-width="1.8"/>
<text x="36" y="40" text-anchor="end" font-size="8.6" fill="#2c5f96">5′</text>
<text x="202" y="40" font-size="8.6" fill="#2c5f96">3′</text>
<text x="202" y="80" text-anchor="end" font-size="8.6" fill="#a8394a">3′</text>
<text x="36" y="80" text-anchor="end" font-size="8.6" fill="#a8394a">5′</text>
<text x="120" y="114" text-anchor="middle" font-size="8.6" fill="#5a6472">走向相反＝反向平行</text>
</svg>
</div>
<div class="qac">
<p class="q">「氢键总数怎么算？」</p>
<p class="a">先按 GC 含量求出 A 与 G 的个数，再用 <span class="gx-fml">氢键总数 = 2A + 3G</span>。例：100 个碱基、GC 含量 40%，则 A = T = 30、G = C = 20，氢键 = 2×30 + 3×20 = <b>120 个</b>。别把碱基对数当碱基数，也别用 2 个氢键算 G-C。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="氢键总数等于二乘A加三乘G">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="40" text-anchor="middle" font-size="9" fill="#5a6472">氢键总数</text>
<text x="120" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#151a21">2 × A + 3 × G</text>

<rect x="130" y="82" width="82" height="26" rx="5" fill="#e6f6ee" stroke="#9ccdb4"/>

</svg>
</div>
<div class="qac">
<p class="q">「GC 含量高说明什么？说明不稳定吗？」</p>
<p class="a">反过来。<b>G-C 对越多，氢键越多，DNA 越稳定。</b>每个 G-C 对有 3 个氢键，A-T 对只有 2 个，所以 GC 含量高的 DNA 双链结合更牢，更耐高温。含“GC 高＝不稳定”的选项一律错。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="GC 含量越高氢键越多越稳定">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="34" y1="100" x2="206" y2="100" stroke="#b8c2cc" stroke-width="1.2"/>

<polyline points="34,94 88,80 148,54 202,30" fill="none" stroke="#2f8a5b" stroke-width="2"/>

<text x="150" y="24" text-anchor="middle" font-size="8.6" font-weight="700" fill="#1f6b46">更稳定</text>
</svg>
</div>
<div class="qac">
<p class="q">「双螺旋的基本骨架是什么？」</p>
<p class="a"><b>磷酸和脱氧核糖交替连接</b>，排列在外侧，构成基本骨架；碱基排列在内侧。骨架里<b>没有碱基</b>。答“骨架由碱基构成”把内外侧弄反了，是最常见的一句扣分话。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="外侧磷酸与脱氧核糖交替构成骨架，碱基在内侧">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="44" y1="50" x2="180" y2="50" stroke="#9aa7b4" stroke-width="1.6"/>
<circle cx="56" cy="50" r="9" fill="#6b5bd2"/>
<circle cx="100" cy="50" r="9" fill="#6b5bd2"/>
<circle cx="144" cy="50" r="9" fill="#6b5bd2"/>
<rect x="70" y="40" width="20" height="20" rx="3" fill="#cf8a2e" stroke="#a76c1c"/>
<rect x="114" y="40" width="20" height="20" rx="3" fill="#cf8a2e" stroke="#a76c1c"/>
<rect x="158" y="40" width="20" height="20" rx="3" fill="#cf8a2e" stroke="#a76c1c"/>
<text x="120" y="86" text-anchor="middle" font-size="8.6" fill="#4b3da8">磷酸 + 脱氧核糖交替</text>

</svg>
</div>
<div class="qac">
<p class="q">「一条链的 A，一定与另一条链的 T 相等吗？」</p>
<p class="a">相等。配对的 A 与 T 分别位于两条链上，所以<b>链1 的 A 数 ＝ 链2 的 T 数</b>，链1 的 G 数 ＝ 链2 的 C 数。但单条链内部，A 与 T 不一定相等——<span class="gx-fml">A = T</span> 说的是双链整体的碱基数量关系。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="一条链的 A 与另一条链的 T 配对">

<line x1="174" y1="26" x2="174" y2="106" stroke="#9aa7b4" stroke-width="1.6"/>
<line x1="70" y1="46" x2="166" y2="46" stroke="#2c5f96" stroke-width="1.5"/>
<line x1="70" y1="82" x2="166" y2="82" stroke="#2f8a5b" stroke-width="1.5"/>
<text x="58" y="50" text-anchor="end" font-size="10" font-weight="700" fill="#2c5f96">A</text>

<p class="gx-note">六问其实是同一件事：结构（反向平行 + 固定配对）决定数量关系（A = T、G = C，故 A + G = T + C），数量关系再决定氢键数与稳定性。答任何一问，都从“两条链反向平行”写起。</p>

<div class="er">
<p class="er-x">✗ A + G = A + T，所以 G = T</p>
<p class="er-v">✓ A = T、G = C 是数量关系，由此 A + G = T + C，两块各占全部碱基的 50%</p>
<p class="er-w">错在哪：把“嘌呤总数”与“某一对碱基”混在一起。等号右侧应是 T + C，不是 A + T。</p>
</div>
<div class="er">
<p class="er-x">✗ 两条链同向平行，方向相同</p>
<p class="er-v">✓ 两条链按反向平行方式盘旋成双螺旋结构</p>
<p class="er-w">错在哪：一条链 5′→3′，另一条 3′→5′，走向相反；写“同向”就把结构描述整个否掉了。</p>
</div>
<div class="er">
<p class="er-x">✗ G-C 之间也是 2 个氢键，和 A-T 一样</p>
<p class="er-v">✓ A-T 之间有 2 个氢键，G-C 之间有 3 个氢键</p>
<p class="er-w">错在哪：数目记反。正因 G-C 多 1 个氢键，GC 含量才与稳定性挂钩。</p>
</div>
<div class="er">
<p class="er-x">✗ GC 含量越高，DNA 越不稳定</p>
<p class="er-v">✓ G-C 对越多，氢键越多，DNA 越稳定</p>
<p class="er-w">错在哪：因果倒置。氢键多 → 结合牢 → 稳定，GC 高是“更稳定”。</p>
</div>
<div class="er">
<p class="er-x">✗ DNA 的基本骨架由碱基对构成</p>
<p class="er-v">✓ 磷酸和脱氧核糖交替连接，排列在外侧，构成基本骨架，碱基在内侧</p>
<p class="er-w">错在哪：内外侧对调。骨架成分只有磷酸和脱氧核糖，碱基不在骨架上。</p>
</div>
<div class="er">
<p class="er-x">✗ 100 个碱基对就是 100 个碱基，A 有 30 个</p>
<p class="er-v">✓ 100 个碱基对＝200 个碱基，A 的个数要按 200 算</p>
<p class="er-w">错在哪：把碱基对数量当碱基数量。凡题目给“对”，先 ×2 再代公式。</p>
</div>
<div class="er">
<p class="er-x">✗ 一条链上 A 的数目一定等于同一条链上 T 的数目</p>
<p class="er-v">✓ 双链整体 A = T；单链内部 A 与 T 不一定相等，只有两链之间才 A 对 T</p>
<p class="er-w">错在哪：把“双链的数量关系”缩小到单链。判断单链要用“链1 的 A ＝ 链2 的 T”。</p>
</div>

<script>
/* bx2-c3-s2：GC 含量 → 碱基个数、氢键总数、稳定性 */
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var GX = window.GX, el = GX.el, tx = GX.tx, $ = GX.$;
  var stage = $("gxStage");
  if (!stage || !window.AutoPilot) return;

  var W = { vb: "0 0 880 470", left: { x: 16, y: 16, w: 424, h: 438 }, right: { x: 456, y: 16, w: 408, h: 438 } };
  var N = { vb: "0 0 360 700", left: { x: 8, y: 8, w: 344, h: 330 }, right: { x: 8, y: 350, w: 344, h: 342 } };
  var L = W, G = null, A = 50;
  var BLUE = "#2c7fb0", REDB = "#a8394a", GREEN = "#2f8a5b", AMBER = "#b8791f", RED = "#b8402f";

  /* 唯一真值：gc 为 GC 含量 %，按 100 个碱基（50 个碱基对）计 */
  function calc(gc) {
    var a = (100 - gc) / 2, g = gc / 2;
    return { gc: gc, A: a, T: a, G: g, C: g, hb: 2 * a + 3 * g, ratio: gc === 0 ? 0 : a / g };
  }
  function fmt(n) { return n % 1 === 0 ? String(n) : n.toFixed(1); }
  function pts(a) {
    for (var i = 0, o = []; i < a.length; i++) o.push(a[i][0].toFixed(1) + "," + a[i][1].toFixed(1));
    return o.join(" ");
  }

  function draw() {
    var s = calc(A), gA = $("gxA"), gB = $("gxB"), wide = L === W;
    gA.textContent = ""; gB.textContent = "";
    var lx = L.left.x, ly = L.left.y;
    el("rect", { x: lx, y: ly, width: L.left.w, height: L.left.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    tx(gA, lx + 16, ly + 26, "100 个碱基的双螺旋示意", "#5a6472", "start", 10.5, 700);

    var n = wide ? 16 : 9, k, xl = [], xr = [], fs = wide ? 8 : 7.4;
    var y0 = ly + 58, y1 = ly + L.left.h - 92;
    var cx = lx + L.left.w / 2, dx = wide ? 66 : 58;
    for (k = 0; k <= n; k++) {
      var y = y0 + (y1 - y0) * k / n, wv = 13 * Math.sin(k * 0.85);
      xl.push([cx - dx + wv, y]); xr.push([cx + dx + wv, y]);
    }
    el("polyline", { points: pts(xl), fill: "none", stroke: "#9aa7b4", "stroke-width": 2.2 }, gA);
    el("polyline", { points: pts(xr), fill: "none", stroke: "#9aa7b4", "stroke-width": 2.2 }, gA);

    var acc = 0;
    for (k = 0; k < n; k++) {
      var m = k + 0.5, ym = y0 + (y1 - y0) * m / n, wm = 13 * Math.sin(m * 0.85);
      var isGC = (acc += A / 100) >= 1;
      if (isGC) acc -= 1;
      var col = isGC ? GREEN : BLUE, nd = isGC ? 3 : 2, q;
      for (q = 0; q < nd; q++) {
        var oy = (q - (nd - 1) / 2) * (isGC ? 6.2 : 7.4);
        el("line", { x1: cx - dx + wm, y1: ym + oy, x2: cx + dx + wm, y2: ym + oy, stroke: col, "stroke-width": 1.6, "stroke-dasharray": "3 2.5" }, gA);
      }
      tx(gA, cx - dx + wm - 7, ym + 3, isGC ? "G" : (k % 2 ? "T" : "A"), col, "end", fs, 700);
      tx(gA, cx + dx + wm + 7, ym + 3, isGC ? "C" : (k % 2 ? "A" : "T"), col, "start", fs, 700);
    }
    tx(gA, cx, y1 + 26, "两条链反向平行：一条 5′→3′，另一条 3′→5′", "#5a6472", "middle", 9.2, 400);
    tx(gA, cx, y1 + 45, "虚线 2 条＝A—T，3 条＝G—C（氢键）", "#5a6472", "middle", 9.2, 400);
    tx(gA, cx, y1 + 64, "外侧：磷酸—脱氧核糖交替连接 ＝ 基本骨架", "#5a6472", "middle", 9.2, 400);
    tx(gA, cx, y1 + 83, "G-C 对越多 → 氢键越多 → DNA 越稳定", "#5a6472", "middle", 9.2, 400);

    var rx = L.right.x, ry = L.right.y;
    el("rect", { x: rx, y: ry, width: L.right.w, height: L.right.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    tx(gB, rx + 16, ry + 26, "碱基个数（总数 100 个）", "#5a6472", "start", 10.5, 700);
    var rows = [["A", s.A, BLUE], ["T", s.T, REDB], ["G", s.G, GREEN], ["C", s.C, AMBER]];
    var x0 = rx + 16, sc = (L.right.w - 96) / 50, rh = wide ? 26 : 30, by = ry + 50, i;
    for (i = 0; i < 4; i++) {
      var yy = by + i * rh, bw = Math.max(2, rows[i][1] * sc);
      el("rect", { x: x0 + 34, y: yy, width: bw, height: 14, rx: 3, fill: rows[i][2], opacity: 0.86 }, gB);
      tx(gB, x0, yy + 12, rows[i][0], "#3a3a35", "start", 10.5, 700);
      tx(gB, x0 + 40 + bw, yy + 12, fmt(rows[i][1]), "#5a6472", "start", 10, 400);
    }
    var ty = by + 4 * rh + 16;
    tx(gB, x0, ty, "氢键总数 = 2A + 3G = " + fmt(s.hb) + " 个", "#151a21", "start", 11, 700);
    tx(gB, x0, ty + 24, "A/G = " + (A === 0 ? "—（没有 G）" : s.ratio.toFixed(2)), "#5a6472", "start", 10.5, 400);
    tx(gB, x0, ty + 52, "G-C 对越多 → 氢键越多", GREEN, "start", 10.5, 700);
    tx(gB, x0, ty + 72, "→ 两条链结合越牢", "#3a3a35", "start", 10.5, 400);
    tx(gB, x0, ty + 92, "→ DNA 越稳定、越耐热", "#3a3a35", "start", 10.5, 400);
  }

  function render() {
    if (!G) { L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N; G = geom(); }
    var s = calc(A), st, col, bg, sn;
    $("gxVa").textContent = String(A);
    $("gxVb").textContent = fmt(s.A);
    $("gxVbs").textContent = "G = C = " + fmt(s.G) + " 个";
    $("gxVc").textContent = fmt(s.hb);
    if (A === 0) { st = "全 A-T"; col = RED; bg = "#fbeae7"; sn = "氢键最少，稳定性最低"; }
    else if (A < 50) { st = "A、T 偏多"; col = AMBER; bg = "#fdf3e0"; sn = "氢键 " + fmt(s.hb) + " 个，还在变多"; }
    else if (A === 50) { st = "最对称"; col = GREEN; bg = "#e6f6ee"; sn = "A=T=G=C=25，氢键 125 个"; }
    else if (A === 100) { st = "全 G-C"; col = GREEN; bg = "#e6f6ee"; sn = "氢键最多，稳定性最高"; }
    else { st = "G、C 偏多"; col = GREEN; bg = "#e6f6ee"; sn = "G-C 对多 → 氢键多 → 更稳定"; }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    draw();
  }

  function geom() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    stage.setAttribute("viewBox", L.vb);
    return L;
  }
  function layout() { G = geom(); render(); }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 0 }, { t: 1.2, v: 0 }, { t: 4, v: 50 }, { t: 6.5, v: 50 }, { t: 9, v: 100 }, { t: 11, v: 70 }, { t: 13, v: 0 }],
    keys: [0, 50, 70, 100],
    value: A, min: 0, max: 100, step: 5,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__bio = { calc: calc, cases: [
    { v: 40, eq: { A: 30, G: 20 } },
    { v: 60, eq: { A: 20, G: 30 } },
    { v: 50, eq: { hb: 125 } }
  ] };
  window.__model = window.__bio;

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
