<p class="gx-lede">这一节把细胞的「不一样」和「一样」一次说完：<b>不一样</b>在有没有以核膜为界限的细胞核，<b>一样</b>在都有细胞膜、细胞质、核糖体和 DNA。考试只考两件事——给一个生物名，判断它属于原核还是真核；给一个放大倍数，换算出视野里看得见的变化。最容易丢分的是把「放大倍数」当成面积倍数。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 原核与真核的主要区别<span class="q-src">人教版（2019）必修1 · 第1章第2节</span></p>
<p class="q-b">原核细胞与真核细胞的主要区别：细胞内有无以核膜为界限的细胞核。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个条件</b>组成——① 比的是「细胞核」；② 判断标准是「<b>以核膜为界限</b>」；③ 只比这一条，不比其他结构。少写「以核膜为界限」，只写「有无细胞核」，在蓝细菌这种「有拟核、没有核膜」的生物上就判反了。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 蓝细菌<span class="q-src">人教版（2019）必修1 · 第1章第2节</span></p>
<p class="q-b">蓝细菌细胞内含有藻蓝素和叶绿素，是能进行光合作用的自养生物。</p>
<p class="q-n">→ 翻成人话：<b>两个条件</b>——① 色素是藻蓝素 + 叶绿素；② 所以能光合作用、能自养。整句没有出现「叶绿体」三个字：色素不在叶绿体里，而在细胞质的光合片层上。这就是「原核但能光合」的全部依据。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 细胞的统一性<span class="q-src">人教版（2019）必修1 · 第1章第2节</span></p>
<p class="q-b">细胞的统一性：细胞都具有细胞膜、细胞质和核糖体，都以 DNA 作为遗传物质。</p>
<p class="q-n">→ 翻成人话：四件<b>共有物</b>——细胞膜、细胞质、核糖体、DNA。答题时最容易漏的是「核糖体」（以为原核什么细胞器都没有）和「DNA」（以为没有染色体就没有 DNA）。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>原核细胞</th><th>真核细胞</th></tr></thead>
<tbody>
<tr class="key"><td>核膜（有无以核膜为界限的细胞核）</td><td>没有核膜，只有拟核</td><td>有核膜，有真正的细胞核</td></tr>
<tr><td>遗传物质的存在形式</td><td>DNA 裸露，不与蛋白质结合成染色体</td><td>DNA 与蛋白质结合成染色体</td></tr>
<tr><td>细胞器</td><td>只有核糖体</td><td>核糖体、线粒体、叶绿体、内质网等</td></tr>
<tr><td>遗传物质</td><td>DNA</td><td>DNA</td></tr>
<tr><td>细胞壁</td><td>多数有；支原体没有</td><td>植物、真菌有；动物没有</td></tr>
<tr><td>代表生物</td><td>细菌、蓝细菌、放线菌、支原体</td><td>动物、植物、真菌</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只高亮一行：有没有「以核膜为界限的细胞核」。其余各行基本能从这一条推出来——只有「细胞壁」那行必须单独记：支原体是原核却没有细胞壁，植物细胞是真核却有细胞壁，两头都不能反推。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 显微镜操作与放大倍数<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">用显微镜观察人的口腔上皮细胞：先在低倍镜下找到清晰的物像，再换用高倍镜观察。回答：<br>（1）换高倍镜后，视野亮度、视野中细胞数目、物像大小分别怎样变化？为什么？<br>（2）换高倍镜的过程中，哪些操作是不能做的？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 锁定「只换了物镜」</p>
<p class="s-b">题干里只有一个条件变了：物镜的放大倍数变大。视野里所有变化都要从「看得见的范围变小」和「进光量变少」推出来，不凭印象答。</p>
<p class="s-k">用到：放大倍数的含义。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 亮度为什么变暗</p>
<p class="s-b">放大倍数 n 变大，视野直径 d = 200000/n 变小，视野面积按 1/n² 变小；同样时间内进入镜头的光变少，所以视野变暗。是「视野」暗，不是「细胞」暗。</p>
<p class="s-k">用到：视野面积 ∝ 1/n²。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 细胞数目为什么变少</p>
<p class="s-b">视野范围小了，同一块标本里能看见的细胞就少。细胞总数没有变，变的是「看得见多少」。100× 时一行约排 200 个（按 10 μm 估），换到 400× 只剩约 50 个。</p>
<p class="s-k">用到：d = 200000/n，一行细胞数 = d / 细胞直径。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 物像变大，以及那个陷阱</p>
<p class="s-b">放大倍数指<b>长度（宽度）</b>的放大，不是面积。400× 的物像，长度是实际的 400 倍，面积是 400² = 160000 倍。写成「面积放大 400 倍」直接丢分。</p>
<p class="s-k">用到：放大倍数 = 长度倍数 ≠ 面积倍数。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 操作禁区</p>
<p class="s-b">高倍镜镜头更长、工作距离更短。换镜后只能调细准焦螺旋，必要时调光圈或反光镜；不能提升镜筒，不能动粗准焦螺旋，否则镜头会压碎盖玻片。</p>
<p class="s-k">用到：显微镜操作规范。</p>
</li>
</ol>

<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）① 视野变暗：放大倍数增大，视野范围变小、进光量减少。<br>② 细胞数目变少：视野范围变小，看到的细胞数目减少（细胞本身没有变少）。<br>③ 物像变大：放大倍数增大；放大倍数指长度（宽度）的倍数，400× 时面积放大 400² = 160000 倍。<br>（2）不能提升镜筒，不能转动粗准焦螺旋；只能调节细准焦螺旋，必要时调大光圈或换用凹面反光镜。</p>

    if (r < 2.4) r = 2.4;
    var i, j;
    for (i = 0; i < cols; i++) {
      for (j = 0; j < cols; j++) {
        el("circle", {
          cx: cx + (i - (cols - 1) / 2) * sp,
          cy: cy + (j - (cols - 1) / 2) * sp,
          r: r, fill: "#2f8a5b", "fill-opacity": 0.82
        }, gA);
      }
    }
    var dim = 0.55 * (1 - s.bright / 100);
    el("circle", { cx: cx, cy: cy, r: R, fill: "#0b1220", "fill-opacity": dim.toFixed(3) }, gA);
    el("circle", { cx: cx, cy: cy, r: R, fill: "none", stroke: "#0f8a5f", "stroke-width": 1.4 }, gA);

    var ay = lb.y + lb.h * 0.86;
    var x0 = lb.x + lb.w * 0.14, len = R * 2 * (s.d / 2000);
    el("line", { x1: x0, y1: ay, x2: x0 + len, y2: ay, stroke: "#0f8a5f", "stroke-width": 1.5 }, gA);
    el("line", { x1: x0, y1: ay - 5, x2: x0, y2: ay + 5, stroke: "#0f8a5f", "stroke-width": 1.5 }, gA);
    el("line", { x1: x0 + len, y1: ay - 5, x2: x0 + len, y2: ay + 5, stroke: "#0f8a5f", "stroke-width": 1.5 }, gA);
    tx(gA, x0, ay - 10, "视野直径 d", "#5a6472", "start", 9.2, 400);
    tx(gA, lb.x + lb.w - 16, ay - 10, Math.round(s.d) + " μm", "#0f8a5f", "end", 9.4, 700);

    /* ---------- 右：d 随 n 的曲线 + 亮度条 ---------- */
    el("rect", { x: rb.x, y: rb.y, width: rb.w, height: rb.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    tx(gB, rb.x + 18, rb.y + 26, "视野直径 d 随放大倍数 n 下降", "#5a6472", "start", 10.2, 700);

    var px0 = rb.x + rb.w * 0.19, px1 = rb.x + rb.w * 0.93;
    var py0 = rb.y + rb.h * 0.13, py1 = rb.y + rb.h * 0.44;

    function xn(n) { return px0 + (n - 100) / 900 * (px1 - px0); }
    function yd(d) { return py1 - (d / 2000) * (py1 - py0); }

    el("line", { x1: px0, y1: py0, x2: px0, y2: py1, stroke: "#d7dee6", "stroke-width": 1 }, gB);
    el("line", { x1: px0, y1: py1, x2: px1, y2: py1, stroke: "#d7dee6", "stroke-width": 1 }, gB);
    tx(gB, px0 - 6, yd(2000) + 3.4, "2000", "#9aa4af", "end", 8.4, 400);
    tx(gB, px0 - 6, yd(1000) + 3.4, "1000", "#9aa4af", "end", 8.4, 400);
    tx(gB, px0 - 6, yd(200) + 3.4, "200", "#9aa4af", "end", 8.4, 400);
    var ticks = [100, 400, 700, 1000], ti;
    for (ti = 0; ti < ticks.length; ti++) {
      tx(gB, xn(ticks[ti]), py1 + 15, String(ticks[ti]), "#9aa4af", "middle", 8.4, 400);
    }
    tx(gB, px1, py1 + 30, "n（放大倍数）", "#9aa4af", "end", 8.6, 400);

    var pts = [], nn;
    for (nn = 100; nn <= 1000; nn += 10) pts.push([xn(nn), yd(200000 / nn)]);
    el("path", { d: poly(pts), fill: "none", stroke: "#0f8a5f", "stroke-width": 1.8, "stroke-linejoin": "round" }, gB);

    var mx = xn(A), my = yd(s.d);
    el("line", { x1: mx, y1: my, x2: mx, y2: py1, stroke: "#2f8a5b", "stroke-width": 1, "stroke-dasharray": "3 3" }, gB);
    el("line", { x1: px0, y1: my, x2: mx, y2: my, stroke: "#2f8a5b", "stroke-width": 1, "stroke-dasharray": "3 3" }, gB);
    el("circle", { cx: mx, cy: my, r: 4.2, fill: "#0f8a5f", stroke: "#ffffff", "stroke-width": 1.6 }, gB);

    var by = rb.y + rb.h * 0.60, bw = rb.w - 36;
    tx(gB, rb.x + 18, by - 8, "相对亮度（100× 记为 100%）", "#5a6472", "start", 9.2, 400);
    tx(gB, rb.x + rb.w - 18, by - 8, (s.bright >= 10 ? s.bright.toFixed(0) : s.bright.toFixed(1)) + "%", "#0f8a5f", "end", 10.4, 700);
    el("rect", { x: rb.x + 18, y: by, width: bw, height: 13, rx: 6.5, fill: "#eef2f6" }, gB);
    var fw = bw * s.bright / 100;
    if (fw < 3) fw = 3;
    el("rect", { x: rb.x + 18, y: by, width: fw, height: 13, rx: 6.5, fill: "#0f8a5f", "fill-opacity": 0.85 }, gB);

    var stt = A < 200 ? "低倍镜：视野大、细胞多、亮" : (A <= 600 ? "中倍镜：视野在收窄、亮度在掉" : "高倍镜：视野小、细胞少、暗");
    tx(gB, rb.x + 18, by + 42, stt, "#0f8a5f", "start", 9.6, 700);
    tx(gB, rb.x + 18, by + 62, "d = 200000 / n；亮度 ∝ (100/n)²", "#9aa4af", "start", 8.8, 400);
    tx(gB, rb.x + 18, by + 78, "细胞数按直径 10 μm、只排一行估算", "#9aa4af", "start", 8.8, 400);
  }

  function render() {
    var s = calc(A), st, col, bg, sn;
    $("gxVa").textContent = String(Math.round(A)) + "×";
    $("gxVb").textContent = String(Math.round(s.d));
    $("gxVc").textContent = String(s.cells);
    if (A < 200) { st = "低倍镜"; col = "#2f8a5b"; bg = "#e6f6ee"; sn = "视野大 · 细胞多 · 亮"; }
    else if (A <= 600) { st = "中倍镜"; col = "#b8791f"; bg = "#fdf3e0"; sn = "视野收窄 · 亮度下降"; }
    else { st = "高倍镜"; col = "#b8402f"; bg = "#fbeae7"; sn = "视野小 · 细胞少 · 暗"; }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    draw();
  }

  function layout() {
    var wide = stage.parentElement.getBoundingClientRect().width >= 640;
    L = wide ? W : N;
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  $("gxSl").value = String(A);
  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 100 }, { t: 0.8, v: 100 }, { t: 3.4, v: 400 }, { t: 7, v: 400 }, { t: 9.6, v: 1000 }, { t: 11.6, v: 100 }],
    keys: [100, 400, 1000],
    value: A, min: 100, max: 1000, step: 50,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__bio = { calc: calc, cases: [
    { v: 100, eq: { d: 2000, cells: 200, bright: 100 } },
    { v: 400, eq: { d: 500, cells: 50, bright: 6.25 } },
    { v: 1000, eq: { d: 200, cells: 20, bright: 1 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
