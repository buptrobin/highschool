<p class="gx-lede">第5章讲「细胞的能量供应和利用」，这一节先把「反应为什么能变快」说清楚：酶是活细胞产生的有机物，绝大多数是蛋白质，作用是降低化学反应的活化能。整节最容易错的一件事，是把「低温下活性低」当成「酶被杀死」——低温只是抑制，高温、过酸、过碱才是变性。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 酶的定义<span class="q-src">人教版（2019）必修1 · 第5章第1节</span></p>
<p class="q-b">酶是活细胞产生的具有催化作用的有机物，其中绝大多数酶是蛋白质。</p>
<p class="q-n">→ 翻成人话：这句话由<b>四个条件</b>组成——① 活细胞产生（不是从食物里直接拿来用）② 有催化作用 ③ 是有机物 ④ 绝大多数是蛋白质。少写「活细胞产生」或「有机物」都会扣分；「绝大多数」也不能改成「全部」，因为少数酶是 RNA。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 活化能<span class="q-src">人教版（2019）必修1 · 第5章第1节</span></p>
<p class="q-b">酶能降低化学反应的活化能；与无机催化剂相比，酶降低活化能的作用更显著，催化效率更高。</p>
<p class="q-n">→ 翻成人话：这句话有<b>两层比较</b>——① 和无催化剂比，酶能降低活化能；② 和无机催化剂比，酶降得更多、效率更高。注意动词是「降低」不是「提供」：酶不给反应送能量，只是把能垒削低。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 失活与低温<span class="q-src">人教版（2019）必修1 · 第5章第1节</span></p>
<p class="q-b">过酸、过碱或温度过高，会使酶的空间结构遭到破坏，使酶永久失活；低温时酶活性很低，但酶的空间结构稳定。</p>
<p class="q-n">→ 翻成人话：这句话要<b>分两半背</b>——前半句：过酸、过碱、高温 → 空间结构破坏 → 永久失活（不可逆）；后半句：低温 → 活性很低，但结构稳定 → 升温可恢复（可逆）。两半的「活性都低」，但本质完全不同。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>无催化剂</th><th>无机催化剂</th><th>酶</th></tr></thead>
<tbody>
<tr><td>活化能</td><td>不降低</td><td>降低</td><td>降低更显著</td></tr>
<tr><td>催化效率</td><td>—</td><td>较低</td><td>更高</td></tr>
<tr><td>适宜条件</td><td>—</td><td>范围较宽</td><td>温和：常温、常压、近中性</td></tr>
<tr><td>反应前后</td><td>—</td><td>不被消耗</td><td>不被消耗</td></tr>
<tr class="key"><td>平衡点</td><td>不变</td><td>不变</td><td>不变</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只背一行：<b>平衡点</b>。三种情况都不改变平衡点，酶只是让反应更快到达平衡；判断「酶能不能提高产物总量」时，答案永远是不能。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 曲线与实验分析<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">将唾液淀粉酶分别放在 0℃ 和 100℃ 下处理 10 分钟，再都恢复到 37℃，两者的催化能力如何？请分别说明理由。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 抓变量和关键词</p>
<p class="s-b">自变量是「处理温度」，分 0℃ 与 100℃ 两组；因变量是「恢复到 37℃ 后的催化能力」。题干里「再都恢复到 37℃」是关键词——它把问题从「处理时活性高低」变成了「能不能恢复」。</p>
<p class="s-k">用到：自变量 / 因变量 / 可逆与不可逆。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 0℃ 这一组</p>
<p class="s-b">低温下分子运动减慢，酶与底物碰撞的机会减少，活性很低；但低温不会破坏酶的空间结构。温度回到 37℃，结构仍然完好，活性恢复，淀粉仍能被分解。</p>
<p class="s-k">用到：低温只抑制，不变性。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 100℃ 这一组</p>
<p class="s-b">高温使酶的空间结构遭到破坏：肽链伸展、活性部位变形，酶与底物无法正常结合。即使温度降回 37℃，被破坏的空间结构也不能复原，酶永久失活。</p>
<p class="s-k">用到：高温变性，不可逆。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 排除陷阱</p>
<p class="s-b">最容易混的一句是「低温使酶失活」。失活指空间结构被破坏、不能恢复；低温只是抑制，结构没坏。所以答案必须写成「0℃ 组恢复、100℃ 组不恢复」，不能写成「两组都失活」或「两组都恢复」。</p>
<p class="s-k">用到：抑制 ≠ 变性。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 按分点写答案</p>
<p class="s-b">先定性（能否恢复），再给理由（结构是否被破坏），最后下结论（可逆 / 不可逆）。三句话各占一个得分点，不要只写「0℃ 能恢复，100℃ 不能」而不写理由。</p>
<p class="s-k">用到：答题模板：现象 + 本质 + 结论。</p>
</li>
</ol>

<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">① 0℃ 处理的酶：恢复到 37℃ 后有催化能力（活性恢复）。理由：低温只降低酶活性，酶的空间结构稳定，没有变性，升温后可恢复。<br>
② 100℃ 处理的酶：恢复到 37℃ 后没有催化能力（不能恢复）。理由：高温使酶的空间结构遭到破坏，酶永久失活，降温不能复原。<br>
③ 结论：低温对酶是「抑制」，高温对酶是「变性」；前者可逆，后者不可逆。</p>

<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">

<div class="qac">
<p class="q">「低温为什么只是抑制，不是把酶杀死了？」</p>
<p class="a">低温下分子运动减慢、酶与底物碰撞机会减少，活性很低；但低温不会破坏空间结构，升温后活性可恢复。所以低温是<b>可逆抑制</b>，不是变性。</p>

<p class="a">都不会。酶只降低活化能、加快反应速率，缩短达到平衡的时间，<b>不改变平衡点</b>，最终产物量与不加酶时相同。</p>

<p class="q">「酶为什么有专一性？一种酶能催化几种反应？」</p>
<p class="a">酶有特定的空间结构，活性部位只能与特定底物的结构契合，形成酶—底物复合物；结构不契合就催不动。所以一种酶只能催化<b>一种或一类</b>底物的反应。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 低温使酶变性失活，所以 0℃ 下酶已经坏了。</p>
<p class="er-v">✓ 低温时酶活性很低，但酶的空间结构稳定；升温后活性可恢复。</p>
<p class="er-w">错在哪：把「抑制」写成「变性」。低温没破坏结构，属于可逆抑制。</p>
</div>
<div class="er">
<p class="er-x">✗ 酶为反应提供能量，所以反应更容易发生。</p>
<p class="er-v">✓ 酶降低化学反应的活化能，不提供能量。</p>
<p class="er-w">错在哪：降低活化能 ≠ 供能。能量由反应物本身提供，酶只是把能垒削低。</p>
</div>
<div class="er">
<p class="er-x">✗ 加酶能提高产物总量，使平衡向产物方向移动。</p>
<p class="er-v">✓ 酶只加快反应速率，缩短到达平衡的时间，不改变平衡点。</p>
<p class="er-w">错在哪：催化剂不改变平衡常数；加酶只让「更早到」，不让「更多」。</p>
</div>
<div class="er">
<p class="er-x">✗ 酶都是蛋白质。</p>
<p class="er-v">✓ 绝大多数酶是蛋白质，少数酶是 RNA。</p>
<p class="er-w">错在哪：漏掉「绝大多数」。课本用词是「绝大多数」，不能改成「全部」。</p>
</div>
<div class="er">
<p class="er-x">✗ 高温使酶失活后，降温到 37℃ 活性就能恢复。</p>
<p class="er-v">✓ 高温使酶的空间结构遭到破坏，酶永久失活，降温不能恢复。</p>
<p class="er-w">错在哪：高温造成的是不可逆变性；能恢复的是低温抑制，不是高温。</p>

<div class="er">

<script src="../../assets/gx.js"></script>

<script>
/* 互动脚本本体（由 build-page.mjs 包进 <script> 里，所以这里不要写 <script> 标签） */
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var GX = window.GX, el = GX.el, tx = GX.tx, $ = GX.$;
  var stage = $("gxStage");
  if (!stage || !window.AutoPilot) return;

  /* 两套坐标：宽屏 880×470，窄屏独立 360×700 */
  var W = { vb: "0 0 880 470", wide: true,
    left: { x: 16, y: 16, w: 424, h: 438 }, right: { x: 456, y: 16, w: 408, h: 438 } };
  var N = { vb: "0 0 360 700", wide: false,
    left: { x: 8, y: 8, w: 344, h: 300 }, right: { x: 8, y: 320, w: 344, h: 372 } };
  var L = W, A = 5;

  var INK = "#151a21", MID = "#5a6472", FAINT = "#8e97a4";
  var GREEN = "#0f8a5f", BLUE = "#2f6fb3", AMBER = "#b8791f", RED = "#b8402f";

  /* 纯函数：温度 → 活性 / 平衡点。render() 和 __bio.cases 都用它 */
  function calc(v) {
    var T = +v;
    if (!isFinite(T) || T < 0) T = 0;
    if (T > 60) T = 60;
    var act = T <= 37
      ? 100 * Math.pow(T / 37, 1.8)
      : 100 * Math.exp(-Math.pow((T - 37) / 8, 1.6));
    return { T: T, act: act, eq: 100 };
  }

  function fmt(v) { return (Math.round(v * 10) / 10).toFixed(1); }

  function stateOf(T) {
    if (T < 10) return { name: "低温抑制", col: AMBER, bg: "#fdf3e0", sn: "结构稳定，升温可恢复",
      tag: "升温到 37℃：可恢复 ✓", tagCol: GREEN };
    if (T < 35) return { name: "升温增活性", col: GREEN, bg: "#e6f6ee", sn: "正接近最适温度",
      tag: "升温还能继续升活性", tagCol: GREEN };
    if (T <= 39) return { name: "最适温度", col: GREEN, bg: "#e6f6ee", sn: "37℃：活性最高",
      tag: "37℃ 附近：活性最高", tagCol: GREEN };
    if (T <= 48) return { name: "开始变性", col: AMBER, bg: "#fdf3e0", sn: "空间结构开始破坏",
      tag: "持续高温：变性不可逆 ✗", tagCol: AMBER };
    return { name: "变性失活", col: RED, bg: "#fbeae7", sn: "不可逆，降温不恢复",
      tag: "降温到 37℃：不恢复 ✗", tagCol: RED };
  }

  function structOf(T) {
    if (T <= 39) return "完整";
    if (T <= 48) return "开始破坏";
    return "已破坏";
  }

  function notesOf(T) {
    if (T < 10) return ["低温只让分子运动变慢，酶与底物碰撞减少。",
      "空间结构没有破坏，升温后活性可以恢复。", "所以低温叫「抑制」，不叫「变性」。"];
    if (T < 35) return ["温度升高，分子运动加快，酶与底物更容易碰撞。",
      "活性随温度上升，但还没到最高点。", "这段升温不会破坏空间结构。"];
    if (T <= 39) return ["37℃ 附近，酶与底物结合得最顺，活性最高。",
      "最适温度不是固定值：不同酶的最适温度不同。", "超过这个温度，曲线开始往下走。"];
    if (T <= 48) return ["高温使肽链伸展，活性部位开始变形。",
      "此时已有酶分子变性，活性下降。", "高温持续越久，不可逆的部分越多。"];
    return ["空间结构已被破坏，活性部位失效。",
      "这是永久失活：降温到 37℃ 也不恢复。", "曲线只画该温度下的活性，不模拟处理历史。"];
  }

  /* 中文按字数换行，避免长句冲出面板 */
  function wrap(parent, x, y, s, maxW, fs, col, lh) {
    var per = Math.max(6, Math.floor(maxW / fs)), lines = [], cur = "";
    for (var i = 0; i < s.length; i++) { cur += s.charAt(i); if (cur.length >= per) { lines.push(cur); cur = ""; } }
    if (cur) lines.push(cur);
    for (var k = 0; k < lines.length; k++) tx(parent, x, y + k * lh, lines[k], col, "start", fs, 400);
    return lines.length;
  }

  function geo() {
    var P = L.left, w = L.wide;
    var padL = w ? 46 : 38, padR = w ? 18 : 12, padT = w ? 66 : 56, padB = w ? 58 : 40;
    var x0 = P.x + padL, x1 = P.x + P.w - padR, y0 = P.y + padT, y1 = P.y + P.h - padB;
    return {
      P: P, x0: x0, x1: x1, y0: y0, y1: y1,
      X: function (T) { return x0 + (T / 60) * (x1 - x0); },
      Y: function (a) { return y1 - (a / 100) * (y1 - y0); }
    };
  }

  function drawChart(g, s, st) {
    var G = geo(), P = G.P, i, T, pts = [];
    tx(g, P.x + 16, P.y + 26, "温度 → 酶活性", INK, "start", L.wide ? 10.8 : 10.2, 700);
    tx(g, G.x0, G.y0 - 10, "相对活性（%）", MID, "start", 8.4);

    /* 低温区 / 高温区底色 */
    el("rect", { x: G.x0, y: G.y0, width: G.X(25) - G.x0, height: G.y1 - G.y0, fill: "#eef7ff" }, g);
    el("rect", { x: G.X(45), y: G.y0, width: G.x1 - G.X(45), height: G.y1 - G.y0, fill: "#fdeeec" }, g);

    /* 坐标轴 + 刻度 */
    el("line", { x1: G.x0, y1: G.y1, x2: G.x1, y2: G.y1, stroke: "#c9d3dc", "stroke-width": 1 }, g);
    el("line", { x1: G.x0, y1: G.y1, x2: G.x0, y2: G.y0, stroke: "#c9d3dc", "stroke-width": 1 }, g);
    for (i = 0; i <= 100; i += 50) {
      tx(g, G.x0 - 8, G.Y(i) + 3.2, String(i), FAINT, "end", 8.4);
    }
    for (i = 0; i <= 60; i += 10) {
      tx(g, G.X(i), G.y1 + 14, String(i), FAINT, "middle", 8.4);
    }
    tx(g, (G.x0 + G.x1) / 2, G.y1 + 32, "温度 T（℃）", MID, "middle", 8.6);

    tx(g, G.x0 + 4, G.y1 - 8, "低温：可恢复", BLUE, "start", 8.2);
    tx(g, G.x1 - 4, G.y1 - 8, "高温：不可逆", RED, "end", 8.2);

    /* 37℃ 最适标记 */
    el("line", { x1: G.X(37), y1: G.y0, x2: G.X(37), y2: G.y1, stroke: "#9ed3b5", "stroke-width": 1, "stroke-dasharray": "4 4" }, g);
    el("line", { x1: G.x0, y1: G.y0, x2: G.X(37), y2: G.y0, stroke: "#9ed3b5", "stroke-width": 1, "stroke-dasharray": "4 4" }, g);
    el("circle", { cx: G.X(37), cy: G.y0, r: 3.6, fill: "#ffffff", stroke: GREEN, "stroke-width": 1.8 }, g);
    tx(g, G.X(37) + 7, G.y0 + 14, "37℃ 最适", GREEN, "start", 8.4, 700);

    /* 曲线 */
    for (T = 0; T <= 60; T += 0.5) {
      pts.push(G.X(T).toFixed(1) + "," + G.Y(calc(T).act).toFixed(1));
    }
    el("polyline", { points: pts.join(" "), fill: "none", stroke: GREEN, "stroke-width": 2.4 }, g);

    /* 当前温度：竖线 + 点 */
    el("line", { x1: G.X(s.T), y1: G.y0, x2: G.X(s.T), y2: G.y1, stroke: st.col, "stroke-width": 1.2, "stroke-dasharray": "3 4" }, g);
    el("circle", { cx: G.X(s.T), cy: G.Y(s.act), r: 5.2, fill: "#ffffff", stroke: st.col, "stroke-width": 2.4 }, g);

    /* 曲线上的数值锚点（不给文字，避免与标签打架；数值在右侧卡片） */
  }

  function drawInfo(g, s, st) {
    var Q = L.right, x = Q.x, y = Q.y, w = Q.w;
    var track = w - 32, barY = y + 100, valX = x + w - 16;

    tx(g, x + 16, y + 26, "这个温度下，酶怎么样", INK, "start", L.wide ? 10.8 : 10.2, 700);

    el("rect", { x: x + 14, y: y + 36, width: L.wide ? 176 : 160, height: 24, rx: 12, fill: st.bg, stroke: st.col + "55" }, g);
    tx(g, x + 28, y + 52, st.name, st.col, "start", 10, 700);

    tx(g, x + 16, y + 94, "相对活性", MID, "start", 9);
    tx(g, valX, y + 94, fmt(s.act) + "%", INK, "end", 10, 700);
    el("rect", { x: x + 16, y: barY, width: track, height: 8, rx: 4, fill: "#eef2f5" }, g);
    el("rect", { x: x + 16, y: barY, width: Math.max(1.5, track * s.act / 100), height: 8, rx: 4, fill: st.col }, g);

    tx(g, x + 16, y + 138, "空间结构", MID, "start", 9);
    tx(g, valX, y + 138, structOf(s.T), st.col, "end", 9.6, 700);

    tx(g, x + 16, y + 168, "平衡点位置", MID, "start", 9);
    tx(g, valX, y + 168, "100%，不变", GREEN, "end", 9.6, 700);
    tx(g, x + 16, y + 192, "平衡点不随温度改变", FAINT, "start", 8.4);

    var notes = notesOf(s.T), i;
    for (i = 0; i < notes.length; i++) {
      wrap(g, x + 16, y + 220 + i * 13.5, notes[i], w - 32, 8.8, "#3a3a35", 13.5);
    }

    tx(g, x + 16, y + 300, st.tag, st.tagCol, "start", 9.6, 700);
    tx(g, x + 16, y + 330, "酶不改变平衡点，只加快到达平衡。", MID, "start", 8.8);
  }

  function draw() {
    var gA = $("gxA"), gB = $("gxB");
    gA.textContent = ""; gB.textContent = "";
    var s = calc(A), st = stateOf(s.T);
    el("rect", { x: L.left.x, y: L.left.y, width: L.left.w, height: L.left.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    el("rect", { x: L.right.x, y: L.right.y, width: L.right.w, height: L.right.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    drawChart(gA, s, st);
    drawInfo(gB, s, st);
  }

  function render() {
    var s = calc(A), st = stateOf(s.T);
    $("gxVa").textContent = String(Math.round(s.T));
    $("gxVb").textContent = fmt(s.act);
    $("gxVc").textContent = "100";
    $("gxVs").textContent = st.name;
    $("gxVsn").textContent = st.sn;
    $("gxStBox").style.background = st.bg;
    $("gxStBox").style.borderColor = st.col + "44";
    $("gxVs").style.color = st.col;
    draw();
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    /* 开场 1.2s 后就走，2.6s 体检时数值已明显变化；37℃ 停 3 秒，是结论帧 */
    loop: [{ t: 0, v: 5 }, { t: 1.2, v: 5 }, { t: 4, v: 37 }, { t: 7, v: 37 },
      { t: 9.5, v: 55 }, { t: 11.5, v: 45 }, { t: 13, v: 5 }],
    keys: [5, 25, 37, 55],
    value: A, min: 0, max: 60, step: 1,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;

  /* 画布每帧重建节点，click 偶尔丢目标；在不会被清空的父容器上补一次 pointerdown */
  if (stage.parentElement) {
    stage.parentElement.addEventListener("pointerdown", function () { ap.take(); });
  }

  window.__bio = { calc: calc, cases: [
    { v: 0, eq: { act: 0 } },
    { v: 20, eq: { act: 33.0 } },
    { v: 37, eq: { act: 100 } },
    { v: 45, eq: { act: 36.8 } },
    { v: 50, eq: { act: 11.4 } },
    { v: 60, eq: { act: 0.4 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
