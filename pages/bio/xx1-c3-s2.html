<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 血糖平衡的调节<span class="q-src">人教版（2019）选择性必修1 · 第3章第2节</span></p>
<p class="q-b">血糖平衡的调节主要依靠胰岛素和胰高血糖素，二者作用相反。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个条件</b>组成：① 对象是<b>血糖浓度</b>（不是血糖总量）；② 主力是<b>两种激素</b>（不是一种）；③ 关系是<b>作用相反</b>，也就是拮抗。少掉「相反」这一条，就变成了「两种激素都降血糖」，血糖只会单向掉下去，回不来。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 胰岛素的功能<span class="q-src">人教版（2019）选择性必修1 · 第3章第2节</span></p>
<p class="q-b">胰岛素由胰岛 B 细胞分泌，能促进组织细胞摄取、利用和储存葡萄糖，从而降低血糖。</p>
<p class="q-n">→ 翻成人话：这里也有<b>三个条件</b>：① 来源是<b>胰岛 B 细胞</b>（不是 A 细胞）；② 途径是三件事——<b>摄取、利用、储存</b>，缺一个都不完整；③ 结果只有一个方向——<b>降低血糖</b>。答题时把「摄取、利用、储存」三个动词写全，比只写「降血糖」多拿分。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 甲状腺激素的调节<span class="q-src">人教版（2019）选择性必修1 · 第3章第2节</span></p>
<p class="q-b">甲状腺激素分泌存在下丘脑—垂体—甲状腺的分级调节和负反馈调节。</p>
<p class="q-n">→ 翻成人话：一句话里塞了<b>两套机制</b>：① <b>分级调节</b>——下丘脑→垂体→甲状腺，三级依次指挥；② <b>负反馈调节</b>——甲状腺激素多了，回头<b>抑制</b>下丘脑和垂体。少掉第二套，激素就会一直往上冲，停不下来。</p>
</div>

<div style="overflow-x:auto">

<tr class="key"><td>作用方向</td><td>降低血糖</td><td>升高血糖</td></tr>

<p class="gx-note">整张表只高亮 1 行：「作用方向」是全部推理的地基，其余四行都是它的推论。背法：<b>B 降 A 升</b>——字母 B 像「瘪下去」，A 像「往上顶」，一个降一个升，方向别写反。</p>

<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题：把「原因」和「结果」分开写</p>
<p class="s-b">原因（刺激）：血糖浓度升高。结果（效应）：胰岛素↑、胰高血糖素↓，血糖回落到正常范围。先别急着写名字，先把这条因果链摆出来。</p>
<p class="s-k">用到：血糖平衡的调节主要依靠胰岛素和胰高血糖素，二者作用相反。</p>

<li class="step" hidden>

<p class="s-b">结果是血糖<b>下降</b>，而最初的原因是血糖<b>升高</b>——结果把原因<b>减弱</b>了，而不是加强。这一步是判据，不能跳。</p>

<p class="s-b">结果抑制原因 → 负反馈调节。同时这个过程中有激素参与，所以完整表述是「（神经—）体液调节中的负反馈调节」；只写「激素调节」漏了反馈这一层。</p>

<p class="er-w">错在哪：细胞记混。B 细胞对血糖升高敏感、分泌胰岛素；A 细胞对血糖降低敏感、分泌胰高血糖素。</p>

<p class="er-w">错在哪：正反馈是结果加强原因（如分娩、血液凝固），会越推越远；能把血糖拉回正常范围的只能是负反馈。</p>
