<p class="gx-claim">一句话说清本节最该记住的判断：<b>基因在 X 上，就跟着 X 走</b>；男性只有一条 X，所以伴 X 隐性病<b>男多于女、交叉遗传、男患者的致病基因只传女儿</b>。</p>
<div class="gx-meta">
<span><i></i>人教版（2019）必修2 第2章第3节</span>

<span><i></i>含 1 个互动模型</span>

<p class="gx-lede">这一节把「基因在染色体上」落到最后一步：基因如果坐在性染色体上，遗传比例就会随性别分开算，于是出现「男女发病率不一样」这种常染色体遗传给不出的结果。全节只有一个核心机制——男性 X 只有一条、Y 上没有对应等位基因，所有结论都是它的推论。最容易错的一件事：把伴性遗传当成普通一对等位基因，基因型只写 Bb，不写 X、Y。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 伴性遗传<span class="q-src">人教版（2019）必修2 · 第2章第3节</span></p>
<p class="q-b">位于性染色体上的基因，其遗传上总是和性别相关联，这种现象叫做伴性遗传。人类的红绿色盲、抗维生素D佝偻病、血友病等都属于伴性遗传。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个条件</b>组成——① 基因位于性染色体上（X 或 Y），不是随便一条常染色体；② 遗传<b>总是</b>和性别相关联，即男女发病率、传递路线不一样；③ 它仍然是基因，仍服从分离定律，只是把 X、Y 当成一对「形态不同」的同源染色体来看。少一个条件就不叫伴性遗传：基因在常染色体上、只是碰巧男女发病不同（如从性遗传），不算。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 红绿色盲的基因位置<span class="q-src">人教版（2019）必修2 · 第2章第3节</span></p>
<p class="q-b">红绿色盲基因位于 X 染色体上，Y 染色体上没有相应的等位基因，属于伴 X 隐性遗传。</p>
<p class="q-n">→ 翻成人话：关键就是<b>「Y 上没有等位基因」</b>这半句。男性只有一条 X，X 上带 b 就直接发病（写 <span class="gx-fml">XbY</span>），没有第二条 X 来遮盖；女性有两条 X，必须 <span class="gx-fml">XbXb</span> 才发病，<span class="gx-fml">XBXb</span> 只是携带者、表现正常。于是 男性患者多于女性——这是伴 X 隐性遗传最硬的结论，不是「碰巧」。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 伴 X 隐性的特点<span class="q-src">人教版（2019）必修2 · 第2章第3节</span></p>
<p class="q-b">伴 X 隐性遗传病：男性患者多于女性患者；女性患者的父亲和儿子一定患病。</p>
<p class="q-n">→ 反着推一遍：女性患者 <span class="gx-fml">XbXb</span> 的两条 X，一条来自父亲、一条来自儿子，所以父亲必是 <span class="gx-fml">XbY</span>、儿子也必是 <span class="gx-fml">XbY</span>。但倒过来不成立：男性患者的致病基因<b>只传给女儿</b>，儿子从他这里拿的是 Y。所以「男多于女」和「不会父子相传」是同一件事的两面。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>伴 X 隐性</th><th>伴 X 显性</th><th>伴 Y 遗传</th></tr></thead>
<tbody>
<tr><td>基因位置</td><td>X 的非同源区段</td><td>X 的非同源区段</td><td>Y 的非同源区段</td></tr>
<tr><td>典型实例</td><td>红绿色盲、血友病</td><td>抗维生素D佝偻病</td><td>外耳道多毛症</td></tr>
<tr><td>男女发病率</td><td>男性患者多于女性</td><td>女性患者多于男性</td><td>只有男性患病</td></tr>
<tr class="key"><td>传递特征</td><td>交叉遗传：外祖父→母亲→外孙；男患者的致病基因只传女儿</td><td>连续遗传：男患者的女儿全部患病</td><td>父传子、子传孙，世代连续且只有男性</td></tr>
<tr><td>基因型写法</td><td><span class="gx-fml">XbY</span>、<span class="gx-fml">XBXb</span>（必须带 X/Y）</td><td><span class="gx-fml">XDY</span>、<span class="gx-fml">XDXd</span></td><td>Y 上带致病基因，X 上无等位基因</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">背法：伴 X 隐性记<b>「男多女少、交叉遗传、母传子」</b>；伴 X 显性记<b>「女多男少、父传女」</b>；伴 Y 记<b>「父传子、只有男」</b>。无论哪一种，写基因型时 X、Y 必须写出来——只写 Bb 一律按错处理，因为丢掉的正是「基因在性染色体上」这个前提。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 系谱推断 + 概率计算<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">一对表现型正常的夫妇，生了一个患红绿色盲的儿子。回答：(1) 这对夫妇的基因型；(2) 若再生一个孩子，是色盲的概率；(3) 若再生一个男孩，是色盲的概率。<b>注意 (2) 与 (3) 问的不是同一件事。</b></p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 定性：病在哪条染色体上</p>
<p class="s-b">双亲正常、儿子患病 → 致病基因是<b>隐性</b>（若是显性，父母至少一人患病）。又因为患病的是儿子、父亲正常——若基因在 Y 上，父亲必然患病，矛盾。所以只能是伴 X 隐性，儿子的基因型为 <span class="gx-fml">XbY</span>。</p>
<p class="s-k">用到：伴 X 隐性判断口诀——"无中生有是隐性，隐性看女病，女病男正非伴性"；本题无女患者，靠"父正常而子患病"排除伴 Y。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 写基因型（必须带 X/Y）</p>
<p class="s-b">儿子的 Y 来自父亲、X 来自母亲，所以母亲的 X 上带 b：父亲 <span class="gx-fml">XBY</span>、母亲 <span class="gx-fml">XBXb</span>、儿子 <span class="gx-fml">XbY</span>。母亲表现正常，是<b>携带者</b>。这一步只写 Bb 就丢了"基因在 X 上"这个前提，直接扣分。</p>
<p class="s-k">用到：男性 X 只来自母亲、Y 只来自父亲；女性一条 X 来自父亲、一条来自母亲。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 展开子代</p>
<p class="s-b">母亲 <span class="gx-fml">XBXb</span> 产生 XB、Xb 两种卵细胞（各 1/2），父亲 <span class="gx-fml">XBY</span> 产生 XB、Y 两种精子（各 1/2）。组合得：<span class="gx-fml">XBXB</span>（女，正常）1/4、<span class="gx-fml">XBXb</span>（女，携带者）1/4、<span class="gx-fml">XBY</span>（男，正常）1/4、<span class="gx-fml">XbY</span>（男，色盲）1/4。</p>
<p class="s-k">用到：分离定律 + 性染色体组合，男女各占 1/2。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 第 (2) 问：再生一个孩子</p>
<p class="s-b">"再生一个孩子"没有限定性别，四种组合等概率，色盲只占 <span class="gx-fml">XbY</span> 这一种，所以概率是 <b>1/4</b>。其中女孩 0 患病（1/2 为携带者），男孩 1/2 患病。</p>
<p class="s-k">用到：所有子代一起算，分母是 4。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 第 (3) 问：再生一个男孩</p>
<p class="s-b">已经限定是男孩，样本空间缩小到 XBY 与 <span class="gx-fml">XbY</span> 两种，各 1/2，所以患病概率是 <b>1/2</b>，不是 1/4。同理"生一个色盲男孩"仍是 1/4（既要是男孩又要是色盲）。</p>
<p class="s-k">用到：条件概率——先看清"孩子"还是"男孩"，这一字之差是本类题最大的陷阱。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>

</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">(1) 该病为伴 X 隐性遗传。父亲 <span class="gx-fml">XBY</span>，母亲 <span class="gx-fml">XBXb</span>，患病儿子 <span class="gx-fml">XbY</span>。<br>
(2) 再生一个孩子是色盲的概率为 1/4（四种组合等概率，仅 <span class="gx-fml">XbY</span> 患病）。<br>
(3) 再生一个男孩是色盲的概率为 1/2（男孩中 <span class="gx-fml">XBY</span> : <span class="gx-fml">XbY</span> = 1 : 1）。<br>
(4) 女儿全部表现正常，其中 1/2 为携带者 <span class="gx-fml">XBXb</span>；男性患者的致病基因只传给女儿。</p>
