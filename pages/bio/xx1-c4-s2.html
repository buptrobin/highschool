<span><i></i>人教版（2019）选择性必修1 第4章第2节</span>

<p class="gx-lede">第1节讲的是「谁在守门」——皮肤、黏膜、吞噬细胞、溶菌酶，那是不分对象的非特异性免疫。本节讲「认出具体敌人之后怎么打」：体液免疫用抗体在体液中解决细胞外的病原体，细胞免疫用细胞毒性 T 细胞去拆掉已经被感染的靶细胞。整节最容易丢分的一步，是把「识别抗原」和「分泌抗体」这两件事装到了同一个细胞身上——浆细胞只做后一件。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 特异性免疫的组成<span class="q-src">人教版（2019）选择性必修1 · 第4章第2节</span></p>
<p class="q-b">特异性免疫包括体液免疫和细胞免疫，主要由淋巴细胞完成。</p>
<p class="q-n">→ 翻成人话：这句话由<b>两个条件</b>组成——① 对象是「特定抗原」，不是随便什么异物；② 执行者是<b>淋巴细胞</b>（B 细胞、T 细胞），不是吞噬细胞。少一个条件就退回非特异性免疫：吞噬细胞也能吃掉病原体，但它不认识「这是麻疹病毒」，换一种病原体它照样吞。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 体液免疫的过程<span class="q-src">人教版（2019）选择性必修1 · 第4章第2节</span></p>
<p class="q-b">体液免疫中，B 细胞受抗原刺激后增殖分化为浆细胞和记忆细胞，浆细胞分泌抗体。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个条件</b>组成——① 刺激必须是<b>抗原</b>（还要辅助性 T 细胞的信号）；② B 细胞一分为二，一条路走<b>浆细胞</b>、一条路走<b>记忆细胞</b>；③ 只有浆细胞能<b>分泌抗体</b>。漏掉任何一个都会写成「B 细胞分泌抗体」，这是本节最高频的错句。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 二次免疫反应<span class="q-src">人教版（2019）选择性必修1 · 第4章第2节</span></p>
<p class="q-b">二次免疫反应比初次更快、更强，因为记忆细胞能迅速增殖分化。</p>
<p class="q-n">→ 翻成人话：注意「因为」后面跟的是<b>记忆细胞</b>，不是「抗体还留在体内」。初次免疫之后抗体浓度会掉下来，留下来的是一群记住这个抗原的淋巴细胞；再次接触同种抗原时它们不从头启动，直接加速分化，所以第 1~2 天就能堆出大量抗体。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>体液免疫</th><th>细胞免疫</th></tr></thead>
<tbody>
<tr><td>主要细胞</td><td>B 细胞、辅助性 T 细胞</td><td>细胞毒性 T 细胞</td></tr>
<tr><td>效应物质</td><td>浆细胞分泌的<b>抗体</b></td><td>不靠抗体，靠细胞本身</td></tr>
<tr><td>作用对象</td><td>细胞外的抗原（体液中的病原体、毒素）</td><td>被病原体感染的靶细胞、癌细胞</td></tr>
<tr><td>怎么起作用</td><td>抗体与抗原结合，形成沉淀或细胞集团，再被吞噬细胞吞噬消化</td><td>效应 T 细胞与靶细胞密切接触，使靶细胞裂解死亡</td></tr>
<tr class="key"><td>一句话记</td><td>靠「分子」——抗体在<b>体液</b>中起作用</td><td>靠「接触」——细胞直接贴上去，抗体帮不上忙</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">背法：先看「病原体在哪儿」。还在细胞外游荡 → 体液免疫用抗体收拾；已经钻进细胞里 → 抗体进不去，只能让细胞免疫把这座「房子」拆了，暴露出来的病原体再交给抗体。整张表只高亮一行：真正的区别是<b>靠分子还是靠接触</b>。口径提醒——浆细胞不能识别抗原，它只是抗体工厂。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 二次免疫与疫苗<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">患过麻疹的人一般不会再患麻疹，而有些疫苗需要接种加强针。请回答：（1）从免疫细胞的角度解释，为什么患过麻疹的人一般不会再患麻疹？（2）说明接种加强针的免疫学依据。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性</p>
<p class="s-b">两问其实是同一个模型：<b>二次免疫反应</b>。判据只有一个——体内有没有留下针对该抗原的记忆细胞。题目里「一般不会」「加强针」都是在问二次应答，不是问抗体浓度一直很高。</p>
<p class="s-k">用到：二次免疫反应的三个特征——更快、更强、靠记忆细胞。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 拆第一问的前半段</p>
<p class="s-b">患过麻疹 = 发生过一次完整的初次免疫。B 细胞受抗原刺激后增殖分化为浆细胞和记忆细胞，浆细胞分泌抗体把麻疹病毒清除，抗体浓度随后下降，但<b>记忆细胞留存下来</b>。</p>
<p class="s-k">用到：体液免疫中 B 细胞的分化方向有两条，一条是浆细胞，一条是记忆细胞。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 接上「再次接触」这一步</p>
<p class="s-b">麻疹病毒再次侵入时，记忆细胞迅速增殖分化，产生大量浆细胞，浆细胞分泌大量抗体；反应比初次更快、更强，病毒在造成明显症状前就被清除，所以一般不再患病。</p>
<p class="s-k">用到：<b>浆细胞不能识别抗原，只分泌抗体</b>；识别抗原并「记住」它的是 B 细胞和记忆细胞。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 第二问：加强针在加什么</p>
<p class="s-b">接种疫苗相当于一次不致病的人工初次免疫，产生抗体和记忆细胞。隔一段时间再接种，等于让记忆细胞再扩增一批、抗体水平再抬一次——记忆细胞数量更多、抗体更高，保护更持久。</p>
<p class="s-k">用到：记忆细胞数量决定二次应答的上限，所以加强针的价值在「多留档案」，不是「多打点抗体进去」。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 组织答案</p>
<p class="s-b">把上面四步压成两小问的分点答案，每点一个术语，不写「免疫力变强了」这种空话。写完回头检查：有没有把「抗体」写成「抗原」，有没有让浆细胞去识别抗原。</p>
<p class="s-k">用到：答题语言必须落到细胞名称和过程名称上。</p>
</li>
</ol>

<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">

<div class="qac">
<p class="q">浆细胞能识别抗原吗？</p>
<p class="a">不能。<b>浆细胞不能识别抗原，只分泌抗体</b>——它表面没有识别抗原的受体，是 B 细胞接受抗原刺激后分化出来的「抗体工厂」。识别抗原的是 B 细胞、辅助性 T 细胞、细胞毒性 T 细胞和记忆细胞。</p>

<p class="q">抗体在哪儿起作用？</p>
<p class="a">在<b>体液</b>中。抗体由浆细胞分泌到细胞外，随体液运输，与细胞外的抗原结合，形成沉淀或细胞集团，再被吞噬细胞吞噬消化。抗体进不到细胞里面，所以对付胞内病原体要靠细胞免疫。</p>

<div class="qac">
<p class="q">二次免疫为什么快、为什么强？</p>
<p class="a">因为<b>记忆细胞</b>。初次免疫后记忆细胞留存，再次接触同种抗原时它<b>迅速增殖分化</b>成大量浆细胞，抗体来得早、来得高。注意「同种」二字：换一种抗原，旧的记忆细胞不认。</p>

<p class="a">针对<b>已经被病原体感染的靶细胞</b>（以及癌细胞、移植器官的细胞）。细胞毒性 T 细胞与靶细胞密切接触，使靶细胞裂解死亡，病原体暴露后再由抗体或吞噬细胞处理。整个过程中没有抗体参与。</p>
