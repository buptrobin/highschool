<p class="gx-lede">这一节是第4章的落地：前三节讲免疫系统「怎么工作」，这一节讲人类拿它「怎么用」——用疫苗提前演练，用免疫抑制剂换取移植成功，用足够比例的人群免疫把传染病堵住，再用抗原/抗体检测回头看机体遇到过什么。最容易错的一件事：把疫苗当成「注射抗体」，一句话就把主动免疫写成了被动免疫。下面每一条都按「抗原进 → 机体自己产 → 留下记忆」这条线走。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 疫苗<span class="q-src">人教版（2019）选择性必修1 · 第4章第4节</span></p>
<p class="q-b">疫苗是用微生物或其代谢产物制成的生物制品，接种后可刺激机体产生特异性免疫。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个条件</b>组成 —— ① 疫苗的成分是<b>抗原</b>（病原体本身、它的代谢产物或能表达抗原的载体），不是抗体；② 它的动作是「<b>刺激</b>」，机体自己产生抗体和记忆细胞，<b>不是直接注射抗体</b>；③ 产出是<b>特异性免疫 + 记忆细胞</b>，所以接种后要过 1–2 周才有保护力，也所以能维持很久。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 器官移植<span class="q-src">人教版（2019）选择性必修1 · 第4章第4节</span></p>
<p class="q-b">器官移植成功的主要障碍是免疫排斥反应，需使用免疫抑制剂。</p>
<p class="q-n">→ 翻成人话：也是<b>三个条件</b> —— ① 障碍来自<b>受者自己的免疫系统</b>把移植物表面的移植抗原当成「非己」；② 执行排斥的主要是<b>细胞免疫</b>（细胞毒性T细胞直接裂解供者细胞），不是体液免疫；③ 免疫抑制剂的作用是<b>抑制</b>免疫，不是增强免疫，代价是感染和肿瘤风险升高，所以它换的是「成活率」不是「治愈」。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 群体免疫<span class="q-src">人教版（2019）选择性必修1 · 第4章第4节</span></p>
<p class="q-b">当人群中有足够比例的人具有免疫力时，传染病就不容易在人群中传播，这称为群体免疫。</p>
<p class="q-n">→ 翻成人话：还是<b>三个条件</b> —— ① 免疫力要覆盖<b>足够比例</b>的人，不是「一部分人打了就行」；② 这个比例由病原体的传播能力决定，阈值约为 <span class="gx-fml">1 − 1/R₀</span>，R₀ 越大阈值越高；③ 剩下没有免疫力的人是被这道「人墙」间接保护，不是自己变强了。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>疫苗（主动免疫）</th><th>直接注射抗体（被动免疫）</th></tr></thead>
<tbody>
<tr><td>进入体内的是什么</td><td>抗原（病原体、其代谢产物或载体）</td><td>现成的抗体（如抗毒素血清）</td></tr>
<tr><td>抗体由谁产生</td><td>机体自己的浆细胞</td><td>不用机体产生，从体外输入</td></tr>
<tr><td>起效时间</td><td>较慢，通常 1–2 周</td><td>立即起效，用于紧急预防或治疗</td></tr>
<tr><td>维持时间</td><td>长，可达数年甚至终身</td><td>短，抗体被分解后保护消失</td></tr>
<tr class="key"><td>有没有记忆细胞</td><td>有：再次接触同种抗原反应更快更强</td><td>无：不产生免疫记忆，也不改变免疫状态</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">全表只高亮 1 行。判「疫苗」还是「注射抗体」，只看一句：<b>抗体是谁产生的</b>——机体自己产的是疫苗（主动免疫），外面输进来的是被动免疫。另外两句口径一起记住：移植排斥按<b>细胞免疫</b>答，群体免疫按<b>足够比例</b>答。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 群体免疫阈值的计算与解释<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">麻疹的 R₀ 约为 12–18，而某种传染病 R₀ 约为 3。为什么麻疹疫苗需要覆盖约 95% 的人群，而后者约 70% 就够？请写出推算过程，并说明「疫苗本身效果好不好」是不是这个差异的原因。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题/定性</p>
<p class="s-b">题目问的是「覆盖率要求为什么不同」，落点是<b>群体免疫阈值</b>，不是疫苗质量。先决条件：R₀ 越大的病，一个人能传给越多的人，越难挡。</p>
<p class="s-k">用到：群体免疫需要足够比例的人有免疫力。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 写公式，把「阈值」变成可以算的数</p>
<p class="s-b">有效传染数 <span class="gx-fml">R = R₀(1 − p)</span>，p 是有免疫力的人所占比例。要让传播萎缩，必须 <span class="gx-fml">R &lt; 1</span>，解得 <span class="gx-fml">p &gt; 1 − 1/R₀</span>，这个下限就是群体免疫阈值。</p>
<p class="s-k">用到：R 的含义是「一个感染者平均能传染几个人」。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 代麻疹的 R₀</p>
<p class="s-b">取 R₀ ≈ 15，阈值 = <span class="gx-fml">1 − 1/15 ≈ 93.3%</span>；R₀ 取 12–18 时阈值约在 92%–94.4%；又因疫苗保护率达不到 100%，实际覆盖率还要略高于这个阈值，所以公共卫生上按约 95% 来要求。</p>
<p class="s-k">用到：R₀ 越大，1 − 1/R₀ 越接近 1。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 代 R₀ = 3 的病</p>
<p class="s-b">阈值 = <span class="gx-fml">1 − 1/3 ≈ 66.7%</span>，即约 70% 的人有免疫力就够 —— 与互动模型里 p = 67 时 R 刚降到 1 以下是同一件事。</p>
<p class="s-k">用到：阈值只由传播能力决定，和疫苗的「好坏」不是同一件事。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口，避开陷阱</p>
<p class="s-b">陷阱在最后一问：覆盖率要求不同<b>不能</b>推出「麻疹疫苗效果差」。差异来自病原体的传播能力（R₀），疫苗的作用机制仍是刺激机体自己产生抗体和记忆细胞，两者是不同层面的问题。</p>
<p class="s-k">用到：疫苗原理与群体免疫阈值是两个独立的判据。</p>
</li>
</ol>

<p class="ans-b">① 群体免疫阈值约为 <span class="gx-fml">1 − 1/R₀</span>：由 <span class="gx-fml">R = R₀(1 − p) &lt; 1</span> 解得 <span class="gx-fml">p &gt; 1 − 1/R₀</span>。<br>② 麻疹 R₀ ≈ 12–18，阈值 ≈ 92%–94%，故需覆盖约 95% 的人群。<br>③ R₀ ≈ 3 的传染病，阈值 = 1 − 1/3 ≈ 66.7%，覆盖约 70% 即可。<br>④ 两者差异来自病原体传播能力不同，不能说明麻疹疫苗效果差；疫苗的作用都是刺激机体产生抗体和记忆细胞，形成免疫力。</p>

<h2><span class="sn">06</span>易错清单</h2>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 疫苗就是注射抗体，打了就马上有抗体。</p>

<p class="er-w">错在哪：把主动免疫写成被动免疫。疫苗给的是抗原，不是抗体，也不「马上」起效。</p>
</div>
<div class="er">
<p class="er-x">✗ 器官移植的排斥反应属于体液免疫，是抗体攻击移植物。</p>
<p class="er-v">✓ 排斥反应主要由细胞免疫介导：受者的细胞毒性T细胞识别移植抗原，增殖分化后裂解供者细胞。</p>
<p class="er-w">错在哪：排斥的执行者是细胞毒性T细胞，不是抗体；答题写「抗体结合」直接丢分。</p>
</div>
<div class="er">
<p class="er-x">✗ 免疫抑制剂能增强免疫力，帮助病人挺过移植。</p>
<p class="er-v">✓ 免疫抑制剂抑制T细胞的增殖与功能，降低排斥反应，提高移植成活率；代价是感染与肿瘤风险升高。</p>
<p class="er-w">错在哪：作用方向反了。它是「压免疫」，不是「补免疫」。</p>
</div>
<div class="er">
<p class="er-x">✗ 只要有一部分人打了疫苗，就形成群体免疫了。</p>
<p class="er-v">✓ 人群中具有免疫力的人需达到足够比例（阈值约为 1 − 1/R₀），传染病才不容易在人群中传播。</p>
<p class="er-w">错在哪：把「有人免疫」当成「足够比例」。比例不够，R 仍大于 1，传播照样扩大。</p>
</div>
<div class="er">
<p class="er-x">✗ 所有疫苗的覆盖率要求都一样，都是 95%。</p>
<p class="er-v">✓ 覆盖率要求由病原体的 R₀ 决定：麻疹 R₀ 约 12–18，阈值约 95%；R₀ 约 3 的传染病，阈值约 66.7%。</p>

</div>
<div class="er">
<p class="er-x">✗ 接种疫苗后就不需要免疫系统了，抗体自己会打仗。</p>
<p class="er-v">✓ 疫苗只是让机体提前产生抗体和记忆细胞；真正清除病原体仍靠免疫系统，免疫记忆也由免疫细胞维持。</p>
<p class="er-w">错在哪：疫苗是「演习」，不是「替身」；免疫系统始终是执行者。</p>
</div>
<div class="er">
