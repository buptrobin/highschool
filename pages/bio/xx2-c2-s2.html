<p class="gx-claim">一句话说清本节最该记住的判断：划分群落类型看<b>外貌和物种组成</b>，而荒漠、草原、森林三大类型的分水岭是<b>水分</b>。</p>
<div class="gx-meta">
<span><i></i>人教版（2019）选择性必修2 第2章第2节</span>
<span><i></i>高二 · 群落的主要类型</span>
<span><i></i>阅读 12 分钟</span>
<span><i></i>含 1 个互动模型</span>
</div>
<p class="gx-lede">上一节讲群落的物种组成、种间关系、空间结构，这一节把这些特征打包成「类型」：先按外貌和物种组成把群落分类，再看是什么气候条件把三类群落分开。最容易错的一件事：把「温度决定三类群落」当成结论背下来——课本说的是水分条件，温度只解释同一种类型内部的差异（比如同样是森林，有热带雨林也有寒温带针叶林）。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 群落的类型<span class="q-src">人教版（2019）选择性必修2 · 第2章第2节</span></p>
<p class="q-b">根据群落的外貌和物种组成等方面的差异，可以将群落划分为不同类型的生物群落。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个条件</b>组成：①看外貌（季相、分层、植株高矮、盖度）；②看物种组成（有哪些种、谁占优势）；③两者合起来才能定类型。少掉「外貌」只用物种名单，就会把热带雨林和常绿阔叶林混成一类。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 三类群落的分界<span class="q-src">人教版（2019）选择性必修2 · 第2章第2节</span></p>
<p class="q-b">荒漠生物群落、草原生物群落、森林生物群落的主要区别在于水分条件。</p>
<p class="q-n">→ 翻成人话：这里只有<b>一个判据</b>——水分。答题时不要说「温度不同」「纬度不同」，那是原因的原因；课本把区别落在水分条件上，因为水分直接决定植被盖度和能否长成乔木。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 类型与气候<span class="q-src">人教版（2019）选择性必修2 · 第2章第2节</span></p>
<p class="q-b">群落的类型与气候（尤其降水量和温度）密切相关。</p>
<p class="q-n">→ 翻成人话：气候有<b>两个变量</b>：降水量和温度。三大类型之间主要看降水量；同一类型内部再按温度细分（热带雨林 / 温带落叶阔叶林 / 寒温带针叶林）。两个变量各管一层，别用一个变量包打天下。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>荒漠生物群落</th><th>草原生物群落</th><th>森林生物群落</th></tr></thead>
<tbody>
<tr><td>年降水量</td><td>不足 300 mm</td><td>300–600 mm</td><td>超过 600 mm</td></tr>
<tr><td>植被盖度</td><td>很低，地表大片裸露</td><td>中等，草本连片</td><td>高，林冠相接</td></tr>
<tr><td>外貌</td><td>植株稀疏、矮小</td><td>草本为主，季相变化明显</td><td>乔木为主，分层明显</td></tr>
<tr class="key"><td>真正的区别</td><td>水分最少，植物耐旱</td><td>水分居中，乔木长不起来</td><td>水分最多，能维持乔木</td></tr>
<tr><td>代表生物</td><td>仙人掌、骆驼刺、沙蜥</td><td>羊草、针茅、黄鼠</td><td>栎、松、猕猴、林下蕨类</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只高亮 1 行：三类群落的分界是<b>水分条件</b>，不是温度。温度只用来在同一类型内部再分（热带雨林 / 温带落叶阔叶林 / 寒温带针叶林），这一点写进答案能加分，写成「温度决定三类群落」会扣分。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 原因分析类简答<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">我国东部沿海到西北内陆，群落类型依次出现森林、草原、荒漠。请回答：（1）这一变化主要体现了什么因素对群落类型的影响？（2）从东到西，为什么会依次出现这三类群落？（3）有人在森林边缘过度放牧后，发现草地扩大、乔木幼苗减少，这说明了什么？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性</p>
<p class="s-b">题干给的是「从东到西」的空间序列，不是时间序列。东→西唯一单调变化的因素是距海远近带来的降水量，所以第（1）问锁定水分条件，不要答温度。</p>
<p class="s-k">用到：荒漠、草原、森林的主要区别在于水分条件。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 把降水落到数值上</p>
<p class="s-b">东部沿海年降水量大，超过 600 mm，水分足以维持乔木，形成森林；往西降水减少到 300–600 mm，乔木长不起来，草本占优势，成为草原；再往西不足 300 mm，连草本都稀疏，成为荒漠。</p>
<p class="s-k">用到：盖度随降水下降；300 mm、600 mm 是两条分界。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 补上「为什么是水分」</p>
<p class="s-b">水分直接决定植物能否存活、能长多高：乔木耗水多，草原植物耐旱，荒漠植物靠深根和小叶省水。所以三类群落的外貌差异，根源在水分条件，温度只解释同类型内部的分化。</p>
<p class="s-k">用到：群落类型与气候密切相关，但三类之间看水分。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 处理第（3）问的陷阱</p>
<p class="s-b">放牧是把草本啃掉、把乔木幼苗踩死，等于人为改变了群落的物种组成和结构，类型就朝草原方向偏。这说明群落类型不是固定不变的，外界干扰或气候改变都会让它变。</p>
<p class="s-k">用到：群落类型不是固定不变，可发生演替。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 写答案前的检查</p>
<p class="s-b">三问分别对应「判据 → 机理 → 可变性」，别把三问答成同一句话。检查有没有把「温度决定三类群落」写进去，有就删掉。</p>
<p class="s-k">用到：三个扣分点逐条对照。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>

</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）主要体现了<b>水分条件</b>对群落类型的影响（降水量由东向西逐渐减少）。<br>（2）东部沿海降水多（超过 600 mm），水分充足，能维持高大乔木，形成<b>森林</b>；向西降水减少到 300–600 mm，水分不足以维持乔木，草本植物占优势，形成<b>草原</b>；再向西降水不足 300 mm，植物稀疏、地表裸露，形成<b>荒漠</b>。即水分条件是划分三类群落的关键。<br>（3）说明<b>群落类型不是固定不变的</b>：过度放牧改变了物种组成和群落结构，使群落向草原方向变化；人类活动、气候变化都可能引起群落类型的改变（演替）。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">

<div class="er">
<p class="er-x">✗ 荒漠、草原、森林的差异是由温度决定的。</p>
<p class="er-v">✓ 荒漠生物群落、草原生物群落、森林生物群落的主要区别在于水分条件。</p>
<p class="er-w">错在哪：把「气候影响群落」直接等同于温度。三类群落的分界是水分，温度只在同一类型内部再分。</p>
</div>

<div class="er">
<p class="er-x">✗ 草原就是草多的地方，校园里的草坪也是草原群落。</p>
<p class="er-v">✓ 草原生物群落分布在年降水量 300–600 mm 的地区，以多年生草本为主，没有乔木层。</p>
<p class="er-w">错在哪：把「有草」当成判据。草原是自然群落类型，看的是降水条件、优势种和结构，人工草坪不是草原生物群落。</p>
</div>

<div class="er">
