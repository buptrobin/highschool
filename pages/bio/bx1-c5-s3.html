<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 有氧呼吸的总反应式<span class="q-src">人教版（2019）必修1 · 第5章第3节</span></p>
<p class="q-b">C₆H₁₂O₆ + 6O₂ + 6H₂O →（酶）6CO₂ + 12H₂O + 能量</p>
<p class="q-n">→ 翻成人话：这条式子要同时满足<b>三个条件</b>——① 反应物里除了葡萄糖，还有 6 分子 H₂O 参加；② 生成物是 6CO₂ + 12H₂O，生成的水里的氧全部来自 O₂；③ 整个过程需要酶催化、分三个阶段进行，能量不是一次性放完的。少一个条件，式子配不平，答题也写不对。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 有氧呼吸三个阶段的场所<span class="q-src">人教版（2019）必修1 · 第5章第3节</span></p>
<p class="q-b">有氧呼吸的第一阶段在细胞质基质中进行，第二阶段在线粒体基质中进行，第三阶段在线粒体内膜上进行。</p>
<p class="q-n">→ 翻成人话：这句话只回答<b>一个条件</b>——「在哪做」。但它是本节最容易扣分的地方：只有第二、三阶段在线粒体里，<b>第一阶段在细胞质基质，不在线粒体</b>。顺着场所往下记：第一阶段葡萄糖→丙酮酸+[H]+少量 ATP；第二阶段丙酮酸+H₂O→CO₂+[H]+少量 ATP；第三阶段 [H]+O₂→H₂O+大量 ATP。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 无氧呼吸<span class="q-src">人教版（2019）必修1 · 第5章第3节</span></p>
<p class="q-b">无氧呼吸在细胞质基质中进行，产物是酒精和 CO₂，或者乳酸；无氧呼吸只在第一阶段释放少量能量。</p>
<p class="q-n">→ 翻成人话：这句话有<b>两个条件</b>——① 全过程都在细胞质基质，一步也不进线粒体；② 只在第一阶段释放少量能量、生成少量 ATP，<b>第二阶段（丙酮酸→酒精+CO₂ 或 →乳酸）不产生 ATP</b>。产物是酒精还是乳酸，由细胞里的酶决定，不由「有没有 O₂」决定。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>有氧呼吸</th><th>无氧呼吸</th></tr></thead>
<tbody>
<tr><td>场所</td><td>细胞质基质（第一阶段）→ 线粒体基质 → 线粒体内膜</td><td>全过程在细胞质基质</td></tr>
<tr><td>反应物</td><td>葡萄糖、O₂、H₂O</td><td>葡萄糖（不消耗 O₂）</td></tr>
<tr><td>产物</td><td>CO₂、H₂O</td><td>酒精 + CO₂，或乳酸</td></tr>
<tr class="key"><td>有机物分解程度</td><td>彻底氧化分解，能量全部释放</td><td>不彻底分解，大部分能量留在酒精或乳酸中</td></tr>
<tr><td>ATP 从哪来</td><td>三个阶段都有，第三阶段最多</td><td>只有第一阶段有，少量</td></tr>
<tr><td>能量去向</td><td>约 1161 kJ 存入 ATP，其余以热能散失</td><td>约 61.08 kJ 存入 ATP，其余留在产物和以热能散失</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只高亮 1 行：真正的分水岭是「<b>有机物有没有被彻底分解</b>」——彻底 → 有氧，不彻底 → 无氧。背法是三问：在哪做（场所）→ 有没有 O₂ 参与 → 产物里有没有酒精或乳酸。三问问完，两种呼吸的场所、产物、能量都不会串。</p>
</section>

<h2><span class="sn">04</span>一道题走一遍</h2>

<div class="gx-ex">
<p class="ex-t">例题 · 粮食储存的三个措施<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">储存粮食时，要先晒干，并保持低温、低氧。请从细胞呼吸的角度分析：这三个措施分别通过什么途径减少有机物的消耗？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题：每个措施对应一个变量</p>
<p class="s-b">晒干对应「水」，低温对应「酶活性」，低氧对应「O₂ 浓度」。题目问的是「从细胞呼吸角度」，所以每一条都要落到呼吸作用的速率或方式上，不能只写「防止发霉」。</p>
<p class="s-k">用到：细胞呼吸的影响因素（水、温度、O₂ 浓度）</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 晒干：降低自由水含量</p>
<p class="s-b">晒干使种子中的<b>自由水</b>减少。水是细胞呼吸的反应物，也是反应进行的介质，自由水越少，呼吸速率越低，有机物分解得越慢。</p>
<p class="s-k">用到：自由水含量影响代谢速率</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 低温：降低酶活性</p>
<p class="s-b">低温使呼吸酶的<b>活性降低</b>，反应速率下降。注意只能说「降低活性」，不能说「使酶变性」——低温不会让酶变性，高温、过酸、过碱才会。</p>
<p class="s-k">用到：温度影响酶活性（不是变性）</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 低氧：抑制有氧呼吸，但不能到无氧</p>
<p class="s-b">低氧使<b>有氧呼吸</b>减弱，有机物消耗变慢；但氧浓度不能降到零，否则种子转入<b>无氧呼吸</b>，产生酒精和 CO₂，既消耗有机物又毒害细胞。所以是「低氧」而不是「无氧」。</p>
<p class="s-k">用到：O₂ 浓度同时影响有氧呼吸和无氧呼吸（图 3）</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 归纳：三个措施同一个目的</p>
<p class="s-b">三条途径都指向同一个结果——<b>降低细胞呼吸速率、减少有机物消耗</b>，从而延长粮食的储存时间。</p>
<p class="s-k">用到：细胞呼吸原理的应用</p>
</li>
</ol>

<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">① 晒干：降低种子中<b>自由水</b>的含量，细胞呼吸速率下降，有机物消耗减少。<br>② 低温：降低呼吸酶的<b>活性</b>，呼吸速率下降。<br>③ 低氧：抑制<b>有氧呼吸</b>，减少有机物消耗；但不能完全无氧，否则进行无氧呼吸产生酒精，反而消耗有机物并毒害细胞。<br>④ 结论：三个措施共同降低细胞呼吸速率，减少有机物消耗，有利于粮食储存。</p>

<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">有氧呼吸第一阶段在哪里进行？是不是线粒体？</p>
<p class="a"><b>细胞质基质</b>，不是线粒体。有氧呼吸只有第二、三阶段在线粒体内（基质、内膜）。第一阶段是葡萄糖分解成丙酮酸和 [H]，并释放少量能量。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="有氧呼吸第一阶段在细胞质基质中进行，不在线粒体">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="26" text-anchor="middle" font-size="8.6" font-weight="700" fill="#151a21">第一阶段：细胞质基质</text>
<rect x="30" y="40" width="120" height="58" rx="6" fill="#eaf6ff" stroke="#c8e2f5"/>
<rect x="52" y="54" width="56" height="28" rx="4" fill="#dfeaf2" stroke="#b9c6d2"/>
<text x="36" y="52" font-size="7.6" fill="#2f6fb3">细胞质</text>
<text x="80" y="73" text-anchor="middle" font-size="7.4" fill="#5a6472">线粒体</text>
<text x="30" y="112" font-size="7.8" fill="#1e6640">葡萄糖 → 丙酮酸 + [H]</text>
<text x="30" y="124" font-size="7.4" fill="#8e97a4">不在线粒体里，位置别画错</text>
</svg>
</div>
<div class="qac">
<p class="q">无氧呼吸为什么有时产乳酸、有时产酒精？</p>
<p class="a">因为细胞里的<b>酶不同</b>：第一阶段完全相同（葡萄糖→丙酮酸+[H]+少量 ATP），第二阶段走哪条路由酶决定。动物细胞、乳酸菌、马铃薯块茎、甜菜块根 → 乳酸；酵母菌、苹果 → 酒精 + CO₂。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="无氧呼吸第一阶段相同、第二阶段由酶决定产物：乳酸或酒精和二氧化碳">

<line x1="120" y1="50" x2="120" y2="60" stroke="#c9d3dc" stroke-width="1.2"/>
<line x1="62" y1="60" x2="178" y2="60" stroke="#c9d3dc" stroke-width="1.2"/>
<line x1="62" y1="60" x2="62" y2="70" stroke="#c9d3dc" stroke-width="1.2"/>

<text x="178" y="86" text-anchor="middle" font-size="7.6" fill="#8a5c14">酒精 + CO₂</text>
<text x="120" y="108" text-anchor="middle" font-size="8" fill="#3a3a35">第二阶段不同，产物不同</text>
<text x="120" y="122" text-anchor="middle" font-size="7.4" fill="#8e97a4">第一阶段完全相同</text>
</svg>
</div>
<div class="qac">
<p class="q">水淹后根为什么会烂？</p>
<p class="a">水把土壤孔隙填满，根<b>缺氧</b>，被迫进行<b>无氧呼吸</b>：产生的酒精会毒害细胞，而且无氧呼吸释放的能量少，根吸收无机盐、合成物质都受影响，时间一长就烂根。</p>

<rect x="30" y="40" width="180" height="42" rx="4" fill="#eaf6ff" stroke="#c8e2f5"/>
<line x1="30" y1="82" x2="210" y2="82" stroke="#b9a07a" stroke-width="1.6"/>

<text x="120" y="100" text-anchor="middle" font-size="8.2" fill="#8f3226">O₂ 进不去 → 无氧呼吸</text>
<text x="120" y="116" text-anchor="middle" font-size="8.2" fill="#8f3226">酒精毒害 + 能量少 → 烂根</text>
</svg>
</div>
<div class="qac">
<p class="q">有氧呼吸生成的水，其中的氧来自哪里？</p>
<p class="a">来自<b>O₂</b>。第三阶段 [H] 与 O₂ 结合生成水，水中的氧原子全部来自 O₂；而 CO₂ 中的氧来自<b>葡萄糖和水</b>。这是最容易被「水的氧来自水」带偏的一处。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="有氧呼吸第三阶段氢与氧气结合生成水，水中的氧来自氧气，二氧化碳中的氧来自葡萄糖和水">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="25" text-anchor="middle" font-size="8.6" font-weight="700" fill="#151a21">第三阶段：O₂ → H₂O</text>
<text x="40" y="62" font-size="8.4" fill="#2f6fb3">[H] + O₂</text>
<line x1="108" y1="58" x2="136" y2="58" stroke="#0f8a5f" stroke-width="1.6"/>

</svg>
</div>
<div class="qac">
<p class="q">无氧呼吸释放的能量去哪了？</p>
<p class="a">大部分<b>留在酒精或乳酸中</b>（有机物分解不彻底），只有少量储存在 ATP 中（约 2 个 ATP），其余以热能散失。所以无氧呼吸供能少、但来得快。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="无氧呼吸能量的三个去处：大部分留在酒精或乳酸中，少量存入ATP，其余以热能散失">

<div class="qac">
<p class="q">为什么慢跑比剧烈冲刺「省 ATP」？</p>
<p class="a">慢跑强度低、供氧充足，肌肉主要进行<b>有氧呼吸</b>，1 分子葡萄糖彻底氧化分解约生成 30 个 ATP；冲刺时供氧不足，主要靠<b>无氧呼吸</b>，1 分子葡萄糖只生成 2 个 ATP，还积累乳酸。所谓「省」是指同样消耗一分子葡萄糖，有氧呼吸产出多得多。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="同样一分子葡萄糖，有氧呼吸约生成30个ATP，无氧呼吸只生成2个ATP并积累乳酸">

<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 有氧呼吸的三个阶段都在线粒体中进行。</p>
<p class="er-v">✓ 有氧呼吸第一阶段在细胞质基质中进行，第二、三阶段分别在线粒体基质和线粒体内膜上进行。</p>
<p class="er-w">错在哪：把「线粒体是主要场所」当成「唯一场所」。<b>第一阶段在细胞质基质</b>，这一分丢得最冤。</p>
</div>
<div class="er">
<p class="er-x">✗ 无氧呼吸第二阶段能产生大量 ATP。</p>
<p class="er-v">✓ 无氧呼吸只在第一阶段释放少量能量、生成少量 ATP；第二阶段（丙酮酸→酒精+CO₂ 或→乳酸）不产生 ATP。</p>
<p class="er-w">错在哪：把「有第二阶段」当成「第二阶段也产能」。<b>无氧呼吸第二阶段不产生 ATP</b>，全部 ATP 来自第一阶段。</p>
</div>
<div class="er">
<p class="er-x">✗ 无氧呼吸不产生 CO₂。</p>
<p class="er-v">✓ 产酒精的无氧呼吸产生酒精和 CO₂；产乳酸的无氧呼吸才不产生 CO₂。</p>
<p class="er-w">错在哪：用一种产物（乳酸）的规律代替全部无氧呼吸。写「无氧呼吸的产物」时，要分酒精和乳酸两种情况。</p>
</div>
<div class="er">
<p class="er-x">✗ 有氧呼吸生成的水中的氧来自葡萄糖。</p>
<p class="er-v">✓ 有氧呼吸生成的水中的氧来自 O₂；CO₂ 中的氧来自葡萄糖和水。</p>
<p class="er-w">错在哪：把第三阶段的反应物记反了。第三阶段是 [H] + O₂ → H₂O，<b>水里的氧只可能来自 O₂</b>。</p>
</div>
<div class="er">
<p class="er-x">✗ 呼吸作用只在白天进行，晚上停止。</p>
<p class="er-v">✓ 细胞呼吸昼夜都进行，为生命活动提供能量；光照影响的是光合作用，不是呼吸作用。</p>
<p class="er-w">错在哪：把「光合作用需要光」套到呼吸作用上。白天夜里，活细胞都在呼吸。</p>
</div>
<div class="er">
<p class="er-x">✗ 低温使呼吸酶变性，所以能抑制呼吸。</p>
<p class="er-v">✓ 低温只是降低酶的活性，酶的空间结构没有被破坏；高温、过酸、过碱才会使酶变性。</p>
<p class="er-w">错在哪：混淆「活性降低」和「变性失活」。低温是可逆的抑制，回到适宜温度酶活性还能恢复。</p>
</div>
<div class="er">
<p class="er-x">✗ 无氧呼吸的第二阶段在线粒体中进行。</p>
<p class="er-v">✓ 无氧呼吸全过程都在细胞质基质中进行，不进线粒体。</p>
<p class="er-w">错在哪：以为「第二阶段」就往线粒体走。无氧呼吸根本没有线粒体参与，两个阶段都在细胞质基质。</p>
</div>

    gA.textContent = ""; gB.textContent = "";
    var s = calc(A);
    el("rect", { x: L.left.x, y: L.left.y, width: L.left.w, height: L.left.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    el("rect", { x: L.right.x, y: L.right.y, width: L.right.w, height: L.right.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    drawPlot(gA, s);
    drawSide(gB, s);
  }

  function render() {
    var s = calc(A), st, col, bg, sn;
    $("gxVa").textContent = String(Math.round(A));
    $("gxVb").textContent = fmt(s.aer);
    $("gxVc").textContent = fmt(s.ana);
    if (A < 1) { st = "无氧为主"; col = "#b8402f"; bg = "#fbeae7"; sn = "酒精 + CO₂ 产量最高"; }
    else if (A < 10) { st = "两者并存"; col = "#b8791f"; bg = "#fdf3e0"; sn = "有氧上升，无氧被抑制"; }
    else { st = "有氧为主"; col = "#2f8a5b"; bg = "#e6f6ee"; sn = "无氧几乎停止"; }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    draw();
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  /* 停留帧在 o=0（纯无氧、酒精产量最高）：12.5→14 与 0→1.5 同值，
     跨循环边界合计约 3 秒；开场 1.5 秒内即开始爬升，满足 2.6 秒体检。 */
  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 0 }, { t: 1.5, v: 0 }, { t: 4, v: 5 }, { t: 7, v: 21 }, { t: 9, v: 21 }, { t: 12.5, v: 0 }, { t: 14, v: 0 }],
    keys: [0, 3, 10, 21],
    value: A, min: 0, max: 21, step: 1,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__bio = { calc: calc, cases: [
    { v: 0, eq: { aer: 0, ana: 80 } },
    { v: 5, eq: { aer: 71.4, ana: 22.9 } },
    { v: 21, eq: { aer: 91.3, ana: 0.4 } }
  ] };

  /* 画布每帧重建节点，mousedown 与 mouseup 之间目标可能被换掉 → click 偶尔不触发。 */
  if (stage.parentElement) {
    stage.parentElement.addEventListener("pointerdown", function () { ap.take(); });
  }

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
</body>
</html>
