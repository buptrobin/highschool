<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 光合作用的概念<span class="q-src">人教版（2019）必修1 · 第5章第4节</span></p>
<p class="q-b">光合作用是指绿色植物通过叶绿体，利用光能，把二氧化碳和水转化成储存着能量的有机物，并且释放出氧气的过程。</p>
<p class="q-n">→ 翻成人话：这句话由<b>四个条件</b>锁定——①场所<b>叶绿体</b>；②动力<b>光能</b>；③原料<b>CO₂ 和 H₂O</b>；④产物<b>有机物和 O₂</b>。四个条件缺一个，就不配叫光合作用；答题第一句先写「叶绿体」，最后一句写「光能转变成有机物中稳定的化学能」。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 两个阶段<span class="q-src">人教版（2019）必修1 · 第5章第4节</span></p>
<p class="q-b">光反应在类囊体薄膜上进行，水的光解产生 O₂ 和 NADPH，同时生成 ATP；暗反应在叶绿体基质中进行，CO₂ 被固定形成 C₃，C₃ 被还原。</p>
<p class="q-n">→ 翻成人话：<b>两个房间、两套原料</b>。膜上（类囊体薄膜）用水和光造 ATP、NADPH，顺手把 O₂ 放出去；基质里用 CO₂ 加 ATP、NADPH 造 C₃ 再还原成糖。少写「薄膜」、把两个场所写反，都是 0 分。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · O₂ 的来源<span class="q-src">人教版（2019）必修1 · 第5章第4节</span></p>
<p class="q-b">光合作用释放的 O₂ 中的氧全部来自水。</p>
<p class="q-n">→ 翻成人话：只背结论不够，要能说出<b>证据</b>。用 H₂¹⁸O 标记水，释放的 O₂ 带 ¹⁸O；用 C¹⁸O₂ 标记 CO₂，O₂ 不带 ¹⁸O，¹⁸O 进了有机物。所以「O₂ 来自 CO₂」是最典型的错句，也是最常被扣分的一句。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>光反应</th><th>暗反应</th></tr></thead>
<tbody>
<tr><td>场所</td><td>类囊体薄膜</td><td>叶绿体基质</td></tr>
<tr><td>直接条件</td><td>光、色素、酶</td><td>多种酶，不直接需要光</td></tr>
<tr><td>物质变化</td><td>水的光解产生 O₂ 和 NADPH；ADP + Pi → ATP</td><td>CO₂ + C₅ → 2C₃；C₃ 被还原成糖类并再生 C₅</td></tr>
<tr><td>能量转换</td><td>光能 → ATP、NADPH 中活跃的化学能</td><td>活跃的化学能 → 有机物中稳定的化学能</td></tr>
<tr class="key"><td>联系（必背）</td><td>给暗反应提供 ATP 和 NADPH</td><td>给光反应返回 ADP、Pi、NADP⁺</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">背法一句：<b>膜上装能量，基质里装碳</b>。看到「类囊体薄膜」就写光反应，看到「叶绿体基质」就写暗反应；看到「O₂」就写水，看到「CO₂」就写 C₃。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 光补偿点与植物能否生长<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">将某植物置于光照强度为光补偿点的条件下，一段时间后植物能否正常生长？为什么？（提示：先判断净光合，再说有机物有没有积累。）</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题/定性</p>
<p class="s-b">光补偿点是一个「净光合为 0」的光照强度，不是「不进行光合」。判断植物能否生长，看的是净光合，不是总光合。</p>
<p class="s-k">用到：净光合 = 总光合 − 呼吸。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 定量/找数</p>
<p class="s-b">设呼吸速率为 4：光补偿点时 gross=4，net=4−4=0。也就是总光合产生的有机物，刚好被呼吸消耗完，一个都不剩。</p>
<p class="s-k">用到：光补偿点的定义（光合速率 = 呼吸速率）。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 推理/结论</p>
<p class="s-b">净光合为 0 → 没有有机物积累；短期靠原有有机物维持，长期入不敷出，所以不能正常生长。</p>
<p class="s-k">用到：有机物积累量由净光合决定。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 答题/得分点</p>
<p class="s-b">按「不能 → 为什么（光合 = 呼吸、净光合 0、无积累）→ 怎么办（要大于光补偿点）」三段写。若答「不能进行光合作用」，直接 0 分，因为补偿点下光合仍在进行。</p>
<p class="s-k">用到：教材语言，分点作答。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 4</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">① 不能长期正常生长。<br>② 光补偿点下，光合速率等于呼吸速率，净光合速率为 0。<br>③ 植物没有有机物积累（产生与消耗相抵），长期会消耗自身有机物。<br>④ 要正常生长，光照强度必须大于光补偿点，使净光合速率大于 0。</p>
</div>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">光合作用释放的 O₂，到底来自水还是 CO₂？</p>
<p class="a">全部来自水。光反应中<b>水的光解</b>产生 O₂ 和 NADPH；CO₂ 只在暗反应被固定，其中的氧进入有机物。同位素标记可证：H₂¹⁸O → ¹⁸O₂；C¹⁸O₂ → 有机物带 ¹⁸O，O₂ 不带。</p>

<text x="56" y="88" text-anchor="middle" font-size="11" font-weight="700" fill="#8a5c14">CO₂</text>
<text x="184" y="88" text-anchor="middle" font-size="10" font-weight="700" fill="#8a5c14">有机物</text>

<div class="qac">
<p class="q">光反应给暗反应提供什么？暗反应又还回去什么？</p>
<p class="a">光反应提供<b>ATP（能量）和 NADPH（还原剂）</b>；暗反应返回 <b>ADP、Pi、NADP⁺</b>。没有光反应，暗反应会因为缺 ATP 和 NADPH 立刻停下来——这就是突然停光后 C₃ 还原受阻的原因。</p>

<text x="178" y="50" text-anchor="middle" font-size="10" font-weight="700" fill="#8a5c14">暗反应</text>
<text x="178" y="64" text-anchor="middle" font-size="7.6" fill="#5a6472">叶绿体基质</text>
<line x1="60" y1="92" x2="180" y2="92" stroke="#2f8a5b" stroke-width="1.6"/>
<polygon points="180,92 171,88 171,96" fill="#2f8a5b"/>
<text x="120" y="84" text-anchor="middle" font-size="8.2" font-weight="600" fill="#1e6640">ATP · NADPH</text>

<text x="120" y="120" text-anchor="middle" font-size="8" fill="#8a5c14">返回 ADP、Pi、NADP⁺</text>
</svg>
</div>
<div class="qac">
<p class="q">光补偿点和光饱和点分别是什么意思？</p>
<p class="a"><b>光补偿点</b>：净光合为 0（总光合 = 呼吸）时的光照强度，决定「能不能活」；<b>光饱和点</b>：再增加光强、光合速率不再明显增加时的光照强度，决定「最多能多快」。两者都不是「光合停止」。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="净光合曲线与光补偿点、光饱和点">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>

<polyline points="36,106 53.8,86 71.6,74 89.4,66 107.2,60.3 125,56 142.8,52.7 160.6,50 178.4,47.8 196.2,46 214,44.5" fill="none" stroke="#2f8a5b" stroke-width="2"/>

<line x1="58" y1="50" x2="50" y2="86" stroke="#d6b98a" stroke-width="0.8"/>
<text x="58" y="46" font-size="7.8" fill="#8a5c14">补偿点</text>
<text x="200" y="38" text-anchor="end" font-size="7.8" fill="#8a5c14">饱和点</text>
<text x="36" y="22" font-size="7.6" fill="#5a6472">净光合</text>
<text x="125" y="122" text-anchor="middle" font-size="8" fill="#5a6472">光照强度</text>
</svg>
</div>
<div class="qac">
<p class="q">突然停止光照，C₃ 和 C₅ 怎么变？</p>
<p class="a">C₃ <b>先增多</b>，C₅ <b>减少</b>。停光 → ATP、NADPH 减少 → C₃ 还原受阻，C₃ 消耗变慢；而 CO₂ 固定仍在进行，C₃ 继续生成 → C₃ 积累。C₅ 因生成减少、消耗继续而减少。</p>

<p class="a">因为测到的 O₂ 释放量、CO₂ 吸收量都是<b>两者相抵后的净值</b>：植物同时在进行呼吸，会消耗一部分光合产物。只有净光合才代表有机物积累量，也才决定植物能不能生长。</p>

<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 光合作用释放的 O₂ 来自 CO₂。</p>
<p class="er-v">✓ 光合作用释放的 O₂ 中的氧全部来自水，CO₂ 中的氧进入有机物。</p>
<p class="er-w">错在哪：把「原料」和「产物」的氧混了。<b>水的光解</b>才是 O₂ 的唯一来源，同位素标记一句话就能反杀。</p>
</div>
<div class="er">
<p class="er-x">✗ 暗反应在类囊体薄膜上进行。</p>
<p class="er-v">✓ 光反应在类囊体薄膜上进行，暗反应在叶绿体基质中进行。</p>
<p class="er-w">错在哪：暗反应的酶在<b>基质</b>里，不在膜上。膜上只有色素和光反应的酶。</p>
</div>
<div class="er">
<p class="er-x">✗ 直接用总光合速率判断植物能不能积累有机物。</p>
<p class="er-v">✓ 净光合速率 = 总光合速率 − 呼吸速率，净光合才能代表有机物积累。</p>
<p class="er-w">错在哪：总光合里有一部分当场被呼吸吃掉。只看总光合，会把「刚好不积累」误判成「在生长」。</p>
</div>
<div class="er">
<p class="er-x">✗ 光补偿点时植物不再进行光合作用。</p>
<p class="er-v">✓ 光补偿点时总光合速率等于呼吸速率，净光合速率为 0，光合仍在进行。</p>
<p class="er-w">错在哪：补偿点是两条速率<b>相等</b>，不是一条归零。答「停止光合」直接 0 分。</p>
</div>
<div class="er">
<p class="er-x">✗ 光反应不需要酶，只有暗反应需要酶。</p>
<p class="er-v">✓ 两个阶段都需要酶：光反应也需要酶（如 ATP 合成酶），只是不直接依赖光。</p>
<p class="er-w">错在哪：光反应同样有酶催化，「不直接需要光」不等于「不需要酶」。</p>
</div>
<div class="er">
<p class="er-x">✗ 突然停止光照后，C₃ 立刻减少。</p>
<p class="er-v">✓ 突然停止光照后，C₃ 先增多、C₅ 减少。</p>
<p class="er-w">错在哪：停光先缺 ATP、NADPH，C₃ 的<b>消耗</b>变慢；CO₂ 固定还在造 C₃，所以 C₃ 先积累。</p>
</div>
<div class="er">
<p class="er-x">✗ 达到光饱和点后，光合作用就停止了。</p>
<p class="er-v">✓ 达到光饱和点后，光合速率达到最大并保持稳定，不再随光强明显增加。</p>
<p class="er-w">错在哪：饱和是「不再变快」，不是「停下来」。此时限制因素换成了 CO₂ 浓度或温度。</p>
</div>

    el("line", { x1: 96, y1: 52, x2: 112, y2: 52, stroke: C_NET, "stroke-width": 2 }, g);
    tx(g, 116, 55, "净光合", "#8a5c14", "start", 7.6, 600);
    el("line", { x1: 168, y1: 52, x2: 184, y2: 52, stroke: C_RESP, "stroke-width": 1.6, "stroke-dasharray": "4 3" }, g);
    tx(g, 188, 55, "呼吸 4", C_RESP, "start", 7.6, 600);

    var ticks = [15, 10, 5, 0, -5];
    for (k = 0; k < ticks.length; k++) {
      el("line", { x1: x0, y1: Y(ticks[k]), x2: x1, y2: Y(ticks[k]),
        stroke: ticks[k] === 0 ? "#c9d3dc" : "#eef2f5", "stroke-width": ticks[k] === 0 ? 1.2 : 1 }, g);
      tx(g, x0 - 6, Y(ticks[k]) + 3, String(ticks[k]), FAINT, "end", 7);
    }
    el("line", { x1: x0, y1: y0, x2: x0, y2: y1, stroke: "#c9d3dc", "stroke-width": 1 }, g);
    for (k = 0; k <= 200; k += 50) tx(g, X(k), y1 + 14, String(k), FAINT, "middle", 7);
    tx(g, (x0 + x1) / 2, y1 + 30, "光照强度 I", MID, "middle", 8);

    var shade = [];
    for (k = 0; k <= 6; k++) {
      iv = 7.5 * k / 6;
      shade.push(X(iv).toFixed(1) + "," + Y(20 * iv / (iv + 30) - 4).toFixed(1));
    }
    el("polygon", { points: X(0).toFixed(1) + "," + Y(0).toFixed(1) + " " + shade.join(" "),
      fill: "#fdf3e0", stroke: "#e0c08a", "stroke-width": 1 }, g);

    el("polyline", { points: linePts(X, Y, function (i) { return 20 * i / (i + 30); }, 40, 200),
      fill: "none", stroke: C_GROSS, "stroke-width": 2 }, g);
    el("polyline", { points: linePts(X, Y, function (i) { return 20 * i / (i + 30) - 4; }, 40, 200),
      fill: "none", stroke: C_NET, "stroke-width": 2 }, g);

    el("line", { x1: X(7.5), y1: y0, x2: X(7.5), y2: y1, stroke: "#d6b98a", "stroke-width": 1, "stroke-dasharray": "3 3" }, g);
    el("line", { x1: X(120), y1: y0, x2: X(120), y2: y1, stroke: "#d6b98a", "stroke-width": 1, "stroke-dasharray": "3 3" }, g);
    tx(g, X(7.5) + 4, y1 - 6, "光补偿点 7.5", "#8a5c14", "start", 7.4, 600);
    tx(g, X(120) + 4, y1 - 6, "饱和点≈120", "#8a5c14", "start", 7.4, 600);

    var xc = X(s.i);
    el("line", { x1: xc, y1: y0, x2: xc, y2: y1, stroke: "#c9d3dc", "stroke-width": 1, "stroke-dasharray": "3 3" }, g);
    el("circle", { cx: xc, cy: Y(s.gross), r: 3.8, fill: "#ffffff", stroke: C_GROSS, "stroke-width": 1.8 }, g);
    el("circle", { cx: xc, cy: Y(s.net), r: 3.8, fill: "#ffffff", stroke: C_NET, "stroke-width": 1.8 }, g);
    var bx = Math.max(54, Math.min(xc + 10, 332));
    el("line", { x1: bx, y1: Y(s.gross), x2: bx, y2: Y(s.net), stroke: C_RESP, "stroke-width": 1, "stroke-dasharray": "3 3" }, g);
    tx(g, bx + 3, (Y(s.gross) + Y(s.net)) / 2 + 3, "4", C_RESP, "start", 7, 700);
  }

  function drawSideNarrow(s, g) {
    var P = L.right, Z = statusOf(s.i), k;
    el("rect", { x: P.x, y: P.y, width: P.w, height: P.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, g);
    tx(g, 24, 346, "一根条看懂 net = gross − 4", INK, "start", 9.4, 700);
    tx(g, 24, 364, "呼吸固定消耗 4", MID, "start", 8.4);

    var zero = 200, sc = 7, gy = 388, ny = 444, bh = 14;
    var xg = zero + s.gross * sc, xn = zero + s.net * sc;
    el("line", { x1: zero, y1: 380, x2: zero, y2: 470, stroke: "#c9d3dc", "stroke-width": 1, "stroke-dasharray": "3 3" }, g);
    el("rect", { x: zero, y: gy, width: Math.max(1.5, xg - zero), height: bh, rx: 5, fill: "#eef8f3", stroke: "#9fc9b0" }, g);
    if (s.net >= 0) {
      el("rect", { x: xn, y: ny, width: Math.max(0, xg - xn), height: bh, rx: 5, fill: "#f3d9d3" }, g);
      el("rect", { x: zero, y: ny, width: Math.max(0, xn - zero), height: bh, rx: 5, fill: C_GROSS }, g);
    } else {
      el("rect", { x: xn, y: ny, width: zero - xn, height: bh, rx: 5, fill: C_RESP }, g);
    }
    tx(g, 24, 396, "总光合", MID, "start", 8.4);
    tx(g, 24, 416, f1(s.gross), "#1e6640", "start", 13, 700);
    tx(g, 24, 452, "净光合", MID, "start", 8.4);
    tx(g, 24, 472, num(s.net), s.net < 0 ? C_RESP : "#8a5c14", "start", 13, 700);

    var ay = 430, mid = (xn + xg) / 2;
    el("line", { x1: xn, y1: ay, x2: xg, y2: ay, stroke: C_RESP, "stroke-width": 1 }, g);
    el("polygon", { points: xn + "," + ay + " " + (xn + 5) + "," + (ay - 3) + " " + (xn + 5) + "," + (ay + 3), fill: C_RESP }, g);
    el("polygon", { points: xg + "," + ay + " " + (xg - 5) + "," + (ay - 3) + " " + (xg - 5) + "," + (ay + 3), fill: C_RESP }, g);
    tx(g, mid, 424, "呼吸 4", C_RESP, "middle", 7.4, 600);
    for (k = 0; k <= 20; k += 5) tx(g, zero + k * sc, 486, String(k), FAINT, "middle", 7);
    tx(g, 24, 490, "速率（相对值）", MID, "start", 7.6);

    tx(g, 24, 516, "net = gross − 4", INK, "start", 10, 700);
    tx(g, 24, 544, Z.st, Z.col, "start", 10.5, 700);
    wrap(g, 24, 562, Z.sn, 320, 8.6, MID, 13);
    tx(g, 24, 600, "I<7.5：光合小于呼吸，净消耗", MID, "start", 8.2);
    tx(g, 24, 616, "I=7.5：光补偿点，净光合 0", MID, "start", 8.2);
    tx(g, 24, 632, "I≈120：接近光饱和点", MID, "start", 8.2);
    tx(g, 24, 648, "净光合 ↑ → 释放 O₂ ↑", MID, "start", 8.2);
    tx(g, 24, 676, "gross=20I/(I+30)，呼吸按 4 计", FAINT, "start", 7.8);
  }

  /* 中文按字数换行，避免长句冲出面板 */
  function wrap(parent, x, y, s, maxW, fs, col, lh) {
    var per = Math.max(6, Math.floor(maxW / fs)), lines = [], cur = "", i;
    for (i = 0; i < s.length; i++) {
      cur += s.charAt(i);
      if (cur.length >= per) { lines.push(cur); cur = ""; }
    }
    if (cur) lines.push(cur);
    for (i = 0; i < lines.length; i++) tx(parent, x, y + i * lh, lines[i], col, "start", fs, 400);
  }

  function render() {
    var s = calc(A), Z = statusOf(s.i);
    $("gxVa").textContent = lab(A);
    $("gxVb").textContent = f1(s.gross);
    $("gxVc").textContent = num(s.net);
    $("gxVs").textContent = Z.st;
    $("gxVsn").textContent = Z.sn;
    $("gxStBox").style.background = Z.bg;
    $("gxStBox").style.borderColor = Z.col + "44";
    $("gxVs").style.color = Z.col;

    var gA = $("gxA"), gB = $("gxB");
    gA.textContent = ""; gB.textContent = "";
    if (L.wide) { drawWide(s, gA); drawSideWide(s, gB); }
    else { drawNarrow(s, gA); drawSideNarrow(s, gB); }
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  /* 叙事：0 → 7.5（停留 2.8 s，光补偿点）→ 60 → 120（接近饱和）→ 回 0。
     开场 1.2 s 内就开始爬升，满足 2.6 s 体检「数值必须变过」。 */
  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 0 }, { t: 1.2, v: 2.5 }, { t: 3, v: 7.5 }, { t: 5.8, v: 7.5 },
           { t: 8.8, v: 60 }, { t: 11.5, v: 120 }, { t: 12.5, v: 120 }, { t: 14.8, v: 0 }],
    keys: [0, 7.5, 30, 120],
    value: A, min: 0, max: 200, step: 0.5,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__bio = { calc: calc, cases: [
    { v: 0, eq: { gross: 0, net: -4 } },
    { v: 7.5, eq: { gross: 4, net: 0 } },
    { v: 30, eq: { gross: 10, net: 6 } },
    { v: 120, eq: { gross: 16, net: 12 } },
    { v: 200, eq: { gross: 17.39, net: 13.39 } }
  ] };

  /* 画布每帧重建节点，mousedown 与 mouseup 之间目标可能被换掉 → click 偶尔不触发。 */
  if (stage.parentElement) {
    stage.parentElement.addEventListener("pointerdown", function () { ap.take(); });
  }

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
