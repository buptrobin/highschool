<p class="gx-claim">数种群只有两条路：<b>样方法直接数一小块取平均</b>，<b>标记重捕法用 m/n 的比例反推</b>；而这一切的前提是——种群密度是最基本的数量特征。</p>
<div class="gx-meta">
<span><i></i>人教版（2019）选择性必修2 第1章第1节</span>
<span><i></i>高二 · 第1章 种群及其动态</span>
<span><i></i>阅读 12 分钟</span>
<span><i></i>含 1 个互动模型</span>
</div>
<p class="gx-lede">这一节是整章的地基：后面讲出生率、死亡率、年龄结构、环境容纳量，全都要先有「有多少个个体」这个数。最容易错的不是概念，是标记重捕法那条公式的分母——写成 M×m÷n、或者拿重捕总数 n 当分母，一道 6 分的计算题就只剩 0 分。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 种群密度<span class="q-src">人教版（2019）选择性必修2 · 第1章第1节</span></p>
<p class="q-b">种群在单位面积或单位体积中的个体数就是种群密度，它是种群最基本的数量特征。</p>
<p class="q-n">→ 翻成人话：这句话由<b>两个条件</b>组成：①「单位面积或单位体积」——先说清是多大一块地盘，数字才有比较的意义，水生生物用体积、陆生生物用面积；②「个体数」——数的是个体，不是生物量、不是物种数。少掉①，「这块草地里有 200 只鼠」就没法跟别的草地比。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 估算方法<span class="q-src">人教版（2019）选择性必修2 · 第1章第1节</span></p>
<p class="q-b">估算种群密度常用的方法有样方法和标记重捕法。</p>
<p class="q-n">→ 翻成人话：这两个词要分开记：样方法是「<b>数一部分推整体</b>」，用于植物和活动能力弱、活动范围小的动物；标记重捕法是「<b>抓—放—再抓</b>」，用于活动能力强、活动范围大的动物。方法选错，后面算得再准也不给分。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 标记重捕法<span class="q-src">人教版（2019）选择性必修2 · 第1章第1节</span></p>
<p class="q-b">N（种群总数）＝ M（标记数）× n（重捕总数）÷ m（重捕中带标记的个体数）。</p>
<p class="q-n">→ 翻成人话：三个字母里<b>只有 m 在分母上</b>。分母是「重捕中带标记的数」，不是「重捕总数 n」。道理很简单：第二次抓到 100 只里有 10 只有标记，说明标记个体占 10%，而全体标记个体是 50 只，所以总数就是 50 ÷ 10% ＝ 500。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>样方法</th><th>标记重捕法</th></tr></thead>
<tbody>
<tr><td>适用对象</td><td>植物；活动能力弱、活动范围小的动物（虫卵、蚜虫、蜗牛）</td><td>活动能力强、活动范围大的动物（鼠、鸟、鱼）</td></tr>
<tr><td>怎么操作</td><td>随机抽取若干样方，数清每个样方内的个体数</td><td>捕获 → 标记 → 放回混匀 → 重捕 → 数出 m</td></tr>
<tr><td>密度算式</td><td>各样方密度的平均值</td><td><span class="gx-fml">N ＝ M × n ÷ m</span></td></tr>
<tr class="key"><td>关键区别</td><td>直接数：只抓一次，不用做标记</td><td>间接估：靠第二次的标记比例反推总数</td></tr>
<tr><td>最大误差来源</td><td>取样不随机、样方太小、数漏边上的个体</td><td>标记物脱落或影响活动能力 → 估算偏大</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">背法：种群密度是「<b>最基本的数量特征</b>」，出生率、死亡率、迁入率、迁出率、年龄结构、性别比例这些特征都是<b>通过影响种群密度</b>来影响种群数量的。选择题只要把「最基本」换成「唯一」，就是错项。</p>
</section>

<section class="gx-sec" id="b">
<h2><span class="sn">02</span>拆开看</h2>
<p class="gx-h2s">四张图：怎么数 → 怎么估 → 每个字母指什么 → 什么时候估不准，按操作顺序排。</p>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 标记重捕法计算 + 误差方向<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">某草地要调查田鼠的种群密度。第一次捕获 50 只田鼠，全部做上标记后放回；一段时间后第二次捕获 100 只，其中有标记的 10 只。<br>（1）估算该草地田鼠的种群数量。<br>（2）若第一次标记时所用标记物容易脱落，估算值会怎样变化？为什么？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 定方法</p>
<p class="s-b">田鼠活动能力强、活动范围大，数不过来也圈不住，不能用样方法，只能用<b>标记重捕法</b>。</p>
<p class="s-k">用到：样方法与标记重捕法的适用对象。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 认字母</p>
<p class="s-b">第一次捕获并标记的 M ＝ 50 只；第二次重捕总数 n ＝ 100 只；重捕中带标记的 m ＝ 10 只。要求的正是 N。</p>
<p class="s-k">用到：M、n、m 三者的定义，别把 n 和 m 弄反。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 代公式</p>
<p class="s-b"><span class="gx-fml">N ＝ M × n ÷ m ＝ 50 × 100 ÷ 10 ＝ 500</span>（只）。分母放的是 m＝10，不是 n＝100。</p>
<p class="s-k">用到：标记重捕法公式，分母是重捕中有标记的个体数。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 推误差方向</p>
<p class="s-b">标记物脱落 → 重捕时有些带标记的个体认不出来 → 数出的 m <b>偏小</b> → 分母偏小 → N <b>偏大</b>。注意：脱落影响的是 m，不是 M（M 是放回前就定好的）。</p>
<p class="s-k">用到：分母变小，商变大。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 写答案</p>
<p class="s-b">两问分开答，第二问必须写「偏大」并给出<b>因果链</b>：脱落 → m 偏小 → 分母偏小 → 估算值偏大。只写「偏大」不写理由，通常只给一半分。</p>
<p class="s-k">用到：误差分析的答题格式。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）N ＝ M × n ÷ m ＝ 50 × 100 ÷ 10 ＝ 500（只）。该草地田鼠的种群数量约为 500 只。<br>（2）估算值会<b>偏大</b>。原因：标记物脱落后，重捕个体中能被认出带标记的个体数 m 偏小，而 M、n 不变，由 N ＝ M × n ÷ m 可知分母变小，估算值偏大。</p>
</div>
</div>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">

<div class="qac">
<p class="q">种群密度为什么是「最基本的数量特征」？</p>
<p class="a">因为描述一个种群<b>先要有「有多少」</b>；出生率、死亡率、迁入率、迁出率、年龄结构、性别比例这些特征，都是<b>通过影响种群密度</b>来影响种群数量的。注意「最基本」不等于「唯一」，说它是唯一特征的选项一律错。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="其他数量特征都指向种群密度">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<circle cx="120" cy="72" r="26" fill="#eef7f1" stroke="#2f8a5b"/>
<text x="120" y="70" text-anchor="middle" font-size="9" font-weight="700" fill="#2f8a5b">种群密度</text>
<text x="120" y="82" text-anchor="middle" font-size="8" fill="#5a6472">最基本</text>
<text x="48" y="34" font-size="8" fill="#5a6472">出生率</text>
<text x="180" y="34" font-size="8" fill="#5a6472">年龄结构</text>
<text x="180" y="116" font-size="8" fill="#5a6472">性别比例</text>
<line x1="62" y1="42" x2="98" y2="58" stroke="#9fb3c2"/>
<line x1="174" y1="42" x2="136" y2="56" stroke="#9fb3c2"/>
<line x1="168" y1="106" x2="140" y2="90" stroke="#9fb3c2"/>
</svg>
</div>

<div class="qac">
<p class="q">标记重捕法的分母到底是哪一个？</p>
<p class="a">分母是<b>重捕中带标记的个体数 m</b>，不是重捕总数 n。写成 <span class="gx-fml">N ＝ M × m ÷ n</span>（乘 m 除 n）或把 n 放分母，都会算出一个完全不同的数，是本节最高频的失分点。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="公式 N 等于 M 乘 n 除以 m，m 是分母">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="52" text-anchor="middle" font-size="14" font-weight="700" fill="#151a21">N = M × n ÷ m</text>
<text x="120" y="84" text-anchor="middle" font-size="9" fill="#b8402f">↑ 分母是这个 m（带标记的）</text>
<text x="120" y="104" text-anchor="middle" font-size="8" fill="#5a6472">n 在分子上，放错就全盘皆错</text>
</svg>
</div>

<div class="qac">
<p class="q">标记物脱落，估算值会变大还是变小？</p>
<p class="a">会<b>偏大</b>。因果链要一次写全：标记物脱落 → 重捕时认不出带标记的个体 → m 偏小 → 分母偏小 → 由 <span class="gx-fml">N ＝ M × n ÷ m</span> 得估算值偏大。同理会偏大的还有：标记太显眼被天敌捕食、标记影响活动能力。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="标记脱落导致 m 偏小、估算值偏大的链条">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<rect x="18" y="34" width="56" height="26" rx="5" fill="#ffffff" stroke="#b8e6d0"/>
<text x="46" y="51" text-anchor="middle" font-size="8" fill="#3a3a35">标记脱落</text>
<rect x="92" y="34" width="56" height="26" rx="5" fill="#ffffff" stroke="#b8e6d0"/>
<text x="120" y="51" text-anchor="middle" font-size="8" fill="#3a3a35">m 偏小</text>
<rect x="166" y="34" width="56" height="26" rx="5" fill="#fbeae7" stroke="#b8402f"/>
<text x="194" y="51" text-anchor="middle" font-size="8" font-weight="700" fill="#b8402f">N 偏大</text>
<line x1="74" y1="47" x2="90" y2="47" stroke="#9fb3c2"/>
<line x1="148" y1="47" x2="164" y2="47" stroke="#9fb3c2"/>
<text x="120" y="86" text-anchor="middle" font-size="8" fill="#5a6472">分母变小，商就变大</text>
<text x="120" y="104" text-anchor="middle" font-size="8" fill="#5a6472">M 是放回前定好的，不受脱落影响</text>
</svg>
</div>

<div class="qac">
<p class="q">样方法为什么一定要随机取样？</p>
<p class="a">随机取样保证<b>每个个体被抽中的机会相等</b>，样方才有代表性。专挑长势好的地方，各样方密度整体偏高，平均值就<b>系统性偏大</b>；专挑差的则偏小。取多少样方、样方多大都要统一，最后取<b>平均值</b>而不是最大值。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="挑好地方取样与随机取样的对比">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<rect x="18" y="30" width="94" height="66" rx="6" fill="#fbeae7" stroke="#d9a196"/>
<text x="65" y="52" text-anchor="middle" font-size="8" fill="#b8402f">挑长势好的地方</text>
<text x="65" y="72" text-anchor="middle" font-size="8" fill="#b8402f">→ 平均值偏大</text>
<rect x="128" y="30" width="94" height="66" rx="6" fill="#eef7f1" stroke="#8fc7a6"/>
<text x="175" y="52" text-anchor="middle" font-size="8" fill="#2f8a5b">随机取样</text>
<text x="175" y="72" text-anchor="middle" font-size="8" fill="#2f8a5b">→ 接近真值</text>
<text x="120" y="112" text-anchor="middle" font-size="8" fill="#5a6472">样方数够多，平均值才稳</text>
</svg>
</div>

<div class="qac">
<p class="q">什么情况下不能用标记重捕法？</p>
<p class="a">标记<b>留不住</b>（易脱落、无法固定）、标记<b>改变行为</b>（影响活动、招来天敌）、调查期内有大量<b>迁入迁出或出生死亡</b>、个体<b>活动范围超出</b>调查区——这些情况估算都不可靠。植物和活动能力弱的动物改用<b>样方法</b>。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="方法选择：样方法与标记重捕法分别适用什么对象">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="28" text-anchor="middle" font-size="8" fill="#5a6472">先看对象，再选方法</text>
<rect x="18" y="38" width="200" height="30" rx="5" fill="#eef7f1" stroke="#8fc7a6"/>
<text x="118" y="57" text-anchor="middle" font-size="8" fill="#2f8a5b">植物、活动力弱 → 样方法</text>
<rect x="18" y="76" width="200" height="30" rx="5" fill="#ffffff" stroke="#b8e6d0"/>
<text x="118" y="95" text-anchor="middle" font-size="8" fill="#3a3a35">活动力强、范围大 → 标记重捕法</text>
</svg>
</div>

<div class="qac">
<p class="q">样方要取多大？取几个？</p>
<p class="a">面积随对象定：<b>草本 1 m²、灌木 16 m²、乔木 100 m²</b>；原则是样方要足够大，能包含群落里多数物种，又不能大到数不完；同一次调查里所有样方<b>面积必须相同</b>，样方数要足够多，最后取各样方密度的<b>平均值</b>。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="草本、灌木、乔木的样方面积示意">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="28" text-anchor="middle" font-size="8" fill="#5a6472">样方面积随对象变，同一次调查必须统一</text>
<rect x="28" y="90" width="20" height="20" fill="#cfe6d8" stroke="#2f8a5b"/>
<rect x="74" y="76" width="34" height="34" fill="#cfe6d8" stroke="#2f8a5b"/>
<rect x="136" y="66" width="44" height="44" fill="#cfe6d8" stroke="#2f8a5b"/>
<text x="38" y="86" text-anchor="middle" font-size="8" fill="#3a3a35">1 m²</text>
<text x="91" y="72" text-anchor="middle" font-size="8" fill="#3a3a35">16 m²</text>
<text x="158" y="62" text-anchor="middle" font-size="8" fill="#3a3a35">100 m²</text>
<text x="200" y="92" text-anchor="middle" font-size="8" fill="#5a6472">草本</text>
<text x="200" y="108" text-anchor="middle" font-size="8" fill="#5a6472">灌木·乔木</text>
</svg>
</div>

</div>
<p class="gx-note">收尾点明：六问其实是同一件事——所有误差最后只走两条路：要么<b>取样没有代表性</b>（样方法），要么<b>分子分母弄错或 m 数不准</b>（标记重捕法）。看到题先问自己：这题走的是哪条路？</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ N ＝ M × m ÷ n，把 m 乘上去、把 n 除掉</p>
<p class="er-v">✓ N ＝ M × n ÷ m，n 在分子、m 在分母</p>
<p class="er-w">错在哪：两个字母换位，答案往往差几十倍；记法只有一句——分出来的是「比例」，比例的分母是重捕里带标记的那几只。</p>
</div>
<div class="er">
<p class="er-x">✗ 公式的分母用重捕总数 n</p>
<p class="er-v">✓ 分母是重捕中带标记的个体数 m</p>
<p class="er-w">错在哪：分母写成 n，算出来永远是「M」这个数，连量纲都不对；题里 n=100、m=10，只有 m 才能反映标记个体占多大比例。</p>
</div>
<div class="er">
<p class="er-x">✗ 标记物脱落只会让标记数 M 变小</p>
<p class="er-v">✓ 脱落后重捕中带标记的 m 偏小，估算值偏大</p>
<p class="er-w">错在哪：M 是第一次放回前就数好、定死的，脱落发生在放回之后，改的是重捕时能认出来的 m；分母偏小 → 估算值偏大，方向别写反。</p>
</div>
<div class="er">
<p class="er-x">✗ 样方就挑长势最好、个体最密的那几块</p>
<p class="er-v">✓ 随机取样，各样方取平均值</p>
<p class="er-w">错在哪：专挑好的，每个样方密度都偏高，平均值系统性偏大；反过来专挑差的就偏小。随机才是「无偏」的唯一保证。</p>
</div>
<div class="er">
<p class="er-x">✗ 种群密度是种群唯一的数量特征</p>
<p class="er-v">✓ 种群密度是种群最基本的数量特征，但不是唯一特征</p>
<p class="er-w">错在哪：「最基本」说的是地位——其他特征都通过影响它来影响种群数量；说成「唯一」就把出生率、年龄结构全排除掉了。</p>
</div>
<div class="er">
<p class="er-x">✗ 两次捕获间隔越短越好，省得鼠跑掉</p>
<p class="er-v">✓ 间隔要让标记个体与未标记个体充分混匀</p>
<p class="er-w">错在哪：间隔太短，标记个体还没散开，重捕时会多抓到带标记的，m 偏大 → 估算值偏小；间隔太长则出生、死亡、迁入迁出会破坏前提。</p>
</div>
<div class="er">
<p class="er-x">✗ 调查田鼠的种群密度用样方法</p>
<p class="er-v">✓ 田鼠活动能力强、范围大，用标记重捕法</p>
<p class="er-w">错在哪：样方法只适合植物和活动能力弱、活动范围小的动物；对象选错，后面公式再对也不得分。</p>

<script>
/* 互动脚本本体（由 build-page.mjs 包进 <script> 里，所以这里不要写 <script> 标签） */
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var GX = window.GX, el = GX.el, tx = GX.tx, $ = GX.$;
  var stage = $("gxStage");
  if (!stage || !window.AutoPilot) return;

  /* 两套坐标：宽屏 880×470，窄屏独立 360×700 */
  var W = { vb: "0 0 880 470", left: { x: 16, y: 16, w: 424, h: 438 }, right: { x: 456, y: 16, w: 408, h: 438 } };
  var N = { vb: "0 0 360 700", left: { x: 8, y: 8, w: 344, h: 300 }, right: { x: 8, y: 320, w: 344, h: 372 } };
  var L = W, G = null, A = 40;
  var MARK = 50, TOTAL = 100, REAL = 500;

  /* 纯函数：重捕中带标记的个数 m → 估算总数 N 与相对误差。render() 和 __bio.cases 都用它 */
  function calc(v) {
    var Nv = MARK * TOTAL / v;
    return { N: Nv, err: (Nv - REAL) / REAL * 100 };
  }

  /* 一次算清两套坐标的几何量 */
  function geom() {
    var g = {}, wide = L === W;
    g.cell = wide ? 24 : 20;
    g.r = wide ? 8 : 6.5;
    g.gx = L.left.x + (L.left.w - g.cell * 10) / 2;
    g.gy = L.left.y + (wide ? 78 : 56);
    g.bx = L.right.x + (wide ? 40 : 34);
    g.bw = L.right.w - (wide ? 80 : 68);
    g.by = L.right.y + (wide ? 110 : 96);
    g.bh = wide ? 46 : 40;
    g.maxN = 2500;
    return g;
  }

  function draw() {
    var g = G, s = calc(A), gA = $("gxA"), gB = $("gxB");
    gA.textContent = ""; gB.textContent = "";

    /* 左：第二次重捕的 100 只，红色是带标记的 */
    el("rect", { x: L.left.x, y: L.left.y, width: L.left.w, height: L.left.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    tx(gA, L.left.x + 20, L.left.y + 30, "第二次重捕 n = 100 只", "#5a6472", "start", 10.5, 700);
    tx(gA, L.left.x + 20, L.left.y + 50, "红点＝带标记的个体，数出来就是 m", "#8a94a2", "start", 9.5, 400);
    for (var i = 0; i < 100; i++) {
      var rr = Math.floor(i / 10), cc = i % 10, on = ((i * 37) % 100) < A;
      el("circle", {
        cx: g.gx + cc * g.cell + g.cell / 2, cy: g.gy + rr * g.cell + g.cell / 2,
        r: on ? g.r : g.r - 1.5, fill: on ? "#c0392b" : "#cfe0ee"
      }, gA);
    }
    var off = L === W ? 28 : 22;
    tx(gA, L.left.x + 20, g.gy + 10 * g.cell + off, "m = " + A + " 只带标记，占重捕总数的 " + A + "%", "#3a3a35", "start", 10, 700);
    tx(gA, L.left.x + 20, g.gy + 10 * g.cell + off + 20, "这个比例 ≈ M ÷ N，所以 N ≈ M ÷ 比例", "#8a94a2", "start", 9.5, 400);

    /* 右：估算值条 vs 真实值 500 */
    var ry = L.right.y, col, bg, st, sn;
    if (A >= 10) { st = "估算稳定"; col = "#2f8a5b"; bg = "#e6f6ee"; sn = "m 够大，商稳，接近真值"; }
    else if (A >= 5) { st = "误差偏大"; col = "#b8791f"; bg = "#fdf3e0"; sn = "分母偏小，开始往上飘"; }
    else { st = "严重偏大"; col = "#b8402f"; bg = "#fbeae7"; sn = "m 太小，分母一小商就炸"; }

    el("rect", { x: L.right.x, y: ry, width: L.right.w, height: L.right.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    tx(gB, L.right.x + 20, ry + 30, "估算值 N 与真实值 500 只", "#5a6472", "start", 10.5, 700);
    tx(gB, L.right.x + 20, ry + 56, "N = 50 × 100 ÷ " + A + " = " + Math.round(s.N) + " 只", "#151a21", "start", 10.5, 700);

    el("rect", { x: g.bx, y: g.by, width: g.bw, height: g.bh, rx: 6, fill: "#eef2f6" }, gB);
    el("rect", { x: g.bx, y: g.by, width: Math.max(4, Math.min(s.N, g.maxN) / g.maxN * g.bw), height: g.bh, rx: 6, fill: col }, gB);
    var txl = g.bx + REAL / g.maxN * g.bw;
    el("line", { x1: txl, y1: g.by - 12, x2: txl, y2: g.by + g.bh + 10, stroke: "#2f8a5b", "stroke-width": 1.4, "stroke-dasharray": "5 4" }, gB);
    tx(gB, txl, g.by + g.bh + 26, "真实值 500", "#2f8a5b", "middle", 9.5, 700);
    tx(gB, g.bx + g.bw, g.by - 10, Math.round(s.N) + " 只", col, "end", 10, 700);
    tx(gB, g.bx, g.by + g.bh + 26, "0", "#8a94a2", "start", 9, 400);
    tx(gB, g.bx, g.by + g.bh + 44, "相对误差 " + (s.err > 0 ? "+" : "") + s.err.toFixed(1) + "%", col, "start", 10, 700);
    tx(gB, g.bx, g.by + g.bh + 64, "分母越小，条越长：m 掉一半，条长一倍", "#8a94a2", "start", 9.5, 400);

    var byy = ry + (L === W ? 292 : 246);
    el("rect", { x: L.right.x + 20, y: byy, width: L.right.w - 40, height: 64, rx: 8, fill: bg, stroke: col + "44" }, gB);
    tx(gB, L.right.x + 36, byy + 26, A >= 10 ? "④ " + st : "④ " + st, col, "start", 14, 700);
    tx(gB, L.right.x + 36, byy + 47, sn, "#6b7280", "start", 9.5, 400);
    tx(gB, L.right.x + 20, byy + 88, "m = 10 是准点：50×100÷10 正好等于 500", "#8a94a2", "start", 9.5, 400);
  }

  function render() {
    if (!G) { L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N; G = geom(); }
    var s = calc(A), st, col, bg, sn;
    if (A >= 10) { st = "估算稳定"; col = "#2f8a5b"; bg = "#e6f6ee"; sn = "m 够大，接近真值"; }
    else if (A >= 5) { st = "误差偏大"; col = "#b8791f"; bg = "#fdf3e0"; sn = "分母偏小，开始飘"; }
    else { st = "严重偏大"; col = "#b8402f"; bg = "#fbeae7"; sn = "m 太小，商炸了"; }
    $("gxVa").textContent = String(A);
    $("gxVb").textContent = String(Math.round(s.N));
    $("gxVc").textContent = (s.err > 0 ? "+" : "") + s.err.toFixed(1) + "%";
    $("gxVc").style.color = col;
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    draw();
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    stage.setAttribute("viewBox", L.vb);
    G = null;
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  var ap = window.AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 40 }, { t: 1.2, v: 40 }, { t: 4, v: 10 }, { t: 6.5, v: 10 }, { t: 9, v: 2 }, { t: 11, v: 25 }, { t: 13, v: 40 }],
    keys: [2, 10, 25, 40],
    value: A, min: 2, max: 40, step: 1,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__bio = { calc: calc, cases: [
    { v: 5, eq: { N: 1000 } },
    { v: 10, eq: { N: 500 } },
    { v: 25, eq: { N: 200 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
