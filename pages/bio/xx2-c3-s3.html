<p class="gx-claim">一句话说清本节最该记住的判断：<b>物质循环是全球性的</b>；<b>碳在群落内部以含碳有机物流动、与无机环境之间以 CO₂ 循环</b>，所以<b>物质可循环、能量不可循环</b>。</p>
<div class="gx-meta">
<span><i></i>人教版（2019）选择性必修2 第3章第3节</span>
<span><i></i>高二 · 第3章 生态系统及其稳定性</span>
<span><i></i>阅读 14 分钟</span>
<span><i></i>含 1 个互动模型</span>
</div>
<p class="gx-lede">这一节把「生态系统靠什么维持」从能量换成物质：能量一路单向流走，物质却在生物圈里反复转圈。最容易被扣分的一件事，是把物质循环说成「在某个生态系统内部循环」——它是全球性的；另一件是把群落内部的碳说成 CO₂——CO₂ 只出现在群落与无机环境之间。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题写左边的教材语言，不写右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 物质循环的定义<span class="q-src">人教版（2019）选择性必修2 · 第3章第3节</span></p>
<p class="q-b">组成生物体的 C、H、O、N、P、S 等元素，都不断进行着从无机环境到生物群落、又从生物群落回到无机环境的循环过程，这就是生态系统的物质循环。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个条件</b>组成：①对象是组成生物体的元素；②方向是「无机环境 → 群落 → 无机环境」的<b>往返</b>，不是只进不出；③过程<b>不断进行</b>。少掉「回到无机环境」这一步，就只是吸收，不叫循环。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 全球性<span class="q-src">人教版（2019）选择性必修2 · 第3章第3节</span></p>
<p class="q-b">物质循环具有全球性，因此又叫生物地球化学循环。</p>
<p class="q-n">→ 两个条件：①范围是<b>生物圈</b>，不是一片森林、一个池塘；②所以碳、氮等元素能随大气和水<b>跨区域移动</b>，一个地方排放的 CO₂ 由全球大气共同承担。把「全球性」写成「在生态系统内部循环」，是本节最常见的失分点。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 碳的两种形式<span class="q-src">人教版（2019）选择性必修2 · 第3章第3节</span></p>
<p class="q-b">碳在生物群落与无机环境之间主要以 CO₂ 的形式循环，在生物群落内部以含碳有机物的形式流动。</p>
<p class="q-n">→ 两个方向、两种形式，别混：<b>进出无机环境走 CO₂</b>（光合固定、呼吸/分解/燃烧释放）；<b>在群落内部走含碳有机物</b>（摄食、遗体、排遗物）。写成「碳在群落内部以 CO₂ 形式流动」，直接错。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>物质循环</th><th>能量流动</th></tr></thead>
<tbody>
<tr><td>形式</td><td>C、H、O、N、P、S 等元素</td><td>有机物中的化学能</td></tr>
<tr><td>方向</td><td>往复循环，可反复利用</td><td>单向流动，逐级递减</td></tr>
<tr><td>范围</td><td>全球性（生物圈）</td><td>沿食物链（网）传递</td></tr>
<tr class="key"><td>能否循环</td><td>可以循环、反复利用</td><td>不能循环，最终以热能散失</td></tr>
<tr><td>归宿</td><td>回到无机环境，再被生物利用</td><td>离开生态系统，不再被固定</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表都要会，但考试最常考高亮这一行：<b>物质可循环、能量不可循环</b>；第二常考「范围」那一行——<b>物质循环是全球性的</b>。两句话写在一起，比只写一句稳。</p>
</section>

<p class="ex-t">例题 · 简答：物质循环的全球性与能量的单向流动<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">为什么说生态系统的物质循环具有全球性，而能量流动是单向的、不能循环？请从「元素去向」和「能量去向」两个角度作答。陷阱：题目问的是「为什么」，只写结论不给分。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 拆题：两问两角度</p>
<p class="s-b">题目要比较两个对象：物质（元素）与能量。各问一句「为什么」，所以每问都要有去向、有原因，不能只抄定义。</p>
<p class="s-k">用到：物质循环的定义、能量流动的特点。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 元素去向：能跨区域、能回到无机环境</p>
<p class="s-b">C、H、O、N、P、S 等元素以 CO₂、无机盐等形式进入群落，又以 CO₂、遗体分解产物回到无机环境；大气和水使这些元素能在生物圈范围内移动，所以物质循环具有全球性，又叫生物地球化学循环。</p>
<p class="s-k">用到：全球性、生物地球化学循环。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 能量去向：一路散失，回不来</p>
<p class="s-b">能量沿食物链单向流动、逐级递减；每一营养级都有大量能量通过呼吸作用以热能形式散失，热能不能再被生产者固定，所以能量不能循环。</p>
<p class="s-k">用到：单向流动、逐级递减、热能散失。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 落笔：一句对比收尾</p>
<p class="s-b">把两问压成一句判断：物质可循环、能量不可循环；物质循环是全球性的。再补一句碳的形式：碳在群落内部以含碳有机物流动，与无机环境之间以 CO₂ 循环。</p>
<p class="s-k">用到：对比表述 + 碳的两种形式。</p>
</li>

<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">① 物质循环具有全球性：组成生物体的 C、H、O、N、P、S 等元素，可从无机环境进入生物群落，又能回到无机环境被再次利用；这些元素可随大气和水在生物圈范围内移动，因此物质循环具有全球性，又叫生物地球化学循环。② 能量流动是单向的：能量沿食物链（网）单向流动、逐级递减，各营养级通过呼吸作用以热能形式散失的能量不能再被固定和利用，所以能量不能循环。③ 结论：物质可循环、能量不可循环；碳在群落内部以含碳有机物流动，与无机环境之间以 CO₂ 循环。</p>

<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 物质循环只在一个生态系统内部进行。</p>
<p class="er-v">✓ 物质循环具有全球性，因此又叫生物地球化学循环。</p>
<p class="er-w">错在哪：把范围缩小成一片森林、一个池塘；元素会随大气和水跨区域移动。</p>
</div>
<div class="er">
<p class="er-x">✗ 碳在生物群落内部以 CO₂ 的形式流动。</p>
<p class="er-v">✓ 碳在群落内部以含碳有机物形式流动；与无机环境之间才以 CO₂ 形式循环。</p>
<p class="er-w">错在哪：两种形式搞反；群落内部的传递靠摄食、遗体，不是靠 CO₂。</p>
</div>
<div class="er">
<p class="er-x">✗ 能量可以在生态系统中循环利用。</p>
<p class="er-v">✓ 能量单向流动、逐级递减，最终以热能散失，不能循环。</p>
<p class="er-w">错在哪：把物质的可循环套到能量上；物质可循环、能量不可循环。</p>
</div>
<div class="er">
<p class="er-x">✗ 物质循环和能量流动一样，都是单向的。</p>
<p class="er-v">✓ 物质可循环、反复利用；能量单向流动、逐级递减。</p>
<p class="er-w">错在哪：只记住「流动」两个字，忽略了物质能回到无机环境被再次利用。</p>
</div>
<div class="er">
<p class="er-x">✗ 分解者不参与碳循环。</p>
<p class="er-v">✓ 分解者把遗体、排遗物中的有机物分解成 CO₂ 和无机盐，是碳返回大气的重要途径。</p>
<p class="er-w">错在哪：只盯着光合作用和呼吸作用，漏掉分解作用这条返回路径。</p>
</div>
<div class="er">
<p class="er-x">✗ 碳循环只在生物与生物之间进行。</p>
<p class="er-v">✓ 碳在群落与无机环境之间以 CO₂ 循环，在群落内部以含碳有机物流动。</p>
<p class="er-w">错在哪：漏掉无机环境这一头，循环就成了一半。</p>
</div>
<div class="er">
<p class="er-x">✗ 化石燃料燃烧与碳循环无关，只是污染空气。</p>
<p class="er-v">✓ 燃烧把封存的碳快速释放为 CO₂，使大气 CO₂ 累积、温室效应加剧，改变了碳循环的收支。</p>
<p class="er-w">错在哪：没看到地质碳库也是碳循环的一部分，燃烧是人为加快的返回途径。</p>
</div>
