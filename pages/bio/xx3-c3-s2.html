<p class="gx-lede">上一节讲清了「基因工程是什么、工具酶怎么用」，这一节把它落成一张可执行的施工流程：四步顺序、载体零件、PCR 扩增。最容易错的一件事：把「导入」写在「构建载体」前面——没有载体，导入的只是一段孤立的 DNA，进细胞也不会表达。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 基本操作程序<span class="q-src">人教版（2019）选择性必修3 · 第3章第2节</span></p>
<p class="q-b">基因工程的基本操作程序包括目的基因的获取、基因表达载体的构建、将目的基因导入受体细胞、目的基因的检测与鉴定。</p>
<p class="q-n">→ 翻成人话：这是<b>一条有先后顺序的流水线</b>，四个环节缺一不可，而且<b>顺序不能颠倒</b>——先拿到目的基因（①），才能把它装进载体（②）；装好了才能导入（③）；导入后才有东西可检测（④）。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 载体的组成<span class="q-src">人教版（2019）选择性必修3 · 第3章第2节</span></p>
<p class="q-b">基因表达载体包括目的基因、启动子、终止子和标记基因等。</p>
<p class="q-n">→ 翻成人话：这句话由<b>四个条件</b>组成（目的基因 ①、启动子 ②、终止子 ③、标记基因 ④），少一个都会出问题：没启动子→不转录；没终止子→转录停不下来；没标记基因→筛不出谁成功了。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · PCR 技术<span class="q-src">人教版（2019）选择性必修3 · 第3章第2节</span></p>
<p class="q-b">PCR 技术能在体外大量扩增目的基因。</p>
<p class="q-n">→ 翻成人话：关键词是<b>「体外」</b>——不经过活细胞，在试管里靠<b>高温变性、低温复性、中温延伸</b>三步循环，每一轮把目的基因<b>翻一倍</b>，所以 n 轮是 <span class="gx-fml">2ⁿ</span> 倍，不是 n 倍。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>步骤</th><th>要做什么</th><th>最容易写错的地方</th></tr></thead>
<tbody>
<tr><td>① 目的基因的获取</td><td>从基因文库中取、用 PCR 扩增、或化学合成</td><td>以为「获取」只能靠合成</td></tr>
<tr class="key"><td>② 基因表达载体的构建</td><td>目的基因 + 启动子 + 终止子 + 标记基因</td><td><b>漏写启动子</b>；或把这一步排到导入之后</td></tr>
<tr><td>③ 将目的基因导入受体细胞</td><td>植物用农杆菌转化法，动物用显微注射法，微生物用感受态细胞法</td><td>写成「先导入再构建载体」</td></tr>
<tr><td>④ 目的基因的检测与鉴定</td><td>分子水平检测 DNA、mRNA、蛋白质；个体水平做性状鉴定</td><td>只写「检测」不写层次和手段</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只高亮 1 行：②。背的顺序口诀是「取—构—导—检」，考场上先默这四个字，再往里填术语。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · PCR 扩增倍数 + 缺试剂分析<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">某目的基因（双链 DNA）在体外进行 PCR 扩增，共完成 30 次循环。<br>（1）理论上，扩增产物是原来的多少倍？<br>（2）若反应体系中忘记加引物，还能得到扩增产物吗？说明理由。<br>（3）若只循环 10 次，产物约多少个拷贝？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 定性：这是什么模型</p>
<p class="s-b">PCR 是体外扩增，每完成一轮循环，目的基因就复制一次，拷贝数翻一倍。所以 n 轮后的拷贝数是 2 的 n 次方，而不是 n 倍。</p>
<p class="s-k">用到：PCR 在体外大量扩增目的基因 → 指数增长。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 代公式算第（1）问</p>
<p class="s-b">拷贝数 = 2³⁰ = 1 073 741 824 ≈ 1.07×10⁹。因为起点是 1 个拷贝，「多少倍」和「多少个」在数值上相同，写成约十亿倍即可。</p>
<p class="s-k">用到：2ⁿ 模型；科学计数法保留两位有效数字。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 第（2）问：缺引物的后果</p>
<p class="s-b">得不到扩增产物。DNA 聚合酶不能凭空起始合成，只能把新的核苷酸接到已有的 3′ 端上；引物提供的就是这个起点，同时决定扩增片段的两个端点。</p>
<p class="s-k">用到：PCR 需要引物、模板、dNTP 和 Taq 酶——缺一不可。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 第（3）问：换成 10 轮</p>
<p class="s-b">2¹⁰ = 1024，即约 1.0×10³ 个拷贝。可见轮数只少了 20 轮，数量却差了 6 个数量级。</p>
<p class="s-k">用到：指数增长——自变量在指数上，差一点就差很多。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 回头检查三个表述</p>
<p class="s-b">①「倍」与「个」有没有混用；②有没有写成 30 倍；③科学计数法的指数有没有写错（10⁹ 不是 10⁶）。</p>
<p class="s-k">用到：阅卷口径——数量级错等于全错。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）2³⁰ = 1 073 741 824 ≈ 1.07×10⁹，即约十亿倍（约 10.7 亿倍）。<br>（2）不能。PCR 需要引物、模板、dNTP 和 Taq 酶，缺一不可；引物与模板链互补配对，为 DNA 聚合酶提供合成新链的 3′ 端起点，并决定扩增片段的端点，没有引物就无法起始合成。<br>（3）2¹⁰ = 1024，约 1.0×10³ 个拷贝（1024 倍）。</p>
</div>
</div>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「基因工程的四个步骤，我顺序总记混，怎么办？」</p>
<p class="a">背口诀「<b>取—构—导—检</b>」：获取目的基因 → 构建基因表达载体 → 将目的基因导入受体细胞 → 目的基因的检测与鉴定。<b>构建载体一定在导入之前</b>。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="四步顺序示意">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<rect x="18" y="26" width="46" height="24" rx="4" fill="#eef7f2" stroke="#5fb98d"/>
<text x="41" y="42" text-anchor="middle" font-size="9" fill="#1f6b48">获取</text>
<rect x="74" y="26" width="46" height="24" rx="4" fill="#eef7f2" stroke="#5fb98d"/>
<text x="97" y="42" text-anchor="middle" font-size="9" fill="#1f6b48">构建</text>
<rect x="130" y="26" width="46" height="24" rx="4" fill="#eef7f2" stroke="#5fb98d"/>
<text x="153" y="42" text-anchor="middle" font-size="9" fill="#1f6b48">导入</text>
<rect x="186" y="26" width="38" height="24" rx="4" fill="#eef7f2" stroke="#5fb98d"/>
<text x="205" y="42" text-anchor="middle" font-size="9" fill="#1f6b48">检测</text>
<text x="70" y="76" text-anchor="middle" font-size="9" fill="#5a6472">→</text>
<text x="126" y="76" text-anchor="middle" font-size="9" fill="#5a6472">→</text>
<text x="182" y="76" text-anchor="middle" font-size="9" fill="#5a6472">→</text>
<text x="120" y="104" text-anchor="middle" font-size="9" font-weight="700" fill="#b8402f">② 在 ③ 之前，不可颠倒</text>
</svg>
</div>
<div class="qac">
<p class="q">「表达载体里到底必须有什么？只写目的基因行吗？」</p>
<p class="a">不行。必须写全：<b>目的基因、启动子、终止子、标记基因</b>（还可有复制原点）。启动子决定<b>转录起始</b>，缺了它目的基因不表达。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="表达载体四部分组成">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<rect x="18" y="46" width="42" height="20" rx="3" fill="#fdf3e0" stroke="#d9a94a"/>
<text x="39" y="60" text-anchor="middle" font-size="8.4" fill="#8a5c12">启动子</text>
<rect x="60" y="46" width="60" height="20" rx="3" fill="#eef7f2" stroke="#5fb98d"/>
<text x="90" y="60" text-anchor="middle" font-size="8.4" fill="#1f6b48">目的基因</text>
<rect x="120" y="46" width="42" height="20" rx="3" fill="#fdf3e0" stroke="#d9a94a"/>
<text x="141" y="60" text-anchor="middle" font-size="8.4" fill="#8a5c12">终止子</text>
<rect x="162" y="46" width="52" height="20" rx="3" fill="#eaf2fb" stroke="#7aa8d8"/>
<text x="188" y="60" text-anchor="middle" font-size="8.4" fill="#2b5c8a">标记基因</text>
<text x="120" y="92" text-anchor="middle" font-size="9" fill="#5a6472">四样都要有，缺一不可</text>
<text x="120" y="110" text-anchor="middle" font-size="9" font-weight="700" fill="#b8402f">无启动子 → 不转录</text>
</svg>
</div>
<div class="qac">
<p class="q">「PCR 有模板、有酶、有原料，为什么还非要引物？」</p>
<p class="a">DNA 聚合酶只能把核苷酸接到<b>已有链的 3′ 端</b>，不能从零起始。引物是一小段单链 DNA，与模板<b>互补配对</b>后提供这个 3′ 端起点，同时<b>决定扩增片段的两个端点</b>。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="引物提供合成起点">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="30" y1="54" x2="210" y2="54" stroke="#8a919b" stroke-width="2"/>
<text x="30" y="48" font-size="8.6" fill="#5a6472">模板链 3′</text>
<line x1="70" y1="70" x2="130" y2="70" stroke="#b8791f" stroke-width="3"/>
<text x="70" y="86" font-size="8.6" fill="#8a5c12">引物（3′ 端在此）</text>
<line x1="130" y1="70" x2="206" y2="70" stroke="#2f8a5b" stroke-width="3" stroke-dasharray="4 3"/>
<text x="130" y="104" font-size="8.6" fill="#1f6b48">新链由 5′→3′ 延伸</text>
</svg>
</div>
<div class="qac">
<p class="q">「PCR 和细胞里的 DNA 复制，不就是一回事吗？」</p>
<p class="a">不是。<b>PCR 在体外</b>、需<b>高温变性</b>解链（体内靠解旋酶）、用<b>Taq 酶</b>（体内是普通 DNA 聚合酶）、需要<b>一对人工引物</b>；体内复制在细胞内、由解旋酶解链、需要多种酶和能量。共同点是都<b>半保留复制、5′→3′ 延伸</b>。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="PCR 与体内复制对比">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="66" y="32" text-anchor="middle" font-size="9" font-weight="700" fill="#2b5c8a">PCR</text>
<text x="174" y="32" text-anchor="middle" font-size="9" font-weight="700" fill="#1f6b48">体内复制</text>
<line x1="120" y1="20" x2="120" y2="112" stroke="#dde4ea" stroke-width="1"/>
<text x="64" y="56" text-anchor="middle" font-size="8.4" fill="#3a3a35">体外、试管</text>
<text x="64" y="76" text-anchor="middle" font-size="8.4" fill="#3a3a35">高温解链</text>
<text x="64" y="96" text-anchor="middle" font-size="8.4" fill="#3a3a35">Taq 酶</text>
<text x="176" y="56" text-anchor="middle" font-size="8.4" fill="#3a3a35">细胞内</text>
<text x="176" y="76" text-anchor="middle" font-size="8.4" fill="#3a3a35">解旋酶解链</text>
<text x="176" y="96" text-anchor="middle" font-size="8.4" fill="#3a3a35">普通聚合酶</text>
</svg>
</div>
<div class="qac">
<p class="q">「为什么不直接把目的基因导进去，非要先构建载体？」</p>
<p class="a">裸露的目的基因进入细胞后<b>没有启动子和终止子</b>，不能转录；也<b>没有标记基因</b>，无法筛选出成功导入的细胞；还不能复制。载体负责「<b>能进去、能表达、能被筛出来</b>」这三件事，所以<b>必须先构建再导入</b>。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="载体承担三件事">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<rect x="22" y="24" width="196" height="30" rx="6" fill="#eef7f2" stroke="#5fb98d"/>
<text x="120" y="44" text-anchor="middle" font-size="9" fill="#1f6b48">载体：能进入受体细胞</text>
<rect x="22" y="62" width="196" height="30" rx="6" fill="#fdf3e0" stroke="#d9a94a"/>

<rect x="22" y="100" width="196" height="24" rx="6" fill="#eaf2fb" stroke="#7aa8d8"/>
<text x="120" y="116" text-anchor="middle" font-size="9" fill="#2b5c8a">标记基因：能筛选</text>
</svg>
</div>
<div class="qac">
<p class="q">「检测目的基因，写一个『检测』就够了吗？」</p>
<p class="a">不够，要分层写：<b>分子水平</b>——DNA 分子杂交（是否插入）、分子杂交检测 mRNA（是否转录）、<b>抗原—抗体杂交</b>（是否翻译出蛋白质）；<b>个体水平</b>——抗虫、抗病等性状鉴定。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="检测的三个层次">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<rect x="20" y="24" width="200" height="24" rx="5" fill="#eaf2fb" stroke="#7aa8d8"/>
<text x="120" y="40" text-anchor="middle" font-size="8.8" fill="#2b5c8a">DNA 分子杂交 → 是否插入</text>
<rect x="20" y="56" width="200" height="24" rx="5" fill="#eef7f2" stroke="#5fb98d"/>
<text x="120" y="72" text-anchor="middle" font-size="8.8" fill="#1f6b48">分子杂交 → 是否转录出 mRNA</text>
<rect x="20" y="88" width="200" height="24" rx="5" fill="#fdf3e0" stroke="#d9a94a"/>
<text x="120" y="104" text-anchor="middle" font-size="8.8" fill="#8a5c12">抗原—抗体杂交 → 是否翻译</text>
</svg>
</div>
</div>
<p class="gx-note">这六问其实是同一件事：<b>四步是一条有顺序的流水线，载体是这条流水线的枢纽</b>——顺序为了「先装好再送进去」，载体的零件为了「进得去、表达得出、筛得出来」，PCR 为了「先有足够的货」。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 先把目的基因导入受体细胞，再构建基因表达载体</p>
<p class="er-v">✓ 先构建基因表达载体，再将目的基因导入受体细胞</p>
<p class="er-w">错在哪：四步顺序不能颠倒。裸露的目的基因没有启动子和标记基因，导进去也不能表达、也无法筛选。</p>
</div>

document.addEventListener("DOMContentLoaded", function () {

  function calc(v) {

  }

  function sci(x) {
    if (x < 1000) return String(x);
    var e = Math.floor(Math.log(x) / Math.LN10);
    return (x / Math.pow(10, e)).toFixed(2) + "×10" + sup(e);
  }
  function times(x) {
    if (x >= 1e8) return (x / 1e8).toFixed(2) + " 亿倍";
    if (x >= 1e4) return (x / 1e4).toFixed(1) + " 万倍";

      px0: rt.x + 50, px1: rt.x + rt.w - 24,
      pyT: rt.y + 66, pyB: rt.y + 298
    };
  }
  function logY(g, lv) { return g.pyB - (lv / 9) * (g.pyB - g.pyT); }

  /* 中文按字数换行，避免长句冲出面板 */
  function wrap(parent, x, y, s, maxW, fs, col, lh) {
    var per = Math.max(6, Math.floor(maxW / fs)), lines = [], cur = "";
    for (var i = 0; i < s.length; i++) { cur += s.charAt(i); if (cur.length >= per) { lines.push(cur); cur = ""; } }
    if (cur) lines.push(cur);
    for (var k = 0; k < lines.length; k++) tx(parent, x, y + k * lh, lines[k], col, "start", fs, 400);

    gA.textContent = ""; gB.textContent = "";
    var lf = L.left, rt = L.right, i;

    for (i = 0; i < 30; i++) {
      var on = i < s.n;
      el("rect", {
        x: lf.x + 18 + i * g.sq, y: lf.y + 46, width: Math.max(4, g.sq - 2.4), height: 24, rx: 2.5,

    tx(gA, lf.x + lf.w - 18, lf.y + 88, "第 30 轮", "#8a919b", "end", 8.6, 400);
    tx(gA, lf.x + 18, lf.y + 108, "已循环 " + s.n + " 轮，剩余 " + (30 - s.n) + " 轮", "#2f8a5b", "start", 9.4, 700);

    /* 主公式 */
    tx(gA, lf.x + 18, lf.y + 148, "拷贝数 = 2ⁿ", "#151a21", "start", 17, 700);
    tx(gA, lf.x + 18, lf.y + 174, "起始 1 个目的基因，每轮翻一倍", "#3a3a35", "start", 9.4, 400);
    tx(gA, lf.x + 18, lf.y + 192, "n = " + s.n + " → " + sci(s.copies) + " 个拷贝", "#b8791f", "start", 10.2, 700);

    el("line", { x1: lf.x + 18, y1: lf.y + 208, x2: lf.x + lf.w - 18, y2: lf.y + 208, stroke: "#e6e9ee", "stroke-width": 1 }, gA);
    tx(gA, lf.x + 18, lf.y + 230, "一轮循环走三步，箭头首尾相接", "#5a6472", "start", 9.4, 700);

    var pw = (lf.w - 36 - 20) / 3, py = lf.y + 242;
    var names = [["94 ℃", "变性", "#fbeae7", "#b8402f", "#e9bdb4"],
      ["55 ℃", "复性", "#eaf2fb", "#2b5c8a", "#7aa8d8"],
      ["72 ℃", "延伸", "#eef7f2", "#1f6b48", "#5fb98d"]];
    for (i = 0; i < 3; i++) {
      var px = lf.x + 18 + i * (pw + 10);
      el("rect", { x: px, y: py, width: pw, height: 32, rx: 6, fill: names[i][2], stroke: names[i][4] }, gA);
      tx(gA, px + pw / 2, py + 14, names[i][0], names[i][3], "middle", 8.8, 700);
      tx(gA, px + pw / 2, py + 27, names[i][1], names[i][3], "middle", 8.8, 400);
    }
    tx(gA, lf.x + 18, py + 50, "延伸结束 → 回到 94 ℃ 变性，进入下一轮", "#3a3a35", "start", 9.2, 400);
    wrap(gA, lf.x + 18, py + 70, "n 在指数上：轮数只加 10，拷贝数就差 1000 倍。", lf.w - 36, 9.2, "#5a6472", 14);

    /* 右侧：对数刻度曲线 + 当前位置 */
    el("rect", { x: rt.x, y: rt.y, width: rt.w, height: rt.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    tx(gB, rt.x + 18, rt.y + 28, "循环次数 → 拷贝数（纵轴取对数）", "#5a6472", "start", 10.5, 700);

    var logs = [0, 3, 6, 9], labs = ["1", "10³", "10⁶", "10⁹"];
    for (i = 0; i < 4; i++) {
      var gy = logY(g, logs[i]);
      el("line", { x1: g.px0, y1: gy, x2: g.px1, y2: gy, stroke: "#eef1f5", "stroke-width": 1 }, gB);
      tx(gB, g.px0 - 6, gy + 3, labs[i], "#8a919b", "end", 8.4, 400);
    }
    el("line", { x1: g.px0, y1: g.pyB, x2: g.px1, y2: g.pyB, stroke: "#c8d3dc", "stroke-width": 1.2 }, gB);
    el("line", { x1: g.px0, y1: g.pyB, x2: g.px0, y2: g.pyT - 4, stroke: "#c8d3dc", "stroke-width": 1.2 }, gB);
    for (i = 0; i <= 3; i++) {
      var nx = g.px0 + (i * 10 / 30) * (g.px1 - g.px0);
      tx(gB, nx, g.pyB + 14, String(i * 10), "#8a919b", "middle", 8.4, 400);
    }

  }

  function render() {
    if (!G) { L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N; G = geom(); }
    var s = calc(A), st, col, bg, sn;
    $("gxVa").textContent = String(s.n);

    $("gxVc").textContent = times(s.copies);

    else if (s.n <= 28) { st = "接近足够"; col = "#b8791f"; bg = "#fdf3e0"; sn = "再几轮就到十亿倍"; }
    else { st = "足够测序或电泳"; col = "#2f8a5b"; bg = "#e6f6ee"; sn = "指数放大，n=30 约十亿倍"; }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;

  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");

    { v: 30, eq: { copies: 1073741824 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
