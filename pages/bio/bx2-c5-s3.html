<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">人类遗传病的概念<span class="q-src">人教版（2019）必修2 · 第5章第3节</span></p>
<p class="q-b">人类遗传病通常是指由遗传物质改变而引起的人类疾病，主要分为单基因遗传病、多基因遗传病和染色体异常遗传病。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个条件</b>组成——① 病在人类身上；② 原因是<b>遗传物质改变</b>（基因突变、基因重组、染色体变异都算，不只基因突变）；③ 按「改了什么、几对基因」分<b>三类</b>。少掉②，就会把「先天性疾病」「家族性疾病」都算进来；少掉③，就没法给 21 三体归位。</p>
</div>

<div class="gx-quote">
<p class="q-t">单基因遗传病的判据<span class="q-src">人教版（2019）必修2 · 第5章第3节</span></p>
<p class="q-b">单基因遗传病受一对等位基因控制，如多指、白化病、红绿色盲。</p>
<p class="q-n">→ 注意「<b>一对</b>」这两个字：一对等位基因 = 一个基因位点上的两种版本，不是「一个基因」。所以白化病（常染色体隐性）、多指（常染色体显性）、红绿色盲（伴X隐性）都算单基因病，只是<b>遗传方式不同</b>；判断遗传方式靠系谱图，判断类别靠「几对基因 / 改没改染色体」。</p>
</div>

<div class="gx-quote">
<p class="q-t">遗传病的预防<span class="q-src">人教版（2019）必修2 · 第5章第3节</span></p>
<p class="q-b">通过遗传咨询和产前诊断等手段，可在一定程度上预防遗传病的产生。</p>
<p class="q-n">→ 三个词都要能展开：<b>遗传咨询</b>（问家族史、推算后代再发风险）、<b>产前诊断</b>（羊水检查、B 超检查、基因检测等，在出生前查胎儿）、<b>一定程度上</b>（是预防「患儿出生」，不是把病治好；产前诊断不能治疗遗传病）。写「可以治愈」就全错。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>单基因遗传病</th><th>多基因遗传病</th><th>染色体异常遗传病</th></tr></thead>
<tbody>
<tr><td>遗传基础</td><td>一对等位基因</td><td>两对以上基因 + 环境</td><td>染色体结构或数目异常</td></tr>
<tr><td>典型实例</td><td>白化病、多指、红绿色盲</td><td>唇裂、原发性高血压、青少年型糖尿病</td><td>21 三体综合征、猫叫综合征</td></tr>
<tr><td>家族聚集</td><td>符合孟德尔比例，可算再发风险</td><td>常呈家族聚集，但比例算不出来</td><td>多为偶发，与父母年龄等因素有关</td></tr>
<tr class="key"><td>21 三体综合征属于哪类</td><td>不是</td><td>不是</td><td>是：多了一条 21 号染色体，属染色体数目异常</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">背法：先看「<b>改的是基因还是染色体</b>」——改染色体直接归第三类，别再去数基因；再数「<b>一对</b>还是<b>两对以上</b>」。表里只高亮那一行，因为考试就用它设陷阱：21 三体是染色体异常，不是单基因病。</p>
</section>

<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 定性：先把「发病率」翻译成基因型频率</p>
<p class="s-b">常染色体隐性病，只有 aa 才患病，所以发病率就是 aa 的基因型频率，即 <span class="gx-fml">q² = 1/10000</span>。注意：发病率不是 q，也不是 2q。</p>

<li class="step" hidden>

<p class="s-b"><span class="gx-fml">q² = 1/10000</span>，开方得 <span class="gx-fml">q = 1/100 = 0.01</span>。这是致病基因 a 的频率。</p>
<p class="s-k">用到：哈代—温伯格平衡下 q² 与 q 的关系。</p>

<p class="s-b"><span class="gx-fml">p = 1 − q = 99/100 = 0.99</span>。等位基因频率之和为 1，这一步不能省，下一步要用。</p>

<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 21 三体综合征是单基因遗传病，因为 21 号染色体上多了一些基因。</p>

<p class="er-w">错在哪：多的是<b>整条染色体</b>，不是某个基因。单基因病的前提是「受一对等位基因控制」，分类第一步就把染色体异常排除了。</p>
</div>

<div class="er">
<p class="er-x">✗ 近亲结婚会使各种遗传病的发病风险都升高。</p>

<p class="er-w">错在哪：显性病只要有一个致病基因就发病，与双方是否同带<b>隐性</b>基因无关；被放大的是「携带者×携带者」这种情形。</p>
</div>

<div class="er">
<p class="er-x">✗ 多基因遗传病不受环境影响，完全由基因决定。</p>
<p class="er-v">✓ 多基因遗传病由两对以上基因控制，易受环境影响，常呈家族聚集，但不符合孟德尔比例。</p>
<p class="er-w">错在哪：把多基因病当单基因病看，漏掉了环境和「多基因累加」这一半，也容易错答「同胞发病率 1/4」。</p>
</div>

<div class="er">
<p class="er-x">✗ 携带者就是患者，只是症状比较轻。</p>
<p class="er-v">✓ 携带者是杂合子，隐性致病基因被显性正常基因掩盖，表现型正常，不是患者。</p>
<p class="er-w">错在哪：混淆「携带」与「患病」。隐性病能代代潜伏传递，正是因为携带者无症状。</p>
</div>

<div class="er">
<p class="er-x">✗ 人类遗传病都是由基因突变引起的。</p>
<p class="er-v">✓ 人类遗传病由遗传物质改变引起，包括基因突变、基因重组和染色体变异。</p>
<p class="er-w">错在哪：漏掉染色体变异，就解释不了 21 三体综合征、猫叫综合征；也漏掉了多基因病中环境的叠加作用。</p>

<div class="er">
<p class="er-x">✗ 产前诊断可以治疗遗传病，让胎儿恢复正常。</p>
<p class="er-v">✓ 产前诊断是在出生前检测胎儿是否患某种遗传病或先天性疾病，属于预防手段，不能治疗遗传病。</p>
<p class="er-w">错在哪：把「预防患儿出生」写成「治病」。教材的原话是「可在一定程度上预防遗传病的产生」。</p>
</div>

<div class="er">
<p class="er-x">✗ 遗传病就是先天性疾病，出生时没表现出来就不是遗传病。</p>
<p class="er-v">✓ 遗传病由遗传物质改变引起；有的遗传病要到达一定年龄才表现，如多基因遗传病中的原发性高血压。</p>
<p class="er-w">错在哪：「先天」说的是出生时就表现，「遗传」说的是病因来自遗传物质，两个口径不能画等号。</p>
