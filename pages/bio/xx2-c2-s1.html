<p class="gx-lede">这一节是第2章「群落及其演替」的开头：先把「群落」的边界划清（所有生物，不只植物），再讲它怎么在空间上排布（垂直是分层、水平是镶嵌），最后落到生态位与竞争这条因果链上。最容易错的一件事：把「垂直结构」当成「高矮不同」的形容词，把「水平结构」当成「分层」的另一种说法——方向错了，后面生态位、演替全跟着错。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 群落的概念<span class="q-src">人教版（2019）选择性必修2 · 第2章第1节</span></p>
<p class="q-b">群落是指同一时间内聚集在一定区域中各种生物种群的集合。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个条件</b>组成：①「同一时间」——不是不同年份的累加；②「一定区域」——有明确边界；③「各种生物种群」——<b>群落是所有生物不只植物</b>，动物、细菌、真菌全算。少掉第③个条件，就会写出「一片森林的群落就是所有树木」这种错句。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 空间结构<span class="q-src">人教版（2019）选择性必修2 · 第2章第1节</span></p>
<p class="q-b">群落中各个生物种群分别占据了不同的空间，使群落形成一定的空间结构，包括垂直结构和水平结构。</p>
<p class="q-n">→ 翻成人话：这句话由<b>两个并列项</b>组成，且方向不同：竖向看是<b>垂直结构</b>，横向看是<b>水平结构</b>。记死一句：<b>垂直是分层、水平是镶嵌</b>。写成「垂直结构表现为镶嵌分布」立刻扣分，因为镶嵌说的是水平方向上的斑块。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 生态位<span class="q-src">人教版（2019）选择性必修2 · 第2章第1节</span></p>
<p class="q-b">生态位是指一个物种在群落中的地位或作用，包括所处的空间位置、占用资源的情况以及与其它物种的关系等。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个维度</b>组成（空间位置 / 占用资源 / 与其它物种的关系），只写「它吃什么」就漏了两个维度。由此得出本节主因果链：两个物种的生态位<b>重叠越多竞争越激烈</b>，重叠到一定程度就只能分化或有一方被排除。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>垂直结构</th><th>水平结构</th></tr></thead>
<tbody>
<tr><td>看的方向</td><td>上下（垂直方向）</td><td>左右（水平方向）</td></tr>
<tr><td>主要决定因素</td><td>光照、食物、溶解氧等随高度/深度变化</td><td>地形起伏、土壤湿度、光照强弱、生物自身特点</td></tr>
<tr><td>外形表现</td><td>分层：乔木层—灌木层—草本层—地被层</td><td>镶嵌分布：斑块状，斑块间常有过渡带</td></tr>
<tr><td>典型例子</td><td>森林分层；湖泊中鲢、鳙在上层，螺、蚌在底层</td><td>林下阴湿处苔藓成片、阳坡与阴坡植物不同</td></tr>
<tr><td>是否只指植物</td><td>不是，动物、微生物同样分层</td><td>不是，群落是所有生物不只植物</td></tr>
<tr class="key"><td>一句话判断</td><td>「上下不一样」＝垂直分层</td><td>「左右不一样」＝水平镶嵌</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只高亮 1 行（tr class="key"）。背法：先问「题目在说哪个方向」——说上下就是<b>垂直是分层</b>，说左右、斑块、镶嵌就是<b>水平是镶嵌</b>；再看决定因素，光照食物归垂直，地形湿度归水平。</p>
</section>

<section class="gx-sec" id="b">

<p class="gx-h2s">四张图：各讲一件事，按「是什么 → 怎么变 → 怎么用」排。</p>

<p class="gx-note">口径提醒：<b>垂直是分层</b>指方向；写成「垂直结构是镶嵌」即错，那是水平结构。</p>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 生态位分化与共存<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">同一片森林里，几种鸟都在树上取食昆虫，为什么能够长期共存？请从生态位的角度分点作答。陷阱点：题目没说「它们吃不同的虫」，只说了「都在树上取食昆虫」——不要凭空编「它们不竞争」。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性</p>
<p class="s-b">抓三个信息：「同一片森林」＝同一个群落、同一区域；「几种鸟都取食昆虫」＝占用资源相同，生态位有重叠；「长期共存」＝要解释一个稳定的结果。定性结论：这是一道用<b>生态位分化</b>解释共存的原因题。</p>
<p class="s-k">用到：群落的概念（同一区域、各种生物种群）、生态位的三个维度。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 先假设「不分化」会怎样</p>
<p class="s-b">如果几种鸟的取食高度、取食时间、食物大小完全一样，它们的生态位几乎完全重叠，竞争强度接近 1。按「<b>重叠越多竞争越激烈</b>」这条链推下去，竞争排斥会让弱者被排除——那就无法长期共存，与题干矛盾。</p>
<p class="s-k">用到：生态位重叠 → 竞争强度；竞争排斥。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 找出它们实际的分化</p>
<p class="s-b">回归题干「都在树上」，但树上是有层次的：林冠、树干、林下层是不同的<b>空间位置</b>；昆虫白天活动、蛾类夜间活动是不同的<b>时间</b>；虫有大有小是不同的<b>资源（食物大小）</b>。三种鸟只要在这三个维度上错开，生态位重叠就大幅下降。</p>
<p class="s-k">用到：生态位的三个维度，正好对应<b>垂直是分层</b>这张图。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 连成因果链作答</p>
<p class="s-b">取食高度/时间/食物大小不同 → 生态位分化 → 生态位重叠小 → 竞争强度弱（远低于 0.8）→ 各物种都能获得足够资源 → 长期共存。注意方向不能反：是「因为分化所以重叠小」，不是「因为共存所以不竞争」。</p>
<p class="s-k">用到：互动的判据 <span class="gx-fml" style="font-family:ui-monospace,Consolas,monospace;color:#1e5c3f;background:#f1f7f3;border-radius:4px;padding:1px 4px">可共存 = 重叠度 ÷ 100 &lt; 0.8</span>。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 反推检验（防丢分）</p>
<p class="s-b">若题目改成「这几种鸟的生态位完全重叠」，答案必须改成：竞争激烈、可能有一方被排除、或被迫发生生态位分化。另外补一句：这片森林里除了鸟，还有乔木、灌木、草本、昆虫、真菌——<b>群落是所有生物不只植物</b>，「几种鸟」只是群落的一小部分。</p>
<p class="s-k">用到：竞争的结果（排除 / 分化 / 共存）、群落的范围。</p>
</li>
</ol>

<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">① 这几种鸟的取食空间位置不同（林冠、树干、林下层），或取食时间不同，或取食的昆虫大小不同，即<b>生态位发生分化</b>。<br>② 生态位分化后，它们对资源的<b>重叠程度小</b>，<b>竞争强度弱</b>，各自都能获得足够的食物与空间。<br>③ 因此能够长期共存；若生态位完全重叠，则竞争激烈，通常有一方被排除，或被迫分化。<br>④ 补充：该森林群落包括乔木、灌木、草本、动物与微生物，<b>群落是所有生物不只植物</b>。</p>
