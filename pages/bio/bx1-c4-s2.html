<p class="gx-lede">上一节讲的是「不花能量」的被动运输：自由扩散、协助扩散都顺着浓度梯度走。这一节补上另外两类——主动运输和胞吞、胞吐，它们的共同点是<b>要消耗能量</b>，区别在于一个靠载体蛋白把物质「泵」过膜，另一个靠膜自己「包」起物质。最容易错的一件事：把胞吞、胞吐也算进「跨膜运输」，其实物质从头到尾没有穿过磷脂双分子层。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 主动运输的定义<span class="q-src">人教版（2019）必修1 · 第4章第2节</span></p>
<p class="q-b">物质逆浓度梯度进行跨膜运输，需要载体蛋白的协助，同时还需要消耗细胞内化学反应所释放的能量，这种方式叫作主动运输。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个条件</b>组成——① 方向是「逆浓度梯度」，从低浓度一侧运到高浓度一侧，这是「主动」二字的来源；② 需要<b>载体蛋白</b>的协助，不是通道蛋白，也不是直接穿膜；③ 消耗细胞内化学反应释放的能量（通常写成 ATP）。三个条件同时成立才叫主动运输，少写一个就扣分。它仍然是<b>跨膜运输</b>：物质确实穿过了磷脂双分子层，只是要靠载体「抬」过去。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 主动运输的意义<span class="q-src">人教版（2019）必修1 · 第4章第2节</span></p>
<p class="q-b">主动运输保证了活细胞能够按照生命活动的需要，主动选择吸收所需要的营养物质，排出代谢废物和对细胞有害的物质。</p>
<p class="q-n">→ 翻成人话：这句话落点在<b>三个「主动」</b>——主动吸收营养、主动排出代谢废物、主动排出有害物质。判断是不是主动运输，看的是「细胞需不需要」，而不是「膜两侧谁多谁少」。所以主动运输既能向内（根细胞从稀溶液中吸收 K⁺），也能向外（把 Na⁺ 泵出细胞、把有害物质排出）；答题时只写「吸收营养物质」是把一半的意思丢了。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 胞吞和胞吐<span class="q-src">人教版（2019）必修1 · 第4章第2节</span></p>
<p class="q-b">大分子物质进出细胞的方式是胞吞和胞吐，它们依赖于细胞膜的流动性，需要消耗能量。</p>
<p class="q-n">→ 翻成人话：这句话有<b>三个条件</b>——① 运输对象是<b>大分子</b>（蛋白质、多糖等）或颗粒；② 依赖细胞膜的<b>流动性</b>，膜要能凹陷、包裹、融合；③ 消耗能量。它和主动运输最大的区别不在耗不耗能，而在<b>物质有没有穿过膜</b>：胞吞、胞吐是膜把物质「包」进或「包」出，物质始终没有穿过磷脂双分子层，所以它们<b>不属于跨膜运输</b>，也<b>不需要载体蛋白</b>。</p>
</div>

<p class="gx-note">整张表只高亮 1 行：<b>真正的分界线是「有没有穿过磷脂双分子层」</b>。前三行都是跨膜运输，胞吞、胞吐不是——它们靠膜包裹，物质没有穿膜。背法是四问：先问方向（顺还是逆），再问要不要载体，再问耗不耗能，最后问有没有穿膜。四问下来，四种方式不会混。</p>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 根细胞吸收 K⁺ 的曲线为什么先升后平<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">某植物根细胞吸收 K⁺ 的量随氧气浓度升高而增加，超过一定氧气浓度后不再增加。请回答：（1）K⁺ 进入根细胞的方式是什么？判断依据是什么？（2）为什么吸收量先增加后不再增加？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题：先定性，再解释曲线</p>
<p class="s-b">题目有两问：第一问考「运输方式的判据」，第二问考「限制因素的变化」。不要一上来就写「氧气运输 K⁺」——氧气不是被运输的对象，它只影响供能。</p>
<p class="s-k">用到：跨膜运输方式的判断依据</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 定性：K⁺ 进入根细胞是主动运输</p>
<p class="s-b">土壤溶液中 K⁺ 浓度低于根细胞内，根细胞仍在吸收 K⁺，方向是<b>逆浓度梯度</b>；K⁺ 不能自由穿过磷脂双分子层，需要<b>载体蛋白</b>；这个过程消耗细胞呼吸释放的能量。三条依据齐了 → <b>主动运输</b>。只写「需要载体」不完整，三条都要落到答题卡上。</p>
<p class="s-k">用到：主动运输 = 逆梯度 + 载体蛋白 + 消耗能量</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 上升段：氧气影响的是 ATP</p>
<p class="s-b">氧气浓度升高 → 根细胞<b>有氧呼吸增强</b> → 产生的 <b>ATP 增多</b> → 主动运输有更多能量可用 → 吸收速率增大，所以吸收量随氧气浓度升高而增加。氧气在这里的作用是「参与呼吸作用供能」，不是「直接搬运 K⁺」。</p>
<p class="s-k">用到：主动运输消耗细胞呼吸释放的能量</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 平台段：限制因素换成了载体</p>
<p class="s-b">氧气浓度超过一定值后，能量已经不是短板，<b>载体蛋白数量</b>成了限制因素。载体蛋白数量有限，全部与 K⁺ 结合后达到<b>饱和</b>，再增加氧气浓度也不能提高运输速率，所以吸收量不再增加。</p>
<p class="s-k">用到：载体蛋白数量有限，主动运输速率会饱和</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收束：两段各受什么限制</p>
<p class="s-b">一句话总结：<b>上升段受能量（ATP）限制，平台段受载体蛋白数量限制</b>。如果题目追问「还能怎样提高吸收量」，答案只能是增加载体蛋白的数量（或种类），而不是继续提高氧气浓度。</p>
<p class="s-k">用到：限制因素分析——先变的是能量，后卡住的是载体</p>
</li>
</ol>

<p class="ans-b">① K⁺ 进入根细胞的方式是<b>主动运输</b>。依据：逆浓度梯度（土壤溶液 → 细胞内），需要载体蛋白协助，消耗细胞呼吸释放的能量。<br>② 氧气浓度升高使有氧呼吸增强，产生的 ATP 增多，主动运输速率加快，吸收量增加；当氧气浓度超过一定值后，载体蛋白数量有限、达到饱和，运输速率不再增加，因此吸收量不再增加。<br>③ 上升段的限制因素是能量（ATP），平台段的限制因素是载体蛋白数量。</p>

<div class="qac">
<p class="q">为什么大分子只能靠胞吞、胞吐？</p>
<p class="a">大分子体积太大，<b>不能穿过磷脂双分子层</b>，膜上也没有运输大分子的载体蛋白。膜只能把它整体包起来：凹陷 → 包裹成囊泡 → 带进或带出细胞。所以胞吞、胞吐运输的是「包裹」，不是「穿过」。</p>

<div class="qac">
<p class="q">缺氧为什么会让主动运输变慢？</p>
<p class="a">主动运输消耗的是<b>细胞呼吸释放的能量（ATP）</b>。缺氧 → 有氧呼吸减弱 → ATP 减少 → 主动运输速率下降。注意措辞：短时间缺氧时无氧呼吸还能提供少量 ATP，所以是「变慢」；长时间严重缺氧导致细胞死亡，主动运输才完全停止。</p>

<div class="qac">
<p class="q">主动运输对细胞有什么意义？</p>
<p class="a">使活细胞能<b>按照生命活动的需要主动选择</b>：吸收所需要的营养物质，排出代谢废物和对细胞有害的物质，从而维持细胞内物质浓度的相对稳定（比如细胞内 K⁺ 高、Na⁺ 低）。关键在「主动」：方向由生命活动需要决定，不由浓度差决定。</p>

<div class="qac">
<p class="q">胞吞、胞吐需要载体蛋白吗？</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 主动运输是顺浓度梯度进行的。</p>
<p class="er-v">✓ 主动运输是逆浓度梯度进行的，需要载体蛋白协助，并消耗细胞内化学反应释放的能量。</p>
<p class="er-w">错在哪：把方向记反了。「主动」就体现在「逆着浓度梯度也要运」，这是主动运输最根本的判据。</p>
</div>
<div class="er">
<p class="er-x">✗ 胞吞、胞吐也是跨膜运输。</p>
<p class="er-v">✓ 胞吞、胞吐不是跨膜运输：物质没有穿过磷脂双分子层，而是被细胞膜包裹成囊泡进出细胞。</p>
<p class="er-w">错在哪：把「进出细胞」当成「跨膜」。跨膜的标准是物质<b>穿过</b>磷脂双分子层；胞吞、胞吐只是膜的形状改变。</p>
</div>
<div class="er">
<p class="er-x">✗ 胞吞、胞吐不需要消耗能量。</p>
<p class="er-v">✓ 胞吞、胞吐依赖细胞膜的流动性，需要消耗能量。</p>
<p class="er-w">错在哪：以为「不用载体」就等于「不用能量」。膜的凹陷、囊泡的移动和融合都要耗能。</p>
</div>
<div class="er">
<p class="er-x">✗ 抑制细胞呼吸不会影响主动运输。</p>
<p class="er-v">✓ 抑制细胞呼吸会减少 ATP 的产生，使主动运输速率下降。</p>
<p class="er-w">错在哪：忘了主动运输的能量来自细胞呼吸。缺氧、呼吸抑制剂都会让主动运输变慢。</p>
</div>
<div class="er">
<p class="er-x">✗ 大分子物质通过载体蛋白进入细胞。</p>
<p class="er-v">✓ 大分子物质通过胞吞、胞吐进出细胞，不需要载体蛋白，而依赖膜的流动性、消耗能量。</p>
<p class="er-w">错在哪：把「需要蛋白质帮忙」硬套到大分子上。载体蛋白只运小分子或离子，大分子是整包进出。</p>
</div>
<div class="er">
<p class="er-x">✗ 主动运输只负责吸收营养物质。</p>
<p class="er-v">✓ 主动运输既能吸收营养物质，也能排出代谢废物和对细胞有害的物质。</p>
<p class="er-w">错在哪：只记住了「吸收」。课本原话里「吸收营养、排出废物、排出有害物质」是并列的三件事。</p>
</div>
<div class="er">
<p class="er-x">✗ ATP 供应充足时，主动运输速率可以无限增大。</p>
<p class="er-v">✓ 载体蛋白数量有限，主动运输速率会达到饱和；ATP 供应和载体数量共同限制主动运输速率。</p>
<p class="er-w">错在哪：只看能量、不看载体。图 4 的直线是「载体数量固定、只改 ATP」的示意；真实曲线后段会变平。</p>
</div>
</div>

    tx(g, G.big[0], G.big[1], big, on ? "#1e6640" : "#b8402f", "start", G.wide ? 12.5 : 9.4, 700);

    if (G.legend) {
      el("circle", { cx: G.legend[0], cy: G.legend[1] - 4, r: 4, fill: "#cfe0f5", stroke: "#7fa8cf" }, g);
      tx(g, G.legend[0] + 10, G.legend[1], "细胞外（低）", MID, "start", 8.4, 400);
      el("circle", { cx: G.legend[0] + 104, cy: G.legend[1] - 4, r: 4, fill: "#d9f0e2", stroke: "#7cbf9a" }, g);
      tx(g, G.legend[0] + 114, G.legend[1], "细胞内（高）", MID, "start", 8.4, 400);
    }
    if (G.noteW) wrap(g, 30, G.noteY, "点阵只表示浓度高低，不代表真实分子数；p=0 时细胞内外浓度相等，主动运输停摆。", G.noteW, 8.4, FAINT, 12);
  }

  /* 一张小图：rate 0–8 或 ratio 1–3 随 p 线性变化 */
  function plot(g, b, s, kind) {
    var i, p, vmax = kind === "rate" ? 8 : 3, vmin = kind === "rate" ? 0 : 1;
    var yOf = function (val) { return b.y0 - ((val - vmin) / (vmax - vmin)) * (b.y0 - b.y1); };
    var xOf = function (pv) { return b.x0 + (pv / 100) * (b.x1 - b.x0); };

    el("line", { x1: b.x0, y1: b.y0, x2: b.x1, y2: b.y0, stroke: "#c9d3dc", "stroke-width": 1 }, g);
    el("line", { x1: b.x0, y1: b.y0, x2: b.x0, y2: b.y1, stroke: "#c9d3dc", "stroke-width": 1 }, g);

    var yt = kind === "rate" ? [0, 4, 8] : [1, 2, 3];
    for (i = 0; i < yt.length; i++) tx(g, b.x0 - 8, yOf(yt[i]) + 3, String(yt[i]), FAINT, "end", 8.6);
    for (i = 0; i <= 2; i++) tx(g, xOf(i * 50), b.y0 + 13, String(i * 50), FAINT, "middle", 8.6);

    el("line", { x1: xOf(s.p), y1: yOf(kind === "rate" ? s.rate : s.ratio), x2: xOf(s.p), y2: b.y0, stroke: "#c9d3dc", "stroke-width": 1, "stroke-dasharray": "3 4" }, g);
    el("line", { x1: b.x0, y1: yOf(kind === "rate" ? s.rate : s.ratio), x2: xOf(s.p), y2: yOf(kind === "rate" ? s.rate : s.ratio), stroke: "#e3e9ee", "stroke-width": 1, "stroke-dasharray": "3 4" }, g);
    el("line", { x1: b.x0, y1: yOf(vmax), x2: b.x1, y2: b.y0, stroke: kind === "rate" ? C_ACT : "#2f6fb3", "stroke-width": 2.2 }, g);
    el("circle", { cx: xOf(s.p), cy: yOf(kind === "rate" ? s.rate : s.ratio), r: 4.4, fill: "#ffffff", stroke: kind === "rate" ? C_ACT : "#2f6fb3", "stroke-width": 2 }, g);
  }

  function drawCharts(g, s) {
    var Q = L.right, Wd = L.wide, i;
    tx(g, Q.x + 14, Q.y + (Wd ? 26 : 24), "数值：两条线都随 p 上升", INK, "start", Wd ? 10.8 : 9.8, 700);

    var b1 = Wd ? { x0: 500, x1: 840, y0: 180, y1: 96 } : { x0: 52, x1: 330, y0: 444, y1: 382 };
    tx(g, Q.x + 14, Wd ? 68 : 366, Wd ? "① 运输速率 rate = 8p/100" : "① rate = 8p/100", "#1e6640", "start", Wd ? 9.4 : 9, 700);
    plot(g, b1, s, "rate");
    tx(g, (b1.x0 + b1.x1) / 2, b1.y0 + 30, "ATP 供应 p（%）", MID, "middle", Wd ? 8.8 : 8.6);

    el("line", { x1: Q.x + 14, y1: Wd ? 222 : 488, x2: Q.x + Q.w - 14, y2: Wd ? 222 : 488, stroke: "#e6edf2", "stroke-width": 1 }, g);

    var b2 = Wd ? { x0: 500, x1: 840, y0: 352, y1: 274 } : { x0: 52, x1: 330, y0: 600, y1: 538 };
    tx(g, Q.x + 14, Wd ? 244 : 508, Wd ? "② 细胞内 / 细胞外浓度比 = 1 + 0.02p" : "② 浓度比 = 1 + 0.02p", "#2f6fb3", "start", Wd ? 9.2 : 9, 700);
    plot(g, b2, s, "ratio");

    var lines = [
      "p=0：没有 ATP，rate=0，浓度比 1（浓度差消失）。",
      "p=100：rate=8，浓度比 3，稳定逆浓度梯度。",
      "直线是示意：载体数量固定时才成立，真实曲线会平台。"
    ];
    for (i = 0; i < lines.length; i++) {
      tx(g, Q.x + 14, (Wd ? 392 : 634) + i * 14, lines[i], i === 2 ? FAINT : MID, "start", Wd ? 8.4 : 8.2);
    }
  }

  function draw() {
    var gA = $("gxA"), gB = $("gxB");
    gA.textContent = ""; gB.textContent = "";
    var s = calc(A);
    el("rect", { x: L.right.x, y: L.right.y, width: L.right.w, height: L.right.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    drawLeft(gA, s);
    drawCharts(gB, s);
  }

  function render() {
    var s = calc(A), st, col, bg, sn;
    $("gxVa").textContent = String(Math.round(A));
    $("gxVb").textContent = fmt1(s.rate);
    $("gxVc").textContent = s.ratio.toFixed(2);
    if (A < 1) { st = "没有 ATP"; col = "#b8402f"; bg = "#fbeae7"; sn = "浓度差塌掉，被动运输为主"; }
    else if (A < 99) { st = "部分维持浓度差"; col = "#b8791f"; bg = "#fdf3e0"; sn = "能量不足，梯度变浅"; }
    else { st = "稳定逆浓度梯度"; col = "#2f8a5b"; bg = "#e6f6ee"; sn = "载体蛋白持续工作"; }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    draw();
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  /* 起点停在 p=100（满供能），1.2 秒后开始下降，p=0 与 p=100 各有 2 秒以上的停留 */
  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 100 }, { t: 1.2, v: 100 }, { t: 4.4, v: 0 }, { t: 6.8, v: 0 },
           { t: 9.2, v: 50 }, { t: 11.4, v: 50 }, { t: 13.4, v: 100 }],
    keys: [100, 0, 50],
    value: A, min: 0, max: 100, step: 1,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;

  /* 画布每帧重建节点，mousedown 与 mouseup 之间目标可能被换掉 → click 偶尔不触发。
     在不会被清空的父容器上补一次 pointerdown，按下即接管，避免「点了没反应」。 */
  if (stage.parentElement) {
    stage.parentElement.addEventListener("pointerdown", function () { ap.take(); });
  }
  window.__bio = { calc: calc, cases: [
    { v: 0, eq: { rate: 0, ratio: 1 } },
    { v: 50, eq: { rate: 4, ratio: 2 } },
    { v: 100, eq: { rate: 8, ratio: 3 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
</body>
</html>
