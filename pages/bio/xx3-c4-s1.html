<p class="gx-lede">这一节是第4章的开篇：前面几章讲基因工程「怎么做」，这一节讲「做完之后该怕什么、该怎么管」。最容易错的一件事，是把「转基因产品的安全性」直接等同于「吃了会不会中毒」——那只是食品安全这一半，另一半是生态安全，核心担忧叫基因漂移。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 安全性的两个方面<span class="q-src">人教版（2019）选择性必修3 · 第4章第1节</span></p>
<p class="q-b">转基因产品的安全性包括食品安全和生态安全两个方面。</p>
<p class="q-n">→ 翻成人话：这句话由<b>两个并列的条件</b>组成（①食品安全 ②生态安全），少答一个就只答了一半。①问的是「人吃了、接触了有没有害」；②问的是「外源基因跑出去会不会改变野生种群」。答题时先写「两方面」，再分述，阅卷老师一眼看到关键词就给你分。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 评价原则<span class="q-src">人教版（2019）选择性必修3 · 第4章第1节</span></p>
<p class="q-b">对转基因产品要进行科学的评估，包括实质等同原则、个案分析原则等。</p>
<p class="q-n">→ 翻成人话：这句话里藏着<b>两个原则</b>。实质等同＝把转基因产品与「原来那个传统品种」逐项比，比出来差不多就按传统品种管；个案分析＝一个品种一个结论，不能拿 A 的结论套到 B 上。少写「个案」两个字，就是本节最常丢的分。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 管理制度<span class="q-src">人教版（2019）选择性必修3 · 第4章第1节</span></p>
<p class="q-b">我国对转基因生物实行安全评价、标识等管理制度。</p>
<p class="q-n">→ 翻成人话：这句话是<b>管理层面</b>的两个动作：安全评价（进市场之前先评，评不过不放行）+ 标识（进市场之后告诉你这是转基因的，把选择权交回消费者）。两者一个是「准入」，一个是「知情」，别混成一句「国家管得很严」。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>食品安全</th><th>生态安全</th></tr></thead>
<tbody>
<tr><td>担心的是谁</td><td>吃它的人、接触它的人</td><td>田里的野生种群、整个生态系统</td></tr>
<tr><td>典型问题</td><td>有无毒性、有无致敏性、营养成分是否被改变</td><td>外源基因漂移、产生「超级杂草」、非目标生物受害</td></tr>
<tr class="key"><td>核心担忧</td><td>毒性、致敏性等直接健康效应</td><td><b>基因漂移</b>：外源基因转入野生近缘种</td></tr>
<tr><td>怎么降风险</td><td>实质等同原则逐项比较、安全评价</td><td>设置隔离距离、隔离带、错开开花期</td></tr>
<tr><td>能不能归零</td><td>可评估到「与传统品种同等安全」</td><td>只能降到很低，<b>不能归零</b></td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只高亮 1 行。背法：先答「两方面」，再把「基因漂移」四个字挂到生态安全名下——这一句就是本节的分水岭。</p>
</section>

<figure class="gx-fig">
<div class="fig-cap">
<span class="fig-no">图 2</span><span class="fig-t">基因漂移的路径</span>
<span class="bdg bdg-warn">易错</span>
</div>
<p class="fig-s">外源基因不是「自己走过去」的，它要靠一条运载链：转基因作物开花 → 花粉被风或昆虫带走 → 落到野生近缘种的柱头上 → 完成受精 → 后代带上了外源基因。这条链上任一环断了，漂移就发生不了，所以隔离才有意义。</p>
<div class="gx-svgbox">
<svg viewBox="0 0 820 260" role="img" aria-label="基因漂移的四步路径：转基因作物开花、花粉传播、与野生近缘种杂交、后代携带外源基因">
<rect x="16" y="16" width="788" height="228" rx="10" fill="#f8fbfd" stroke="#dbe7ef"/>
<text x="36" y="44" font-size="12" font-weight="700" fill="#151a21">基因漂移：外源基因转入野生近缘种的四步链</text>
<rect x="40" y="66" width="166" height="96" rx="8" fill="#ffffff" stroke="#b8e6d0"/>
<text x="52" y="86" font-size="10" font-weight="700" fill="#2f8a5b">① 供体</text>
<text x="52" y="104" font-size="9.2" fill="#3a3a35">转基因作物开花</text>
<text x="52" y="120" font-size="9.2" fill="#3a3a35">花药释放大量花粉</text>
<text x="52" y="136" font-size="9.2" fill="#3a3a35">花粉里含外源基因</text>
<text x="52" y="152" font-size="9.2" fill="#6b6b63">例：抗除草剂大豆</text>
<path d="M210 114 L246 114" stroke="#8ab6cf" stroke-width="1.8" fill="none"/>
<path d="M239 109 L247 114 L239 119 Z" fill="#8ab6cf"/>
<rect x="250" y="66" width="166" height="96" rx="8" fill="#ffffff" stroke="#b7d4e8"/>
<text x="262" y="86" font-size="10" font-weight="700" fill="#1c4f6e">② 传播</text>
<text x="262" y="104" font-size="9.2" fill="#3a3a35">风媒、虫媒搬运花粉</text>
<text x="262" y="120" font-size="9.2" fill="#3a3a35">距离越远，花粉越稀</text>
<text x="262" y="136" font-size="9.2" fill="#3a3a35">活力随时间下降</text>
<text x="262" y="152" font-size="9.2" fill="#6b6b63">关键变量：距离 d</text>
<path d="M420 114 L456 114" stroke="#8ab6cf" stroke-width="1.8" fill="none"/>
<path d="M449 109 L457 114 L449 119 Z" fill="#8ab6cf"/>
<rect x="460" y="66" width="166" height="96" rx="8" fill="#ffffff" stroke="#e8cfa6"/>
<text x="472" y="86" font-size="10" font-weight="700" fill="#b8791f">③ 杂交</text>
<text x="472" y="104" font-size="9.2" fill="#3a3a35">落到野生近缘种柱头</text>
<text x="472" y="120" font-size="9.2" fill="#3a3a35">花期相遇才能受精</text>
<text x="472" y="136" font-size="9.2" fill="#3a3a35">亲缘越近越易成功</text>
<text x="472" y="152" font-size="9.2" fill="#6b6b63">前提：有近缘种</text>
<path d="M630 114 L666 114" stroke="#8ab6cf" stroke-width="1.8" fill="none"/>
<path d="M659 109 L667 114 L659 119 Z" fill="#8ab6cf"/>
<rect x="670" y="66" width="118" height="96" rx="8" fill="#fdf2f0" stroke="#e6c2ba"/>
<text x="682" y="86" font-size="10" font-weight="700" fill="#b8402f">④ 后果</text>
<text x="682" y="104" font-size="9.2" fill="#3a3a35">野生后代带</text>
<text x="682" y="119" font-size="9.2" fill="#3a3a35">外源基因</text>

<p class="gx-take">基因漂移是生态安全的核心担忧，它的实质是外源基因经花粉传播转入野生近缘种。</p>
<p class="gx-note">易错：说「基因漂移不会发生」是错的；说「转基因作物自己会跑去野生地」也是错的——它靠花粉，不靠走。</p>
</figure>

<figure class="gx-fig">
<div class="fig-cap">

<p class="fig-s">横轴是种植区到野生近缘种的距离 d，纵轴是外源基因漂移率。曲线是<span class="gx-fml">漂移率 = 100e^(−d/200) %</span>，指数下降：d 从 0 加到 200 m，漂移率就从 100% 掉到 36.8%；再往后越降越慢，但永远不为 0。先看起点，再看曲线的「拐」在哪。</p>

<figure class="gx-fig">
<div class="fig-cap">
<span class="fig-no">图 4</span><span class="fig-t">转基因标识制度</span>
<span class="bdg bdg-ext">延伸</span>
</div>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 原因分析类简答<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">某地计划大面积种植抗除草剂转基因油菜，附近田间有同属的野生近缘种。有人主张「只要检验过转基因油菜的食用油里没有毒素，就可以放心推广」。请回答：（1）指出该主张在安全性评价上遗漏了哪一方面，并说明理由；（2）为什么说转基因作物的生态安全必须「个案分析」？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 定性：先分两方面</p>
<p class="s-b">题干只说「食用油里没有毒素」，这是食品安全这一半。要立刻想起课本那句：转基因产品的安全性包括食品安全和生态安全两个方面。所以主张遗漏的是<b>生态安全</b>。</p>
<p class="s-k">用到：安全性的两个方面。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 点出生态安全的核心担忧</p>
<p class="s-b">生态安全的核心担忧是<b>基因漂移</b>：转基因油菜的花粉可借风或昆虫传播，落到同属野生近缘种的柱头上并完成受精，外源基因就进入了野生种群，可能使其获得抗除草剂特性、变成难以防除的「超级杂草」。</p>
<p class="s-k">用到：基因漂移的路径（供体 → 传播 → 杂交 → 后果）。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 把「距离」说成手段而不是结论</p>
<p class="s-b">设置隔离距离、隔离带、错开开花期都可以降低漂移率，但漂移率随距离只是指数下降、趋近于 0 而不等于 0，所以只能说「风险很低」，不能说「绝对安全」。</p>
<p class="s-k">用到：隔离距离与漂移率的关系（不为 0）。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 回答「个案分析」</p>
<p class="s-b">不同转基因作物的外源基因不同、受体物种不同、种植环境不同、附近野生近缘种的分布也不同，风险大小差异很大，因此必须一个品种一个结论地逐个评价，不能拿一个品种的结论套到另一个品种上。</p>
<p class="s-k">用到：个案分析原则。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口到管理制度</p>
<p class="s-b">正因为要逐个评价，我国才对转基因生物实行安全评价与标识等管理制度：先评价再准入，上市后按目录强制标识，把知情权与选择权交给消费者。</p>
<p class="s-k">用到：安全评价 + 标识的管理制度。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）遗漏了生态安全。转基因产品的安全性包括食品安全和生态安全两个方面，只检验食用油有无毒素只评价了食品安全；还应评价外源基因漂移等生态风险。生态安全的核心担忧是基因漂移，即转基因作物通过花粉传播，把外源基因转入野生近缘种，可能产生「超级杂草」等后果。<br>（2）因为不同转基因作物的外源基因不同、受体物种不同、种植环境不同、附近野生近缘种的分布也不同，风险大小差异很大，必须逐个品种评价，不能一概而论；这就是个案分析原则。我国据此实行安全评价、标识等管理制度。</p>
</div>
