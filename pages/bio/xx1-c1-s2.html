<p class="gx-claim">稳态不是「不变」，是<b>相对稳定、动态变化</b>；调节机制是<b>神经—体液—免疫调节网络</b>。</p>
<div class="gx-meta">

<p class="gx-lede">第 1 节把「内环境是什么」讲清楚了，这一节接着回答「它凭什么能一直稳」。全节只有一条主线：变化是常态，靠调节把变化压在正常范围内。最容易错的一件事，是把「稳态」写成「恒定不变」——一旦写成不变，缓冲对、调节网络、发烧的意义就全都讲不通了。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 稳态的定义<span class="q-src">人教版（2019）选择性必修1 · 第1章第2节</span></p>
<p class="q-b">内环境的稳态是指正常机体通过调节作用，使各个器官、系统协调活动，共同维持内环境的相对稳定状态。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个条件</b>拼成——① 有<b>调节作用</b>（下面第 2 条原话会说明它是谁）；② 由<b>各个器官、系统协调活动</b>去执行；③ 结果只是<b>相对稳定</b>。少写①，就变成「内环境自己会稳」；把③读成「不变」，整句就反了。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 调节机制<span class="q-src">人教版（2019）选择性必修1 · 第1章第2节</span></p>
<p class="q-b">稳态的调节机制是神经—体液—免疫调节网络。</p>
<p class="q-n">→ 三个词一个都不能丢：只写「神经调节」是半句话，只写「神经—体液」也照样扣分。<b>网络</b>才是关键词，它说明三者相互联系、共同起作用，不是三条各管一段的平行线。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 血浆 pH 为什么稳<span class="q-src">人教版（2019）选择性必修1 · 第1章第2节</span></p>
<p class="q-b">血浆 pH 能维持在 7.35–7.45，与血浆中的缓冲物质（如 H₂CO₃/NaHCO₃）有关。</p>
<p class="q-n">→ 盯住「<b>维持</b>」和「<b>有关</b>」两个词：缓冲物质只是把 pH 的变化<b>减弱</b>，不是不让它变；真正把 pH 拉回正常范围，还要靠神经—体液—免疫调节网络一起兜住。原话说「有关」而不是「由……决定」，说的就是这层分工。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>稳态（教材口径）</th><th>「恒定不变」（常见错解）</th></tr></thead>
<tbody>
<tr><td>数值会不会动</td><td>在正常范围内小幅波动</td><td>一动不动，永远同一个数</td></tr>
<tr><td>靠什么实现</td><td>神经—体液—免疫调节网络</td><td>内环境自己就会稳，不需要调节</td></tr>
<tr><td>举一个例子</td><td>血浆 pH 在 7.35–7.45 之间起伏</td><td>血浆 pH 永远是 7.40</td></tr>
<tr class="key"><td>真正的区别</td><td>相对稳定 + 动态变化</td><td>绝对不变</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">背法：「<b>调节 — 协调 — 相对稳定</b>」六个字，顺序就是答案的顺序：先说调节机制，再说器官系统协调，最后落到「相对稳定状态」。考试写三个短句，比写一大段形容「很稳定」得分稳。</p>
</section>

<p class="gx-take">稳态是正常机体通过调节作用、由各器官系统协调活动共同维持的<b>相对稳定状态</b>；三个环节缺一不可，而中间那一环是神经—体液—免疫调节网络。</p>

<p class="fig-s">顺着编号走一遍：乳酸进血浆 → 与 NaHCO₃ 反应 → 生成乳酸钠和 H₂CO₃ → H₂CO₃ 分解出 CO₂ 由肺排出。整条链的净效果是<b>把强酸变成可排出的气体</b>，所以 pH 只是被减弱了波动。</p>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 原因分析类简答<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">剧烈运动后，大量乳酸进入血液，为什么血浆 pH 仍能维持在 7.35–7.45？请从缓冲物质和调节机制两个角度回答。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题：问的是「为什么还能稳」</p>
<p class="s-b">题干里「大量乳酸进入血液」说明 pH 一定受到了冲击，问的不是「pH 会不会变」，而是「变了之后为什么还能回到正常范围」。所以答案必须同时给出<b>缓冲物质</b>和<b>调节机制</b>两条，缺一条就只答了一半。</p>
<p class="s-k">用到：稳态是相对稳定、动态变化，不是不变。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 缓冲对怎么接住乳酸</p>
<p class="s-b">乳酸进入血浆后与 NaHCO₃ 反应，生成乳酸钠和 H₂CO₃；H₂CO₃ 又分解为 H₂O 和 CO₂，CO₂ 由肺排出。原来的强酸被换成了可以呼出的气体，血浆中 H⁺ 的增加被大幅削弱。</p>
<p class="s-k">用到：血浆中的缓冲物质 H₂CO₃/NaHCO₃。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 用数字说明「只是减弱」</p>
<p class="s-b">按模型，有缓冲对时 pH = 7.40 − 0.005 L，L=10 得 7.35，仍在 7.35–7.45 内；若没有缓冲，pH = 7.40 − 0.040 L，同样 L=10 已跌到 7.00。同一个乳酸量差出 0.35 个 pH 单位，说明<b>缓冲对减弱了 pH 变化，但没有完全阻止 pH 变化</b>。</p>
<p class="s-k">用到：缓冲对的作用是减弱，不是「不让变」。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 补上调节网络，答案才完整</p>
<p class="s-b">缓冲对只负责第一道缓冲。呼吸加深加快把 CO₂ 更多排出、肾脏排出乳酸钠和多余酸性物质、循环系统加快运输——这些器官系统的协调活动，是在神经—体液—免疫调节网络的统一调节下完成的。</p>
<p class="s-k">用到：稳态的调节机制是神经—体液—免疫调节网络。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 落笔：两条并列，别写成「乳酸被直接排出」</p>
<p class="s-b">易错写法是「乳酸随尿直接排出，所以 pH 不变」。乳酸要先与 NaHCO₃ 反应，转化之后的产物再被排出；而且 pH 在运动中确实会短暂下降，只是被控制在正常范围内。</p>
<p class="s-k">用到：相对稳定 ≠ 恒定不变。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">① 乳酸进入血浆后与缓冲物质 NaHCO₃ 反应，生成乳酸钠和 H₂CO₃；H₂CO₃ 分解为 H₂O 和 CO₂，CO₂ 由肺排出，因此血浆中 H⁺ 的增加被减弱，pH 只在正常范围内小幅下降。<br>② 缓冲对只是减弱 pH 的变化，不能完全阻止 pH 变化；同时神经—体液—免疫调节网络共同作用，使呼吸、循环、泌尿等器官系统协调活动，把血浆 pH 维持在 7.35–7.45 的相对稳定状态。</p>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「稳态是不是就是内环境恒定不变？」</p>
<p class="a">不是。稳态是<b>相对稳定状态</b>，各项理化性质在正常范围内<b>动态变化</b>。血浆 pH 在 7.35–7.45 之间起伏，体温在 36–37 ℃ 附近波动，都叫稳态；写成「不变」就否掉了调节存在的理由。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="曲线在绿色正常范围内波动">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<rect x="24" y="52" width="192" height="16" fill="#e6f6ee"/>
<polyline points="24,64 60,56 96,60 132,54 168,62 204,58" fill="none" stroke="#2f8a5b" stroke-width="1.8"/>
<text x="120" y="34" text-anchor="middle" font-size="8.4" fill="#2f8a5b">正常范围</text>
<text x="120" y="98" text-anchor="middle" font-size="8.6" fill="#3a3a35">在带内波动＝稳态</text>
</svg>
</div>

<div class="qac">
<p class="q">「有缓冲对，血浆 pH 是不是就一点都不会变了？」</p>
<p class="a">不会。缓冲对的作用是<b>减弱 pH 的变化</b>，不是让 pH 不动。它与乳酸反应生成乳酸钠和 H₂CO₃，H₂CO₃ 分解成 CO₂ 由肺排出，把强酸转成可呼出的气体——pH 仍会小幅下降，只是跌幅被压小。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="有缓冲与无缓冲两条斜率不同的曲线">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>

</div>

<div class="qac">
<p class="q">「稳态的调节机制是什么？」</p>
<p class="a">是<b>神经—体液—免疫调节网络</b>。三个词缺一不可，且要写出「网络」：三者相互联系、共同起作用。只答「神经调节」是最常见的失分点。</p>

<circle cx="176" cy="48" r="20" fill="#eef7f2" stroke="#9ad3b6"/>
<circle cx="120" cy="96" r="20" fill="#eef7f2" stroke="#9ad3b6"/>

<div class="qac">
<p class="q">「发烧算稳态失调吗？」</p>
<p class="a">算。体温<b>持续超出正常范围</b>就是稳态失调：产热与散热失衡，超过体温调节能力，还会影响酶的活性。判据统一为「指标是否持续出带」，不看出没出过汗。</p>

<div class="qac">
<p class="q">「血浆里的缓冲对由什么组成？」</p>
<p class="a">最主要的一对是 H₂CO₃ 与 NaHCO₃（碳酸和碳酸氢钠）。<b>一对里一个弱酸、一个对应的弱碱盐</b>，遇到强酸由 NaHCO₃ 出面接，遇到强碱由 H₂CO₃ 出面接，所以两个词都要写。</p>

<div class="qac">
<p class="q">「稳态只针对血浆 pH 吗？」</p>
<p class="a">不只。稳态指内环境<b>多种成分和理化性质</b>的相对稳定：渗透压、pH、温度、血糖、各种离子的含量等。pH 只是最常考的那一个，答题别把范围缩小。</p>

</div>
</div>
<p class="gx-note">六问其实是同一件事：稳态＝在调节网络的支撑下把指标<b>压在正常范围内</b>。凡是答成「不变」「完全阻止」「只有神经」的，都是把「稳定」误读成了「静止」。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 稳态就是内环境的理化性质恒定不变。</p>
<p class="er-v">✓ 稳态是正常机体通过调节作用，使各个器官、系统协调活动，共同维持内环境的<i>相对稳定状态</i>。</p>
<p class="er-w">错在哪：「不变」丢掉了动态变化这一半。稳态是相对稳定、动态变化，指标在正常范围内起伏。</p>
</div>
<div class="er">
<p class="er-x">✗ 有了缓冲对，血浆 pH 就一点都不会变。</p>
<p class="er-v">✓ 缓冲物质能<i>减弱</i> pH 的变化，但不能完全阻止 pH 变化。</p>
<p class="er-w">错在哪：把「减弱」写成「阻止」。缓冲对只是第一道防线，把 pH 拉回正常范围还要靠调节网络。</p>
</div>
<div class="er">
<p class="er-x">✗ 稳态的调节机制是神经调节。</p>
<p class="er-v">✓ 稳态的调节机制是<i>神经—体液—免疫调节网络</i>。</p>
<p class="er-w">错在哪：三个词缺两个。这是本节最标准的送分点，也是最高频的丢分点。</p>
</div>
<div class="er">
<p class="er-x">✗ 稳态就是指血浆 pH 保持稳定。</p>
<p class="er-v">✓ 稳态指内环境多种成分和理化性质（渗透压、pH、温度、血糖等）的相对稳定。</p>
<p class="er-w">错在哪：把稳态窄化成 pH 一项，题目一旦问体温或血糖就接不上。</p>
</div>
<div class="er">
<p class="er-x">✗ 乳酸进入血液后直接被排出体外，所以 pH 不变。</p>
<p class="er-v">✓ 乳酸先与 NaHCO₃ 反应生成乳酸钠和 H₂CO₃，H₂CO₃ 分解为 H₂O 和 CO₂，CO₂ 由肺排出。</p>
<p class="er-w">错在哪：跳过了缓冲反应这一步。乳酸钠留在血浆中，由肾脏随尿排出，不是乳酸原样排出。</p>
</div>
<div class="er">
<p class="er-x">✗ 血浆 pH 只要一有变化，就是稳态失调。</p>
<p class="er-v">✓ pH 在 7.35–7.45 之间波动仍属于稳态，持续超出这个范围才是失调。</p>
<p class="er-w">错在哪：把「变化」当成「失调」。判据是出没出带，不是变没变。</p>
</div>
<div class="er">
<p class="er-x">✗ 稳态失调只发生在生病的时候。</p>
<p class="er-v">✓ 剧烈运动、高温作业、长时间不进食等也会使某些指标暂时偏离正常范围。</p>
<p class="er-w">错在哪：把失调等同于疾病。运动后 pH 短暂下降、体温暂时升高，都属于调节正在起作用。</p>
</div>

  function calc(v) {

  }

  /* 把版式换算成绘图坐标（画布尺寸变化时重建） */
  function geom() {

  function drawLeft(g, s) {

    el("rect", { x: l.x, y: l.y, width: l.w, height: l.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);

      pn.push(g.x(v) + "," + g.y(c.nobuf));

    el("circle", { cx: mx, cy: g.y(s.nobuf), r: 3.6, fill: "#b8402f" }, gA);

    tx(gA, ax, g.y(s.nobuf) + 13, s.nobuf.toFixed(2), "#b8402f", an, 8.8, 700);

    el("line", { x1: l.x + 20, y1: g.lg1, x2: l.x + 42, y2: g.lg1, stroke: "#2f8a5b", "stroke-width": 2.2 }, gA);

    tx(gA, l.x + 48, g.lg2 + 3, "无缓冲：下降很快", "#3a3a35", "start", 8.4, 400);

    el("rect", { x: g.bx0, y: y + 10, width: g.bx1 - g.bx0, height: 12, rx: 6, fill: "#eef1f4" }, p);
