<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 细胞器各干什么<span class="q-src">人教版（2019）必修1 · 第3章第2节</span></p>
<p class="q-b">线粒体是细胞进行有氧呼吸的主要场所，是细胞的「动力车间」。</p>
<p class="q-n">→ 翻成人话：这句话由<b>两个条件</b>组成。①「主要场所」不是唯一场所——有氧呼吸第一阶段在细胞质基质里进行，线粒体只承接后面两个阶段；②「动力车间」说的是<b>供能</b>，它供的能可以用在分泌蛋白的运输上，但它本身<b>不在这条运输路径里</b>。把这两条记混，就是本节第一个扣分点。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 核糖体与内质网<span class="q-src">人教版（2019）必修1 · 第3章第2节</span></p>
<p class="q-b">核糖体是「生产蛋白质的机器」；内质网是蛋白质等大分子物质的合成、加工场所和运输通道。</p>
<p class="q-n">→ 翻成人话：<b>三个条件</b>。①核糖体只负责「生产」（把氨基酸连成肽链），不加工、不运输、<b>也没有膜</b>；②内质网一身三职：合成、加工、运输通道，是这条流水线上的第一站「加工车间」；③这句话里一个「膜」字都没有，说明「核糖体有膜」是学生自己加的，教材从没这么写。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 分工合作与生物膜系统<span class="q-src">人教版（2019）必修1 · 第3章第2节</span></p>
<p class="q-b">分泌蛋白的合成与运输：核糖体 → 内质网 → 高尔基体 → 细胞膜；细胞膜、核膜以及细胞器膜共同构成生物膜系统。</p>
<p class="q-n">→ 翻成人话：<b>四个条件</b>。①顺序不能颠倒，起点一定是核糖体，不是内质网；②箭头末端是细胞膜，蛋白从这里「出细胞」，所以最后还要补一个「细胞外」；③线粒体只在一旁供能，<b>不占路径上的格子</b>；④生物膜系统是「细胞膜＋核膜＋细胞器膜」三层膜的总和，核糖体、中心体无膜，<b>不算进去</b>。</p>
</div>

<div style="overflow-x:auto">

<p class="gx-note">整张表只高亮 1 行：核糖体是<b>无膜的</b>「生产蛋白质的机器」，偏偏又是分泌蛋白路径的起点——「起点」和「有膜」是两件事。背法：先分「有膜 / 无膜」，有膜的再分「单层 / 双层」。问「哪些细胞器不含膜」，答案只有核糖体和中心体两个。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 同位素标记＋路径书写<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">用 ³H 标记的亮氨酸培养胰腺腺泡细胞（该细胞能分泌消化酶）。3 min 时，放射性主要出现在核糖体；20 min 时，放射性主要出现在高尔基体。请回答：<br>（1）上述结果说明分泌蛋白的合成与运输具有什么特点？<br>（2）写出分泌蛋白从合成到分泌出细胞所经过的结构（用箭头连接）。<br>（3）若用药物抑制线粒体的功能，预期放射性在各结构中出现的时间会怎样变化？路径顺序是否改变？<br>（提示：三个小问里有一个陷阱，在第（2）问。）</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题：³H-亮氨酸标记的是什么</p>
<p class="s-b">亮氨酸是氨基酸，³H 标记它，被追踪的就是<b>新合成的蛋白质</b>，不是糖类也不是脂质。胰腺腺泡细胞能分泌消化酶，属于典型的分泌蛋白（还有抗体、胰岛素、部分激素）。所以这道题追踪的是「一个分泌蛋白从出生到出门」的全过程。</p>
<p class="s-k">用到：氨基酸是蛋白质的基本单位；分泌蛋白的概念。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 读数据：两个时间点各说明什么</p>
<p class="s-b">3 min 在核糖体 → 这里是<b>合成</b>的起点，肽链刚连出来。20 min 在高尔基体 → 蛋白已经走到半路，正在被<b>分类包装</b>。两个点连起来看，中间必然还有一个结构承接：内质网。而且 3 min → 20 min 的「位移」说明这条路是<b>有顺序</b>的，不是同时在各处出现。</p>
<p class="s-k">用到：核糖体合成肽链 → 内质网加工运输 → 高尔基体分类包装。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 写路径：五个站，一个都不能少</p>
<p class="s-b">按顺序写：核糖体 → 内质网 → 高尔基体 → 细胞膜 → 细胞外。这里就是陷阱：<b>线粒体不写进去</b>。线粒体只提供能量（ATP），蛋白分子从不进入线粒体，所以它不属于「经过的结构」。同理，「细胞外」要补上，因为分泌蛋白的终点在细胞外，箭头停在细胞膜上是不完整的。</p>
<p class="s-k">用到：分泌蛋白路径；线粒体供能但不参与运输。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 说特点：分工合作＋膜的联系</p>
<p class="s-b">（1）问要答「特点」，不是「路径」。要点是：各细胞器<b>分工不同、又相互配合</b>；运输过程靠<b>囊泡</b>把内质网膜、高尔基体膜、细胞膜联系起来，膜成分在其中转换——这就是生物膜系统在功能上的体现。只写「依次经过」拿不到「分工合作」这个采分点。</p>
<p class="s-k">用到：细胞器之间的分工合作；生物膜系统。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 加抑制：改时间，不改顺序</p>
<p class="s-b">抑制线粒体 → ATP 供应不足 → 囊泡的形成、运输、融合都变慢，所以放射性在<b>内质网、高尔基体、细胞膜</b>出现的时间都会<b>推迟</b>（峰位右移、强度下降）。但路径的<b>顺序不变</b>：核糖体照样先亮。若答「顺序改变」或「蛋白改走线粒体」，都是把「供能」误当成「经过」。</p>
<p class="s-k">用到：线粒体是细胞的「动力车间」，供能不足影响需能的运输过程。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）分泌蛋白的合成与运输是各细胞器<b>分工合作</b>完成的：核糖体合成肽链，内质网加工并进行运输，高尔基体进一步修饰、分类和包装，最后由细胞膜把蛋白分泌到细胞外；运输过程中膜结构通过囊泡相互转换，体现了生物膜系统的整体性。<br>（2）核糖体 → 内质网 → 高尔基体 → 细胞膜 → 细胞外。（线粒体只供能，不在路径中；核糖体无膜。）<br>（3）放射性在内质网、高尔基体、细胞膜中出现的时间均<b>推迟</b>，强度降低；但经过结构的<b>顺序不变</b>（仍是核糖体最先出现），因为线粒体只提供能量，不改变运输途径。</p>

<div class="qac">
<p class="q">「核糖体为什么没有膜？它里面不是有很多结构吗？」</p>
<p class="a">核糖体由 <b>rRNA 和蛋白质</b>组成，外面没有磷脂双分子层，所以不是膜结构，也不进生物膜系统。原核细胞只有核糖体这一种细胞器，照样能合成蛋白质——足以说明它不需要膜。<b>有内部结构≠有膜</b>。</p>

<text x="24" y="98" font-size="8.4" fill="#3a3a35">没有磷脂双分子层 → 不算膜结构</text>
<text x="24" y="114" font-size="8.4" fill="#b8402f">所以「核糖体有膜」是错的</text>

</div>

<div class="qac">
<p class="q">「高尔基体不是只管动物细胞的分泌蛋白吗？植物细胞里它有活干吗？」</p>
<p class="a">高尔基体<b>动植物细胞都有</b>。动物细胞里它把分泌蛋白分类、包装、发送；植物细胞里它还<b>与细胞壁的形成有关</b>（分裂末期参与细胞壁物质的分泌）。说它「只和动物细胞有关」就是把主要功能当成了唯一功能。</p>

<div class="qac">
<p class="q">「溶酶体到底干什么？为什么叫它『消化车间』？」</p>
<p class="a">溶酶体是<b>单层膜</b>的细胞器，内含多种<b>水解酶</b>，能分解衰老、损伤的细胞器，也能吞噬并杀死侵入细胞的病菌。它的膜成分与高尔基体膜相近（一般认为由高尔基体出芽形成），所以它也是生物膜系统的一环。</p>

<div class="qac">
<p class="q">「中心体长在哪里？洋葱根尖细胞有吗？」</p>
<p class="a">中心体存在于<b>动物细胞和某些低等植物细胞</b>，由两个互相垂直的<b>中心粒</b>组成，与细胞的有丝分裂有关。洋葱是高等植物，根尖细胞<b>没有中心体</b>——这是「动物细胞与高等植物细胞区别」里常考的一条。</p>

<div class="qac">
<p class="q">「生物膜系统到底包括哪三层膜？细胞器膜是全包吗？」</p>
<p class="a">只包括<b>细胞膜、核膜、细胞器膜</b>三类。而「细胞器膜」只算<b>有膜</b>的细胞器：线粒体、叶绿体、内质网、高尔基体、溶酶体、液泡；<b>核糖体和中心体没有膜</b>，不在其中。</p>

<p class="gx-note">这六问其实是同一件事：<b>「有膜 / 无膜」和「路径顺序」是两套判据</b>。凡是问「路径」，就按 核糖体→内质网→高尔基体→细胞膜→细胞外 数格子；凡是问「生物膜系统」「哪些细胞器有膜」，就按膜来筛。两套判据一混，答案就会出现「线粒体在路径上」「核糖体有膜」这类硬伤。</p>

<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 分泌蛋白的运输路径是：核糖体→内质网→高尔基体→<b>线粒体</b>→细胞膜</p>
<p class="er-v">✓ 核糖体→内质网→高尔基体→细胞膜→细胞外；线粒体只提供能量，不在路径上</p>
<p class="er-w">错在哪：把「供能」写成「经过」。蛋白分子从不进入线粒体，线粒体只能作旁注。</p>
</div>
<div class="er">
<p class="er-x">✗ 核糖体是单层膜的细胞器，所以能加工蛋白质</p>
<p class="er-v">✓ 核糖体没有膜，由 rRNA 和蛋白质组成，是生产蛋白质的机器（翻译的场所）</p>
<p class="er-w">错在哪：核糖体、中心体是仅有的两个无膜细胞器；「能合成蛋白质」与「有膜」无关。</p>
</div>
<div class="er">
<p class="er-x">✗ 高尔基体只和动物细胞的分泌蛋白有关</p>
<p class="er-v">✓ 高尔基体动植物细胞都有；动物细胞中对蛋白质分类包装，植物细胞中还与细胞壁形成有关</p>
<p class="er-w">错在哪：把「主要功能」当成「只存在于」。植物细胞照样有高尔基体。</p>
</div>
<div class="er">
<p class="er-x">✗ 所有细胞器都有膜结构</p>
<p class="er-v">✓ 除核糖体和中心体外，其余细胞器都有膜；线粒体、叶绿体是双层膜</p>
<p class="er-w">错在哪：细胞器不等于膜结构。原核细胞只有核糖体，也照样是细胞。</p>
</div>
<div class="er">
<p class="er-x">✗ 叶绿体存在于所有植物细胞中</p>
<p class="er-v">✓ 叶绿体存在于植物绿色部分的细胞中，如叶肉细胞；根尖细胞没有叶绿体</p>
<p class="er-w">错在哪：把「植物」当「绿色」。能不能光合作用，看有没有叶绿体，不看是不是植物。</p>
</div>
<div class="er">
<p class="er-x">✗ 内质网只加工蛋白质，和脂质没有关系</p>
<p class="er-v">✓ 内质网是蛋白质等大分子物质的合成、加工场所和运输通道，也是脂质合成的「车间」</p>
<p class="er-w">错在哪：教材写的是「等大分子」；漏掉脂质合成，功能就答不全。</p>
</div>
<div class="er">
<p class="er-x">✗ 分泌蛋白在内质网中合成，高尔基体只负责把它运出去</p>
<p class="er-v">✓ 核糖体合成肽链，内质网加工并运输，高尔基体进一步修饰、分类、包装，再由细胞膜分泌</p>
<p class="er-w">错在哪：起点写错（应是核糖体），又把高尔基体的作用缩减成「运输」。</p>

      el("rect", { x: nx, y: y, width: nw, height: nh, rx: 7, fill: on ? FILL[i] : "#ffffff", stroke: on ? COL[i] : "#e6e9ee", "stroke-width": on ? 2 : 1 }, g);
      if (on) el("rect", { x: nx, y: y + 4, width: 4, height: nh - 8, rx: 2, fill: COL[i] }, g);
      tx(g, nx + 12, y + (nar ? 14 : 17), NAME[i], on ? "#151a21" : "#5a6472", "start", nar ? 10.4 : 11, on ? 700 : 400);
      tx(g, nx + 12, y + (nar ? 26 : 31), SUB[i], "#5a6472", "start", nar ? 8.2 : 8.6, 400);
      tx(g, nx + nw - 10, y + (nar ? 14 : 17), v.toFixed(0) + "%", on ? COL[i] : "#a6b0ba", "end", nar ? 8.6 : 9.5, on ? 700 : 400);
      if (i < 4) arrow(g, nx + nw / 2, y + nh + 1, y + gap - 1, "#0f8a5f");
    }

    var mx = p.x + (nar ? 28 : 30), my = p.y + (nar ? 280 : 362), mw = nar ? 288 : 348, mh = nar ? 60 : 56;
    el("rect", { x: mx, y: my, width: mw, height: mh, rx: 8, fill: "#fdf3e0", stroke: "#e6c98a" }, g);
    tx(g, mx + 12, my + (nar ? 24 : 22), nar ? "线粒体：供能，但不在路径上" : "线粒体：全程供能，但不在路径上", "#8a5a12", "start", nar ? 9 : 9.6, 700);
    if (nar) {
      tx(g, mx + 12, my + 44, "蛋白分子不进入它，也不出峰", "#3a3a35", "start", 8.2, 400);
    } else {
      tx(g, mx + 12, my + 40, "蛋白分子从不进入它，放射性也不在它身上出峰", "#3a3a35", "start", 8.6, 400);
    }
  }

  function draw() {
    var gA = $("gxA"), gB = $("gxB");
    gA.textContent = ""; gB.textContent = "";
    /* 每帧重绘，图形节点会被替换：让它俩不参与命中测试，
       否则 mousedown/mouseup 落在不同节点上，浏览器不会派发 click（点画布换关键帧就失效） */
    gA.setAttribute("pointer-events", "none");
    gB.setAttribute("pointer-events", "none");
    drawLeft(gA, A);
    drawRight(gB, A);
  }

  function render() {
    var s = calc(A);
    var vmax = Math.max(s.i0, s.i1, s.i2, s.i3, s.i4);
    var ph = phase(A);
    var nxt = "—";
    for (var i = 0; i < PK.length; i++) { if (PK[i] > A + 0.4) { nxt = String(PK[i]); break; } }

    $("gxVa").textContent = String(Math.round(A));
    $("gxVb").textContent = vmax.toFixed(1);
    $("gxVc").textContent = nxt;
    $("gxVs").textContent = NAME[s.main];
    $("gxVsn").textContent = ph.s;
    $("gxStBox").style.background = (ph.c === "#2f8a5b" ? "#e6f6ee" : "#fdf3e0");
    $("gxStBox").style.borderColor = ph.c + "44";
    $("gxVs").style.color = ph.c;
    draw();
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  /* 停留帧：v=3（核糖体峰，3→5.5 s）与 v=20（高尔基体峰，11→14 s）各停 2.5–3 s */
  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 0 }, { t: 3, v: 3 }, { t: 5.5, v: 3 }, { t: 8, v: 11 }, { t: 11, v: 20 }, { t: 14, v: 20 }, { t: 15, v: 40 }],
    keys: [0, 3, 11, 20, 40],
    value: A, min: 0, max: 45, step: 1,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__bio = { calc: calc, cases: [
    { v: 3, eq: { main: 0 } },
    { v: 11, eq: { main: 1 } },
    { v: 20, eq: { main: 2 } },
    { v: 33, eq: { main: 3 } },
    { v: 40, eq: { main: 4 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
</body>
</html>
