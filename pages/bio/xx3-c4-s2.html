<p class="gx-lede">上一节讲了体细胞核移植的技术流程，这一节把同一套技术放到「人」身上，看它会走到哪一步、卡在哪一步。最容易错的一件事：把生殖性克隆和治疗性克隆当成一回事——前者要产生一个个体，后者只要胚胎干细胞。判断时先问一句：<b>有没有把重构胚胎植入母体、最后生出一个个体？</b></p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 生殖性克隆的定义<span class="q-src">人教版（2019）选择性必修3 · 第4章第2节</span></p>
<p class="q-b">生殖性克隆是指将体细胞核移植到去核卵母细胞中，获得重构胚胎并植入母体，最终获得与供核个体遗传信息相同的个体。</p>
<p class="q-n">→ 翻成人话：这句话由<b>四个条件</b>组成——①体细胞核移植；②受体是去核卵母细胞；③重构胚胎要植入母体；④最终产生<b>个体</b>。少掉③④中的任何一条，就不是生殖性克隆，而是治疗性克隆。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 我国的态度<span class="q-src">人教版（2019）选择性必修3 · 第4章第2节</span></p>
<p class="q-b">我国明确禁止生殖性克隆人，但不反对治疗性克隆的研究。</p>
<p class="q-n">→ 翻成人话：两个分句要一起写。「禁止」的对象是<b>生殖性克隆人</b>；「不反对」的对象是<b>治疗性克隆的研究</b>，而且要在法律和伦理规范下按规定管理，不是想怎么做就怎么做。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 面临的问题<span class="q-src">人教版（2019）选择性必修3 · 第4章第2节</span></p>
<p class="q-b">生殖性克隆人面临严重的技术、伦理和社会问题。</p>
<p class="q-n">→ 翻成人话：技术问题指成功率低、代孕与出生缺陷风险高；伦理问题指人的尊严、身份与家庭关系；社会问题指法律地位、商业代孕与公平。答题时三类各写一句，比只写「不道德」得分高。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>生殖性克隆</th><th>治疗性克隆</th></tr></thead>
<tbody>
<tr><td>技术起点</td><td>体细胞核移植，得到重构胚胎</td><td>体细胞核移植，得到重构胚胎</td></tr>
<tr><td>重构胚胎的去向</td><td>植入母体（代孕）</td><td>只在体外培养，不植入母体</td></tr>
<tr><td>最终产物</td><td>与供核个体遗传信息相同的个体</td><td>胚胎干细胞，用于治疗疾病</td></tr>
<tr class="key"><td>真正的区别</td><td><b>要产生新的个体</b></td><td><b>不产生个体，只要干细胞</b></td></tr>
<tr><td>我国态度</td><td>明确禁止生殖性克隆人</td><td>不反对研究，按规定管理</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只有「真正的区别」这一行要背死：<b>生殖性克隆与治疗性克隆要分清</b>，判据是「有没有产生个体」，不是「用不用核移植」——两者起点完全相同。另外，本页出现的成功率数字都是<b>示意值</b>，教材没有给具体数字，只用来表达「代价高」。</p>
</section>

<p class="ex-q">生殖性克隆人和治疗性克隆都要用到体细胞核移植技术。有人据此认为「两者是一回事，只是用途不同」。请回答：（1）生殖性克隆人和治疗性克隆的根本区别是什么？（2）我国对这两种克隆分别持什么态度？</p>

<li class="step">

<p class="s-b">题目问「根本区别」，又特意点出「都要用核移植」——这是在诱导你答技术手段。先抓住真正的判据：最终产物是<b>个体</b>还是<b>干细胞</b>。</p>

<p class="s-b">体细胞核移植到去核卵母细胞 → 重构胚胎 → <b>植入母体</b> → 获得与供核个体遗传信息相同的个体。链条里「植入母体」是关键一环。</p>

<p class="er-v">✓ 生殖性克隆人成功率低、代价高（示意值），重构胚胎发育异常和出生缺陷风险高，要反复尝试。</p>
<p class="er-w">错在哪：把「能做出个别个体」当成「成功率高」。课本只说面临严重的技术问题，具体数字是示意值。</p>
</div>
<div class="er">
<p class="er-x">✗ 我国支持生殖性克隆人研究，只是暂缓应用。</p>
<p class="er-v">✓ 我国禁止生殖性克隆人，不反对治疗性克隆的研究，并要求按规定管理。</p>
<p class="er-w">错在哪：把「不反对治疗性克隆」偷换成「支持生殖性克隆人」。两个分句的对象不能互换。</p>
</div>
<div class="er">
<p class="er-x">✗ 治疗性克隆最终也会克隆出一个完整的人。</p>
<p class="er-v">✓ 治疗性克隆只在体外培养重构胚胎，获得胚胎干细胞用于治疗，不植入母体、不产生个体。</p>
<p class="er-w">错在哪：没有分清「胚胎干细胞」和「个体」。治疗性克隆的终点是细胞，不是人。</p>
</div>
<div class="er">
<p class="er-x">✗ 克隆个体与供核者完全一样，连性格都相同。</p>
<p class="er-v">✓ 克隆个体与供核者的遗传信息基本相同，但卵母细胞质 DNA 和母体环境、后天环境都会影响性状。</p>
<p class="er-w">错在哪：把「核 DNA 相同」当成「整个人相同」。遗传信息相同不等于性状完全相同。</p>
</div>
<div class="er">
<p class="er-x">✗ 生殖性克隆人只是一个技术问题，等技术成熟就没有争议了。</p>
<p class="er-v">✓ 生殖性克隆人面临严重的技术、伦理和社会问题，伦理与社会问题不会随技术成熟而消失。</p>
<p class="er-w">错在哪：只答技术层面，漏掉伦理（尊严、身份）与社会（代孕商业化、法律）两层。</p>
</div>
<div class="er">
<p class="er-x">✗ 我国禁止一切克隆技术的研究。</p>
<p class="er-v">✓ 我国禁止的是生殖性克隆人；治疗性克隆的研究不反对，但要在法律和伦理规范下按规定管理。</p>
<p class="er-w">错在哪：把禁止范围无限扩大。禁止对象是「生殖性克隆人」，不是全部克隆技术。</p>
</div>

+'<text x="'+g.bottom[0]+'" y="'+g.bottom[2]+'" font-size="'+g.bottom[3]+'" fill="#3a3a35">低成功率 = 反复尝试 = 代价高，所以我国禁止生殖性克隆人。</text>';

box.style.background=st[1]==="#2f8a5b"?"#f2faf6":(st[1]==="#b8791f"?"#fff8ee":"#fdf1ef");
