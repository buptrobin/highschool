<p class="gx-claim">植物细胞工程就三句话：原理是<b>细胞的全能性</b>，路径是<b>外植体→愈伤组织→丛芽/根→植株</b>，全程<b>必须无菌</b>；而愈伤组织往哪边分化，由<b>生长素与细胞分裂素的比值</b>说了算——比值高→生根，比值低→生芽。</p>
<div class="gx-meta">
<span><i></i>人教版（2019）选择性必修3 第2章第1节</span>
<span><i></i>高二 · 细胞工程</span>

</div>
<p class="gx-lede">这一节是「细胞工程」的开篇：先把<b>植物组织培养</b>这条技术链走通，再用它去支撑<b>植物体细胞杂交</b>。最容易错的一件事不是流程，而是<b>方向</b>——生长素与细胞分裂素的比值到底哪边高才生根，以及为什么每一步都绕不开「无菌」。记住这条主线：原理是细胞的全能性，操作靠无菌，方向靠比值。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 植物组织培养的定义<span class="q-src">人教版（2019）选择性必修3 · 第2章第1节</span></p>
<p class="q-b">植物组织培养就是在无菌和人工控制条件下，将离体的植物器官、组织、细胞，培养在人工配制的培养基上，给予适宜的培养条件，诱导其产生愈伤组织、丛芽，最终形成完整的植株。</p>
<p class="q-n">→ 翻成人话：这一句由<b>四个硬条件</b>组成，少一个就不叫组织培养。①<b>无菌</b>——培养基、器械、外植体都要处理，否则先长菌不长生根；②<b>人工控制</b>——培养基是人工配制的，温度、光照、pH 都要给对；③材料必须<b>离体</b>——长在植株上的枝条自己发芽，那是正常生长发育；④路径固定——先<b>脱分化</b>成愈伤组织，再<b>再分化</b>出丛芽和根，最后成完整植株。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 原理<span class="q-src">人教版（2019）选择性必修3 · 第2章第1节</span></p>
<p class="q-b">植物组织培养的原理是细胞的全能性。</p>
<p class="q-n">→ 翻成人话：一个已经分化的体细胞并没有丢掉遗传信息，只是这些信息被「关掉」了；离体 + 营养 + 植物激素能把它重新打开，于是一个细胞能长成完整植株。答题必须写<b>细胞的全能性</b>，写「细胞分裂」「细胞分化」都只说到实现方式，不是原理。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 激素与分化方向<span class="q-src">人教版（2019）选择性必修3 · 第2章第1节</span></p>
<p class="q-b">在组织培养中，生长素与细胞分裂素的比值影响愈伤组织的分化方向。</p>
<p class="q-n">→ 翻成人话：关键词是<b>比值</b>，不是某一种激素的绝对浓度。比值高（生长素相对占优）→ 诱导<b>生根</b>；比值低（细胞分裂素相对占优）→ 诱导<b>生芽</b>；比值接近 1 时两种倾向势均力敌。所以题目问「要生根怎么办」，标准答法是「<b>提高生长素与细胞分裂素的比值</b>」，而不是「多加生长素」。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>脱分化</th><th>再分化</th></tr></thead>
<tbody>
<tr><td>起止</td><td>已分化的外植体细胞 → 愈伤组织</td><td>愈伤组织 → 丛芽、根（→ 完整植株）</td></tr>
<tr><td>细胞变化</td><td>失去原有结构与功能，恢复分裂能力</td><td>细胞重新分化，形成芽原基、根原基等器官</td></tr>
<tr><td>必要条件</td><td>离体 + 无菌 + 适宜激素配比</td><td>同左，芽的形成还需要光照</td></tr>
<tr class="key"><td>激素比值管什么</td><td>比值低 → 分化方向偏向<b>生芽</b></td><td>比值高 → 分化方向偏向<b>生根</b></td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只记一行也就够了：<b>两个「化」都要无菌，方向全看生长素/细胞分裂素的比值</b>。背流程时按「外植体 → 愈伤组织 → 芽/根 → 植株」四格记，别把「丛芽」和「愈伤组织」调换位置——愈伤组织是一团<b>没有器官分化</b>的薄壁细胞，它还不是芽。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 组织培养的激素配比与无菌操作<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">某小组用铁皮石斛的茎段作外植体进行组织培养。配制培养基时设置了两套方案：甲方案生长素与细胞分裂素的浓度比值为 0.5，乙方案为 4。（1）要大量获得生根苗，应选哪套方案？说明理由。（2）从外植体接入到形成试管苗，哪些环节必须做到无菌？为什么不能省？（3）有同学认为「乙方案里生长素浓度一定比甲方案高」，这个说法对吗？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性</p>
<p class="s-b">题目问的是「根的诱导」，而根和芽往哪边分化，取决于生长素与细胞分裂素的<b>比值</b>，不是某一种激素的绝对浓度。所以先把两套方案各自换算成比值：甲 r=0.5，乙 r=4。</p>
<p class="s-k">用到：比值影响愈伤组织的分化方向。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 比大小</p>
<p class="s-b">乙的比值 4 远大于 1，说明生长素相对占优；甲的比值 0.5 小于 1，说明细胞分裂素相对占优。代入模型：甲 r=0.5 时生根约 33%、生芽约 67%；乙 r=4 时生根 80%、生芽 20%。方向一眼分开。</p>
<p class="s-k">用到：<span class="gx-fml">生根倾向 = 100r ÷ (1 + r)</span>，数值要用公式算，不能凭「浓度高」直接下结论。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 得结论</p>
<p class="s-b">乙的比值更大，生根倾向 80%、生芽只有 20%，比甲的 33% 更符合「大量获得生根苗」。所以选乙：<b>提高生长素与细胞分裂素的比值</b>，生长素占优，促进生根；若要大量生芽，则把这个比值调低。</p>
<p class="s-k">用到：比值高→生根，比值低→生芽。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 补无菌这一问</p>
<p class="s-b">三个环节分别答：培养基要<b>高压蒸汽灭菌</b>；接种器械（镊子、解剖刀）要<b>灭菌</b>（高压蒸汽或灼烧）；外植体只能<b>消毒</b>（酒精、次氯酸钠表面处理后再用无菌水冲洗）。接种在<b>超净工作台</b>上、火焰旁完成。原因：培养基营养丰富，一旦带菌，微生物比植物组织长得快，会抢走营养并产生毒害，外植体还没分化就烂掉。</p>
<p class="s-k">用到：全程必须无菌；灭菌与消毒的区别。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 拆掉陷阱</p>
<p class="s-b">第（3）问的说法不对。比值高不等于生长素浓度高：乙方案也可能两种激素都比甲方案低，只是生长素降得更少；同样，比值相同而总浓度不同，效果也可能不同。另外一个常见错法是说「组织培养的原理是细胞分裂」——原理是<b>细胞的全能性</b>。</p>
<p class="s-k">用到：比值≠浓度；原理是细胞的全能性。</p>
</li>
</ol>

<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）选乙方案。愈伤组织的分化方向由生长素与细胞分裂素的比值决定：比值高时生长素占优，诱导生根；比值低时细胞分裂素占优，诱导生芽。乙方案比值 4 远大于甲方案的 0.5，生根倾向约 80%，故用于大量获得生根苗。<br>（2）①培养基：高压蒸汽灭菌；②接种器械：高压蒸汽灭菌或灼热灭菌；③外植体：用酒精、次氯酸钠等表面消毒，再用无菌水冲洗。接种在超净工作台上、火焰旁进行。原因：培养基含丰富营养，杂菌繁殖快，会与植物组织竞争营养并产生有害物质，导致外植体死亡，无法形成愈伤组织和丛芽。<br>（3）不对。比值是两种激素浓度的商，比值大只说明生长素相对于细胞分裂素更多，两者的绝对浓度都可能更低。植物组织培养的原理是细胞的全能性。</p>

<div class="qac">
<p class="q">「体细胞杂交和组织培养，到底谁是谁的一步？」</p>
<p class="a">体细胞杂交负责得到<b>杂种细胞</b>（去壁得原生质体 → 诱导融合 → 筛选）；把杂种细胞变成<b>杂种植株</b>，靠的是植物组织培养。<b>所以组培是体细胞杂交的最后一环</b>，原理仍是细胞的全能性。</p>

<p class="gx-note">六问其实是同一件事：<b>原理是细胞的全能性，所以离体细胞能成苗；只有全程无菌，它才活得到成苗；而成苗后长芽还是长根，由生长素与细胞分裂素的比值说了算</b>。答题时按这三层写，很少漏点。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 植物组织培养的原理是细胞分裂。</p>
<p class="er-v">✓ 植物组织培养的原理是<b>细胞的全能性</b>。</p>
<p class="er-w">错在哪：细胞分裂只是过程里的现象，原理是已分化的细胞仍含全套遗传信息、能发育成完整植株。</p>
</div>
<div class="er">
<p class="er-x">✗ 生长素浓度高就有利于生芽。</p>
<p class="er-v">✓ <b>生长素与细胞分裂素的比值高 → 生根，比值低 → 生芽</b>。</p>
<p class="er-w">错在哪：方向记反了。而且决定方向的是比值，不是某一种激素的绝对浓度，单说「多加生长素」不给分。</p>
</div>
<div class="er">
<p class="er-x">✗ 组织培养在室内进行，不必严格无菌。</p>
<p class="er-v">✓ <b>全程必须无菌</b>：培养基、器械灭菌，外植体消毒，接种在超净工作台上完成。</p>
<p class="er-w">错在哪：培养基营养丰富，杂菌比植物组织长得快，一污染就前功尽弃。</p>
</div>
<div class="er">
<p class="er-x">✗ 愈伤组织已经是一棵完整植株。</p>
<p class="er-v">✓ 愈伤组织是<b>排列疏松、无定形的薄壁细胞</b>，无器官分化，须经再分化才出芽和根。</p>
<p class="er-w">错在哪：把「脱分化的产物」当成了「再分化的产物」，流程图整条链就乱了。</p>
</div>
<div class="er">
<p class="er-x">✗ 组织培养会改变植物的遗传物质。</p>
<p class="er-v">✓ 组织培养是<b>无性繁殖</b>，遗传物质与亲本相同，能保持亲本性状。</p>
<p class="er-w">错在哪：改遗传物质的是诱变、基因工程等手段；组培只是让原有信息重新表达。</p>
</div>
<div class="er">
<p class="er-x">✗ 外植体也要高压蒸汽灭菌。</p>
<p class="er-v">✓ 外植体只能<b>消毒</b>（酒精、次氯酸钠等表面处理），培养基和器械才<b>灭菌</b>。</p>
<p class="er-w">错在哪：高压蒸汽会把外植体细胞一起杀死；灭菌与消毒的对象和程度都不同。</p>
</div>
<div class="er">
<p class="er-x">✗ 生长素和细胞分裂素的作用相同，加哪种都行。</p>
<p class="er-v">✓ 两者作用不同：生长素利于<b>生根</b>，细胞分裂素利于<b>生芽</b>，二者<b>比值</b>决定分化方向。</p>
<p class="er-w">错在哪：作用相同就无法解释「比值改变方向」这件事，逻辑上自相矛盾。</p>
</div>
