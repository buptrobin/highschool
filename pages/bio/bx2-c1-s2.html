<div class="gx-meta">
<span><i></i>人教版（2019）必修2 第1章第2节</span>

<p class="gx-lede">第 1 节只研究一对相对性状（分离定律），本节把两对相对性状放在一起看：F₁ 自交，F₂ 出现了 4 种表现型，数量比接近 9∶3∶3∶1。整节的重点不是背这个比，而是说清它成立的前提——<b>两对基因必须位于非同源染色体上</b>。最容易错的地方有三个：把 9∶3∶3∶1 当成所有两对性状的通用答案；把自由组合说成发生在减数第二次分裂；看到 9∶7、15∶1 就以为「不遵循自由组合」了。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 两对相对性状的杂交实验<span class="q-src">人教版（2019）必修2 · 第1章第2节</span></p>
<p class="q-b">F₁ 自交，F₂ 中出现 4 种表现型，其数量比接近 9∶3∶3∶1。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个条件</b>组成——① 两对相对性状分别由两对等位基因控制；② 这两对基因位于<b>非同源染色体</b>上，互不干扰；③ 显性完全，F₁ 是双杂合（YyRr）。少任何一个条件，比例都会变，所以答题时不能只写「9∶3∶3∶1」。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 对自由组合现象的解释<span class="q-src">人教版（2019）必修2 · 第1章第2节</span></p>
<p class="q-b">控制不同性状的遗传因子的分离和组合是互不干扰的。形成配子时，决定同一性状的成对的遗传因子彼此分离，决定不同性状的遗传因子自由组合。</p>
<p class="q-n">→ 翻成人话：「分离」和「自由组合」是<b>同一个时刻</b>发生的两件事，都在<b>减数第一次分裂后期</b>：同源染色体分开，等位基因随之分离；非同源染色体自由组合，非等位基因随之自由组合。写「减数第二次分裂」一律判错。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 自由组合定律的实质<span class="q-src">人教版（2019）必修2 · 第1章第2节</span></p>
<p class="q-b">位于非同源染色体上的非等位基因的分离或组合是互不干扰的。</p>
<p class="q-n">→ 翻成人话：注意限定语是「<b>非同源染色体上的</b>非等位基因」。同一对染色体上的非等位基因（连锁）不自由组合，F₂ 也就不是 9∶3∶3∶1——这正是本节的第一个扣分点。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>分离定律（一对相对性状）</th><th>自由组合定律（两对相对性状）</th></tr></thead>
<tbody>
<tr><td>研究对象</td><td>一对等位基因</td><td>两对（或更多对）等位基因</td></tr>
<tr><td>F₁ 产生的配子</td><td>2 种，1∶1</td><td>4 种，1∶1∶1∶1</td></tr>
<tr><td>F₂ 表现型种类与比例</td><td>2 种，3∶1</td><td>4 种，9∶3∶3∶1</td></tr>
<tr><td>F₂ 基因型种类</td><td>3 种</td><td>9 种</td></tr>
<tr><td>F₂ 纯合子比例</td><td>1/2</td><td>4/16，即 1/4</td></tr>
<tr class="key"><td>发生时期与实质</td><td>减数第一次分裂后期：等位基因随同源染色体分开而分离</td><td>减数第一次分裂后期：非同源染色体上的非等位基因自由组合</td></tr>
<tr><td>不成立的情况</td><td>—</td><td>两对基因位于同一对染色体上（连锁）、或存在致死、或表现型受环境影响</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只背高亮那一行：两条定律都发生在减数第一次分裂后期，区别只在「分开的是同源染色体、自由组合的是非同源染色体」。9∶3∶3∶1 不是定律本身，它是<b>两对基因位于非同源染色体上</b>时算出来的结果：配子 <span class="gx-fml">2²＝4</span> 种、基因型 <span class="gx-fml">3²＝9</span> 种、棋盘 <span class="gx-fml">4²＝16</span> 格。</p>
</section>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">F₂ 一定会出现 9∶3∶3∶1 吗？</p>
<p class="a">不一定。只有<b>两对基因位于非同源染色体上</b>、完全显性、无致死时才出现；同一对染色体上的非等位基因（连锁）不自由组合，比例会偏离。变形比（9∶7、15∶1）仍遵循自由组合。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="两对基因在非同源染色体上出现 9比3比3比1，在同一对染色体上则不是">

<text class="ms" x="20" y="52" font-size="9" fill="#2f6a4f">非同源染色体上 → 9∶3∶3∶1</text>
<text class="ms" x="20" y="74" font-size="9" fill="#3a3a35">同一对染色体上（连锁）</text>
<text class="ms" x="20" y="96" font-size="9" fill="#b8402f">→ 不是 9∶3∶3∶1</text>
<text class="ms" x="20" y="116" font-size="9" fill="#5a6472">还要：完全显性、无致死</text>
</svg>
</div>
<div class="qac">
<p class="q">自由组合定律和分离定律是什么关系？</p>
<p class="a">分离定律是基础：每一对等位基因先各自分离，再把两对的结果相乘，<span class="gx-fml">(3∶1)²＝9∶3∶3∶1</span>。两者发生在<b>同一次减数第一次分裂后期</b>，不是两次分裂。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="两对基因各自分离后相乘得到 9比3比3比1">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text class="ms" x="120" y="28" text-anchor="middle" font-size="9.6" font-weight="700" fill="#151a21">先分离，再相乘</text>
<text class="ms" x="20" y="52" font-size="9" fill="#3a3a35">每对各自分离：3∶1</text>
<text class="ms" x="20" y="74" font-size="9" fill="#2f6a4f">(3∶1)² ＝ 9∶3∶3∶1</text>
<text class="ms" x="20" y="96" font-size="9" fill="#5a6472">都发生在减Ⅰ后期</text>
<text class="ms" x="20" y="116" font-size="9" fill="#5a6472">同一次分裂，不是两次</text>
</svg>
</div>
<div class="qac">
<p class="q">棋盘为什么是 16 格，格数怎么算？</p>
<p class="a">格数＝雌配子种类 × 雄配子种类。F₁ 产生 4 种雌配子、4 种雄配子，所以 4×4＝16 格；n 对独立基因时是 <span class="gx-fml">(2ⁿ)²＝4ⁿ</span> 格。</p>

<text class="ms" x="20" y="96" font-size="9" fill="#5a6472">基因型 3ⁿ 种</text>
<text class="ms" x="20" y="116" font-size="9" fill="#5a6472">表现型 2ⁿ 种</text>
</svg>
</div>
<div class="qac">
<p class="q">两对基因连锁，F₂ 还会是 9∶3∶3∶1 吗？</p>
<p class="a">不会。连锁时两个基因在同一条染色体上、一起传递，只有发生交换才产生少量重组型，比例取决于交换值。<b>只有位于非同源染色体上的非等位基因才自由组合</b>。</p>

<text class="ms" x="20" y="116" font-size="9" fill="#5a6472">非同源才自由组合</text>

<div class="qac">
<p class="q">F₂ 里的重组型占多少？</p>

<p class="er-w">错在哪：减Ⅱ后期是姐妹染色单体分开，只剩相同基因的分离，没有自由组合。</p>
</div>
<div class="er">
<p class="er-x">✗ 出现 9∶7，说明这两对基因不遵循自由组合。</p>
<p class="er-v">✓ 9∶7 是 9∶3∶3∶1 的变形（3＋3＋1 合并为 7），两对基因仍位于非同源染色体上，仍遵循自由组合。</p>
<p class="er-w">错在哪：只看比例数字，没看总和仍是 16 份、也没看基因位置。</p>
</div>
<div class="er">
<p class="er-x">✗ 含两对等位基因的个体产生 n 种配子。</p>
<p class="er-v">✓ 产生 2ⁿ 种配子；两对时是 4 种：YR、Yr、yR、yr，雌雄各 4 种。</p>
<p class="er-w">错在哪：把「基因对数 n」直接当成「配子种类数」，漏了每一对都有 2 种去向。</p>
</div>
<div class="er">
<p class="er-x">✗ F₂ 中纯合子占 1/16。</p>
<p class="er-v">✓ F₂ 中纯合子有 4 种（YYRR、YYrr、yyRR、yyrr），共占 4/16，即 1/4。</p>
<p class="er-w">错在哪：1/16 是某一种纯合基因型的比例，问「纯合子」要把 4 种加起来。</p>
</div>
<div class="er">
<p class="er-x">✗ 两对基因在同一对染色体上，F₂ 也是 9∶3∶3∶1。</p>
<p class="er-v">✓ 两对基因位于同一对染色体上时属于连锁，比例偏离 9∶3∶3∶1；只有非同源染色体上的非等位基因才自由组合。</p>
<p class="er-w">错在哪：把「非等位基因」误当成「一定自由组合」，忽略「非同源染色体上」这个限定。</p>
</div>
<div class="er">
<p class="er-x">✗ F₂ 的黄色圆粒中，纯合子占 1/4。</p>
<p class="er-v">✓ F₂ 的黄色圆粒共 9 份，其中纯合子只有 YYRR 一种，占 1/9；1/4 是纯合子在全部 F₂ 中的比例。</p>
<p class="er-w">错在哪：分母从 16 换成 9，分子没跟着换，条件概率没算。</p>
</div>

<script>
/* 互动脚本本体（由 build-page.mjs 包进 <script> 里，所以这里不要写 <script> 标签） */
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var GX = window.GX, el = GX.el, tx = GX.tx, $ = GX.$;
  var stage = $("gxStage");
  if (!stage || !window.AutoPilot) return;

  /* 两套坐标：宽屏 880×470，窄屏独立 360×700 */
  var W = { vb: "0 0 880 470", left: { x: 16, y: 16, w: 424, h: 438 }, right: { x: 456, y: 16, w: 408, h: 438 } };
  var N = { vb: "0 0 360 700", left: { x: 8, y: 8, w: 344, h: 300 }, right: { x: 8, y: 320, w: 344, h: 372 } };
  var L = W, G = null, A = 1, S = null;

  /* 纯函数：参数 → 数值。render() 和 __bio.cases 都用它 */
  function calc(v) {
    var n = Math.max(1, Math.min(4, Math.round(v)));
    return { n: n, gam: Math.pow(2, n), phe: Math.pow(2, n), geno: Math.pow(3, n), comb: Math.pow(4, n) };
  }

  /* 几何量：只在 layout() 时算一次，render() 直接用 */
  function geom() {
    var wide = (L === W);
    return wide
      ? { wide: true, rowTop: L.left.y + 64, rowH: 72, barW: 64, barH: 26,
          col1: L.left.x + 94, col2: L.left.x + 166, noteX: L.left.x + 242,
          bandY: L.left.y + 334, bandH: 88, pad: 20,
          rx: L.right.x + 20, ry: L.right.y + 60, rowW: L.right.w - 40, step: 56, rowH2: 46, fs: 9.4 }
      : { wide: false, rowTop: L.left.y + 44, rowH: 48, barW: 52, barH: 22,
          col1: L.left.x + 76, col2: L.left.x + 136, noteX: L.left.x + 198,
          bandY: L.left.y + 224, bandH: 68, pad: 12,
          rx: L.right.x + 12, ry: L.right.y + 40, rowW: L.right.w - 24, step: 52, rowH2: 42, fs: 8.8 };
  }

  var LET = "ABCD";

  function draw() {
    var gA = $("gxA"), gB = $("gxB");
    gA.textContent = ""; gB.textContent = "";

    /* 左：染色体 → 配子 */
    el("rect", { x: L.left.x, y: L.left.y, width: L.left.w, height: L.left.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    tx(gA, L.left.x + G.pad, L.left.y + 30, "n 对等位基因：同源分离、非同源自由组合", "#5a6472", "start", 10.2, 700);
    for (var i = 0; i < S.n; i++) {
      var y = G.rowTop + i * G.rowH, ch = LET.charAt(i);
      tx(gA, L.left.x + G.pad, y + 17, "第 " + (i + 1) + " 对", "#8a93a0", "start", 9, 400);
      el("rect", { x: G.col1, y: y, width: G.barW, height: G.barH, rx: 6, fill: "#eaf1fb", stroke: "#b9cdea" }, gA);
      el("rect", { x: G.col2, y: y, width: G.barW, height: G.barH, rx: 6, fill: "#fff7e0", stroke: "#e6cf8f" }, gA);
      tx(gA, G.col1 + G.barW / 2, y + 18, ch, "#2f4f7a", "middle", 11.5, 700);
      tx(gA, G.col2 + G.barW / 2, y + 18, ch.toLowerCase(), "#7a5a12", "middle", 11.5, 700);
      tx(gA, G.noteX, y + 17, "→ 2 种去向", "#5a6472", "start", 8.6, 400);
    }

    /* 左：底部口径条 */
    el("rect", { x: L.left.x + G.pad, y: G.bandY, width: L.left.w - G.pad * 2, height: G.bandH, rx: 8, fill: "#eef7f2", stroke: "#b8e6d0" }, gA);
    var bx = L.left.x + G.pad + 12;
    tx(gA, bx, G.bandY + 24, "减Ⅰ后期：同源染色体分开 → 等位基因分离", "#2f6a4f", "start", G.fs, 400);
    tx(gA, bx, G.bandY + 44, "非同源染色体自由组合 → 非等位基因自由组合", "#2f6a4f", "start", G.fs, 400);
    tx(gA, bx, G.bandY + 66, "配子 " + S.gam + " 种（2ⁿ）；n＝2 时 4 种配子、16 格棋盘", "#5a6472", "start", G.fs, 400);

    /* 右：四个数 */
    el("rect", { x: L.right.x, y: L.right.y, width: L.right.w, height: L.right.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    tx(gB, L.right.x + G.pad, L.right.y + 30, "数量关系（n 对独立基因）", "#5a6472", "start", 10.2, 700);
    var rows = [
      ["配子种类 2ⁿ", S.gam, "雌雄各 " + S.gam + " 种，比例相等"],
      ["F₂ 表现型 2ⁿ", S.phe, "完全显性时的种类数"],
      ["F₂ 基因型 3ⁿ", S.geno, "每种表现型含 1～4 种"],
      ["棋盘格数 4ⁿ", S.comb, "甲配子 × 乙配子"]
    ];
    for (i = 0; i < rows.length; i++) {
      var yy = G.ry + i * G.step, hot = (i === 3);
      el("rect", { x: G.rx, y: yy, width: G.rowW, height: G.rowH2, rx: 8,
        fill: hot ? "#fff7e0" : "#f8fbfd", stroke: hot ? "#e6cf8f" : "#e6e9ee" }, gB);
      tx(gB, G.rx + 14, yy + 20, rows[i][0], "#3a3a35", "start", 9.4, 600);
      tx(gB, G.rx + G.rowW - 14, yy + 23, String(rows[i][1]), "#151a21", "end", 15, 700);
      tx(gB, G.rx + 14, yy + 38, rows[i][2], "#8a93a0", "start", 8.4, 400);
    }

    /* 右：n＝2 时画 9∶3∶3∶1 比例条 */
    var capY = G.ry + 4 * G.step + 18;
    if (S.n === 2) {
      tx(gB, G.rx, capY, "F₂ 表现型比（n＝2 的停留帧）", "#2f6a4f", "start", 9, 700);
      var seg = [[9, "#e6cf8f", "9/16"], [3, "#b9cdea", "3/16"], [3, "#b3ddc4", "3/16"], [1, "#cbb8e6", "1/16"]];
      var acc = G.rx, y0 = capY + 10;
      for (i = 0; i < seg.length; i++) {
        var w = G.rowW * seg[i][0] / 16;
        el("rect", { x: acc, y: y0, width: w, height: 26, fill: seg[i][1], stroke: "#ffffff" }, gB);
        if (w > 30) tx(gB, acc + w / 2, y0 + 17, seg[i][2], "#3a3a35", "middle", 8.6, 700);
        acc += w;
      }
      tx(gB, G.rx, y0 + 48, "黄圆 9 ∶ 黄皱 3 ∶ 绿圆 3 ∶ 绿皱 1", "#5a6472", "start", 8.8, 400);
    } else {
      tx(gB, G.rx, capY, "n＝" + S.n + " 时，F₂ 不是 9∶3∶3∶1", "#b8791f", "start", 9, 700);
      tx(gB, G.rx, capY + 22, "9∶3∶3∶1 只在 n＝2（两对独立基因）时出现", "#8a93a0", "start", 8.6, 400);
    }
  }

  function render() {
    if (!G) { L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N; G = geom(); }
    S = calc(A);
    var st, col, bg, sn;
    $("gxVa").textContent = String(S.n);
    $("gxVb").textContent = String(S.gam);
    $("gxVc").textContent = String(S.geno);
    if (S.n <= 2) { st = S.n === 1 ? "一对基因" : "两对独立"; col = "#2f8a5b"; bg = "#e6f6ee"; sn = S.n === 1 ? "F₂ 表现型比 3∶1" : "16 格 = 9∶3∶3∶1"; }
    else if (S.n === 3) { st = "三对基因"; col = "#b8791f"; bg = "#fdf3e0"; sn = "8 种表现型 · 64 格"; }
    else { st = "四对基因"; col = "#b8791f"; bg = "#fdf3e0"; sn = "16 种表现型 · 256 格"; }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    draw();
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    G = geom();
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 1 }, { t: 1.2, v: 1 }, { t: 3, v: 2 }, { t: 5.2, v: 2 }, { t: 7.4, v: 4 }, { t: 9.4, v: 3 }, { t: 11.4, v: 1 }],
    keys: [1, 2, 3, 4],
    value: A, min: 1, max: 4, step: 1,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__bio = { calc: calc, cases: [
    { v: 1, eq: { gam: 2, phe: 2, geno: 3 } },
    { v: 2, eq: { gam: 4, phe: 4, geno: 9 } },
    { v: 3, eq: { gam: 8, phe: 8, geno: 27 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
