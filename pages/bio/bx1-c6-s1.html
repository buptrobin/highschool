<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 细胞周期的定义<span class="q-src">人教版（2019）必修1 · 第6章第1节</span></p>
<p class="q-b">细胞周期是指连续分裂的细胞，从一次分裂完成时开始，到下一次分裂完成时为止。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个条件</b>组成。① 对象必须是「连续分裂的细胞」，神经细胞、成熟红细胞不再分裂，没有细胞周期；② 起点是「一次分裂完成」那一瞬间，不是「开始分裂」，从开始分裂数起会把分裂期重复算一次；③ 终点是「下一次分裂完成」，所以一个周期 = 间期 + 分裂期，首尾都是同一个动作。三个条件少一个，判据就错。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 两个阶段<span class="q-src">人教版（2019）必修1 · 第6章第1节</span></p>
<p class="q-b">一个细胞周期包括分裂间期和分裂期两个阶段；分裂间期占细胞周期的绝大部分时间。</p>
<p class="q-n">→ 翻成人话：两句话要分开记。第一句给「分几段」，第二句给「谁更长」。间期约占整个周期的 90%，分裂期只占约 10%，所以「分裂期时间最长」是错的，「间期时间最长」才对。间期也不是休息：它要完成 DNA 的复制和有关蛋白质的合成，为分裂期做物质准备——这正是「间期是准备、分裂期是分配」的分工。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 细胞大小与物质运输<span class="q-src">人教版（2019）必修1 · 第6章第1节</span></p>
<p class="q-b">细胞体积越大，其相对表面积越小，物质运输的效率越低。</p>
<p class="q-n">→ 翻成人话：三个量是一条<b>因果链</b>，不是三件事：体积增大 → 相对表面积（表面积÷体积）变小 → 物质运输的效率变低。对正方体来说相对表面积 = 6/a（a 是边长），边长翻倍，这个比值直接减半。它回答的是「细胞为什么不能无限长大」，也是琼脂块实验要你看的那一格：块越大，中心没被染色的部分占的比例越大。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>分裂间期</th><th>分裂期</th></tr></thead>
<tbody>
<tr><td>时长占比</td><td>约占整个周期的 90%，最长</td><td>约占 10%，很短</td></tr>
<tr><td>主要活动</td><td>DNA 复制、有关蛋白质的合成</td><td>染色体形态、位置有规律地变化，均分到两个子细胞</td></tr>
<tr><td>染色体的样子</td><td>染色质：细长丝状，光学显微镜下看不清染色体</td><td>染色质螺旋化成为染色体，能看清、能计数</td></tr>
<tr><td>染色体数（2N=4）</td><td>始终是 4（S 期复制后还是 4）</td><td>4 →（后期）8 →（末期）4</td></tr>

<tr class="key"><td>最容易记反的一条</td><td>间期最长，且细胞在忙着复制</td><td>后期：染色体 4→8，DNA 仍是 8</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只高亮一行：后期那一格是全部计算题的开关。做题时先问两句——问的是哪个时期？数的是染色体还是 DNA？这两句问清，绝大多数计数题就不会错。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>

<div class="gx-ex">
<p class="ex-t">例题 · 后期三量计数<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">某细胞（2N=4）正在完成一次有丝分裂。后期时，该细胞中的染色体数、DNA 数、染色单体数分别是多少？为什么？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题：把「时期」和「基准」钉住</p>
<p class="s-b">题干给了两个已知：时期是后期，基准是 2N=4（正常体细胞 4 条染色体、复制前 4 个 DNA）。后期既不是复制前，也不是已经分成两个子细胞，它处在一个细胞里染色体数最多、每条染色体最「瘦」的一瞬间。先写下「2N=4」这三个字，后面所有数都从它推。</p>
<p class="s-k">用到：细胞周期各时期的划分；2N=4 的含义。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 染色体数：着丝点分裂，单体变成染色体</p>
<p class="s-b">后期最标志性的事件是着丝点分裂：一条染色体上的两条姐妹染色单体分开，各自成为一条独立的染色体。分开之前是 4 条染色体（每条含 2 条单体），分开之后细胞里有 8 条染色体。注意「8」是这一个细胞里的数，不是 8N。</p>
<p class="s-k">用到：着丝点分裂 → 染色体数目暂时加倍。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · DNA 数与染色单体数：分别数什么</p>
<p class="s-b">DNA 数在上一个间期的 S 期就由 4 复制成 8，着丝点分裂只是把同一条染色体的两条单体拉开，DNA 分子既没有复制也没有降解，总数仍是 8。染色单体数则相反：它数的是「共用同一个着丝点的两条姐妹染色单体」，着丝点一分裂，这个「共用」消失，染色单体数立刻变成 0。</p>
<p class="s-k">用到：DNA 数看分子个数；染色单体数看有没有共同的着丝点。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 落笔：8、8、0，并用三量互相验证</p>
<p class="s-b">结论是 8 条染色体、8 个 DNA、0 条染色单体。验证一遍：后期每条染色体只含 1 个 DNA，所以「染色体数 = DNA 数」；染色单体数为 0，正说明每条染色体已经「一分为二」。如果算出 DNA 也加倍成 16，就说明把「染色体加倍」错记成了「DNA 加倍」——这是本题唯一的陷阱。</p>
<p class="s-k">用到：染色体数∶DNA 数 = 1∶1；后期无染色单体。</p>
</li>
</ol>

<p class="ans-b">染色体 8 条，DNA 8 个，染色单体 0 条。<br>① 后期着丝点分裂，姐妹染色单体分开，各自成为一条染色体，染色体数由 4 条暂时加倍为 8 条；<br>② DNA 在间期 S 期已完成复制，着丝点分裂不改变 DNA 总数，仍为 8 个；<br>③ 着丝点分裂后不再存在共用一个着丝点的两条姐妹染色单体，故染色单体数为 0。</p>

<p class="a">细胞体积越大，其<b>相对表面积越小</b>，物质运输的效率越低，满足不了细胞代谢的需要。相对表面积 = 表面积÷体积，正方体为 6/a；边长翻倍，比值减半。</p>

</div>

<div class="qac">
<p class="q">「染色单体是什么时候出现的？什么时候又没了？」</p>
<p class="a">S 期 DNA 复制后，每条染色体含两条姐妹染色单体，染色单体数由 0 变为 8（此时 DNA 也是 8）；<b>后期着丝点一分裂</b>，两条单体各成一条染色体，染色单体数立刻归 0。G1 期和后期都<b>没有</b>染色单体。</p>

<p class="gx-note">六问其实是同一件事：三个数的变化只由两个动作决定——染色体有没有复制（S 期），着丝点有没有分裂（后期）。把这两个动作用一条时间轴排好，问哪一个时期都只是在轴上取一格。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 细胞周期是从细胞开始分裂时开始算的，到分裂结束为止。</p>
<p class="er-v">✓ 细胞周期是指连续分裂的细胞，从一次分裂完成时开始，到下一次分裂完成时为止。</p>
<p class="er-w">错在哪：起点错。从「开始分裂」数，分裂期会被重复算一次，间期整个漏在周期之外——判据题第一句就考这个。</p>
</div>

<div class="er">
<p class="er-x">✗ 一个细胞周期中，分裂期占的时间最长。</p>
<p class="er-v">✓ 一个细胞周期包括分裂间期和分裂期两个阶段；分裂间期占细胞周期的绝大部分时间（约 90%）。</p>
<p class="er-w">错在哪：把「最重要」当成「最长」。分裂期短，但染色体形态、位置的变化都集中在这里，所以它考得多，不等于它占得久。</p>
</div>

<div class="er">
<p class="er-x">✗ 有丝分裂后期，染色体数目和 DNA 数目都加倍了。</p>
<p class="er-v">✓ 后期着丝点分裂，姐妹染色单体分开成为两条染色体，染色体数目暂时加倍；DNA 总数不变，染色单体数为 0。</p>
<p class="er-w">错在哪：加倍的只有染色体数（4→8）。DNA 在 S 期就已经是 8，到末期才随细胞一分为二变回 4——这一步错，整道计数题的三个数全错。</p>
</div>

<div class="er">
<p class="er-x">✗ 分裂间期的细胞不活动，只是在等待分裂。</p>
<p class="er-v">✓ 间期细胞完成 DNA 的复制和有关蛋白质的合成，为分裂期做物质准备。</p>
<p class="er-w">错在哪：把「显微镜下看不出变化」当成「没有活动」。间期代谢旺盛，新增的 DNA 与蛋白质都是分裂期要用的原料。</p>
</div>

<div class="er">
<p class="er-x">✗ 有丝分裂的结果是染色体数目减半。</p>
<p class="er-v">✓ 有丝分裂使亲代细胞的染色体经复制后精确地平均分配到两个子细胞中，子细胞染色体数目与亲代相同。</p>
<p class="er-w">错在哪：把有丝分裂和减数分裂混了。有丝分裂是「复制一次、均分一次」，子细胞仍是 2N=4；数目减半是减数分裂的特征。</p>
</div>

<div class="er">
<p class="er-x">✗ 染色单体的数目始终等于 DNA 的数目。</p>
<p class="er-v">✓ 只有在一条染色体含两条姐妹染色单体时，染色单体数才与 DNA 数相等（都等于 8）；G1 期与后期，染色单体数都是 0。</p>
<p class="er-w">错在哪：「相等」只在 S 期结束到后期之前成立。后期 DNA 仍是 8，染色单体已是 0，等式立刻失效。</p>
</div>

<div class="er">
<p class="er-x">✗ 赤道板是细胞里真实存在的结构，末期在赤道板的位置形成细胞板。</p>
<p class="er-v">✓ 赤道板是一个假想的平面，用来描述中期染色体的位置；末期在赤道板的位置形成细胞板，进而形成新的细胞壁。</p>
<p class="er-w">错在哪：把「位置」当成「结构」。真实存在的结构是纺锤体、细胞板，赤道板只是一条用来定位的参考线。</p>
</div>
</div>

    var ratio, msg;
    if (p.k === "末期") { ratio = "每个子细胞 1 ∶ 1"; msg = "细胞一分为二：8 条染色体与 8 个 DNA 平均分给两个子细胞，各得 4 和 4。"; }
    else if (s.chd > 0) { ratio = "染色体 ∶ DNA = 1 ∶ 2"; msg = "每条染色体含 2 条姐妹染色单体，所以 DNA 数是染色体数的 2 倍。"; }
    else if (s.chr > 4) { ratio = "染色体 ∶ DNA = 1 ∶ 1"; msg = "着丝点分裂，两条单体各成一条染色体：染色体数翻倍，DNA 不变。"; }
    else { ratio = "染色体 ∶ DNA = 1 ∶ 1"; msg = "每条染色体只含 1 个 DNA，没有姐妹染色单体，所以单体数为 0。"; }
    tx(g, bx + 12, by + 22, ratio, p.col, "start", 11, 700);
    wrap(g, bx + 12, by + 42, msg, bw - 24, 9, "#3a3a35", 16);
    if (!narrow) tx(g, bx + 12, by + bhh - 12, "滑块最小刻度 0.5%：后期 96.5–98.5 只有四格", "#6b7280", "start", 8.4, 400);
  }

  function draw() {
    var gA = $("gxA"), gB = $("gxB");
    gA.textContent = ""; gB.textContent = "";
    var p = phase(A), s = calc(A), g = geo(), lo = L.left;

    el("rect", { x: lo.x, y: lo.y, width: lo.w, height: lo.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    tx(gA, lo.x + 20, lo.y + 30, "一个细胞走一圈", "#5a6472", "start", 10.5, 700);
    tx(gA, lo.x + lo.w - 20, lo.y + 30, "2N = 4", "#5a6472", "end", 9.2, 400);
    drawCell(gA, g.cx, g.cy, g.r, g.r / 110, s, p);
    tx(gA, g.cx, g.cy - g.r - 12, p.name, p.col, "middle", 11, 700);
    drawTrack(gA, g.tlY);

    el("rect", { x: L.right.x, y: L.right.y, width: L.right.w, height: L.right.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    drawRight(gB, s, p);
  }

  function render() {
    var p = phase(A), s = calc(A);
    $("gxVa").textContent = A.toFixed(1);
    $("gxVb").textContent = fmt(s.chr) + " / " + fmt(s.dna);
    $("gxVc").textContent = fmt(s.chd);
    $("gxVs").textContent = p.name;
    $("gxVsn").textContent = p.sub;
    $("gxStBox").style.background = p.bg;
    $("gxStBox").style.borderColor = p.col + "44";
    $("gxVs").style.color = p.col;
    draw();
  }

  function layout() {
    narrow = !(stage.parentElement.getBoundingClientRect().width >= 640);
    L = narrow ? N : W;
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 20 }, { t: 3, v: 44 }, { t: 5.5, v: 90 }, { t: 7.5, v: 90 }, { t: 9.5, v: 97.5 }, { t: 11.5, v: 97.5 }, { t: 13.5, v: 100 }, { t: 15, v: 20 }],
    keys: [20, 44, 75, 97.5, 100],
    value: A, min: 0, max: 100, step: 0.5,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__bio = { calc: calc, cases: [
    { v: 20, eq: { chr: 4, dna: 4, chd: 0 } },
    { v: 55, eq: { chr: 4, dna: 6, chd: 4 } },
    { v: 75, eq: { chr: 4, dna: 8, chd: 8 } },
    { v: 95, eq: { chr: 4, dna: 8, chd: 8 } },
    { v: 97.5, eq: { chr: 8, dna: 8, chd: 0 } },
    { v: 100, eq: { chr: 4, dna: 4, chd: 0 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
</body>
</html>
