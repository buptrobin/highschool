<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 功能<span class="q-src">人教版（2019）必修1 · 第3章第3节</span></p>
<p class="q-b">细胞核控制着细胞的代谢和遗传，是细胞代谢和遗传的控制中心。</p>
<p class="q-n">→ 翻成人话：这句话有<b>三个条件</b>——① 对象是细胞核；② 控制代谢；③ 控制遗传。少写“遗传”就只剩半句；写“控制中心”时前面必须带“代谢和遗传”，不能扩成“一切生命活动的中心”。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 结构<span class="q-src">人教版（2019）必修1 · 第3章第3节</span></p>
<p class="q-b">细胞核的结构包括核膜、核仁和染色质；染色质主要由 DNA 和蛋白质组成。</p>
<p class="q-n">→ 翻成人话：<b>三个结构</b>（核膜、核仁、染色质）＋ <b>一个“主要”</b>。染色质由 DNA 和蛋白质组成，“主要”说明还含少量其他成分，答题时别把“主要”删掉写成“只由”。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 核孔<span class="q-src">人教版（2019）必修1 · 第3章第3节</span></p>
<p class="q-b">核孔是实现核质之间频繁的物质交换和信息交流的通道。</p>
<p class="q-n">→ 翻成人话：<b>两个功能</b>（物质交换、信息交流）＋ <b>一个限制</b>（有选择性）。“频繁”说明往来量大；“通道”不等于大门敞开——mRNA、蛋白质能过，DNA 一般留在核内。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>染色质</th><th>染色体</th></tr></thead>
<tbody>
<tr><td>存在时期</td><td>分裂间期</td><td>分裂期（前期螺旋化，中期最典型）</td></tr>
<tr><td>形态</td><td>细长丝状</td><td>短粗的圆柱状或棒状</td></tr>
<tr><td>螺旋化程度</td><td>低</td><td>高</td></tr>
<tr class="key"><td>化学本质</td><td>主要由 DNA 和蛋白质组成</td><td>主要由 DNA 和蛋白质组成</td></tr>
<tr><td>二者关系</td><td>同一种物质在间期的形态</td><td>同一种物质在分裂期的形态</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">背法：先看<b>化学本质</b>，再看形态。本质相同、形态不同，就是“同一种物质的两种形态”；只要本质不同，形态再像也不是同一种物质。整张表只高亮“化学本质”这一行，因为它是判断的落脚点。</p>
</section>

<p class="ex-q">科学家用显微操作把变形虫切成有核和无核两半：有核部分能正常摄食、生长和分裂，无核部分不摄食、不分裂，几天后死亡；若及时把细胞核植入无核部分，它又能恢复。请回答：（1）这个实验说明细胞核具有什么功能？（2）为什么说染色质和染色体是同一种物质，而不是两种物质？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题：两问分开答</p>
<p class="s-b">第（1）问找“控制什么”，第（2）问找“化学本质”。两问不能混成一句“细胞核很重要”。</p>

</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 第（1）问：三组现象对结论</p>
<p class="s-b">有核→能摄食、生长、分裂；无核→不摄食、不分裂、死亡；补核→恢复。说明细胞核控制着细胞的代谢和遗传。</p>
<p class="s-k">用到：代谢（摄食、生长）＋遗传（分裂）。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 第（2）问：先比化学本质</p>
<p class="s-b">染色质主要由 DNA 和蛋白质组成；染色体也由 DNA 和蛋白质组成。两者的化学本质相同。</p>
<p class="s-k">用到：染色质主要由 DNA 和蛋白质组成。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 再比形态：螺旋化程度不同</p>
<p class="s-b">间期呈细长丝状的染色质；分裂期高度螺旋化，缩短变粗，成为短粗的染色体。形态不同，但物质没换。</p>
<p class="s-k">用到：螺旋化程度；间期与分裂期。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 下结论并防坑</p>
<p class="s-b">同一种物质在不同时期的两种形态。不能说“两种物质”，也不能说“染色体是染色质变成的新物质”；螺旋化是可逆的。</p>
<p class="s-k">用到：同一种物质、两种形态。</p>
</li>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 染色质和染色体是两种物质，染色体是分裂期才新出现的。</p>
<p class="er-v">✓ 染色质和染色体是同一种物质在不同时期的两种形态，都由 DNA 和蛋白质组成。</p>
<p class="er-w">错在哪：把“形态不同”当成“物质不同”；染色体不是新合成的，只是同一条染色质螺旋化变短变粗。</p>
</div>

<div class="er">
<p class="er-x">✗ 核孔是大分子进出的通道，什么都能过。</p>
<p class="er-v">✓ 核孔有选择性：mRNA、蛋白质等可通过，DNA 一般不出核。</p>
<p class="er-w">错在哪：把“通道”读成“全透”；核孔实现的是核质之间<b>有选择性</b>的物质交换和信息交流。</p>
</div>

<div class="er">
<p class="er-x">✗ 核仁是 DNA 复制的场所。</p>
<p class="er-v">✓ 核仁与核糖体的形成有关；DNA 复制主要在细胞核的核质中进行。</p>
<p class="er-w">错在哪：把“核仁”和“细胞核”混为一谈；核仁只是核内的一个结构，不等于整个细胞核。</p>
</div>

<div class="er">
<p class="er-x">✗ 所有细胞都有细胞核，没有核就不是细胞。</p>
<p class="er-v">✓ 哺乳动物成熟红细胞、植物筛管细胞等没有细胞核。</p>
<p class="er-w">错在哪：把“真核细胞”当成“每个真核细胞都有核”；无核的活细胞照样能完成各自的生命活动。</p>
</div>

<div class="er">
<p class="er-x">✗ 细胞核是细胞的“大脑”，能独立完成生命活动。</p>
<p class="er-v">✓ 细胞核控制细胞的代谢和遗传，但需要细胞质提供物质和能量。</p>
<p class="er-w">错在哪：把“控制中心”夸成“独立生命系统”；细胞核离开细胞质就不能长期存活。</p>
</div>

<div class="er">
<p class="er-x">✗ 核膜是单层膜，所以物质可以自由进出。</p>
<p class="er-v">✓ 核膜是双层膜，把核内物质与细胞质分开；核孔有选择性。</p>
<p class="er-w">错在哪：记错膜层数，又顺手推出“自由进出”；核膜和细胞膜一样是生物膜，都有选择透过性。</p>
</div>
</div>

<script src="../../assets/page.js"></script>
<script src="../../assets/gx.js"></script>
<script src="../../assets/autopilot.js"></script>
<script>
/* 互动脚本本体（由 build-page.mjs 包进 <script> 里，所以这里不要写 <script> 标签） */
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var GX = window.GX, el = GX.el, tx = GX.tx, $ = GX.$;
  var stage = $("gxStage");
  if (!stage || !window.AutoPilot) return;

  /* 两套坐标：宽屏 880×470，窄屏独立 360×700 */
  var W = { vb: "0 0 880 470", left: { x: 16, y: 16, w: 424, h: 438 }, right: { x: 456, y: 16, w: 408, h: 438 } };
  var N = { vb: "0 0 360 700", left: { x: 8, y: 8, w: 344, h: 300 }, right: { x: 8, y: 320, w: 344, h: 372 } };
  var L = W, A = 0;

  /* 纯函数：螺旋化程度 h → 相对长度与相对直径。render() 和 __bio.cases 都用它 */
  function calc(v) {
    var h = Math.max(0, Math.min(100, +v || 0));
    return { len: 100 - 0.72 * h, dia: 1 + 0.9 * h / 100 };
  }

  /* 中文按字数换行，避免长句冲出面板 */
  function wrap(parent, x, y, s, maxW, fs, col, lh) {
    var per = Math.max(6, Math.floor(maxW / fs)), lines = [], cur = "";
    for (var i = 0; i < s.length; i++) { cur += s.charAt(i); if (cur.length >= per) { lines.push(cur); cur = ""; } }
    if (cur) lines.push(cur);
    for (var k = 0; k < lines.length; k++) tx(parent, x, y + k * lh, lines[k], col, "start", fs, 400);
  }

  function statusOf(h) {
    if (h < 25) return {
      st: "间期 · 染色质", col: "#2f8a5b", bg: "#e6f6ee",
      sn: "细长丝状，螺旋化程度低",
      desc: "染色质呈细长丝状，DNA 便于复制和转录。"
    };
    if (h < 75) return {
      st: "螺旋化中 · 前期", col: "#b8791f", bg: "#fdf3e0",
      sn: "长度变短、直径变粗",
      desc: "螺旋化程度升高：长度变短、直径变粗，正在缩短变粗。"
    };
    return {
      st: "分裂期 · 染色体", col: "#2f8a5b", bg: "#e6f6ee",
      sn: "最粗最短，中期最典型",
      desc: "高度螺旋化：长度最短、直径最粗，中期最典型。"
    };
  }

  function draw() {
    var gA = $("gxA"), gB = $("gxB");
    gA.textContent = ""; gB.textContent = "";
    var s = calc(A), narrow = (L === N);
    var x0 = L.left.x, y0 = L.left.y, w0 = L.left.w;

    /* ---- 左：形态 ---- */
    el("rect", { x: x0, y: y0, width: w0, height: L.left.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    tx(gA, x0 + 20, y0 + 28, "同一个细胞核，两种形态", "#5a6472", "start", 10.5, 700);
    tx(gA, x0 + 20, y0 + (narrow ? 50 : 54), "相对长度 len = 100 − 0.72h", "#3a3a35", "start", narrow ? 9 : 9.6, 400);
    tx(gA, x0 + 20, y0 + (narrow ? 66 : 70), "相对直径 dia = 1 + 0.9 × h/100", "#3a3a35", "start", narrow ? 9 : 9.6, 400);

    var cy = y0 + (narrow ? 140 : 172);
    var sx = x0 + 22, maxW = w0 - 44;
    var lenW = maxW * s.len / 100;
    var amp = 2 + 22 * (1 - A / 100);
    var waves = 2 + 4 * (1 - A / 100);
    var sw = 2 + (s.dia - 1) * 9;

    el("line", {
      x1: sx, y1: cy + 58, x2: sx + maxW, y2: cy + 58,
      stroke: "#dfe7ee", "stroke-width": 1.4, "stroke-dasharray": "5 4"
    }, gA);
    tx(gA, sx, cy + 76, narrow ? "虚线＝间期长度（100%）" : "虚线：间期染色质长度（100%）", "#8a94a0", "start", 9, 400);

    var pts = [], n = 72, i;
    for (i = 0; i <= n; i++) {
      var u = i / n;
      pts.push([sx + lenW * u, cy + amp * Math.sin(u * Math.PI * 2 * waves)]);
    }
    el("path", {
      d: GX.poly(pts), fill: "none", stroke: "#dff2e8", "stroke-width": sw + 3.2,
      "stroke-linecap": "round", "stroke-linejoin": "round"
    }, gA);
    el("path", {
      d: GX.poly(pts), fill: "none", stroke: "#0f8a5f", "stroke-width": sw,
      "stroke-linecap": "round", "stroke-linejoin": "round"
    }, gA);

    var gap = maxW - lenW;
    if (gap > 100) {
      var ax = sx + lenW + 14, aw = gap - 28;
      el("line", {
        x1: ax, y1: cy - 46, x2: ax + aw, y2: cy - 46,
        stroke: "#e0b978", "stroke-width": 1.4, "stroke-dasharray": "5 4"
      }, gA);
      tx(gA, ax + aw / 2, cy - 52, "比间期短 " + Math.round(A * 0.72) + "%", "#b8791f", "middle", 9, 700);
    }

    if (narrow) {
      tx(gA, x0 + w0 / 2, y0 + 282, "形态变，物质不变：DNA＋蛋白质", "#0f8a5f", "middle", 9.6, 700);
    } else {
      tx(gA, x0 + 22, y0 + 322, "h=0：细长丝状的染色质（间期）", "#5a6472", "start", 9.4, 400);
      tx(gA, x0 + 22, y0 + 344, "h=100：短粗的染色体（分裂期最典型）", "#5a6472", "start", 9.4, 400);
      tx(gA, x0 + 22, y0 + 390, "形态变了，物质没变：都是 DNA＋蛋白质", "#0f8a5f", "start", 10.2, 700);
    }

    /* ---- 右：数值 ---- */
    var rx = L.right.x, ry = L.right.y, rw = L.right.w;
    el("rect", { x: rx, y: ry, width: rw, height: L.right.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    tx(gB, rx + 18, ry + (narrow ? 26 : 28), "三个数怎么变", "#5a6472", "start", 10.5, 700);
    var bw = rw - 36, bx = rx + 18;

    var b1 = ry + (narrow ? 64 : 72), b2 = ry + (narrow ? 110 : 124);
    function bar(y, ratio, col, label, val) {
      tx(gB, bx, y - 8, label, "#5a6472", "start", 9.4, 700);
      tx(gB, bx + bw, y - 8, val, "#2b2a26", "end", 10, 700);
      el("rect", { x: bx, y: y, width: bw, height: 14, rx: 7, fill: "#eef2f5" }, gB);
      el("rect", { x: bx, y: y, width: Math.max(10, bw * ratio), height: 14, rx: 7, fill: col }, gB);
    }
    bar(b1, s.len / 100, "#0f8a5f", "相对长度 len（%）", s.len.toFixed(1) + "%");
    bar(b2, s.dia / 1.9, "#b8791f", "相对直径 dia（倍）", s.dia.toFixed(2));

    var sstate = statusOf(A);
    tx(gB, rx + 18, ry + (narrow ? 160 : 184), "当前状态", "#5a6472", "start", 9.4, 700);
    tx(gB, rx + 18, ry + (narrow ? 186 : 212), sstate.st, sstate.col, "start", narrow ? 18 : 21, 700);
    wrap(gB, rx + 18, ry + (narrow ? 208 : 236), sstate.desc, bw, 9.2, "#5a6472", narrow ? 14 : 15);

    tx(gB, rx + 18, ry + (narrow ? 272 : 304), "h=0 细长丝状 → h=100 短粗棒状", "#3a3a35", "start", 9.2, 400);
    tx(gB, rx + 18, ry + (narrow ? 292 : 324), "全程：长度 −72%，直径 +90%（相对间期）", "#3a3a35", "start", 9.2, 400);
    tx(gB, rx + 18, ry + (narrow ? 340 : 374), "同一种物质：DNA＋蛋白质", "#0f8a5f", "start", 10, 700);
  }

  function render() {
    var s = calc(A), sstate = statusOf(A);
    $("gxVa").textContent = String(Math.round(A));
    $("gxVb").textContent = s.len.toFixed(1);
    $("gxVc").textContent = s.dia.toFixed(2);
    $("gxVs").textContent = sstate.st;
    $("gxVsn").textContent = sstate.sn;
    $("gxStBox").style.background = sstate.bg;
    $("gxStBox").style.borderColor = sstate.col + "44";
    $("gxVs").style.color = sstate.col;
    draw();
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [
      { t: 0, v: 0 }, { t: 1.2, v: 0 }, { t: 3.6, v: 50 },
      { t: 6, v: 100 }, { t: 9, v: 100 }, { t: 11.5, v: 0 }
    ],
    keys: [0, 25, 60, 100],
    value: 0, min: 0, max: 100, step: 1,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__bio = { calc: calc, cases: [
    { v: 0, eq: { len: 100, dia: 1 } },
    { v: 50, eq: { len: 64, dia: 1.45 } },
    { v: 100, eq: { len: 28, dia: 1.9 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
</body>
