<p class="gx-claim">一句话说清本节最该记住的判断：重组DNA技术的三个基本工具是<b>限制酶（切）</b>、<b>DNA连接酶（接）</b>、<b>载体（运）</b>，三者<b>缺一不可</b>；切和接动的都是<b>磷酸二酯键</b>，不是氢键、不是碱基对。</p>

<p class="gx-lede">本节是第3章「基因工程」的起点：后面讲操作步骤（四步）、讲应用、讲安全性，全部建立在这三个工具上。全节最容易错的一件事，是把「切割」和「连接」的部位当成氢键——限制酶切开的是磷酸二酯键，DNA连接酶恢复的也是磷酸二酯键；只有黏性末端之间互补配对那一步才是氢键。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 限制酶<span class="q-src">人教版（2019）选择性必修3 · 第3章第1节</span></p>
<p class="q-b">限制酶能识别双链DNA分子的特定核苷酸序列，并在特定的位点切割DNA。</p>
<p class="q-n">→ 翻成人话：这句话由<b>两个「特定」</b>组成——①特定<b>序列</b>（认得出，才不把整条DNA乱切）；②特定<b>位点</b>（在识别序列内部或附近固定的位置下刀）。两个「特定」少一个，限制酶就退化成一把乱刀。而「切割DNA」切的是<b>磷酸二酯键</b>——把相邻两个脱氧核苷酸之间的骨架锯断，<b>不是氢键</b>；氢键只是把两条链上的碱基拉在一起，限制酶不碰它。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · DNA连接酶<span class="q-src">人教版（2019）选择性必修3 · 第3章第1节</span></p>
<p class="q-b">DNA连接酶能将DNA片段连接起来，恢复被限制酶切开的磷酸二酯键。</p>
<p class="q-n">→ 翻成人话：「恢复」两个字是题眼——<b>限制酶切断了哪个键，连接酶就接回哪个键</b>，两者是同一处骨架的拆与装，所以都是<b>磷酸二酯键</b>。碱基对不用连接酶管：黏性末端一靠近，互补碱基自己靠<b>氢键</b>配对；但氢键配对只把两个片段「对齐」，骨架上仍留着缺口，必须由DNA连接酶补上磷酸二酯键，两个片段才算真正连成一条。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 载体<span class="q-src">人教版（2019）选择性必修3 · 第3章第1节</span></p>
<p class="q-b">基因进入受体细胞的载体必须能在受体细胞中复制并稳定保存，常用的是质粒。</p>
<p class="q-n">→ 翻成人话：「必须」后面跟着的是<b>硬条件</b>：①能在受体细胞中<b>复制</b>并<b>稳定保存</b>（否则目的基因进细胞后被降解、丢掉了）；②有<b>限制酶切点</b>（否则目的基因插不进去）；③有<b>标记基因</b>（否则筛选不出真正拿到目的基因的细胞）。再加一条常考的「对受体细胞无害」。这三条与上面两个工具合起来，就是<b>三种工具缺一不可</b>：只切不接，片段散着；只接不运，基因进不了细胞。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>工具</th><th>干什么</th><th>动的部位 / 关键条件</th><th>缺了会怎样</th></tr></thead>
<tbody>
<tr><td>限制酶（限制性内切核酸酶）</td><td>识别双链DNA的特定核苷酸序列，在特定位点切割DNA</td><td><b>磷酸二酯键</b>（不是氢键）</td><td>拿不到目的基因，DNA切不开</td></tr>
<tr><td>DNA连接酶</td><td>把两个DNA片段连接起来</td><td><b>磷酸二酯键</b>（不是碱基对）</td><td>片段对得上却接不上，重组DNA分子不成形</td></tr>
<tr><td>载体（常用质粒）</td><td>携带目的基因进入受体细胞</td><td>能复制并稳定保存 + 有切点 + 有标记基因</td><td>目的基因进不去、留不住、也筛不出</td></tr>
<tr class="key"><td>三者的关系</td><td>切 → 接 → 运，构成一个完整流程</td><td><b>三种工具缺一不可</b></td><td>少任何一个，重组DNA技术都做不成</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只高亮最后一行：考试问「三种工具分别是什么、各起什么作用」，答案必须凑满三个名字（限制酶、DNA连接酶、载体），只写「限制酶」一定扣分。口诀：<b>切得开、接得上、运得进</b>。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 限制酶切点密度与工具分工<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">EcoRI 识别 GAATTC 这 6 个碱基，并在 G 与 A 之间切割。请回答：(1) 为什么实验室常用识别 6 个碱基的限制酶，而很少用识别 4 个碱基的？(2) 若某基因组大小为 1 Mb，按随机序列估算，EcoRI 的切点约有多少个？识别 4 个碱基的酶呢？(3) 切割产生的黏性末端如何连回载体？这一过程用到哪些工具？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性：先找「谁决定切点密度」</p>
<p class="s-b">切点密度只由识别序列的长度 n 决定：识别序列越长，特定序列在随机DNA中出现的概率越小，切点越稀。</p>
<p class="s-k">用到：限制酶识别特定核苷酸序列 → 随机序列中某特定序列出现的概率 = (1/4)ⁿ。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 算 6 碱基酶的平均间距</p>
<p class="s-b">n=6 时，平均每 <span class="gx-fml">4⁶ = 4096</span> 个碱基出现一个切点，即片段平均长约 4096 bp。</p>
<p class="s-k">用到：<span class="gx-fml">4ⁿ</span>，n 为识别序列的碱基对数。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 换算到 1 Mb 基因组</p>
<p class="s-b">1 Mb = 10⁶ bp，切点数 <span class="gx-fml">= 10⁶ / 4096 ≈ 244</span> 个，片段长度在几百到几千 bp 量级，正好可以操作、也可以跑电泳分离。</p>
<p class="s-k">用到：切点数 = 基因组长度 ÷ 平均间距。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 对照组：换成 4 碱基酶</p>
<p class="s-b">n=4 时平均每 <span class="gx-fml">4⁴ = 256</span> 个碱基就有一个切点，1 Mb 中约 <span class="gx-fml">10⁶ / 256 ≈ 3906</span> 个切点，DNA 被切成无数碎片，目的基因很难完整保留。</p>
<p class="s-k">用到：识别序列越短，切点越密，片段越碎。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口到「怎么连、用什么连」</p>
<p class="s-b">目的基因与载体用同一种限制酶切割，产生相同的黏性末端，靠碱基互补配对（氢键）对齐；再由 DNA连接酶在缺口处形成磷酸二酯键，拼成重组DNA分子；最后靠载体把它运进受体细胞。</p>
<p class="s-k">用到：三种工具缺一不可——限制酶切、DNA连接酶接、载体运。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">(1) 限制酶识别的序列越长，该特定序列在随机DNA中出现的概率越低（每 4ⁿ 个碱基才出现一次），切点越少、片段越长。识别 6 个碱基的酶切点密度适中，既能把DNA切成可操作的片段，又不会把目的基因切碎；识别 4 个碱基的酶切点过密（平均每 256 bp 一个），DNA 会被切成大量碎片，目的基因难以完整获得。<br>
(2) EcoRI：4⁶ = 4096，1 Mb 中切点约 10⁶ ÷ 4096 ≈ 244 个；识别 4 个碱基的酶：4⁴ = 256，切点约 10⁶ ÷ 256 ≈ 3906 个。<br>
(3) 用同一种限制酶切割目的基因与质粒，产生相同的黏性末端，二者按碱基互补配对原则靠氢键对齐；再由 DNA连接酶恢复（形成）磷酸二酯键，得到重组DNA分子；由质粒（载体）携带目的基因进入受体细胞。全过程需要限制酶、DNA连接酶、载体三种工具，缺一不可。</p>
</div>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「重组DNA技术的三种工具到底是哪三个？各干什么？」</p>
<p class="a">限制酶（限制性内切核酸酶）：识别双链DNA的特定核苷酸序列，在特定位点切割DNA；DNA连接酶：把DNA片段连接起来；载体（常用质粒）：携带目的基因进入受体细胞。<b>三种工具缺一不可</b>——只切不接，片段散着；只接不运，基因进不了细胞。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="三种工具：切、接、运">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<rect x="20" y="34" width="60" height="52" rx="6" fill="#eaf5ef" stroke="#7cc6a3"/>
<rect x="90" y="34" width="60" height="52" rx="6" fill="#eaf1f7" stroke="#8fb6cf"/>
<rect x="160" y="34" width="60" height="52" rx="6" fill="#fdf6e7" stroke="#e0b46a"/>
<text x="50" y="56" text-anchor="middle" font-size="12" fill="#1f6b4c">切</text>
<text x="120" y="56" text-anchor="middle" font-size="12" fill="#1f5c80">接</text>
<text x="190" y="56" text-anchor="middle" font-size="12" fill="#8a5a12">运</text>
<text x="50" y="76" text-anchor="middle" font-size="8" fill="#3a3a35">限制酶</text>
<text x="120" y="76" text-anchor="middle" font-size="8" fill="#3a3a35">连接酶</text>
<text x="190" y="76" text-anchor="middle" font-size="8" fill="#3a3a35">载体</text>
<text x="120" y="106" text-anchor="middle" font-size="8" fill="#6b7580">缺一不可</text>
</svg>
</div>
<div class="qac">
<p class="q">「限制酶切割DNA，断的是氢键吗？」</p>
<p class="a">不是。<b>限制酶切断的是磷酸二酯键</b>，也就是相邻两个脱氧核苷酸之间的骨架；氢键只是把两条链上的互补碱基拉在一起，限制酶不作用于氢键（解旋酶才作用于氢键）。答题必须写「磷酸二酯键」四个字。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="限制酶切断磷酸二酯键">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<path d="M22 52 L150 52" stroke="#5d7f96" stroke-width="6" stroke-linecap="round"/>
<path d="M162 52 L218 52" stroke="#5d7f96" stroke-width="6" stroke-linecap="round"/>
<path d="M22 74 L150 74" stroke="#5d7f96" stroke-width="6" stroke-linecap="round"/>
<path d="M162 74 L218 74" stroke="#5d7f96" stroke-width="6" stroke-linecap="round"/>
<path d="M156 44 L156 84" stroke="#b8402f" stroke-width="2" stroke-dasharray="3 3"/>
<text x="156" y="34" text-anchor="middle" font-size="8" fill="#b8402f">切这里</text>
<text x="120" y="102" text-anchor="middle" font-size="8.6" fill="#1f6b4c">磷酸二酯键断开，不是氢键</text>
</svg>
</div>
<div class="qac">
<p class="q">「DNA连接酶连的是碱基对还是磷酸二酯键？」</p>
<p class="a">连接的是<b>磷酸二酯键</b>。两个黏性末端靠近时，互补碱基自己靠氢键配对，这一步不需要连接酶；但骨架上还留着缺口，必须由<b>DNA连接酶形成磷酸二酯键</b>，两个片段才真正连成一条。所以答案里写「连接碱基对」一律算错。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="连接酶在缺口处形成磷酸二酯键">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<path d="M24 58 L104 58" stroke="#5d7f96" stroke-width="6" stroke-linecap="round"/>
<path d="M120 58 L216 58" stroke="#5d7f96" stroke-width="6" stroke-linecap="round"/>
<circle cx="112" cy="58" r="8" fill="#ffffff" stroke="#b8402f" stroke-width="2"/>
<path d="M112 40 L112 30" stroke="#7cc6a3" stroke-width="1.6"/>
<text x="112" y="24" text-anchor="middle" font-size="8.4" fill="#1f6b4c">连接酶</text>
<text x="120" y="94" text-anchor="middle" font-size="8.4" fill="#3a3a35">缺口 → 补成磷酸二酯键</text>
</svg>
</div>
<div class="qac">
<p class="q">「当载体的质粒需要满足哪些条件？」</p>
<p class="a">①能<b>在受体细胞中复制并稳定保存</b>（要有复制原点）；②有<b>限制酶切点</b>，供目的基因插入；③有<b>标记基因</b>，便于筛选含重组DNA分子的细胞；④对受体细胞无害。四个条件按顺序写全，只写「能复制」会失分。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="质粒载体的条件">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<circle cx="72" cy="66" r="34" fill="none" stroke="#9fb0bd" stroke-width="8"/>
<circle cx="72" cy="32" r="4.5" fill="#ffffff" stroke="#b8402f" stroke-width="2"/>
<circle cx="104" cy="80" r="4.5" fill="#ffffff" stroke="#b8402f" stroke-width="2"/>
<circle cx="44" cy="86" r="4.5" fill="#ffffff" stroke="#b8402f" stroke-width="2"/>
<text x="122" y="44" font-size="8" fill="#1f5c80">① 复制原点</text>
<text x="122" y="62" font-size="8" fill="#1f6b4c">② 标记基因</text>
<text x="122" y="80" font-size="8" fill="#8a5a12">③ 限制酶切点</text>
<text x="122" y="98" font-size="8" fill="#6b7580">④ 对细胞无害</text>
</svg>
</div>
<div class="qac">
<p class="q">「黏性末端为什么能互补配对？」</p>
<p class="a">因为限制酶在两条链上的<b>切口错开</b>，切完露出几个碱基的单链突出端；两个来源相同的黏性末端，突出端的碱基正好按<b>碱基互补配对原则</b>（A—T、G—C）对应，所以能通过<b>氢键</b>配对对齐。注意：配对靠氢键，接上靠连接酶形成的磷酸二酯键，两件事不能混。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="黏性末端互补配对">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<rect x="26" y="42" width="70" height="24" rx="4" fill="#eaf5ef" stroke="#7cc6a3"/>
<rect x="144" y="66" width="70" height="24" rx="4" fill="#eaf1f7" stroke="#8fb6cf"/>
<text x="61" y="58" text-anchor="middle" font-size="9" fill="#1f6b4c">A A T T</text>
<text x="179" y="82" text-anchor="middle" font-size="9" fill="#1f5c80">T T A A</text>
<path d="M96 54 L144 72" stroke="#b8c9d6" stroke-width="1.4" stroke-dasharray="3 2"/>
<text x="120" y="34" text-anchor="middle" font-size="8" fill="#6b7580">氢键配对</text>
<text x="120" y="108" text-anchor="middle" font-size="8" fill="#3a3a35">同一种酶切 → 末端相同 → 能配上</text>
</svg>
</div>
<div class="qac">
<p class="q">「既然识别序列越短切点越多，为什么不用识别 4 个碱基的酶？」</p>
<p class="a">因为切点太密。n=4 时平均每 <span class="gx-fml">4⁴ = 256</span> 个碱基就有一个切点，1 Mb 基因组约有 3906 个切点，DNA 被切成大量碎片，<b>目的基因容易被切断、难以完整回收</b>。常用 n=6 的酶（平均每 <span class="gx-fml">4⁶ = 4096</span> bp 一个切点），片段长度适中，既切得开又切不碎。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="4碱基酶与6碱基酶切点密度对比">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="24" y="40" font-size="8" fill="#3a3a35">n=4</text>
<path d="M58 36 L216 36" stroke="#b8402f" stroke-width="4" stroke-dasharray="2 8"/>
<text x="24" y="70" font-size="8" fill="#3a3a35">n=6</text>
<path d="M58 66 L216 66" stroke="#7cc6a3" stroke-width="4" stroke-dasharray="2 60"/>
<text x="24" y="100" font-size="8" fill="#b8402f">256 bp／刀 → 太碎</text>
<text x="24" y="114" font-size="8" fill="#1f6b4c">4096 bp／刀 → 合适</text>
</svg>
</div>
</div>
<p class="gx-note">这六问其实是同一件事：<b>认清每个工具动的是哪个部位、提供的是什么条件</b>。切在磷酸二酯键、接在磷酸二酯键、运靠三个条件的质粒——把这三句背成一组，六问全通。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 限制酶能切断DNA分子中的氢键，使两条链分开。</p>
<p class="er-v">✓ 限制酶识别双链DNA的特定核苷酸序列，并在特定位点切割DNA，切断的是磷酸二酯键。</p>
<p class="er-w">错在哪：把「切开DNA」想成「解开双链」。破坏氢键、让双链分开的是解旋酶；限制酶锯的是骨架上的磷酸二酯键。</p>
</div>
<div class="er">
<p class="er-x">✗ DNA连接酶能把两个片段之间的碱基对连接起来。</p>
<p class="er-v">✓ DNA连接酶能将DNA片段连接起来，恢复被限制酶切开的磷酸二酯键。</p>
<p class="er-w">错在哪：碱基对之间是氢键，靠互补配对自动形成，不需要酶；连接酶补的是骨架缺口，形成磷酸二酯键。</p>
</div>
<div class="er">
<p class="er-x">✗ 载体只要能携带目的基因进入受体细胞就行，不需要复制原点。</p>
<p class="er-v">✓ 载体必须能在受体细胞中复制并稳定保存，此外还要有限制酶切点和标记基因。</p>
<p class="er-w">错在哪：不能复制就会被降解、丢失，目的基因留不住；没有标记基因则筛不出成功导入的细胞。</p>
</div>
<div class="er">
<p class="er-x">✗ 有了限制酶和DNA连接酶，就能完成重组DNA分子的构建。</p>
<p class="er-v">✓ 构建重组DNA分子需要限制酶、DNA连接酶和载体，三种工具缺一不可。</p>
<p class="er-w">错在哪：漏掉载体。切、接之后还要有能复制、能筛选的运载工具，目的基因才能进入并留在受体细胞中。</p>
</div>
<div class="er">
<p class="er-x">✗ 限制酶识别的序列越短越好，切点越多越容易操作。</p>
<p class="er-v">✓ 识别序列过短会使切点过密，DNA被切成大量碎片，目的基因难以完整获得；常用识别6个碱基的酶。</p>
<p class="er-w">错在哪：把「切得开」当成「切得碎」。n=4 时平均每 256 bp 一刀，1 Mb 中约 3906 个切点，反而做不成。</p>
</div>
<div class="er">
<p class="er-x">✗ 黏性末端之间不需要互补，只要有连接酶就能接上。</p>
<p class="er-v">✓ 黏性末端按碱基互补配对原则通过氢键对齐，再由DNA连接酶形成磷酸二酯键。</p>
<p class="er-w">错在哪：连接酶只封骨架缺口，不管碱基是否配对；末端不互补就贴不齐，缺口位置对不上，接不起来。</p>
</div>
<div class="er">
<p class="er-x">✗ DNA连接酶和DNA聚合酶是一回事，都能把DNA片段连起来。</p>
<p class="er-v">✓ DNA连接酶连接两个DNA片段之间的缺口；DNA聚合酶把单个脱氧核苷酸逐个加到已有的链上。</p>
<p class="er-w">错在哪：底物不同。连接酶要「两段现成的片段」，聚合酶要「模板 + 单个脱氧核苷酸」，功能不能互换。</p>
</div>
</div>
</section>

<script>
document.addEventListener("DOMContentLoaded", function () {
"use strict";
var NS = "http://www.w3.org/2000/svg";
var stage = document.getElementById("gxStage");
var gA = document.getElementById("gxA"), gB = document.getElementById("gxB");
var sl = document.getElementById("gxSl");
if (!stage || !gA || !gB || !sl || !window.AutoPilot) return;
var va = document.getElementById("gxVa"), vb = document.getElementById("gxVb"), vc = document.getElementById("gxVc");
var vs = document.getElementById("gxVs"), vsn = document.getElementById("gxVsn"), stBox = document.getElementById("gxStBox");
var SUP = { 4: "⁴", 5: "⁵", 6: "⁶", 7: "⁷", 8: "⁸" };
var G = null, L = null;

function fmt(x) { return String(Math.round(x)).replace(/\B(?=(\d{3})+$)/g, ","); }

/* 唯一真值：识别序列长度 n → 平均间距 gap、1 Mb 切点数 cuts */
function calc(v) {
  var n = Math.round(+v);
  if (!isFinite(n)) n = 6;
  if (n < 4) n = 4;
  if (n > 8) n = 8;
  var gap = Math.pow(4, n);
  var cuts = 1000000 / gap;
  var s, tone, note;
  if (n === 4) { s = "太密"; tone = "#b8402f"; note = "切点太密，基因组被切碎"; }
  else if (n === 5) { s = "偏密"; tone = "#b8791f"; note = "片段偏短，目的基因易被切断"; }
  else if (n === 6) { s = "合适"; tone = "#2f8a5b"; note = "常用酶的量级，片段约 4 kb"; }
  else if (n === 7) { s = "偏稀"; tone = "#b8791f"; note = "可操作，但可用的酶不多"; }
  else { s = "太稀"; tone = "#b8402f"; note = "切点太稀，难切成可操作片段"; }
  return { n: n, gap: gap, cuts: cuts, short: s, tone: tone, note: note };
}

function layout() {
  var w = stage.clientWidth || 880;
  return w >= 640 ? { m: "W", W: 880, H: 470 } : { m: "N", W: 360, H: 700 };
}

function geom() {
  if (L.m === "W") {
    return { m: "W", title1: [48, 44], bar: { x: 48, y: 64, w: 784, h: 38 }, tip: [48, 124],
      avg: [48, 152], recTitle: [48, 216], recX: 48, recY: 234, bw: 44, bh: 38, recNote: [48, 300],
      chTitle: [60, 322], chX: 60, chBase: 420, chW: 56, chGap: 24, chMax: 80, fs: 1 };
  }
  return { m: "N", title1: [24, 40], bar: { x: 24, y: 56, w: 312, h: 30 }, tip: [24, 108],
    avg: [24, 134], avg2: [24, 158], recTitle: [24, 200], recX: 24, recY: 218, bw: 36, bh: 34,
    recNote: [24, 282], recNote2: [24, 302], chTitle: [30, 362], chX: 30, chBase: 470,
    chW: 44, chGap: 16, chMax: 92, fs: 0.92 };
}

function el(p, t, a, txt) {
  var e = document.createElementNS(NS, t), k;
  for (k in a) e.setAttribute(k, a[k]);
  if (txt != null) e.textContent = txt;
  p.appendChild(e);
  return e;
}
function clear(g) { while (g.firstChild) g.removeChild(g.firstChild); }
function tx(g, x, y, s, size, fill, weight, anchor) {
  var e = el(g, "text", { x: x, y: y, "font-size": size || 10, fill: fill || "#3a3a35" }, s);
  if (weight) e.setAttribute("font-weight", weight);
  if (anchor) e.setAttribute("text-anchor", anchor);
  return e;
}

function render() {
  if (!G) { L = layout(); G = geom(); }
  var r = calc(sl.value), n = r.n, i, x, y, h, k, c;
  stage.setAttribute("viewBox", "0 0 " + L.W + " " + L.H);
  clear(gA); clear(gB);

  /* ---- ① 基因组切点条 ---- */
  var b = G.bar;
  el(gA, "rect", { x: b.x, y: b.y, width: b.w, height: b.h, rx: 6, fill: "#eef4f8", stroke: "#cfdde7" });
  var drawn = Math.max(1, Math.min(Math.round(r.cuts), 120)), sw = b.w / drawn;
  for (i = 0; i < drawn; i++) {
    x = b.x + i * sw + sw / 2;
    el(gA, "line", { x1: x, y1: b.y + 2, x2: x, y2: b.y + b.h - 2, stroke: "#b8402f",
      "stroke-width": drawn > 70 ? 0.9 : 1.9, opacity: 0.85 });
  }
  tx(gA, G.title1[0], G.title1[1], "① 1 Mb 基因组：红线就是切点", 11.5, "#151a21", 700);
  tx(gA, G.tip[0], G.tip[1], "图上按比例缩略；切点越密，片段越短", 9, "#6b7580");
  tx(gA, G.avg[0], G.avg[1], "平均每 " + fmt(r.gap) + " bp 一个切点 → 片段长约 " + fmt(r.gap) + " bp", 11, "#1f6b4c", 700);
  if (G.avg2) tx(gA, G.avg2[0], G.avg2[1], "1 Mb 中约 " + fmt(r.cuts) + " 个切点", 10, "#3a3a35", 700);

  /* ---- ② 识别序列 ---- */
  tx(gA, G.recTitle[0], G.recTitle[1], "② 识别序列有多长：n = " + n + " bp", 11.5, "#151a21", 700);
  var seq = "GAATTCGA", bw = G.bw;
  for (i = 0; i < n; i++) {
    x = G.recX + i * bw;
    el(gA, "rect", { x: x + 2, y: G.recY, width: bw - 4, height: G.bh, rx: 4, fill: "#eaf5ef", stroke: "#7cc6a3" });
    tx(gA, x + bw / 2, G.recY + G.bh * 0.68, seq.charAt(i), 11, "#1f6b4c", 700, "middle");
  }
  tx(gA, G.recNote[0], G.recNote[1], "该特定序列在随机 DNA 中平均每 4" + SUP[n] + " = " + fmt(r.gap) + " bp 出现一次", 9.2);
  if (G.recNote2) tx(gA, G.recNote2[0], G.recNote2[1], "n 每加 1，切点密度降到原来的 1/4", 9.2, "#6b7580");

  /* ---- ③ 对数柱状图：n=4…8 的切点数 ---- */
  var base = G.chBase, maxH = G.chMax;
  tx(gB, G.chTitle[0], G.chTitle[1], "③ 1 Mb 中的切点数（对数刻度）", 10.4 * G.fs + 0.6, "#151a21", 700);
  for (i = 0; i < 5; i++) {
    k = 4 + i; c = calc(k).cuts;
    h = maxH * (Math.log10(c) - 1) / 2.6; if (h < 8) h = 8;
    x = G.chX + i * (G.chW + G.chGap);
    var on = (k === n);
    el(gB, "rect", { x: x, y: base - h, width: G.chW, height: h, rx: 4, fill: on ? "#2f8a5b" : "#cfe0ee" });
    tx(gB, x + G.chW / 2, base - h - 6, fmt(c), 8.6 * G.fs + 0.6, on ? "#2f8a5b" : "#6b7580", on ? 700 : 400, "middle");
    tx(gB, x + G.chW / 2, base + 16, "n=" + k, 9, on ? "#151a21" : "#6b7580", on ? 700 : 400, "middle");
  }
  el(gB, "line", { x1: G.chX - 6, y1: base, x2: G.chX + 5 * (G.chW + G.chGap) - G.chGap + 6, y2: base, stroke: "#cfdde7" });

  /* ---- 数值卡 ---- */
  va.textContent = n;
  vb.textContent = fmt(r.gap);
  vc.textContent = "≈ " + fmt(r.cuts);
  vs.textContent = r.short;
  vs.style.color = r.tone;
  vsn.textContent = r.note;
  if (stBox) stBox.style.borderLeftColor = r.tone;
}

/* ---- 自动演示 ---- */
function setMode(on) {
  var auto = !(on === false || on === "manual" || on === "paused" || on === "off");
  var txt = document.getElementById("gxApTxt");
  if (txt) txt.textContent = auto ? "自动演示中" : "手动拖动";
  var box = document.getElementById("gxAp");
  if (box) { if (auto) box.classList.add("is-auto"); else box.classList.remove("is-auto"); }
}

var LOOP = [{ t: 0, v: 4 }, { t: 1.2, v: 4 }, { t: 4, v: 6 }, { t: 6.5, v: 6 }, { t: 9, v: 8 }, { t: 11, v: 7 }, { t: 13, v: 4 }];

var ap = window.AutoPilot.create({
  mount: stage, follow: sl, loop: LOOP, keys: [4, 6, 7, 8],
  value: 6, min: 4, max: 8, step: 1, idle: 5000,
  onChange: function (v) { sl.value = v; render(); },
  onMode: setMode
});

sl.addEventListener("input", function () { render(); });
window.addEventListener("resize", function () { G = null; render(); });

window.__ap = ap;
window.__model = window.__bio = { calc: calc, cases: [
  { v: 4, eq: { gap: 256 } },
  { v: 6, eq: { gap: 4096 } },
  { v: 8, eq: { gap: 65536 } }
] };

render();
});
</script>
