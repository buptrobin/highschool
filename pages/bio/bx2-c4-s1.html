<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 转录<span class="q-src">人教版（2019）必修2 · 第4章第1节</span></p>
<p class="q-b">以 DNA 的一条链为模板，按碱基互补配对原则，合成 RNA 的过程叫作转录。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个条件</b>组成（① 模板是 DNA 的一条链，不是两条；② 原料是 4 种核糖核苷酸，A 配 U、T 配 A、G 配 C、C 配 G；③ 产物是 RNA）。把模板写成「DNA 的两条链」，这一分直接没有。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 翻译<span class="q-src">人教版（2019）必修2 · 第4章第1节</span></p>
<p class="q-b">以 mRNA 为模板，在核糖体上合成具有一定氨基酸顺序的蛋白质的过程叫作翻译。</p>
<p class="q-n">→ 三个条件：① 模板是 mRNA 而不是 DNA；② 场所是核糖体而不是细胞核；③ 原料是氨基酸，由 tRNA 一次一个搬过去。少写「核糖体」，就少了场所分。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 密码子与反密码子<span class="q-src">人教版（2019）必修2 · 第4章第1节</span></p>
<p class="q-b">mRNA 上决定 1 个氨基酸的 3 个相邻碱基叫作密码子；tRNA 上能与密码子互补配对的 3 个碱基叫作反密码子。</p>
<p class="q-n">→ 三个条件：① 位置——密码子在 mRNA 上、反密码子在 tRNA 上，不能写反；② 数量——3 个相邻碱基决定 1 个氨基酸；③ 种类——密码子共 64 种，其中 3 种是终止密码子、不编码氨基酸。位置写反是本节最高频的失分点。</p>
</div>

<tr class="key"><td>模板</td><td>DNA 的一条链（另一条链不转录）</td><td>mRNA（3 个相邻碱基读成 1 个密码子）</td></tr>

<h2><span class="sn">04</span>一道题走一遍</h2>

<div class="gx-ex">
<p class="ex-t">例题 · mRNA 碱基数 ↔ 氨基酸数 ↔ 脱水数<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">某 mRNA 上有 300 个碱基，翻译成一条肽链。回答：（1）这条肽链最多含多少个氨基酸？（2）最多脱去多少分子水？（3）至少需要多少个 tRNA 参与搬运？注意「最多」两个字。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题：先找桥</p>
<p class="s-b">题目给的是 mRNA 碱基数 300，问的是肽链。中间只有一座桥：<b>3 个相邻碱基 = 1 个密码子 = 1 个氨基酸</b>。先把这座桥写出来，再动笔算。</p>
<p class="s-k">用到：密码子的定义——mRNA 上决定 1 个氨基酸的 3 个相邻碱基。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 碱基数换成密码子数</p>
<p class="s-b">300 ÷ 3 = 100，所以这条 mRNA 最多有 100 个密码子。注意这是「密码子个数」，不是「氨基酸个数」——还差一步。</p>
<p class="s-k">用到：3 个碱基一组，不重叠、不跳读。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 说清「最多」的陷阱</p>
<p class="s-b">密码子共 64 种，其中 3 种是终止密码子、不编码氨基酸。所以只有全部 100 个密码子都编码氨基酸时才是 100 个；真实 mRNA 末端有终止密码子，肽链实际少于 100 个。题目问「最多」，答 100。</p>
<p class="s-k">用到：64 种密码子中 3 种是终止密码子，不编码氨基酸。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 脱水数用 n − 1</p>
<p class="s-b">100 个氨基酸连成 1 条肽链，肽键数 = 脱去水分子数 = 100 − 1 = 99。写成 100 就是把「第一个氨基酸不用脱水」漏掉了。</p>
<p class="s-k">用到：肽键数 = 脱去水分子数 = 氨基酸数 − 肽链数。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · tRNA 次数 = 氨基酸数</p>
<p class="s-b">1 个 tRNA 一次只搬 1 个氨基酸，所以搬运次数等于氨基酸数 100。mRNA 上 300 个碱基对应的 100 个密码子，正是由 100 个 tRNA 的反密码子逐个配对读出来的。</p>
<p class="s-k">用到：反密码子在 tRNA 上，与 mRNA 上的密码子互补配对。</p>
</li>
</ol>

<p class="ans-b">（1）最多 100 个氨基酸：300 ÷ 3 = 100 个密码子，1 个密码子决定 1 个氨基酸。（2）最多脱去 99 分子水：1 条肽链时脱去水分子数 = 氨基酸数 − 1 = 100 − 1 = 99。（3）至少需要 100 个 tRNA：1 个 tRNA 只搬运 1 个氨基酸，搬运次数等于氨基酸数。补充：64 种密码子中 3 种是终止密码子、不编码氨基酸，故实际肽链少于 100 个氨基酸。</p>

<p class="q">一个 mRNA 上能结合几个核糖体？</p>
<p class="a"><b>多个</b>。一个 mRNA 上可以同时结合多个核糖体（多聚核糖体），各核糖体沿同一条 mRNA 移动，因此短时间内合成出<b>多条氨基酸序列相同</b>的肽链，大大提高翻译效率。</p>

<p class="q">转录和翻译分别在哪儿进行？</p>
<p class="a">转录主要在<b>细胞核</b>（线粒体、叶绿体里也能），翻译在<b>细胞质的核糖体</b>上。真核细胞里两者一个在核内、一个在核外，靠 mRNA 把信息带出去。</p>

<p class="gx-note">六问其实是同一件事：先问「模板是谁、在哪」，再问「按什么单位读、读多少个」。模板、位置、单位这三样定死，翻译相关的计算题就只剩乘除法和 −1。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 转录时 DNA 的两条链都作为模板</p>
<p class="er-v">✓ 转录的模板是 DNA 的一条链，另一条链不转录</p>
<p class="er-w">错在哪：DNA 只解旋被转录的那一段，RNA 聚合酶只贴着一条链移动；写成两条链，后面的碱基配对全跟着错。</p>
</div>
<div class="er">
<p class="er-x">✗ 密码子在 tRNA 上，反密码子在 mRNA 上</p>
<p class="er-v">✓ 密码子在 mRNA 上、反密码子在 tRNA 上，两者互补配对</p>
<p class="er-w">错在哪：位置一写反，配对方向也反了。记法：mRNA 是被读的那本书，密码子是书上的字；tRNA 是读者的手指。</p>
</div>
<div class="er">
<p class="er-x">✗ 64 种密码子都编码氨基酸</p>
<p class="er-v">✓ 64 种密码子中 61 种编码氨基酸，3 种是终止密码子、不编码氨基酸</p>
<p class="er-w">错在哪：漏掉终止密码子。凡是问「最多含多少个氨基酸」，答完必须补一句「实际少于这个数」。</p>
</div>
<div class="er">
<p class="er-x">✗ 1 个氨基酸由 1 个碱基决定</p>
<p class="er-v">✓ 1 个氨基酸由 mRNA 上 3 个相邻碱基（1 个密码子）决定</p>
<p class="er-w">错在哪：把「3 个碱基」记成「3 种碱基」或「1 个碱基」。数字 3 是这一节的乘除号来源。</p>
</div>
<div class="er">
<p class="er-x">✗ 翻译在细胞核中进行</p>
<p class="er-v">✓ 转录主要在细胞核，翻译在细胞质的核糖体上进行</p>
<p class="er-w">错在哪：把两个场所对调。核糖体在细胞质里，mRNA 必须先从核里出来才能被翻译。</p>
</div>
<div class="er">
<p class="er-x">✗ 100 个氨基酸脱水缩合，脱去 100 分子水</p>
<p class="er-v">✓ 100 个氨基酸连成 1 条肽链，脱去 99 分子水（n − 1）</p>
<p class="er-w">错在哪：第一个氨基酸的一端不参与缩合。肽键数 = 脱水数 = 氨基酸数 − 肽链数，1 条链时才等于 n − 1。</p>
</div>
<div class="er">
<p class="er-x">✗ 一个 mRNA 只能结合一个核糖体</p>
<p class="er-v">✓ 一个 mRNA 可同时结合多个核糖体，合成多条氨基酸序列相同的肽链</p>
<p class="er-w">错在哪：把「多条肽链」误当成「多种肽链」。模板是同一条 mRNA，所以肽链的氨基酸序列相同，只是合成得快。</p>
</div>
