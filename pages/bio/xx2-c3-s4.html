<p class="gx-claim">一句话说清本节最该记住的判断：<b>光、声归物理，信息素归化学，求偶舞蹈归行为</b>；信息传递<b>双向</b>，还能<b>调节种间关系</b>。</p>
<div class="gx-meta">
<span><i></i>人教版（2019）选择性必修2 第3章第4节</span>
<span><i></i>高二 · 生态系统及其稳定性</span>

<p class="gx-lede">这一节是第 3 章的收尾：能量流动、物质循环讲「物质和能量怎么走」，信息传递讲「生物之间怎么打招呼」。三者并列，但方向完全不同——能量单向递减，物质循环往复，信息往往双向。最容易错的一件事：把「光照影响鸡产蛋」当成化学信息，或者顺口说「信息从捕食者流向猎物，是单向的」。这一页把三类信息的判据、双向性、调节种间关系三件事拆开讲。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 三类信息<span class="q-src">人教版（2019）选择性必修2 · 第3章第4节</span></p>
<p class="q-b">生态系统中的光、声、温度、湿度、磁力等，通过物理过程传递的信息，称为物理信息。生物在生命活动过程中产生的、可以传递信息的化学物质，称为化学信息；动物的特殊行为称为行为信息。</p>
<p class="q-n">→ 翻成人话：分类只按<b>来源</b>这一个条件走。① 来自物理过程（光、声、温度、湿度、磁力）→ 物理信息；② 来自生物体产生并释放的化学物质 → 化学信息；③ 来自动物的特殊动作 → 行为信息。三个条件少一个就会归错类：光、声再「有用」也是物理信息；性外激素再「看不见」也是化学信息；求偶舞蹈再「好看」也是行为信息。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 信息传递的作用<span class="q-src">人教版（2019）选择性必修2 · 第3章第4节</span></p>
<p class="q-b">信息传递在生态系统中能维持生命活动的正常进行，影响种群的繁衍，调节种间关系。</p>
<p class="q-n">→ 翻成人话：作用一共<b>三条</b>，答题要三条都写全。① 维持生命活动正常进行（个体层面，如日照长短影响开花、候鸟迁徙靠磁场定向）；② 影响种群繁衍（种群层面，如性外激素吸引同种异性）；③ 调节种间关系（群落层面，如捕食者与被捕食者互相传递信息，使双方种群数量相对稳定）。少写第三条，是最常见的丢分方式。</p>
</div>

<div class="gx-quote">
<p class="q-t">教材归纳 · 和能量流动比方向<span class="q-src">人教版（2019）选择性必修2 · 第3章第4节</span></p>
<p class="q-b">能量流动是单向的、逐级递减的；物质循环是全球性的、循环往复的；信息传递往往是双向的。</p>
<p class="q-n">→ 翻成人话：这里的关键词是「<b>双向</b>」。信息传递不是从 A 单方向流到 B：捕食者能感知猎物的气味，猎物也能感知捕食者的声音，两条通道同时存在。所以「信息传递是单向的」这句话，无论放在选择题还是简答题里都是错的；它也是本节与能量流动最容易被放在一起比较的一处。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>物理信息</th><th>化学信息</th><th>行为信息</th></tr></thead>
<tbody>
<tr><td>课本关键词</td><td>通过物理过程传递的信息</td><td>生物体产生的、可传递信息的化学物质</td><td>动物的特殊行为</td></tr>
<tr><td>典型例子</td><td>光照、声音、温度、湿度、磁力</td><td>性外激素、告警信息素、生物碱</td><td>蜜蜂跳舞、孔雀开屏、求偶炫耀</td></tr>
<tr class="key"><td>判据（来源）</td><td>来自无机环境或物理过程，形式是波、场</td><td>来自生物体分泌，形式是分子</td><td>来自动物身体的动作，形式是姿态、轨迹</td></tr>
<tr><td>常见错认</td><td>把「光照影响产蛋」当成化学信息</td><td>把「性外激素」当成行为信息</td><td>把「求偶舞蹈」当成物理信息</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只高亮一行：判据看「来源」。考场上先问一句「这个信息是从哪来的」——从物理过程来的是物理信息，从生物体分泌的化学物质来的是化学信息，从动物动作来的是行为信息。光、声属物理信息，信息素属化学信息，求偶舞蹈属行为信息，这三句要能脱口而出。</p>
</section>

<p class="ex-q">农业生产中，人们常在田间放置性外激素诱捕器来防治某种害虫。<br>（1）性外激素属于哪一类信息？请说明依据。<br>（2）与喷洒广谱杀虫剂相比，这种方法有哪些优点？请写出两点。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题：抓两个词</p>
<p class="s-b">「性外激素」是物质名，不是动作、不是光声；「诱捕」是降低种群密度的手段，不是直接毒杀。第（1）问考分类判据，第（2）问考应用优点，两问不能混答。</p>
<p class="s-k">用到：三类信息的判据＝来源。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 定性：归到化学信息</p>
<p class="s-b">性外激素由昆虫分泌、释放到环境中、靠分子被同种个体接收，属于「生物体产生的、可以传递信息的化学物质」，所以是化学信息。它不靠动作，排除行为信息；不靠光声，排除物理信息。</p>
<p class="s-k">用到：化学信息的定义原句。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 说清依据（第 1 问的得分点）</p>
<p class="s-b">答题要写「来源 + 传递方式」两句：由雌虫（生物体）分泌；以化学物质的形式释放到环境中，被同种雄虫的触角受体接收，从而传递信息。只写「是化学信息」不给依据分。</p>
<p class="s-k">用到：信息素＝同种个体间的化学信息。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 第 2 问：优点落到三处</p>
<p class="s-b">① 专一性强，只作用于该种害虫，不杀伤天敌和传粉昆虫；② 不污染环境，降解快、无农药残留；③ 干扰害虫正常交配，降低出生率，从而降低种群密度——注意是「降低出生率」，不是「直接把成虫毒死」。</p>
<p class="s-k">用到：信息传递影响种群繁衍。</p>

<li class="step" hidden>

<p class="s-b">别写「信息素浓度越高效果越好」——浓度过高会饱和，收益递减，还提高成本；别写「杀死害虫」——诱捕器是诱捕，不是毒杀。最后回读题目，确认两问都答到。</p>
<p class="s-k">用到：饱和曲线 + 题干动词。</p>
