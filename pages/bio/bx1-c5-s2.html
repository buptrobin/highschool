<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · ATP 的结构<span class="q-src">人教版（2019）必修1 · 第5章第2节</span></p>
<p class="q-b">ATP 是细胞内的一种高能磷酸化合物，其结构简式为 A—P~P~P，其中 A 代表腺苷，P 代表磷酸基团。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个条件</b>组成——① 它是「高能磷酸化合物」，能量存在磷酸基团之间的键里；② 简式写作 A—P~P~P，A 是腺苷（腺嘌呤 + 核糖），不是腺嘌呤；③ 三个 P 之间只有<b>两个</b>「~」。少写一个「~」或把 A 写成腺嘌呤，都是原话级别的错。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 相互转化<span class="q-src">人教版（2019）必修1 · 第5章第2节</span></p>
<p class="q-b">ATP 与 ADP 可以相互转化：ATP ⇌ ADP + Pi + 能量。</p>
<p class="q-n">→ 翻成人话：这句话有<b>两个条件</b>——① 两个方向都能走，所以教材写「相互转化」；② 每个方向都要酶催化，且伴随能量的释放或储存。注意：教材只说「相互转化」，从没说「可逆反应」。物质上方向相反，反应条件完全不同，这一点下一节图 2 会拆开。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 直接能源物质<span class="q-src">人教版（2019）必修1 · 第5章第2节</span></p>
<p class="q-b">ATP 是细胞生命活动的直接能源物质。</p>
<p class="q-n">→ 翻成人话：「直接」有<b>两个限定</b>——① 场合是细胞的生命活动（肌肉收缩、主动运输、合成代谢、神经冲动）；② 中间不再转换，ATP 水解就用。糖类、脂肪是「间接」的：必须先氧化分解，把能量转给 ATP 才能用。所以「主要能源物质」是糖类，「直接能源物质」才是 ATP。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>ATP</th><th>糖类、脂肪</th></tr></thead>
<tbody>
<tr><td>化学本质</td><td>高能磷酸化合物（A—P~P~P）</td><td>糖类、脂质</td></tr>
<tr><td>在细胞中的含量</td><td>很少，只够维持很短时间</td><td>可以大量储存（糖原、脂肪）</td></tr>
<tr><td>供能方式</td><td>水解远离 A 的高能磷酸键，即时供能</td><td>氧化分解，先把能量转给 ATP</td></tr>
<tr><td>能否大量储存</td><td>不能</td><td>能</td></tr>
<tr class="key"><td>在能量流动中的角色</td><td>能量「货币」：随身零钱，随花随挣</td><td>能量「仓库」：存折，先存后用</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只有最后一行是关键：货币 vs 仓库。背法：看到「直接」选 ATP，看到「主要」选糖类，看到「储存」选脂肪。三个词对应三种角色，混一个就丢分。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 剧烈运动与 ATP 含量<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">长跑时，肌细胞内的 ATP 被大量消耗。有人据此认为「剧烈运动时肌细胞内 ATP 的含量会大幅增加，以供应更多能量」。这个说法对吗？为什么？（4 分）</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题：先拆两个词</p>
<p class="s-b">题干混了「含量（某一时刻有多少）」和「转化速率（单位时间转化多少）」。先写下来：含量是存量，速率是周转。题目问的是含量会不会「大幅增加」。</p>
<p class="s-k">用到：存量 vs 周转，这是本题唯一的陷阱。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 调教材：ATP 含量本来就很少</p>
<p class="s-b">教材明确：ATP 在细胞内的含量很少。它不是能量仓库，不能像糖原、脂肪那样大量储存。所以「大幅增加」在事实上就站不住。</p>
<p class="s-k">用到：ATP 是高能磷酸化合物，但含量很少（图 3 的平线）。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 讲机制：消耗多少，就再生多少</p>
<p class="s-b">ATP 水解成 ADP 和 Pi 的同时释放能量；ADP 和 Pi 又在呼吸作用释放的能量推动下重新合成 ATP。转化极快，所以存量能维持在一个很低但稳定的水平。</p>
<p class="s-k">用到：ATP ⇌ ADP + Pi + 能量（两个方向、两种酶）。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 下结论：涨的是速率</p>
<p class="s-b">剧烈运动时 ATP 水解加快，同时合成也加快；增加的是 ATP 的转化速率（周转），不是 ATP 的总量。总量基本不变。</p>
<p class="s-k">用到：图 3 两条线——存量平、周转升。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 写成答题卡</p>
<p class="s-b">按「判断 → 依据 → 机制 → 结论」四句写，每句一个采分点。不写「因为 ATP 很活跃」这种没有术语的句子。</p>
<p class="s-k">用到：分点作答，术语到位。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">不对。① 细胞内 ATP 的含量很少，不能大量储存；② ATP 与 ADP 的相互转化速率极快，ATP 消耗多少就再生多少；③ 剧烈运动时增加的是 ATP 的转化速率（周转），不是 ATP 的总量，所以 ATP 含量不会大幅增加。</p>
</div>
</div>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">ATP 为什么叫「直接」能源物质？糖类、脂肪不也是能源物质吗？</p>
<p class="a">因为生命活动消耗的能量必须由 ATP 水解直接提供，<b>ATP 是唯一能直接供能的物质</b>。糖类、脂肪要先经细胞呼吸氧化分解，把能量转给 ADP 生成 ATP，属于间接供能。所以「主要能源物质」是糖类，「直接能源物质」是 ATP。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="糖类脂肪经转化生成 ATP 才能供能">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<rect x="16" y="28" width="82" height="34" rx="6" fill="#ffffff" stroke="#dbe7ef"/>
<text x="57" y="50" text-anchor="middle" font-size="9" fill="#3a3a35">糖类、脂肪</text>
<text x="110" y="52" text-anchor="middle" font-size="13" fill="#5a6472">→</text>
<rect x="120" y="28" width="62" height="34" rx="6" fill="#ffffff" stroke="#0f8a5f"/>
<text x="151" y="50" text-anchor="middle" font-size="10" font-weight="700" fill="#0f8a5f">ATP</text>
<text x="190" y="52" text-anchor="middle" font-size="13" fill="#5a6472">→</text>
<rect x="196" y="28" width="36" height="34" rx="6" fill="#ffffff" stroke="#dbe7ef"/>
<text x="214" y="49" text-anchor="middle" font-size="8" fill="#3a3a35">生命</text>
<text x="214" y="58" text-anchor="middle" font-size="8" fill="#3a3a35">活动</text>
<text x="120" y="88" text-anchor="middle" font-size="9" fill="#3a3a35">「直接」＝不用再转换</text>
<text x="120" y="106" text-anchor="middle" font-size="8.5" fill="#8a94a3">糖类、脂肪必须先氧化分解</text>
</svg>
</div>
<div class="qac">
<p class="q">ATP 与 ADP 的相互转化是可逆反应吗？物质都变回去了呀。</p>
<p class="a">不是可逆反应。虽然物质上方向相反，但<b>酶不同</b>（ATP 合成酶 / ATP 水解酶）、<b>能量来源不同</b>（合成靠呼吸作用或光合作用供能，水解释放能量）、<b>场所不同</b>（合成在细胞质基质、线粒体、叶绿体，水解在需能的部位）。可逆反应要求正逆反应在同一条件下进行。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="合成与水解的条件对比">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="26" text-anchor="middle" font-size="10" font-weight="700" fill="#151a21">ATP ⇌ ADP + Pi</text>
<text x="22" y="48" font-size="8.5" fill="#2f8a5b">合成：ATP 合成酶，需能量</text>
<text x="22" y="64" font-size="8.5" fill="#2f8a5b">场所：细胞质基质、线粒体、叶绿体</text>
<line x1="20" y1="74" x2="220" y2="74" stroke="#dde4ea" stroke-width="1"/>
<text x="22" y="92" font-size="8.5" fill="#b8791f">水解：ATP 水解酶，放能量</text>
<text x="22" y="108" font-size="8.5" fill="#b8791f">场所：需能的部位（如肌原纤维）</text>
<text x="120" y="122" text-anchor="middle" font-size="8" fill="#8a94a3">条件不同 → 不是可逆反应</text>
</svg>
</div>
<div class="qac">
<p class="q">ATP 里的「~」是什么键？为什么写两个而不是三个？</p>
<p class="a">「~」是<b>高能磷酸键</b>，一种特殊的化学键，水解时释放较多能量，不是普通化学键的简单重复。A—P~P~P 中 A 与第一个 P 之间是普通键，只有<b>P 与 P 之间</b>的 2 个键是高能磷酸键，所以只有两个「~」。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="A—P~P~P 里只有两个高能磷酸键">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="56" text-anchor="middle" font-size="18" font-weight="700" fill="#151a21">A—P~P~P</text>
<text x="120" y="88" text-anchor="middle" font-size="9" fill="#3a3a35">「~」＝高能磷酸键，共 2 个</text>
<text x="120" y="106" text-anchor="middle" font-size="8.5" fill="#8a94a3">不是 3 个，也不是普通化学键</text>
</svg>
</div>
<div class="qac">
<p class="q">细胞为什么不能像存糖原那样，存一大堆 ATP？</p>
<p class="a">因为 ATP 化学性质活跃、容易水解，且细胞对能量的需求随时变化；大量储存既占物质又难以及时调配。细胞的策略是<b>少量 + 快速周转</b>：含量很少，但 ATP 与 ADP 的转化极快，消耗多少就再生多少。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="存量很少而周转很快">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="26" text-anchor="middle" font-size="9.5" fill="#3a3a35">存量 stock：很少</text>
<rect x="36" y="36" width="168" height="12" rx="6" fill="#e8eef3"/>
<rect x="36" y="36" width="40" height="12" rx="6" fill="#2f8a5b"/>
<text x="120" y="64" text-anchor="middle" font-size="9.5" fill="#3a3a35">周转 turn：极快</text>
<rect x="36" y="74" width="168" height="12" rx="6" fill="#e8eef3"/>
<rect x="36" y="74" width="150" height="12" rx="6" fill="#b8791f"/>
<text x="120" y="104" text-anchor="middle" font-size="9" fill="#3a3a35">消耗多少就补多少</text>
</svg>
</div>
<div class="qac">
<p class="q">光反应产生的 ATP，能拿去给肌肉收缩用吗？</p>
<p class="a">不能。光反应产生的 ATP <b>只用于暗反应中 C₃ 的还原</b>（以及叶绿体内的其他耗能过程），不运出叶绿体供其他生命活动；肌肉收缩用的是细胞呼吸产生的 ATP。这是「ATP 是直接能源物质」的适用范围问题。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="光反应的 ATP 只用于暗反应">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<rect x="22" y="36" width="76" height="34" rx="6" fill="#ffffff" stroke="#dbe7ef"/>
<text x="60" y="57" text-anchor="middle" font-size="9.5" fill="#3a3a35">光反应</text>
<text x="108" y="59" text-anchor="middle" font-size="13" fill="#5a6472">→</text>
<rect x="120" y="36" width="84" height="34" rx="6" fill="#ffffff" stroke="#dbe7ef"/>
<text x="162" y="57" text-anchor="middle" font-size="9.5" fill="#3a3a35">暗反应</text>
<text x="120" y="90" text-anchor="middle" font-size="9" fill="#3a3a35">ATP 用于 C₃ 的还原</text>
<text x="120" y="108" text-anchor="middle" font-size="8.5" fill="#8a94a3">不用于肌肉收缩</text>
</svg>
</div>
<div class="qac">
<p class="q">剧烈运动时，ATP 到底从哪来？不是有储存吗？</p>
<p class="a">没有「储存的 ATP 大量释放」这回事。剧烈运动时 ATP 主要来自<b>细胞呼吸</b>（有氧呼吸为主，无氧呼吸也参与），呼吸释放的能量推动 ADP 与 Pi 重新合成 ATP；同时 ATP 水解加快，所以<b>周转速率增大而总量基本不变</b>。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="剧烈运动时 ATP 来自细胞呼吸">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<rect x="22" y="34" width="86" height="34" rx="6" fill="#ffffff" stroke="#dbe7ef"/>
<text x="65" y="55" text-anchor="middle" font-size="9.5" fill="#3a3a35">细胞呼吸</text>
<text x="116" y="57" text-anchor="middle" font-size="13" fill="#5a6472">→</text>
<rect x="128" y="34" width="58" height="34" rx="6" fill="#ffffff" stroke="#0f8a5f"/>
<text x="157" y="56" text-anchor="middle" font-size="10" font-weight="700" fill="#0f8a5f">ATP</text>
<text x="120" y="88" text-anchor="middle" font-size="9" fill="#3a3a35">有氧呼吸为主</text>
<text x="120" y="106" text-anchor="middle" font-size="8" fill="#8a94a3">剧烈运动时无氧呼吸也参与</text>
</svg>
</div>
</div>
<p class="gx-note">这六问其实是同一件事：ATP 的角色是<b>流通</b>不是<b>储存</b>。凡是把 ATP 说成「仓库」「可大量储存」「主要能源物质」的，都在同一个地方错；凡是把 ATP⇄ADP 说成「可逆反应」的，都是只看物质方向、没看反应条件。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ ATP 是可大量储存的能源物质，剧烈运动时靠分解储存的 ATP 供能。</p>
<p class="er-v">✓ 细胞内 ATP 的含量很少，但 ATP 与 ADP 的相互转化极快，消耗多少就再生多少。</p>
<p class="er-w">错在哪：把「货币」当「仓库」。ATP 是流通手段，不是储备；能大量储存的是糖原和脂肪。</p>
</div>
<div class="er">
<p class="er-x">✗ ATP 与 ADP 的相互转化是可逆反应。</p>
<p class="er-v">✓ ATP 与 ADP 可以相互转化，但不是可逆反应：酶不同、能量来源不同、场所不同。</p>
<p class="er-w">错在哪：只看物质方向相反，没看条件。可逆反应要求正逆反应在同一条件下进行。</p>
</div>
<div class="er">
<p class="er-x">✗ ATP 由三个高能磷酸键组成。</p>
<p class="er-v">✓ ATP 的结构简式为 A—P~P~P，含有 2 个高能磷酸键。</p>
<p class="er-w">错在哪：数错了键。A 与第一个 P 之间是普通化学键，只有 P 与 P 之间的 2 个才是「~」。</p>
</div>
<div class="er">
<p class="er-x">✗ ATP 是细胞的主要能源物质。</p>
<p class="er-v">✓ ATP 是细胞生命活动的直接能源物质；主要能源物质是糖类。</p>
<p class="er-w">错在哪：「直接」和「主要」是两个判据词，对应两种物质，不能互换。</p>
</div>
<div class="er">
<p class="er-x">✗ 剧烈运动后，肌细胞内 ATP 的含量大幅增加。</p>
<p class="er-v">✓ 剧烈运动时 ATP 的转化速率（周转）增大，但 ATP 总量基本不变。</p>
<p class="er-w">错在哪：把速率当成含量。消耗变多，合成也同步变多，存量仍维持很低而稳定的水平。</p>
</div>
<div class="er">
<p class="er-x">✗ ATP 简式中的 A 代表腺嘌呤。</p>
<p class="er-v">✓ A 代表腺苷，腺苷由腺嘌呤和核糖组成。</p>
<p class="er-w">错在哪：漏了核糖。腺嘌呤只是腺苷的一部分，写成腺嘌呤就把 A 的范围缩小了。</p>
</div>
<div class="er">
<p class="er-x">✗ 光反应产生的 ATP 可以运出叶绿体，用于肌肉收缩。</p>
<p class="er-v">✓ 光反应产生的 ATP 只用于暗反应中 C₃ 的还原，肌肉收缩用的是细胞呼吸产生的 ATP。</p>
<p class="er-w">错在哪：把「直接能源物质」的适用范围无限放大。ATP 通用，但光反应产的那一批有指定用途。</p>
</div>
</div>
</section>

<span class="gx-zoom-tip">双指放大 · 左右滑动看全图</span>
<button class="gx-zoom-x" type="button" aria-label="关闭">✕</button>
<div id="gxZoomInner"></div>
</div>

</div>

<script src="../../assets/page.js"></script>
<script src="../../assets/gx.js"></script>
<script src="../../assets/autopilot.js"></script>
<script>
/* 互动脚本本体（由 build-page.mjs 包进 <script> 里，所以这里不要写 <script> 标签） */
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var GX = window.GX, el = GX.el, tx = GX.tx, $ = GX.$;
  var stage = $("gxStage");
  if (!stage || !window.AutoPilot) return;

  /* 两套坐标：宽屏 880×470，窄屏独立 360×700 */
  var W = {
    vb: "0 0 880 470",
    left: { x: 16, y: 16, w: 424, h: 438 },
    right: { x: 456, y: 16, w: 408, h: 438 },
    labelYs: [86, 174, 262], barH: 22, valGap: 16,
    noteYs: [348, 366],
    cyc: { cx: 660, cy: 250, dx: 45, hh: 68 },
    footYs: [396, 414],
    fs: { label: 10, val: 10, note: 9 }
  };
  var N = {
    vb: "0 0 360 700",
    left: { x: 8, y: 8, w: 344, h: 300 },
    right: { x: 8, y: 320, w: 344, h: 372 },
    labelYs: [66, 128, 190], barH: 16, valGap: 13,
    noteYs: [254, 272],
    cyc: { cx: 180, cy: 520, dx: 38, hh: 58 },
    footYs: [642, 660],
    fs: { label: 9, val: 9, note: 8.4 }
  };
  var L = W, A = 10;

  /* 纯函数：参数 → 数值。render() 和 __bio.cases 都用它 */
  function calc(v) {
    var e = Math.max(0, Math.min(100, +v));
    return { turn: e, stock: 100, ratio: 0.2 + 0.008 * e };
  }

  function bar(g, x, y, w, h, f, col) {
    el("rect", { x: x, y: y, width: w, height: h, rx: h / 2, fill: "#e8eef3" }, g);
    var fw = Math.max(0, Math.min(1, f)) * w;
    if (fw > 0.5) el("rect", { x: x, y: y, width: fw, height: h, rx: h / 2, fill: col }, g);
  }

  function draw() {
    var gA = $("gxA"), gB = $("gxB");
    gA.textContent = ""; gB.textContent = "";
    var s = calc(A), i;
    var lf = L.fs;

    /* ---------- 左：三个量 ---------- */
    el("rect", { x: L.left.x, y: L.left.y, width: L.left.w, height: L.left.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    tx(gA, L.left.x + 20, L.left.y + 30, "细胞内三个量（相对值）", "#5a6472", "start", 10.5, 700);

    var rows = [
      { t: "ATP 存量 stock", v: "stock = 100 · 恒定", f: 1, c: "#2f8a5b" },
      { t: "ATP 周转 turn", v: "turn = " + Math.round(s.turn), f: s.turn / 100, c: "#b8791f" },
      { t: "ADP/ATP 比值", v: "ADP/ATP = " + s.ratio.toFixed(2), f: s.ratio, c: "#4a7fb5" }
    ];
    var bx = L.left.x + 20, bw = L.left.w - 40;
    for (i = 0; i < rows.length; i++) {
      var ly = L.labelYs[i], by = ly + 8, vy = by + L.barH + L.valGap;
      tx(gA, bx, ly, rows[i].t, "#3a3a35", "start", lf.label, 700);
      bar(gA, bx, by, bw, L.barH, rows[i].f, rows[i].c);
      tx(gA, bx, vy, rows[i].v, rows[i].c, "start", lf.val, 400);
    }
    tx(gA, bx, L.noteYs[0], "① 存量那条不许动：细胞里 ATP 很少，靠边花边补。", "#5a6472", "start", lf.note, 400);
    tx(gA, bx, L.noteYs[1], "② 涨的只有周转和 ADP/ATP：花得越猛，补得越快。", "#5a6472", "start", lf.note, 400);

    /* ---------- 右：周转环 ---------- */
    var c = L.cyc;
    el("rect", { x: L.right.x, y: L.right.y, width: L.right.w, height: L.right.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    tx(gB, L.right.x + 20, L.right.y + 30, "周转：ATP 花掉，又马上造回来", "#5a6472", "start", 10.5, 700);

    var topY = c.cy - c.hh, botY = c.cy + c.hh;
    var xL = c.cx - c.dx, xR = c.cx + c.dx;
    var sw = 2 + s.turn / 100 * 2.6;          /* 线越粗＝周转越快 */
    el("line", { x1: xL, y1: topY, x2: xR, y2: topY, stroke: "#9fb3c3", "stroke-width": 2 }, gB);
    el("line", { x1: xL, y1: botY, x2: xR, y2: botY, stroke: "#9fb3c3", "stroke-width": 2 }, gB);
    /* 右：ATP → ADP，向下 */
    el("line", { x1: xR, y1: topY, x2: xR, y2: botY - 10, stroke: "#b8791f", "stroke-width": sw }, gB);
    el("polygon", { points: (xR - 6) + "," + (botY - 12) + " " + (xR + 6) + "," + (botY - 12) + " " + xR + "," + botY, fill: "#b8791f" }, gB);
    /* 左：ADP + Pi → ATP，向上 */
    el("line", { x1: xL, y1: botY, x2: xL, y2: topY + 10, stroke: "#2f8a5b", "stroke-width": sw }, gB);
    el("polygon", { points: (xL - 6) + "," + (topY + 12) + " " + (xL + 6) + "," + (topY + 12) + " " + xL + "," + topY, fill: "#2f8a5b" }, gB);

    tx(gB, c.cx, topY - 14, "ATP", "#151a21", "middle", 13, 700);
    tx(gB, c.cx, botY + 22, "ADP + Pi", "#151a21", "middle", 12, 700);
    tx(gB, xR + 14, c.cy, "水解，放能", "#b8791f", "start", 8.5, 400);
    tx(gB, xL - 14, c.cy, "合成，吸能", "#2f8a5b", "end", 8.5, 400);
    tx(gB, c.cx, c.cy + 4, "turn = " + Math.round(s.turn), "#151a21", "middle", 13, 700);
    tx(gB, c.cx, c.cy + 24, "stock = " + Math.round(s.stock), "#2f8a5b", "middle", 9, 400);

    tx(gB, c.cx, L.footYs[0], "箭头粗细＝周转速率：花得越快，补得越快", "#5a6472", "middle", 9, 400);
    tx(gB, c.cx, L.footYs[1], "两端的 ATP、ADP 一直在换，存量却几乎不变", "#5a6472", "middle", 9, 400);
  }

  function render() {
    var s = calc(A), st, col, bg, sn;
    $("gxVa").textContent = String(Math.round(A));
    $("gxVb").textContent = String(Math.round(s.turn));
    $("gxVc").textContent = s.ratio.toFixed(2);
    if (A < 20) {
      st = "安静"; col = "#2f8a5b"; bg = "#e6f6ee";
      sn = "周转慢，存量仍是 100";
    } else if (A < 60) {
      st = "中等活动"; col = "#b8791f"; bg = "#fdf3e0";
      sn = "周转加快，存量不动";
    } else {
      st = "剧烈运动"; col = "#b8402f"; bg = "#fbeae7";
      sn = "周转拉满，总量基本不变";
    }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    draw();
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    /* 开场只停 1 秒，2.6 秒体检时必须在动；在 e=100 处停 3 秒 */
    loop: [{ t: 0, v: 10 }, { t: 1, v: 10 }, { t: 3.5, v: 100 }, { t: 6.5, v: 100 }, { t: 9, v: 10 }, { t: 11, v: 10 }],
    keys: [10, 50, 100],
    value: A, min: 0, max: 100, step: 1,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__bio = { calc: calc, cases: [
    { v: 0, eq: { turn: 0, stock: 100, ratio: 0.2 } },
    { v: 50, eq: { turn: 50, stock: 100, ratio: 0.6 } },
    { v: 100, eq: { turn: 100, stock: 100, ratio: 1.0 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
</body>
