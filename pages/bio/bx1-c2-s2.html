<p class="gx-lede">本节专讲细胞里的两类无机物：水和无机盐。主线：自由水多，代谢旺；结合水比例高，扛得住。最易错的是把结合水当多余的水，或把抗逆和自由水扯成正相关。</p>

<!-- ================= A ================= -->
<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题写课本这句，不写自己的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 水的两种存在形式<span class="q-src">人教版（2019）必修1 · 第2章第2节</span></p>
<p class="q-b">水在细胞中主要以两种形式存在：自由水和结合水。自由水是细胞内良好的溶剂，结合水是细胞结构的重要组成成分。</p>
<p class="q-n">→ 这句话有<b>三个条件</b>：① 水<b>主要</b>分这两种；② 自由水担「溶剂」这个功能；③ 结合水本身就是<b>结构</b>的一部分。少读第 ③ 条，就会写出「结合水是多余的水」。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 比值决定代谢与抗逆<span class="q-src">人教版（2019）必修1 · 第2章第2节</span></p>
<p class="q-b">自由水与结合水的比值越高，细胞代谢越旺盛；比值越低，细胞抗逆性越强。</p>
<p class="q-n">→ 两个「越」是一件事的两端：比值高 → 代谢旺、抗逆弱；比值低 → 代谢慢、抗逆强。<b>抗逆</b>指抗旱、抗寒、抗盐碱这类「熬得住」。注意课本写的是<b>比值</b>，不是含量。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 无机盐的存在与作用<span class="q-src">人教版（2019）必修1 · 第2章第2节</span></p>
<p class="q-b">细胞中大多数无机盐以离子的形式存在，它们对维持细胞和生物体的生命活动有重要作用。</p>
<p class="q-n">→ 抠三个词：「<b>大多数</b>」（Mg 在叶绿素里就不是离子）；「<b>离子</b>」；「<b>维持</b>」—— 维持不是提供，所以无机盐不供能。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>自由水</th><th>结合水</th></tr></thead>
<tbody>
<tr><td>存在状态</td><td>能自由流动</td><td>被蛋白质、多糖束缚，不能流动</td></tr>
<tr><td>主要功能</td><td>良好溶剂；运输物质；参与反应</td><td>细胞结构的重要组成成分</td></tr>
<tr class="key"><td>与代谢抗逆的关系</td><td>比例越高 → 代谢越旺、抗逆越弱</td><td>比例越高 → 代谢越弱、抗逆越强</td></tr>
<tr><td>含量（教材值）</td><td>约占细胞总水的 95.5%</td><td>约占细胞总水的 4.5%</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">只高亮 1 行，那才是真正的差别：功能上并列，在<b>代谢与抗逆</b>上正好反向。背法：自由水「干活」，结合水「扛住」。</p>
</section>

<section class="gx-sec" id="b">
<h2><span class="sn">02</span>拆开看</h2>
<p class="gx-h2s">四张图：各讲一件事，按「是什么 → 怎么变 → 怎么用 → 记例子」排。</p>

<p class="fig-s">左边自由水：能自由流动、是良好的溶剂、物质靠它运输。右边结合水：被蛋白质和多糖束缚、不能流动、是细胞结构的重要组成成分。先看「能不能流动」，差别都从这里来。</p>

<text class="t" x="54" y="148">运输物质、直接参与生化反应</text>

<p class="gx-take">结合水不是「没用的水」，它就是结构本身的一部分；细胞失去结合水，结构就被破坏。</p>
<p class="gx-note">「晒干」和「烘干」不是一回事：晒干只丢自由水，种子休眠但还活着；烘干（约 100℃）把结合水也赶走，结构毁了，种子死了。</p>

<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。每步只推一个判断。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 简答（冬小麦越冬）<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">冬天来临前，冬小麦细胞内自由水与结合水的比值会怎样变化？这种变化有什么意义？请分点作答。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题：抓住「比值」两个字</p>
<p class="s-b">问的是自由水与结合水的<b>比值</b>，不是「水的总含量」。比值 = 自由水 ÷ 结合水，只需判断分子、分母怎么变。</p>
<p class="s-k">用到：水有自由水和结合水两种存在形式。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 判断分子、分母各自怎么变</p>
<p class="s-b">低温、蒸腾减弱 → 自由水减少；细胞把一部分自由水「绑」到蛋白质上，转成结合水。分子变小、分母变大。</p>
<p class="s-k">用到：自由水与结合水可以相互转化。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 得出比值的变化</p>
<p class="s-b">分子减少、分母增加 → 自由水与结合水的<b>比值降低</b>。这步只答「怎样变化」，先不写意义。</p>
<p class="s-k">用到：比值 = 自由水 ÷ 结合水。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 说明意义</p>
<p class="s-b">比值降低 → 自由水少 → 代谢减弱，有机物消耗减少；结合水多 → 水被结构束缚、不易结冰 → 抗寒能力增强。一句话：<b>抗逆性增强</b>。</p>
<p class="s-k">用到：比值越低，细胞抗逆性越强。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 写成答题卡的样子</p>
<p class="s-b">分三点：变化、意义、结论。两个坑：不能写「结合水是废物所以减少」，也不能写「抗逆性与自由水比例正相关」。</p>
<p class="s-k">用到：结合水是结构的重要组成成分，不是废物。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">① 变化：自由水与结合水的比值<b>降低</b>（自由水减少，结合水比例升高）。<br>② 意义：自由水减少 → 代谢减弱，减少有机物消耗；结合水比例升高 → <b>抗寒（抗逆）能力增强</b>。<br>③ 结论：比值降低，代谢减弱、抗逆性增强。</p>
</div>
</div>

<!-- ================= E ================= -->
<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">自由水多了，代谢到底是快还是慢？</p>
<p class="a">快。自由水是良好溶剂，物质靠它运输、酶在其中有水环境，比例高 → <b>代谢旺盛</b>；代价是抗逆性低。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="自由水多时代谢旺盛">
<text class="q c b" x="120" y="40">自由水多</text>
<line x1="120" y1="50" x2="120" y2="76" stroke="#2f6fb0" stroke-width="2"/>
<polygon points="114,72 126,72 120,84" fill="#2f6fb0"/>
<text class="q c" x="120" y="108">代谢旺盛</text>
</svg>
</div>
<div class="qac">
<p class="q">抗旱、抗寒能力，跟哪种水有关？</p>
<p class="a">跟<b>结合水比例</b>有关。结合水被结构束缚、不易移动，比例高时细胞不易失水、不易结冰 → <b>抗逆性强</b>。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="结合水比例高则抗逆性强">
<text class="q c m" x="120" y="40">结合水比例升高</text>
<line x1="120" y1="50" x2="120" y2="76" stroke="#b8791f" stroke-width="2"/>
<polygon points="114,72 126,72 120,84" fill="#b8791f"/>
<text class="q c" x="120" y="108">抗寒抗旱增强</text>
</svg>
</div>
<div class="qac">
<p class="q">无机盐为什么不能当能源物质？</p>
<p class="a">因为无机盐<b>不提供能量</b>。它只是结构零件（Mg、Fe、I、Ca）和调节者（渗透压、酸碱平衡），供能的是糖类、脂肪。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="无机盐不供能，糖类脂肪供能">
<rect x="24" y="32" width="88" height="30" rx="6" fill="#eef6ff" stroke="#bcd8ef"/>
<text class="q c b" x="68" y="52">无机盐</text>
<text class="qq c r" x="68" y="86">不供能</text>
<rect x="128" y="32" width="88" height="30" rx="6" fill="#fdf6e8" stroke="#e8d3a8"/>
<text class="q c m" x="172" y="52">糖类/脂肪</text>
<text class="qq c p" x="172" y="86">供能</text>
</svg>
</div>
<div class="qac">
<p class="q">缺 Mg 为什么叶片发黄？</p>
<p class="a">Mg 是<b>叶绿素的组成成分</b>，缺 Mg 叶绿素无法合成；叶绿素少，叶片就发黄（缺绿）。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="镁是叶绿素的组成成分，缺镁叶发黄">
<text class="q c" x="120" y="34">Mg → 叶绿素</text>
<path d="M120 52 C150 50 166 70 164 94 C140 94 120 76 120 52 Z" fill="#cfe9c9" stroke="#7fb37a"/>
<text class="q c r" x="120" y="114">缺 Mg → 叶片发黄</text>
</svg>
</div>
<div class="qac">
<p class="q">输液为什么用 0.9% 的生理盐水？</p>
<p class="a">0.9% NaCl 与<b>血浆渗透压相当</b>：红细胞既不吸水胀破、也不失水皱缩，能维持正常的形态和功能。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="0.9%生理盐水与血浆等渗">
<circle cx="70" cy="70" r="19" fill="#f3c6c0" stroke="#d99a92"/>
<text class="q c" x="70" y="34">0.9% NaCl</text>
<text class="qq c" x="70" y="106">形态正常</text>
<text class="qq c" x="176" y="70">与血浆</text>
<text class="qq c" x="176" y="84">等渗</text>
</svg>
</div>
<div class="qac">
<p class="q">「水是生命之源」在细胞层面怎么讲？</p>
<p class="a">水是细胞中含量最多的化合物（鲜重 85%–90%）：<b>自由水</b>当溶剂、运输、参与反应，<b>结合水</b>构成结构。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="水占细胞鲜重85%到90%">
<text class="q c" x="120" y="38">水：细胞鲜重 85%–90%</text>
<rect x="40" y="54" width="160" height="14" rx="7" fill="#dbeafe"/>
<rect x="40" y="54" width="140" height="14" rx="7" fill="#7fb8e6"/>
<text class="qq c" x="120" y="96">自由水干活 · 结合水扛住</text>
</svg>
</div>
</div>
<p class="gx-note">六问是一件事：自由水「干活」（代谢），结合水「扛住」（抗逆），无机盐「维持」（不供能）。先问：这题问的是哪一种水、哪一类作用。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 结合水是细胞里多余的水，失去也没关系。</p>
<p class="er-v">✓ 结合水是细胞结构的重要组成成分，失去结合水结构会被破坏。</p>
<p class="er-w">错在把「不能流动」当成「没用」。</p>
</div>
<div class="er">
<p class="er-x">✗ 抗逆性越强，说明自由水的比例越高。</p>
<p class="er-v">✓ 结合水比例越高（自由水与结合水的比值越低），抗逆性越强。</p>
<p class="er-w">把「抗逆」和「代谢旺」混成一件事，方向正好反了。</p>
</div>
<div class="er">
<p class="er-x">✗ 无机盐是能源物质，能为细胞提供能量。</p>
<p class="er-v">✓ 无机盐不提供能量；供能的是糖类、脂肪等有机物。</p>
<p class="er-w">把课本的「维持生命活动」读成了「提供能量」。</p>
</div>
<div class="er">
<p class="er-x">✗ 自由水只起溶剂作用，没有别的功能。</p>
<p class="er-v">✓ 自由水是良好溶剂，还能运输物质、参与生化反应、维持细胞形态。</p>
<p class="er-w">把课本的「之一」读成了「唯一」。</p>
</div>
<div class="er">
<p class="er-x">✗ 干旱时细胞内结合水的比例会下降。</p>
<p class="er-v">✓ 干旱、低温时结合水比例升高，自由水与结合水的比值降低。</p>
<p class="er-w">方向反了：环境越差，细胞越要把水「绑」住。</p>
</div>
<div class="er">
<p class="er-x">✗ 细胞中的无机盐都以离子的形式存在。</p>
<p class="er-v">✓ 大多数无机盐以离子形式存在，少数以化合物形式存在（如 Mg 在叶绿素中）。</p>
<p class="er-w">漏掉「大多数」，绝对化表述必扣分。</p>
</div>
