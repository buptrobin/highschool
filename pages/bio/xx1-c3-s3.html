<p class="gx-lede">上一节讲激素怎么被运输、怎么起作用，这一节把「神经」和「体液」两条线接到同一个目标上：让体温、渗透压这些指标在波动中保持相对稳定。整节最容易错的一件事是：把体温调节写成「只有神经调节」，或者寒冷时只写「产热增加」忘了「散热减少」。课本那句「共同作用的结果」，就是本节所有大题的得分点。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 本节总纲<span class="q-src">人教版（2019）选择性必修1 · 第3章第3节</span></p>
<p class="q-b">体温调节和水盐平衡调节都是神经调节和体液调节共同作用的结果。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个条件</b>组成：① 有神经调节（感受器→传入神经→下丘脑→传出神经→效应器）；② 有体液调节（甲状腺激素、肾上腺素、抗利尿激素等经血液运输起作用）；③ 两者<b>共同</b>作用于同一指标。少写第②条，就变成「只有神经调节」，必扣分；少写第③条，就变成两条互不相干的平行线，拿不到「关系」的分。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 寒冷环境<span class="q-src">人教版（2019）选择性必修1 · 第3章第3节</span></p>
<p class="q-b">寒冷时，皮肤冷觉感受器兴奋，通过神经—体液调节使产热增加、散热减少。</p>
<p class="q-n">→ 翻成人话：注意「产热增加、散热减少」是<b>两个方向</b>，不是一件事。散热减少靠神经（皮肤血管收缩、汗腺分泌减少、立毛肌收缩），产热增加靠神经（骨骼肌战栗）+ 体液（甲状腺激素、肾上腺素）。写全两个方向 + 两种调节方式，才是完整答案。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 炎热环境<span class="q-src">人教版（2019）选择性必修1 · 第3章第3节</span></p>
<p class="q-b">炎热时，主要通过增加散热来维持体温相对稳定。</p>
<p class="q-n">→ 翻成人话：关键词是「<b>主要</b>」。炎热时皮肤血管舒张、汗腺分泌增加，散热明显加大；同时代谢略降（食欲减退）只是次要的。写成「炎热时主要减少产热」是把主次弄反，属于典型扣分句。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>神经调节（体温调节中）</th><th>体液调节（体温调节中）</th></tr></thead>
<tbody>
<tr><td>信息载体</td><td>神经冲动（电信号 + 突触处递质）</td><td>激素（甲状腺激素、肾上腺素等）</td></tr>
<tr><td>传递路径</td><td>感受器→传入神经→下丘脑→传出神经→效应器</td><td>内分泌腺→血液运输→全身靶细胞</td></tr>
<tr><td>速度</td><td>快，毫秒级</td><td>慢，需经血液运输并调节基因表达</td></tr>
<tr><td>作用时间</td><td>短，刺激停止即止</td><td>长，激素在血中维持较久</td></tr>
<tr><td>寒冷时负责</td><td>皮肤血管收缩、汗腺分泌减少、立毛肌收缩、骨骼肌战栗</td><td>甲状腺激素、肾上腺素分泌增多，代谢加快产热增多</td></tr>
<tr class="key"><td>本节最易漏的分</td><td colspan="2">寒冷时<b>两个方向都要写</b>：产热增加 + 散热减少；两者缺一即失分</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只高亮一行。背法：先记「神经快而短、体液慢而长」，再记分工——<b>血管、汗腺、骨骼肌由神经直接支配，代谢产热主要由激素拉起来</b>。答题时先写调节方式（神经—体液调节），再写两条路，顺序别倒。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 寒冷环境中的体温调节（简答）<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">人从 25 ℃ 的室内走到 −5 ℃ 的室外，一段时间内体温仍能维持在 37 ℃ 左右。请回答：（1）寒冷刺激下，人体通过哪些途径维持体温？属于什么调节方式？（2）若此时给他穿上厚衣服，皮肤的冷觉感受器兴奋性会怎样变化？为什么？<br><span style="color:#8a5a00">陷阱：只写「产热增加」，不写「散热减少」；或把调节方式写成「神经调节」。</span></p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 找感受器和中枢</p>
<p class="s-b">寒冷刺激作用于皮肤，<b>皮肤冷觉感受器</b>兴奋，产生神经冲动，沿传入神经传到<b>下丘脑体温调节中枢</b>。这一步决定了整个答案的起点，写错感受器（写成「温觉感受器」）后面全偏。</p>
<p class="s-k">用到：反射弧五部分 + 体温调节中枢在下丘脑</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 写出「减少散热」这一方向</p>
<p class="s-b">下丘脑通过传出神经支配皮肤：<b>皮肤血管收缩</b>（皮肤血流量减少）、<b>汗腺分泌减少</b>（汗液蒸发减少）、<b>立毛肌收缩</b>（起鸡皮疙瘩）。三个动作的共同结果是<b>散热减少</b>。</p>
<p class="s-k">用到：效应器是血管、汗腺、立毛肌（神经调节）</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 写出「增加产热」这一方向</p>
<p class="s-b">同时，<b>骨骼肌战栗</b>（神经支配，产热明显增加）；<b>甲状腺激素、肾上腺素分泌增多</b>（经血液运输，促进代谢，产热增加）。前者快、后者慢而持久，合起来才是完整的两条腿。</p>
<p class="s-k">用到：神经调节 + 体液（激素）调节</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 定性调节方式</p>
<p class="s-b">既有神经调节（感受、传导、支配血管汗腺和骨骼肌），又有体液调节（甲状腺激素、肾上腺素），所以是<b>神经—体液调节</b>。注意写「共同作用」，别写「以神经调节为主」——那会被判为漏掉体液调节。</p>
<p class="s-k">用到：本节总纲句「共同作用的结果」</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 第（2）问：负反馈</p>
<p class="s-b">穿厚衣服后，体表热量散失减少，皮肤温度回升，<b>冷觉感受器兴奋性降低</b>，传入冲动减少，下丘脑的调节输出减弱，产热和散热重新回到平衡。这就是<b>负反馈调节</b>：结果反过来抑制原因。</p>
<p class="s-k">用到：负反馈（体温调节是典型的负反馈）</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）① 寒冷刺激使皮肤冷觉感受器兴奋，神经冲动经传入神经传至下丘脑体温调节中枢；② 通过传出神经使皮肤血管收缩、汗腺分泌减少、立毛肌收缩，<b>散热减少</b>；③ 同时骨骼肌战栗，甲状腺激素和肾上腺素分泌增多，促进代谢，<b>产热增加</b>；④ 该过程既有神经调节又有体液调节，属于<b>神经—体液调节</b>。（2）兴奋性降低。厚衣服减少了体表热量散失，皮肤温度回升，冷觉感受器受到的刺激减弱；这体现了<b>负反馈调节</b>。</p>
</div>

<section class="gx-sec" id="e">

<p class="q">炎热时主要是「减少产热」还是「增加散热」？</p>
<p class="a">以<b>增加散热为主</b>：皮肤血管舒张使血流量增加、汗腺分泌增加使汗液蒸发带走热量。减少产热（食欲减退、代谢略降）只是次要补充，不能颠倒主次。</p>

<div class="qac">
<p class="q">体温调节中枢在哪里？是大脑皮层吗？</p>
<p class="a">在<b>下丘脑</b>。下丘脑既是体温调节中枢，也是水盐平衡、血糖调节的中枢，还能分泌促激素释放激素，是「神经—体液」的连接点。大脑皮层负责感觉（如冷觉），不是调节中枢。</p>

<p class="q">为什么说「产热 = 散热」时体温就稳定？</p>

<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 寒冷时，人体通过增加产热来维持体温。</p>
<p class="er-v">✓ 寒冷时，通过神经—体液调节使<b>产热增加、散热减少</b>，共同维持体温相对稳定。</p>
<p class="er-w">错在哪：漏掉「散热减少」一整个方向。血管收缩、汗腺分泌减少、立毛肌收缩都是得分点，只写产热最多给一半分。</p>
</div>

<div class="er">
<p class="er-x">✗ 体温调节是神经调节，激素只是辅助。</p>
<p class="er-v">✓ 体温调节是<b>神经调节和体液调节共同作用</b>的结果。</p>
<p class="er-w">错在哪：课本总纲句就是「共同作用的结果」。把体液降为「辅助」，等于否认甲状腺激素、肾上腺素在产热中的作用，必扣分。</p>
</div>

<div class="er">
<p class="er-x">✗ 炎热时，人体主要通过减少产热维持体温。</p>
<p class="er-v">✓ 炎热时，主要通过<b>增加散热</b>（皮肤血管舒张、汗腺分泌增加）维持体温相对稳定。</p>
<p class="er-w">错在哪：主次颠倒。「主要通过」后面只能接增加散热；减少产热是次要的、且不是主要机制。</p>
</div>

<div class="er">
<p class="er-x">✗ 体温调节中枢在大脑皮层，因为人能用意识控制。</p>
<p class="er-v">✓ 体温调节中枢在<b>下丘脑</b>；大脑皮层产生冷觉、热觉，属感觉而非调节中枢。</p>
<p class="er-w">错在哪：混淆「感觉中枢」和「调节中枢」。体温调节是自主性的负反馈，不需要大脑皮层参与也能完成。</p>
</div>

<div class="er">
<p class="er-x">✗ 出汗是热量自己跑出去，不需要调节。</p>
<p class="er-v">✓ 汗腺分泌增加是<b>神经支配</b>下的主动调节过程，属于增加散热的途径。</p>
<p class="er-w">错在哪：把「蒸发吸热」这个物理过程当成「不需要调节」。物理规律提供可能，神经调节决定汗腺分泌多少。</p>
</div>

<div class="er">
<p class="er-x">✗ 产热和散热可以不相等，只要差别不大体温就不变。</p>
<p class="er-v">✓ 体温相对稳定的条件是<b>产热 = 散热</b>；不等就会导致体温升高或降低。</p>
<p class="er-w">错在哪：「差别不大体温就不变」是错的。持续的小差额也会累积成明显的体温变化，等式必须相等。</p>
</div>

<div class="er">
<p class="er-x">✗ 中暑是体温调节中枢坏了，所以治不好。</p>
<p class="er-v">✓ 中暑多为<b>散热环节受阻</b>、负荷超过调节能力所致，及时降温、补液可恢复。</p>
<p class="er-w">错在哪：把「功能超负荷」说成「结构损坏」。中枢通常正常，去掉负荷后调节能恢复。</p>
