<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题写左边这句，不写右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 赤霉素<span class="q-src">人教版（2019）选择性必修1 · 第5章第2节</span></p>
<p class="q-b">赤霉素能促进细胞伸长，引起植株增高，促进种子萌发和果实发育。</p>
<p class="q-n">→ 拆成<b>三个动作</b>：①细胞伸长 ②植株增高 ③促进种子萌发和果实发育。第③个动作里只要写成「促进休眠」，方向就反了——赤霉素促萌发，脱落酸促休眠。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 脱落酸<span class="q-src">人教版（2019）选择性必修1 · 第5章第2节</span></p>
<p class="q-b">脱落酸能抑制细胞分裂，促进叶和果实的衰老和脱落，维持种子休眠。</p>
<p class="q-n">→ 一个「抑制」+ 两个「促进衰老、脱落」+ 一个「维持休眠」，四个动作<b>全是踩刹车</b>。所以脱落酸与赤霉素在种子萌发上是一对<b>拮抗</b>：一个让胚恢复生长，一个让胚停在原地。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 乙烯与细胞分裂素<span class="q-src">人教版（2019）选择性必修1 · 第5章第2节</span></p>
<p class="q-b">乙烯能促进果实成熟；细胞分裂素能促进细胞分裂。</p>
<p class="q-n">→ 两句话都只有<b>一个动词、一个宾语</b>，背的时候不要加词：乙烯促进的是<b>成熟</b>（变软、变甜、转色），不是生长；细胞分裂素促进的是<b>分裂</b>（细胞变多），不是伸长。</p>
</div>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 激素与种子保存<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">收获后的种子如果堆在潮湿温暖的地方，几天就会发热、发霉、失去发芽率。请回答：（1）为什么收获后的种子要保持干燥、低温保存？（2）若要用激素处理让休眠的种子提前萌发，应选用哪种激素，理由是什么？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题：问的是「保存」不是「萌发」</p>
<p class="s-b">保存要的是种子<b>不萌发、少消耗</b>；所以第（1）问的落点是「维持休眠」，不是「促进萌发」。先把方向定死，再动笔。</p>
<p class="s-k">用到：休眠与萌发是相反的两个状态。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 定激素：谁维持休眠，谁促萌发</p>
<p class="s-b">干燥、低温条件下脱落酸含量相对较高、赤霉素作用弱，种子维持休眠状态。这一步必须写清「脱落酸高、赤霉素弱」这一对，只写「激素少」不得分。</p>
<p class="s-k">用到：脱落酸维持种子休眠；赤霉素促进种子萌发。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 推生理：休眠 → 呼吸弱 → 少消耗</p>
<p class="s-b">种子休眠时细胞代谢慢、呼吸作用弱，有机物消耗少；同时干燥低温不利于微生物繁殖，所以不易霉变。</p>
<p class="s-k">用到：呼吸作用强弱与有机物消耗的关系。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 答第（2）问：反过来用同一对激素</p>
<p class="s-b">要让休眠种子提前萌发，就削弱脱落酸、增强赤霉素：用<b>赤霉素</b>处理，促进胚恢复生长、突破种皮。写「用脱落酸催芽」是把方向写反，零分。</p>
<p class="s-k">用到：赤霉素促进种子萌发。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收束：补一句「多种激素共同调节」</p>
<p class="s-b">严格说，萌发与否是赤霉素、脱落酸等多种激素共同调节的结果，还受水分、温度影响；答题时先给主因（这一对拮抗激素），再补这一句，表述才完整。</p>
<p class="s-k">用到：一种生理过程由多种激素共同调节。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）①干燥、低温条件下种子内脱落酸含量相对较高、赤霉素作用弱，种子维持休眠状态；②休眠种子呼吸作用弱，有机物消耗少；③干燥低温不利于微生物繁殖，不易霉变，有利于保存。<br>（2）选用赤霉素。赤霉素能促进种子萌发（促进胚恢复生长、突破种皮）；脱落酸维持种子休眠，方向相反。种子萌发是多种激素共同调节的结果。</p>
</div>
</div>
</section>
<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">赤霉素和脱落酸在种子萌发上，到底谁促进、谁抑制？</p>
<p class="a"><b>赤霉素促进种子萌发</b>（同时促进细胞伸长、植株增高），<b>脱落酸维持种子休眠</b>（抑制细胞分裂、促进衰老脱落）。两者对同一件事方向相反，属于<b>拮抗</b>关系。</p>

<p class="a">错。乙烯促进的是果实<b>成熟</b>——变软、变甜、转色、脱落。让果实长大的细胞伸长与分裂，是生长素、赤霉素、细胞分裂素的事。写「乙烯促进生长」直接扣分。</p>

<div class="qac">
<p class="q">细胞分裂素和赤霉素都让植物长，区别在哪？</p>
<p class="a">一个管<b>数目</b>，一个管<b>长度</b>：细胞分裂素促进<b>细胞分裂</b>（细胞变多），赤霉素促进<b>细胞伸长</b>（细胞变长）。答题时这两个动词不能互换。</p>

<p class="a">主因是一对<b>拮抗</b>激素：赤霉素促进萌发、脱落酸维持休眠；此外细胞分裂素等也参与。所以答案是「多种激素共同调节」，不能只写一种，也不能只写「赤霉素促进萌发」就完事。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 赤霉素促进种子休眠，脱落酸促进种子萌发</p>
<p class="er-v">✓ 赤霉素促进种子萌发，脱落酸维持种子休眠</p>
<p class="er-w">错在哪：整对方向反了。记法——赤霉素让胚「长起来」，脱落酸让胚「睡下去」。</p>
</div>
<div class="er">
<p class="er-x">✗ 脱落酸抑制种子萌发，所以它抑制细胞伸长</p>
<p class="er-v">✓ 脱落酸抑制细胞分裂，促进叶和果实的衰老、脱落，维持种子休眠</p>
<p class="er-w">错在哪：课本给脱落酸的动词是「抑制细胞分裂」，不是「抑制细胞伸长」；伸长是赤霉素、生长素的词。</p>
</div>
<div class="er">
<p class="er-x">✗ 乙烯促进细胞伸长，使果实长大</p>
<p class="er-v">✓ 乙烯促进果实成熟</p>
<p class="er-w">错在哪：乙烯管的是成熟（变软、变甜、转色），跟细胞伸长、植株增高无关。</p>
</div>
<div class="er">
<p class="er-x">✗ 细胞分裂素促进果实成熟</p>
<p class="er-v">✓ 细胞分裂素促进细胞分裂</p>
<p class="er-w">错在哪：把「分裂」记成「成熟」。促进成熟的是乙烯，促进分裂的才是细胞分裂素。</p>
</div>
<div class="er">
<p class="er-x">✗ 一种生理过程只由一种激素调节</p>
<p class="er-v">✓ 一种生理过程由多种激素共同调节</p>

<script>

document.addEventListener("DOMContentLoaded", function () {

  var L = W, A = 0, G = null;

  /* 纯函数：脱落酸浓度 a → 种子萌发率。render() 和 __bio.cases 都用它 */
  function calc(v) {

  function geom() {
    if (L === W) {
      return {
        t1: [36, 54], t2: [476, 54],
        seed: [228, 202, 74, 46], emb: [228, 202, 26, 32],
        gaX: 158, gaBot: 188, gaMax: 70, gaMin: 12,

      seed: [180, 140, 58, 38], emb: [180, 140, 21, 28],
      gaX: 130, gaBot: 138, gaMax: 60, gaMin: 10,
      abX: 232, abTop: 148, abMax: 58, abMin: 10,
      bar: [24, 252, 304, 14], barT: [24, 242],
      s1: [24, 284], s2: [24, 300],
      px: [52, 332], py: [384, 600], yt: [44, 616], xt: [52, 616],
      crit: [196, 400]
    };

  function drawSeed(gA, s) {
    var f = s.germ / 100, g = G;
    el("rect", { x: L.left.x, y: L.left.y, width: L.left.w, height: L.left.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    tx(gA, g.t1[0], g.t1[1], "一粒种子：两条相反的指令", "#5a6472", "start", 10.5, 700);
    el("ellipse", { cx: g.seed[0], cy: g.seed[1], rx: g.seed[2], ry: g.seed[3], fill: "#fdf6e8", stroke: "#d9c9a3", "stroke-width": 1.3 }, gA);
    el("ellipse", { cx: g.emb[0], cy: g.emb[1], rx: g.emb[2], ry: g.emb[3], fill: "#ffffff", stroke: "#9fc7ae", "stroke-width": 1.2 }, gA);
    tx(gA, g.emb[0], g.emb[1] + 4, "胚", "#1f6f4a", "middle", 9.4, 700);
    /* 赤霉素：向上，长度随萌发率变长 */
    var gt = g.gaBot - (g.gaMin + (g.gaMax - g.gaMin) * f);
    el("line", { x1: g.gaX, y1: g.gaBot, x2: g.gaX, y2: gt + 12, stroke: "#2f8a5b", "stroke-width": 2.4 }, gA);
    el("polygon", { points: g.gaX + ", " + (gt - 2) + " " + (g.gaX - 6) + ", " + (gt + 13) + " " + (g.gaX + 6) + ", " + (gt + 13), fill: "#2f8a5b" }, gA);
    tx(gA, g.gaX - 12, gt + 4, "赤霉素", "#2f8a5b", "end", 10, 700);
    tx(gA, g.gaX - 12, gt + 19, "促萌发", "#2f8a5b", "end", 9, 400);
    /* 脱落酸：向下，长度随休眠程度变长 */
    var ab = g.abTop + (g.abMin + (g.abMax - g.abMin) * (1 - f));
    el("line", { x1: g.abX, y1: g.abTop, x2: g.abX, y2: ab - 12, stroke: "#b8791f", "stroke-width": 2.4 }, gA);
    el("polygon", { points: g.abX + ", " + (ab + 2) + " " + (g.abX - 6) + ", " + (ab - 13) + " " + (g.abX + 6) + ", " + (ab - 13), fill: "#b8791f" }, gA);
    tx(gA, g.abX + 12, ab - 8, "脱落酸", "#b8791f", "start", 10, 700);
    tx(gA, g.abX + 12, ab + 7, "促休眠", "#b8791f", "start", 9, 400);
    /* 萌发率进度条 */
    tx(gA, g.barT[0], g.barT[1], "萌发率 germ（%）", "#5a6472", "start", 9.4, 700);
    el("rect", { x: g.bar[0], y: g.bar[1], width: g.bar[2], height: g.bar[3], rx: 7, fill: "#eceff3" }, gA);
    el("rect", { x: g.bar[0], y: g.bar[1], width: Math.max(2, g.bar[2] * f), height: g.bar[3], rx: 7, fill: f > 0.5 ? "#2f8a5b" : "#b8791f" }, gA);
    tx(gA, g.bar[0] + g.bar[2] + 2, g.bar[1] + 12, s.germ.toFixed(1) + "%", "#43505e", "end", 9.4, 700);
    tx(gA, g.s1[0], g.s1[1], "箭头越长＝这种激素越占上风", "#5a6472", "start", 9, 400);
    tx(gA, g.s2[0], g.s2[1], "a 越大，脱落酸箭头越长、萌发率越低", "#5a6472", "start", 9, 400);
  }

  function drawCurve(gB, s) {
    var g = G, pw = g.px[1] - g.px[0], ph = g.py[1] - g.py[0], i, a, gg, d = "";
    function X(v) { return g.px[0] + v / 10 * pw; }
    function Y(v) { return g.py[1] - v / 100 * ph; }
    el("rect", { x: L.right.x, y: L.right.y, width: L.right.w, height: L.right.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    tx(gB, g.t2[0], g.t2[1], "萌发率随脱落酸浓度变化", "#5a6472", "start", 10.5, 700);
    el("line", { x1: g.px[0] - 4, y1: g.py[1], x2: g.px[1] + 6, y2: g.py[1], stroke: "#9fb0bf", "stroke-width": 1.2 }, gB);
    el("line", { x1: g.px[0], y1: g.py[1] + 4, x2: g.px[0], y2: g.py[0] - 8, stroke: "#9fb0bf", "stroke-width": 1.2 }, gB);
    el("line", { x1: X(5), y1: g.py[0] - 4, x2: X(5), y2: g.py[1], stroke: "#c9b073", "stroke-width": 1, "stroke-dasharray": "4 4" }, gB);
    el("line", { x1: g.px[0], y1: Y(50), x2: g.px[1], y2: Y(50), stroke: "#c9b073", "stroke-width": 1, "stroke-dasharray": "4 4" }, gB);
    for (i = 0; i <= 40; i++) {
      a = i / 4; gg = calc(a).germ;
      d += (i ? "L" : "M") + X(a).toFixed(1) + "," + Y(gg).toFixed(1);
    }
    el("path", { d: d, fill: "none", stroke: "#2f8a5b", "stroke-width": 2.2 }, gB);
    el("circle", { cx: X(A), cy: Y(s.germ), r: 5, fill: "#b8402f", stroke: "#ffffff", "stroke-width": 1.4 }, gB);
    tx(gB, g.crit[0], g.crit[1], "a=5 临界点", "#b8791f", "start", 9, 700);
    tx(gB, g.yt[0], g.py[0] + 4, "100", "#5a6472", "end", 9, 400);
    tx(gB, g.yt[0], Y(50) + 4, "50", "#5a6472", "end", 9, 400);
    tx(gB, g.yt[0], g.py[1] + 4, "0", "#5a6472", "end", 9, 400);
    tx(gB, g.xt[0], g.xt[1], "0", "#5a6472", "middle", 9, 400);
    tx(gB, X(5), g.xt[1], "5", "#5a6472", "middle", 9, 400);

    tx(gB, g.crit[0], g.crit[1] + 16, "a=5 时萌发率 50%", "#5a6472", "start", 9, 400);

    var s = calc(A), st, col, bg, sn, f = s.germ;
    $("gxVa").textContent = Number(A).toFixed(1);
    $("gxVb").textContent = f.toFixed(1);
    $("gxVc").textContent = (100 - f).toFixed(1);
    if (A < 3) { st = "萌发率高"; col = "#2f8a5b"; bg = "#e6f6ee"; sn = "脱落酸少，胚能萌发"; }
    else if (A < 4.7) { st = "萌发受抑"; col = "#b8791f"; bg = "#fdf3e0"; sn = "脱落酸在追上来"; }
    else if (A <= 5.3) { st = "临界点"; col = "#b8791f"; bg = "#fdf3e0"; sn = "赤霉素与脱落酸势均力敌"; }
    else if (A <= 7) { st = "萌发受阻"; col = "#b8402f"; bg = "#fbeae7"; sn = "脱落酸占上风"; }
    else { st = "维持休眠"; col = "#b8402f"; bg = "#fbeae7"; sn = "基本不萌发，脱落酸主导"; }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    var gA = $("gxA"), gB = $("gxB");
    gA.textContent = ""; gB.textContent = "";
    drawSeed(gA, s);
    drawCurve(gB, s);
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");

  var ap = AutoPilot.create({

});
