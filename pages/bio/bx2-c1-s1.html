<p class="gx-lede">这一节是整本必修2 的地基：后面两节讲的自由组合、伴性遗传、基因突变，全都建立在「成对的遗传因子会分开」这一句话上。最容易错的一件事是把<b>表现型</b>当成<b>基因型</b>——看见高茎就写 DD，从此每一道遗传题都错在第一步。所以本节只做三件事：把课本原话拆成条件、把杂交过程画成图、把「3∶1 从哪来」亲手拖一遍。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 一对相对性状的杂交实验<span class="q-src">人教版（2019）必修2 · 第1章第1节</span></p>
<p class="q-b">孟德尔以豌豆为材料，进行了一对相对性状的杂交实验，F₁ 全部表现为显性性状，F₂ 中显性∶隐性≈3∶1。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个条件</b>卡死——① 只盯<b>一对</b>相对性状（高茎对矮茎），多一对就不是这节的事；② <b>F₁ 全部</b>表现显性，是「全部」不是「多数」；③ F₂ 的 3∶1 前面有个「≈」，它是对<b>大量个体</b>数出来的比例。少掉第③条的条件，就会把 3∶1 当成每一胎都严格的定律，这是本节第一个扣分点。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 分离定律<span class="q-src">人教版（2019）必修2 · 第1章第1节</span></p>
<p class="q-b">生物体遗传因子成对存在；形成配子时，成对的遗传因子彼此分离，分别进入不同的配子中。</p>
<p class="q-n">→ 翻成人话：这句话有两个动作、一个结果。动作一是「<b>成对存在</b>」——体细胞里 D 和 d 是搭伴的；动作二是「<b>彼此分离</b>」——形成配子时这一对必须拆开。结果就是<b>一个配子只带一个</b>遗传因子，写出来只能是 D 或 d，绝不能写成 Dd。答题时把「成对→分离→配子只带一个」按顺序写全，才给满分。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 受精<span class="q-src">人教版（2019）必修2 · 第1章第1节</span></p>
<p class="q-b">受精时，雌雄配子随机结合。</p>
<p class="q-n">→ 翻成人话：注意「<b>随机</b>」两个字。F₂ 的 3∶1 之所以是比例而不是定数，就是因为哪一粒花粉落到哪一朵花的柱头上是随机的——棋盘法里 4 个格子<b>机会相等</b>，才有 1∶2∶1 和 3∶1。样本一小，随机性就显形，比例立刻偏。这一条和第一条的「≈」是同一件事的两种说法。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>基因型</th><th>表现型</th></tr></thead>
<tbody>
<tr><td>写出来长什么样</td><td>DD、Dd、dd（字母成对）</td><td>高茎、矮茎（性状名称）</td></tr>
<tr><td>能不能直接看见</td><td>看不见，要由杂交结果推</td><td>看得见，一眼就能分</td></tr>
<tr><td>F₁（Dd）是什么</td><td>Dd，杂合子</td><td>高茎，只表现显性</td></tr>
<tr class="key"><td>谁决定谁</td><td>基因型决定表现型</td><td>表现型是基因型 + 环境的表现</td></tr>
<tr><td>F₂ 里的比例</td><td>DD∶Dd∶dd＝1∶2∶1</td><td>高茎∶矮茎＝3∶1</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只高亮一行：<b>基因型决定表现型，反过来不成立</b>。所以「高茎」这个信息永远推不出「DD」——Dd 也是高茎。凡是题干只告诉你表现型，就必须用自交或测交再验一次，这是本节所有推断题的总开关。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 一对相对性状的自交推断<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">豌豆的高茎（D）对矮茎（d）为显性。让一株高茎豌豆（基因型为 Dd）自交，得到 F₁。求：① F₁ 的基因型及其比例；② F₁ 中高茎与矮茎的比例；③ F₁ 的高茎植株里，纯合子占多少。选择题可先列四个选项：A 1∶1、B 3∶1、C 1∶2∶1、D 9∶3∶3∶1。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题：先把亲本定死</p>
<p class="s-b">题干直接给了「基因型为 Dd」，所以亲本两边都是 Dd，这是一次<b>自交</b>，不是杂交、也不是自由交配。别被「高茎」两个字带跑：高茎只是表现型，题目已经把基因型写明了。</p>
<p class="s-k">用到：自交＝基因型相同的两个个体交配；Dd 是杂合子。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 写配子：先拆成两半</p>
<p class="s-b">Dd 形成配子时，成对的 D 和 d 彼此分离，分别进入不同配子，所以产生 D、d 两种配子，比 1∶1。两侧亲本都一样，于是棋盘横竖都写 D、d。</p>
<p class="s-k">用到：分离定律的实质——成对的遗传因子分开，一个配子只带一个。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 画棋盘，数基因型</p>
<p class="s-b">4 格交叉得到 DD、Dd、Dd、dd。按种类合并：DD 1 格、Dd 2 格、dd 1 格，所以 <b>DD∶Dd∶dd＝1∶2∶1</b>。这一步只数基因型，不要提前管高矮。</p>
<p class="s-k">用到：棋盘法；4 个格子机会均等。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 换成表现型</p>
<p class="s-b">DD 是高茎，Dd 也是高茎（显性盖住隐性），dd 是矮茎。所以高茎＝1＋2＝3 格，矮茎＝1 格，<b>高茎∶矮茎＝3∶1</b>。注意 3∶1 是<b>统计结果</b>，种得少的时候完全可能种出 2 高 2 矮。</p>
<p class="s-k">用到：显性性状、隐性性状；3∶1 的适用条件是「大量个体」。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 第③问的陷阱：分母换了</p>
<p class="s-b">问的是「高茎植株里」纯合子占多少，分母只剩 3 格（DD＋Dd），不是 4 格。DD 占 1 格，所以是 1/3。同一个棋盘，问「全部 F₁ 里 DD 占多少」答案是 1/4——<b>换个问法就换分母</b>，这是失分最多的一处。</p>
<p class="s-k">用到：在指定范围内求比例；先确定分母再写分数。</p>
</li>
</ol>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">

<div class="qac">
<p class="q">「F₂ 里高茎∶矮茎就是 3∶1，这还有什么可问的？」</p>
<p class="a">3∶1 是<b>大量个体统计出来的期望比例</b>，不是每一胎、每一荚都成立。种 4 株豌豆，出现 2 高 2 矮完全正常；种到几百株，比例才往 3∶1 收。答题时「≈」和「统计」两个词最好都写上，只写 3∶1 会被扣分。</p>

<div class="qac">
<p class="q">「F₁ 全是高茎，那它的基因型不就是 DD 吗？」</p>
<p class="a">不是。F₁ 只<b>表现</b>显性性状，同时<b>含隐性遗传因子</b>，基因型是 Dd。证据就是 F₂ 里矮茎重新出现——矮茎的 dd 只能来自 F₁ 给的 d。所以「表现高茎」永远推不出「纯合」。</p>

<div class="qac">
<p class="q">「测交为什么一定要用隐性纯合子？用显性纯合子不行吗？」</p>
<p class="a">测交用<b>隐性纯合子</b>，因为它只产生一种带隐性遗传因子的配子，<b>不掩盖</b>待测个体的任何配子。若换成 DD，后代一律是高茎，待测个体是 DD 还是 Dd 都看不出来，测了等于没测。</p>

<p class="a">关键是<b>双方基因型是否相同</b>。Dd 自交，两边都出 D 和 d，后代 1∶2∶1、表现型 3∶1；Dd 与 dd 杂交，一方只能出 d，后代 1 Dd∶1 dd、表现型 1∶1。同一株 Dd，换个对手，比例就换一套。</p>

<div class="qac">
<p class="q">「连续自交，杂合子是减半还是不变？」</p>
<p class="a">每自交一代，杂合子减半：<b>n 代后杂合子＝(1/2)ⁿ</b>。n=1 是 50%，n=2 是 25%，n=4 只剩 6.25%，其余都变成纯合子。所以连续自交能<b>提高纯合度</b>，育种上就用这个办法提纯。</p>

<p class="a">发生在<b>减数第一次分裂后期</b>：同源染色体分开，成对的遗传因子随之<b>彼此分离</b>，进入不同的配子。「雌雄配子随机结合」是<b>受精</b>时的事，不是分离定律的实质，两者别混在一句话里。</p>

<p class="gx-note">六问其实是同一件事：都在问「这一对遗传因子，最后进了哪个配子」。凡是想不清的地方，回到「配子只带一个」和「3∶1 是统计结果」这两句话上，都能落地。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">

<div class="er">
<p class="er-x">✗ F₂ 中高茎∶矮茎一定是 3∶1，每次都是。</p>
<p class="er-v">✓ F₂ 中显性∶隐性≈3∶1，这是大量个体统计得到的结果。</p>
<p class="er-w">错在哪：把统计规律当成必然定数。样本少时 2∶2、5∶1 都可能出现，答题必须带「≈／统计」。</p>
</div>

<div class="er">
<p class="er-x">✗ F₁ 全部是高茎，所以 F₁ 的基因型都是 DD。</p>
<p class="er-v">✓ F₁ 只表现显性性状，但含隐性遗传因子，基因型是 Dd。</p>
<p class="er-w">错在哪：把表现型当基因型。Dd 里的 d 被 D 盖住但没消失，F₂ 的矮茎就是它的证据。</p>
</div>

<div class="er">
<p class="er-x">✗ 测交就是把待测个体和显性纯合子交配。</p>
<p class="er-v">✓ 测交用隐性纯合子，后代出现 1∶1 就说明待测个体是杂合子。</p>
<p class="er-w">错在哪：对方换成 DD，后代全为高茎，显隐性两种待测个体分不出来，测交失去意义。</p>
</div>

<div class="er">
<p class="er-x">✗ 分离定律的实质是雌雄配子随机结合。</p>
<p class="er-v">✓ 分离定律的实质是形成配子时，成对的遗传因子彼此分离，分别进入不同配子。</p>
<p class="er-w">错在哪：随机结合是受精环节，属于「配子如何相遇」；分离定律讲的是「配子如何形成」。</p>
</div>

<div class="er">
<p class="er-x">✗ 高茎豌豆的基因型是 DD。</p>
<p class="er-v">✓ 高茎豌豆的基因型可能是 DD，也可能是 Dd。</p>
<p class="er-w">错在哪：显性性状对应至少两种基因型。要确定必须再做自交或测交，看后代是否出现矮茎。</p>
</div>

<div class="er">
<p class="er-x">✗ Dd 个体产生的配子是 Dd。</p>
<p class="er-v">✓ Dd 个体产生 D 和 d 两种配子，比例为 1∶1，每个配子只带一个遗传因子。</p>
<p class="er-w">错在哪：配子中遗传因子不成对。个体成对、配子单个，写配子那一步永远只有一个字母。</p>
</div>

<div class="er">
<p class="er-x">✗ 自交和自由交配是一回事，算出来的比例当然一样。</p>
<p class="er-v">✓ 连续自交时杂合子按 (1/2)ⁿ 逐代减半；自由交配时基因型频率一次就稳定下来，不再改变。</p>
<p class="er-w">错在哪：自交每代都要把一半杂合子拆成纯合子，纯合度越走越高；自由交配只由基因频率决定基因型频率，稳定后不再变化。多代以后两者差别越来越大。</p>
</div>

document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var GX = window.GX, el = GX.el, tx = GX.tx, $ = GX.$;
  var stage = $("gxStage");
  if (!stage || !window.AutoPilot) return;

  /* 两套坐标：宽屏 880×470，窄屏独立 360×700 */
  var W = { vb: "0 0 880 470", left: { x: 16, y: 16, w: 424, h: 438 }, right: { x: 456, y: 16, w: 408, h: 438 } };
  var N = { vb: "0 0 360 700", left: { x: 8, y: 8, w: 344, h: 300 }, right: { x: 8, y: 320, w: 344, h: 372 } };
  var L = W, A = 1, G = null;

  /* 唯一真值：连续自交代数 n → 群体里三种基因型的比例 */
  function calc(v) {
    var n = Math.max(1, Math.min(5, Math.round(v)));
    var het = Math.pow(0.5, n);          /* 杂合子 Aa 的比例 */
    var dom = 0.5 + het / 2;             /* 显性表现型 = AA + Aa */
    var rec = (1 - het) / 2;             /* 隐性 aa 的比例 */
    return { n: n, het: het, dom: dom, rec: rec, ratio: dom / rec };
  }

  function geom() {
    var lf = L.left, rt = L.right;
    return {
      lb: { x: lf.x + 22, y: lf.y + 56, w: lf.w - 44, h: 24 },
      lgY: lf.y + 92,
      ladY: lf.y + 146,
      rowH: Math.min(38, (lf.h - 162) / 5),
      px: rt.x + 46, py: rt.y + 56,
      pw: rt.w - 74, ph: rt.h - 148

  }

  function pct(x) { return (x * 100).toFixed(1) + "%"; }

  function draw() {
    var s = calc(A), gA = $("gxA"), gB = $("gxB"), lf = L.left, rt = L.right;
    var i, k, y, w, x, cx, cy, b = G.lb;
    gA.textContent = ""; gB.textContent = "";
    el("rect", { x: lf.x, y: lf.y, width: lf.w, height: lf.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    el("rect", { x: rt.x, y: rt.y, width: rt.w, height: rt.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    tx(gA, lf.x + 22, lf.y + 30, "这一群里三种基因型各占多少", "#5a6472", "start", 10.5, 700);
    tx(gB, rt.x + 22, rt.y + 30, "显性表现型比例：n 每加 1 就更靠近 1∶1", "#5a6472", "start", 10.5, 700);

    /* 左：100% 堆叠条 —— 绿 AA / 蓝 Aa / 红 aa */
    var segs = [{ f: s.rec, c: "#cfece0", e: "#7fc3a4", t: "AA" },
                { f: s.het, c: "#cfe3f2", e: "#7fb5d0", t: "Aa" },
                { f: s.rec, c: "#f6d9d3", e: "#d8a99e", t: "aa" }];
    x = b.x;
    for (i = 0; i < 3; i++) {
      w = b.w * segs[i].f;
      el("rect", { x: x, y: b.y, width: Math.max(1, w), height: b.h, rx: 4, fill: segs[i].c, stroke: segs[i].e }, gA);
      if (w > 46) tx(gA, x + w / 2, b.y + 16, segs[i].t, "#3a3a35", "middle", 9.6, 700);
      x += w;
    }

    /* 左：图例（带当前百分比） */
    var lg = [[s.rec, "#cfece0", "AA 纯合 · 高茎"], [s.het, "#cfe3f2", "Aa 杂合 · 高茎"], [s.rec, "#f6d9d3", "aa 纯合 · 矮茎"]];
    for (i = 0; i < 3; i++) {
      y = G.lgY + i * 18;
      el("rect", { x: lf.x + 26, y: y - 8, width: 10, height: 10, rx: 2, fill: lg[i][1], stroke: "#c3cfd8" }, gA);
      tx(gA, lf.x + 42, y, lg[i][2], "#3a3a35", "start", 9.4, 400);
      tx(gA, lf.x + lf.w - 24, y, pct(lg[i][0]), "#151a21", "end", 9.6, 700);
    }

    /* 左：n=1…5 的杂合子比例阶梯 */
    var maxW = lf.w - 152;
    for (k = 1; k <= 5; k++) {
      y = G.ladY + (k - 1) * G.rowH;
      var hk = Math.pow(0.5, k), bh = Math.min(13, G.rowH - 11);
      var on = (k === s.n);
      tx(gA, lf.x + 24, y + bh, "n=" + k, on ? "#151a21" : "#5a6472", "start", 9.2, on ? 700 : 400);
      el("rect", { x: lf.x + 62, y: y, width: Math.max(3, maxW * hk / 0.5), height: bh, rx: 3,
        fill: on ? "#1d5a80" : "#dbe9f4", stroke: on ? "#1d5a80" : "#b8d9ea" }, gA);
      tx(gA, lf.x + 62 + maxW * hk / 0.5 + 8, y + bh, pct(hk), on ? "#151a21" : "#7a8694", "start", 8.8, on ? 700 : 400);
    }
    if (G.rowH > 30) tx(gA, lf.x + 22, G.ladY + 5 * G.rowH + 18, "每自交一代，杂合子砍一半：(1/2)ⁿ", "#5a6472", "start", 9.2, 400);

    /* 右：曲线 —— 显性表现型比例 vs n */
    var yOf = function (d) { return G.py + G.ph - (d - 0.45) / 0.55 * G.ph; };
    var xOf = function (n) { return G.px + (n - 1) / 4 * G.pw; };
    var gl = [[0.5, "1∶1", "#b8402f"], [0.75, "3∶1", "#2f8a5b"], [1, "100%", "#9aa6b2"]];
    for (i = 0; i < 3; i++) {
      y = yOf(gl[i][0]);
      el("line", { x1: G.px, y1: y, x2: G.px + G.pw, y2: y, stroke: gl[i][2], "stroke-width": 1, "stroke-dasharray": "4 4", opacity: 0.5 }, gB);
      tx(gB, G.px - 8, y + 3, gl[i][1], gl[i][2], "end", 8.6, 400);
    }
    el("line", { x1: G.px, y1: G.py, x2: G.px, y2: G.py + G.ph, stroke: "#c3cfd8", "stroke-width": 1 }, gB);
    el("line", { x1: G.px, y1: G.py + G.ph, x2: G.px + G.pw, y2: G.py + G.ph, stroke: "#c3cfd8", "stroke-width": 1 }, gB);
    var pts = "";
    for (k = 1; k <= 5; k++) {
      pts += xOf(k).toFixed(1) + "," + yOf(calc(k).dom).toFixed(1) + " ";
      el("circle", { cx: xOf(k), cy: yOf(calc(k).dom), r: 3.4, fill: "#1d5a80" }, gB);
      tx(gB, xOf(k), G.py + G.ph + 15, "n=" + k, "#7a8694", "middle", 8.4, 400);
    }
    el("polyline", { points: pts, fill: "none", stroke: "#1d5a80", "stroke-width": 2 }, gB);
    cx = xOf(s.n); cy = yOf(s.dom);
    el("line", { x1: cx, y1: cy, x2: cx, y2: G.py + G.ph, stroke: "#b8402f", "stroke-width": 1, "stroke-dasharray": "3 3" }, gB);
    el("circle", { cx: cx, cy: cy, r: 5.5, fill: "#b8402f", stroke: "#ffffff", "stroke-width": 1.6 }, gB);
    tx(gB, cx, cy - 12, "n=" + s.n, "#b8402f", "middle", 9.4, 700);

    /* 右：面板下方数值 */
    y = G.py + G.ph + 40;

    tx(gB, rt.x + 24, y + 20, "显性∶隐性 ≈ " + s.ratio.toFixed(2) + "∶1", "#b8402f", "start", 10, 700);
    tx(gB, rt.x + 24, y + 40, "3∶1 会一直向 1∶1 滑，但永远不等于 1∶1", "#5a6472", "start", 9, 400);
  }

    if (!G) { L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N; stage.setAttribute("viewBox", L.vb); G = geom(); }
