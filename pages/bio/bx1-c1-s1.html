<p class="gx-claim">细胞学说其实只说了一件事：<b>一切动植物都由细胞构成</b>。所以细胞是生命活动的<b>基本单位</b>，也是生命系统里<b>最小的那一层</b>。</p>

<!-- ================= A ================= -->
<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写的是左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 细胞学说的内容<span class="q-src">人教版（2019）必修1 · 第1章第1节</span></p>
<p class="q-b">细胞是一个有机体，一切动植物都由细胞发育而来，并由细胞和细胞产物所构成；细胞是一个相对独立的单位，既有它自己的生命，又对与其他细胞共同组成的整体的生命起作用；新细胞是由老细胞分裂产生的。</p>
<p class="q-n">→ 翻成人话：① 动植物都是「从细胞长出来的」；② 细胞自己能活，也能配合整体干活；③ 新细胞只能由老细胞分裂得到，不能凭空产生。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 细胞学说的意义<span class="q-src">人教版（2019）必修1 · 第1章第1节</span></p>
<p class="q-b">细胞学说揭示了动物和植物的统一性，从而阐明了生物界的统一性。细胞学说的建立，标志着生物学的研究进入细胞水平。</p>
<p class="q-n">→ 翻成人话：在细胞学说之前，植物学和动物学是两门各管各的学问；有了它，才知道两边「底子是同一个」。注意是<b>细胞水平</b>，不是分子水平。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 生命活动离不开细胞<span class="q-src">人教版（2019）必修1 · 第1章第1节</span></p>
<p class="q-b">生命活动离不开细胞。病毒没有细胞结构，但必须寄生在活细胞中才能生活。</p>
<p class="q-n">→ 翻成人话：单细胞生物靠一个细胞完成全部生命活动；多细胞生物靠各种分化的细胞密切合作；病毒连细胞都没有，只能「借」别人的细胞活着。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>看谁</th><th>细胞学说说的是谁</th><th>为什么不能扩大</th></tr></thead>
<tbody>
<tr class="key"><td>对象</td><td>一切<b>动植物</b></td><td>病毒没有细胞结构，说成「一切生物」就错了</td></tr>
<tr><td>来源</td><td>由细胞发育而来，由细胞和细胞产物构成</td><td>细胞产物（如细胞外基质）也是「细胞造的」</td></tr>
<tr><td>地位</td><td>相对独立的单位</td><td>「相对」两个字不能丢：离体太久就活不了</td></tr>
<tr><td>产生</td><td>新细胞由老细胞分裂产生</td><td>这一句是魏尔肖（1858）补充的，不是施莱登、施旺</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">背的时候按「对象—来源—地位—产生」四格记，比整段死背好还原。考「细胞学说的内容」时，写完三句就够了。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。这道题考的不是知识，是「能不能分清支持与不支持」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 哪一项「不支持」细胞是生命活动的基本单位<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">下列事实或证据中，<b>不支持</b>「细胞是生命活动的基本单位」的是（　　）<br>
A. 草履虫是单细胞生物，能进行运动和分裂<br>
B. 人体发育离不开细胞的分裂和分化<br>
C. 离体的叶绿体在一定的条件下能释放氧气<br>
D. 用手抓握物体需要一系列神经细胞和肌肉细胞的协调配合</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 先看问的是「支持」还是「不支持」</p>
<p class="s-b">题干是「<b>不支持</b>」。这类题四个选项里三个在举例证明「生命活动离不开细胞」，只有一个在说「离开细胞也能干」，那就是答案。</p>
<p class="s-k">用到：审题——先圈出否定词。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · A 项：单细胞生物</p>
<p class="s-b">草履虫一个细胞就完成了运动、分裂等全部生命活动，正好说明「细胞是基本单位」。→ <b>支持</b>，不选。</p>
<p class="s-k">用到：单细胞生物靠一个细胞完成所有生命活动。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · B 项、D 项：多细胞生物靠细胞合作</p>
<p class="s-b">人体发育靠细胞分裂和分化；抓握靠神经细胞与肌肉细胞协同。两者都在说「多细胞生物的生命活动也建立在细胞上」。→ <b>支持</b>，不选。</p>
<p class="s-k">用到：多细胞生物依赖各种分化的细胞密切合作。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · C 项：叶绿体是细胞器，不是细胞</p>
<p class="s-b">叶绿体离体后仍能释放氧气（进行光合作用），说明<b>某些生命活动并不必须在完整细胞中进行</b>。它证明的是「细胞器有功能」，不是「细胞是基本单位」。→ <b>不支持</b>，选它。</p>
<p class="s-k">用到：细胞器的功能 ≠ 细胞是生命活动的基本单位。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 写成答题卡语言</p>
<p class="s-b">先给结论（选 C），再给理由（叶绿体是细胞器，离体后仍能完成光合作用这一生命活动），最后回扣题干（因此不能支持细胞是生命活动的基本单位）。</p>
<p class="s-k">用到：选择题也要写「依据」，不能只写字母。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">选 <b>C</b>。叶绿体是细胞内的细胞器，离体后在一定条件下仍能进行光合作用释放氧气，说明某些生命活动并不必须在完整细胞中进行；因此这一事实不能支持「细胞是生命活动的基本单位」。<br>A、B、D 三项分别说明单细胞生物、多细胞生物的发育和生命活动都以细胞为基础，都能支持题干观点。</p>
</div>
</div>
</section>

<script>
/* 互动脚本：生命系统结构层次 1–9 → 台阶高亮 + 该层次说明 */
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var GX = window.GX, el = GX.el, tx = GX.tx, $ = GX.$;
  var stage = $("gxStage");
  if (!stage || !window.AutoPilot) return;

  var LV = [
    { n: "细胞", eg: "心肌细胞", why: "生命系统最基本的层次", extra: "分子、原子不属于生命系统的层次", kind: 0, kt: "最基本", ks: "再往下就不是生命系统了" },
    { n: "组织", eg: "心肌组织", why: "形态相似、结构和功能相同的细胞联合在一起", extra: "植物有保护组织、输导组织等", kind: 1, kt: "中间层", ks: "由多个细胞联合而成" },
    { n: "器官", eg: "心脏", why: "不同的组织按照一定的次序结合在一起", extra: "植物的根、茎、叶都是器官", kind: 1, kt: "中间层", ks: "由多种组织构成" },
    { n: "系统", eg: "循环系统", why: "能够共同完成一种或几种生理功能的多个器官", extra: "植物没有这一层次", kind: 1, kt: "中间层", ks: "器官联合起来完成一套功能" },
    { n: "个体", eg: "一只小鼠", why: "能独立完成生命活动的生物个体", extra: "单细胞生物的细胞＝个体", kind: 1, kt: "中间层", ks: "一个能独立生活的整体" },
    { n: "种群", eg: "这片区域全部小鼠", why: "一定空间范围内同种生物的所有个体", extra: "关键词是「同种」", kind: 1, kt: "中间层", ks: "同种生物的全部个体" },
    { n: "群落", eg: "这片区域全部生物", why: "一定区域内所有种群组成的整体", extra: "必须包含该区域的全部生物", kind: 1, kt: "中间层", ks: "所有种群的总和" },
    { n: "生态系统", eg: "草地＋阳光、空气…", why: "生物群落与它的无机环境相互作用形成的统一整体", extra: "生物 ＋ 无机环境", kind: 1, kt: "中间层", ks: "群落再加无机环境" },
    { n: "生物圈", eg: "地球上全部生物及其环境", why: "地球上最大的生态系统", extra: "最大的生命系统", kind: 2, kt: "最大", ks: "地球上最大的生态系统" }
  ];

  var W = { vb: "0 0 880 470", lad: { x: 36, y: 64, w: 208, h: 372 }, info: { x: 292, y: 64, w: 560, h: 372 } };
  var N = { vb: "0 0 360 700", lad: { x: 8, y: 44, w: 344, h: 288 }, info: { x: 8, y: 344, w: 344, h: 344 } };
  var L = W, A = 1;

  function calc(v) {
    var n = Math.max(1, Math.min(9, Math.round(v)));
    return { pos: n, above: n - 1, kind: n === 1 ? 0 : (n === 9 ? 2 : 1) };
  }

  function draw() {
    var gA = $("gxA"), gB = $("gxB");
    gA.textContent = ""; gB.textContent = "";
    var n = Math.round(A), i, rowH = L.lad.h / 9, top = L.lad.y;

    if (L === W) {
      tx(gA, L.lad.x, top - 22, "生命系统：由低到高", "#5a6472", "start", 10.5, 700);
      tx(gA, L.lad.x + L.lad.w, top - 22, "越往上，包含的对象越多", "#9aa3ae", "end", 9.5, 400);
      el("line", { x1: L.lad.x + 8, y1: top + 2, x2: L.lad.x + 8, y2: top + L.lad.h - 2, stroke: "#dfe6ec", "stroke-width": 1, "stroke-dasharray": "3 4" }, gA);
    } else {
      tx(gA, 8, 28, "生命系统：由低到高（共 9 级）", "#5a6472", "start", 10, 700);
    }

    for (i = 0; i < 9; i++) {
      var y = top + L.lad.h - (i + 1) * rowH;
      var on = (i + 1) === n;
      var pad = L === W ? 4 : 3;
      el("rect", {
        x: L.lad.x, y: y + pad, width: L.lad.w, height: rowH - pad * 2, rx: 8,
        fill: on ? "#0f8a5f" : "#ffffff", stroke: on ? "#0b6b49" : "#e1e8ee", "stroke-width": on ? 2 : 1
      }, gA);
      tx(gA, L.lad.x + 12, y + rowH / 2 + 3.6, String(i + 1), on ? "#d8f3e6" : "#9aa3ae", "start", 8.5, 700);
      var fs = L === W ? 11 : 9.6;
      tx(gA, L.lad.x + L.lad.w / 2 + 6, y + rowH / 2 + (fs * 0.36), LV[i].n, on ? "#ffffff" : "#3a3a35", "middle", fs, on ? 700 : 400);
      if (L === W && on) {
        el("circle", { cx: L.lad.x + L.lad.w - 12, cy: y + rowH / 2, r: 3.2, fill: "#ffffff" }, gA);
      }
    }

    var d = LV[n - 1];
    if (L === W) {
      tx(gB, L.info.x, L.info.y + 34, d.n, "#0b5c42", "start", 27, 700);
      tx(gB, L.info.x + 116, L.info.y + 34, "第 " + n + " / 9 级", "#9aa3ae", "start", 11, 400);
      el("rect", { x: L.info.x, y: L.info.y + 52, width: 132, height: 24, rx: 12, fill: "#edfaf3", stroke: "#b3e2c7" }, gB);
      tx(gB, L.info.x + 66, L.info.y + 68, d.kt, "#0b5c42", "middle", 10.5, 700);
      tx(gB, L.info.x, L.info.y + 106, "举例", "#9aa3ae", "start", 9.5, 400);
      tx(gB, L.info.x, L.info.y + 126, d.eg, "#3a3a35", "start", 12.5, 700);
      tx(gB, L.info.x, L.info.y + 162, "凭什么算这一级", "#9aa3ae", "start", 9.5, 400);
      wrap(gB, L.info.x, L.info.y + 182, d.why, 470, 11.5, "#3a3a35", 18);
      el("line", { x1: L.info.x, y1: L.info.y + 250, x2: L.info.x + L.info.w, y2: L.info.y + 250, stroke: "#e6e9ee" }, gB);
      tx(gB, L.info.x, L.info.y + 274, "这一级的「专属提醒」", "#9aa3ae", "start", 9.5, 400);
      wrap(gB, L.info.x, L.info.y + 294, d.extra, 470, 11, "#8a5c14", 18);
      var hint = n === 1 ? "「最基本」意味着：往下再拆，就不再是生命系统了。"
        : n === 9 ? "「最大」意味着：再往上没有更大的生命系统了。"
        : "往上一级：" + LV[n].n + "；往下一级：" + LV[n - 2].n + "。";
      tx(gB, L.info.x, L.info.y + L.info.h - 8, hint, "#5a6472", "start", 10, 400);
    } else {
      tx(gB, L.info.x + 4, L.info.y + 30, d.n, "#0b5c42", "start", 20, 700);
      tx(gB, L.info.x + 4 + 8 + d.n.length * 20, L.info.y + 30, "第 " + n + " / 9 级", "#9aa3ae", "start", 10, 400);
      el("rect", { x: L.info.x + 4, y: L.info.y + 42, width: 104, height: 22, rx: 11, fill: "#edfaf3", stroke: "#b3e2c7" }, gB);
      tx(gB, L.info.x + 56, L.info.y + 57, d.kt, "#0b5c42", "middle", 9.5, 700);
      tx(gB, L.info.x + 4, L.info.y + 90, "举例：" + d.eg, "#3a3a35", "start", 10.5, 700);
      wrap(gB, L.info.x + 4, L.info.y + 112, "说明：" + d.why, 320, 10.5, "#3a3a35", 17);
      wrap(gB, L.info.x + 4, L.info.y + 176, "提醒：" + d.extra, 320, 10.5, "#8a5c14", 17);
      tx(gB, L.info.x + 4, L.info.y + 224, n === 1 ? "往下拆：不再属于生命系统" : "上一级：" + LV[n].n + "　下一级：" + LV[n - 2].n, "#5a6472", "start", 9.5, 400);
    }
  }

  /* 按宽度换行：每行最多 maxChars 个汉字，超过就换行 */
  function wrap(parent, x, y, s, maxW, fs, col, lh) {
    var per = Math.max(6, Math.floor(maxW / fs));
    var lines = [], cur = "";
    for (var i = 0; i < s.length; i++) {
      cur += s.charAt(i);
      if (cur.length >= per) { lines.push(cur); cur = ""; }
    }
    if (cur) lines.push(cur);
    for (var k = 0; k < lines.length; k++) tx(parent, x, y + k * lh, lines[k], col, "start", fs, 400);
  }

  function render() {
    var c = calc(A), d = LV[c.pos - 1];
    $("gxVa").textContent = d.n;
    $("gxVb").textContent = c.pos + " / 9";
    $("gxVc").textContent = String(c.above);
    $("gxVs").textContent = d.kt;
    $("gxVsn").textContent = d.ks;
    $("gxStBox").style.background = c.kind === 0 ? "#fdf3e0" : (c.kind === 2 ? "#e6f6ee" : "#ffffff");
    $("gxStBox").style.borderColor = c.kind === 0 ? "#e2c98d" : (c.kind === 2 ? "#8bc5a5" : "#dde2e8");
    $("gxVs").style.color = c.kind === 0 ? "#8a5c14" : (c.kind === 2 ? "#1e6640" : "#151a21");
    draw();
  }

  function layout() {
    var wide = stage.parentElement.getBoundingClientRect().width >= 640;
    L = wide ? W : N;
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  $("gxSl").value = "1";
  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 1 }, { t: 3.2, v: 1 }, { t: 5.4, v: 4 }, { t: 7.6, v: 6 }, { t: 9.6, v: 9 }, { t: 12.2, v: 9 }, { t: 14.4, v: 1 }],
    keys: [1, 3, 5, 7, 9],
    value: 1, min: 1, max: 9, step: 1,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__bio = { calc: calc, cases: [
    { v: 1, eq: { pos: 1, above: 0, kind: 0 } },
    { v: 4, eq: { pos: 4, above: 3, kind: 1 } },
    { v: 6, eq: { pos: 6, above: 5, kind: 1 } },
    { v: 9, eq: { pos: 9, above: 8, kind: 2 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
