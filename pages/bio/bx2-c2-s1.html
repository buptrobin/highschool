<p class="gx-lede">这一节是第2章的开头：先讲清配子是怎么造出来的（减数分裂），再讲清配子怎么合起来（受精作用）。后面「基因在染色体上」「孟德尔定律的实质」全都要拿这一节的染色体数目去推，所以这里的数错一格，后面全错。课文只有三段话，但考试专挑三个地方扣分：复制几次分裂几次、减Ⅱ后期染色体数到底几、减Ⅰ和减Ⅱ分离开的分别是什么。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边的句子，不写右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 减数分裂的概念<span class="q-src">人教版（2019）必修2 · 第2章第1节</span></p>
<p class="q-b">减数分裂是进行有性生殖的生物，在产生成熟生殖细胞时进行的染色体数目减半的细胞分裂。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个条件</b>组成——① 只发生在<b>进行有性生殖</b>的生物；② 只发生在<b>产生成熟生殖细胞</b>时（体细胞增殖、无性生殖都不算）；③ 结果是<b>染色体数目减半</b>。三个条件少一个就不叫减数分裂。答题时写「染色体数目减半」，不要写「细胞变小了」「细胞数量变多了」。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 两次分裂的数字<span class="q-src">人教版（2019）必修2 · 第2章第1节</span></p>
<p class="q-b">减数分裂过程中，染色体复制一次，细胞连续分裂两次，结果成熟生殖细胞中的染色体数目比原始生殖细胞减少一半。</p>
<p class="q-n">→ 两个数字要刻死：<b>复制 1 次、分裂 2 次</b>。复制 1 次，所以 DNA 数由 4 变成 8；分裂 2 次，所以染色体数在减Ⅰ末由 4 减到 2，减Ⅱ后期着丝粒分裂时暂时回到 4，末期再回到 2，最后配子是 2 条。写成「复制两次」或「分裂一次」直接整题不得分。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 受精作用的意义<span class="q-src">人教版（2019）必修2 · 第2章第1节</span></p>
<p class="q-b">受精作用使受精卵中的染色体数目又恢复到体细胞的数目，其中一半来自父方、一半来自母方。</p>
<p class="q-n">→ 三个关键词：<b>恢复</b>（是针对「减半」说的）、<b>一半来自父方、一半来自母方</b>、恢复的是<b>染色体数目</b>而不是 DNA 数。由此得到一条推论：有性生殖后代的染色体数能代代稳定，靠的就是「减半 + 恢复」这一对动作互相抵消。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>有丝分裂</th><th>减数分裂</th></tr></thead>
<tbody>
<tr><td>染色体复制次数</td><td>1 次（间期）</td><td>1 次（减Ⅰ前的间期）</td></tr>
<tr><td>细胞分裂次数</td><td>1 次</td><td>连续 2 次</td></tr>
<tr><td>同源染色体的行为</td><td>不联会、不分离，各自独立</td><td>减Ⅰ前期联会成四分体，<b>减Ⅰ后期同源染色体分离</b></td></tr>
<tr class="key"><td>子细胞染色体数（体细胞 2n=4）</td><td>仍是 4，与母细胞相同</td><td>减半，配子是 2</td></tr>
<tr><td>着丝粒分裂</td><td>后期分裂 1 次</td><td>只在减Ⅱ后期分裂 1 次</td></tr>
<tr><td>产生几个子细胞</td><td>2 个</td><td>4 个（雄性 4 个精子，雌性 1 个卵细胞 + 3 个极体）</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只高亮 1 行。记法：判断一个细胞在做什么，先看「有没有同源染色体的联会或分离」——有就是减Ⅰ；没有就再看「着丝粒有没有分裂」——有就是后期（分裂后数染色体的个数要按着丝粒数，不是按染色单体数）。</p>
</section>

<section class="gx-sec" id="b">

<div class="gx-ex">
<p class="ex-t">例题 · 减Ⅱ后期的两个数字<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">某动物的体细胞中有 4 条染色体（2n=4）。请回答：(1) 该动物某个细胞处于减数第二次分裂后期时，细胞内的染色体数和 DNA 数分别是多少？(2) 这个细胞最终形成的配子中，染色体数是多少？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题，先把「复制几次」定下来</p>
<p class="s-b">题干给的是体细胞 2n=4。减数分裂前只复制一次，所以进入分裂时每条染色体上有 2 条姐妹染色单体，DNA 由 4 变成 8。这一步定错了，后面两个数全错。</p>
<p class="s-k">用到：染色体复制一次，DNA 数 4→8。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 算 DNA：数「减半」发生过几次</p>
<p class="s-b">复制 1 次得 8；减Ⅰ末细胞一分为二，每个细胞 DNA 减半为 4。减Ⅱ后期着丝粒分裂只是把姐妹染色单体分开，没有新合成 DNA，所以 DNA 仍是 4。</p>
<p class="s-k">用到：DNA 数只在减Ⅰ末和减Ⅱ末各减半一次。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 算染色体：数着丝粒，不数染色单体</p>
<p class="s-b">减Ⅱ后期着丝粒一分为二，原来的姐妹染色单体各自成为一条染色体，染色体数在这一瞬间加倍。注意基数不是 4：减Ⅰ末已经减半成 2 条，所以减Ⅱ前期/中期是 2 条，着丝粒分裂后回到 4 条。</p>
<p class="s-k">用到：着丝粒分裂使染色体数由 2 暂时回到 4，DNA 数不变。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 走到末期，把「暂时」收回来</p>
<p class="s-b">减Ⅱ末期细胞再分裂一次，每条染色体各进一个配子，配子里是 2 条。所以 4 只是后期那一小段的暂态值，不能当成配子的数。</p>
<p class="s-k">用到：后期加倍是暂态，末期回到体细胞的一半。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 用「3 个可能的组合」反查时期</p>
<p class="s-b">回看：染色体 4、DNA 4。若写成 2 条 / 4 个，那是减Ⅱ前期或中期（着丝粒还没分裂）；若写成 2 条 / 2 个，那是配子。染色体数从 2 跳回 4 的这一小段，只出现在减Ⅱ后期。</p>
<p class="s-k">用到：减Ⅱ三个阶段的「染色体数 / DNA 数」组合互不相同。</p>
</li>
</ol>

<p class="ans-b">(1) 染色体数为 4 条，DNA 数为 4 个。理由：减数分裂前染色体只复制一次，DNA 由 4 增至 8；减Ⅰ末期细胞分裂一次，染色体数和 DNA 数同时减半，分别为 2 条和 4 个；减Ⅱ后期着丝粒分裂，姐妹染色单体分开成为染色体，染色体数暂时加倍回到 4 条，而 DNA 数不变，仍为 4 个。(2) 配子中染色体数为 2 条，是体细胞的一半（n=2）。</p>

<script>
/* 互动脚本本体（由 build-page.mjs 包进 <script> 里，所以这里不要写 <script> 标签） */
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var GX = window.GX, el = GX.el, tx = GX.tx, $ = GX.$;
  var stage = $("gxStage");
  if (!stage || !window.AutoPilot) return;

  /* 两套坐标：宽屏 880×470，窄屏独立 360×700 */
  var W = { vb: "0 0 880 470", left: { x: 16, y: 16, w: 424, h: 438 }, right: { x: 456, y: 16, w: 408, h: 438 } };
  var N = { vb: "0 0 360 700", left: { x: 8, y: 8, w: 344, h: 300 }, right: { x: 8, y: 320, w: 344, h: 372 } };
  var L = W, A = 0, G = null;

  /* 纯函数：减数分裂进程 p → 染色体数 / DNA 数。render() 与 __bio.cases 都用它 */
  function calc(v) {
    var chrom = v < 75 ? 4 : v < 88 ? 2 : v < 97 ? 4 : 2;
    var dna = v < 20 ? 4 + 4 * v / 20 : v < 75 ? 8 : v < 97 ? 4 : 2;
    return { chrom: chrom, dna: dna, hl: (v >= 88 && v < 97) ? 1 : 0 };
  }
  function phase(v) {
    if (v < 20) return { t: "间期", s: "DNA 正在复制 4→8" };
    if (v < 40) return { t: "减Ⅰ前期", s: "同源染色体联会成四分体" };
    if (v < 60) return { t: "减Ⅰ后期", s: "同源染色体分离 4→2" };
    if (v < 75) return { t: "减Ⅰ末期", s: "细胞一分为二，DNA 8→4" };
    if (v < 88) return { t: "减Ⅱ前/中期", s: "2 条，着丝粒未分裂" };
    if (v < 97) return { t: "减Ⅱ后期", s: "着丝粒分裂，染色体 2→4" };
    if (v < 100) return { t: "减Ⅱ末期", s: "染色体移向两极" };
    return { t: "配子", s: "染色体减半为 2 条" };
  }

  function geom() {
    var l = L.left, r = L.right;
    return {
      cx: l.x + l.w / 2, cy: l.y + l.h * 0.44, rx: l.w * 0.40, ry: l.h * 0.26,
      px0: r.x + 40, px1: r.x + r.w - 22, py0: r.y + 96, py1: r.y + r.h - 78
    };
  }

  function draw(s, ph) {
    var gA = $("gxA"), gB = $("gxB"), l = L.left, r = L.right, G2 = G;
    gA.textContent = ""; gB.textContent = "";
    el("rect", { x: l.x, y: l.y, width: l.w, height: l.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    tx(gA, l.x + 18, l.y + 26, "细胞内的染色体：一条线 + 中间着丝粒", "#5a6472", "start", 10, 700);
    el("ellipse", { cx: G2.cx, cy: G2.cy, rx: G2.rx, ry: G2.ry, fill: "#ffffff", stroke: "#cbd8e3", "stroke-width": 1.4 }, gA);

    var n = s.chrom, cols = n <= 4 ? 2 : 4, rows = n <= 4 ? 2 : 2, i, j, k = 0;
    var cg = n <= 4 ? 74 : 72, rg = G2.ry * 0.62;
    for (i = 0; i < rows; i++) {
      for (j = 0; j < cols; j++) {
        if (k >= n) break;
        var x = G2.cx + (j - (cols - 1) / 2) * cg;
        var y = G2.cy + (i - (rows - 1) / 2) * rg;
        var len = (k % 2 === 0) ? 40 : 28;
        var col = (k % 4 < 2) ? "#c0392b" : "#2f6fb0";
        el("line", { x1: x - len / 2, y1: y, x2: x + len / 2, y2: y, stroke: col, "stroke-width": 3.2, "stroke-linecap": "round" }, gA);
        el("circle", { cx: x, cy: y, r: 3.2, fill: "#2b2f36" }, gA);
        k++;
      }
    }
    tx(gA, l.x + 18, l.y + l.h - 52, "处于：" + ph.t, "#151a21", "start", 11, 700);
    tx(gA, l.x + 18, l.y + l.h - 34, ph.s, "#5a6472", "start", 9.2, 400);
    tx(gA, l.x + 18, l.y + l.h - 16, "染色体 " + s.chrom + " 条 · DNA " + s.dna + " 个", "#8a94a2", "start", 9, 400);

    /* 右侧：两个计数的阶梯曲线 + 当前位置 */
    el("rect", { x: r.x, y: r.y, width: r.w, height: r.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    tx(gB, r.x + 18, r.y + 26, "两个计数怎么变（纵轴 0–8）", "#5a6472", "start", 10, 700);
    var X = function (p) { return G2.px0 + p * (G2.px1 - G2.px0) / 100; };
    var Y = function (v) { return G2.py1 - v * (G2.py1 - G2.py0) / 8; };
    el("line", { x1: G2.px0, y1: G2.py0, x2: G2.px0, y2: G2.py1, stroke: "#c7d2dc" }, gB);
    el("line", { x1: G2.px0, y1: G2.py1, x2: G2.px1, y2: G2.py1, stroke: "#c7d2dc" }, gB);
    var gv = [2, 4, 8], gi;
    for (gi = 0; gi < 3; gi++) {
      el("line", { x1: G2.px0, y1: Y(gv[gi]), x2: G2.px1, y2: Y(gv[gi]), stroke: "#e8eef4", "stroke-dasharray": "4 4" }, gB);
      tx(gB, G2.px0 - 8, Y(gv[gi]) + 3.5, String(gv[gi]), "#8a94a2", "end", 9, 400);
    }
    var d = [];
    d.push(X(0) + "," + Y(4)); d.push(X(20) + "," + Y(8)); d.push(X(75) + "," + Y(8));
    d.push(X(75) + "," + Y(4)); d.push(X(97) + "," + Y(4)); d.push(X(97) + "," + Y(2)); d.push(X(100) + "," + Y(2));
    el("polyline", { points: d.join(" "), fill: "none", stroke: "#b8791f", "stroke-width": 2.4, "stroke-linejoin": "round" }, gB);
    var c = [];
    c.push(X(0) + "," + Y(4)); c.push(X(75) + "," + Y(4)); c.push(X(75) + "," + Y(2));
    c.push(X(88) + "," + Y(2)); c.push(X(88) + "," + Y(4)); c.push(X(97) + "," + Y(4));
    c.push(X(97) + "," + Y(2)); c.push(X(100) + "," + Y(2));
    el("polyline", { points: c.join(" "), fill: "none", stroke: "#2f6fb0", "stroke-width": 2.4, "stroke-linejoin": "round" }, gB);
    el("line", { x1: X(A), y1: G2.py0 - 4, x2: X(A), y2: G2.py1, stroke: "#b8402f", "stroke-width": 1, "stroke-dasharray": "3 4" }, gB);
    el("circle", { cx: X(A), cy: Y(s.chrom), r: 3.4, fill: "#2f6fb0" }, gB);
    el("circle", { cx: X(A), cy: Y(s.dna), r: 3.4, fill: "#b8791f" }, gB);
    tx(gB, G2.px0 + 4, G2.py1 + 18, "间期", "#8a94a2", "start", 8.6, 400);
    tx(gB, X(47), G2.py1 + 18, "减Ⅰ", "#8a94a2", "middle", 8.6, 400);
    tx(gB, X(87), G2.py1 + 18, "减Ⅱ", "#8a94a2", "middle", 8.6, 400);
    tx(gB, G2.px1, G2.py1 + 18, "配子", "#8a94a2", "end", 8.6, 400);
  }

  function render() {
    if (!G) { L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N; G = geom(); }
    var v = Math.round(A), s = calc(v), ph = phase(v), col, bg;
    if (s.hl) { col = "#b8791f"; bg = "#fdf3e0"; }
    else { col = "#2f8a5b"; bg = "#e6f6ee"; }
    $("gxVa").textContent = String(v);
    $("gxVb").textContent = String(s.chrom);
    $("gxVc").textContent = String(s.dna);
    $("gxVs").textContent = ph.t;
    $("gxVsn").textContent = ph.s;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    document.querySelectorAll("#gxVb, #gxVc").forEach(function (e) {
      e.style.color = (e.id === "gxVb" && s.hl) ? "#b8791f" : "";
    });
    draw(s, ph);
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    G = geom();
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 0 }, { t: 1.2, v: 0 }, { t: 4, v: 93 }, { t: 6.5, v: 93 }, { t: 9, v: 100 }, { t: 11, v: 55 }, { t: 13, v: 0 }],
    keys: [0, 55, 93, 100],
    value: A, min: 0, max: 100, step: 5,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = window.__bio;
  window.__bio = { calc: calc, cases: [
    { v: 30, eq: { chrom: 4, dna: 8 } },
    { v: 93, eq: { chrom: 4, dna: 4 } },
    { v: 100, eq: { chrom: 2, dna: 2 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
