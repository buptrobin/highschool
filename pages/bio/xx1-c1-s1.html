<p class="gx-claim">一句话说清本节最该记住的判断：<b>内环境 = 细胞外液 = 血浆 + 组织液 + 淋巴液</b>，<b>血浆蛋白在里面、血红蛋白不在里面</b>。</p>
<div class="gx-meta">
<span><i></i>人教版（2019）选择性必修1 第1章第1节</span>

<p class="gx-lede">这一节是整章的起点：先弄清「细胞泡在什么液体里」，后面讲稳态、神经—体液—免疫调节，全都建立在这三个液体上。最容易错的一件事不是记不住三种液体，而是把「体液」和「内环境」画等号——体液还包含细胞内液，而内环境只算细胞外的那部分。把这条界线守住，本节八成的题都不会错。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 体液与内环境<span class="q-src">人教版（2019）选择性必修1 · 第1章第1节</span></p>
<p class="q-b">体液包括细胞内液和细胞外液，细胞外液主要由血浆、组织液和淋巴液组成，构成了内环境。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个条件</b>组成：① 体液分两半，一半在细胞内、一半在细胞外；② 细胞外液有血浆、组织液、淋巴液三种；③ 只有细胞外液叫内环境。<b>少掉条件③</b>，就会把细胞内液也算进去，这是本节第一大错。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 内环境的理化性质<span class="q-src">人教版（2019）选择性必修1 · 第1章第1节</span></p>
<p class="q-b">内环境的理化性质包括渗透压、酸碱度和温度，其中血浆渗透压的大小主要与无机盐、蛋白质的含量有关。</p>
<p class="q-n">→ 翻成人话：理化性质就<b>三样</b>——渗透压、酸碱度、温度。血浆渗透压由两部分撑起来：无机盐（主要是 Na⁺、Cl⁻）贡献的<b>晶体渗透压</b>占绝大部分，蛋白质（血浆蛋白）贡献的<b>胶体渗透压</b>数值小，但它几乎决定了水在血管内外的分配。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 三者之间的物质交换<span class="q-src">人教版（2019）选择性必修1 · 第1章第1节</span></p>
<p class="q-b">组织液中的物质可以进入血浆和淋巴液，血浆中的物质也能进入组织液。</p>
<p class="q-n">→ 翻成人话：注意课本用词的<b>不对称</b>——血浆与组织液之间用「也能」，是双向的；组织液到淋巴液只用「可以进入」，没有反过来的说法，因为毛细淋巴管壁的细胞像<b>只朝里开的门</b>，进去就出不来，只能经淋巴循环回到血液。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>血浆</th><th>组织液</th><th>淋巴液</th></tr></thead>
<tbody>
<tr><td>存在的部位</td><td>血管内</td><td>组织细胞之间的间隙</td><td>淋巴管内</td></tr>
<tr><td>蛋白质含量</td><td>较多（血浆蛋白）</td><td>很少</td><td>很少</td></tr>
<tr><td>能不能单向流</td><td>循环流动</td><td>与血浆双向交换</td><td>只从组织液流进来</td></tr>
<tr class="key"><td>真正的区别</td><td>蛋白质多 → 胶体渗透压高</td><td>蛋白质少 → 胶体渗透压低</td><td>由组织液生成，不回头</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只背一行：<b>血浆蛋白质多</b>。血浆蛋白多出来的这一点胶体渗透压，就是把水「拽」在血管里的那点力；它一减少，水就留在组织液里，叫水肿。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 原因分析类简答<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">长期营养不良的人，常出现下肢浮肿（组织水肿）。请回答：（1）从血浆渗透压的角度解释浮肿的原因；（2）有同学说「这是体内水变多了」，这句话对吗？为什么？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 先定位置</p>
<p class="s-b">浮肿的水积在<b>组织液</b>里，不是积在血浆里，也不是进了细胞内液。所以整道题要解释的是「血浆和组织液之间水的分配变了」。</p>
<p class="s-k">用到：内环境三种细胞外液的分工。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 找第一个变量</p>
<p class="s-b">长期营养不良 → 摄入的蛋白质不足 → 肝细胞合成<b>血浆蛋白</b>的原料不够 → 血浆蛋白浓度下降。</p>
<p class="s-k">用到：血浆蛋白由细胞合成后分泌进血浆，属于内环境成分。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 把链条推到底</p>
<p class="s-b">血浆蛋白减少 → 血浆<b>胶体渗透压</b>下降 → 血浆把水「拽」住的能力减弱 → 组织液回流进血浆的量减少 → 组织液增多 → 组织水肿。</p>
<p class="s-k">用到：水从胶体渗透压低的一侧向高的一侧净移动。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 排掉那个陷阱</p>
<p class="s-b">「水变多了」错在把<b>总量</b>和<b>分配</b>搞混。此时体内水的总量未必增加，变的是水在血浆与组织液之间的比例；同理也不能答「血浆变多了」。</p>
<p class="s-k">用到：水肿的实质是组织液生成与回流的平衡被打破。</p>
</li>
</ol>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「内环境不就是体液吗？两个词换着写行不行？」</p>
<p class="a">不行。<b>体液 = 细胞内液 + 细胞外液；内环境 = 细胞外液</b>（血浆、组织液、淋巴液），<b>不含细胞内液</b>。体液比内环境多了整整一半。</p>

<text x="158" y="66" font-size="9" fill="#2f8a5b" text-anchor="middle">内环境</text>
<text x="158" y="92" font-size="8" fill="#3a3a35" text-anchor="middle">细胞外液</text>

<div class="qac">
<p class="q">「血红蛋白也是蛋白质，为什么不能说它在内环境里？」</p>
<p class="a">因为它在<b>红细胞内</b>，被细胞膜挡着。判据不是「是不是蛋白质」，而是「在细胞外液里还是在某个细胞里」：<b>血浆蛋白在内环境，血红蛋白在细胞内</b>。</p>

<p class="q">「淋巴液为什么只能单向流？不能倒流回组织液吗？」</p>
<p class="a">不能。毛细淋巴管壁的细胞像<b>只朝里开的门</b>：组织液能挤进去，淋巴液却回不去，只能经淋巴循环最终进入血浆。<b>组织液 → 淋巴液是单向的</b>，这也是它能回收组织液中蛋白质的原因。</p>

<p class="q">「组织水肿的原因是不是只有营养不良？」</p>

<p class="q">「细胞外液占体液的多少？这个比例要记吗？」</p>

<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 内环境就是体液，两者是一回事。</p>
<p class="er-v">✓ 内环境是细胞外液（血浆、组织液、淋巴液）；体液还包括细胞内液。</p>
<p class="er-w">错在哪：把「体液」和「内环境」画了等号，多算了一整个细胞内液。</p>
</div>
<div class="er">
<p class="er-x">✗ 血红蛋白、呼吸酶属于内环境的成分。</p>
<p class="er-v">✓ 血浆蛋白、抗体、激素属于内环境；血红蛋白在红细胞内，呼吸酶在线粒体内。</p>
<p class="er-w">错在哪：判据用错了。看的是位置（细胞外液里还是细胞内），不是「是不是蛋白质」。</p>
</div>
<div class="er">
<p class="er-x">✗ 组织液可以流进淋巴管，淋巴液也能流回组织液。</p>
<p class="er-v">✓ 组织液可以进入淋巴液，但淋巴液只能经淋巴循环回到血浆。</p>
<p class="er-w">错在哪：<b>组织液 → 淋巴液是单向的</b>，毛细淋巴管壁只朝里开。</p>
</div>
<div class="er">
<p class="er-x">✗ 组织水肿是因为喝水太多，体内水变多了。</p>
<p class="er-v">✓ 组织水肿是水在血浆与组织液之间的分配改变，组织液增多、血浆减少。</p>
<p class="er-w">错在哪：把总量和分配混了；水肿时水的总量未必增加。</p>
</div>
<div class="er">
<p class="er-x">✗ 血浆蛋白和血红蛋白是同一回事，只是叫法不同。</p>
<p class="er-v">✓ 血浆蛋白在血浆中（属于内环境），血红蛋白在红细胞中（不属于内环境），功能也不同。</p>
<p class="er-w">错在哪：名字像，位置正好相反——一个在细胞外，一个在细胞内。</p>
</div>
<div class="er">
<p class="er-x">✗ 内环境包括细胞内液，因为细胞里的水也属于体内液体。</p>
<p class="er-v">✓ 内环境 = 细胞外液，<b>不含细胞内液</b>；细胞内液与细胞外液合起来才叫体液。</p>
<p class="er-w">错在哪：「体内的液体」不是判据，判据是「在细胞膜外面」。</p>
</div>

    el("polygon", { points: x2 + "," + botY + " " + (x2 - 4) + "," + (botY - 9) + " " + (x2 + 4) + "," + (botY - 9), fill: "#b8791f" }, gA);
