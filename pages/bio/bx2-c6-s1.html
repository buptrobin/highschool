<p class="gx-claim">本节一句话：<b>化石</b>是研究生物进化<b>最直接、最重要</b>的证据，但<b>不是唯一</b>证据；分子水平比的是<b>同种蛋白质的氨基酸序列差异</b>，<b>差异越小，亲缘越近、分化越晚</b>。</p>
<div class="gx-meta">
<span><i></i>人教版（2019）必修2 第6章第1节</span>
<span><i></i>高一 · 生物的进化</span>
<span><i></i>阅读 12 分钟</span>
<span><i></i>含 1 个互动模型</span>
</div>
<p class="gx-lede">第6章要回答的是「生物为什么多样、又为什么有联系」。这一节先把「有共同祖先」这件事的证据摆齐：化石、比较解剖学、胚胎学、细胞和分子水平，四条线各自能证明什么、各自不能证明什么。最容易错的一处：把「最直接」读成「唯一」，或者把分子水平的比较说成「比蛋白质含量」。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 化石证据<span class="q-src">人教版（2019）必修2 · 第6章第1节</span></p>
<p class="q-b">化石是研究生物进化最直接、最重要的证据。</p>
<p class="q-n">→ 翻成人话：这一句由<b>三个条件</b>组成——①研究的是<b>生物进化</b>（不是分类、不是生态）；②<b>最直接</b>，因为化石是古代生物留下的遗体、遗物或生活痕迹，能直接看到「当时有什么」；③<b>最重要</b>，因为地层里化石的排列顺序就是时间的顺序。少一个条件句子就不成立；但请注意「最直接、最重要」不等于「唯一」——下一句就补了另外三类证据。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 四类证据并列<span class="q-src">人教版（2019）必修2 · 第6章第1节</span></p>
<p class="q-b">比较解剖学、胚胎学、细胞和分子水平的证据都支持生物有共同祖先。</p>
<p class="q-n">→ 翻成人话：这句话把证据分成<b>四个方面</b>（①比较解剖学 ②胚胎学 ③细胞水平 ④分子水平），四个都用「都」字并列，谁也不是谁的补充说明。所以答「化石是唯一证据」直接错；答「化石是最直接、最重要的证据，比较解剖学、胚胎学、细胞和分子水平的证据也支持」才是教材口径。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 分子水平的判据<span class="q-src">人教版（2019）必修2 · 第6章第1节</span></p>
<p class="q-b">亲缘关系越近的生物，在分子水平上的差异越小。</p>
<p class="q-n">→ 翻成人话：成立要<b>两个条件</b>——①比的是<b>同种蛋白质（或同一段基因）的序列</b>，不是蛋白质含量、不是细胞大小；②差异指<b>序列差异</b>（氨基酸或碱基的排列不同）。两个条件都满足时才有推论：<b>差异越小 → 亲缘关系越近 → 两类生物分化越晚</b>。反过来说「差异越大亲缘越近」是把箭头画反了。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>证据类型</th><th>比的是什么</th><th>能说明什么</th><th>不能说明什么</th></tr></thead>
<tbody>
<tr><td>化石证据</td><td>地层中化石的种类、结构、出现顺序</td><td>古代生物长什么样；越古老的地层里生物越简单</td><td>不能单独给出「谁和谁是一家」的完整谱系</td></tr>
<tr><td>比较解剖学</td><td>同源器官（来源相同、功能不同）</td><td>不同类群有共同的「结构方案」</td><td>同源器官的功能不一定相同</td></tr>
<tr><td>胚胎学</td><td>早期胚胎的形态（鳃裂、尾）</td><td>不同类群早期发育过程相似</td><td>不能说「个体发育重演系统发育」</td></tr>
<tr class="key"><td>细胞和分子水平</td><td><b>同种蛋白质的氨基酸序列</b>（如细胞色素c）的差异</td><td><b>差异越小，亲缘关系越近、分化越晚</b></td><td>不能比蛋白质含量、不能比细胞大小</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">背法：四条证据记成「<b>石—解—胚—分</b>」。判断题里看到「唯一」「只有」「含量」这三个词，先停一下——它们几乎都出现在错项里。</p>
</section>

<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题：先确认「比的是什么」</p>
<p class="s-b">题干给的是三种生物的<b>同一种蛋白质</b>（细胞色素c）的氨基酸<b>序列差异数</b>，不是蛋白质含量，也不是细胞大小。先把这一步钉死，后面才不会答偏。</p>
<p class="s-k">用到：分子水平比较的对象＝同种蛋白质的氨基酸序列。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 读数据：谁和谁最近</p>
<p class="s-b">对照数据：人与黑猩猩差异 0，人与猕猴差异 1，黑猩猩与猕猴之间也是 1 级别的小差异。差异数排序是 0 &lt; 0 &lt; 1。</p>
<p class="s-k">用到：差异数是可以直接排序的判据，越小越近。</p>
</li>
<li class="step" hidden>

<p class="s-b">套判据：<b>差异越小，亲缘关系越近、分化越晚</b>。所以人与黑猩猩的亲缘关系最近（差异为 0，序列完全相同），人与猕猴次之。</p>
<p class="s-k">用到：亲缘关系越近的生物，在分子水平上的差异越小。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 补边界：不能推成「同一物种」</p>
<p class="s-b">分子证据只说明<b>亲缘关系近、分化晚</b>，不能直接判定是不是同一物种；而且化石、比较解剖学、胚胎学的证据也不能省。分子证据是四类证据之一，不能单独定论。</p>
<p class="s-k">用到：化石是最直接、最重要的证据，但不是唯一证据。</p>
</li>

<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<p class="er-w">错在哪：「唯一」把另外三类证据全删了。教材用「最」不用「唯一」。</p>

<div class="er">
<p class="er-x">✗ 分子水平比较的是两种生物蛋白质的含量。</p>

<p class="er-w">错在哪：含量的高低受进食、代谢影响，跟亲缘无关；能遗传的是序列。</p>
</div>

<div class="er">
<p class="er-x">✗ 两种生物的差异越大，亲缘关系越近。</p>
<p class="er-v">✓ 差异越小，亲缘关系越近、分化越晚。</p>
<p class="er-w">错在哪：箭头画反了。差异是「分化的距离」，越大＝分开越久。</p>
</div>

<div class="er">
<p class="er-x">✗ 同源器官的形态不同，所以功能也一定相同。</p>
<p class="er-v">✓ 同源器官来源相同、功能不同；同功器官功能相同、来源不同。</p>
<p class="er-w">错在哪：同源讲的是「来源」，功能恰恰是分化出去的那部分。</p>
</div>

<div class="er">
<p class="er-x">✗ 胚胎学证据证明了个体发育重演系统发育。</p>
<p class="er-v">✓ 胚胎学证据表明不同类群的早期胚胎相似，说明它们有共同祖先。</p>
<p class="er-w">错在哪：「重演」是夸大，早期相似不等于把祖先的成体阶段重演一遍。</p>
</div>

<div class="er">

<script>
/* 互动脚本本体（由 build-page.mjs 包进 <script> 里，所以这里不要写 <script> 标签） */
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var GX = window.GX, el = GX.el, tx = GX.tx, $ = GX.$;
  var stage = $("gxStage");
  if (!stage || !window.AutoPilot) return;

  /* 两套坐标：宽屏 880×470，窄屏独立 360×700 */
  var W = { vb: "0 0 880 470", left: { x: 16, y: 16, w: 424, h: 438 }, right: { x: 456, y: 16, w: 408, h: 438 } };
  var N = { vb: "0 0 360 700", left: { x: 8, y: 8, w: 344, h: 300 }, right: { x: 8, y: 320, w: 344, h: 372 } };
  var L = W, A = 0, G = null;

  /* 纯函数：差异数 d → 数值。render() 和 __bio.cases 都用它 */
  function calc(v) {
    var d = Math.round(v);
    return { diff: d, same: (104 - d) / 104, degree: d <= 5 ? 3 : d <= 20 ? 2 : 1 };
  }

  /* 由当前布局算出小格几何，一次算好缓存 */
  function geom() {
    var inner = L.left.w - 40, pitch = inner / 13;
    return {
      x0: L.left.x + 20, y0: L.left.y + 64,
      pitch: pitch, cell: pitch - 4,
      gb: L.left.y + 64 + 8 * pitch,
      rx: L.right.x + 20, rw: L.right.w - 40
    };
  }

  /* 中文按字数换行，避免长句冲出面板 */
  function wrap(parent, x, y, s, maxW, fs, col, lh) {
    var per = Math.max(6, Math.floor(maxW / fs)), lines = [], cur = "";
    for (var i = 0; i < s.length; i++) { cur += s.charAt(i); if (cur.length >= per) { lines.push(cur); cur = ""; } }
    if (cur) lines.push(cur);
    for (var k = 0; k < lines.length; k++) tx(parent, x, y + k * lh, lines[k], col, "start", fs, 400);
  }

  function colorOf(deg) { return deg === 3 ? "#2f8a5b" : deg === 2 ? "#b8791f" : "#b8402f"; }

  function draw() {
    var s = calc(A), c = colorOf(s.degree);
    var gA = $("gxA"), gB = $("gxB");
    gA.textContent = ""; gB.textContent = "";

    /* 左：104 个氨基酸的格子图，差异位标异色 */
    el("rect", { x: L.left.x, y: L.left.y, width: L.left.w, height: L.left.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    tx(gA, L.left.x + 20, L.left.y + 28, "细胞色素c：104 个氨基酸", "#5a6472", "start", 10.5, 700);
    tx(gA, L.left.x + 20, L.left.y + 46, "红格＝该位氨基酸不同，共 d 个", "#8d9aa8", "start", 9, 400);
    for (var i = 0; i < 104; i++) {
      var diff = Math.floor(i * A / 104) !== Math.floor((i + 1) * A / 104);
      el("rect", {
        x: G.x0 + (i % 13) * G.pitch, y: G.y0 + Math.floor(i / 13) * G.pitch,
        width: G.cell, height: G.cell, rx: 3,
        fill: diff ? "#f7d6e0" : "#e6f6ee", stroke: diff ? "#b3567f" : "#9fd0b6"
      }, gA);
    }
    tx(gA, L.left.x + 20, G.gb + 20, "相同 " + (104 - A) + " 个 · 不同 " + A + " 个", "#22303c", "start", 10.5, 700);
    if (G.gb + 40 < L.left.y + L.left.h - 8) wrap(gA, L.left.x + 20, G.gb + 40, "格子位置只是示意排布，不代表真实的第几位氨基酸。", G.rw, 9, "#8d9aa8", 14);

    /* 右：相同比例条 + 差异刻度 */
    var ry = L.right.y, rx = G.rx, rw = G.rw;
    el("rect", { x: L.right.x, y: ry, width: L.right.w, height: L.right.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    tx(gB, rx, ry + 26, "亲缘关系判定", "#5a6472", "start", 10.5, 700);

    tx(gB, rx, ry + 60, "序列相同比例", "#8d9aa8", "start", 9, 400);
    tx(gB, rx, ry + 90, (s.same * 100).toFixed(1) + "%", c, "start", 24, 700);
    el("rect", { x: rx, y: ry + 102, width: rw, height: 20, rx: 10, fill: "#eef2f5" }, gB);
    el("rect", { x: rx, y: ry + 102, width: Math.max(2, s.same * rw), height: 20, rx: 10, fill: c, opacity: 0.85 }, gB);

    tx(gB, rx, ry + 150, "差异占比 d ÷ 104", "#8d9aa8", "start", 9, 400);
    el("rect", { x: rx, y: ry + 160, width: rw, height: 14, rx: 7, fill: "#eef2f5" }, gB);
    el("rect", { x: rx, y: ry + 160, width: Math.max(0, A / 104 * rw), height: 14, rx: 7, fill: "#b3567f", opacity: 0.8 }, gB);

    var axisY = ry + 218, x0 = rx;
    tx(gB, rx, ry + 196, "差异数刻度 (0–40)", "#8d9aa8", "start", 9, 400);
    el("rect", { x: x0, y: axisY - 5, width: rw * 5 / 40, height: 10, rx: 5, fill: "#cfe9dc" }, gB);
    el("rect", { x: x0 + rw * 5 / 40, y: axisY - 5, width: rw * 15 / 40, height: 10, fill: "#f3e0bb" }, gB);
    el("rect", { x: x0 + rw * 20 / 40, y: axisY - 5, width: rw * 20 / 40, height: 10, rx: 5, fill: "#f3cfc7" }, gB);
    var mx = x0 + A / 40 * rw;
    el("path", { d: "M" + (mx - 6) + " " + (axisY - 18) + " L" + (mx + 6) + " " + (axisY - 18) + " L" + mx + " " + (axisY - 6) + " Z", fill: c }, gB);
    tx(gB, x0 + rw * 5 / 40, axisY + 18, "5", "#8d9aa8", "middle", 8.5, 400);
    tx(gB, x0 + rw * 20 / 40, axisY + 18, "20", "#8d9aa8", "middle", 8.5, 400);
    tx(gB, x0, axisY + 18, "0", "#8d9aa8", "start", 8.5, 400);
    tx(gB, x0 + rw, axisY + 18, "40", "#8d9aa8", "end", 8.5, 400);

    var line = s.degree === 3 ? "d ≤ 5：亲缘关系很近，分化很晚"
      : s.degree === 2 ? "5 < d ≤ 20：亲缘关系中等" : "d > 20：亲缘关系较远，分化较早";
    tx(gB, rx, axisY + 46, line, c, "start", 10.5, 700);
    wrap(gB, rx, axisY + 66, "比的是同种蛋白质的氨基酸序列：差异越小，亲缘越近、分化越晚。", rw, 9, "#5a6472", 14);
    if (axisY + 110 < ry + L.right.h - 10) tx(gB, rx, axisY + 110, "相同比例 = (104 − d) ÷ 104", "#8d9aa8", "start", 9, 400);
  }

  function render() {
    if (!G) { L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N; G = geom(); }
    var s = calc(A), c = colorOf(s.degree), st, sn;
    $("gxVa").textContent = String(s.diff);
    $("gxVb").textContent = (s.same * 100).toFixed(1) + "%";
    $("gxVc").textContent = String(104 - s.diff);
    if (s.degree === 3) { st = "很近"; sn = "d ≤ 5，分化很晚"; }
    else if (s.degree === 2) { st = "中等"; sn = "5 < d ≤ 20"; }
    else { st = "较远"; sn = "d > 20，分化较早"; }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = s.degree === 3 ? "#e6f6ee" : s.degree === 2 ? "#fdf3e0" : "#fbeae7";
    $("gxStBox").style.borderColor = c + "44";
    $("gxVs").style.color = c;
    draw();
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    G = geom();
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 0 }, { t: 1.5, v: 20 }, { t: 4, v: 40 }, { t: 6.5, v: 40 }, { t: 9, v: 20 }, { t: 11.5, v: 0 }, { t: 13.5, v: 0 }],
    keys: [0, 20, 30, 40],
    value: A, min: 0, max: 40, step: 1,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__bio = { calc: calc, cases: [
    { v: 0, eq: { same: 1 } },
    { v: 20, eq: { same: 0.8077 } },
    { v: 40, eq: { same: 0.6154 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
