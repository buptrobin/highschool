<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 被动运输的定义<span class="q-src">人教版（2019）必修1 · 第4章第1节</span></p>
<p class="q-b">物质以扩散方式进出细胞，不需要消耗细胞内化学反应所释放的能量，这种物质跨膜运输方式称为被动运输。</p>
<p class="q-n">→ 翻成人话：这句话由<b>两个条件</b>组成——① 物质是「扩散」着进出的，也就是顺着浓度梯度、从高的一侧到低的一侧；② 不消耗细胞内化学反应所释放的能量。两个条件同时成立才叫被动运输；缺一个（比如逆浓度梯度、要靠 ATP 供能）就是主动运输。注意「扩散」两个字已经限定了方向，被动运输不可能从低浓度到高浓度。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 被动运输的分类<span class="q-src">人教版（2019）必修1 · 第4章第1节</span></p>
<p class="q-b">被动运输分为自由扩散和协助扩散两类；借助膜上转运蛋白进出细胞的物质扩散方式叫作协助扩散。</p>
<p class="q-n">→ 翻成人话：分类标准只有<b>一个</b>——要不要借助膜上的转运蛋白。不要 = 自由扩散；要 = 协助扩散。课本写的「转运蛋白」包含载体蛋白和通道蛋白两类，做题时写「需要载体蛋白」不算错，但要知道通道蛋白也归在协助扩散里（比如 K⁺ 经 K⁺ 通道、水经水通道蛋白）。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 渗透作用<span class="q-src">人教版（2019）必修1 · 第4章第1节</span></p>
<p class="q-b">水分子（或其他溶剂分子）通过半透膜的扩散，称为渗透作用。</p>
<p class="q-n">→ 翻成人话：渗透作用由<b>三个条件</b>凑成——① 有半透膜；② 膜两侧存在浓度差；③ 溶剂分子（通常是水）能透过这层膜。它只回答「水往哪边走」，不回答「溶质怎么过去」：溶质不能过膜时，水就往溶质多、水分子少的那一侧走，直到两侧浓度趋于平衡。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>自由扩散</th><th>协助扩散</th></tr></thead>
<tbody>
<tr><td>运输方向</td><td>顺浓度梯度（高 → 低）</td><td>顺浓度梯度（高 → 低）</td></tr>
<tr class="key"><td>转运蛋白</td><td>不需要，直接穿过磷脂双分子层</td><td>需要（载体蛋白或通道蛋白）</td></tr>
<tr><td>是否耗能</td><td>不消耗</td><td>不消耗</td></tr>
<tr><td>速率与浓度差</td><td>成正比，浓度差越大越快</td><td>先快后慢，载体饱和后不再增大</td></tr>
<tr><td>典型例子</td><td>O₂、CO₂、H₂O、甘油、乙醇、苯</td><td>葡萄糖进红细胞、K⁺ 经通道蛋白、水经水通道蛋白</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只高亮 1 行：<b>真正的区别是「要不要转运蛋白」</b>，不是耗不耗能（两种都不耗能）。背法是三问：先问「顺不顺梯度」，再问「要不要蛋白」，最后问「耗不耗能」。三问下来，自由扩散、协助扩散、主动运输、胞吞胞吐四种方式不会混。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 同一物质，不同细胞的运输方式一样吗<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">葡萄糖既能进入红细胞，也能被小肠上皮细胞吸收。请分别判断：葡萄糖进入红细胞、进入小肠上皮细胞各属于哪种跨膜运输方式？并写出判断依据。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题：先把判据列出来</p>
<p class="s-b">跨膜运输的判据只有三条：① 顺浓度梯度还是逆浓度梯度；② 要不要转运蛋白；③ 耗不耗能。被动运输必须是「顺」+「不耗能」，再看有没有转运蛋白分成自由扩散和协助扩散。</p>
<p class="s-k">用到：被动运输的定义（两个条件）与分类标准（一个条件）</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 第一问：葡萄糖进红细胞</p>
<p class="s-b">血浆中葡萄糖浓度高于红细胞内，葡萄糖是<b>顺浓度梯度</b>进入红细胞的；红细胞膜上有葡萄糖转运蛋白，需要<b>载体</b>；这个过程<b>不消耗</b>细胞内化学反应释放的能量。三个判据合起来 → <b>协助扩散</b>。</p>
<p class="s-k">用到：协助扩散 = 顺梯度 + 需载体 + 不耗能</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 第二问：葡萄糖进小肠上皮细胞</p>
<p class="s-b">小肠上皮细胞要把肠腔里的葡萄糖「抢」进来，即使细胞内浓度已经更高也继续吸收，属于<b>逆浓度梯度</b>；同样需要载体蛋白，并且<b>消耗能量</b>。三个判据合起来 → <b>主动运输</b>。</p>
<p class="s-k">用到：主动运输 = 逆梯度 + 需载体 + 耗能</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 点出陷阱：物质名称不是判据</p>
<p class="s-b">「葡萄糖」三个字推不出运输方式，<b>怎么运</b>才是判据。同一个葡萄糖分子，进红细胞是协助扩散，进小肠上皮细胞是主动运输。题干只要给了浓度方向和是否耗能，就按这两条判；只给「需要载体」时，只能确定它不是自由扩散。</p>
<p class="s-k">用到：运输方式由膜蛋白和能量条件决定，不由物质名称决定</p>
</li>
</ol>

<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">① 葡萄糖进入红细胞：<b>协助扩散</b>。依据：顺浓度梯度（血浆 → 红细胞内），需要载体蛋白协助，不消耗能量。<br>② 葡萄糖进入小肠上皮细胞：<b>主动运输</b>。依据：逆浓度梯度（肠腔 → 细胞内），需要载体蛋白，消耗能量。<br>③ 结论：同一物质在不同细胞中的跨膜运输方式可以不同，判断依据是浓度梯度方向、是否需要转运蛋白、是否消耗能量。</p>

<div class="qac">
<p class="q">协助扩散到底要不要能量？</p>
<p class="a">不要。<b>协助扩散需要转运蛋白，但不消耗细胞内化学反应释放的能量</b>。判据记三条：顺浓度梯度、需要转运蛋白、不耗能——三条同时成立才是协助扩散。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="协助扩散三个判据：需载体、不耗能、顺梯度">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="31" text-anchor="middle" font-size="9" font-weight="700" fill="#151a21">协助扩散的三个判据</text>
<rect x="26" y="44" width="56" height="30" rx="6" fill="#e6f6ee" stroke="#b3e2c7"/>
<text x="54" y="63" text-anchor="middle" font-size="8.5" fill="#1e6640">需载体 ✓</text>
<rect x="92" y="44" width="56" height="30" rx="6" fill="#fdeceb" stroke="#f3c9c3"/>
<text x="120" y="63" text-anchor="middle" font-size="8.5" fill="#8f3226">耗能 ✗</text>
<rect x="158" y="44" width="56" height="30" rx="6" fill="#e6f6ee" stroke="#b3e2c7"/>
<text x="186" y="63" text-anchor="middle" font-size="8.5" fill="#1e6640">顺梯度 ✓</text>
<text x="120" y="100" text-anchor="middle" font-size="9" fill="#3a3a35">需要载体 ≠ 消耗能量</text>
<text x="120" y="118" text-anchor="middle" font-size="8.5" fill="#8e97a4">载体只改构象，不烧能量</text>
</svg>
</div>
<div class="qac">
<p class="q">载体饱和意味着什么？</p>
<p class="a"><b>载体数量有限，全部被占满后速率不再增大</b>，曲线出现平台（Vmax）。所以浓度差很大时，协助扩散反而不如自由扩散——这也是图 3 里两条线交叉后越拉越开的原因。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="饱和曲线：速率升到 Vmax 后变成水平平台">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="24" y1="104" x2="216" y2="104" stroke="#c9d3dc" stroke-width="1"/>
<line x1="24" y1="104" x2="24" y2="28" stroke="#c9d3dc" stroke-width="1"/>
<path d="M 24 104 L 50 78 L 80 58 L 120 44 L 170 36 L 216 33" fill="none" stroke="#2f6fb3" stroke-width="2"/>
<line x1="24" y1="33" x2="216" y2="33" stroke="#9ec7e6" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="212" y="27" text-anchor="end" font-size="8.5" fill="#2f6fb3">Vmax</text>
<text x="120" y="120" text-anchor="middle" font-size="8.5" fill="#3a3a35">载体全占满 → 速率封顶</text>
</svg>
</div>
<div class="qac">
<p class="q">自由扩散和协助扩散的共同点是什么？</p>
<p class="a">两条共同点必须写全：<b>都是顺浓度梯度</b>（高 → 低）、<b>都不消耗能量</b>。正因为这两条相同，它们才被合起来叫作被动运输；区别只在要不要转运蛋白。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="文氏图：自由扩散与协助扩散的交集是顺浓度梯度且不耗能">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<circle cx="96" cy="76" r="32" fill="none" stroke="#0f8a5f" stroke-width="1.4"/>
<circle cx="144" cy="76" r="32" fill="none" stroke="#2f6fb3" stroke-width="1.4"/>
<text x="74" y="80" text-anchor="middle" font-size="8.4" fill="#1e6640">自由</text>
<text x="166" y="80" text-anchor="middle" font-size="8.4" fill="#2f6fb3">协助</text>
<text x="120" y="68" text-anchor="middle" font-size="8" fill="#3a3a35">顺梯度</text>
<text x="120" y="80" text-anchor="middle" font-size="8" fill="#3a3a35">不耗能</text>
<text x="120" y="122" text-anchor="middle" font-size="8.5" fill="#8e97a4">交集 = 被动运输</text>
</svg>
</div>
<div class="qac">
<p class="q">水只靠自由扩散进出细胞吗？</p>
<p class="a">不是。水分子<b>既能自由扩散通过磷脂双分子层，也能经水通道蛋白协助扩散</b>，两种方式都有。所以「水只靠自由扩散」是错的，「水的运输不需要蛋白质」也是错的。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="水分子两条路径：直接穿过磷脂双分子层，或经水通道蛋白">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<rect x="24" y="58" width="192" height="18" rx="4" fill="#fdf6ea" stroke="#eadfc9"/>
<rect x="108" y="44" width="24" height="46" rx="5" fill="#e6f6ee" stroke="#2f8a5b"/>
<text x="60" y="26" text-anchor="middle" font-size="8.4" fill="#3a3a35">自由扩散</text>
<text x="170" y="26" text-anchor="middle" font-size="8.4" fill="#3a3a35">经水通道</text>
<line x1="60" y1="34" x2="60" y2="82" stroke="#b8791f" stroke-width="1.4"/>
<polygon points="60,94 55,82 65,82" fill="#b8791f"/>

<text x="120" y="120" text-anchor="middle" font-size="8.5" fill="#8e97a4">水通道蛋白属于协助扩散</text>
</svg>
</div>
<div class="qac">
<p class="q">温度怎么影响被动运输？</p>
<p class="a">温度影响<b>膜的流动性</b>和<b>载体蛋白的活性</b>，所以能改变速率；但温度过高会使膜结构被破坏、蛋白质变性，速率反而下降。它不是「越高越快」的单向因素。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="温度与速率曲线：先升后降，峰值为最适温度">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="28" y1="100" x2="216" y2="100" stroke="#c9d3dc" stroke-width="1"/>
<line x1="28" y1="100" x2="28" y2="26" stroke="#c9d3dc" stroke-width="1"/>
<polyline points="28,100 56,72 84,48 104,40 124,46 156,62 196,82" fill="none" stroke="#b8791f" stroke-width="2"/>

<text x="124" y="118" text-anchor="middle" font-size="8.5" fill="#3a3a35">过高 → 膜结构破坏，速率下降</text>
</svg>
</div>
<div class="qac">
<p class="q">渗透作用的方向怎么判断？</p>
<p class="a">水从<b>溶质少、水分子多</b>的一侧，流向<b>溶质多、水分子少</b>的一侧。判断时只看两件事：有没有半透膜、膜两侧有没有浓度差；不要把「溶质往哪边走」混进来。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="渗透作用：水从低浓度一侧穿过半透膜流向高浓度一侧">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="27" text-anchor="middle" font-size="8.5" fill="#3a3a35">水往溶质多的一侧走</text>
<rect x="30" y="40" width="80" height="56" rx="6" fill="#eaf6ff" stroke="#c8e2f5"/>
<rect x="130" y="40" width="80" height="56" rx="6" fill="#fdf3e0" stroke="#f0dcb4"/>
<rect x="112" y="36" width="12" height="64" rx="2" fill="#e8f4ec" stroke="#9dcfb4"/>
<text x="70" y="70" text-anchor="middle" font-size="8.4" fill="#2f6fb3">低浓度</text>
<text x="170" y="70" text-anchor="middle" font-size="8.4" fill="#8a5c14">高浓度</text>

</div>
</div>
<p class="gx-note">这六问其实是同一件事：先把「<b>顺梯度、不耗能</b>」当底线，再问「<b>要不要转运蛋白</b>」，最后才谈速率上限和影响因素。底线错了，后面全错。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 协助扩散需要载体，所以消耗能量。</p>
<p class="er-v">✓ 协助扩散需要载体蛋白，但不消耗细胞内化学反应释放的能量。</p>
<p class="er-w">错在哪：把「需要载体」当成「耗能」的证据。<b>载体只负责改变构象、把分子送过膜，不提供能量</b>。</p>
</div>
<div class="er">
<p class="er-x">✗ 自由扩散需要膜上的载体蛋白帮助。</p>
<p class="er-v">✓ 自由扩散不需要转运蛋白，物质直接穿过磷脂双分子层。</p>
<p class="er-w">错在哪：记反了唯一的分类标准——<b>要蛋白的是协助扩散</b>，不要蛋白的才是自由扩散。</p>
</div>
<div class="er">
<p class="er-x">✗ 葡萄糖进入细胞都是协助扩散。</p>
<p class="er-v">✓ 葡萄糖进入红细胞是协助扩散；进入小肠上皮细胞是主动运输。</p>
<p class="er-w">错在哪：拿物质名称代替判据。<b>同一物质在不同细胞里运输方式可以不同</b>，要看浓度方向和是否耗能。</p>
</div>
<div class="er">
<p class="er-x">✗ 浓度差越大，协助扩散的速率就越快。</p>
<p class="er-v">✓ 浓度差增大时协助扩散速率先增大后趋于稳定，因为载体数量有限、会饱和。</p>
<p class="er-w">错在哪：把自由扩散的线性规律套到了协助扩散上。高浓度下协助扩散反而<b>不占优势</b>，这是本节最爱考的反直觉点。</p>
</div>
<div class="er">
<p class="er-x">✗ 水分子只能通过自由扩散进出细胞。</p>
<p class="er-v">✓ 水分子既能自由扩散通过磷脂双分子层，也能经水通道蛋白协助扩散。</p>
<p class="er-w">错在哪：漏掉了通道蛋白这条路径。<b>水通道蛋白</b>参与的也是协助扩散。</p>
</div>
<div class="er">
<p class="er-x">✗ 被动运输可以从低浓度一侧运到高浓度一侧。</p>
<p class="er-v">✓ 被动运输是顺浓度梯度的扩散，只能从高浓度一侧到低浓度一侧。</p>
<p class="er-w">错在哪：把「不耗能」理解成「哪个方向都能走」。<b>不耗能的前提就是顺梯度</b>，逆梯度必须耗能。</p>
</div>
<div class="er">
<p class="er-x">✗ 温度升高，被动运输的速率一定加快。</p>
<p class="er-v">✓ 温度通过影响膜的流动性和载体蛋白活性影响速率；温度过高会破坏膜结构，速率反而下降。</p>
<p class="er-w">错在哪：把温度当成单向促进因素。图 4 的第三条曲线是先升后降，不是一直上升。</p>
</div>
</div>

    /* 载体占用示意：12 个固定位置 */
    var n = 12, filled = Math.round(n * s.facil / 10), gap = tw / (n - 1), cy = Q.y + 192;
    tx(g, lx, Q.y + 178, "载体占用：" + filled + " / " + n, MID, "start", 8.8, 600);
    for (i = 0; i < n; i++) {
      el("circle", { cx: lx + i * gap, cy: cy, r: 5.6, fill: i < filled ? C_FAC : "#ffffff", stroke: "#b9c6d2", "stroke-width": 1 }, g);
    }

    wrap(g, lx, Q.y + 220, "c<2 协助扩散占优；c=2 两者相等；c>2 自由扩散反超。", tw, 8.8, "#3a3a35", 13);
    wrap(g, lx, Q.y + 258, "饱和值 Vmax = 10：浓度差再加，也变不出更多载体。", tw, 8.8, FAINT, 13);
  }

  function draw() {
    var gA = $("gxA"), gB = $("gxB");
    gA.textContent = ""; gB.textContent = "";
    var s = calc(A);
    el("rect", { x: L.left.x, y: L.left.y, width: L.left.w, height: L.left.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    el("rect", { x: L.right.x, y: L.right.y, width: L.right.w, height: L.right.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    drawChart(gA, s);
    drawBars(gB, s);
  }

  function render() {
    var s = calc(A), st, col, bg, sn;
    $("gxVa").textContent = String(Math.round(A * 10) / 10);
    $("gxVb").textContent = fmt(s.free);
    $("gxVc").textContent = fmt(s.facil);
    if (s.free < 0.6) { st = "几乎不运输"; col = "#8e97a4"; bg = "#f4f7f9"; sn = "浓度差 ≈ 0"; }
    else if (A < 1.85) { st = "协助扩散更快"; col = "#2f6fb3"; bg = "#eaf2fb"; sn = "低浓度：有载体帮忙"; }
    else if (A <= 2.15) { st = "两者相等"; col = "#b8791f"; bg = "#fdf3e0"; sn = "交叉点 c = 2"; }
    else { st = "自由扩散反超"; col = "#2f8a5b"; bg = "#e6f6ee"; sn = "协助扩散已饱和"; }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    draw();
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 1 }, { t: 3, v: 2 }, { t: 5.5, v: 2 }, { t: 8, v: 8 }, { t: 10.5, v: 18 }, { t: 13, v: 1 }],
    keys: [1, 2, 8, 18],
    value: A, min: 0, max: 20, step: 1,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;

  /* 画布每帧重建节点，mousedown 与 mouseup 之间目标可能被换掉 → click 偶尔不触发。
     在不会被清空的父容器上补一次 pointerdown，按下即接管，避免「点了没反应」。 */
  if (stage.parentElement) {
    stage.parentElement.addEventListener("pointerdown", function () { ap.take(); });
  }
  window.__bio = { calc: calc, cases: [
    { v: 2, eq: { free: 4, facil: 4 } },
    { v: 6, eq: { free: 12, facil: 6.67 } },
    { v: 18, eq: { free: 36, facil: 8.57 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
