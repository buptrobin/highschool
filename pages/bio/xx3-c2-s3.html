<p class="gx-lede">这一节在「细胞工程」的末端：前面讲细胞怎么养、怎么融、怎么核移植，这一节讲怎么把早期胚胎拿出来、分开、再放回另一头母畜体内。它最容易错的一件事，是把胚胎发育当成「越长越大」——真实情况恰恰相反：卵裂期<b>细胞越分越多，胚胎反而一点没长大</b>。抓住这一条，桑葚胚、囊胚、胚胎移植、胚胎分割会一起通。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 胚胎工程的定义<span class="q-src">人教版（2019）选择性必修3 · 第2章第3节</span></p>
<p class="q-b">胚胎工程是指对动物早期胚胎或配子所进行的多种显微操作和处理技术，如体外受精、胚胎移植、胚胎分割等。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个条件</b>组成。① 对象是<b>早期胚胎或配子</b>，不是成体、不是器官；② 手段是<b>显微操作和处理技术</b>，不是让动物自然交配；③ 后面三项只是「如」，说明还包含体外胚胎培养、胚胎干细胞培养等。少写「早期胚胎」这一步，就会被判「对象不清」。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 卵裂期体积怎么变<span class="q-src">人教版（2019）选择性必修3 · 第2章第3节</span></p>
<p class="q-b">受精卵经过卵裂形成多个细胞，此时胚胎总体积基本不变或略有缩小。</p>
<p class="q-n">→ 翻成人话：这是<b>两个条件绑在一起</b>的一句话。① 细胞数<b>增加</b>；② 胚胎总体积<b>基本不变，甚至略有缩小</b>。只写「细胞数增加」是错的，只写「体积不变」也不完整。原因是卵裂在<b>透明带</b>里进行，空间被封死，所以每分一次，单个细胞就小一圈。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 胚胎移植的实质<span class="q-src">人教版（2019）选择性必修3 · 第2章第3节</span></p>
<p class="q-b">胚胎移植的实质是早期胚胎在相同生理环境条件下的空间位置的转移。</p>
<p class="q-n">→ 翻成人话：三个关键词缺一不可。① <b>早期胚胎</b>（不是受精卵，也不是胎儿）；② <b>相同生理环境</b>（供体与受体的生殖器官生理变化必须同步）；③ <b>空间位置的转移</b>。既然是「搬家」，<b>胚胎移植就不改变遗传物质</b>——后代性状由供体决定，这是判断「像谁」的唯一依据。</p>
</div>

<tbody>
<tr><td>细胞数</td><td>2 → 8，持续增加</td><td>约 16 个</td><td>数十个以上</td></tr>

<tr><td>结构特征</td><td>在透明带内，无腔</td><td>细胞挤成一团，形似桑葚</td><td>出现囊胚腔，仍在透明带内</td></tr>

<p class="gx-note">整张表只高亮 1 行：卵裂期那一行「总体积」是全节失分点的源头——细胞数在涨、体积不涨，两个量必须一起写。桑葚胚的「约 16 个」是示意值（真实约 16–32 个），考试写「多个细胞」也不扣分。</p>
</section>

<h2><span class="sn">04</span>一道题走一遍</h2>

<div class="gx-ex">
<p class="ex-t">例题 · 卵裂期为什么「细胞多、体积不变」<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">牛受精卵在体外培养液中开始卵裂。同学观察到：细胞数目从 1 个增加到 16 个，但用测微尺量胚胎外径，几乎没有变化。<br>（1）请解释「细胞数目不断增多，胚胎总体积却基本不变」的原因。<br>（2）若此时把该胚胎均等分割成两半，得到的两个胚胎遗传物质是否相同？为什么？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 找出装置的限制</p>
<p class="s-b">题目给的是「外径几乎不变」。卵裂发生在<b>透明带</b>内，透明带是受精卵外面一层糖蛋白外壳，它的体积在卵裂期不再增大，相当于给胚胎套了一个固定大小的壳。</p>
<p class="s-k">用到：卵裂的场所——透明带内。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 把「两个量」分开写</p>
<p class="s-b">细胞数<b>增加</b>（1→2→4→…→16），胚胎总体积<b>基本不变或略有缩小</b>。两个量方向不同，不能合成一句「胚胎在长大」。</p>
<p class="s-k">用到：卵裂期细胞数与体积的变化规律。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 补上「那什么在变小」</p>
<p class="s-b">因为总空间被封死，有限的体积被越来越多的细胞分，所以<b>每个细胞的体积越来越小</b>、细胞核与细胞质的比值变大。这一步是拿满分的关键补充。</p>
<p class="s-k">用到：细胞体积与核质比的变化。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 转到第（2）问</p>
<p class="s-b">胚胎分割是把一个胚胎<b>均等分割</b>成两半，两半来自同一个受精卵的同一批细胞，遗传物质完全相同，相当于同卵双胎。但要注意：分割必须均等，否则内细胞团少的一半发育受阻。</p>
<p class="s-k">用到：胚胎分割的实质与「均等分割」的要求。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 检查有没有漏掉前提</p>
<p class="s-b">第（1）问必须点明「在透明带内」，第（2）问必须点明「均等分割」。两个前提各占 1 分，漏了答案就成了不完整表述。</p>
<p class="s-k">用到：答题的两处踩分点。</p>
</li>
</ol>

<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）① 卵裂是在透明带内进行的，透明带的空间有限，胚胎不能随之长大；② 因此细胞数目不断增加，胚胎总体积基本不变或略有缩小；③ 有限的体积被更多细胞分配，每个细胞的体积越来越小，核质比增大。<br>（2）相同。两个胚胎由同一个受精卵经有丝分裂形成的早期胚胎<b>均等分割</b>而来，遗传物质没有发生改变，相当于同卵双胎；若分割不均等，内细胞团少的一半发育会受阻。</p>
