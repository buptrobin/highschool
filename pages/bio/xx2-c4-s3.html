<p class="gx-claim">生态工程只有三个扣分点：<b>循环原理：物质循环再生</b>、<b>整体原理：自然—经济—社会统筹</b>，以及那句反常识——<b>生态工程不是不用化肥，而是系统设计</b>。</p>
<div class="gx-meta">
<span><i></i>人教版（2019）选择性必修2 第4章第3节</span>
<span><i></i>高二 · 人与环境</span>
<span><i></i>阅读 13 分钟</span>
<span><i></i>含 1 个互动模型</span>
</div>
<p class="gx-lede">这一节在第4章的位置：前面讲人口、全球性生态问题，这一节讲「怎么动手修」。课本给的定义很短，但考试要的是判据：给你一个实例（桑基鱼塘、沼气池、退耕还林、草方格），问你体现了哪个原理。<br>最容易错的一件事：把「生态工程」当成「回归自然、不用化肥农药」。生态工程不是不用化肥，而是系统设计——用物质循环和整体统筹把外部投入与废物排放一起压下去。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 生态工程的定义<span class="q-src">人教版（2019）选择性必修2 · 第4章第3节</span></p>
<p class="q-b">生态工程是指人类应用生态学和系统学等学科的原理和方法，对人工生态系统进行分析、设计和调控，以提高其生产力的工程。</p>
<p class="q-n">→ 翻成人话：这句话由<b>四个条件</b>组成：① 主体是<b>人</b>（人类应用，不是自然演替）；② 依据是<b>生态学 + 系统学</b>（两门学科，缺一个都答不全）；③ 对象是<b>人工生态系统</b>（桑基鱼塘、沼气池、农田、城市绿地）；④ 手段是<b>分析—设计—调控</b>，落点是提高生产力。少写「系统学」或把对象写成「自然生态系统」，这道概念题就只剩一半分。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 遵循的基本原理<span class="q-src">人教版（2019）选择性必修2 · 第4章第3节</span></p>
<p class="q-b">生态工程遵循自生、循环、协调、整体等生态学基本原理。</p>
<p class="q-n">→ 翻成人话：这四个词是<b>四条判据</b>，不是四个名词。题干问「主要体现了哪个原理」时抓动词：能自我维持、自我调节 → <b>自生</b>；物质回到生产环节、废弃物变原料 → <b>循环</b>；数量、结构与环境相匹配 → <b>协调</b>；同时算生态、经济、社会三本账 → <b>整体</b>。判据要能唯一锁定，才叫「主要体现」。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 生态工程的目标<span class="q-src">人教版（2019）选择性必修2 · 第4章第3节</span></p>
<p class="q-b">生态工程的目标是实现经济效益和生态效益的同步发展，达到可持续发展。</p>
<p class="q-n">→ 翻成人话：关键词只有<b>同步</b>两个字。只讲生态不讲经济，方案落不了地（农民不种、企业不干）；只讲经济不讲生态，等于透支环境。答题必须<b>两本账都写</b>，而且要用「同步发展」「可持续发展」这两个教材词收尾——写成「既保护环境又赚钱」是口语，不给分。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>原理</th><th>题干里的信号词</th><th>典型实例</th></tr></thead>
<tbody>
<tr><td>自生原理</td><td>「自我调节」「自净能力」「恢复力」</td><td>湿地自净、封山育林后群落自我恢复</td></tr>
<tr class="key"><td>循环原理</td><td>「废弃物变原料」「回到生产环节」「沼气池」</td><td>桑基鱼塘、沼气池、秸秆还田</td></tr>
<tr><td>协调原理</td><td>「数量不能超过」「结构与功能相适应」</td><td>草方格固沙选耐旱种、按载畜量放牧</td></tr>
<tr><td>整体原理</td><td>「同时考虑自然、经济、社会」「农民生计」</td><td>退耕还林配套补贴、流域生态补偿</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只背一列：<b>信号词</b>。选择题的题干通常只给一个动词短语，四个原理里只有一个能被它唯一锁定。答到「循环原理」时补一句：<b>循环原理：物质循环再生</b>——物质在系统内循环利用，减少外部投入与废物排放。</p>
</section>

<h2><span class="sn">04</span>一道题走一遍</h2>

<p class="ex-t">例题 · 简答：原理判断 + 双效益分析<span class="bdg bdg-must">必考</span></p>

<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 定原理</p>
<p class="s-b">抓动词：蚕沙、塘泥这些「废弃物」又变成了下一环的原料，物质在系统内循环利用，没有排出系统。锁定循环原理，不是自生原理（这里不是靠自我恢复），也不是协调原理（不是讲数量配比）。</p>
<p class="s-k">用到：循环原理的判据 = 废弃物是否回到生产环节。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 把链条写出来</p>
<p class="s-b">桑叶养蚕 → 蚕沙喂鱼 → 塘泥肥桑（塘泥中的无机盐被桑树重新吸收），三条箭头闭合。答题时必须把这三环写全，只写「物质循环利用」不给过程分。</p>
<p class="s-k">用到：物质循环再生，食物链/食物网中的物质流向。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 算生态账</p>
<p class="s-b">对外：少买饲料、少施化肥 → 外部投入下降；蚕沙、塘泥不直排 → 废物排放下降，水体富营养化减轻。用互动模型的式子说：再利用率 r 越高，<span class="gx-fml">100 − r</span> 的外部投入和排放同时变小。</p>
<p class="s-k">用到：<span class="gx-fml">外部投入 = 排放 = 100 − r</span>。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 算经济账</p>
<p class="s-b">同样一片基塘，同时产出蚕丝、鱼、桑叶多份产品，投入成本下降、产品种类增加，农民收入上升。这就是「经济效益和生态效益同步发展」中的经济那一半，不能漏。</p>
<p class="s-k">用到：整体原理要三本账一起算。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 评价那句话</p>
<p class="s-b">这句话把生态工程窄化成了「禁用化肥农药」。生态工程的核心是系统设计：通过物质循环、物种搭配、整体统筹，把外部投入与排放降下来；必要时仍可合理使用化肥农药，关键是不超过系统承载力、不破坏循环。</p>
<p class="s-k">用到：生态工程不是不用化肥，而是系统设计。</p>
</li>

<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 生态工程就是搞绿化、保护环境，跟经济没关系。</p>
<p class="er-v">✓ 生态工程的目标是实现经济效益和生态效益的同步发展，达到可持续发展。</p>
<p class="er-w">错在哪：把整体原理砍成一半。只写生态不写经济，方案落不了地，也拿不到「同步发展」这个采分点。</p>
</div>
<div class="er">
<p class="er-x">✗ 生态工程就是不用化肥、不用农药，回归自然。</p>
<p class="er-v">✓ 生态工程不是不用化肥，而是系统设计：用物质循环再生与整体统筹降低外部投入和排放。</p>
<p class="er-w">错在哪：把手段当成目的。生态工程靠的是分析—设计—调控，不是「禁用清单」；合理用量不超承载力并不违背生态工程。</p>
</div>

<p class="er-v">✓ 循环原理：物质循环再生，废弃物成为下一环节的原料，重新进入生产环节。</p>
<p class="er-w">错在哪：判据错了。垃圾分类只是前端，烧掉发电是「出去」不是「回来」；能不能回到生产环节，才是循环原理的判据。</p>

<p class="er-v">✓ 整体原理是自然—经济—社会统筹，三本账一起算，不能只看自然一边。</p>
<p class="er-w">错在哪：保护区面积只是自然那一本账。题干一旦出现农民生计、补贴、就业，考的就是整体原理。</p>

<p class="er-w">错在哪：把「少投入」误读成「低产出」。定义里明写「以提高其生产力」，桑基鱼塘就是多产品同时产出。</p>

<p class="er-w">错在哪：割裂了原理与工程。生态工程正是把自然界的物质循环「设计」进人工系统。</p>

<p class="er-w">错在哪：把资源叫成废物。清走塘泥等于切断循环，外部投入和排放都会上升（对应互动模型里 r 下降）。</p>

<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  let G = null, L = null, stage = null;

  /* 唯一真值：再利用率 r → 外部投入 / 排放 */
  function calc(r) {
    r = Math.max(0, Math.min(90, Number(r) || 0));
    return { r, input: 100 - r, output: 100 - r };
  }

  const ST = [
    { t: "线性经济", c: "#b8402f", s: "r < 30：高投入高排放" },
    { t: "部分循环", c: "#b8791f", s: "30–70：部分回用" },
    { t: "接近循环经济", c: "#2f8a5b", s: "r > 70：投入排放都低" }
  ];
  const stateOf = (r) => ST[r < 30 ? 0 : r <= 70 ? 1 : 2];
  const layout = () => ((stage.parentNode ? stage.parentNode.clientWidth : innerWidth) >= 640 ? "W" : "N");

  function geom() {
    const W = L === "W";
    stage.setAttribute("viewBox", W ? "0 0 880 470" : "0 0 360 700");
    return W
      ? { lp: [16,16,424,438], rp: [456,16,408,438], bw: 150, bh: 46, ct: [239,214], big: [239,434],
          bx: [[60,96],[268,96],[268,320],[60,320]], barX: 476, barW: 340, barH: 24, ly: [92,164,236],
          ty: [100,172,244], dyn: [332,354,376], fs: 10.4, tfs: 11, bf: 10 }
      : { lp: [8,8,344,300], rp: [8,320,344,372], bw: 126, bh: 38, ct: [176,130], big: [176,288],
          bx: [[30,52],[196,52],[196,196],[30,196]], barX: 26, barW: 296, barH: 22, ly: [386,440,494],
          ty: [394,448,502], dyn: [562,586,610], fs: 8.8, tfs: 9.2, bf: 9.2 };
  }

  const rc = (p, w, h, f, s, rx = 8) =>
    `<rect x="${p[0]}" y="${p[1]}" width="${w}" height="${h}" rx="${rx}" fill="${f}" stroke="${s}"/>`;
  const tx = (x, y, fs, f, t, a = "") => `<text x="${x}" y="${y}" font-size="${fs}" fill="${f}"${a}>${t}</text>`;

  function arrow(x1, y1, x2, y2, c) {
    const dx = x2 - x1, dy = y2 - y1, d = Math.hypot(dx, dy) || 1, ux = dx / d, uy = dy / d,
      px = -uy, py = ux, h = 7, w = 4;
    return `<line x1="${x1}" y1="${y1}" x2="${x2 - h * 0.9 * ux}" y2="${y2 - h * 0.9 * uy}" stroke="${c}" stroke-width="2"/>`
      + `<polygon points="${x2},${y2} ${x2 - h * ux + w * px},${y2 - h * uy + w * py} ${x2 - h * ux - w * px},${y2 - h * uy - w * py}" fill="${c}"/>`;
  }

  function leftSVG(c) {
    const g = G, [A, B, C, D] = g.bx;
    const T = ["桑树（生产者）", "家蚕", "鱼", "塘泥"], S = ["固定光能", "食桑叶", "食蚕沙", "分解肥桑"];
    const F = ["#e6f6ee", "#ffffff", "#ffffff", "#fdf3e0"], K = ["#8ecfae", "#dbe7ef", "#dbe7ef", "#e6c993"];
    const I = ["#146b3a", "#151a21", "#151a21", "#8a5a10"];
    let s = rc(g.lp, g.lp[2], g.lp[3], "#f8fbfd", "#dbe7ef", 10)
      + tx(g.lp[0] + 20, g.lp[1] + 28, g.tfs, "#5a6472", "物质在系统内循环", ' font-weight="700"');
    g.bx.forEach((b, i) => {
      s += rc(b, g.bw, g.bh, F[i], K[i])
        + tx(b[0] + 10, b[1] + 18, g.bf, I[i], T[i], ' font-weight="700"')
        + tx(b[0] + 10, b[1] + 33, g.fs, "#3a3a35", S[i]);
    });
    s += arrow(A[0] + g.bw, A[1] + g.bh / 2, B[0], B[1] + g.bh / 2, "#0f8a5f")
      + arrow(B[0] + g.bw / 2, B[1] + g.bh, C[0] + g.bw / 2, C[1], "#b8791f")
      + arrow(C[0], C[1] + g.bh / 2, D[0] + g.bw, D[1] + g.bh / 2, "#b8791f")
      + arrow(D[0] + g.bw / 2, D[1], A[0] + g.bw / 2, A[1] + g.bh, "#0f8a5f");
    (L === "W" ? ["桑叶养蚕 → 蚕沙喂鱼", "废弃物 = 下一环原料"] : ["桑叶养蚕 → 蚕沙喂鱼"])
      .forEach((t, i) => { s += tx(g.ct[0], g.ct[1] + i * 20, g.fs, "#22495e", t, ' text-anchor="middle"'); });
    const m = Math.round(c.r), v = Math.round(c.input);
    return s + tx(g.big[0], g.big[1], g.tfs + 0.5, "#146b3a",
      `回用 ${m}% → 投入 ${v}、排放 ${v}`, ' font-weight="700" text-anchor="middle"');
  }

  function rightSVG(c) {
    const g = G, V = [c.input, c.output, c.r];
    const LAB = ["外部输入 = 100 − r", "排放 = 100 − r", "循环再用 r"];
    const CL = ["#b8791f", "#b8402f", "#2f8a5b"];
    let s = rc(g.rp, g.rp[2], g.rp[3], "#ffffff", "#e6e9ee", 10)
      + tx(g.barX, g.rp[1] + 32, g.tfs, "#5a6472", "投入与排放（相对值）", ' font-weight="700"');
    for (let i = 0; i < 3; i++) {
      s += tx(g.barX, g.ly[i], g.fs, "#3a3a35", LAB[i])
        + tx(g.barX + g.barW, g.ly[i], g.tfs, CL[i], Math.round(V[i]), ' font-weight="700" text-anchor="end"')
        + `<rect x="${g.barX}" y="${g.ty[i]}" width="${g.barW}" height="${g.barH}" rx="4" fill="#eef2f5"/>`
        + `<rect x="${g.barX}" y="${g.ty[i]}" width="${g.barW * V[i] / 100}" height="${g.barH}" rx="4" fill="${CL[i]}"/>`;
    }
    const m = Math.round(c.r), v = Math.round(c.input);
    const d = ["投入 = 排放 = " + v, "r=50 各减半（停留点）", `r=${m}%：省投入少排污`];
    for (let i = 0; i < 3; i++) {
      s += tx(g.barX, g.dyn[i], g.fs, i === 2 ? "#146b3a" : "#5a6472", d[i]);
    }
    return s;
  }

  function render() {
    if (!G) { L = layout(); G = geom(); }
    const sl = $("gxSl"), r = sl ? parseFloat(sl.value) : 50;
    if (!isFinite(r)) r = 50;
    const c = calc(r), st = stateOf(r), box = $("gxStBox");
    $("gxA").innerHTML = leftSVG(c);
    $("gxB").innerHTML = rightSVG(c);
    $("gxVa").textContent = Math.round(r) + "%";
    $("gxVb").textContent = String(Math.round(c.input));
    $("gxVc").textContent = String(Math.round(c.output));
    $("gxVs").textContent = st.t;
    $("gxVsn").textContent = st.s;
    $("gxVs").style.color = st.c;
    if (box) {
      box.style.borderColor = st.c + "55";
      box.style.background = st.c === "#2f8a5b" ? "#e6f6ee" : st.c === "#b8791f" ? "#fdf3e0" : "#fbeae7";
    }
  }

  function setMode(m) {
    const b = $("gxAp"), t = $("gxApTxt");
    if (b) { b.classList.toggle("is-auto", m === "auto"); b.classList.toggle("is-manual", m !== "auto"); }
    if (t) t.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  function init() {
    stage = $("gxStage");
    if (!stage) return;
    render();
    const sl = $("gxSl");
    if (sl) sl.addEventListener("input", render);
    addEventListener("resize", () => { G = null; render(); });
    if (window.AutoPilot && window.AutoPilot.create) {
      window.__ap = window.AutoPilot.create({
        mount: stage, follow: sl,
        loop: [{ t: 0, v: 0 }, { t: 1.2, v: 0 }, { t: 4, v: 50 }, { t: 6.5, v: 50 },
          { t: 9, v: 90 }, { t: 11, v: 70 }, { t: 13, v: 0 }],
        keys: [0, 50, 70, 90], value: 0, min: 0, max: 90, step: 5, idle: 5000,
        onChange: render, onMode: setMode
      });
    }
    const steps = $("gxSteps") ? $("gxSteps").querySelectorAll(".step") : [];
    let idx = 0;
    const next = $("gxNext");
    if (next) {
      next.addEventListener("click", function () {
        if (idx < steps.length - 1) {
          steps[idx + 1].hidden = false;
          idx++;
          $("gxCnt").textContent = (idx + 1) + " / " + steps.length;
          if (idx === steps.length - 1) {
            $("gxAns").hidden = false;
            this.textContent = "看完了";
            this.disabled = true;
          }
        }
      });
    }
  }

  window.__bio = {
    calc,
    cases: [
      { v: 0, eq: { input: 100, output: 100 } },
      { v: 50, eq: { input: 50, output: 50 } },
      { v: 90, eq: { input: 10, output: 10 } }
    ]
  };
  window.__model = window.__bio;

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
