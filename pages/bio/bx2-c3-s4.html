<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 本节标题句<span class="q-src">人教版（2019）必修2 · 第3章第4节</span></p>
<p class="q-b">基因通常是有遗传效应的 DNA 片段。</p>
<p class="q-n">→ 这句话由<b>三个条件</b>组成：① <b>有遗传效应</b>——这一段能控制生物性状、能复制并传递下去，DNA 上沉默的片段不算；② <b>是 DNA 片段</b>——它是 DNA 分子的一部分，不是整个 DNA 分子，也不是染色体；③ <b>「通常」</b>——绝大多数生物的基因如此，但少数病毒（如烟草花叶病毒、HIV）的基因由 RNA 构成。少写任何一个，这道填空就扣分。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 数量与位置<span class="q-src">人教版（2019）必修2 · 第3章第4节</span></p>
<p class="q-b">一个 DNA 分子上有许多个基因，基因在染色体上呈线性排列。</p>
<p class="q-n">→ 两件事：① <b>一 DNA 多基因</b>，所以「一个 DNA 只有一个基因」是错的；② <b>线性排列</b>——基因沿染色体一个接一个排，不重叠、不分叉。注意「许多个」不是「无数个」，一个 DNA 上的基因数是有具体数目的。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 遗传信息在哪<span class="q-src">人教版（2019）必修2 · 第3章第4节</span></p>
<p class="q-b">基因中的遗传信息蕴藏在 4 种碱基的排列顺序之中。</p>
<p class="q-n">→ 关键词是「<b>排列顺序</b>」不是「种类」。四种碱基 A、T、G、C 所有生物都一样，信息差别只在先后次序。所以「碱基种类决定遗传信息」是错的，「碱基对的排列顺序决定遗传信息」才对。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>DNA 分子</th><th>基因</th></tr></thead>
<tbody>
<tr><td>化学本质</td><td>脱氧核苷酸长链，通常双链</td><td>有遗传效应的 DNA 片段</td></tr>
<tr><td>范围</td><td>整条链，含基因片段 + 非基因片段</td><td>DNA 上的一段，被非基因片段隔开</td></tr>
<tr><td>数量关系</td><td>一个 DNA 上有许多个基因</td><td>一个基因只是 DNA 的一小段</td></tr>
<tr class="key"><td>判据（只记这条）</td><td>有 DNA 不等于有基因</td><td>必须<b>有遗传效应</b>，非基因片段不算</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">背法：先答「有遗传效应的 DNA 片段」，再补「一个 DNA 上有许多个基因，呈线性排列」。答题时「有遗传效应」这五个字不能省，它是判据。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 基因长度与编码能力<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">某真核生物的基因 A 含 900 个碱基对。<br>（1）该基因最多能编码多少个氨基酸？<br>（2）若该基因转录出的 mRNA 上共有 900 个碱基，其中终止密码子 1 个，则实际编码的氨基酸最多多少个？<br>（3）若该基因含 2 个内含子，第（1）问的答案会怎样变化？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题：先把单位认清</p>
<p class="s-b">题干给的是「碱基<b>对</b>」数 900，不是碱基数。DNA 是双链，一条链上 900 个碱基，mRNA 以其中一条链为模板，所以 mRNA 也是 900 个碱基。这一步只解决「L 是什么」。</p>
<p class="s-k">用到：DNA 双链 → mRNA 单链，碱基数不变。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 定关系：3 个碱基一组</p>
<p class="s-b">mRNA 上相邻 3 个碱基是一个密码子，决定 1 个氨基酸。所以氨基酸数由「碱基数 ÷ 3」决定，不是「碱基数」。写成式子就是 900 ÷ 3。</p>
<p class="s-k">用到：1 个密码子 = 3 个碱基 = 1 个氨基酸。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 算第（1）问</p>
<p class="s-b">900 ÷ 3 = 300。答「最多 300 个氨基酸」。写「最多」是因为还没考虑终止密码子，题目问「最多」就必须保留这两个字。</p>
<p class="s-k">用到：「最多」是题目给的限定词，答里要带上。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 第（2）问：减掉终止密码子</p>
<p class="s-b">900 个碱基里有 1 个终止密码子，它占 3 个碱基但不编码氨基酸。所以能编码的密码子是 900 ÷ 3 − 1 = 299 个，对应最多 299 个氨基酸。注意：终止密码子不编码氨基酸，不是「编码一个终止氨基酸」。</p>
<p class="s-k">用到：终止密码子不编码氨基酸。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 第（3）问：内含子让答案变小</p>
<p class="s-b">真核基因有内含子，内含子也转录到前体 mRNA 里，但剪接时被切除，不参与翻译。所以真正能编码的只有外显子部分，实际氨基酸数<b>少于</b> 300。若不知道外显子占多少，只能答「少于 300 个」，不能答具体数。</p>
<p class="s-k">用到：内含子不编码氨基酸，真核基因实际编码数 &lt; L ÷ 3。</p>
</li>
</ol>

<button id="gxNext" type="button">下一步</button>

<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）900 ÷ 3 = 300（个）。<br>（2）能编码的密码子为 900 ÷ 3 − 1 = 299 个，故最多编码 299 个氨基酸（终止密码子不编码氨基酸）。<br>（3）会变少。真核基因含内含子，内含子转录后会被剪接切除，只有外显子参与编码，因此实际编码的氨基酸数少于 300 个。<br>答题要点：①先写「碱基对数 ÷ 3」；②「最多」不能丢；③涉及真核基因必须补一句内含子。</p>

<p class="q">「基因和 DNA 到底谁包含谁？」</p>
<p class="a">基因是 DNA 上<b>有遗传效应的片段</b>，一个 DNA 分子上含有许多个基因。所以是 <b>DNA ⊃ 基因</b>，不能把两者当同义词。说「基因就是 DNA 分子」和「任意一段 DNA 都是基因」都错。</p>

<p class="a">因为<b>少数病毒的基因由 RNA 构成</b>（如烟草花叶病毒、HIV），它们的遗传物质是 RNA 不是 DNA。所以「基因是有遗传效应的 DNA 片段」不是绝对句，加「通常」才严谨。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 基因就是 DNA 分子。</p>
<p class="er-v">✓ 基因是有遗传效应的 DNA 片段，一个 DNA 分子上有许多个基因。</p>
<p class="er-w">错在哪：把「部分」说成了「整体」。DNA 是整条链，基因只是其中一段。</p>

<script>
/* bx2-c3-s4 互动脚本（不带 <script> 标签） */
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var GX = window.GX, el = GX.el, tx = GX.tx, $ = GX.$;
  var stage = $("gxStage");
  if (!stage || !window.AutoPilot) return;

  var C = { ink: "#151a21", mut: "#5a6472", dim: "#7a8794", blue: "#2f6f9e", light: "#e8f2fa", edge: "#b8d7e9", green: "#2f8a5b", amber: "#b8791f", red: "#b8402f" };

  /* 两套坐标：宽屏 880×470，窄屏独立 360×700 */
  var W = { vb: "0 0 880 470", pa: { x: 16, y: 16, w: 424, h: 438 }, pb: { x: 456, y: 16, w: 408, h: 438 } };
  var N = { vb: "0 0 360 700", pa: { x: 8, y: 8, w: 344, h: 300 }, pb: { x: 8, y: 320, w: 344, h: 372 } };
  var L = W, A = 900, G = null;

  /* 纯函数：参数 → 数值。render() 和 __bio.cases 都用它 */
  function calc(v) {
    var aa = v / 3;
    return { aa: aa, mrna: v, water: aa - 1 };
  }

  /* 布局几何：只在 layout() 和 render() 兜底时算一次 */
  function geom() {
    var wide = (L === W), pa = L.pa, pb = L.pb;
    var band = {
      x: pa.x + (wide ? 20 : 16),
      y: pa.y + (wide ? 150 : 120),
      w: wide ? 384 : 312,
      h: wide ? 34 : 26
    };
    var bx = pb.x + (wide ? 24 : 16), bw = wide ? 360 : 312;
    var ys = wide ? [92, 190, 288] : [72, 148, 224];
    var bh = wide ? 20 : 18, bars = [];
    for (var i = 0; i < 3; i++) bars.push({ x: bx, y: pb.y + ys[i], w: bw, h: bh });
    return { wide: wide, pa: pa, pb: pb, band: band, bars: bars, bw: bw };
  }

  function draw() {
    var gA = $("gxA"), gB = $("gxB");
    gA.textContent = ""; gB.textContent = "";
    var wide = G.wide, pa = G.pa, pb = G.pb, b = G.band, s = calc(A);

    el("rect", { x: pa.x, y: pa.y, width: pa.w, height: pa.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    el("rect", { x: pb.x, y: pb.y, width: pb.w, height: pb.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    tx(gA, pa.x + 20, pa.y + 30, "一个 DNA 分子（长带子）", C.mut, "start", wide ? 10.5 : 9.6, 700);
    tx(gB, pb.x + 24, pb.y + 30, "mRNA 与多肽（按比例）", C.mut, "start", wide ? 10.5 : 9.6, 700);

    /* 左：带子 + 深色基因段 */
    el("rect", { x: b.x, y: b.y, width: b.w, height: b.h, rx: 6, fill: C.light, stroke: C.edge }, gA);
    var gw = Math.max(42, Math.round(b.w * (0.16 + 0.62 * (A - 300) / 2700)));
    el("rect", { x: b.x + 2, y: b.y + 2, width: gw, height: b.h - 4, rx: 4, fill: C.blue }, gA);
    tx(gA, b.x + gw / 2, b.y + b.h / 2 + 3.6, "基因", "#ffffff", "middle", wide ? 10 : 9, 700);
    tx(gA, b.x, b.y - 10, "L = " + Math.round(A) + " 个碱基对", C.mut, "start", wide ? 9.4 : 8.8, 400);
    tx(gA, b.x + b.w, b.y - 10, "非基因片段", C.dim, "end", 8.6, 400);
    tx(gA, b.x, b.y + b.h + 22, "基因只是带子上的一段", C.mut, "start", wide ? 9.4 : 8.6, 400);

    var l1 = b.y + b.h + 40, l2 = l1 + 22, l3 = l1 + 54;
    el("rect", { x: b.x, y: l1 - 10, width: 22, height: 12, rx: 3, fill: C.blue }, gA);
    tx(gA, b.x + 30, l1, "基因：有遗传效应的片段", C.ink, "start", wide ? 9.4 : 8.8, 400);
    el("rect", { x: b.x, y: l2 - 10, width: 22, height: 12, rx: 3, fill: C.light, stroke: C.edge }, gA);
    tx(gA, b.x + 30, l2, "非基因片段：没有遗传效应", C.ink, "start", wide ? 9.4 : 8.8, 400);
    tx(gA, b.x, l3, "每 3 个碱基对 → 1 个氨基酸", C.blue, "start", wide ? 9.4 : 8.8, 700);
    tx(gA, b.x, l3 + (wide ? 26 : 24), "深色只是一小段，非基因片段可以很长", C.dim, "start", wide ? 9 : 8.4, 400);

    /* 右：三条按比例的长条 */
    var rows = [
      { n: "mRNA 碱基数", v: s.mrna, max: 3000, c: C.blue },
      { n: "最多氨基酸数", v: s.aa, max: 1000, c: C.green },
      { n: "脱水数", v: s.water, max: 1000, c: C.amber }
    ];
    for (var i = 0; i < 3; i++) {
      var r = G.bars[i], rw = Math.max(4, r.w * rows[i].v / rows[i].max);
      tx(gB, r.x, r.y - 8, rows[i].n, C.mut, "start", wide ? 9.4 : 8.8, 400);
      tx(gB, r.x + r.w, r.y - 8, Math.round(rows[i].v) + " 个", C.ink, "end", wide ? 10 : 9.2, 700);
      el("rect", { x: r.x, y: r.y, width: r.w, height: r.h, rx: 4, fill: "#eef2f6" }, gB);
      el("rect", { x: r.x, y: r.y, width: rw, height: r.h, rx: 4, fill: rows[i].c }, gB);
    }
    var f1 = pb.y + (wide ? 342 : 272);
    tx(gB, G.bars[0].x, f1, "氨基酸数 = L ÷ 3", C.mut, "start", wide ? 9.4 : 8.6, 400);
    tx(gB, G.bars[0].x, f1 + (wide ? 24 : 22), "mRNA 碱基数 = L；脱水数 = aa − 1", C.mut, "start", wide ? 9.4 : 8.6, 400);
    tx(gB, G.bars[0].x, f1 + (wide ? 48 : 44), "L = 900 时最多 300 个氨基酸", C.green, "start", wide ? 9.4 : 8.6, 700);
    tx(gB, G.bars[0].x, f1 + (wide ? 72 : 66), "真核基因有内含子 → 实际更少", C.red, "start", wide ? 9.4 : 8.6, 400);
  }

  function render() {
    if (!G) { L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N; G = geom(); }
    var s = calc(A), st, col, bg, sn;
    $("gxVa").textContent = String(Math.round(A));
    $("gxVb").textContent = String(Math.round(s.mrna));
    $("gxVc").textContent = String(Math.round(s.aa));
    $("gxVc").nextElementSibling.textContent = "脱水数 " + Math.round(s.water);
    if (A < 900) { st = "偏短"; col = "#b8791f"; bg = "#fdf3e0"; sn = "编码的氨基酸少于 300 个"; }
    else if (A <= 2100) { st = "典型长度"; col = "#2f8a5b"; bg = "#e6f6ee"; sn = "L = 900 是最标准的一格"; }
    else { st = "长基因"; col = "#2f8a5b"; bg = "#e6f6ee"; sn = "编码的氨基酸超过 700 个"; }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    draw();
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    G = geom();
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 300 }, { t: 1.2, v: 300 }, { t: 4, v: 900 }, { t: 6.5, v: 900 }, { t: 9, v: 3000 }, { t: 11, v: 1500 }, { t: 13, v: 300 }],
    keys: [300, 900, 1500, 3000],
    value: A, min: 300, max: 3000, step: 100,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__bio = { calc: calc, cases: [
    { v: 300, eq: { aa: 100 } },
    { v: 900, eq: { aa: 300 } },
    { v: 3000, eq: { aa: 1000 } }
  ] };
  window.__model = window.__bio;

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
