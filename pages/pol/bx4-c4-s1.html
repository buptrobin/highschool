<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">这一框的答案压在五句话上：实践是什么、实践有哪三个特点、实践为什么是认识的基础、认识怎么反作用于实践、直接经验和间接经验是什么关系。先照抄，再拆关键词。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 实践的含义与三个特点<span class="q-src">人教版（2019）必修4 哲学与文化 · 第四课第一框</span></p>
<p class="q-b">实践是人们改造客观世界的物质性活动。实践以人为主体、以客观事物为对象。实践是一种直接现实性活动，它可以把人们头脑中的观念的存在变为现实的存在。实践具有客观物质性、主观能动性和社会历史性。</p>
<p class="q-n">→ 翻成人话：定义拆成三个零件——主体是人，对象是客观事物，动作是改造。定义里最硬的一句是「直接现实性」：你脑子里的方案再漂亮，也只是观念的存在；只有动手做，观念才变成现实的存在。三个特点各管一件事：客观物质性看「有没有用物质手段、有没有按规律来」，主观能动性看「有没有目的、计划和方案」，社会历史性看「是不是在一定社会关系里做、受不受当时条件限制」。判断题里出现「实践是纯主观的活动」「实践可以随心所欲」「实践只是个人的事」，都是在这三个词上翻车。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 实践是认识的基础<span class="q-src">人教版（2019）必修4 哲学与文化 · 第四课第一框</span></p>
<p class="q-b">实践是认识的基础。实践是认识的来源。认识是主体对客体的能动反映，这种反映只有在实践中、在主体和客体的相互作用中才能实现。实践是认识发展的动力。实践是检验认识的真理性的唯一标准。实践是认识的目的。</p>
<p class="q-n">→ 翻成人话：四点背成「来、推、验、去」。来：认识在实践里产生，主体和客体在实践中相遇，才有反映。推：实践提出新问题、提供新工具，推着认识往前走。验：认识对不对，只有实践能验，因为实践有直接现实性，能把主观的认识和客观的结果摆到一起对照。去：认识最后要回到实践中去，为实践服务。答题时按这个顺序写，一点配一句材料，别只写「实践很重要」就收笔。这里还有个高频坑：认识的来源是实践，不是人脑，也不是书本。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 认识对实践的反作用<span class="q-src">人教版（2019）必修4 哲学与文化 · 第四课第一框</span></p>
<p class="q-b">认识对实践具有反作用。正确的认识、科学理论对实践具有指导作用，错误的认识对实践具有阻碍作用。人们获得认识的途径有直接经验和间接经验，但认识的来源只有一个，那就是实践。</p>
<p class="q-n">→ 翻成人话：这一段说的是「反过来」的那一半。前面讲实践决定认识，这里讲认识也能影响实践：方向对，帮你少走弯路；方向错，让你越用力越远。要注意分量——实践决定认识是根本的，认识对实践是反作用，两个词不能对调。后半句是送分点也是送命点：直接经验、间接经验都只是「途径」，来源只有实践一个。你读的书、听的课，是别人从实践中得来的认识，对你来说只是间接经验。</p>
</div>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。五步走完，答案的骨架自己就长出来了。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 原因类材料题<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">材料：中国农业大学的师生把课堂搬到河北曲周县的村里，一住就是几个月。他们先跟着农民下地，发现老乡的麦田浇水量比试验田多出三成，产量却没有上去。为什么？师生们取土样、测墒情、记气温，一点点找原因，最后判断是「大水漫灌把根泡坏了」。为了验证，他们在同一片地里划出对比田：一半按老办法浇，一半按新方案浇，一季一季称重、记账。三年下来，新方案省水三成、增产一成半。技术成熟后，师生把它编成一本薄薄的手册，教村民自己测墒、自己调水量；村民学会以后，又根据自家地块的情况改了浇水的次数。如今，这套办法已经推广到周边十几个县。结合材料，运用「实践是认识的基础」的知识，说明科技小院的师生为什么能把论文写在大地上。（12 分）</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性</p>
<p class="s-b">题型是「说明原因」，知识范围是「实践是认识的基础」，主体是师生和农民，对象是浇水技术。设问要答两层：一是原理是什么，二是材料哪里体现了它。草稿上先写四个词：来源、动力、检验标准、目的。</p>
<p class="s-k">用到：原因类设问的两层结构（原理 + 材料）</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 找主体和行为</p>
<p class="s-b">材料里做事的是两拨人：师生（下地、取土样、测墒情、划对比田、编手册）和农民（按老办法浇，学会后自己改水量）。动作可以分成三段：先下去看，再回来验，最后教出去。答案的顺序，就照这三段走。</p>
<p class="s-k">用到：主体 + 行为 → 概念的翻译法</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 找关键词</p>
<p class="s-b">「跟着农民下地、取土样」对来源；「为什么产量没上去、一点点找原因」对动力；「划出对比田、一季一季称重」对检验标准；「编成手册、教村民自己测墒」对目的；「村民自己改浇水次数」对认识的反作用。一句话一个词，别把四个词堆在一句里。</p>
<p class="s-k">用到：来源、动力、检验标准、目的、反作用</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 搭框架</p>
<p class="s-b">四层，一层一个采分点：① 实践是认识的来源；② 实践是认识发展的动力；③ 实践是检验认识真理性的唯一标准；④ 实践是认识的目的。每层都按「原理一句 + 材料一句」写，最后补一句认识对实践的反作用，把「村民自己改水量」用上。</p>
<p class="s-k">用到：来 → 推 → 验 → 去 + 反作用</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口与自查</p>
<p class="s-b">结尾回扣题目：「论文写在大地上」，说的就是认识从实践中来、又回到实践中去。写完回头查三处：有没有写「认识来源于人脑或书本」，有没有写「多数人认为对就是真理」，有没有写「理论比实践重要」。这三句一出现，前面写得再好也要扣分。</p>
<p class="s-k">用到：收口句 + 三句易错口径</p>
</li>
</ol>

<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">① 实践是认识的来源。认识是主体对客体的能动反映，这种反映只有在实践中、在主体和客体的相互作用中才能实现。师生住在村里、跟着农民下地，才发现「浇水量多出三成、产量却没上去」这个真问题；这个判断不是从书本上抄来的，是在田里看出来的。<br>② 实践是认识发展的动力。实践不断提出新问题、提供新工具，推动认识向前发展。为了弄清产量为什么没上去，师生取土样、测墒情、记气温，问题一个接一个，认识也一层深一层，最后才找到「大水漫灌把根泡坏」这个原因。<br>③ 实践是检验认识真理性的唯一标准。只有实践能把主观认识和客观结果联系起来加以对照。判断对不对，不看谁说得漂亮，而看对比田：一半老办法、一半新方案，一季一季称重记账，省水三成、增产一成半，数据替他们作了证。<br>④ 实践是认识的目的。认识从实践中来，最终还要回到实践中去，为实践服务。师生把技术编成手册，教村民自己测墒、自己调水量，认识只有落到种地上，才算真正有用。<br>⑤ 认识对实践具有反作用，正确的认识、科学理论对实践具有指导作用。村民学会测墒以后，又按自家地块的情况改浇水次数，说明认识一旦被群众掌握，就能反过来推动实践。<br>结论：「把论文写在大地上」，说的正是认识从实践中来、又回到实践中去这个过程；离开实践，再漂亮的论文也只是一堆观念的存在。</p>

<div class="qac">
<p class="q">「检验认识对不对，看多数人意见行不行？」</p>
<p class="a">不行。实践是检验认识真理性的<b>唯一标准</b>。因为实践具有直接现实性，能把主观认识和客观结果摆到一起对照；多数人意见、专家权威、自己的感觉，都还停在主观这一侧，人再多也可能一起错。</p>

<text x="63" y="76" font-size="8" text-anchor="middle" fill="#3a3a35">仍是主观认识</text>
<text x="120" y="70" font-size="14" text-anchor="middle" fill="#6b7280">≠</text>
<rect x="134" y="40" width="86" height="48" rx="7" fill="#ffffff" stroke="#b8e6d0"/>
<text x="177" y="60" font-size="8.4" font-weight="700" text-anchor="middle" fill="#1e6640">实践检验</text>

<text x="120" y="117" font-size="8" text-anchor="middle" fill="#6b7280">结果出来了，才算验过</text>
</svg>
</div>

<div class="qac">
<p class="q">「认识对实践有反作用，那是不是理论比实践更重要？」</p>
<p class="a">不是。实践<b>决定</b>认识，认识对实践只是<b>反作用</b>：正确的认识、科学理论起指导作用，错误的认识起阻碍作用。理论再对，也不能代替动手；它对不对，最后还要回到实践里检验。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="实践决定认识，认识对实践是反作用">

<text x="120" y="26" font-size="9.2" text-anchor="middle" fill="#151a21">不是理论比实践重要</text>
<rect x="24" y="36" width="192" height="30" rx="7" fill="#ffffff" stroke="#b8e6d0"/>

<rect x="24" y="72" width="192" height="30" rx="7" fill="#ffffff" stroke="#e7d3b8"/>
<text x="120" y="91" font-size="8.6" text-anchor="middle" fill="#8a5c14">认识反作用于实践（指导或阻碍）</text>
<text x="120" y="114" font-size="8" text-anchor="middle" fill="#3a3a35">反作用不等于决定作用，顺序不能颠倒</text>
</svg>
</div>

<div class="qac">
<p class="q">「实践三个特点总混，怎么分？」</p>
<p class="a">看材料在强调什么。客观物质性看<b>手段和规律</b>，主观能动性看<b>目的和计划</b>，社会历史性看<b>条件和时代</b>。一条材料通常只突出一个特点，别三个一起往上堆，堆多了反而说明你没读懂材料。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="实践三个特点的区分办法">

<rect x="20" y="88" width="200" height="22" rx="6" fill="#ffffff" stroke="#e7d3b8"/>
<text x="30" y="103" font-size="8.2" fill="#8a5c14">社会历史性：看条件、看时代</text>
<text x="120" y="117" font-size="8" text-anchor="middle" fill="#6b7280">一条材料只突出一个</text>
</svg>
</div>

<div class="qac">
<p class="q">「只有亲身经历的才算认识吗？」</p>
<p class="a">不是。直接经验和间接经验<b>都是获得认识的途径</b>，认识的来源仍然是实践。人不可能事事亲身经历，读书、听课就是站在别人实践的肩膀上；但学来的东西要能用、能验证，最后还得回到实践中去。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="直接经验和间接经验都是途径，来源是实践">

<rect x="130" y="40" width="90" height="34" rx="7" fill="#ffffff" stroke="#e7d3b8"/>
<text x="175" y="61" font-size="8.6" font-weight="700" text-anchor="middle" fill="#8a5c14">间接经验</text>

</div>
<p class="gx-note">六问其实是同一件事：认识从哪来（来源）、为什么往前走（动力）、凭什么说对（检验标准）、最后干什么用（目的），再加上认识怎么反过来影响实践。这五层问完，材料题的采分点就自己排好队了。答题时别再另起炉灶，顺着这个顺序写，一点一句材料，比背十句口号管用。</p>
