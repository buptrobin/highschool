<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">这一框的分数压在三个词上：新型政党制度、参政党、专门协商机构。先照抄课本，再拆关键词；答题时写课本那句，不写你脑子里那句。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 我国的政党制度<span class="q-src">人教版（2019）必修3 政治与法治 · 第六课第一框</span></p>
<p class="q-b">中国共产党领导的多党合作和政治协商制度，是我国的一项基本政治制度，是中国特色社会主义政党制度，是我国的新型政党制度。共产党领导、多党派合作，共产党执政、多党派参政，是这一制度区别于其他政党制度的显著特征。</p>
<p class="q-n">→ 翻成人话：这句话由四个「谁」组成。①谁领导：中国共产党；②谁合作：各民主党派；③谁执政：中国共产党；④谁参政：各民主党派。四个「谁」答全，才叫把这个制度说清楚了。「新型」的「新」，在于把领导与合作、执政与参政放进同一套制度里，而不是分成执政党和反对党两拨人互相拆台。答题时如果只写「多党合作」，漏掉「共产党领导」，判要点不全，因为领导是这套制度的前提，不是并列的一项。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 基本方针与参政基本点<span class="q-src">人教版（2019）必修3 政治与法治 · 第六课第一框</span></p>
<p class="q-b">长期共存、互相监督、肝胆相照、荣辱与共，是多党合作的基本方针。民主党派参政的基本点是：参加国家政权，参与重要方针政策、重要领导人选的协商，参与国家事务的管理，参与国家方针政策、法律法规的制定和执行。</p>
<p class="q-n">→ 翻成人话：十六字按「存在—监督—态度—命运」排。长期共存讲时间，共产党存在多久，民主党派就存在多久；互相监督讲方向，是双向的，不是只有民主党派被监督；肝胆相照讲真诚，敢讲真话；荣辱与共讲担当，事业成败一起扛。参政的基本点记成「一个参加、三个参与」。注意「参政」不是「夺权」，民主党派参加国家政权、参与协商和管理，都不改变共产党的领导地位和执政地位。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 人民政协的性质<span class="q-src">人教版（2019）必修3 政治与法治 · 第六课第一框</span></p>
<p class="q-b">中国人民政治协商会议是中国人民爱国统一战线的组织，是中国共产党领导的多党合作和政治协商的重要机构，是我国政治生活中发扬社会主义民主的重要形式，是国家治理体系的重要组成部分，是具有中国特色的制度安排。人民政协是社会主义协商民主的重要渠道和专门协商机构。</p>
<p class="q-n">→ 翻成人话：五个「是」太长，先记住前两个：统一战线组织、多党合作和政治协商的重要机构。真正要刻在脑子里的是那句否定：它不是国家机关。因为不是国家机关，所以它不立法、不决策、不行政，它做的是协商、监督、议政。再记两组数字：两大主题是团结和民主，三项职能是政治协商、民主监督、参政议政。填空题最爱考「专门协商机构」这五个字，少写「专门」就变成了另一句话。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>中国共产党</th><th>各民主党派</th><th>人民政协</th></tr></thead>
<tbody>
<tr><td>性质地位</td><td>执政党，中国特色社会主义事业的领导核心</td><td>参政党，接受共产党领导、同共产党通力合作的亲密友党</td><td>爱国统一战线组织，多党合作和政治协商的重要机构</td></tr>
<tr><td>同国家政权的关系</td><td>执政，领导国家政权</td><td>参加国家政权，参与协商和管理</td><td>不是国家机关，不掌握国家权力</td></tr>
<tr><td>主要做什么</td><td>政治领导、思想领导、组织领导，依法执政</td><td>参政议政、民主监督，参加各项协商</td><td>政治协商、民主监督、参政议政</td></tr>
<tr><td>常见错法</td><td>说它和各党派「轮流执政」</td><td>说它是「在野党、反对党」</td><td>说它是「国家机关、国家权力机关」</td></tr>
<tr class="key"><td>真正的区别</td><td>领导核心、执政党，一个党长期执政</td><td>参政党，参加政权但不执政，更不是在野</td><td>协商机构，靠协商监督议政出力，不靠权力发号令</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">这张表只高亮一行：<b>真正的区别</b>。三列其实是三种身份：领导核心、参政党、协商机构。记法就三句：共产党是「领导 + 执政」，民主党派是「参加 + 参与」，政协是「协商 + 监督 + 议政」。选择题里还有一组帽子别戴错：多党合作和政治协商制度是基本政治制度，人民代表大会制度是根本政治制度，民族区域自治制度和基层群众自治制度也是基本政治制度。材料题写到「政协」，就不要再写「政协行使国家权力」，那是把协商机构当成了权力机关。</p>
</section>

<p class="gx-note">我国有八个民主党派：民革、民盟、民建、民进、农工党、致公党、九三学社、台盟。它们各自联系一部分社会主义劳动者、建设者和爱国者，都是参政党。选择题爱写「我国实行多党制」「各党派联合执政」，这两句都是错的：前者说成几个党争政权，后者说成共产党把执政权分出去。</p>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。五步走完，答案的架子就搭好了。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 原因类材料题<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">材料：某省各民主党派省委围绕县域医共体建设开展联合调研，形成 12 份调研报告。其中关于提高乡村医生待遇的建议被省委采纳，写进省政府文件。随后，省政协召开专题议政性常委会会议，委员与省卫健委、省医保局负责人面对面协商；会后省政协把协商意见整理成提案，交由相关部门办理答复。结合材料，说明我国政党制度为什么是「新型政党制度」。（12 分）</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性</p>
<p class="s-b">题型是「说明／原因」类，知识范围锁定「中国共产党领导的多党合作和政治协商制度」，设问落在「新型」两个字上。先在草稿上画四格：党的领导、多党派合作、参政党定位、协商民主，最后一格留给「对比西方」。</p>
<p class="s-k">用到：新型政党制度的四个规定性</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 找主体</p>
<p class="s-b">材料里的主体有五个：各民主党派省委、省委、省政府、省政协、政协委员与政府部门。这里最容易出错的是把「省委」和「省政府」混成一个，把「省政协」当成「省级机关」。主体身份一错，后面全错。</p>
<p class="s-k">用到：中国共产党、民主党派、人民政协的性质</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 找行为</p>
<p class="s-b">行为按顺序排：民主党派联合调研（参政议政）、建议被省委采纳并写进政府文件（参政党的建言起作用）、省政协开专题议政性常委会（政治协商）、协商意见转成提案交办答复（民主监督、参政议政）。四个动作，正好对上四个格子。</p>
<p class="s-k">用到：参政议政、政治协商、民主监督</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 对应原理</p>
<p class="s-b">一格填一句：民主党派接受共产党领导、通力合作，对应「共产党领导、多党派合作」；民主党派参加国家政权、参与协商，对应「参政党」；省委决策前听意见、政协搭台协商，对应「协商民主」；比起西方轮流坐庄、相互倾轧，对应「新型」。</p>
<p class="s-k">用到：新型政党制度的优势</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口</p>
<p class="s-b">开头一句话判断，中间四点分条，每点都是「术语 + 材料事实」两截。结尾补一句对比：西方多党制下政党为选举互相攻击，我国是合作型政党关系。不要只抄材料，也不要只背术语。</p>
<p class="s-k">用到：观点与材料相结合的答题规范</p>
</li>
</ol>

<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">① 我国实行中国共产党领导的多党合作和政治协商制度，共产党领导、多党派合作，共产党执政、多党派参政，这是我国的新型政党制度。<br>② 坚持中国共产党的领导。省委采纳民主党派的建议并写进政府文件，说明多党合作是在共产党领导下进行的，领导是这套制度的根本前提。<br>③ 多党派合作。各民主党派省委与省委、省政府围绕同一件事联合调研、共同商量，说明多党合作是合作共事，不是彼此拆台。<br>④ 民主党派是参政党。民主党派参加国家政权、参与国家事务管理，调研建议被采纳并写进政府文件，说明它在参政，不是在野、不是反对，也不争夺执政权。<br>⑤ 发展协商民主。省委决策前听取意见、省政协召开专题议政性常委会会议并推动提案办理，是政治协商、民主监督、参政议政的具体形式。<br>⑥ 与西方多党制相比，我国政党制度避免了政党恶斗、轮流坐庄、相互倾轧，能够集中力量办大事，所以是新型政党制度。</p>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。每问先自己答一句，再看下面那句。</p>
<div class="gx-qa">

<div class="qac">
<p class="q">「各民主党派是不是在野党、反对党？」</p>
<p class="a">不是。各民主党派是<b>参政党</b>，接受中国共产党领导、同中国共产党通力合作，是亲密友党。在野党、反对党的说法来自西方政党制度，前提是争夺执政权，我国没有这个前提。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="我国民主党派是参政党，西方是在野党">

<text x="120" y="30" font-size="9.2" text-anchor="middle" fill="#151a21">同一个词，两套制度</text>
<text x="20" y="62" font-size="9" font-weight="700" fill="#1e6640">我国</text>
