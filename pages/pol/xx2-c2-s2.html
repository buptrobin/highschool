<div class="gx-meta">
<span><i></i>人教版（2019）选择性必修2 法律与生活 · 第二单元第六课</span>

<p class="gx-lede">你表哥前年办了酒席，彩礼给了、亲戚请了，可两个人一直没去民政局领证。你可能会问：这算结婚了吗？在法律上，不算。这一节在第二单元《家庭与婚姻》的最后一课，前面几课讲抚养、赡养和继承，这一课讲两个人怎样成为一家人、又怎样依法分开。最容易错的一件事是：把「办了婚礼」当成「结了婚」，把「婚前买的房」当成「婚后就有我一半」。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写课本这句，不写你脑子里那句。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 结婚的法定条件<span class="q-src">人教版（2019）选择性必修2 法律与生活 · 第二单元第六课</span></p>
<p class="q-b">「结婚应当男女双方完全自愿，禁止任何一方对另一方加以强迫，禁止任何组织或者个人加以干涉。结婚年龄，男不得早于二十二周岁，女不得早于二十周岁。直系血亲或者三代以内的旁系血亲禁止结婚。」</p>
<p class="q-n">→ 翻成人话：这一段里藏着四个条件，缺一个都登记不了。①双方完全自愿，父母点头不算你的自愿；②男满 22 周岁、女满 20 周岁，差一天也不行；③双方都没有配偶，符合一夫一妻；④不是直系血亲，也不是三代以内旁系血亲。四条都过了，还要双方亲自到婚姻登记机关登记，婚姻关系才成立。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 夫妻共同财产<span class="q-src">人教版（2019）选择性必修2 法律与生活 · 第二单元第六课</span></p>
<p class="q-b">「夫妻在婚姻关系存续期间所得的下列财产，为夫妻的共同财产，归夫妻共同所有：工资、奖金、劳务报酬；生产、经营、投资的收益；知识产权的收益；继承或者受赠的财产，但是本法第一千零六十三条第三项规定的除外。夫妻对共同财产，有平等的处理权。」</p>
<p class="q-n">→ 翻成人话：判断共同财产，先抓两个词——「婚姻关系存续期间」和「所得」。婚后拿到手的工资、奖金、提成，开店办厂赚的钱，写书和专利的收益，都进这个筐。继承或受赠的财产原则上也进，但遗嘱、赠与合同写明只给一方的除外。「平等的处理权」是说卖房、卖车这类大事，一方不能自己拍板。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 协议离婚与冷静期<span class="q-src">人教版（2019）选择性必修2 法律与生活 · 第二单元第六课</span></p>
<p class="q-b">「夫妻双方自愿离婚的，应当签订书面离婚协议，并亲自到婚姻登记机关申请离婚登记。自婚姻登记机关收到离婚登记申请之日起三十日内，任何一方不愿意离婚的，可以向婚姻登记机关撤回离婚登记申请。」</p>
<p class="q-n">→ 翻成人话：协议离婚是三段路，不是一次签字。第一段，签书面协议、双方亲自去申请；第二段，30 日冷静期内，任何一方反悔都能撤回；第三段，冷静期届满后 30 日内，双方再亲自去申请发证，没去的视为撤回。所以「申请了就能离」是错的。一方不同意，或者财产、孩子谈不拢，只能走诉讼离婚。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>夫妻共同财产</th><th>夫妻一方的个人财产</th></tr></thead>
<tbody>
<tr><td>看时间</td><td>婚姻关系存续期间所得</td><td>结婚前取得，或者法律规定的特定财产</td></tr>
<tr><td>看来源</td><td>工资、奖金、劳务报酬；生产、经营、投资的收益；知识产权的收益；继承或受赠的财产（写明只归一方的除外）</td><td>一方的婚前财产；因人身损害获得的赔偿或者补偿；遗嘱或赠与合同中确定只归一方的财产；一方专用的生活用品</td></tr>
<tr class="key"><td>真正的区别</td><td>不看登记在谁名下，看「取得时间 + 来源」</td><td>婚前财产不因婚姻延续自动转化，除非双方书面约定</td></tr>
<tr><td>一个例外</td><td>双方可以书面约定归各自所有、共同所有或者部分各自所有、部分共同所有</td><td>约定优先于法定，写了约定就按约定</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只背第 3 行。判断财产性质，先问「什么时候取得、从哪来」，再问「有没有书面约定」，最后才看登记在谁名下。婚前财产不会因为结婚年头长就自动变成共同财产。</p>
</section>

<div class="gx-ex">
<p class="ex-t">例题 · 财产性质分析题<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">张某（男）与李某（女）登记结婚前，张某用自己工作多年的积蓄全款买下一套住房，登记在自己名下。婚后第三年，张某在房产证上加上李某的名字，双方没有另写协议。两年后两人诉讼离婚，李某主张房子一人一半，张某主张房子是自己婚前财产、加名只是走个形式。结合材料，分析该房产的财产性质，并说明理由。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性</p>
<p class="s-b">问题问的是「财产性质 + 理由」，属于夫妻财产关系分析题，不是离婚程序题。先别急着写冷静期，这题不考程序。</p>
<p class="s-k">用到：夫妻共同财产、夫妻一方的个人财产、夫妻财产约定。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 找主体</p>
<p class="s-b">主体是张某和李某，两人是夫妻。争议标的是那套住房，不是存款、不是彩礼，也不是孩子的抚养费。</p>
<p class="s-k">用到：夫妻财产关系的主体是夫妻双方。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 找行为与时间线</p>
<p class="s-b">三个时间点要划出来：婚前全款购房、登记在自己名下；婚后第三年加名、办理变更登记；双方没有另写协议。时间线一摆，性质就出来一半。</p>
<p class="s-k">用到：取得时间、不动产物权变更登记、有无书面约定。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 对应原理</p>
<p class="s-b">婚前全款买房，属于一方的婚前财产，是个人财产。婚后加名并变更登记，一般视为对配偶的赠与，不动产物权以登记为准，所有权发生变更，房产转为夫妻共同共有。</p>
<p class="s-k">用到：个人财产、赠与、不动产物权登记、共同共有。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口分点写</p>
<p class="s-b">按「婚前是什么 → 婚后发生了什么 → 现在是什么 → 怎么分」四层写，每层一句话，术语到位就得分。别写成「一人一半是应该的」这种生活语言。</p>
<p class="s-k">用到：分割顺序——先协议，协议不成由法院按原则判。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>

</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">①该房产在婚前由张某全款购买并登记在其名下，属于张某的婚前个人财产，不因婚姻关系延续而自动转化为夫妻共同财产。②婚后张某在房产证上加上李某名字并办理变更登记，该行为一般视为对李某的赠与；不动产物权以登记为准，房屋所有权因此发生变更。③加名之后，该房产属于夫妻共同财产，双方未另有约定，按共同共有处理，张某「只是走个形式」的主张不能成立。④离婚分割时，先由双方协议处理；协议不成的，由人民法院根据财产的具体情况，按照照顾子女、女方和无过错方权益的原则判决，并不是一律对半分。</p>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。每问配一张小图，看图记答案。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「办了婚礼、亲戚都喝了喜酒，这还不算结婚？」</p>
<p class="a">不算。<b>结婚必须双方亲自到婚姻登记机关登记，取得结婚证，婚姻关系才成立</b>。办酒席是风俗，不是法律程序；没登记就同居，法律上不产生夫妻之间的权利义务，财产也不按夫妻共同财产处理。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="办酒席不等于结婚，只有登记并领取结婚证，婚姻关系才成立">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="30" text-anchor="middle" font-size="9" font-weight="700" fill="#151a21">风俗 ≠ 法律</text>
<rect x="20" y="46" width="88" height="32" rx="6" fill="#fff6e8" stroke="#f0d2b0"/>
<text x="64" y="66" text-anchor="middle" font-size="8.4" fill="#7a4415">办酒席</text>
<text x="120" y="68" text-anchor="middle" font-size="13" fill="#b5733a">≠</text>
<rect x="130" y="46" width="90" height="32" rx="6" fill="#eaf6ef" stroke="#b8e6d0"/>
<text x="175" y="66" text-anchor="middle" font-size="8.4" fill="#1d4b3a">登记领证</text>
<text x="120" y="102" text-anchor="middle" font-size="8.4" fill="#33566b">登记 + 结婚证 = 婚姻关系成立</text>

<div class="qac">
<p class="q">「婚前他买的房，婚后我们一起还贷，这房有我一份吗？」</p>
<p class="a">房屋一般归<b>产权登记一方</b>，但婚后用共同财产还贷的部分及其对应的增值，离婚时由产权登记一方对另一方<b>补偿</b>。答题写「房子一人一半」是错的，写「补偿」才对。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="婚前房产归产权登记一方，婚后共同还贷部分及其增值由登记一方补偿另一方">

<rect x="20" y="48" width="90" height="40" rx="6" fill="#eaf6ef" stroke="#b8e6d0"/>
<text x="65" y="66" text-anchor="middle" font-size="8.2" fill="#1d4b3a">房屋所有权</text>
<text x="65" y="80" text-anchor="middle" font-size="8.2" fill="#1d4b3a">归登记一方</text>
<text x="120" y="72" text-anchor="middle" font-size="11" fill="#8aa4b5">→</text>
<rect x="130" y="48" width="90" height="40" rx="6" fill="#eef5fa" stroke="#cfe0ea"/>
<text x="175" y="66" text-anchor="middle" font-size="8.2" fill="#33566b">补偿另一方</text>
<text x="175" y="80" text-anchor="middle" font-size="8.2" fill="#33566b">还贷 + 增值</text>
<text x="120" y="108" text-anchor="middle" font-size="8.4" fill="#7a4415">不是对半分</text>
</svg>
</div>

<div class="qac">
<p class="q">「婚后他发的工资、年终奖，算他自己的钱吗？」</p>
<p class="a">不算。婚姻关系存续期间所得的<b>工资、奖金、劳务报酬</b>，是夫妻共同财产，双方有<b>平等的处理权</b>。他不能瞒着你把大额存款转走，你也不能说「这是我的工资，与他无关」。</p>

<line x1="50" y1="86" x2="50" y2="72" stroke="#8aa4b5"/>
<line x1="120" y1="86" x2="120" y2="72" stroke="#8aa4b5"/>
<line x1="190" y1="86" x2="190" y2="72" stroke="#8aa4b5"/>

<text x="120" y="116" text-anchor="middle" font-size="8" fill="#7a4415">卖房、大额转账，一方不能自己定</text>

<div class="qac">
<p class="q">「离婚申请交上去了，等 30 天就自动离了吧？」</p>
<p class="a">不是。冷静期届满后 <b>30 日内双方还要亲自申请发证</b>，没申请就<b>视为撤回</b>离婚登记申请；冷静期内任何一方反悔，也可以撤回。一方不配合，只能去法院起诉离婚。</p>

<text x="120" y="108" text-anchor="middle" font-size="8.2" fill="#33566b">不发证 = 视为撤回</text>
</svg>
</div>

<div class="qac">
<p class="q">「孩子满 8 周岁了，他说跟谁，法院就判给谁？」</p>
<p class="a">不是。已满 8 周岁，<b>应当尊重其真实意愿</b>，但法院仍按<b>最有利于未成年子女</b>的原则判决，还要看双方的抚养能力、生活环境和孩子的具体情况。孩子的意见是重要参考，不是判决本身。</p>

<rect x="20" y="66" width="200" height="22" rx="5" fill="#eef5fa" stroke="#cfe0ea"/>

</div>

<div class="qac">
<p class="q">「他在婚内借的钱，离婚后要我还吗？」</p>
<p class="a">看用途。为<b>家庭日常生活需要</b>所负的债务，属于夫妻共同债务，应当共同偿还；<b>超出家庭日常生活需要</b>的，不属于共同债务，除非债权人能证明用于夫妻共同生活、共同生产经营，或者基于双方共同意思表示。</p>

<p class="gx-note">六问其实是同一件事：先看主体是谁、做了什么，再看落在哪个法律概念上——登记、婚龄、亲属、财产性质、期限、原则。概念对上了，答案就顺着出来了。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。考前十分钟只看这一节，也能捞回几分。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 办了酒席、亲戚都认了，就是结婚了。</p>
<p class="er-v">✓ 结婚必须男女双方亲自到婚姻登记机关登记，取得结婚证，婚姻关系才成立。</p>
<p class="er-w">错在哪：把风俗当程序。婚礼、同居、生孩子都不产生夫妻关系，没登记就没有夫妻的权利义务。</p>
</div>

<div class="er">
<p class="er-x">✗ 两个人都愿意，年龄差一点也能通融。</p>
<p class="er-v">✓ 结婚年龄，男不得早于 22 周岁，女不得早于 20 周岁，这是法定婚龄。</p>
<p class="er-w">错在哪：法定婚龄是硬条件，没有「差几个月」的余地。材料里给出生年份，就要自己算周岁，别直接看年份差。</p>
</div>

<div class="er">
<p class="er-x">✗ 表兄妹感情好、父母也同意，可以结婚。</p>
<p class="er-v">✓ 直系血亲和三代以内旁系血亲禁止结婚。</p>
<p class="er-w">错在哪：这一条不看感情、不看双方是否自愿。表兄妹属于三代以内旁系血亲，登记机关不予登记。</p>
</div>

<div class="er">
<p class="er-x">✗ 结婚几年以后，婚前的房子就变成共同财产了。</p>
<p class="er-v">✓ 一方的婚前财产属于个人财产，不因婚姻关系延续而转化为夫妻共同财产，除非双方书面约定。</p>
<p class="er-w">错在哪：法律上没有「结婚满几年就转化」的规则。性质改变只有两条路：双方书面约定，或者加名并办理变更登记。</p>
</div>

<div class="er">
<p class="er-x">✗ 夫妻各花各的，谁的工资就是谁的钱。</p>
<p class="er-v">✓ 婚姻关系存续期间所得的工资、奖金、劳务报酬，属于夫妻共同财产，双方有平等的处理权。</p>
<p class="er-w">错在哪：把「谁挣的」当成判据。共同财产的判据是取得时间和来源，不是工资卡在谁手里。</p>
</div>

<div class="er">
<p class="er-x">✗ 离婚申请交上去，等 30 天冷静期一过就离成了。</p>
<p class="er-v">✓ 冷静期届满后 30 日内，双方应当亲自到婚姻登记机关申请发给离婚证；未申请的，视为撤回离婚登记申请。</p>
<p class="er-w">错在哪：漏掉第二段期限。冷静期只是「可以撤回」的窗口，发证还要再跑一次，两次期限都是 30 日。</p>
</div>

<div class="er">
<p class="er-x">✗ 孩子满 8 周岁，说跟谁法院就判给谁。</p>
<p class="er-v">✓ 子女已满 8 周岁的，应当尊重其真实意愿；抚养权仍按最有利于未成年子女的原则判决。</p>
<p class="er-w">错在哪：把「尊重意愿」写成「按意愿判」。意愿是重要参考，法院还要综合双方的抚养能力和条件。</p>
</div>
</div>
