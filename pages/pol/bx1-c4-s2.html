<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 中国梦的由来<span class="q-src">人教版（2019）必修1 中国特色社会主义 · 第四课第二框</span></p>
<p class="q-b">实现中华民族伟大复兴是近代以来中华民族最伟大的梦想。</p>
<p class="q-n">→ 翻成人话：这句话定了<b>性质和时间跨度</b>——「最伟大」是最高级，不能写成「重要梦想之一」；「近代以来」指出它不是今天才提出的口号，而是 1840 年以来几代人的共同追求。答题时这句常作<b>开篇定调句</b>，后面才接本质和路径。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 中国梦的本质<span class="q-src">人教版（2019）必修1 中国特色社会主义 · 第四课第二框</span></p>
<p class="q-b">中国梦的本质是国家富强、民族振兴、人民幸福。</p>
<p class="q-n">→ 翻成人话：这一句由<b>三个并列成分</b>组成（①国家富强 ②民族振兴 ③人民幸福），<b>三句缺一扣分</b>。只写「国家富强」是把「本质」缩成了「一个方面」；漏掉「人民幸福」最亏，因为这一条正是「中国梦归根到底是人民的梦」的落脚点。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 实现路径与两步走<span class="q-src">人教版（2019）必修1 中国特色社会主义 · 第四课第二框</span></p>
<p class="q-b">实现中国梦必须走中国道路、弘扬中国精神、凝聚中国力量；分两步走，到 2035 年基本实现社会主义现代化，到本世纪中叶建成社会主义现代化强国。</p>
<p class="q-n">→ 翻成人话：这句话含<b>两组要点</b>——路径是<b>三个「必须」</b>（走中国道路 / 弘扬中国精神 / 凝聚中国力量），步骤是<b>两步走</b>（2035 基本实现现代化 → 本世纪中叶建成强国）。<b>两个时间点不能对调</b>：2035 对应「基本实现」，本世纪中叶对应「建成强国」，越往后目标越高。</p>
</div>

<div class="gx-ex">
<p class="ex-t">例题 · 简答题「怎样实现中华民族伟大复兴的中国梦？」<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">党的二十大报告指出，从现在起，中国共产党的中心任务就是团结带领全国各族人民全面建成社会主义现代化强国、实现第二个百年奋斗目标，以中国式现代化全面推进中华民族伟大复兴。结合材料，运用《中国特色社会主义》的知识，说明怎样实现中华民族伟大复兴的中国梦。（12 分）<br>陷阱提示：题目问「怎样实现」，不是问「是什么」；只答本质三句不给分，只答三个「必须」不写两步走，最高 8 分。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定位：问的是「路径」</p>
<p class="s-b">题干关键词是「怎样实现」，指向教材的<b>三个「必须」</b>与<b>两步走</b>。先把「中国梦的本质是国家富强、民族振兴、人民幸福」这句放一边——它是「是什么」，不是「怎么做」；若开头要点题，一句带过即可，不占分点。</p>
<p class="s-k">用到：中国梦的本质（是什么）与实现路径（怎么做）的区分。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 路径第一条：必须走中国道路</p>
<p class="s-b">写「必须走中国道路，即走中国特色社会主义道路」。这条回答「走什么路」，是方向问题；中国特色社会主义道路是实现社会主义现代化、创造人民美好生活的必由之路。</p>
<p class="s-k">用到：三个「必须」之一 · 中国道路。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 路径第二、三条：精神与力量</p>
<p class="s-b">写「必须弘扬中国精神，即以爱国主义为核心的民族精神和以改革创新为核心的时代精神；必须凝聚中国力量，即全国各族人民大团结的力量」。两条都要带出「即……」的具体内容，只写口号式的「弘扬中国精神」拿不到展开分。</p>
<p class="s-k">用到：三个「必须」之二、之三 · 中国精神、中国力量。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 接上「两步走」的时间表</p>
<p class="s-b">写「分两步走：到 2035 年基本实现社会主义现代化，到本世纪中叶建成社会主义现代化强国」。这一步是本题的加分位，也是最容易写反的地方——<b>2035 对应「基本实现」，本世纪中叶对应「建成强国」</b>。</p>
<p class="s-k">用到：两步走的两个时间点与对应目标。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口：落到「人民的梦」与奋斗</p>
<p class="s-b">写「中国梦是国家的、民族的，也是每一个中国人的，归根到底是人民的梦；实现中国梦需要一代又一代中国人接力奋斗」。这一句把「谁来干」补上，让答案从路径落到主体，避免全篇只有口号。</p>
<p class="s-k">用到：个人梦与中国梦的关系、中国梦需要接力奋斗。</p>
</li>
