<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">这一框的答案全压在四句话上：基本国情、主要矛盾、两大任务、历史和人民的选择。先照抄，再拆关键词，最后能用自己的话讲一遍。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 近代中国的基本国情<span class="q-src">人教版（2019）必修3 政治与法治 · 第一课第一框</span></p>
<p class="q-b">半殖民地半封建社会，是近代中国的基本国情，也是认识和解决近代中国一切社会问题的基本依据。</p>
<p class="q-n">→ 翻成人话：做材料题先给时间定位。1840 年以后的中国，主权被切走一块（半殖民地），封建剥削还在、资本主义又长出来一点（半封建）。两个词合起来才叫「基本国情」，也才配叫「基本依据」。只写半殖民地，后面解释「为什么资产阶级干不成」就缺了一半理由；只写半封建，又解释不了「为什么帝国主义要欺负你」。答题时两个词都要落地，最好各带一句解释；只写名词不展开，很容易被判「没有说明」。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 主要矛盾与两大历史任务<span class="q-src">人教版（2019）必修3 政治与法治 · 第一课第一框</span></p>
<p class="q-b">近代中国社会的主要矛盾是帝国主义和中华民族的矛盾、封建主义和人民大众的矛盾。近代中国的两大历史任务是争取民族独立、人民解放，实现国家富强、人民幸福。</p>
<p class="q-n">→ 翻成人话：两对矛盾，一对朝外（民族），一对朝内（阶级）。矛盾推任务：先争取民族独立、人民解放，再实现国家富强、人民幸福。顺序别倒——人还没救出来，谈富强是空的。答题时「矛盾」写两对，「任务」写两个，少一个就扣分。还有个常考的小问：为什么先有民族独立，才有国家富强？因为主权不完整，发展成果保不住。两对矛盾写全，再落到两个任务，逻辑就闭合了。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 各种政治力量的尝试与中国共产党的诞生<span class="q-src">人教版（2019）必修3 政治与法治 · 第一课第一框</span></p>
<p class="q-b">近代以来，为了挽救民族危亡，各种政治力量进行了各种尝试，但都没有改变中国半殖民地半封建社会的性质。中国共产党一经诞生，就把为中国人民谋幸福、为中华民族谋复兴确立为自己的初心使命。</p>
<p class="q-n">→ 翻成人话：前半句是一张「总判决书」——洋务派、维新派、革命派都试过，社会性质没变。后半句才是中国共产党的出场：它不是「又多了一个政党」，而是换了领导阶级（无产阶级）、换了理论（马克思主义）、换了道路（新民主主义革命）。答题时这两半要分开写，别揉成一句「党很伟大」。判卷老师要看到的是「换了什么」，不是形容词。这三样换下来，才叫「新」；看到「焕然一新」，先想到 1921 这个年份。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>地主阶级洋务派</th><th>资产阶级（维新派 / 革命派）</th><th>无产阶级（经中国共产党）</th></tr></thead>
<tbody>
<tr><td>想走的路</td><td>维护封建统治，只学技术，不改制度</td><td>君主立宪或民主共和，走资本主义道路</td><td>新民主主义革命，走向社会主义</td></tr>
<tr><td>关键动作</td><td>办工厂、建海军、派留学生，制度照旧</td><td>戊戌变法 103 天、辛亥革命</td><td>五四登上舞台、1921 建党、1949 建国</td></tr>
<tr><td>靠谁</td><td>靠清政府，也靠洋人，不敢动底层</td><td>靠皇帝、靠少数革命党人，怕发动民众</td><td>靠无产阶级，靠最广大人民</td></tr>
<tr class="key"><td>结局</td><td>甲午战败，宣告破产，制度没变</td><td>果实被窃取，性质没变</td><td>推翻三座大山，建立人民民主专政</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">这张表只高亮一行：<b>结局</b>。考试真正问的是「为什么走不通」，而结局就是判据。背的时候按「主张—做法—结局」三格填，比背整段话稳；洋务派那一格的「只学技术不改制度」，是本题最高频的采分句。表里「靠谁」这一行最容易背漏，但它恰恰解释了为什么前两家不敢发动民众。</p>
</section>

<p class="gx-h2s">四张图四件事：国情怎么定、三种力量怎么败、时间怎么走、结论怎么来。先看箭头方向，再看字；每张图只记一句结论。</p>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。五步走完，答案自然出来。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 原因类材料题<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">材料：1898 年，维新派把变法的希望寄托在光绪皇帝身上，变法只维持了 103 天；1911 年，革命党人起义成功，却把政权交给了袁世凯。当时不少人以为，只要换一批人掌权，中国就能像日本那样富强起来。有人问：既然已经试过两次，为什么还说资本主义道路在中国走不通？结合材料，运用「近代中国的基本国情」的知识加以说明。（12 分）</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性</p>
<p class="s-b">题型是「为什么」，知识范围是「近代中国的基本国情」，问的是原因，不是过程。草稿上先画四个格子：国情、阶级、外部、人民。格子画好，答案就不会写成流水账。范围写错，答得再多也不给分。</p>
<p class="s-k">用到：原因类设问的四格框架</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 找主体</p>
<p class="s-b">材料里两拨人：维新派、革命党人，都属于资产阶级；他们的对面是帝国主义和封建势力；旁边还站着没被发动起来的人民大众。主体没找准，后面越写越偏。三拨人一摆，谁是领导、谁是对象就清楚了。</p>
<p class="s-k">用到：资产阶级、帝国主义、人民大众</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 找行为</p>
<p class="s-b">维新派靠皇帝，革命派靠少数人；两次都没有发动最广大的农民和工人。材料里「寄托在皇帝身上」「把政权交给袁世凯」，就是证据。先摆证据，再下结论。这一步只摆事实，别急着评价。</p>
<p class="s-k">用到：资产阶级的软弱性和妥协性</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 对应原理</p>
<p class="s-b">半殖民地半封建社会的国情，决定了资本主义道路走不通：帝国主义要把中国变成它的原料产地和市场，封建势力盘根错节，无产阶级和人民大众也不接受这套方案。四格里，国情是根，另外三点都从它长出来。每条原因都要能追回「半殖民地半封建」这六个字。</p>
<p class="s-k">用到：基本国情决定道路选择</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口</p>
<p class="s-b">先回扣材料一句「戊戌变法、辛亥革命都试过」，再按四点展开，最后落到「只有中国共产党领导的新民主主义革命走得通」。结尾这一句，不要停在「所以失败了」。四点写完，最后一句单独成行，阅卷老师一眼就能看到。</p>
<p class="s-k">用到：历史和人民的选择</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">① 国情不允许。近代中国是半殖民地半封建社会，主权不完整、封建剥削占优势，资本主义缺少独立发展的社会条件。<br>② 资产阶级担不起。维新派寄希望于皇帝，革命派不敢发动最广大的人民，软弱性、妥协性决定了他们完不成反帝反封建的任务。<br>③ 帝国主义不允许。帝国主义把中国当作原料产地和市场，不会让中国走上独立发展资本主义的道路。<br>④ 人民不接受。无产阶级已经登上政治舞台，人民大众要的是民族独立和人民解放，资本主义方案给不了。<br>结论：资本主义道路不是没试过，是试过、走不通；历史和人民最终选择了中国共产党领导的新民主主义革命。</p>
</div>
</div>
<p class="gx-note">答题卡上的样子：①②③④ 分条，每条写「原因 + 材料对应」，最后一行单独写结论。字数不必多，四条写全比写长更重要。</p>

<p class="q">「半殖民地半封建，是不是一半殖民地、一半封建？」</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">每张卡片三行：学生真会写的错句、教材语言、错在哪。先盖住后两行，自己说一遍，再对答案。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 资本主义道路在中国根本没有试过，所以走不通。</p>
<p class="er-v">✓ 戊戌变法、辛亥革命都试过资本主义方案；因为半殖民地半封建社会的国情，这条路走不通。</p>
<p class="er-w">错在哪：把「走不通」说成「没试过」，因果也说反了——不是没试才不通，是试了也不通。答题时先承认「试过」，再讲原因，逻辑才顺。</p>
</div>
<div class="er">
<p class="er-x">✗ 中国共产党是 1919 年五四运动时成立的。</p>
<p class="er-v">✓ 1919 年五四运动是新民主主义革命的开端；1921 年中国共产党成立，中国革命的面貌焕然一新。</p>
<p class="er-w">错在哪：把「开端」和「建党」两个节点粘成一个年份，1919 与 1921 必须分开记，一个换阶级，一个换政党。</p>
</div>
<div class="er">
<p class="er-x">✗ 1949 年新中国成立，标志着社会主义制度在我国确立。</p>
<p class="er-v">✓ 1949 年新中国成立，标志着新民主主义革命取得基本胜利；1956 年社会主义改造基本完成，社会主义制度确立。</p>
<p class="er-w">错在哪：把「革命胜利」和「制度确立」压在同一年，这是本框最高频的年份错，考前多写三遍。</p>
</div>
<div class="er">
<p class="er-x">✗ 新民主主义革命是资产阶级领导的民主革命。</p>
<p class="er-v">✓ 新民主主义革命是无产阶级领导的、人民大众的、反对帝国主义、封建主义和官僚资本主义的革命。</p>
<p class="er-w">错在哪：领导阶级记反了。新旧民主主义革命最硬的区别就在这一句，写错就整题失分。</p>
</div>
<div class="er">
<p class="er-x">✗ 近代中国只有一对主要矛盾，就是帝国主义和中华民族的矛盾。</p>
<p class="er-v">✓ 近代中国社会的主要矛盾是帝国主义和中华民族的矛盾、封建主义和人民大众的矛盾。</p>
<p class="er-w">错在哪：漏掉对内的一对。答「矛盾」必须写两对，只写一对就是要点不全，两对都要落到「谁跟谁」。</p>
</div>
<div class="er">
<p class="er-x">✗ 辛亥革命推翻了封建制度，中国从此走上资本主义道路。</p>
<p class="er-v">✓ 辛亥革命推翻了清王朝统治和君主专制制度，但没有改变中国半殖民地半封建社会的性质。</p>
<p class="er-w">错在哪：「推翻君主专制」不等于「推翻封建制度」，更不等于走通了资本主义，性质那半句不能省。</p>
</div>
<div class="er">
<p class="er-x">✗ 洋务运动是资产阶级为了发展资本主义而进行的改革。</p>
<p class="er-v">✓ 洋务运动是地主阶级洋务派的自救运动，只学技术、不改制度，甲午战败宣告破产。</p>
<p class="er-w">错在哪：主体定错了。洋务派站在地主阶级一边，它要维护的恰恰是封建统治，学技术只是手段。</p>
</div>
