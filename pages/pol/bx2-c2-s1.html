<span><i></i>人教版（2019）必修2 经济与社会 · 第二课第一框</span>

<p class="gx-lede">这一框只回答一个问题：东西生产多少、卖给谁，到底谁说了算。答案不是某个人，是价格。先把“看得见的手”和“看不见的手”分开，再记市场会失灵。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题写左边这句，别写你自己的大白话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 市场决定资源配置<span class="q-src">人教版（2019）必修2 经济与社会 · 第二课第一框</span></p>
<p class="q-b">市场在资源配置中起决定性作用。市场决定资源配置是市场经济的一般规律。</p>
<p class="q-n">→ 翻成人话：<b>生产什么、生产多少、卖给谁</b>，主要由市场说了算。注意“决定性”修饰的是<b>资源配置</b>，不是说政府可以什么都不管。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 三个机制<span class="q-src">人教版（2019）必修2 经济与社会 · 第二课第一框</span></p>
<p class="q-b">市场配置资源主要是通过价格、供求、竞争等机制来进行的。</p>
<p class="q-n">→ 三个机制是一套连动装置：<b>价格</b>一变，<b>供求</b>跟着变，<b>竞争</b>再逼着每家店调整。少一个，信号就传不到你这里。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 市场调节的局限<span class="q-src">人教版（2019）必修2 经济与社会 · 第二课第一框</span></p>
<p class="q-b">市场调节不是万能的。市场调节存在自发性、盲目性、滞后性等弊端。</p>
<p class="q-n">→ 这句有两层：一是<b>有些领域市场管不了</b>（市场失灵）；二是<b>能管的领域也会抽风</b>（三弊端）。答题别只写“市场不好”。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>市场调节（“看不见的手”）</th><th>政府作用（“看得见的手”）</th></tr></thead>
<tbody>
<tr><td>发信号</td><td>价格涨跌、供求变化、竞争压力</td><td>规划、政策、法律、监管</td></tr>
<tr><td>谁拍板</td><td>千千万万个买家和卖家各自决定</td><td>政府依法依规作出决定</td></tr>
<tr><td>强在哪</td><td>反应快、信号灵、能调动积极性</td><td>管全局、管长远、管公平</td></tr>
<tr><td>弱在哪</td><td>公共物品、外部性、垄断、信息不对称</td><td>可能慢半拍，也可能管得过多</td></tr>
<tr class="key"><td>两者关系</td><td>市场在资源配置中起决定性作用</td><td>政府更好发挥作用，弥补市场失灵</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">背法：<b>决定性作用 + 更好发挥政府作用</b>，是一句话的两半，不是二选一。考试写“政府越少越好”，这题就开始丢分。</p>
</section>

<p class="fig-s">有些领域不是“市场不想管”，是“市场管不了”。这四种情形叫<b>市场失灵</b>。每张卡先看例子，再看一句“为什么管不了”。</p>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点“下一步”。每一步只推一个判断。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 图表/传导类<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">某年大蒜价格大涨，农民一哄而上扩种。第二年大蒜集中上市，价格暴跌，不少农户亏本。请运用市场调节的知识，分析这一现象。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性</p>
<p class="s-b">题干给了四件事：价格大涨、一哄而上、集中上市、价格暴跌。考的不是“市场好不好”，是<b>市场调节的机制和弊端</b>。</p>
<p class="s-k">用到：市场调节、价格机制</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 价格信号在指挥</p>
<p class="s-b">蒜价大涨，是价格在发信号。农民判断种蒜能赚钱，于是扩大种植。这正是市场通过<b>价格机制</b>配置资源。</p>
<p class="s-k">用到：价格机制、市场配置资源</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 一哄而上 = 盲目性</p>
<p class="s-b">大家只看见今年的高价，没掌握“别人也在扩种”的信息，决策跟风。这是<b>盲目性</b>，不是自发性。</p>
<p class="s-k">用到：盲目性</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 上市才知道 = 滞后性</p>
<p class="s-b">扩种要等一季。第二年集中上市，供给一下子上来，价格已经跌了。价格信号传到地里慢了一拍，这是<b>滞后性</b>。</p>
<p class="s-k">用到：滞后性</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口，别写过头</p>
<p class="s-b">结论要两层：市场调节有弊端，需要政府提供信息、引导种植；但不能因此否定市场的<b>决定性作用</b>。</p>
<p class="s-k">用到：市场失灵、政府作用</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">① 市场通过<b>价格、供求、竞争</b>等机制配置资源。蒜价上涨是价格信号，农民扩种说明价格机制在引导生产。<br>② 农民只看到高价、不了解别人也扩种，一哄而上，体现市场调节的<b>盲目性</b>。<br>③ 扩种到上市存在时间差，等到集中上市才知道供过于求，体现市场调节的<b>滞后性</b>。<br>④ 市场调节有局限，需要政府加强信息服务和种植引导；但不能因此否定市场在资源配置中的<b>决定性作用</b>。</p>
</div>
</div>
</section>
<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是“你以为懂了、一写就错”的地方。先自己答，再看右边。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">市场决定价格，是不是政府就不能管价格？</p>
<p class="a">不是。价格主要由市场决定，但政府可以<b>监管价格行为</b>：反垄断、查串通涨价、管民生底线。<b>决定性作用</b>说的是资源配置，不是政府退场。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="市场定价与政府监管并列">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="30" text-anchor="middle" font-size="10" font-weight="700" fill="#151a21">价格谁说了算</text>
<rect x="18" y="44" width="92" height="42" rx="6" fill="#ffffff" stroke="#b8e6d0"/>
<text x="64" y="62" text-anchor="middle" font-size="9" fill="#1e6640">市场定价格</text>
<text x="64" y="76" text-anchor="middle" font-size="8.5" fill="#5a6472">供求 + 竞争</text>
<rect x="130" y="44" width="92" height="42" rx="6" fill="#ffffff" stroke="#f0d9a8"/>
<text x="176" y="62" text-anchor="middle" font-size="9" fill="#8a5c14">政府管行为</text>
<text x="176" y="76" text-anchor="middle" font-size="8.5" fill="#5a6472">监管 + 反垄断</text>
<text x="120" y="108" text-anchor="middle" font-size="9" fill="#3a3a35">不是二选一</text>
</svg>
</div>
<div class="qac">
<p class="q">供不应求，就应该马上涨价吗？</p>
<p class="a">供不应求会形成<b>价格上涨压力</b>，涨价能抑制需求、刺激供给。但如果是囤积、串通、造假造成的“假短缺”，那就不是正常信号，政府要查。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="短缺带来涨价压力">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="30" text-anchor="middle" font-size="10" font-weight="700" fill="#151a21">短缺一定涨价吗</text>
<circle cx="28" cy="58" r="3.5" fill="#b8402f"/>
<text x="40" y="62" font-size="9" fill="#3a3a35">供不应求：有人买不到</text>
<circle cx="28" cy="80" r="3.5" fill="#b8791f"/>
<text x="40" y="84" font-size="9" fill="#3a3a35">价格有上涨压力</text>
<circle cx="28" cy="102" r="3.5" fill="#2f8a5b"/>
<text x="40" y="106" font-size="9" fill="#3a3a35">被操纵就不是正常信号</text>
</svg>
</div>
<div class="qac">
<p class="q">为什么有人囤药、造假？这是哪个弊端？</p>
<p class="a">为了多赚钱，把别人的急需当成机会，甚至以次充好。这是<b>自发性</b>：逐利驱动下的不当行为。它不等于“一哄而上”的盲目性。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="囤药造假对应自发性">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="30" text-anchor="middle" font-size="10" font-weight="700" fill="#151a21">囤药、造假是谁</text>
<rect x="18" y="46" width="86" height="40" rx="6" fill="#ffffff" stroke="#f3c9c1"/>
<text x="61" y="64" text-anchor="middle" font-size="9" fill="#a04437">囤药抬价</text>
<text x="61" y="78" text-anchor="middle" font-size="8.5" fill="#5a6472">以次充好</text>
<path d="M108 66 L130 66" stroke="#5a6472" stroke-width="1.4"/>
<path d="M130 62 L136 66 L130 70 Z" fill="#5a6472"/>
<rect x="140" y="46" width="82" height="40" rx="6" fill="#ffffff" stroke="#b8e6d0"/>
<text x="181" y="64" text-anchor="middle" font-size="9" fill="#1e6640">自发性</text>
<text x="181" y="78" text-anchor="middle" font-size="8.5" fill="#5a6472">为了钱乱来</text>
<text x="120" y="108" text-anchor="middle" font-size="9" fill="#3a3a35">关键词：不择手段</text>
</svg>
</div>
<div class="qac">
<p class="q">盲目性和滞后性到底怎么分？</p>
<p class="a"><b>盲目性</b>怪信息：不知道别人也在干，一哄而上。<b>滞后性</b>怪时间：等价格信号传到地里，扩种已经晚了。一个问“看清没有”，一个问“来不来得及”。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="盲目性与滞后性的区别">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="28" text-anchor="middle" font-size="10" font-weight="700" fill="#151a21">一个怪信息，一个怪时间</text>
<text x="64" y="52" text-anchor="middle" font-size="9.5" font-weight="700" fill="#8a5c14">盲目性</text>
<text x="64" y="70" text-anchor="middle" font-size="8.5" fill="#3a3a35">信息不全</text>
<text x="64" y="86" text-anchor="middle" font-size="8.5" fill="#3a3a35">一哄而上</text>
<text x="176" y="52" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1e6640">滞后性</text>
<text x="176" y="70" text-anchor="middle" font-size="8.5" fill="#3a3a35">事后才知道</text>
<text x="176" y="86" text-anchor="middle" font-size="8.5" fill="#3a3a35">调整慢半拍</text>
<line x1="120" y1="42" x2="120" y2="92" stroke="#dde4ea" stroke-width="1"/>
<text x="120" y="110" text-anchor="middle" font-size="8.5" fill="#5a6472">考试按“信息 / 时间”对号入座</text>
</svg>
</div>
<div class="qac">
<p class="q">路灯、国防为什么不能靠市场提供？</p>
<p class="a">它们<b>非竞争性、非排他性</b>：多一个人用，成本不增加；也没法把不付钱的人挡在外面。人人都想搭便车，市场就不愿供给，只能由政府提供。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="路灯和国防属于公共物品">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="30" text-anchor="middle" font-size="10" font-weight="700" fill="#151a21">市场为什么不愿供</text>
<rect x="24" y="44" width="82" height="38" rx="6" fill="#ffffff" stroke="#b8e6d0"/>
<text x="65" y="67" text-anchor="middle" font-size="9.5" fill="#1e6640">路灯</text>
<rect x="134" y="44" width="82" height="38" rx="6" fill="#ffffff" stroke="#b8e6d0"/>
<text x="175" y="67" text-anchor="middle" font-size="9.5" fill="#1e6640">国防</text>
<text x="120" y="102" text-anchor="middle" font-size="9" fill="#3a3a35">非排他、非竞争</text>
<text x="120" y="118" text-anchor="middle" font-size="9" fill="#3a3a35">搭便车 → 供给不足</text>
</svg>
</div>
<div class="qac">
<p class="q">市场失灵了，是不是就不要市场了？</p>
<p class="a">不是。失灵只说明<b>有些领域市场管不了</b>，要让政府补位：提供公共物品、治理外部性、反垄断、纠信息不对称。市场能干的，还是交给市场。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="市场失灵由政府补位">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="28" text-anchor="middle" font-size="10" font-weight="700" fill="#151a21">失灵之后谁来补</text>
<rect x="56" y="40" width="128" height="26" rx="6" fill="#ffffff" stroke="#f3c9c1"/>
<text x="120" y="57" text-anchor="middle" font-size="9" fill="#a04437">市场管不了</text>
<path d="M120 68 L120 76" stroke="#5a6472" stroke-width="1.4"/>
<path d="M116 76 L120 82 L124 76 Z" fill="#5a6472"/>
<rect x="56" y="84" width="128" height="26" rx="6" fill="#ffffff" stroke="#b8e6d0"/>
<text x="120" y="101" text-anchor="middle" font-size="9" fill="#1e6640">政府补位</text>
<text x="120" y="120" text-anchor="middle" font-size="8.5" fill="#5a6472">不是否定市场</text>
</svg>
</div>
</div>
<p class="gx-note">六问其实是同一件事：<b>市场能干的交给市场，市场干不了的交给政府</b>。答题时先分领域，再谈作用。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。考前只看左边，先躲坑。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 市场起决定性作用，所以政府越少越好。</p>
<p class="er-v">✓ 市场在资源配置中起决定性作用，同时政府更好发挥作用，两者结合。</p>
<p class="er-w">错在哪：把“决定性作用”偷换成“政府退场”。<b>市场决定资源配置</b>，不等于政府什么都不管。</p>
</div>
<div class="er">
<p class="er-x">✗ 市场调节的弊端是市场经济的根本缺陷，所以要限制市场。</p>
<p class="er-v">✓ 自发性、盲目性、滞后性是市场调节固有的局限性，要靠宏观调控弥补。</p>
<p class="er-w">错在哪：把“有局限”说成“根本坏”，结论就变成否定市场，方向错了。</p>
</div>
<div class="er">
<p class="er-x">✗ 自发性就是盲目性，反正都是一哄而上。</p>
<p class="er-v">✓ 自发性是逐利驱动的不当行为；盲目性是信息不全、决策跟风；滞后性是事后才调整。</p>
<p class="er-w">错在哪：三个词各管一段。<b>自发性看手段，盲目性看信息，滞后性看时间</b>。</p>

<div class="er">

<script>
/* 互动脚本本体（由 build-page.mjs 包进 <script> 里，所以这里不要写 <script> 标签） */
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var GX = window.GX, el = GX.el, tx = GX.tx, $ = GX.$;
  var stage = $("gxStage");
  if (!stage || !window.AutoPilot) return;

  /* 两套坐标：宽屏 880×470，窄屏独立 360×700 */
  var W = {
    vb: "0 0 880 470",
    left: { x: 16, y: 16, w: 424, h: 438 },
    right: { x: 456, y: 16, w: 408, h: 438 },
    plot: { x: 64, y: 66, w: 336, h: 306 }
  };
  var N = {
    vb: "0 0 360 700",
    left: { x: 8, y: 8, w: 344, h: 316 },
    right: { x: 8, y: 336, w: 344, h: 356 },
    plot: { x: 52, y: 54, w: 276, h: 226 }
  };
  var L = W, A = 14;

  var DEM = "#0891b2", DEM_SOFT = "#ecfbff";
  var SUP = "#b8791f", SUP_SOFT = "#fffaf2";
  var RED = "#b8402f";

  /* 纯函数：价格 → 需求量、供给量、缺口 */
  function calc(v) {
    var p = Math.max(4, Math.min(16, +v));
    var demand = 120 - 6 * p;
    var supply = 6 * p;
    return { demand: demand, supply: supply, gap: supply - demand };
  }

  function stateOf(p) {
    if (p < 9.5) return { name: "供不应求", sn: "短缺 " + Math.round(calc(p).demand - calc(p).supply) + " 杯，价格有上涨压力", col: "#b8402f", bg: "#fbeae7" };
    if (p > 10.5) return { name: "供过于求", sn: "过剩 " + Math.round(calc(p).supply - calc(p).demand) + " 杯，价格有下跌压力", col: "#b8791f", bg: "#fdf3e0" };
    return { name: "供求均衡", sn: "供给量 = 需求量，价格稳定", col: "#2f8a5b", bg: "#e6f6ee" };
  }

  function panel(g, r, edge) {
    el("rect", { x: r.x, y: r.y, width: r.w, height: r.h, rx: 10, fill: "#f8fbfd", stroke: edge }, g);
  }

  function draw() {
    var gA = $("gxA"), gB = $("gxB");
    gA.textContent = ""; gB.textContent = "";
    var s = calc(A), st = stateOf(A);
    var l = L.left, r = L.right, pl = L.plot;

    /* ---------------- 左：供求曲线 ---------------- */
    panel(gA, l, "#dbe7ef");
    tx(gA, l.x + 20, l.y + 30, "一杯奶茶的市场：价格与供求", "#5a6472", "start", 11, 700);
    tx(gA, l.x + 20, l.y + 49, "纵轴价格 P，横轴数量 Q", "#9aa3ae", "start", 9.2, 400);

    var px = l.x + pl.x, py = l.y + pl.y, pw = pl.w, ph = pl.h;
    var xOf = function (q) { return px + q / 120 * pw; };
    var yOf = function (p) { return py + (16 - p) / 12 * ph; };

    /* 坐标轴与网格 */
    el("line", { x1: px, y1: py, x2: px, y2: py + ph, stroke: "#9aa3ae", "stroke-width": 1.2 }, gA);
    el("line", { x1: px, y1: py + ph, x2: px + pw, y2: py + ph, stroke: "#9aa3ae", "stroke-width": 1.2 }, gA);
    [4, 8, 10, 12, 16].forEach(function (p) {
      var yy = yOf(p);
      el("line", { x1: px - 4, y1: yy, x2: px, y2: yy, stroke: "#9aa3ae" }, gA);
      tx(gA, px - 9, yy + 3, String(p), "#6b7280", "end", 8.4);
    });
    [0, 30, 60, 90, 120].forEach(function (q) {
      var xx = xOf(q);
      el("line", { x1: xx, y1: py + ph, x2: xx, y2: py + ph + 4, stroke: "#9aa3ae" }, gA);
      tx(gA, xx, py + ph + 17, String(q), "#6b7280", "middle", 8.4);
    });
    tx(gA, px + 6, py + (L === W ? 12 : 30), "P（元）", "#5a6472", "start", 8.8, 700);
    tx(gA, px + pw, py + ph + 34, "Q（杯）", "#5a6472", "end", 8.8, 700);

    /* 需求曲线：Qd=120−6P */
    el("line", { x1: xOf(120 - 6 * 4), y1: yOf(4), x2: xOf(120 - 6 * 16), y2: yOf(16), stroke: DEM, "stroke-width": 2.2 }, gA);
    /* 供给曲线：Qs=6P */
    el("line", { x1: xOf(6 * 4), y1: yOf(4), x2: xOf(6 * 16), y2: yOf(16), stroke: SUP, "stroke-width": 2.2 }, gA);

    /* 曲线标签 */
    tx(gA, xOf(105) + 2, yOf(4.4) - 4, "需求 D", DEM, "start", 8.8, 700, true);
    tx(gA, xOf(98) + 2, yOf(15.2) + 4, "供给 S", SUP, "start", 8.8, 700, true);

    /* 均衡点 */
    var eqx = xOf(60), eqy = yOf(10);
    el("circle", { cx: eqx, cy: eqy, r: 5, fill: "#ffffff", stroke: "#2f8a5b", "stroke-width": 2 }, gA);
    el("line", { x1: px, y1: eqy, x2: eqx, y2: eqy, stroke: "#2f8a5b", "stroke-width": 1, "stroke-dasharray": "3 3" }, gA);
    el("line", { x1: eqx, y1: eqy, x2: eqx, y2: py + ph, stroke: "#2f8a5b", "stroke-width": 1, "stroke-dasharray": "3 3" }, gA);
    tx(gA, eqx + 7, eqy - 7, L === W ? "均衡 E（10 元，60 杯）" : "均衡 E", "#1f6b47", "start", 8.4, 700, true);

    /* 当前价格横线 + 两个点 */
    var cy = yOf(A);
    el("line", { x1: px, y1: cy, x2: px + pw, y2: cy, stroke: RED, "stroke-width": 1.2, "stroke-dasharray": "5 3" }, gA);
    var qd = 120 - 6 * A, qs = 6 * A;
    el("circle", { cx: xOf(qd), cy: cy, r: 4.5, fill: DEM, stroke: "#ffffff", "stroke-width": 1.5 }, gA);
    el("circle", { cx: xOf(qs), cy: cy, r: 4.5, fill: SUP, stroke: "#ffffff", "stroke-width": 1.5 }, gA);
    tx(gA, xOf(qd) - 6, cy - 8, "Qd", DEM, "end", 8.4, 700, true);
    tx(gA, xOf(qs) + 6, cy - 8, "Qs", SUP, "start", 8.4, 700, true);

    /* 缺口括号 */
    if (Math.abs(qd - qs) > 4) {
      var gx1 = xOf(Math.min(qd, qs)), gx2 = xOf(Math.max(qd, qs));
      var gy = cy + 16;
      el("line", { x1: gx1, y1: gy, x2: gx2, y2: gy, stroke: "#8a5c14", "stroke-width": 1.2 }, gA);
      el("line", { x1: gx1, y1: gy - 4, x2: gx1, y2: gy + 4, stroke: "#8a5c14" }, gA);
      el("line", { x1: gx2, y1: gy - 4, x2: gx2, y2: gy + 4, stroke: "#8a5c14" }, gA);
      tx(gA, (gx1 + gx2) / 2, gy + 14, (qs > qd ? "过剩 " : "短缺 ") + Math.round(Math.abs(qs - qd)) + " 杯", "#8a5c14", "middle", 8.4, 700);
    }

    /* ---------------- 右：数量条 + 结论 ---------------- */
    panel(gB, r, "#e6e9ee");
    tx(gB, r.x + 20, r.y + 30, "把当前价格下的两个数量并排看", "#5a6472", "start", 11, 700);
    tx(gB, r.x + 20, r.y + 49, "条越长，数量越多；两条不等，就有缺口", "#9aa3ae", "start", 9.2, 400);

    var barX = r.x + 24, barW = r.w - 48, barY = r.y + 74, barH = 34;
    var maxQ = 120;
    [["需求量 Qd", qd, DEM, DEM_SOFT], ["供给量 Qs", qs, SUP, SUP_SOFT]].forEach(function (row, i) {
      var yy = barY + i * 82;
      tx(gB, barX, yy - 6, row[0], "#5a6472", "start", 9, 700);
      tx(gB, barX + barW, yy - 6, Math.round(row[1]) + " 杯", row[2], "end", 9.4, 700);
      el("rect", { x: barX, y: yy, width: barW, height: barH, rx: 6, fill: "#eef2f6", stroke: "#dbe7ef" }, gB);
      var w = Math.max(2, barW * row[1] / maxQ);
      el("rect", { x: barX, y: yy, width: w, height: barH, rx: 6, fill: row[3], stroke: row[2] }, gB);
    });

    /* 状态卡 */
    var sy = r.y + 250;
    el("rect", { x: r.x + 20, y: sy, width: r.w - 40, height: 92, rx: 8, fill: st.bg, stroke: st.col + "44" }, gB);
    tx(gB, r.x + 34, sy + 22, "市场信号", "#5a6472", "start", 8.8, 400);
    tx(gB, r.x + 34, sy + 48, st.name, st.col, "start", 15, 700);
    tx(gB, r.x + 34, sy + 70, st.sn, "#3a3a35", "start", 9, 400);
    tx(gB, r.x + 34, sy + 85, "缺口 = 供给量 − 需求量 = " + (s.gap > 0 ? "+" : "") + Math.round(s.gap) + " 杯", "#6b7280", "start", 8.6);

    /* 底部结论 */
    if (L === W) {
      tx(gB, r.x + 20, r.y + r.h - 40, "供不应求 → 价格上升 → 生产扩大、需求减少", "#6b7280", "start", 8.6);
      tx(gB, r.x + 20, r.y + r.h - 22, "供过于求 → 价格下降 → 生产缩小、需求增加", "#6b7280", "start", 8.6);
    }
  }

  function render() {
    var s = calc(A), st = stateOf(A);
    $("gxVa").textContent = A.toFixed(1);
    $("gxVb").textContent = Math.round(s.demand);
    $("gxVc").textContent = Math.round(s.supply);
    if (Math.abs(s.gap) < 0.5) $("gxVcS").textContent = "供求相等";
    else $("gxVcS").textContent = "缺口 " + (s.gap > 0 ? "+" : "−") + Math.round(Math.abs(s.gap)) + " 杯";
    $("gxVs").textContent = st.name;
    $("gxVsn").textContent = st.sn;
    $("gxStBox").style.background = st.bg;
    $("gxStBox").style.borderColor = st.col + "44";
    $("gxVs").style.color = st.col;
    draw();
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 14 }, { t: 1.2, v: 14 }, { t: 4, v: 10 }, { t: 6.5, v: 10 }, { t: 9, v: 6 }, { t: 11, v: 6 }, { t: 13, v: 14 }],
    keys: [14, 10, 6],
    value: A, min: 4, max: 16, step: 0.5,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__bio = { calc: calc, cases: [
    { v: 4, eq: { demand: 96, supply: 24, gap: -72 } },
    { v: 10, eq: { demand: 60, supply: 60, gap: 0 } },
    { v: 14, eq: { demand: 36, supply: 84, gap: 48 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
