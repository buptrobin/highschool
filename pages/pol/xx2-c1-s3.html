<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写课本这句，不写你脑子里那句。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 合同是什么<span class="q-src">人教版（2019）选择性必修2 法律与生活 · 第三课</span></p>
<p class="q-b">合同是民事主体之间设立、变更、终止民事法律关系的协议。</p>
<p class="q-n">→ 翻成人话：这句话有三个条件。① 双方都是平等的民事主体，不是行政机关下命令；② 内容指向民事权利义务，比如买卖、租赁、装修；③ 目的是设立、变更或者终止一段民事法律关系。三个条件缺一个，就不是这里说的合同。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 合同怎么成立<span class="q-src">人教版（2019）选择性必修2 法律与生活 · 第三课</span></p>
<p class="q-b">要约是希望与他人订立合同的意思表示。承诺是受要约人同意要约的意思表示。承诺生效时合同成立。</p>
<p class="q-n">→ 翻成人话：先有人「开口提条件」，这叫要约；再有人「点头答应」，这叫承诺。点头那一刻合同就成立，不是等到签字盖章，也不是等到付款。注意两个细节：要约的内容要具体确定，还要表明「你答应我就受约束」。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 合同为什么算数<span class="q-src">人教版（2019）选择性必修2 法律与生活 · 第三课</span></p>
<p class="q-b">依法成立的合同，受法律保护。当事人应当按照约定全面履行自己的义务，并遵循诚信原则，根据合同的性质、目的和交易习惯履行通知、协助、保密等义务。</p>
<p class="q-n">→ 翻成人话：抓两个关键词。①「依法成立」——主体适格、意思表示真实、内容不违法，才受保护；②「全面 + 诚信」——该做的做完，还要做通知、协助、保密这些配套动作。合同有效靠的不是那张纸，是法律给的约束力。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>要约</th><th>要约邀请</th></tr></thead>
<tbody>
<tr><td>想干什么</td><td>希望对方答应，一答应就成交</td><td>希望对方向自己提条件</td></tr>
<tr><td>内容</td><td>具体确定，标的、数量、价款能定下来</td><td>通常只说个大概，或者只报价目</td></tr>
<tr><td>常见样子</td><td>「这台样机三千卖你，要吗」</td><td>商业广告、价目表、拍卖公告、招标公告</td></tr>
<tr class="key"><td>一句话判据</td><td>内容够具体 + 表明「你答应我就受约束」</td><td>内容不够具体，或写明「以最终确认为准」</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">背表格时别背死。商业广告一般是要约邀请，但内容具体确定、对订立合同有重大影响的说明和允诺，可以构成要约。商品房销售广告里对房屋及相关设施的具体说明，就常被这样认定。所以先看内容够不够具体，再下结论。至于承诺什么时候生效：口头说的，对方知道内容时生效；寄信、发电邮的，到达对方时生效。</p>
</section>

<h2><span class="sn">02</span>拆开看</h2>
<p class="gx-h2s">四张图：各讲一件事，按「怎么成立 → 算不算数 → 怎么履行 → 哪里最容易吵」排。</p>

<p class="fig-s">三格排成一条线：先有「请你来谈」，再有「我提条件」，最后「你答应」。承诺生效那一刻，合同就成立，跟签没签字、付没付款无关。判断成立与否只盯一件事：承诺有没有生效。付款、交货、签字都排在成立之后，属于履行环节。答题写「合同自承诺生效时成立」，不写「自签字时成立」。</p>

<p class="gx-take">要约是「我提条件」，承诺是「我答应」；承诺一生效，合同成立，付钱和签字都排在它后面。</p>

<figure class="gx-fig">
<div class="fig-cap">
<span class="fig-no">图 2</span><span class="fig-t">合同效力：四道关，四种后果</span>

<p class="fig-s">合同成立以后，法律还要问一句「它算不算数」。主体有没有相应民事行为能力、意思表示真不真实、内容违不违法、格式条款有没有踩线，四件事对应四种结果。四格里最容易混的是「无效」和「可撤销」：无效自始没有约束力，可撤销在撤销之前仍然有效。</p>

<p class="gx-take">成立只回答「谈成没有」，有效才回答「法律保不保护」；无效合同从订立那天起就没有约束力。</p>
<p class="gx-note">别漏年龄这一关：8 周岁以上的未成年人是限制民事行为能力人，订立合同一般要经法定代理人同意或者追认；不满 8 周岁的未成年人订立的合同无效。题目里出现「初中生自己买了台电脑」，先看年龄，再看金额跟他的年龄、智力是否相适应。</p>
</figure>
<figure class="gx-fig">

<p class="fig-s">诚信原则贯穿合同的一生：订立时不说假话，履行时该通知就通知，发生争议时解释规则也向诚信一侧偏。格式条款是商家单方写好的，法律对它盯得更紧：有没有提示、有没有说明、有没有不合理地免除自己的责任、有没有排除你的主要权利。</p>

<rect x="16" y="16" width="788" height="198" rx="10" fill="#f8fbfd" stroke="#dbe7ef"/>
<text x="36" y="41" font-size="11.5" font-weight="700" fill="#151a21">诚信原则管全程，格式条款受严管</text>
<rect x="34" y="58" width="368" height="120" rx="8" fill="#ffffff" stroke="#cfe0ea"/>
<text x="48" y="78" font-size="10" font-weight="700" fill="#151a21">诚信原则管什么</text>

<text x="48" y="114" font-size="9.2" fill="#3a3a35">履行时：通知、协助、保密</text>
<text x="48" y="130" font-size="9.2" fill="#3a3a35">变更时：不突然加价、不故意拖延</text>
<text x="48" y="146" font-size="9.2" fill="#3a3a35">争议时：禁止反言，说话要算数</text>
<text x="48" y="166" font-size="8.8" fill="#6b7280">它是「兜底条款」，法律没写到的情形也管</text>

<text x="432" y="130" font-size="9.2" fill="#3a3a35">排除对方主要权利：无效</text>
<text x="432" y="146" font-size="9.2" fill="#3a3a35">两种解释时，作不利于提供方的解释</text>

<text x="36" y="196" font-size="9.2" fill="#3a3a35">商家写「最终解释权归本店所有」，这句话本身就不能对抗消费者。</text>
</svg>
<span class="gx-zoomchip">点击放大</span>
</div>
<p class="gx-take">格式条款不是「写了就算」，不合理免责、排除对方主要权利的条款直接无效；没尽提示说明义务的，对方还能主张它不成为合同内容。</p>
<p class="gx-note">答题写「无效」之前，先说清是哪一种：是条款内容无效，还是提供方没尽提示说明义务。两者依据不同，分点写才拿满分。</p>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，写出你的三点判断，再点「下一步」对答案。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 合同违约与定金罚则<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">小赵在家具店订一套总价 10 万元的家具，当场交付定金 2 万元，约定一个月后送货上门。三天后小赵在别家看到更便宜的，反悔不买，要求家具店退还 2 万元定金。家具店说定金不退，还拿出合同说里面约定了 1 万元违约金，要小赵一并支付。结合材料，运用《法律与生活》知识回答：小赵能否要回定金？家具店能否同时主张违约金和定金？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性</p>
<p class="s-b">先定知识范围：这是一起买卖合同纠纷，考违约责任，核心是定金罚则，附带「违约金与定金能否并用」。不涉及侵权，也不涉及行政责任，别往那个方向写。</p>
<p class="s-k">用到：违约责任、定金罚则。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 找主体</p>
<p class="s-b">材料里只有两个人：小赵是买方，也是给付定金的一方；家具店是卖方，是收受定金的一方。谁的过错导致不履行，决定定金罚则往哪边打。</p>
<p class="s-k">用到：给付定金一方 / 收受定金一方。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 找行为</p>
<p class="s-b">双方谈好总价 10 万元、一个月后送货，合同已经成立；小赵当场交 2 万元，定金合同也成立；小赵因为自己看中别家而不买，是给付定金一方不履行债务。注意反悔的理由是「别家更便宜」，属于自身原因，不是不可抗力，也不是商家违约。</p>
<p class="s-k">用到：合同成立、定金合同、不履行债务。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 对应原理</p>
<p class="s-b">三条原理依次落：① 定金不得超过主合同标的额的 20%，10 万元的 20% 正是 2 万元，全额有效；② 给付定金一方不履行，无权请求返还定金；③ 既约定违约金又约定定金的，守约方只能择一适用，不能并用。补一句：定金合同从实际交付定金时才成立，题目若写「只签了字没交钱」，定金罚则就用不上。</p>
<p class="s-k">用到：定金上限 20%、定金罚则、择一适用。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口</p>
<p class="s-b">按「合同成立 → 定金合法 → 无权返还 → 不能并用」四层写，每层一句原理加一句材料。最后给结论：定金不退；家具店选 2 万元定金比选 1 万元违约金更有利。</p>
<p class="s-k">用到：分点作答、结论回扣材料。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">① 合同成立并生效。双方就标的、数量、价款达成一致，买卖合同成立；小赵实际交付定金，定金合同同时成立，二者都受法律保护。<br>② 定金数额合法。定金不得超过主合同标的额的 20%，10 万元的 20% 为 2 万元，小赵交的 2 万元未超过上限，全部产生定金效力。<br>③ 小赵无权要求返还。小赵是给付定金的一方，因自身原因不履行债务，致使不能实现合同目的，无权请求返还定金。<br>④ 违约金与定金不能并用。合同既约定 1 万元违约金，又约定定金，家具店只能选择适用违约金或者定金条款，不能同时主张。<br>⑤ 结论：2 万元定金不予退还；家具店主张定金比主张违约金更有利，但选了定金就不能再要 1 万元违约金。</p>
</div>
</div>
</section>
<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。每问配一句话答案和一张小图，帮你把判据钉住。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「广告上写了价格，我一付款，合同就成立了吧？」</p>
<p class="a">不一定。商业广告和宣传一般是要约邀请，你下单是要约，<b>商家确认才是承诺</b>；承诺生效，合同才成立。页面内容具体确定、表明「你答应我就受约束」的，才按要约处理。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="页面标价与下单确认的关系">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="32" text-anchor="middle" font-size="8.6" fill="#6b7280">商品页面：要约邀请</text>
<text x="120" y="62" text-anchor="middle" font-size="11" font-weight="700" fill="#151a21">下单 = 要约</text>
<text x="120" y="86" text-anchor="middle" font-size="11" font-weight="700" fill="#151a21">确认 = 承诺</text>
<line x1="40" y1="100" x2="200" y2="100" stroke="#cbd5e1" stroke-width="1"/>
<text x="120" y="114" text-anchor="middle" font-size="8.6" fill="#3a3a35">承诺生效，合同才成立</text>
</svg>
</div>
<div class="qac">
<p class="q">「没签书面合同，口头说的就不算数？」</p>
<p class="a">算数。合同可以采用口头形式，<b>形式不影响效力</b>，依法成立就受法律保护。真正麻烦的是举证：聊天记录、转账备注、录音、在场的人，都能帮你证明合同存在和内容。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="口头合同也受法律保护">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="32" text-anchor="middle" font-size="8.6" fill="#6b7280">口头约定</text>
<text x="120" y="60" text-anchor="middle" font-size="11" font-weight="700" fill="#151a21">也是合同</text>
<text x="120" y="84" text-anchor="middle" font-size="8.6" fill="#3a3a35">难在举证，不在效力</text>
<text x="120" y="108" text-anchor="middle" font-size="8.6" fill="#6b7280">聊天记录 / 转账 / 录音</text>
</svg>
</div>
<div class="qac">
<p class="q">「定金交多了，超过的部分也算定金吗？」</p>
<p class="a">不算。定金不得超过主合同标的额的 <b>20%</b>，超过部分不产生定金效力。10 万元的合同，定金最多 2 万元；交 3 万元，多出的 1 万元不能按定金罚则处理。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="定金不得超过标的额百分之二十">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="32" text-anchor="middle" font-size="8.6" fill="#6b7280">主合同标的额 10 万元</text>
<text x="120" y="60" text-anchor="middle" font-size="11" font-weight="700" fill="#151a21">定金上限 2 万元</text>
<line x1="40" y1="76" x2="200" y2="76" stroke="#cbd5e1" stroke-width="1"/>
<text x="120" y="98" text-anchor="middle" font-size="8.6" fill="#3a3a35">超过部分不产生定金效力</text>
<text x="120" y="116" text-anchor="middle" font-size="8.6" fill="#6b7280">写 3 万，只有 2 万算定金</text>
</svg>
</div>
<div class="qac">
<p class="q">「合同里写『概不退换』，是不是就只能认了？」</p>
<p class="a">不用认。这是格式条款，<b>不合理地免除自己责任、排除对方主要权利的条款无效</b>。商家还没尽提示和说明义务的，你还可以主张这一条不成为合同内容。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="格式条款不合理免责无效">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="30" text-anchor="middle" font-size="8.6" fill="#6b7280">概不退换 · 最终解释权归本店</text>
<text x="120" y="58" text-anchor="middle" font-size="11" font-weight="700" fill="#151a21">不等于有效</text>
<text x="120" y="84" text-anchor="middle" font-size="9" fill="#3a3a35">不合理免责 → 无效</text>
<text x="120" y="108" text-anchor="middle" font-size="9" fill="#3a3a35">排除主要权利 → 无效</text>
</svg>
</div>
<div class="qac">
<p class="q">「台风来了，迟延交货就一点责任都没有？」</p>
<p class="a">不是。因不可抗力不能履行的，按影响<b>部分或者全部免除责任</b>；但要及时通知对方，并在合理期限内提供证明。迟延履行之后才碰上不可抗力的，不能免责。证明要说清影响的时间段和范围。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="不可抗力免责的范围">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="30" text-anchor="middle" font-size="8.6" fill="#6b7280">台风、洪水、封路</text>
<text x="120" y="54" text-anchor="middle" font-size="8.6" fill="#3a3a35">不能预见 + 不能避免 + 不能克服</text>
<text x="120" y="82" text-anchor="middle" font-size="11" font-weight="700" fill="#151a21">部分或全部免责</text>
<text x="120" y="106" text-anchor="middle" font-size="9" fill="#3a3a35">仍须通知 + 提供证明</text>
</svg>
</div>
<div class="qac">
<p class="q">「又约了违约金又交了定金，能不能两个都要？」</p>
<p class="a">不能。守约方<b>只能择一适用</b>违约金或者定金条款，不能并用。选哪个看哪个更有利：材料里 2 万元定金大于 1 万元违约金，就主张定金。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="违约金与定金只能择一">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="30" text-anchor="middle" font-size="9.5" fill="#3a3a35">违约金 1 万元</text>
<text x="120" y="56" text-anchor="middle" font-size="9.5" fill="#3a3a35">定金 2 万元</text>
<text x="120" y="84" text-anchor="middle" font-size="11" font-weight="700" fill="#151a21">只能选一个</text>
<text x="120" y="108" text-anchor="middle" font-size="9" fill="#3a3a35">不能并用，选了就不能反悔</text>
</svg>
</div>
</div>
<p class="gx-note">六问其实是同一件事：先看合同成不成立，再看有没有效力，再看履行得怎么样，最后看违约后果。每一步都问自己三句话——主体是谁、行为是什么、法律后果是什么。写答案时把这三句排成三段，分就稳了。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">每条先给一句学生真会写的错句，再给应该写的样子，最后一句点破错在哪。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 网店页面标了价，就是要约，我一付款合同就成立。</p>
<p class="er-v">✓ 商业广告和宣传一般是要约邀请；内容具体确定、表明经承诺即受约束的，才构成要约。</p>
<p class="er-w">错在：把要约邀请当成要约，漏掉「承诺生效」这一步。</p>
</div>
<div class="er">
<p class="er-x">✗ 没签书面合同，口头说好的不算，谁也不用负责。</p>
<p class="er-v">✓ 合同可以采用口头形式，依法成立的口头合同同样受法律保护。</p>
<p class="er-w">错在：把合同形式当成成立要件；难的是举证，不是效力。</p>
</div>
<div class="er">
<p class="er-x">✗ 定金和订金差不多，反悔了都能退。</p>
<p class="er-v">✓ 定金是担保，适用定金罚则；订金一般只是预付款，不产生定金效力。</p>
<p class="er-w">错在：两个字差一个偏旁，法律后果差一倍。</p>
</div>
<div class="er">
<p class="er-x">✗ 商家违约，我可以既要违约金又要定金，拿双份。</p>
<p class="er-v">✓ 既约定违约金又约定定金的，一方违约时，对方只能选择其一适用。</p>
<p class="er-w">错在：把两种责任方式当成可以叠加的惩罚。</p>
</div>
<div class="er">
<p class="er-x">✗ 合同上印着概不退换，白纸黑字，我只能认。</p>
<p class="er-v">✓ 格式条款不合理地免除或者减轻提供方责任、加重对方责任、限制对方主要权利的，该条款无效。</p>
<p class="er-w">错在：把「写下来了」当成「有效了」，不看条款内容。</p>
</div>
<div class="er">
<p class="er-x">✗ 遇到台风、洪水，什么责任都不用承担了。</p>
<p class="er-v">✓ 因不可抗力不能履行的，根据不可抗力的影响，部分或者全部免除责任。</p>
<p class="er-w">错在：免责是「按影响」而不是「全免」，还漏了通知和证明。</p>
</div>
<div class="er">
<p class="er-x">✗ 定金想约定多少就多少，写 5 万就按 5 万罚。</p>
<p class="er-v">✓ 定金数额由当事人约定，但不得超过主合同标的额的 20%，超过部分不产生定金效力。</p>
<p class="er-w">错在：不知道 20% 的上限，把约定金额直接当罚则基数。</p>
</div>
</div>
