<p class="gx-lede">班里两个人吵架，先找班长，再找班主任，最后闹到年级组。你会发现，越往后，说话越算数，程序也越正式。国家的纠纷处理也是这样：协商、调解、仲裁都不成，最后到法院。这一框讲的就是这“最后一站”：谁来审、怎么审、审得公不公。它在整册书里是“全面依法治国”四个环节中的第三个，前面是科学立法、严格执法，后面是全民守法。最容易错的一件事，是把公安局也当成“司法机关”。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。材料题里“司法机关”四个字写错，后面写得再漂亮也白搭。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 公正司法是什么<span class="q-src">人教版（2019）必修3 政治与法治 · 第9课第3框</span></p>
<p class="q-b">公正司法，就是要在司法活动的过程和结果中坚持和体现公平正义。司法是维护社会公平正义的最后一道防线。</p>
<p class="q-n">→ 翻成人话：这句话给你两个抓手。第一个是“过程”和“结果”都要公平，分别对应程序公正和实体公正；第二个是“最后一道防线”，说明司法之前的协商、调解、仲裁都失灵了，才轮到它。换句话讲，能走进法院的案子，往往已经是“实在没办法了”的案子。答题时这两层要分开写，别揉成一句“司法很重要”。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 谁来司法<span class="q-src">人教版（2019）必修3 政治与法治 · 第9课第3框</span></p>
<p class="q-b">在我国，人民法院是国家的审判机关，人民检察院是国家的法律监督机关。人民法院和人民检察院依照法律规定独立行使审判权、检察权。</p>
<p class="q-n">→ 翻成人话：司法机关只有两家——人民法院和人民检察院。公安局负责侦查、治安，它是人民政府的组成部门，属于行政机关；司法局管律师、公证、普法，也是行政机关。把公安局写成“司法机关”，是这一框的第一号失分点，每年都有人踩。记住：公安是行政机关，可它的侦查行为一样要受法律约束。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 怎么才算公正<span class="q-src">人教版（2019）必修3 政治与法治 · 第9课第3框</span></p>
<p class="q-b">必须坚持以事实为根据、以法律为准绳，做到事实认定符合客观真相、办案结果符合实体公正、办案过程符合程序公正。</p>
<p class="q-n">→ 翻成人话：这里有三个“符合”，少一个都不算。事实认定看证据扎不扎实；办案结果看判决公不公平；办案过程看你有没有被告知权利、有没有申请回避、庭审有没有公开。三个都符合，才叫公正司法。材料题里出现“程序违法”四个字，考的就是第三个。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>人民法院</th><th>人民检察院</th><th>公安机关</th></tr></thead>
<tbody>
<tr><td>机关性质</td><td>国家审判机关</td><td>国家法律监督机关</td><td>行政机关（政府组成部门）</td></tr>
<tr><td>主要职权</td><td>审判权</td><td>检察权，即法律监督</td><td>侦查权、治安管理权</td></tr>
<tr><td>上下级关系</td><td>监督关系</td><td>领导关系</td><td>领导关系</td></tr>
<tr class="key"><td>是不是司法机关</td><td>是</td><td>是</td><td>不是</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">背法就一句：法院审、检察院督、公安查，三家并排站，“司法”只圈前两家。这张表只高亮最后一行，因为选择题九成考这一行；上面三行是拿来解释“为什么不是”的。考前只背最后一行也够用，但方向别背反。</p>
</section>

<p class="fig-s">五个情境都是真实案事例的改写。判断口诀只有一句：先看谁在做，再看做了什么，最后看这件事解决的是“怎么审”“谁担责”“让不让看”，还是“帮不帮得上”。口诀背完，剩下的就是动手点。</p>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干、想 30 秒，再点“下一步”。每一步只推进一个判断，别跳。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 措施类材料题<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">某市中级人民法院深化司法体制改革：严格落实“让审理者裁判、由裁判者负责”，法官对案件质量终身负责；全面推行庭审直播和裁判文书上网，建成一站式诉讼服务中心；对经济困难的当事人依法缓交、减交、免交诉讼费，两年办理司法救助案件 137 件；主动向市人大常委会报告工作，邀请人大代表旁听庭审。市人民检察院对 12 件确有错误的生效裁判依法提出抗诉。<br>结合材料，运用“公正司法”的知识，说明该市是如何推进公正司法的。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性</p>
<p class="s-b">先看设问的动词：“如何推进”是措施类，答案要写做法，不是写意义。再看知识范围：“公正司法”这一框，别写到科学立法、严格执法去。最后看主体：法院、检察院、市人大常委会，一共三方。</p>
<p class="s-k">用到：公正司法的内涵 + 推进公正司法的要求。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 切材料，找行为</p>
<p class="s-b">按分号把材料切成四块：终身负责、直播和上网、缓减免与救助、报告工作并请代表旁听；最后一句单列，是检察院抗诉。一块对应一个采分点，切完先数一数，别漏块。材料里的分号和句号，就是天然的切分线。</p>
<p class="s-k">用到：主体 + 行为，一段材料只提取一个动作。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 行为对原理</p>
<p class="s-b">终身负责对应司法责任制；直播和上网对应司法公开；缓减免和救助对应司法为民；报告工作、请代表旁听对应接受人大监督；抗诉对应检察监督。五块对着五条原理，对不上的不要硬凑。</p>
<p class="s-k">用到：司法责任制、司法公开、司法为民、人大监督、检察监督。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 排顺序，定详略</p>
<p class="s-b">答案按“总—分”排：先用一句话点明公正司法的地位，是维护社会公平正义的最后一道防线；再分点写措施。材料里写得最长的那块（责任制）写详细，其余写清楚就行，别平均用力。</p>
<p class="s-k">用到：先原理后材料，每点都是“原理句 + 材料关键词”。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口</p>
<p class="s-b">每一点写成三小句：原理句、材料句、效果句。只抄材料不给分，只背原理也不给满分。最后一句回扣到“让人民群众在每一个司法案件中感受到公平正义”。</p>
<p class="s-k">用到：分点作答，术语到位，回扣设问。</p>

<p class="ans-b">① 坚持依法独立公正行使审判权。该市法院落实“让审理者裁判、由裁判者负责”，法官对案件质量终身负责，完善司法责任制，做到谁办案谁负责、谁决定谁负责，保证审判权依法独立公正行使。<br>② 推进司法公开。该市法院推行庭审直播、裁判文书上网，构建开放、动态、透明、便民的阳光司法机制，以公开促公正、以透明保廉洁。<br>③ 坚持人民司法为人民。该市法院依法缓减免诉讼费、办理司法救助，加强人权司法保障，让困难群众打得起官司，通过公正司法维护人民权益。<br>④ 自觉接受监督。该市法院向市人大常委会报告工作、邀请人大代表旁听庭审，接受人大监督和社会监督；市人民检察院依法提出抗诉，履行法律监督职责，保障裁判公正。<br>⑤ 总之，该市通过责任制、公开、为民、监督一起发力，让人民群众在每一个司法案件中感受到公平正义。</p>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是“你以为懂了、一写就错”的地方。先自己答一句，再看下面的答案。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">“公安局又抓人又侦查，为什么不算司法机关？”</p>
<p class="a">因为划分标准是<b>机关性质</b>，不是“有没有参与办案”。人民法院是审判机关，人民检察院是法律监督机关，二者构成司法机关；公安机关是人民政府的组成部门，属于<b>行政机关</b>，侦查只是它的一项职权。答题时写“公安机关依法侦查”，不写“公安机关作为司法机关”。差的就是这个身份，选择题常在这一处设卡。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="法院和检察院属于司法机关，公安属于行政机关">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<rect x="18" y="26" width="62" height="32" rx="5" fill="#eef6ff" stroke="#b8d6ea"/>
<text x="49" y="46" font-size="8.4" fill="#22303c" text-anchor="middle">法院</text>
<rect x="89" y="26" width="62" height="32" rx="5" fill="#eef6ff" stroke="#b8d6ea"/>
<text x="120" y="46" font-size="8.4" fill="#22303c" text-anchor="middle">检察院</text>
<rect x="160" y="26" width="62" height="32" rx="5" fill="#fffaf4" stroke="#e6cfb4"/>
<text x="191" y="46" font-size="8.4" fill="#22303c" text-anchor="middle">公安</text>
<line x1="18" y1="64" x2="151" y2="64" stroke="#9db4c4" stroke-width="1"/>
<line x1="160" y1="64" x2="222" y2="64" stroke="#c9b39a" stroke-width="1"/>
<text x="84" y="78" font-size="8.2" fill="#5a6b78" text-anchor="middle">司法机关</text>
<text x="191" y="78" font-size="8.2" fill="#8a6a48" text-anchor="middle">行政机关</text>
<text x="120" y="102" font-size="8.4" fill="#3a3a35" text-anchor="middle">性质不同，判断就不同</text>
</svg>
</div>
<div class="qac">
<p class="q">“法院独立审判，是不是可以不听任何人的？”</p>
<p class="a">不是。独立的前提是<b>依法</b>：依照法律规定独立行使审判权，不受行政机关、社会团体和个人的干涉。但法院要接受<b>人大及其常委会的监督</b>，还要接受监察监督、社会监督和舆论监督。一句话记：独立防的是非法干涉，监督防的是权力任性，两句话要一起写。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="依法独立与接受监督并不矛盾">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<rect x="14" y="34" width="88" height="44" rx="6" fill="#eef6ff" stroke="#b8d6ea"/>
<text x="58" y="60" font-size="9.5" fill="#1f4e6b" text-anchor="middle">依法独立</text>
<rect x="138" y="34" width="88" height="44" rx="6" fill="#eef9f0" stroke="#cfe3cf"/>
<text x="182" y="60" font-size="9.5" fill="#2c5b34" text-anchor="middle">接受监督</text>
<text x="120" y="66" font-size="14" fill="#5a6b78" text-anchor="middle">≠</text>
<text x="120" y="100" font-size="8.4" fill="#3a3a35" text-anchor="middle">独立不是不受监督</text>
</svg>
</div>
<div class="qac">
<p class="q">“判决结果对了，程序上有点小毛病，还算公正司法吗？”</p>
<p class="a">不算。公正司法要求<b>实体公正和程序公正相统一</b>：结果要对，过程也要对。程序违法不是“小毛病”，可能导致证据被排除、裁判被撤销、案件被发回重审。答题时两层都要写：办案结果符合实体公正，办案过程符合程序公正。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="实体公正和程序公正缺一不可">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<rect x="16" y="30" width="94" height="48" rx="6" fill="#eef6ff" stroke="#b8d6ea"/>
<text x="63" y="50" font-size="9" fill="#1f4e6b" text-anchor="middle">实体公正</text>
<text x="63" y="68" font-size="8.2" fill="#3a5b73" text-anchor="middle">结果公平</text>
<rect x="130" y="30" width="94" height="48" rx="6" fill="#eef9f0" stroke="#cfe3cf"/>
<text x="177" y="50" font-size="9" fill="#2c5b34" text-anchor="middle">程序公正</text>
<text x="177" y="68" font-size="8.2" fill="#3a6b48" text-anchor="middle">过程合法</text>
<text x="120" y="62" font-size="13" fill="#5a6b78" text-anchor="middle">+</text>
<text x="120" y="100" font-size="8.4" fill="#3a3a35" text-anchor="middle">缺一个，都不算公正司法</text>
</svg>
</div>
<div class="qac">
<p class="q">“司法公开会不会变成‘未审先判’，反而影响公正？”</p>
<p class="a">公开有边界。法律规定的<b>不公开情形</b>，比如涉及国家秘密、个人隐私、未成年人案件，不公开审理；公开的是审判流程、庭审、裁判文书、执行信息，目的是<b>以公开促公正</b>，让权力在阳光下运行。公开不是让舆论代替法官判案，裁判仍由法院依法作出。答题时先写“以公开促公正”，再补一句“公开有法定边界”，两层都写到才稳。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="司法公开以公开促公正，同时有边界">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>

<div class="qac">
<p class="q">“司法责任制和司法公开，到底有什么区别？”</p>
<p class="a">一个管人，一个管窗。司法责任制解决<b>谁办案谁负责</b>：让审理者裁判、由裁判者负责，案件质量终身负责；司法公开解决<b>过程能不能看见</b>：审判流程、庭审、裁判文书、执行信息公开。前者是约束，后者是透明，两条一起才构成公正司法。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="司法责任制管住人，司法公开打开窗">

<text x="120" y="104" font-size="8.4" fill="#3a3a35" text-anchor="middle">一个约束，一个透明</text>
</svg>

<div class="qac">
<p class="q">“前面还有调解、仲裁，为什么说司法是最后一道防线？”</p>
<p class="a">因为司法是<b>终局性</b>的。调解、仲裁把大量纠纷拦在前面，但生效裁判有既判力，除了再审、抗诉这些法定程序，没有第二家能推翻它。所以司法一旦不公，当事人几乎无路可走。“最后”两个字，说的是<b>兜底</b>，也说它不可替代。前面几道关口可以不选，这一道没得选。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。考前只看这七条，也能捞回好几分。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 公安机关负责侦查刑事案件，所以也是我国的司法机关。</p>
<p class="er-v">✓ 人民法院是国家的审判机关，人民检察院是国家的法律监督机关，二者构成司法机关；公安机关是行政机关。</p>
<p class="er-w">错在拿“干不干办案的活”当标准。判断机关性质看它属于哪个机关序列，不看它有没有参与办案。性质写在宪法和组织法里，不写在案卷里。</p>
</div>
<div class="er">
<p class="er-x">✗ 人民法院独立行使审判权，不受任何机关和个人的监督。</p>
<p class="er-v">✓ 人民法院依照法律规定独立行使审判权，不受行政机关、社会团体和个人的干涉，同时接受人大监督、监察监督和社会监督。</p>
<p class="er-w">错在把“独立”读成“没人管”。独立针对的是非法干涉，监督针对的是权力本身，两者不矛盾。写答案时“依法”和“监督”要同时出现，只写一半就是半句话。</p>
</div>
<div class="er">
<p class="er-x">✗ 只要判决结果公平，程序上有点瑕疵不影响公正司法。</p>
<p class="er-v">✓ 公正司法要坚持实体公正和程序公正相统一，办案结果符合实体公正，办案过程符合程序公正。</p>
<p class="er-w">错在漏掉程序。程序违法可能导致证据被排除、裁判被撤销或发回重审，结果再对也站不住。</p>
</div>
<div class="er">
<p class="er-x">✗ 司法公开就是把裁判文书发到网上。</p>
<p class="er-v">✓ 推进司法公开要构建开放、动态、透明、便民的阳光司法机制，包括审判流程、庭审、裁判文书、执行信息公开。</p>
<p class="er-w">错在以一项代替全部。四大公开缺一项，阳光司法机制就不完整。四项公开各管一段，少了执行公开，赢了官司也可能拿不到钱。</p>
</div>
<div class="er">
<p class="er-x">✗ 司法责任制就是法官判错案就要下岗。</p>
<p class="er-v">✓ 完善司法责任制，让审理者裁判、由裁判者负责，做到谁办案谁负责、谁决定谁负责，案件质量终身负责。</p>
<p class="er-w">错在把制度说成处罚。责任制的核心是权责一致，不是一错就开除。</p>
</div>
<div class="er">
<p class="er-x">✗ 法院要配合当地政府工作，政府的要求应当优先考虑。</p>
<p class="er-v">✓ 人民法院依法独立行使审判权，不受行政机关的干涉；行政机关不能干预司法活动。</p>
<p class="er-w">错在把行政机关当上级。政府与法院是不同序列的机关，不是领导与被领导关系。</p>
</div>
<div class="er">
<p class="er-x">✗ 人民陪审员只是坐在法庭上凑数，实际还是法官说了算。</p>
<p class="er-v">✓ 人民陪审员制度保障人民群众有序参与司法，是司法民主的重要体现，陪审员依法参加合议庭并对事实认定享有表决权。</p>
<p class="er-w">错在低估制度。陪审员带来的生活经验，正是“让审理者裁判”的一部分，也是司法民主最直观的样子。</p>
</div>
</div>
