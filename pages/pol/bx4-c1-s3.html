<p class="gx-claim">这一框只要背准三件事：马克思主义哲学是<b>辩证唯物主义和历史唯物主义</b>；它第一次实现了<b>唯物主义与辩证法的有机结合</b>、唯物辩证的自然观与历史观的统一；<b>实践性</b>是它首要的基本观点，也是三个特征里最爱考的那一个。</p>
<div class="gx-meta">
<span><i></i>人教版（2019）必修4 哲学与文化 · 第1课第3框</span>
<span><i></i>高一 · 第一课 时代精神的精华</span>
<span><i></i>阅读 14 分钟</span>
<span><i></i>含 1 个情境判断器</span>
</div>
<p class="gx-lede">你有没有被同学问过：“马克思主义哲学，不就是政治课上要背的那几段话吗？”这句话里藏着两个误会：一是把它当成一堆要背的结论，二是把它当成“黑格尔的辩证法加上费尔巴哈的唯物主义”。这一框要拆的正是这两个误会。它在第一课里排最后：前面先讲“哲学是什么”“哲学的基本问题”，到这里才第一次交出一个完整的、成体系的哲学形态。最容易错的一件事，是把“科学性、革命性、实践性”三个词背下来了，却说不出它们各自在回答什么问题。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。这一框的答案几乎都能从下面三句话里改出来，别自己造词。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 它为什么会出现<span class="q-src">人教版（2019）必修4 哲学与文化 · 第1课第3框</span></p>
<p class="q-b">马克思主义哲学的产生不是偶然的。无产阶级的产生和发展是它的阶级基础，细胞学说、能量守恒和转化定律、生物进化论是它的自然科学前提，德国古典哲学是它的理论来源。</p>
<p class="q-n">→ 翻成人话：三个条件各有分工，答题时别混着写。阶级基础回答“谁需要它”——无产阶级登上历史舞台，需要一个能说清自己处境和出路的思想武器；自然科学前提回答“凭什么可能”——三大发现证明了自然界是联系、发展着的，不是一堆孤立不变的东西；理论来源回答“从哪里长出来”——直接来源是德国古典哲学，主要是黑格尔的辩证法和费尔巴哈的唯物主义。注意“来源”不等于“照搬”，这一点第二句还要接着讲。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 它在哲学史上改了什么<span class="q-src">人教版（2019）必修4 哲学与文化 · 第1课第3框</span></p>
<p class="q-b">马克思主义哲学第一次实现了唯物主义与辩证法的有机结合，实现了唯物辩证的自然观与历史观的统一。它确立了科学的实践观，实现了实践基础上的科学性和革命性的统一。</p>
<p class="q-n">→ 翻成人话：这句是本节的主干，四个短语要拆开看。“唯物主义与辩证法的有机结合”，是说它既承认世界的本原是物质，又承认物质世界是运动、变化、充满矛盾的——旧唯物主义唯物但不辩证，黑格尔辩证但不唯物，两家各缺一半。“自然观与历史观的统一”，是说它把唯物辩证法从自然界推进到人类社会，第一次用物质的原因去解释历史。“实践基础上的科学性和革命性的统一”，是说它不只解释世界，还要改变世界。四条少一条，答案就少一个采分点。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 它最特别的地方<span class="q-src">人教版（2019）必修4 哲学与文化 · 第1课第3框</span></p>
<p class="q-b">实践性是马克思主义哲学区别于其他哲学的最主要特征。马克思主义哲学的全部理论都来源于实践、服务于实践，并在实践中接受检验。它的历史使命是实现无产阶级和全人类的解放。</p>
<p class="q-n">→ 翻成人话：“最主要特征”这五个字就是采分点，别写成“重要特征”“基本特征”，一改就降档。为什么偏偏是实践性？因为别的哲学也在解释世界，只有它把“改变世界”写进了自己的任务书。答题时的完整链条是四步：来源于实践 → 服务于实践 → 在实践中接受检验 → 随实践的发展而发展。四个“实践”写全最稳，写两个也能得分，但只写“它很重视实践”这种话，等于没写。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>科学性</th><th>革命性</th><th>实践性</th></tr></thead>
<tbody>
<tr><td>回答什么</td><td>它到底对不对</td><td>它站在谁一边</td><td>拿什么去检验</td></tr>

<tr><td>常见误写</td><td>“它什么都能解释”</td><td>“它就是讲阶级斗争”</td><td>“它比较重视实践”</td></tr>
<tr class="key"><td>一句话记</td><td>真</td><td>彻底</td><td>首要的基本观点</td></tr>

</div>
<p class="gx-note">整张表只高亮最后一行，因为考试真正卡人的就是这一行。三个词回答三个不同的问题，不是三个近义词。卷子上写“马克思主义哲学具有科学性、革命性、实践性”，后面必须再跟一句“实践性是马克思主义哲学首要的基本观点”，否则只拿到一半分。背法就一句：科学性管“真不真”，革命性管“为谁用”，实践性管“拿什么检验”。</p>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干、想 30 秒，再点“下一步”。每一步只推进一个判断，别跳步。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 原因类材料题<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">一百多年来，中国共产党人坚持用马克思主义观察时代、把握时代、引领时代，不断推进马克思主义中国化时代化，形成了毛泽东思想、邓小平理论、“三个代表”重要思想、科学发展观、习近平新时代中国特色社会主义思想。在这一过程中，中国共产党人始终坚持实事求是，把马克思主义基本原理同中国具体实际、同中华优秀传统文化相结合，指导中国革命、建设、改革不断取得胜利。<br>结合材料，运用“科学的世界观和方法论”的知识，说明为什么说马克思主义哲学是科学的世界观和方法论。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性</p>
<p class="s-b">先看设问的动词：“为什么说”是原因类，答案要写理由，不是写做法。再看知识范围：“科学的世界观和方法论”这一框，别写到“哲学的基本问题”去。最后拆设问的关键词：它问的是“凭什么当得起‘科学’两个字”，所以答题框架就是四层——研究对象、内容构成、三个特征、实践检验。四层先列出来，再往里填。</p>
<p class="s-k">用到：马克思主义哲学的构成、基本特征、实践性。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 第一层：研究对象</p>
<p class="s-b">它研究的是整个世界，包括自然界、人类社会和人的思维，揭示的是世界特别是人类社会发展的普遍规律。这一层要写出对比：具体科学管一个领域，它管“一般”。正因为研究对象是“一般规律”，它才配叫“世界观”，而不是某门具体学科。这一层写两句话就够，别展开成哲学史。</p>
<p class="s-k">用到：研究对象是整个世界及其发展的普遍规律。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 第二层：内容构成</p>
<p class="s-b">它是辩证唯物主义和历史唯物主义。它第一次实现了唯物主义与辩证法的有机结合，实现了唯物辩证的自然观与历史观的统一。这两句要连着写：前一句解决“唯物但不辩证、辩证但不唯物”的老毛病，后一句解决“自然观唯物、历史观唯心”的老毛病。写完补一句：所以它的内容是完整而严密的，不是两家拼起来的。</p>
<p class="s-k">用到：两个“第一次实现”，反对“拼装说”。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 第三层：三个特征</p>
<p class="s-b">科学性在于它以实践为基础，正确揭示了世界发展的规律；革命性在于它公开申明为无产阶级和全人类解放服务，不掩盖自己的阶级性；实践性是它区别于其他哲学的最主要特征，是首要的基本观点。三个词要写出关系，不能并列罗列：科学性和革命性都统一在实践的基础上。</p>
<p class="s-k">用到：实践基础上科学性和革命性的统一。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 第四层：实践检验，收口</p>
<p class="s-b">最后一层回答“凭什么说它经得起检验”。它来源于实践、服务于实践，并在实践中接受检验。材料里那一百多年就是证据：中国革命、建设、改革的成功，反复证明了它的真理性。再补一句发展趋势：它没有封闭自己，而是不断中国化时代化，五个理论成果就是它在实践中发展的结果。这样收口，既有事实又有理论。</p>
<p class="s-k">用到：实践是检验认识真理性的唯一标准 + 中国化时代化。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">① 从研究对象看，马克思主义哲学以整个世界即自然界、人类社会和人的思维为研究对象，揭示世界特别是人类社会发展的普遍规律，而不是某一领域的特殊规律，因此它是科学的世界观。<br>② 从内容构成看，它是辩证唯物主义和历史唯物主义，第一次实现了唯物主义与辩证法的有机结合，实现了唯物辩证的自然观与历史观的统一，克服了旧唯物主义的机械性和形而上学性，内容完整而严密。<br>③ 从基本特征看，它实现了实践基础上的科学性和革命性的统一：科学性在于它以实践为基础，正确揭示世界发展的规律；革命性在于它公开申明为无产阶级和全人类解放服务。<br>④ 从实践检验看，实践性是它首要的基本观点，它来源于实践、服务于实践，并在实践中接受检验。一百多年来中国革命、建设、改革的实践，反复证明了它的真理性。<br>⑤ 从发展趋势看，它不封闭自己，而是不断中国化时代化。毛泽东思想、邓小平理论、“三个代表”重要思想、科学发展观、习近平新时代中国特色社会主义思想，都是它在实践中发展的成果。因此，马克思主义哲学是科学的世界观和方法论。</p>
</div>
</div>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是“你以为懂了、一写就错”的地方。先自己答一句，再看下面的答案。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">“马克思主义哲学，不就是黑格尔的辩证法加费尔巴哈的唯物主义吗？”</p>
<p class="a">不是“加起来”，而是<b>批判继承、改造之后的新东西</b>。黑格尔的辩证法是唯心的，费尔巴哈的唯物主义是形而上学、不彻底的；马克思主义哲学把辩证法从唯心主义外壳里剥出来，安放到唯物主义的基础上，才第一次实现唯物主义与辩证法的有机结合。答题时用“批判继承”“有机结合”，不要用“相加”“拼起来”。</p>

<div class="qac">
<p class="q">“科学性、革命性、实践性，三个里面哪个最重要？”</p>
<p class="a">三个都要写，但<b>实践性是首要的基本观点</b>，也是它区别于其他哲学的最主要特征。科学性回答“它对不对”，革命性回答“它为谁服务”，实践性回答“拿什么检验”；科学性和革命性都统一在实践的基础上。所以题目里一出现“最主要特征”四个字，答案只能是实践性。</p>

<text x="44" y="43" font-size="8.4" fill="#22303c" text-anchor="middle">科学性</text>
<rect x="88" y="24" width="64" height="30" rx="5" fill="#fff1f4" stroke="#f3b8c2"/>
<text x="120" y="43" font-size="8.4" fill="#be123c" text-anchor="middle">实践性</text>
<rect x="164" y="24" width="64" height="30" rx="5" fill="#eef6ff" stroke="#b8d6ea"/>
<text x="196" y="43" font-size="8.4" fill="#22303c" text-anchor="middle">革命性</text>
<text x="120" y="76" font-size="8.6" fill="#3a3a35" text-anchor="middle">实践性是首要的基本观点</text>
<text x="120" y="96" font-size="8.4" fill="#3a3a35" text-anchor="middle">科学性与革命性统一于实践</text>

<div class="qac">
<p class="q">“说它‘科学’，是不是说它讲的每句话都永远正确？”</p>
<p class="a">不是。这里的“科学”指<b>以实践为基础、正确揭示世界发展的规律</b>，并且随时接受实践的检验；它不靠自称，也不靠权威。正因为它把实践当检验标准，所以它能随实践发展而修改、丰富自己——中国化时代化就是它自我更新的方式。答“为什么科学”，落点必须写到实践检验，只写“它是真理”等于没答。</p>

<text x="120" y="56" font-size="11" fill="#5a6b78" text-anchor="middle">≠</text>

<div class="qac">
<p class="q">“马克思主义中国化，是不是把马克思的原话翻译成中文？”</p>
<p class="a">不是翻译，是<b>结合</b>：把马克思主义基本原理同中国具体实际、同中华优秀传统文化相结合。翻译只换语言，结合要换问题——用同一套立场和方法，回答中国革命、建设、改革自己的问题。所以成果是一串中国名字，不是一个译本。答题写“相结合”，不要写“照搬”“套用”。</p>

<div class="qac">
<p class="q">“中国化和时代化，到底差在哪？”</p>
<p class="a">中国化管<b>空间</b>：跟哪个国家的实际结合；时代化管<b>时间</b>：回答哪个时代的问题。两个词合起来，才是“一脉相承又与时俱进”：脉是基本原理没丢，进是每个时代都有新回答。只写中国化，答不出“新”在哪里；只写时代化，又答不出“中国的”在哪里，两个词要成对出现。</p>

<text x="120" y="116" font-size="8.2" fill="#5a6b78" text-anchor="middle">合起来：一脉相承又与时俱进</text>
</svg>
</div>
<div class="qac">
<p class="q">“新思想出来了，前面的理论是不是就过时了？”</p>
<p class="a">不是取代，是<b>继承和发展</b>。前面的成果为后面的成果准备了条件，后面的成果坚持了前面的基本原理，又回答了新的时代课题。所以课本用的是“一脉相承、与时俱进”八个字。写“取代”“推翻”“过时”，都是把接力读成了换人，材料题里这样写会被判为观点错误。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。考前只看这七条，也能捞回好几分。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 马克思主义哲学就是黑格尔的辩证法加上费尔巴哈的唯物主义。</p>
<p class="er-v">✓ 马克思主义哲学批判继承了德国古典哲学，第一次实现了唯物主义与辩证法的有机结合，形成了辩证唯物主义和历史唯物主义。</p>
<p class="er-w">错在“加上”。两家各有一半可取、也各有一半要扔掉，取的是合理内核，不是整包搬过来。看到“相加”“拼起来”，一律改写成“批判继承”“有机结合”。</p>
</div>
<div class="er">
<p class="er-x">✗ 马克思主义哲学的三个特征是科学性、革命性、阶级性。</p>
<p class="er-v">✓ 它实现了实践基础上的科学性和革命性的统一，实践性是它首要的基本观点，也是区别于其他哲学的最主要特征。</p>
<p class="er-w">错在把“阶级性”塞进三个特征里。它确实有阶级性，但课本的特征表述是“科学性、革命性、实践性”，一字之差就是另一个采分点，别自己发明第三个词。</p>
</div>
<div class="er">
<p class="er-x">✗ 实践性只是三个特征中的一个，和科学性、革命性并列。</p>
<p class="er-v">✓ 实践性是马克思主义哲学首要的基本观点，科学性和革命性都统一于实践的基础之上。</p>
<p class="er-w">错在把“首要”读成“并列”。三个词不是三张并排的标签，实践是另外两个词的地基。答题时写出这层关系，比只罗列三个词高一个档。</p>
</div>
<div class="er">
<p class="er-x">✗ 马克思主义哲学是“科学之科学”，能代替具体科学回答问题。</p>
<p class="er-v">✓ 它以具体科学为基础，又为具体科学提供世界观和方法论的指导。</p>
<p class="er-w">错在把“一般”当“全部”。一般来自个别，但不能代替个别；哲学给方向和方法，具体科学给本领域的具体答案。上一框的“一般与个别”就是为这里铺路的。</p>
</div>
<div class="er">
<p class="er-x">✗ 马克思主义哲学中国化，就是把马克思的话翻译成中文。</p>
<p class="er-v">✓ 中国化是把马克思主义基本原理同中国具体实际、同中华优秀传统文化相结合。</p>
<p class="er-w">错在把“结合”降成“翻译”。翻译只换语言，结合要换问题。判断一个成果算不算中国化，看它有没有回答中国自己的问题，而不是看它用了什么语言。</p>

<div class="er">
<p class="er-x">✗ 中国化时代化就是不断用新理论取代旧理论。</p>

<div class="er">
