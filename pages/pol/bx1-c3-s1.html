<p class="gx-lede">这一框在第三课里是「起点」：后面讲中国特色社会主义的形成、讲邓小平理论，都从这里的那次会议算起。最容易错的一件事是把起点记成 1979 年，或者把「改革」说成「改变社会主义制度」——这两处一错，后面所有结论都跟着塌。下面用三条课本原话、四张图、一个拖年份的模型，把「1978 → 2020」这 42 年钉在时间轴上。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 伟大的改革开放<span class="q-src">人教版（2019）必修1 中国特色社会主义 · 第三课第一框</span></p>
<p class="q-b">1978 年党的十一届三中全会作出把党和国家工作中心转移到经济建设上来、实行改革开放的历史性决策。</p>
<p class="q-n">→ 翻成人话：这句话有<b>三个条件</b>，缺一个就答不全——① <b>时间</b>：1978 年，会议是党的十一届三中全会；② <b>决策内容</b>：把党和国家工作中心转移到<b>经济建设</b>上来，同时<b>实行改革开放</b>；③ <b>性质</b>：这是「历史性决策」，是一个转折点。少了①，起点就错；少了②，就说不清「转什么、改什么」；少了③，就答不出「为什么叫伟大」。所以<b>改革开放从 1978 年十一届三中全会开始</b>，这一句要能默写。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 关键一招<span class="q-src">人教版（2019）必修1 中国特色社会主义 · 第三课第一框</span></p>
<p class="q-b">改革开放是决定当代中国命运的关键一招，也是决定实现「两个一百年」奋斗目标、实现中华民族伟大复兴的关键一招。</p>
<p class="q-n">→ 翻成人话：这里有两个「关键一招」，对象不同——前者管<b>当代中国命运</b>（已经发生，回答「中国为什么富起来」），后者管<b>「两个一百年」奋斗目标、中华民族伟大复兴</b>（还在进行，回答「中国怎么强起来」）。答题时两个都要写，只写前一个会被判「不完整」。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 四个面貌<span class="q-src">人教版（2019）必修1 中国特色社会主义 · 第三课第一框</span></p>
<p class="q-b">改革开放极大改变了中国的面貌、中华民族的面貌、中国人民的面貌、中国共产党的面貌。</p>
<p class="q-n">→ 翻成人话：四个面貌是<b>四个主体</b>，不是四个形容词堆在一起：国家（中国）、民族（中华民族）、人民（中国人民）、执政党（中国共产党）。答题时按「国家—民族—人民—党」的顺序写，四个都点到，「极大改变」不能漏。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>学生常写的错口径</th><th>课本口径（照抄）</th></tr></thead>

<tr><td>性质</td><td>改革就是改变社会主义制度</td><td>改革是<b>社会主义制度的自我完善和发展</b></td></tr>
<tr><td>格局</td><td>对外开放就是开放沿海几个城市</td><td>开放是<b>全方位、多层次、宽领域</b>的</td></tr>
<tr><td>领域</td><td>改革开放只是经济领域的事</td><td>改革是<b>全面</b>改革，涉及经济、政治、文化、社会、生态文明和党的建设</td></tr>

</section>

<script>

document.addEventListener("DOMContentLoaded", function () {

  var N = { vb: "0 0 360 700", left: { x: 8, y: 8, w: 344, h: 300 }, right: { x: 8, y: 320, w: 344, h: 372 } };
  var L = W, A = 1978, G = null;

  /* 锚点：国家统计局年度数据（万亿元）。锚点之间线性插值，只为滑块连续 */
  var AN = [[1978, 0.37], [1990, 1.89], [2000, 10.0], [2010, 41.2], [2020, 101.6]];
  var PH = [
    { n: "改革探索期", r: "1978—1991" },
    { n: "市场经济体制建立", r: "1992—2000" },
    { n: "加入 WTO 后高速增长", r: "2001—2011" },
    { n: "新时代高质量发展", r: "2012 年以后" }
  ];

  function calc(v) {
    var y = Math.round(v);
    if (y < 1978) y = 1978; if (y > 2020) y = 2020;
    var g = AN[0][1], i;
    for (i = 0; i < AN.length - 1; i++) {
      if (y >= AN[i][0] && y <= AN[i + 1][0]) {
        var k = AN[i + 1][0] - AN[i][0];
        g = AN[i][1] + (AN[i + 1][1] - AN[i][1]) * (y - AN[i][0]) / k;
        break;

    var p = y < 1992 ? 0 : y <= 2000 ? 1 : y <= 2011 ? 2 : 3;
    return { year: y, gdp: g, ratio: g / 0.37, phase: p };
  }

  function pick() { return stage.parentElement.getBoundingClientRect().width >= 640 ? W : N; }

  function geom() {
    var lf = L.left, rt = L.right, na = L === N, g;
    g = {
      na: na,
      cx0: lf.x + (na ? 42 : 56), cx1: lf.x + lf.w - (na ? 10 : 16),
      cy0: lf.y + (na ? 54 : 70), cy1: lf.y + lf.h - (na ? 70 : 58),
      ry0: rt.y + (na ? 30 : 56), rh: na ? 56 : 62, rg: na ? 8 : 10,
      rx0: rt.x + (na ? 14 : 20), rx1: rt.x + rt.w - (na ? 14 : 20),

    for (i = 0; i < AN.length; i++) {
      el("circle", { cx: xx(AN[i][0]), cy: yy(AN[i][1]), r: 3.2, fill: "#2f6fa8" }, gA);
      tx(gA, xx(AN[i][0]), yy(AN[i][1]) - 7, AN[i][0] === 2020 ? "101.6" : String(AN[i][1]), "#7a8593", "middle", 8.4, 400);
    }
    for (i = 0; i < 5; i++) {

    tx(gA, G.cx1, G.cy0 - 16, "数据来源：国家统计局年度数据", "#9aa6b2", "end", 8.2, 400);

    /* 当前点 */
    p = calc(A).gdp;
    el("line", { x1: xx(A), y1: yy(p), x2: xx(A), y2: G.cy1, stroke: "#2f8a5b", "stroke-dasharray": "4 3" }, gA);
    el("circle", { cx: xx(A), cy: yy(p), r: 5.4, fill: "#ffffff", stroke: "#2f8a5b", "stroke-width": 2.6 }, gA);
    var lx = xx(A), anc = "middle";
    if (A < 1986) { anc = "start"; lx = xx(A) + 9; } else if (A > 2013) { anc = "end"; lx = xx(A) - 9; }
    tx(gA, lx, yy(p) - 13, String(s.year) + " 年 · " + (p < 10 ? p.toFixed(2) : p.toFixed(1)) + " 万亿", "#1d5c3c", anc, 9.6, 700);

    /* 右：四个阶段 */
    el("rect", { x: L.right.x, y: L.right.y, width: L.right.w, height: L.right.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    tx(gB, L.right.x + 20, L.right.y + 30, "所处阶段（按年份判断）", "#5a6472", "start", 10.5, 700);

      el("rect", { x: G.rx0, y: d, width: G.rx1 - G.rx0, height: G.rh, rx: 7, fill: act ? "#e6f6ee" : "#fbfcfd", stroke: act ? "#2f8a5b" : "#e6e9ee" }, gB);
      tx(gB, G.rx0 + 12, d + G.rh / 2 - 3, PH[i].n, act ? "#1d5c3c" : "#8a95a1", "start", 10.2, act ? 700 : 400);
      tx(gB, G.rx0 + 12, d + G.rh / 2 + 13, PH[i].r, "#9aa6b2", "start", 8.8, 400);

    tx(gB, G.rx1, G.by - 9, "×" + s.ratio.toFixed(0), "#1d5c3c", "end", 11, 700);
