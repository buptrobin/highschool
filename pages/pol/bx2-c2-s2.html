<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 体制定位<span class="q-src">人教版（2019）必修2 经济与社会 · 第二课第二框</span></p>
<p class="q-b">社会主义市场经济体制是社会主义基本经济制度的重要组成部分。</p>
<p class="q-n">→ 这句在回答“它是什么”。主语是<b>社会主义市场经济体制</b>，不是“市场经济”，也不是“政府调控”。它落在“社会主义基本经济制度”这个大盘子里。答题时漏掉“基本经济制度”，这句话就降了一档。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 优势从哪来<span class="q-src">人教版（2019）必修2 经济与社会 · 第二课第二框</span></p>
<p class="q-b">科学的宏观调控、有效的政府治理，是社会主义市场经济体制优势的内在要求。</p>
<p class="q-n">→ 这句在回答“政府为什么重要”。关键词是<b>内在要求</b>，不是“外在补充”。市场有长处，也有短处；政府作用长在体制内部，不是市场失灵时临时叫来的救兵。考试里把政府写成“市场的替补”，这句就白背了。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 政府经济职能<span class="q-src">人教版（2019）必修2 经济与社会 · 第二课第二框</span></p>
<p class="q-b">政府要履行好经济职能：保持宏观经济稳定，加强和优化公共服务，保障公平竞争，加强市场监管，维护市场秩序，推动可持续发展，促进共同富裕，弥补市场失灵。</p>
<p class="q-n">→ 这句是答题的“词库”。八个动作，背的时候分四组：<b>稳总量</b>（保持宏观经济稳定）、<b>优服务</b>（加强和优化公共服务）、<b>保秩序</b>（保障公平竞争、加强市场监管、维护市场秩序）、<b>促长远</b>（推动可持续发展、促进共同富裕、弥补市场失灵）。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>有效市场</th><th>有为政府</th></tr></thead>
<tbody>
<tr><td>谁配置资源</td><td>市场在资源配置中起决定性作用</td><td>政府更好发挥作用</td></tr>

<p class="gx-note">背法：先记“市场决定、政府更好”，再记政府八项任务。看到“政府代替市场”“政府直接给企业下指标”，先判<b>越位</b>，再判具体错在哪。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点“下一步”。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 评析类<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">当前部分行业需求不足、就业压力加大。有人认为“政府直接给企业下生产指标最快”。请运用“更好发挥政府作用”的知识，对这一观点进行评析。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性</p>
<p class="s-b">题目问的是“评析”，不是“措施”。先定性：材料里的政府行为，属于履行<b>政府经济职能</b>、进行<b>宏观调控</b>。观点里有一半对（政府该出手），有一半错（出手的方式不对）。答题要先肯定合理处，再指出错处。</p>
<p class="s-k">用到：政府经济职能、科学的宏观调控</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 判断病因</p>
<p class="s-b">“需求不足、就业压力加大”说明总需求偏冷，产出低于潜在水平。这时政府应实施<b>扩张性财政政策</b>和<b>稳健或宽松的货币政策</b>：减税降费、增加支出、降准降息，让企业敢投资、居民敢消费。</p>
<p class="s-k">用到：财政政策、货币政策</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 拆错点</p>
<p class="s-b">“直接给企业下生产指标”是<b>行政命令</b>，不是宏观调控的主要手段。它把价格信号换成任务数字，容易扭曲市场、造成资源错配。宏观调控主要用经济手段和法律手段，间接影响企业，而不是替企业做决定。</p>
<p class="s-k">用到：宏观调控 ≠ 行政命令；有效市场</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 补全政府该做的</p>
<p class="s-b">除了总量政策，政府还要加强和优化公共服务、完善社会保障、改善营商环境、稳定市场预期。这些事市场做不了或做不好，正好由政府补位。补位不是替市场经营，而是让市场更能正常运转。</p>
<p class="s-k">用到：公共服务、弥补市场失灵、有为政府</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口</p>
<p class="s-b">政府要“有为”，但不能“越位”。市场在资源配置中起<b>决定性作用</b>，政府更好发挥作用，二者有机统一。所以正确做法是：用扩张性宏观政策稳需求，用公共服务和社保兜底线，而不是直接给企业下指标。</p>
<p class="s-k">用到：有效市场 + 有为政府、不越位不缺位</p>
</li>
</ol>
<div class="exbar">

</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">① 该观点看到了政府应主动稳需求，有合理之处，但“直接下生产指标”的说法不科学。<br>② 需求不足、就业压力加大时，政府应履行经济职能，实施扩张性财政政策和稳健或宽松的货币政策，通过减税降费、增加支出、降准降息等经济手段扩大总需求。<br>③ 直接给企业下生产指标属于行政命令，容易扭曲价格信号、造成资源错配，不是宏观调控的主要手段。<br>④ 政府还应加强和优化公共服务、完善社会保障、改善营商环境，弥补市场失灵。<br>⑤ 更好发挥政府作用，要坚持有效市场与有为政府相结合：市场起决定性作用，政府不越位、不缺位、不错位。</p>
