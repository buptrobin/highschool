<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">这一框的答案压在三个判断上：最本质特征、最大优势、最高政治领导力量。先照抄，再拆关键词。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 党的领导地位<span class="q-src">人教版（2019）必修3 政治与法治 · 第三课第一框</span></p>
<p class="q-b">中国特色社会主义最本质的特征是中国共产党领导，中国特色社会主义制度的最大优势是中国共产党领导。中国共产党是最高政治领导力量。</p>
<p class="q-n">→ 翻成人话：这是三个判断，不是一句口号。「最本质特征」回答的是「中国特色社会主义凭什么叫社会主义」；「最大优势」回答的是「这套制度凭什么能集中力量办大事」；「最高政治领导力量」回答的是「政治上谁定方向」。答题时三个词分点写，别揉成一句「党很伟大」。还要盯住最后一句的落点：是「政治领导力量」，不是「国家权力机关」。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 总揽全局、协调各方<span class="q-src">人教版（2019）必修3 政治与法治 · 第三课第一框</span></p>
<p class="q-b">党政军民学，东西南北中，党是领导一切的。党总揽全局、协调各方，支持和保证国家机关依法履行职能。</p>
<p class="q-n">→ 翻成人话：「领导一切」讲范围——没有哪个领域可以不要党的领导；「总揽全局、协调各方」讲方式——党管方向、管统筹，具体的事由国家机关依法去办。这里有个坑：把「领导一切」读成「包办一切」，就会写出「党代替政府执法」「党代替法院审判」这种句子。判卷老师看到「代替」两个字，基本就判你概念不清。正确的动词是「领导」「支持」「保证」「各司其职」。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 三种领导方式<span class="q-src">人教版（2019）必修3 政治与法治 · 第三课第一框</span></p>
<p class="q-b">党的领导主要是政治领导、思想领导、组织领导，三者有机统一，缺一不可。</p>
<p class="q-n">→ 翻成人话：这是一道分类题的答案模板。政治领导管方向和路线方针政策；思想领导管理论武装和意识形态；组织领导管干部、管基层党组织。材料里出现「中央作出部署」「制定规划建议」，往政治领导上靠；出现「学习贯彻」「宣讲」「舆论引导」，往思想领导上靠；出现「选派干部」「基层党组织」「党员带头」，往组织领导上靠。三者不是三选一，是同一件事的三个面。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>中国共产党</th><th>全国人民代表大会</th></tr></thead>
<tbody>
<tr><td>是什么</td><td>中国工人阶级的先锋队，同时是中国人民和中华民族的先锋队</td><td>我国的国家权力机关，由人民选举代表组成</td></tr>
<tr><td>地位</td><td>最高政治领导力量，中国特色社会主义事业的领导核心</td><td>最高国家权力机关，在国家机构中居于最高地位</td></tr>
<tr><td>管什么</td><td>管方向、管全局、管干部，提出路线方针政策</td><td>行使立法权、决定权、任免权、监督权</td></tr>
<tr><td>怎么活动</td><td>依据党章党规活动，在宪法法律范围内活动</td><td>依据宪法和法律活动，集体行使职权</td></tr>
<tr class="key"><td>选择题最爱的替换</td><td>最高政治领导力量</td><td>最高国家权力机关</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只高亮一行：<b>选择题最爱的替换</b>。命题人最爱干的事，就是把这两个词对调着塞进选项里——「党是最高国家权力机关」是错项，「全国人大是最高政治领导力量」也是错项。背法是：党管「政治」，人大管「权力」；党不代替人大立法，人大也不领导党。材料题里这两家还会同框出现：党中央提出建议，全国人大审议通过，一进一出，正好把两个地位都考到。写答案时先说党的主张，再说人大的程序，顺序本身就是采分点。</p>
</section>

<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。五步走完，答案自然出来。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 原因类材料题<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">材料：某省在大山深处推进乡村振兴。省委制定五年规划，明确方向和底线；省人大把省委的规划建议审议后上升为地方性法规；省政府组织资金修路、建产业园；省政协开展专题协商、提出建议；驻村第一书记带着村党支部逐户摸排，党员先试种，再带着群众扩种。三年后，全县特色产业产值翻番。结合材料，运用「坚持党的领导」的知识，说明为什么必须坚持党的全面领导。（12 分）</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性</p>
<p class="s-b">题型是「为什么」，知识范围是「坚持党的领导」，主体锁定党，不是政府。设问要答两层：一层是「为什么必须」（地位决定），一层是「为什么能」（优势决定）。草稿上先写两个词：地位、优势。</p>
<p class="s-k">用到：原因类设问的两层结构</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 找主体</p>
<p class="s-b">材料里站着两类主体：党组织（省委、村党支部、第一书记）和国家机关（省人大、省政府、省政协）。这两类不能混着写。分错了，后面「谁领导谁」就说不清。判断主体有个笨办法：看句子里的动作是谁在做，是「作出部署」「研究决定」，还是「审议通过」「组织实施」。</p>
<p class="s-k">用到：党组织与国家机关系列</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 找行为</p>
<p class="s-b">省委定规划是定方向；人大把建议变法规是走法定程序；政府修路建园是依法履职；村党支部带人试种是组织带动。每个动作后面，都跟着一个能对上号的概念。这一步最费时间，也最值钱，因为材料题的分数就藏在这些动作里。</p>
<p class="s-k">用到：政治领导、依法执政、组织领导</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 对应原理</p>
<p class="s-b">先摆地位：最本质特征、最大优势、最高政治领导力量。再摆方式：总揽全局、协调各方，政治领导、思想领导、组织领导有机统一。原理和材料要一对一，别一段原理配三段材料。</p>
<p class="s-k">用到：党的领导地位与三种领导方式</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口</p>
<p class="s-b">最后一句往上抬：把党的领导落实到国家治理各领域各方面各环节。这句是采分点，不是套话。写完回头看一遍：有没有出现「代替」「包办」「以党代法」，有就删。</p>
<p class="s-k">用到：党的领导与国家治理</p>
</li>
</ol>

<p class="ans-b">① 由党的地位决定。党的领导是中国特色社会主义最本质的特征，是中国特色社会主义制度的最大优势，党是最高政治领导力量；坚持党的全面领导，才能保证乡村振兴的正确方向。<br>② 由党的领导方式决定。省委制定规划体现政治领导，把方向、定原则；驻村第一书记和村党支部带着党员先试种，体现组织领导，发挥基层党组织的战斗堡垒作用和党员的先锋模范作用。<br>③ 由党的领导与国家治理的关系决定。省委的规划建议经省人大审议上升为地方性法规，通过法定程序使党的主张成为国家意志，体现依法执政；政府、政协、司法机关依法各司其职，说明党的领导是总揽全局、协调各方，不是包办代替。<br>④ 由实践效果检验。三年产值翻番，说明党的领导能够集中力量办大事，把制度优势转化为治理效能。<br>结论：必须把党的领导落实到国家治理各领域各方面各环节，坚持党的全面领导。</p>
