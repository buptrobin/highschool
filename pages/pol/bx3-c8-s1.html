<p class="gx-lede">学校门口的红绿灯坏了三天，你打 12345，工单转到交警支队，第二天就有人来修。你可能会问：一个电话为什么管用？因为背后有一整套东西撑着——政府的权力写在清单上，哪件事该谁管写得清楚；拖了不办可以投诉、可以复议、可以起诉；法律也不许哪个部门装看不见。这一框在必修3 第八课第一框，是「法治中国建设」的开篇，也是整册法治部分的落点：法治国家是目标，法治政府、法治社会是它的重点任务和基础。最容易错的一件事：把「法治国家」当成「法治政府」，或者当成「政府用法律管老百姓」。这两个错，一个丢定位分，一个丢立场分。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">这一框的分数压在三个判断上：法治国家是什么、宪法法律至上的三层意思、良法凭什么算良法。先照抄课本，再拆关键词；答题时写课本这一句，不写你脑子里那一句。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 什么是法治国家<span class="q-src">人教版（2019）必修3 政治与法治 · 第八课第一框</span></p>
<p class="q-b">法治国家，就是实行依法治国、依宪治国、依法执政、依宪执政的国家。在现代社会，法治国家意味着国家权力依法行使，国家各项工作依法开展。</p>
<p class="q-n">→ 翻成人话：这句里藏着两个判据。① 谁依法：是<b>国家权力</b>依法，不是你守法就叫法治国家。权力依法，意思是权力的取得有法律依据、行使有法定程序、越界要被追究。② 依什么法：依法，首先依宪，四个「依」里有两个「依宪」，宪法排在法律前面，不是并列。答题时写「国家权力依法行使、国家各项工作依法开展」，比写十句「法律很重要」都得分。还要记住它的位置：法治国家是法治建设的<b>目标</b>。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 宪法法律至上<span class="q-src">人教版（2019）必修3 政治与法治 · 第八课第一框</span></p>
<p class="q-b">建设法治国家，必须坚持宪法法律至上。宪法是国家的根本法，具有最高的法律效力。一切法律、行政法规和地方性法规都不得同宪法相抵触。任何组织或者个人都不得有超越宪法和法律的特权。</p>
<p class="q-n">→ 翻成人话：三句话是三层。① 宪法是根本法、有最高法律效力——这是「上位」；② 一切法律、行政法规和地方性法规都不得同宪法相抵触——这是「下位不能犯上」，合宪性审查干的就是这件事；③ 任何组织或者个人都没有超越宪法法律的特权——这一句把「人」也管住了，国家机关工作人员一样在内。别把「宪法法律至上」拆成「宪法至上、法律次之」：它是一个整体词组，说的是宪法和法律在国家各种规范里有最高地位，一切组织和个人都要在宪法法律范围内活动。材料里出现宪法宣誓、合宪性审查、违宪纠正，都往这一条上落。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 良法之治<span class="q-src">人教版（2019）必修3 政治与法治 · 第八课第一框</span></p>
<p class="q-b">建设法治国家，必须坚持良法之治。良法应内容合理，在制定过程中应广泛听取各方意见，符合社会和人民的需要，符合社会公平正义的理念；良法应体系完备、规范系统、类别齐全、协调统一，能够涵盖社会生活的各个方面。良法是善治的前提。</p>
<p class="q-n">→ 翻成人话：良法有两个判据，只记一个最容易丢分。① <b>内容合理</b>——管得对：反映人民意志、符合公平正义、能解决真问题。立法过程中广泛听取意见，公开征求意见、立法听证、基层立法联系点，都是在做这一步。② <b>体系完备</b>——管得全：规范系统、类别齐全、协调统一，社会生活各个方面都有法可依，法与法之间不打架。最后一句「良法是善治的前提」是答题金句：有法律不等于有良法，有良法才谈得上善治。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>法治国家</th><th>法治政府</th></tr></thead>
<tbody>
<tr><td>在体系里的位置</td><td>法治建设的<b>目标</b>，管的是国家整体</td><td>法治建设的<b>重点任务</b>，是法治国家建设的主体工程</td></tr>
<tr><td>管谁</td><td>国家权力整体：立法权、行政权、司法权都在法律之下运行</td><td>各级人民政府，核心是依法行政</td></tr>
<tr><td>主要判据</td><td>宪法法律至上、良法之治、权力制约、权利保障</td><td>职能科学、权责法定、执法严明、公开公正、智能高效、廉洁诚信、人民满意</td></tr>
<tr><td>常见错法</td><td>写成「法治政府」，把目标缩成一项任务</td><td>写成「法治国家」，把局部说成整体</td></tr>
<tr><td>材料里怎么认</td><td>宪法宣誓、合宪性审查、立法征求意见、权力清单、纠冤错案</td><td>行政执法公示、执法全过程记录、重大执法决定法制审核、政务服务一网通办</td></tr>
<tr class="key"><td>真正的区别</td><td>看「国家」这一整体：宪法法律有没有最高地位，权力受不受约束，权利有没有保障</td><td>看「政府」这一主体：行政权怎么用、执法怎么规范、办事效率高不高</td></tr>
</tbody>
</table>

<p class="gx-note">这张表只高亮一行：<b>真正的区别</b>。记法两句：法治国家是目标，法治政府是目标里的重点任务，两者是整体和部分，不是同义词，也不是先后两步。还有一条最容易漏：法治国家、法治政府、法治社会是<b>一体建设</b>，不是「先建国家、再建政府、最后建社会」。法治社会是基础，地基不稳，上面两层都晃。材料题里只要出现「宪法」「宪法宣誓」「合宪性审查」「权力清单」「良法」，知识范围就锁在这一框；出现「执法公示」「政务服务」，才轮到法治政府那一框。</p>
</section>

<p class="gx-note">这里有个坑：有的同学写「宪法是根本法，所以宪法管不到具体事」。宪法确实不直接规定「闯红灯罚多少钱」，但它规定国家的根本制度和根本任务、公民的基本权利和义务，一切法律都要以它为依据。还有一处：「法律至上」不是「法律万能」，法律管不到的地方靠道德、靠习惯、靠村规民约，这些都不能同法律相抵触。</p>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。五步走完，答案的架子就搭好了。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 措施体现类材料题<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">材料：某市推进法治建设做了四件事。市人大常委会把五年立法规划草案全文公布，一个月收到市民意见建议三千多条，并就《城市养犬管理条例》召开两场立法听证会；市政府在门户网站公布权力清单、责任清单，明确「清单之外无权力」，同时推行行政执法公示和执法全过程记录；市中级人民法院对一起十年前的旧案依法再审，宣告原审被告人无罪，并依法给予国家赔偿；新任命的国家工作人员在宪法宣誓墙前集体宣誓，市委理论学习中心组专题学习宪法。结合材料，运用《政治与法治》的知识，说明该市是如何建设法治国家的。（12 分）</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性</p>
<p class="s-b">题型是「如何体现」类，知识范围锁定第八课第一框「法治国家」，要求观点加材料。先在草稿上画四格：宪法法律至上、良法之治、权力制约、权利保障，每格留一行填材料事实，最后留一行写收口。别急着写，格子就是采分点。</p>
<p class="s-k">用到：法治国家的内涵与建设要求</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 找主体</p>
<p class="s-b">材料里的主体一串：市人大常委会、市政府、市中级人民法院、新任命的国家工作人员。四个主体恰好对上四个落点，一一对应，不要串。你会发现没有一个是「上级来检查」——法治国家不是靠运动式检查建成的，是靠每个机关在自己的职权范围内依法办事。</p>
<p class="s-k">用到：国家机关的职权划分</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 找行为</p>
<p class="s-b">行为按主体排：公布立法规划、开听证会（良法的程序）；公布权力清单、推行执法公示和全过程记录（权力的边界与程序）；再审改判、国家赔偿（权利的救济）；宪法宣誓（宪法的地位）。四个动作四种性质，写的时候一句术语配一句材料，不要只抄材料。</p>
<p class="s-k">用到：科学立法、依法行政、公正司法</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 对应原理</p>
<p class="s-b">一格一句。宪法格：宪法是国家的根本法，具有最高法律效力，宪法宣誓强化国家工作人员的宪法意识。良法格：广泛听取意见，使立法内容合理、符合人民需要和公平正义，提高立法质量。权力格：权力清单定边界、程序定步骤，把权力关进制度的笼子。权利格：有错必纠、有损必赔，保障公民合法权益。</p>
<p class="s-k">用到：宪法法律至上、良法之治、权力制约、权利保障</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口</p>
<p class="s-b">开头一句判断，中间四点分写，每点「术语＋材料＋作用」三截。结尾回扣「法治国家是法治建设的目标」和「依法治国、依法执政、依法行政共同推进，法治国家、法治政府、法治社会一体建设」。特别注意把宪法宣誓单列一点：它最容易被当成仪式跳过，其实它正对着「宪法法律至上」这个采分点。</p>
<p class="s-k">用到：观点与材料相结合、法治中国建设的整体布局</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">① 坚持宪法法律至上。该市组织新任命的国家工作人员宪法宣誓、专题学习宪法，引导国家工作人员树立宪法意识。宪法是国家的根本法，具有最高的法律效力，一切组织和个人都不得有超越宪法和法律的特权。<br>② 坚持良法之治。市人大常委会公布立法规划草案、广泛征求市民意见、召开立法听证会，使立法内容合理、符合社会需要和公平正义的理念，提高了立法质量。良法是善治的前提。<br>③ 规范国家权力运行，加强对权力的制约。市政府公布权力清单、责任清单，明确「清单之外无权力」，推行行政执法公示和执法全过程记录，做到法定职责必须为、法无授权不可为，把权力关进制度的笼子。<br>④ 尊重和保障公民权利。市中级人民法院依法再审、宣告无罪并给予国家赔偿，使被侵害的权利得到救济，让人民群众在每一个司法案件中感受到公平正义。保护公民权利是法治的主要功能。<br>⑤ 该市把宪法法律至上、良法之治、权力制约、权利保障统一起来，坚持依法治国、依法执政、依法行政共同推进，法治国家、法治政府、法治社会一体建设，朝着法治建设的目标扎实往前。<br>（评分参考：四点各 3 分，其中术语 1 分、材料 1 分、作用 1 分；整体收口写到目标或一体建设再给 1—2 分。）</p>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。每问先自己答一句，再看下面那句。</p>
<div class="gx-qa">

<div class="qac">
<p class="q">「法治国家就是法治政府吗？把政府管好了，法治国家是不是就建成了？」</p>
<p class="a">不是。法治国家是法治建设的<b>目标</b>，法治政府是它的<b>重点任务</b>，两者是整体和部分，既不是同义词，也不是先后两步。法治国家还包括宪法法律至上、良法之治、公正司法、权利保障；法治政府只管行政权这一段。材料里的主体是政府、动作是执法，才轮到法治政府。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="法治国家是整体目标，法治政府是其中一项重点任务">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="28" font-size="9.2" text-anchor="middle" fill="#151a21">整体与部分，不是同义词</text>
<rect x="18" y="38" width="204" height="34" rx="7" fill="#eef8f2" stroke="#b8e6d0"/>
<text x="30" y="53" font-size="8.8" font-weight="700" fill="#1e6640">法治国家 · 目标（整体）</text>
<text x="30" y="66" font-size="8.2" fill="#3a3a35">宪法至上、良法、治权、权利</text>
<rect x="18" y="80" width="204" height="30" rx="7" fill="#ffffff" stroke="#dbe7ef"/>
<text x="30" y="94" font-size="8.8" font-weight="700" fill="#151a21">法治政府 · 重点任务（部分）</text>
<text x="30" y="106" font-size="8.2" fill="#3a3a35">只管行政权这一段</text>
</svg>
</div>

<div class="qac">
<p class="q">「法治国家，是不是就是政府用法律管老百姓？」</p>
<p class="a">不是。法治国家首先讲<b>国家权力依法行使</b>：权力取得有依据、行使有程序、越界要追究；同时讲公民权利有保障、有救济。只讲「管老百姓」，等于把法治当成管理的工具，把治权这一半丢了。课本那句「国家权力依法行使，国家各项工作依法开展」，主语是权力，不是群众。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="法治先治权再治事：权力有边界、有监督，权利有救济">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="28" font-size="9.2" text-anchor="middle" fill="#151a21">法治先治权，再治事</text>
<text x="24" y="50" font-size="8.4" fill="#3a3a35">① 权力有边界：清单、法定程序</text>
<text x="24" y="68" font-size="8.4" fill="#3a3a35">② 权力有监督：人大、审计、社会</text>
<text x="24" y="86" font-size="8.4" fill="#3a3a35">③ 权利有救济：复议、诉讼、赔偿</text>
<line x1="20" y1="96" x2="220" y2="96" stroke="#dde4ea" stroke-width="1"/>
<text x="120" y="114" font-size="8.2" text-anchor="middle" fill="#6b7280">「管老百姓」只是守法，不是法治国家</text>
</svg>
</div>

<div class="qac">
<p class="q">「我们已经有这么多法律了，算不算法治国家？」</p>
<p class="a">不算。有法律只说明有规范，法治国家要求的是<b>良法之治</b>：内容合理——反映人民意志、符合公平正义；体系完备——规范系统、类别齐全、协调统一。良法是善治的前提。立法质量不高，执法越用力越走偏，材料题里常拿它当反例。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="有法律不等于有良法，良法是善治的前提">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="26" font-size="9.2" text-anchor="middle" fill="#151a21">有法 ≠ 良法</text>
<rect x="18" y="38" width="90" height="40" rx="7" fill="#ffffff" stroke="#dbe7ef"/>
<text x="63" y="56" font-size="8.6" text-anchor="middle" fill="#3a3a35">有法可依</text>
<text x="63" y="70" font-size="7.8" text-anchor="middle" fill="#6b7280">只是起点</text>
<path d="M 112 58 L 130 58" stroke="#c9d6df" stroke-width="2"/>
<path d="M 130 54 L 136 58 L 130 62 Z" fill="#c9d6df"/>
<rect x="138" y="38" width="84" height="40" rx="7" fill="#eef8f2" stroke="#b8e6d0"/>
<text x="180" y="56" font-size="8.6" text-anchor="middle" fill="#1e6640">良法</text>
<text x="180" y="70" font-size="7.6" text-anchor="middle" fill="#1e6640">合理 + 完备</text>
<text x="120" y="104" font-size="8.2" text-anchor="middle" fill="#6b7280">良法是善治的前提</text>
</svg>
</div>

<div class="qac">
<p class="q">「宪法法律至上，是不是宪法最大、法律就不重要了？」</p>
<p class="a">不是。宪法是根本法、有最高法律效力，法律依据宪法制定，两者是<b>上位与下位</b>的关系，不是谁能替代谁。「宪法法律至上」是一个整体词组：宪法和法律在国家各种规范中地位最高，一切组织和个人都不得有超越宪法法律的特权。宪法不直接规定罚多少钱、判几年，那些由法律去细化。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="宪法在上、法律在下，法律依据宪法制定">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="26" font-size="9.2" text-anchor="middle" fill="#151a21">上位与下位，不是替代</text>
<rect x="20" y="36" width="200" height="26" rx="6" fill="#eef8f2" stroke="#b8e6d0"/>
<text x="32" y="53" font-size="8.4" fill="#1e6640">宪法 · 根本法，最高法律效力</text>
<line x1="40" y1="64" x2="40" y2="70" stroke="#c9d6df" stroke-width="2"/>
<path d="M 36 69 L 40 76 L 44 69 Z" fill="#c9d6df"/>
<rect x="20" y="78" width="200" height="26" rx="6" fill="#ffffff" stroke="#dbe7ef"/>
<text x="32" y="95" font-size="8.4" fill="#3a3a35">法律 · 依据宪法制定，不得抵触</text>
<text x="120" y="118" font-size="8.2" text-anchor="middle" fill="#6b7280">一切组织和个人都不得有超越宪法法律的特权</text>
</svg>
</div>

<div class="qac">
<p class="q">「政府公布权力清单，是不是给自己添麻烦、捆住手脚？」</p>
<p class="a">不是。清单把「能干什么、按什么程序干」写在明面上，是<b>规范国家权力运行</b>、把权力关进制度的笼子。对政府是「法定职责必须为、法无授权不可为」，对群众是「办事知道找谁、多久办完」。捆住的是乱作为、慢作为的手；依法该办的事，一件也不能少。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="权力清单对政府是法无授权不可为，对群众是办事有依据">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="26" font-size="9.2" text-anchor="middle" fill="#151a21">一张清单，两个方向</text>
<rect x="16" y="38" width="98" height="58" rx="7" fill="#ffffff" stroke="#f3c9cf"/>
<text x="65" y="56" font-size="8.4" text-anchor="middle" fill="#9f1239">对政府</text>
<text x="65" y="72" font-size="7.6" text-anchor="middle" fill="#3a3a35">法无授权不可为</text>
<text x="65" y="86" font-size="7.6" text-anchor="middle" fill="#3a3a35">法定职责必须为</text>
<rect x="126" y="38" width="98" height="58" rx="7" fill="#ffffff" stroke="#b8e6d0"/>
<text x="175" y="56" font-size="8.4" text-anchor="middle" fill="#1e6640">对公民</text>
<text x="175" y="72" font-size="7.6" text-anchor="middle" fill="#3a3a35">知道找谁办</text>
<text x="175" y="86" font-size="7.6" text-anchor="middle" fill="#3a3a35">知道多久办完</text>
<text x="120" y="114" font-size="8.2" text-anchor="middle" fill="#6b7280">捆住乱作为的手，不是捆住干事的手</text>
</svg>
</div>

<div class="qac">
<p class="q">「强调保障公民权利，是不是公民就可以不履行义务了？」</p>
<p class="a">不是。公民的权利和义务是<b>统一的</b>：权利受保障，义务也要履行；行使权利不得损害国家、社会、集体的利益和其他公民的合法权利。法治国家保障的是合法权利，不是「想干什么就干什么」。材料里出现「依法维权」，往往同时要写「依法履行义务」。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="公民的权利和义务是统一的">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="26" font-size="9.2" text-anchor="middle" fill="#151a21">权利与义务，一体两面</text>
<rect x="14" y="38" width="94" height="56" rx="7" fill="#ffffff" stroke="#b8e6d0"/>
<text x="61" y="57" font-size="8.4" text-anchor="middle" fill="#1e6640">权利</text>
<text x="61" y="73" font-size="7.6" text-anchor="middle" fill="#3a3a35">受保障、有救济</text>
<text x="61" y="87" font-size="7.6" text-anchor="middle" fill="#3a3a35">不得损害他人</text>
<text x="120" y="70" font-size="12" text-anchor="middle" fill="#6b7280">⇄</text>
<rect x="132" y="38" width="94" height="56" rx="7" fill="#ffffff" stroke="#dbe7ef"/>
<text x="179" y="57" font-size="8.4" text-anchor="middle" fill="#151a21">义务</text>
<text x="179" y="73" font-size="7.6" text-anchor="middle" fill="#3a3a35">必须履行</text>
<text x="179" y="87" font-size="7.6" text-anchor="middle" fill="#3a3a35">不能放弃</text>
<text x="120" y="112" font-size="8.2" text-anchor="middle" fill="#6b7280">保障的是合法权利，不是任性</text>
</svg>
</div>

</div>
<p class="gx-note">六问其实是同一件事：都在问「法治国家管的是谁、靠什么管、为了谁」。管的是国家权力，靠的是宪法法律至上和良法，为的是公民权利。答题时按这三句排：先定对象，再定依据，最后定目的，一段话就立起来了。课文里那句「法治国家是法治建设的目标」，就是把这三层收在一个词上——目标，不是手段。</p>
</section>

<div class="er">
<p class="er-x">✗ 我国的法律已经很多了，所以已经是法治国家。</p>

<p class="er-w">错在哪：把「有法」当成「良法」，用数量代替质量，选择题常拿这句做干扰项。</p>
