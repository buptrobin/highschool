<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 它与前面那些理论是什么关系<span class="q-src">人教版（2019）必修1 中国特色社会主义 · 第四课第三框</span></p>
<p class="q-b">习近平新时代中国特色社会主义思想，是对马克思列宁主义、毛泽东思想、邓小平理论、「三个代表」重要思想、科学发展观的继承和发展。</p>
<p class="q-n">→ 翻成人话：这句是两个条件并排的——①「<b>继承</b>」：上面点的五个名字一个也不能断，说明它是同一条理论谱系的接续，不是凭空长出来的；②「<b>发展</b>」：它在继承的基础上往前推了一步，所以它是马克思主义中国化最新成果。只写「发展」不写「继承」，就是把它说成了「又一个理论」，这一半分就没了。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 它是什么身份<span class="q-src">人教版（2019）必修1 中国特色社会主义 · 第四课第三框</span></p>
<p class="q-b">它是当代中国马克思主义、二十一世纪马克思主义，是中华文化和中国精神的时代精华。</p>
<p class="q-n">→ 翻成人话：这句是三个定语，少一个都不完整——①「当代中国马克思主义」讲它解决的是中国当下的事；②「二十一世纪马克思主义」讲它站在世纪尺度上回答了时代课题；③「中华文化和中国精神的时代精华」讲它接的是中国文化这条根。所以<b>定位要写全：当代中国马克思主义、二十一世纪马克思主义</b>，只写前半句是典型漏点。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 核心内容怎么概括<span class="q-src">人教版（2019）必修1 中国特色社会主义 · 第四课第三框</span></p>
<p class="q-b">其核心内容可以概括为「十个明确」「十四个坚持」「十三个方面成就」。</p>
<p class="q-n">→ 翻成人话：注意「概括为」三个字——这三块是同一套理论的三个面，不是三套并列的理论。三个板块定位不同：十个明确是核心内容、十四个坚持是基本方略、十三个方面成就是实践成果。考题最爱在这里设套：把「基本方略」说成「核心内容」，或者把「成就」说成「理论」。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>十个明确</th><th>十四个坚持</th><th>十三个方面成就</th></tr></thead>
<tbody>
<tr><td>教材给的定位</td><td>核心内容</td><td>基本方略</td><td>实践成果</td></tr>
<tr class="key"><td>它站在哪一层</td><td>理论层面：讲「是什么」</td><td>实践层面：讲「怎么做」</td><td>成就层面：讲「做成了什么」</td></tr>
<tr><td>一句话内容</td><td>坚持和发展什么样的中国特色社会主义</td><td>怎样坚持和发展中国特色社会主义</td><td>新时代取得的历史性成就、发生的历史性变革</td></tr>
<tr><td>能不能叫「理论」</td><td>能，它就是理论本身</td><td>不能，它是行动纲领、基本方略</td><td>不能，它是做出来的结果</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">背法：先记「层面」，再记「名字」。顺序永远是<b>理论 → 实践 → 成就</b>，一层比一层落地。答题写到「核心内容」时，后面必须跟「十个明确」；写到「基本方略」时，后面必须跟「十四个坚持」——配对错了，术语就白写了。</p>
</section>

<li class="step">

<p class="s-k">用到：「当代中国马克思主义」「二十一世纪马克思主义」这两个定语要拆开答。</p>

<p class="s-h">第 2 步 · 答「当代中国」这一半</p>
<p class="s-b">它坚持马克思主义基本原理，又回答了新时代坚持和发展什么样的中国特色社会主义、怎样坚持和发展中国特色社会主义等重大时代课题。前半句是「守正」，后半句是「回答中国当下的问题」——所以它是<b>当代中国</b>马克思主义。<b>它是马克思主义中国化最新成果</b>，这句话可以直接放在这一层的开头。</p>
<p class="s-k">用到：马克思主义基本原理 + 重大时代课题 + 马克思主义中国化最新成果。</p>

<li class="step" hidden>

<p class="s-b">它提出一系列原创性贡献，开辟了马克思主义新境界。注意「新境界」这三个字：讲的是它在马克思主义发展史上的位置，是世纪尺度上的推进，所以是<b>二十一世纪</b>马克思主义。这一步只写「它是马克思主义」是不够的，必须落到「原创性贡献」和「新境界」上。</p>
