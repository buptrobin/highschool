<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">三段话管全框：三种执政方式是什么、依法执政为什么是基本方式、全面从严治党管什么。先照抄，再拆关键词。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 三种执政方式的分工<span class="q-src">人教版（2019）必修3 政治与法治 · 第三课第二框</span></p>
<p class="q-b">科学执政，就是遵循共产党执政规律、社会主义建设规律、人类社会发展规律，以科学的思想、制度和方法领导中国特色社会主义事业。民主执政，就是坚持为人民执政、靠人民执政，支持和保证人民当家作主。依法执政，就是坚持依法治国，领导立法、保证执法、支持司法、带头守法。</p>
<p class="q-n">→ 翻成人话：三句话各回答一个问题，别混着背。科学执政回答「<b>凭什么判断</b>」——凭三大规律，不是凭经验、凭感觉、凭热情。民主执政回答「<b>为谁、靠谁</b>」——为了人民，也依靠人民，落脚点是支持和保证人民当家作主，注意主语是人民，不是「党替人民做主」。依法执政回答「<b>按什么办</b>」——按宪法法律办，四个动作连成一串：领导立法、保证执法、支持司法、带头守法。答题时先写方式名，再补这一句里的关键词，只写「党很科学」不给分。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 依法执政是基本方式<span class="q-src">人教版（2019）必修3 政治与法治 · 第三课第二框</span></p>
<p class="q-b">依法执政是中国共产党执政的基本方式。科学执政、民主执政、依法执政是有机统一的，科学执政是基本前提，民主执政是本质所在，依法执政是基本方式。</p>
<p class="q-n">→ 翻成人话：这三者不是三道并列的选择题，而是一套配合。没有科学判断，民主容易跟着情绪走；没有民主，科学容易变成少数人拍板；没有法治，前两条都落不了地。所以课本单独给「依法执政」挂了一块牌子——<b>基本方式</b>。考试最爱的坑就在这里：把「基本方式」安到科学执政或民主执政头上，或者把「本质所在」安给依法执政，一律算错。记法是一句话：「判得准、站得稳、行得通」，行得通的那个才是基本方式。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 全面从严治党与自我革命<span class="q-src">人教版（2019）必修3 政治与法治 · 第三课第二框</span></p>
<p class="q-b">勇于自我革命是中国共产党区别于其他政党的显著标志。全面从严治党，核心是加强党的领导，基础在全面，关键在严，要害在治。</p>
<p class="q-n">→ 翻成人话：四个词要掰开记。<b>核心</b>是加强党的领导——注意方向，是「加强」，不是「约束」，更不是「削弱」；<b>基础</b>在全面——不只抓几个干部，而是覆盖党的各项建设，没有例外、没有死角；<b>关键</b>在严——标准严、执纪严，不能高举轻放；<b>要害</b>在治——真管真治，不能只挂标语、只开会议。再加一句「自我革命」：刀刃向内，自己给自己动手术。答题时这两块要分成两点写：一块讲「怎么执政」，一块讲「怎么管党」，混成一段就是要点不清。</p>
</div>

<p class="gx-note">整张表只高亮最后一行，因为考试最爱考的就是这组「头衔对应」：科学执政是<b>基本前提</b>、民主执政是<b>本质所在</b>、依法执政是<b>基本方式</b>。三个词一互换，就是一道选择题。背的时候横着背，一行说清一种方式；判题的时候竖着看，材料里出现听证会，就往「民主」那一列找，出现专家论证，就往「科学」那一列找。答题时先亮头衔、再解释做法，判卷老师找的就是这层对应关系。</p>

<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，在草稿纸上写下四个词，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 措施类材料题<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">材料：某市在编制新一轮城市总体规划时，先请高校和研究院所做产业测算与风险评估，又通过政务平台、居民座谈会收集了一万多条意见；市委把拟出台的文件送到法制部门做合法性审查，要求各级党组织在宪法法律范围内活动；同时对 3 起违规接受宴请的问题公开通报，并修订了本市的公务接待细则，还把这些做法写进了年度党建考核清单。结合材料，运用「巩固党的执政地位」的知识，说明新时代应如何巩固党的执政地位。（12 分）</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性</p>
<p class="s-b">设问是「如何」，题型是措施类，不是原因类、也不是意义类。知识范围锁死在「巩固党的执政地位」这一框，别往上扯「党的领导是中国特色社会主义最本质的特征」，那是上一框的内容。</p>
<p class="s-k">用到：措施类设问，答「做法 + 术语 + 回扣材料」</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 找主体</p>
<p class="s-b">材料里四拨人：市委（党组织）、专家和居民（人民）、法制部门（法定程序那一环）、被通报的干部（党内）。主体先分清，后面才不会把党的做法写成政府的做法。</p>
<p class="s-k">用到：中国共产党、人民、政府、党员干部</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 找行为</p>
<p class="s-b">测算和风险评估 → 讲依据；收集一万多条意见、开座谈会 → 讲参与；合法性审查、在宪法法律范围内活动 → 讲程序；通报、修订细则 → 讲自查。四个行为，四句话，正好四个采分点。</p>
<p class="s-k">用到：论证、征求意见、合法性审查、通报整改</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 对应原理</p>
<p class="s-b">论证对应科学执政（遵循三大规律）；征求意见对应民主执政（为人民、靠人民）；合法性审查和带头守法对应依法执政（基本方式）；通报与立规矩对应全面从严治党（核心是加强党的领导）。一对一对上，不要交叉。</p>
<p class="s-k">用到：科学执政、民主执政、依法执政、全面从严治党</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口</p>
<p class="s-b">四点分条写，每条第一句先给术语，第二句再引材料。最后补一句目的：改进领导方式和执政方式，提高执政能力，巩固党的执政地位。别停在「所以我们要听党话」。评分看的是术语，不是口号。</p>
<p class="s-k">用到：巩固党的执政地位、实现党的执政使命</p>
</li>
</ol>

<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">① 坚持科学执政。遵循共产党执政规律、社会主义建设规律、人类社会发展规律，以科学的思想、制度和方法领导事业。该市在规划编制前做产业测算和风险评估，用数据和论证代替拍脑袋。<br>② 坚持民主执政。坚持为人民执政、靠人民执政，支持和保证人民当家作主。该市通过政务平台和居民座谈会收集一万多条意见，把群众的诉求写进方案。<br>③ 坚持依法执政。依法执政是党执政的基本方式，要领导立法、保证执法、支持司法、带头守法。市委把文件送法制部门做合法性审查，要求党组织在宪法法律范围内活动。<br>④ 坚持全面从严治党。核心是加强党的领导，基础在全面，关键在严，要害在治。该市通报违规接受宴请的问题、修订公务接待细则，以严的标准管党治党。<br>结论：改进党的领导方式和执政方式，提高党的执政能力，才能巩固党的执政地位、实现党的执政使命。</p>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。每问先自己答一句，再看下面那句。</p>
<div class="gx-qa">

<div class="qac">
<p class="q">「科学执政和民主执政，听起来都挺对，到底怎么分？」</p>
<p class="a">看它听谁的。科学执政听<b>规律和论证</b>的，讲的是判断准不准；民主执政听<b>人民</b>的，讲的是为谁、靠谁。材料里有专家、数据、试点，往科学上落；有征求意见、听证会、协商，往民主上落。笨办法是先划出「谁在拍板、听了谁的话」，两问就有答案。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="科学执政看规律，民主执政看人民">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="28" font-size="9.2" text-anchor="middle" fill="#151a21">一个看规律，一个看人民</text>
<rect x="18" y="40" width="96" height="52" rx="7" fill="#ffffff" stroke="#b8e6d0"/>
<text x="66" y="60" font-size="9" font-weight="700" text-anchor="middle" fill="#1e6640">科学执政</text>
<text x="66" y="78" font-size="8.4" text-anchor="middle" fill="#3a3a35">遵循三大规律</text>
<rect x="126" y="40" width="96" height="52" rx="7" fill="#ffffff" stroke="#e7d3b8"/>
<text x="174" y="60" font-size="9" font-weight="700" text-anchor="middle" fill="#8a5c14">民主执政</text>
<text x="174" y="78" font-size="8.4" text-anchor="middle" fill="#3a3a35">为了人民、依靠人民</text>
<text x="120" y="112" font-size="8.6" text-anchor="middle" fill="#6b7280">同一目的，两个侧面</text>
</svg>
</div>

<div class="qac">
<p class="q">「依法执政和依法行政，只差一个字，能混着写吗？」</p>
<p class="a">不能混。<b>依法执政的主体是中国共产党</b>，讲的是党依据宪法法律治国理政；<b>依法行政的主体是政府</b>，讲的是行政机关依法办事。材料里的主体是市委还是市政府，直接决定你写哪个词。「依法执政」是党的事，「依法行政」是政府的事，两个词别叠成一个用。</p>

<rect x="18" y="38" width="204" height="30" rx="7" fill="#ffffff" stroke="#f3c9cf"/>
<text x="30" y="57" font-size="8.6" fill="#9f1239">依法执政：主体是中国共产党</text>
<rect x="18" y="74" width="204" height="30" rx="7" fill="#ffffff" stroke="#e7d3b8"/>
<text x="30" y="93" font-size="8.6" fill="#8a5c14">依法行政：主体是政府</text>
<text x="120" y="118" font-size="8.4" text-anchor="middle" fill="#6b7280">依据也不同：宪法法律 / 行政法规</text>
</svg>
</div>

<div class="qac">
<p class="q">「全面从严治党，核心是不是要约束党的领导？」</p>
<p class="a">方向反了。课本写的是<b>核心是加强党的领导</b>。从严治党治的是党自身的问题，目的是让党更有力量，不是给党的领导设限。答成「约束」「限制」，这一分直接没有。这一问年年有人错，错法几乎一模一样：把「管好党」读成了「管住党」。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="全面从严治党的核心是加强党的领导">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="28" font-size="9.2" text-anchor="middle" fill="#151a21">核心的方向：加强</text>
<text x="22" y="58" font-size="9" font-weight="700" fill="#1e6640">✓ 加强党的领导</text>
<text x="22" y="80" font-size="9" font-weight="700" fill="#8f3226">✗ 约束党的领导</text>
<line x1="20" y1="92" x2="220" y2="92" stroke="#dde4ea" stroke-width="1"/>
<text x="22" y="112" font-size="8.6" fill="#3a3a35">答题写「加强」，方向不能反</text>
</svg>
</div>

<div class="qac">
<p class="q">「三种执政方式，只做好一种行不行？」</p>
<p class="a">不行。三者是<b>有机统一的</b>：科学执政是基本前提，民主执政是本质所在，依法执政是基本方式。缺一条，另外两条也会变味——没有法治，好判断落不了地；没有民主，判断再准也没人认。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="三种执政方式缺一不可">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="28" font-size="9.2" text-anchor="middle" fill="#151a21">三条腿，缺一条就站不住</text>
<rect x="22" y="44" width="60" height="40" rx="7" fill="#ffffff" stroke="#b8e6d0"/>
<text x="52" y="68" font-size="8.6" text-anchor="middle" fill="#1e6640">科学执政</text>
<rect x="90" y="44" width="60" height="40" rx="7" fill="#ffffff" stroke="#e7d3b8"/>
<text x="120" y="68" font-size="8.6" text-anchor="middle" fill="#8a5c14">民主执政</text>
<rect x="158" y="44" width="60" height="40" rx="7" fill="#ffffff" stroke="#f3c9cf"/>
<text x="188" y="68" font-size="8.6" text-anchor="middle" fill="#9f1239">依法执政</text>
<text x="120" y="104" font-size="8.6" text-anchor="middle" fill="#3a3a35">合起来才叫一套</text>
<text x="120" y="120" font-size="8.4" text-anchor="middle" fill="#6b7280">前提 · 本质 · 基本方式</text>
</svg>
</div>

<div class="qac">
<p class="q">「自我革命和人民监督，是一回事吗？」</p>
<p class="a">不是。人民监督是<b>第一个答案</b>，靠的是外部力量，让人民盯着政府；自我革命是<b>第二个答案</b>，靠的是党自己，刀刃向内。两者方向相反，考试问「为什么能跳出历史周期率」，两个都要提到。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="人民监督与自我革命方向不同">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="28" font-size="9.2" text-anchor="middle" fill="#151a21">两个答案，方向不同</text>
<text x="22" y="50" font-size="8.8" font-weight="700" fill="#8a5c14">人民监督 → 从外部管</text>
<text x="22" y="68" font-size="8.4" fill="#3a3a35">来自人民，政府不敢松懈</text>
<line x1="20" y1="80" x2="220" y2="80" stroke="#dde4ea" stroke-width="1"/>
<text x="22" y="100" font-size="8.8" font-weight="700" fill="#1e6640">自我革命 → 从内部改</text>
<text x="22" y="118" font-size="8.4" fill="#3a3a35">刀刃向内，自己纠错</text>

</div>

<div class="qac">
<p class="q">「巩固党的执政地位，靠执政方式还是靠管党治党？」</p>
<p class="a">两条都要。一条是<b>改进执政方式</b>——科学、民主、依法，把事办对；一条是<b>全面从严治党</b>——把自己管好，让党靠得住。材料题只答一条，最多拿一半分。答题时两类都写，再用一句目的收尾，结构才完整。</p>

<rect x="18" y="38" width="204" height="28" rx="7" fill="#ffffff" stroke="#b8e6d0"/>

</div>
<p class="gx-note">六问其实是同一件事：都在问「这件事属于哪一块」。主体是党还是政府，动作是听规律、听人民、走程序还是自查，答案就出来了。把这一层练熟，选择题能排掉干扰项，材料题能把四点写全。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。先盖住后两行，自己改一遍，再对答案。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 依法执政就是依法行政，都是按法律办事。</p>
<p class="er-v">✓ 依法执政的主体是中国共产党，坚持依法治国、领导立法、保证执法、支持司法、带头守法；依法行政的主体是政府。</p>
<p class="er-w">错在哪：主体混了。谁在依法，决定了写哪个术语，也决定了知识范围。</p>
</div>
<div class="er">
<p class="er-x">✗ 全面从严治党，核心是约束和限制党的领导。</p>
<p class="er-v">✓ 全面从严治党，核心是加强党的领导，基础在全面，关键在严，要害在治。</p>
<p class="er-w">错在哪：方向写反了。治党是为了让党更有力量，不是给党的领导设限；管得越严，领导越有力，这两件事方向一致。</p>
</div>
<div class="er">
<p class="er-x">✗ 三种执政方式选一种做好就行，重点是依法执政。</p>
<p class="er-v">✓ 科学执政、民主执政、依法执政是有机统一的，科学执政是基本前提，民主执政是本质所在，依法执政是基本方式。</p>
<p class="er-w">错在哪：把「有机统一」当成「三选一」。强调依法执政是基本方式，不等于另外两条可以不写。</p>
</div>
<div class="er">
<p class="er-x">✗ 民主执政，就是党替人民做主、替人民决定。</p>
<p class="er-v">✓ 民主执政，就是坚持为人民执政、靠人民执政，支持和保证人民当家作主。</p>
<p class="er-w">错在哪：主语被换了。当家作主的是人民，党是支持和保证的那一方。</p>
</div>
<div class="er">
<p class="er-x">✗ 依法执政是党执政的基本前提。</p>
<p class="er-v">✓ 依法执政是党执政的基本方式；科学执政是基本前提，民主执政是本质所在。</p>
<p class="er-w">错在哪：头衔张冠李戴。三个「基本／本质」是固定搭配，互换就是错项。</p>
</div>
<div class="er">
<p class="er-x">✗ 自我革命，就是接受人民群众的监督。</p>
<p class="er-v">✓ 自我革命是刀刃向内、自己纠正问题，勇于自我革命是党区别于其他政党的显著标志；人民监督是跳出历史周期率的第一个答案。</p>
<p class="er-w">错在哪：内外不分。人民监督在外部，自我革命在内部，两者不能互相替代。</p>
</div>
<div class="er">
<p class="er-x">✗ 只要经济发展上去了，党的执政地位自然就巩固了。</p>
<p class="er-v">✓ 巩固党的执政地位，要靠坚持科学执政、民主执政、依法执政，改进领导方式和执政方式，还要坚持全面从严治党、勇于自我革命。</p>
<p class="er-w">错在哪：把执政地位当成经济成绩的附属品。材料题问「如何巩固」，只能答做法，不能答成绩。</p>
</div>
