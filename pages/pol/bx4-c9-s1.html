<p class="gx-claim">这一框只回答一个问题：<b>中华文化靠什么复兴</b>。答案是<b>马克思主义传入中国</b>这个转折点，加上<b>中国共产党领导人民</b>创造的革命文化和社会主义先进文化；不是回到古代，也不是照搬西方。</p>
<div class="gx-meta">
<span><i></i>人教版（2019）必修4 哲学与文化 · 第九课第一框</span>
<span><i></i>高一 · 第九课 发展中国特色社会主义文化</span>
<span><i></i>阅读 15 分钟</span>
<span><i></i>含 1 个情境判断器</span>
</div>
<p class="gx-lede">学校文化节，班里排一个节目，主题是「中华文化怎么走到今天」。有人提议穿汉服、读《论语》，说这叫复兴；有人提议全按国外的舞台剧来，说这才现代。两种方案都只对了一半。这一框讲的就是：近代以来中国人试过哪些路，为什么只有一条走通了。它在第九课的开头，是后面「基本路径」「文化强国」两框的地基；最容易错的一件事，是把「复兴」当成「复古」。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">这一框的答案压在三句话上：近代试过哪两条错路、转折点在哪里、今天的文化由哪几块拼起来。先照抄，再拆关键词，最后看哪个词最容易写串。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 近代以来的文化探索<span class="q-src">人教版（2019）必修4 哲学与文化 · 第九课第一框</span></p>
<p class="q-b">近代以来，中国逐渐沦为半殖民地半封建社会，中华文化也经历了衰微。为了民族复兴，无数仁人志士进行了各种各样的探索和尝试。「文化复古论」主张恢复儒家思想的正统地位，回到古代去寻找出路；「全盘西化论」主张照搬西方资本主义文化，用别人的文化取代自己的文化。这两种主张都是错误的，都脱离了中国实际，都没有解决中国的问题。</p>
<p class="q-n">→ 翻成人话：这段话由<b>三个判断</b>组成。第一，中华文化确实衰微过，起点要承认，别一开口就说「一直很辉煌」。第二，两条路各有各的想法：复古论往回头看，全盘西化论往外面看。第三，两条路错在同一个地方——<b>都脱离中国实际</b>。答题时这句最关键：错不在「爱国」或「开放」，错在不符合中国的实际。只写「复古论错、西化论错」，不写为什么错，分数只拿一半。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 马克思主义传入中国<span class="q-src">人教版（2019）必修4 哲学与文化 · 第九课第一框</span></p>
<p class="q-b">1917年，十月革命一声炮响，给中国送来了马克思列宁主义。马克思主义传入中国，是中华文化由衰微走向重振的重要转折点。中国共产党把马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合，不断推进马克思主义中国化时代化，创造了革命文化和社会主义先进文化。</p>
<p class="q-n">→ 翻成人话：这段话要抓住一个词——<b>转折点</b>。不是「多了一种学说」，而是「从这里开始往回走」。转折点后面跟的是主体：<b>中国共产党</b>，不是别人。再往后是两个「结合」：一个结合中国的实际，一个结合中华优秀传统文化。<b>第二个结合最容易被漏掉</b>。马克思主义不是搬进来就用，它要和中国的实际、和中国的老传统对上话，才长出革命文化和社会主义先进文化。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 中国特色社会主义文化<span class="q-src">人教版（2019）必修4 哲学与文化 · 第九课第一框</span></p>
<p class="q-b">中国特色社会主义文化，源自于中华民族五千多年文明历史所孕育的中华优秀传统文化，熔铸于党领导人民在革命、建设、改革中创造的革命文化和社会主义先进文化，植根于中国特色社会主义伟大实践。发展中国特色社会主义文化，就是以马克思主义为指导，坚守中华文化立场，立足当代中国现实，结合当今时代条件，发展面向现代化、面向世界、面向未来的，民族的科学的大众的社会主义文化。</p>
<p class="q-n">→ 翻成人话：第一句是<b>三个来源 + 一个根</b>，动词别记混：传统文化用「源自于」，革命文化和社会主义先进文化用「熔铸于」，伟大实践用「植根于」。第二句是<b>一条路</b>，共四组条件：以马克思主义为指导（谁领着）、坚守中华文化立场（站哪）、立足当代中国现实、结合当今时代条件（从哪出发）。最后是三个「面向」加三个定语：面向现代化、面向世界、面向未来；民族的、科学的、大众的。这几组词考试就照抄，别自己换词。</p>
</div>

<p class="gx-note">整张表只高亮一行：<b>一句话总口径</b>。前五行是「比什么」，分别回答为什么错、转折点在哪、谁在领导、资源有几块、路怎么走；最后一行是把五句压成一句，材料题结尾用它收口。背的时候抓四个短语：<b>为指导、站立场、立足现实、结合时代</b>。这四个短语的顺序也别乱，第一个讲指导思想，后面三个讲从哪儿出发。</p>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。五步只做五件事，不跳步。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 原因类材料题<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">近代以来，从「师夷长技」到「维新变法」，从「文化复古」到「全盘西化」，中国人试了很多条路，都没能改变中华民族的前途和命运。十月革命后，马克思主义传入中国，中华文化由衰微走向重振。今天，我们的图书馆免费开放，国产电影走进海外院线，村晚、非遗工坊在乡镇办得红火。结合材料，运用「文化发展的必然选择」的知识，说明为什么必须发展中国特色社会主义文化。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性</p>
<p class="s-b">设问是「为什么必须」，属于原因类，要答「必然性 + 意义」，不是答「怎么做」。知识范围锁在第九课第一框：近代探索、马克思主义传入、两种文化、三个来源。答题格式先定下来：分点，每点「课本原理 + 一句材料」。</p>
<p class="s-k">用到：原因类设问 = 必要性 + 意义；范围 = 第九课第一框</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 找主体与线索</p>
<p class="s-b">材料给了三段线索：第一段是「试了很多条路都没走通」，讲历史；第二段是「马克思主义传入、由衰微走向重振」，讲理论；第三段是「图书馆、电影、村晚」，讲今天的实践。三条线索正好对应三个采分角度：历史必然、理论指导、实践需要。主体有两个：中国共产党、今天的人民。</p>
<p class="s-k">用到：历史线索 → 理论线索 → 实践线索</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 把历史讲成「必然」</p>
<p class="s-b">文化复古论主张恢复儒家思想的正统地位，全盘西化论主张照搬西方资本主义文化。两种主张方向相反，错误相同：都脱离中国实际，都没能解决中国的问题。所以走老路不行，答案只能在新方向里找——这就叫「必然」，不是「恰好选中」。</p>
<p class="s-k">用到：两种主张都脱离中国实际、都没解决中国的问题</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 讲清理论指导</p>
<p class="s-b">马克思主义传入中国，是中华文化由衰微走向重振的重要转折点。中国共产党把马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合，创造了革命文化和社会主义先进文化。这一步要写全两个「结合」，只写第一个，答不出「中国化」。</p>
<p class="s-k">用到：转折点 + 两个结合 + 革命文化和社会主义先进文化</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口与自查</p>
<p class="s-b">最后落到三个来源和一条路：中国特色社会主义文化源自于中华优秀传统文化，熔铸于革命文化和社会主义先进文化，植根于伟大实践。所以要发展面向现代化、面向世界、面向未来的，民族的科学的大众的社会主义文化。写完查三处：有没有只写一个来源、有没有把复兴写成复古、有没有只喊口号不挂材料。</p>
<p class="s-k">用到：三个来源 + 一条道路 + 三句自查</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">① 近代以来的探索证明，文化复古论和全盘西化论都脱离中国实际，都没有解决中国的问题。走老路、走别人的路都走不通，中华文化必须找到新的方向，这是历史的选择。材料中「试了很多条路，都没能改变中华民族的前途和命运」正说明这一点。<br>② 马克思主义传入中国，是中华文化由衰微走向重振的重要转折点，为中国文化发展提供了科学理论指导。中国共产党把马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合，不断推进马克思主义中国化时代化。<br>③ 中国共产党领导人民在革命、建设、改革中创造了革命文化和社会主义先进文化，为中国特色社会主义文化提供了实践基础和内容资源。革命文化形成于革命战争年代，社会主义先进文化形成于建设、改革时期，两者是接力关系。<br>④ 中国特色社会主义文化源自于中华民族五千多年文明历史所孕育的中华优秀传统文化，熔铸于革命文化和社会主义先进文化，植根于中国特色社会主义伟大实践。三个来源缺一不可，只讲传统文化是不完整的。<br>⑤ 发展中国特色社会主义文化，就是以马克思主义为指导，坚守中华文化立场，立足当代中国现实，结合当今时代条件，发展面向现代化、面向世界、面向未来的，民族的科学的大众的社会主义文化。材料中图书馆免费开放、国产电影走出去、村晚红火，正是这一文化在今天的生动体现。<br>⑥ 结论：发展中国特色社会主义文化，是历史的选择、实践的选择，也是人民的选择；只有走这条路，才能实现中华文化复兴，坚定文化自信。</p>

<p class="gx-note">六问其实是同一件事：<b>中华文化靠什么复兴</b>。第一问排掉「往回走」，第二问排掉「只搬不化」，第三问补齐「三块料」，第四问理清「两段接力」，第五问给出「必然」的两条腿，第六问守住「立场和眼界」。排错、补料、接力、证必然、定立场——五步走顺，材料题的采分点自己就排好队了。顺序也别乱：先排除错路，再谈来源，最后才谈怎么发展；一上来就写「要发展面向未来的文化」，没有前面的排除和来源，阅卷老师看不到你的推理。</p>
