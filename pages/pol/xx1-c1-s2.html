<p class="gx-claim">一句话说清本节最该记住的判断：<b>地方权力从哪来</b> + <b>地方是不是主权单位</b>，不是「背两种制度的名字」，而是「用这两问去切材料」。</p>
<div class="gx-meta">
<span><i></i>人教版（2019）选择性必修1 当代国际政治与经济 · 第一课第二框</span>
<span><i></i>高二 · 第一课 国体与政体 · 国家的结构形式</span>
<span><i></i>阅读 15 分钟</span>
<span><i></i>含 1 个情境判断器</span>
</div>
<p class="gx-lede">刷新闻时你大概见过这三种说法：美国某个州自己通过了一部法律；香港特别行政区自己审理案件；中央财政给西部某个省拨了一笔转移支付。三件事都发生在「中央和地方之间」，可性质完全不是一回事。</p>
<p class="gx-lede">这一框在第一课的第二框，讲的是国家结构形式。它和国体、政体是三件不同的事，考卷上却常常被揉进同一道题里。</p>
<p class="gx-lede">最容易错的地方：把「地方有权力」当成「地方是主权单位」。有没有权力，看权限从哪来；是不是主权单位，看它能不能自己代表国家。这两问一分开，一半的错误选项自己就塌了。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写课本这句，不写你脑子里那句。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 国家结构形式是什么<span class="q-src">人教版（2019）选择性必修1 · 第一课第二框</span></p>
<p class="q-b">国家结构形式，是指国家的整体与部分、中央与地方之间的相互关系。国家的结构形式主要有单一制和复合制两种。</p>
<p class="q-n">→ 翻成人话：这一句给了你三个条件，缺一个就会套错。① 它说的是「整体与部分、中央与地方」，不是谁掌握政权（那是国体），也不是国家权力怎么组织（那是政体）；② 基本类型只有单一制和复合制两种；③ 复合制里最常见的是联邦制，而「邦联」不是国家结构形式的一种，它是主权国家之间的联盟。答题前先问自己一句：材料讲的是不是中央和地方的关系？</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 单一制国家长什么样<span class="q-src">人教版（2019）选择性必修1 · 第一课第二框</span></p>
<p class="q-b">单一制国家，是由若干普通行政单位或自治单位组成的单一主权国家。全国只有一个中央政权、一部宪法、一种法律体系。</p>
<p class="q-n">→ 翻成人话：单一制有三个硬指标——一个中央、一部宪法、一种法律体系。注意「一个中央」不等于「中央把每件事都自己干」。地方可以有权限，可以立法，可以有自己的财政，但那些权限是中央通过宪法和法律授予的，不是地方自带的。这一点正是材料题最爱设伏的地方：材料里地方权力越大，越要看它的权力是谁给的。顺带记住一句：单一制不等于集权制，也不等于中央包办一切。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 我国是单一制国家<span class="q-src">人教版（2019）选择性必修1 · 第一课第二框</span></p>
<p class="q-b">我国是单一制国家。中央与地方的关系，是中央统一领导、地方分级管理的关系。地方必须服从中央，同时中央要照顾地方利益，发挥地方的积极性。</p>
<p class="q-n">→ 翻成人话：这句话是「两条腿」走路。一条叫中央统一领导，讲的是方向，不能松；一条叫地方分级管理、发挥积极性，讲的是干活，不能省。只写前一条，答案就变成「中央包办一切」；只写后一条，答案又成了「地方自治」。两条都写、再点出「权限由宪法和法律授予」，才是课本口径。这一句里的「照顾地方利益、发挥积极性」也是采分点，别漏。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>单一制</th><th>联邦制（复合制）</th></tr></thead>
<tbody>
<tr><td>主权归属</td><td>主权由中央统一行使，国家是单一主权国家</td><td>联邦是国际交往的主体，联邦组成单位一般不是</td></tr>
<tr><td>宪法与法律</td><td>全国只有一部宪法、一种法律体系</td><td>联邦有联邦宪法，各州另有自己的宪法</td></tr>
<tr class="key"><td>地方权力的来源</td><td>由中央通过宪法和法律授予，可依法调整</td><td>由联邦宪法划分，州在其范围内有相对独立权限</td></tr>
<tr><td>地方单位的性质</td><td>普通行政单位或自治单位，不是主权单位</td><td>联邦组成单位，有相对独立的立法、行政、司法机关</td></tr>
<tr><td>典型例子</td><td>中国、法国、日本</td><td>美国、德国、俄罗斯</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只高亮了一行：地方权力的来源。材料里出现「某州有自己的宪法」，指向的就是这一行；出现「某省依法制定地方性法规」，指向的也是这一行，但答案相反。背这张表别横着背，竖着背这一行，就能应付大部分选择题。时间紧就先写「我国是单一制国家」这句，再用这一行说明地方权限的来源，两句话先拿到要点分。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 原因类材料题<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">材料：我国有 56 个民族，各民族大杂居、小聚居，历史上长期是统一的多民族国家。今天，香港、澳门特别行政区实行「一国两制」，民族自治地方依法行使自治权，全国只有一部宪法、一种法律体系。结合材料，说明我国为什么实行单一制的国家结构形式。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性</p>
<p class="s-b">先问三句：问的是「是什么」「为什么」还是「怎么办」。这里问「为什么实行」，是原因类。知识范围锁定在国家结构形式，也就是单一制和联邦制这一格，不要往国体、政体上跑。原因类题的答法是「由什么决定」，不是「有什么好处」。</p>
<p class="s-k">用到：国家结构形式的含义与类型。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 找主体</p>
<p class="s-b">材料里的主体有国家（中央）、各民族、特别行政区和民族自治地方。题目问的是「国家为什么这样安排」，主体是国家，不是「地方为什么听话」。主体找错，后面每一点都会写偏，写成「地方要服从中央」就成了要求类。</p>
<p class="s-k">用到：中央与地方的关系。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 找行为与事实</p>
<p class="s-b">把关键词圈出来：长期统一的多民族国家、大杂居小聚居、特别行政区实行「一国两制」、民族自治地方行使自治权、全国只有一部宪法。这些事实共同指向一个判断：我国是单一制国家，中央统一领导、地方分级管理。</p>
<p class="s-k">用到：我国是单一制国家。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 对应原理</p>
<p class="s-b">每一条事实配一条原理：历史传统对应长期统一；民族关系对应多元一体、大杂居小聚居；国家统一对应主权和领土完整；人民根本利益对应集中力量办大事、区域协调发展。四条正好是这类题的标准框架，别自己另起一套。</p>
<p class="s-k">用到：历史传统、民族关系、国家统一、人民根本利益。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口</p>
<p class="s-b">分点写，每点「原理 + 材料关键词」，最后一句收住：所以我国实行单一制，而不是联邦制。别把「单一制有什么好处」抄成五条，那是另一道题的答案。写完回头看一遍，四个要点齐不齐，缺哪个补哪个。答案末尾把结论再说一遍，阅卷时一眼就能看到。</p>
<p class="s-k">用到：结论句和分点格式。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">① 历史传统：我国长期是统一的多民族国家，大一统的传统决定了中央统一领导的国家结构形式。② 民族关系：各民族大杂居、小聚居，形成多元一体的民族格局，单一制有利于民族团结和各民族共同繁荣。③ 国家统一：单一制有利于维护国家主权和领土完整，特别行政区、民族自治地方都是国家不可分离的部分。④ 人民根本利益：单一制能集中力量办大事，促进区域协调发展，符合人民的根本利益。⑤ 结论：我国实行单一制，是历史传统、民族关系、国家统一和人民根本利益共同决定的。</p>
</div>
</div>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「单一制和联邦制最根本的区别是什么？」</p>
<p class="a">不是地方权力大不大，而是<b>地方权力从哪来</b>：单一制由中央通过宪法和法律授予，联邦制由联邦宪法划分、州在范围内有相对独立权限。答题写「权力来源」，别写「谁听谁的」。补充一句：单一制国家的地方也能立法，但立法权同样来自中央授予。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="权力来源对比">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text class="ms" x="120" y="30" text-anchor="middle" font-size="9">地方权力的来源</text>
<rect x="24" y="46" width="88" height="34" rx="6" fill="#eefaf3" stroke="#b8e6d0"/>
<text class="ms" x="68" y="67" text-anchor="middle" font-size="9">中央授予</text>
<rect x="128" y="46" width="88" height="34" rx="6" fill="#fdf6e9" stroke="#e3d3b3"/>
<text class="ms" x="172" y="67" text-anchor="middle" font-size="9">宪法划分</text>
<text class="ms" x="68" y="104" text-anchor="middle" font-size="9">单一制</text>
<text class="ms" x="172" y="104" text-anchor="middle" font-size="9">联邦制</text>
</svg>
</div>
<div class="qac">
<p class="q">「我国是单一制，地方为什么还能有这么大权力？」</p>
<p class="a">因为单一制讲的是<b>权力来源</b>，不是权力大小。特别行政区权限很大，但权限来自中央授权，中央仍有全面管治权。把「权限大」当成「制度变了」，是这一框最容易丢分的一句话。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="权限大小不等于制度类型">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text class="ms" x="20" y="34" font-size="9" font-weight="700">权限大 ≠ 联邦制</text>
<text class="ms" x="20" y="58" font-size="9">看来源：中央授予，就是单一制</text>
<text class="ms" x="20" y="80" font-size="9">看大小：特别行政区权限很大</text>
<text class="ms" x="20" y="102" font-size="9">但中央仍有全面管治权</text>
</svg>
</div>
<div class="qac">
<p class="q">「特别行政区高度自治，是不是带点联邦制？」</p>
<p class="a">不是。高度自治是<b>单一制下的授权</b>：特别行政区没有自己的宪法、没有外交权、没有独立国籍，中央拥有全面管治权。答题时写「高度自治不是完全自治」，这一句是采分点。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="高度自治的来源">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text class="ms" x="120" y="32" text-anchor="middle" font-size="9" font-weight="700">高度自治</text>
<line x1="120" y1="40" x2="120" y2="56" stroke="#8fa8b8" stroke-width="1.2"/>
<polygon points="120,66 114,55 126,55" fill="#8fa8b8"/>
<text class="ms" x="120" y="84" text-anchor="middle" font-size="9">来自中央授权</text>
<text class="ms" x="120" y="106" text-anchor="middle" font-size="9">不是主权单位，也不是联邦成员</text>
</svg>
</div>
<div class="qac">
<p class="q">「民族自治地方的自治权，和联邦的州权差不多吧？」</p>
<p class="a">差在来源和性质。自治权由<b>宪法和民族区域自治法</b>赋予，自治机关是地方国家机关；州权由联邦宪法划分，州有相对独立的宪法和法院。前者是授权，后者是分权。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="自治权与州权不同">

<text class="ms" x="176" y="59" text-anchor="middle" font-size="9">州权</text>
<text class="ms" x="120" y="94" text-anchor="middle" font-size="8.8">宪法和法律赋予 vs 联邦宪法划分</text>
<text class="ms" x="120" y="112" text-anchor="middle" font-size="8.8">都不是主权单位</text>
</svg>
</div>
<div class="qac">
<p class="q">「欧盟算不算一个联邦国家？」</p>
<p class="a">不算。欧盟成员<b>仍然是主权国家</b>，欧盟是区域一体化组织，没有取代成员国成为新的国家。同理，邦联也不是国家，而是主权国家的联盟，别和联邦制混着写。欧盟成员国有退出权，这一点也能说明它们仍是主权国家。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="欧盟不是联邦国家">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text class="ms" x="20" y="32" font-size="9" font-weight="700">欧盟：区域一体化组织</text>
<rect x="20" y="46" width="52" height="30" rx="5" fill="#ffffff" stroke="#c9d8e4"/>
<text class="ms" x="46" y="65" text-anchor="middle" font-size="8.6">成员国</text>
<rect x="94" y="46" width="52" height="30" rx="5" fill="#ffffff" stroke="#c9d8e4"/>
<text class="ms" x="120" y="65" text-anchor="middle" font-size="8.6">成员国</text>
<rect x="168" y="46" width="52" height="30" rx="5" fill="#ffffff" stroke="#c9d8e4"/>
<text class="ms" x="194" y="65" text-anchor="middle" font-size="8.6">成员国</text>
<text class="ms" x="20" y="96" font-size="8.8">成员仍保留主权，不是联邦的州</text>
<text class="ms" x="20" y="114" font-size="8.8">欧盟没有取代成员国</text>
</svg>
</div>
<div class="qac">
<p class="q">「国家结构形式、国体、政体，到底怎么分？」</p>
<p class="a">国体回答<b>谁掌握国家政权</b>，政体回答<b>国家权力怎样组织</b>，结构形式回答<b>中央与地方、整体与部分怎么摆</b>。三问分开，选项就不容易混；材料里出现「中央和地方」「统一与自治」，先往结构形式上想。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="国体政体结构形式的区别">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text class="ms" x="20" y="34" font-size="8.8">国体：哪个阶级掌握国家政权</text>
<text class="ms" x="20" y="58" font-size="8.8">政体：国家权力怎样组织</text>
<text class="ms" x="20" y="82" font-size="8.8">结构形式：中央与地方怎么摆</text>
<line x1="20" y1="94" x2="220" y2="94" stroke="#dde4ea" stroke-width="1"/>
<text class="ms" x="20" y="114" font-size="8.8" font-weight="700">三问分开，选项就不混了</text>
</svg>
</div>
</div>
<p class="gx-note">六问其实是同一件事：都在问「这个权力是谁给的」。地方权力由中央授予、由宪法法律赋予的，就是单一制；有另一套宪法、有主权特征的，才往联邦制上想。把这一句记住，六问都能自己推出来。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 我国是单一制国家，所以地方的一切权力都由中央直接行使。</p>
<p class="er-v">✓ 我国是单一制国家，中央统一领导、地方分级管理，地方依法享有权限。</p>
<p class="er-w">错在把「统一领导」当成「包办一切」。单一制讲的是权力来源，不是中央替地方干每一件事。判断依据写错，后面每一点都会被带偏。</p>
</div>
<div class="er">
<p class="er-x">✗ 香港特别行政区高度自治，说明我国带有联邦制的色彩。</p>
<p class="er-v">✓ 特别行政区是单一制下的地方行政区域，高度自治来自中央授权，中央拥有全面管治权。</p>
<p class="er-w">错在把「高度自治」当成分权。有自治权不等于有主权，香港没有自己的宪法和外交权。</p>
</div>
<div class="er">
<p class="er-x">✗ 联邦制和邦联是一回事，只是叫法不同。</p>
<p class="er-v">✓ 联邦制国家有统一的宪法和法律，联邦是国际交往的主体；邦联是主权国家的联盟，成员仍是主权国家。</p>
<p class="er-w">错在把国家结构形式和国际组织混为一谈。联邦是一个国家，邦联是几个国家凑在一起。</p>
</div>
<div class="er">
<p class="er-x">✗ 民族自治地方的自治权是固有的，和联邦的州权差不多。</p>
<p class="er-v">✓ 民族自治地方的自治权由宪法和民族区域自治法赋予，是单一制下的地方权限。</p>
<p class="er-w">错在把「授予的权限」当成「固有的权力」。来源一改，性质就变了，答案也跟着错。</p>
</div>
<div class="er">
<p class="er-x">✗ 国家结构形式就是国家的政权组织形式。</p>
<p class="er-v">✓ 国家结构形式讲整体与部分、中央与地方的关系；政权组织形式讲国家权力如何组织。</p>
<p class="er-w">错在两个概念的名称混用。一个问「中央和地方怎么摆」，一个问「权力机关怎么设」。</p>
</div>
<div class="er">
<p class="er-x">✗ 国家主权就是领土完整，两者是一回事。</p>
<p class="er-v">✓ 国家主权是国家的生命和灵魂，表现为对内最高、对外独立；领土完整是主权的重要体现。</p>
<p class="er-w">错在把权力和空间范围等同。主权是权力本身，领土是行使权力的空间。</p>
</div>
<div class="er">
<p class="er-x">✗ 我国实行单一制只是历史原因造成的，和人民利益没有关系。</p>
<p class="er-v">✓ 我国实行单一制，是历史传统、民族关系、国家统一和人民根本利益共同决定的。</p>
<p class="er-w">错在漏掉决定因素。四个要点缺一个，原因类题的答案就不完整，最多给一半分。原因类题按点给分，四点写全才稳。</p>
</div>
