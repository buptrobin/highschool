<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写课本这句，不写你脑子里那句。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 第一步是登记<span class="q-src">人教版（2019）选择性必修2 法律与生活 · 第三单元第八课</span></p>
<p class="q-b">市场主体应当依照本条例办理登记。未经登记，不得以市场主体名义从事经营活动。法律、行政法规规定无需办理登记的除外。</p>
<p class="q-n">→ 翻成人话：这句话里有三层意思。①「应当」是义务，不是建议，能不办就不办的只有最后一句那类例外。②没登记，你就不能挂招牌、签合同、开发票、以经营者的名义对外做事。③例外要由法律、行政法规来定，比如农民在集贸市场卖自产农产品、提供便民劳务，依法不需登记。所以「摆摊」和「开公司」不是同一件事，答题时别把它们放进同一句话。规范表述是「依法办理市场主体登记」，不是「办个手续」。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 什么算不正当竞争<span class="q-src">人教版（2019）选择性必修2 法律与生活 · 第三单元第八课</span></p>
<p class="q-b">本法所称的不正当竞争行为，是指经营者在生产经营活动中，违反本法规定，扰乱市场竞争秩序，损害其他经营者或者消费者合法权益的行为。</p>
<p class="q-n">→ 翻成人话：这是一句定义，也是答题模板，里面有三个条件。①主体是经营者，而且是在生产经营活动中，你以消费者身份买东西不受这条管。②行为违反了反不正当竞争法的规定，不是「我看不惯」就算。③后果是扰乱竞争秩序，或者损害了其他经营者、消费者的合法权益。三个条件凑齐，才能下「不正当竞争」这个判断。所以打折、送券、直播带货本身都不违法，违法的是手段和后果。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 判断的总尺子<span class="q-src">人教版（2019）选择性必修2 法律与生活 · 第三单元第八课</span></p>
<p class="q-b">经营者在生产经营活动中，应当遵循自愿、平等、公平、诚信的原则，遵守法律和商业道德。</p>
<p class="q-n">→ 翻成人话：八个字，四把尺子，一一对应常考的做法。仿别人的包装，破坏的是「公平」；刷单编评价，破坏的是「诚信」；平台逼商家二选一，破坏的是「自愿」和「平等」；串通涨价，破坏的是「公平」。拿不准某个做法违不违法时，先拿这四把尺子量一遍，再去找具体条款。答题时原则和行为都要写：只写原则是空话，只写行为像举例。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>正当促销（合法）</th><th>不正当竞争（违法）</th></tr></thead>
<tbody>
<tr><td>降价</td><td>店庆、清库存，明码标价，说清期限</td><td>无正当理由低于成本价销售，只为挤走对手</td></tr>
<tr><td>说自己的好</td><td>讲性能、讲服务，拿得出依据</td><td>编销量、编评价，喊「全网最低」「包治百病」</td></tr>
<tr><td>送东西抽奖</td><td>满减、赠品规则写在明处</td><td>有奖销售信息不明确，内定中奖人</td></tr>
<tr><td>借别人的名气</td><td>拿到授权、付了许可费再联名</td><td>擅自用他人有一定影响的名称、包装、装潢</td></tr>
<tr class="key"><td>真正的区别</td><td>靠自己把东西做好</td><td>靠把别人踩下去、把消费者骗过来</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只高亮 1 行，那一行才是要背的：正当竞争比的是「我的东西」，不正当竞争动的是「别人的东西」和「消费者的判断」。所以判断题里出现「更便宜」「更好看」「送得多」，不能直接当违法证据；出现「仿」「编」「逼」「瞒」这四个动作，才往不正当竞争上靠。另一条线别混：反垄断管的是大企业排除、限制竞争，反不正当竞争管的是手段不干净，两者依据的法律不是同一部。</p>
</section>

<section class="gx-sec" id="c">
<h2><span class="sn">03</span>自己点一下<span class="bdg bdg-key">A 级</span></h2>
<p class="gx-h2s">点一个材料情境，看它对应哪个知识点、为什么、答题时怎么写。</p>

<figure class="gx-fig">
<div class="fig-cap">
<span class="fig-no">互动 1</span><span class="fig-t">材料 → 知识点：情境判断器</span>
<span class="bdg bdg-must">必考</span>
</div>
<p class="fig-s">先自己判断，再点开看。五个情境分别对应本节五个易混点：仿冒混淆、刷单炒信、虚假广告、商业秘密、平台二选一。心里先给一个答案，再点开对，比直接看结论记得牢。</p>
<div class="gx-quiz">
<div class="qbtns">
<button class="qbtn" type="button" data-k="情境一 · 仿冒混淆" data-a="对应：不正当竞争中的混淆行为。擅自使用与他人有一定影响的商品名称、包装、装潢等相同或者近似的标识，引人误认为是他人商品或者与他人存在特定联系。" data-w="判断依据：主体是奶茶店经营者，行为是仿用知名品牌的商标、包装、配色，后果是顾客认错、客流转移。三个条件齐了：经营者、生产经营活动中、损害其他经营者权益。所以它不是「风格相似」这种审美问题，也不是单纯的质量问题。如果该品牌已注册商标，还同时构成商标侵权，答题时两层都写。">情境一：小王开奶茶店，招牌、杯子、配色都仿了本地知名品牌，顾客常认错。</button>
<button class="qbtn" type="button" data-k="情境二 · 刷单炒信" data-a="对应：虚假宣传。以虚构交易、编造用户评价等方式进行虚假或者引人误解的商业宣传，欺骗、误导消费者，属于不正当竞争。" data-w="判断依据：主体是网店经营者，行为是雇人虚构交易、编造好评，后果是评价失真、消费者被误导。这里的标的是「用户评价和销售状况」，不是商品本身的质量。所以别答成「产品质量不合格」，那是另一回事。刷单的钱付给了谁、有没有真实发货，恰恰是查处的证据。">情境二：网店花两千块雇人刷单，一个月做出三百条五星好评。</button>
<button class="qbtn" type="button" data-k="情境三 · 虚假广告" data-a="对应：虚假广告、虚假宣传。广告不得含有虚假或者引人误解的内容，不得欺骗、误导消费者；经营者不得对商品的性能、功能、质量等作虚假宣传。" data-w="判断依据：主体是广告主和广告经营者，行为是使用「全网最低价」「包治百病」这类无法证实或明显夸大的表述，后果是误导消费者。「全网最低」属于不可核查的比较，「包治百病」还涉及药品、医疗广告的禁止性规定。判据是内容真不真、能不能证实，不是广告做得漂不漂亮。">情境三：广告写「全网最低价」「包治百病」，实际拿不出依据。</button>
<button class="qbtn" type="button" data-k="情境四 · 商业秘密" data-a="对应：侵犯商业秘密。商业秘密是不为公众所知悉、具有商业价值并经权利人采取相应保密措施的技术信息、经营信息等商业信息。" data-w="判断依据：主体是跳槽员工和新公司，标的是客户名单、配方，行为是违反保密义务带走并使用。三个要件要一个个对：不公开、有价值、原公司采取了保密措施。三条都成立才叫商业秘密；只是「我会的手艺」不算。员工可能同时承担违约责任和侵权责任，新公司明知还用的，也要担责。">情境四：员工跳槽，把原公司的客户名单和配方带到了新公司。</button>
<button class="qbtn" type="button" data-k="情境五 · 平台二选一" data-a="对应：滥用市场支配地位中的限定交易，属于垄断行为。具有市场支配地位的经营者不得滥用支配地位，排除、限制竞争。" data-w="判断依据：主体是具有市场支配地位的平台，行为是限定交易、逼迫商家站队，后果是排除、限制竞争。这里的关键词是「支配地位」，不是「平台大」就等于垄断，要先认定它有支配地位，再认定这个限定有没有正当理由。所以答案要写「滥用市场支配地位」，不能只写「不正当竞争」。">情境五：大平台要求商家只能在自己这儿卖，不许上别家。</button>
</div>
<div class="qout"></div>
</div>
<p class="gx-take">判材料题先找主体和行为，再对应课本概念，最后才写责任方式。五个情境里前三个走反不正当竞争法，第四个走商业秘密加违约，第五个走反垄断法。</p>
<p class="gx-note">为什么是 A 级：本节是制度与行为类型的辨析，没有一个能连续调节的量。做成点击判断，比硬造一个滑块更贴近真实考题。点开先看「对应」，再看「判断依据」；「对应」那句能直接抄进答案，「判断依据」那半句就是你的分析过程。把两句合成一段，就是一道完整的材料分析题。</p>
</figure>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 材料分析：仿冒名牌包装要担什么责<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">某市一家新开的奶茶店，取名、装修风格、杯型和配色都模仿当地知名品牌「茶山」，包装上还印着「茶山同款配方」。开业两个月，营业额明显上升，正品门店的客流下降。经查，「茶山」的包装、装潢在当地有一定影响，其商标也已注册。市场监管部门接到投诉后立案调查。结合材料，分析该奶茶店行为的性质及其应承担的法律责任。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性</p>
<p class="s-b">先定性质：这是竞争法上的问题，不是合同纠纷，也不是简单的质量问题。问的是「行为怎么定性」加「担什么责」两问。材料里出现「模仿包装」「客流下降」「立案调查」，三个信号都指向不正当竞争。定性错了，后面写再多也是零分。</p>
<p class="s-k">用到：不正当竞争、混淆行为。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 找主体</p>
<p class="s-b">列四方：新店经营者，是行为主体；「茶山」经营者，是被侵害人；被误导的消费者，是间接受损方；市场监管部门，是执法主体。少写一个，就少一个采分点。特别是消费者，很多人只写同行之间的竞争，忘了这条法律同时保护消费者。</p>
<p class="s-k">用到：经营者、消费者、监督检查部门。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 找行为与后果</p>
<p class="s-b">行为有两层：一是仿用有一定影响的包装、装潢、名称；二是标注「同款配方」，暗示和正品有特定联系。后果是引人误认、客流转移。看清是「仿」还是「抄配方」很关键：仿包装走混淆行为，抄配方才走商业秘密，本案材料只给了前者。</p>
<p class="s-k">用到：有一定影响的标识、引人误认、损害后果。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 对应规则</p>
<p class="s-b">先写反不正当竞争法：擅自使用与他人有一定影响的商品名称、包装、装潢等相同或者近似的标识，引人误认为是他人商品或者与他人存在特定联系，属于混淆行为。再补一层：该品牌商标已注册，未经许可在同种商品上使用近似商标，还可能构成商标侵权。两层都写，答案才厚。</p>
<p class="s-k">用到：混淆行为、注册商标专用权。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口</p>
<p class="s-b">按「定性 → 民事责任 → 行政责任 → 消费者救济」分点写。每点先写规则，再回扣材料一句话。最后补一句启示：可以学别人的经营方式，不能蹭别人的招牌。格式上①②③分行，每点不超过两行。</p>
<p class="s-k">用到：停止侵害、赔偿损失、行政处罚。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">①定性：该奶茶店的行为属于不正当竞争中的混淆行为。经营者擅自使用与他人有一定影响的商品名称、包装、装潢等相同或者近似的标识，引人误认为是他人商品或者与他人存在特定联系，扰乱市场竞争秩序，损害其他经营者和消费者的合法权益。②该行为同时可能侵害「茶山」的注册商标专用权，权利人可依法主张权利。③民事责任：应当停止侵害，立即停止使用与「茶山」近似的名称、包装、装潢，拆除相关标识；造成损失的，依法赔偿损失，赔偿数额按权利人受到的实际损失、侵权人获得的利益等依法确定。④行政责任：监督检查部门可以责令停止违法行为，没收违法商品，依法处以罚款；情节严重的，可以吊销营业执照。⑤消费者因误认而购买的，可以依法要求退货、赔偿，也可以向消费者协会投诉或向行政部门举报。⑥启示：创业可以学别人的经营方式和管理办法，但不能蹭别人的名称、包装和商誉；公平竞争是市场经济的底线，也是创业者的第一条规矩。</p>
</div>
</div>
</section>
<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「我在校门口摆个摊，也要办证吗？」</p>
<p class="a">分两种。多数经营活动要先依法办理市场主体登记，领到营业执照，才能以市场主体名义经营；法律、行政法规规定无需登记的除外，比如农民在集贸市场销售自产农产品、提供便民劳务。所以既不是「摆摊一律不用办」，也不是「一律都要办」，<b>先看你卖什么、在哪里卖，再去查这一行有没有例外</b>。拿不准时答案里写「依法办理市场主体登记」，不要自己编证名。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="依法无需登记与应当登记两种情形">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="30" text-anchor="middle" font-size="9" font-weight="700" fill="#151a21">先问一句：法律要不要我登记</text>
<rect x="24" y="44" width="86" height="40" rx="6" fill="#ffffff" stroke="#b8e6d0"/>
<text x="67" y="62" text-anchor="middle" font-size="8.4" font-weight="700" fill="#1d5c46">卖自产农产品</text>
<text x="67" y="76" text-anchor="middle" font-size="8" fill="#3a3a35">依法无需登记</text>
<rect x="130" y="44" width="86" height="40" rx="6" fill="#ffffff" stroke="#cfe0ee"/>
<text x="173" y="62" text-anchor="middle" font-size="8.4" font-weight="700" fill="#1f4d6b">开奶茶店</text>
<text x="173" y="76" text-anchor="middle" font-size="8" fill="#3a3a35">应当办理登记</text>
<text x="120" y="102" text-anchor="middle" font-size="8.2" fill="#6a7580">没登记，不得以市场主体名义经营</text>
<text x="120" y="116" text-anchor="middle" font-size="8.2" fill="#6a7580">例外由法律、行政法规规定</text>

<div class="qac">
<p class="q">「有限责任公司欠债，要拿我家房子赔吗？」</p>
<p class="a">一般不用。有限责任公司股东以其认缴的出资额为限对公司承担责任，公司以其全部财产对公司的债务承担责任。<b>「有限」限的是股东的责任，不是公司的责任</b>，这两个主体别写混。但保护有前提：股东不得滥用公司法人独立地位和股东有限责任逃避债务，不得把公司财产与个人财产混同；混同、抽逃出资的，可能对公司债务承担连带责任。一人公司的股东，还要自己证明公司财产独立于个人财产。</p>

<text x="174" y="77" text-anchor="middle" font-size="8" fill="#3a3a35">以认缴出资额为限</text>

<div class="qac">
<p class="q">「打折、送券，算不算不正当竞争？」</p>
<p class="a">不算。降价、满减、送赠品都是正常经营手段，法律并不禁止。<b>违法行为看手段，不看价格</b>。没有正当理由，以低于成本的价格销售商品，排挤竞争对手的，可能构成不正当竞争；有奖销售信息不明确、内定中奖人，也违法。判断时问两句：这个低价有没有正当理由，比如清库存、季节性降价、临近保质期；这个活动的规则有没有写在明处。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="正常降价与低于成本倾销的区别">

<text x="120" y="30" text-anchor="middle" font-size="9" font-weight="700" fill="#151a21">便宜不违法，怎么看便宜才关键</text>

<text x="66" y="62" text-anchor="middle" font-size="8.4" font-weight="700" fill="#1d5c46">有正当理由</text>
<text x="66" y="77" text-anchor="middle" font-size="8" fill="#3a3a35">清库存、店庆</text>
<rect x="130" y="44" width="88" height="42" rx="6" fill="#ffffff" stroke="#e6c9c9"/>

<text x="120" y="116" text-anchor="middle" font-size="8.2" fill="#6a7580">不是标价低</text>

<div class="qac">
<p class="q">「员工跳槽带走客户名单，算侵权吗？」</p>
<p class="a">要看是不是商业秘密。商业秘密要同时满足三条：不为公众所知悉、具有商业价值、权利人采取了相应保密措施。三条都成立，员工违反保密义务带走并使用，就是侵权，可能同时承担违约责任和侵权责任；新单位明知或者应知仍然使用的，也要担责。<b>「记在脑子里的经验」不等于商业秘密</b>，能带来竞争优势又不公开的客户名单、配方、数据才可能算。情节严重的，还可能构成犯罪。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="商业秘密三个要件，缺一不算">

<text x="120" y="30" text-anchor="middle" font-size="9" font-weight="700" fill="#151a21">三条都成立，才叫商业秘密</text>
<text x="26" y="56" font-size="8.4" fill="#3a3a35">① 不为公众所知悉</text>
<text x="26" y="76" font-size="8.4" fill="#3a3a35">② 具有商业价值</text>
<text x="26" y="96" font-size="8.4" fill="#3a3a35">③ 权利人采取了保密措施</text>
<text x="120" y="118" text-anchor="middle" font-size="8.2" fill="#6a7580">违反保密义务使用，可能侵权</text>
</svg>
</div>
<div class="qac">
<p class="q">「平台让我二选一，合法吗？」</p>
<p class="a">一般不合法。具有市场支配地位的经营者，不得滥用市场支配地位限定交易，排除、限制竞争。<b>前提是先认定它有市场支配地位</b>，不是「平台大」就等于垄断。除反垄断法外，电子商务法也规定平台不得利用服务协议、交易规则或者技术手段，对平台内经营者的交易作不合理限制。商家可以拒绝、留存证据，向市场监管部门举报，也可以依法起诉。</p>

<text x="120" y="60" text-anchor="middle" font-size="8.2" font-weight="700" fill="#8a3030">限定交易</text>
<text x="120" y="74" text-anchor="middle" font-size="8" fill="#3a3a35">逼商家站队</text>
<rect x="160" y="42" width="64" height="40" rx="6" fill="#ffffff" stroke="#e6c9c9"/>
<text x="192" y="60" text-anchor="middle" font-size="8.2" font-weight="700" fill="#8a3030">排除、限制</text>
<text x="192" y="74" text-anchor="middle" font-size="8" fill="#3a3a35">竞争</text>
<text x="120" y="108" text-anchor="middle" font-size="8.2" fill="#6a7580">「平台大」不等于「垄断」，还看有无正当理由</text>
</svg>
</div>
<div class="qac">
<p class="q">「买到假货，只能找商家理论吗？」</p>
<p class="a">不止。可以与经营者协商和解；可以请求消费者协会或者依法成立的其他调解组织调解；可以向有关行政部门投诉；有仲裁协议的，可以提请仲裁机构仲裁；也可以向人民法院提起诉讼。<b>五条路不必一级一级走，可以跳</b>。前提是留好证据：订单、发票、聊天记录、商品照片、检测报告。经营者有欺诈行为的，消费者还可以依法主张惩罚性赔偿。</p>

<p class="gx-note">六问看着散，其实是同一件事：先说清主体站在什么位置，再说清他做了什么动作，最后说清法律怎么评价。所以材料题的落笔顺序永远是「谁 → 做了什么 → 属于哪一类 → 担什么责」。把这条链练成条件反射，考场上就不会东写一句西写一句。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 创业就是自己当老板，想开就开，不用办什么手续。</p>
<p class="er-v">✓ 市场主体应当依法办理登记；未经登记，不得以市场主体名义从事经营活动，法律、行政法规规定无需登记的除外。</p>
<p class="er-w">错在把「想干」当成「能干」。没登记就挂招牌、签合同、开发票，属于无照经营，会被责令改正、处罚，出了债务纠纷还容易把个人财产搭进去。答题第一句先写登记。</p>
</div>
<div class="er">
<p class="er-x">✗ 公司欠了钱，股东当然要拿自己的钱还。</p>
<p class="er-v">✓ 有限责任公司股东以其认缴的出资额为限对公司承担责任，公司以其全部财产对公司的债务承担责任。</p>
<p class="er-w">错在把「有限责任」理解反了。它限的是股东的责任，不是公司的责任；而且这条保护有条件，股东不得滥用公司独立地位，不得把公司财产和个人财产混同，混了可能担连带责任。</p>
</div>
<div class="er">
<p class="er-x">✗ 打折、送赠品、搞抽奖，都是不正当竞争。</p>
<p class="er-v">✓ 不正当竞争是经营者违反反不正当竞争法、扰乱市场竞争秩序、损害其他经营者或者消费者合法权益的行为。</p>
<p class="er-w">错在把「促销」和「不正当竞争」画等号。降价本身不违法，无正当理由低于成本价倾销才可能违法；抽奖本身不违法，规则不明、内定中奖才违法。看手段，不看价签。</p>
</div>
<div class="er">
<p class="er-x">✗ 东西是真的，广告吹一点没关系。</p>
<p class="er-v">✓ 经营者不得对其商品的性能、功能、质量、销售状况、用户评价、曾获荣誉等作虚假或者引人误解的商业宣传，欺骗、误导消费者。</p>
<p class="er-w">错在以为「货真」就能「话假」。虚假宣传罚的是宣传内容，不是商品真假；「全网最低」「包治百病」这类无法证实的表述，本身就是证据。</p>
</div>
<div class="er">
<p class="er-x">✗ 配方是我自己记在脑子里的，带走不算侵权。</p>
<p class="er-v">✓ 商业秘密是不为公众所知悉、具有商业价值并经权利人采取相应保密措施的技术信息、经营信息等商业信息，违反保密义务使用即可能构成侵权。</p>
<p class="er-w">错在拿「载体」当「权属」。秘密记在脑子里还是存在电脑里，不影响它是不是商业秘密；关键看三条要件有没有齐、有没有保密义务。新单位明知还用的，也要担责。</p>
</div>
<div class="er">
<p class="er-x">✗ 平台让商家二选一，是平台的经营自由。</p>
<p class="er-v">✓ 具有市场支配地位的经营者不得滥用市场支配地位，限定交易、排除、限制竞争；平台不得利用服务协议、技术手段对平台内经营者的交易作不合理限制。</p>
<p class="er-w">错在把「自由」当成「不受约束」。经营自由不能用来排除竞争；判断要先看有没有市场支配地位，再看这个限制有没有正当理由，两步都写完才给满分。</p>
</div>
<div class="er">
<p class="er-x">✗ 消费者维权只能去法院告。</p>
<p class="er-v">✓ 可以与经营者协商和解，请求消费者协会或者调解组织调解，向有关行政部门投诉，有仲裁协议的提请仲裁机构仲裁，也可以向人民法院提起诉讼。</p>
<p class="er-w">错在只记住最后一条路。五条路成本从低到高，可以先谈、先投诉；不管走哪条，证据都是第一步。答题写全五种，比只写「起诉」多拿分。</p>
</div>
