<p class="gx-claim">一句话说清本节最该记住的判断：我国法治建设分三段——<b>中华法系</b>是古代的法律传统，<b>新中国法治建设</b>从 1954 年第一部宪法起步，<b>2010 年</b>中国特色社会主义法律体系形成，<b>2020 年</b>民法典颁布；今天走的是<b>全面依法治国</b>，并且要坚持<b>依法治国与以德治国相结合</b>。</p>
<div class="gx-meta">
<span><i></i>人教版（2019）必修3 政治与法治 · 第七课第一框</span>
<span><i></i>高一 · 第三单元 全面依法治国</span>

<p class="gx-lede">先说一件你身边可能真遇到的事。楼上装修把承重墙敲了，物业劝不住，邻居在群里吵了三天，最后是住建部门上门下了整改通知，事情才停下来。你可能会问：一张纸为什么能让人停工？因为背后有法。可法不是天上掉下来的。中国古代有《唐律疏议》，新中国到 1954 年才有第一部宪法，2010 年才形成中国特色社会主义法律体系，2020 年才有了民法典。这一框讲的就是这条线：「我国法治建设的历程」，在必修3 第七课第一框，是「全面依法治国」这个单元的入口。最容易错的一件事：把「有法律」当成「有法治」，或者把中华法系当成「古代没有法」。这两句话一写，分就没了。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">这一框的分数压在三个判断上：中华法系是什么、新中国法治建设有哪些坐标、全面依法治国为什么还要讲德治。先照抄课本，再拆关键词。答题时写课本这句，不写你脑子里那句。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 中华法系是什么<span class="q-src">人教版（2019）必修3 政治与法治 · 第七课第一框</span></p>
<p class="q-b">我国法律发展的历史源远流长。中华法系源远流长、独树一帜，它以礼法结合为基本特征，不仅在中国法律史上占有重要地位，而且对周边国家的法律文化产生了深远影响。</p>
<p class="q-n">→ 翻成人话：这句话有三个判据，缺一个就答偏。<b>① 时间上</b>「源远流长」，从先秦的成文法一路走到《唐律疏议》，中间不是一片空白；<b>② 特征上</b>「礼法结合」，礼管名分和教化、法管刑罚和秩序，两套规矩一起用；<b>③ 影响上</b>「对周边国家」，日本、朝鲜、越南都来学。最容易错的是把中华法系当成「中国古代没有法」，或者反过来把它当成「今天的社会主义法治」。它是一份古代法律传统，里面有精华也有糟粕：维护君主专制、等级特权的那一套，今天必须丢掉；重视家庭伦理、重视教化的部分，可以批判继承。答题时先定性「古代法律传统」，再写特征，最后写影响，三句话就够。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 新中国法治建设的三个坐标<span class="q-src">人教版（2019）必修3 政治与法治 · 第七课第一框</span></p>
<p class="q-b">1954 年，第一届全国人民代表大会第一次会议通过了《中华人民共和国宪法》，这是我国第一部社会主义类型的宪法。2010 年，中国特色社会主义法律体系形成。2020 年，十三届全国人大三次会议通过《中华人民共和国民法典》，这是新中国第一部以法典命名的法律。</p>
<p class="q-n">→ 翻成人话：三个年份对应三件不同的事，别串。<b>1954 年</b>解决「有没有社会主义宪法」，这次会议还确立了人民代表大会制度等根本制度，所以它是新中国法治建设的起点。<b>2010 年</b>解决「全不全」，中国特色社会主义法律体系形成，经济、政治、文化、社会生活各方面总体上做到有法可依。<b>2020 年</b>解决「细不细」，民法典颁布，被称为「社会生活的百科全书」，一个人从出生到死亡的权利，大多能在里面找到依据。记法：1954 立宪法，2010 成体系，2020 出法典。顺序不能颠倒，也不能把 2010 和 2020 说成同一件事：一个是「体系形成」，一个是「法典颁布」，两个里程碑各管一段。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 法治与德治为什么要结合<span class="q-src">人教版（2019）必修3 政治与法治 · 第七课第一框</span></p>
<p class="q-b">法治是治国理政的基本方式。全面依法治国是中国特色社会主义的本质要求和重要保障。坚持依法治国和以德治国相结合，实现法治和德治相辅相成、相得益彰。</p>
<p class="q-n">→ 翻成人话：这句话回答「治理国家靠什么」。法律是底线，靠国家强制力；道德是高线，靠内心认同和舆论压力。两者不是二选一：只靠法律，成本高，也管不到人心；只靠道德，没有强制力，管不住坏人。所以课本的表述是「坚持依法治国和以德治国相结合」，把社会主义核心价值观融入法治建设。答题时写「法律与道德共同发挥作用」，不要写「法治比德治重要」，也不要写「德治可以代替法治」。材料里出现「依法抗疫 + 弘扬抗疫精神」「把诚信写进地方性法规」「把见义勇为写进民法典」，都是这个点。判据只有一条：材料里同时出现了法律手段和道德手段，就往「相结合」上写。</p>
</div>

<p class="gx-note">这张表只高亮一行：<b>真正的区别</b>。记法一句：<b>法制看文本，法治看约束</b>。有了一整套法律，只说明「有法可依」；只有当法律高于任何个人意志、公权力也按法办事，才叫法治。所以「中国特色社会主义法律体系形成」是法制建设的成就，也是走向法治的基础，但不能说「2010 年我们就建成法治国家了」。另有两顶帽子别戴错：依法治国是党领导人民治理国家的<b>基本方略</b>，法治是治国理政的<b>基本方式</b>，两个「基本」后面跟的词不一样，答题时照课本写。</p>
</section>

<p class="gx-note">这里有个坑：教材讲中华法系，用的是「历史传统」这个身份，不是「现行法律」。所以写完中华法系，后面一定要接一句「今天要建设的是中国特色社会主义法治体系」。另外，答「如何对待中华法系」这类题，要一分为二：批判维护专制、等级特权的糟粕，继承重视教化、重视家庭伦理的合理成分，再落到「推动中华优秀传统法律文化创造性转化、创新性发展」。</p>

<p class="q">「有了一整套法律，是不是就算法治国家了？」</p>
<p class="a">不算。法制说的是「有没有法、全不全」，法治说的是「法怎么用、权力受不受约束」。<b>法制是「有法可依」，法治是「依法而治」</b>。2010 年法律体系形成，说明我们有了比较完整的一套法；建设法治国家还要求法律至上、公权力按法办事、公民权利有保障。两句话不能画等号。</p>

<div class="qac">
<p class="q">「2010 年和 2020 年，到底哪个是法律体系形成？」</p>
<p class="a">2010 年是中国特色社会主义法律体系形成，解决「全不全」；2020 年是民法典颁布，解决「细不细」。<b>民法典是新中国第一部以法典命名的法律</b>，被称为「社会生活的百科全书」。两个都是里程碑，但一个讲体系，一个讲法典。把 2010 年写成民法典颁布，是阅卷时一眼就能看见的硬伤。</p>

</div>
<div class="qac">
<p class="q">「1954 年宪法就是我国现行宪法吧？」</p>
<p class="a">不是。1954 年宪法是我国<b>第一部社会主义类型的宪法</b>，由第一届全国人大第一次会议通过，确立了人民代表大会制度等根本制度，是新中国法治建设的起点。现行宪法是 1982 年通过的，此后经过多次修正。<b>「第一部」和「现行」是两个概念</b>：题目问起点答 1954 年，问现行别答 1954 年。</p>

<div class="qac">
<p class="q">「依法治国，是不是只靠法律就够了？」</p>
<p class="a">不够。法律是底线，靠国家强制力；道德是高线，靠内心认同和舆论。<b>只靠法律成本高、管不到人心；只靠道德没有强制力、管不住坏人</b>。所以要坚持依法治国和以德治国相结合，把社会主义核心价值观融入法治建设。材料里同时出现执法和表彰、宣传，就要两边都写。</p>

<div class="qac">
<p class="q">「民法典凭什么叫社会生活的百科全书？」</p>
<p class="a">因为它管的是每个人从出生到死亡的事：监护、婚姻、继承、买卖、租赁、侵权。<b>它调整平等主体之间的人身关系和财产关系</b>。小区电梯广告收益归谁、高空抛物找谁赔，都能在里面找到依据。它不是只管打官司，是给日常生活中的权利画了一张地图。</p>

<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。每条只看「错在哪」那一行，那里是判分点。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 中国古代没有法，中华法系是近代才有的。</p>
<p class="er-v">✓ 我国法律发展的历史源远流长，中华法系以礼法结合为基本特征，《唐律疏议》是代表作，对周边国家影响深远。</p>
<p class="er-w">错在哪：既说反了时间，又否定了古代法律传统。先秦就有成文法，中华法系是古代的东西，不是近代的。</p>
</div>
<div class="er">
<p class="er-x">✗ 中华法系全是精华，今天可以直接照搬。</p>
<p class="er-v">✓ 中华法系有精华也有糟粕，要批判继承、创造性转化、创新性发展。</p>
<p class="er-w">错在哪：没有一分为二。它维护君主专制和等级特权，这一部分必须丢掉；重视教化和家庭伦理的部分才可以继承。</p>
</div>
<div class="er">
<p class="er-x">✗ 2010 年民法典颁布，标志着法律体系形成。</p>
<p class="er-v">✓ 2010 年中国特色社会主义法律体系形成；2020 年十三届全国人大三次会议通过民法典。</p>
<p class="er-w">错在哪：两个年份、两件事串了。一个是体系形成，一个是法典颁布，都是里程碑，但不能合到一年里。</p>
</div>
<div class="er">
<p class="er-x">✗ 有了法律体系，我国就已经建成法治国家了。</p>
<p class="er-v">✓ 法律体系形成使各方面总体上有法可依，建设社会主义法治国家仍在推进。</p>
<p class="er-w">错在哪：把法制当成了法治。有法可依只是第一步，法治还要求法律至上、权力受约束、权利有保障。</p>
</div>
<div class="er">
<p class="er-x">✗ 1954 年宪法是我国现行宪法。</p>
<p class="er-v">✓ 1954 年宪法是我国第一部社会主义类型的宪法；现行宪法是 1982 年宪法，此后经过多次修正。</p>
<p class="er-w">错在哪：把「第一部」当成了「现行」。题目问起点答 1954 年，问现行答 1982 年，两个答案不能互换。</p>
</div>
<div class="er">
<p class="er-x">✗ 依法治国就是只靠法律，道德教育没什么用。</p>
<p class="er-v">✓ 坚持依法治国和以德治国相结合，法律与道德共同发挥作用，法治和德治相辅相成。</p>
<p class="er-w">错在哪：把「相结合」写成了「二选一」。法律是底线，道德是高线，缺一条都管不好国家。</p>
</div>
<div class="er">
<p class="er-x">✗ 法治建设是国家机关的事，公民只是被管理者。</p>
<p class="er-v">✓ 全面依法治国坚持人民主体地位，公民既是法治的受益者，也是参与者、推动者。</p>
<p class="er-w">错在哪：把法治理解成「管老百姓」。立法征求意见、守法、监督，都是公民在法治里的位置。</p>
