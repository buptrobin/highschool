<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">这一框的答案压在三个问题上：民族文化凭什么重要、文化多样性为什么值得珍惜、面对差异到底怎么做。先照抄，再拆关键词，最后看哪个词最容易写反。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 民族文化的地位<span class="q-src">人教版（2019）必修4 哲学与文化 · 第八课第一框</span></p>
<p class="q-b">民族文化是一个民族区别于其他民族的独特标识。每个民族都有自己的文化，民族文化是民族生存和发展的精神根基。民族文化起着维系社会生活、维持社会稳定的重要作用。价值观是民族文化的核心和灵魂。</p>
<p class="q-n">→ 翻成人话：这段是三层，外加一句总纲，少一层就答不全。①<b>独特标识</b>，回答「凭什么说这是我们民族的」；②<b>精神根基</b>，回答「它撑着什么」；③<b>维系社会生活、维持社会稳定</b>，回答「它在日常里起什么作用」。最后一句单独记：核心和灵魂是<b>价值观</b>，不是服饰、节日这些外表。考试问「为什么说民族文化重要」，就按这三层加一句价值观往外写。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 文化多样性<span class="q-src">人教版（2019）必修4 哲学与文化 · 第八课第一框</span></p>
<p class="q-b">文化多样性表征文化存在的丰富程度。每一个国家和民族的文化都扎根于本国本民族的土壤之中，都有自己的特色、长处、优点。文化多样性是发展本民族文化的内在要求，也是实现世界文化繁荣的必然要求。文化多样性是人类文明进步的重要动力。</p>
<p class="q-n">→ 翻成人话：四句话四层，答题时按顺序站队。第一句给定义：多样性说的是<b>丰富程度</b>，不是谁强谁弱。第二句给原因：各民族文化<b>扎根于本国本民族的土壤</b>，所以各有特色、长处、优点。第三句给意义，注意搭配别写反：对<b>本民族文化</b>是「内在要求」，对<b>世界文化</b>是「必然要求」。第四句是总判断：<b>人类文明进步的重要动力</b>，这句话最常被拿来当采分点。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 面对多样性怎么做<span class="q-src">人教版（2019）必修4 哲学与文化 · 第八课第一框</span></p>
<p class="q-b">面对文化多样性，我们要在坚持各民族平等的基础上，尊重差异，理解个性，和睦相处，共同促进世界文化的繁荣。要认同本民族文化，尊重其他民族文化。尊重文化多样性，首先要尊重本民族文化，培育好、发展好本民族文化。</p>
<p class="q-n">→ 翻成人话：这段是「怎么办」的标准答案，动作有三个，前提只有一个。前提是<b>坚持各民族平等</b>；三个动作是<b>尊重差异、理解个性、和睦相处</b>；落脚点是共同促进世界文化繁荣。后面两句管住方向：先<b>认同本民族文化</b>，再尊重别人的，顺序不能倒。倒过来写，就成了「尊重别人等于看轻自己」，正好踩中本节第三个扣分点。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">

<p class="gx-note">整张表只高亮一行：<b>一句话总口径</b>。上面六行是三组对照：第一、二行分清「民族的」和「世界的」，第三、四行守住「平等」和「分寸」，第五、六行管住「自己」和「别人」。背法是记三个「不」：不比高低、不搞封闭、不丢自己。考场上先看设问问的是「是什么」「为什么」还是「怎么办」，再决定调哪几行，别把整张表一股脑抄上去。</p>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。五步走完，答案的骨架自己就长出来了。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 措施类材料题<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">材料：某市办「世界文化周」，主会场设了十二个国家的展馆，日本的茶道、埃及的纸莎草画、巴西的桑巴鼓都能上手体验；市里的非遗馆把本地剪纸、皮影和外国手艺摆在同一层。活动第三天出了三件事：有商家把「洋节」包装成消费噱头，卖高价「祈福礼盒」；一位主播在直播里说「别国文化没什么可看的，不如全改成我们的」；也有中学生看完展后说「我们的剪纸太土，不如人家的」。主办方最后加了一场「各美其美」分享会，请各国展商讲自己文化的来历。结合材料，运用文化的民族性与多样性的知识，说明应如何正确对待文化多样性。（12 分）</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性</p>
<p class="s-b">题型是「怎么办」，知识范围是「文化的民族性与多样性」，落点就在第八课第一框。设问要答三层：先认同本民族文化，再尊重其他民族文化，最后落到交流互鉴。草稿上先写四个词：平等、尊重、认同、互鉴。</p>
<p class="s-k">用到：措施类设问的三层结构（认同 + 尊重 + 互鉴）</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 分主体</p>
<p class="s-b">材料里至少四类主体。主办方办展、加分享会；商家把节日做成消费噱头；主播要求别国「全改成我们的」；中学生看不起自家剪纸。主体不同，答案落点不同：主办方对应交流互鉴，主播对应文化霸权，中学生对应民族虚无主义。</p>
<p class="s-k">用到：主体分析法，先分人，再分对错</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 找行为对原理</p>
<p class="s-b">十二国展馆、同层摆手艺，是让不同文化平等露面，对应文化多样性；上手体验、请展商讲来历，是尊重差异、理解个性；商家只把节日当卖点，是把文化符号化，可以提一句但不能当主体；主播的话违背一律平等；中学生的话丢掉精神根基。</p>
<p class="s-k">用到：文化多样性、民族文化的地位、各民族一律平等</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 按顺序组答案</p>
<p class="s-b">第一条先写认同本民族文化：剪纸、皮影是本地人的精神根基，不能自己先看不起。第二条写尊重其他民族文化、坚持一律平等：十二国展馆不分大小，都有位置。第三条写尊重差异、理解个性、和睦相处：体验和分享会就是让人先弄懂再评价。第四条写交流互鉴、反对文化霸权主义和文化封闭主义，直接回应主播。</p>
<p class="s-k">用到：认同本民族文化 + 一律平等 + 三句话 + 两个反对</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口与自查</p>
<p class="s-b">最后回扣世界文化繁荣和文化自信：多样不是麻烦，是人类文明进步的重要动力。写完查三处：有没有把多样性写成优劣，有没有把尊重别人写成看轻自己，有没有只写「尊重」不写「认同」。三处都过，分点抄进答题卡。</p>
<p class="s-k">用到：人类文明进步的重要动力 + 文化自信 + 三句自查</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">① 要认同本民族文化。民族文化是民族生存和发展的精神根基，价值观是民族文化的核心和灵魂。本地的剪纸、皮影是本地人的共同记忆，不能因为外国手艺新鲜就看轻自己；材料中中学生说「我们的剪纸太土」，正是丢了这份认同。<br>② 要尊重其他民族文化，坚持各民族文化一律平等。每一个国家和民族的文化都扎根于本国本民族的土壤，都有自己的特色、长处、优点，没有高低优劣之分。文化周给十二个国家设展馆，不分国家大小，体现的正是平等相待。<br>③ 要尊重差异，理解个性，和睦相处。面对不同的茶道、纸莎草画、桑巴鼓，先了解它的来历，再作评价；主办方请各国展商讲自己文化的来历，就是让人先弄懂、再相处，而不是拿自己的尺子去量别人。<br>④ 要交流互鉴，反对文化霸权主义和文化封闭主义。在坚持各民族平等的基础上，吸收外来文化的有益成果，也把中华文化展示出去。材料中主播要求别国「全改成我们的」，是把本民族文化强加于人，违背文化多样性，必须反对；关起门来只认自己，同样不可取。<br>⑤ 结论：正确对待文化多样性，要认同本民族文化、尊重其他民族文化、坚持一律平等、交流互鉴，共同促进世界文化的繁荣。文化多样性是人类文明进步的重要动力，守住自己的根、容得下别人的不同，才是真正的文化自信。</p>
</div>
</div>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。每问先自己答一句，再看下面那句。</p>
<div class="gx-qa">

<div class="qac">
<p class="q">「文化多样性和文化有优劣，是不是一回事？」</p>
<p class="a">不是。多样性说的是文化存在的<b>丰富程度</b>，各民族文化<b>一律平等</b>，没有高低优劣。如果材料里出现「强势文化早晚取代弱势文化」，这句在教材里找不到依据；能写的是各有特色、长处、优点。</p>

<text x="120" y="27" font-size="9" text-anchor="middle" fill="#151a21">丰富 ≠ 高低</text>
<rect x="16" y="42" width="96" height="40" rx="7" fill="#ffffff" stroke="#b8e6d0"/>
<text x="64" y="60" font-size="8.2" text-anchor="middle" fill="#1e6640">各民族文化</text>
<text x="64" y="74" font-size="8" text-anchor="middle" fill="#6b7280">一律平等</text>
<rect x="128" y="42" width="96" height="40" rx="7" fill="#ffffff" stroke="#b8e6d0"/>
<text x="176" y="60" font-size="8.2" text-anchor="middle" fill="#1e6640">各有特色</text>
<text x="176" y="74" font-size="8" text-anchor="middle" fill="#6b7280">长处、优点</text>
<text x="120" y="104" font-size="7.8" text-anchor="middle" fill="#3a3a35">多样性 = 文化存在的丰富程度</text>
<text x="120" y="118" font-size="7.4" text-anchor="middle" fill="#6b7280">不是一张排名榜</text>
</svg>

<div class="qac">
<p class="q">「讲民族性，是不是就该关起门来，外来的一概不学？」</p>
<p class="a">民族性不等于封闭性。文化是民族的，又是世界的；中华文化正因为在交流中吸收有益成果，<b>包容性</b>才不断增强。关起门来只认自己，叫<b>文化封闭主义</b>，路会越走越窄。</p>

<p class="a">不是。尊重差异的前提是<b>坚持各民族平等</b>；尊重的是「不同」，不是「强加」和「歧视」。和睦相处也有原则：一边反对文化霸权主义，一边反对文化封闭主义。把尊重写成什么都行，这道题就偏了。</p>

<p class="q">「为什么说文化多样性是人类文明进步的重要动力？」</p>
<p class="a">不同文化各有长处，碰到一起会互相启发、互相借鉴，新东西就长出来了。佛教东传、丝路往来、改革开放后的交流，都是例子。只有一种声音，容易停在原地，这就是<b>重要动力</b>四个字的分量。</p>

<div class="qac">
<p class="q">「孔子学院、汉语热，是不是文化输出、文化霸权？」</p>
<p class="a">不是。文化霸权是把自己的文化<b>强加</b>给别人、不承认平等；孔子学院是教语言、办文化活动的交流平台，学生自愿来学。判断就看两条：是不是强加，是不是平等。走出去是在交流中展示魅力，不是逼别人接受。</p>

<div class="qac">
<p class="q">「只追外来文化、贬低本民族文化，错在哪？」</p>
<p class="a">错在丢了<b>精神根基</b>，属于<b>民族虚无主义</b>。开放不是把自己看轻；认同本民族文化，是尊重其他民族文化的前提。你可以喜欢外国的东西，但不能拿「洋」当尺子，量自家的一切。</p>

<p class="gx-note">六问其实是同一件事：先分清「差异」和「优劣」，再守住「认同自己」和「尊重别人」两条边，最后落到「交流互鉴」。差异、平等、认同、互鉴，四步顺了，材料题的采分点自己就排好队。顺序也别乱：平等没站稳就谈尊重，容易把强加也当成文化；认同没写好就谈开放，容易把民族虚无主义写成为国际接轨。</p>
