<div class="gx-meta">

<p class="gx-lede">你大概听过这句话：对待传统文化，要「取其精华、去其糟粕」。这句话为什么对？因为它不是把传统一脚踢开，也不是把传统整箱搬回家。它是同一次否定里做两件事：扔掉过时的，留下有用的。这一节讲的「推动认识发展」，就是把这句话背后的道理讲成课本语言：先讲辩证否定观，再讲认识要经过两次飞跃。它接在「把握辩证思维」「理解质量互变」后面，是第三单元的收口。最容易错的一件事是：把「否定」当成「消灭」。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写课本这句，不写你脑子里那句。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 辩证否定的含义<span class="q-src">人教版（2019）选择性必修3 逻辑与思维 · 第三单元第十课</span></p>
<p class="q-b">辩证的否定，是事物自身的否定，即自己否定自己，自己发展自己。辩证的否定是发展的环节，是实现新事物产生和促使旧事物灭亡的根本途径。辩证的否定是联系的环节，新事物产生于旧事物，它总是吸取、保留和改造旧事物中积极的因素作为自己存在和发展的基础。</p>
<p class="q-n">→ 翻成人话：这句里藏着<b>三个条件</b>。①否定的动力在事物内部，不是外面有人来推倒它；②它是发展的环节，否定完必须长出新东西；③它是联系的环节，新东西得从旧东西里接上。三条少一条，就不是辩证否定。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 辩证否定的实质<span class="q-src">人教版（2019）选择性必修3 逻辑与思维 · 第三单元第十课</span></p>
<p class="q-b">辩证否定的实质是「扬弃」，即新事物对旧事物既批判又继承，既克服其消极因素又保留其积极因素。克服旧事物中过时的、消极的内容，保留旧事物中积极的、合理的因素。</p>
<p class="q-n">→ 翻成人话：扬弃不是一个动作，是<b>同时做两个动作</b>。克服＝删掉过时的；保留＝留下合理的。注意「同时」两个字：不是先全扔、再挑回来，也不是一半丢一半留。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 认识发展的历程<span class="q-src">人教版（2019）选择性必修3 逻辑与思维 · 第三单元第十课</span></p>
<p class="q-b">认识的发展要经历从感性具体到思维抽象，再从思维抽象到思维具体的历程。思维具体，是在理性认识的层次上反映事物具体整体的认识，是人们在思维中把事物各方面的本质规定按照其内在联系综合起来，形成关于事物整体的本质和规律的认识。</p>
<p class="q-n">→ 翻成人话：这是<b>两段路</b>。第一段：从看得见摸得着的现象，抽出本质，得到概念和规律（思维抽象）。第二段：把抽出来的几条本质，按它们本来的关系拼回去，在脑子里还原出一个完整的整体（思维具体）。第二段不是退回第一段。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>辩证否定观</th><th>形而上学否定观</th></tr></thead>
<tbody>
<tr><td>否定的动力</td><td>事物内部的肯定因素与否定因素相互斗争，自己否定自己</td><td>外力作用，从外面把事物推倒、砸掉</td></tr>
<tr><td>否定的范围</td><td>既克服过时的消极内容，又保留积极的合理因素</td><td>否定一切，一笔勾销，什么都不留</td></tr>
<tr><td>与旧事物的联系</td><td>是联系的环节，新事物产生于旧事物</td><td>割断联系，一切从头再来</td></tr>
<tr><td>结果</td><td>新事物在旧事物的基础上产生，并高于旧事物</td><td>发展中断，只剩下一个空白的起点</td></tr>
<tr class="key"><td>真正的区别</td><td>承认否定是事物自身的否定，实质是扬弃</td><td>把否定看成外力强加的全盘抛弃</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只高亮 1 行。背法用一句话串起来：谁在否定（自身还是外力）、否定了什么（一部分还是全部）、留下什么（合理因素还是什么都不留）。考试问「区别」，就按这三问答；问「启示」，就把「扬弃」翻成做法：先分清哪些过时、哪些合理，再动手。如果题目问「为什么不能全盘否定」，答案里必须出现「联系」这个词：全盘否定割断了新旧事物之间的联系，等于让发展中断；辩证否定之所以是联系的环节，是因为新事物只能从旧事物的土壤里长出来，接不上就长不大。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 材料辨析题<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">某校讨论「还要不要传统板书」。甲说：板书是老办法，一律取消，全部换成课件。乙说：板书里一步步推导的过程要留下，但抄题太费时间，可以换成投影。结合材料，说明辩证否定观与形而上学否定观的区别，并指出甲、乙分别属于哪种否定观。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性</p>
<p class="s-b">设问要的是「区别」，不是让你背定义。先在草稿上画两栏：左边写辩证否定观，右边写形而上学否定观。再看材料，甲、乙各站一边。别急着抄课本，抄满一页也不给分。</p>
<p class="s-k">用到：辩证否定观、形而上学否定观。答题第一步永远是分清要「比」还是要「说」。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 找分歧点</p>
<p class="s-b">两栏各写三条：否定的动力（自身还是外力）、否定的范围（扬弃还是全盘）、和旧事物的联系（联系的环节还是割断联系）。这三条就是答案的骨架。三条写全，这题的分就稳了。</p>
<p class="s-k">用到：辩证否定的含义、实质是扬弃、发展与联系的环节。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 对号入座</p>
<p class="s-b">甲说「一律取消」，是一笔勾销，割断了新旧联系，属于形而上学否定观。乙说「推导过程留下、抄题换掉」，是既保留合理因素又克服过时做法，属于辩证否定观。两人都在谈板书，差别只在「留不留」。</p>
<p class="s-k">用到：扬弃＝既克服又保留。判断口诀：看有没有「留下东西」。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 分点写区别</p>
<p class="s-b">按「动力—范围—联系」三点展开，每点先写辩证否定观，再写形而上学否定观，形成对照。不要一段写完，阅卷老师按点给分。每点前面标上①②③。碰到不会写的点，也别空着，把「自身否定」「扬弃」这两个词写进去。</p>
<p class="s-k">用到：自身否定／外力否定、扬弃／全盘否定、联系环节／割断联系。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口回到材料</p>
<p class="s-b">最后一定要落回甲、乙，再补一句启示：对待传统的东西，先分清哪些过时、哪些合理，再决定留什么、改什么。缺了这句，答案就悬空。很多同学前三步都对，就差这一句材料回扣，白丢两分。</p>
<p class="s-k">用到：辩证否定观的方法论要求——不搞一刀切。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">① 否定的动力不同。辩证否定是事物自身的否定，是事物内部肯定因素与否定因素斗争的结果，即自己否定自己、自己发展自己；形而上学否定观把否定看作外力作用，是从外部强加的。<br>② 否定的内容不同。辩证否定的实质是扬弃，既克服旧事物中过时的、消极的内容，又保留其积极的、合理的因素；形而上学否定观是全盘否定，一笔勾销，什么都不留。<br>③ 与旧事物的关系不同。辩证否定是发展和联系的环节，新事物产生于旧事物，并把旧事物中的积极因素作为自己存在和发展的基础；形而上学否定观割断了新旧事物之间的联系，使发展中断。<br>④ 材料中甲的主张属于形而上学否定观，乙的主张体现了辩证否定观。这启示我们，对待传统板书这类旧事物，要分清其中过时的做法和合理的成分，克服过时的部分，保留并改造合理的部分。</p>

</div>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「辩证否定就是全盘否定吗？」</p>
<p class="a">不是。辩证否定的实质是扬弃：既克服旧事物中过时的、消极的内容，又保留其积极的、合理的因素。<b>判断的关键是有没有留下合理的因素</b>。全盘否定什么都不留，那是形而上学否定观。写答案时「克服」「保留」两个词都要出现，只写「否定」，阅卷老师会判你答的是形而上学否定观。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="全盘否定与扬弃的对比">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="22" y="30" font-size="9.6" font-weight="700" fill="#151a21">否定 ≠ 消灭</text>
<rect x="22" y="42" width="90" height="36" rx="6" fill="#fdeeee" stroke="#f0c9c9"/>
<text x="67" y="58" font-size="9" fill="#8a3b3b" text-anchor="middle">全盘否定</text>
<text x="67" y="71" font-size="8.5" fill="#8a3b3b" text-anchor="middle">什么都不留</text>
<rect x="128" y="42" width="90" height="36" rx="6" fill="#eef8f3" stroke="#b8e6d0"/>
<text x="173" y="58" font-size="9" fill="#1f6b4a" text-anchor="middle">扬弃</text>
<text x="173" y="71" font-size="8.5" fill="#1f6b4a" text-anchor="middle">克服＋保留</text>
<text x="22" y="98" font-size="8.8" fill="#3a3a35">关键是：有没有留下合理的因素</text>
<text x="22" y="114" font-size="8.8" fill="#3a3a35">全盘否定＝形而上学否定观</text>
</svg>
</div>

<div class="qac">
<p class="q">「否定是外面有人来推倒的吗？」</p>
<p class="a">不是。辩证的否定是<b>事物自身的否定</b>，动力来自事物内部肯定因素与否定因素的斗争，是自己否定自己、自己发展自己。外力只是条件，不能代替事物内部的矛盾运动。材料里如果只写「形势所迫、别人要求改」，那是把外因当成了根据，定性就偏了。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="否定的动力来自事物内部">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="22" y="30" font-size="9.6" font-weight="700" fill="#151a21">动力在哪一边</text>
<rect x="22" y="48" width="62" height="34" rx="6" fill="#fdeeee" stroke="#f0c9c9"/>
<text x="53" y="69" font-size="9" fill="#8a3b3b" text-anchor="middle">外力</text>
<text x="105" y="70" font-size="11" fill="#b04b4b" text-anchor="middle">✗</text>
<rect x="128" y="48" width="90" height="34" rx="6" fill="#eef8f3" stroke="#b8e6d0"/>
<text x="173" y="62" font-size="8.8" fill="#1f6b4a" text-anchor="middle">内部矛盾斗争</text>
<text x="173" y="75" font-size="8.8" fill="#1f6b4a" text-anchor="middle">自己否定自己</text>
<text x="22" y="102" font-size="8.8" fill="#3a3a35">外力只起条件作用，不能替代</text>
<text x="22" y="118" font-size="8.8" fill="#3a3a35">答题写「自身的否定」四个字</text>
</svg>
</div>

<div class="qac">
<p class="q">「扬弃是不是丢掉一半、留一半？」</p>
<p class="a">不是。「对半分」是数量上的切割，扬弃是<b>性质上的取舍</b>：过时的、消极的就克服，积极的、合理的就保留，两个动作在同一次否定里完成，不是先全扔再挑回来。判断时看材料有没有按「性质」来说，只写「取一半、舍一半」的一定不是扬弃。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="扬弃是按性质取舍而不是对半分">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="22" y="30" font-size="9.6" font-weight="700" fill="#151a21">扬弃不是对半分</text>
<rect x="22" y="44" width="196" height="26" rx="5" fill="#fdeeee" stroke="#f0c9c9"/>
<text x="32" y="62" font-size="8.8" fill="#8a3b3b">一半砍掉、一半留下（错）</text>
<text x="22" y="92" font-size="9" font-weight="700" fill="#1f6b4a">正解：按性质取舍</text>
<text x="22" y="110" font-size="8.8" fill="#3a3a35">过时的→克服；合理的→保留</text>
</svg>
</div>

<div class="qac">
<p class="q">「思维具体是不是回到感性具体？」</p>
<p class="a">不是。感性具体是现象层面的完整，靠感官就能拿到；思维具体是<b>理性认识层次上</b>的具体整体，是许多本质规定的综合。它看起来也「完整」，但层次高了一级。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="思维具体比感性具体高一个层次">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="22" y="28" font-size="9.6" font-weight="700" fill="#151a21">级别：从低到高</text>
<rect x="24" y="86" width="60" height="24" rx="5" fill="#ffffff" stroke="#c9d7e2"/>
<text x="54" y="102" font-size="8.4" fill="#3a3a35" text-anchor="middle">感性具体</text>
<rect x="100" y="62" width="60" height="24" rx="5" fill="#ffffff" stroke="#c9d7e2"/>
<text x="130" y="78" font-size="8.4" fill="#3a3a35" text-anchor="middle">思维抽象</text>
<rect x="164" y="40" width="64" height="24" rx="5" fill="#eef8f3" stroke="#b8e6d0"/>
<text x="196" y="56" font-size="8.4" fill="#1f6b4a" text-anchor="middle">思维具体</text>
<text x="22" y="122" font-size="8.6" fill="#3a3a35">不是退回去，是升上去再综合</text>
</svg>
</div>

<div class="qac">
<p class="q">「两次飞跃走完，认识就到头了吗？」</p>
<p class="a">没有。认识具有反复性和无限性：一个正确认识往往要经过实践、认识、再实践、再认识的多次反复；实践在向前发展，认识就必须不断推移。所以思维具体只是<b>一个阶段的成果</b>，不是终点。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="认识在反复中不断上升">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="22" y="28" font-size="9.6" font-weight="700" fill="#151a21">走完两步，还要再走</text>
<text x="22" y="50" font-size="8.8" fill="#3a3a35">实践→认识→再实践→再认识</text>
<path d="M40 92 C70 66 100 108 130 82 C160 58 190 82 206 70" fill="none" stroke="#8aa6bb" stroke-width="1.3"/>
<text x="22" y="114" font-size="8.8" fill="#3a3a35">每一圈都比上一圈更深</text>
</svg>
</div>

<div class="qac">
<p class="q">「为什么不从现象直接跳到整体认识？」</p>
<p class="a">因为现象是杂乱的、个别的。不先抽象，就抓不住本质，所谓「整体」只是把现象重述一遍。必须先抽出本质规定，再按内在联系综合，才能得到<b>有根据的整体</b>。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="两步走和一步到位的对比">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="22" y="28" font-size="9.6" font-weight="700" fill="#151a21">为什么不能一步到位</text>
<rect x="22" y="42" width="196" height="26" rx="5" fill="#fdeeee" stroke="#f0c9c9"/>
<text x="32" y="60" font-size="8.8" fill="#8a3b3b">一步：现象→整体（错）</text>
<rect x="22" y="74" width="196" height="26" rx="5" fill="#eef8f3" stroke="#b8e6d0"/>
<text x="32" y="92" font-size="8.8" fill="#1f6b4a">两步：现象→本质→整体（对）</text>
<text x="22" y="116" font-size="8.6" fill="#3a3a35">少了抽象，整体只是现象的重述</text>
</svg>
</div>
</div>
<p class="gx-note">收尾点明：这六问其实是同一件事。前三问都在问「否定里到底留没留下东西」，后三问都在问「认识有没有停在半路」。答题时只要抓住这两个问句，就能自己把答案推出来，不必死背六段话。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 辩证否定就是全盘否定，旧的东西要全部推翻。</p>
<p class="er-v">✓ 辩证否定的实质是扬弃，即既克服旧事物中过时的、消极的内容，又保留其积极的、合理的因素。</p>
<p class="er-w">错在哪：把「否定」当成「消灭」。否定在这里是发展的一步，不是把事物按死；写「全部推翻」直接掉进形而上学否定观。</p>
</div>
<div class="er">
<p class="er-x">✗ 否定是外部力量推动的，是新事物从外面把旧事物推倒。</p>
<p class="er-v">✓ 辩证的否定是事物自身的否定，是事物内部肯定因素与否定因素相互斗争的结果，即自己否定自己、自己发展自己。</p>
<p class="er-w">错在哪：把动力放到了外面。外因只是条件，内因才是根据；这一条几乎每年都以选择题的形式出现。</p>
</div>
<div class="er">
<p class="er-x">✗ 扬弃就是把旧事物砍掉一半、留下一半。</p>
<p class="er-v">✓ 扬弃是既克服又保留：克服过时的、消极的东西，保留积极的、合理的东西，两个动作在同一次否定中完成。</p>
<p class="er-w">错在哪：把性质上的取舍换成了数量上的对半分。按「一半」来切，切出来的既不是精华也不是糟粕。</p>
</div>
<div class="er">
<p class="er-x">✗ 新事物和旧事物没有关系，是从天上掉下来的。</p>
<p class="er-v">✓ 辩证的否定是联系的环节，新事物产生于旧事物，它总是吸取、保留和改造旧事物中积极的因素作为自己存在和发展的基础。</p>
<p class="er-w">错在哪：只记住「否定」，忘了「联系」。课本给否定的两个身份是「发展的环节」和「联系的环节」，少写一个就少一半分。</p>
</div>
<div class="er">
<p class="er-x">✗ 思维具体就是回到感性具体，把现象再完整地描述一遍。</p>
<p class="er-v">✓ 思维具体是在理性认识的层次上反映事物具体整体的认识，是许多本质规定的综合，比感性具体高一个层次。</p>
<p class="er-w">错在哪：把两次飞跃的方向搞混了。第二段是往上综合，不是往下退回；描述现象那是第一段的起点。</p>
</div>
<div class="er">
<p class="er-x">✗ 从感性具体上升到思维抽象，认识就完成了。</p>
<p class="er-v">✓ 认识还要从思维抽象上升到思维具体，只有把各方面的本质规定按内在联系综合起来，才能形成关于事物整体的本质和规律的认识。</p>
<p class="er-w">错在哪：停在第一次飞跃。思维抽象是「深刻但不完整」，缺了第二次飞跃，答案就缺一个层次。</p>
</div>
<div class="er">
<p class="er-x">✗ 认识实践一次就能得到真理，反复是因为人不够聪明。</p>
<p class="er-v">✓ 认识具有反复性和无限性，一个正确认识往往要经过实践、认识、再实践、再认识的多次反复；实践不断发展，认识也要不断向前推移。</p>
<p class="er-w">错在哪：把客观规律说成了主观失误。反复不是谁笨，是主客观条件限制和事物本质逐渐暴露的必然结果。</p>
</div>
