<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 近代中国的社会性质<span class="q-src">人教版（2019）必修1 中国特色社会主义 · 第二课第一框</span></p>
<p class="q-b">鸦片战争后，中国逐步成为半殖民地半封建社会，陷入内忧外患的黑暗境地。</p>
<p class="q-n">→ 翻成人话：这句话有<b>三个条件</b>——① 时间起点是<b>鸦片战争后</b>（1840 年）；② 社会性质是<b>半殖民地半封建社会</b>（两个「半」缺一不可，不是「殖民地」，也不是「封建社会」）；③ 状态是<b>内忧外患</b>。少写「半殖民地」就丢了主权受损这一层，少写「半封建」就丢了封建剥削仍在这一层。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 开端与建党<span class="q-src">人教版（2019）必修1 中国特色社会主义 · 第二课第一框</span></p>
<p class="q-b">1919 年五四运动，标志着新民主主义革命的开端；1921 年中国共产党成立，中国革命的面貌焕然一新。</p>
<p class="q-n">→ 翻成人话：这句话是<b>两个年份、两件事、两个标志</b>——1919 管「开端」，1921 管「焕然一新」。<b>开端在五四，不在建党</b>；建党是把「开端」变成「有组织、有纲领的领导」，不是重新开始。把两个标志对调，就是本节第一号扣分点。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 胜利的标志<span class="q-src">人教版（2019）必修1 中国特色社会主义 · 第二课第一框</span></p>
<p class="q-b">1949 年中华人民共和国成立，标志着新民主主义革命取得基本胜利。</p>
<p class="q-n">→ 翻成人话：这句话的落点是<b>「新民主主义革命」胜利</b>，不是「社会主义革命」完成。1949 年建立的是人民民主专政的中华人民共和国，社会主义制度确立要到 <b>1956 年三大改造基本完成</b>。两个年份分工：1949 解决「谁掌权」，1956 解决「什么制度」。</p>
</div>

<div style="overflow-x:auto">

<tr class="key"><td>1919</td><td>五四运动</td><td>新民主主义革命的开端</td><td>「中国共产党成立」</td></tr>
<tr><td>1921</td><td>中国共产党成立</td><td>中国革命的面貌焕然一新</td><td>「新民主主义革命的开端」</td></tr>
<tr><td>1949</td><td>中华人民共和国成立</td><td>新民主主义革命取得基本胜利</td><td>「社会主义制度确立」</td></tr>
<tr><td>1956</td><td>三大改造基本完成</td><td>社会主义制度在我国确立</td><td>「新民主主义革命胜利」</td></tr>

<p class="gx-note">整张表只高亮 1919 那一行，因为它是本节唯一一个「换了领导阶级」的年份。背法：<b>1840 变性质、1919 换领导、1921 有政党、1949 夺政权、1956 定制度</b>——五个动词各管一件事，不要串行。</p>

<ol class="steps" id="gxSteps">

<p class="s-b">题目问的是「开端」的理由，不是「五四运动的意义大全」。所以答案的骨架必须是：<b>什么东西变了，才叫「开端」</b>。变的是领导阶级，不是年份本身。</p>
<p class="s-k">用到：新民主主义革命的含义（无产阶级领导的、反帝反封建的革命）。</p>

<p class="s-h">第 2 步 · 找第一个理由：领导阶级换人</p>
<p class="s-b">五四运动中，工人阶级举行罢工、登上政治舞台，成为运动的<b>主力</b>。此前旧民主主义革命由资产阶级领导，此后由无产阶级领导——领导阶级一变，革命的性质阶段就变了。这是「开端」最硬的依据。</p>
<p class="s-k">用到：新旧民主主义革命的根本区别 = 领导阶级不同。</p>

<p class="s-b">五四运动促进了<b>马克思主义在中国的传播</b>，一批先进知识分子开始用马克思主义观察国家命运。革命要有科学理论指导，这一步是旧民主主义革命没有的。</p>
<p class="s-k">用到：新民主主义革命的指导思想是马克思列宁主义。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 找第三个理由：组织准备（接住 1921）</p>
<p class="s-b">五四运动为中国共产党的成立作了<b>思想上干部上的准备</b>。所以顺序是：1919 开端 → 1921 建党使面貌焕然一新。答题时若把 1921 写成「开端」，就把「准备」当成了「开始」。</p>

<p class="s-b">三句话收束：领导阶级变了（无产阶级）、指导思想变了（马克思主义）、组织力量变了（准备建党）。三个「变」合起来，才叫新民主主义革命的开端；只说「群众参与广」不够。</p>
<p class="s-k">用到：开端 = 领导阶级 + 指导思想 + 组织准备三件事同时变。</p>

<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 五四运动是中国共产党领导的。</p>
<p class="er-v">✓ 1919 年五四运动标志着新民主主义革命的开端；五四运动中工人阶级登上政治舞台，成为运动的主力。</p>
<p class="er-w">错在哪：1919 年中国共产党还没成立（1921 年建党），时间上不可能。五四运动是先进知识分子发动、工人阶级登上政治舞台的爱国运动。</p>
</div>
<div class="er">
<p class="er-x">✗ 新民主主义革命是由资产阶级领导的。</p>
<p class="er-v">✓ 新民主主义革命的领导阶级是无产阶级，这是新旧民主主义革命的根本区别。</p>
<p class="er-w">错在哪：领导资产阶级的是旧民主主义革命（1840—1919）。新民主主义革命之所以「新」，就在领导阶级换成无产阶级，前途因此是社会主义。</p>
</div>
<div class="er">
<p class="er-x">✗ 1949 年新中国成立，标志着社会主义制度在我国确立。</p>
<p class="er-v">✓ 1949 年中华人民共和国成立，标志着新民主主义革命取得基本胜利；1956 年三大改造基本完成，标志着社会主义制度在我国确立。</p>
<p class="er-w">错在哪：把「革命胜利」和「制度确立」压成一年。1949 年建立的是人民民主专政的国家，社会主义制度的确立要经过三大改造。</p>
</div>
<div class="er">
<p class="er-x">✗ 旧民主主义革命和新民主主义革命性质相同，所以没有本质区别。</p>
<p class="er-v">✓ 两者性质相同，都是反帝反封建的资产阶级民主革命；但领导阶级不同，因而革命前途不同，这是本质区别。</p>
<p class="er-w">错在哪：「性质相同」推不出「没有区别」。性质相同恰恰是要提醒你：区别不在性质，在领导阶级和前途。</p>
</div>
<div class="er">
<p class="er-x">✗ 资本主义道路在中国没试过，所以不知道行不行。</p>
<p class="er-v">✓ 戊戌变法、辛亥革命都是走资本主义道路的尝试，都失败了，说明资本主义道路在中国走不通。</p>
<p class="er-w">错在哪：不是「没试过」而是「试过且失败」。答题要点是失败的原因：帝国主义不允许、资产阶级软弱动摇。</p>
</div>
<div class="er">
<p class="er-x">✗ 压在中国人民头上的三座大山，指的是封建主义这一座。</p>
<p class="er-v">✓ 三座大山指帝国主义、封建主义、官僚资本主义。</p>
<p class="er-w">错在哪：只数了一山。三座大山对应两对主要矛盾加官僚资本，缺一个都不完整。</p>
</div>
<div class="er">
<p class="er-x">✗ 1921 年中国共产党成立，标志着新民主主义革命的开端。</p>
<p class="er-v">✓ 1919 年五四运动标志着新民主主义革命的开端；1921 年中国共产党成立，中国革命的面貌焕然一新。</p>
<p class="er-w">错在哪：两个标志对调，是本框最高频的失分点。口诀：<b>1919 开端，1921 焕然一新</b>。</p>
</div>
