<p class="gx-claim">高质量发展不是不要速度，而是<b>换发动机</b>：从靠人力、土地、能源的粗放型增长，转到靠技术、靠品牌、靠效率，着力点放在<b>实体经济</b>上，方向是往微笑曲线的两端走。</p>
<div class="gx-meta">
<span><i></i>人教版（2019）必修2 经济与社会 · 第三课第二框</span>
<span><i></i>高一 · 第三课 我国的经济发展</span>
<span><i></i>阅读 14 分钟</span>
<span><i></i>含 1 个互动模型</span>
</div>
<p class="gx-lede">这一节回答的是「经济往哪走」：上一框讲新发展理念，是「怎么想」；这一框讲高质量发展，是「怎么做」。先给你一个画面：同样一双运动鞋，代工厂做完只赚几块钱，贴上牌子、加上研发，能卖几百上千。钱被谁赚走了？答案藏在「微笑曲线」里。最容易错的一件事，是把高质量发展理解成「不要速度」。它换的是发动机，不是把车停下。这一框的名词多，但主线只有一条：换发动机。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 首要任务<span class="q-src">人教版（2019）必修2 经济与社会 · 第三课第二框</span></p>
<p class="q-b">高质量发展是全面建设社会主义现代化国家的首要任务。</p>
<p class="q-n">→ 翻成人话：这句话就两层。<b>第一层</b>，高质量发展和「全面建设社会主义现代化国家」绑在一起，是总任务下面的头等事。<b>第二层</b>，「首要」两个字不能改成「重要」，一改就降级，选择题常在这里挖坑。写大题时把这句放在第一行。还要记住：是「首要任务」，不是「唯一任务」，共同富裕、国家安全同样是任务。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 着力点<span class="q-src">人教版（2019）必修2 经济与社会 · 第三课第二框</span></p>
<p class="q-b">建设现代化产业体系，坚持把发展经济的着力点放在实体经济上。</p>
<p class="q-n">→ 这句话有三个条件，少一个就答不全：<b>①</b>要建设现代化产业体系，不是只盯着某一个厂；<b>②</b>着力点是实体经济，制造业、农业、实实在在的服务业都算；<b>③</b>不是「虚拟经济不重要」，而是不能脱实向虚。第三点最容易丢，一丢就被扣「表述片面」。答大题时两句连着写：「建设现代化产业体系」+「着力点放在实体经济上」。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 新发展格局<span class="q-src">人教版（2019）必修2 经济与社会 · 第三课第二框</span></p>
<p class="q-b">加快构建以国内大循环为主体、国内国际双循环相互促进的新发展格局。</p>
<p class="q-n">→ 这半句是<b>两个分句</b>，缺一不可：<b>①</b>国内大循环为主体，意思是饭碗主要端在自己手里，国内市场是主引擎；<b>②</b>国内国际双循环相互促进，意思是门不关，还要开得更大。只写前半句，就成了「闭关锁国」；只写后半句，就丢了「主体」。为什么强调国内？十四亿人的市场是最大底气；为什么还要国际？技术和市场不能关起门来造。顺序别倒：先「主体」，后「相互促进」。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>粗放型增长（旧）</th><th>高质量发展（新）</th></tr></thead>
<tbody>
<tr><td>追求什么</td><td>速度、规模、GDP 数字好看</td><td>质量第一、效益优先，速度在合理区间</td></tr>
<tr><td>靠什么</td><td>多投人、多占地、多耗能</td><td>创新、技术、品牌、效率</td></tr>
<tr><td>代价与后劲</td><td>高耗能、高污染、利润薄，十年后产能过剩</td><td>绿色、协调、可持续，技术和品牌留得住</td></tr>
<tr><td>怎么衡量</td><td>基本只看增速</td><td>创新、协调、绿色、开放、共享</td></tr>
<tr><td>谁受益</td><td>先看产量和投资数字</td><td>看就业、收入、环境和公共服务</td></tr>
<tr><td>典型画面</td><td>多开一条线、多招一批人</td><td>同样一条线，良品率更高、用人更少</td></tr>
<tr><td>政策抓手</td><td>上项目、铺摊子、拼优惠</td><td>抓创新、强实体、畅循环</td></tr>
<tr><td>风险在哪</td><td>订单一走，机器就闲</td><td>技术和品牌在手，订单能换</td></tr>
<tr class="key"><td>真正的区别</td><td>继续踩油门：加人、加地、加能耗</td><td>换发动机：靠技术、靠品牌、靠效率</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">背法：把三句课本原话串成一条线——首要任务（为什么干）→ 着力点实体经济（往哪干）→ 新发展格局（在多大地盘上干）。三条串起来，大题的结构就有了。问「为什么」，先写首要任务；问「怎么做」，从着力点往下写。背的时候先背最后那一行：换发动机，不换车。</p>
</section>

<section class="gx-sec" id="b">
<h2><span class="sn">02</span>拆开看</h2>
<p class="gx-h2s">四张图：各讲一件事，按「是什么 → 怎么变 → 怎么用」排。</p>

<figure class="gx-fig">
<div class="fig-cap">
<span class="fig-no">图 1</span><span class="fig-t">高质量发展的三个转变</span>
<span class="bdg bdg-must">必考</span>
</div>
<p class="fig-s">先看三个小标题：转方式、优结构、换动力。转方式是从粗放走向集约，优结构是从低端走向中高端，换动力是从要素驱动走向创新驱动。它们说的是同一件事——不再靠多投人、多占地、多耗能，而是靠效率和技术。答题时三个词能一起出现，就别只写一个。三个里面「换动力」最常考，因为它最容易写成空话。</p>

<text x="54" y="84" font-size="11" font-weight="700" fill="#1d7a5a">① 转方式</text>
<text x="54" y="106" font-size="9.4" fill="#3a3a35">粗放型 → 集约型</text>
<text x="54" y="124" font-size="9.4" fill="#3a3a35">少占地、少耗能、少污染</text>
<text x="54" y="142" font-size="9.4" fill="#3a3a35">同样的投入，产出更多</text>
<text x="54" y="168" font-size="9.2" fill="#6b7280">关键词：集约</text>

<text x="558" y="106" font-size="9.4" fill="#3a3a35">要素驱动 → 创新驱动</text>
<text x="558" y="124" font-size="9.4" fill="#3a3a35">靠技术、靠人才</text>
<text x="558" y="142" font-size="9.4" fill="#3a3a35">不靠堆人力堆资源</text>
<text x="558" y="168" font-size="9.2" fill="#6b7280">关键词：创新</text>
<text x="558" y="188" font-size="9.2" fill="#6b7280">例子：一条线少用一半人</text>
<text x="36" y="232" font-size="9.6" fill="#151a21">三个转变指向同一件事：从「多投入」转向「提效率」。</text>
</svg>
<span class="gx-zoomchip">点击放大</span>
</div>
<p class="gx-take">判断句：写「推动高质量发展」，落到转方式、优结构、换动力里的至少一个，才不是空喊口号。</p>
<p class="gx-note">口径：三个转变转的是发展方式，不是把发展停下来。「集约」是相对「粗放」说的，考的正是这一对。注意「换动力」不是「不要劳动力」：人还要，只是从拼数量变成拼技能。记法：方式、结构、动力，对着「怎么干、干什么、靠什么」。</p>

<li class="step">
<p class="s-h">第 1 步 · 审题：锁定知识点</p>

<li class="step" hidden>
<p class="s-h">第 2 步 · 定性：先判断问题出在哪</p>
<p class="s-b">一双鞋只赚 5 元，说明这家厂卡在微笑曲线的谷底：只做组装制造，附加值最低。组装环节门槛低、可替代性强，所以利润越压越薄。这一步不用写满，但要点出「附加值低」四个字。为什么可替代性强？因为会做鞋的厂太多，品牌方随时能换一家。</p>

<li class="step" hidden>
<p class="s-h">第 3 步 · 建议一：往研发端走</p>
<p class="s-b">往左端延伸：加大研发投入，掌握关键核心技术，做自己的设计、自己的标准，逐步建自主品牌。这一步的关键词是「创新驱动」和「掌握核心技术」，不能只写「多投钱」。研发不一定是造芯片：鞋的缓震材料、鞋楦数据、生产线自动化，都算研发。写到「核心技术」四个字，术语就到位了。</p>
<p class="s-k">用到：换动力、创新驱动、自主品牌。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 建议二：往品牌服务端走</p>
<p class="s-b">往右端延伸：把设计、营销、渠道、售后服务做起来，从「替别人做」变成「卖自己的牌子」。附加值高不高，很多时候不看车间，看牌子。两条建议一左一右，正好对应微笑曲线的两端。品牌也不是只投广告：渠道、售后、用户体验，都是品牌服务。</p>
<p class="s-k">用到：品牌服务、附加值、产业升级。</p>

<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 高质量发展就是不要速度，越慢越好。</p>
<p class="er-v">✓ 高质量发展是质量第一、效益优先，保持合理速度。</p>
<p class="er-w">错在哪：把「不唯速度」读成「不要速度」，把手段当成了目的。课本原话是质量第一、效益优先。说「越慢越好」，等于把高质量发展当成不发展了。</p>
</div>
<div class="er">
<p class="er-x">✗ 发展实体经济，就是不要互联网、不要金融。</p>
<p class="er-v">✓ 实体经济是根基，虚拟经济要服务实体经济，不能脱实向虚。</p>
<p class="er-w">错在哪：把「着力点」读成「只留一个」，把「不能脱实向虚」读成「取消虚拟经济」。着力点是重点，不是唯一。真正要防的是脱实向虚。</p>
</div>
<div class="er">
<p class="er-x">✗ 乡村振兴就是让农民回去种地。</p>
<p class="er-v">✓ 乡村振兴是产业、人才、文化、生态、组织全面振兴。</p>
<p class="er-w">错在哪：把「振兴」缩成「种地」，丢掉了非农产业和公共服务。种地只是产业振兴里的一项。农民也可以搞加工、搞旅游、搞电商。</p>
</div>
<div class="er">
<p class="er-x">✗ 区域协调就是东部补贴西部，大家搞平均。</p>
<p class="er-v">✓ 区域协调是发挥各地比较优势、协调发展。</p>
<p class="er-w">错在哪：把「协调」当成「平均」，忽略了分工和效率。协调讲分工，不讲平均。把东部的家底全搬走，反而不协调。</p>
</div>
<div class="er">
<p class="er-x">✗ 新发展格局就是闭关锁国，只靠内需。</p>
<p class="er-v">✓ 以国内大循环为主体，国内国际双循环相互促进。</p>
<p class="er-w">错在哪：丢掉「相互促进」这半句，把「主体」写成「唯一」。主体不是唯一，开放没有取消。「为主体」说的是比重，不是排他。</p>
</div>
<div class="er">
<p class="er-x">✗ 高质量发展只是企业的事，跟我一个学生无关。</p>
<p class="er-v">✓ 高质量发展连着就业、收入、环境、公共服务，人人相关。</p>
<p class="er-w">错在哪：把宏观任务看成了别人的事，答「意义」题时无话可写。就业和收入，就是它跟你的关系。以后找工作、看工资，都在这条线上。</p>
</div>
<div class="er">
<p class="er-x">✗ 只要 GDP 增长，就是高质量发展。</p>
<p class="er-v">✓ 还要看创新、协调、绿色、开放、共享，看质量效益。</p>
<p class="er-w">错在哪：用一个数字代替五个维度，正是课本要纠正的旧观念。GDP 是结果之一，不是全部。题里出现「只要……就……」，多半是错的。</p>
