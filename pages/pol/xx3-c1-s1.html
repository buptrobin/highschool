<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写课本这句，不写你脑子里那句。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 思维是什么<span class="q-src">人教版（2019）选择性必修3 逻辑与思维 · 第一单元第一课</span></p>
<p class="q-b">思维是人脑对客观事物的反映。这种反映是间接的、概括的。思维在实践中产生，在实践中发展，又反作用于实践。</p>
<p class="q-n">→ 翻成人话：这句话里藏着三个条件。①反映者是人脑，不是电脑，也不是运气；②反映方式是间接、概括，不是照镜子那样原样复刻；③原料来自实践，不是天生自带。少掉第③条，思维就变成了凭空的想象。换个说法更好记：思维是一件要本钱的手艺，本钱就是平时攒下的知识和经验。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 三个特征<span class="q-src">人教版（2019）选择性必修3 逻辑与思维 · 第一单元第一课</span></p>
<p class="q-b">思维具有间接性、概括性和能动性。思维的间接性，是指思维能够凭借已有的知识和经验，对没有直接作用于感觉器官的事物及其属性或联系加以反映。</p>
<p class="q-n">→ 翻成人话：判断「间接性」，只认两个关键词。「凭借已有的知识和经验」——推断得有依据；「没有直接作用于感觉器官」——人不在现场，也能知道现场发生了什么。两个条件同时满足，才叫间接性。少一个都不算：只说「人不在现场」，那是想象；只说「有经验」，那是回忆。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 两种形态<span class="q-src">人教版（2019）选择性必修3 逻辑与思维 · 第一单元第一课</span></p>
<p class="q-b">根据思维运行的基本单元的不同，思维可以分为形象思维和抽象思维。形象思维以感性形象作为思维的基本单元，抽象思维以概念、判断和推理作为思维的基本形式。</p>
<p class="q-n">→ 翻成人话：分类标准只有一个——「基本单元」。形象思维拿画面、场景当零件，抽象思维拿概念当零件。标准一换，结论就换；所以别拿「难不难」「高不高级」当尺子。考场上只问一句：这段材料运行的零件是什么。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>形象思维</th><th>抽象思维（逻辑思维）</th></tr></thead>
<tbody>
<tr><td>基本单元</td><td>感性形象：画面、声音、场景</td><td>概念：词、术语、定义</td></tr>
<tr><td>主要形式</td><td>联想、想象</td><td>概念、判断、推理</td></tr>
<tr><td>典型场景</td><td>诗人用月亮写思乡，画家先构图</td><td>数学证明，法律条文推理</td></tr>
<tr><td>常见设问</td><td>这句诗、这幅画用了哪种思维</td><td>这个结论是怎么一步步推出来的</td></tr>
<tr><td>考场陷阱</td><td>说成「低级的思维」</td><td>说成「不靠材料，凭空推理」</td></tr>
<tr class="key"><td>真正的区别</td><td>拿画面、场景当零件，判断仍要回到事实里核对</td><td>拿概念、判断、推理当零件，每一步都要有依据</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只高亮一行：区别在「基本单元」，不在「谁更高级」。选择题最爱把「抽象思维比形象思维高级」写成选项，这句话是错的——课本只承认形态不同、各有作用。判断时先数零件：出现画面、声音、场景，先想形象思维；出现定义、公式、定理，先想抽象思维。两边都出现，就写「以某种为主，又借助另一种」。表里每一行都能单独变成一道选择题，按行背，别按词背。</p>
</section>

<h2><span class="sn">03</span>自己点一下<span class="bdg bdg-key">A 级</span></h2>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 说明思维的特征<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">农技员老周没有下田，只看了农户发来的几张照片：叶片发黄，叶背有斑点。他判断这块地得了某种病害，随后算出用药量、画出施药路线。第二天他按图指导农户打药，一周后叶片转绿。结合材料，说明思维的特征。（12 分）</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性</p>
<p class="s-b">设问问「特征」，不是问「形态」。答法固定：一条特征，一条含义，一句材料。不用写形象思维、抽象思维。三句话就是三行字，别挤成一大段。</p>
<p class="s-k">用到：思维的特征（间接性、概括性、能动性）。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 找主体</p>
<p class="s-b">谁在想？老周，一个人。思维的主体是人脑，不是照片，也不是手机。这一句别写进答案，但心里要有。主体判断错了，后面全跑偏。</p>
<p class="s-k">用到：思维是人脑对客观事物的反映。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 找行为</p>
<p class="s-b">三个动作：看照片下判断、把病叶归成一类病、算用量画路线去指导打药。三个动作，正好对上三条特征。材料分层是这道题的真功夫。</p>
<p class="s-k">用到：材料分层，一句对一条。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 对应原理</p>
<p class="s-b">没下田却知道田里的事，是间接性。由几片病叶推出「这一类病」，是概括性。先算再画、指导打药并见效，是能动性。三句话各贴一段材料，顺序别打乱。</p>
<p class="s-k">用到：间接性、概括性、能动性各自的判据。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口</p>
<p class="s-b">分点写，每点「特征 + 含义 + 材料」。最后加一句：思维在实践中产生，又反作用于实践。收口句别省，它常常是最后 1 分。</p>
<p class="s-k">用到：实践与思维的关系。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">①思维具有间接性。思维能够凭借已有的知识和经验，对没有直接作用于感觉器官的事物及其属性加以反映。老周没有下田，凭照片和植保经验判断出病害。<br>②思维具有概括性。思维把一类事物共同的、本质的属性抽取出来加以反映。老周把叶片发黄、叶背斑点这些个别现象，归入「某种病害」这一类。<br>③思维具有能动性。思维能够指导实践，把观念的东西变成现实。老周算出用药量、画出施药路线并指导打药，一周后叶片转绿。<br>④可见，思维在实践中产生，在实践中发展，又反作用于实践。<br>⑤写法提醒：每条先用一句话给特征下判断，再抄含义，最后用材料里的原词——照片、用药量、施药路线、叶片转绿，不要换成同义词。三条特征按固定顺序写，阅卷老师找得快，你也不容易漏点。</p>
</div>
<p class="gx-note">这道题的变形只有三种：材料换成诗人写诗，答形象思维；换成医生看片，答两种形态接力；换成「老周为什么不下田也能知道」，答间接性。题干一变，第 1 步的定性就变，后面四步照走。阅卷老师看的是分点，不是文采，三条写清就够。</p>
</div>
</section>
<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「思维是脑子里自动冒出来的想法吧？」</p>
<p class="a">不是。思维在实践中产生，原料是客观事物。<b>判据：离开实践，思维就没有对象</b>；凭空出现的那叫空想，不叫思维。你在考场上做的每一次推理，用的都是平时做题、看新闻攒下的经验。</p>

<text x="120" y="82" font-size="8.4" text-anchor="middle" fill="#3a3a35">来源在实践，不在天生</text>

<div class="qac">
<p class="q">「间接性不就是猜吗？猜对了就是间接性。」</p>
<p class="a">不是。间接性<b>凭借已有的知识和经验</b>去反映没有直接感知的事物，推断有依据、能说清；瞎猜没有依据，也说不清。题目常把「凭经验推断」写成「主观猜测」，两个字之差，答案就反了。</p>

<text x="172" y="46" font-size="8.8" text-anchor="middle" fill="#a33f3f">瞎猜</text>
<text x="172" y="60" font-size="8.2" text-anchor="middle" fill="#3a3a35">没有依据</text>
<text x="120" y="92" font-size="8.4" text-anchor="middle" fill="#3a3a35">有依据 ≠ 没依据</text>
</svg>
</div>

<div class="qac">
<p class="q">「概括性就是把很多个别的东西加起来吧？」</p>
<p class="a">不是简单相加。概括性要<b>抽出一类事物共同的、本质的属性</b>；只把东西堆在一起，得到的是清单，不是概念。苹果、梨、桃的共同本质是「可食用的果实」，「水果」这个说法才立得住。</p>

<p class="q">「形象思维和抽象思维，哪个更高级？」</p>

<rect x="134" y="24" width="84" height="38" rx="6" fill="#ffffff" stroke="#cbd6df"/>
<text x="176" y="42" font-size="8.6" text-anchor="middle" fill="#3a3a35">抽象思维</text>
<text x="176" y="55" font-size="8" text-anchor="middle" fill="#3a3a35">概念</text>
<text x="120" y="82" font-size="8.4" text-anchor="middle" fill="#3a3a35">两种形态，不分高低</text>

<p class="q">「诗人用月亮写思乡，这是抽象思维吧？」</p>
<p class="a">不是，是形象思维。形象思维以<b>感性形象</b>为基本单元，靠联想和想象；抽象思维才拿概念、判断、推理当零件。判断只看零件：画面、声音、场景是形象，定义、公式、定理是抽象。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="月亮作为感性形象的示意图">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<circle cx="56" cy="48" r="16" fill="#fdf6ec" stroke="#e8d3ad"/>
<text x="56" y="52" font-size="8.6" text-anchor="middle" fill="#8a6a2f">月亮</text>
<text x="150" y="44" font-size="8.6" text-anchor="middle" fill="#3a3a35">画面，不是定义</text>
<text x="150" y="58" font-size="8.6" text-anchor="middle" fill="#3a3a35">靠联想和想象</text>
<text x="120" y="92" font-size="8.4" text-anchor="middle" fill="#3a3a35">以感性形象为基本单元</text>
</svg>
</div>

<div class="qac">
<p class="q">「答『思维的特征』，写出三个词就够了吧？」</p>
<p class="a">不够。每条要<b>含义 + 材料</b>。只写「间接性、概括性、能动性」，等于把得分点写成了标题，分析分全丢。格式记牢：特征一句话，含义一句话，材料一句话，三行一条。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="特征题的三个得分部分组成示意图">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<rect x="24" y="26" width="60" height="26" rx="6" fill="#eef7f1" stroke="#b8e6d0"/>
<text x="54" y="43" font-size="8.4" text-anchor="middle" fill="#1f6b4a">特征</text>
<rect x="90" y="26" width="60" height="26" rx="6" fill="#ffffff" stroke="#cbd6df"/>
<text x="120" y="43" font-size="8.4" text-anchor="middle" fill="#3a3a35">含义</text>
<rect x="156" y="26" width="60" height="26" rx="6" fill="#ffffff" stroke="#cbd6df"/>
<text x="186" y="43" font-size="8.4" text-anchor="middle" fill="#3a3a35">材料</text>
<text x="120" y="76" font-size="8.4" text-anchor="middle" fill="#3a3a35">三块缺一块，就是半句话</text>
<text x="120" y="94" font-size="8.4" text-anchor="middle" fill="#3a3a35">按特征分点，不按材料顺序分点</text>
</svg>
</div>
</div>
<p class="gx-note">六问其实是同一件事：都在问「你这个判断凭什么」。判据找到了，来源、特征、形态就不会互相串；判据找不到，背再多术语也只是名词堆。这六问换个材料、换个问法还会再出现，判据不变。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 思维是人脑对客观事物的直接反映。</p>
<p class="er-v">✓ 思维是人脑对客观事物的间接的、概括的反映。</p>
<p class="er-w">错在哪：漏掉「间接」「概括」两个限定词，就把思维降级成了照相机式的直观反映。答题时这两个词要出现在第一句里。</p>
</div>

<div class="er">
<p class="er-x">✗ 间接性就是靠猜，猜对了就叫间接性。</p>
<p class="er-v">✓ 间接性凭借已有的知识和经验，反映没有直接作用于感觉器官的事物。</p>
<p class="er-w">错在哪：把「有依据的推断」和「没依据的瞎猜」混成一件事。间接性说得出依据，猜说不出。</p>
</div>

<div class="er">
<p class="er-x">✗ 概括性就是把很多个别事物加起来。</p>
<p class="er-v">✓ 概括性是把一类事物共同的、本质的属性抽取出来加以反映。</p>
<p class="er-w">错在哪：相加得到的是清单，抽取才得到本质。这一步写反，整条概括性作废，例子也白举。</p>
</div>

<div class="er">
<p class="er-x">✗ 抽象思维比形象思维高级，形象思维是低级的。</p>
<p class="er-v">✓ 形象思维和抽象思维是思维的两种形态，各有作用。</p>
<p class="er-w">错在哪：把「形态不同」说成「等级不同」。课本从来没给两种形态排名，说高级是无中生有。</p>
</div>

<div class="er">
<p class="er-x">✗ 诗人用月亮写思乡，靠的是抽象思维。</p>
<p class="er-v">✓ 形象思维以感性形象作为思维的基本单元，靠联想和想象。</p>
<p class="er-w">错在哪：把画面当成了概念。判断形态只数零件，不看文采，也不看作者的名气。</p>
</div>

<div class="er">
<p class="er-x">✗ 思维决定实践，想法一变现实就跟着变。</p>
<p class="er-v">✓ 实践决定思维，思维反作用于实践。</p>
<p class="er-w">错在哪：把「反作用」写成「决定」，来源和方向全颠倒，这一分必丢，还捎带丢了「实践是检验标准」。</p>
</div>

<div class="er">
<p class="er-x">✗ 思维的特征是间接性、概括性、能动性。</p>
<p class="er-v">✓ 思维具有间接性。它凭借已有的知识和经验……（含义 + 材料）</p>
<p class="er-w">错在哪：只交标题不交论证。三条特征各配一句含义、一句材料，才叫「说明」，否则只能得一半分。</p>
</div>
</div>
<p class="gx-note">七条错句有个共同点：都在偷换「谁决定谁」「靠什么判断」。把判据补上去，错句自己就露馅了。考前最后扫一眼这一栏，比再背一遍定义管用。看到选项里写「直接反映」「比另一种高级」「决定实践」，先把这三句在心里划掉，再把正确的判据补上。</p>
</section>
