<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 空想社会主义的地位和局限<span class="q-src">人教版（2019）必修1 中国特色社会主义 · 第一课第二框</span></p>
<p class="q-b">空想社会主义是科学社会主义的思想来源，但它没有找到实现理想社会的现实力量和正确道路。</p>
<p class="q-n">→ 翻成人话：这句话由<b>两个判断</b>组成（① 是思想来源，不是对立面；② 有两个「没有找到」：现实力量＝靠谁，正确道路＝怎么走）。只写「空想社会主义不好」是 0 分，必须写出这两条具体的「没找到」。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 科学社会主义的诞生<span class="q-src">人教版（2019）必修1 中国特色社会主义 · 第一课第二框</span></p>
<p class="q-b">1848 年 2 月，《共产党宣言》发表，标志着科学社会主义的诞生。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个要素</b>组成（时间 1848 年 2 月 / 事件《共产党宣言》发表 / 地位 标志诞生）。时间少写「2 月」一般不扣分，但「标志诞生」不能换成「成熟」「胜利」「开始实践」——那是后面两个节点的事。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 十月革命的意义<span class="q-src">人教版（2019）必修1 中国特色社会主义 · 第一课第二框</span></p>
<p class="q-b">1917 年，俄国十月革命建立了世界上第一个社会主义国家，实现了科学社会主义从理论到现实的飞跃。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个要素</b>组成（谁：俄国十月革命 / 做了什么：建立世界上第一个社会主义国家 / 意义：从理论到现实的飞跃）。「第一个社会主义国家」只能给十月革命；巴黎公社的定语是「第一次伟大尝试」。两者调换就是必扣分点。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>1848 《共产党宣言》</th><th>1871 巴黎公社</th><th>1917 十月革命</th></tr></thead>
<tbody>
<tr><td>时间 / 主体</td><td>1848 年 2 月，马克思、恩格斯</td><td>1871 年，法国巴黎的无产阶级</td><td>1917 年，俄国无产阶级</td></tr>
<tr class="key"><td>地位（只能这样写）</td><td>标志科学社会主义的诞生</td><td>无产阶级建立政权的第一次伟大尝试</td><td>建立第一个社会主义国家，实现从理论到现实的飞跃</td></tr>
<tr><td>常见错写</td><td>「只是一本宣传小册子」</td><td>「建立了第一个社会主义国家」</td><td>「第一次尝试」「使社会主义诞生」</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只背中间那行：<b>诞生 → 尝试 → 现实</b>。顺序不能乱：先有《宣言》标志诞生，才有巴黎公社的尝试，才有十月革命把理论变成现实。凡是在考卷上看到「第一次尝试」，答案定巴黎公社；看到「第一个社会主义国家」，答案定十月革命。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 「为什么说《共产党宣言》的发表标志着科学社会主义的诞生」<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">1848 年 2 月，《共产党宣言》发表。有同学说：「它不过是一本宣传小册子，真正的科学社会主义是马克思、恩格斯自己想出来的。」请结合本框知识，说明《共产党宣言》的发表为什么标志着科学社会主义的诞生，并指出这位同学错在哪。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性</p>
<p class="s-b">问的是「发表为什么＝诞生」，不是「《宣言》写了什么内容」。所以答题要两个动作：先给《宣言》的三大理论贡献，再定性「标志诞生」。第二问是排错，要指出「宣传小册子」和「自己想出来」两处。</p>
<p class="s-k">用到：《共产党宣言》发表的意义、两大理论基石。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 贡献一：唯物史观</p>
<p class="s-b">《宣言》第一次系统阐述了唯物史观，揭示了人类社会发展的客观规律，说明社会主义代替资本主义是历史发展的必然趋势。这一步解决的是「历史往哪走」。</p>
<p class="s-k">用到：唯物史观——第一个理论基石。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 贡献二：阶级斗争与无产阶级使命</p>
<p class="s-b">《宣言》阐明了阶级斗争学说，指出阶级斗争是阶级社会发展的直接动力，阐明了无产阶级的历史使命——推翻资本主义、建立社会主义。这一步解决的是「靠谁去实现」。</p>
<p class="s-k">用到：阶级斗争学说、无产阶级的历史使命。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 贡献三：找到正确道路</p>
<p class="s-b">《宣言》指出了无产阶级革命的正确道路，使社会主义从空想变为科学。空想社会主义没找到的现实力量和正确道路，到这里都找到了——「科学」两个字就是这么来的。</p>
<p class="s-k">用到：空想社会主义的两个「没有找到」。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 排错并定性</p>
<p class="s-b">同学错在两处：① 把《宣言》当成宣传小册子——《宣言》是第一次系统阐述科学社会主义的纲领性文献；② 说「自己想出来的」——科学社会主义有两大理论基石（唯物史观、剩余价值学说），还是对空想社会主义的批判继承。所以结论是：1848 年 2 月《共产党宣言》发表，标志着科学社会主义的诞生。</p>
<p class="s-k">用到：思想来源 + 两大理论基石 + 标志诞生的定性。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">①《共产党宣言》第一次系统阐述了唯物史观，揭示了人类社会发展的客观规律，指明社会主义代替资本主义是历史的必然。②《宣言》阐明了阶级斗争学说，指出阶级斗争是阶级社会发展的直接动力，阐明了无产阶级的历史使命。③《宣言》指出了无产阶级革命的正确道路，使社会主义从空想变为科学。④ 因此，1848 年 2 月《共产党宣言》的发表，标志着科学社会主义的诞生。⑤ 同学的说法错误：其一，《宣言》是第一次系统阐述科学社会主义的纲领性文献，不是普通宣传小册子；其二，科学社会主义不是凭空想出来的，它以唯物史观和剩余价值学说为两大理论基石，并批判继承了空想社会主义这一思想来源。</p>
</div>
</div>
</section>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">空想社会主义的局限到底在哪？只说「它不科学」够吗？</p>
<p class="a">不够，必须落到两个「没有找到」：<b>没有找到实现理想社会的现实力量</b>（寄希望于天才人物和统治阶级发善心），<b>没有找到实现理想社会的正确道路</b>（靠示范、宣传、感化）。它的历史地位是科学社会主义的<b>思想来源</b>。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="空想社会主义两个没有找到">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text class="ms" x="20" y="28" font-size="9" font-weight="700" fill="#b8791f">空想社会主义</text>
<text class="ms" x="20" y="50" font-size="8.6" fill="#3a3a35">✗ 没找到现实力量：靠谁</text>
<text class="ms" x="20" y="70" font-size="8.6" fill="#3a3a35">✗ 没找到正确道路：怎么走</text>

<div class="qac">
<p class="q">科学社会主义的两大理论基石是什么？只写唯物史观行不行？</p>
<p class="a">不行。<b>唯物史观</b>揭示了人类社会发展的一般规律，指明社会主义必然代替资本主义；<b>剩余价值学说</b>揭示了资本家剥削工人的秘密，阐明了无产阶级的历史地位和历史使命。两个基石<b>缺一不可</b>，只写一个就是半个答案。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="两大理论基石">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<rect x="20" y="26" width="96" height="34" rx="6" fill="#e6f6ee" stroke="#2f8a5b"/>
<rect x="124" y="26" width="96" height="34" rx="6" fill="#e6f6ee" stroke="#2f8a5b"/>
<text class="ms" x="68" y="47" font-size="8.6" text-anchor="middle" fill="#2f8a5b" font-weight="700">唯物史观</text>
<text class="ms" x="172" y="47" font-size="8.6" text-anchor="middle" fill="#2f8a5b" font-weight="700">剩余价值学说</text>
<line x1="120" y1="72" x2="120" y2="86" stroke="#8aa0b0"/>
<text class="ms" x="120" y="106" font-size="8.8" text-anchor="middle" fill="#3a3a35">缺一不可 → 科学社会主义</text>
</svg>
</div>
<div class="qac">
<p class="q">《共产党宣言》的发表为什么是「标志诞生」，而不是「标志成熟」？</p>
<p class="a">因为《宣言》第一次<b>系统阐述</b>了唯物史观，阐明了阶级斗争学说和无产阶级的历史使命，指出了无产阶级革命的正确道路，使社会主义从空想变为科学。<b>1848 年 2 月</b>这个时间点，就是科学社会主义的起点。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="共产党宣言发表意义">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>

<div class="qac">
<p class="q">巴黎公社建立了第一个社会主义国家吗？</p>
<p class="a">没有。巴黎公社的地位是<b>无产阶级建立政权的第一次伟大尝试</b>。「建立了世界上第一个社会主义国家」只能写十月革命。看到「第一次尝试」写巴黎公社，看到「第一个社会主义国家」写十月革命，这两句不能互换。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="巴黎公社地位">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>

<text class="ms" x="20" y="54" font-size="8.6" fill="#3a3a35">✗ 建立了第一个社会主义国家</text>

<div class="qac">
<p class="q">十月革命的意义，能不能写「第一次伟大尝试」？</p>
<p class="a">不能。十月革命的意义是<b>建立了世界上第一个社会主义国家，实现了科学社会主义从理论到现实的飞跃</b>。它是<b>现实</b>，不是尝试：巴黎公社失败了，十月革命成功了，这才叫「从理论到现实」。</p>

<div class="qac">
<p class="q">社会主义为什么能实现从理论到现实的飞跃？</p>
<p class="a">三个条件同时具备：<b>理论是科学的</b>（两大理论基石）、<b>力量是现实的</b>（无产阶级和广大人民群众）、<b>道路是正确的</b>（无产阶级革命）。再加上 1917 年俄国具备革命形势，十月革命才把可能变成现实。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 空想社会主义就是科学社会主义，只是说法不同。</p>
<p class="er-v">✓ 空想社会主义是科学社会主义的思想来源，但它没有找到实现理想社会的现实力量和正确道路。</p>
<p class="er-w">错在哪：把「来源」说成「同一个东西」。思想来源＝前身和材料，不是它本身。</p>
</div>
