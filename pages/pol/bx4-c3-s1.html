<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">这一框的答案压在四句话上：联系是普遍的、客观的、多样的，整体与部分相互联系。先照抄，再拆关键词。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 联系的含义与普遍性<span class="q-src">人教版（2019）必修4 哲学与文化 · 第三课第一框</span></p>
<p class="q-b">联系是事物之间以及事物内部诸要素之间的相互影响、相互制约和相互作用。联系是普遍的。世界上一切事物都与周围其他事物有着这样或那样的联系。世界是一个普遍联系的有机整体，没有一个事物是孤立存在的。</p>
<p class="q-n">→ 翻成人话：先抓定义里的三个词——「相互影响」「相互制约」「相互作用」。材料里只要出现「影响」「制约」「牵动」「带动」「牵连」，都是在讲联系。再记普遍性的三层：事物内部各要素之间、事物与周围事物之间、整个世界。这里有个坑：普遍性说的是「没有事物孤立存在」，不是「你随便挑两个东西都一定有联系」。两个事物能不能搭上，要看具体条件。答题第一句先写「联系具有普遍性，要求我们用联系的观点看问题」，第二句立刻落到材料里的那根线，别停在原理上。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 联系的客观性<span class="q-src">人教版（2019）必修4 哲学与文化 · 第三课第一框</span></p>
<p class="q-b">联系是客观的，联系是事物本身所固有的，不以人的意志为转移。自在事物的联系和人为事物的联系都是客观的。人们可以根据事物固有的联系，改变事物的状态，调整原有的联系，建立新的具体联系。</p>
<p class="q-n">→ 翻成人话：这段话有两半，前半说「不能想」，后半说「能做」。山川、气候、生态这些自在事物的联系是客观的；高铁、互联网、产业链这些人为事物的联系也是客观的——一旦建成，它就不听你的愿望了。人能做的三件事：改变事物的状态、调整原有的联系、建立新的具体联系，前提是「根据事物固有的联系」，也就是尊重规律。所以「联系客观」既不等于「人只能干看着」，也不等于「人想连谁就连谁」。判卷老师最爱看你在这两句之间走钢丝。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 整体与部分、系统与要素<span class="q-src">人教版（2019）必修4 哲学与文化 · 第三课第一框</span></p>
<p class="q-b">整体和部分是相互联系、密不可分的。整体由部分构成，部分的功能及其变化会影响整体的功能；整体的功能、状态及其变化也会影响部分。要树立全局观念，立足整体，统筹全局，选择最佳方案，实现整体的最优目标；同时必须重视部分的作用，用局部的发展推动整体的发展。整体和部分的关系，在一定意义上就是系统和要素的关系。系统的基本特征是整体性、有序性和内部结构的优化趋向。</p>
<p class="q-n">→ 翻成人话：背成「两影响、两方法」。两影响：部分影响整体（关键部分在一定条件下对整体功能起决定作用），整体也影响部分。两方法：立足整体、统筹全局；重视部分、用局部推动整体。后半段把整体与部分升级成系统与要素，多出三个词：整体性、有序性、内部结构的优化趋向，对应的方法论是「用综合的思维方式认识事物」。答题时看见「木桶」「链条」「一盘棋」，先写整体与部分；材料里再出现「结构」「排序」「统筹」「协同」，补一句系统优化。</p>
</div>

<div style="overflow-x:auto">

<p class="gx-note">整张表只高亮一行：<b>一句话总口径</b>。前四行是四个可以互换着挖坑的地方，最后一行是把它们串起来的那根绳。背法是：普遍性回答「有没有」，客观性回答「能不能凭愿望改」，多样性回答「是哪一种」，整体与部分回答「谁统率谁、谁影响谁」。考试时先定问题问的是哪一句，再动笔，比上来就写「事物是普遍联系的」安全得多。还要提醒一句：答方法论时动词要准——「用联系的观点看问题」「树立全局观念」「用综合的思维方式认识事物」，这三个是不能互相顶替的。</p>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。五步走完，答案的骨架自己就长出来了。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 依据类材料题<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">材料：某县地处农牧交错带。十年前治沙只盯着沙子，拉水车、种杨树，树没活几棵，地下水位反而降了。后来县里换了思路：把山、水、林、田、湖、草、沙看成一个整体，上游修蓄水池，坡地退耕还林，河边恢复湿地，沙地改种耐旱灌木；同时引进企业做沙棘加工，村民以地入股。动工前，县里请气象、水利、农业三方面专家一起论证，先算清水账，再定种植规模。三年后，地下水位回升，候鸟回来了，村民人均收入也涨了。结合材料，运用「世界是普遍联系的」知识，说明该县治沙思路转变的哲学依据。（12 分）</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性</p>
<p class="s-b">题型是「说明依据」，知识范围是「世界是普遍联系的」，主体是县政府，对象是治沙思路。设问要答两层：一是原理是什么，二是材料哪里体现了它。草稿上先写四个词：普遍、客观、多样、整体与部分。</p>
<p class="s-k">用到：依据类设问的两层结构（原理 + 材料）</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 找主体和行为</p>
<p class="s-b">材料里做事的是一双手：县政府（规划、论证、定规模）和市场（企业加工、村民入股）。动作有两类：一类是「不这么干」的旧做法——单打独斗种树；一类是「这么干」的新做法——统一规划、先算水账。答案的对比就藏在这两类动作之间。</p>
<p class="s-k">用到：主体 + 行为 → 概念的翻译法</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 找关键词</p>
<p class="s-b">「看成一个整体」对整体与部分；「先算清水账、再定规模」对联系的客观性——先摸清水、土、植被的固有联系，才敢定规模；「山、水、林、田、湖、草、沙」七样一起规划对系统优化；「沙棘加工、村民入股」对联系多样性，生态与生计连上了。</p>
<p class="s-k">用到：整体与部分、客观性、系统优化、多样性</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 搭框架</p>
<p class="s-b">四层，一层一个采分点：① 联系具有普遍性，要求用联系的观点看问题；② 联系具有客观性，要尊重固有联系，人可以改变条件、建立新的具体联系；③ 联系具有多样性，要把握条件，一切以时间、地点、条件为转移；④ 整体与部分相互联系，要立足整体、统筹全局，同时重视部分。</p>
<p class="s-k">用到：普遍性 → 客观性 → 多样性 → 整体与部分</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口与自查</p>
<p class="s-b">最后补一句系统优化：着眼于整体性、遵循有序性、注重优化趋向，用综合的思维方式认识事物。写完回头查三处：有没有写「创造联系」「任何两个事物都有联系」「整体功能一定大于部分之和」，有就改掉。</p>
<p class="s-k">用到：系统优化 + 三句易错口径</p>
</li>
</ol>

<button id="gxNext" type="button">下一步</button>

<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">① 联系具有普遍性，世界是普遍联系的有机整体，要求我们用联系的观点看问题。该县把治沙与上游蓄水、坡地退耕、湿地恢复、农民增收放在一起考虑，不再孤立地只盯着沙子。<br>② 联系具有客观性，联系是事物本身所固有的，不以人的意志为转移。过去只种杨树，违背了水、土、植被之间的固有联系，所以树死了、水位降了；后来先算水账再定规模，是尊重客观联系的表现。人可以根据固有联系改变事物的状态、调整原有的联系、建立新的具体联系，退耕还林、恢复湿地、引企加工都属于这一类。<br>③ 联系具有多样性，要求我们注意分析和把握事物存在发展的各种条件，一切以时间、地点、条件为转移。该县把生态条件、市场条件、村民生计条件一起考虑，才让治理可持续。<br>④ 整体与部分相互联系、密不可分。要树立全局观念，立足整体，统筹全局，选择最佳方案；同时重视部分的作用，用局部的发展推动整体的发展。把七样要素纳入一张图，是立足整体；抓住水源和植被这些关键部分，是重视部分。<br>⑤ 系统的基本特征是整体性、有序性和内部结构的优化趋向，要着眼于事物的整体性，遵循系统内部结构的有序性，注重系统内部结构的优化趋向，用综合的思维方式认识事物。先蓄水、再退耕、后恢复湿地，是有序推进；补上湿地和灌木这两块短板，是优化结构。<br>结论：治沙思路的转变，实质是从孤立、静止地看问题，转到用联系的观点、系统优化的方法看问题，所以生态与生计同时改善。</p>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。每问先自己答一句，再看下面那句。</p>
<div class="gx-qa">

<div class="qac">
<p class="q">「联系是普遍的，是不是任何两个事物之间都有联系？」</p>
<p class="a">不是。普遍性说的是世界上一切事物都与周围其他事物有着这样或那样的联系，没有一个事物是孤立存在的；但<b>具体联系是有条件的</b>。两个事物要真的搭上，得有中介、有过程、有条件。所以「普遍」不能被读成「任意两两相连」。</p>

<text x="114" y="52" font-size="8" text-anchor="middle" fill="#6b7280">要有条件</text>
<text x="120" y="96" font-size="8.4" text-anchor="middle" fill="#3a3a35">条件不足 → 只能说「可能」</text>
<text x="120" y="114" font-size="8.4" text-anchor="middle" fill="#3a3a35">条件具备 → 才是现实联系</text>
</svg>
</div>

<div class="qac">
<p class="q">「联系是客观的，那人在联系面前是不是什么也做不了？」</p>
<p class="a">不是。人不能创造联系，也不能消灭联系，但可以<b>根据事物固有的联系</b>改变事物的状态、调整原有的联系、建立新的具体联系。修水库、建高铁、搞产业链，都是这一类。前提是尊重规律，不是凭愿望硬连。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="联系客观不等于人无所作为">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="28" font-size="9.2" text-anchor="middle" fill="#151a21">客观，不等于无所作为</text>
<rect x="18" y="40" width="94" height="50" rx="7" fill="#ffffff" stroke="#dbe7ef"/>
<text x="65" y="60" font-size="8.6" font-weight="700" text-anchor="middle" fill="#151a21">不能凭愿望改</text>
<text x="65" y="76" font-size="8" text-anchor="middle" fill="#3a3a35">固有联系是客观的</text>
<rect x="128" y="40" width="94" height="50" rx="7" fill="#ffffff" stroke="#b8e6d0"/>
<text x="175" y="58" font-size="8.6" font-weight="700" text-anchor="middle" fill="#1e6640">可以做三件事</text>
<text x="175" y="72" font-size="8" text-anchor="middle" fill="#3a3a35">改状态、调原有联系</text>
<text x="175" y="85" font-size="8" text-anchor="middle" fill="#3a3a35">建立新的具体联系</text>
<text x="120" y="110" font-size="8.2" text-anchor="middle" fill="#6b7280">前提：根据固有联系，尊重规律</text>
</svg>
</div>

<div class="qac">
<p class="q">「整体的功能一定大于部分功能之和吗？」</p>
<p class="a">不一定。整体功能不是部分功能的简单相加：<b>结构合理、各要素协同</b>时大于部分之和；内部结构不合理、力量相互抵消时小于部分之和。判题的关键在结构，不在要素数量。选项里出现「一定」「必然」，先怀疑。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="整体功能可能大于也可能小于部分之和">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="28" font-size="9.2" text-anchor="middle" fill="#151a21">整体功能 ≠ 部分之和</text>
<rect x="18" y="40" width="204" height="30" rx="7" fill="#ffffff" stroke="#b8e6d0"/>
<text x="30" y="60" font-size="8.4" fill="#1e6640">结构合理 → 大于部分之和</text>
<rect x="18" y="78" width="204" height="30" rx="7" fill="#ffffff" stroke="#f3c9cf"/>
<text x="30" y="98" font-size="8.4" fill="#9f1239">内部打架 → 小于部分之和</text>
<text x="120" y="118" font-size="8" text-anchor="middle" fill="#6b7280">关键看结构，不看数量</text>
</svg>
</div>

<div class="qac">
<p class="q">「关键部分决定整体，那是不是只要抓住局部就行？」</p>
<p class="a">不行。关键部分在一定条件下对整体功能起决定作用，但这句和<b>立足整体、统筹全局</b>不冲突：抓关键部分是为了整体最优，不是为了局部好看。答案里两句都要有，只写一句就偏。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="抓关键部分的同时要立足整体">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="28" font-size="9.2" text-anchor="middle" fill="#151a21">抓关键 ≠ 只顾局部</text>
<rect x="18" y="40" width="90" height="50" rx="7" fill="#ffffff" stroke="#f3c9cf"/>
<text x="63" y="58" font-size="8.6" font-weight="700" text-anchor="middle" fill="#9f1239">最短板</text>
<text x="63" y="72" font-size="8" text-anchor="middle" fill="#3a3a35">决定装多少水</text>
<text x="63" y="85" font-size="8" text-anchor="middle" fill="#3a3a35">关键部分</text>
<rect x="132" y="40" width="90" height="50" rx="7" fill="#ffffff" stroke="#b8e6d0"/>
<text x="177" y="58" font-size="8.6" font-weight="700" text-anchor="middle" fill="#1e6640">箍桶的圈</text>
<text x="177" y="72" font-size="8" text-anchor="middle" fill="#3a3a35">板与板要配合</text>
<text x="177" y="85" font-size="8" text-anchor="middle" fill="#3a3a35">整体要统筹</text>
<text x="120" y="110" font-size="8.2" text-anchor="middle" fill="#6b7280">两条一起写：立足整体 ＋ 重视部分</text>
</svg>
</div>

<div class="qac">
<p class="q">「人为事物的联系是人建立的，那它是主观的吗？」</p>
<p class="a">不是。自在事物的联系和人为事物的联系<b>都是客观的</b>。人只能按固有联系去建，建成之后它独立于人的意识、按自己的规律运行。你喜不喜欢，高铁都得按时刻表走；你不习惯，产业链也不会自己散架。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="人为事物的联系形成之后是客观的">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="28" font-size="9.2" text-anchor="middle" fill="#151a21">人建立的，也是客观的</text>
<rect x="18" y="38" width="204" height="50" rx="7" fill="#ffffff" stroke="#b8e6d0"/>
<text x="30" y="58" font-size="8.4" fill="#3a3a35">一旦建成，就独立于人的意识</text>
<text x="30" y="76" font-size="8.4" fill="#3a3a35">按自己的规律运行，不听愿望</text>
<text x="120" y="106" font-size="8.2" text-anchor="middle" fill="#1e6640">→ 人为事物的联系同样是客观的</text>
</svg>
</div>

<div class="qac">
<p class="q">「整体与部分，和系统与要素，答题时要分开写吗？」</p>
<p class="a">一定意义上它们是一回事，但系统多出三个基本特征：<b>整体性、有序性、内部结构的优化趋向</b>。材料里出现「统筹」「协同」「一体化」「分主次先后」，就补系统优化和综合思维方式；只讲「全局与局部」，写整体与部分就够。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="整体与部分和系统与要素的关系">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="26" font-size="9.2" text-anchor="middle" fill="#151a21">两套说法，一套底子</text>
<rect x="18" y="38" width="94" height="50" rx="7" fill="#ffffff" stroke="#dbe7ef"/>
<text x="65" y="58" font-size="8.6" font-weight="700" text-anchor="middle" fill="#151a21">整体与部分</text>
<text x="65" y="74" font-size="8" text-anchor="middle" fill="#3a3a35">两影响、两方法</text>
<rect x="128" y="38" width="94" height="50" rx="7" fill="#ffffff" stroke="#b8e6d0"/>
<text x="175" y="58" font-size="8.6" font-weight="700" text-anchor="middle" fill="#1e6640">系统与要素</text>
<text x="175" y="74" font-size="8" text-anchor="middle" fill="#3a3a35">多三条特征</text>
<text x="120" y="108" font-size="8.2" text-anchor="middle" fill="#6b7280">多出的方法论：整体性、有序性、优化趋向</text>
</svg>
</div>

</div>
<p class="gx-note">六问其实是同一件事：先问有没有联系（普遍性），再问这联系能不能凭愿望改（客观性），接着问是哪一种、在什么条件下（多样性），最后问整体与部分、系统与要素怎么摆（整体观念、系统优化）。这四层问完，材料题的采分点就自己排好队了。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">每张卡片三行：学生真会写的错句、教材语言、错在哪。先盖住后两行，自己说一遍，再对答案。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 联系是普遍的，所以任何两个事物之间都有联系。</p>
<p class="er-v">✓ 联系具有普遍性，但具体联系是有条件的，只有具备一定条件，事物之间才发生联系。</p>
<p class="er-w">错在哪：把「普遍」当成「任意两两相连」。普遍性说的是没有孤立的事物，不是两两必连。</p>

<div class="er">
<p class="er-x">✗ 联系是客观的，人在联系面前什么也做不了。</p>
<p class="er-v">✓ 联系是客观的，人不能创造和消灭联系，但可以根据固有联系改变条件、调整原有联系、建立新的具体联系。</p>
<p class="er-w">错在哪：把「客观」读成「宿命」。后半句才是采分点，只写前半句等于没答。</p>
</div>
<div class="er">
<p class="er-x">✗ 人可以按需要创造联系，想连哪里就连哪里。</p>
<p class="er-v">✓ 人们可以根据事物固有的联系，改变事物的状态，调整原有的联系，建立新的具体联系。</p>
<p class="er-w">错在哪：漏掉「根据固有联系」这个前提，就成了主观臆造的联系。动词要写「建立」，不写「创造」。</p>
</div>
<div class="er">
<p class="er-x">✗ 整体的功能总是大于部分功能之和。</p>
<p class="er-v">✓ 整体功能不是部分功能的简单相加：结构合理时大于部分之和，内部结构不合理、力量相互抵消时小于部分之和。</p>
<p class="er-w">错在哪：把「整体」当「加法」。命题人最爱在「总是」「一定」上设套。</p>
</div>
<div class="er">
<p class="er-x">✗ 关键部分决定整体功能，所以做事只要抓住关键部分就行。</p>
<p class="er-v">✓ 关键部分在一定条件下对整体功能起决定作用；同时要树立全局观念、立足整体、统筹全局。</p>
<p class="er-w">错在哪：只说关键部分，丢掉整体，就变成了「只顾局部」。两句一起写才完整。</p>
</div>
<div class="er">
<p class="er-x">✗ 人为事物的联系是人建立的，所以是主观的。</p>
<p class="er-v">✓ 自在事物的联系和人为事物的联系都是客观的，人为事物的联系形成后独立于人的意识。</p>
<p class="er-w">错在哪：把「人参与建立」当成「主观」。建成之后它不听愿望，按自己的规律运行。</p>
</div>
<div class="er">
<p class="er-x">✗ 整体与部分的关系就是系统与要素的关系，背一套说法就够。</p>
<p class="er-v">✓ 整体与部分的关系在一定意义上就是系统和要素的关系；系统还有整体性、有序性、内部结构的优化趋向三个基本特征。</p>
<p class="er-w">错在哪：漏了「一定意义上」，也漏了系统优化的三条方法论。答「统筹」「协同」类材料题会缺要点。</p>
