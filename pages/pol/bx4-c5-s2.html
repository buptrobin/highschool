<p class="gx-claim">一句话说清本节最该记住的判断：<b>生产力决定生产关系</b>、<b>经济基础决定上层建筑</b>，两对矛盾一运动，社会历史就往前走；<b>改革是社会主义制度的自我完善和发展</b>，改的是体制，不是制度。</p>
<div class="gx-meta">
<span><i></i>人教版（2019）必修4 哲学与文化 · 第五课第二框</span>
<span><i></i>高一 · 第五课 寻觅社会的真谛</span>

<p class="gx-lede">学校后门那条街，三年前是修车摊和快递代收点，现在换成两家奶茶店、一间自习室。店招为什么换？因为点外卖、上自习的人多了——人的活法先变，街面才跟着变。这一框讲的就是这个顺序：生产力决定生产关系，经济基础决定上层建筑，两对矛盾一运动，社会历史就往前走。它前面接着「社会存在与社会意识」，后面接着「人民群众」和「价值观」，是必修4 历史唯物主义这块的地基。最容易错的一件事，是把顺序写反：写成生产关系决定生产力，或者写成上层建筑决定经济基础。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">这一框的答案压在四句话上：生产力决定生产关系、经济基础决定上层建筑、社会基本矛盾推动发展、改革是自我完善。先照抄，再拆关键词，最后看哪个词最容易写反。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 生产力与生产关系的矛盾运动<span class="q-src">人教版（2019）必修4 哲学与文化 · 第五课第二框</span></p>
<p class="q-b">生产力决定生产关系。生产力的状况决定生产关系的性质，生产力的变化发展，迟早会引起生产关系的变革。生产关系对生产力具有反作用。当生产关系适合生产力发展状况时，它对生产力的发展起推动作用；当生产关系不适合生产力发展状况时，它对生产力的发展起阻碍作用。生产关系一定要适合生产力状况的规律，是社会发展的普遍规律。</p>
<p class="q-n">→ 翻成人话：这段话要拆成三块。第一块「决定」管两件事——性质（什么样的工具，配什么样的所有制）和变革（工具换了，所有制迟早要跟着换）。第二块「反作用」只有两种结局：适合就往前推，不适合就往后拽。第三块是那条规律，答题收口全靠它。还要盯住「迟早」两个字，它说明变革不是同步的，中间会拖一段时间，这段拖的时间正好用来解释「为什么要改革」。材料里出现新工具、新技术、新平台，先找左边；出现承包、入股、分红、用工方式，先找右边在调。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 经济基础与上层建筑的矛盾运动<span class="q-src">人教版（2019）必修4 哲学与文化 · 第五课第二框</span></p>
<p class="q-b">经济基础决定上层建筑。经济基础决定上层建筑的产生、性质和发展方向。上层建筑对经济基础具有反作用。当上层建筑适合经济基础状况时，它促进经济基础的巩固和完善；当它不适合经济基础状况时，就会阻碍经济基础的巩固和完善。上层建筑为先进的经济基础服务时，它就促进生产力的发展，推动社会进步；当它为落后的经济基础服务时，则阻碍生产力的发展，阻碍社会前进。</p>
<p class="q-n">→ 翻成人话：地基决定楼，楼也压着地基。经济基础是「占统治地位的生产关系的总和」，注意它是生产关系那一层，不是生产力。上层建筑分两半：政治的上层建筑（国家政权、政党、法律、军队）和观念的上层建筑（道德、艺术、哲学、宗教、政治法律思想）。这里有个坑：上层建筑不是「越强越好」，而是「越合适越好」。判断标准只有一条——它为哪一种经济基础服务。为先进的服务就推，为落后的服务就拽，跟它自身管得宽不宽、声音大不大没关系。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 社会历史发展的总趋势与改革<span class="q-src">人教版（2019）必修4 哲学与文化 · 第五课第二框</span></p>
<p class="q-b">社会历史发展的总趋势是前进的、上升的，发展的过程是曲折的。社会发展是在生产力与生产关系、经济基础与上层建筑的矛盾运动中，在社会基本矛盾的不断解决中实现的。在阶级社会里，社会基本矛盾表现为阶级矛盾，阶级斗争是社会发展的直接动力。社会主义社会的基本矛盾是非对抗性的矛盾，可以通过社会主义的自我发展、自我完善加以解决。改革是社会主义制度的自我完善和发展，是发展中国特色社会主义的强大动力。</p>
<p class="q-n">→ 翻成人话：这三句要分开背，别混成一句。第一句讲总趋势：方向是前进上升的，走路的过程是曲折的，两个词缺一个都不给分。第二句讲实现方式：社会不是靠谁喊口号往前走，是靠两对矛盾不断暴露、不断解决往前走。第三句讲不同社会怎么解决：阶级社会里，矛盾表现为阶级矛盾，阶级斗争是直接动力；社会主义社会里，矛盾是非对抗性的，用改革来解决。所以「社会基本矛盾」和「阶级斗争」不是等号，阶级斗争只是阶级社会那一段的表现形式。</p>
</div>

<tr><td>上层建筑的反作用</td><td>上层建筑越强越好，管得越宽经济越发展</td><td>适合经济基础才促进；为先进经济基础服务才推动生产力</td></tr>

</div>
<p class="gx-note">整张表只高亮一行：<b>一句话总口径</b>。前四行是四个可以互换着挖坑的地方，最后一行是把它们串起来的那根绳。背法是：第一行回答「谁定谁」，第二行回答「快还是慢」，第三行回答「经济基础是哪一层」，第四行回答「上层建筑看什么」。考试时先定设问问的是哪一行，再动笔，比上来就写「生产力决定生产关系」安全得多。再提醒一句：答反作用时动词要准——写「反作用」「促进或阻碍」，不要写成「决定」；答改革时宾语要准——写「体制、机制、环节」，不要写「根本制度」。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。五步走完，答案的骨架自己就长出来了。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 原因类材料题<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">材料：某省是老工业基地。过去生产靠指令性计划调配，企业办社会、政企不分，上一个技改项目要跑十几个部门，科研成果常常锁在实验室里。近十年，省里做了三件事：一是把国有企业所有权和经营权分开，允许民营资本参股，实行员工持股；二是砍掉三分之二的行政审批，把该由市场定价的交回市场；三是把科研人员成果转化收益的比例提高到七成。到去年，全省高新技术产业产值占比从 18% 升到 41%，新增就业 60 万人。结合材料，运用社会基本矛盾运动的原理，说明为什么要全面深化改革。（12 分）</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性</p>
<p class="s-b">题型是「说明为什么」，知识范围是「社会基本矛盾运动」，主体是省委省政府，对象是三项改革举措。设问要答两层：一层是原理本身，一层是材料哪里体现了它。草稿上先写四个词：生产力、生产关系、经济基础、上层建筑。</p>
<p class="s-k">用到：原因类设问的两层结构（原理 + 材料）</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 找主体和行为</p>
<p class="s-b">材料里做事的是省里，动作有三类：放经营权、引民资、员工持股；砍审批、交定价权；提高成果转化收益。还有一个隐形的对照——过去的「政企不分、跑十几个部门、成果锁在实验室」，正是改革要拆掉的东西。</p>
<p class="s-k">用到：主体 + 行为 → 概念的翻译法</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 把行为落到两层上</p>
<p class="s-b">第一件事动的是所有制和分配，落在生产关系；第二件事动的是审批权和机构，落在上层建筑；第三件事动的是科技人员的收益，既调分配，又解放生产力。三件事最后都指向「产值升、就业增」，这正是生产关系、上层建筑反作用于生产力的结果。</p>
<p class="s-k">用到：生产关系、上层建筑、反作用</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 搭框架</p>
<p class="s-b">四层，一层一个采分点：① 生产力决定生产关系，生产关系反作用于生产力；② 经济基础决定上层建筑，上层建筑反作用于经济基础；③ 两对矛盾的运动推动社会历史发展，社会发展是在社会基本矛盾的不断解决中实现的；④ 改革是社会主义制度的自我完善和发展，根本目的是使生产关系适应生产力、使上层建筑适应经济基础。</p>
<p class="s-k">用到：两对矛盾 → 总趋势 → 改革性质</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口与自查</p>
<p class="s-b">最后补一句：社会历史发展的总趋势是前进的、上升的，过程是曲折的，所以改革要一步一步来。写完回头查三处：有没有把顺序写反、有没有把改革写成「改制度」、有没有把社会基本矛盾写成阶级斗争。</p>
<p class="s-k">用到：总趋势 + 三句易错口径</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">① 生产力决定生产关系，生产力的状况决定生产关系的性质，生产力的变化发展迟早引起生产关系的变革；生产关系对生产力具有反作用，适合时推动、不适合时阻碍。该省把所有权与经营权分开、引民资、员工持股，调整的是所有制结构和分配方式，让生产关系适合生产力状况，所以能解放和发展生产力。<br>② 经济基础决定上层建筑，上层建筑对经济基础具有反作用，适合时促进经济基础的巩固和完善，不适合时阻碍。该省砍掉三分之二审批、把定价权交回市场，调整的是机构设置和管理方式，属于上层建筑的调整；它让市场作用发挥得更充分，促进了经济基础的巩固。<br>③ 社会基本矛盾是生产力与生产关系、经济基础与上层建筑的矛盾，社会发展是在社会基本矛盾的不断解决中实现的，社会历史发展的总趋势是前进的、上升的，过程是曲折的。过去的指令性计划、政企不分、审批繁琐，束缚了生产力；改革就是不断解决这对矛盾，所以高新技术产值占比上升、就业增加。<br>④ 改革是社会主义制度的自我完善和发展，是发展中国特色社会主义的强大动力。改革的根本目的，就是使生产关系适应生产力的发展，使上层建筑适应经济基础的发展。该省的三项举措都没有改变社会主义根本制度，改的是体制、机制和环节，因此是自我完善，不是改旗易帜。<br>⑤ 结论：全面深化改革，就是主动调整不适应生产力的生产关系和不适应的上层建筑，用改革解决社会基本矛盾，推动社会历史发展。</p>
</div>
</div>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。每问先自己答一句，再看下面那句。</p>
<div class="gx-qa">

<div class="qac">
<p class="q">「生产力决定生产关系，那生产关系是不是只能等着被决定？」</p>
<p class="a">不是。决定讲的是顺序，反作用讲的是后果。生产关系适合生产力就<b>推动</b>它发展，不适合就<b>阻碍</b>它发展。正因为有反作用，人才会主动去调整生产关系，这就是改革。</p>

<text x="120" y="28" font-size="9.2" text-anchor="middle" fill="#151a21">决定单向，反作用双向</text>
<rect x="14" y="42" width="80" height="36" rx="7" fill="#ffffff" stroke="#f3c9cf"/>
<text x="54" y="64" font-size="8.4" text-anchor="middle" fill="#3a3a35">生产力</text>
<rect x="146" y="42" width="80" height="36" rx="7" fill="#ffffff" stroke="#b8e6d0"/>
<text x="186" y="64" font-size="8.4" text-anchor="middle" fill="#3a3a35">生产关系</text>
<line x1="98" y1="60" x2="140" y2="60" stroke="#c9d6df" stroke-width="2"/>
<polygon points="140,56 147,60 140,64" fill="#9f1239"/>
<text x="120" y="52" font-size="8" text-anchor="middle" fill="#9f1239">决定</text>
<text x="120" y="100" font-size="8.2" text-anchor="middle" fill="#3a3a35">适合 → 推动，不适合 → 阻碍</text>
<text x="120" y="118" font-size="8.2" text-anchor="middle" fill="#1e6640">所以人要主动调整生产关系</text>
</svg>
</div>

<div class="qac">
<p class="q">「经济基础就是生产力吗？经济发展水平高，经济基础就强？」</p>
<p class="a">不是。经济基础是<b>占统治地位的生产关系的总和</b>，属于生产关系那一层。生产力更根本，它决定生产关系，也决定经济基础。把两者混成一个词，上层建筑那一问就跟着塌了。</p>

<text x="64" y="92" font-size="7.6" text-anchor="middle" fill="#3a3a35">更根本</text>

</svg>
</div>

<div class="qac">
<p class="q">「上层建筑反作用，那是不是管得越宽、力量越强就越好？」</p>
<p class="a">不是。判断标准只有一条：<b>它为哪一种经济基础服务</b>。为先进的经济基础服务，就促进生产力发展；为落后的经济基础服务，越强越妨碍。所以「加强管理」本身不是答案，得看加强的是不是那一头。</p>

<text x="120" y="118" font-size="8" text-anchor="middle" fill="#6b7280">标准只有一条：为哪种经济基础服务</text>

</div>

<div class="qac">
<p class="q">「社会基本矛盾就是阶级斗争吗？答题时写阶级斗争行不行？」</p>
<p class="a">要看社会性质。社会基本矛盾始终是那两对；<b>在阶级社会里</b>它表现为阶级矛盾，阶级斗争是直接动力；<b>在社会主义社会</b>它是非对抗性的，靠改革解决。设问没限定阶级社会，就写两对矛盾。</p>

<text x="120" y="68" font-size="7.8" text-anchor="middle" fill="#3a3a35">经济基础与上层建筑</text>
<rect x="14" y="86" width="212" height="26" rx="7" fill="#ffffff" stroke="#f3c9cf"/>
<text x="120" y="103" font-size="7.8" text-anchor="middle" fill="#9f1239">阶级社会：阶级斗争是直接动力</text>
<text x="120" y="122" font-size="7.8" text-anchor="middle" fill="#1e6640">社会主义社会：非对抗，用改革解决</text>

<div class="qac">
<p class="q">「改革是自我完善，那是不是把制度改掉、换一套新的？」</p>
<p class="a">不是。改革的宾语是<b>体制、机制、环节</b>，不是根本制度。它改的是生产关系中不适应生产力的部分、上层建筑中不适应经济基础的部分，制度本身在改革中更成熟更定型。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="改革改体制不改根本制度">

<text x="176" y="88" font-size="7.8" text-anchor="middle" fill="#3a3a35">社会主义方向</text>
<text x="120" y="116" font-size="7.8" text-anchor="middle" fill="#6b7280">性质：社会主义制度的自我完善和发展</text>
</svg>
</div>

<div class="qac">
<p class="q">「总趋势是前进的、上升的，那是不是一路顺风、不会有反复？」</p>
<p class="a">不是。总趋势讲方向，过程讲道路，两个词必须同时出现。<b>前进的、上升的</b>是总趋势，<b>曲折的</b>是过程。答题只写前半句，等于把「为什么会有挫折」这道追问丢了。</p>

<p class="gx-note">六问其实是同一件事：先问「谁决定谁」，再问「反作用往哪边使」，接着问「这一层到底是哪一层」，最后问「换了社会性质，说法要不要变」。这四步走顺了，材料题的采分点自己就排好队了。</p>
