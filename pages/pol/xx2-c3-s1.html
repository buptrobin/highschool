<p class="gx-lede">暑假你去表哥打工的奶茶店，他一边调茶一边说：“老板让我早上九点来、晚上九点走，一周上六天，说好的加班费一分没见，合同也没签。”你顺口问：没签合同还算上班吗？加班该不该加钱？想讨说法，先找谁？这三问就是第七课的全套内容。它接在“合同”后面：签合同是民事交往的通用规则，劳动合同是它在职场里的特别版本，主体、内容、救济方式都换了。最要命的一个错，是把“没签书面合同”当成“没有劳动关系”，一张口就说“我又没合同，没法维权”。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写课本这句，不写你脑子里那句。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 劳动者有哪些权利<span class="q-src">劳动法第三条 · 教材第七课</span></p>
<p class="q-b">劳动者享有平等就业和选择职业的权利、取得劳动报酬的权利、休息休假的权利、获得劳动安全卫生保护的权利、接受职业技能培训的权利、享受社会保险和福利的权利、提请劳动争议处理的权利以及法律规定的其他劳动权利。</p>
<p class="q-n">→ 翻成人话：这一段是七个口袋，按“进门（平等就业）—干活（报酬）—歇息（休息休假）—安全（劳动保护）—长本事（培训）—有底（社会保险和福利）—能说理（提请处理争议）”顺着背，别乱序。<b>七项里最容易漏的是最后两项</b>，材料里一出现“培训”“社保”“去投诉”，你就得想起来。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 建立劳动关系应当订立书面劳动合同<span class="q-src">劳动合同法第十条、第八十二条 · 教材第七课</span></p>
<p class="q-b">建立劳动关系，应当订立书面劳动合同。已建立劳动关系，未同时订立书面劳动合同的，应当自用工之日起一个月内订立书面劳动合同。用人单位自用工之日起超过一个月不满一年未与劳动者订立书面劳动合同的，应当向劳动者每月支付二倍的工资。</p>
<p class="q-n">→ 翻成人话：这句里有三个点：①应当签书面合同；②最迟自用工之日起一个月内签；③超过一个月不满一年还没签，每月付二倍工资。<b>二倍工资是“按正常工资的两倍支付”</b>——本来那一倍照发，另加一倍带惩罚性的，不是“再发两个月工资”。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 劳动争议先仲裁、后诉讼<span class="q-src">劳动争议调解仲裁法第五条、第二十七条 · 教材第七课</span></p>
<p class="q-b">发生劳动争议，当事人不愿协商、协商不成或者达成和解协议后不履行的，可以向调解组织申请调解；不愿调解、调解不成或者达成调解协议后不履行的，可以向劳动争议仲裁委员会申请仲裁；对仲裁裁决不服的，除本法另有规定的外，可以向人民法院提起诉讼。</p>
<p class="q-n">→ 翻成人话：这是法定的“四步走”，顺序不能自己调。<b>仲裁是前置程序</b>：一般不能绕开仲裁直接起诉。另外记一句时效：申请仲裁的时效期间为一年，从当事人知道或者应当知道其权利被侵害之日起计算。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>劳动者的权利</th><th>劳动者的义务</th></tr></thead>
<tbody>
<tr><td>谁对谁</td><td>劳动者向用人单位主张</td><td>劳动者向用人单位履行</td></tr>
<tr><td>具体内容</td><td>平等就业和选择职业、取得劳动报酬、休息休假、获得劳动安全卫生保护、接受职业技能培训、享受社会保险和福利、提请劳动争议处理</td><td>完成劳动任务、提高职业技能、执行劳动安全卫生规程、遵守劳动纪律和职业道德</td></tr>
<tr><td>能不能不要</td><td>权利可以依法主张，也可以在不违法、不损害他人合法权益的前提下处分</td><td>义务必须履行，不能事先约定免除，也不能拿“多给点钱”换掉</td></tr>
<tr><td>被违反之后</td><td>用人单位侵权的：向劳动行政部门投诉、申请劳动争议仲裁、依法要求赔偿</td><td>劳动者违反的：依规章制度处理，造成损失依法赔偿，严重违反可解除劳动合同</td></tr>
<tr class="key"><td>一句话记住</td><td>权利是“我可以要”</td><td>义务是“我必须做”</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只高亮“一句话记住”这一行。这里有个坑：权利和义务不是买卖，不能对冲。你没拿到加班费，不能因此不完成劳动任务；单位也不能因为你“干活一般”就扣着工资不发。<b>两笔账分开算</b>，一边走维权，一边照常履约。答题时先分清在说哪一栏，再往下写。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点“下一步”。每一步只推一个判断。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 措施类材料题<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">小陈 2024 年 3 月 1 日入职某餐饮公司，双方一直没签书面劳动合同。公司每月 15 日发工资，但 7 月、8 月、9 月连续三个月只发了生活费，还以“生意不好”为由取消了他的休息日。小陈想去讨说法，又怕“没合同告不赢”。结合材料，回答：小陈可以通过哪些途径维护自己的合法权益？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性</p>
<p class="s-b">问的是“哪些途径”，属于措施类，答案要写成一条一条的路子，不是分析原因。先把知识范围锁在“劳动者的权利 + 劳动争议解决途径”，别跑题去写违约责任。</p>
<p class="s-k">用到：题型判断 + 知识范围。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 找主体</p>
<p class="s-b">两个主体：小陈是劳动者，餐饮公司是用人单位。这两个身份一确定，就说明这不是普通民事买卖，而是劳动关系，适用劳动法、劳动合同法、劳动争议调解仲裁法。</p>
<p class="s-k">用到：劳动关系的主体是用人单位与劳动者。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 找行为</p>
<p class="s-b">公司做了三件事：一直没签书面劳动合同；三个月没足额发工资；取消休息日。三件事要分开写，一件对一条依据，别笼统写“公司违法”。</p>
<p class="s-k">用到：订立书面劳动合同、取得劳动报酬、休息休假。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 对应原理</p>
<p class="s-b">没签合同：自用工之日起超过一个月不满一年未订立的，应当每月支付二倍工资。欠工资：工资应当按月足额支付，不得克扣或者无故拖欠。取消休息日：侵犯休息休假的权利，延长工作时间应依法支付加班费。没合同不等于没关系，工资流水、考勤记录、工作证都能证明。</p>
<p class="s-k">用到：劳动合同法第十条、第八十二条；劳动法第五十条。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口分点</p>
<p class="s-b">先写“可以依法维权，没签合同不影响”，再按“协商—投诉—仲裁—诉讼”四层铺开，每层写一句做什么，最后补一句仲裁时效一年、仲裁前置。层次清楚，术语到位，分点给分。</p>
<p class="s-k">用到：争议解决途径 + 仲裁前置。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">① 小陈可以先与公司协商，要求补签书面劳动合同、补发工资并依法支付加班费；协商不成，可以请工会或者调解组织调解。<br>② 可以向劳动行政部门举报、投诉，由劳动监察责令公司限期支付劳动报酬。<br>③ 可以向劳动争议仲裁委员会申请仲裁，要求公司支付拖欠的工资；自用工之日起超过一个月不满一年未订立书面劳动合同的，还可以要求每月支付二倍的工资。申请仲裁的时效期间为一年。<br>④ 对仲裁裁决不服的，除法律另有规定外，可以自收到裁决书之日起十五日内向人民法院提起诉讼。劳动争议一般先仲裁、后诉讼，不能直接起诉。<br>⑤ 没签书面合同不影响维权：工资支付记录、考勤记录、工作证、同事证言等都可以证明劳动关系存在。<br>⑥ 公司取消休息日、延长工作时间的，还应当依法支付加班费。</p>
</div>
<p class="gx-note">抄的时候注意顺序：先用一句话定性（“可以依法维权”），再按途径分层，最后补一句“没签合同不影响”。如果分值只有 6 分，写三层就够，别把仲裁时效、二倍工资全堆上去，容易冲淡要点。</p>
</div>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是“你以为懂了、一写就错”的地方。先看问题自己想一遍，再看答案。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">“入职三个月没签合同，是不是就没有劳动关系？”</p>
<p class="a">不是。劳动关系自用工之日起建立，判断标准是<b>有没有实际用工</b>，不是有没有那张纸。用人单位应当自用工之日起一个月内订立书面劳动合同；超过一个月不满一年未订立的，应当每月支付二倍的工资。<b>没签合同只影响单位的责任，不影响劳动关系的存在。</b>工资支付记录、考勤记录、工作证、招工登记表、社保缴费记录、同事证言，都可以用来证明。</p>

<div class="qac">
<p class="q">“公司说我们这行都是‘996’，加班费就免了，行不行？”</p>
<p class="a">不行。延长工作时间应当依法支付加班费：安排延长工作时间的，支付不低于工资的百分之一百五十的工资报酬；休息日安排工作又不能安排补休的，不低于百分之二百；法定休假日安排工作的，不低于百分之三百。<b>行业惯例、内部规定都不能对抗法律的强制性规定。</b>“自愿加班”的承诺，只要实质上排除了加班费，同样站不住。</p>

<text x="50" y="70" text-anchor="middle" font-size="9" font-weight="700" fill="#1e6640">150%</text>
<rect x="90" y="42" width="60" height="34" rx="6" fill="#fff" stroke="#f1d3a8"/>
<text x="120" y="57" text-anchor="middle" font-size="9" fill="#8a6320">休息日</text>
<text x="120" y="70" text-anchor="middle" font-size="9" font-weight="700" fill="#8a6320">200%</text>
<rect x="160" y="42" width="60" height="34" rx="6" fill="#fff" stroke="#c9d8ea"/>
<text x="190" y="57" text-anchor="middle" font-size="9" fill="#2f4f7a">法定假日</text>
<text x="190" y="70" text-anchor="middle" font-size="9" font-weight="700" fill="#2f4f7a">300%</text>
<text x="120" y="104" text-anchor="middle" font-size="9" fill="#4a4f57">休息日先补休，不能补休按 200%</text>
</svg>
</div>
<div class="qac">
<p class="q">“试用期是双向选择，公司觉得不合适就能让人走，对吗？”</p>
<p class="a">不对。试用期内用人单位解除劳动合同也要有法定情形：劳动者被证明不符合录用条件的，用人单位可以解除，但<b>要拿出证明、要说明理由</b>，不能一句“不合适”就让人走。试用期包含在劳动合同期限内，同一单位与同一劳动者只能约定一次试用期。违法解除的，要依法承担相应责任。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="试用期辞退须有法定情形并说明理由">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="28" text-anchor="middle" font-size="9" fill="#6b7280">试用期不是“随便期”</text>
<rect x="24" y="44" width="192" height="28" rx="6" fill="#fff" stroke="#b8e6d0"/>
<text x="120" y="62" text-anchor="middle" font-size="9" fill="#1e6640">须证明不符合录用条件</text>
<rect x="24" y="80" width="192" height="26" rx="6" fill="#fff" stroke="#b8e6d0"/>
<text x="120" y="97" text-anchor="middle" font-size="9" fill="#1e6640">并说明解除的理由</text>
<text x="120" y="118" text-anchor="middle" font-size="8.6" fill="#8a2b3e">一句“不合适”不够</text>
</svg>
</div>
<div class="qac">
<p class="q">“上班时在车间受伤，公司说是他自己不小心，算工伤吗？”</p>
<p class="a">一般应当认定为工伤。职工在工作时间和工作场所内，因工作原因受到事故伤害的，应当认定为工伤。<b>“自己不小心”不是排除工伤的理由</b>，工伤认定看的是时间、场所、原因三个要素，不看谁有过失。工伤保险费由用人单位缴纳，职工个人不缴纳。单位不申请的，职工或者其近亲属、工会组织可以依法直接提出工伤认定申请。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="工伤认定的三个要素">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="28" text-anchor="middle" font-size="9" fill="#6b7280">工伤认定看三件事，不看过失</text>
<rect x="16" y="42" width="64" height="30" rx="6" fill="#fff" stroke="#c9d8ea"/>
<text x="48" y="61" text-anchor="middle" font-size="9" fill="#2f4f7a">工作时间</text>
<rect x="88" y="42" width="64" height="30" rx="6" fill="#fff" stroke="#c9d8ea"/>
<text x="120" y="61" text-anchor="middle" font-size="9" fill="#2f4f7a">工作场所</text>
<rect x="160" y="42" width="64" height="30" rx="6" fill="#fff" stroke="#c9d8ea"/>
<text x="192" y="61" text-anchor="middle" font-size="9" fill="#2f4f7a">工作原因</text>
<line x1="120" y1="76" x2="120" y2="88" stroke="#b8c4cf" stroke-width="1.3"/>
<polygon points="116,88 120,96 124,88" fill="#b8c4cf"/>
<text x="120" y="114" text-anchor="middle" font-size="9" fill="#8a2b3e">三要素齐备，应认定为工伤</text>
</svg>
</div>
<div class="qac">
<p class="q">“公司拖欠工资，我直接去法院起诉，是不是最快？”</p>
<p class="a">不是。劳动争议一般要先申请劳动仲裁，对仲裁裁决不服的，才能向人民法院提起诉讼，这叫<b>仲裁前置</b>。直接起诉，法院一般不予受理。还要盯住时效：申请仲裁的时效期间为一年，从知道或者应当知道权利被侵害之日起计算。另外，向劳动行政部门投诉、举报，是一条可以同时走的路。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="劳动争议先仲裁后诉讼">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="28" text-anchor="middle" font-size="9" fill="#6b7280">顺序反了，法院不受理</text>
<rect x="20" y="44" width="84" height="34" rx="6" fill="#fff" stroke="#f1d3a8"/>
<text x="62" y="65" text-anchor="middle" font-size="9" fill="#8a6320">先 仲 裁</text>
<line x1="104" y1="61" x2="132" y2="61" stroke="#b8c4cf" stroke-width="1.3"/>
<polygon points="132,57 140,61 132,65" fill="#b8c4cf"/>
<rect x="140" y="44" width="80" height="34" rx="6" fill="#fff" stroke="#b8e6d0"/>
<text x="180" y="65" text-anchor="middle" font-size="9" fill="#1e6640">后 诉 讼</text>
<text x="120" y="100" text-anchor="middle" font-size="9" fill="#4a4f57">对裁决不服，15 日内起诉</text>
<text x="120" y="116" text-anchor="middle" font-size="9" fill="#4a4f57">仲裁时效：一年</text>
</svg>
</div>
<div class="qac">
<p class="q">“入职要交 500 元服装押金、身份证先押在公司，是行规吧？”</p>
<p class="a">不是行规，是违法。用人单位招用劳动者，<b>不得扣押劳动者的居民身份证等证件，不得要求劳动者提供担保或者以其他名义向劳动者收取财物</b>。所谓“服装费”“培训押金”“保证金”，都属于变相收费。遇到了可以拒绝，已经交了的可以要求退还，也可以向劳动行政部门投诉。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="用人单位不得收取押金或扣押证件">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="28" text-anchor="middle" font-size="9" fill="#6b7280">这两件事都不能做</text>
<rect x="20" y="44" width="92" height="30" rx="6" fill="#fff1f4" stroke="#fecdd3"/>
<text x="66" y="63" text-anchor="middle" font-size="9" fill="#be123c">扣押身份证</text>
<rect x="124" y="44" width="96" height="30" rx="6" fill="#fff1f4" stroke="#fecdd3"/>
<text x="172" y="63" text-anchor="middle" font-size="9" fill="#be123c">收取押金、保证金</text>
<text x="120" y="96" text-anchor="middle" font-size="9" fill="#8a2b3e">法律禁止，约定也无效</text>
<text x="120" y="114" text-anchor="middle" font-size="9" fill="#4a4f57">已交的可要求退还</text>
</svg>
</div>
</div>
<p class="gx-note">六问其实是同一件事：先看“谁对谁”（劳动关系的主体），再看“做了什么”（单位的行为落在哪项权利或义务上），最后看“走哪条路”（协商、调解、投诉、仲裁、诉讼，一般仲裁在前）。骨架永远是“主体—行为—依据—途径”，材料换成外卖骑手、实习护士、装修工人，这四步不变。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。考前只看这一节，也能捞回几分。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ “没签劳动合同，就不算公司的人，出了事也告不赢。”</p>
<p class="er-v">✓ 劳动关系自用工之日起建立；用人单位应当自用工之日起一个月内与劳动者订立书面劳动合同。</p>
<p class="er-w">错在把“书面合同”当成劳动关系的成立条件。<b>关系看用工，合同是手续</b>。工资支付记录、考勤记录、工作证、同事证言都能证明。看到“没签合同”先别下结论，接着看有没有实际用工。</p>
</div>
<div class="er">
<p class="er-x">✗ “我们这行都是 996，加班费就免了，签了字就算自愿。”</p>
<p class="er-v">✓ 延长工作时间应当依法支付加班费：平日不低于工资的 150%，休息日不能补休的不低于 200%，法定休假日不低于 300%。</p>
<p class="er-w">错在拿行业惯例对抗法律。<b>加班费是法定标准，不是可以协商放弃的福利</b>。写着“自愿加班、不计报酬”的条款，排除劳动者权利，没有法律效力。</p>
</div>
<div class="er">
<p class="er-x">✗ “试用期就是试试，公司一句‘不合适’就能让人走。”</p>
<p class="er-v">✓ 试用期内，劳动者被证明不符合录用条件的，用人单位可以解除劳动合同，并应当说明理由。</p>
<p class="er-w">错在把试用期当成“随便期”。<b>解除要有法定情形，还要有证明</b>；试用期长短有法定上限，同一单位与同一劳动者只能约定一次。答题时把“证明”“说明理由”写出来。</p>
</div>
<div class="er">
<p class="er-x">✗ “车间受伤是他自己操作不小心，公司不承担责任。”</p>
<p class="er-v">✓ 在工作时间和工作场所内，因工作原因受到事故伤害的，应当认定为工伤；工伤保险费由用人单位缴纳。</p>
<p class="er-w">错在拿“过失”当免责理由。<b>工伤认定看时间、场所、原因，不看谁不小心</b>。职工的过失不影响工伤认定，只可能影响其他责任的分配。</p>
</div>
<div class="er">
<p class="er-x">✗ “公司欠工资，直接去法院起诉最快，仲裁太慢。”</p>
<p class="er-v">✓ 发生劳动争议，一般先向劳动争议仲裁委员会申请仲裁，对仲裁裁决不服的，才可以向人民法院提起诉讼。</p>
<p class="er-w">错在跳过仲裁。<b>仲裁前置是程序要求</b>，直接起诉法院一般不受理；还要注意仲裁时效一年，拖过去就麻烦了。</p>
</div>
<div class="er">
<p class="er-x">✗ “入职交押金、押身份证，是行业规矩，大家都这样。”</p>
<p class="er-v">✓ 用人单位招用劳动者，不得扣押居民身份证等证件，不得要求提供担保或者以其他名义向劳动者收取财物。</p>
<p class="er-w">错在把违法当惯例。<b>“服装费”“培训押金”都是变相收费</b>，可以拒绝，已经交的可以要求退还，也可以投诉。</p>
</div>
<div class="er">
<p class="er-x">✗ “单位不交社保，我自己写了‘自愿放弃’,双方同意就没事。”</p>
<p class="er-v">✓ 用人单位和劳动者必须依法参加社会保险、缴纳社会保险费；社会保险是国家强制实行的社会保障制度。</p>
<p class="er-w">错在把强制性义务当成可以处分的权利。<b>社保不是两个人的私事</b>，约定放弃违反法律强制性规定，没有效力。答题写“依法参加社会保险”比写“给点补贴”得分高。</p>
</div>
</div>
<p class="gx-note">七条错句归成三类：把关系看错（第 1 条）、把法定义务看轻（第 2、4、7 条）、把程序走错（第 5 条）、把违法当行规（第 3、6 条）。考前扫一遍，比背整段强；答题时每写一句，先问自己“这句的主体和行为对上了吗”。</p>
</section>
