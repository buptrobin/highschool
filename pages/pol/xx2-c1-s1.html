<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写课本这句，不写你脑子里那句。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 民法管什么<span class="q-src">人教版（2019）选择性必修2 法律与生活 · 第一课</span></p>
<p class="q-b">民法调整平等主体的自然人、法人和非法人组织之间的人身关系和财产关系。</p>
<p class="q-n">→ 翻成人话，这句话由<b>三个条件</b>组成：① 双方是<b>平等主体</b>，谁也不能命令谁；② 管的是<b>人身关系</b>和<b>财产关系</b>两类；③ 主体只有三种——自然人、法人、非法人组织。少一个条件就不是民事法律关系：交警给你开罚单，主体不平等，那是行政关系；犯了罪判刑，那是刑事关系。记这三个条件时抓住“平等”两个字，它是最直接的界碑。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 三个要素<span class="q-src">人教版（2019）选择性必修2 法律与生活 · 第一课</span></p>
<p class="q-b">民事法律关系包括主体、客体和内容三个要素。</p>
<p class="q-n">→ 换成三个问句：<b>主体</b>问“谁和谁”，<b>客体</b>问“冲着什么东西”，<b>内容</b>问“各自能要求什么、必须做什么”。你借同学一支笔，主体是你和他，客体是那支笔，内容是你有还的义务、他有要回的权利。三个空填满，一段材料就拆完了。答题卡上换行写，别把三样糊成一句话。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 权利的边界<span class="q-src">人教版（2019）选择性必修2 法律与生活 · 第一课</span></p>
<p class="q-b">民事主体不得滥用民事权利损害国家利益、社会公共利益或者他人合法权益。</p>
<p class="q-n">→ “我的权利我做主”只对了一半。你有权在自己家放音乐，但半夜开到邻居墙根震，就从“行使权利”变成了“侵害他人合法权益”。<b>权利和义务相对应</b>：你享有权利，就得尊重别人同样的权利。材料里凡出现“我想”“我愿意”，都要顺手补一句“但不能”。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>民事权利能力</th><th>民事行为能力</th></tr></thead>
<tbody>
<tr><td>它回答的问题</td><td>能不能作为民事主体享有权利、承担义务，问的是“有没有资格”</td><td>能不能自己独立实施民事法律行为，问的是“能不能自己动手办”</td></tr>
<tr><td>什么时候开始有</td><td>从出生时起到死亡时止，中间不中断、不暂停</td><td>按年龄和智力状况分三种，一步一步取得</td></tr>
<tr><td>未成年人有没有</td><td>有，一出生就有，和成年与否完全无关</td><td>不一定：不满 8 周岁没有，8 周岁以上只算限制</td></tr>
<tr><td>能不能不要</td><td>不能放弃、不能转让、不能剥夺，也不能用约定排除，本人同意也不行</td><td>不够的部分，由法定代理人代理、同意或者追认来补，越界实施的行为效力待定</td></tr>
<tr class="key"><td>真正的区别</td><td>是一种“资格”，人人都有、一生都有，不用去争取</td><td>是一种“本事”，要看年龄和智力，可能暂时没有</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只高亮 1 行。背法就一句：权利能力管“有没有资格当人”，行为能力管“能不能自己动手”。做选择题先看题目问的是“能不能享有”还是“能不能自己实施”——问前者，婴儿也有；问后者，看年龄。另外提醒一句：表里“不满 8 周岁”只是行为能力的一档，别和“未满 18 周岁”混着说，两者说的不是同一件事。</p>
</section>

<p class="gx-take">权利名称先归栏，再定侵害方式：人身权多为停止侵害、赔礼道歉，财产权多为返还、赔偿。</p>
</figure>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点“下一步”。每一步只推进一个动作。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 材料分析题<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">8 周岁的小明用过年收到的压岁钱，独自在商场买了一部三千元的手机，包装已经拆开。妈妈知道后要求退货，商家说“钱是他自己掏的，货是他自己挑的，买卖已成”。请分析这一买卖中的民事法律关系三要素，并说明小明行为的效力。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性</p>
<p class="s-b">题目要两样东西：三要素、行为效力。先定范围——这是民法调整的财产关系，不是行政关系，也不是刑事关系。再看题型：材料分析，要“分点 + 术语 + 扣材料”，三段式排开。</p>
<p class="s-k">用到：民法调整平等主体之间的人身关系和财产关系。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 找主体</p>
<p class="s-b">材料里两个人：小明、商家。小明是自然人，8 周岁以上未成年人，属限制民事行为能力人；商家是经营者，通常为法人或非法人组织。主体写错，后面的效力判断一定跟着错。</p>
<p class="s-k">用到：民事主体包括自然人、法人、非法人组织。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 找客体</p>
<p class="s-b">双方争的东西是那部手机和三千元价款，都是“物”。注意：客体不是“买卖”这个动作，动作属于法律事实，别混。同理，借钱时客体是那笔钱，不是“借钱”这件事。</p>
<p class="s-k">用到：客体是民事权利和义务所指向的对象。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 写内容</p>
<p class="s-b">商家的权利是收取三千元，义务是交付手机并转移所有权；小明一方的权利是取得手机，义务是支付价款。两边一一对应，这就是“权利义务相对应”。写内容要成对写，别只写一方。</p>
<p class="s-k">用到：内容是民事主体享有的权利和承担的义务。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 判效力，收口</p>
<p class="s-b">8 周岁以上未成年人是限制民事行为能力人，买三千元手机超出与其年龄、智力相适应的范围，须经法定代理人同意或追认。妈妈拒绝追认，该行为确定无效，双方互相返还。最后一句回扣材料，别空喊“违法”。</p>
<p class="s-k">用到：限制民事行为能力、效力待定、追认。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">① 主体：一方是小明，8 周岁以上未成年人，属限制民事行为能力人；另一方是商家，属法人或非法人组织。<br>② 客体：该部手机与三千元价款，均为物。<br>③ 内容：商家享有收取价款的权利、负有交付手机并转移所有权的义务；小明一方享有取得手机的权利、负有支付价款的义务，二者相对应。<br>④ 效力：购买三千元手机超出与小明的年龄、智力相适应的范围，属效力待定的民事法律行为，须经法定代理人同意或追认；其母拒绝追认，行为确定无效，双方返还财产。<br>⑤ 结论：压岁钱归小明所有，不等于他可以独立处分大额财产；权利能力与行为能力不是一回事，这是本题最后一个得分点。<br>（答题时序号和小标题都要写，“效力待定”“追认”这两个术语不能换成口语。）</p>
</div>
</div>
</section>
<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是“你以为懂了、一写就错”的地方。每问配一张小图，先看结论，再读理由。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「民事权利能力和民事行为能力，不是一回事吗？」</p>
<p class="a">不是。差在“资格”和“本事”：权利能力从出生时起到死亡时止，人人都有；行为能力按年龄和智力分档，不一定有。做题时先看问的是<b>能不能享有</b>还是<b>能不能自己实施</b>，问法一变，答案就变。这两个词在题目里常常成对出现，看到就要分开想：先问资格，再问本事，最后才问责任。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="资格与本事是两个概念">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="34" text-anchor="middle" font-size="9.6" font-weight="700" fill="#151a21">资格 ≠ 本事</text>
<text x="120" y="64" text-anchor="middle" font-size="9" fill="#3a3a35">权利能力：出生就有</text>
<text x="120" y="88" text-anchor="middle" font-size="9" fill="#3a3a35">行为能力：看年龄智力</text>
<text x="120" y="112" text-anchor="middle" font-size="8.6" fill="#6b7280">问法一变，答案就变</text>
</svg>
</div>

<div class="qac">
<p class="q">「8 岁的孩子收红包、买文具，算不算数？」</p>
<p class="a">分两笔看。收红包属纯获利益，买文具与年龄、智力相适应，都可以独立实施，<b>有效</b>。买三千元手机就超出这个范围，须由法定代理人代理或经其同意、追认，属<b>效力待定</b>。别一看到“未成年”就写无效。标准是标的额与年龄、智力是否相适应，不是简单看岁数，也不是看家长事后高不高兴。买十元的文具和买三千元的手机，结论本来就不一样。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="8 岁孩子的两笔交易效力不同">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="34" text-anchor="middle" font-size="9.6" font-weight="700" fill="#151a21">同样 8 岁，两笔不同</text>
<text x="120" y="64" text-anchor="middle" font-size="9" fill="#3a3a35">买文具：相适应，有效</text>
<text x="120" y="90" text-anchor="middle" font-size="9" fill="#3a3a35">买手机：超范围，待定</text>
<text x="120" y="112" text-anchor="middle" font-size="8.6" fill="#6b7280">看标的额，不看岁数</text>
</svg>
</div>

<div class="qac">
<p class="q">「未成年人到底有没有民事权利能力？」</p>
<p class="a">有。权利能力与是否成年无关，一出生就有，不能放弃、不能转让、不能剥夺。未成年人缺的是<b>行为能力</b>，不是权利能力。他享有继承权、受赠权、人格权，只是独立行使时可能需要法定代理人代理。换句话讲，他有权利，只是暂时不能一个人把权利行使到底。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="婴儿也有民事权利能力">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="34" text-anchor="middle" font-size="9.6" font-weight="700" fill="#151a21">婴儿也有权利能力</text>
<text x="120" y="64" text-anchor="middle" font-size="9" fill="#3a3a35">继承、受赠：可以有</text>
<text x="120" y="90" text-anchor="middle" font-size="9" fill="#3a3a35">自己签合同：先不行</text>
<text x="120" y="112" text-anchor="middle" font-size="8.6" fill="#6b7280">缺的是行为能力</text>
</svg>
</div>

<div class="qac">
<p class="q">「肖像权、名誉权，是人身权还是财产权？」</p>
<p class="a">是<b>人身权</b>，具体属人格权。它们与人身不可分，不能转让、不能继承。判断时看侵害后果：主要表现为社会评价降低、精神损害，责任方式多为停止侵害、赔礼道歉、消除影响。即使同时判了赔偿，权利性质也不因此变成财产权。答题顺序：先归栏，再说侵害了哪一项，最后才说责任方式。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="肖像权名誉权属于人身权中的人格权">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="34" text-anchor="middle" font-size="9.6" font-weight="700" fill="#151a21">归栏：人身权</text>
<text x="120" y="64" text-anchor="middle" font-size="9" fill="#3a3a35">人格权：肖像、名誉</text>
<text x="120" y="90" text-anchor="middle" font-size="9" fill="#3a3a35">不能转让，不能继承</text>
<text x="120" y="112" text-anchor="middle" font-size="8.6" fill="#6b7280">赔钱不等于财产权</text>
</svg>
</div>

<div class="qac">
<p class="q">「行使自己的权利，怎么还会构成侵权？」</p>
<p class="a">因为权利有边界。民事主体不得滥用民事权利损害国家利益、社会公共利益或者他人合法权益。你有权在自家厨房做饭，但油烟全排进邻居窗户、影响他正常生活，就属于<b>行使方式越界</b>，从行使权利变成了侵害他人权益。所以判断侵权，看的是有没有越过边界、有没有造成损害，不是看“我到底有没有这个权利”。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="权利有边界，越界即侵权">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="34" text-anchor="middle" font-size="9.6" font-weight="700" fill="#151a21">越界即侵权</text>
<text x="120" y="64" text-anchor="middle" font-size="9" fill="#3a3a35">你的权利，到别人门口</text>
<text x="120" y="90" text-anchor="middle" font-size="9" fill="#3a3a35">不得损害他人与公共利益</text>
<text x="120" y="112" text-anchor="middle" font-size="8.6" fill="#6b7280">权利和义务相对应</text>
</svg>
</div>

<div class="qac">
<p class="q">「没有借条，借出去的钱还能要回来吗？」</p>
<p class="a">能，但靠证据。转账记录能证明“钱给了”，还需要借条、聊天记录、录音、证人等证明“这钱是借的”。举证不能，要承担不利后果。所以出借时写清金额、时间、还款期限，比事后争吵有用得多。这类材料题的得分点通常是三个词：证据、举证责任、借贷合意。少一个词，理由就虚。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="转账记录需要其他证据补强">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="34" text-anchor="middle" font-size="9.6" font-weight="700" fill="#151a21">转账记录 ≠ 借条</text>
<text x="120" y="64" text-anchor="middle" font-size="9" fill="#3a3a35">能证明：钱给了</text>
<text x="120" y="90" text-anchor="middle" font-size="9" fill="#3a3a35">还要证明：这钱是借的</text>
<text x="120" y="112" text-anchor="middle" font-size="8.6" fill="#6b7280">证据不足，担不利后果</text>
</svg>
</div>
</div>
<p class="gx-note">六问其实是同一件事：先定主体（谁、几岁、什么身份），再定行为（做了什么、指向什么），然后对应概念，最后才写责任。三个扣分点——权利能力不等于行为能力、未成年人也有权利能力、权利不能越界——全部长在这条链上。链子断在第一环，后面的术语写得再漂亮也拿不到分。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。考前扫一遍，把右边的句子读熟。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 未成年人没有民事权利能力，等他满 18 岁才有。</p>
<p class="er-v">✓ 自然人的民事权利能力始于出生、终于死亡；未成年人有权利能力，缺的是与其年龄相适应的民事行为能力。</p>
<p class="er-w">错在哪：把“资格”和“本事”混成一个词。权利能力与成年无关，一出生就有。题干里出现“婴儿”“胎儿”，也不能顺手答“没有权利能力”。</p>
</div>

<div class="er">
<p class="er-x">✗ 8 岁小孩买东西一律无效，家长可以随便退。</p>
<p class="er-v">✓ 8 周岁以上未成年人是限制民事行为能力人，与其年龄、智力相适应的行为有效；超出范围的属效力待定，经法定代理人同意或追认后有效。</p>
<p class="er-w">错在哪：“无效”和“效力待定”是两个结论。前者自始不发生效力，后者还要看家长追不追认。这道题必须写出“效力待定”四个字，写“可撤销”就偏了。</p>
</div>

<div class="er">
<p class="er-x">✗ 16 岁进厂打工，自己养活自己，就是成年人了。</p>
<p class="er-v">✓ 16 周岁以上、以自己的劳动收入为主要生活来源的，视为完全民事行为能力人；但他仍是未成年人。</p>
<p class="er-w">错在哪：“视为完全”只解决行为能力，不改变未成年人的身份，也不等于已满 18 周岁。法定婚龄、选举权这些限制也一样都没解除。</p>
</div>

<div class="er">
<p class="er-x">✗ 我自己的照片、我自己的名声，我想怎么用就怎么用。</p>
<p class="er-v">✓ 未经同意，不得制作、使用、公开他人肖像；不得以侮辱、诽谤等方式侵害他人名誉权。</p>
<p class="er-w">错在哪：把权利当成没有边界的权力。权利和义务相对应，行使权利不得损害他人合法权益。</p>
</div>

<div class="er">
<p class="er-x">✗ 只要没动手打人，就不算侵权。</p>
<p class="er-v">✓ 侵权行为包括侵害人身权和财产权。造谣、偷拍、擅自公开他人信息、摔坏他人财物，都可能构成侵权。</p>
<p class="er-w">错在哪：把侵权等同于人身伤害，漏掉人格权和财产权这两大块。材料里凡出现“拍”“发”“造谣”“摔坏”，先想它落在哪一栏。</p>
</div>

<div class="er">
<p class="er-x">✗ 借钱只有转账记录，法院一定支持我。</p>
<p class="er-v">✓ 转账记录是证据，但需与其他证据结合证明借贷合意；举证不能的，由负有举证责任的一方承担不利后果。</p>
<p class="er-w">错在哪：混淆“有证据”和“证据充分”。转账只能证明款项交付，证明不了款项性质。</p>
</div>

<div class="er">
<p class="er-x">✗ 民法管一切纠纷，欠钱、打架、闯红灯都归民法管。</p>
<p class="er-v">✓ 民法调整平等主体之间的人身关系和财产关系；行政违法由行政法调整，犯罪由刑法调整。</p>
<p class="er-w">错在哪：调整范围答错，整道题的方向就错了。先问主体是否平等，再问侵犯的是哪类关系。</p>
</div>
</div>
