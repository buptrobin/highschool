<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">这一框的答案压在三句话上：理想信念管方向，人民管为谁，时代与资源管从哪儿来、用什么料。先照抄，再拆词，最后看哪个动词最容易写串。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 坚定理想信念，坚持以人民为中心<span class="q-src">人教版（2019）必修4 哲学与文化 · 第九课第二框</span></p>
<p class="q-b">发展中国特色社会主义文化，必须坚持以马克思主义为指导，坚定共产主义理想信念，坚持以人民为中心，把增进人民福祉、促进人的全面发展作为出发点和落脚点。</p>
<p class="q-n">→ 翻成人话：一句话塞了三个条件。①谁指导：马克思主义；②信什么：共产主义理想信念；③为谁：人民。最后半句是落点——增进人民福祉、促进人的全面发展。答题时三个条件一起写，只写「以人民为中心」，就把「方向」那一半丢了。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 人民是主体，也是评判者<span class="q-src">人教版（2019）必修4 哲学与文化 · 第九课第二框</span></p>
<p class="q-b">人民是文化发展的主体，也是文化成果的享有者。要坚持以人民为中心的创作导向，贴近实际、贴近生活、贴近群众，把人民作为文化表现的主体、作为文化审美的评判者。</p>
<p class="q-n">→ 翻成人话：人民有三个身份，别写成一个。第一个是主体：好东西是群众干出来的，要尊重首创精神。第二个是表现对象：作品里得写普通人的劳动、难处和选择。第三个是评判者：好不好，群众说了算，不是圈子里互相夸。三个「贴近」是做法：贴近实际、贴近生活、贴近群众。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 立足时代之基，融通不同资源<span class="q-src">人教版（2019）必修4 哲学与文化 · 第九课第二框</span></p>
<p class="q-b">文化是社会实践的产物，每一种文化都打上了时代的烙印。社会实践是文化创新的源泉和动力。文化发展要立足时代之基，回答时代问题。要融通古今中外各种资源，实现综合创新，坚持不忘本来、吸收外来、面向未来。</p>
<p class="q-n">→ 翻成人话：前两句讲来源——文化不是坐在屋里想出来的，是干出来的；时代给你题材，也给你难题。第三句讲用料：本来的（传统）不能丢，外来的（外国）要吸收，未来的（趋势）要看见。「以我为主、为我所用」是这里的尺子，不是把三样东西堆在一起就算融通。</p>
</div>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。五步走完，答案的骨架自己就长出来了。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 措施类材料题<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">材料：某老工业城市转型，把废弃的纺织厂改成文创园，保留车间钢梁和旧机器，招来书店、剧场、设计工作室；市电视台拍了一部纪录片，主角是三位还在岗的挡车工和一位转行做直播的年轻女工，播出后不少外地人专程来看；市里还和国外团队合作，用数字技术复原了本地一段快要失传的织造工艺，做成沉浸式演出。与此同时，个别账号在文创园门口直播「扮丑打卡」，靠编苦情故事涨粉，引来未成年人模仿。结合材料，运用文化发展的基本路径的知识，说明该市应如何推动文化发展。（12 分）</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性</p>
<p class="s-b">题型是「怎么办」，知识范围是「文化发展的基本路径」，落点就在第九课第二框。设问要答四层：定方向、找主体、扎实践、配资源。草稿上先写四个词：理想信念、以人民为中心、立足时代之基、融通古今中外。</p>
<p class="s-k">用到：措施类设问的四层结构（方向 + 主体 + 来源 + 资源）</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 把材料分堆</p>
<p class="s-b">材料里的做法其实是三堆，外加一个问题。第一堆是改造旧厂房、保留钢梁和机器，属于立足本地实践的转型现场。第二堆是拍挡车工和转行女工，属于把普通人当主角。第三堆是和国外团队合作复原织造工艺，属于融通中外。问题是门口的低俗直播，属于只追流量。</p>
<p class="s-k">用到：按「做法—对应路径」分堆，别按段落顺序抄材料</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 定方向、定主体</p>
<p class="s-b">先写方向：坚持以马克思主义为指导，坚定共产主义理想信念，坚持以人民为中心。再写主体：人民是文化发展的主体，也是享有者；文创园、纪录片把挡车工、女工放在画面中间，就是以人民为表现主体，让群众当评判者。落点是增进人民福祉、促进人的全面发展。</p>
<p class="s-k">用到：坚定理想信念、以人民为中心的创作导向</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 讲来源、讲用料</p>
<p class="s-b">来源这一条要写出「回答了什么」：老工业城市怎么转型、工人怎么转身，这是时代问题；把车间留下来、把工人的故事拍下来，是从实践里取材。用料这一条要写出立场：数字技术是外来的、织造工艺是本来的，以我为主、为我所用，做成今天观众愿意看的沉浸式演出，这叫综合创新。</p>
<p class="s-k">用到：社会实践是源泉和动力、融通古今中外</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口与自查</p>
<p class="s-b">最后用社会效益收口：低俗直播有人看，但不能算文化发展的成果，要把社会效益放在首位，社会效益和经济效益相统一。写完查三处：四条路径有没有缺、每条后面有没有挂材料、有没有把「流量大」当成成功。</p>
<p class="s-k">用到：社会效益首位 + 三句自查</p>
</li>
</ol>

<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">① 坚定理想信念，坚持以马克思主义为指导。<br>发展中国特色社会主义文化，必须坚定共产主义理想信念，坚持以人民为中心。该市把工业遗产留下来、把工人的故事拍出来，传递的是劳动光荣、踏实奋斗的价值导向，为城市转型提供了精神力量。<br>② 坚持以人民为中心的创作导向。<br>人民是文化发展的主体，也是文化成果的享有者。纪录片把挡车工和转行女工放在主角位置，把人民作为文化表现的主体；文创园让市民进得来、看得懂、愿意来，把人民作为文化审美的评判者，落点是增进人民福祉、促进人的全面发展。<br>③ 立足时代之基，回答时代问题。<br>文化是社会实践的产物，社会实践是文化创新的源泉和动力。该市立足老工业城市转型这一现实，回答的是「工业遗产怎么用、下岗工人怎么转身」的时代问题，所以作品有时代烙印，也能让同时代的人认出自己。<br>④ 融通古今中外，实现综合创新。<br>要坚守中华文化立场，坚持以我为主、为我所用。该市用数字技术复原本地织造工艺，把本来的传统、外来的技术和今天的审美接在一起，坚持不忘本来、吸收外来、面向未来，做出了群众愿意看的新形式。<br>⑤ 把社会效益放在首位，坚持社会效益和经济效益相统一。<br>个别账号靠扮丑、编苦情故事涨粉，虽然有人看，但迎合低级趣味、误导未成年人，不属于人民真正的精神文化需求。文化发展不能只看流量，要用健康向上的内容占领阵地。<br>⑥ 结论：推动文化发展，要坚持方向、主体、来源、资源四条路径一起走，并以社会效益为首位，这样才能发展面向现代化、面向世界、面向未来的，民族的科学的大众的社会主义文化。</p>
