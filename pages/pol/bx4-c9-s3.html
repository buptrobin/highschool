<p class="gx-lede">周末你逛商场，看见两个摊位。一边是博物馆文创，把青铜纹样印在帆布包上，队排得很长；另一边是进口文具，包装上写着「原装」。同学顺口一句「还是人家的好」，你愣了一下，没接上话。这一框就教你怎么接：我们凭什么对自己的文化有底气，这份底气又怎么变成一个文化强国。它是第九课的最后一框，也是必修4的收尾——前面讲走什么路、怎么走，这里讲走到哪儿、靠什么走。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">这一框的答案压在两件事上：文化强国讲「建成什么」，文化自信讲「凭什么建成」。先照抄课本，再拆关键词，最后看清哪两组词最容易被写成同义词。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 建设社会主义文化强国的总要求<span class="q-src">人教版（2019）必修4 哲学与文化 · 第九课第三框</span></p>
<p class="q-b">建设社会主义文化强国，要坚定文化自信，牢牢把握社会主义先进文化前进方向，围绕举旗帜、聚民心、育新人、兴文化、展形象的使命任务，坚持为人民服务、为社会主义服务，坚持百花齐放、百家争鸣，坚持创造性转化、创新性发展，激发全民族文化创新创造活力。</p>
<p class="q-n">→ 翻成人话：这一句里有四样东西。①方向：牢牢把握社会主义先进文化前进方向，先问为谁服务、朝哪走；②使命任务：举旗帜、聚民心、育新人、兴文化、展形象，五个动宾短语，一个都不能少；③三个坚持：为人民服务、为社会主义服务，百花齐放、百家争鸣，创造性转化、创新性发展；④落点：激发全民族文化创新创造活力。答题时「建设文化强国」后面只跟一句「大力发展文化产业」，目标就被写小了。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 文化自信的地位和来源<span class="q-src">人教版（2019）必修4 哲学与文化 · 第九课第三框</span></p>
<p class="q-b">文化自信是一个国家、一个民族发展中更基本、更深沉、更持久的力量。文化自信来自对时代发展潮流、中国特色社会主义伟大实践的深刻把握，来自对自身文化价值的充分肯定、对自身文化生命力的坚定信念。</p>
<p class="q-n">→ 翻成人话：第一句讲地位，三个「更」落在「力量」上，不是「情绪」。第二句讲来源，两个「来自」：一个朝外看，看清时代往哪走、我们干成了什么；一个朝内看，肯定自己的文化有价值、相信它还有生命力。两个来源都要有，只写「我感到自豪」，只占了半个。这里有个坑：另有一组「更基础、更广泛、更深厚」，说的是文化自信在各种自信里排哪儿，两组别记串。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 三个「事关」和三个「对象」<span class="q-src">人教版（2019）必修4 哲学与文化 · 第九课第三框</span></p>
<p class="q-b">坚定文化自信，事关国运兴衰、事关文化安全、事关民族精神独立性。要坚定对中华优秀传统文化、革命文化、社会主义先进文化的自信。</p>
<p class="q-n">→ 翻成人话：前一句是分量，三个「事关」说明它不是文化部门一家的事；后一句是对象，三个「文化」从古代排到革命年代再到今天，是一条线，不是三选一。考法很固定：问「为什么重要」答三个事关，问「对什么自信」答三个对象。把这两组答反，是这一框最常见的失分点。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>容易混的说法</th><th>教材口径</th></tr></thead>
<tbody>
<tr><td>文化强国是什么</td><td>票房高、场次多、园区大</td><td>国民素质和社会文明程度达到新高度，国家文化软实力显著增强</td></tr>
<tr><td>靠什么建成</td><td>多修场馆、多办演唱会</td><td>坚定文化自信，把握社会主义先进文化前进方向，围绕五项使命任务，激发全民族文化创新创造活力</td></tr>
<tr><td>自信从哪来</td><td>历史长，所以当然自信</td><td>来自对时代发展潮流、中国特色社会主义伟大实践的深刻把握，来自对自身文化价值的充分肯定、对自身文化生命力的坚定信念</td></tr>
<tr><td>自信和自大</td><td>说自己最好，别人的不值一看</td><td>肯定自身价值，同时以我为主、为我所用，加强交流互鉴</td></tr>
<tr><td>自信和自卑</td><td>外国什么都好，自己的拿不出手</td><td>病根是看不见自身文化的价值，也不信它还有生命力</td></tr>
<tr><td>对什么自信</td><td>只对古代那一段自信</td><td>中华优秀传统文化、革命文化、社会主义先进文化，三个都要</td></tr>
<tr class="key"><td>一句话总口径</td><td>自信就是多喊口号、多夸祖先</td><td>自信来自实践，强国靠建设：方向 ＋ 五项使命任务 ＋ 三个坚持 ＋ 创新创造活力</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只高亮最后一行：<b>自信来自实践，强国靠建设</b>。前六行回答「每一项具体长什么样」，最后一行回答「答题时怎么把两半接上」。背法记三个问句：建成什么、凭什么建成、对什么自信。考场上先看设问落在哪一句：问「是什么」用第一行，问「为什么重要」用三个事关，问「怎么办」就把总口径拆成方向、任务、三个坚持、活力四层写。顺序别倒——先有底气，再谈建成；倒过来写，就成了「先有钱再有文化」，正好掉进易错点。</p>
</section>

<p class="gx-h2s">四张图按一条线排：先看目标长什么样，再看底气是什么、从哪来，最后看你能做什么。每张只回答一个问题，看完能自己复述一遍，就算过关。</p>

<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。五步走完，答案的骨架自己就长出来了。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 措施类材料题<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">材料：某县推进「文化强县」。把废弃的老粮仓改成非遗工坊，请传承人每周教市民扎染、竹编；县剧团把本地民歌改成小剧场演出，一年进校园演四十场；县里拍了一部短片《老手艺的一天》，配英文字幕在海外账号上线，有外国网友留言问「这手艺现在还收徒弟吗」；一所中学组织「家乡文化寻访」，学生给老手艺人拍短视频、做双语介绍；县里还打算把「游客数量」「网红打卡点数量」写进年度考核。结合材料，运用文化强国与文化自信的知识，说明该县应如何增强文化自信、建设文化强国。（12 分）</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性</p>
<p class="s-b">题型是「怎么办」，知识范围是「文化强国与文化自信」，落点在第九课第三框。设问要答四层：目标方向、自信来源、创新转化、青年担当。草稿上先写四个词：先进文化、使命任务、实践、时代新人。</p>
<p class="s-k">用到：措施类设问的四层结构（方向 ＋ 任务 ＋ 来源 ＋ 主体）</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 把材料分堆</p>
<p class="s-b">材料里的做法是三堆，外加一处误区。第一堆是粮仓改工坊、传承人教市民，属于把文化送到人身边。第二堆是短片出海，属于展形象、增强软实力。第三堆是学生寻访、拍短视频，属于青年在实践中传承。误区是把游客数量、打卡点数量当考核指标。</p>
<p class="s-k">用到：按「做法—对应知识点」分堆，别按段落顺序抄材料</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 定方向、排任务</p>
<p class="s-b">先写方向：牢牢把握社会主义先进文化前进方向。再排五项使命任务，挑材料能对上的写：工坊和进校园是「兴文化」，教市民、教学生是「育新人」，用本地民歌凝聚乡情是「聚民心」，短片出海是「展形象」。落点写激发全民族文化创新创造活力。</p>
<p class="s-k">用到：建设文化强国的总要求、五项使命任务</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 讲自信、讲转化</p>
<p class="s-b">自信这一段必须落到「来源」：老粮仓、老手艺是本地人干出来的，也是还在传的手艺，这是对伟大实践的把握，也是对自身文化价值的肯定和对生命力的信念。再补转化：手艺进课堂、进短片、进文创，是创造性转化、创新性发展，不是原样锁进玻璃柜。</p>
<p class="s-k">用到：文化自信的两个「来自」、三个对象、创造性转化和创新性发展</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口与自查</p>
<p class="s-b">收口三句：讲好中国故事、增强文化软实力；青年成为担当民族复兴大任的时代新人；把「游客数量、打卡点数量」这类规模指标纠回来，文化强国看方向、任务和活力，社会效益要放在首位。写完查三处：四层有没有缺、每条后面有没有挂材料、有没有把「热闹」当成「强」。</p>
<p class="s-k">用到：软实力 ＋ 时代新人 ＋ 纠正规模误区</p>
</li>
</ol>
<div class="exbar">

<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">① 坚定文化自信，牢牢把握社会主义先进文化前进方向。<br>该县把老粮仓改成非遗工坊、请传承人教市民，是把公共文化服务送到人身边，让文化成果由人民共享，方向没有偏。<br>② 围绕举旗帜、聚民心、育新人、兴文化、展形象的使命任务。<br>用本地民歌、老手艺这些「身边的文化」凝聚乡情、教育青少年，就是在完成聚民心、育新人、兴文化的任务；短片出海，是展形象。<br>③ 推动中华优秀传统文化创造性转化、创新性发展。<br>扎染、竹编不能只摆在展柜里，要变成课程、短片和文创，赋予其现代表达形式，让它回到今天的生活。<br>④ 文化自信来自对时代发展潮流、中国特色社会主义伟大实践的深刻把握，来自对自身文化价值的充分肯定、对自身文化生命力的坚定信念。<br>老粮仓、老手艺记录的是本地人民的实践，今天还有人学、有人用，说明它仍有生命力；讲它、拍它，就是从实践中长出的自信。<br>⑤ 增强文化软实力，讲好中国故事。<br>短片配英文字幕在海外上线，让外国观众看见真实的中国县城并产生兴趣，这是提升国家文化软实力、展形象的具体做法。<br>⑥ 青年要成为担当民族复兴大任的时代新人。<br>学生参加家乡文化寻访、给老手艺人拍短视频、做双语介绍，是在实践中传承、在传播中创新。<br>⑦ 纠正误区：文化强国不等于游客多、打卡点多。<br>把数量当考核指标，容易只追规模不看内容。应把社会效益放在首位，用方向、使命任务和全民族文化创新创造活力来衡量建设成效。</p>

<h2><span class="sn">05</span>会怎么考</h2>

<div class="gx-qa">

<div class="qac">
<p class="q">「文化自信，是不是就是觉得自己的文化最好？」</p>
<p class="a">不是。自信的落点有两个：<b>对自身文化价值的充分肯定</b>、<b>对自身文化生命力的坚定信念</b>。它允许你说「这一处不如人」，也要求你去学；自大才是把门关上，只留一句「我们最好」。材料里出现「拒绝交流」「不必学」，就要从自信改判成自大。</p>

<text x="120" y="114" text-anchor="middle" font-size="8.2" fill="#6b7280">中间那条才叫自信</text>

</div>

<div class="qac">
<p class="q">「文化强国是不是文化产业规模大、票房高就算？」</p>
<p class="a">不算。教材的目标是<b>国民素质和社会文明程度达到新高度，国家文化软实力显著增强</b>，路径是方向、五项使命任务和激发全民族文化创新创造活力。产值、场次可以写，但它们是结果，不是标准。规模再大，内容低俗、方向偏了，也不叫文化强国。</p>

</div>

<div class="qac">
<p class="q">「文化自信是宣传出来的吗？多喊几句口号就自信了？」</p>
<p class="a">不是。课本写得很硬：自信<b>来自对时代发展潮流、中国特色社会主义伟大实践的深刻把握</b>，也来自对自身文化价值的肯定。前一个「来自」靠事实：脱贫、治水、造桥、抗疫，都是实践给出的证据；后一个「来自」靠了解：读过、看过、动手做过。只喊口号，两个来源都空着。</p>

<div class="qac">
<p class="q">「三个对象怎么记？只对传统文化自信行不行？」</p>
<p class="a">不行。三个对象是<b>中华优秀传统文化、革命文化、社会主义先进文化</b>，从古代到革命年代再到今天，是一条线。只写传统文化，等于把近一百年的奋斗和今天正在建设的文化都丢了；反过来只写先进文化，又会把根拔掉。答题时三个词一起出现最稳。</p>

</div>

<div class="qac">
<p class="q">「为什么说文化自信事关国运兴衰、文化安全、民族精神独立性？」</p>
<p class="a">因为它量的是力量，不是情绪。<b>更基本、更深沉、更持久</b>这三个词说明它沉在底下：国运要靠精神支撑，文化安全要靠认同守住，民族精神独立性要靠自己的价值判断站住。三个「事关」一写出来，文化自信就从「个人感受」变成「国家层面的事」。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="文化自信的三个事关">

<text x="24" y="78" font-size="8.4" fill="#3a3a35">· 事关文化安全</text>
<text x="24" y="98" font-size="8.4" fill="#3a3a35">· 事关民族精神独立性</text>
<text x="24" y="118" font-size="8.2" fill="#6b7280">所以不是文化部门一家的事</text>
</svg>
</div>

<div class="qac">
<p class="q">「青年能做什么？答题写『青少年要努力』够不够？」</p>
<p class="a">不够，要写出动作。四个动作：<b>学</b>（读、看、访）、<b>信</b>（认同价值，不因别人说不好就怀疑）、<b>传</b>（用听得懂的话讲身边的故事）、<b>创</b>（把老手艺做成今天的样子）。落点一句：成为<b>担当民族复兴大任的时代新人</b>。</p>

</div>
<p class="gx-note">六问其实是同一件事：都在问「这份底气从哪来、又要变成什么」。前两问问边界——自信不是自大，强国不是规模；中间两问问来源和对象——根在实践，对象是三个文化；后两问问分量和主体——它事关国运，也得靠人来做。想通这一件事，六问的答案会自动对上，材料题也不容易只写一句「要坚定文化自信」就交卷。</p>
