<p class="gx-claim">一句话说清本节最该记住的判断：规律是事物运动过程中<b>固有的、本质的、必然的、稳定的联系</b>；规律<b>客观</b>又<b>普遍</b>，人不能创造、不能消灭，只能认识和利用，所以要把尊重客观规律和发挥主观能动性结合起来。</p>
<div class="gx-meta">
<span><i></i>人教版（2019）必修4 哲学与文化 · 第二课第二框</span>
<span><i></i>高一 · 第二课 探究世界的本质</span>
<span><i></i>阅读 15 分钟</span>
<span><i></i>含 1 个情境判断器</span>
</div>
<p class="gx-lede">你已经知道世界是物质的。接下来这一框问的是：物质在不在动、动起来有没有规矩。班里的植物角最说明问题——同样的绿萝，有人天天浇水浇到烂根，有人一周浇一次反而长得旺；月考前一天熬夜到两点，第二天做题错得更多。两件事都不是「不够努力」，是没按对象本来的样子用力。这一框的位置就在必修4第一单元「探索世界与把握规律」的第二课，前一框讲世界是物质的，这一框讲物质怎么运动、运动的规矩是什么，下一课才讲人怎么认识世界。最容易错的一件事：把规律当成「人总结出来的一句话」，于是觉得规律可以商量、可以创造，甚至觉得人定胜天。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">这一框的答案全压在两句上：规律是什么，人拿规律怎么办。先照抄定义，再拆那四个词，最后落到「一切从实际出发，实事求是」。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 规律的含义<span class="q-src">人教版（2019）必修4 哲学与文化 · 第二课第二框</span></p>
<p class="q-b">规律是事物运动过程中固有的本质的必然的稳定的联系。</p>
<p class="q-n">→ 翻成人话：这句话的主语是「联系」，不是「事物」，也不是「人说的话」。四个词是四道筛子：<b>固有的</b>——它本来就在事物里面，不是谁从外面贴上去的；<b>本质的</b>——它藏在表面现象背后，管的是「为什么会这样」；<b>必然的</b>——条件具备就一定会出现，不是碰巧；<b>稳定的</b>——会反复起作用，不是今天这样明天那样。四个词缺一个，就不是规律。你答「苹果熟了会掉地上」只是现象，答「万有引力」才碰到规律；答「这次考试我考砸了」只是现象，答「不复习就考不好」才像规律。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 规律的客观性与普遍性<span class="q-src">人教版（2019）必修4 哲学与文化 · 第二课第二框</span></p>
<p class="q-b">规律是客观的，是不以人的意志为转移的。规律是普遍的。</p>
<p class="q-n">→ 翻成人话：两句话，一句讲「你改不了它」，一句讲「你躲不开它」。客观性有三层意思，答题时按顺序想：第一，它不以人的意志为转移，你希望它变它也不变；第二，人不能创造规律，也不能消灭规律，更不能违背规律；第三，人可以认识和利用规律，为人类造福——注意第三层是「认识、利用」，不是「发明、改造」。普遍性说的是规律不挑地方：自然界有，人类社会有，人的思维里也有。做选择题时，「人可以创造规律」「人可以改变规律」「人可以消灭规律」这三句都错，改成「认识和利用」才对。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 一切从实际出发，实事求是<span class="q-src">人教版（2019）必修4 哲学与文化 · 第二课第二框</span></p>
<p class="q-b">一切从实际出发，实事求是，就是我们做事情要尊重物质运动的客观规律，从客观存在的事物出发，经过调查研究，找出事物本身固有的而不是臆造的规律性，作为我们行动的依据。</p>
<p class="q-n">→ 翻成人话：这一句是本节最能直接抄进答题卡的长句，里面藏着三个动作：<b>尊重规律</b>（先承认事情有它自己的走法）、<b>从客观存在的事物出发</b>（先看事实，不看愿望）、<b>调查研究</b>（去找那个「固有的而不是臆造的」规律，然后拿它当行动依据）。注意「而不是臆造的」这五个字：它把主观想象直接排除掉了。课本接着说，还要充分发挥主观能动性，把发挥主观能动性和尊重客观规律结合起来，把高度的革命热情同严谨踏实的科学态度结合起来；既要反对夸大意识能动作用的唯意志主义，又要反对片面强调客观条件、安于现状、因循守旧、无所作为的思想。</p>
</div>

<p class="gx-note">整张表只高亮一行：规律和现象。这是本节第一个扣分点——材料给你「苹果落地」「价格波动」「湖水变绿」，那是现象；问你「体现了什么规律」，你得往上一层走。第二处要盯住的是「规则」：规律在人之外，规则在人手里；规律不能改，规则能改。所以「修改法律」不等于「修改规律」，「制定计划」也不等于「创造规律」。答题时把这三层分清，选择题里那些「人可以创造规律」「人可以消灭规律」「人可以改变规律」的选项，一眼就能排掉。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。五步走完，「怎么做」类大题的骨架就出来了。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 措施类材料题<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">材料：某县过去发展养殖，看邻县养虾赚钱就跟着挖塘，两年下来虾病成片、亏了不少。后来县里组织人下村测水质、查气象记录、请水产站技术员一起分析，发现本地水偏淡、夏季水温高，适合养蟹不适合养虾。县里据此改了规划：划定养殖区，推广蟹苗和配套的水草种植，还建了水质监测点。三年后，养蟹成了当地的支柱产业，外出打工的年轻人也回来了不少。结合材料，运用「探究世界的本质」的知识，说明该县是如何做到一切从实际出发、实事求是的。（12 分）</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性</p>
<p class="s-b">设问问「如何做到」，是措施类，答案要写「做法 + 对应的道理」，不能只写道理，也不能只复述材料。知识范围是「探究世界的本质」，也就是第二课：物质、运动、规律、一切从实际出发。12 分，一般四点以上。</p>
<p class="s-k">用到：措施类设问的答法（做法 + 原理）</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 找主体和行为</p>
<p class="s-b">材料里做事的是县里：先跟着邻县挖塘（错的一步），再组织人测水质、查气象、请教技术员，然后改规划、划养殖区、建监测点。行为可以归成两类：一类是「去了解本地到底什么样」，一类是「按了解到的情况改做法」。</p>
<p class="s-k">用到：从材料里提取主体与行为</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 对应原理</p>
<p class="s-b">「跟着邻县挖塘」违反了什么？——从主观愿望和别人的经验出发，没看本地条件，属于脱离实际。「测水质、查气象、请技术员」是什么？——调查研究，去找事物本身固有的、而不是臆造的规律性。「改规划、划养殖区、建监测点」是什么？——把找到的规律当行动依据，按规律办事。</p>
<p class="s-k">用到：从客观存在的事物出发、调查研究、作为行动依据</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 补上「两头」</p>
<p class="s-b">只答「尊重规律」不够，还得答人的动作：县里主动去测、去请人、去改规划，这就是发挥主观能动性；而且是把尊重规律和发挥主观能动性结合起来。再补一句反面的：反对从主观愿望出发、照抄外地经验，也反对亏了以后什么都不做。</p>
<p class="s-k">用到：尊重客观规律与发挥主观能动性相结合、反对两种错误倾向</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口</p>
<p class="s-b">结尾回扣材料的结果：三年后养蟹成了支柱产业，年轻人回来了。这说明按规律办事才有实效。写的时候一句原理跟一句材料，不要开头一大段原理、结尾一大段材料，中间不接头。</p>
<p class="s-k">用到：原理与材料一一对应</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">① 坚持从客观存在的事物出发，而不是从主观愿望出发。该县起初看邻县养虾赚钱就跟着挖塘，脱离了本地水质、气候的实际，结果虾病成片；后来先从本地的水、土、气候看起，才把方向摆正。<br>② 坚持调查研究，找出事物本身固有的而不是臆造的规律性。该县组织人员下村测水质、查气象记录，请水产站技术员一起分析，得出本地水偏淡、夏季水温高、适合养蟹不适合养虾的结论，这就是把握了本地养殖的规律。<br>③ 把找出的规律作为行动的依据，按客观规律办事。该县据此改规划，划定养殖区，推广蟹苗和水草种植，建水质监测点，让生产安排服从养殖规律，三年后养蟹成为支柱产业。<br>④ 把尊重客观规律和发挥主观能动性结合起来。该县既尊重本地水土和养殖的规律，又主动去测、去请人、去改规划、去建监测点，不是等条件自己变好；既反对夸大意识能动作用、凭愿望蛮干，也反对亏了以后安于现状、无所作为。<br>结论：一切从实际出发、实事求是，说到底就是把「事实—规律—行动」这条链接上，接上了才有效。</p>
</div>
</div>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。每问先自己答一句，再看下面那句。</p>
<div class="gx-qa">

<div class="qac">
<p class="q">「规律和现象，到底怎么分？」</p>
<p class="a">现象是规律的外在表现，看得见、多变；规律是背后的联系，看不见、稳定。苹果落地是现象，万有引力是规律；价格涨跌是现象，价值规律是规律。材料给的几乎都是现象，你要做的是往上一层<b>抽出规律</b>，而不是把现象再描述一遍。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="现象看得见，规律要靠思维把握">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="28" font-size="9" text-anchor="middle" fill="#151a21">现象在上，规律在下</text>
<rect x="18" y="40" width="204" height="28" rx="7" fill="#ffffff" stroke="#dbe7ef"/>
<text x="120" y="59" font-size="8.8" text-anchor="middle" fill="#3a3a35">看得见：苹果落地、价格涨跌</text>
<path d="M 120 72 L 120 86" stroke="#c9d6df" stroke-width="2"/>
<path d="M 115 86 L 120 94 L 125 86 Z" fill="#c9d6df"/>
<rect x="18" y="94" width="204" height="22" rx="7" fill="#eef8f2" stroke="#b8e6d0"/>
<text x="120" y="109" font-size="8.8" text-anchor="middle" fill="#1e6640">看不见：万有引力、价值规律</text>
</svg>
</div>

<div class="qac">
<p class="q">「规律是客观的，那人到底能对规律做什么？」</p>
<p class="a">只能做三件：<b>认识</b>它、<b>利用</b>它、改变它起作用的条件。不能做的也有三件：创造、消灭、违背。答题时把这两组词分开，「人可以认识和利用规律」是采分句，「人可以创造规律」「人可以改变规律」是错句，考试专拿这两句设套。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="人对规律能和不能做的事">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>

<text x="66" y="72" font-size="8.2" text-anchor="middle" fill="#3a3a35">认识</text>
<text x="66" y="88" font-size="8.2" text-anchor="middle" fill="#3a3a35">利用</text>
<text x="66" y="102" font-size="8.2" text-anchor="middle" fill="#3a3a35">改变条件</text>
<rect x="124" y="36" width="100" height="72" rx="7" fill="#fdf3f4" stroke="#f3c9cf"/>
<text x="174" y="54" font-size="8.8" font-weight="700" text-anchor="middle" fill="#9f1239">不能做</text>
<text x="174" y="72" font-size="8.2" text-anchor="middle" fill="#3a3a35">创造</text>
<text x="174" y="88" font-size="8.2" text-anchor="middle" fill="#3a3a35">消灭</text>
<text x="174" y="102" font-size="8.2" text-anchor="middle" fill="#3a3a35">违背</text>
</svg>
</div>

<div class="qac">
<p class="q">「既然规律改不了，那人不就只好听天由命？」</p>
<p class="a">这是相反的错法。规律客观，不等于人在规律面前无能为力。人可以发挥主观能动性去认识它、利用它，还能改变它起作用的条件，让它在想要的地方起作用、在不想要的地方不起作用。课本专门反对「片面强调客观条件、安于现状、因循守旧、无所作为」。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="规律客观不等于听天由命">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="26" font-size="9" text-anchor="middle" fill="#151a21">两头都堵住，中间才是答案</text>
<rect x="18" y="36" width="204" height="24" rx="6" fill="#fdf3f4" stroke="#f3c9cf"/>
<text x="30" y="52" font-size="8.4" fill="#9f1239">唯意志主义：硬来</text>
<rect x="18" y="66" width="204" height="26" rx="6" fill="#eef8f2" stroke="#b8e6d0"/>
<text x="30" y="83" font-size="8.6" font-weight="700" fill="#1e6640">尊重规律 + 发挥主观能动性</text>
<rect x="18" y="98" width="204" height="22" rx="6" fill="#fdf3f4" stroke="#f3c9cf"/>
<text x="30" y="113" font-size="8.4" fill="#9f1239">无所作为：听天由命</text>
</svg>
</div>

<div class="qac">
<p class="q">「发挥主观能动性，是不是想怎么干就怎么干？」</p>
<p class="a">不是。主观能动性以<b>尊重客观规律为前提</b>，它表现为认识规律、利用规律，不是绕过规律。想怎么干就怎么干，那是夸大意识能动作用的唯意志主义。判断一句做法对不对，先问：它认不认这件事本身的规律。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="主观能动性以尊重规律为前提，不等于任意妄为">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="28" font-size="9" text-anchor="middle" fill="#151a21">一个前提，一条界线</text>
<rect x="18" y="40" width="204" height="26" rx="6" fill="#eef8f2" stroke="#b8e6d0"/>
<text x="120" y="57" font-size="8.4" text-anchor="middle" fill="#1e6640">发挥主观能动性，前提是尊重规律</text>
<text x="22" y="88" font-size="8.6" fill="#3a3a35">想怎么干就怎么干</text>
<text x="140" y="88" font-size="8.6" font-weight="700" fill="#9f1239">= 蛮干</text>
<text x="120" y="114" font-size="8.2" text-anchor="middle" fill="#6b7280">先认规律，再动手，才叫能动性</text>
</svg>
</div>

<div class="qac">
<p class="q">「一切从实际出发和尊重客观规律，是一回事吗？」</p>
<p class="a">是一件事的两个面，但位置不同。「从实际出发」说的是<b>出发点</b>——从客观存在的事物出发，不从愿望、本本、别人的经验出发；「尊重客观规律」说的是<b>落脚点</b>——按事物本身的规律办事。前者管「你从哪儿看」，后者管「你按什么干」，答题时两句都要有。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="从实际出发管出发点，尊重规律管落脚点">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="28" font-size="9" text-anchor="middle" fill="#151a21">一个管出发点，一个管落脚点</text>
<rect x="16" y="40" width="100" height="58" rx="7" fill="#ffffff" stroke="#dbe7ef"/>
<text x="66" y="58" font-size="8.6" font-weight="700" text-anchor="middle" fill="#151a21">从实际出发</text>
<text x="66" y="74" font-size="8.2" text-anchor="middle" fill="#3a3a35">从哪儿看</text>
<text x="66" y="90" font-size="8.2" text-anchor="middle" fill="#3a3a35">事实，不是愿望</text>
<rect x="124" y="40" width="100" height="58" rx="7" fill="#ffffff" stroke="#b8e6d0"/>
<text x="174" y="58" font-size="8.6" font-weight="700" text-anchor="middle" fill="#1e6640">尊重规律</text>
<text x="174" y="74" font-size="8.2" text-anchor="middle" fill="#3a3a35">按什么干</text>
<text x="174" y="90" font-size="8.2" text-anchor="middle" fill="#3a3a35">规律，不是感觉</text>
<text x="120" y="116" font-size="8.2" text-anchor="middle" fill="#6b7280">中间还差一步：调查研究</text>
</svg>
</div>

<div class="qac">
<p class="q">「揠苗助长和庖丁解牛，差在哪里？」</p>
<p class="a">一个拧着规律用力，一个顺着规律用力。前者凭主观愿望办事，越努力越糟，结果禾苗枯死；后者先摸清牛的结构，再顺着缝隙下刀，越干越省力。这组对比最能说明：<b>人的能动性有效没效，看它认不认规律</b>。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="揠苗助长违背规律，庖丁解牛利用规律">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="26" font-size="9" text-anchor="middle" fill="#151a21">同样用力，方向相反</text>
<rect x="16" y="34" width="100" height="66" rx="7" fill="#fdf3f4" stroke="#f3c9cf"/>
<text x="66" y="52" font-size="8.6" font-weight="700" text-anchor="middle" fill="#9f1239">揠苗助长</text>
<text x="66" y="70" font-size="8.2" text-anchor="middle" fill="#3a3a35">拧着规律</text>
<text x="66" y="86" font-size="8.2" text-anchor="middle" fill="#3a3a35">禾苗枯死</text>
<rect x="124" y="34" width="100" height="66" rx="7" fill="#eef8f2" stroke="#b8e6d0"/>
<text x="174" y="52" font-size="8.6" font-weight="700" text-anchor="middle" fill="#1e6640">庖丁解牛</text>
<text x="174" y="70" font-size="8.2" text-anchor="middle" fill="#3a3a35">顺着规律</text>
<text x="174" y="86" font-size="8.2" text-anchor="middle" fill="#3a3a35">刀如新磨</text>
<text x="120" y="116" font-size="8.2" text-anchor="middle" fill="#6b7280">差的不是努力，是有没有认规律</text>
</svg>
</div>

</div>
<p class="gx-note">六问其实是同一件事：都在问「规律在人之外，还是人手里」。规律在人之外，所以不能创造、不能消灭、不能违背；规律又能被人认识、被人利用，所以人能动手，只是不能乱动。把这条分寸记住，六问就合成一问——看到一个做法，先问它认不认规律，再问它是顺着还是拧着。认了、顺了，就是尊重规律与发挥主观能动性相统一；不认、拧着，就是唯意志主义；认了却不动手，就是安于现状。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">每张卡片三行：学生真会写的错句、教材语言、错在哪。先盖住后两行自己说一遍，再对答案。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 规律是人们在实践中总结出来的，所以人能制定规律。</p>
<p class="er-v">✓ 规律是事物运动过程中固有的本质的必然的稳定的联系，是客观的，不以人的意志为转移。</p>
<p class="er-w">错在哪：把「人总结出的说法」当成规律本身。人总结的是对规律的认识，认识的载体可以是一本书，规律却不在书里。</p>
</div>
<div class="er">
<p class="er-x">✗ 随着科技发展，人类可以创造条件，消灭或改变某些规律。</p>
<p class="er-v">✓ 规律不能创造、不能消灭、不能违背，人可以认识和利用规律，改变规律起作用的条件。</p>
<p class="er-w">错在哪：把「改变条件」偷换成「改变规律」。条件一变，规律起作用的方式变了，规律本身一点没动。</p>
</div>
<div class="er">
<p class="er-x">✗ 规律是客观的，人在规律面前无能为力，只能顺应。</p>
<p class="er-v">✓ 规律是客观的，但人可以发挥主观能动性，认识和利用规律，改造客观世界，造福人类。</p>
<p class="er-w">错在哪：把客观性读成了宿命论。漏掉「认识和利用」这一层，就滑进了课本反对的安于现状、无所作为。</p>
</div>
<div class="er">
<p class="er-x">✗ 发挥主观能动性，就是要敢想敢干，不被规律束缚。</p>
<p class="er-v">✓ 发挥主观能动性以尊重客观规律为前提，表现为认识规律、利用规律，不是违背规律。</p>
<p class="er-w">错在哪：把能动性写成任意妄为。这是夸大意识能动作用的唯意志主义，方向错了，越努力越糟。</p>
</div>
<div class="er">
<p class="er-x">✗ 一切从实际出发，就是从本地的现有条件出发，条件不足就等条件好了再干。</p>
<p class="er-v">✓ 一切从实际出发，实事求是，要把尊重客观规律和发挥主观能动性结合起来，既反对唯意志主义，也反对安于现状、无所作为。</p>
<p class="er-w">错在哪：只留了「尊重规律」一头，把「发挥主观能动性」丢了。条件不足可以创造条件，这正是能动性的地方。</p>
</div>
<div class="er">
<p class="er-x">✗ 苹果落地体现了万有引力规律，所以苹果落地就是规律。</p>
<p class="er-v">✓ 苹果落地是现象，万有引力是隐藏在现象背后的规律；现象表现规律，规律要通过思维才能把握。</p>
<p class="er-w">错在哪：现象和规律不分。材料给的是现象，问的是规律，你得往上抽一层，不能把现象复述一遍当答案。</p>
</div>
<div class="er">
<p class="er-x">✗ 规律是稳定的，所以事物的状态是固定不变的。</p>
<p class="er-v">✓ 物质是运动的，规律是运动中的规律；规律的稳定性指它会反复起作用，不是事物静止不动。</p>
<p class="er-w">错在哪：把「稳定的联系」读成「不变的状态」。规律稳定恰恰是因为事物一直在动，动法却一致。</p>
</div>
</div>
