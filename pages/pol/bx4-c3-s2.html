<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">这一框的答案压在四句话上：发展有普遍性、发展的实质、量变与质变、前进性与曲折性。先照抄，再拆关键词。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 发展的实质与新事物<span class="q-src">人教版（2019）必修4 哲学与文化 · 第三课第二框</span></p>
<p class="q-b">自然界是发展的，人类社会是发展的，人的认识也是发展的。世界是永恒发展的。发展的实质是事物的前进和上升，是新事物的产生和旧事物的灭亡。新事物是符合客观规律、具有强大生命力和远大前途的事物，旧事物是违背事物发展趋势、日趋灭亡的事物。新事物必然战胜旧事物，新陈代谢是宇宙间普遍的永远不可抗拒的规律。</p>
<p class="q-n">→ 翻成人话：这段话有三个可拆的零件。第一个是普遍性，落点是三个领域——自然界、人类社会、人的认识，答题时点一个就行，别三个都往上堆。第二个是实质，关键词只有「前进和上升」，所以「发展」这个词里天然含着方向：往上走才算，往下掉不算。第三个是判断新事物的标尺，三条——符合客观规律、具有强大生命力、有远大前途。这里有个坑：新事物不看出现早晚，也不看形式新不新，更不看它刚出生时强不强。刚出的芽总是弱的，可它符合规律，所以必然战胜旧事物。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 量变与质变<span class="q-src">人教版（2019）必修4 哲学与文化 · 第三课第二框</span></p>
<p class="q-b">量变是事物数量的增减和场所的变更，是一种渐进的、不显著的变化。质变是事物根本性质的变化，是事物由一种质态向另一种质态的飞跃。量变是质变的必要准备，质变是量变的必然结果。量变达到一定程度必然引起质变。质变又为新的量变开辟道路，使事物在新质的基础上开始新的量变。</p>
<p class="q-n">→ 翻成人话：把量变和质变看成一条路上的两段，不是两件事。烧水到 99 度还是水，这是量变；到 100 度开始沸腾，这是质变。每天多背 20 个单词是量变，某天读原文不再逐词翻译是质变。注意「一定程度」这四个字，它是开关：量变是必要准备，但准备不到那个点，质变不会自己来。所以答题写「量变是质变的必要准备」时，后面要跟一句「要重视量的积累」；写「质变是量变的必然结果」时，后面要跟一句「抓住时机促成质变」。两条方法论是配套的，只写一条就像只踩了半脚油门。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 前进性与曲折性<span class="q-src">人教版（2019）必修4 哲学与文化 · 第三课第二框</span></p>
<p class="q-b">事物发展的前途是光明的，道路是曲折的。事物发展的方向是前进的、上升的，道路是曲折的、迂回的。新事物的发展总要经历一个由小到大、由不完善到比较完善的过程。我们既要看到前途是光明的，对未来充满信心，热情支持和悉心保护新事物，促使其成长、壮大，还要做好充分的思想准备，不断克服前进道路上的困难，勇敢地面对挫折与考验。</p>
<p class="q-n">→ 翻成人话：这句原话里藏着「方向」和「道路」两个词，考试就靠这两个词分辨。方向讲的是总趋势——前进的、上升的，所以「前途光明」；道路讲的是走法——迂回的、有起伏的，所以「道路曲折」。为什么一定曲折？课本给了三个理由：新事物自己有弱点、不够完善；人们对新事物的认识有个过程；旧事物开始时往往比较强大，还会顽强抵抗。三条理由记住，材料里出现「失败」「亏损」「被质疑」「走了弯路」，你就知道该往「曲折性」上答，而不是往「发展停滞」上答。</p>
</div>

<p class="ex-t">例题 · 体现类材料题<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">材料：2005 年，某企业从一间租来的厂房起步做动力电池，前八年年年亏损，最困难时账上只够发两个月工资，合伙人走了大半。留下来的团队把每一批失败电芯的数据都存下来，一种材料改了三百多次。2013 年，行业标准出台、市场开始放量，企业果断把利润全投进去扩产，研发人员从两百人加到两千人。此后十年，它的电池能量密度提高近一倍，成本降了七成，从给别人代工变成参与定标准。结合材料，运用「世界是永恒发展的」知识，说明该企业的发展历程体现了哪些哲学道理。（12 分）</p>

<p class="s-b">题型是「体现类」，知识范围是「世界是永恒发展的」，主体是企业，对象是它的二十年历程。草稿上先写四个词：实质、量变质变、前进性曲折性、方法论。设问要答两层：原理是什么，材料哪里体现了它。</p>

<p class="s-k">用到：按时间线切段 → 一段一条原理</p>

<p class="s-b">最后补方法论：把事物如实地看成一个变化发展的过程，明确它处在哪一段，坚持与时俱进、培养创新精神。写完回头查三处：有没有把「发展」写成「变化」，有没有说「新出现的就是新事物」，有没有只写光明面不写曲折。</p>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。每问先自己答一句，再看下面那句。</p>
<div class="gx-qa">

<div class="qac">
<p class="q">「发展不就是变化吗？为什么选择题老在这两个词上挖坑？」</p>
<p class="a">不是。运动、变化说的是事物在动、在变，方向可以是前进，也可以是倒退；发展只指<b>前进的、上升的运动和变化</b>。所以「今年产量下降了」是变化，不是发展；「旧工艺被新工艺取代」才是发展。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="变化包括前进和倒退，发展只是前进上升的那部分">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="26" font-size="9.2" text-anchor="middle" fill="#151a21">变化 ≠ 发展</text>
<rect x="20" y="38" width="94" height="50" rx="7" fill="#ffffff" stroke="#dbe7ef"/>
<text x="67" y="58" font-size="8.6" font-weight="700" text-anchor="middle" fill="#151a21">变化</text>
<text x="67" y="76" font-size="8" text-anchor="middle" fill="#3a3a35">有前进也有倒退</text>
<rect x="126" y="38" width="94" height="50" rx="7" fill="#ffffff" stroke="#b8e6d0"/>
<text x="173" y="58" font-size="8.6" font-weight="700" text-anchor="middle" fill="#1e6640">发展</text>
<text x="173" y="76" font-size="8" text-anchor="middle" fill="#3a3a35">前进的、上升的</text>
<text x="120" y="108" font-size="8.2" text-anchor="middle" fill="#1e6640">只有前进上升的变化才是发展</text>
</svg>
</div>

<div class="qac">
<p class="q">「新出现的事物就是新事物吗？刚冒出来的新玩法算不算？」</p>
<p class="a">不一定。判断新事物只看三条：<b>符合客观规律、具有强大生命力、有远大前途</b>。出现得晚、包装得新、一时人多，都不是标准。旧东西换个壳重新上架，还是旧事物；新事物刚出来时不起眼，也可能是新事物。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="新出现的事物不等于新事物">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="26" font-size="9.2" text-anchor="middle" fill="#151a21">「新」不等于「新事物」</text>
<rect x="20" y="38" width="94" height="50" rx="7" fill="#ffffff" stroke="#f3c9cf"/>
<text x="67" y="58" font-size="8.6" font-weight="700" text-anchor="middle" fill="#9f1239">刚出现的</text>
<text x="67" y="76" font-size="8" text-anchor="middle" fill="#3a3a35">可能只是换了包装</text>
<rect x="126" y="38" width="94" height="50" rx="7" fill="#ffffff" stroke="#b8e6d0"/>
<text x="173" y="58" font-size="8.6" font-weight="700" text-anchor="middle" fill="#1e6640">新事物</text>
<text x="173" y="76" font-size="8" text-anchor="middle" fill="#3a3a35">符合规律、有前途</text>
<text x="120" y="108" font-size="8.2" text-anchor="middle" fill="#6b7280">标尺看规律和前途，不看时间</text>
</svg>
</div>

<div class="qac">
<p class="q">「量变一定引起质变吗？我天天练字，字怎么还是没变好看？」</p>
<p class="a">量变<b>达到一定程度</b>必然引起质变，不是一有量变就质变。「天天练」是必要准备，但方法不对、强度不够，积累没到那个点，质变就不会来。这也正是「拔苗助长」错的地方：想跳过积累，直接的飞跃不存在。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="量的积累达到一定程度才引起质变">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="26" font-size="9.2" text-anchor="middle" fill="#151a21">到点，才质变</text>
<rect x="24" y="62" width="112" height="20" rx="4" fill="#dff3e7" stroke="#b8e6d0"/>
<text x="30" y="76" font-size="8" fill="#1e6640">已有的积累</text>
<line x1="152" y1="44" x2="152" y2="94" stroke="#9f1239" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="156" y="50" font-size="8" fill="#9f1239">一定程度</text>
<text x="120" y="112" font-size="8.2" text-anchor="middle" fill="#6b7280">必要准备，不是一到就有飞跃</text>
</svg>
</div>

<div class="qac">
<p class="q">「质变就是发展吗？那成绩退步算不算质变？」</p>
<p class="a">质变是根本性质的变化，方向不一定向上。成绩从「能跟上」掉到「完全听不懂」，性质确实变了，但那是<b>倒退的质变，不是发展</b>。发展只认前进的、上升的质变，判断标准还是那句：新事物是否产生、旧事物是否灭亡。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="质变有前进的也有倒退的，只有前进的才是发展">

<text x="68" y="74" font-size="8" text-anchor="middle" fill="#3a3a35">→ 是发展</text>

</svg>
</div>

<div class="qac">
<p class="q">「新事物一开始那么弱，凭什么说它必然战胜旧事物？」</p>
<p class="a">因为它符合客观规律、有强大生命力和远大前途，所以<b>方向是前进的</b>；但它有弱点、人们对它的认识有过程、旧事物开始时比较强大还会抵抗，所以<b>道路是曲折的</b>。弱是当下的状态，必胜是总趋势，两句话不冲突。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="新事物当下弱，但总趋势向上">

<text x="120" y="116" font-size="8.2" text-anchor="middle" fill="#1e6640">总趋势：曲折中一直向上</text>
</svg>
</div>

<div class="qac">
<p class="q">「用发展的观点看问题，答题到底要写几句？」</p>
<p class="a">四句打底：发展的实质、量变与质变、前进性与曲折性、方法论三个动作。每句后面跟一句材料原话，别让原理悬空。<b>原理 + 方法论 + 材料</b>，三样齐了才是完整答案。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="用发展的观点看问题的四层答案">

<text x="30" y="67" font-size="8" fill="#3a3a35">② 量变与质变：准备与结果</text>

<text x="30" y="88" font-size="8" fill="#3a3a35">③ 前进性与曲折性：方向与道路</text>

</div>
<p class="gx-note">六问其实是同一件事：先问「变没变」（运动、变化），再问「往哪儿变」（发展的实质），接着问「怎么变」（量变与质变），最后问「顺不顺」（前进性与曲折性）。这四层问完，材料题的采分点就自己排好队了；而那条把它们拴在一起的绳，是「新事物必然战胜旧事物」这一句。</p>

<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">每张卡片三行：学生真会写的错句、教材语言、错在哪。先盖住后两行，自己说一遍，再对答案。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 发展就是运动、变化，事物只要在变就是在发展。</p>
<p class="er-v">✓ 运动、变化有前进上升，也有倒退下降；发展是前进的、上升的运动和变化，实质是新事物的产生和旧事物的灭亡。</p>
<p class="er-w">错在哪：把「变」当成「往前走」。方向没判，就还没答到发展。</p>
</div>
<div class="er">
<p class="er-x">✗ 新出现的事物就是新事物，出现得晚、形式新就是新事物。</p>
<p class="er-v">✓ 新事物是符合客观规律、具有强大生命力和远大前途的事物；判断标准不是出现先后、形式新旧、一时强弱。</p>
<p class="er-w">错在哪：拿时间当标准。旧东西换包装重新上架，出现得再晚也是旧事物。</p>
</div>
<div class="er">
<p class="er-x">✗ 新事物必然战胜旧事物，所以它一出现就很强，胜利很快到来。</p>
<p class="er-v">✓ 新事物总要经历由小到大、由不完善到比较完善的过程，道路是曲折的、迂回的。</p>
<p class="er-w">错在哪：把「必然胜利」读成「立刻胜利」。漏掉曲折性，这半句就白写了。</p>
</div>
<div class="er">
<p class="er-x">✗ 量变必然引起质变，所以只要有一点量变就马上质变。</p>
<p class="er-v">✓ 量变是质变的必要准备，量变达到一定程度才必然引起质变。</p>
<p class="er-w">错在哪：漏了「达到一定程度」。拔苗助长就是这么错的：想跳过积累直接飞跃。</p>
</div>
<div class="er">
<p class="er-x">✗ 质变就是发展，事物的性质一变就是进步。</p>
<p class="er-v">✓ 质变有前进上升的，也有倒退的；发展是前进的、上升的质变。</p>
<p class="er-w">错在哪：只看到「性质变了」，没看方向。质变不等于发展，方向才作数。</p>
</div>
<div class="er">
<p class="er-x">✗ 发展就是慢慢积累，等时间到了自然会变好。</p>
<p class="er-v">✓ 量变是质变的必要准备，质变是量变的必然结果；要重视量的积累，也要抓住时机促成质变。</p>
<p class="er-w">错在哪：只写积累、不写抓时机。「等待」不是方法论，条件成熟时还要敢动手。</p>
</div>
<div class="er">
<p class="er-x">✗ 前途是光明的，所以道路也是平坦的，不会遇到挫折。</p>
<p class="er-v">✓ 方向是前进的、上升的，道路是曲折的、迂回的；要充满信心，也要做好思想准备，勇敢面对挫折与考验。</p>
<p class="er-w">错在哪：把方向和道路混成一条。光明讲趋势，曲折讲走法，两句都要有。</p>
