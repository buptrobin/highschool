<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写课本这句，不写你脑子里那句。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 超前思维的含义<span class="q-src">人教版（2019）选择性必修3 逻辑与思维 · 第四单元第十三课</span></p>
<p class="q-b">超前思维是在多角度、全方位地分析事物的历史和现实的基础上，从事物发展的现实情况出发，认识和把握事物的发展趋势，并运用合理的推理和想象，判断事物未来发展趋势的思维。</p>
<p class="q-n">→ 翻成人话：这句藏着<b>三个条件</b>。① 根据在历史和现实，不在愿望和灵感；② 工具是「合理的推理和想象」，不是拍脑袋；③ 落点是「趋势判断」，不是把未来算成定数。三条少一条，就不叫超前思维。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 超前思维的特征<span class="q-src">人教版（2019）选择性必修3 逻辑与思维 · 第四单元第十三课</span></p>
<p class="q-b">超前思维具有预测性。超前思维是依据事物发展的历史和现实状况，对事物未来的发展趋势进行预测。由于事物发展的复杂性和多变性，超前思维的结果具有不确定性。</p>
<p class="q-n">→ 翻成人话：两条特征是一对搭档。<b>预测性</b>＝敢下判断，而且说得出「根据什么、怎么推的」；<b>不确定性</b>＝结论是概率性的，不是确定无疑。只写预测性，口气像算命；只写不确定性，又变成不敢判断。两条一起写才完整。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 超前思维的方法<span class="q-src">人教版（2019）选择性必修3 逻辑与思维 · 第四单元第十三课</span></p>
<p class="q-b">超前思维要运用矛盾分析方法，分析事物内部矛盾以及事物之间的矛盾，把握事物发展的内在根据；要运用合理的推理和想象，对事物发展的趋势作出判断；要注重调查研究，立足现实，尊重事物发展的客观规律。</p>
<p class="q-n">→ 翻成人话：这是<b>三条路加一块地基</b>。矛盾分析找方向，推理想象算下一步，调查研究拿材料；三条都踩在「现实」上。答题问「怎样提高预测的可靠性」，就是按这三条加地基分点写，一条一句话，别写成一大段。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>超前思维</th><th>算命、瞎猜</th></tr></thead>
<tbody>

<tr><td>方法</td><td>矛盾分析、合理的推理和想象</td><td>联想、暗示、模棱两可的话术</td></tr>

<tr><td>错了以后</td><td>查材料、改模型、跟踪修正</td><td>归咎于「你心不诚」</td></tr>
<tr class="key"><td>真正的区别</td><td>有根据、可检验、允许修正</td><td>无根据、不可检验、只许相信</td></tr>

<p class="gx-note">整张表只高亮 1 行。背法用三个问句串起来：根据是什么（材料还是感觉）、怎么推的（方法还是话术）、错了怎么办（修正还是赖你）。考试问「区别」，按这三问答；问「启示」，就把「有根据、可修正」翻成做法：先调查、再分析、留预案。如果题目问「为什么不能说超前思维是算命」，答案的落点要写「根据」和「不确定性」两个词：算命不给出可检验的根据，也不承认自己会错；超前思维两样都承认。选择题里常见的干扰项，是把两者并列说成「都是主观臆测」，遇到这种选项直接排除。</p>

<section class="gx-sec" id="c">
<h2><span class="sn">03</span>自己点一下<span class="bdg bdg-key">A 级</span></h2>
<p class="gx-h2s">点一个材料情境，看它对应哪个知识点、为什么、答题时怎么写。</p>

<figure class="gx-fig">
<div class="fig-cap">
<span class="fig-no">互动 1</span><span class="fig-t">材料 → 知识点：情境判断器</span>
<span class="bdg bdg-must">必考</span>
</div>
<p class="fig-s">先自己判断，再点开看。五个情境分别对应本节五个易混点。判断时先抓两样东西：材料里的根据从哪来，结论下得多硬。五个情境里有一个是反例，别被它绕进去。</p>
<div class="gx-quiz">
<div class="qbtns">
<button class="qbtn" type="button" data-k="情境一 · 台风路径" data-a="对应：超前思维的预测性" data-w="判断依据：先看根据——气象台用的是历史路径、卫星云图、气压风速，这些是历史和现实材料；再看动作——由材料推断未来走向。有根据、指向趋势，就是预测性。它不是算命，因为每一步都说得出依据；它也不等于「一定」，路径图上标的是概率区间，这正是不确定性。">气象台根据卫星云图、气压风速和历史路径，预测台风未来 24 小时的走向。</button>
<button class="qbtn" type="button" data-k="情境二 · 先跑市场再上新品" data-a="对应：注重调查研究" data-w="判断依据：先找材料里最费笔墨的动作——跑门店、发问卷、访谈用户，这就是调查研究；再看它换来了什么——掌握真实需求，才敢提前布局。注意顺序：先调查、后判断。如果材料写成「老板觉得会火，于是先投产，再补调研」，那就落到反面情境去了。">企业先跑门店、发问卷、访谈用户，摸清需求，再决定提前上哪款新品。</button>
<button class="qbtn" type="button" data-k="情境三 · 主要矛盾变了" data-a="对应：矛盾分析方法" data-w="判断依据：先抓关键词——「主要矛盾」「矛盾变化」「发展方向」；再看推理方向——从矛盾的变化推出趋势。矛盾分析法抓的是事物发展的内在根据。这里别和「矛盾律」混：矛盾律是逻辑基本规律，要求思维前后不能自相矛盾；矛盾分析法是辩证思维方法，分析事物自身的矛盾运动。">分析社会主要矛盾的变化，判断未来几年产业和就业的发展方向。</button>
<button class="qbtn" type="button" data-k="情境四 · 两套预案" data-a="对应：超前思维的不确定性" data-w="判断依据：先看材料承不承认「有多种可能」，再看它有没有为「猜错」做准备。承认结论不是确定无疑、留出余地、准备预案，对应的就是不确定性。这不是没主见：恰恰是尊重超前思维的结果——事物复杂多变，信息不可能齐全，所以判断要给概率、行动要留后手。">面对「卖得好」和「卖不动」两种可能，企业各准备一套产能和促销方案。</button>
<button class="qbtn" type="button" data-k="情境五 · 拍脑袋投资" data-a="对应：违背超前思维的要求" data-w="判断依据：先看有没有根据——没有调查、没有数据，全凭「我感觉」；再看结论下得多硬——「一定赚、稳赚」。既无现实根据，又把不确定说成确定，两条都违背超前思维。答题时正着写：超前思维要立足现实、注重调查研究、尊重客观规律，还要承认结果的不确定性。">有人不做调研、不看数据，凭感觉断定某个项目「一定赚」，把积蓄全投进去。</button>
</div>
<div class="qout"></div>
</div>
<p class="gx-take">一句结论：材料题先问「根据从哪来」，再问「结论下得多硬」，两个答案一拼，知识点就出来了。根据和分寸，两句话就是一道大题的开头。</p>
<p class="gx-note">为什么做成点击而不是滑块：本节辨的是「判断的类型和分寸」，没有连续可调的量。硬造一个滑块，反而会让你以为「超前程度」可以随便拖。真实考题也是给一段材料让你定性，点一下对答案，更接近考场动作。五个情境连点两遍，判断顺序就记住了。点完合上讲义，用一句话说出判断顺序，再回来看自己漏了哪一步。</p>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 措施类材料题<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">某家电企业准备上马一款扫地机器人。负责人说：「我看明年一定爆，直接按最大产能投产。」产品经理先做了三件事：一是走访 200 户家庭，记下他们打扫时的麻烦；二是分析同类产品的价格战，以及家庭小型化、租房增多的变化；三是按「卖得好」和「卖不动」两种情形，各做了一套产能与促销方案。上市后每季度复盘，按实际销量调整。结合材料，说明该企业是如何提高超前思维可靠性的。注意设问只问「如何提高」，别写成「什么是超前思维」。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性</p>
<p class="s-b">设问问的是「如何提高」，这是措施类，不是「什么是超前思维」。答案要写成「做法＋对应原理」，一条一个动作。先在题干圈出四个动作：走访、分析、两套方案、复盘。圈完你就知道答案有几条了。题干越具体，动词越多，答案的点越多；只有一个动作的材料，一般只考一个点。</p>
<p class="s-k">用到：超前思维的方法与要求。措施类题目，动词就是得分点。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 找根据：调查研究</p>
<p class="s-b">走访 200 户，是把判断建立在真实材料上。这一步对应「注重调查研究、立足现实」。写的时候要点出材料：不是「重视调研」四个字就完，要写「通过走访掌握一手材料，使预测有现实根据」。负责人的「我看一定爆」正好是反例，可以顺手对比一句。材料里的数字也是得分点：200 户，说明样本不是拍脑袋定的。</p>
<p class="s-k">用到：超前思维要注重调查研究，立足现实。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 找方法：矛盾分析</p>
<p class="s-b">价格战是外部压力，家庭小型化、租房增多是需求侧的变化，两股力量夹着这个产品。分析这些矛盾，才能判断趋势往哪走。答题写「分析事物内部矛盾以及事物之间的矛盾，把握事物发展的内在根据」，再落到「抓住主要矛盾」。写矛盾分析时，点出材料里的两股力量，别只抄原理。</p>
<p class="s-k">用到：矛盾分析方法。注意它不是「别自相矛盾」，别写成矛盾律。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 找工具：推理和想象</p>
<p class="s-b">由「家庭变小、租房变多」推出「体积小、免安装更受欢迎」，这是推理；设想还没出现的使用场景，这是想象。补一句规则：推理要合规则，比如「如果需求上升，那么产能不能拖」，肯前可肯后、否后可否前，否定前件、肯定后件都推不出结论。规则管形式，材料真不真另说。想象也不是乱想，它改造的是已有表象，底子还在材料里。</p>
<p class="s-k">用到：合理的推理和想象；充分条件假言推理的规则。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口：承认不确定，留后手</p>
<p class="s-b">两套方案＋季度复盘，对应「结果具有不确定性」。写清三层：承认不确定、准备多套方案、在实践中跟踪修正。最后回扣意义：这样能指导实践、趋利避害。缺了回扣，答案就悬空；很多同学前四步都对，就差这一句。这三层写在同一个点里，比拆成三个点省时间。</p>
<p class="s-k">用到：超前思维的不确定性；意义——指导实践、防患于未然。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">① 立足现实，注重调查研究。该企业走访 200 户家庭，掌握一手材料，使预测建立在真实情况之上，而不是凭「我感觉」。<br>② 运用矛盾分析方法。企业分析同类产品价格战这一外部压力，又分析家庭小型化、租房增多带来的需求变化，把握事物发展的内在根据，从而判断趋势的方向。<br>③ 运用合理的推理和想象。由家庭结构变化推出产品应向小型、免安装方向走，并设想新的使用场景；推理遵守规则，结论才有依据。<br>④ 承认超前思维结果的不确定性，准备多套方案。企业按「卖得好」和「卖不动」两种情形各做一套产能与促销方案，留有余地，不把判断说死。<br>⑤ 在实践中跟踪修正。上市后每季度复盘，按实际销量调整，把预测放到实践中检验，体现了超前思维指导实践、趋利避害的意义。<br>⑥ 反观负责人的「一定爆、按最大产能投产」，是把不确定说成确定、把愿望当根据，不符合超前思维的要求。<br>⑦ 提高预测的可靠性，不是把话说得更满，而是把根据找得更实、把后手留得更足。</p>
</div>
</div>
</section>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「超前思维就是未卜先知、能算准未来吗？」</p>
<p class="a">不是。课本的定义是：在多角度、全方位分析历史和现实的基础上，从事物发展的现实情况出发，认识和把握发展趋势，并运用合理的推理和想象，判断未来发展趋势。这句话里没有「准确算出」四个字，它说的是判断趋势，而且结果具有不确定性。<b>下定义有四条要求：外延要相等、不能循环、不能用否定、不能用比喻</b>。说「超前思维就是诸葛亮的神机妙算」，既用了比喻，又把不确定改成了确定无疑，两条都不合要求。答题照课本原句写，别自己造比喻。还有一条常考判断：材料里只有「我感觉」「我相信」，没有来源，那就是瞎猜。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="超前思维与算命的区别">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="22" y="30" font-size="9.6" font-weight="700" fill="#151a21">预测 ≠ 算命</text>
<rect x="22" y="44" width="90" height="36" rx="6" fill="#fdeeee" stroke="#f0c9c9"/>
<text x="67" y="60" font-size="9" fill="#8a3b3b" text-anchor="middle">算命</text>
<text x="67" y="74" font-size="8.5" fill="#8a3b3b" text-anchor="middle">无根据、声称准</text>
<rect x="128" y="44" width="90" height="36" rx="6" fill="#eef8f3" stroke="#b8e6d0"/>
<text x="173" y="60" font-size="9" fill="#1f6b4a" text-anchor="middle">超前思维</text>
<text x="173" y="74" font-size="8.5" fill="#1f6b4a" text-anchor="middle">有根据、带概率</text>
<text x="22" y="98" font-size="8.8" fill="#3a3a35">看根据：来自调查，还是来自感觉</text>
<text x="22" y="114" font-size="8.8" fill="#3a3a35">看分寸：说死，还是留余地</text>
</svg>
</div>

<div class="qac">
<p class="q">「预测为什么总会带不确定性？」</p>
<p class="a">三个原因：事物本身复杂多变；信息不可能齐全；人的认识还受主客观条件限制。所以超前思维给出的常常是趋势、区间和概率，不是一个准数。<b>不确定性不是「怎么猜都行」</b>，它恰恰提出了要求：准备多套方案、留出余地、跟踪修正。答题时先写「由于事物发展的复杂性和多变性」，紧接着写「所以要……」，这个「所以」才是得分点。若题目问「预测为什么会出错」，答案也落在这三条，不要写成「预测没用」。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="不确定性来自事物复杂、信息不全、认识受限">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="22" y="28" font-size="9.6" font-weight="700" fill="#151a21">不确定性从哪来</text>
<text x="22" y="50" font-size="8.8" fill="#3a3a35">① 事物复杂多变</text>
<text x="22" y="66" font-size="8.8" fill="#3a3a35">② 信息不可能齐全</text>
<text x="22" y="82" font-size="8.8" fill="#3a3a35">③ 认识受条件限制</text>
<rect x="22" y="92" width="196" height="24" rx="5" fill="#eef8f3" stroke="#b8e6d0"/>
<text x="32" y="108" font-size="8.8" fill="#1f6b4a">所以：给概率、备预案、跟踪修正</text>
</svg>
</div>

<div class="qac">
<p class="q">「有了大数据和模型，还要调查研究吗？」</p>
<p class="a">要。数据和模型是别人加工过的二手材料，样本、口径、时效都可能偏；调查研究拿的是一手情况，能发现报表上没有的东西。课本把调查研究放在基础位置：<b>掌握真实的、大量的材料，才谈得上正确预测</b>。答题时可以写「数据不能替代实际，模型不能替代现场」，再举材料里的走访、蹲点、座谈。「没有调查就没有发言权」这句，在措施题里可以直接当收口句。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="数据是二手材料，调查研究才拿到一手情况">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="22" y="28" font-size="9.6" font-weight="700" fill="#151a21">数据 ≠ 一手材料</text>
<rect x="22" y="40" width="92" height="40" rx="6" fill="#ffffff" stroke="#c9d7e2"/>
<text x="68" y="56" font-size="8.8" fill="#3a3a35" text-anchor="middle">数据、模型</text>
<text x="68" y="70" font-size="8.4" fill="#3a3a35" text-anchor="middle">加工过的二手</text>
<rect x="126" y="40" width="92" height="40" rx="6" fill="#eef8f3" stroke="#b8e6d0"/>
<text x="172" y="56" font-size="8.8" fill="#1f6b4a" text-anchor="middle">走访、蹲点</text>
<text x="172" y="70" font-size="8.4" fill="#1f6b4a" text-anchor="middle">一手情况</text>
<text x="22" y="98" font-size="8.8" fill="#3a3a35">样本、口径、时效都可能偏</text>
<text x="22" y="114" font-size="8.8" fill="#3a3a35">看数据，还要跑现场</text>
</svg>
</div>

<div class="qac">
<p class="q">「分析矛盾，是不是就是说话别前后打架？」</p>
<p class="a">不是，这是两个东西。<b>矛盾分析法</b>是辩证思维方法：分析事物内部对立统一的两个方面，以及事物之间的矛盾，抓住主要矛盾和矛盾的主要方面，从而把握发展的内在根据。<b>矛盾律</b>是逻辑基本规律：A 不能既是 A 又是非 A，管的是思维不能自相矛盾。一个用来「看趋势」，一个用来「查前后一致」。材料出现「主要矛盾」「矛盾变化」，答矛盾分析法；出现「前后说法打架」，才答矛盾律。两个词长得像，考的就是你会不会分开用。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="矛盾分析法与矛盾律是两个不同的东西">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="22" y="28" font-size="9.6" font-weight="700" fill="#151a21">两个「矛盾」，别混</text>
<rect x="22" y="38" width="92" height="52" rx="6" fill="#eef8f3" stroke="#b8e6d0"/>
<text x="68" y="54" font-size="8.8" fill="#1f6b4a" text-anchor="middle">矛盾分析法</text>
<text x="68" y="68" font-size="8.2" fill="#1f6b4a" text-anchor="middle">辩证方法</text>
<text x="68" y="82" font-size="8.2" fill="#1f6b4a" text-anchor="middle">看趋势</text>
<rect x="126" y="38" width="92" height="52" rx="6" fill="#ffffff" stroke="#c9d7e2"/>
<text x="172" y="54" font-size="8.8" fill="#3a3a35" text-anchor="middle">矛盾律</text>
<text x="172" y="68" font-size="8.2" fill="#3a3a35" text-anchor="middle">逻辑规律</text>
<text x="172" y="82" font-size="8.2" fill="#3a3a35" text-anchor="middle">查前后一致</text>
<text x="22" y="108" font-size="8.6" fill="#3a3a35">材料说「主要矛盾变了」→ 矛盾分析法</text>
</svg>
</div>

<div class="qac">
<p class="q">「推理和想象，哪个更管用？」</p>
<p class="a">都要，分工不同。推理把已知接到未知，负责「有依据」；想象改造已有表象，负责「打开可能」。但推理要合规则：<b>充分条件假言推理，肯前肯后、否后否前；否定前件、肯定后件都推不出结论</b>；三段论要<b>中项至少周延一次</b>，否则推不出。还要记住：规则只保证形式有效，前提假，结论照样错。想象同样要有根据：它改造的是已有表象，不是凭空造一个世界。再补三条底线：同一律要求概念前后一致，别中途换意思；排中律要求「会」与「不会」不能都否定；必要条件推理则是否前否后、肯后肯前。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="充分条件假言推理的四种形式">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="22" y="26" font-size="9.2" font-weight="700" fill="#151a21">如果 P，那么 Q</text>
<text x="22" y="46" font-size="8.6" fill="#1f6b4a">肯 P → 肯 Q　有效</text>
<text x="22" y="62" font-size="8.6" fill="#1f6b4a">否 Q → 否 P　有效</text>
<text x="22" y="78" font-size="8.6" fill="#8a3b3b">否 P → 否 Q　无效</text>
<text x="22" y="94" font-size="8.6" fill="#8a3b3b">肯 Q → 肯 P　无效</text>
<text x="22" y="114" font-size="8.4" fill="#3a3a35">规则管形式，前提真假另算</text>
</svg>
</div>

<div class="qac">
<p class="q">「预测准了，就一定成功吗？」</p>
<p class="a">不一定。课本的措辞是「有助于」：有助于认识世界和改造世界，有助于指导实践、趋利避害。它提高胜算，不替你保证结果。执行到不到位、外部条件变不变、对手怎么应对，都会改写结局。<b>预测不能代替实践</b>，还要在实践中检验和修正。答题收口写「把预测放到实践中检验」，比写「一定能成功」稳得多。若问「超前思维有什么用」，仍回到这三条，别另起炉灶。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="预测有助于成功，但不能保证成功">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="22" y="28" font-size="9.4" font-weight="700" fill="#151a21">「有助于」不是「保证」</text>
<rect x="22" y="42" width="90" height="36" rx="6" fill="#eef8f3" stroke="#b8e6d0"/>
<text x="67" y="58" font-size="8.8" fill="#1f6b4a" text-anchor="middle">预测准</text>
<text x="67" y="72" font-size="8.2" fill="#1f6b4a" text-anchor="middle">只说明判断对</text>
<rect x="128" y="42" width="90" height="36" rx="6" fill="#ffffff" stroke="#c9d7e2"/>
<text x="173" y="58" font-size="8.8" fill="#3a3a35" text-anchor="middle">还要靠</text>
<text x="173" y="72" font-size="8.2" fill="#3a3a35" text-anchor="middle">执行、条件、对手</text>
<text x="22" y="98" font-size="8.8" fill="#3a3a35">结局由很多因素改写</text>
<text x="22" y="114" font-size="8.8" fill="#3a3a35">把预测放进实践里检验</text>
</svg>
</div>
</div>
<p class="gx-note">收尾点明：这六问其实是同一件事。前三问在问「根据从哪来、够不够」，后三问在问「方法对不对、限度在哪」。答题时先答根据（现实、调查），再答方法（矛盾分析、合规则的推理想象），最后答限度（不确定性、实践检验），六段话就能自己推出来，不必死背。把这三层写成三句话，任何一道超前思维的题都能起头。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 超前思维就是未卜先知，能提前把未来的事算准。</p>
<p class="er-v">✓ 超前思维是在多角度、全方位地分析事物的历史和现实的基础上，从事物发展的现实情况出发，认识和把握事物的发展趋势，并运用合理的推理和想象，判断事物未来发展趋势的思维。</p>
<p class="er-w">错在哪：把「预测」说成「算准」，还把定义换成了比喻。下定义不能用比喻，也不能把「结果具有不确定性」改成「确定无疑」。</p>
</div>
<div class="er">
<p class="er-x">✗ 预测靠的是眼光和胆量，敢想就能想到别人前面。</p>
<p class="er-v">✓ 超前思维要立足现实，尊重事物发展的客观规律，以调查研究获得的真实材料为根据。</p>
<p class="er-w">错在哪：把「超前」当成「脱离现实」。没有根据的想象是瞎猜，方向可能碰对，却没法指导行动，也没法检验。</p>
</div>
<div class="er">
<p class="er-x">✗ 预测一旦作出就不能改，改了就说明当初判断错了。</p>
<p class="er-v">✓ 由于事物发展的复杂性和多变性，超前思维的结果具有不确定性，要准备多套方案，并在实践中跟踪修正。</p>
<p class="er-w">错在哪：把「不确定性」当成「不许出错」。承认不确定、留预案、按实际调整，正是超前思维的要求；不肯改口才是问题。</p>
</div>
<div class="er">
<p class="er-x">✗ 有了大数据和模型，就不用再跑现场、做调查了。</p>
<p class="er-v">✓ 超前思维要注重调查研究，掌握真实的、大量的材料，这是作出正确预测的基础。</p>
<p class="er-w">错在哪：数据和模型是别人加工过的二手材料，样本、口径、时效都可能偏；现场调查才拿得到一手情况。</p>
</div>
<div class="er">
<p class="er-x">✗ 分析矛盾，就是说话别前后打架，遵守矛盾律。</p>
<p class="er-v">✓ 超前思维要运用矛盾分析方法，分析事物内部矛盾以及事物之间的矛盾，把握事物发展的内在根据和趋势。</p>
<p class="er-w">错在哪：把辩证的「矛盾分析法」和逻辑的「矛盾律」混成一个。矛盾律管思维不能自相矛盾，矛盾分析法管怎么从矛盾运动中看方向。</p>
</div>
<div class="er">
<p class="er-x">✗ 只要推理形式没错，预测的结论就一定可靠。</p>
<p class="er-v">✓ 超前思维要运用合理的推理和想象；推理要遵守规则，结论还要回到实践中检验。</p>
<p class="er-w">错在哪：形式有效不等于结论为真。充分条件假言推理肯前肯后、否后否前，否定前件、肯定后件都推不出结论；三段论要中项至少周延一次。规则管形式，前提管内容。</p>
</div>
<div class="er">
<p class="er-x">✗ 超前思维就是坐在屋里把未来想清楚，想清楚了照着做就行。</p>
<p class="er-v">✓ 超前思维要立足现实、注重调查研究，作出的预测还要在实践中检验和发展，指导人们趋利避害、防患于未然。</p>
<p class="er-w">错在哪：把「想」当成了全部。超前思维的根据在现实，价值在指导实践；预测不能代替实践，更不是一锤定音。</p>
</div>
</div>
