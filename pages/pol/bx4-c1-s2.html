<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">这一框的分数压在三个判断上：基本问题问的是什么、两个方面怎么分、唯物主义和唯心主义凭什么分。先照抄课本这三句，再拆关键词；答题时写课本这句，不写你脑子里那句。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 什么是哲学的基本问题<span class="q-src">人教版（2019）必修4 哲学与文化 · 第一课第二框</span></p>
<p class="q-b">哲学的基本问题是思维和存在的关系问题，也就是意识和物质的关系问题。它包括两个方面的内容：一是思维和存在何者是本原的问题；二是思维和存在有没有同一性的问题，即思维能否正确认识存在的问题。</p>
<p class="q-n">→ 翻成人话：这句定义里有三处会给分。① 问的是「关系」，不是「物质」也不是「意识」单独一个；把它写成「物质和意识谁更重要」，方向就偏了，因为课本问的是「谁是本原」，讲的是先后和决定关系，不是比谁的用处大。② 两个方面的次序不能颠倒：先问谁是本原，再问能不能认识，前者管「世界是什么」，后者管「人能不能认识世界」。③「同一性」是个术语，意思是思维和存在能不能对上号，通俗说就是「人能不能正确认识世界」——考试里看到这四个字，别望文生义成「一样不一样」。</p>
<p class="q-n">→ 生活里的版本是这样的：你说「我觉得我这次肯定及格」，卷子说「你四十八分」。「我觉得」是思维，「四十八分」是存在。谁服从谁？如果你认账，承认分数由答题情况决定，这是唯物主义的态度；如果你坚持「我心里认定我会了，所以我就算会了」，那就是把想法摆到了事实前面。哲学不玄，它只是把这种日常争论问到底。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 为什么说它「基本」<span class="q-src">人教版（2019）必修4 哲学与文化 · 第一课第二框</span></p>
<p class="q-b">思维和存在的关系问题，是人们在生活和实践中首先遇到和无法回避的基本问题。它是一切哲学都不能回避、必须回答的问题。它贯穿于哲学发展的始终，对这一问题的不同回答决定着各种哲学的基本性质和方向，决定着它们对其他哲学问题的回答。</p>
<p class="q-n">→ 翻成人话：三个理由，一条一句，答题时按这三句分行写就够。①「首先遇到、无法回避」——因为人天天在做事：种地要看节气，看病要看化验单，复习要看错题，这些都是在处理「想法」和「实际」的关系，你躲不开。②「一切哲学都必须回答」——不管哪个学派，只要自称哲学，就得对「世界本原是物质还是精神」表个态，不表态就等于没进门。③「贯穿始终、决定性质和方向」——一个哲学家怎么答这一问，他的其他观点就跟着往哪边走，好比地基决定了楼往哪儿盖。</p>
<p class="q-n">→ 这里有个坑：不少同学把「基本问题」理解成「最基础、最简单的入门问题」。课本的「基本」是「绕不过去、管着全局」的意思。所以问「为什么思维和存在的关系问题是哲学的基本问题」，答案必须落到这三条理由上，只写「因为它是哲学最重要的问题」，等于用题目解释题目，一分不给。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 唯物主义与唯心主义的根本分歧<span class="q-src">人教版（2019）必修4 哲学与文化 · 第一课第二框</span></p>
<p class="q-b">唯物主义认为物质是本原，先有物质后有意识，物质决定意识；唯心主义认为意识是本原，物质依赖于意识，意识决定物质。对思维和存在何者是本原这一问题的不同回答，是划分唯物主义和唯心主义的唯一标准。</p>
<p class="q-n">→ 翻成人话：「唯一标准」这四个字是本框最硬的采分点。判断一个观点属于哪一派，只看它怎么回答「谁是本原」，不看别的：不看它对意识重不重视（唯物主义也承认意识有能动作用），不看它说得对不对（唯心主义在某些问题上也有合理成分），更不看它出现得早还是晚（古代朴素唯物主义也是唯物主义）。</p>
<p class="q-n">→ 顺着这一问往下走，唯物、唯心各自又长出几种历史形态：古代朴素唯物主义、近代形而上学唯物主义、辩证唯物主义和历史唯物主义；主观唯心主义、客观唯心主义。形态是「派别内部再分级」，标准还是「谁是本原」。这一点想明白了，材料题里给一句古文让你判断属于哪种形态，你就不会慌——先定派，再定形态，两刀切下去。</p>
</div>

<p class="gx-note">整张表只高亮一行：<b>真正的区别</b>。前五行是陪你把两边分清，最后一行才是能直接搬到答题卡上的句子。背法：先背「物质第一性、意识第二性」这八个字，再往两边挂例证——唯物这边挂「气、原子、客观实在」，唯心这边挂「心、理、上帝、绝对精神」。提醒一句，表格里的「对意识怎么看」这一行最容易误判：唯物主义从来不否认意识，它只说意识是派生的、第二性的；反过来，唯心主义也不否认物质的存在，它只说物质离不开意识。别把「承不承认有意识」当标准，标准只有「谁是本原」。</p>

<text x="56" y="231" font-size="8.8" fill="#3a3a35">判断口诀：先看它把什么当本原（气、原子、客观实在），再看它有没有把物质「说小」。</text>
<text x="56" y="245" font-size="8.8" fill="#3a3a35">三种形态都是唯物主义，所以「朴素」「形而上学」只说明水平，不改变派别。</text>
</svg>
<span class="gx-zoomchip">点击放大</span>
</div>
<p class="gx-take">唯物主义有三种历史形态，区别在「物质被理解成什么」：具体形态、原子、客观实在；形态有高下，派别无例外，三种都主张物质第一性、意识第二性。</p>
<p class="gx-note">三个易混点点一下。第一，「古代朴素」不等于「原始、幼稚」：它坚持了唯物主义的根本方向，本质上是正确的，只是把复杂的物质简单化成了水、火、气，带有直观性和猜测性，答题要写「方向正确、水平有限」。第二，「近代形而上学」的毛病有三个：机械性（把一切运动都看成机械位移）、形而上学性（孤立静止看问题）、历史观上的唯心主义（不彻底），这三个词考试要分开写。第三，「辩证唯物主义和历史唯物主义」不是又一种「说法」，它是马克思、恩格斯创立的科学的世界观和方法论，也是我们教材的立场。</p>
</figure>
<figure class="gx-fig">
<div class="fig-cap">
<span class="fig-no">图 3</span><span class="fig-t">唯心主义的两种面孔：精神挂在谁身上</span>
<span class="bdg bdg-warn">易错</span>
</div>
<p class="fig-s">两种唯心主义都把意识当本原，区别在「这份精神挂在谁身上」。挂在「我」身上的，是主观唯心主义，关键词是心、我、感觉、经验。挂在「我」之外的某种东西上的，是客观唯心主义，关键词是理、理念、上帝、绝对精神。看材料先找那个「本原」是谁的。</p>
<div class="gx-svgbox">
<svg viewBox="0 0 820 270" role="img" aria-label="唯心主义两种形态：主观唯心主义把人的主观精神当本原，客观唯心主义把客观精神当本原">
<rect x="16" y="16" width="788" height="238" rx="10" fill="#f8fbfd" stroke="#dbe7ef"/>
<text x="36" y="44" font-size="11.5" font-weight="700" fill="#151a21">唯心主义的两张面孔：都答「意识是本原」，但「谁的精神」不同</text>
<text x="36" y="62" font-size="8.8" fill="#6b7280">判别只看一处：这个「精神」离不离得开「我」。</text>
<rect x="40" y="76" width="356" height="128" rx="8" fill="#ffffff" stroke="#f3c9cf"/>
<text x="54" y="96" font-size="9.6" font-weight="700" fill="#9f1239">① 主观唯心主义：本原是「我」的精神</text>
<text x="54" y="118" font-size="8.4" fill="#3a3a35">把人的主观精神夸大为唯一实在</text>
<text x="54" y="135" font-size="8.4" fill="#3a3a35">关键词：心、我、感觉、经验、意志</text>
<text x="54" y="152" font-size="8.4" fill="#3a3a35">「心外无物」「存在就是被感知」</text>
<text x="54" y="177" font-size="8.2" fill="#6b7280">落点：离开我的感觉，世界就不存在</text>
<text x="54" y="194" font-size="8.2" fill="#9f1239">错在：把「我」放大成了世界</text>
<rect x="424" y="76" width="356" height="128" rx="8" fill="#ffffff" stroke="#f3c9cf"/>
<text x="438" y="96" font-size="9.6" font-weight="700" fill="#9f1239">② 客观唯心主义：本原是「我」之外的精神</text>
<text x="438" y="118" font-size="8.4" fill="#3a3a35">把客观精神看作世界的主宰和本原</text>
<text x="438" y="135" font-size="8.4" fill="#3a3a35">关键词：理、理念、上帝、绝对精神</text>
<text x="438" y="152" font-size="8.4" fill="#3a3a35">「理生万物」「绝对精神决定世界」</text>
<text x="438" y="177" font-size="8.2" fill="#6b7280">落点：现实世界是某种精神的外化</text>
<text x="438" y="194" font-size="8.2" fill="#9f1239">错在：给精神找了个「客观」的外壳</text>
<rect x="40" y="214" width="740" height="26" rx="8" fill="#ffffff" stroke="#dbe7ef"/>
<text x="56" y="231" font-size="8.8" fill="#3a3a35">口诀：精神挂在「我」身上是主观唯心，挂在「我」之外是客观唯心；两者都是意识第一性。</text>
</svg>
<span class="gx-zoomchip">点击放大</span>
</div>
<p class="gx-take">区分两种唯心主义只看本原「是谁的精神」：心、我、感觉、经验属于主观唯心主义；理、理念、上帝、绝对精神属于客观唯心主义。两者共同点是都把意识当本原、都颠倒了物质和意识的关系。</p>
<p class="gx-note">这里有个坑：看到「理」「天」「道」就一律判客观唯心，是有风险的。判断的关键不是词，而是这个词在句子里指什么：朱熹的「理」是先于万物、独立存在的客观精神，所以是客观唯心；但「理」如果只是指事物的规律，那就不一定。考场上稳妥的做法是看整句的落点——它是不是说「精神产生了物质」。另外，别把「客观唯心」理解成「比较客观、比较正确」，它的「客观」只修饰那个精神的位置，不修饰对错。</p>
</figure>

<span class="bdg bdg-ext">延伸</span>

<text x="54" y="190" font-size="8.2" fill="#6b7280">认识在实践中产生、检验、发展</text>

</svg>
<span class="gx-zoomchip">点击放大</span>

<p class="gx-take">可知论与不可知论的分界是「思维和存在有没有同一性」：承认能正确认识世界的是可知论，否认的是不可知论；这条线独立于唯物与唯心的划分。</p>
<p class="gx-note">延伸一句，考试常拿它做干扰项：题目问「下列观点属于唯物主义还是唯心主义」，选项里却混进一句「人类永远无法认识世界的本质」。这句答的是第二个方面，正确归类是不可知论，硬塞进唯物或唯心的筐里就是错。反过来，问「属于可知论还是不可知论」时，也别拿「物质第一性」去答，那是另一把刀。</p>

<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。五步走完，这类题的架子就搭好了。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 观点归类 + 原理说明<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">材料：甲说「气者，理之依也」；乙认为世界的本原是原子，原子的属性就是物质的属性；丙说「心外无物，存在就是被感知」；丁认为「理生万物」，现实世界是「绝对精神」的外化；戊说人类永远无法认识世界的本来面目，只能认识现象。<br>结合材料，运用《哲学与文化》的知识，回答：（1）甲、乙、丙、丁、戊的观点分别属于哪种哲学形态或派别？（2）划分唯物主义和唯心主义的唯一标准是什么？请说明理由。（12 分）</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性</p>
<p class="s-b">两问，两种题型。第一问是「判断归类」，给你五句话，让你各自对号；第二问是「原理说明」，让你答标准并讲理由。知识范围锁在第一课第二框。先在草稿上画两条横线：一条写「谁是本原」，一条写「有无同一性」，后面五句话都往这两条线上挂。</p>
<p class="s-k">用到：哲学基本问题的两个方面；唯物主义与唯心主义的划分标准</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 圈关键词</p>
<p class="s-b">材料里五个人，一人一句，一句就是一个观点，不要合并。甲的关键词是「气」，乙的是「原子」，丙的是「心」「被感知」，丁的是「理」「绝对精神」，戊的是「永远无法认识」。圈完你会发现，前四句都在说「世界由什么构成」，第五句在说「人能不能认识世界」——它答的是另一问。</p>
<p class="s-k">用到：思维和存在的关系问题；何者是本原；有没有同一性</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 先定派，再定形态</p>
<p class="s-b">甲、乙把物质性的东西放在第一位，是唯物主义；丙、丁把精神放在第一位，是唯心主义。定完派再往下切形态：甲用「气」这种具体形态，属古代朴素；乙用「原子」，属近代形而上学；丙的本原是「我的心」，属主观唯心；丁的本原是「理」「绝对精神」，属客观唯心。戊单独处理，归不可知论。</p>
<p class="s-k">用到：唯物主义三种形态；唯心主义两种形态；可知论与不可知论</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 一句一理由</p>
<p class="s-b">光写形态名不够，每一句后面要跟半句依据，否则分数拿不满。甲：把物质归结为气这种具体形态，直观、猜测，但方向正确。乙：把物质归结为原子，具有机械性、形而上学性，历史观上仍是唯心主义。丙：把人的主观精神夸大为唯一实在。丁：把客观精神看作世界的主宰和本原。戊：否认思维和存在有同一性。</p>
<p class="s-k">用到：各形态的特征与局限；唯一标准</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口写标准</p>
<p class="s-b">第二问只答一句标准就够，但要答准：「对思维和存在何者是本原这一问题的不同回答，是划分唯物主义和唯心主义的唯一标准。」理由分两层：唯物主义认为物质是本原、物质决定意识；唯心主义认为意识是本原、意识决定物质。最后补一句反例，说明它不是「谁更重要」、也不是「承不承认意识的作用」，把边界划清。</p>
<p class="s-k">用到：物质第一性、意识第二性；唯一标准；观点与材料相结合</p>
</li>
</ol>

<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）① 甲的观点属于古代朴素唯物主义。他把「气」这种具体的物质形态当作世界的本原，坚持了唯物主义的根本方向，本质上是正确的，但带有直观性和猜测性，把复杂的物质简单化了。<br>② 乙的观点属于近代形而上学唯物主义。他把物质归结为自然科学意义上的原子，认为原子的属性就是物质的属性，具有机械性、形而上学性，在历史观上仍然陷入唯心主义。<br>③ 丙的观点属于主观唯心主义。他把人的主观精神（心、感觉）夸大为唯一的实在，认为客观事物以至整个世界都依赖于人的主观精神。<br>④ 丁的观点属于客观唯心主义。他把「理」「绝对精神」这种客观精神看作世界的主宰和本原，认为现实的物质世界只是这种客观精神的外化和表现。<br>⑤ 戊的观点属于不可知论。他否认思维和存在具有同一性，认为思维不能正确认识存在。<br>（2）① 唯一标准：对思维和存在何者是本原这一问题的不同回答，是划分唯物主义和唯心主义的唯一标准。<br>② 理由：唯物主义认为物质是本原，先有物质后有意识，物质决定意识，即物质第一性、意识第二性；唯心主义认为意识是本原，物质依赖于意识，意识决定物质，即意识第一性、物质第二性。<br>③ 注意：这一标准不是「物质和意识谁更重要」，也不是「是否承认意识有能动作用」，对意识作用的估计不改变派别归属。</p>
</div>
</div>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。每问先自己答一句，再看下面那段。</p>
<div class="gx-qa">

<div class="qac">
<p class="q">「哲学的基本问题就是物质和意识谁更重要吗？」</p>
<p class="a">不是。课本问的是<b>何者是本原</b>，讲的是谁先有、谁决定谁，不是比谁的用处大。物质是本原，意识是派生的，这才叫唯物主义。把「本原」换成「重要」，唯物主义和唯心主义就没法分了，因为没人会说意识不重要。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="哲学的基本问题问的是谁是本原，不是谁更重要">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="27" font-size="9.2" text-anchor="middle" fill="#151a21">问的是「谁是本原」</text>
<rect x="20" y="36" width="200" height="26" rx="7" fill="#ffffff" stroke="#b8e6d0"/>
<text x="120" y="53" font-size="8.4" text-anchor="middle" fill="#1e6640">谁先有、谁决定谁</text>
<rect x="24" y="74" width="90" height="28" rx="6" fill="#ffffff" stroke="#b8e6d0"/>
<text x="69" y="92" font-size="8.2" text-anchor="middle" fill="#1e6640">物质第一性</text>
<rect x="126" y="74" width="90" height="28" rx="6" fill="#ffffff" stroke="#f3c9cf"/>
<text x="171" y="92" font-size="8.2" text-anchor="middle" fill="#9f1239">意识第一性</text>
<text x="120" y="118" font-size="8" text-anchor="middle" fill="#6b7280">不是「谁用处大」</text>
</svg>
</div>

<div class="qac">
<p class="q">「唯物主义就是机械唯物主义吗？」</p>
<p class="a">不是。唯物主义有三种历史形态：<b>古代朴素唯物主义、近代形而上学唯物主义、辩证唯物主义和历史唯物主义</b>。「机械性、形而上学性」只是第二种形态的局限，不能拿来概括整个唯物主义。我们学的马克思主义哲学，是唯物主义的最高形态。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="唯物主义三种形态：古代朴素、近代形而上学、辩证唯物主义">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="25" font-size="9.2" text-anchor="middle" fill="#151a21">唯物主义有三副面孔</text>
<rect x="20" y="32" width="200" height="22" rx="6" fill="#ffffff" stroke="#dbe7ef"/>
<text x="32" y="47" font-size="8" fill="#3a3a35">古代朴素：气、水、火</text>
<rect x="20" y="58" width="200" height="22" rx="6" fill="#ffffff" stroke="#dbe7ef"/>
<text x="32" y="73" font-size="8" fill="#3a3a35">近代形而上学：原子（机械性）</text>
<rect x="20" y="84" width="200" height="22" rx="6" fill="#ffffff" stroke="#b8e6d0"/>
<text x="32" y="99" font-size="8" font-weight="700" fill="#1e6640">辩证唯物主义：客观实在</text>
<text x="120" y="119" font-size="8" text-anchor="middle" fill="#6b7280">形态有高下，派别没例外</text>
</svg>
</div>

<div class="qac">
<p class="q">「唯心主义全是胡说，一无是处吗？」</p>
<p class="a">不能这么简单判断。唯心主义的<b>根本观点是错误的</b>，它颠倒了物质和意识的关系，把意识说成世界的本原。但要具体分析：它看到了意识的能动作用，其中一些思想有合理成分。所以对它要批判地对待——承认其中合理的部分，同时指出根本观点的错误。答题时写「根本观点错误，但包含合理成分」，比写「全错」稳。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="唯心主义根本观点错误，但对意识能动作用的探讨有合理成分">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="27" font-size="9.2" text-anchor="middle" fill="#151a21">错误的根，合理的枝</text>
<rect x="20" y="36" width="200" height="26" rx="7" fill="#ffffff" stroke="#f3c9cf"/>
<text x="120" y="53" font-size="8.2" text-anchor="middle" fill="#9f1239">根本观点：颠倒物质与意识</text>
<rect x="20" y="68" width="200" height="26" rx="7" fill="#ffffff" stroke="#b8e6d0"/>
<text x="120" y="85" font-size="8.2" text-anchor="middle" fill="#1e6640">合理成分：看到意识的能动作用</text>
<text x="120" y="112" font-size="8" text-anchor="middle" fill="#6b7280">批判地对待，不一笔抹掉</text>
</svg>
</div>

<div class="qac">
<p class="q">「古代朴素唯物主义那么粗糙，还算唯物主义吗？」</p>
<p class="a">算。它把水、火、气这些<b>物质性的东西</b>当作本原，坚持了唯物主义的根本方向，本质上是正确的。它的毛病是水平低：把物质归结为具体形态，带有直观性和猜测性。所以答题要写「方向正确、水平有限」，不能写「它是错的」或者「它是唯心主义」。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="古代朴素唯物主义方向正确、水平有限">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="26" font-size="9.2" text-anchor="middle" fill="#151a21">方向正确，水平有限</text>
<rect x="20" y="34" width="200" height="24" rx="6" fill="#ffffff" stroke="#b8e6d0"/>
<text x="120" y="50" font-size="8.2" text-anchor="middle" fill="#1e6640">本原：气、水、火（具体形态）</text>
<text x="120" y="78" font-size="8.2" text-anchor="middle" fill="#1e6640">✓ 坚持物质第一性</text>
<text x="120" y="96" font-size="8.2" text-anchor="middle" fill="#9f1239">✗ 直观、猜测、简单化</text>
<text x="120" y="118" font-size="8" text-anchor="middle" fill="#6b7280">它是唯物主义，不是唯心主义</text>
</svg>
</div>

<div class="qac">
<p class="q">「『心外无物』和『理生万物』都是唯心主义，有区别吗？」</p>
<p class="a">有，而且必须分开写。「心外无物」把本原说成<b>人的主观精神</b>，是主观唯心主义；「理生万物」把本原说成<b>客观精神</b>，是客观唯心主义。判别只看一处：这份精神离不离得开「我」。离得开、被说成客观存在的，是客观唯心；离不开、就落在我的心和感觉上的，是主观唯心。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="主观唯心主义把人的主观精神当本原，客观唯心主义把客观精神当本原">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="26" font-size="9.2" text-anchor="middle" fill="#151a21">精神挂在谁身上</text>
<rect x="16" y="34" width="100" height="46" rx="7" fill="#ffffff" stroke="#f3c9cf"/>
<text x="66" y="50" font-size="8.4" font-weight="700" text-anchor="middle" fill="#9f1239">主观唯心</text>
<text x="66" y="66" font-size="7.8" text-anchor="middle" fill="#3a3a35">心 · 我 · 感觉</text>
<rect x="124" y="34" width="100" height="46" rx="7" fill="#ffffff" stroke="#f3c9cf"/>
<text x="174" y="50" font-size="8.4" font-weight="700" text-anchor="middle" fill="#9f1239">客观唯心</text>
<text x="174" y="66" font-size="7.8" text-anchor="middle" fill="#3a3a35">理 · 上帝 · 绝对精神</text>
<text x="120" y="100" font-size="8.2" text-anchor="middle" fill="#3a3a35">看它离不离得开「我」</text>
<text x="120" y="118" font-size="8" text-anchor="middle" fill="#6b7280">两者都是意识第一性</text>
</svg>
</div>

<div class="qac">
<p class="q">「不可知论也是唯心主义吧？」</p>
<p class="a">不能这么划。唯心主义和可知论、不可知论是<b>两条线</b>：回答「谁是本原」，分唯物、唯心；回答「思维能不能正确认识存在」，分可知、不可知。一个人可以既唯物又不可知，也可以既唯心又可知。马克思主义哲学两问都答得干脆：物质第一性，并且世界是可知的。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="两条标准：本原问题分唯物唯心，同一性问题分可知不可知">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="25" font-size="9.2" text-anchor="middle" fill="#151a21">两把刀，别当成一把</text>
<rect x="20" y="32" width="200" height="24" rx="6" fill="#ffffff" stroke="#b8e6d0"/>
<text x="32" y="48" font-size="8" fill="#1e6640">本原问题 → 唯物 / 唯心</text>
<rect x="20" y="60" width="200" height="24" rx="6" fill="#ffffff" stroke="#dbe7ef"/>
<text x="32" y="76" font-size="8" fill="#3a3a35">同一性问题 → 可知 / 不可知</text>
<text x="120" y="102" font-size="8.2" text-anchor="middle" fill="#9f1239">交叉：可唯物而不可知</text>
<text x="120" y="119" font-size="8" text-anchor="middle" fill="#6b7280">马克思主义：两问都答满</text>
</svg>
</div>

</div>
<p class="gx-note">六问其实是同一件事：都在问「你拿哪把刀切这句话」。第一把刀切本原，切出唯物、唯心，再看它的历史形态；第二把刀切同一性，切出可知、不可知。答题时按顺序走三步：先圈本原词（气、原子、心、理），再定派别，最后补一句形态特征或局限。三步走完，判断类选择题和「运用哲学基本问题的知识分析材料」这类主观题，用的是同一套动作。</p>
</section>
