<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">这一框的分数压在两个地方：总目标的两层能不能写全，五项原则能不能对上材料。先照抄课本，再拆关键词；答题时写课本这句，不写你脑子里那句。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 全面依法治国的总目标<span class="q-src">人教版（2019）必修3 政治与法治 · 第七课第二框</span></p>
<p class="q-b">全面推进依法治国，总目标是建设中国特色社会主义法治体系、建设社会主义法治国家。这就是，在中国共产党领导下，坚持中国特色社会主义制度，贯彻中国特色社会主义法治理论，形成完备的法律规范体系、高效的法治实施体系、严密的法治监督体系、有力的法治保障体系，形成完善的党内法规体系，坚持依法治国、依法执政、依法行政共同推进，坚持法治国家、法治政府、法治社会一体建设，实现科学立法、严格执法、公正司法、全民守法，促进国家治理体系和治理能力现代化。</p>
<p class="q-n">→ 翻成人话：这一整段话，拆开是四块。<b>第一块是总目标本身的两个分句</b>：建设中国特色社会主义法治体系、建设社会主义法治国家。前者是抓手，后者是目标，考试最爱在这里设「漏写」的坑。<b>第二块是五个子体系</b>：法律规范、法治实施、法治监督、法治保障、党内法规，一个都不能少。<b>第三块是三个「一起」</b>：依法治国、依法执政、依法行政共同推进；法治国家、法治政府、法治社会一体建设。<b>第四块是十六个字</b>：科学立法、严格执法、公正司法、全民守法。答「如何理解总目标」，就按这四块铺开；只写一句，等于交白卷。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 五项原则<span class="q-src">人教版（2019）必修3 政治与法治 · 第七课第二框</span></p>
<p class="q-b">全面依法治国必须坚持中国共产党的领导、坚持人民主体地位、坚持法律面前人人平等、坚持依法治国和以德治国相结合、坚持从中国实际出发。党的领导是社会主义法治最根本的保证。</p>
<p class="q-n">→ 翻成人话：五条原则各有各的岗位，别当成五句并列的口号背。第一条定方向：谁来领导，答「党的领导是社会主义法治最根本的保证」。第二条定立场：法治为了谁、依靠谁，答「为了人民、依靠人民、造福人民、保护人民」。第三条定底线：法律面前没有例外，谁都没有超越宪法法律的特权。第四条定方法：法律和道德一起用，不是二选一。第五条定土壤：从中国国情出发，借鉴可以，照搬不行。材料题里出现哪个主体、哪个动作，就配哪一条，一条一句，别串门。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 法律面前人人平等<span class="q-src">人教版（2019）必修3 政治与法治 · 第七课第二框</span></p>
<p class="q-b">平等是社会主义法律的基本属性。任何组织和个人都必须尊重宪法法律权威，都必须在宪法法律范围内活动，都必须依照宪法法律行使权力或权利、履行职责或义务，都不得有超越宪法法律的特权。</p>
<p class="q-n">→ 翻成人话：这段话的骨架是四个「都必须」加一个「都不得」。主语不是「老百姓」，是「任何组织和个人」——党委、政府、企业、社会组织、你和我，全在里面。这里有个坑：平等说的是<b>法律实施上的平等</b>，不是「所有人待遇一模一样」。未成年人犯罪从轻处理、给残疾人设无障碍通道、对困难群体法律援助，这些看着「不一样」，恰恰是为了让平等真的落地。判断标准只有一条：这种差别有没有法律依据、是不是为了保障权利。有，就不是特权；没有，就是特权。</p>
</div>

<p class="gx-note">整张表只高亮一行：<b>真正的区别</b>。记法一句：体系是「怎么建」，国家是「建成什么」。答题时两层都要落笔，写成「建设中国特色社会主义法治体系、建设社会主义法治国家」，中间用顿号连住，别用「即」把后一层解释成前一层——那等于自己把目标降级成了工具。还有一处容易混：「法律体系」和「法治体系」差一个字，内容差一大截。法律体系只讲规矩全不全，法治体系还要讲规矩怎么执行、谁来监督、队伍经费够不够、党内法规完不完善。材料里只要出现「执法记录」「监督平台」「法治培训」，那都不是「法律体系」能兜住的。</p>
</section>

<p class="gx-h2s">四张图四件事：先看总目标的两层，再看五项原则各站哪个岗，然后把五个子体系摊开，最后看法律和道德怎么配合。先看边框和箭头，再看字。</p>

<text x="56" y="246" font-size="9" fill="#8a5c14">考试只考「原则＋材料」的配对：材料里谁在做事、做了什么事，就配哪一条。</text>
<text x="56" y="264" font-size="9" fill="#8a5c14">配错的典型是把「立法公开征求意见」写成党的领导，其实它落在人民主体地位。</text>
</svg>
<span class="gx-zoomchip">点击放大</span>
</div>
<p class="gx-take">五项原则不是五个并列的口号：党的领导定方向，人民主体地位定立场，平等定底线，法德结合定方法，从实际出发定土壤。</p>
<p class="gx-note">材料题里五条原则不会全考，通常考两到三条。判断时先抓主体：出现「党中央」「市委」「党组」，先想党的领导；出现「听证会」「公开征求意见」「人大代表」，想人民主体地位；出现「不论级别」「一律追责」「没有例外」，想法律面前人人平等；出现「核心价值观」「村规民约」「家风」，想法德结合；出现「结合本地实际」「不照搬」，想从实际出发。一条原则配一句材料，别把五条全抄上去充字数，抄多了不给分，还占答题位置。</p>
</figure>
<figure class="gx-fig">
<div class="fig-cap">
<span class="fig-no">图 3</span><span class="fig-t">法治体系的五个子体系：各管一段</span>

<p class="fig-s">五个子体系是一条流水线：先有规矩，再让规矩跑起来，再有人盯着跑得对不对，再有人给钱给人给技术，最后党内也有一套更严的规矩。答题时五个名字要写全，每个后面跟一句「管什么」。选择题常把「法律体系」当正确答案的替身，你要能认出它只覆盖了第一条。</p>

<text x="310" y="80" font-size="8.8" fill="#3a3a35">立法跟得上：有法可依，规矩不缺位</text>

<p class="gx-take">五个子体系缺一不可：立法、实施、监督、保障、党内法规，少写一个就少一个采分点；「法律体系」只等于第一个。</p>
<p class="gx-note">这一串名词背不住时，用一条生活链子串。你家楼下的电动车充电桩：先得有规定说能不能装、装在哪（法律规范）；规定写了要有人查、有人罚（法治实施）；查的人自己也被审计、被群众举报（法治监督）；装桩要钱、要人、要技术标准（法治保障）；而党员业主、社区党组织还得按党纪带头（党内法规）。一圈走完，就是「体系」两个字的意思。考试问「如何建设法治体系」，你就按这五段答，一段一句，比空喊「加强法治」有用得多。</p>

<figure class="gx-fig">

<span class="fig-no">图 4</span><span class="fig-t">法治与德治：底线和高线怎么配合</span>
<span class="bdg bdg-ext">延伸</span>

<p class="fig-s">法律和道德都在管人，但管的位置不一样：法律守底线，规定你不许做什么，违反了国家强制你担责；道德管高线，倡导你应该做什么，靠内心认同和舆论。少了法律，秩序守不住；少了道德，法律管不过来。所以课本的说法是「一手抓法治、一手抓德治」，不是二选一。</p>

<text x="56" y="80" font-size="9.8" font-weight="700" fill="#9f1239">法治 · 法安天下</text>
<text x="56" y="102" font-size="8.8" fill="#3a3a35">靠国家强制力，管的是底线</text>
<text x="56" y="120" font-size="8.8" fill="#3a3a35">规定不许做什么，违反要担责</text>
<text x="56" y="138" font-size="8.8" fill="#3a3a35">事后追责，讲证据、讲程序</text>
<text x="56" y="158" font-size="8.4" fill="#6b7280">没有它，秩序守不住</text>
<rect x="430" y="56" width="350" height="112" rx="8" fill="#ffffff" stroke="#b8e6d0"/>

<text x="446" y="120" font-size="8.8" fill="#3a3a35">倡导应该做什么，靠自觉</text>

<text x="56" y="220" font-size="9" fill="#1e6640">法律和道德相辅相成，法治和德治相得益彰，这才是课本要的完整答案。</text>
</svg>
<span class="gx-zoomchip">点击放大</span>
</div>
<p class="gx-take">法治和德治不是二选一：法律守住底线，道德把底线往上抬一截；写「只要法治」或「以德代法」，两个方向都错。</p>
<p class="gx-note">举两个你已经见过的例子。高铁上霸座，法律能罚他、能限制他乘车，这是法治；但「别占别人座位」这条规矩，更多是小时候家里和学校教的，这是德治。斑马线前礼让行人，交法能罚不礼让的司机，可一座城市的司机普遍愿意停，靠的是风气。材料里出现「社会主义核心价值观入法」「市民公约」「家风建设」「诚信红黑榜」，都是法德结合；出现「严格执法」「违法必究」，那是法治那一侧，别硬套成德治。</p>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。这道题 12 分，按「两层 → 子体系 → 原则」分点写。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 体现类材料分析题<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">某市推进法治建设：市委常委会每年专题研究法治建设任务，把党的领导落实到立法、执法、司法、守法各环节；市政府公布权力清单和责任清单，规范性文件一律公开征求意见；执法全过程记录，重大执法决定先做合法性审核；市人大常委会开展执法检查，审计部门公开整改情况；把社会主义核心价值观融入市民公约、村规民约；结合本地老旧小区多的实际制定物业管理条例，没有照搬外地模式。结合材料，说明该市做法是如何体现全面依法治国的总目标和原则的。（12 分）</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性：先框范围</p>
<p class="s-b">题干问「如何体现总目标和原则」，范围锁在第七课第二框，题型是「原理＋材料」的体现类。这类题不问你「怎么看」，只问你「材料里的做法对应哪条原理」，所以每一段都要有「术语＋材料事实」两截，缺一截就只是复述材料。</p>
<p class="s-k">用到：总目标、五项原则、答题格式「原理＋材料」</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 先落总目标的两层</p>
<p class="s-b">开头一句就把两层写全：全面依法治国的总目标是建设中国特色社会主义法治体系、建设社会主义法治国家。然后接材料——该市建清单、定条例、做审核，是在建「体系」；治理有效、群众办事有据，是在朝「法治国家」走。这一步是整道题的地基，漏掉「法治体系」四个字，后面写得再热闹也上不了高分。</p>
<p class="s-k">用到：总目标的两个层次</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 铺五个子体系，逐条对材料</p>
<p class="s-b">规范性文件公开征求意见、制定物业管理条例，对应「完备的法律规范体系」；执法全过程记录、重大执法决定合法性审核，对应「高效的法治实施体系」；人大执法检查、审计公开整改，对应「严密的法治监督体系」；队伍培训、经费和技术保障，对应「有力的法治保障体系」；市委研究部署、党员干部带头，还可带一句「完善的党内法规体系」。五条不必全写，写三条以上并配上材料就够。</p>
<p class="s-k">用到：法治体系的五个子体系</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 转五项原则，一条一句</p>
<p class="s-b">市委常委会专题研究、把党的领导贯穿各环节，体现坚持党的领导，党的领导是社会主义法治最根本的保证；公开征求意见，体现坚持人民主体地位；执法司法一视同仁、没有例外，体现坚持法律面前人人平等；核心价值观融入市民公约、村规民约，体现坚持依法治国和以德治国相结合；结合老旧小区实际立法、不照搬外地模式，体现坚持从中国实际出发。</p>
<p class="s-k">用到：五项原则及各自的判据</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口：分点、回扣、加一句意义</p>
<p class="s-b">按「① 总目标两层 ② 子体系 ③ 原则」的次序分点，每点先术语后材料。结尾回扣一句：这些做法把法治体系建起来，推动法治国家、法治政府、法治社会一体建设，有利于促进国家治理体系和治理能力现代化。别再展开新观点，收住就好。</p>
<p class="s-k">用到：一体建设、国家治理体系和治理能力现代化</p>
</li>
</ol>

<p class="ans-b">① 全面依法治国的总目标是建设中国特色社会主义法治体系、建设社会主义法治国家。该市公布权力清单、制定物业条例、规范执法程序，是在建设法治体系；治理有序、群众办事有据，是在建设法治国家。<br>② 完备的法律规范体系要求立法跟上。该市规范性文件一律公开征求意见，并结合本地实际制定物业管理条例，让治理有规可依。<br>③ 高效的法治实施体系要求法律落地。该市实行执法全过程记录、重大执法决定合法性审核，保证执法严格规范公正文明。<br>④ 严密的法治监督体系要求权力受制约。市人大常委会开展执法检查，审计部门公开整改情况，把监督落到日常。<br>⑤ 坚持党的领导。市委常委会专题研究法治建设，把党的领导贯彻到立法、执法、司法、守法全过程，党的领导是社会主义法治最根本的保证。<br>⑥ 坚持人民主体地位。立法公开征求意见，法治为了人民、依靠人民、造福人民、保护人民。<br>⑦ 坚持法律面前人人平等。执法司法不因级别、身份而例外，任何组织和个人都不得有超越宪法法律的特权。<br>⑧ 坚持依法治国和以德治国相结合。把社会主义核心价值观融入市民公约、村规民约，法律和道德相辅相成。<br>⑨ 坚持从中国实际出发。结合本地老旧小区多的实际立法，没有照搬外地模式，走中国特色社会主义法治道路。<br>⑩ 这些做法推动法治国家、法治政府、法治社会一体建设，有利于促进国家治理体系和治理能力现代化。</p>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。每问先自己答一句，再看下面那句。</p>
<div class="gx-qa">

<div class="qac">
<p class="q">「总目标是不是就是『建设社会主义法治国家』这一句？」</p>
<p class="a">不是，是<b>两层</b>：建设中国特色社会主义法治体系、建设社会主义法治国家。前者是总抓手，后者是目标状态，中间是顿号不是「即」。只写后半句，阅卷按「要点不全」扣分，因为这等于只写了结果，没写拿什么去建。</p>

<text x="120" y="28" font-size="9.2" text-anchor="middle" fill="#151a21">总目标：两层，不是一句</text>

<text x="32" y="92" font-size="8.8" font-weight="700" fill="#9f1239">第二层 · 法治国家（目标）</text>

</svg>
</div>

<div class="qac">
<p class="q">「坚持党的领导，会不会妨碍依法治国？」</p>
<p class="a">不会，两者是统一的。党的领导是社会主义法治<b>最根本的保证</b>：党领导立法、保证执法、支持司法、带头守法。同时党必须在宪法法律范围内活动，党的主张要通过法定程序成为国家意志。把两者对立起来，正是这道题最爱设的坑。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="党的领导与依法治国是统一的">

<text x="20" y="66" font-size="8.4" fill="#3a3a35">② 支持司法、带头守法</text>
<text x="20" y="84" font-size="8.4" fill="#3a3a35">③ 党必须在宪法法律内活动</text>
<text x="20" y="102" font-size="8.4" fill="#3a3a35">④ 主张经法定程序成为国家意志</text>
<text x="120" y="120" font-size="8" text-anchor="middle" fill="#6b7280">党的领导是根本保证，不是法外之力</text>
</svg>
</div>

<div class="qac">
<p class="q">「法律面前人人平等，是不是所有人处理结果都一样？」</p>
<p class="a">不是，平等<b>不是平均主义</b>。它指法律实施上的平等：同样情况同样处理，不同情况差别处理。未成年人从轻、残疾人无障碍设施、给困难群众法律援助，看着「不一样」，恰恰是为了让平等真正落地。判据是：差别有没有法律依据、是不是为了保障权利。</p>

<text x="173" y="82" font-size="8" text-anchor="middle" fill="#3a3a35">反而伤平等</text>
<text x="120" y="112" font-size="8" text-anchor="middle" fill="#6b7280">差别有法律依据，就不算特权</text>
</svg>
</div>

<div class="qac">
<p class="q">「法治和德治，是不是法治更重要？」</p>
<p class="a">不是比轻重，是分工不同。法律是底线，管不许做什么；道德是高线，管应该做什么。课本要求<b>一手抓法治、一手抓德治</b>，法安天下、德润人心，两者相辅相成、相得益彰。写「以德代法」或「道德没用」，两个方向都错。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="法治守底线，德治抬高度，两者结合">

<text x="32" y="87" font-size="8.4" fill="#1e6640">德治：应该做什么，靠自觉</text>
<text x="120" y="114" font-size="8" text-anchor="middle" fill="#6b7280">法安天下，德润人心</text>
</svg>
</div>

<div class="qac">
<p class="q">「从中国实际出发，是不是就不学外国了？」</p>
<p class="a">不是。课本的原话是：汲取中华法律文化精华，<b>借鉴</b>国外法治有益经验，但<b>决不照搬</b>外国法治理念和模式。关键在于「以我为主」：立足中国国情，走中国特色社会主义法治道路，学习是为了解决自己的问题。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="借鉴可以，照搬不行">

<text x="20" y="50" font-size="8.4" fill="#1e6640">✓ 借鉴有益经验，解决自己的问题</text>

</div>

<div class="qac">
<p class="q">「党内法规是党内的规矩，也算法治体系的一部分？」</p>
<p class="a">算，而且是<b>重要组成部分</b>。五个子体系的最后一个就是「完善的党内法规体系」。党领导法治，自己更要守规矩，党规党纪严于国法。答题时五个子体系要写全，漏掉它，五个就变四个。</p>

<p class="gx-note">六问其实是同一件事：都在问「这套法治系统由谁领导、为了谁、守住什么底线、靠什么手段、从哪里长出来」。第一问考结构，别把两层压成一句；第二问考关系，别把党的领导和依法治国对立；第三问考边界，平等是同一把尺子，不是一刀切；第四问考分工，法律和道德各管一段；第五问考立场，借鉴不等于照搬；第六问考构成，党内法规也是体系的一部分。材料题写不出话时，按「谁领导、为了谁、怎么平等、法与德怎么配合、从哪里出发」这五问各写一句，再各配一条材料事实，框架就立住了。</p>
