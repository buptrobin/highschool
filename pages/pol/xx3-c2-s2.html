<div class="gx-kicker">ELI5-HIGH · 讲给要考试的人</div>
<p class="gx-claim">判断这一节真正要你会的，只有两件事：<b>判断必须有所断定、且有真假</b>；<b>复合判断的真假，看支判断加联结项</b>。不是背「判断分几类」，而是拿到一句话就能拆开。</p>
<div class="gx-meta">
<span><i></i>人教版（2019）选择性必修3 逻辑与思维 · 第二单元第五课</span>
<span><i></i>高二 · 第二单元 遵循逻辑思维规则</span>
<span><i></i>阅读 14 分钟</span>
<span><i></i>含 1 个情境判断器</span>
</div>
<p class="gx-lede">同桌问你「今天热不热」，你回一句「还行吧」——这句话没断定任何东西，所以它不是判断。你改口说「今天三十度」，这句话断定了，也能分真假，它才是判断。这一节讲的事，就藏在你每天说的话里：把一句一句的断定拆开，看它由什么构成、什么时候为真。最容易错的地方有两个：把带「或者」的句子全当成二选一，把「只有……才……」当成「如果……就……」。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写课本这句，不写你脑子里那句。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 判断的含义与两个特征<span class="q-src">人教版（2019）选择性必修3 逻辑与思维 · 第二单元第五课</span></p>
<p class="q-b">「判断就是对认识对象有所断定的思维形式。判断有两个基本特征：一是判断必须对认识对象有所断定，即有所肯定或有所否定；二是判断有真假之分。」</p>
<p class="q-n">→ 翻成人话：两个条件，缺一个就不是判断。①你得表态，肯定或者否定，说「还行吧」「不知道」「可能吧」都不算表态；②表完态要能分真假，符合实际为真，不符合实际为假。所以疑问句（今天热吗）、祈使句（把窗关上）、感叹句（真热啊）都不表达判断，它们没有断定。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 简单判断与复合判断<span class="q-src">人教版（2019）选择性必修3 逻辑与思维 · 第二单元第五课</span></p>
<p class="q-b">「简单判断是直接由概念构成而不包含其他判断的判断，包括性质判断和关系判断。复合判断是由两个或两个以上简单判断构成的判断，包括联言判断、选言判断和假言判断。」</p>
<p class="q-n">→ 翻成人话：分辨只看一个动作——这句话里还套着别的判断吗？「这杯水是温的」拆到底只有概念，是简单判断；「这杯水是温的，而且不烫」拆开能拿到两个判断，是复合判断。抓住这一条，选择题问「下列属于复合判断的是」，你不用背例句，现场拆就行。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 假言判断与它的真假<span class="q-src">人教版（2019）选择性必修3 逻辑与思维 · 第二单元第五课</span></p>
<p class="q-b">「假言判断是断定一事物情况是另一事物情况存在条件的判断，由前件、后件和联结项构成。假言判断的真假不取决于前件、后件本身的真假，而取决于前件和后件所断定的事物情况之间是否存在条件关系。」</p>
<p class="q-n">→ 翻成人话：先找「如果」「只有」「只要」这些联结项，它前面是前件，后面是后件。再只问一件事：前件成立，后件是不是一定成立？一定成立就是充分条件；前件不成立，后件就一定不成立，那是必要条件；两头都一定，是充要条件。前件后件各自是真是假，不影响这个判断本身成立不成立。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>简单判断</th><th>复合判断</th></tr></thead>
<tbody>
<tr><td>由什么构成</td><td>直接由概念构成</td><td>由两个或两个以上简单判断构成</td></tr>
<tr><td>里面还有判断吗</td><td>没有，拆到底只剩概念</td><td>有，拆开能拿到几个简单判断</td></tr>
<tr><td>常见形式</td><td>性质判断、关系判断</td><td>联言判断、选言判断、假言判断</td></tr>
<tr class="key"><td>真假看什么</td><td>看断定与对象的实际情况是否相符</td><td>看支判断的真假，加上联结项的性质</td></tr>
<tr><td>答题怎么认</td><td>问某对象有没有某种性质、某关系</td><td>问几种情况同时存在、有哪种可能、谁是谁的条件</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">背法一句话：先看「这句话能不能再拆出判断」，再看「它是靠事实为真，还是靠支判断为真」。多数判断类选择题，第一步就卡在这个拆分上；拆对了，后面全是套规则。还要分清一层：判断是思维形式，语句是语言形式，同一个判断可以换几种说法，别把「句子」直接当成「判断」。</p>
<p class="gx-note">还有一层要求别忘：判断既要真实，也要恰当。真实指断定符合实际；恰当指该用全称就别用特称，量项、联项都不能说过头。</p>
</section>

<section class="gx-sec" id="b">
<h2><span class="sn">02</span>拆开看</h2>
<p class="gx-h2s">四张图：判断是什么 → 简单判断怎么分 → 复合判断三家 → 真值怎么算。</p>

<p class="gx-take">判断＝有断定＋有真假；两个条件缺一个，那句话就进不了逻辑的门。</p>
<p class="gx-note">这里有个坑：把「判断」和「句子」画等号。句子是语言形式，判断是思维形式；同一句话可以是祈使句，也可以藏着判断。</p>

<figure class="gx-fig">
<div class="fig-cap">
<span class="fig-no">图 2</span><span class="fig-t">简单判断：性质判断与关系判断</span>

</div>
<p class="fig-s">简单判断拆到底只剩概念，它有两种：断定对象有没有某种性质，叫性质判断；断定对象与对象之间有没有某种关系，叫关系判断。分不清时，看「和」字后面跟的是什么。</p>
<div class="gx-svgbox">
<svg viewBox="0 0 820 280" role="img" aria-label="简单判断分两类：左边性质判断的结构与六种形式，右边关系判断的结构与关系的性质">
<rect x="16" y="16" width="788" height="248" rx="10" fill="#f8fbfd" stroke="#dbe7ef"/>
<text x="36" y="44" font-size="11.5" font-weight="700" fill="#151a21">简单判断：一种看性质，一种看关系</text>
<rect x="40" y="58" width="352" height="176" rx="8" fill="#ffffff" stroke="#b8e6d0"/>
<text x="54" y="82" font-size="10.5" font-weight="700" fill="#2c6b4f">性质判断</text>
<text x="54" y="104" font-size="9.2" fill="#3a3a35">结构：量项 + 主项 + 联项 + 谓项</text>
<text x="54" y="124" font-size="9.2" fill="#3a3a35">例：所有 金属 都是 导电的</text>
<text x="54" y="146" font-size="9.2" fill="#3a3a35">六种：全称 / 特称 / 单称</text>
<text x="54" y="164" font-size="9.2" fill="#3a3a35">每种再分肯定与否定</text>
<text x="54" y="188" font-size="9.2" fill="#3a3a35">真假：对象是否真有这种性质</text>
<text x="54" y="212" font-size="9" fill="#6b6b63">例：「所有」全称，「有些」特称</text>
<rect x="428" y="58" width="352" height="176" rx="8" fill="#ffffff" stroke="#f0c9a8"/>
<text x="442" y="82" font-size="10.5" font-weight="700" fill="#9a5a1e">关系判断</text>
<text x="442" y="104" font-size="9.2" fill="#3a3a35">结构：关系者项 + 关系项 + 量项</text>
<text x="442" y="124" font-size="9.2" fill="#3a3a35">例：小明 和 小红 是 同学</text>
<text x="442" y="146" font-size="9.2" fill="#3a3a35">关系的性质：对称性、传递性</text>
<text x="442" y="164" font-size="9.2" fill="#3a3a35">对称：甲对乙，乙对甲？</text>
<text x="442" y="188" font-size="9.2" fill="#3a3a35">真假：对象之间是否真有此关系</text>
<text x="442" y="212" font-size="9" fill="#6b6b63">例：「同学」是对称关系</text>
<text x="40" y="252" font-size="9.4" fill="#6b6b63">「小明和小红是同学」是一个关系判断，拆成两句就错了。</text>
</svg>
<span class="gx-zoomchip">点击放大</span>

<p class="gx-take">性质判断断定「一个对象有什么性质」，关系判断断定「几个对象之间有什么关系」；「和」后面是另一个对象，就是关系判断。</p>
<p class="gx-note">性质判断的两个抓手：量项定范围（全称、特称、单称），联项定方向（肯定、否定）。</p>
</figure>
<figure class="gx-fig">
<div class="fig-cap">
<span class="fig-no">图 3</span><span class="fig-t">复合判断三家：联言、选言、假言</span>

<p class="fig-s">复合判断由两个或两个以上简单判断构成。联言看「并且」，选言看「或者、要么」，假言看「如果、只有、只要」。先认联结项，再套真假规则。</p>

<text x="305" y="86" font-size="10.5" font-weight="700" fill="#9a5a1e">选言判断</text>

<p class="gx-note">注意：不相容选言判断「有且只有一个选言支真」才真，两个都真也是假——这一条最容易漏。</p>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 分析假言判断的逻辑形式<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">小刚说：「如果下雨，地就湿。」请你分析这句话的逻辑形式：它属于哪种判断，前件和后件分别是什么，在什么情况下这个判断为假。先在心里把它拆成两个小句子，再动笔。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性</p>
<p class="s-b">题目要的是「分析逻辑形式」，不是判断这句话在生活里对不对。先定知识范围：这句话由两个判断连起来，属于复合判断里的假言判断。写答案第一句就先点明类型。</p>
<p class="s-k">用到：复合判断、假言判断。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 找联结项</p>
<p class="s-b">句子里起连接作用的是「如果……就……」。它在告诉你：前面那件事，是后面那件事的条件。没有这个联结项，两个判断就只是并列，成不了假言判断。</p>
<p class="s-k">用到：联结项。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 定前件后件</p>
<p class="s-b">「如果」后面是前件：下雨。「就」后面是后件：地湿。写成「如果 p，那么 q」，p 是下雨，q 是地湿。这一步不能颠倒，一颠倒条件类型就变了。</p>
<p class="s-k">用到：前件、后件。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 判条件类型</p>
<p class="s-b">问两句：下雨了，地是不是一定湿？是。不下雨，地是不是一定不湿？不一定，洒水车也能把地弄湿。这就是「有前件必有后件，无前件未必无后件」，所以是充分条件假言判断。</p>
<p class="s-k">用到：充分条件假言判断。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 写真值收口</p>
<p class="s-b">充分条件假言判断只有一种情况为假：前件真、后件假，也就是下了雨地却没湿。其余三种组合都为真。最后回扣一句：真假看条件关系，不看前件后件本身。</p>
<p class="s-k">用到：假言判断的真假。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">① 这是充分条件假言判断。它由前件「下雨」、后件「地湿」和联结项「如果……就……」构成，逻辑形式可写作「如果 p，那么 q」。<br>② 前件「下雨」是后件「地湿」的充分条件：有前件必有后件，无前件未必无后件。<br>③ 该判断只在「下了雨而地没湿」时为假，即前件真、后件假；其余三种真假组合下判断都为真。<br>④ 可见假言判断的真假，不取决于前件和后件本身真假，而取决于两者之间是否存在条件关系。</p>
</div>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「判断和句子是一回事吗？」</p>
<p class="a">不是。判断是<b>思维形式</b>，语句是<b>语言形式</b>；同一个判断可以换几种说法，同一个句子在不同场合也可能表达不同判断。答概念题时，先写「判断是对认识对象有所断定的思维形式」，再补两个特征。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="同一判断可以用不同句子表达，句子是语言形式，判断是思维形式">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="20" y="34" font-size="9" font-weight="700" fill="#2f5580">一个判断，几种说法</text>
<text x="20" y="56" font-size="9" fill="#3a3a35">「今天很热」</text>
<text x="20" y="74" font-size="9" fill="#3a3a35">「今天气温很高」</text>
<text x="20" y="96" font-size="8.6" fill="#6b6b63">句子：语言形式</text>
<text x="20" y="114" font-size="8.6" fill="#6b6b63">判断：思维形式</text>
</svg>
</div>
<div class="qac">
<p class="q">「所有金属都是导电的」是哪种性质判断？</p>
<p class="a">全称肯定判断。量项「所有」表<b>全称</b>，联项「都是」表<b>肯定</b>，主项是「金属」，谓项是「导电的」。答这类题按「量项＋联项」两步走，不要凭语感。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="全称肯定判断的四个部分：量项所有、主项金属、联项都是、谓项导电的">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="20" y="32" font-size="8.8" fill="#3a3a35">所有 金属 都是 导电的</text>
<text x="20" y="58" font-size="8.8" fill="#3a3a35">量项：所有｜主项：金属</text>
<text x="20" y="78" font-size="8.8" fill="#3a3a35">联项：都是｜谓项：导电的</text>
<text x="20" y="104" font-size="8.6" fill="#2c6b4f">全称 ＋ 肯定 ＝ 全称肯定判断</text>
</svg>
</div>
<div class="qac">
<p class="q">「小明和小红是同学」能拆成两个判断吗？</p>
<p class="a">不能。这是<b>关系判断</b>，断定的是两个对象之间的<b>关系</b>，关系者项拆开单说，意思就变了。「小明是同学」和原句不是一回事。只有联言判断才可以拆成两个支判断。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="关系判断由两个关系者项和一个关系项构成，不能拆成两个判断">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<rect x="26" y="30" width="58" height="24" rx="5" fill="#ffffff" stroke="#f0c9a8"/>
<text x="55" y="46" font-size="9" fill="#9a5a1e" text-anchor="middle">小明</text>
<rect x="156" y="30" width="58" height="24" rx="5" fill="#ffffff" stroke="#f0c9a8"/>
<text x="185" y="46" font-size="9" fill="#9a5a1e" text-anchor="middle">小红</text>
<line x1="84" y1="42" x2="156" y2="42" stroke="#9a5a1e" stroke-width="1.2"/>
<text x="120" y="78" font-size="8.8" fill="#3a3a35" text-anchor="middle">关系项：同学</text>
<text x="20" y="104" font-size="8.6" fill="#6b6b63">一个判断，断的是两者的关系</text>
</svg>
</div>
<div class="qac">
<p class="q">带「或者」的句子都是二选一吗？</p>
<p class="a">不是。要看两个选言支<b>能不能同时成立</b>：能，是相容选言判断，至少一真就真；不能，才是不相容选言判断，有且只有一个真才真。「或者」两个字本身不决定类型。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="相容选言与不相容选言的区分：能不能同时成立">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="20" y="30" font-size="9" font-weight="700" fill="#2f5580">先问：能同时成立吗</text>
<text x="20" y="58" font-size="8.8" fill="#2c6b4f">能 → 相容：至少一真就真</text>
<text x="20" y="80" font-size="8.8" fill="#9a5a1e">不能 → 不相容：只一真才真</text>
<text x="20" y="106" font-size="8.6" fill="#6b6b63">关键词不是「或者」，是「能不能」</text>
</svg>
</div>
<div class="qac">
<p class="q">「只有……才……」能改写成「如果……就……」吗？</p>
<p class="a">不能。前者是<b>必要条件</b>假言判断，断的是「无前件必无后件」；后者是<b>充分条件</b>假言判断，断的是「有前件必有后件」。方向一反，意思就错了，答题时把两类分开写。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="充分条件是有前件必有后件，必要条件是无前件必无后件，两者不能互换">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="20" y="32" font-size="8.8" fill="#2f5580">如果 p 那么 q：有 p 必有 q</text>
<text x="20" y="58" font-size="8.8" fill="#9a5a1e">只有 p 才 q：无 p 必无 q</text>
<text x="20" y="86" font-size="8.8" font-weight="700" fill="#a33a3a">两者不能互换</text>
<text x="20" y="110" font-size="8.6" fill="#6b6b63">先判充分还是必要，再动笔</text>
</svg>
</div>
<div class="qac">
<p class="q">假言判断的真假，由前件后件本身的真假决定吗？</p>
<p class="a">不。它取决于前件与后件之间<b>有没有条件关系</b>。对充分条件假言判断来说，只有<b>前件真、后件假</b>时它才假；前件本身是假的，判断反而为真。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="充分条件假言判断只在真前件假后件时为假，其余三种情况都为真">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="20" y="30" font-size="9" font-weight="700" fill="#2f5580">充分条件假言的真值</text>
<text x="20" y="56" font-size="8.8" fill="#3a3a35">前件真、后件真 → 真</text>
<text x="20" y="78" font-size="8.8" fill="#a33a3a">前件真、后件假 → 假</text>
<text x="20" y="100" font-size="8.8" fill="#2c6b4f">前件假 → 判断为真</text>
<text x="20" y="118" font-size="8.4" fill="#6b6b63">不看支判断，看条件关系</text>
</svg>
</div>
</div>
<p class="gx-note">六问其实是同一件事：先看这句话有没有断定、能不能再拆，再看它的联结项管的是「同时」「可能」还是「条件」。判据一稳，选项换多少层皮都不慌。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 判断就是句子，句子就是判断，两者没区别。</p>
<p class="er-v">✓ 判断是对认识对象有所断定的思维形式，语句是它的语言表达形式；同一个判断可以用不同语句表达。</p>
<p class="er-w">错在哪：把思维形式和语言形式混成一个。判断的入口是有没有断定、能不能分真假，不是「有没有说完一句话」。</p>
</div>
<div class="er">
<p class="er-x">✗ 「还行吧」「大概是吧」这类回答说的也是同一件事，所以算判断。</p>
<p class="er-v">✓ 判断必须对认识对象有所断定，即有所肯定或有所否定；模棱两可、不置可否的话没有断定，不构成判断。</p>
<p class="er-w">错在哪：把「谈到了这件事」当成「对这件事表了态」。既不肯定也不否定，就谈不上真假，也就不是判断。</p>
</div>
<div class="er">
<p class="er-x">✗ 「小明和小红是同学」可以拆成「小明是同学」「小红是同学」两个判断。</p>
<p class="er-v">✓ 这是关系判断，由关系者项、关系项和量项构成，断定的是两个对象之间的关系，不能拆开单说。</p>
<p class="er-w">错在哪：拿拆联言判断的办法去拆关系判断。拆完以后，「小明是同学」和原句根本不是同一个意思。</p>
</div>
<div class="er">
<p class="er-x">✗ 联言判断只要有一个支判断真，整个判断就是真的。</p>
<p class="er-v">✓ 联言判断的各个联言支都真，整个联言判断才真；只要有一个联言支假，它就是假。</p>
<p class="er-w">错在哪：把联言的「都真才真」记成了相容选言的「一真就真」。这两条恰好在「一真一假」那一行分开。</p>
</div>
<div class="er">
<p class="er-x">✗ 「或者去图书馆，或者去打球」是不相容选言判断，因为只能去一个地方。</p>
<p class="er-v">✓ 相容选言判断的选言支可以同时为真，至少一真判断就真；只有断定两种情况不可兼得，才是不相容选言判断。</p>
<p class="er-w">错在哪：看见「或者」就套二选一，没有回到判据上问一句「这两件事能不能同时成立」。</p>
</div>
<div class="er">
<p class="er-x">✗ 「只有努力学习，才能取得好成绩」就等于「如果努力学习，就能取得好成绩」。</p>
<p class="er-v">✓ 前者是必要条件假言判断，断的是无前件必无后件；后者是充分条件假言判断，断的是有前件必有后件。两者不能互换。</p>
<p class="er-w">错在哪：把必要条件当成充分条件，条件方向反了。努力是考好的必要条件，不是充分条件。</p>
</div>
<div class="er">
<p class="er-x">✗ 假言判断是假的，因为它的前件和后件本身都是假的。</p>
<p class="er-v">✓ 假言判断的真假，取决于前件和后件所断定的事物情况之间是否存在条件关系；充分条件假言判断只在前件真、后件假时为假。</p>
<p class="er-w">错在哪：用支判断的真假顶替了条件关系。前件假、后件假时，这个假言判断照样可以是真的。</p>
</div>
</div>
