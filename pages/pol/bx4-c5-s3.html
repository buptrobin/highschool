<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写课本这句，不写你脑子里那句。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 人民群众是什么人<span class="q-src">人教版（2019）必修4 哲学与文化 · 第五课第三框</span></p>
<p class="q-b">人民群众是指一切对社会历史起推动作用的人们，既包括普通个人，也包括杰出人物。人民群众是一个历史范畴，在不同的国家、不同的历史时期有不同的内涵。</p>
<p class="q-n">→ 翻成人话：这句话里有三个条件。① 标准是「起推动作用」，不是「人多」；② 范围里既有普通个人也有杰出人物，所以「英雄不算人民」是错的；③ 它是历史范畴，范围会随时代变。三个条件少一个，判断就跑偏。记法：先问「起不起推动作用」，再问「哪个时代、哪个国家」。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 三个「创造者」<span class="q-src">人教版（2019）必修4 哲学与文化 · 第五课第三框</span></p>
<p class="q-b">人民群众是社会物质财富的创造者。人民群众是社会精神财富的创造者。人民群众是社会变革的决定力量。</p>
<p class="q-n">→ 翻成人话：三句话是一条线上的三个位置——先有物质生产养活社会，再有精神财富从实践里长出来，最后靠人民把旧制度推开。答题时这就是三个分点，一句一个分号，别揉成一段。材料只给了一段，就只写一段，三段全抄反而像套模板。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 群众观点与群众路线<span class="q-src">人教版（2019）必修4 哲学与文化 · 第五课第三框</span></p>
<p class="q-b">群众观点：相信人民群众自己解放自己，全心全意为人民服务，一切向人民群众负责，虚心向人民群众学习。群众路线：一切为了群众，一切依靠群众，从群众中来，到群众中去。</p>
<p class="q-n">→ 翻成人话：观点是「心里怎么想」，路线是「事情怎么做」。观点四句都落在「人民」，路线四句都落在「群众」。最容易混的是「从群众中来，到群众中去」——它讲工作方法，不是「群众说了算」。答题先写观点再写路线，顺序颠倒了，阅卷老师会以为你把立场和方法搞混了。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>群众史观（课本口径）</th><th>英雄史观（错误口径）</th></tr></thead>
<tbody>
<tr><td>历史是谁创造的</td><td>人民群众；社会历史首先是物质生产发展的历史</td><td>少数英雄豪杰；人民只是被带领的「群氓」</td></tr>
<tr><td>社会变革靠谁</td><td>人民群众是决定力量、是主力军</td><td>靠伟人的意志、谋略和号召</td></tr>
<tr><td>杰出人物怎么放</td><td>属于人民群众，作用很大，但不能代替人民</td><td>被捧到人民之外，当成历史的唯一动力</td></tr>
<tr class="key"><td>一句话判据</td><td>看「谁在生产、谁在变革」→ 人民</td><td>看「谁在台上讲话」→ 英雄</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只高亮最后一行，因为考场上真正要你选的是判据。背法：题干问「为什么说人民群众是历史的创造者」，就按「物质财富—精神财富—社会变革」三行答；题干提英雄人物，记住课本从没否定杰出人物，只否定「英雄创造历史」这个说法。背不下来就抓一句：历史是人民创造的，英雄是人民中的一员。</p>
</section>

<section class="gx-sec" id="b">
<h2><span class="sn">02</span>拆开看</h2>
<p class="gx-h2s">四张图：各讲一件事，按「是什么 → 怎么运转 → 怎么用」排。</p>

<p class="gx-take">「社会历史的主体是人民群众」是唯物史观的定性判断，不是一句口号，也不是按人数多少投票投出来的。</p>
<p class="gx-note">常见误解：把「主体」理解成「人最多那一群」。主体讲的是地位和作用，跟人数比例没关系。</p>

<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 原因类主观题 · 8 分<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">材料：从脱贫攻坚到乡村振兴，从高铁铺轨到社区治理，成千上万的普通劳动者在工地、田间、车间和实验室里干活。他们中有人写下打工诗歌，有人拍下乡村纪录片，也有人带头把老家的旧规矩改掉。三条线索分别指向生产、创作和变革。问：结合材料，运用「社会历史的主体」的知识，说明为什么说人民群众是历史的创造者。（8 分）</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性</p>
<p class="s-b">设问是「为什么」，知识范围锁定「社会历史的主体」，答题结构就是「三个创造者 + 一句方法论」。先在草稿上写下三段标题，别急着抄材料。「为什么」只能写原因，写做法再漂亮也不给分。</p>
<p class="s-k">用到：原因类 = 原理 + 材料对应 + 收口。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 找主体</p>
<p class="s-b">材料里干活的是工人、农民、志愿者、基层干部，都是人民群众。不要写成「党和政府创造了历史」——党和政府是领导者，历史的主体仍是人民。主体抓错，后面写得再顺也是零分起步。</p>
<p class="s-k">用到：人民群众 = 一切起推动作用的人。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 找行为</p>
<p class="s-b">把材料里的动作分三类：工地车间田间 → 生产；打工诗歌、乡村纪录片 → 创作；改掉旧规矩 → 变革。分好类，三个分点各有一句材料可挂。三个动作对应三段，这就是分点的由来。</p>
<p class="s-k">用到：行为归类，决定你写哪一段。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 对应原理</p>
<p class="s-b">一段一句原理，一句材料，不写空话。先写原理句，再写「材料中……正是……」——这是阅卷老师最认的格式。原理句不许改写，改过的课本话要扣分。</p>
<p class="s-k">用到：原理句必须是课本原话。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口</p>
<p class="s-b">最后补一句方法论：因此要坚持群众观点和群众路线，坚持以人民为中心。这一句是 8 分题里最容易拿的第 8 分。收口句不用长，一句就够，但必须有。</p>
<p class="s-k">用到：原理 + 方法论，答案才完整。</p>
</li>
</ol>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「人民群众不就是全体公民吗？」</p>
<p class="a">不是。人民群众指一切对社会历史起<b>推动作用</b>的人，标准是「作用」，不是「户口」。阻碍历史前进的势力不在其中，杰出人物则在其中。我国现阶段，全体社会主义劳动者、社会主义事业的建设者、拥护社会主义的爱国者、拥护祖国统一和致力于中华民族伟大复兴的爱国者，都属于人民群众。所以「人民」比「公民」窄，也比「公民」活。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="人民群众不等于全体公民示意">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="20" y="30" font-size="9.4" font-weight="700" fill="#151a21">人民群众 ≠ 全体公民</text>
<line x1="20" y1="38" x2="220" y2="38" stroke="#d6e2ea"/>
<text x="20" y="58" font-size="9" fill="#3a3a35">✓ 一切起推动作用的人</text>
<text x="20" y="78" font-size="9" fill="#3a3a35">✓ 普通个人 + 杰出人物</text>
<text x="20" y="98" font-size="9" fill="#3a3a35">✗ 阻碍历史前进的势力</text>
<text x="20" y="116" font-size="8.6" fill="#5a6470">标准是「作用」，不是「户口」</text>
</svg>
</div>
<div class="qac">
<p class="q">「英雄人物作用那么大，说『英雄创造历史』错在哪？」</p>
<p class="a">错在把英雄从人民里割出去，还把他当成历史的唯一动力。课本承认杰出人物作用很大，但杰出人物本身就是人民群众的一员，他的力量来自人民的实践。历史的主体是人民，<b>英雄不能代替人民创造历史</b>。考场上写「杰出人物对历史发展有重要影响」，比写「英雄无用」安全得多。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="英雄史观的错误示意">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="20" y="30" font-size="9.4" font-weight="700" fill="#151a21">英雄创造历史？这是英雄史观</text>
<line x1="20" y1="38" x2="220" y2="38" stroke="#d6e2ea"/>
<rect x="20" y="48" width="200" height="28" rx="6" fill="#ffffff" stroke="#e6d3c0"/>
<text x="30" y="66" font-size="9" fill="#3a3a35">英雄人物：作用确实很大</text>
<text x="20" y="94" font-size="9" fill="#3a3a35">但英雄是人民中的一员</text>
<text x="20" y="114" font-size="9" font-weight="700" fill="#1c6b4b">不能代替人民创造历史</text>
</svg>
</div>
<div class="qac">
<p class="q">「精神财富是作家、科学家创造的，跟普通人有关系吗？」</p>
<p class="a">有关系，而且是源与流的关系。人民群众的生活和实践是<b>一切精神财富形成和发展的源泉</b>，实践还提供物质条件；专业作者做的是加工和提炼。所以「源泉在人民」和「专家有贡献」两句都对，别用一句打掉另一句。答题顺序是：源泉在人民、实践提供条件、人民直接创造。这个顺序本身就是给分点。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="精神财富的源泉在人民示意图">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="20" y="30" font-size="9.4" font-weight="700" fill="#151a21">精神财富从哪来</text>
<line x1="20" y1="38" x2="220" y2="38" stroke="#d6e2ea"/>
<rect x="20" y="50" width="86" height="34" rx="6" fill="#ffffff" stroke="#b8e6d0"/>
<text x="63" y="64" font-size="8.6" text-anchor="middle" fill="#3a3a35">人民的</text>
<text x="63" y="77" font-size="8.6" text-anchor="middle" fill="#3a3a35">生活与实践</text>
<text x="118" y="72" font-size="11" text-anchor="middle" fill="#5a6470">→</text>
<rect x="138" y="50" width="82" height="34" rx="6" fill="#ffffff" stroke="#cfe2f3"/>
<text x="179" y="71" font-size="8.6" text-anchor="middle" fill="#3a3a35">精神财富</text>
<text x="20" y="108" font-size="8.8" fill="#5a6470">源泉在人民，不在书桌</text>
</svg>
</div>
<div class="qac">
<p class="q">「群众路线是不是群众说了算，领导不用做主？」</p>
<p class="a">不是。群众路线是「一切为了群众，一切依靠群众，从群众中来，到群众中去」。前两句讲立场，后两句讲方法：把分散的意见集中起来，形成决策，再回到群众中检验。<b>只讲「群众说啥就干啥」，那是尾巴主义。</b>反过来，只讲领导拍板、不听群众，那是命令主义。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="群众路线不等于群众说了算示意">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="20" y="30" font-size="9.4" font-weight="700" fill="#151a21">群众路线 ≠ 群众说了算</text>
<line x1="20" y1="38" x2="220" y2="38" stroke="#d6e2ea"/>
<text x="20" y="58" font-size="8.8" fill="#1c6b4b">✓ 从群众中来，到群众中去</text>
<text x="20" y="80" font-size="8.8" fill="#8a3a3a">✗ 尾巴主义：群众说啥都行</text>
<text x="20" y="102" font-size="8.8" fill="#1c6b4b">✓ 集中起来，再回到群众中</text>
<text x="20" y="118" font-size="8.6" fill="#5a6470">领导要集中，也要负责</text>
</svg>
</div>
<div class="qac">
<p class="q">「群众观点和群众路线怎么区分，答题老混。」</p>
<p class="a">看问的是「为什么人」还是「怎么做」。群众观点是立场：相信群众自己解放自己、全心全意为人民服务、一切向群众负责、虚心向群众学习。群众路线是方法：两个「一切」加「从群众中来，到群众中去」。<b>观点四句，路线四个「一切」，别互相串。</b>判断口诀：问「为了谁」写观点，问「怎么办」写路线。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="群众观点与群众路线的区分示意">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="20" y="30" font-size="9.4" font-weight="700" fill="#151a21">观点 / 路线 别写反</text>

<p class="q">「以人民为中心和群众史观是什么关系？」</p>
<p class="a">是同一件事的两种说法。群众史观回答「历史由谁创造」，以人民为中心回答「今天为谁发展、靠谁发展、成果归谁」。所以考题总把两者连起来：原理写群众史观，中间用群众观点和群众路线搭桥，收口写以人民为中心。落到答案里，它通常只占最后一行。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 人民群众就是全体公民，一个都不能少。</p>
<p class="er-v">✓ 人民群众是指一切对社会历史起推动作用的人们，是一个历史范畴。</p>
<p class="er-w">错在：把「人民」当成法律上的「公民」总数，漏掉「起推动作用」这个标准，也漏掉「范围会随时代变」。考试时先把「起推动作用」圈出来，再判断算不算人民。</p>
</div>
<div class="er">
<p class="er-x">✗ 历史是英雄人物创造的，人民群众只是跟着走。</p>
<p class="er-v">✓ 人民群众是社会历史的主体，杰出人物属于人民群众，但不能代替人民群众创造历史。</p>
<p class="er-w">错在：把英雄的作用夸大成唯一动力，滑向英雄史观。课本否定的是「英雄创造历史」，不是英雄本身。把英雄说成一无是处，同样是错。</p>
</div>
<div class="er">
<p class="er-x">✗ 人民群众是物质财富的创造者，所以人民只管干活。</p>
<p class="er-v">✓ 人民群众是社会物质财富的创造者，是社会精神财富的创造者，是社会变革的决定力量。</p>
<p class="er-w">错在：只记住第一段，丢掉后两段。原因类 8 分题按三段给分，少一段就少一块。三段各起一个小标题，比写成一整段更容易得分。</p>
</div>
<div class="er">
<p class="er-x">✗ 精神财富是知识分子创造的，跟普通劳动者无关。</p>
<p class="er-v">✓ 人民群众的生活和实践是一切精神财富形成和发展的源泉。</p>
<p class="er-w">错在：把「源泉」和「加工者」混成一个。专业作者有贡献，但源头在人民实践，两句话不冲突。</p>
</div>
<div class="er">
<p class="er-x">✗ 群众路线就是群众说了算，领导别做主。</p>
<p class="er-v">✓ 群众路线是一切为了群众，一切依靠群众，从群众中来，到群众中去。</p>
<p class="er-w">错在：把「从群众中来」丢了，只剩「到群众中去」，成了尾巴主义。集中意见、形成决策同样是群众路线的一环。</p>
</div>
<div class="er">
<p class="er-x">✗ 群众观点就是群众路线，两句话可以互换。</p>
<p class="er-v">✓ 群众观点讲立场：相信群众、服务群众、对群众负责、向群众学习；群众路线讲方法：两个「一切」、两个「来去」。</p>
<p class="er-w">错在：一个是「为什么人」，一个是「怎么做」。设问问「怎么做」，你写四句立场，就拿不到方法分。设问出现「怎样做」，落笔就要有「从群众中来，到群众中去」。</p>
</div>
<div class="er">
<p class="er-x">✗ 以人民为中心就是给群众多发福利。</p>
<p class="er-v">✓ 以人民为中心是发展为了人民、发展依靠人民、发展成果由人民共享。</p>
<p class="er-w">错在：只讲「为了」，不讲「依靠」，把群众当成被照顾的对象。人民是主体，不是等着被发的对象。</p>
</div>
</div>
