<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写课本这句，不写你脑子里那句。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 事物变化发展的两种状态<span class="q-src">人教版（2019）选择性必修3 逻辑与思维 · 第三单元第九课</span></p>
<p class="q-b">「量变是事物数量的增减和场所的变更，是一种渐进的、不显著的变化。质变是事物根本性质的变化，是事物由一种质态向另一种质态的转变，是一种根本的、显著的变化。」</p>
<p class="q-n">→ 翻成人话：判断一件事在量变还是在质变，只问一句——<b>它的根本性质变了没有</b>。没变，只是数量多了、位置挪了，那是量变；性质换了，从一种质态成了另一种质态，那才是质变。水从 20℃ 烧到 90℃，温度一直在涨，可它还是液态的水，这是量变；到 100℃ 开始沸腾，液态变气态，性质换了，这是质变。两个词都别当形容词使：不是「变化小」叫量变、「变化大」叫质变，判据只有性质，没有大小，也没有时间长短。再补一层容易漏的：<b>场所的变更也算量变</b>——换教室、换座位、把书从桌上搬到书架上，性质没动，只动了位置，那也是量变，不是「什么都没发生」。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 量变与质变的关系<span class="q-src">人教版（2019）选择性必修3 逻辑与思维 · 第三单元第九课</span></p>
<p class="q-b">「量变是质变的必要准备，质变是量变的必然结果。事物的发展总是从量变开始，量变积累到一定程度必然引起质变。质变又为新的量变开辟道路，使事物在新质的基础上开始新的量变。」</p>
<p class="q-n">→ 翻成人话：这句话里有三层，答题缺一层就丢分。①<b>必要准备</b>：没有前面的量变，质变不会发生，也跳不过去；②<b>必然结果</b>：量变攒到一定程度，质变不是「可能来」，是「一定来」；③<b>新的起点</b>：质变不是收摊，它给下一轮量变腾出地方，于是「量变—质变—新量变—新质变」一直往前走。三层连起来读，就是四个字：渐变、飞跃、新的渐变。题目里说「循序渐进」「厚积薄发」「水滴石穿」，用的都是这一层意思。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 度与适度原则<span class="q-src">人教版（2019）选择性必修3 逻辑与思维 · 第三单元第九课</span></p>
<p class="q-b">「度是保持事物质的稳定性的数量界限。掌握适度原则，就要注意分寸，把握火候，防止和克服不顾分寸、盲目乱干的思想和行为。」</p>
<p class="q-n">→ 翻成人话：度是一道界线。界线以内，事物的质保持稳定；越过去，质就变了。<b>适度不是不做事，是做事停在界线以内</b>：同学做错事，你点出问题叫帮助，把人从头数到脚叫伤人，中间那条线就是度。两个方向都会错——过头是「过」，不敢做是「不及」。课本要求防的是不顾分寸的蛮干，也防该出手时缩着。还要记住一句：适度不是不要变化，度以内照样在积累，积累够了就要抓住时机促成质变。生活里的例子随手就有：菜里放盐，少一点寡淡，多一点发苦，盐多盐少改的只是数量，可超过某个点，整盘菜的性质就毁了。</p>
</div>

<div style="overflow-x:auto">

</tbody>

<p class="gx-note">背法一句话：<b>性质没变是量变，性质变了是质变；量变备料，质变交货，交完货再备下一批料</b>。答题时三个扣分点要写全：量变不会立刻引起质变，但达到一定程度必然引起；质变不是把过去全盘否定，而是根本性质的变化；适度原则不是不要变化，是先在度以内积累、再在关节点上飞跃。</p>

<p class="ex-t">例题 · 用质量互变规律评析两种说法<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">有人说：「学习要循序渐进，不能急于求成。」也有人说：「循序渐进就是慢慢来，反正急也没用，等它自己变好就行。」请你运用质量互变规律，评析以上两种说法。（8 分）先在心里圈出两个「说法」各自的关键词，再动笔。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性</p>
<p class="s-b">题目要「评析两种说法」，不是让你表态赞成谁。先定知识范围：第九课质量互变规律，加上适度原则。再定答题骨架：摆原理 → 评第一种 → 评第二种 → 收口。四段，缺一段就少一个采分点。</p>
<p class="s-k">用到：质量互变规律、适度原则。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 摆原理</p>
<p class="s-b">先写课本那两句，一句都不能省：量变是质变的必要准备，质变是量变的必然结果。再补第三句，质变为新的量变开辟道路。三句摆完，评析才有尺子，不然全篇都是你自己的感想。写原理时把「一定程度」四个字带上，考场上最容易被扣的就是漏掉它。</p>
<p class="s-k">用到：量变、质变、质量互变规律。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 评第一种说法</p>
<p class="s-b">「循序渐进」说的是按顺序、一步一步来，这正好对应「量变是质变的必要准备」。学习没有捷径，知识点要一点一点过，题要一道一道做，跳过积累就没有后面的飞跃。所以这种说法有道理，答「正确」并说明理由。</p>
<p class="s-k">用到：量变是质变的必要准备。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 评第二种说法</p>
<p class="s-b">「慢慢来、等它自己变好」把循序渐进理解成了消极等待。量变攒到一定程度，质变必然发生，可前提是你在攒；不攒，等到什么时候都不会变。而且度以内积累够了，就要抓住时机促成质变，该冲刺时冲刺。所以这种说法片面，答「错误」并指出它丢掉了「抓住时机促成质变」。</p>
<p class="s-k">用到：质变是量变的必然结果、抓住时机促成质变。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口</p>
<p class="s-b">最后回扣材料，写一句总话：既要重视量的积累，又要在量变达到一定程度时促成质变，还要把握适度原则，防止「过」与「不及」。三句话并成一段，术语到位，分点标号，这题就写满了。</p>
<p class="s-k">用到：重视量的积累、促成质变、适度原则。</p>

<text x="20" y="96" font-size="8.8" fill="#3a3a35">② 越过关节点了吗？</text>
<text x="20" y="116" font-size="8.4" fill="#6b6b63">过了才叫飞跃，没过只是接近</text>
</svg>
</div>
<div class="qac">
<p class="q">「量变和质变，哪个更重要？」</p>
<p class="a">不能比高低。二者是事物发展的<b>两种状态</b>，相互依存：没有量变就没有质变的基础，没有质变就没有新的量变。硬要分家，一头叫「激变论」，一头叫「庸俗进化论」，两种都是错。看清这一层，选项里那些「质变比量变重要」的说法就不用犹豫。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="割裂量变与质变的两种错误：只认质变是激变论，只认量变是庸俗进化论，中间是二者统一">

<text x="63" y="62" font-size="8.4" fill="#6b6b63" text-anchor="middle">激变论</text>
<rect x="132" y="26" width="90" height="46" rx="6" fill="#ffffff" stroke="#e6b3aa"/>
<text x="177" y="45" font-size="8.6" fill="#a33a3a" text-anchor="middle">只认量变</text>
<text x="177" y="62" font-size="8.4" fill="#6b6b63" text-anchor="middle">庸俗进化论</text>
<text x="20" y="94" font-size="8.8" font-weight="700" fill="#2f5580">统一起来：积累 ＋ 飞跃</text>
<text x="20" y="116" font-size="8.4" fill="#6b6b63">两种状态，一条规律，不分高低</text>

<div class="qac">
<p class="q">「题目让我『用质量互变规律分析』，第一句写什么？」</p>
<p class="a">先摆原理，再分点。第一句写<b>量变是质变的必要准备，质变是量变的必然结果</b>；第二句写<b>质变为新的量变开辟道路</b>；然后按「材料里的积累—关节点上的飞跃—新起点上的继续」三段分析。原理不摆，后面全是空话。最后一段别忘了回扣材料，原理加材料才给满分。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="用质量互变规律分析的答题模板：先摆三句原理，再按积累、飞跃、新起点三段分析">

<text x="20" y="72" font-size="8.6" fill="#3a3a35">② 必然结果：攒够就飞跃</text>
<text x="20" y="92" font-size="8.6" fill="#3a3a35">③ 开辟道路：飞跃后继续攒</text>

<p class="gx-note">六问其实是同一件事：先问<b>性质变没变</b>（定性），再问<b>攒够没有</b>（程度），最后问<b>分寸在不在</b>（度）。三问一过，材料题和选择题都按这条线走，选项再怎么换说法也绕不出去。说到底就一句口诀：看性质、看程度、看分寸。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 量变一发生，质变马上就来，今天努力明天就该见效。</p>
<p class="er-v">✓ 量变是质变的必要准备，质变是量变的必然结果；量变积累到一定程度、突破度的关节点，才引起质变。</p>
<p class="er-w">错在哪：把「必要准备」当成「立即兑现」。攒和变之间隔着「一定程度」四个字，写成立刻，就把必然结果说成了即时结果。</p>
</div>
<div class="er">
<p class="er-x">✗ 质变就是把过去全部推翻，一切从零开始。</p>
<p class="er-v">✓ 质变是事物根本性质的变化，是旧质向新质的转变；新质会保留并改造旧质中的合理因素。</p>
<p class="er-w">错在哪：把质变等同于全盘否定。全盘否定既不符合事实，也解释不了新事物为什么比旧事物更有生命力。记一句：新质是从旧质里长出来的，不是从外面搬来的。</p>
</div>
<div class="er">
<p class="er-x">✗ 把握适度原则，就是别乱动，保持现状最稳。</p>
<p class="er-v">✓ 适度原则要求注意分寸、把握火候，在度以内积极积累；量变达到一定程度，要不失时机地促成质变。</p>
<p class="er-w">错在哪：把「适度」读成「不动」。适度管的是分寸，不是禁止变化；把适度当停滞，等于取消了发展。</p>
</div>
<div class="er">
<p class="er-x">✗ 只要天天做，量变一定带来想要的质变，等着就行。</p>
<p class="er-v">✓ 量变必须达到一定程度、突破关节点，才引起质变；积累不足或方向错了，不会带来预期的质变。</p>
<p class="er-w">错在哪：把「必然结果」当成「无条件结果」。必然，是说条件够了必来，不是说什么都不做也来。</p>
</div>
<div class="er">
<p class="er-x">✗ 质变比量变更关键，抓住飞跃就够了，积累是次要的。</p>
<p class="er-v">✓ 量变和质变是事物发展的两种状态，二者相互依存；量变是质变的必要准备，质变是量变的必然结果。</p>
<p class="er-w">错在哪：给两个环节排高低。一割裂，这头是激变论，那头是庸俗进化论，两种都被课本判为错误。答题时把两者并列写，谁也不压低谁。</p>
</div>
<div class="er">
<p class="er-x">✗ 拔苗助长说明要抓住时机促成质变，只是方法糙了点。</p>
<p class="er-v">✓ 拔苗助长违背了量变是质变的必要准备，急于求成、跳过必要积累，结果连事物原有的质也毁掉了。</p>
<p class="er-w">错在哪：把「违背规律」降格成「方法不当」。方向错了，越用力离目标越远；促成质变的前提，是积累已经到位。</p>
</div>
<div class="er">
<p class="er-x">✗ 水滴石穿只体现量变，石头到后来也没变成别的东西。</p>
<p class="er-v">✓ 水滴石穿是量变引起质变的典型：水滴持续作用，积累到一定程度，石阶被穿透，形态和性质都发生了改变。</p>
<p class="er-w">错在哪：把「量变」当成唯一结论，看不见「穿」就是关节点上的飞跃。答材料题漏掉质变这一半，分就丢在这儿。石阶被穿透以后，就不再是原来那块石阶了。</p>
</div>
