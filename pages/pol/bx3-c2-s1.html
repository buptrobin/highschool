<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">这一框的答案全压在四句话上：性质、宗旨、初心使命、执政理念。先照抄，再拆关键词，最后分清哪句回答哪个问题。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 党的性质<span class="q-src">人教版（2019）必修3 政治与法治 · 第二课第一框</span></p>
<p class="q-b">中国共产党是中国工人阶级的先锋队，同时是中国人民和中华民族的先锋队。</p>
<p class="q-n">→ 翻成人话：一句话里两个「先锋队」，各管一段。前一个讲党的阶级基础——党诞生在工人运动之中，以工人阶级为阶级基础；后一个讲党的代表性——党同时代表中国人民和中华民族的利益。答题时「同时是」三个字不能丢：只写前一个，材料里「为全体人民谋利益」的事实就接不上；只写后一个，又说不清党为什么能代表得这么广。记法很实在：给两个「先锋队」各配一个对象，工人阶级一个，中国人民和中华民族一个。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 根本宗旨与初心使命<span class="q-src">人教版（2019）必修3 政治与法治 · 第二课第一框</span></p>
<p class="q-b">党的根本宗旨是全心全意为人民服务。中国共产党人的初心和使命，就是为中国人民谋幸福，为中华民族谋复兴。</p>
<p class="q-n">→ 翻成人话：两句各回答一个问题。宗旨回答「为谁干」——党除了人民利益，没有自己的特殊利益；初心使命回答「为什么出发」——谋的是人民的幸福、民族的复兴，两个「谋」各对一个对象，别写成「为中国人民谋复兴」。这里有个坑：「全心全意」是程度词，也是采分词。写成「为人民服务」，意思不算错，但课本表述少了四个字，按要点给分时容易丢；答题时宁可多写这四个字。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 执政理念<span class="q-src">人教版（2019）必修3 政治与法治 · 第二课第一框</span></p>
<p class="q-b">立党为公、执政为民是中国共产党的执政理念。党始终把人民放在心中最高位置，把人民对美好生活的向往作为奋斗目标。</p>
<p class="q-n">→ 翻成人话：这句话拆成两半，一半讲「为什么建党」，一半讲「掌权以后怎么用权」。立党为公，说的是建党不为小团体的私利；执政为民，说的是手里的权力只能拿来为人民办事。后半句给的是两个动作，考试常直接引用：「放在心中最高位置」「把人民对美好生活的向往作为奋斗目标」。凡是题目问「党为什么这样做」，这两个动作都能落地，比空写「党很伟大」有用得多。</p>
</div>

<p class="gx-note">整张表只高亮一行：执政理念。它和宗旨最容易被写成一句话——宗旨说的是「为谁服务」，执政理念说的是「权力为谁用」，一个讲立场，一个讲用权。背的时候按「性质—宗旨—初心—理念」串一遍，每句前面挂一个问题：是什么、为谁干、为什么出发、怎么用权。四个问题不重样，四句话就不会串。另外，表格第三列是答「为什么」时的顺序，第四列是选择题里专门用来混淆的错法，两列一起记，比单背一句话管用。</p>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。五步走完，答案的骨架自然出来。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 原因类材料题<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">材料：2020 年底，全国 832 个贫困县全部摘帽，近一亿农村贫困人口脱贫，脱贫群众不愁吃、不愁穿，义务教育、基本医疗、住房安全有了保障。同一年，国家组织药品集中采购，一批「天价药」降到普通家庭用得起的价格；不少老小区加装了电梯、换掉了锈蚀的管网。有人说，这些事看着零散，其实都指向同一句话。结合材料，运用「始终坚持以人民为中心」的知识，说明为什么说「江山就是人民，人民就是江山」。（12 分）</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性</p>
<p class="s-b">题型是「为什么」，知识范围是「始终坚持以人民为中心」，分值 12 分，通常要答四点以上。草稿上先写四个词：性质、宗旨、初心使命、执政理念，再补一条「人民的历史地位」作总起。格子画好，答案就不会写成流水账。</p>
<p class="s-k">用到：原因类设问的四格框架</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 找主体</p>
<p class="s-b">材料里做事的是党领导的国家：定脱贫目标、组织药品集采、推动老旧小区改造。受益的是三类人：脱贫群众、长期吃药的患者、住老楼的老人。主体是党，不是某个企业，也不是某个慈善机构。</p>
<p class="s-k">用到：中国共产党、人民</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 找行为</p>
<p class="s-b">三个动作：定目标（小康路上一个也不能少）、降价格（把天价药谈下来）、改环境（装电梯、换管网）。三个动作的共同点，是都往群众最急的地方去，不是往显眼的地方去。</p>
<p class="s-k">用到：把人民对美好生活的向往作为奋斗目标</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 对应原理</p>
<p class="s-b">一句材料对一句原理：摘帽对应「全心全意为人民服务」，集采对应「立党为公、执政为民」，改造对应「保障和改善民生」；再往上收，这些做法都来自党的性质（两个先锋队）和初心使命（谋幸福、谋复兴）。</p>
<p class="s-k">用到：性质、宗旨、初心使命、执政理念</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口</p>
<p class="s-b">回扣「江山」与「人民」：打江山、守江山，守的是人民的心。结尾按四点分条写，每条一句原理加一句材料，最后落到「人民是历史的创造者」。别停在「所以党很好」。</p>
<p class="s-k">用到：人民是历史的创造者，是决定党和国家前途命运的根本力量</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>

<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">① 从党的性质看：中国共产党是中国工人阶级的先锋队，同时是中国人民和中华民族的先锋队，代表最广大人民的根本利益，不谋求自己的特殊利益，所以江山就是人民。<br>② 从党的宗旨看：党的根本宗旨是全心全意为人民服务。近一亿农村贫困人口脱贫、义务教育与基本医疗有保障，就是把宗旨落在具体的人身上。<br>③ 从初心使命看：党的初心和使命是为中国人民谋幸福、为中华民族谋复兴。药品集采把天价药谈下来，减的是患者的负担，谋的正是人民的幸福。<br>④ 从执政理念看：立党为公、执政为民，权力只能用来为人民办事。老旧小区加装电梯、改造管网，用的是公共财力，办的是群众身边的难事。<br>⑤ 从人民的历史地位看：人民是历史的创造者，是决定党和国家前途命运的根本力量。党把人民放在心中最高位置，人民才把党放在心里。<br>结论：江山就是人民，人民就是江山——打江山、守江山，守的是人民的心。</p>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。每问先自己答一句，再看下面那句。</p>
<div class="gx-qa">

<div class="qac">
<p class="q">「党的性质为什么要写两个先锋队，写一个不行吗？」</p>
<p class="a">两个「先锋队」各管一段：前一个讲阶级基础，党以工人阶级为阶级基础；后一个讲代表性，党同时代表中国人民和中华民族的利益。只写一个，党要么被写成「只属于一部分人」，要么说不清为什么能代表全体人民。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="两个先锋队分别讲阶级基础和代表性">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="28" font-size="9" text-anchor="middle" fill="#151a21">两个先锋队，一段各管一半</text>
<rect x="16" y="40" width="100" height="56" rx="7" fill="#ffffff" stroke="#f3c9cf"/>
<text x="28" y="60" font-size="8.8" font-weight="700" fill="#9f1239">工人阶级</text>
<text x="28" y="76" font-size="8.4" fill="#3a3a35">讲阶级基础</text>
<rect x="124" y="40" width="100" height="56" rx="7" fill="#ffffff" stroke="#b8e6d0"/>
<text x="136" y="60" font-size="8.8" font-weight="700" fill="#1e6640">中国人民和</text>
<text x="136" y="76" font-size="8.4" fill="#3a3a35">中华民族</text>
<text x="120" y="114" font-size="8.6" text-anchor="middle" fill="#6b7280">缺一个，代表性就缺一半</text>
</svg>
</div>

<div class="qac">
<p class="q">「宗旨少写『全心全意』，真的会扣分吗？」</p>
<p class="a">会。课本表述是「全心全意为人民服务」，「全心全意」是程度词，也是采分词——它说明不是「顺手帮一把」，而是把全部心思放进去。写成「为人民服务」意思不算错，但按要点给分时，容易丢这半分。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="全心全意为人民服务，四个字是采分词">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="30" font-size="9" text-anchor="middle" fill="#151a21">课本表述，一个字都别省</text>
<rect x="18" y="42" width="204" height="34" rx="7" fill="#ffffff" stroke="#f3c9cf"/>
<text x="120" y="63" font-size="9.2" text-anchor="middle" fill="#9f1239">全心全意为人民服务</text>
<text x="120" y="96" font-size="8.6" text-anchor="middle" fill="#3a3a35">「全心全意」= 全部心思，不是顺手</text>
<text x="120" y="114" font-size="8.4" text-anchor="middle" fill="#6b7280">少四个字，采分词就没了</text>
</svg>
</div>

<div class="qac">
<p class="q">「初心使命和执政理念，是不是一回事？」</p>
<p class="a">不是。初心使命答「为什么出发」——为中国人民谋幸福、为中华民族谋复兴；执政理念答「掌权以后怎么用权」——立党为公、执政为民。一个是出发点和目标，一个是权力的用法，位置不同，采分角度也不同。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="初心使命管出发，执政理念管用权">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="28" font-size="9" text-anchor="middle" fill="#151a21">一个管出发，一个管用权</text>
<rect x="16" y="40" width="100" height="58" rx="7" fill="#ffffff" stroke="#dbe7ef"/>
<text x="28" y="58" font-size="8.6" font-weight="700" fill="#151a21">初心使命</text>
<text x="28" y="74" font-size="8.2" fill="#3a3a35">为什么出发</text>
<text x="28" y="88" font-size="8.2" fill="#3a3a35">谋幸福、谋复兴</text>
<rect x="124" y="40" width="100" height="58" rx="7" fill="#ffffff" stroke="#b8e6d0"/>
<text x="136" y="58" font-size="8.6" font-weight="700" fill="#1e6640">执政理念</text>
<text x="136" y="74" font-size="8.2" fill="#3a3a35">怎么用权</text>
<text x="136" y="88" font-size="8.2" fill="#3a3a35">立党为公、执政为民</text>
<text x="120" y="114" font-size="8.4" text-anchor="middle" fill="#6b7280">答错格子，写满也白写</text>
</svg>
</div>

<div class="qac">
<p class="q">「立党为公、执政为民，是说党没有任何自己的利益吗？」</p>
<p class="a">是说党没有自己的<b>特殊利益</b>，不是说党没有原则、人民提什么就答应什么。党代表最广大人民的根本利益，个别诉求要放到全体人民的长远利益里衡量。这也正是它和「选民至上」的分界线。</p>

<div class="qac">
<p class="q">「以人民为中心，是不是人民要什么就给什么？」</p>
<p class="a">不是。以人民为中心，是把人民对美好生活的向往作为奋斗目标，同时还要引导人民、依靠人民。眼前要求和长远利益冲突时服从长远，部分人的要求和全体人的利益冲突时服从全体——这才是「以人民为中心」，不是顺着情绪走。</p>

<div class="qac">
<p class="q">「党员的先锋模范作用，是不是只有英雄才做得到？」</p>
<p class="a">不是。三个「出来」里，第一个就是「平常时候看得出来」，说的是岗位上的日常：多干一点、多问一句、不把难处推给别人。英雄时刻是后两个「出来」，日常才是大多数党员的主场，也是材料题最常考的那一层。</p>

<p class="gx-note">六问其实是同一件事：都在问「你手里的词，对应的是哪一层」。性质答是什么，宗旨答为谁干，初心答为什么出发，理念答怎么用权，人民地位答力量的来源，先锋模范答党员怎么做。六层对上了，选择题能排掉干扰项，材料题能写出采分点；对不上，背得再熟也会答错格子。</p>
