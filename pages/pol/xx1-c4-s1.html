<p class="gx-claim">国际组织是政府间或非政府间、全球或区域的合作机构：<b>能协调，不能指挥</b>；成员让渡的是<b>部分主权权利</b>，不是主权本身。</p>

<p class="gx-lede">几个班要合办一台晚会，于是凑在一起签了张纸：谁出节目、谁管音响、几点散场。这几个班就是成员国，这张纸就是协议，管事的那个小组就是国际组织。这一节讲的就是这类组织：怎么分类、能干什么、为什么常常干不成。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写课本这句，不写你脑子里那句。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 国际组织的含义<span class="q-src">人教版（2019）选择性必修1 · 第四单元 国际组织</span></p>
<p class="q-b">国际组织是指两个以上国家的政府、民间团体或个人基于某种目的，经协商联合建立的经常性组织。国际组织是国际关系发展到一定阶段的产物。</p>
<p class="q-n">→ 翻成人话：这句话有<b>三个条件</b>。①成员是「两个以上国家」的政府、团体或个人，一个国家内部的机构不算；②有「某种目的」，也就是有明确的合作议题；③「经协商联合建立」并且是「经常性」的，不是开一次会就散。少掉第③条，临时会议也能冒充国际组织；少掉第①条，国内协会也能冒充。举个正例：世界卫生组织有一百多个成员国，有一部《组织法》，还有常设的秘书处，三条全占。举个反例：一次性的国际会议、某个国家内部的行业协会，都不算。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 国际组织的分类<span class="q-src">人教版（2019）选择性必修1 · 第四单元 国际组织</span></p>
<p class="q-b">国际组织按成员性质，分为政府间国际组织和非政府间国际组织；按地理范围，分为全球性国际组织和区域性国际组织；按职能范围，分为一般性国际组织和专门性国际组织。</p>
<p class="q-n">→ 翻成人话：这是<b>三把尺子</b>，不是三种组织。同一个组织可以同时贴三个标签。联合国＝政府间＋全球性＋一般性；世界卫生组织＝政府间＋全球性＋专门性；东盟＝政府间＋区域性＋一般性。答题时三把尺子各量一次，比只写「国际组织」四个字稳。还有一层：按职能分，一般性和专门性不是「大」和「小」。联合国也管卫生、粮食的事，但它管的范围宽，所以是一般性；世卫只管卫生，名气再大也是专门性。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 国际组织的作用与限度<span class="q-src">人教版（2019）选择性必修1 · 第四单元 国际组织</span></p>
<p class="q-b">国际组织在促进国际交流与合作、协调国际关系、维护世界和平与安全、推动全球治理等方面发挥着重要作用。但是，国际组织的作用是有限的，它不能凌驾于主权国家之上。</p>
<p class="q-n">→ 翻成人话：注意<b>「但是」</b>后面那半句，它才是采分点。前半句夸它，后半句给它划界线。为什么有限？因为它的权力是成员国<b>授予</b>的，决议还要靠成员国自己去执行。所以「国际组织能解决一切全球问题」这句话，写上去就丢分。再往下问一层：成员国为什么愿意把部分权利交出来？因为它们自己办不成——防疫、航运、邮政、气候，一个国家关起门来都做不好，只好凑钱凑人一起办。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>分类标准</th><th>看什么来分</th><th>典型例子</th></tr></thead>
<tbody>
<tr><td>按成员性质</td><td>协议是谁签的、成员是谁</td><td>政府间：联合国、世界卫生组织；非政府间：国际红十字委员会</td></tr>
<tr><td>按地理范围</td><td>成员分布在地球上哪一片</td><td>全球性：联合国；区域性：东盟、非盟、欧盟</td></tr>
<tr><td>按职能范围</td><td>管的事情宽不宽</td><td>一般性：联合国；专门性：世界卫生组织、世界贸易组织</td></tr>
<tr class="key"><td>三个标签会叠在同一个组织身上</td><td>三把尺子各量一次，不能只量一次</td><td>东盟＝政府间＋区域性＋一般性，不是「小号的联合国」</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">这张表只记<b>最后一行</b>。选择题最常见的坑，是拿一个标签当全部：说东盟是「区域性组织」没错，但题目问「按成员性质分」，你就得答政府间。另一处高频错，是把「国际红十字委员会」当成政府间组织——它不是由政府间协议设立的，成员是各国红十字会和个人，属于<b>非政府间</b>。答题时先看清题目问的是哪把尺子，再落笔，别急着堆名字。名字堆得再多，尺子用错了也是零分。另外，看到「决定」「命令」这类动词，先别照抄，课本讲国际组织用的词是「促进、协调、推动」。</p>
</section>

<p class="gx-take">国际组织的作用是「促进、协调、推动」，不是「命令、裁决、执行」。</p>
<p class="gx-note">材料里出现「协调」「呼吁」「提供援助」「搭建平台」，就往这四个作用上靠；出现「强制」「命令」「必须执行」，先怀疑，那是主权国家才有的东西。四个作用在答案里可以合并成两句，但动词不要换：促进、协调、推动，三个词都带「双方一起」的意思；换成「要求」「决定」，主语就悄悄变成主权国家了。</p>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 认识类主观题<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">某地区冲突持续。联合国安理会多次磋商，通过决议呼吁停火、开放人道通道；世界卫生组织协调各国向冲突地区提供医疗物资，并共享伤员救治信息；国际红十字委员会在交火区转运伤员、探视战俘。但是，停火决议多次被当事方拒绝执行，人道通道时断时续。结合材料，运用国际组织的知识，说明应如何认识国际组织的作用。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性</p>
<p class="s-b">设问是「如何认识……作用」，属于认识类。框架固定四步：<b>是什么</b>（性质与地位）→ <b>积极作用</b> → <b>局限性</b> → <b>与主权国家的关系和态度</b>。先在草稿上写下这四个词，再动笔；四个词漏一个，答案就少一层。</p>
<p class="s-k">用到：国际组织的含义、作用、局限性。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 找主体</p>
<p class="s-b">材料里有四类主体：联合国安理会、世界卫生组织、国际红十字委员会，以及拒绝执行决议的当事方。前三类是国际组织，最后一类是主权国家。</p>
<p class="s-k">用到：国际组织是国际关系的重要参加者。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 找行为</p>
<p class="s-b">行为分两组：一组是磋商、通过决议、协调物资、转运伤员；另一组是拒绝执行。前一组对应积极作用，后一组正好暴露局限性。材料里出现「但是」「然而」，后面往往就是转折的采分点。</p>
<p class="s-k">用到：促进合作、协调关系、推动全球治理。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 对应原理</p>
<p class="s-b">协调物资、共享信息 → 促进国际交流与合作；磋商并作出决议 → 提供交往场所、协调国际关系；人道援助 → 推动全球治理。决议被拒 → <b>没有超国家强制力</b>。这一步只贴标签，不下结论，结论留到下一步。</p>
<p class="s-k">用到：作用的有限性、不能凌驾于主权国家之上。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口</p>
<p class="s-b">按「积极作用—局限性—与主权国家的关系—态度」分点写，每点先原理后材料。最后落在支持多边主义、推动国际组织改革、坚持主权平等。</p>
<p class="s-k">用到：部分主权权利、主权平等、多边主义。</p>
</li>
</ol>

<button id="gxNext" type="button">下一步</button>

</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">① 国际组织是两个以上国家的政府、民间团体或个人基于某种目的、经协商联合建立的经常性组织，是国际关系的重要参加者。材料中的联合国、世界卫生组织、国际红十字委员会，都在协调各方行动。<br>② 积极作用：提供交往的场所和渠道，促进国际交流与合作——世卫组织协调医疗物资、共享救治信息；协调国际关系、推动争端解决——安理会磋商并通过决议；推动全球治理，应对一国无法独自解决的全球性问题——红十字委员会开展人道援助。<br>③ 局限性：国际组织的作用是有限的，不能凌驾于主权国家之上。它没有超国家的强制力，决议要靠成员国执行。材料中停火决议遭拒、人道通道时断时续，说明其作用取决于成员国的意愿与配合。<br>④ 与主权国家的关系：主权国家是国际社会最基本的成员，国际组织的权力由成员国授予，成员国让渡的只是部分主权权利，不是主权本身。把国际组织当成「世界政府」是错误的。<br>⑤ 态度：应重视并支持国际组织发挥作用，坚持多边主义，推动其朝着更加公正合理的方向改革；同时坚持主权平等，反对借国际组织干涉他国内政。</p>
</div>
</div>
<p class="gx-note">写法提醒：五点的顺序就是采分顺序。最容易丢分的是第③点——只写「作用有限」四个字不够，要接一句「因为决议要靠成员国执行，没有超国家强制力」。第④点里「部分主权权利」不能写成「部分主权」，两个词差一个字，意思差很远。最后提醒一句：答案里每个分点都要有材料，只写原理不贴材料，采分点只给一半。分点写的时候，①②③④ 各起一行，别挤成一大段。</p>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>

<p class="q">国际组织是不是「世界政府」，各国都得听它的？</p>
<p class="a">不是。它的权力是成员国<b>授予</b>的，只能协调、建议、呼吁；没有超国家的强制力，也没有领土和公民。写成「世界政府」，等于承认有个权威凌驾于主权之上，与主权平等直接冲突。判断时看一条：它的决议能不能在本国直接生效。如果还要靠各国自己立法去落实，那就仍然是主权国家在作主。</p>

<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="20" y="28" font-size="9.2" font-weight="700" fill="#151a21">按成员分布，不按影响力</text>
<rect x="20" y="38" width="92" height="52" rx="6" fill="#fff" stroke="#cfe3ee"/>
<text x="66" y="60" text-anchor="middle" font-size="9.2" font-weight="700" fill="#0b6580">区域性</text>
<text x="66" y="76" text-anchor="middle" font-size="8.4" fill="#6b7280">成员集中一片</text>
<rect x="128" y="38" width="92" height="52" rx="6" fill="#fff" stroke="#cfe3ee"/>
<text x="174" y="60" text-anchor="middle" font-size="9.2" font-weight="700" fill="#0b6580">全球性</text>
<text x="174" y="76" text-anchor="middle" font-size="8.4" fill="#6b7280">成员遍布世界</text>
<text x="20" y="112" font-size="8.8" fill="#6b7280">东盟是区域性，不因为它声音大就变全球性</text>
</svg>
</div>
<div class="qac">
<p class="q">国际组织的决议，成员国必须执行吗？</p>
<p class="a">一般没有强制力，靠成员国<b>自愿执行</b>；不执行，也没有「上级」来处罚。安理会依据《联合国宪章》作出的决议对成员国有约束力，那是特殊安排，不能当成通例。材料里出现「拒绝执行」「退出组织」「拖欠会费」，就往作用有限上写。约束力的来源是成员国事先同意，不是国际组织自己有权。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="国际组织决议一般靠成员国自愿执行">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="20" y="28" font-size="9.2" font-weight="700" fill="#151a21">一张纸，一道坎</text>
<rect x="20" y="36" width="200" height="28" rx="6" fill="#fff" stroke="#bfe0cd"/>
<text x="30" y="54" font-size="8.8" fill="#3a3a35">决议：通过、呼吁、建议</text>
<line x1="120" y1="68" x2="120" y2="78" stroke="#9aa3ae" stroke-width="1.3"/>
<polygon points="120,84 116,76 124,76" fill="#9aa3ae"/>
<rect x="20" y="86" width="200" height="28" rx="6" fill="#fff" stroke="#f0cbc4"/>
<text x="30" y="104" font-size="8.8" fill="#3a3a35">执行：成员国愿不愿意办</text>
</svg>
</div>
<div class="qac">
<p class="q">国际组织越来越多，是不是说明国家不重要了？</p>
<p class="a">正相反。它是国家间合作的<b>工具</b>，权力由成员国授予，作用大小取决于成员国配不配合。国家利益仍是各国行动的出发点。所以「国际组织取代国家」是错的，「国际组织没有用」也是错的——两端都偏，中间那句才是答案。再补一句：国际组织越重要，越说明各国需要合作，而不说明主权过时了。</p>

<p class="gx-note">这六问其实是同一件事：<b>国际组织的权力从哪来、能用到哪、用到头会撞上什么</b>。材料怎么换，答案都落回三个抽屉——分类标签、积极作用、作用有限（含与主权国家的关系）。抽屉顺序别乱，分点别省。动笔前先在草稿上写下这三个抽屉的名字，再往里填材料，比边想边写快得多。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 国际组织是「世界政府」，各国都要服从它的决定。</p>
<p class="er-v">✓ 国际组织是政府间或非政府间、全球或区域的合作机构，其权力由成员国授予，不能凌驾于主权国家之上。</p>
<p class="er-w">错在哪：把「协调」写成「统治」。它没有超国家强制力，也没有领土、公民和警察。写这句的同学，往往是把「安理会决议有约束力」当成了所有国际组织的通例。</p>
</div>
<div class="er">
<p class="er-x">✗ 加入国际组织，就是把一部分主权交给了它。</p>
<p class="er-v">✓ 成员国让渡的是部分主权权利，主权本身并不让渡，也不容侵犯。</p>
<p class="er-w">错在哪：<b>主权权利 ≠ 主权</b>。关税、部分决策权可以按协议交出去一点，主权不行。答题时少写「部分」两个字，这一分就没了。</p>
</div>
<div class="er">
<p class="er-x">✗ 国际红十字委员会是政府间国际组织，因为各国政府都支持它。</p>
<p class="er-v">✓ 国际红十字委员会是非政府间国际组织，不由政府间协议设立，成员是各国红十字会和个人。</p>
<p class="er-w">错在哪：拿「政府支持」当「政府间」。判据只有一条：协议是不是政府之间签的。支持、资助、派人，都不改变它的非政府间性质。</p>
</div>
<div class="er">
<p class="er-x">✗ 东盟是区域性组织，所以作用比联合国小得多。</p>
<p class="er-v">✓ 东盟是政府间的区域性国际组织；区域性说的是成员分布的地理范围，不是作用大小。</p>
<p class="er-w">错在哪：把「地理范围」和「影响力」混成一件事。三把尺子各量各的，别互相替代。</p>
</div>
<div class="er">
<p class="er-x">✗ 国际组织的决议，对成员国都有强制约束力。</p>
<p class="er-v">✓ 国际组织的作用是有限的，决议一般靠成员国自愿执行；安理会依据宪章作出的决议有约束力，属特殊安排。</p>
<p class="er-w">错在哪：把特例当通例。绝大多数国际组织的决议是建议性的，靠的是成员国的意愿和配合。能做强制安排的，只有安理会那一种特殊授权。</p>
</div>
<div class="er">
<p class="er-x">✗ 有了国际组织，全球性问题就能解决了。</p>
<p class="er-v">✓ 国际组织能推动全球治理、促进合作，但作用有限，全球性问题还要靠各国共同合作与自身努力。</p>
<p class="er-w">错在哪：把「推动」写成「解决」。动词降一级，分数就上一级。</p>
</div>
<div class="er">
<p class="er-x">✗ 国际组织作用有限，所以加入也没什么意义。</p>
<p class="er-v">✓ 国际组织在促进交流合作、协调国际关系、维护世界和平与安全、推动全球治理上有重要作用，应支持多边主义并推动其改革。</p>
<p class="er-w">错在哪：从「有限」跳到「无用」。正确口径是<b>作用重要但有限</b>——两头都要写，只写一头就偏。</p>
</div>
</div>
<p class="gx-note">七条里最常考的是第 2、5、7 条：一条考主权，一条考约束力，一条考分寸。把这三条的正确表述各抄一遍，比刷十道选择题管用。错句本身也有用：考场上它一冒头，你就知道该改哪个词。</p>
</section>
