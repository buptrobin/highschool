<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背三句标准表述，再看一张表。答题时写课本这句，不是写你脑子里那句。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 制度定位<span class="q-src">人教版（2019）必修2 经济与社会 · 第四课第一框</span></p>
<p class="q-b">按劳分配为主体、多种分配方式并存，是我国社会主义基本经济制度的重要内容。</p>
<p class="q-n">→ 这句管“地位”。主语是<b>分配制度</b>，落脚点是<b>社会主义基本经济制度</b>。答题漏掉“基本经济制度”，这句就降一档；写成“我国的分配原则”，范围也窄了。它和公有制为主体、市场经济体制并列，是同一层级的三块基石。选择题常把“重要内容”改成“根本保证”，一改就错。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 按劳分配<span class="q-src">人教版（2019）必修2 经济与社会 · 第四课第一框</span></p>
<p class="q-b">按劳分配是社会主义的分配原则。它的基本内容和要求是：在公有制经济中，以劳动者向社会提供的劳动（包括劳动数量和质量）为尺度分配个人消费品，多劳多得，少劳少得。</p>
<p class="q-n">→ 这句管“定义”，里面藏着三个条件：①<b>在公有制经济中</b>（生产资料公有制是前提）；②以劳动者向社会提供的<b>劳动</b>为尺度（包括数量和质量）；③<b>多劳多得、少劳少得</b>。三个条件缺一个，就不是按劳分配。第三条最容易被忽略：它承认劳动差别，不是把大家拉平。“个人消费品”这个词也别漏，它说明分的是消费品，不是生产资料。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 要素与来源<span class="q-src">人教版（2019）必修2 经济与社会 · 第四课第一框</span></p>
<p class="q-b">生产要素由市场评价贡献、按贡献决定报酬。居民收入来源包括工资性收入、经营性收入、财产性收入、转移性收入。</p>
<p class="q-n">→ 这句管“来源”，是两半句。前半句说要素怎么定价：市场评价贡献，按贡献决定报酬；后半句给出四个钱包的名字，考试常拿它问“这属于哪种收入”。两半句要分开记，混成一句就会答错口径。四个名字按“劳动—经营—财产—转移”的顺序记，正好从自己干到政府给。</p>
</div>

<p>读法：三句不要连成一串背。第一句答“制度是什么”，第二句答“按劳分配怎么分”，第三句答“要素怎么定价、钱有几种叫法”。先看题目问的是哪一句，再动笔。公有制是第二句的开关，漏了它，按劳分配就站不住。</p>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>初次分配</th><th>再分配</th><th>第三次分配</th></tr></thead>
<tbody>
<tr><td>谁在切</td><td>市场：企业发工资、买卖定价</td><td>政府：收税、收社保费、发养老金</td><td>社会力量：个人、企业、慈善组织</td></tr>
<tr><td>靠什么切</td><td>按要素贡献：劳动、资本、土地、技术等</td><td>按法律和政策：税收、社会保障、转移支付</td><td>按自愿和道德：捐赠、志愿服务、互助</td></tr>
<tr class="key"><td>一句话记</td><td>一次靠市场</td><td>二次靠政府</td><td>三次靠自愿</td></tr>
<tr><td>钱变成什么</td><td>工资、利润、利息、租金</td><td>养老金、低保金、补贴、医保报销</td><td>救助款物、公益服务、帮扶项目</td></tr>
<tr><td>学生常错</td><td>以为这里政府也发钱</td><td>以为靠自愿捐赠</td><td>以为政府下指标摊派</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">背法：制度一句、原则一句、来源四个词。看到“干多干少一个样”“大家拿一样多”，先判它错在<b>把按劳分配读成了平均分配</b>。表格里只有“一句话记”这一行是需要脱口而出的，其余四行看懂就行。</p>
</section>

<section class="gx-sec" id="b">
<h2><span class="sn">02</span>拆开看</h2>
<p class="gx-h2s">四张图：制度长什么样 → 两种分配怎么分 → 四个钱包叫什么 → 分完的目标是什么。</p>
<p>四张图是一条线：图 1 给全景，图 2 拆开两种分配方式，图 3 落到小张一家的四个钱包，图 4 说分配要走向哪里。哪一张看不懂，就退回上一张找它的位置。四张连起来，正好是“制度—方式—来源—目标”。</p>

<h2><span class="sn">04</span>一道题走一遍</h2>

<p>动笔前先做一件事：把四个人名竖着写一列，右边留两列，一列写分配方式，一列写收入来源。先填满，再组织语言，比边想边写快得多。最后一段再回答“为什么”，不要一上来就写原因。</p>
<ol class="steps" id="gxSteps">
<li class="step">

<p class="s-k">用到：分配方式 / 收入来源 两套口径。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 爸爸：公有制里的按劳分配</p>
<p class="s-b">爸爸在国有企业，属于公有制经济；工资按岗位和绩效发，以劳动为尺度。所以是按劳分配，对应工资性收入。这里不能写“按资本分配”，国企的工资不是按出资分的。题目里“国有企业”四个字，就是判断公有制经济的关键提示。</p>
<p class="s-k">用到：按劳分配的两个条件（公有制、劳动尺度）。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 妈妈：非公有制里的按要素分配</p>
<p class="s-b">妈妈开网店，属于个体经营，是非公有制经济。她的收入按劳动、经营等要素参与分配，对应经营性收入。这里不能写按劳分配——“生产资料公有制”这个前提不成立，一写就错。如果网店注册成公司、雇人经营，还要带上管理和资本要素，收入仍归经营性收入。</p>
<p class="s-k">用到：按生产要素分配，前提是多种所有制共同发展。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 爷爷：按财产要素分配</p>
<p class="s-b">爷爷出租房屋，靠的是房屋、土地的使用权。按土地、财产等要素参与分配，对应财产性收入。租金不是劳动所得，但它是合法财产带来的收入，受法律保护，不能说“不劳而获”。这里最容易和按劳分配混，记住租金对应的是财产，不是劳动。</p>

<p class="s-b">奶奶的养老金来自社会保障，属于再分配，对应转移性收入。它是政府无偿给的，不是劳动换来的。养老金的标准由政府定，不是市场讨价还价的结果。最后收口：完善个人收入分配，提低、扩中、调高，促进共同富裕。那位同学的说法错在把四笔钱都归成按劳分配。</p>
<p class="s-k">用到：再分配、转移性收入、共同富裕。</p>

<div class="qac">
<p class="q">共同富裕是不是同步富裕、平均富裕？</p>
<p class="a">不是。共同富裕是<b>全体人民</b>的共同富裕，不是少数人富裕，也不是同步富裕、平均主义。它是一个逐步实现的过程，先富带后富。先富带后富是过程，不是口号；把“同步”“平均”写进答案，这一分就没了。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。考前只读左边，先认出坑。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 按劳分配就是大家拿一样多，干多干少一个样。</p>
<p class="er-v">✓ 按劳分配以劳动为尺度，多劳多得、少劳少得，承认劳动差别。</p>
<p class="er-w">错在哪：把“按劳”读成了“平均”，正好把按劳分配最核心的“承认差别”删掉了。背的时候把“承认差别”四个字带上。</p>
</div>
<div class="er">
<p class="er-x">✗ 按生产要素分配是资本主义的东西，社会主义不能用。</p>
<p class="er-v">✓ 生产要素由市场评价贡献、按贡献决定报酬，是社会主义基本经济制度的重要内容。</p>
<p class="er-w">错在哪：漏了“多种分配方式并存”，把社会主义分配制度砍掉了一半。社会主义分配制度是“主体 + 并存”，不是只有按劳分配。</p>
</div>
<div class="er">
<p class="er-x">✗ 初次分配、再分配、第三次分配都是由政府主导的。</p>
<p class="er-v">✓ 初次分配靠市场，再分配靠政府，第三次分配靠自愿。</p>
<p class="er-w">错在哪：三次分配的主导者不同；政府下指标摊派，恰恰不是第三次分配。三次的主体分别是市场、政府、社会，记主体比记名词稳。</p>
</div>
<div class="er">
<p class="er-x">✗ 财产性收入是躺赚，属于不劳而获，不应该鼓励。</p>
<p class="er-v">✓ 财产性收入是合法财产带来的收入，要保护合法收入，调节过高收入，取缔非法收入。</p>
<p class="er-w">错在哪：把“合法”和“不劳而获”混为一谈，答题会丢掉“保护合法收入”这个得分点。合法财产带来的收入，和“不劳而获”不是一回事。</p>
</div>
<div class="er">
<p class="er-x">✗ 提高劳动报酬比重，就是不要资本回报了。</p>
<p class="er-v">✓ 提高劳动报酬在初次分配中的比重，不是否定其他生产要素的贡献。</p>
<p class="er-w">错在哪：多加了“不要资本”这层意思；课本讲的是“比重”，不是“取消”。</p>
</div>
<div class="er">
<p class="er-x">✗ 共同富裕就是同步富裕、平均分配，大家一起富。</p>
<p class="er-v">✓ 共同富裕是全体人民共同富裕，不是少数人富裕，也不是同步富裕、平均主义。</p>
<p class="er-w">错在哪：“同步”“平均”两个词都是禁区；共同富裕是逐步实现的过程。</p>
</div>
<div class="er">
<p class="er-x">✗ 再分配力度越大越好，税收越高越公平。</p>
<p class="er-v">✓ 再分配要与经济发展水平相适应，兼顾公平与效率。</p>
<p class="er-w">错在哪：只看公平不看效率；力度过头会伤企业活力和就业，模型里 r 到 100 也只是教学示意。</p>
</div>
</div>
<p class="gx-note">七条里最常考的是第 1、3、7 条：一条考按劳分配，一条考三次分配，一条考再分配的边界。考前把这三条的右边读两遍，比通读整页有用。剩下的四条，当作选择题的干扰项清单来用。</p>
