<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">这一框的答案压在三句话上：文化是什么、文化由谁决定、文化有什么用。先照抄，再拆关键词，最后看哪一句最容易写漏。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 文化的含义与来源<span class="q-src">人教版（2019）必修4 哲学与文化 · 第七课第一框</span></p>
<p class="q-b">文化是相对于经济、政治而言的人类全部精神现象。文化是人类社会实践的产物。人们在实践中创造和发展文化，也在社会生活中获得和享用文化。</p>
<p class="q-n">→ 翻成人话：这段话有两层，缺一层就答不全。第一层给文化划范围：它跟经济、政治并列，管的是精神那一块——价值观念、道德规范、文学艺术、科学知识、风俗习惯都算。第二层给文化找来源：文化不是天上掉下来的，也不是谁脑子里自带的，是人动手干出来的。注意「全部」两个字，它把文化说得很宽：不只有唱歌跳舞，也包括你班的班规、你家的年夜饭、你手机里的表情包。但宽不等于虚，文化总有抓手，最后那句「获得和享用」就是提示——文化总是人在具体生活里做出来、用起来的。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 文化与经济、政治的关系<span class="q-src">人教版（2019）必修4 哲学与文化 · 第七课第一框</span></p>
<p class="q-b">经济是基础，政治是经济的集中表现，文化是经济和政治的反映。一定的文化由一定的经济、政治所决定，又反作用于一定的经济、政治，给予经济、政治以重大影响。文化具有相对独立性。</p>
<p class="q-n">→ 翻成人话：三个短句，三个动作。第一句排座次：经济在最底下当基础，政治在中间，文化在上面反映它们。第二句讲「决定」：一个地方靠什么吃饭、由谁说了算，会影响那里的人信什么、夸什么、怕什么。第三句讲「反作用」：文化不是照完镜子就完事，它会回头推一把，也可能拽一把。最后一句「相对独立性」是加分点：文化有时跑在经济前面，新思想先冒出来；有时落在后面，旧观念怎么改也改不掉。答题时把「决定」和「反作用」分成两句话说，只写一边要扣分。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 文化的功能与地位<span class="q-src">人教版（2019）必修4 哲学与文化 · 第七课第一框</span></p>
<p class="q-b">文化具有引领风尚、教育人民、服务社会、推动发展的功能。文化是民族的血脉和灵魂。文化兴国运兴，文化强民族强。</p>
<p class="q-n">→ 翻成人话：四个功能，两两分组最好背。前两个对着人：引领风尚管风气，教育人民管素质；后两个对着社会：服务社会管需求，推动发展管动力。注意「引领」这个词，它说明文化站在前面带路，不是跟在后面记账。后两句是地位句，常拿来当答案的收尾——写「文化是民族的血脉和灵魂」，比写「文化很重要」值钱得多。这里有个坑：功能不等于万能。文化再强，也不能代替经济和政治去干活，它只能通过影响人来起作用。</p>
</div>

<p class="gx-note">整张表只高亮一行：<b>一句话总口径</b>。前四行是四个可以互换着挖坑的地方，最后一行是把它们串起来的那根绳。背法：第一行回答「文化是什么」，第二行回答「文化从哪来」，第三行回答「文化有没有好坏」，第四行回答「文化和经济谁决定谁」。考试时先看设问问的是哪一行再动笔。再提醒一句：答「决定」时主语只能是经济、政治，不能反过来；答「反作用」时动词要写「促进或阻碍」，不要写成「决定」。</p>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。每一步只推进一个判断。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 材料分析题：文化的作用<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">某县把乡村篮球赛办成了品牌。赛前，县里修好球场、排好赛程、培训了裁判；赛中，球场边摆起摊位，土特产现场直播带货，非遗传承人上场展演；赛后，村民自发定下「球场文明公约」，孩子们跟着球队练球，民宿和餐馆的生意一直火到入冬。结合材料，说明文化在该县发展中发挥了怎样的作用。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性</p>
<p class="s-b">设问问「文化的作用」，不是问「怎么建设文化」。范围锁在第七课第一框：文化的功能四条，加上文化与经济政治的关系。这道题要答的是「作用」，不是「措施」。</p>
<p class="s-k">用到：文化的功能、文化与经济政治的关系。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 找主体</p>
<p class="s-b">材料里有四类主体：县里（修球场、排赛程）、村民（定公约、参赛）、游客和客商（来看球、来消费）、孩子（跟着练球）。主体不同，落点就不同，一段材料可以答出好几个点。</p>
<p class="s-k">用到：主体分析法，先分人再分点。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 找行为</p>
<p class="s-b">把行为圈出来：修场地、办比赛、摆摊直播、非遗展演、定公约、孩子练球。每一个行为后面都跟着一个结果，结果就是你要解释的东西。</p>
<p class="s-k">用到：行为—结果对应，防止只抄材料不分析。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 对应原理</p>
<p class="s-b">摆摊直播、民宿餐饮变火，对应文化与经济相互交融、文化反作用于经济；球场文明公约对应引领风尚；非遗展演、孩子练球对应教育人民；免费开放、游客有得看有得玩，对应服务社会；人气变成生意，对应推动发展。</p>
<p class="s-k">用到：四个功能 + 反作用，一条材料对一个点。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口</p>
<p class="s-b">分点写，每点先原理后材料。最后补一句：文化有先进与落后之分，该县发展的是健康向上的先进文化，所以要继续引导，防止赛事变味、直播变俗。</p>
<p class="s-k">用到：先进文化与落后文化的辨析，用来收尾拉分。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">①文化引领风尚。村民自发定下「球场文明公约」，自觉守规矩、讲礼让，带动乡风更加文明。②文化教育人民。非遗传承人上场展演、孩子跟着球队练球，人们在参与中开阔眼界、提高素质、塑造健全人格。③文化服务社会。球场和文化活动免费向群众开放，满足了村民和游客的精神文化需求，保障了人民基本文化权益。④文化推动发展。赛事带来人气，摊位、直播带货、民宿餐饮一起活起来，文化为经济发展提供了精神动力，也带动了相关产业。⑤文化有先进与落后之分。该县发展的是健康向上的先进文化，才产生这样的正面作用；如果放任低俗炒作，同样的赛事也会带来负面影响，所以要继续加强引导和管理。</p>
</div>
</div>
</section>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。每问配一张小图，看图就能想起判据。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「文化不就是精神的东西吗，跟经济有什么关系？」</p>
<p class="a">文化是精神现象，但<b>精神产品凝结在一定的物质载体之中</b>，而且它由社会实践产生、受经济政治制约。答「纯精神」，就漏了来源、载体和反作用三头。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="精神现象与物质载体相互依存">

<text x="61" y="56" text-anchor="middle" font-size="8.4" fill="#1f4e79">精神现象</text>
<text x="61" y="70" text-anchor="middle" font-size="8" fill="#6b7280">价值观·文艺</text>
<rect x="136" y="40" width="86" height="38" rx="6" fill="#ffffff" stroke="#b8e6d0"/>
<text x="179" y="56" text-anchor="middle" font-size="8.4" fill="#1e6640">物质载体</text>
<text x="179" y="70" text-anchor="middle" font-size="8" fill="#6b7280">老屋·戏台·书</text>
<line x1="104" y1="59" x2="128" y2="59" stroke="#8a9bab" stroke-width="1.5"/>
<polygon points="128,55 135,59 128,63" fill="#8a9bab"/>

<div class="qac">
<p class="q">「我们县经济上去了，文化自然就上去了吧？」</p>
<p class="a">不一定。经济政治<b>决定</b>文化，但文化具有<b>相对独立性</b>：新观念可能先于经济出现，旧观念也可能拖很久。答题时先写决定，再补相对独立性，层次才完整。</p>

<rect x="120" y="66" width="46" height="22" rx="4" fill="#f7dde1" stroke="#f3c9cf"/>
<line x1="28" y1="88" x2="212" y2="88" stroke="#c9d6df" stroke-width="1.2"/>
<text x="69" y="102" text-anchor="middle" font-size="8.2" fill="#1e6640">经济</text>
<text x="143" y="102" text-anchor="middle" font-size="8.2" fill="#9f1239">文化</text>
<line x1="94" y1="56" x2="118" y2="65" stroke="#8a9bab" stroke-width="1" stroke-dasharray="3 2"/>
<text x="120" y="116" text-anchor="middle" font-size="8.2" fill="#6b7280">可能超前，可能滞后，不一定同步</text>

</div>
<div class="qac">
<p class="q">「文化活动越多越好，有什么可挑的？」</p>
<p class="a">文化<b>有先进与落后之分</b>。先进文化促进社会进步、凝聚人心；落后文化腐蚀精神世界、拖慢发展。写答案时要带上「发展先进文化、改造落后文化」这一句。</p>

<div class="qac">
<p class="q">「抓文化就是抓发展，文化能解决所有问题吧？」</p>
<p class="a">不能。文化具有<b>引领风尚、教育人民、服务社会、推动发展</b>的功能，但它<b>先改变人、再通过人改变社会</b>，代替不了经济和政治。说「万能」，反而是把文化看轻了。</p>

<text x="158" y="66" text-anchor="middle" font-size="10" fill="#8a9bab">→</text>

<div class="qac">
<p class="q">「文化自信这么大的词，跟我一个高中生有关系吗？」</p>
<p class="a">有关系。文化自信<b>事关国运兴衰、事关文化安全、事关民族精神独立性</b>，来源是中华优秀传统文化、革命文化、社会主义先进文化。你选什么歌、看什么展、怎么说话，都在其中。</p>

<div class="qac">
<p class="q">「非遗和老街，到底算文化还是算经济资源？」</p>
<p class="a">先是文化。老街、老手艺是<b>物质载体</b>，真正的内容是里面的规矩、记忆和手艺；开发能用它挣钱，但<b>保护要放在开发前面</b>。载体一拆，文化就没了家。</p>

<p class="gx-note">六问其实是同一件事：<b>先分清文化是哪一层、由谁决定、对谁起作用</b>。第一问管「文化是什么」，第二问管「谁决定谁」，第三问管「有没有好坏」，第四问管「功能有多大」，第五问管「地位」，第六问管「载体和内容」。判据只有一个：材料里的主体做了什么，落在哪一层。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。考前扫一遍，比再背一遍课本快。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 文化是纯精神的，跟经济、政治没什么关系。</p>
<p class="er-v">✓ 文化是相对于经济、政治而言的人类全部精神现象，是人类社会实践的产物，精神产品凝结在一定的物质载体之中。</p>
<p class="er-w">错在哪：把「精神现象」读成了「纯精神」。漏掉来源、载体、反作用这三点，材料里的非遗、老建筑、村 BA 就全都没法解释。</p>
</div>
<div class="er">
<p class="er-x">✗ 经济发展了，文化自然就跟着进步了。</p>
<p class="er-v">✓ 一定的文化由一定的经济、政治所决定，但文化具有相对独立性，可能超前于经济，也可能滞后于经济。</p>
<p class="er-w">错在哪：把「决定」当成了「同步」。真同步的话，就不会有腰包鼓了观念还旧、日子紧却思想先新的情况。</p>
</div>
<div class="er">
<p class="er-x">✗ 文化都是好的，活动办得越多越好。</p>
<p class="er-v">✓ 文化有先进与落后之分，要发展先进文化、支持健康有益文化、改造落后文化、抵制腐朽文化。</p>
<p class="er-w">错在哪：取消了好坏判断。低俗短视频也是文化，它对青少年的影响恰好是反面的。</p>
</div>
<div class="er">
<p class="er-x">✗ 文化能解决一切问题，抓文化就等于抓发展。</p>
<p class="er-v">✓ 文化具有引领风尚、教育人民、服务社会、推动发展的功能，但它通过影响人起作用，不能代替经济和政治。</p>
<p class="er-w">错在哪：把功能说成了万能。功能越具体，边界越清楚；说万能，反而答不出它到底怎么起作用。</p>
</div>
<div class="er">
<p class="er-x">✗ 村 BA 火了，说明文化决定经济发展。</p>
<p class="er-v">✓ 文化与经济相互交融，文化反作用于经济，经济是基础；先进文化为经济发展提供精神动力。</p>
<p class="er-w">错在哪：方向写反了。「决定」的主语只能是经济、政治，文化这一头只能写「反作用」「促进或阻碍」。</p>
</div>
<div class="er">
<p class="er-x">✗ 文化自信，就是觉得自己的文化什么都好，别人的一概不学。</p>
<p class="er-v">✓ 文化自信来自中华优秀传统文化、革命文化、社会主义先进文化，要坚持不忘本来、吸收外来、面向未来。</p>
<p class="er-w">错在哪：把自信读成了自大。自信是知道自己有什么、也知道该学什么，不是关起门来夸自己。</p>
</div>
<div class="er">
<p class="er-x">✗ 文化建设是政府和文化部门的事，跟我没关系。</p>
<p class="er-v">✓ 人们在社会实践中创造和发展文化，也在社会生活中获得和享用文化，人民群众是文化创造的主体。</p>
<p class="er-w">错在哪：把自己从主体里划出去了。你办的社团、你拍的短视频、你家的老规矩，都是文化的一部分。</p>
</div>
</div>
