<p class="gx-lede">你住的小区里，有人把电动车推进电梯上楼充电。业主群里立刻吵起来：有人拍照发群，有人说「多管闲事」，物业回一句「我们没有执法权」。同一件事，三种态度，背后是三个问题——谁该守法、守到什么程度、凭什么让人愿意守。这三个问题，就是第九课第四框「全民守法」。它在「科学立法、严格执法、公正司法、全民守法」这条链子的最后一环，也是前面三环真正落地的地方，因为法律写得再好、判得再公，最后总得有人去守。最容易错的一件事：把全民守法当成「老百姓别犯法」，于是把国家机关、领导干部、企业全漏掉了。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">这一框的分数压在三个判断上：主体是不是「所有社会成员」、守法是不是只到「不违法」为止、靠什么让人愿意守。先照抄课本，再拆关键词；答题时写课本这句，不写你脑子里那句。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 什么是全民守法<span class="q-src">人教版（2019）必修3 政治与法治 · 第九课第四框</span></p>
<p class="q-b">全民守法是指所有社会成员普遍尊重和信仰法律、依法行使权利和履行义务的状态。建设法治中国，必须推动全民守法，使全体人民都成为社会主义法治的忠实崇尚者、自觉遵守者、坚定捍卫者。</p>
<p class="q-n">→ 翻成人话：这句定义里有三个条件，考试就按这三个条件给分。① 主体是「所有社会成员」——不是一个「老百姓」能概括的，公民、国家机关、领导干部、企业、社会组织，全在里面；② 状态是「尊重和信仰法律」——心里认这条法，不只是知道有这条法；③ 行为是「依法行使权利和履行义务」——权利、义务两头都要，只写一头就漏掉一半分。</p>
<p class="q-n">→ 还有一句要背下来：「忠实崇尚者、自觉遵守者、坚定捍卫者」。三个身份一层比一层高：崇尚是心里服，遵守是手上做，捍卫是别人破坏时你敢站出来。材料里出现「举报」「劝阻」「依法维权」，对应的就是第三个身份。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 公民怎样守法<span class="q-src">人教版（2019）必修3 政治与法治 · 第九课第四框</span></p>
<p class="q-b">公民依法行使权利，依法履行义务。公民在行使权利时，不得损害国家的、社会的、集体的利益和其他公民的合法的自由和权利。任何组织或者个人都不得有超越宪法和法律的特权。</p>
<p class="q-n">→ 翻成人话：三句话，三个采分点。第一句讲「都要」：行使权利要依法，履行义务也要依法，这两件事地位一样。第二句讲「边界」：你的权利到别人的权利门口为止，不能拿「这是我的自由」去压别人的自由。第三句讲「平等」：没有谁能站在法律上面，级别再高、钱再多也一样。</p>
<p class="q-n">→ 举个身边的例子。你在群里转发一条「某超市食品有毒」的消息，如果消息是假的，你行使的是言论自由，损害的是超市的名誉和别的顾客的判断，这就越界了。反过来，你买到过期食品去投诉、去索赔，这是依法行使权利，不是「找事」。同一个人、同一部法律，界线就在「有没有损害他人合法权益」。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 怎样推进全民守法<span class="q-src">人教版（2019）必修3 政治与法治 · 第九课第四框</span></p>
<p class="q-b">推进全民守法，要坚持法治教育从青少年抓起，把法治教育纳入国民教育体系，引导青少年从小树立法治意识。国家工作人员特别是领导干部要带头守法。要健全公共法律服务体系，完善法律援助制度。要坚持依法治国和以德治国相结合，增强法治的道德底蕴，使尊法学法守法用法成为全体人民的共同追求和自觉行动。</p>
<p class="q-n">→ 翻成人话：这是「怎么办」的清单，按「谁来抓」分四块。① 抓源头：青少年，法治教育进课堂、进国民教育体系；② 抓关键：国家工作人员特别是领导干部，带头守法；③ 抓服务：公共法律服务体系、法律援助，让请不起律师的人也打得起官司；④ 抓土壤：依法治国和以德治国相结合，用社会主义核心价值观养法治的道德底蕴。</p>
<p class="q-n">→ 答题时这四块要分开写，一块一条，每条后面跟一句材料。最容易被忘掉的是第③块和第④块，因为它们不像「教育」「带头」那么顺口。可材料里只要出现「法律援助中心」「免费法律咨询」「诚信建设」「村规民约」，考的就是这两块。</p>
</div>

<p class="gx-note">这张表只高亮一行：<b>真正的区别</b>。五行各记一句：范围看「所有社会成员」，权利看「有没有越界」，义务看「躲不躲」，带头看「关键少数」，动力看「怕不怕还是信不信」。材料题最常考的是最后一行——问「为什么说全民守法是法治社会的基础」，答案要落到「法律的权威源自人民的内心拥护和真诚信仰」，只写「大家都守法社会就稳定了」，那是大白话，不是教材语言。</p>

<p class="gx-take">全民守法的主体是「所有社会成员」，公民、国家机关和国家工作人员、青少年、企业和社会组织都在其中；材料里出现「带头」「宣誓」，主体就是关键少数，不是普通群众。</p>
<p class="gx-note">两个容易漏的主体。第一是国家机关：它不只是执法者，本身也要守法，行政机关依法行政、司法机关公正司法，都是守法的题中之义，答题时写「国家机关及其工作人员依法行使职权」，比只写「政府要依法办事」规范。第二是社会组织：行业协会、物业公司、网络平台都在其中，平台对商家和用户的管理责任，就是它守法的具体形式。</p>

<p class="gx-take">尊法学法守法用法是一条链：尊法解决「愿不愿」，学法解决「懂不懂」，守法解决「守不守」，用法解决「会不会」；缺哪一环，就答哪一环。</p>
<p class="gx-note">这里有个坑：不少同学把「用法」理解成「用法律去告人」。教材的「用法」首先是依法办事——办证、签合同、维权、举报，都叫用法；其次才是打官司。所以材料里出现「居民按流程申请行政复议」「消费者拨打 12315」，别犹豫，写「用法」。另外注意，「尊法」排在最前面不是随便排的，它对应「法律的权威源自人民的内心拥护和真诚信仰」，是后面三环的地基。</p>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。五步走完，答案的架子就搭好了。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 措施类材料题<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">材料：某市推进「法治城市」建设。市委理论学习中心组每年集体学法不少于四次，新任命的国家工作人员一律在国徽前宪法宣誓，任前法律考试不合格的不予任命；市教育局把法治教育纳入中小学课程，开学第一课讲未成年人保护法，每个学校配一名法治副校长；市市场监管局组织食品、药品企业开展合规培训，推动企业建立合规制度、依法纳税，一年查处违法经营案件三百余起；市司法局建成公共法律服务中心，每个社区配一名法律顾问，对农民工讨薪案件免予经济状况审查、直接提供法律援助。外来务工人员老陈被拖欠工资三个月，没有堵路，而是找社区法律顾问写了申请书，申请法律援助，通过劳动仲裁拿回了工资。结合材料，运用《政治与法治》的知识，说明该市是如何推进全民守法的。（12 分）</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性</p>
<p class="s-b">题型是「如何推进」类措施题，知识范围锁定第九课第四框「全民守法」。设问里没有「为什么」，所以不必大段写意义，重点是把做法拆开、一条一条对上教材要求。先在草稿上竖着写四个小标题：干部带头、青少年教育、企业守法、公民用法，再留一行给法治信仰。</p>
<p class="s-k">用到：全民守法的含义与推进要求</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 找主体</p>
<p class="s-b">材料里的主体排一排：市委、新任命的国家工作人员、市教育局和学校、市市场监管局、企业、市司法局和社区法律顾问、农民工老陈。一共五类，正好对应教材的几条要求。要注意，市委和市政府不是「守法的对象」这么简单，它们是推进者，也是被要求带头守法的人，两个身份都要写进去。</p>
<p class="s-k">用到：国家机关及其工作人员；企业和社会组织；公民</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 找行为</p>
<p class="s-b">行为按主体归类：集体学法、宪法宣誓、任前考法（带头）；法治进课表、开学第一课、法治副校长（青少年）；合规培训、建立合规制度、依法纳税（企业）；公共法律服务中心、社区法律顾问、免审查法律援助（服务）；老陈找顾问、写申请、走仲裁、不堵路（用法）。每一类都有一到两个具体动作，这就是后面分点的材料。</p>
<p class="s-k">用到：带头学法守法；法治教育纳入国民教育体系；守法经营；公共法律服务体系；依法维权</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 对应原理</p>

<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">① 抓住领导干部这个「关键少数」。市委理论学习中心组集体学法，新任命的国家工作人员宪法宣誓、任前法律考试，做到了国家工作人员特别是领导干部带头守法，任何组织或者个人都不得有超越宪法和法律的特权。<br>② 坚持法治教育从青少年抓起。市教育局把法治教育纳入中小学课程，开学第一课讲未成年人保护法，每校配法治副校长，引导青少年从小树立法治意识，扣好人生第一粒扣子。<br>③ 推动企业和社会组织守法经营。市市场监管局组织合规培训，推动企业建立合规制度、依法纳税，查处违法经营案件，体现了市场经济是法治经济，企业要依法经营、承担社会责任。<br>④ 健全公共法律服务体系，引导公民依法维权。市司法局建成公共法律服务中心，社区配法律顾问，对讨薪案件免予经济状况审查提供法律援助，老陈通过仲裁拿回工资而没有堵路，做到了办事依法、遇事找法、解决问题用法、化解矛盾靠法。<br>⑤ 该市把教育、带头、服务、用法结合起来，使尊法学法守法用法成为全体人民的共同追求和自觉行动，增强了全社会的法治信仰，发挥了全民守法作为法治社会基础的作用。</p>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。每问先自己答一句，再看下面那句。</p>
<div class="gx-qa">

<div class="qac">
<p class="q">「全民守法就是老百姓守法吗？」</p>
<p class="a">不是。主体是<b>所有社会成员</b>：公民、国家机关和国家工作人员、青少年、企业和社会组织。其中国家机关及其工作人员是「关键少数」，要带头守法，任何组织或者个人都不得有超越宪法和法律的特权。答题只写「公民要守法」，等于把这框答窄了一半。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="全民守法的主体是所有社会成员，包括公民、国家机关及其工作人员、青少年、企业和社会组织">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="27" font-size="9.2" text-anchor="middle" fill="#151a21">谁要守法：所有社会成员</text>
<rect x="20" y="36" width="200" height="32" rx="7" fill="#ffffff" stroke="#f3c9cf"/>
<text x="32" y="50" font-size="8.2" fill="#9f1239">公民 · 国家机关及其工作人员</text>
<text x="32" y="63" font-size="8.2" fill="#3a3a35">青少年 · 企业和社会组织</text>
<text x="120" y="88" font-size="8.4" text-anchor="middle" fill="#9f1239">干部带头：抓住「关键少数」</text>
<text x="120" y="110" font-size="8.2" text-anchor="middle" fill="#6b7280">不是「只管普通群众」</text>
</svg>
</div>

<div class="qac">
<p class="q">「我不违法，就算守法了吗？」</p>
<p class="a">不只。不违法只是最低线，是守法里最窄的一层。教材要的是<b>尊法学法守法用法</b>：心里认同、懂规则、依法办事、还会用法。一个人如果只是没犯法，既没有依法行使过权利，也没有认真履行过义务，那只做到了第三环的一半，离「状态」两个字还差很远。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="尊法学法守法用法四个环节，不违法只到第三环的一半">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="27" font-size="9.2" text-anchor="middle" fill="#151a21">四个字是一条链</text>
<rect x="18" y="40" width="46" height="26" rx="6" fill="#ffffff" stroke="#b8e6d0"/>
<text x="41" y="57" font-size="7.8" text-anchor="middle" fill="#1e6640">①尊法</text>
<rect x="70" y="40" width="46" height="26" rx="6" fill="#ffffff" stroke="#b8e6d0"/>
<text x="93" y="57" font-size="7.8" text-anchor="middle" fill="#1e6640">②学法</text>
<rect x="122" y="40" width="46" height="26" rx="6" fill="#ffffff" stroke="#dbe7ef"/>
<text x="145" y="57" font-size="7.8" text-anchor="middle" fill="#3a3a35">③守法</text>
<rect x="174" y="40" width="46" height="26" rx="6" fill="#ffffff" stroke="#b8e6d0"/>
<text x="197" y="57" font-size="7.8" text-anchor="middle" fill="#1e6640">④用法</text>
<text x="120" y="88" font-size="8.2" text-anchor="middle" fill="#9f1239">不违法只是守住底线</text>
<text x="120" y="110" font-size="8.2" text-anchor="middle" fill="#6b7280">还要依法行使权利、履行义务</text>
</svg>
</div>

<div class="qac">
<p class="q">「权利是我的，怎么用都行吗？」</p>
<p class="a">不行。公民在行使权利时，<b>不得损害国家的、社会的、集体的利益和其他公民的合法的自由和权利</b>。这条边界不是限制你，而是让所有人的权利都能成立。越界行使，性质就变了：从行使权利变成侵权，严重的还要承担法律责任。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="行使权利的边界：不得损害国家、社会、集体利益和其他公民的合法的自由和权利">

<text x="120" y="27" font-size="9.2" text-anchor="middle" fill="#151a21">权利到哪里为止</text>

<text x="120" y="54" font-size="8.4" text-anchor="middle" fill="#1e6640">你的权利，到别人的权利门口为止</text>
<text x="32" y="82" font-size="8.2" fill="#3a3a35">不得损害国家的、社会的、集体的利益</text>
<text x="32" y="98" font-size="8.2" fill="#3a3a35">不得损害其他公民的合法的自由和权利</text>
<text x="120" y="118" font-size="8.2" text-anchor="middle" fill="#9f1239">越界行使，权利就变成侵权</text>
</svg>
</div>

<div class="qac">
<p class="q">「义务是负担，能躲就躲吗？」</p>
<p class="a">不行。权利与义务<b>相互依存、不可分割</b>，没有无义务的权利，也没有无权利的义务。义务不能放弃，也不能用权利去交换。你享受受教育权，就要履行受教育的义务；你享受网络带来的便利，就要遵守网络空间的规则。</p>

<rect x="18" y="40" width="92" height="44" rx="7" fill="#ffffff" stroke="#b8e6d0"/>
<text x="64" y="58" font-size="8.6" font-weight="700" text-anchor="middle" fill="#1e6640">权利</text>
<text x="64" y="73" font-size="7.8" text-anchor="middle" fill="#3a3a35">可以做什么</text>
<rect x="130" y="40" width="92" height="44" rx="7" fill="#ffffff" stroke="#f3c9cf"/>
<text x="176" y="58" font-size="8.6" font-weight="700" text-anchor="middle" fill="#9f1239">义务</text>
<text x="176" y="73" font-size="7.8" text-anchor="middle" fill="#3a3a35">必须做什么</text>
<text x="120" y="70" font-size="11" text-anchor="middle" fill="#9aa4ae">⇄</text>
<text x="120" y="104" font-size="8.2" text-anchor="middle" fill="#3a3a35">没有无义务的权利</text>
<text x="120" y="118" font-size="8.2" text-anchor="middle" fill="#3a3a35">也没有无权利的义务</text>
</svg>
</div>

<div class="qac">
<p class="q">「法治靠严罚就能建成吗？」</p>
<p class="a">不能。重罚能让人「不敢违法」，但管不住心。教材说<b>法律的权威源自人民的内心拥护和真诚信仰</b>。所以还要靠氛围和信仰：弘扬法治精神、建设法治文化，坚持依法治国和以德治国相结合，让守法从「要我做」变成「我要做」。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="守法的三层动力：靠他律不敢违法，靠氛围不想违法，靠信仰信法用法">

<text x="120" y="25" font-size="9.2" text-anchor="middle" fill="#151a21">靠罚只管住行为</text>
<rect x="20" y="34" width="200" height="23" rx="6" fill="#ffffff" stroke="#dbe7ef"/>
<text x="30" y="49" font-size="7.8" fill="#3a3a35">① 不敢违法：怕罚款、怕拘留</text>
<rect x="20" y="62" width="200" height="23" rx="6" fill="#ffffff" stroke="#dbe7ef"/>
<text x="30" y="77" font-size="7.8" fill="#3a3a35">② 不想违法：守法光荣、违法可耻</text>
<rect x="20" y="90" width="200" height="23" rx="6" fill="#ffffff" stroke="#b8e6d0"/>
<text x="30" y="105" font-size="7.8" font-weight="700" fill="#1e6640">③ 信法：内心拥护与真诚信仰</text>
</svg>
</div>

<div class="qac">
<p class="q">「守法是大人的事，跟中学生无关吗？」</p>
<p class="a">有关。推进全民守法要<b>坚持法治教育从青少年抓起</b>，把法治教育纳入国民教育体系，扣好人生第一粒扣子。你今天怎么用手机、怎么对待同学、看到不对的事敢不敢说，就是守法的练习。等成年了再学，习惯已经养成了。</p>

<p class="gx-note">六问其实是同一件事：都在问「谁守、守什么、凭什么守」。顺序记成三问：第一问定主体，所有社会成员，国家机关和领导干部是「关键少数」，不是只管群众；第二问定内容，守法不只是不违法，还要依法行使权利、依法履行义务，权利与义务相统一；第三问定动力，靠罚只能管住行为，靠信仰才能管住心，所以才有法治教育、法治文化、德法结合。你在材料题里写不出话时，按这三问各写一句，再各配一条材料事实，分数就出来了。</p>
