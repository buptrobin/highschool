<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">三段话管全框：制度是什么、怎么运转、为什么是根本。先照抄，再拆关键词。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 制度是什么、由哪几块拼起来<span class="q-src">人教版（2019）必修3 政治与法治 · 第五课第二框</span></p>
<p class="q-b">人民代表大会制度是按照民主集中制原则，由人民选举代表组成人民代表大会作为国家权力机关，统一管理国家事务的政治制度。国家的一切权力属于人民；人民通过民主选举选出代表，组成各级人民代表大会作为国家权力机关；由国家权力机关产生其他国家机关，依法行使各自的职权；实行民主集中制的组织和活动原则。</p>
<p class="q-n">→ 翻成人话：这一段里有<b>四个动作</b>，顺序不能乱。①国家的一切权力属于人民——这是前提，不是「人大把权力分给了人民」，方向别写反。②人民通过民主选举选出代表——人民当家作主是通过代表来实现的，不是每个人直接去管事。③代表组成各级人民代表大会，作为国家权力机关——「国家权力机关」是它唯一的身份，写成「行政机关」「执法机关」就错了。④由它产生其他国家机关，依法行使各自的职权——政府、监察委、法院、检察院的「出生证」都在人大手里，这一句是后面讲监督关系的根。最后半句是组织和活动原则，也就是下一段要拆的民主集中制。答题时四个动作少一个，这句定义就不完整。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 民主集中制是「相结合」，不是加法<span class="q-src">人教版（2019）必修3 政治与法治 · 第五课第二框</span></p>
<p class="q-b">人民代表大会制度实行民主集中制的组织和活动原则。民主集中制是在民主基础上的集中和在集中指导下的民主相结合的制度。</p>
<p class="q-n">→ 翻成人话：这里有个坑——它<b>不是「民主加集中」</b>，不是先开会吵一顿、再由领导拍板，两件事拼在一起就叫民主集中制。课本的写法是「相结合」：民主是集中的基础，没有充分讨论，集中出来的决定是空的；集中是民主的指导和归宿，只讨论不形成决定，事情就办不成。落到人大制度上，它有<b>三个层面</b>：人大和人民之间，代表由民主选举产生，对人民负责，受人民监督；人大和其他国家机关之间，机关由人大产生，对它负责，受它监督；中央和地方之间，在中央统一领导下，充分发挥地方的主动性、积极性。答题时按「哪个层面 + 谁 + 什么关系」三件套写，只写一句「实行民主集中制」拿不到分。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 为什么叫「根本」，好在哪<span class="q-src">人教版（2019）必修3 政治与法治 · 第五课第二框</span></p>
<p class="q-b">人民代表大会制度是我国的根本政治制度，是我国的政权组织形式。它保障了人民当家作主，动员了人民投身于社会主义建设，保证了国家机关协调高效运转，维护了国家统一和民族团结。</p>
<p class="q-n">→ 翻成人话：先说「根本」是什么意思。我国的国体是人民民主专政，也就是人民当家作主；人大制度是把国体落到国家政权组织上的形式，所以叫政体。国体决定政体，政体体现国体——这两句是一对，考试常连着问。再说四个「了」：保障、动员、保证、维护，四个动词是固定搭配，别写成「保障了经济发展」「提高了生活水平」，那不是课本给的优越性。答题时四个「了」各成一点，一点一行，最后回扣一句「所以必须坚持人民代表大会制度」。</p>
</div>

<p class="gx-note">整张表只高亮一行，因为「机关」和「制度」这一对最容易混：人大是一个机关，人大制度是一套安排，前者只是后者的一个环节。再记一组数字：「根本」只有 1 个，就是人民代表大会制度；「基本」有 3 个，是中国共产党领导的多党合作和政治协商制度、民族区域自治制度、基层群众自治制度。题目里出现「根本」两个字，答案基本锁定；出现「基本」两个字，答案就在那三项里。</p>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，在草稿纸上写下四个「了」，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 原因类材料题<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">材料：某市人大在制定《城市生活垃圾分类管理条例》时，把草案全文向社会公布，召开三场立法听证会，收到市民意见两千多条；条例通过后，市人大常委会连续两年组织执法检查，听取市政府关于垃圾分类工作的专项报告，并对两个部门的整改情况开展专题询问；全市 120 个代表联络站常年接待群众，代表把居民反映的「投放点太远」写成建议，推动新增投放点 460 个。结合材料，运用「人民代表大会制度」的知识，说明为什么必须坚持人民代表大会制度。（12 分）</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性</p>
<p class="s-b">设问是「为什么必须坚持」，属于原因类，要答制度的作用和优越性，不是答人大的四项职权。知识范围锁在「人民代表大会制度」这一框，别往「中国共产党的领导」那一课跑。</p>
<p class="s-k">用到：原因类设问，答「制度 + 作用 + 回扣材料」</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 找主体</p>
<p class="s-b">材料里三拨人：市人大及其常委会（国家权力机关）、市政府（行政机关）、市民和人大代表（人民）。主体一分清，就不会把「政府报告工作」写成「政府领导人大」。</p>
<p class="s-k">用到：人民代表大会、人民政府、人大代表、人民群众</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 找行为</p>
<p class="s-b">公布草案、开听证会、收集两千多条意见；连续两年执法检查、听取专项报告、专题询问；联络站接待群众、把意见写成建议。三组动作，往三个方向落。</p>
<p class="s-k">用到：公开征求意见、执法检查、专题询问、代表联系群众</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 对应原理</p>
<p class="s-b">听证会和公开征求意见 → 保障人民当家作主；联络站和代表建议 → 动员人民投身社会主义建设；执法检查、专题询问 → 保证国家机关协调高效运转；全市统一实施同一部条例 → 维护国家统一和民族团结。</p>
<p class="s-k">用到：四大优势、民主集中制、人大的监督权</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口</p>
<p class="s-b">四点分条，每条第一句先给「保障／动员／保证／维护」，第二句引材料，第三句点一句术语。最后补结论：人民代表大会制度是我国的根本政治制度，必须坚持并在实践中不断完善。别停在「所以人大制度很好」这种评价上。</p>
<p class="s-k">用到：根本政治制度、政权组织形式、党的领导与人民当家作主、依法治国有机统一</p>
</li>
</ol>

<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">① 人民代表大会制度保障了人民当家作主。国家的一切权力属于人民，人民通过民主选举选出代表组成人民代表大会行使国家权力。该市人大公布条例草案、召开立法听证会、收集市民意见两千多条，把群众意见写进法规，人民当家作主落到了具体程序上。<br>② 人民代表大会制度动员了人民投身于社会主义建设。人大代表由人民选举产生，对人民负责，受人民监督。120 个代表联络站常年接待群众，代表把「投放点太远」写成建议，推动新增投放点 460 个，把群众的积极性调动了起来。<br>③ 人民代表大会制度保证了国家机关协调高效运转。人大统一行使国家权力，其他国家机关由它产生、对它负责、受它监督。市人大常委会连续两年开展执法检查、听取市政府专项报告、对整改情况开展专题询问，政府依法执行，各机关分工配合。<br>④ 人民代表大会制度维护了国家统一和民族团结。它保证国家权力统一行使，保证各民族平等团结、共同繁荣。该市在全市范围内统一实施同一部条例，正是国家统一领导、统一制度的体现。<br>结论：人民代表大会制度是我国的根本政治制度，是我国的政权组织形式。坚持它，就是坚持党的领导、人民当家作主、依法治国有机统一；所以必须坚持，并在实践中不断完善。</p>

<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。每问先自己答一句，再看下面那句。</p>
<div class="gx-qa">

<div class="qac">
<p class="q">「人民代表大会制度是根本政治制度，那基本政治制度到底指什么？」</p>
<p class="a">指另外三项：<b>中国共产党领导的多党合作和政治协商制度、民族区域自治制度、基层群众自治制度</b>。它们和人大制度不在一个层级上：人大制度是根本政治制度，是政体；这三项是基本政治制度。答题时把「根本」安给这三项，或者把人大制度列进基本政治制度，都是错项。记法：<b>根 1 基 3</b>。</p>

<div class="qac">
<p class="q">「民主集中制不就是先民主、后集中吗？」</p>
<p class="a">不是「先……后……」的两步走。课本写的是<b>在民主基础上的集中和在集中指导下的民主相结合</b>：民主是集中的基础，集中是民主的指导和归宿。把它当加法，就会出现两种错答——只讲民主变成「想说什么说什么」，只讲集中变成「少数人拍板」。落到人大制度上，它有<b>三个层面</b>：人大与人民、人大与其他国家机关、中央与地方。</p>

<div class="qac">
<p class="q">「人民代表大会制度，不就是人民代表大会吗？」</p>
<p class="a">一个是<b>机关</b>，一个是<b>制度</b>。人民代表大会是国家权力机关，开会、审议、表决、行使职权；人民代表大会制度是我国的根本政治制度、是政体，它包含四块：国家一切权力属于人民、人民选举代表组成人大、由人大产生其他国家机关、实行民主集中制。答题时问「人大做了什么」写机关，问「为什么是根本政治制度」写制度，两个词不能顶替。</p>

<text x="120" y="118" font-size="8.4" text-anchor="middle" fill="#6b7280">问职权写机关，问地位写制度</text>
</svg>
</div>

<div class="qac">
<p class="q">「我国的国体是人民代表大会制度吧？」</p>
<p class="a">反了。我国的<b>国体是人民民主专政</b>，讲的是国家权力属于谁；<b>人民代表大会制度是政体</b>，讲的是权力怎么组织起来。国体决定政体，政体体现国体。考试常把两个词对调做干扰项：看到「国体」后面跟「人民代表大会制度」，直接排除。记法：<b>国体说谁掌权，政体说怎么组织</b>。</p>

<div class="qac">
<p class="q">「政府由人大产生，所以政府要听人大的领导？」</p>
<p class="a">用词不准。课本讲的是<b>由人大产生、对人大负责、受人大监督</b>：人大统一行使国家权力，政府依法行使行政权，各机关分工不同、职责不同。写成「领导与被领导」，等于把国家权力机关和行政机关的关系写成了上下级，性质就变了。三件套记住：<b>产生、负责、受监督</b>，一个都不能换。</p>

<div class="qac">
<p class="q">「坚持党的领导和坚持人民代表大会制度，会不会打架？」</p>
<p class="a">不会，两者是统一的。党的领导是坚持和完善人大制度的<b>根本政治保证</b>，党支持人大依法行使职权；人大制度是人民当家作主的制度载体，把党的主张通过法定程序变成国家意志。答题时常见的写法是「坚持党的领导、人民当家作主、依法治国有机统一」，这一句把两边都收进去了，只写一头都不完整。</p>

<p class="gx-note">六问其实是同一件事：每一问都在问「这个说法把哪个词换掉了」——根本换成基本、相结合换成相加、机关换成制度、国体换成政体、产生换成领导、党的领导换成对立面。答题时先把这个词还原，再把课本原句写上去，分就回来了。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。先盖住后两行，自己改一遍，再对答案。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 人民代表大会制度是我国的基本政治制度。</p>
<p class="er-v">✓ 人民代表大会制度是我国的根本政治制度，是我国的政权组织形式；基本政治制度是中国共产党领导的多党合作和政治协商制度、民族区域自治制度、基层群众自治制度。</p>
<p class="er-w">错在哪：层级写错。「根本」只有 1 个，「基本」是另外 3 项，两组词不能互换，也不能互相添加。</p>
</div>
<div class="er">
<p class="er-x">✗ 民主集中制就是民主加集中，先民主、后集中。</p>
<p class="er-v">✓ 民主集中制是在民主基础上的集中和在集中指导下的民主相结合的制度。</p>
<p class="er-w">错在哪：把「相结合」写成了「相加」。民主是集中的基础，集中是民主的指导和归宿，两者同时成立，不是两个阶段。</p>
</div>
<div class="er">
<p class="er-x">✗ 人民代表大会制度就是人民代表大会。</p>
<p class="er-v">✓ 人民代表大会是我国的国家权力机关；人民代表大会制度是我国的根本政治制度，包括权力属于人民、选举代表组成人大、由人大产生其他国家机关、实行民主集中制等内容。</p>
<p class="er-w">错在哪：机关和制度混成一个。问职权要写机关，问地位要写制度，主体一错整句都错。</p>
</div>
<div class="er">
<p class="er-x">✗ 我国的国体是人民代表大会制度。</p>
<p class="er-v">✓ 我国的国体是人民民主专政，人民代表大会制度是我国的政体（政权组织形式）。</p>
<p class="er-w">错在哪：国体和政体对调。国体说权力属于谁，政体说权力怎么组织，国体决定政体。</p>
</div>
<div class="er">
<p class="er-x">✗ 政府由人大产生，所以人大和政府是领导与被领导的关系。</p>
<p class="er-v">✓ 国家行政机关由人民代表大会产生，对它负责，受它监督；人大统一行使国家权力，政府依法行使行政权。</p>
<p class="er-w">错在哪：把「产生、负责、受监督」换成了「领导」。这一换，机关之间的关系性质就写错了。</p>
</div>
<div class="er">
<p class="er-x">✗ 人大代表是人民选出来的，所以人大代表就是人民代表大会。</p>
<p class="er-v">✓ 人大代表由人民民主选举产生，对人民负责，受人民监督，是国家权力机关的组成人员；人民代表大会是国家权力机关。</p>
<p class="er-w">错在哪：把一个人写成了一个机关。人大代表个人不能代替人大行使职权，人大集体行使权力。</p>
</div>
<div class="er">
<p class="er-x">✗ 人民代表大会制度的优势就是办事快、效率高。</p>
<p class="er-v">✓ 人民代表大会制度保障了人民当家作主，动员了人民投身于社会主义建设，保证了国家机关协调高效运转，维护了国家统一和民族团结。</p>
<p class="er-w">错在哪：把四条优势缩成一条，还漏掉了「人民当家作主」这个根本。12 分的题这样写，最多拿 3 分。</p>
