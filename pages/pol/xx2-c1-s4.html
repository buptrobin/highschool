<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写课本这句，不写你脑子里那句。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 一般侵权责任的三个要件<span class="q-src">人教版（2019）选择性必修2 法律与生活 · 第一单元第四课</span></p>
<p class="q-b">行为人因过错侵害他人民事权益造成损害的，应当承担侵权责任。依照法律规定推定行为人有过错，其不能证明自己没有过错的，应当承担侵权责任。</p>
<p class="q-n">→ 翻成人话：一般侵权要同时满足三件事。①你的民事权益真的受了损害，人身、财产、精神损害都算；②行为人有过错，故意和过失都算过错，疏忽大意也是过失；③这个过错行为与损害之间有因果关系。三件事少一件，就不能按一般侵权让他赔。答题时把这三件事逐条写在分点开头，判卷老师就是按这三条给分的。第二句是一条例外通道：法律先把过错「推定」给他，他得自己证明自己没有过错。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 不论有无过错都可能担责<span class="q-src">人教版（2019）选择性必修2 法律与生活 · 第一单元第四课</span></p>
<p class="q-b">行为人造成他人民事权益损害，不论行为人有无过错，法律规定应当承担侵权责任的，依照其规定。</p>
<p class="q-n">→ 翻成人话：关键在「法律规定」四个字。无过错责任不是「出了事就赔」，而是法律点名的几类才这样，比如产品存在缺陷致人损害、饲养的动物致人损害、污染环境、高度危险作业。判断时先问一句：这类事法律有没有单独规定？有，就按特殊规则走；没有，才回到一般侵权去看过错。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 权利行使有边界<span class="q-src">人教版（2019）选择性必修2 法律与生活 · 第一单元第四课</span></p>
<p class="q-b">民事主体不得滥用民事权利损害国家利益、社会公共利益或者他人合法权益。</p>
<p class="q-n">→ 翻成人话：这句话管两件事。一是「我的权利」到别人的权利那儿就停：你在家唱歌、装摄像头、在阳台堆东西，都不能越过邻居应当被保护的限度。二是不动产之间还有一套专门规则，叫相邻关系，按有利生产、方便生活、团结互助、公平合理四项原则处理，不是谁嗓门大谁有理，也不是「我的房子我想怎样就怎样」。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>过错责任（一般）</th><th>过错推定</th><th>无过错责任</th></tr></thead>
<tbody>
<tr><td>过错由谁证明</td><td>受害人举证，证明对方有过错</td><td>先推定他有过错，由他自己证明没有</td><td>不必证明过错，只看损害与因果关系</td></tr>
<tr><td>常见情形</td><td>打人、诽谤、弄坏别人的东西</td><td>广告牌脱落、动物园动物致害</td><td>产品缺陷、饲养动物、环境污染、高度危险</td></tr>
<tr><td>怎么才能不担责</td><td>证明自己没有过错，就不担责</td><td>证明自己没有过错，才不担责</td><td>只有法律规定的免责事由才免责</td></tr>
<tr class="key"><td>一句话记法</td><td>谁主张，谁举证</td><td>举证责任倒过来</td><td>不问过错，只问法律有没有规定</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">高亮的那一行，才是这张表真正要背的东西：先定类型，再定责任主体，最后写免责事由——顺序反了，分就丢。三个原则的名字不用一字不差，判卷看的是你有没有写出「谁举证」这层意思。另外两个常考数字顺手记：向人民法院请求保护民事权利的诉讼时效期间一般为三年；侵权是民事问题，和「犯罪」不是一套体系。</p>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 材料分析：高空抛物致害谁来担责<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">某小区一栋高层住宅，一只花盆从楼上坠落，砸伤正在楼下行走的李某，医疗费花了数万元。公安机关介入调查，但该栋楼监控损坏，无法确定具体是哪一户的花盆。李某要求整栋楼的住户共同赔偿，物业公司称自己没有责任。结合材料，分析本案中侵权责任应当如何承担。（本题只问民事责任，不涉及刑事问题。）</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性</p>
<p class="s-b">先定性质：这是民事侵权，不是刑事案件。问的是「谁担责、凭什么、担什么责」。材料里出现「砸伤」「医疗费」，指向人身损害赔偿。定性错了，后面每一条都白写。</p>
<p class="s-k">用到：侵权责任、民事权益。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 找主体</p>
<p class="s-b">列出四方：受害人李某；可能加害的建筑物使用人，也就是这栋楼的住户；物业服务企业；公安机关。每一方在答案里都要有位置，漏掉物业，通常会丢一个要点。主体找全，答案才有骨架。</p>
<p class="s-k">用到：侵权人、可能加害的建筑物使用人、物业服务企业。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 找行为与因果</p>
<p class="s-b">行为是花盆从建筑物坠落，后果是李某受伤、支出医疗费，两者之间有因果关系。这里要分清：抛掷是有人主动扔，坠落的举证思路不同，材料只给了坠落和监控损坏。看清材料给的是哪一种，再决定写哪条规则。</p>
<p class="s-k">用到：损害事实、因果关系。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 对应规则</p>
<p class="s-b">能确定具体侵权人的，由他承担；经调查难以确定的，除能证明自己不是侵权人的，由可能加害的建筑物使用人给予补偿，补偿后有权向侵权人追偿；物业未采取必要安全保障措施的，承担相应的侵权责任。这里是本题的重心，规则写完记得回扣材料一句。</p>
<p class="s-k">用到：过错责任、过错推定、安全保障义务。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口</p>
<p class="s-b">按「一般规定 → 具体侵权人 → 难以确定时的补偿 → 物业义务 → 责任方式」分点写。每点先写规则，再回扣材料一句话，最后落到赔偿医疗费等具体方式。格式上①②③分行，每条不超过两行。</p>
<p class="s-k">用到：责任方式、追偿。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">①行为人因过错侵害他人民事权益造成损害的，应当承担侵权责任。本案花盆坠落致李某受伤，属于侵权，应承担侵权责任。②能够确定具体侵权人的，由侵权人承担侵权责任。③经调查难以确定具体侵权人的，除能够证明自己不是侵权人的外，由可能加害的建筑物使用人给予补偿；补偿后有权向侵权人追偿。本案监控损坏、无法确定具体抛物人，李某可要求可能加害的住户补偿，住户能证明自己不是侵权人的除外。④物业服务企业等建筑物管理人应当采取必要的安全保障措施，未采取造成损害的，依法承担未履行安全保障义务的侵权责任。⑤公安机关应当依法及时调查，查清责任人。⑥责任方式包括赔偿医疗费等损失，可以单独适用，也可以合并适用。⑦住户主张自己不是侵权人的，应当就该主张提供证据；不能证明的，仍应给予补偿。所以材料里「整栋楼共同赔偿」的说法并不准确。</p>
</div>
</div>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「侵权和犯罪是一回事吗？」</p>
<p class="a">不是。侵权是民事违法行为，承担侵权责任，解决的是赔不赔、赔多少、怎么赔，依据是民法典；犯罪是触犯刑法、应受刑罚处罚的行为，解决的是定罪量刑。同一次伤害可能两条线一起走：打人致伤，既要赔医疗费，也可能被追究刑事责任。<b>判断看侵犯的是民事权益，还是刑法保护的社会关系</b>。答题时先说「这是民事侵权」，再写责任怎么承担，别一上来就写「要判刑」。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="侵权与犯罪分属民事与刑事两条线">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<rect x="20" y="24" width="96" height="52" rx="6" fill="#ffffff" stroke="#b8e6d0"/>
<text x="68" y="44" text-anchor="middle" font-size="9" font-weight="700" fill="#1d5c46">侵权</text>
<text x="68" y="58" text-anchor="middle" font-size="8.2" fill="#3a3a35">民事·赔与不赔</text>
<text x="68" y="70" text-anchor="middle" font-size="8.2" fill="#3a3a35">依据民法典</text>
<rect x="124" y="24" width="96" height="52" rx="6" fill="#ffffff" stroke="#e6c9c9"/>
<text x="172" y="44" text-anchor="middle" font-size="9" font-weight="700" fill="#8a3030">犯罪</text>
<text x="172" y="58" text-anchor="middle" font-size="8.2" fill="#3a3a35">刑事·定罪量刑</text>
<text x="172" y="70" text-anchor="middle" font-size="8.2" fill="#3a3a35">依据刑法</text>
<text x="120" y="100" text-anchor="middle" font-size="8.4" fill="#6a7580">同一次伤害，可能两条线一起走</text>
</svg>
</div>
<div class="qac">
<p class="q">「我没有过错，也要赔钱吗？」</p>
<p class="a">要看类型。一般侵权适用过错责任，没有过错就不担责；法律明确规定不论有无过错都应担责的，没有过错也要担，比如产品缺陷、饲养动物、环境污染、高度危险作业；还有过错推定，先推定他有过错，他证明不了自己没错就得担。<b>先定类型，再谈过错</b>，顺序不能反。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="有过错与没过错的两条路径">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="30" text-anchor="middle" font-size="9" font-weight="700" fill="#151a21">有没有过错，先看是哪一类</text>
<rect x="24" y="44" width="88" height="42" rx="6" fill="#ffffff" stroke="#b8e6d0"/>
<text x="68" y="62" text-anchor="middle" font-size="8.8" font-weight="700" fill="#1d5c46">有过错</text>
<text x="68" y="76" text-anchor="middle" font-size="8.2" fill="#3a3a35">一般要担责</text>
<rect x="128" y="44" width="88" height="42" rx="6" fill="#ffffff" stroke="#e6d3b8"/>
<text x="172" y="62" text-anchor="middle" font-size="8.8" font-weight="700" fill="#6b4a1f">没过错</text>
<text x="172" y="76" text-anchor="middle" font-size="8.2" fill="#3a3a35">法律点了名才担</text>
<text x="120" y="106" text-anchor="middle" font-size="8.2" fill="#6a7580">过错推定：先推给他，他自证才免</text>
</svg>
</div>
<div class="qac">
<p class="q">「赔了钱，责任就承担完了吗？」</p>
<p class="a">不止。承担侵权责任的方式有停止侵害、排除妨碍、消除危险、返还财产、恢复原状、赔偿损失、赔礼道歉、消除影响、恢复名誉等，<b>可以单独适用，也可以合并适用</b>。材料里说「把视频删了」「公开道歉」「把墙修好」，都是在挑方式，不是每一问都答赔钱。方式选对了，答案才贴着材料走。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="八种责任方式并列，赔偿只是其中一种">

<text x="120" y="30" text-anchor="middle" font-size="9" font-weight="700" fill="#151a21">八个格子里，钱只占一个</text>
<rect x="24" y="44" width="20" height="26" rx="3" fill="#ffffff" stroke="#b8e6d0"/>
<rect x="48" y="44" width="20" height="26" rx="3" fill="#ffffff" stroke="#b8e6d0"/>
<rect x="72" y="44" width="20" height="26" rx="3" fill="#ffffff" stroke="#b8e6d0"/>
<rect x="96" y="44" width="20" height="26" rx="3" fill="#ffffff" stroke="#b8e6d0"/>
<rect x="120" y="44" width="20" height="26" rx="3" fill="#ffd9a8" stroke="#e0b070"/>
<rect x="144" y="44" width="20" height="26" rx="3" fill="#ffffff" stroke="#b8e6d0"/>
<rect x="168" y="44" width="20" height="26" rx="3" fill="#ffffff" stroke="#b8e6d0"/>
<rect x="192" y="44" width="20" height="26" rx="3" fill="#ffffff" stroke="#b8e6d0"/>
<text x="120" y="92" text-anchor="middle" font-size="8.2" fill="#6a7580">停·排·消·还·恢·赔·歉·名</text>
<text x="120" y="108" text-anchor="middle" font-size="8.2" fill="#6a7580">可单用，也可合用</text>
</svg>
</div>
<div class="qac">
<p class="q">「找不到抛物的人，整栋楼都得赔吗？」</p>
<p class="a">不是「整栋楼都赔」。经调查难以确定具体侵权人的，除能够证明自己不是侵权人的以外，由可能加害的建筑物使用人给予补偿；是补偿，不是赔偿，补偿后有权向真正的侵权人追偿；物业服务企业未尽安全保障义务的，另行担责。<b>三个限定词：可能加害、能自证免责、可追偿</b>。住户说自己不是侵权人，得自己拿证据；补偿之后，真正的侵权人还要被追回来。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="整栋楼中只有可能加害的住户补偿">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="30" text-anchor="middle" font-size="9" font-weight="700" fill="#151a21">找不到人，不等于没人负责</text>
<rect x="86" y="42" width="68" height="52" rx="4" fill="#ffffff" stroke="#cfe0ee"/>
<rect x="96" y="52" width="12" height="10" rx="2" fill="#eef4f9" stroke="#9db4c6"/>
<rect x="114" y="52" width="12" height="10" rx="2" fill="#eef4f9" stroke="#9db4c6"/>
<rect x="132" y="52" width="12" height="10" rx="2" fill="#ffd9a8" stroke="#e0b070"/>
<rect x="96" y="72" width="12" height="10" rx="2" fill="#eef4f9" stroke="#9db4c6"/>
<rect x="114" y="72" width="12" height="10" rx="2" fill="#eef4f9" stroke="#9db4c6"/>
<rect x="132" y="72" width="12" height="10" rx="2" fill="#ffd9a8" stroke="#e0b070"/>
<text x="120" y="112" text-anchor="middle" font-size="8.2" fill="#6a7580">可能加害的使用人补偿，可追偿</text>
</svg>
</div>
<div class="qac">
<p class="q">「我家狗拴了绳，咬人还担责吗？」</p>
<p class="a">仍可能担责。饲养的动物造成他人损害的，动物饲养人或者管理人承担侵权责任；能证明损害是因被侵权人故意或者重大过失造成的，可以不承担或者减轻责任。违反管理规定、没有采取安全措施（比如没拴绳）的，责任更重，只有被侵权人故意时才可能减轻。<b>责任主体是人，不是狗</b>。所以「我拴了绳」不是免责理由，最多是可能减轻。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="拴绳与没拴绳，责任都在饲养人">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="30" text-anchor="middle" font-size="9" font-weight="700" fill="#151a21">绳子解不解释责任主体</text>
<rect x="24" y="44" width="90" height="44" rx="6" fill="#ffffff" stroke="#e6c9c9"/>
<text x="69" y="62" text-anchor="middle" font-size="8.8" font-weight="700" fill="#8a3030">没拴绳</text>
<text x="69" y="78" text-anchor="middle" font-size="8.2" fill="#3a3a35">仍担责，难减轻</text>
<rect x="126" y="44" width="90" height="44" rx="6" fill="#ffffff" stroke="#b8e6d0"/>
<text x="171" y="62" text-anchor="middle" font-size="8.8" font-weight="700" fill="#1d5c46">拴了绳</text>
<text x="171" y="78" text-anchor="middle" font-size="8.2" fill="#3a3a35">仍担责，可减免</text>
<text x="120" y="108" text-anchor="middle" font-size="8.2" fill="#6a7580">减免条件：被侵权人故意或重大过失</text>
</svg>
</div>
<div class="qac">
<p class="q">「我在自己家里做事，也会越界吗？」</p>
<p class="a">会。民事主体不得滥用民事权利损害国家利益、社会公共利益或者他人合法权益；不动产相邻方还要按有利生产、方便生活、团结互助、公平合理的原则处理相邻关系。深夜电钻、摄像头正对邻居家门、阳台往下滴水，都可能越界。<b>权利到你门口为止，不是到我家墙为止</b>。相邻关系不是让你一味忍让，而是给你一套可以谈的标准。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="自家权利与邻居权利的界线">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="120" y1="20" x2="120" y2="88" stroke="#c9a86a" stroke-width="1.4" stroke-dasharray="4 3"/>
<rect x="24" y="36" width="80" height="46" rx="6" fill="#ffffff" stroke="#b8e6d0"/>
<text x="64" y="56" text-anchor="middle" font-size="8.8" font-weight="700" fill="#1d5c46">我的房子</text>
<text x="64" y="70" text-anchor="middle" font-size="8.2" fill="#3a3a35">不是想怎样就怎样</text>
<rect x="136" y="36" width="80" height="46" rx="6" fill="#ffffff" stroke="#cfe0ee"/>
<text x="176" y="56" text-anchor="middle" font-size="8.8" font-weight="700" fill="#1f4d6b">邻居的权利</text>
<text x="176" y="70" text-anchor="middle" font-size="8.2" fill="#3a3a35">到这里为止</text>
<text x="120" y="102" text-anchor="middle" font-size="8.2" fill="#6a7580">相邻关系：有利生产、方便生活</text>
<text x="120" y="116" text-anchor="middle" font-size="8.2" fill="#6a7580">团结互助、公平合理</text>
</svg>
</div>
</div>
<p class="gx-note">六问看着散，其实是同一件事：法律把不利后果分配给「谁能控制风险、谁有过错、谁得到了利益」的那个人。所以答题永远是三步——先答属于哪一类，再答谁担责，最后答担什么责。把这三步练成条件反射，材料题就有了固定的落笔顺序。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 侵权就是犯罪，要负刑事责任。</p>
<p class="er-v">✓ 侵权是民事违法行为，承担侵权责任；只有触犯刑法、应受刑罚处罚的才是犯罪。</p>
<p class="er-w">错在把两套体系混成一套：侵权解决赔不赔，犯罪解决定不定罪。同一个行为可能两者都占，但不能画等号。答题时先把「民事」两个字写出来。</p>
</div>
<div class="er">
<p class="er-x">✗ 我没有过错，所以一分钱都不用赔。</p>
<p class="er-v">✓ 法律规定不论行为人有无过错都应承担侵权责任的，依照其规定。</p>
<p class="er-w">错在只记了一般侵权。产品缺陷、饲养动物、环境污染、高度危险这几类不看过错，先定类型再谈免责。特殊侵权的题，判卷就看你会不会先说类型。</p>
</div>
<div class="er">
<p class="er-x">✗ 赔了钱，侵权责任就承担完了。</p>
<p class="er-v">✓ 承担方式还有停止侵害、排除妨碍、消除危险、返还财产、恢复原状、赔礼道歉、消除影响、恢复名誉等，可单独或合并适用。</p>
<p class="er-w">错在把赔偿当成唯一方式。材料问「怎么办」，先想到停手、消除危险、道歉，比直接写赔钱更贴材料。八种方式的名字，至少记住三种。</p>
</div>
<div class="er">
<p class="er-x">✗ 找不到抛物的人，整栋楼的住户都得赔。</p>
<p class="er-v">✓ 经调查难以确定具体侵权人的，除能证明自己不是侵权人的以外，由可能加害的建筑物使用人给予补偿，补偿后可向侵权人追偿。「可能加害」限定范围，「补偿」限定性质。</p>
<p class="er-w">错在三处：把范围从「可能加害」扩大到「整栋」；把「补偿」写成「赔偿」；漏掉自证免责和追偿。这三个词是采分点。</p>
</div>
<div class="er">
<p class="er-x">✗ 狗咬人是狗的错，跟我这个主人没关系。</p>
<p class="er-v">✓ 饲养的动物造成他人损害的，动物饲养人或者管理人应当承担侵权责任。</p>
<p class="er-w">错在找错了责任主体。动物不是法律上的责任主体，责任落在饲养人、管理人身上；减免只出现在被侵权人故意或重大过失时。</p>
</div>
<div class="er">
<p class="er-x">✗ 产品有缺陷，只能找厂家，找商家没用。</p>
<p class="er-v">✓ 因产品存在缺陷造成他人损害的，被侵权人可以向产品的生产者请求赔偿，也可以向产品的销售者请求赔偿。</p>
<p class="er-w">错在丢掉选择权。这条是给受害人的方便：谁近找谁；赔完以后，生产者和销售者之间再按过错追偿，那是他们内部的事。选择题里出现「只能」两个字，往往是错的信号。</p>
</div>
<div class="er">
<p class="er-x">✗ 在自己家里，我想干什么就干什么。</p>
<p class="er-v">✓ 民事主体不得滥用民事权利损害国家利益、社会公共利益或者他人合法权益；相邻不动产按四项原则处理相邻关系。</p>
<p class="er-w">错在把所有权当成没有边界。权利行使有界限，越界就是侵权；漏水、噪音、采光、通行这些相邻纠纷，先按四项原则谈。谈不成，再找物业、社区，最后才是法院。</p>
</div>
