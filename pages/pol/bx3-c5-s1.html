<p class="gx-lede">每年三月，人民大会堂里有一项固定动作：政府工作报告摆上桌，几千名代表按下表决键。你在新闻里看到的“某部法律表决通过”“计划报告获批准”“部长被任命”，都出自同一个机关——人民代表大会。第四课讲国体，回答“谁当家”；第五课讲政体，回答“怎么当家”；这一框先把人大这个国家权力机关本身讲清楚。最容易错的一件事：把全国人大、全国人大常委会、人大代表、政协委员、“一府一委两院”全混成“人大”。先记一句：人大是权力机关，其他机关由它产生、对它负责、受它监督。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">这一框的答案压在三个词上：最高、四项职权、对人民负责。先照抄课本，再拆关键词；答题时写课本那句，不写你脑子里那句。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 人民怎样行使国家权力<span class="q-src">人教版（2019）必修3 政治与法治 · 第五课第一框</span></p>
<p class="q-b">我国是人民民主专政的社会主义国家，国家的一切权力属于人民。人民行使国家权力的机关是全国人民代表大会和地方各级人民代表大会。人民通过民主选举选出代表，组成各级人民代表大会作为国家权力机关，代表人民统一行使国家权力。</p>
<p class="q-n">→ 翻成人话：这条链有四步。①权力属于人民，这是源头；②人民通过民主选举选出代表；③代表组成各级人民代表大会；④人大代表人民统一行使国家权力。“统一”两个字最容易被忽略：人大统一掌握国家权力，但不代替政府执法、不代替法院办案。答题时问“人民怎样行使国家权力”，四步都要写，只写“人民当家作主”太空。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 全国人大的性质与职权<span class="q-src">人教版（2019）必修3 政治与法治 · 第五课第一框</span></p>
<p class="q-b">全国人民代表大会是最高国家权力机关，在我国国家机构中居于最高地位。全国人民代表大会行使立法权、决定权、任免权、监督权。全国人民代表大会常务委员会是全国人民代表大会的常设机关，在全国人民代表大会闭会期间，行使全国人民代表大会的部分职权。</p>
<p class="q-n">→ 翻成人话：这句话有三个判断，考试就考这三个。①“最高”只属于全国人大，地方人大是地方国家权力机关，不能加“最高”；②四项职权是立法权、决定权、任免权、监督权，顺序可以换，名称不能造；③常委会是常设机关，闭会期间行使“部分”职权，它不是“第二个人大”，更不能写成“最高国家权力机关”。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 人大代表的地位、权利与义务<span class="q-src">人教版（2019）必修3 政治与法治 · 第五课第一框</span></p>
<p class="q-b">全国人民代表大会代表是最高国家权力机关的组成人员，地方各级人民代表大会代表是地方各级国家权力机关的组成人员。人大代表由人民民主选举产生，对人民负责，受人民监督。人大代表享有审议权、表决权、提案权、质询权。人大代表必须协助宪法和法律的实施，与人民群众保持密切联系，听取和反映人民群众的意见和要求，努力为人民服务，对人民负责，并接受人民监督。</p>
<p class="q-n">→ 翻成人话：先把身份认准：代表是国家权力机关的组成人员，不是“官”，也不是公务员。再分两块：权利四项——审议权、表决权、提案权、质询权，是开会时用的；义务一串——协助宪法法律实施、密切联系群众、听取反映意见、为人民服务、受人民监督，是平时做的。权利和义务合起来，才是完整的代表。</p>
</div>

<p class="gx-note">三个主体三顶帽子，别戴错：全国人大是“最高国家权力机关”，常委会是“常设机关”，人大代表是“组成人员”。记法：问“谁最高”答全国人大，问“闭会期间谁干活”答常委会，问“谁代表人民去开会”答人大代表。整张表只高亮一行——真正的区别：三者管的范围不同，不是一个机构的三块牌子。考选择题时还有一顶帽子要分清：人民代表大会制度是我国的根本政治制度，人民代表大会只是国家权力机关，一个是制度，一个是机关。</p>
</section>

<p class="gx-take">四项职权的分界线是对象，不是动词；“审议”既可能出现在决定权里，也可能出现在监督权里。</p>
<p class="gx-note">批准国民经济和社会发展计划、批准预算，是决定权；听取和审议计划执行情况、预算执行情况的报告，是监督权。同样是“计划”“预算”，一个在事前拍板，一个在事后检查。这个区别考过很多次，答题时把“批准”和“听取审议”两个动作圈出来，就不会写反。再补一个：决定战争与和平的问题，也是决定权，不要因为出现“战争”就写成监督权。</p>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点“下一步”。五步走完，答案的架子就搭好了。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 措施类材料题<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">材料：某市人大代表李某每月到社区人大代表联络站接待群众，把老旧小区加装电梯、停车难等问题记在本子上。市人民代表大会开会期间，他联名提出《关于加快老旧小区改造的建议》。闭会期间，他参加市人大常委会组织的专题调研，对相关部门提出询问。年底，他向原选区选民述职，接受评议。结合材料，说明人大代表应如何履职。（12 分）</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性</p>
<p class="s-b">题型是“措施／做法”类，问“应如何履职”，知识范围锁定“人大代表的地位、权利与义务”。主体是人大代表个人，不是人大，也不是人大常委会。先在草稿上写三个词：身份、权利、义务，每格留行填材料。</p>
<p class="s-k">用到：人大代表的地位、权利与义务</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 找主体</p>
<p class="s-b">材料里只有一个主体：市人大代表李某。答题时主语统一写“人大代表”，不要一会儿写“人大”，一会儿写“代表”，更不要写成“政协委员”。主体一换，权利和义务整套都换，这是本题第一个分水岭。</p>
<p class="s-k">用到：人大代表是国家权力机关的组成人员</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 找行为</p>
<p class="s-b">按时间把动作排开：接待群众、记录问题，是联系群众、听取意见；联名提出建议，是行使提案权；参加专题调研、提出询问，是行使质询权、参加行使国家权力；向选民述职、接受评议，是接受人民监督。四个动作，正好落在权利和义务两侧。</p>
<p class="s-k">用到：提案权、质询权、密切联系群众、受人民监督</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 对应知识</p>
<p class="s-b">一动作对一术语：接待群众 → 与人民群众保持密切联系、听取和反映意见；提建议 → 提案权；调研询问 → 质询权；述职评议 → 对人民负责、受人民监督。材料没给的“审议权、表决权”不要硬塞，塞了反而显得模板化。</p>
<p class="s-k">用到：权利与义务的具体内容</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口</p>
<p class="s-b">开头一句定性：人大代表由人民民主选举产生，对人民负责，受人民监督。中间分点，每点“术语 + 材料事实”两截。结尾回扣：代表履职不是“开会举举手”，闭会期间也要联系群众、推动落实。</p>
<p class="s-k">用到：观点与材料相结合的答题规范</p>
</li>
</ol>

<p class="ans-b">① 人大代表由人民民主选举产生，对人民负责，受人民监督。李某向原选区选民述职、接受评议，体现了代表对人民负责、自觉接受监督。<br>② 人大代表应与人民群众保持密切联系，听取和反映人民群众的意见和要求。李某每月到社区联络站接待群众，把加装电梯、停车难记在本子上，就是在了解民情、反映民意。<br>③ 人大代表依法行使提案权。李某在市人民代表大会开会期间联名提出建议，把群众诉求转化为议案建议，推动问题进入决策程序。<br>④ 人大代表依法行使质询权等权利，参加行使国家权力。李某参加专题调研、对相关部门提出询问，督促国家机关改进工作。<br>⑤ 人大代表要努力为人民服务，协助宪法和法律的实施。代表不仅要“会上发言”，闭会期间也要调研、宣传法律、推动落实。<br>⑥ 人大代表没有超越法律的特权，必须模范遵守宪法和法律，接受人民监督，做人民利益的代言人。</p>

<p class="a">人大是国家权力机关，<b>不是行政机关，也不是司法机关</b>。政府、监委、法院、检察院由人大产生，对人大负责，受人大监督；人大不代行它们的职权。</p>

<p class="q">「听取和审议政府工作报告，是决定权还是监督权？」</p>
<p class="a"><b>监督权</b>。决定权是对重大事项作出决定，如批准计划、预算、决定战争与和平；听取审议报告是检查工作，属于监督。判据是对象，不是动词。</p>

<div class="qac">
<p class="q">「人大代表的权利，就是人大的职权吗？」</p>
<p class="a">不是。立法权、决定权、任免权、监督权是<b>人大的职权</b>；审议权、表决权、提案权、质询权是<b>代表个人的权利</b>。代表个人不能立法，也不能代替人大任免国家机关领导人员。</p>

<p class="a">不是官，是<b>国家权力机关的组成人员</b>。代表由人民民主选举产生，对人民负责，受人民监督；要密切联系群众、听取反映意见、为人民服务。</p>

<p class="gx-note">六问其实是同一件事：都在问“谁在行使国家权力、行使哪一项、对谁负责”。把“主体—职权—对象”三个格子填满，选择题能排掉干扰项，材料题能写出采分点。答这类题有个固定动作：先定主体（人大、常委会、代表、政府），再定职权或权利，最后回扣“对人民负责、受人民监督”。六问里最容易错的是第三问和第五问：把人大当成政府，把代表的权利当成人大的职权。这两处一错，整段答案的主体就塌了。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。先盖住后两行，自己说一遍，再对答案。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 全国人大常委会是全国人大的常设机关，所以它也能行使最高国家权力。</p>
<p class="er-v">✓ 全国人民代表大会是最高国家权力机关；全国人大常委会是它的常设机关，闭会期间行使部分职权，不能等同。</p>
<p class="er-w">错在哪：把“常设”当成“最高”。常委会的权力来自全国人大，是“部分”，不是“全部”。</p>
</div>
<div class="er">
<p class="er-x">✗ 人大代表和政协委员都是人民选出来的，都行使国家权力。</p>
<p class="er-v">✓ 人大代表由人民民主选举产生，组成国家权力机关，行使国家权力；政协委员由协商推荐产生，履行政治协商、民主监督、参政议政职能，不行使国家权力。</p>
<p class="er-w">错在哪：产生方式和职能都不同，一句话把两个主体并成了一个。</p>
</div>
<div class="er">
<p class="er-x">✗ 人民代表大会是行政机关，政府是国家的权力机关。</p>
<p class="er-v">✓ 人民代表大会是国家权力机关；政府是行政机关，由人大产生，对人大负责，受人大监督。</p>
<p class="er-w">错在哪：机关性质对调。人大管“定”，政府管“执行”，不能互换。</p>
</div>
<div class="er">
<p class="er-x">✗ 全国人大听取和审议政府工作报告，是在行使决定权。</p>
<p class="er-v">✓ 这是行使监督权；决定权是对重大事项作出决定，如批准计划、预算、决定战争与和平。</p>
<p class="er-w">错在哪：看见“审议”就写决定权。判据是对象：报告是检查工作，重大事项才是拍板。</p>
</div>
<div class="er">
<p class="er-x">✗ 人大代表个人可以制定法律，所以人大代表享有立法权。</p>
<p class="er-v">✓ 立法权是人大的职权；人大代表个人享有审议权、表决权、提案权、质询权，不能个人立法。</p>
<p class="er-w">错在哪：把机关职权安到个人头上。代表是“参加行使国家权力”，不是“代替人大”。</p>
</div>
<div class="er">
<p class="er-x">✗ 人民代表大会制度就是人民代表大会。</p>
<p class="er-v">✓ 人民代表大会是国家权力机关；人民代表大会制度是我国的根本政治制度，是我国的政体。</p>
<p class="er-w">错在哪：一个是机关，一个是制度。问“根本政治制度”答人民代表大会制度，不能只答“人民代表大会”。</p>
</div>
<div class="er">
<p class="er-x">✗ 人大代表是人民选出来的“官”，可以自己拍板决定社区的事。</p>
<p class="er-v">✓ 人大代表是国家权力机关的组成人员，代表人民行使国家权力，必须对人民负责、受人民监督，没有超越法律的特权。</p>
<p class="er-w">错在哪：把代表当成行政干部。代表个人不能拍板，重大事项要按法定程序由人大或政府决定。</p>
</div>
