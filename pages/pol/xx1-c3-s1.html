<div class="gx-meta">
<span><i></i>人教版（2019）选择性必修1 当代国际政治与经济 · 第三单元 第五课</span>

<p class="gx-lede">你手里的手机，屏幕可能来自韩国，芯片由几个国家的工厂分工完成，最后在中国组装，再卖到欧洲。一部手机背后，是一条跨了几十个国家的产业链。这一节讲的就是这种「你中有我、我中有你」的经济联系：它带来什么好处，又带来什么麻烦，我们该怎么看待它。它在第三单元的开头，后面第六课讲「对外开放」，讲的就是中国怎么接这一招。最容易错的一件事，是把经济全球化直接当成「西化、美国化」，或者以为它只让发达国家占便宜。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写课本这句，不写你脑子里那句。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 经济全球化的含义与表现<span class="q-src">人教版（2019）选择性必修1 · 第三单元 第五课</span></p>
<p class="q-b">经济全球化是指商品、服务、生产要素等跨国界流动的规模与形式不断增加，各国经济日益相互依赖、相互联系的趋势。经济全球化主要表现为生产全球化、贸易全球化和资本全球化。</p>
<p class="q-n">→ 翻成人话：这句话里有<b>三个条件</b>。①流动的东西是商品、服务、生产要素（资本、技术、劳动力都算生产要素）；②流动的范围是「全球」，不是只跟几个邻国做生意；③结果是各国经济相互依赖、相互联系。<b>少了「相互依赖」，就只剩「对外贸易」；少了「全球」，就只剩「区域合作」。</b>材料题问「体现了什么」，把这三层写全，比写一句「各国做生意」多拿分。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 经济全球化的积极影响<span class="q-src">人教版（2019）选择性必修1 · 第三单元 第五课</span></p>
<p class="q-b">经济全球化促进了生产要素在全球范围内的流动、国际分工水平的提高和国际贸易的迅速发展，从而推动了世界范围内资源配置效率的提高、各国生产力的发展，为各国经济提供了更加广阔的发展空间。</p>
<p class="q-n">→ 翻成人话：这是一条<b>因果链</b>，不是四个并列的词。要素流动 → 国际分工水平提高 → 国际贸易发展 → 资源配置效率提高、各国生产力发展 → 发展空间变大。答题时按链条写，把「促进了什么、从而推动了什么」写出来，别只答「促进经济发展」五个字。这一句也是「机遇」的标准答案，背的时候连「从而」一起背。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 经济全球化的挑战与正确态度<span class="q-src">人教版（2019）选择性必修1 · 第三单元 第五课</span></p>
<p class="q-b">经济全球化使世界经济发展更加不平衡，两极分化更加严重；加剧了全球经济的不稳定性，尤其对发展中国家的经济安全构成了极大的威胁。我们应当抓住机遇、迎接挑战，趋利避害，推动经济全球化朝着更加开放、包容、普惠、平衡、共赢的方向发展。</p>
<p class="q-n">→ 翻成人话：注意<b>「尤其」</b>两个字——风险不是平均分摊的，发展中国家承受得更多。但课本没有说「所以不要全球化」，而是给了八个字的动作：<b>抓住机遇、迎接挑战</b>，再加十个字的方向：<b>开放、包容、普惠、平衡、共赢</b>。这两组词是主观题的高频采分点，抄也要抄对顺序。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>生产全球化</th><th>贸易全球化</th><th>资本全球化</th></tr></thead>
<tbody>
<tr><td>跨过国界的</td><td>工序和环节</td><td>商品和服务</td><td>资金和股权</td></tr>
<tr><td>材料里常见词</td><td>跨国公司、海外工厂、代工、全球采购</td><td>出口进口、跨境电商、订单、展会</td><td>投资建厂、跨国并购、外资、对外投资</td></tr>
<tr class="key"><td>真正的区别</td><td>一件产品在多个国家造出来</td><td>造好的东西卖到别国去</td><td>钱在别国变成厂房和股份</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">这张表只记一行——<b>「真正的区别」</b>那一行。考材料题时先在材料里找「跨过国界的是什么」：是工序，写生产全球化；是商品，写贸易全球化；是钱，写资本全球化。技术、信息、人才的流动，通常跟生产全球化一起说，不要硬凑成「第四种表现」当成教材原文写。选择题里最常见的干扰项，就是把「资本全球化」的例子（海外建厂、并购）说成生产全球化——建厂之后才生产，但跨过国界的那一步是钱。</p>
</section>

<p class="ex-q">近年来，某品牌手机的设计在甲国完成，芯片由乙国企业生产，零部件来自多个国家，最后在丙国组装，再销往全球。与此同时，一些国家以「国家安全」为由，对芯片等产品实施出口管制、加征关税，全球产业链受到冲击。结合材料，运用经济全球化的知识，说明应如何正确认识经济全球化的影响。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性</p>
<p class="s-b">设问是「如何正确认识……影响」，属于认识类加影响类。答题框架固定三步：<b>是什么（表现）→ 为什么（机遇与挑战）→ 怎么办（态度）</b>。先在草稿上写下这三个词，再动笔。</p>
<p class="s-k">用到：经济全球化的表现、影响、正确态度。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 找主体</p>
<p class="s-b">材料里有两类主体：组织全球生产的<b>跨国公司</b>，设置管制、加征关税的<b>国家</b>。主体不同，对应的知识点也不同，别混成一段写。</p>
<p class="s-k">用到：跨国公司是经济全球化的重要载体。</p>

<li class="step" hidden>

<p class="s-b">三种行为：跨境分工生产、出口管制、加征关税。前者是「表现」，后两者是「挑战」的具体形式——它们都发生在相互依存的链条上。</p>
<p class="s-k">用到：生产全球化、风险传导、贸易保护主义。</p>

<p class="s-b">分工生产 → 生产全球化与全球产业链；管制与关税 → 相互依存下的风险传导、贸易摩擦。还要补一句定性：经济全球化是<b>社会生产力发展的客观要求和科技进步的必然结果</b>。</p>

</li>
<li class="step" hidden>

<p class="s-k">用到：趋利避害、合作共赢、人类命运共同体。</p>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">经济全球化不就是西化、美国化吗？</p>
<p class="a">不是。经济全球化是<b>商品、服务、生产要素在全球流动、各国经济相互依赖</b>的趋势，它是社会生产力发展的客观要求和科技进步的必然结果，不是哪个国家的模式输出。规则至今仍由发达国家主导，这是「国际经济旧秩序」的问题，要改；但把全球化直接等同于西化，就把<b>趋势</b>和<b>规则由谁定</b>混成了一件事。做题时先问一句：材料讲的是各国互相做生意，还是各国被同一个模式改造？</p>

<div class="qac">
<p class="q">经济全球化只对发达国家有利，对吗？</p>
<p class="a">不对，但也不能说「人人均等」。发达国家凭技术、品牌、规则优势拿走更多附加值；发展中国家能引进<b>资金、技术、管理经验</b>，接入全球市场，同样有发展机会。差别在于<b>能不能接住</b>：产业基础、劳动力素质、基础设施、开放政策，决定机遇变成多少实惠。卷子上出现「只」「全都」这类绝对词，先警惕。</p>

<div class="qac">
<p class="q">逆全球化、加关税，不是在解决问题吗？</p>
<p class="a">方向错了。加关税能短期护住一个行业，但<b>成本上升、链条断裂、蛋糕变小</b>，最后谁都不好过。分配不均要靠合作和改革国际经济旧秩序来解决，正确方向是推动全球化朝着<b>开放、包容、普惠、平衡、共赢</b>发展。答题时别写成「反对全球化」，要写「引导全球化」。顺带一提，逆全球化思潮本身就是全球化深入之后的产物——它恰恰说明各国已经绑在一起了。</p>

<div class="qac">
<p class="q">一部手机多国生产，为什么不是贸易全球化？</p>
<p class="a">因为跨过国界的是<b>工序</b>，不是商品。设计、芯片、组装分处不同国家，产品还没成型，谈不上「卖出去」。贸易全球化的关键词是<b>出口、进口、跨境电商</b>，跨境的是已经造好的商品和服务。判断的落点永远是那句：<b>什么跨过了国界</b>。如果材料里既有分工又有出口，两个都写，按主次排。</p>

<div class="qac">
<p class="q">跨国公司凭什么算经济全球化的载体？</p>
<p class="a">因为它真的在组织跨境生产：把研发放在母国，制造放到东道国，销售铺到全球，<b>资金、技术、零部件跟着它的安排跨国流动</b>。载体不是「有钱的公司」，而是<b>能把生产环节放到不同国家的那类企业</b>。材料里出现海外工厂、代工、全球采购，就该想到它。注意区分：跨国公司是载体，生产全球化是表现，别把两者写成同一个词。</p>

<div class="qac">
<p class="q">遇到出口管制、贸易摩擦，国家和企业能做什么？</p>
<p class="a">两条线。国家层面：<b>防风险</b>——守住粮食、能源、产业链供应链安全，把关键环节补上；<b>促合作</b>——参与全球经济治理，推动规则更公正合理。企业层面：<b>多元化布局</b>、提高技术含量、向上游走。写成「闭关自守」或「全面对抗」，都偏了。记住一个口径：防风险不等于关门，促合作不等于让步。</p>

</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 经济全球化就是西化、美国化，全世界都在学美国。</p>
<p class="er-v">✓ 经济全球化是商品、服务、生产要素在全球流动、各国经济相互依赖的趋势，是社会生产力发展的客观要求和科技进步的必然结果。</p>
<p class="er-w">错在哪：把<b>趋势</b>和<b>规则由谁主导</b>混为一谈。发达国家主导规则是国际经济旧秩序的问题，要改革；但趋势本身不等于西化。</p>
</div>
<div class="er">
<p class="er-x">✗ 经济全球化只对发达国家有利，发展中国家全是受害者。</p>
<p class="er-v">✓ 经济全球化对各国都是机遇与挑战并存；发展中国家可以引进资金、技术、管理经验，接入全球市场，但经济安全面临更大压力。</p>
<p class="er-w">错在哪：把「受益不均」说成「只有一方受益」。答题要写<b>机遇真实、挑战更重</b>，再落到「提高自身能力」。</p>
</div>
<div class="er">
<p class="er-x">✗ 解决全球化的毛病，就该加关税、退群、把产业搬回来。</p>
<p class="er-v">✓ 应抓住机遇、迎接挑战、趋利避害，推动经济全球化朝着更加开放、包容、普惠、平衡、共赢的方向发展。</p>
<p class="er-w">错在哪：把<b>逆全球化</b>当成解药。它短期护住一个行业，长期让链条断裂、成本上升、蛋糕变小。</p>
</div>
<div class="er">
<p class="er-x">✗ 经济全球化就是贸易全球化，就是各国互相卖东西。</p>
<p class="er-v">✓ 经济全球化主要表现为生产全球化、贸易全球化和资本全球化，跨国公司是重要载体。</p>
<p class="er-w">错在哪：只记住一种表现。三种表现的分界线是「<b>什么跨过国界</b>」：工序、商品、资金。</p>
</div>
<div class="er">
<p class="er-x">✗ 一部手机在多个国家生产，体现了贸易全球化。</p>
<p class="er-v">✓ 一部手机的设计、芯片、组装分布在不同国家，体现了生产全球化，是跨国公司组织全球产业链的结果。</p>
<p class="er-w">错在哪：看到「多国」就写贸易。产品还没造好，跨境的是<b>工序</b>，答案是生产全球化。</p>
</div>
<div class="er">
<p class="er-x">✗ 经济全球化让各国利益完全一致，不会再有贸易摩擦。</p>
<p class="er-v">✓ 经济全球化使各国相互依赖加深，但利益分配不均会引发贸易摩擦和保护主义，风险也会沿产业链传导。</p>
<p class="er-w">错在哪：把「相互依存」当成「利益一致」。依存越深，<b>风险传得越快</b>，摩擦也越难单方面解决。写「合作共赢」之前，先把「利益分配不均」这句垫上。</p>
</div>
<div class="er">
<p class="er-x">✗ 全球化时代，国家主权没那么重要了，政府也管不了经济。</p>
<p class="er-v">✓ 主权国家仍是国际经济关系的重要主体，可以通过产业政策、安全审查、国际合作参与引导经济全球化。</p>
<p class="er-w">错在哪：把「相互依赖」读成「国家失效」。材料里出现出口管制、关税、产业补贴，恰恰说明<b>国家在动手</b>。</p>
</div>
</div>
<p class="gx-note">七条里最常考的是第 1、3、4 条：一条考性质，一条考态度，一条考表现。把这三条的正确表述抄一遍，比刷十道选择题管用。</p>
