<p class="gx-lede">这一框是第三课的开头。第三课讲我国的经济发展：第一框先定方向——新发展理念；第二框再讲怎么落地——推动高质量发展。最容易错的一件事，是把五个理念当成五句口号背下来，材料一给就乱配；或者一看到“技术”“芯片”，就只写“创新”，把另外四块板全丢了。这一页用一只木桶，把五个理念串成一件事。读完的标准很简单：给你一个场景，你能说出它对应哪个理念，再补一句具体做法。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 发展的总开关<span class="q-src">人教版（2019）必修2 经济与社会 · 第三课第一框</span></p>
<p class="q-b">坚持以人民为中心的发展思想。</p>
<p class="q-n">→ 这句只有一句，却是五个理念的<b>总开关</b>。关键词是“人民”：发展<b>为了</b>人民、发展<b>依靠</b>人民、发展成果<b>由人民共享</b>。三个“人民”少一个，这句话就不完整。答题写“以人民为中心”，别写成“以经济为中心”。材料里凡是写“惠民、便民、让群众有获得感”的，都要往这句上靠。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 五个理念的清单<span class="q-src">人教版（2019）必修2 经济与社会 · 第三课第一框</span></p>
<p class="q-b">贯彻创新、协调、绿色、开放、共享的新发展理念。</p>
<p class="q-n">→ 这句是“五块板”的<b>清单</b>。顺序不是随便排的：<b>创新</b>管动力、<b>协调</b>管平衡、<b>绿色</b>管人与自然、<b>开放</b>管内外联动、<b>共享</b>管公平正义。五个词要连着写，中间不能漏，也不能只挑一个写。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 五个定位句<span class="q-src">人教版（2019）必修2 经济与社会 · 第三课第一框</span></p>
<p class="q-b">创新是引领发展的第一动力；协调是持续健康发展的内在要求；绿色是永续发展的必要条件和人民对美好生活追求的重要体现；开放是国家繁荣发展的必由之路；共享是中国特色社会主义的本质要求。</p>
<p class="q-n">→ 这句是答题的<b>定位句库</b>，五个定语一个字都不能换：“第一动力”“内在要求”“必要条件”“必由之路”“本质要求”。写串了就是丢分。背法：先记五句“是什么”，再记五个词管什么问题，两列对上就够用。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>理念</th><th>解决什么问题</th><th>最常被写错成</th></tr></thead>
<tbody>
<tr class="key"><td>创新</td><td>动力：发展靠什么往前走</td><td>创新就是高科技、就是芯片</td></tr>
<tr><td>协调</td><td>平衡：城乡、区域、行业之间</td><td>协调就是平均发展、一样富</td></tr>
<tr><td>绿色</td><td>人与自然：发展能不能持续</td><td>绿色就是少发展、不发展</td></tr>
<tr><td>开放</td><td>内外联动：发展的空间有多大</td><td>开放就是依赖外国、市场换技术</td></tr>
<tr><td>共享</td><td>公平正义：发展成果归谁</td><td>共享就是平均分配、养懒人</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">背法：先背第二列“解决什么问题”，再背第三列的反例。判材料时先问“它动的是哪块板”，再写理念名称。只高亮第一行，是因为它最容易被“技术”两个字带跑——看到芯片、发动机、新药，别急着只写创新。最后一步才是写做法：理念名加具体动作，一句话就够，别把五个词丢上去就交卷。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点“下一步”。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 评析类<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">某地提出“只要把芯片产业搞上去，就是贯彻了新发展理念”，于是把资金几乎全投给芯片，污染治理和城乡差距被放在一边。请运用“贯彻新发展理念”的知识，对这一观点进行评析。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性</p>
<p class="s-b">“评析”不是“措施”。先看句式：“只要……就……”是绝对化说法，一半对、一半错。对的一半：抓创新本身没错。错的一半：把“贯彻新发展理念”缩成了“搞一个产业”。答题先说性质，再分两头拆；定性那一句要落笔——这个观点是片面的。</p>
<p class="s-k">用到：评析类答题框架、新发展理念是一个整体</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 先肯定合理处</p>
<p class="s-b">芯片被“卡脖子”，投芯片有现实理由。<b>创新是引领发展的第一动力</b>，科技创新是核心。关键核心技术要不来、买不来、讨不来，只能自己攻。所以材料里“重视芯片”这一半，是要肯定的。先肯定合理处，评析才显得公道。</p>
<p class="s-k">用到：创新是引领发展的第一动力</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 指出错在哪</p>
<p class="s-b">错在“只”和“就是”。资金全投芯片，污染治理、城乡差距没人管，<b>绿色、协调、共享</b>三块板就被丢下了。新发展理念是一个整体，要<b>一体坚持、一体贯彻</b>，不能只抓一项。把一项当成全部，本身就是对概念的误读。逻辑上，这是把“必要条件”当成了“充分条件”。</p>
<p class="s-k">用到：一体坚持、一体贯彻；绿色、协调、共享</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 说清后果</p>
<p class="s-b">污染会让治污成本反过来吃掉产业利润；城乡差距会压住消费和劳动力质量，芯片再强也缺人和缺市场。这就是木桶：水位由最短的板决定，短板会把整体水平拖下来。忽视另外四项，最后连创新也保不住。只批判不说后果，是这类题最常见的丢分点。</p>
<p class="s-k">用到：木桶效应、整体与部分的关系</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口</p>
<p class="s-b">正确的说法是：把<b>以人民为中心的发展思想</b>当作总开关，把创新作为第一动力，同时抓协调、绿色、开放、共享，把芯片投入放进整体布局里。这样才算真正贯彻新发展理念，而不是拿一个产业当全部。最后一句回到总开关，答案才收得住。</p>
<p class="s-k">用到：以人民为中心、五个理念统一贯彻</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>

</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">① 该观点看到了创新的重要性，有合理之处，但“只要……就是……”的说法是片面的。<br>② 创新是引领发展的第一动力。芯片被“卡脖子”，加大创新投入、突破关键核心技术，符合新发展理念的要求。<br>③ 但新发展理念是创新、协调、绿色、开放、共享的整体，要一体坚持、一体贯彻。只投芯片、忽视污染治理和城乡差距，丢掉了绿色、协调、共享三块板。<br>④ 短板会拖低整体水平：污染推高治污成本，城乡差距压住消费和劳动力质量，最后反过来制约芯片产业。<br>⑤ 因此，应坚持以人民为中心的发展思想，以创新为第一动力，同时统筹协调、绿色、开放、共享，把芯片投入放在整体布局中，才算真正贯彻新发展理念。</p>
