<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写课本这句，不写你脑子里那句。归纳题的分，全在“必然”和“或然”这两个词上。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 归纳推理的含义与两种类型<span class="q-src">人教版（2019）选择性必修3 逻辑与思维 · 第二单元第七课</span></p>
<p class="q-b">归纳推理是以个别性知识为前提，推出一般性结论的推理。完全归纳推理的前提中考察了某一类事物的全部对象，结论是必然的；不完全归纳推理的前提中只考察了某一类事物的部分对象，结论是或然的。</p>
<p class="q-n">→ 翻成人话：这句话里塞着三个条件。①方向是个别到一般：前提讲“这一个、那一个”，结论讲“这一类都”。②判据只有一条：前提里有没有把这一类对象一个不落地考察完。③考察完，结论必然；没考察完，结论或然，只能叫“很可能”。答题时先写方向，再写判据，最后写结论性质，三句就是得分点。顺序别倒，倒了就成了“因为或然，所以只考察一部分”。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 简单枚举与科学归纳<span class="q-src">人教版（2019）选择性必修3 逻辑与思维 · 第二单元第七课</span></p>
<p class="q-b">简单枚举归纳推理是根据一类事物中部分对象具有某种属性，并且没有遇到反例，从而推出该类事物全部对象都具有该属性的推理。科学归纳推理不仅考察了部分对象，还分析了对象与属性之间的因果联系，结论的可靠程度更高。要提高不完全归纳推理结论的可靠性，就要考察更多的对象、扩大考察的范围，并注意寻找反例。</p>
<p class="q-n">→ 翻成人话：不完全归纳有两条路。简单枚举是“看了几个都这样，就说全都这样”，它唯一的把关人是“没遇到反例”。科学归纳多走一步，去问“为什么这样”，把因果联系找出来，结论就更稳。注意分寸：科学归纳也只是“更可靠”，不是“必然”。判断时先看有没有分析因果，再看例子多少——只看后者，题目一设套你就掉进去。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 类比推理及其可靠性<span class="q-src">人教版（2019）选择性必修3 逻辑与思维 · 第二单元第七课</span></p>
<p class="q-b">类比推理是根据两个或两类对象在某些属性上相同或相似，推出它们在其他属性上也相同或相似的推理。类比推理的结论是或然的。要提高类比推理的可靠性，就要在类比对象之间找到更多的相同属性，并且相同属性与推出属性之间的联系越本质、越必然，结论就越可靠。</p>
<p class="q-n">→ 翻成人话：类比是“甲有 a、b、c，还有 d；乙也有 a、b、c；所以乙大概也有 d”。它给的是线索，不是定论。三条提高办法：相同点要多、相同点要本质、还要主动找不同点（找反例）。答题写“结论是或然的，需要实践检验”，别写“证明了”“说明了”——这两个词一出现，逻辑上就超纲了。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>完全归纳</th><th>不完全归纳</th><th>类比推理</th></tr></thead>
<tbody>
<tr><td>推理方向</td><td>个别 → 一般</td><td>个别 → 一般</td><td>相似 → 相似</td></tr>

<tr><td>结论性质</td><td>必然</td><td>或然</td><td>或然</td></tr>
<tr><td>出错长什么样</td><td>漏掉一个对象，就不再是完全</td><td>举几个例子就下全称结论</td><td>只比相同点，不比不同点</td></tr>
<tr><td>怎么更可靠</td><td>关键是不漏，不用提高</td><td>多考察、找反例、析因果</td><td>相同点多、相同点本质</td></tr>

<p class="gx-note">背法：一“全”、二“不”、三类比。完全归纳的门槛是“全部”，所以结论必然；不完全归纳只碰到“部分”，类比只碰到“相似”，所以这两者的结论永远带“或然”两个字。答题时这两个字不写，老师就当你没懂。表格只高亮最后一行：那一行是判据，上面几行只是把差别铺开，背的时候抓住判据就够。</p>

<p class="fig-s">这四法是“从现象追原因”的工具，都靠摆场合。求同法在变化里找那个不变，求异法在不变里找那一处变，共变法看两者同步增减，剩余法把已解释的部分减掉。考场上先数场合：多个场合只有一个相同用求同，两个场合只差一处用求异。</p>
<div class="gx-svgbox">

<text x="36" y="40" font-size="11.5" font-weight="700" fill="#151a21">求因果四法：摆场合，看哪一种情况跟着现象走</text>

<text x="56" y="76" font-size="10.5" font-weight="700" fill="#1e6640">求同法：场合在变，相同的那一个不变</text>
<text x="56" y="96" font-size="9.4" fill="#3a3a35">几个场合里，只有一个情况相同</text>
<text x="56" y="113" font-size="9.4" fill="#3a3a35">这个情况出现，现象也出现</text>
<text x="56" y="130" font-size="9.4" fill="#3a3a35">→ 它就是现象的原因</text>
<rect x="424" y="52" width="360" height="94" rx="8" fill="#ffffff" stroke="#f0dcae"/>
<text x="440" y="76" font-size="10.5" font-weight="700" fill="#8a5c14">求异法：其他都相同，只差一个</text>
<text x="440" y="96" font-size="9.4" fill="#3a3a35">两个场合，其他情况都相同</text>
<text x="440" y="113" font-size="9.4" fill="#3a3a35">只有这个条件有无不同，现象也不同</text>
<text x="440" y="130" font-size="9.4" fill="#3a3a35">→ 这个条件就是原因</text>
<rect x="40" y="158" width="356" height="94" rx="8" fill="#ffffff" stroke="#cfe0f5"/>
<text x="56" y="182" font-size="10.5" font-weight="700" fill="#0b6580">共变法：一个变，另一个跟着变</text>
<text x="56" y="202" font-size="9.4" fill="#3a3a35">其他情况不变，某一情况发生变化</text>
<text x="56" y="219" font-size="9.4" fill="#3a3a35">被研究现象也跟着变化</text>
<text x="56" y="236" font-size="9.4" fill="#3a3a35">→ 两者之间有因果联系</text>
<rect x="424" y="158" width="360" height="94" rx="8" fill="#ffffff" stroke="#e2e8ee"/>
<text x="440" y="182" font-size="10.5" font-weight="700" fill="#5b6673">剩余法：减掉已经解释的部分</text>
<text x="440" y="202" font-size="9.4" fill="#3a3a35">已知复合现象由多种原因造成</text>
<text x="440" y="219" font-size="9.4" fill="#3a3a35">把已确认的原因一项项减去</text>
<text x="440" y="236" font-size="9.4" fill="#3a3a35">→ 剩下的部分也有因果联系</text>

<span class="gx-zoomchip">点击放大</span>

<p class="gx-take">求异法管“两个场合差一处”，求同法管“多个场合同一点”；共变看同步增减，剩余做减法。</p>
<p class="gx-note">最容易混的是求同和求异：求同法是多个场合、一个相同；求异法是两个场合、一处不同。共变法的关键词是“随之变化”，剩余法的关键词是“减去”“剩下”。答题先写方法名，再补一句“该情况与被研究现象有因果联系”，两句就够，别把四种法全抄一遍。</p>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点“下一步”。五步走完，答案自己就长出来了。每一步只推进一个判断，别跳步。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 说明如何提高类比推理的可靠性<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">人们发现蝙蝠靠喉部发出超声波、用耳朵接收回声来判断前方的障碍，于是模仿这一套造出了雷达。雷达造出来以后，有人接着说：“蝙蝠的这套本领和人造雷达完全一样，所以只要照雷达的原理去研究，就能解释蝙蝠的一切行为。”请结合材料，说明怎样才能提高类比推理结论的可靠性。要求写出三条，并分别结合材料。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 定性：这是“提高可靠性”题</p>
<p class="s-b">题目问“怎样提高”，不是问“这是不是类比”，也不是问“这个类比对不对”。先定性，再动笔。材料里摆着一组类比：蝙蝠的本领和雷达的原理。定性写错，后面写得再顺也是答非所问。</p>
<p class="s-k">用到：类比推理的含义——根据两个对象在某些属性上相同或相似，推出它们在其他属性上也相同或相似</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 把类比对象和相同属性列出来</p>
<p class="s-b">甲是蝙蝠：发出超声波、遇到障碍反射、用耳朵接收、据此判断距离。乙是雷达：发射电磁波、遇到障碍反射、接收回波、据此测距。四条一一对上，这就是材料给的相同属性。列得越具体，后面结合材料才有话可说。</p>
<p class="s-k">用到：相同属性是类比推理的出发点，没有相同属性就没有类比</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 第一条：相同属性要多</p>
<p class="s-b">材料只对上了四步流程，就在结论里写“完全一样”。流程相同不等于一切都相同：蝙蝠靠活体器官发声，雷达靠电子器件发波。相同点不够多，“完全一样”这句话就撑不住。答题写“相同属性越多，结论越可靠”，后面必须跟一句材料里到底对上了几条。</p>
<p class="s-k">用到：提高类比推理可靠性的第一条——相同属性越多，结论越可靠</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 第二条、第三条：本质联系和反例</p>
<p class="s-b">回声定位的物理机制是本质联系，这一类相似值钱；蝙蝠的翅膀、作息、繁殖，与雷达没有本质联系，硬搬就错。再往下找不同点：一个是生物，一个是机器，一个靠进化，一个靠设计。不同点摆出来，“完全一样”自然被推翻。</p>
<p class="s-k">用到：相同属性与推出属性的联系越本质越必然，结论越可靠；还要主动寻找不同点</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口：结论仍是或然</p>
<p class="s-b">三条写完，最后补一句总话：类比推理的结论是或然的，还要经过实践检验。这一句是定性质的分，写上不吃亏。答题卡上分点写，每点先写规则名，再抄材料的词，最后一句因果。不要只写“要客观”“要全面”，那不是逻辑术语。</p>
<p class="s-k">用到：类比推理结论的或然性，以及实践检验</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">①相同属性越多，结论越可靠。蝙蝠与雷达在“发信号—遇障碍—收回声—判距离”上相同，但材料把这一组相似说成“完全一样”，相同属性不够多。</p>
<p class="ans-b">②相同属性与推出属性之间的联系越本质、越必然，结论越可靠。回声定位的物理机制属本质联系，可以类比；蝙蝠的生理构造、生活习性与雷达没有本质联系，不能照搬。</p>
<p class="ans-b">③要主动寻找不同点，防止反例。蝙蝠是生物体，靠器官发声；雷达是人造设备，靠电子器件发波。两者性质不同，不能推出“完全一样”。</p>
<p class="ans-b">④类比推理的结论是或然的，还要经过实践检验。用它提出假设可以，用它下结论不行。</p>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是“你以为懂了、一写就错”的地方，每问配一张迷你图。先自己答，再对照，别反过来。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「完全归纳和不完全归纳，结论为什么一个必然、一个或然？」</p>
<p class="a">判据在前提考察的范围。完全归纳的前提已经覆盖这一类全部对象，结论没有超出前提，前提真结论就一定真；不完全归纳只考察一部分，结论跑到没考察的对象上去了，那一段没有担保，只能或然。<b>全与不全看范围，不看例子多少。</b></p>
<svg viewBox="0 0 240 132" role="img" aria-label="考察全部对象推出必然，只考察部分推出或然">

<text x="59" y="81" font-size="9" text-anchor="middle" fill="#8a5c14">部分对象</text>
<path d="M106 76 L128 76 L123 72 L136 76 L123 80 Z" fill="#9fb3c2"/>
<text x="146" y="81" font-size="9" font-weight="700" fill="#8a5c14">或然</text>
<text x="120" y="112" font-size="8.6" text-anchor="middle" fill="#5b6673">看范围，不看例子多少</text>
</svg>
</div>
<div class="qac">
<p class="q">「简单枚举为什么不可靠？科学归纳强在哪？」</p>
<p class="a">简单枚举的把关人只有“没遇到反例”，它不问为什么，所以一只黑天鹅就能推翻。科学归纳多问一句“为什么”，把因果联系找出来，结论更可靠。<b>注意分寸：也只是更可靠，仍是或然。</b>判分点在“有没有分析因果”，不在“例子多不多”。</p>

<text x="24" y="52" font-size="8.6" fill="#3a3a35">只看例子</text>

<text x="120" y="110" font-size="8.6" text-anchor="middle" fill="#5b6673">差别在有没有分析因果</text>
</svg>
</div>
<div class="qac">
<p class="q">「求同法和求异法，考场上怎么一眼分开？」</p>
<p class="a">数场合。两个场合、其他都一样、只差一处，是求异法；三个以上场合、别的都不同、只有一点相同，是求同法。<b>先数场合个数，再看差在哪一头。</b>场合数一眼数得出来，比背定义稳。</p>

<div class="qac">
<p class="q">「共变法和剩余法，材料里长什么样？」</p>
<p class="a">共变法看“跟着变”：其他条件不变，温度升高，体积变大。<b>剩余法看“减完剩什么”</b>：已知几种原因解释了一部分现象，减掉以后还剩一块，这一块另有原因。一个抓同步，一个抓减法。</p>

</svg>
</div>
<div class="qac">
<p class="q">「类比推理结论是或然的，那它还有用吗？」</p>
<p class="a">有用，而且用处很大：它负责提出猜想和假设，仿生设计、模拟实验、模型试验都从类比起步。或然说的是结论性质，不是价值。<b>写“或然＋需实践检验”是采分点，写“不可靠所以别用”是丢分点。</b></p>
<svg viewBox="0 0 240 132" role="img" aria-label="类比提出假说，假说经过验证，才能成为可靠结论">

<text x="44" y="44" font-size="9" text-anchor="middle" fill="#1e6640">类比</text>
<path d="M76 40 L86 40 L82 36 L92 40 L82 44 Z" fill="#9fb3c2"/>
<rect x="94" y="26" width="56" height="28" rx="6" fill="#ffffff" stroke="#cfe0f5"/>
<text x="122" y="44" font-size="9" text-anchor="middle" fill="#0b6580">假说</text>
<path d="M152 40 L162 40 L158 36 L168 40 L158 44 Z" fill="#9fb3c2"/>
<rect x="170" y="26" width="58" height="28" rx="6" fill="#ffffff" stroke="#f0dcae"/>

<text x="120" y="88" font-size="8.6" text-anchor="middle" fill="#5b6673">先提猜想，再去检验</text>
<text x="120" y="106" font-size="8.6" text-anchor="middle" fill="#5b6673">或然不等于没用</text>
</svg>
</div>
<div class="qac">
<p class="q">「类比、比较、比喻，三个词怎么分？」</p>
<p class="a">类比是推理，要推出新属性，结论或然；比较是方法，只把两者摆在一起看异同，不推出新东西；比喻是修辞，为的是说得形象。<b>看有没有“推出”：推出新属性的是类比。</b></p>
<svg viewBox="0 0 240 132" role="img" aria-label="类比是推理，比较是方法，比喻是修辞">
<rect x="6" y="6" width="228" height="120" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="18" y="30" font-size="9" font-weight="700" fill="#1e6640">类比</text>
<text x="72" y="30" font-size="8.6" fill="#3a3a35">推理：推出新属性</text>
<path d="M16 40 L224 40" stroke="#e2e8ee"/>
<text x="18" y="62" font-size="9" font-weight="700" fill="#0b6580">比较</text>
<text x="72" y="62" font-size="8.6" fill="#3a3a35">方法：只比异同</text>
<path d="M16 72 L224 72" stroke="#e2e8ee"/>
<text x="18" y="94" font-size="9" font-weight="700" fill="#8a5c14">比喻</text>
<text x="72" y="94" font-size="8.6" fill="#3a3a35">修辞：只为说得形象</text>
<text x="120" y="116" font-size="8.6" text-anchor="middle" fill="#5b6673">有没有“推出”，是分界线</text>
</svg>
</div>
</div>
<p class="gx-note">六问其实是同一件事：都在问“结论的担保从哪里来”。完全归纳的担保是“全”，不完全归纳的担保是“例子多、有因果、没反例”，类比的担保是“相同点多、相同点本质、找过反例”。答题时先答结论性质（必然还是或然），再答担保从哪来，最后回扣材料一句。三步走完，条理分就不会丢。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子，抄一遍就能用。错句都来自真卷子里出现过的说法。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 归纳推理的结论都是必然的，前提都是真的嘛。</p>
<p class="er-v">✓ 完全归纳推理的结论是必然的；不完全归纳推理的结论是或然的。结论性质由前提考察的范围决定。</p>
<p class="er-w">错在哪：前提真只保证“前提没骗人”，不保证“结论跑得出前提”。不完全归纳的结论超出了前提范围，那一段没有担保，只能或然。</p>
</div>
<div class="er">
<p class="er-x">✗ 完全归纳和不完全归纳的区别，在于举的例子够不够多。</p>
<p class="er-v">✓ 区别在于前提是否考察了某一类事物的全部对象：考察全部是完全归纳，只考察一部分是不完全归纳。</p>
<p class="er-w">错在哪：这是范围问题，不是数量问题。举一万个也还是部分，只要没穷尽，结论就只能或然。答题写“全部/部分”，别写“多/少”。</p>
</div>
<div class="er">
<p class="er-x">✗ 简单枚举归纳只要没遇到反例，结论就可靠了。</p>
<p class="er-v">✓ 简单枚举归纳推理只考察部分对象、只凭没有遇到反例，结论是或然的；要提高可靠性，还要扩大考察范围、分析因果联系。</p>
<p class="er-w">错在哪：“没遇到”不等于“不存在”。欧洲人看了几百万只白天鹅，到澳洲一只黑的就推翻了。没有因果分析，例子再多也挡不住反例。</p>
</div>
<div class="er">
<p class="er-x">✗ 求同法和求异法差不多，材料里随便写一个都行。</p>
<p class="er-v">✓ 求同法用于多个场合中只有一个情况相同的情况；求异法用于两个场合中其他情况相同、只有一个情况不同的情况。场合数和差异位置就是判据。</p>
<p class="er-w">错在哪：两种法的场合数不一样，写法也不一样。两个场合差一处写求异，多个场合同一点写求同。写反了，方法名错，后面的因果结论也跟着丢分。</p>
</div>
<div class="er">
<p class="er-x">✗ 共变法就是两个现象一起变化，所以一定有因果联系。</p>
<p class="er-v">✓ 在其他情况不变时，某一情况发生变化，被研究现象也随之发生变化，才能推断二者有因果联系。共变要在控制其他条件的前提下看。</p>
<p class="er-w">错在哪：一起变不等于有因果。夏天冰淇淋卖得多，溺水也多，两者同向变化，但真正的原因是气温高。共变法要“其他情况不变”，还要排除共同原因。</p>
</div>
<div class="er">
<p class="er-x">✗ 类比推理的结论是或然的，所以考试里没什么用。</p>
<p class="er-v">✓ 类比推理的结论是或然的，但它能提出猜想、打开思路，仿生设计、模拟实验都从类比起步，结论再经实践检验。</p>
<p class="er-w">错在哪：或然说的是结论的性质，不是价值。写“或然，需检验”是采分点，写“没用”“不科学”是丢分点。课本专讲提高可靠性的要求，就是为了让它有用。</p>
</div>
<div class="er">
<p class="er-x">✗ 类比、比较、比喻是一回事，都是把两个对象放在一起。</p>
<p class="er-v">✓ 类比是推理，要由相同或相似属性推出其他属性；比较是方法，只对照异同，不推出新属性；比喻是修辞，只为说得形象。</p>
<p class="er-w">错在哪：看有没有“推出”。三者摆在一起时，只有类比在推理，也只有类比谈得上“结论或然”和“可靠性”。比喻再美，也不承担推理任务。</p>
</div>
</div>
<p class="gx-note">七条里最常考第 1、3、5 条：结论性质写错、把“没遇到反例”当可靠、把“一起变”当因果。考前把这三条各读一遍，再把左边的错句改写成右边的对句，改得出来才算会。第 4、7 条是选择题的常客，看清场合数和“有没有推出”，基本不会错。</p>
</section>
