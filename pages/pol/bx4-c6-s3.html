<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">这一框的答案压在四句话上：劳动奉献是根本途径，个人与社会统一是前提，砥砺自我是主观条件，理想信念是方向。先照抄教材，再拆关键词，最后看哪一句最容易被你写成「成功学」。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 在劳动和奉献中创造价值<span class="q-src">人教版（2019）必修4 哲学与文化 · 第六课第三框</span></p>
<p class="q-b">劳动是人类最基本的实践活动，也是人的存在方式。人只有在劳动中才能自由地彰显和发挥自己的智力和体力、意志和情感，创造和实现自己的价值。一个人在劳动中创造的财富越多，意味着他为满足社会和他人的需要所作的贡献越大，他自身的价值就越大。努力奉献的人是幸福的。积极投身为人民服务的实践，是实现人生价值的必由之路，也是拥有幸福人生的根本途径。</p>
<p class="q-n">→ 翻成人话：这段话分两层。第一层讲劳动的地位——劳动是人类最基本的实践活动，也是人的存在方式。<b>「存在方式」</b>四个字要盯住：它把劳动说成你活着的基本样子，不是谋生的副产品。第二层讲价值怎么变大——你在劳动中投入智力、体力、意志和情感，创造出财富，这些财富满足社会和他人的需要；<b>贡献越大，你自身的价值就越大</b>。最后一句是收口：努力奉献的人是幸福的，积极投身为人民服务的实践，是实现人生价值的必由之路。答题时「根本途径」这个词只能挂给劳动和奉献，挂给机遇、天赋、平台都不给分。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 在个人与社会的统一中实现价值<span class="q-src">人教版（2019）必修4 哲学与文化 · 第六课第三框</span></p>
<p class="q-b">社会提供的客观条件是实现人生价值的前提。人的生存条件和发展条件、享受条件和工作条件都是由社会提供的。人在实践活动中实现自己价值的时候，必须利用社会和他人提供的各种物质条件和知识成果。人的价值只能在社会中实现。只有正确处理个人与集体、个人与社会的关系，才能在奉献社会中实现自己的价值。</p>
<p class="q-n">→ 翻成人话：这段的关键是分清两个词——<b>「前提」和「途径」</b>。社会提供的生存条件、发展条件、享受条件、工作条件，是前提，是舞台和工具；劳动和奉献，是途径，是你自己在台上怎么演。教材把话说得很死：人的价值只能在社会中实现，你还必须利用社会和他人提供的物质条件和知识成果。所以「我一个人闷头努力就够了」这句话，从根上就漏了一半。还有一句常被忽略：统一不等于把人磨成一个样，人的个性发展表现为个人对他人、对社会的独特贡献。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 在砥砺自我中走向成功<span class="q-src">人教版（2019）必修4 哲学与文化 · 第六课第三框</span></p>
<p class="q-b">实现人生价值，需要充分发挥主观能动性，需要顽强拼搏、自强不息的精神。需要努力增长自己的才干，全面提高个人素质。需要有坚定的理想信念，需要正确价值观的指引。需要锤炼品德修为，不断打牢道德根基。</p>
<p class="q-n">→ 翻成人话：这里连着四个「需要」，正好是四个采分点，顺序也有讲究：先讲<b>精神状态</b>（发挥主观能动性、顽强拼搏、自强不息），再讲<b>本领</b>（增长才干、全面提高个人素质），接着讲<b>方向</b>（坚定理想信念、正确价值观的指引），最后讲<b>人品</b>（锤炼品德修为、打牢道德根基）。四句话一句一分，写成「要努力、要坚持」只算一句。材料里出现「自学」「攻关」「拒绝高薪」「带徒弟」，分别往本领、意志、方向、品德上落。</p>
</div>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。五步走完，答案的骨架自己就长出来了。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 措施类材料题<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">材料：小张是农学院毕业生。同学们往大城市投简历，他回到家乡的县农技站。十年里，他跑遍全县 200 多个村，哪块地闹虫害，他就骑摩托赶过去。为了学会无人机植保，他自费去外地学了三个月，回来一家一家劝农户试用。前两年没人信，他被拒绝了二十多次，还是每年开春先去示范田飞一遍。如今全县 6 万亩地用上了他的方案，他还带出 30 多个徒弟。有公司开三倍工资请他，他没走，说「我学这个，就是想让乡亲们少赔点钱」。结合材料，运用「价值的创造和实现」的知识，说明青年应如何实现人生价值。（12 分）</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性</p>
<p class="s-b">题型是「如何实现」，属于措施类；知识范围是「价值的创造和实现」，主体是青年（材料里是小张）；设问要答四层：劳动奉献、个人与社会统一、砥砺自我、理想信念。草稿上先写这四个词，别急着抄材料。</p>
<p class="s-k">用到：措施类设问的四层结构（途径—前提—条件—方向）</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 找主体和行为</p>
<p class="s-b">主体是小张，行为有六件：回县农技站、跑 200 多个村、自费学无人机、被拒二十多次仍去示范、带出 30 多个徒弟、拒绝三倍工资。每一件都不是闲笔，后面都要挂到某一层上。</p>
<p class="s-k">用到：主体 + 行为 → 概念的翻译法</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 把行为落到四层</p>
<p class="s-b">跑村看病虫害，是劳动和奉献；县农技站的平台、农户的田，是社会提供的条件，他用这些条件回报社会；自费学无人机、被拒仍坚持，是增长才干加顽强拼搏；拒三倍工资、想着乡亲少赔钱，是理想信念和品德修为。</p>
<p class="s-k">用到：根本途径、前提、主观条件、方向</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 搭框架</p>
<p class="s-b">四层，一层一个采分点：① 劳动和奉献是创造价值的根本途径；② 社会提供的客观条件是实现人生价值的前提，人的价值只能在社会中实现；③ 实现人生价值需要发挥主观能动性、增长才干；④ 需要有坚定的理想信念、正确价值观的指引，还需要锤炼品德修为。每层后面跟一句材料。</p>
<p class="s-k">用到：四层原理 → 材料对应</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口与自查</p>
<p class="s-b">最后补一句：青年要在劳动和奉献中、在个人与社会的统一中、在砥砺自我中实现人生价值。写完回头查三处：有没有哪一层只喊口号没材料、有没有把「前提」写成「途径」、有没有漏掉理想信念。</p>
<p class="s-k">用到：总收口 + 三项自查</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">① 劳动和奉献是创造价值的根本途径。人只有在劳动中才能彰显和发挥自己的智力和体力、意志和情感，创造和实现自己的价值；积极投身为人民服务的实践，是实现人生价值的必由之路。小张回到县农技站，跑遍 200 多个村，把技术送到田头，就是在劳动和奉献中创造价值。<br>② 社会提供的客观条件是实现人生价值的前提，人的价值只能在社会中实现。要正确处理个人与集体、个人与社会的关系，在奉献社会中实现自己的价值。小张利用县农技站的平台和农户的田地做示范，又把成果交给 30 多个徒弟，个人价值在服务乡亲中得到了确认。<br>③ 实现人生价值，需要充分发挥主观能动性，需要顽强拼搏、自强不息的精神；需要努力增长自己的才干，全面提高个人素质。小张自费学无人机植保，被拒绝二十多次仍年年去示范田，既长了本领，也顶住了挫折。<br>④ 实现人生价值，需要有坚定的理想信念，需要正确价值观的指引；需要锤炼品德修为，不断打牢道德根基。小张拒绝三倍工资，想的是「让乡亲们少赔点钱」，把个人理想融进了乡亲的需要。<br>⑤ 结论：青年要在劳动和奉献中、在个人与社会的统一中、在砥砺自我中实现人生价值，把个人理想融入国家和人民的需要。</p>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。每问先自己答一句，再看下面那句。</p>
<div class="gx-qa">

<div class="qac">
<p class="q">「实现人生价值，是不是主要靠机遇？运气好就什么都有了。」</p>
<p class="a">不是。机遇是外部条件，能不能抓住、抓住以后干成什么，靠的是劳动和本事。教材给的<b>根本途径只有一条：劳动和奉献</b>。把成败全归给运气，答题时一个采分点也拿不到；材料里就算写了「赶上好时候」，也要补一句「他用自己的劳动把机会变成了贡献」。</p>

<p class="q">「只要努力，就一定能实现人生价值吗？」</p>

<text x="88" y="68" font-size="8" text-anchor="middle" fill="#9f1239">个人努力</text>
<text x="152" y="68" font-size="8" text-anchor="middle" fill="#1e6640">社会需要</text>
<text x="120" y="90" font-size="7.6" text-anchor="middle" fill="#3a3a35">在这里</text>
<text x="120" y="118" font-size="7.8" text-anchor="middle" fill="#6b7280">价值只能在个人与社会的统一中实现</text>

</div>

<div class="qac">
<p class="q">「强调个人与社会的统一，是不是就不许发展个性了？」</p>
<p class="a">不是。统一讲的是前提和方向，不是把人磨成一个样。教材说得很清楚：<b>人的个性发展表现为个人对他人、对社会的独特贡献</b>。你越有别人替代不了的本事，越能贡献，个性反而越站得住。把「统一」读成「一样」，是这一框最常见的误读。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="个人与社会的统一不否认个性发展">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="26" font-size="9.2" text-anchor="middle" fill="#151a21">统一 ≠ 抹掉个性</text>
<rect x="16" y="36" width="208" height="28" rx="7" fill="#ffffff" stroke="#dbe7ef"/>
<text x="120" y="55" font-size="8.2" text-anchor="middle" fill="#3a3a35">统一：前提和方向，个人离不开社会</text>
<text x="120" y="80" font-size="9" text-anchor="middle" fill="#9aa7b2">↓</text>
<rect x="16" y="84" width="208" height="28" rx="7" fill="#ffffff" stroke="#b8e6d0"/>
<text x="120" y="102" font-size="8" text-anchor="middle" fill="#1e6640">个性＝对他人、对社会的独特贡献</text>
<text x="120" y="121" font-size="7.4" text-anchor="middle" fill="#6b7280">越不可替代，越能贡献</text>
</svg>
</div>

<div class="qac">
<p class="q">「我在普通岗位，是不是就实现不了人生价值？」</p>
<p class="a">能。价值看的是贡献，不是岗位的名气。乡村教师、社区医生、大国工匠，都是在平凡岗位上把一件事做到位。岗位小，贡献可以不小；反过来，位置高而只想自己，价值也不会大。答题时落到<b>为人民服务</b>，不要落到「当大官、赚大钱」。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="岗位小不等于贡献小">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>

<text x="64" y="90" font-size="7.6" text-anchor="middle" fill="#3a3a35">车间里的技工</text>
<text x="120" y="76" font-size="12" text-anchor="middle" fill="#9aa7b2">=</text>

<text x="176" y="62" font-size="8.4" font-weight="700" text-anchor="middle" fill="#1e6640">不平凡的贡献</text>
<text x="176" y="78" font-size="7.6" text-anchor="middle" fill="#3a3a35">把一件事做到位</text>
<text x="176" y="90" font-size="7.6" text-anchor="middle" fill="#3a3a35">被人真正需要</text>
<text x="120" y="116" font-size="7.8" text-anchor="middle" fill="#6b7280">价值看贡献大小，不看岗位名气</text>
</svg>

<div class="qac">
<p class="q">「理想信念是虚的，写进答案会给分吗？」</p>
<p class="a">会给。它是「砥砺自我」里管方向的那一格，教材原话是「<b>需要有坚定的理想信念，需要正确价值观的指引</b>」。材料里出现「坚持」「不放弃」「为了什么」，就写这一条，后面补一句「把个人理想融入国家和人民的需要」。只写「有理想」三个字太空，要带材料。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="理想信念为人生价值提供方向">

<circle cx="120" cy="66" r="26" fill="#ffffff" stroke="#e7d3b8" stroke-width="1.6"/>
<text x="120" y="64" font-size="8.4" font-weight="700" text-anchor="middle" fill="#8a5c14">方向</text>
<text x="120" y="78" font-size="7.4" text-anchor="middle" fill="#3a3a35">为谁干</text>
<text x="120" y="108" font-size="7.8" text-anchor="middle" fill="#6b7280">把个人理想融入国家和人民的需要</text>
<text x="120" y="121" font-size="7.4" text-anchor="middle" fill="#6b7280">顺风不飘，逆风不散</text>
</svg>
</div>

<div class="qac">
<p class="q">「奉献不是吃亏吗？为什么说努力奉献的人是幸福的？」</p>
<p class="a">幸福不等于占便宜。人在劳动和奉献中会得到三样东西：<b>被需要的感觉、本事的增长、和他人的联结</b>。这三样是「自我实现」的那部分，别人拿不走。教材的落点是「积极投身为人民服务的实践，是拥有幸福人生的根本途径」，不是「奉献就该吃亏」。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="奉献带来被需要、本领增长与幸福">

<text x="51" y="90" font-size="7.4" text-anchor="middle" fill="#3a3a35">为他人服务</text>
<text x="120" y="74" font-size="11" text-anchor="middle" fill="#9aa7b2">→</text>
<rect x="154" y="42" width="70" height="56" rx="7" fill="#ffffff" stroke="#e7d3b8"/>

<text x="189" y="88" font-size="7.2" text-anchor="middle" fill="#3a3a35">和他人的联结</text>
<text x="120" y="118" font-size="7.6" text-anchor="middle" fill="#6b7280">这些是幸福感里「自我实现」的那部分</text>

</div>
<p class="gx-note">六问其实是同一件事：都在问「价值从哪里来、靠什么立住」。先把三个错方向排掉——靠运气、靠单干、靠岗位名气；再落到四层——<b>劳动奉献是途径，社会条件是前提，砥砺自我是主观条件，理想信念是方向</b>。这四层排顺了，材料题的采分点自己就排好队了。</p>
</section>
