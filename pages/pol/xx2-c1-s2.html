<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写课本这句，不写你脑子里那句。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 物权是什么<span class="q-src">民法典第114条、第116条 · 教材第一单元第二课</span></p>
<p class="q-b">物权是权利人依法对特定的物享有直接支配和排他的权利，包括所有权、用益物权和担保物权。物权的种类和内容，由法律规定。</p>
<p class="q-n">→ 翻成人话：这句话由三个条件加一条限定组成。①<b>特定的物</b>——得是能指出来的一套房、一台车、一箱货；②<b>直接支配</b>——不用求别人配合，自己就能占有、使用、收益、处分；③<b>排他</b>——同一件东西上，不能同时存在两个内容冲突的所有权。最后一句是物权法定：你不能自己发明一种「永久专属使用权」去对抗别人。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 物权怎么变动<span class="q-src">民法典第209条、第224条 · 教材第一单元第二课</span></p>
<p class="q-b">不动产物权的设立、变更、转让和消灭，经依法登记，发生效力；未经登记，不发生效力，但是法律另有规定的除外。动产物权的设立和转让，自交付时发生效力，但是法律另有规定的除外。</p>
<p class="q-n">→ 翻成人话：这是本节最值钱的一句，也是材料题的题眼。房子、土地这类不动产，光签合同、光交钥匙都不算，要办登记，所有权才转过去；手机、家具、汽车这类动产，东西交到对方手里，所有权就转了。两个「但是法律另有规定的除外」别丢：它说明登记和交付是<b>一般规则</b>，不是绝对规则。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 知识产权保护什么<span class="q-src">民法典第123条 · 教材第一单元第二课</span></p>
<p class="q-b">知识产权是权利人依法就下列客体享有的专有的权利：作品；发明、实用新型、外观设计；商标；地理标志；商业秘密；集成电路布图设计；植物新品种；法律规定的其他客体。</p>
<p class="q-n">→ 翻成人话：这张清单就是「脑力成果受保护」的范围，按三块记：作品（著作权）、技术方案（专利权）、区别来源的标志（商标权）。注意「专有」：未经许可，别人不能随便用。但专有不是无限——它有地域性，一般只在依法取得权利的国家境内受保护；它有保护期限，届满后作品进入公有领域。这两条就是本节第三个扣分点。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>不动产（房、地、林木）</th><th>动产（车、手机、家具）</th></tr></thead>
<tbody>
<tr><td>典型标的</td><td>房屋、建设用地、土地承包地、林木</td><td>汽车、手机、家具、库存货物</td></tr>
<tr><td>公示方式</td><td>登记，看登记簿上写谁</td><td>交付，看东西在谁手里</td></tr>
<tr class="key"><td>所有权何时转移</td><td>办理过户登记时（依法另有规定除外）</td><td>交付时（依法另有规定除外）</td></tr>
<tr><td>只签合同、没公示</td><td>只取得债权，可请求继续履行</td><td>只取得债权，可请求交付</td></tr>
<tr><td>没公示的后果</td><td>不能对抗善意第三人，不能主张所有权</td><td>一般仍是原所有权人，可请求返还</td></tr>
<tr><td>常见坑</td><td>交了钥匙就以为到手了</td><td>以为没登记就跟我没关系</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只高亮 1 行：所有权什么时候转移。背法就两句——不动产记「登记簿上写谁」，动产记「东西在谁手里」。答题时写「依法登记」「依法交付」，别写「办了手续」「给了钱」这种口语，前者是术语分，后者是白丢分。判断题里出现「已经交付」「尚未登记」两个词，就是在考这一行。</p>
</section>

<section class="gx-sec" id="b">
<h2><span class="sn">02</span>拆开看</h2>
<p class="gx-h2s">四张图：各讲一件事，按「是什么 → 怎么运转 → 怎么用」排。</p>

<figure class="gx-fig">
<div class="fig-cap">
<span class="fig-no">图 1</span><span class="fig-t">物权体系：所有权、用益物权、担保物权</span>
<span class="bdg bdg-must">必考</span>
</div>
<p class="fig-s">物权只有三类，教材把三类并列写，不是随便举例。所有权是「东西是我的」，用益物权是「东西是你的、我在用」，担保物权是「东西是你的、我拿它保我的债」。判断时先问归谁，再问谁在用、谁在担保，别一上来就套「所有权」。</p>
<div class="gx-svgbox">
<svg viewBox="0 0 820 260" role="img" aria-label="物权体系图：所有权、用益物权、担保物权三分，并给出判断顺序">
<rect x="16" y="16" width="788" height="228" rx="10" fill="#f8fbfd" stroke="#dbe7ef"/>
<text x="36" y="42" font-size="11.5" font-weight="700" fill="#151a21">物权 = 直接支配 + 排他，种类和内容由法律规定</text>
<line x1="36" y1="54" x2="784" y2="54" stroke="#dbe7ef"/>
<rect x="40" y="66" width="230" height="104" rx="8" fill="#ffffff" stroke="#b8e6d0"/>
<text x="52" y="88" font-size="10" font-weight="700" fill="#1a6b4a">所有权（最完整）</text>
<text x="52" y="106" font-size="9.4" fill="#3a3a35">占有、使用、收益、处分</text>
<text x="52" y="121" font-size="9.4" fill="#3a3a35">四项权能都归权利人</text>
<text x="52" y="136" font-size="9.4" fill="#3a3a35">例：自己的房子、手机</text>
<text x="52" y="151" font-size="9.4" fill="#3a3a35">又叫「自物权」</text>
<rect x="290" y="66" width="230" height="104" rx="8" fill="#ffffff" stroke="#bcd9ee"/>
<text x="302" y="88" font-size="10" font-weight="700" fill="#1a5b8a">用益物权（用别人的）</text>
<text x="302" y="106" font-size="9.4" fill="#3a3a35">土地承包经营权、经营权</text>
<text x="302" y="121" font-size="9.4" fill="#3a3a35">建设用地使用权、宅基地使用权</text>
<text x="302" y="136" font-size="9.4" fill="#3a3a35">居住权：依法设立</text>
<text x="302" y="151" font-size="9.4" fill="#3a3a35">重在用，不能随便处分</text>
<rect x="540" y="66" width="240" height="104" rx="8" fill="#ffffff" stroke="#f0d9a8"/>
<text x="552" y="88" font-size="10" font-weight="700" fill="#8a5a1a">担保物权（保债权的）</text>
<text x="552" y="106" font-size="9.4" fill="#3a3a35">抵押权：不转移占有</text>
<text x="552" y="121" font-size="9.4" fill="#3a3a35">质权：转移占有</text>
<text x="552" y="136" font-size="9.4" fill="#3a3a35">留置权：依法扣留财产</text>
<text x="552" y="151" font-size="9.4" fill="#3a3a35">不履行债务时优先受偿</text>
<rect x="40" y="184" width="740" height="48" rx="8" fill="#fff8e6" stroke="#f0d9a8"/>
<text x="52" y="204" font-size="9.6" fill="#6b4a12">判断顺序：这只东西归谁（所有权）→ 谁在用它（用益物权）→ 谁拿它保债（担保物权）。</text>
<text x="52" y="220" font-size="9.6" fill="#6b4a12">三类可以同时存在于一件东西上：房子归你，你设了居住权给老人，又抵押给银行。</text>
</svg>
<span class="gx-zoomchip">点击放大</span>
</div>
<p class="gx-take">所有权是「自物权」，用益物权和担保物权都是「他物权」——用别人的东西，或者拿别人的东西保自己的债。</p>
<p class="gx-note">常见误解：以为「我的房子抵押给银行，房子就成银行的了」。抵押只是给银行一个优先受偿的地位，所有权还在你手上。担保物权里还有留置权，是依法直接扣留对方的财产，不必事先约定。</p>
</figure>

<figure class="gx-fig">
<div class="fig-cap">

<p class="fig-s">左边是不动产：签合同只产生债权，交钥匙只是占有，过户登记才转移所有权。右边是动产：交付那一刻所有权就转了。两条路的终点不一样，别拿一条路的规则去套另一条。材料题里看到「已交付」「未过户」这种字眼，就要立刻分路。看到「已经搬进去住了」，先别急着下结论。</p>
<div class="gx-svgbox">
<svg viewBox="0 0 820 240" role="img" aria-label="不动产登记与动产交付对照图：不动产经登记转移所有权，动产自交付时转移">

<text x="52" y="114" font-size="9.4" fill="#3a3a35">合同生效，只产生债权</text>
<text x="224" y="108" font-size="14" fill="#8aa4b8">→</text>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 说明类材料题<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">小刘与某房产公司签订商品房买卖合同，付清全款，公司交付钥匙，小刘装修入住。半年过去，双方一直没去不动产登记机构办理过户登记。后公司因欠债被起诉，该房屋被法院查封准备拍卖。小刘主张：房子我已经买了、住进去了，就是我的。请说明：签合同和过户登记分别产生什么法律效果？小刘的主张能否成立？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性</p>
<p class="s-b">题目问「分别产生什么法律效果」，就是要你分成两层答：合同层面、物权层面。这不是一道「小刘冤不冤」的情感题，是一道概念题。先分层，再动笔，答案就不会写成一团。</p>
<p class="s-k">用到：财产权、物权变动、合同债权。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 找主体</p>
<p class="s-b">材料里三个主体：买受人小刘、出卖人房产公司、公司的债权人。小刘和公司之间是合同关系，公司和债权人之间是另一个债的关系，两个关系别混。主体找错，后面全错。</p>
<p class="s-k">用到：民事法律关系的主体。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 找行为</p>
<p class="s-b">公司的行为有三个：签合同、收全款、交钥匙。缺的那一个最关键：没有办理过户登记。这一个「没做」，决定了整道题的答案。把「做了」和「没做」都圈出来。</p>
<p class="s-k">用到：交付、登记、占有。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 对应原理</p>
<p class="s-b">合同依法成立即生效，产生债权：小刘有权请求公司交付房屋并办理过户登记。但房屋是不动产，所有权转移以登记为生效要件。没登记，所有权还在公司名下。两层分开写，分数才拿得全。</p>
<p class="s-k">用到：合同效力、不动产物权登记生效。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口</p>
<p class="s-b">回扣材料下结论：小刘的主张不成立，他是债权人、占有人，不是所有权人。答题时按「合同—物权—后果」三层分点写，每层一句原理加一句材料。最后一句一定回扣材料，别只写原理。</p>
<p class="s-k">用到：违约责任、继续履行、赔偿损失。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">① 合同层面：双方签订的商品房买卖合同依法成立并生效，小刘依合同享有请求公司交付房屋、办理过户登记的债权；公司收全款、交钥匙，是履行合同义务的行为。</p>
<p class="ans-b">② 物权层面：房屋属于不动产，其所有权的转让以办理过户登记为生效要件。交付钥匙只使小刘取得占有，不发生所有权转移，房屋所有权仍归公司。</p>
<p class="ans-b">③ 后果层面：小刘未取得所有权，不能以所有权人身份对抗公司债权人对该房屋的查封、拍卖；但他可以依法请求公司承担违约责任，包括继续履行办理登记、赔偿损失等。</p>
<p class="ans-b">④ 结论：小刘「住进去就是我的」的主张不成立，占有不等于所有。</p>
</div>
</div>
</section>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「钥匙都给我了，房子还不算我的？」</p>
<p class="a">不算。<b>交付钥匙只转移占有，不转移所有权</b>；房屋是不动产，所有权转让以办理过户登记为生效要件。你手里是合同债权，可以要求对方继续履行、办理登记。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="占有与所有不是一回事">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text class="ms" x="120" y="30" text-anchor="middle" font-size="9" font-weight="700">占有 ≠ 所有</text>
<rect x="24" y="42" width="86" height="40" rx="6" fill="#fff6e8" stroke="#f0d9a8"/>
<text class="ms" x="67" y="60" text-anchor="middle" font-size="8.6">住在里面</text>
<text class="ms" x="67" y="73" text-anchor="middle" font-size="8.6">只是占有</text>
<text class="ms" x="120" y="66" text-anchor="middle" font-size="12" font-weight="700">≠</text>
<rect x="130" y="42" width="86" height="40" rx="6" fill="#eafaf1" stroke="#b8e6d0"/>
<text class="ms" x="173" y="60" text-anchor="middle" font-size="8.6">登记簿有名</text>
<text class="ms" x="173" y="73" text-anchor="middle" font-size="8.6">才是所有</text>
<text class="ms" x="120" y="106" text-anchor="middle" font-size="8.4">不动产：登记才转移所有权</text>
</svg>
</div>
<div class="qac">
<p class="q">「承包地流转出去，地是不是就成合作社的了？」</p>
<p class="a">不是。农户享有的是<b>土地承包经营权，属于用益物权</b>；流转出去的是土地的经营权，土地所有权依法仍属于集体。合作社拿到的是约定期限内的使用权能，不是所有权。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="承包地流转只转移经营权，不转移所有权">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text class="ms" x="120" y="28" text-anchor="middle" font-size="8.8" font-weight="700">流转的是经营权，不是所有权</text>
<rect x="18" y="38" width="78" height="38" rx="6" fill="#eef6fc" stroke="#bcd9ee"/>
<text class="ms" x="57" y="55" text-anchor="middle" font-size="8.4">所有权</text>
<text class="ms" x="57" y="68" text-anchor="middle" font-size="8.4">依法归集体</text>
<text class="ms" x="120" y="62" text-anchor="middle" font-size="11" font-weight="700">→</text>
<rect x="144" y="38" width="78" height="38" rx="6" fill="#eafaf1" stroke="#b8e6d0"/>
<text class="ms" x="183" y="55" text-anchor="middle" font-size="8.4">经营权</text>
<text class="ms" x="183" y="68" text-anchor="middle" font-size="8.4">归合作社</text>
<text class="ms" x="120" y="94" text-anchor="middle" font-size="8.4">农户保留土地承包经营权</text>
<text class="ms" x="120" y="110" text-anchor="middle" font-size="8.4">用益物权：用别人的地，赚自己的钱</text>
</svg>
</div>
<div class="qac">
<p class="q">「车抵押给银行，银行会不会把车开走？」</p>
<p class="a">不会。<b>抵押不转移占有</b>，车仍由你占有、使用。银行拿到的是抵押权：债务到期不履行时，可以依法就车的折价、拍卖、变卖所得优先受偿。要转移占有的，是质权。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="抵押权不转移占有">

<text class="ms" x="66" y="55" text-anchor="middle" font-size="8.4">你：占有、使用</text>
<text class="ms" x="66" y="68" text-anchor="middle" font-size="8.4">照常开、照常停</text>

<div class="qac">
<p class="q">「我抄的是情节，又不是原句，也算侵权？」</p>
<p class="a">可能算。<b>著作权保护的是作品，不以登记为前提，也不以营利为前提</b>。未经许可使用他人作品，除依法可以不经许可的情形外，要承担停止侵害、赔偿损失等责任。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="著作权自作品完成即产生">

<text class="ms" x="30" y="68" font-size="8.4">· 不看有没有收钱</text>

<text class="ms" x="30" y="106" font-size="8.2" fill="#6b4a12">情节的具体表达受保护，抽象思想不受保护</text>

<div class="qac">
<p class="q">「这个商标我用了好几年，别人抢先注册我就没辙？」</p>
<p class="a">有辙。<b>商标专用权依法经核准注册取得，但注册不得损害他人现有的在先权利</b>，也不得以不正当手段抢先注册他人已经使用并有一定影响的商标。你可以依法主张权利。</p>

<p class="a">不是。<b>遗嘱继承优先于法定继承，但遗嘱应当为缺乏劳动能力又没有生活来源的继承人保留必要份额</b>。遗嘱自由有边界，越过这条边界的部分依法不发生效力。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 我钱付了、钥匙拿了、人也住进去了，房子就是我的。</p>
<p class="er-v">✓ 房屋属于不动产，其所有权的转让经依法登记发生效力；仅交付占有不发生所有权转移。</p>
<p class="er-w">错在哪：把「占有」当成了「所有」。登记是不动产物权变动的生效要件，不是可有可无的手续。占有是事实，所有是权利，两个词不能换着用。</p>
</div>
<div class="er">
<p class="er-x">✗ 承包地流转给合作社，地就归合作社了。</p>
<p class="er-v">✓ 土地承包经营权人可依法流转土地经营权，土地所有权仍属于集体。</p>
<p class="er-w">错在哪：混淆了所有权与用益物权。流转的是经营权这项权能，所有权没有动。所有权是根，经营权是从根上长出来的枝。</p>
</div>
<div class="er">
<p class="er-x">✗ 车抵押给银行，银行就把车开走了。</p>
<p class="er-v">✓ 抵押不转移占有；债务不履行时，抵押权人依法就抵押财产优先受偿。</p>
<p class="er-w">错在哪：把抵押当成质押。要转移占有的才叫质权，抵押的车还停在你楼下。一个交东西，一个不交东西，差别就在这儿。</p>
</div>
<div class="er">
<p class="er-x">✗ 知识产权永远是我的，别人用一次都不行。</p>
<p class="er-v">✓ 知识产权具有地域性和保护期限；保护期届满，作品进入公有领域。</p>
<p class="er-w">错在哪：把专有权绝对化。专有权是对世的权利，但它有时间、有地域的边界。期限一过，人人可用，这不叫侵权。</p>
</div>
<div class="er">
<p class="er-x">✗ 抄别人小说情节，只要不赚钱就不算侵权。</p>
<p class="er-v">✓ 未经许可使用他人作品，除依法可以不经许可的情形外，应承担停止侵害、赔偿损失等责任。</p>
<p class="er-w">错在哪：把「营利」当成侵权的前提。著作权自作品完成即产生，侵权认定不看有没有收钱。免费转载、免费改编，一样可能侵权。</p>
</div>
<div class="er">
<p class="er-x">✗ 商标谁先注册谁赢，我用得久就是我的。</p>
<p class="er-v">✓ 商标专用权依法经核准注册取得，但注册不得损害他人现有的在先权利。</p>
<p class="er-w">错在哪：只看到「注册」，忘了「在先权利」。用得久不一定赢，但你依法有主张的空间。注册是权利来源，不是侵权的许可证。</p>
</div>
<div class="er">
<p class="er-x">✗ 有遗嘱就全按遗嘱分，谁也别想多要一分。</p>
<p class="er-v">✓ 遗嘱继承优先于法定继承，但应当为缺乏劳动能力又没有生活来源的继承人保留必要份额。</p>
<p class="er-w">错在哪：把遗嘱自由当成没有边界。必留份是法律的强制规定，遗嘱里绕不过去。越过这条底线的部分，依法不发生效力。</p>
</div>
</div>
