<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写课本这句，不写你脑子里那句。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 当今时代的主题<span class="q-src">人教版（2019）选择性必修1 · 第二单元第四课</span></p>
<p class="q-b">和平与发展是当今时代的主题。维护和平、促进发展，是各国人民的共同愿望。</p>
<p class="q-n">→ 翻成人话：这句话由两个条件组成。①“主题”说的是世界往哪走的大方向，不是今天有没有枪声；②“共同愿望”说的是多数国家想不想，不是中国一家在喊。少掉①，你会拿一条新闻当主题；少掉②，你会以为这只是外交辞令。考试里最常见的失分，就是把“主题”写成了“现状”。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 二者的关系<span class="q-src">人教版（2019）选择性必修1 · 第二单元第四课</span></p>
<p class="q-b">和平与发展相辅相成。和平是发展的前提，发展是和平的基础。</p>
<p class="q-n">→ 翻成人话：这是一根扁担的两头，谁也离不开谁。没有和平，你修好的路可能被炸掉；没有发展，长期贫困的人容易走极端。答题时这两句要成对出现，只写一句就少一半分。材料给了两组事实，就分两句写。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 障碍与方案<span class="q-src">人教版（2019）选择性必修1 · 第二单元第四课</span></p>
<p class="q-b">霸权主义和强权政治是解决和平与发展问题的主要障碍。中国主张构建人类命运共同体，建设持久和平、普遍安全、共同繁荣、开放包容、清洁美丽的世界。</p>
<p class="q-n">→ 翻成人话：前半句说“谁在挡路”，后半句说“我们往哪走”。挡路的是少数国家，把自己的规则当成国际规则；往前走要靠各国一起。留意“主要”两个字：障碍不止一个，但答题先写这一个。顺序也别倒：先写障碍，再写方案。</p>
</div>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点“下一步”。每点一次只推进一步，别跳。答案在最后一步，先别急着翻。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 原因类材料题<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">材料：联合国维和行动在多个冲突地区帮助恢复秩序；中国与沿线国家共建的铁路、港口，让当地货物出得去、游客进得来；与此同时，个别国家仍在搞单边制裁和长臂管辖，气候变化、传染病等全球性问题继续加重。结合材料，说明为什么说和平与发展仍是当今时代的主题。（10 分）</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性</p>
<p class="s-b">先看问法。“为什么说……仍是”是原因类，不是措施类。设问里有个“仍”字，说明出题人知道问题还在，要你解释主题为什么没变。原因类题的骨架是“为什么→所以”，不是“怎么做”。</p>
<p class="s-k">用到：时代主题的判断标准——大方向和共同愿望。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 找主体</p>
<p class="s-b">材料里有三拨主体：联合国、中国与沿线国家、个别国家。主体不同，落点不同，答题要分开写，别混成一句“世界很复杂”。漏掉联合国的材料，第三点就写不出来。</p>
<p class="s-k">用到：主体决定概念。联合国→和平；中国与沿线国家→发展；个别国家→障碍。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 找行为</p>
<p class="s-b">联合国“恢复秩序”是维和；中国“修铁路、建港口”是促发展；个别国家“单边制裁”是强权。动词就是得分点，抄材料时把这些词留住。材料只给结果不给动作，就自己补一句“这表明……”。</p>
<p class="s-k">用到：行为对概念，一一对应。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 对应原理</p>
<p class="s-b">和平是发展的前提：秩序恢复了，路才修得成、货才运得出去。发展是和平的基础：日子好起来，冲突的土壤才变少。这两句要成对出现，中间用“同时”“反过来”连起来，读着才像一段论述。</p>
<p class="s-k">用到：和平与发展的辩证关系。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口</p>
<p class="s-b">先承认问题还在：霸权主义、强权政治仍是主要障碍，全球性问题还在加重。再回扣：各国要和平、求合作、促发展的愿望没变，所以主题没变。收口句要回到设问里的“仍”字，正面回答为什么没变。</p>
<p class="s-k">用到：“问题仍在、趋势未变”这个口径。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">①和平是发展的前提。联合国维和帮助冲突地区恢复秩序，为当地建设和发展提供了安定的环境。②发展是和平的基础。中国与沿线国家共建铁路、港口，带动当地产业和就业，减少了因贫困引发的动荡。③和平与发展问题仍未解决。个别国家搞单边制裁、长臂管辖，是霸权主义和强权政治的表现，是解决和平与发展问题的主要障碍；气候变化、传染病等全球性问题还在加重。④但各国人民要和平、求合作、促发展的共同愿望没有变，世界走向和平与发展的大方向没有变，所以和平与发展仍是当今时代的主题。⑤中国主张构建人类命运共同体，推动全球治理共商共建共享，为维护和平、促进发展提供方案。（若本题 12 分，把第⑤点拆成“中国主张”和“全球治理观”两句写。）</p>
</div>
</div>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是“你以为懂了、一写就错”的地方。每题配一张小图，图下那句就是答题口径。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">“和平与发展是时代主题，是不是说现在没有战争了？”</p>
<p class="a">不是。主题说的是世界的大方向和各国人民的共同愿望，局部战争和冲突一直存在。答题要写<b>主题没变，不等于问题已经解决</b>，两句都写才满分。材料里出现局部冲突，不影响这个判断。</p>

<p class="a">不能二选一。<b>和平是发展的前提，发展是和平的基础</b>，两者相互依存。材料里出现“有安宁才建得成”，写前半句；出现“脱贫后冲突变少”，写后半句。先保和平还是先搞发展，这个问法本身就不成立。</p>

<p class="a">因为它<b>破坏的是国际关系的基本准则</b>：把自己的国内法管到别国头上，绕开联合国动武，让别国不敢安心发展。障碍不止一个，“主要”说的是影响最大、最先要写。别把南北差距写成唯一原因，那会漏点。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。考试前扫一遍，比再读一遍课本有用。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 和平与发展是时代主题，说明世界已经太平了。</p>
<p class="er-v">✓ 和平与发展是当今时代的主题，但和平与发展问题仍未解决。</p>
<p class="er-w">错在哪：把“主题”当成“现状”。主题说的是方向和共同愿望，局部冲突一直有，两句都要写。阅卷看的就是这两句有没有分开。</p>
</div>
<div class="er">
<p class="er-x">✗ 先保和平，等太平了再搞发展。</p>
<p class="er-v">✓ 和平是发展的前提，发展是和平的基础，二者相互依存。</p>
<p class="er-w">错在哪：把相互依存写成了先后顺序。少了发展，穷下去的地方更容易再起冲突，和平也守不住。</p>
</div>
<div class="er">
<p class="er-x">✗ 霸权主义只是个别国家脾气不好，不影响世界。</p>
<p class="er-v">✓ 霸权主义和强权政治是解决和平与发展问题的主要障碍。</p>
<p class="er-w">错在哪：把制度性障碍写成作风问题。单边制裁、长臂管辖破坏的是国际关系基本准则。</p>
</div>
<div class="er">
<p class="er-x">✗ 构建人类命运共同体，就是中国先把自己发展好。</p>
<p class="er-v">✓ 构建人类命运共同体，要建设持久和平、普遍安全、共同繁荣、开放包容、清洁美丽的世界。</p>
<p class="er-w">错在哪：把“共同发展”读成“中国优先”。五个世界里没有一条只讲中国，答题时要把五个形容词排开。</p>
</div>
<div class="er">
<p class="er-x">✗ 全球性问题让大国定规则，小国跟着做就行。</p>
<p class="er-v">✓ 全球治理观是共商共建共享，国际关系要民主化。</p>
<p class="er-w">错在哪：把“治理”写成“谁强谁定”。疫情、气候这类问题，小国也躲不开，规则得一起商量。</p>
</div>
<div class="er">
<p class="er-x">✗ 现在主题变成抗疫和经济了，和平与发展过时了。</p>
<p class="er-v">✓ 具体问题会变，但各国要和平、求合作、促发展的共同愿望没变，时代主题没有变。</p>
<p class="er-w">错在哪：拿热点替换主题。热点在“问题”这一层，主题在“方向”这一层，两层不能对调。主题看趋势，不看某一年的新闻热度。</p>
</div>
<div class="er">
<p class="er-x">✗ 发展中国家落后，是因为他们自己不努力。</p>
<p class="er-v">✓ 南北差距是发展问题的重要表现，与不公正不合理的国际经济旧秩序有关。</p>
<p class="er-w">错在哪：把结构性问题写成道德问题。答题要落到旧秩序、南北对话、南南合作和全球发展倡议上。</p>
</div>
