<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">三段话管全框：什么是民族区域自治、自治地方和自治机关怎么设、自治权有哪些。先照抄，再拆关键词。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 什么是民族区域自治<span class="q-src">人教版（2019）必修3 政治与法治 · 第六课第二框</span></p>
<p class="q-b">民族区域自治制度是在国家统一领导下，各少数民族聚居的地方实行区域自治，设立自治机关，行使自治权的制度。民族区域自治制度是我国的一项基本政治制度，是中国特色解决民族问题正确道路的重要内容和制度保障。</p>
<p class="q-n">→ 翻成人话：这句话里有<b>四个条件</b>，缺一个都不完整。①<b>国家统一领导</b>——这是前提，不是客气话，自治不能越过它；②<b>各少数民族聚居的地方</b>——注意是「聚居的地方」，不是「所有少数民族人口」，也不是「所有地方」；③<b>设立自治机关</b>——自治要有具体的机关来行使；④<b>行使自治权</b>——权力是法定的，不是自定的。答题开头先写这句定义，再往下展开，阅卷老师一眼就能看到你的知识范围对不对。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 自治地方三级与自治机关<span class="q-src">人教版（2019）必修3 政治与法治 · 第六课第二框</span></p>
<p class="q-b">我国民族自治地方分为自治区、自治州、自治县三级。民族自治地方的人民代表大会和人民政府是自治机关，在行使一般地方国家机关职权的同时，依法行使自治权。</p>
<p class="q-n">→ 翻成人话：三级像三个台阶，从大到小是自治区、自治州、自治县。自治机关只有<b>两个</b>：人民代表大会和人民政府。这里有个坑——法院、检察院是司法机关，依法独立行使审判权、检察权，不属于自治机关。还有一句容易读漏：「在行使一般地方国家机关职权的同时」——自治权是<b>多出来的一项</b>，不是取代一般职权。答题时先写「自治机关是自治地方的人大和政府」，再写「依法行使自治权」，顺序别倒。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 自治权的内容与坚持完善<span class="q-src">人教版（2019）必修3 政治与法治 · 第六课第二框</span></p>
<p class="q-b">自治权是民族区域自治制度的核心内容。自治权是宪法和民族区域自治法赋予的，包括立法自治权、变通执行权、经济管理自治权、文化教育自治权、干部人事管理自治权等。坚持和完善民族区域自治制度，必须坚持党的领导，坚持国家统一，保障少数民族合法权益，促进各民族共同繁荣发展，铸牢中华民族共同体意识。</p>
<p class="q-n">→ 翻成人话：五项自治权按「立法—执行—经济—文教—干部」记，一条一条对得上材料。每个「自治权」前面都藏着<b>依法</b>两个字：立法要按程序报批，变通要依法定权限，不是想改就改。最后一句是现成的答题模板，四个分句就是四个采分点——<b>党的领导、国家统一、合法权益、共同繁荣</b>，再加「铸牢中华民族共同体意识」。材料题问「为什么」或「怎么办」，都能从这句里拆答案。</p>
</div>

<p class="gx-h2s">四张图各讲一件事，顺序是：统一多民族国家 → 自治地方三级 → 自治机关与自治权 → 铸牢中华民族共同体意识。</p>

<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，在草稿纸上写下「地位、权利、发展、主线」四个词，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 原因类材料题<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">材料：某自治区成立 70 年来，自治区人民代表大会制定了 20 多部自治条例和单行条例；自治区的学校开设本民族语言文字课程，同时推广国家通用语言文字；国家组织东部省市对口支援，帮助当地建起高速公路、医院和产业园；自治区每年开展民族团结进步创建活动，依法打击煽动分裂、破坏团结的行为。结合材料，运用「民族区域自治制度」的知识，说明为什么要坚持和完善民族区域自治制度。（12 分）</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性</p>
<p class="s-b">设问是「为什么」，属于原因类，不是措施类。知识范围锁定「民族区域自治制度」，不要答成「处理民族关系的基本原则」，也不要写成「基层群众自治」——那是下一框的内容。</p>
<p class="s-k">用到：原因类＝地位＋优势＋回扣材料</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 找主体</p>
<p class="s-b">材料里有四拨主体：自治区人大（自治机关）、学校（自治地方的事业单位）、国家与东部省市（支援方）、自治区各族群众（民族团结的主体）。主体分清了，才不会把国家的支援写成自治权。</p>
<p class="s-k">用到：自治机关、国家、支援省市、各族群众</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 找行为</p>
<p class="s-b">制定自治条例 → 立法自治权；开设民族语言课程 → 文化教育自治权；对口支援 → 共同繁荣；创建活动与依法打击 → 维护国家统一和民族团结。四个行为，对应四个采分点。</p>
<p class="s-k">用到：立法、文教、支援、依法治理</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 对应原理</p>
<p class="s-b">制度地位对应「基本政治制度、正确道路的重要内容和制度保障」；自治权对应「保障少数民族合法权益」；对口支援对应「促进各民族共同繁荣发展」；创建与打击对应「维护国家统一、铸牢中华民族共同体意识」。一对一对上，不要交叉。</p>
<p class="s-k">用到：基本政治制度、自治权、共同繁荣、共同体意识</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口</p>
<p class="s-b">答案分四点写，每点第一句先给术语，第二句再引材料，最后用一句「坚持党的领导、坚持国家统一」收尾。别停在「民族区域自治好」，要写清楚好在哪、对谁好。</p>
<p class="s-k">用到：党的领导、国家统一、共同体意识</p>
</li>

<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">① 民族区域自治制度是我国的一项基本政治制度，是中国特色解决民族问题正确道路的重要内容和制度保障。自治区人大制定自治条例和单行条例，说明这一制度有法可依、有章可循。<br>② 自治机关依法行使自治权，保障少数民族合法权益。自治区人大行使立法自治权，制定自治条例；学校开设民族语言文字课程，行使文化教育自治权，各民族使用和发展本民族语言文字的权利得到尊重。<br>③ 有利于促进各民族共同繁荣发展。国家组织东部省市对口支援，帮助自治区建设高速公路、医院和产业园，先富带后富，让发展成果惠及各族群众。<br>④ 有利于维护国家统一和民族团结，铸牢中华民族共同体意识。自治区开展民族团结进步创建活动，依法打击煽动分裂、破坏团结的行为，守住了国家统一这个前提。<br>结论：坚持和完善民族区域自治制度，必须坚持党的领导，坚持国家统一，保障少数民族合法权益，促进各民族共同繁荣发展，铸牢中华民族共同体意识。</p>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。每问先自己答一句，再看下面那句。</p>
<div class="gx-qa">

<div class="qac">
<p class="q">「民族区域自治，是不是就是少数民族自己决定自己的事？」</p>
<p class="a">不是。课本定义的第一句就是<b>在国家统一领导下</b>。自治的前提是国家统一，自治权是宪法和民族区域自治法赋予的，不是自带的。民族自决讲的是「自己决定政治地位」，民族区域自治讲的是「在统一国家内、在聚居地方、依法行使自治权」，两者不是一回事，更不能推到「独立」。材料里出现「自决」「独立」「公投」，一律是错项。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="民族区域自治与民族自决、独立不是一回事">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="27" font-size="9" text-anchor="middle" fill="#151a21">自治 ≠ 自决 ≠ 独立</text>
<rect x="18" y="38" width="204" height="30" rx="7" fill="#ffffff" stroke="#b8e6d0"/>
<text x="30" y="57" font-size="8.4" fill="#1e6640">民族区域自治：统一国家内，依法行使</text>
<rect x="18" y="76" width="204" height="30" rx="7" fill="#ffffff" stroke="#f3c9cf"/>
<text x="30" y="95" font-size="8.4" fill="#9f1239">民族自决、独立：另一套逻辑</text>
<text x="120" y="120" font-size="8.2" text-anchor="middle" fill="#6b7280">前提不同，结论就不同</text>
</svg>
</div>

<div class="qac">
<p class="q">「自治机关，包不包括法院和检察院？」</p>
<p class="a">不包括。自治机关只有<b>自治地方的人民代表大会和人民政府</b>。法院、检察院是司法机关，依法独立行使审判权、检察权，对法律负责，不对自治权负责。材料里写「自治县法院」，那是司法机关，不是自治机关；写「自治州人大」「自治区政府」，才是自治机关。这一步判断错了，后面写「行使自治权」就全跟着错。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="自治机关只有人大和政府，不包括法院、检察院">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="27" font-size="9" text-anchor="middle" fill="#151a21">自治机关只有两个</text>
<rect x="18" y="38" width="96" height="32" rx="7" fill="#ffffff" stroke="#b8e6d0"/>
<text x="66" y="59" font-size="8.8" font-weight="700" text-anchor="middle" fill="#1e6640">人民代表大会</text>
<rect x="126" y="38" width="96" height="32" rx="7" fill="#ffffff" stroke="#b8e6d0"/>
<text x="174" y="59" font-size="8.8" font-weight="700" text-anchor="middle" fill="#1e6640">人民政府</text>
<rect x="18" y="80" width="204" height="28" rx="7" fill="#ffffff" stroke="#f3c9cf"/>
<text x="30" y="98" font-size="8.2" fill="#9f1239">法院、检察院：司法机关，不是自治机关</text>
<text x="120" y="120" font-size="8.2" text-anchor="middle" fill="#6b7280">行使自治权的是人大和政府</text>
</svg>
</div>

<div class="qac">
<p class="q">「民族乡是不是民族自治地方？」</p>
<p class="a">不是。民族自治地方只有<b>自治区、自治州、自治县</b>三级；民族乡是乡级行政区，没有自治机关，也不行使自治权。但民族乡同样要贯彻民族政策，民族团结进步创建、扶持少数民族发展这些工作照样做。考试常把「民族乡」塞进「自治地方」的选项里，看到就划掉；也别把「自治县」写成「自治乡」，名字一改，性质就变了。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="民族自治地方只有自治区、自治州、自治县三级，民族乡不算">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="27" font-size="9" text-anchor="middle" fill="#151a21">民族自治地方只有三级</text>

<div class="qac">
<p class="q">「自治权是不是想干什么就干什么？」</p>
<p class="a">不是。自治权是<b>宪法和民族区域自治法赋予的</b>，要在法律规定的范围内行使。自治条例要报批准，变通执行也要走法定程序。自治不是自由，更不是法外之地；材料里出现「未经批准」「自行决定」「不受法律约束」，通常就是错项。答题时把「依法」两个字写在「行使自治权」前面，分数才稳。</p>

</div>

<div class="qac">
<p class="q">「民族区域自治和特别行政区的高度自治，是一回事吗？」</p>
<p class="a">不是。<b>民族区域自治</b>解决的是民族问题，自治地方是自治区、州、县，自治机关是人大和政府，依据是宪法和民族区域自治法；<b>特别行政区</b>实行高度自治，依据是宪法和特别行政区基本法，享有行政管理权、立法权、独立的司法权和终审权。两者的依据、层级、权限都不同，不能互相套用，更不能把「高度自治」写进民族自治地方的答案里。</p>

<div class="qac">
<p class="q">「为什么坚持和完善民族区域自治制度，答案要写几点？」</p>
<p class="a">按四层写：<b>地位</b>——我国的一项基本政治制度，是中国特色解决民族问题正确道路的重要内容和制度保障；<b>权利</b>——保障少数民族合法权益；<b>发展</b>——促进各民族共同繁荣发展；<b>主线</b>——铸牢中华民族共同体意识。再加一句前提：坚持党的领导和国家统一。四层加前提，就是这类题的答题框架，材料怎么换，骨架不变。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。先盖住后两行，自己改一遍，再对答案。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 民族区域自治就是民族自决，少数民族可以自己决定是否独立。</p>
<p class="er-v">✓ 民族区域自治是在国家统一领导下，各少数民族聚居的地方实行区域自治，设立自治机关，行使自治权；民族自决、独立是另一套逻辑，不能混为一谈。</p>
<p class="er-w">错在哪：把「自治」当成「自决」。自治的前提是国家统一，自治权由宪法和法律赋予，推不出独立。</p>
</div>
<div class="er">
<p class="er-x">✗ 自治机关就是自治地方的人大、政府、法院和检察院。</p>
<p class="er-v">✓ 民族自治地方的人民代表大会和人民政府是自治机关；法院、检察院是司法机关，依法独立行使审判权、检察权。</p>
<p class="er-w">错在哪：把司法机关塞进自治机关。自治机关只有两个，多写一个就丢分。</p>
</div>
<div class="er">
<p class="er-x">✗ 民族乡也是民族自治地方，同样行使自治权。</p>
<p class="er-v">✓ 我国民族自治地方只有自治区、自治州、自治县三级；民族乡是乡级行政区，不是民族自治地方，不设自治机关。</p>
<p class="er-w">错在哪：把「民族乡」当成「自治县」。名字里有「民族」不等于有自治权，关键看有没有自治机关。</p>
</div>
<div class="er">
<p class="er-x">✗ 自治权就是自治地方想干什么就干什么，国家不能干预。</p>
<p class="er-v">✓ 自治权是宪法和民族区域自治法赋予的，自治机关必须依法行使自治权，自治条例要依法报批。</p>
<p class="er-w">错在哪：把「自治」读成「自由」。立法要报批准，变通要按程序，越界就是违法。</p>
</div>
<div class="er">
<p class="er-x">✗ 民族区域自治制度是我国的根本政治制度。</p>

<p class="er-w">错在哪：「根本」和「基本」写串了。根本政治制度只有一个，基本政治制度有三个，别抬错级别。</p>
</div>
<div class="er">
<p class="er-x">✗ 民族区域自治和特别行政区的高度自治是一回事。</p>
<p class="er-v">✓ 民族区域自治依据宪法和民族区域自治法，自治机关是自治地方的人大和政府；特别行政区的高度自治依据宪法和特别行政区基本法。</p>
<p class="er-w">错在哪：两套制度各有依据和权限。主体、依据、权限三样都不同，不能互相套用。</p>

<div class="er">
