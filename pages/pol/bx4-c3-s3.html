<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">这一框的答案压在四句话上：矛盾是对立统一，矛盾有普遍性和特殊性，两组主次要分清，两点论和重点论要统一。先照抄，再拆关键词。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 矛盾的含义与两个属性<span class="q-src">人教版（2019）必修4 哲学与文化 · 第三课第三框</span></p>
<p class="q-b">矛盾是反映事物内部和事物之间对立统一关系的哲学范畴。矛盾的对立属性又称斗争性，矛盾的统一属性又称同一性。同一性是指矛盾双方相互吸引、相互联结的属性和趋势：一是矛盾双方相互依赖，一方的存在以另一方的存在为前提，双方共处于一个统一体中；二是矛盾双方相互贯通、相互渗透、相互包含，在一定条件下可以相互转化。斗争性是指矛盾双方相互排斥、相互对立的属性。</p>
<p class="q-n">→ 翻成人话：抓「一个关系、两个属性」。一个关系：事物内部和事物之间既对立又统一；两个属性：同一性（互相依赖、互相贯通、能转化）和斗争性（互相排斥、互相对立）。判断一段材料在不在讲矛盾，就看它有没有「既……又……」的两面。这里有个坑：同一性是有条件的、相对的，斗争性是无条件的、绝对的。所以别写「矛盾双方随时都能互相转化」，转化必须讲条件。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 矛盾的普遍性与特殊性<span class="q-src">人教版（2019）必修4 哲学与文化 · 第三课第三框</span></p>
<p class="q-b">矛盾具有普遍性，即矛盾存在于一切事物中，并贯穿于每一事物发展过程的始终。矛盾具有特殊性，即矛盾着的事物及其每一个侧面各有其特点。矛盾的普遍性和特殊性相互联结：一方面，普遍性寓于特殊性之中，并通过特殊性表现出来，没有特殊性就没有普遍性；另一方面，特殊性也离不开普遍性，不包含普遍性的事物是没有的。</p>
<p class="q-n">→ 翻成人话：这句最容易背反，记住方向——「普遍性寓于特殊性之中」，也就是共性藏在个性里、一般藏在具体里，不是个性藏在共性里。水果这个概念不在天上飘，它就在苹果、香蕉、橘子里；离开具体的果子，就没有「水果」这回事。另一条也别丢：特殊性离不开普遍性，再特别的东西也带着同类的一般特征。方法论落一句：矛盾具有特殊性，要求我们具体问题具体分析。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 主要矛盾与矛盾的主要方面<span class="q-src">人教版（2019）必修4 哲学与文化 · 第三课第三框</span></p>
<p class="q-b">在复杂事物的发展过程中，存在着主要矛盾和次要矛盾。主要矛盾是在事物发展过程中处于支配地位、对事物发展起决定作用的矛盾。矛盾的主要方面是指在矛盾中处于支配地位、起主导作用的方面。事物的性质主要是由主要矛盾的主要方面决定的。要坚持两点论与重点论的统一。坚持两点论，就是在认识复杂事物的发展过程时，既要看到主要矛盾，又要看到次要矛盾；在认识某一矛盾时，既要看到矛盾的主要方面，又要看到矛盾的次要方面。坚持重点论，就是在认识复杂事物的发展过程时，要着重把握主要矛盾；在认识某一矛盾时，要着重把握矛盾的主要方面。</p>
<p class="q-n">→ 翻成人话：这里有两组「主次」，判据只有一个——比的是什么。比「许多矛盾之间」的地位，叫主要矛盾和次要矛盾，落点是办事情要抓重点、抓关键；比「同一个矛盾内部两方」的地位，叫矛盾的主要方面和次要方面，落点是看问题要分主流和支流。两组都有主次，都不能只写一半。下笔前先问自己一句：这段材料是几件事在抢位置，还是一件事有两面？</p>
</div>

<p class="gx-note">整张表只高亮一行：<b>主次之分怎么判</b>。前四行是四个扣分点，最后一行是通用判据。背法是：问「说的是哪个矛盾」，答主要矛盾；问「这个矛盾里哪一方说了算」，答矛盾的主要方面。还有一句口径要守住——事物的性质主要是由主要矛盾的主要方面决定的，不能压缩成「主要矛盾决定事物的性质」。</p>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。五步走完，答案的骨架自己就长出来了。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 措施类材料题<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">材料：某市推进老旧小区改造。调查发现，居民反映最集中的是两件事：管网老化常年漏水，老人上下楼难。市里把这两件排在第一批，集中资金先改管网、装电梯。同时没有一刀切：老城区的院子保留菜市场，新城区的楼栋加装充电桩；老人多的小区先建日间照料站，年轻人多的小区先划停车位。改造中也有争议，有人嫌施工吵，有人担心加装电梯挡光。市里把这些争议摆到居民议事会上，边改边调。两年下来，居民满意度从 62% 升到 91%，个别楼栋的电梯方案还在改。结合材料，说明该市是怎样坚持两点论与重点论相统一的。（12 分）</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性</p>
<p class="s-b">题型是「怎样坚持」，属于措施类；知识范围锁死在两点论与重点论，别扯矛盾的普遍性。要答两层：原理要求是什么，材料哪里做到了。草稿上先写三个词：两面、重点、统一。</p>
<p class="s-k">用到：措施类设问的两层结构（原理 + 做法）</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 找主体和行为</p>
<p class="s-b">做事的是市委市政府，受益和提意见的是居民。动作有三类：排先后——管网、电梯先改；分类施策——老人多建照料站，年轻人多划车位；摆争议——议事会边改边调。三类动作分别对应三处原理。</p>
<p class="s-k">用到：主体 + 行为 → 概念的翻译法</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 找关键词</p>
<p class="s-b">「反映最集中」「集中资金先改」对主要矛盾；「满意度 62% 升到 91%」「个别楼栋还在改」对主流与支流，也就是矛盾的主要方面；「没有一刀切」「有的……有的……」对两点论里的兼顾一面。</p>
<p class="s-k">用到：主要矛盾、矛盾的主要方面、两点论</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 搭框架</p>
<p class="s-b">三层：① 两点论——既看到主要矛盾也看到次要矛盾，既看到主要方面也看到次要方面；② 重点论——着重把握主要矛盾，着重把握矛盾的主要方面；③ 统一——两点是有重点的两点，重点是两点中的重点。</p>
<p class="s-k">用到：两点论 → 重点论 → 二者统一</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口与自查</p>
<p class="s-b">收口补一句反对两种偏向：一点论（只抓电梯不管停车）和均衡论（什么都重要、平均用力）。回头查两处：有没有把「主要矛盾」写成「矛盾的主要方面」，有没有只写两面忘了点重点。</p>
<p class="s-k">用到：反对一点论和均衡论 + 两处自查</p>
</li>
</ol>

<button id="gxNext" type="button">下一步</button>

<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">① 坚持两点论。认识复杂事物的发展过程，既要看到主要矛盾，又要看到次要矛盾；认识某一矛盾，既要看到矛盾的主要方面，又要看到矛盾的次要方面。该市既抓管网漏水、老人上下楼难，也顾菜市场、充电桩、停车位、日间照料站；看改造成效，既看满意度升到 91% 这个主流，也不回避施工扰民、挡光争议这些支流。<br>② 坚持重点论。认识复杂事物要着重把握主要矛盾，认识某一矛盾要着重把握矛盾的主要方面。该市把居民反映最集中的两件事排在第一批，集中资金先改，就是抓主要矛盾；评价改造成效时抓住整体成效这个主流，就是抓矛盾的主要方面。<br>③ 坚持两点论与重点论的统一。两点是有重点的两点，重点是两点中的重点。该市统筹兼顾不同小区的不同需求，又突出重点、把急难愁盼先办，不是平均用力，也不是只抓一点。<br>④ 反对一点论和均衡论。只抓电梯不管停车、只讲成绩不看争议，是一点论；什么都重要、平均用力，是均衡论。该市把争议摆到议事会上边改边调，正是两点论与重点论统一的具体做法。</p>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。每问先自己答一句，再看下面那句。</p>
<div class="gx-qa">

<div class="qac">
<p class="q">「矛盾」不就是平时说的自相矛盾、说话前后打架吗？</p>
<p class="a">不是。哲学上的矛盾是<b>事物内部和事物之间既对立又统一的关系</b>，客观的、普遍的，不是谁嘴笨说错了话。逻辑矛盾是思维混乱，改口就行；哲学矛盾是事物本身固有的，改不了也躲不开。判题时看有没有「既……又……」的两个面。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="哲学的矛盾与逻辑矛盾的区别">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="26" font-size="9.2" text-anchor="middle" fill="#151a21">两个「矛盾」不是一回事</text>
<rect x="18" y="38" width="94" height="50" rx="7" fill="#ffffff" stroke="#b8e6d0"/>
<text x="65" y="58" font-size="8.6" font-weight="700" text-anchor="middle" fill="#1e6640">哲学的矛盾</text>
<text x="65" y="74" font-size="8" text-anchor="middle" fill="#3a3a35">对立统一，客观</text>
<rect x="128" y="38" width="94" height="50" rx="7" fill="#ffffff" stroke="#f3c9cf"/>
<text x="175" y="58" font-size="8.6" font-weight="700" text-anchor="middle" fill="#9f1239">逻辑矛盾</text>
<text x="175" y="74" font-size="8" text-anchor="middle" fill="#3a3a35">思维混乱，可避免</text>
<text x="120" y="106" font-size="8.4" text-anchor="middle" fill="#3a3a35">前者在事物里，后者在说话里</text>
</svg>
</div>

<div class="qac">
<p class="q">矛盾具有普遍性，那是不是矛盾越少越好、最好没有矛盾？</p>
<p class="a">不是。矛盾是<b>事物发展的源泉和动力</b>，双方既对立又统一，才推动事物的运动、变化和发展。没有矛盾就没有世界。正确态度是承认矛盾、分析矛盾、勇于揭露矛盾，找出解决矛盾的正确方法。旧矛盾解决了，新的又会长出来。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="矛盾推动发展，所以不是消灭矛盾而是解决矛盾">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="26" font-size="9.2" text-anchor="middle" fill="#151a21">矛盾 = 发展的动力</text>
<rect x="18" y="38" width="204" height="26" rx="7" fill="#ffffff" stroke="#dbe7ef"/>
<text x="30" y="55" font-size="8.4" fill="#3a3a35">双方既对立又统一</text>
<rect x="18" y="70" width="204" height="26" rx="7" fill="#ffffff" stroke="#b8e6d0"/>
<text x="30" y="87" font-size="8.4" fill="#3a3a35">由此推动运动、变化、发展</text>
<text x="120" y="112" font-size="8.2" text-anchor="middle" fill="#1e6640">不是「消灭矛盾」，而是「解决矛盾」</text>
</svg>
</div>

<div class="qac">
<p class="q">矛盾的普遍性寓于特殊性之中——到底是哪个在哪个里面？</p>
<p class="a">共性在个性里面，一般藏在具体里面。<b>普遍性寓于特殊性之中</b>，并通过特殊性表现出来，没有特殊性就没有普遍性；反过来，特殊性也离不开普遍性。水果这个概念只能靠苹果、香蕉、橘子显出来，离开了具体的果子，它什么也不是。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="普遍性寓于特殊性之中">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="26" font-size="9.2" text-anchor="middle" fill="#151a21">普遍性寓于特殊性之中</text>
<rect x="40" y="40" width="160" height="50" rx="7" fill="#ffffff" stroke="#b8e6d0"/>
<text x="48" y="58" font-size="8.2" fill="#3a3a35">特殊性：苹果、香蕉…</text>
<rect x="84" y="64" width="96" height="20" rx="5" fill="#eef8f2" stroke="#b8e6d0"/>
<text x="132" y="78" font-size="8" text-anchor="middle" fill="#1e6640">普遍性：水果</text>
<text x="120" y="112" font-size="8.2" text-anchor="middle" fill="#6b7280">外层是个性，里面包着共性</text>
</svg>
</div>

<div class="qac">
<p class="q">主要矛盾不就是矛盾的主要方面吗？两个词不是一回事？</p>
<p class="a">不是一回事，判据是<b>比几个矛盾</b>。主要矛盾是复杂事物中处于支配地位、对事物发展起决定作用的矛盾，是「几件事里哪件说了算」，落点是办事情抓重点；矛盾的主要方面是同一矛盾中处于支配地位、起主导作用的一方，是「一件事里哪一面说了算」，落点是看问题分主流。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="用数量区分主要矛盾与矛盾的主要方面">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="26" font-size="9.2" text-anchor="middle" fill="#151a21">先数：几件事，还是一件事</text>
<rect x="18" y="36" width="204" height="24" rx="7" fill="#ffffff" stroke="#f3c9cf"/>
<text x="30" y="52" font-size="8.4" fill="#9f1239">多件事抢位置 → 主要矛盾</text>
<rect x="18" y="66" width="204" height="24" rx="7" fill="#ffffff" stroke="#c9d6df"/>
<text x="30" y="82" font-size="8.4" fill="#1d4e89">一件事有两面 → 主要方面</text>
<text x="120" y="110" font-size="8.2" text-anchor="middle" fill="#6b7280">办事情抓重点，看问题分主流</text>
</svg>
</div>

<div class="qac">
<p class="q">两点论是不是两面都看、平均用力？</p>
<p class="a">不是。两点论是<b>有重点的两点论</b>，重点论是看到两点中的重点；两面都看却平均用力，叫均衡论，一样错。答题写「既……又……，其中……是重点」，一句话把两层都交代了，比写两句空话管用。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="两点论不是平均用力">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="26" font-size="9.2" text-anchor="middle" fill="#151a21">两点论 ≠ 平均用力</text>
<rect x="18" y="36" width="204" height="28" rx="7" fill="#ffffff" stroke="#f3c9cf"/>
<text x="30" y="54" font-size="8.4" fill="#9f1239">✗ 两面一样重 → 均衡论</text>
<rect x="18" y="70" width="204" height="28" rx="7" fill="#ffffff" stroke="#b8e6d0"/>
<text x="30" y="88" font-size="8.4" fill="#1e6640">✓ 两面都看，重点在一边</text>
<text x="120" y="112" font-size="8.2" text-anchor="middle" fill="#6b7280">两点是有重点的两点</text>
</svg>
</div>

<div class="qac">
<p class="q">具体问题具体分析，跟「灵活处理」有什么不一样？</p>
<p class="a">差一个前提。具体问题具体分析，是<b>在矛盾普遍性原理的指导下</b>，具体分析矛盾的特殊性，找出解决矛盾的正确方法。灵活处理可以凭感觉，具体问题具体分析必须有依据：先看这一事物的矛盾特殊在哪，再定办法。它是马克思主义的活的灵魂。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="具体问题具体分析的两个前提">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>

<rect x="18" y="40" width="98" height="44" rx="7" fill="#ffffff" stroke="#dbe7ef"/>
<text x="67" y="58" font-size="8.4" font-weight="700" text-anchor="middle" fill="#151a21">前提</text>
<text x="67" y="74" font-size="8" text-anchor="middle" fill="#3a3a35">普遍性原理指导</text>
<rect x="124" y="40" width="98" height="44" rx="7" fill="#ffffff" stroke="#b8e6d0"/>
<text x="173" y="58" font-size="8.4" font-weight="700" text-anchor="middle" fill="#1e6640">动作</text>
<text x="173" y="74" font-size="8" text-anchor="middle" fill="#3a3a35">分析矛盾特殊性</text>
<text x="120" y="108" font-size="8.2" text-anchor="middle" fill="#6b7280">落点：找出解决矛盾的正确方法</text>

</div>

</div>
<p class="gx-note">六问其实是同一件事：先确认这里的「矛盾」是哲学意义上的对立统一，不是说话出错（第 1、2 问）；再确定材料比的是普遍与特殊，还是主次（第 3、4 问）；最后看方法论落在哪：是两点论与重点论的摆位（第 5 问），还是矛盾特殊性要求的具体问题具体分析（第 6 问）。三步排完，材料题的采分点自己就站好队了。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">每张卡片三行：学生真会写的错句、教材语言、错在哪。先盖住后两行，自己说一遍，再对答案。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 矛盾就是自相矛盾，说话前后不一致。</p>
<p class="er-v">✓ 矛盾是反映事物内部和事物之间对立统一关系的哲学范畴，是客观的、普遍的。</p>
<p class="er-w">错在哪：把哲学矛盾混同逻辑矛盾。逻辑矛盾是思维出错，改口就行；哲学矛盾躲不开，也改不掉。</p>
</div>
<div class="er">
<p class="er-x">✗ 矛盾是坏事，我们要努力消除矛盾，建设没有矛盾的社会。</p>
<p class="er-v">✓ 矛盾具有普遍性，要承认矛盾、分析矛盾、勇于揭露矛盾，找出解决矛盾的正确方法；矛盾是事物发展的源泉和动力。</p>
<p class="er-w">错在哪：把「矛盾」当贬义词。矛盾推动发展，旧矛盾解决了，新的又会出现，关键在怎么解决。</p>
</div>
<div class="er">
<p class="er-x">✗ 特殊性寓于普遍性之中，先有共性再有个性。</p>
<p class="er-v">✓ 普遍性寓于特殊性之中，并通过特殊性表现出来；特殊性也离不开普遍性。</p>
<p class="er-w">错在哪：把「寓于」的方向说反。共性是从个性里概括出来的，离开具体的个性，就没有共性。</p>
</div>
<div class="er">
<p class="er-x">✗ 主要矛盾就是矛盾的主要方面，两个说的是同一件事。</p>
<p class="er-v">✓ 主要矛盾是复杂事物发展过程中处于支配地位、对事物发展起决定作用的矛盾；矛盾的主要方面是同一矛盾中处于支配地位、起主导作用的一方。</p>
<p class="er-w">错在哪：混淆「矛盾之间」和「矛盾内部」。前者比几件事，后者比一件事的两面。</p>
</div>
<div class="er">
<p class="er-x">✗ 坚持两点论，就是两面都看、平均用力、面面俱到。</p>
<p class="er-v">✓ 两点论是有重点的两点论，重点论是看到两点中的重点，二者统一于认识和实践中。</p>
<p class="er-w">错在哪：把两点论做成了均衡论。答题要点出「其中哪一面是重点」，否则只写了一半。</p>
</div>
<div class="er">
<p class="er-x">✗ 具体问题具体分析，就是遇到问题灵活处理，想怎么解决就怎么解决。</p>
<p class="er-v">✓ 具体问题具体分析，就是在矛盾普遍性原理的指导下，具体分析矛盾的特殊性，并找出解决矛盾的正确方法。</p>
<p class="er-w">错在哪：丢掉「普遍性原理指导」这个前提，就滑向主观随意，跟「灵活处理」混成一团。</p>
</div>
<div class="er">
<p class="er-x">✗ 矛盾双方相互转化是无条件的，只要坚持就能转化。</p>
<p class="er-v">✓ 矛盾双方在一定条件下相互转化；同一性是有条件的、相对的，斗争性是无条件的、绝对的。</p>
<p class="er-w">错在哪：漏掉「一定条件」。转化要讲条件，条件不具备时，喊得再响也转不过来。</p>
</div>
