<p class="gx-lede">上一框讲“钱怎么分”，这一框讲“分完之后，谁掉下去有人接”。社会保险、社会救助、社会福利、社会优抚，四样东西分工不同，考试却总把它们混成一锅。最容易错的一件事：把“社会保障”读成“国家发钱”，或者把“社会保险”和“商业保险”当成一回事。这一页干三件事：把四支柱拆开、把“适度”拖给你看、把评析题的答题话术钉死。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<p style="margin:0 0 14px;font-size:14px;line-height:1.85;color:#3a3a35">先想一个画面。家里人住院，账单两万三，医保报销一万五，你自己掏八千。你爸失业那几个月，领过失业保险金。你奶奶每月有一笔养老金，准时到账。去年发大水，村里领过救灾款和临时补助。这四笔钱不是天上掉下来的，它们分别对应社会保障的四个组成部分。这一框要你记住的，就是“这四笔钱分别叫什么、钱从哪来、为什么不能无限加”。</p>

<p style="margin:0 0 14px;font-size:14px;line-height:1.85;color:#3a3a35">把那笔账拆开看：报销的一万五来自医保基金，你掏的八千是个人负担。一场病就能看出社保在干什么——它不让你因为一次意外就返贫。这就是“增进人民福祉”最具体的含义，也是“安全网”三个字的来历。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 社会保障的地位<span class="q-src">人教版（2019）必修2 经济与社会 · 第四课第二框</span></p>
<p class="q-b">社会保障是保障和改善民生、维护社会公平、增进人民福祉的基本制度保障。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个条件</b>组成。①它管的是“民生”，不是某个行业、某个企业；②它维护的是“社会公平”，不是企业利润；③它是“基本制度保障”，意思是兜底的那一层，不是锦上添花。答“社会保障有什么意义”时，民生、公平、福祉三个词，至少落到两个。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 组成与核心<span class="q-src">人教版（2019）必修2 经济与社会 · 第四课第二框</span></p>
<p class="q-b">社会保障主要由社会保险、社会救助、社会福利、社会优抚等组成，其中社会保险是社会保障体系的核心。</p>
<p class="q-n">→ 这句话有两个采分点。①四个组成部分要写全，顺序可以换，“等”字说明还有别的，但答题写这四个就够；②“核心”只能给社会保险，不能给社会救助。社会救助是<b>最后一道防线</b>，社会福利是<b>更高层次</b>，社会优抚是<b>特殊保障</b>——三个定位各归各，串了门就丢分。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 完善社会保障体系的要求<span class="q-src">人教版（2019）必修2 经济与社会 · 第四课第二框</span></p>
<p class="q-b">完善社会保障体系，要坚持覆盖全民、统筹城乡、公平统一、安全规范、可持续。</p>
<p class="q-n">→ 五个词、十九个字，背下来就是一道大题的分点。①覆盖全民：谁都不能漏；②统筹城乡：城里乡下不搞两套标准；③公平统一：规则一样，不搞特殊；④安全规范：基金不能乱动、不能挪用；⑤可持续：不能今年发得爽、明年发不出。最后这个词，就是本页互动模型要讲的那件事。</p>
</div>

<p style="margin:0 0 12px;font-size:14px;line-height:1.85;color:#3a3a35">你可能会问：四个部分里，为什么只有社会保险叫“核心”？因为它的钱最多、覆盖面最广、跟你的日常最贴。养老、医疗、工伤、失业、生育，五险都在它里面。剩下三个是补位的：救助接住已经掉下去的人，福利把全体人的底线往上抬，优抚照顾做过特殊贡献的人。它们不是四个等级，是四种分工。</p>

<p style="margin:0 0 12px;font-size:14px;line-height:1.85;color:#3a3a35">再分一遍“保谁”，表就好背了。社会保险保的是参保的劳动者，你上班、单位给你缴，你就在网里；社会救助保的是已经陷入生存困境的人，不缴费也能申请；社会福利面向全体成员，老人、儿童、残疾人优先；社会优抚只面向军人、军烈属这类特殊群体。四个“保谁”对上了，四根柱子就不会立错位置。</p>

<p style="margin:0 0 12px;font-size:14px;line-height:1.85;color:#3a3a35">答题时还有个高频陷阱：把“社会保险”写成“社会保障”。社会保障是整张网，社会保险只是网里最粗的那根绳。题目问“社会保障的内容”，四项都写；题目问“社会保险的内容”，只写五险。范围不一样，写多了反而不给分。</p>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>社会保险</th><th>社会救助</th><th>社会福利</th><th>社会优抚</th></tr></thead>
<tbody>
<tr><td>保谁</td><td>参保的劳动者及其家庭</td><td>因自然灾害或其他原因陷入生存困境的公民</td><td>全体社会成员，重点是老、幼、病、残等群体</td><td>现役军人、军烈属、残疾军人等</td></tr>
<tr><td>钱从哪来</td><td>国家、单位、个人共同缴费</td><td>国家财政，社会捐助作补充</td><td>国家财政和社会力量</td><td>国家财政</td></tr>
<tr><td>管什么</td><td>养老、医疗、工伤、失业、生育五项基本保障</td><td>最低生活保障、特困人员供养、受灾人员救助</td><td>教育、医疗、住房、养老等福利事业</td><td>优待、抚恤、补助、安置</td></tr>
<tr class="key"><td>一句话定位</td><td>社会保障体系的<b>核心</b></td><td><b>最后一道防线</b></td><td><b>最高层次</b>的保障</td><td><b>特殊保障</b></td></tr>
<tr><td>要不要缴费</td><td>要，强制参保</td><td>不缴费，按规定申请、审核</td><td>不缴费，普惠享受</td><td>不缴费，按规定认定</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">背法：一核心（社会保险）＋一防线（社会救助）＋一层次（社会福利）＋一特殊（社会优抚）。答题时“核心”两个字只跟社会保险走，写“社会救助是核心”直接扣分。另一个口径：这四个不是“高低四等”，别写成“社会保险最高级、社会救助最低级”，它们只是分工不同。社会保障保的是“基本”，不是“全部”；保的是“底线”，不是“上限”。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点“下一步”。</p>

<p style="margin:0 0 14px;font-size:14px;line-height:1.85;color:#3a3a35">评析题最怕写成“一边倒”。这个观点有一半是对的：提高养老金，确实能改善老年生活。错的那一半藏在“一下子”和“发达国家水平”两个词里——它把“应该提高”偷换成了“立刻按别人的标准提高”。抓住这两个词，答案的骨架就出来了。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 评析类（观点辨析）<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">有人建议：“把养老金标准一下子提高到发达国家的水平，才叫有保障。”请运用“我国的社会保障”的有关知识，对这一观点进行评析。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题、定性</p>
<p class="s-b">题型是“评析”，知识范围被题干锁死在“我国的社会保障”。这个观点半对半错：想提高保障水平，方向没错；想“一下子”提到发达国家水平，做法错了。答题第一句就要亮出这个态度，别只写“正确”或“错误”。</p>
<p class="s-k">用到：评析题的定性、社会保障水平与经济发展水平相适应</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 先说合理在哪</p>
<p class="s-b">提高养老金标准，能让老年人生活更有底，能增进人民福祉、维护社会公平。社会保障本来就是保障和改善民生、维护社会公平、增进人民福祉的基本制度保障。这一层不写，答案就只剩“批”，会丢一半分。</p>
<p class="s-k">用到：社会保障的地位、增进人民福祉</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 再说错在哪</p>
<p class="s-b">养老金不是凭空印出来的，它来自社保基金；基金来自国家、单位、个人的缴费和财政补助。标准一步抬到发达国家水平，缴费端跟不上，只能靠财政兜底或者透支基金。结果无非三条：加税、降待遇、发不出。</p>
<p class="s-k">用到：社保基金、筹资渠道、可持续</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 落到原理上</p>
<p class="s-b">社会保障水平要与经济发展水平相适应。太低，保障不足，有人掉下去没人接；太高，财政负担过重、企业缴费压力大，还可能养懒人。所以要尽力而为、量力而行，把“需要”和“承受得起”放在一起算。</p>
<p class="s-k">用到：保障水平与经济发展水平相适应、尽力而为、量力而行</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口给正确做法</p>
<p class="s-b">完善社会保障体系，要坚持覆盖全民、统筹城乡、公平统一、安全规范、可持续；坚持公平原则，做到权责一致，国家、单位、个人共同参与。提高养老金要一步一步来，跟着经济发展走，而不是一步跨到别人几十年的水平。</p>
<p class="s-k">用到：覆盖全民、统筹城乡、公平统一、安全规范、可持续；公平原则、权责一致</p>
</li>
</ol>

<p class="ans-b">① 这一观点是片面的。它看到了提高保障水平的必要性，却忽视了社会保障水平要与经济发展水平相适应。<br>② 提高养老金标准，有利于改善老年人生活、增进人民福祉、维护社会公平，方向值得肯定。社会保障是保障和改善民生、维护社会公平、增进人民福祉的基本制度保障。<br>③ 但养老金来源于社保基金，社保基金来自国家、单位、个人缴费和财政补助。脱离经济发展水平和财政承受能力，把标准一步提高到发达国家水平，会使基金收不抵支、财政负担过重，最终不可持续。<br>④ 社会保障水平要与经济发展水平相适应：太低会保障不足，太高会加重财政负担、影响效率，要坚持尽力而为、量力而行。<br>⑤ 正确的做法是：完善社会保障体系，坚持覆盖全民、统筹城乡、公平统一、安全规范、可持续，坚持公平原则和权责一致，国家、单位、个人共同参与，随着经济发展逐步提高保障水平。</p>
</div>
</div>

<p style="margin:14px 0 0;font-size:14px;line-height:1.85;color:#3a3a35">把这道题的骨架记成一句话：方向肯定，做法否定，原理收口。下次遇到“某地要大幅提高某某标准”，你就按这三步拆，别从第一句开始硬写。</p>
</section>
<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>

<p style="margin:0 0 14px;font-size:14px;line-height:1.85;color:#3a3a35">下面六问，前三问考“是什么”，中间两问考“为什么”，最后一问考“会不会”。答的时候都用同一个顺序：先给课本定义，再给判据，最后落到“与经济发展水平相适应”。别一上来就举例，例子救不了定义。</p>

<div class="gx-qa">
<div class="qac">
<p class="q">“社会保障就是国家发钱吗？”</p>
<p class="a">不是。社会保障包括<b>社会保险、社会救助、社会福利、社会优抚</b>，以社会保险为核心；钱主要来自国家、单位、个人缴费和财政补助。它是依法建立的<b>制度</b>，不是逢年过节发红包，也不是谁想领就能领。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="社会保障的四个组成部分，以社会保险为核心">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>

<rect x="22" y="38" width="94" height="28" rx="6" fill="#e6f6ee" stroke="#bfe0cd"/>

<rect x="124" y="38" width="94" height="28" rx="6" fill="#fdf3e0" stroke="#f0dcb4"/>
<text class="ms" x="171" y="56" text-anchor="middle">社会救助</text>
<rect x="22" y="74" width="94" height="28" rx="6" fill="#ecfbff" stroke="#b8e6f2"/>
<text class="ms" x="69" y="92" text-anchor="middle">社会福利</text>
<rect x="124" y="74" width="94" height="28" rx="6" fill="#fdf1ee" stroke="#f0cbc4"/>
<text class="ms" x="171" y="92" text-anchor="middle">社会优抚</text>
<text class="ms" x="120" y="116" text-anchor="middle">以社会保险为核心</text>
</svg>
</div>
<div class="qac">
<p class="q">“社会保险到底包括哪五险？”</p>
<p class="a"><b>基本养老保险、基本医疗保险、工伤保险、失业保险、生育保险</b>。五险都强制参保、保基本，由用人单位和个人共同缴费（工伤、生育主要由单位缴）。记顺序：老、病、伤、失、育，别把“五险”和“一金”混着数。五险是法定的，不是单位愿不愿意的问题。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="社会保险五险：养老、医疗、工伤、失业、生育">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>

<rect x="58" y="44" width="40" height="34" rx="6" fill="#e6f6ee" stroke="#bfe0cd"/>
<rect x="102" y="44" width="40" height="34" rx="6" fill="#e6f6ee" stroke="#bfe0cd"/>
<rect x="146" y="44" width="40" height="34" rx="6" fill="#e6f6ee" stroke="#bfe0cd"/>
<rect x="190" y="44" width="40" height="34" rx="6" fill="#e6f6ee" stroke="#bfe0cd"/>
<text class="ms" x="34" y="65" text-anchor="middle">养老</text>

<text class="ms" x="166" y="65" text-anchor="middle">失业</text>
<text class="ms" x="210" y="65" text-anchor="middle">生育</text>
</svg>
</div>
<div class="qac">
<p class="q">“社会救助是不是在养懒人？”</p>
<p class="a">不是。社会救助针对<b>因自然灾害或其他原因陷入生存困境的公民</b>，是<b>最后一道防线</b>；要按规定申请、审核、公示，符合条件才发，条件变了就退出。它保的是“活得下去”，不是“躺着不干”。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="社会救助针对生存困境，需要申请审核，是最后一道防线">

</svg>
</div>
<div class="qac">
<p class="q">“为什么不能搞‘高福利’？”</p>
<p class="a">因为<b>保障水平要与经济发展水平相适应</b>。福利上去了，缴费和财政就得跟上；跟不上，只能加税、透支基金或者降待遇。高福利还会推高企业成本、削弱就业意愿，<b>最后买单的还是老百姓</b>。所以“高福利”不是善良，是没算账。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="保障水平超过承受能力，财政负担陡增，不可持续">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>

<div class="qac">
<p class="q">“城乡居民养老金为什么比职工低？”</p>
<p class="a">因为两类保险的<b>缴费水平、筹资渠道、统筹层次不同</b>：职工养老保险由单位和个人按工资比例缴，居民养老保险个人缴得少、主要靠财政补助。待遇跟缴费挂钩，这叫<b>权责一致</b>，不是看不起谁。统筹层次也不同：职工养老已全国统筹，居民养老以县市为主。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="职工养老保险缴费多待遇高，居民养老保险缴费少待遇低">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text class="mh" x="120" y="24" text-anchor="middle">缴费水平不同，待遇自然不同</text>
<path d="M40,106 H204" fill="none" stroke="#c9d4de" stroke-width="1.2"/>

<text class="ms" x="120" y="120" text-anchor="middle">权责一致：多缴多得、长缴多得</text>
</svg>
</div>
<div class="qac">
<p class="q">“社保基金会不会‘穿底’？”</p>
<p class="a">全国统筹、财政补助、国有资本划转都在给基金补水，<b>短期内不会穿底</b>；但人口老龄化是真实压力，所以课本才把“可持续”写进要求。要靠扩面、精算、渐进式改革，不是靠喊口号。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="社保基金一边进水一边出水，靠统筹补助维持可持续">

<p class="gx-note">六问其实是同一件事：社保是“网”，不是“钱包”。网要够大——四支柱齐全、覆盖全民；也要够结实——权责一致、可持续。答题时把“谁出钱、保谁、保到什么程度”这三问答对，六问就都通了。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 社会保障就是国家发钱，谁困难谁去领。</p>
<p class="er-v">✓ 社会保障主要由社会保险、社会救助、社会福利、社会优抚等组成，其中社会保险是社会保障体系的核心。</p>
<p class="er-w">错在哪：把“四支柱”缩成“发钱”，还漏了“以保险为核心”这个采分点，一句话丢两处。</p>
</div>
<div class="er">
<p class="er-x">✗ 社会保险和商业保险是一回事，都是保险公司卖的。</p>
<p class="er-v">✓ 社会保险强制、保基本、政府主导；商业保险自愿、营利、是补充。</p>
<p class="er-w">错在哪：判据是“谁办的、能不能不参加”。可以不参加的才是商业保险，社会保险不是保险公司卖的。</p>
</div>
<div class="er">
<p class="er-x">✗ 社会救助谁都可以领，不领白不领。</p>
<p class="er-v">✓ 社会救助针对因自然灾害或其他原因陷入生存困境的公民，是最后一道防线。</p>
<p class="er-w">错在哪：把“兜底”读成“普惠”。要申请、要审核，符合条件才发，条件变了就退出。</p>
</div>
<div class="er">
<p class="er-x">✗ 保障水平越高越好，最好一步提到发达国家水平。</p>
<p class="er-v">✓ 社会保障水平要与经济发展水平相适应，坚持尽力而为、量力而行。</p>
<p class="er-w">错在哪：只算“需要”，不算“承受得起”。脱离经济发展水平，基金就不可持续。记住“适度”两个字，比记住数字有用。</p>
</div>
<div class="er">
<p class="er-x">✗ 社会保障只是政府的事，跟企业和个人没关系。</p>
<p class="er-v">✓ 社会保障由国家、单位、个人共同参与，坚持权责一致。</p>
<p class="er-w">错在哪：忘了缴费端。国家定规则、给补助，单位个人要缴费，权利和义务对等。</p>
</div>
<div class="er">
<p class="er-x">✗ 有了社保就不用商业保险了，商业保险是浪费钱。</p>
<p class="er-v">✓ 商业保险是社会保险的补充，可以满足多层次、个性化的保障需求。</p>
<p class="er-w">错在哪：把“保基本”当成“全保”。社保保底线，超出底线的部分要靠商保补。</p>
</div>
<div class="er">
<p class="er-x">✗ 社保基金是我自己存的钱，我缴多少就该领多少。</p>
<p class="er-v">✓ 社会保险具有互助共济和再分配功能，基金统一管理、统筹使用。</p>
<p class="er-w">错在哪：把“统筹池”当成“个人存钱罐”，忽略了代际互助和再分配。</p>
</div>

      d2 += (i ? " L " : "M ") + xOf(v).toFixed(1) + " " + yOf(calc(v).burden).toFixed(1);
    }
    el("path", { d: d1, fill: "none", stroke: BLUE, "stroke-width": 2.4, "stroke-linejoin": "round" }, gA);
    el("path", { d: d2, fill: "none", stroke: AMBER, "stroke-width": 2.4, "stroke-linejoin": "round" }, gA);
    tx(gA, xOf(96), yOf(calc(96).cover) + 14, "覆盖效果", BLUE, "end", 8.8, 700, true);
    tx(gA, xOf(96), yOf(calc(96).burden) - 8, "财政负担", AMBER, "end", 8.8, 700, true);

    /* 三段标签 */
    tx(gA, xOf(20), py + 20, "不足", RED, "middle", 9, 700);
    tx(gA, xOf(55), py + 20, "适度", GREEN, "middle", 9, 700);
    tx(gA, xOf(85), py + 20, "压力大", AMBER, "middle", 9, 700);

    /* 当前竖线与点 */
    var cx = xOf(A);
    el("line", { x1: cx, y1: py, x2: cx, y2: py + ph, stroke: "#6b7280", "stroke-width": 1, "stroke-dasharray": "3 3" }, gA);
    el("circle", { cx: cx, cy: yOf(s.cover), r: 4.5, fill: BLUE, stroke: "#ffffff", "stroke-width": 1.5 }, gA);
    el("circle", { cx: cx, cy: yOf(s.burden), r: 4.5, fill: AMBER, stroke: "#ffffff", "stroke-width": 1.5 }, gA);
    tx(gA, cx, py + ph + 33, "L=" + Math.round(A), "#3a3a35", "middle", 8.4, 700);

    if (L === W) tx(gA, l.x + 20, l.y + l.h - 22, "读法：先看覆盖效果涨得快不快，再看财政负担什么时候变陡。", "#6b7280", "start", 8.8);

    /* ---------------- 右：两个读数 + 状态 ---------------- */
    panel(gB, r, "#e6e9ee");
    tx(gB, r.x + 20, r.y + 30, "当前位置的两个读数", "#5a6472", "start", 11, 700);
    tx(gB, r.x + 20, r.y + 52, "一个涨得越来越慢，一个涨得越来越快", "#9aa3ae", "start", 8.8, 400);

    var compact = L === N;
    var c1y = r.y + (compact ? 64 : 70), ch = compact ? 70 : 78;
    el("rect", { x: r.x + 20, y: c1y, width: r.w - 40, height: ch, rx: 8, fill: "#ffffff", stroke: BLUE + "55" }, gB);
    tx(gB, r.x + 34, c1y + 21, "覆盖效果", "#5a6472", "start", 8.8);
    tx(gB, r.x + 34, c1y + ch - 14, s.cover.toFixed(1), BLUE, "start", compact ? 20 : 23, 700);
    tx(gB, r.x + 150, c1y + ch - 14, "先快后慢，接近上限", "#6b7280", "start", 8.4);

    var c2y = c1y + ch + 14;
    el("rect", { x: r.x + 20, y: c2y, width: r.w - 40, height: ch, rx: 8, fill: "#ffffff", stroke: AMBER + "55" }, gB);
    tx(gB, r.x + 34, c2y + 21, "财政负担指数", "#5a6472", "start", 8.8);
    tx(gB, r.x + 34, c2y + ch - 14, s.burden.toFixed(1), AMBER, "start", compact ? 20 : 23, 700);
    tx(gB, r.x + 170, c2y + ch - 14, "越往后越陡", "#6b7280", "start", 8.4);

    var sy = c2y + ch + 22;
    el("rect", { x: r.x + 20, y: sy, width: r.w - 40, height: compact ? 74 : 92, rx: 8, fill: st.bg, stroke: st.col + "44" }, gB);
    tx(gB, r.x + 34, sy + 21, "状态判断", "#5a6472", "start", 8.6);
    tx(gB, r.x + 34, sy + 44, st.name, st.col, "start", compact ? 11.5 : 13, 700);
    tx(gB, r.x + 34, sy + (compact ? 64 : 66), st.sn, "#3a3a35", "start", 8.6);

    if (!compact) tx(gB, r.x + 24, sy + 116, "社会保障水平要与经济社会发展水平相适应。", GREEN, "start", 8.8, 700);
  }

  function render() {
    var s = calc(A), st = stateOf(A);
    $("gxVa").textContent = String(Math.round(A));
    $("gxVb").textContent = s.cover.toFixed(1);
    $("gxVc").textContent = s.burden.toFixed(1);
    $("gxVs").textContent = st.name;
    $("gxVsn").textContent = st.sn;
    $("gxStBox").style.background = st.bg;
    $("gxStBox").style.borderColor = st.col + "44";
    $("gxVs").style.color = st.col;
    draw();
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 20 }, { t: 1.2, v: 20 }, { t: 4, v: 55 }, { t: 6.5, v: 55 }, { t: 9, v: 95 }, { t: 11, v: 95 }, { t: 13, v: 20 }],
    keys: [20, 55, 95],
    value: A, min: 0, max: 100, step: 1,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__bio = { calc: calc, cases: [
    { v: 0, eq: { cover: 0, burden: 0 } },
    { v: 50, eq: { cover: 81.1, burden: 47.5 } },
    { v: 100, eq: { cover: 96.4, burden: 120 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
