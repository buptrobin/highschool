<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 历史方位<span class="q-src">人教版（2019）必修1 中国特色社会主义 · 第四课第一框</span></p>
<p class="q-b">2012 年党的十八大以来，中国特色社会主义进入新时代，这是我国发展新的历史方位。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个条件</b>组成（① 起点是 2012 年党的十八大；② 进入的是「新时代」；③ 定性是「新的历史方位」）。少掉③，就会把新时代写成「新社会形态」；少掉①，就会把起点误记成 2017 年十九大。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 新时代我国社会主要矛盾<span class="q-src">人教版（2019）必修1 中国特色社会主义 · 第四课第一框</span></p>
<p class="q-b">新时代我国社会主要矛盾已经转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。</p>
<p class="q-n">→ 翻成人话：这是<b>一整句、两个半截</b>——前半截讲「需要」，后半截讲「发展」，中间用「和」连。新表述要一字不差：是「美好生活需要」，不是「物质文化需要」；是「不平衡不充分的发展」，不是「落后的社会生产」。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 两个「没有变」<span class="q-src">人教版（2019）必修1 中国特色社会主义 · 第四课第一框</span></p>
<p class="q-b">我国仍处于并将长期处于社会主义初级阶段的基本国情没有变，我国是世界最大发展中国家的国际地位没有变。</p>
<p class="q-n">→ 翻成人话：这是<b>并列的两句</b>，两个「没有变」必须一起写：① 初级阶段的基本国情没有变；② 最大发展中国家的国际地位没有变。只写一个，答案就不完整；写成「初级阶段也变了」，直接错。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>旧表述（1981 年十一届六中全会）</th><th>新表述（2017 年党的十九大）</th></tr></thead>
<tbody>
<tr><td>人民需要一侧</td><td>人民日益增长的物质文化需要</td><td>人民日益增长的美好生活需要</td></tr>
<tr class="key"><td>完整表述</td><td>人民日益增长的物质文化需要同落后的社会生产之间的矛盾</td><td>人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾</td></tr>
<tr><td>制约一侧</td><td>落后的社会生产</td><td>不平衡不充分的发展</td></tr>
<tr><td>判断意义</td><td>社会主义初级阶段的主要矛盾</td><td>新时代社会主要矛盾已经转化，但两个「没有变」仍然成立</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">背法：只背「完整表述」这一行，两句话都要写全。表里只高亮这一行，因为考试要的就是整句，不是关键词填空。术语一个都不换：美好生活需要 / 不平衡不充分的发展 / 社会主义初级阶段 / 最大发展中国家。</p>
</section>

<p class="ex-q">党的十九大报告指出，中国特色社会主义进入新时代，我国社会主要矛盾已经转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。有同学据此认为：「主要矛盾都变了，说明我国已经走出了社会主义初级阶段，也不再是发展中国家。」结合材料，运用«中国特色社会主义»的知识，谈谈你对新时代我国社会主要矛盾变化的理解。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性</p>
<p class="s-b">题目问的是「如何理解变化」，要答三件事：变的是什么（新旧表述对照）、为什么会变（党的十八大以来的成就与需要升级）、什么没有变（两个「没有变」）。只答新表述，最多拿一半分。</p>
<p class="s-k">用到：历史方位 · 社会主要矛盾</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 把两句完整表述写出来</p>
<p class="s-b">旧表述：人民日益增长的物质文化需要同落后的社会生产之间的矛盾。新表述：人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。两处换词——「美好生活需要」对「不平衡不充分的发展」，一个字都不能改，也不能只写后半截。</p>
<p class="s-k">用到：主要矛盾新表述要一字不差</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 说明为什么会转化</p>
<p class="s-b">党的十八大以来，我国经济社会发展取得历史性成就、发生历史性变革，人民的需要从「物质文化」扩展到「美好生活」；制约发展的因素也从「落后的社会生产」变为「不平衡不充分的发展」。</p>
<p class="s-k">用到：需要一侧 + 制约一侧</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 把两个「没有变」写全</p>
<p class="s-b">我国仍处于并将长期处于社会主义初级阶段的基本国情没有变，我国是世界最大发展中国家的国际地位没有变。两个「没有变」必须一起写，只写一个就是漏点。</p>
<p class="s-k">用到：两个「没有变」</p>
</li>
<li class="step" hidden>

<p class="s-b">主要矛盾的变化没有改变我国社会主义初级阶段的判断，新时代是历史方位的判断，不是新社会形态。所以那位同学的说法是错误的：既没有走出初级阶段，也没有改变最大发展中国家的国际地位。</p>
<p class="s-k">用到：历史方位 ≠ 新社会形态</p>
