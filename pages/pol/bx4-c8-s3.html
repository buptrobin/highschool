<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写课本这句，不写你脑子里那句。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 面向世界、博采众长<span class="q-src">人教版（2019）必修4 哲学与文化 · 第八课第三框</span></p>
<p class="q-b">文化发展必须坚持胸怀天下，保持开放的心态。我们要学习借鉴一切有利于我国社会主义文化建设的有益经验、一切有利于丰富我国人民文化生活的积极成果、一切有利于发展我国文化事业和文化产业的经营管理理念和运行机制，以发展中国特色社会主义文化。</p>
<p class="q-n">→ 翻成人话：这句话里有三个「一切有利于」，是三道筛子，不是三个「全部拿来」。① 有益经验，看它对文化建设有没有用；② 积极成果，看能否丰富人民的文化生活；③ 理念和机制，看能否把文化事业和文化产业办得更好。筛子后面还有半句落点——「以发展中国特色社会主义文化」；开头那句「坚持胸怀天下」也别丢，开放不只是心态，还是眼光。少了落点，开放就成了逛超市，答题写不出「发展」两个字。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 立足国情、交流互鉴<span class="q-src">人教版（2019）必修4 哲学与文化 · 第八课第三框</span></p>
<p class="q-b">立足中国国情，实现不同文化的交流互鉴，应当坚持「洋为中用」，坚持以我为主、为我所用，坚守中华文化立场，吸收外来有益文化，推动当代中国文化发展。</p>
<p class="q-n">→ 翻成人话：这句话里有四个动作。① 立足中国国情——要解决的是中国的问题；② 坚持「洋为中用」——学来是给中国用的；③ 以我为主、为我所用——拿主意的是我们，得益的也是我们；④ 坚守中华文化立场、吸收外来有益文化——根不动，枝叶可以嫁接。两个坑还在：把「以我为主」听成「以我为准」，好像外来的都不能碰；把「为我所用」听成「拿来就用」，跳过消化和改造。踩一个，主观题就掉档。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 反对两种错误倾向<span class="q-src">人教版（2019）必修4 哲学与文化 · 第八课第三框</span></p>
<p class="q-b">对待外来文化，要反对文化复古主义和全盘西化论。那种一味固守本民族的传统文化、拒绝接受新文化和任何外来文化的倾向，被称为「守旧主义」和「封闭主义」；那种一味推崇外来文化、根本否定传统文化的倾向，被称为「民族虚无主义」和「历史虚无主义」。</p>
<p class="q-n">→ 翻成人话：这里有两组名字，别背串。拒斥外来、只认老祖宗的，叫「文化复古主义」，也叫「守旧主义」「封闭主义」；觉得外来的都好、把自己否定的，叫「全盘西化论」，也叫「民族虚无主义」「历史虚无主义」。名字不同，病根一样：都丢了中华文化的主体性。答题时「反对文化复古主义和全盘西化论」这一句，往往就是最后一个给分点。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>正确态度（课本口径）</th><th>封闭主义（守旧主义、文化复古主义）</th><th>民族虚无主义（历史虚无主义、全盘西化论）</th></tr></thead>
<tbody>
<tr><td>门开不开</td><td>开放，面向世界、博采众长</td><td>关着，一律拒绝交流</td><td>开着，但不设门槛</td></tr>

<tr><td>外来文化怎么看</td><td>辨别良莠，取其精华、去其糟粕</td><td>一律当糟粕</td><td>一律当精华</td></tr>
<tr><td>立足什么</td><td>立足中国国情，回答中国问题</td><td>只讲老祖宗，不看今天</td><td>只讲外面，不看中国</td></tr>
<tr><td>学完做什么</td><td>消化、改造、再创造，为我所用</td><td>不学，也就谈不上用</td><td>照搬，用完丢了根脉</td></tr>
<tr class="key"><td>一句话判据</td><td>有主体、有选择、有转化</td><td>错在「不进来」</td><td>错在「没自己」</td></tr>

</div>
<p class="gx-note">整张表只高亮最后一行：考场上真正要你选的是判据。背法就三问——门开没开、谁拿主意、有没有变成自己的东西；缺哪一问，就往对应那条沟里掉。五行是一条链：开放是前提，主体是原则，辨别是方法，立足是根基，转化是落点，顺序别倒。只剩一分钟就背四个词：开放、主体、辨别、转化，再补一句「反对两种错误」。</p>
</section>

<p class="gx-h2s">四张图：各讲一件事，按「是什么 → 怎么运转 → 怎么用」排。</p>

<p class="gx-note">这里有个坑：把「以我为主」写成「以我为准」，一字之差，意思从「我拿主意」变成「只有我对」。</p>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 原因类主观题 · 8 分<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">材料：某市要办一届「国际文化周」。筹备会上有三种意见。第一种：外国团队一律不请，免得「抢了风头」。第二种：节目单照搬国外热门 IP，主持人全程用外语，说这样才「国际化」。第三种：请外国团队来，但节目要和中国故事同台；引进的舞台技术先由本地团队拆解、改造，再用于本地剧目；外国节目也要经过内容审核，不适合的一律不上。问：结合材料，运用「正确对待外来文化」的知识，说明第三种意见为什么是正确态度。（8 分）</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性</p>
<p class="s-b">设问是「为什么是正确态度」，属于原因类，不是措施类。知识范围锁死「正确对待外来文化」，答题结构就是「开放 + 以我为主 + 辨别 + 反对两种错误」，四句话四个分点。先在草稿上写四个小标题，再回材料找对应句，别一边读一边写。范围写宽了，会被判偏题；写窄了，又漏掉「态度」这一层。</p>
<p class="s-k">用到：原因类 = 原理 + 材料对应 + 收口。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 摆出三种意见</p>
<p class="s-b">第一种是封闭主义：一律不请，等同于闭关自守、盲目排外。第二种是全盘西化论，也就是民族虚无主义：照搬热门 IP、全程外语，把自己的表达让出去了。第三种才是正确态度。这一步的作用是「对比定位」，让阅卷老师一眼看到你分得清三种立场。第二种最会伪装：嘴上说「国际化」，做的却是把标准交给别人。</p>
<p class="s-k">用到：反对封闭主义和民族虚无主义。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 拆第三种意见的三个动作</p>
<p class="s-b">「请外国团队来，和中国故事同台」是开放，对应面向世界、博采众长；「本地团队拆解、改造后再用」是以我为主、为我所用；「内容审核，不适合的不上」是辨别良莠，取其精华、去其糟粕。三个动作正好三个分点，一个不漏。材料里还有个隐藏动作叫「同台」：不是谁替代谁，而是并存、互相成就。三个动作写全，答案自然分成三段，不用另想结构。</p>
<p class="s-k">用到：开放、主体、辨别三层。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 一句原理一句材料</p>
<p class="s-b">格式固定：先写课本原理句，再写「材料中……正是……」。原理句不许改写，「以我为主、为我所用」不能写成「以我为主、为我服务」。每段三行以内，材料只摘关键词，不要整段抄题干。抄得多不加分，对得准才加分。分点之间空一行，序号写清楚，阅卷老师找分点比找文采重要。</p>
<p class="s-k">用到：原理句照课本，材料句摘关键词。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口</p>
<p class="s-b">最后一句落到文化自信和主体性：坚守中华文化立场，坚定文化自信，发展中国特色社会主义文化。这句是第 8 分，也是区分「会背」和「会用」的地方。写完回看一遍：四个分点有没有序号，术语有没有写错字。最容易写错的是「博采众长」写成「博彩众长」、「良莠」写成「良秀」。</p>
<p class="s-k">用到：文化自信 + 中华文化主体性收口。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">① 文化发展必须坚持胸怀天下、保持开放的心态，面向世界、博采众长。材料中请外国团队来、与中国故事同台，正体现了开放的心态和学习借鉴有益成果。<br>② 立足中国国情，坚持「洋为中用」，坚持以我为主、为我所用，坚守中华文化立场。材料中本地团队先拆解、改造引进技术，再用于本地剧目，说明学过来是为了自己用。<br>③ 对待外来文化要辨别良莠，取其精华、去其糟粕。材料中对节目内容进行审核、不适合的不上，就是在做辨别和选择。<br>④ 要反对文化复古主义和全盘西化论。第一种意见盲目排外，属于封闭主义；第二种意见照搬照抄、否定自己的表达，属于全盘西化论。因此要立足国情、交流互鉴，推动当代中国文化发展。</p>
</div>
</div>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「外来文化里好东西不少，是不是干脆全盘吸收？」</p>
<p class="a">不是。开放不等于不设门槛。课本给的是三道「一切有利于」：对社会主义文化建设有用、能丰富人民文化生活、能把文化事业和文化产业办得更好。凡是符合的，学；不符合的，不学。<b>全盘吸收等于取消辨别</b>，下一步就是民族虚无主义。考场上一句「取其精华、去其糟粕」就能站住脚。这就是「博采」和「全盘吸收」的分水岭。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="全盘吸收不等于博采众长示意图">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="20" y="30" font-size="9.4" font-weight="700" fill="#151a21">全盘吸收 ≠ 博采众长</text>
<line x1="20" y1="38" x2="220" y2="38" stroke="#d6e2ea"/>
<text x="20" y="58" font-size="9" fill="#3a3a35">✓ 三道「一切有利于」是筛子</text>
<text x="20" y="80" font-size="9" fill="#3a3a35">✓ 有益成果才学，学完要转化</text>
<text x="20" y="102" font-size="9" fill="#8a3a3a">✗ 一律搬进来，就是没门槛</text>
<text x="20" y="118" font-size="8.6" fill="#5a6470">开放讲心态，博采讲选择</text>
</svg>
</div>
<div class="qac">
<p class="q">「以我为主，是不是就该少学、甚至不学外国？」</p>
<p class="a">不是。以我为主讲的是<b>谁拿主意</b>，不是「学多少」的数量比例。它要求从中国实际出发、坚守中华文化立场、按中国人民的需要来取舍。把它理解成「少学、不学」，就滑进了封闭主义。判断标准是一条：学不学看需不需要，怎么学看谁来改造。数量可以商量，立场不能商量。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="以我为主不等于少学不学示意图">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="20" y="30" font-size="9.4" font-weight="700" fill="#151a21">以我为主 ≠ 关门</text>
<line x1="20" y1="38" x2="220" y2="38" stroke="#d6e2ea"/>
<text x="20" y="58" font-size="9" fill="#3a3a35">✓ 谁拿主意：中国、中国人</text>
<text x="20" y="80" font-size="9" fill="#3a3a35">✓ 学多少：看需不需要</text>
<text x="20" y="102" font-size="9" fill="#8a3a3a">✗ 越少学越爱国：这是封闭</text>
<text x="20" y="118" font-size="8.6" fill="#5a6470">主体讲立场，不讲数量</text>
</svg>
</div>
<div class="qac">
<p class="q">「封闭主义和民族虚无主义，一个太硬一个太软，到底错在哪？」</p>
<p class="a">错在同一个地方：都丢了中华文化的主体性。封闭主义怕比较，索性不让人进来；民族虚无主义把别人的标准当成标准，等于把自己交出去。一个是不敢看，一个是不敢认。<b>课本把两种错误一起反对，正因为病根相同</b>，答题时写「反对两种错误」比只写一种稳，两边都写才完整。</p>

<text x="30" y="64" font-size="8.8" fill="#3a3a35">封闭主义：不敢看外面</text>
<rect x="20" y="78" width="196" height="24" rx="6" fill="#ffffff" stroke="#cfe2f3"/>
<text x="30" y="94" font-size="8.8" fill="#3a3a35">民族虚无主义：不敢认自己</text>
<text x="20" y="118" font-size="8.8" font-weight="700" fill="#1c6b4b">都丢了主体性</text>

<div class="qac">
<p class="q">「学习借鉴和照搬照抄，界限到底在哪？」</p>
<p class="a">三看。一看标准谁定：按中国实际取舍，是借鉴；按别人的榜单取舍，是照搬。二看有没有结合：学完能和本地情况接上，是借鉴；原样不动，是照搬。三看有没有再创造：消化改造后长出自主能力，是借鉴；一直靠进口，是照搬。<b>照搬是搬运，借鉴是转化</b>。三看里最容易漏的是第三看：有没有长出自主能力。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="借鉴与照搬的三条界限示意图">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="20" y="30" font-size="9.4" font-weight="700" fill="#151a21">借鉴 / 照搬 三看</text>
<line x1="20" y1="38" x2="220" y2="38" stroke="#d6e2ea"/>
<text x="20" y="58" font-size="8.8" fill="#3a3a35">① 标准谁定：我还是别人</text>
<text x="20" y="78" font-size="8.8" fill="#3a3a35">② 有没有结合本地实际</text>
<text x="20" y="98" font-size="8.8" fill="#3a3a35">③ 有没有消化再创造</text>
<text x="20" y="118" font-size="8.8" font-weight="700" fill="#1c6b4b">三看全是「我」，才是借鉴</text>
</svg>
</div>
<div class="qac">
<p class="q">「文化自信和对外开放矛盾吗？」</p>
<p class="a">不矛盾，而且互相支撑。有自信，才敢把门打开，因为知道自己的根在哪，不怕比较；越怕开门，越说明心里没底。反过来，开放让中华文化在交流中吸收有益成果，底气更足。<b>自信不是自满，开放不是自弃</b>，两句话一样重要。所以文化自信和对外开放，是同一件事的两面；而关门只会让自己越来越窄。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="文化自信与对外开放互相支撑示意图">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="20" y="30" font-size="9.4" font-weight="700" fill="#151a21">自信与开放：互相撑</text>
<line x1="20" y1="38" x2="220" y2="38" stroke="#d6e2ea"/>
<text x="20" y="58" font-size="9" fill="#3a3a35">✓ 有根，才敢让人进来</text>
<text x="20" y="80" font-size="9" fill="#3a3a35">✓ 常交流，底气才更足</text>
<text x="20" y="102" font-size="9" fill="#8a3a3a">✗ 关门不是自信，是怕</text>
<text x="20" y="118" font-size="8.6" fill="#5a6470">自满更不是自信</text>
</svg>
</div>
<div class="qac">
<p class="q">「为什么说马克思主义中国化是『以我为主、为我所用』的范例？」</p>
<p class="a">因为它是外来理论，却没有被照抄。它同中国具体实际、同中华优秀传统文化相结合，长出中国化的成果，解决了中国的问题。既不因为「产地在外」就拒之门外，也不因为「理论先进」就本本照搬。<b>看结合、看能不能解决中国问题</b>，这正是以我为主、为我所用的做法。课本讲「立足国情」，用的正是这个例子。外来理论能不能用，看结合得好不好。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="外来理论中国化示意图">

<text x="20" y="80" font-size="9" fill="#3a3a35">✓ 同中华优秀传统文化结合</text>
<text x="20" y="102" font-size="9" fill="#8a3a3a">✗ 照抄本本，不看实际</text>
<text x="20" y="118" font-size="8.6" fill="#5a6470">看结合，不看产地</text>
</svg>
</div>
</div>
<p class="gx-note">六问其实是同一件事，都在问三个问题：主体是谁、为谁所用、怎么转化。把这三问答顺，外来文化这一框的题，无论材料换成电影、节日、技术还是理论，落笔顺序都一样。所以复习时不用背六个答案，背一条链条：开门—筛选—转化—收口。时间只剩三天，就默写这条链条，再拿两道真题对着材料找位置。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 外来文化里先进成果多，应该大胆全盘吸收。</p>
<p class="er-v">✓ 对待外来文化要辨别良莠，取其精华、去其糟粕，学习借鉴一切有利于我国社会主义文化建设的有益成果。</p>
<p class="er-w">错在：把「开放」当成「不设门槛」。文化有良莠，一律吸收等于取消选择，再往前一步就是民族虚无主义。考场上把「辨别良莠」四个字写出来，比写「批判吸收」更贴课本。术语分是白送的，别丢。</p>
</div>
<div class="er">
<p class="er-x">✗ 以我为主，就是少引进，最好不学外国。</p>
<p class="er-v">✓ 以我为主、为我所用，是指学习借鉴要以中国实际和人民需要为出发点，坚守中华文化立场，坚持中华文化的主体性。</p>
<p class="er-w">错在：把「主体」偷换成「数量」。以我为主讲谁拿主意，不讲学多少；拿它当排外借口，正是封闭主义。判断时先问「谁定标准」，别数「学了几样」。判据是「主体」，不是「数量」。</p>
</div>
<div class="er">
<p class="er-x">✗ 学习借鉴外来文化，照着搬过来最省事。</p>
<p class="er-v">✓ 学习借鉴要经过消化、改造、再创造，使之与我国实际相结合，服务于中国人民。</p>
<p class="er-w">错在：搬运不等于借鉴。原样搬来往往水土不服，改造过才叫「为我所用」。答题要写出「消化、改造、再创造」三个动作。答案里出现「结合实际」四个字，往往就是这半句的分。改造过一次，才敢说学懂了。</p>
</div>
<div class="er">
<p class="er-x">✗ 过洋节就是崇洋媚外，学校应该一律禁止。</p>
<p class="er-v">✓ 对待外来文化要辨别良莠；文化交流可以借鉴吸收，但要坚持中华文化立场、坚定文化自信。</p>
<p class="er-w">错在：把「交流」和「媚外」画等号。一概禁止滑向封闭主义；真正要防的，是过洋节时把自己的文化看低。禁止不等于自信；真正的自信是敢放在一起比。节日的热闹可以共享，文化的根不能借。</p>
</div>
<div class="er">
<p class="er-x">✗ 外国的东西都落后，只有我们传统文化才先进。</p>
<p class="er-v">✓ 文化各有特色、各有长短，要面向世界、博采众长，学习借鉴外来文化的有益成果。</p>
<p class="er-w">错在：用「先进／落后」一刀切。这话表面像爱国，实际拒绝了借鉴，还是封闭主义那一套。它把「学习借鉴」整段删掉了。</p>
</div>
<div class="er">
<p class="er-x">✗ 文化自信就是觉得自己的文化什么都好，一点不用改。</p>
<p class="er-v">✓ 文化自信是坚守中华文化立场，同时推动中华优秀传统文化创造性转化、创新性发展。</p>
<p class="er-w">错在：把自信做成自满。自信要站得住，也要转得动；只讲「都好」，就丢掉了发展的那一半。「转化」两个字写不出来，这题最多拿一半分。自信要容得下比较。</p>
</div>
<div class="er">
<p class="er-x">✗ 马克思主义是外来理论，所以不能作为指导思想。</p>
<p class="er-v">✓ 马克思主义必须同中国具体实际、同中华优秀传统文化相结合，不断推进马克思主义中国化时代化。</p>
<p class="er-w">错在：用「产地」判断理论。要看它是否与中国实际结合、能否解决中国问题，而不是看它诞生在哪里。这类题考「结合」，不考「产地」。把「结合」写出来，这题就有分。</p>
</div>
