<p class="gx-lede">开学前你去办身份证：取号、填表、拍照、交材料，跑了两趟才拿到。你可能会问：这些窗口凭什么要这份证明、凭什么盖那个章？第八课讲法治中国建设，三框是一条线：法治国家是目标，法治政府是重点，法治社会是基础。这一框专门讲政府——它手里的权从哪里来、按什么规矩用、向谁负责。最容易错的一件事，是把「法治政府」听成「政府说了算」。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">三句话管全框：法治政府有七个特征、依法行政有六项要求、建设法治政府有具体抓手。先照抄，再拆关键词。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 法治政府的内涵<span class="q-src">人教版（2019）必修3 政治与法治 · 第八课第二框</span></p>
<p class="q-b">法治政府就是职能科学、权责法定、执法严明、公开公正、智能高效、廉洁诚信、人民满意的政府。</p>
<p class="q-n">→ 翻成人话：这一句是七块积木，答题时缺一块就少一个采分点。怎么记？前两块管「政府有多少权」：<b>职能科学</b>说该管什么，<b>权责法定</b>说凭什么管。中间三块管「权怎么用」：<b>执法严明</b>、<b>公开公正</b>、<b>智能高效</b>。后两块管「用权的人靠不靠得住」：<b>廉洁诚信</b>、<b>人民满意</b>。材料给一段做法，你拿七个词去对号：出现「晒清单」→权责法定；出现「记录仪」→执法严明；出现「一网通办」→智能高效。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 依法行政<span class="q-src">人教版（2019）必修3 政治与法治 · 第八课第二框</span></p>
<p class="q-b">依法行政是现代法治政府行使权力普遍奉行的基本准则。依法行政，要求政府在党的领导下，在法治轨道上开展工作，做到合法行政、合理行政、程序正当、高效便民、诚实守信、权责统一。</p>
<p class="q-n">→ 翻成人话：六项要求是六个检查角度。<b>合法行政</b>问「有没有依据」，<b>合理行政</b>问「罚得合不合适」，<b>程序正当</b>问「步骤能不能省」，<b>高效便民</b>问「群众跑几趟」，<b>诚实守信</b>问「说过的话算不算数」，<b>权责统一</b>问「出了事谁负责」。注意这里有个坑：依法行政的「法」，是宪法和法律，不是某份红头文件，也不是某位领导的口头指示。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 建设法治政府与它的地位<span class="q-src">人教版（2019）必修3 政治与法治 · 第八课第二框</span></p>
<p class="q-b">建设法治政府，要依法行政，深化「放管服」改革，转变政府职能，坚持科学决策、民主决策、依法决策，严格规范公正文明执法，强化对行政权力的制约和监督，全面推进政务公开。法治政府建设是全面依法治国的重点任务和主体工程。</p>
<p class="q-n">→ 翻成人话：前半句是「怎么办」，六个动作可以当六个分点写；后半句是「为什么重要」，一句话定地位，材料题结尾抄它最稳。<b>重点任务</b>是说它在法治中国建设里排前面，<b>主体工程</b>是说政府这个「施工队」体量最大、管的事最多。教材还给了时间表：到 2035 年，法治国家、法治政府、法治社会基本建成。答题时把「重点任务和主体工程」原样写出来，比写「很重要」有用得多。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>「全能」政府</th><th>「无为」政府</th><th>法治政府</th></tr></thead>
<tbody>
<tr><td>管多少事</td><td>什么都管，审批层层加码</td><td>什么都不管，遇事推着走</td><td>该管的管好，不该管的不伸手</td></tr>
<tr><td>权力从哪来</td><td>谁官大听谁的</td><td>没人负责，也说不清依据</td><td>宪法和法律授予，清单上写着</td></tr>
<tr><td>办事依据</td><td>政策、指示、老经验</td><td>没有依据，拖着不办</td><td>法定职责必须为，法无授权不可为</td></tr>
<tr class="key"><td>真正的区别</td><td>权力没有边界</td><td>责任没有着落</td><td>权力有清单、责任有清单、行使有程序</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只高亮最后一行，因为考试最爱在这三行里设陷阱：一边骂「管太多」，一边又盼「什么都管」。判断标准就一句：<b>有没有清单、有没有程序、有没有责任</b>。三样都有，才是法治政府；三样都缺，管多管少都不对。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，在草稿纸上写下「职能、清单、执法、公开、服务、满意」六个词，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 措施类材料题<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">材料：某市从三方面推进法治政府建设。一是公布市级权力清单 3287 项、责任清单 412 项，清单之外不再新设审批；二是城管、市场监管等部门执法时出示证件、全程佩戴记录仪，重大处罚决定先经法制审核；三是把 1200 多项政务服务搬上「一网通办」，企业开办从 5 天压缩到 1 天，同时公开年度预算和处罚结果，年底请第三方做群众满意度测评。结合材料，说明该市是如何建设法治政府的。（12 分）</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性</p>
<p class="s-b">设问是「如何」，属于措施类，答「怎么做」，不是答「为什么重要」。知识范围锁定「法治政府」，别答成「法治国家」或「法治社会」——那是第八课另外两框。</p>
<p class="s-k">用到：措施类＝做法＋对应特征</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 找主体</p>
<p class="s-b">材料里有四拨主体：市政府（晒清单、定政策）、执法部门（公示、记录、审核）、政务服务平台（一网通办）、企业和群众（被服务、被监督）。主体分清了，才不会把「群众满意度测评」写成「公民行使监督权」。</p>
<p class="s-k">用到：政府、执法部门、服务平台、企业群众</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 找行为</p>
<p class="s-b">晒两张清单→权责法定；出示证件、佩戴记录仪→执法严明；公示、记录、法制审核→公开公正；一网通办、压缩时限→智能高效；公开预算和处罚结果→公开公正；满意度测评→人民满意。六个行为，对六个点。</p>
<p class="s-k">用到：清单、记录仪、审核、一网通办、公开、测评</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 对应原理</p>
<p class="s-b">每个行为配一句课本话：清单配「法无授权不可为、法定职责必须为」；记录仪配「严格规范公正文明执法」；审核配「重大执法决定法制审核」；一网通办配「转变政府职能、优化政务服务」；公开配「让权力在阳光下运行」；测评配「宗旨是为人民服务」。</p>
<p class="s-k">用到：七个特征＋依法行政</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口</p>
<p class="s-b">最后一句定地位：法治政府建设是全面依法治国的重点任务和主体工程。再补一句总要求：依法行政，政府在党的领导下、在法治轨道上开展工作。分点写，每点第一句给术语，第二句引材料。</p>
<p class="s-k">用到：重点任务和主体工程、依法行政</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">① 职能科学。该市压减审批事项、优化办事流程，把该管的管好、不该管的不伸手，转变了政府职能。<br>② 权责法定。公布权力清单 3287 项、责任清单 412 项，清单之外不再新设审批，做到法定职责必须为、法无授权不可为。<br>③ 执法严明。执法时出示证件、全程佩戴记录仪，严格规范公正文明执法，做到有法必依、执法必严、违法必究。<br>④ 公开公正。落实行政执法公示制度、执法全过程记录制度、重大执法决定法制审核制度，公开年度预算和处罚结果，让权力在阳光下运行。<br>⑤ 智能高效。1200 多项政务服务上线「一网通办」，企业开办从 5 天压缩到 1 天，用技术手段优化政务服务。<br>⑥ 廉洁诚信、人民满意。政府履约守信，接受群众监督，年底开展第三方满意度测评，把人民满意作为检验标准。<br>结论：法治政府建设是全面依法治国的重点任务和主体工程；依法行政是现代法治政府行使权力普遍奉行的基本准则，政府要在党的领导下、在法治轨道上开展工作。</p>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。每问先自己答一句，再看下面那句。</p>
<div class="gx-qa">

<div class="qac">
<p class="q">「法治政府，是不是政府自己说了算、效率高就行？」</p>
<p class="a">不是。法治政府是<b>职能科学、权责法定、执法严明、公开公正、智能高效、廉洁诚信、人民满意</b>的政府，七个词里没有一个字是「效率高就行」。政府行使权力要依法，还要接受监督、承担责任。效率高但越权办事，那不叫法治政府，叫乱作为；按规矩办、该办的办成，才叫法治政府。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="政府的权力来自宪法和法律，不能自己想怎么用就怎么用">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="28" font-size="9" text-anchor="middle" fill="#151a21">政府也要受法律约束</text>
<rect x="18" y="40" width="86" height="32" rx="7" fill="#ffffff" stroke="#b8e6d0"/>
<text x="61" y="60" font-size="8.6" text-anchor="middle" fill="#1e6640">政府</text>
<path d="M 108 56 L 124 56" stroke="#c9d6df" stroke-width="2"/>
<path d="M 124 51 L 132 56 L 124 61 Z" fill="#c9d6df"/>
<rect x="136" y="40" width="86" height="32" rx="7" fill="#ffffff" stroke="#e7d3b8"/>
<text x="179" y="60" font-size="8.6" text-anchor="middle" fill="#8a5c14">宪法和法律</text>
<text x="120" y="96" font-size="8.2" text-anchor="middle" fill="#3a3a35">权力是法律授予的，不是自带的</text>
<text x="120" y="116" font-size="8" text-anchor="middle" fill="#6b7280">越权办事，效率再高也是乱作为</text>
</svg>
</div>

<div class="qac">
<p class="q">「依法行政，依的是政策、还是法律？」</p>
<p class="a">依的是<b>宪法和法律</b>。依法行政要求政府在党的领导下、在法治轨道上开展工作。政策可以指导工作，但政策不能越过法律；红头文件违法，一样要被纠正、被撤销。答题时写「依法行政」，别写成「依政策行政」「依领导指示行政」，四个字之差，性质完全不同。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="依法行政的依据是宪法和法律，政策要在法律框架内">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="26" font-size="9" text-anchor="middle" fill="#151a21">依的「法」是哪一层</text>
<rect x="18" y="34" width="204" height="24" rx="6" fill="#ffffff" stroke="#b8e6d0"/>
<text x="30" y="50" font-size="8.2" fill="#1e6640">宪法和法律：最高依据，不能越过</text>
<rect x="18" y="64" width="204" height="24" rx="6" fill="#ffffff" stroke="#e7d3b8"/>
<text x="30" y="80" font-size="8.2" fill="#8a5c14">政策、规划：可以指导，不能违法</text>
<rect x="18" y="94" width="204" height="24" rx="6" fill="#ffffff" stroke="#f3c9cf"/>
<text x="30" y="110" font-size="8.2" fill="#9f1239">领导指示、口头意见：不是依据</text>
</svg>
</div>

<div class="qac">
<p class="q">「政府管得越多，是不是越负责任？」</p>
<p class="a">不是。政府职能要<b>科学</b>：该管的管好，不该管的不伸手。课本两句原话记牢——法定职责必须为，法无授权不可为。管得太多，企业被捆住手脚，群众多跑冤枉路；该管不管，市场就乱、安全就没底。所以才有「放管服」改革：该放的放掉，该管的管好，服务做优。</p>

<p class="a">权力清单管<b>能做什么</b>，清单之外不能伸手，叫法无授权不可为；责任清单管<b>必须做什么</b>，写上去的事不办就是失职，叫法定职责必须为。一个划边界，一个压担子，合起来才是权责法定。材料里只写一张，答案就少一半。</p>

<p class="q">「执法三项制度，各管哪一段？」</p>
<p class="a">按时间排：<b>执法公示</b>管事前，依据、程序、结果先亮出来；<b>全过程记录</b>管事中，文字音像全程留痕；<b>重大执法决定法制审核</b>管决定前，先过法律关，未经审核不得作出。三段连起来，执法才既有力又有据。看到记录仪、公示平台、审核意见书，分开对号，不要一律写「严格执法」。</p>

<p class="q">「为什么建设法治政府，总要提『人民满意』？」</p>
<p class="a">因为政府的宗旨是<b>为人民服务</b>，工作的基本原则是对人民负责。人民满意不是第七个特征之外的附加项，而是前六个的检验标准：职能科学不科学、执法严明不严明，最后要看群众办事顺不顺、权益有没有保障。材料题收尾写这一句，格局就完整了。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。先盖住后两行，自己改一遍，再对答案。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 法治政府就是政府说话算数、办事效率高，能办成事就行。</p>
<p class="er-v">✓ 法治政府是职能科学、权责法定、执法严明、公开公正、智能高效、廉洁诚信、人民满意的政府，政府行使权力要依法，并接受监督、承担责任。</p>
<p class="er-w">错在哪：把「法治」当成了「有权威」。法治政府的重点不是政府说了算，而是政府也得受法律约束。</p>
</div>
<div class="er">
<p class="er-x">✗ 依法行政，就是照着上级的政策和指示办。</p>
<p class="er-v">✓ 依法行政要求政府在党的领导下、在法治轨道上开展工作，依据是宪法和法律，做到合法行政、合理行政、程序正当、高效便民、诚实守信、权责统一。</p>
<p class="er-w">错在哪：把「法」换成了「政策」。政策可以指导工作，但违法的地方性文件、违法指令都要被纠正。</p>
</div>
<div class="er">
<p class="er-x">✗ 政府管得越多越好，什么都管才是负责任。</p>
<p class="er-v">✓ 政府职能要科学，法定职责必须为、法无授权不可为；该管的管好，不该管的不伸手，通过「放管服」改革转变政府职能。</p>
<p class="er-w">错在哪：把「负责」等同于「包办」。管得太多会捆住市场手脚，该管不管才是失职。</p>
</div>
<div class="er">
<p class="er-x">✗ 权力清单就是给政府减负，让政府少干点活。</p>
<p class="er-v">✓ 权力清单明确政府能做什么，清单之外不能伸手，体现法无授权不可为；责任清单明确政府必须做什么，体现法定职责必须为。</p>
<p class="er-w">错在哪：把清单当成「免责牌」。清单既是边界，也是责任，两张清单要一起写。</p>
</div>
<div class="er">
<p class="er-x">✗ 政务公开就是把所有文件都挂到网上，公开得越多越好。</p>
<p class="er-v">✓ 政务公开要依法进行，涉及国家秘密、商业秘密、个人隐私的信息不予公开；公开的目的是让权力在阳光下运行，方便群众监督。</p>
<p class="er-w">错在哪：把「公开」理解成「全公开」。公开有范围、有程序，不是把文件一股脑倒上网。</p>
</div>
<div class="er">
<p class="er-x">✗ 智能高效就是买个系统、开个 App，把线下流程搬到线上。</p>
<p class="er-v">✓ 智能高效要运用互联网、大数据等技术手段优化政务服务，减环节、减材料、减时间，让群众少跑腿，落脚点是人民满意。</p>
<p class="er-w">错在哪：把手段当成了目的。流程一点没改，只把排队搬到网上，那叫网上排队，不叫智能高效。</p>
</div>
<div class="er">
<p class="er-x">✗ 法治政府建设是政府自己的事，跟普通群众没什么关系。</p>
<p class="er-v">✓ 法治政府建设是全面依法治国的重点任务和主体工程；政府要为人民服务、对人民负责，人民满意是检验标准，公民可以监督、评议，也可以申请行政复议、提起行政诉讼。</p>
<p class="er-w">错在哪：把法治政府当成机关内部的事。它管的是你和政府打交道的每一次办事、每一次执法。</p>
</div>
