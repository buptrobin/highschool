<p class="gx-lede">「集合」是整个高中数学的第一块地基：后面函数的定义域、值域、不等式的解集，全部要用集合的语言来写。这一节概念少，但判分极狠——一道 5 分的填空，错在「互异性」上就是 0 分，而且每年都有人错在同一处：把 {1,1,2} 当成 3 个元素。下面按「课本原话 → 拆四张图 → 自己拖一眼 → 完整走一道题 → 六问 → 易错句」的顺序走一遍。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 元素与集合<span class="q-src">人教A版必修第一册 · 第一章第一节</span></p>
<p class="q-b">一般地，我们把研究对象统称为元素，把一些元素组成的总体叫做集合。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个条件</b>组成。① 元素是「研究对象」，可以是数、点、式子，不限于数；② 集合是「总体」，是一个整体，不是散着摆的几样东西；③ 只有<b>确定</b>的对象才能凑成总体，说不清在不在的，一律不成集合。后面讲的三性，就是从这个定义里长出来的。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 元素与集合的关系<span class="q-src">人教A版必修第一册 · 第一章第一节</span></p>
<p class="q-b">如果 a 是集合 A 的元素，就说 a 属于 A，记作 a∈A；否则记作 a∉A。</p>
<p class="q-n">→ 翻成人话：<b>两个条件</b>。① 只有 ∈ 与 ∉ 两种关系，非此即彼，没有第三种写法；② 符号的<b>左边必须是一个元素，右边必须是一个集合</b>，位置写反或两边都写集合（如 A∈B）都是错的。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 三性<span class="q-src">人教A版必修第一册 · 第一章第一节</span></p>
<p class="q-b">集合中的元素具有确定性、互异性、无序性。</p>
<p class="q-n">→ 翻成人话：<b>三个条件缺一不可</b>。不确定 → 根本不是集合；重复 → 同一个元素只算一次，写两遍等于写一遍；顺序换 → 还是同一个集合。考试真正扣分的是第二条。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>条件</th><th>课本要求</th><th>缺了它，你会怎么错</th></tr></thead>
<tbody>
<tr><td>确定性</td><td>任给一个对象，能判断它在不在这个集合里</td><td>「高个子同学」「接近 1 的数」都被当成集合，其实不成立</td></tr>
<tr class="key"><td>互异性</td><td>同一个元素在集合里只算一次</td><td>把 {1,1,2} 数成 3 个元素；求参数时算出两个 a 却都不检验</td></tr>
<tr><td>无序性</td><td>元素写的前后顺序不影响集合</td><td>把 {1,2} 与 {2,1} 当成两个不同集合，个数、判断全错</td></tr>
<tr><td>元素类型不限</td><td>数、点、式子、字母都能当元素</td><td>看到 {(1,2)} 以为是两个数，其实是<b>一个点</b></td></tr>
<tr><td>空集也算集合</td><td>∅ 是不含任何元素的集合</td><td>把 ∅ 与 {0} 混为一谈，认为它们元素个数都是 1</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只高亮一行：<b>互异性</b>。这一节所有「求参数 a」的题，最后一步几乎都是回代检验互异性——写出 a 的值只是拿一半分。另一处高频混淆是 <span class="gx-fml">∅ ≠ {0}</span>：∅ 里一个元素都没有，{0} 里有一个元素 0，两者元素个数分别是 0 和 1。</p>
</section>

<section class="gx-sec" id="b">
<h2><span class="sn">02</span>拆开看</h2>
<p class="gx-h2s">四张图：各讲一件事，按「是什么 → 怎么变 → 怎么用」排。</p>

<p class="fig-s">三性不是三个并列的口号，而是三道<b>筛子</b>：先看对象是否确定，再看重复的是否只算一次，最后看顺序是否无关。判一个说法是不是集合、一个集合有几个元素，就按从左到右的顺序过一遍。</p>

<rect x="40" y="58" width="236" height="158" rx="8" fill="#ffffff" stroke="#b8e6d0"/>
<text x="54" y="82" font-size="10.5" font-weight="700" fill="#1f6b46">① 确定性</text>
<text x="54" y="106" font-size="9.4" fill="#3a3a35">给一个对象，必须能判断</text>
<text x="54" y="121" font-size="9.4" fill="#3a3a35">它到底在不在集合里。</text>
<text x="54" y="145" font-size="9.4" fill="#6b7280">「高个子同学」不成立，</text>
<text x="54" y="160" font-size="9.4" fill="#6b7280">因为多高算高没标准。</text>
<text x="54" y="192" font-size="9.2" font-weight="700" fill="#b8402f">→ 不确定就不是集合</text>

<rect x="292" y="58" width="236" height="158" rx="8" fill="#fff8f2" stroke="#e8b98a"/>
<text x="306" y="82" font-size="10.5" font-weight="700" fill="#a2540f">② 互异性</text>
<text x="306" y="106" font-size="9.4" fill="#3a3a35">同一个元素只算一次，</text>
<text x="306" y="121" font-size="9.4" fill="#3a3a35">重复写等于只写一遍。</text>
<text x="306" y="145" font-size="9.4" fill="#6b7280">{1,1,2} 与 {1,2}</text>
<text x="306" y="160" font-size="9.4" fill="#6b7280">是同一个集合。</text>
<text x="306" y="192" font-size="9.2" font-weight="700" fill="#b8402f">→ 求 a 后必须回代检验</text>

<rect x="544" y="58" width="236" height="158" rx="8" fill="#ffffff" stroke="#b8d2e8"/>
<text x="558" y="82" font-size="10.5" font-weight="700" fill="#1f5288">③ 无序性</text>
<text x="558" y="106" font-size="9.4" fill="#3a3a35">元素写的前后顺序，</text>
<text x="558" y="121" font-size="9.4" fill="#3a3a35">不影响集合是哪一个。</text>
<text x="558" y="145" font-size="9.4" fill="#6b7280">{1,2} 与 {2,1}</text>
<text x="558" y="160" font-size="9.4" fill="#6b7280">是同一个集合。</text>
<text x="558" y="192" font-size="9.2" font-weight="700" fill="#2f8a5b">→ 换顺序不算换集合</text>
</svg>
<span class="gx-zoomchip">点击放大</span>
</div>
<p class="gx-take">判断一个说法成不成立、一个集合有几个元素，就按「确定性 → 互异性 → 无序性」的顺序过一遍，三关都过才动笔。</p>
</figure>

<figure class="gx-fig">
<div class="fig-cap">

<svg viewBox="0 0 820 260" role="img" aria-label="属于与不属于符号以及常用数集符号表">

<figure class="gx-fig">
<div class="fig-cap">

<p class="fig-s">两种写法说的是同一个集合，选的依据只有一个：<b>元素少就列举，元素写不完就描述</b>。描述法的竖线「|」是结构的一部分，竖线前写代表元素，竖线后写它满足的条件，绝不能把竖线换成逗号。</p>
<div class="gx-svgbox">
<svg viewBox="0 0 820 250" role="img" aria-label="列举法与描述法的对照卡片">

<text x="36" y="42" font-size="11.5" font-weight="700" fill="#151a21">同一集合，两种写法</text>

<rect x="40" y="56" width="350" height="140" rx="8" fill="#ffffff" stroke="#b8e6d0"/>
<text x="54" y="78" font-size="10.2" font-weight="700" fill="#1f6b46">列举法：把元素一一列出来</text>
<text x="54" y="110" font-size="12" font-weight="700" fill="#151a21">A = {1, 2, 3}</text>
<text x="54" y="138" font-size="9.4" fill="#3a3a35">元素之间用逗号隔开，全部写在</text>
<text x="54" y="153" font-size="9.4" fill="#3a3a35">大括号里，顺序随便、重复删掉。</text>
<text x="54" y="180" font-size="9.2" font-weight="700" fill="#2f8a5b">适用：元素个数有限，数得清</text>

<rect x="430" y="56" width="350" height="140" rx="8" fill="#ffffff" stroke="#b8d2e8"/>
<text x="444" y="78" font-size="10.2" font-weight="700" fill="#1f5288">描述法：写清元素满足什么</text>
<text x="444" y="110" font-size="11" font-weight="700" fill="#151a21">B = {x | x&gt;1 且 x∈R}</text>
<text x="444" y="138" font-size="9.4" fill="#3a3a35">竖线前写代表元素 x，竖线后写</text>
<text x="444" y="153" font-size="9.4" fill="#3a3a35">它满足的条件，两条缺一不可。</text>
<text x="444" y="180" font-size="9.2" font-weight="700" fill="#2f8a5b">适用：元素写不完，如大于 1 的实数</text>

<text x="40" y="220" font-size="9.4" font-weight="700" fill="#b8402f">竖线写成逗号，如 {x, x&gt;1}，是错写法：逗号表示「这些都是元素」，意思全变了。</text>
</svg>
<span class="gx-zoomchip">点击放大</span>
</div>

<h2><span class="sn">04</span>一道题走一遍</h2>

<div class="gx-ex">
<p class="ex-t">例题 · 由元素与集合的关系求参数<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">已知集合 A = {a+2, (a+1)², a²+3a+3}，若 1∈A，求 a 的值。<br>陷阱：三个元素分别等于 1 会算出好几个 a，其中有两个<b>会让集合出现重复元素</b>，必须回代检验、舍去。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 把「1∈A」翻译成方程</p>
<p class="s-b">1∈A 表示 1 是 A 的元素，而 A 里只有 a+2、(a+1)²、a²+3a+3 这三个「位置」，所以 1 必须等于其中之一，<b>至少有一种情况成立</b>。于是分三种情况列方程，逐个解。</p>
<p class="s-k">用到：元素与集合的关系 a∈A，以及集合由它的元素唯一确定。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 情况一：a+2=1</p>
<p class="s-b">解得 a=−1。回代：a+2=1，(a+1)²=0，a²+3a+3=1−3+3=1，此时 A={1,0,1} 中 1 出现两次，<b>与互异性矛盾</b>，故 a=−1 舍去。</p>
<p class="s-k">用到：互异性——同一元素只能出现一次。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 情况二：(a+1)²=1</p>
<p class="s-b">解得 a=0 或 a=−2。分别回代：a=0 时 A={2,1,3}，三个元素互不相同，成立；a=−2 时 A={0,1,1}，1 重复，舍去。</p>
<p class="s-k">用到：解得多个值时，必须逐个回代检验互异性。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 情况三：a²+3a+3=1</p>
<p class="s-b">即 a²+3a+2=0，解得 a=−1 或 a=−2。这两个值在第 2、3 步已被淘汰，不产生新的答案。</p>
<p class="s-k">用到：分类要「不重不漏」，重复的答案并到一起。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口：写出答案并点明检验</p>
<p class="s-b">三种情况合起来只有 a=0 通过检验，且此时 A={2,1,3}，确实含 1。答案唯一：a=0。答题卡上要写出「回代检验互异性」这一步，缺了它通常只给一半分。</p>
<p class="s-k">用到：检验是结论的一部分，不是草稿。</p>
</li>

<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>

<div class="qac">
<p class="q">集合里的元素能不能重复？写两遍算两个吗？</p>
<p class="a">不能，写两遍也只算一个。集合中的元素具有<b>互异性</b>，所以 {1,1,2} 与 {1,2} 是同一个集合，元素个数都是 <b>2</b>。凡是题目让你数元素个数，先合并相同的再数。</p>

<p class="q">∅ 与 {0} 不是都能写成空集吗？它们一样吧？</p>
<p class="a">不一样。<b>∅ 与 {0} 不是一回事</b>：∅ 不含任何元素，元素个数是 <b>0</b>；{0} 含一个元素 0，元素个数是 <b>1</b>。所以 0∈{0}，而 0∉∅。</p>

<div class="qac">
<p class="q">描述法那个竖线前面到底写什么？写成逗号行不行？</p>

    g.row1 = l.y + (nar ? 76 : 92);
    g.row2 = l.y + (nar ? 186 : 210);
    g.noteY = l.y + (nar ? 252 : 288);
    g.ax0 = r.x + (nar ? 34 : 52);
    g.ax1 = r.x + r.w - (nar ? 34 : 46);
    g.axY = r.y + (nar ? 84 : 96);
    g.lbY = g.axY + 20;
    g.txtY = r.y + (nar ? 132 : 158);
    return g;
  }

  function chip(g, x, y, w, h, main, sub, col, bg, dash) {
    el("rect", { x: x, y: y, width: w, height: h, rx: 8, fill: bg, stroke: col, "stroke-width": dash ? 1.4 : 1, "stroke-dasharray": dash ? "5 4" : "" }, g);
    tx(g, x + w / 2, y + (sub ? h / 2 - 3 : h / 2 + 5), main, col, "middle", 15, 700);
    if (sub) tx(g, x + w / 2, y + h - 11, sub, col, "middle", 8.4, 400);
  }

  function draw() {
    var g = G, s = calc(A);
    var gA = $("gxA"), gB = $("gxB");
    gA.textContent = ""; gB.textContent = "";
    el("rect", { x: L.left.x, y: L.left.y, width: L.left.w, height: L.left.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    el("rect", { x: L.right.x, y: L.right.y, width: L.right.w, height: L.right.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    tx(gA, L.left.x + 18, L.left.y + 28, "把 a 代进去，再合并重复", "#5a6472", "start", 10.2, 700);
    tx(gB, L.right.x + 18, L.right.y + 28, "数轴上 a 落在哪，决定元素个数", "#5a6472", "start", 10.2, 700);

    /* 第一行：代入后写出来的样子（含重复） */
    tx(gA, g.cx0, g.row1 - 12, "代入 a = " + s.a + "：S = {" + s.a + ", 1, 2}", "#3a3a35", "start", 10, 400);
    var vals = [s.a, 1, 2];
    for (var i = 0; i < 3; i++) {
      var v = vals[i], dup = vals.indexOf(v) !== i;
      var x = g.cx0 + i * (g.cw + g.gap);
      chip(gA, x, g.row1, g.cw, g.ch, String(v), dup ? "重复" : "元素", dup ? "#b8402f" : "#2f8a5b", dup ? "#fbeae7" : "#ffffff", dup);
    }

    /* 第二行：合并重复后的集合 */
    var merged = [], k;
    for (k = 0; k < 3; k++) if (merged.indexOf(vals[k]) < 0) merged.push(vals[k]);
    tx(gA, g.cx0, g.row2 - 12, "合并重复后：S = {" + merged.join(", ") + "}", "#3a3a35", "start", 10, 400);
    for (k = 0; k < merged.length; k++) {
      chip(gA, g.cx0 + k * (g.cw + g.gap), g.row2, g.cw, g.ch, String(merged[k]), "元素", "#1f5288", "#eef5fc", false);
    }
    tx(gA, g.cx0, g.noteY, "元素个数 = 3 − 重复 1 个 = " + s.size, s.dup ? "#b8402f" : "#2f8a5b", "start", 10, 700);

    /* 右边：数轴（有箭头、有刻度） */
    var y = g.axY, step = (g.ax1 - g.ax0) / 4, j, px;
    el("line", { x1: g.ax0, y1: y, x2: g.ax1 + 8, y2: y, stroke: "#5a6472", "stroke-width": 1.3 }, gB);
    el("polygon", { points: (g.ax1 + 18) + "," + y + " " + (g.ax1 + 6) + "," + (y - 5) + " " + (g.ax1 + 6) + "," + (y + 5), fill: "#5a6472" }, gB);
    for (j = 0; j <= 4; j++) {
      px = g.ax0 + j * step;
      el("line", { x1: px, y1: y - 5, x2: px, y2: y + 5, stroke: "#5a6472", "stroke-width": 1.2 }, gB);
      tx(gB, px, y + 20, String(j), "#5a6472", "middle", 9, 400);
    }
    tx(gB, g.ax1 + 16, y - 12, "a", "#5a6472", "middle", 9.5, 700);
    /* 1 与 2：重复发生的两个位置 */
    el("circle", { cx: g.ax0 + step, cy: y, r: 3.6, fill: "#b8402f" }, gB);
    el("circle", { cx: g.ax0 + 2 * step, cy: y, r: 3.6, fill: "#b8402f" }, gB);
    /* 当前 a 的位置 */
    el("circle", { cx: g.ax0 + s.a * step, cy: y, r: 7.5, fill: "#2563eb", opacity: 0.18 }, gB);
    el("circle", { cx: g.ax0 + s.a * step, cy: y, r: 3, fill: "#2563eb" }, gB);

    var x0 = L.right.x + 24, wmax = L.right.w - 48;
    tx(gB, x0, g.txtY, "a = " + s.a + "，S 里写着 3 个位置", "#3a3a35", "start", 10, 400);
    tx(gB, x0, g.txtY + 22, "重复的元素 " + s.dup + " 个，只算一次", s.dup ? "#b8402f" : "#2f8a5b", "start", 10, 700);
    tx(gB, x0, g.txtY + 44, "所以元素个数是 " + s.size + " 个", "#1f5288", "start", 10.5, 700);
    wrap(gB, x0, g.txtY + 74, s.dup ? "a 与已有的元素撞了，互异性把多余的那个吃掉。" : "三个元素互不相同，数出来就是 3 个。", wmax, 9.4, "#6b7280", 15);
    tx(gB, x0, g.txtY + 122, "红点 = 1 与 2，这两个值必须检验", "#b8402f", "start", 9, 700);
  }

  function render() {
    if (!G) { L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N; G = geom(); stage.setAttribute("viewBox", L.vb); }
    var s = calc(A);
    $("gxVa").textContent = String(s.a);
    $("gxVb").textContent = String(s.size) + " 个";
    $("gxVc").textContent = String(s.dup) + " 个";
    var st, col, bg, sn;
    if (s.dup) { st = "有重复"; col = "#b8402f"; bg = "#fbeae7"; sn = "只剩 2 个元素"; }
    else { st = "互不相同"; col = "#2f8a5b"; bg = "#e6f6ee"; sn = "共 3 个元素"; }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    draw();
  }

  function layout() {
    var w = stage.parentElement.getBoundingClientRect().width;
    L = w >= 640 ? W : N; G = geom();
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 0 }, { t: 1.2, v: 0 }, { t: 2.4, v: 1 }, { t: 5, v: 1 }, { t: 7.5, v: 2 }, { t: 10, v: 4 }, { t: 12.5, v: 0 }],
    keys: [0, 1, 2, 4],
    value: A, min: 0, max: 4, step: 1,
    idle: 5000,
    onChange: function (v) { A = Math.round(v); render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc, cases: [
    { v: 0, eq: { size: 3, dup: 0 } },
    { v: 1, eq: { size: 2, dup: 1 } },
    { v: 2, eq: { size: 2, dup: 1 } },
    { v: 4, eq: { size: 3, dup: 0 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
</body>
</html>
