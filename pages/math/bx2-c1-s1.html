<p class="gx-claim">向量的身份证只有两项：<b>模</b>和<b>方向</b>；平移不换身份证，所以「相等」必须<b>同向且等长</b>。</p>
<div class="gx-meta">
<span><i></i>人教A版必修第二册 第六章第1节</span>
<span><i></i>高一 · 必修第二册</span>
<span><i></i>阅读 13 分钟</span>
<span><i></i>含 1 个互动模型</span>
</div>
<p class="gx-lede">这一节是整章的地基：后面的向量加法、数乘、坐标、数量积，全都建立在「有大小、有方向、不管位置」这三句话上。最容易错的一件事是拿向量比大小——向量没有大小顺序，能比的只有它的模；其次是把「平行」背成「同向」，漏掉反向。把这两处按住，6.1 的判断类小题基本不会丢分。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 向量的定义<span class="q-src">人教A版必修第二册 · 第六章第1节</span></p>
<p class="q-b">既有大小又有方向的量叫做向量。</p>
<p class="q-n">→ 翻成人话：一句话里其实压着<b>两个条件</b>：① 有大小；② 有方向。少任何一个都不是向量——只剩大小是标量（质量、温度），只剩方向连「量」都算不上。课本接着说「向量可以用有向线段表示」，但有向线段的起点只是画图用的落脚点，不是向量的要素。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 零向量与单位向量<span class="q-src">人教A版必修第二册 · 第六章第1节</span></p>
<p class="q-b">长度为 0 的向量叫做零向量，记作 0；长度等于 1 个单位长度的向量，叫做单位向量。</p>
<p class="q-n">→ 这两个定义都只锁「长度」一个条件。零向量的方向是<b>任意的</b>，不是「没有方向」；单位向量只看长度等于 1，方向不限，所以每个方向都有一个单位向量，一共无数个。把「方向任意」背成「没有方向」，是选择题里最常见的送分变送命。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 平行向量与相等向量<span class="q-src">人教A版必修第二册 · 第六章第1节</span></p>
<p class="q-b">方向相同或相反的非零向量叫做平行向量（也叫共线向量）；长度相等且方向相同的向量叫做相等向量。</p>
<p class="q-n">→ 平行向量的定义里藏着<b>三个条件</b>：① 非零；② 方向相同<b>或</b>相反（二者居一即可）；③ 与位置无关。相等向量是另外<b>两个条件</b>：长度相等 + 方向相同，缺一不可。零向量与任意向量平行是单独的一条<b>规定</b>，不靠这两句推出来。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>条件</th><th>教材怎么写</th><th>少了这一条会错成什么</th></tr></thead>
<tbody>
<tr><td>有大小</td><td>向量有模，记作 |a|</td><td>只剩大小就是标量，比如 3 kg，不是向量</td></tr>
<tr><td>有方向</td><td>用有向线段的箭头表示</td><td>只说长度就成了线段，方向被吞掉</td></tr>
<tr><td>非零</td><td>平行向量限定「非零向量」</td><td>以为零向量不参与平行——其实规定它与任意向量平行</td></tr>
<tr><td>方向相同或相反</td><td>「或」表示二选一即可</td><td>把平行背成同向，反向的整类题全丢</td></tr>
<tr class="key"><td>同向且等长</td><td>相等向量＝长度相等 + 方向相同</td><td>只看 |a| = |b|，把方向不同的向量判成相等</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只高亮了一行：判<b>平行</b>先查是否非零，再看方向同或反；判<b>相等</b>先看方向，再看模。两步的顺序不能反，因为方向错了，模再相等也不是同一个向量。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>

<div class="gx-ex">
<p class="ex-t">例题 · 概念辨析（三命题选正确）<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">判断下列命题是否正确：① 若 |a| = |b|，则 a = b；② 若 a ∥ b，则 a 与 b 方向相同；③ 零向量与任意向量平行。其中正确的是（　　）<br>A. ①②　B. ③　C. ①③　D. ②③</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题：三个命题考三个定义</p>
<p class="s-b">① 考相等向量的条件，② 考平行向量的条件，③ 考零向量的规定。逐个对条件，不要凭「感觉像对的」。</p>
<p class="s-k">用到：相等向量、平行向量、零向量的定义</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 判 ①：只有长度相等不够</p>
<p class="s-b">|a| = |b| 只满足「长度相等」这一个条件。方向可以不同，所以 a 与 b 不一定相等。取 a = (1, 0)，b = (0, 1)，两者模都是 1，但方向不同，a ≠ b。</p>
<p class="s-k">用到：相等向量＝长度相等 + 方向相同</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 判 ②：平行还包含反向</p>
<p class="s-b">a ∥ b 指 a 与 b 是平行（共线）向量，方向<b>相同或相反</b>都可以。反向时 a ∥ b 成立，但「方向相同」不成立，所以 ② 错。</p>
<p class="s-k">用到：平行向量＝方向相同或相反的非零向量</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 判 ③：零向量靠规定</p>
<p class="s-b">零向量长度是 0、方向任意，课本<b>规定</b>它与任意向量平行。注意这句不能由「方向相同或相反」推出，它是单独的一条约定。</p>
<p class="s-k">用到：零向量与任意向量平行（规定）</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口：排除法定选项</p>
<p class="s-b">①② 都错，只有 ③ 对，所以选 B。写完再回头扫一眼 ②：反向这种情形最容易在考场上被漏掉。</p>
<p class="s-k">用到：排除法 + 逐条对条件</p>
</li>

<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">
① <b>错</b>。|a| = |b| 只说明模相等；相等向量还要求方向相同，方向不同时 a ≠ b。<br>
② <b>错</b>。a ∥ b 表示 a 与 b 方向相同或相反；反向时仍平行，但不是「方向相同」。<br>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">向量能不能比较大小？</p>
<p class="a">不能。向量没有大小顺序，<b>能比的只有模</b>：可以写 |a| &gt; |b|，但不能写 a &gt; b。方向不同的两个向量之间连「谁大」都无从谈起。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="两个向量的模可以比较">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="16" y="26" font-size="9" fill="#3a3a35">模可以比大小</text>

<text x="150" y="86" font-size="8.5" fill="#5a6472">|b| = 2</text>
<text x="16" y="116" font-size="8.8" fill="#b8402f">向量本身不能写 a &lt; b</text>
</svg>
</div>
<div class="qac">
<p class="q">零向量有没有方向？</p>
<p class="a">有，而且<b>方向是任意的</b>。零向量长度是 0，方向没有确定的指向，课本把它规定成「任意方向」，所以它能和任何向量平行。说它「没有方向」是错的。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="零向量方向任意">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="16" y="26" font-size="9" fill="#3a3a35">方向是任意的</text>
<circle cx="70" cy="70" r="5" fill="#b8402f"/>
<line x1="70" y1="70" x2="70" y2="46" stroke="#b8402f" stroke-width="1.4" stroke-dasharray="3 3"/>
<line x1="70" y1="70" x2="94" y2="70" stroke="#b8402f" stroke-width="1.4" stroke-dasharray="3 3"/>
<line x1="70" y1="70" x2="70" y2="94" stroke="#b8402f" stroke-width="1.4" stroke-dasharray="3 3"/>
<line x1="70" y1="70" x2="46" y2="70" stroke="#b8402f" stroke-width="1.4" stroke-dasharray="3 3"/>
<text x="16" y="116" font-size="8.8" fill="#3a3a35">不是「没有方向」</text>
</svg>
</div>
<div class="qac">
<p class="q">平行向量一定画在同一条直线上吗？</p>
<p class="a">不一定。平行看的是<b>方向</b>，不是位置：方向相同或相反的非零向量就是平行向量，它们所在的两条直线可以平行、也可以重合。所以「共线向量」这个名字里的「线」不是同一条线。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="平行向量可以不在同一直线上">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="16" y="26" font-size="9" fill="#3a3a35">可以不共线（不同直线）</text>

<text x="112" y="58" font-size="8.5" fill="#2563eb">a</text>
<line x1="44" y1="90" x2="124" y2="90" stroke="#2f8a5b" stroke-width="2"/>
<polygon points="124,90 114,94 114,86" fill="#2f8a5b"/>
<text x="130" y="94" font-size="8.5" fill="#2f8a5b">b</text>
<text x="16" y="118" font-size="8.8" fill="#5a6472">看方向，不看位置</text>
</svg>
</div>
<div class="qac">
<p class="q">单位向量有几个？它们相等吗？</p>
<p class="a">有<b>无数个</b>：每个方向都有一个长度为 1 的向量。但单位向量<b>不一定相等</b>，因为相等还要求方向相同。只有方向也相同的两个单位向量才相等。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="单位向量方向不同">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>

<circle cx="120" cy="70" r="32" fill="none" stroke="#c7dbfa" stroke-width="1.2" stroke-dasharray="4 3"/>

<polygon points="88,70 97,73.5 97,66.5" fill="#2f8a5b"/>

<polygon points="120,38 116.5,47 123.5,47" fill="#b8791f"/>
<text x="16" y="120" font-size="8.8" fill="#b8402f">单位向量有无数个</text>
</svg>
</div>
<div class="qac">
<p class="q">相等向量与共线向量有什么区别？</p>
<p class="a">共线只看<b>方向</b>（相同或相反），长度可以不同；相等要<b>方向相同且长度相等</b>。所以共线不一定相等，但两个相等向量一定共线。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="共线不必相等">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>

<text x="150" y="86" font-size="8.5" fill="#2f8a5b">b</text>
<text x="16" y="116" font-size="8.6" fill="#5a6472">共线不必相等；相等必须同向等长</text>
</svg>
</div>
<div class="qac">
<p class="q">两个向量「不共线」意味着什么？</p>
<p class="a">意味着<b>方向既不相同也不相反</b>，也就是不平行，而且两个都非零。这样的两个向量方向不同，后面才能当作一组基底去表示其他向量。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="两个不共线的向量">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>

<path d="M 74 88 A 22 22 0 0 0 68.1 74.6" fill="none" stroke="#b8791f" stroke-width="1.4"/>
<text x="138" y="92" font-size="8.5" fill="#2f8a5b">b</text>
<text x="116" y="44" font-size="8.5" fill="#2563eb">a</text>
<text x="16" y="118" font-size="8.8" fill="#5a6472">即不平行，可作一组基底</text>
</svg>
</div>
</div>
<p class="gx-note">这六问其实是同一件事：<b>方向</b>和<b>模</b>是两个独立的开关。比大小时只动模，判平行时只看方向，判相等时两个都要对；零向量是唯一一个「方向随便、长度为零」的特例，单独记。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 向量可以比较大小，a &gt; b 就是 a 比 b 长。</p>
<p class="er-v">✓ 向量不能比较大小；能比较的是模：|a| &gt; |b|。</p>
<p class="er-w">错在哪：把「长度的大小」偷换成「向量的大小」。向量带方向，没有大小顺序，两个不共线的向量之间写不出大于号。</p>
</div>
<div class="er">
<p class="er-x">✗ 零向量没有方向，所以它和谁都不平行。</p>
<p class="er-v">✓ 零向量的方向是任意的；规定零向量与任意向量平行。</p>
<p class="er-w">错在哪：把「方向任意」读成「没有方向」。正因为方向任意，它才能和任何方向「对得上」，平行才成立。</p>
</div>
<div class="er">
<p class="er-x">✗ 平行向量一定在同一条直线上，不然怎么叫共线？</p>
<p class="er-v">✓ 方向相同或相反的非零向量叫平行向量，也叫共线向量；它们可以不在同一条直线上。</p>
<p class="er-w">错在哪：按字面理解「共线」。这里的「线」指方向所在的那组平行线，不要求两条有向线段落在同一条直线上。</p>
</div>
<div class="er">
<p class="er-x">✗ 因为 |a| = |b|，所以 a = b。</p>
<p class="er-v">✓ 长度相等且方向相同的向量才叫相等向量。</p>
<p class="er-w">错在哪：只对了两个条件里的一个。模相等、方向不同的两个向量（比如 (1, 0) 和 (0, 1)）并不相等。</p>
</div>
<div class="er">
<p class="er-x">✗ 单位向量都相等，长度都是 1 嘛。</p>
<p class="er-v">✓ 单位向量长度都是 1，方向可以不同，所以不一定相等。</p>
<p class="er-w">错在哪：忘了相等还要方向相同。每个方向都有一个单位向量，它们模相同、方向不同，是无数个不同的向量。</p>
</div>
<div class="er">
<p class="er-x">✗ 共线向量就是方向相同的向量。</p>
<p class="er-v">✓ 方向相同<b>或相反</b>的非零向量都是平行（共线）向量。</p>
<p class="er-w">错在哪：漏掉反向。「或」是二选一即可，反向的 a 与 b 照样共线，只是方向不同、不相等。</p>
</div>
</div>
<p class="gx-note">复习时按顺序过一遍：先问「是不是向量」（大小 + 方向），再问「模是多少」，最后问「方向和谁比」。三步走完，六条错句一条都套不上。</p>
</section>

  }

  function drawAxes(g) {
    var P = L.left, cx = G.cx, cy = G.cy, s = G.s;
    el("rect", { x: P.x, y: P.y, width: P.w, height: P.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, g);
    tx(g, P.x + 20, P.y + 28, "向量 a 的方向角 θ", "#5a6472", "start", G.title, 700);
    arrow(g, cx - G.xr, cy, cx + G.xr, cy, "#9aa3ae", 1.2, 7);
    arrow(g, cx, cy + G.yr, cx, cy - G.yr, "#9aa3ae", 1.2, 7);
    tx(g, cx + G.xr + 8, cy - 5, "x", "#8a94a0", "start", 9, 700);
    tx(g, cx + 7, cy - G.yr - 6, "y", "#8a94a0", "start", 9, 700);
    var ks = [-2, -1, 1, 2], i, k, x, y;
    for (i = 0; i < ks.length; i++) {
      k = ks[i];
      x = cx + k * s;
      el("line", { x1: num(x), y1: cy - 4, x2: num(x), y2: cy + 4, stroke: "#9aa3ae", "stroke-width": 1 }, g);
      tx(g, x, cy + G.tick, (k < 0 ? "−" : "") + Math.abs(k), "#8a94a0", "middle", G.small);
      y = cy - k * s;
      el("line", { x1: cx - 4, y1: num(y), x2: cx + 4, y2: num(y), stroke: "#9aa3ae", "stroke-width": 1 }, g);
      tx(g, cx - 7, y + 3, (k < 0 ? "−" : "") + Math.abs(k), "#8a94a0", "end", G.small);
    }
    tx(g, cx - 8, cy + G.tick, "O", "#8a94a0", "end", 9, 700);
  }

  function drawLeft(g) {
    var s = calc(A), cx = G.cx, cy = G.cy, S = G.s;
    var tipX = cx + G.r * s.cos, tipY = cy - G.r * s.sin;
    var deg = A;

    drawAxes(g);

    /* 角 θ 的扇形与弧线：画布 y 轴朝下，数学逆时针 = sweep-flag 0 */
    if (deg > 3 && deg < 357) {
      var ax = cx + G.arc, ay = cy;
      var bx2 = cx + G.arc * s.cos, by2 = cy - G.arc * s.sin;
      var large = deg > 180 ? 1 : 0;
      var d = "M " + num(cx) + " " + num(cy) + " L " + num(ax) + " " + num(ay) +
              " A " + G.arc + " " + G.arc + " 0 " + large + " 0 " + num(bx2) + " " + num(by2) + " Z";
      el("path", { d: d, fill: "rgba(184,121,31,0.08)", stroke: "none" }, g);
      el("path", {
        d: "M " + num(ax) + " " + num(ay) + " A " + G.arc + " " + G.arc + " 0 " + large + " 0 " + num(bx2) + " " + num(by2),
        fill: "none", stroke: "#b8791f", "stroke-width": 1.6
      }, g);
      var mA = deg / 2, lr = G.arc + 15;
      tx(g, cx + lr * Math.cos(mA * Math.PI / 180), cy - lr * Math.sin(mA * Math.PI / 180) + 3, "θ", "#b8791f", "middle", 10, 700);
    }

    /* 投影虚线：a 的终点垂直落到 x 轴 */
    if (Math.abs(s.sin) > 0.04) {
      el("line", { x1: num(tipX), y1: num(tipY), x2: num(tipX), y2: num(cy), stroke: "#b8791f", "stroke-width": 1.1, "stroke-dasharray": "4 4" }, g);
      el("circle", { cx: num(tipX), cy: num(cy), r: 2.4, fill: "#b8791f" }, g);
    }

    /* 直角记号：垂直时在 a 那一侧画小方块 */
    if (s.kind === 1) {
      var sg = s.sin > 0 ? -1 : 1;
      el("path", { d: "M " + num(cx + 15) + " " + num(cy) + " L " + num(cx + 15) + " " + num(cy + sg * 15) + " L " + num(cx) + " " + num(cy + sg * 15), fill: "none", stroke: "#2563eb", "stroke-width": 1.3 }, g);
    }

    /* 固定向量 b 与向量 a */
    arrow(g, cx, cy, cx + S, cy, "#2f8a5b", 2.4, 9);
    tx(g, cx + S * 0.42, cy - 7, "b", "#2f8a5b", "start", 10.5, 700);
    arrow(g, cx, cy, tipX, tipY, "#2563eb", 2.8, 10.5);
    tx(g, cx + (G.r + 12) * s.cos + 6, cy - (G.r + 12) * s.sin + 4, "a", "#2563eb", "start", 11, 700);

    if (L === W) tx(g, 36, 432, "|a| = 2（固定），|b| = 1（固定）", "#8a94a0", "start", 9.2);
  }

  function drawWideRight(g) {
    var P = L.right, s = calc(A), i;
    el("rect", { x: P.x, y: P.y, width: P.w, height: P.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, g);
    tx(g, P.x + 20, P.y + 28, "判据：看 cos θ 的符号", "#5a6472", "start", 10.5, 700);
    var rows = [
      { ang: "θ = 0°", d: "a 与 b 同向，夹角 0°", c: "cos θ = 1", p: "2cos θ = 2", k: 0 },
      { ang: "θ = 90° 或 270°", d: "a 与 b 垂直，不平行", c: "cos θ = 0", p: "2cos θ = 0", k: 1 },
      { ang: "θ = 180°", d: "a 与 b 反向，仍叫平行", c: "cos θ = −1", p: "2cos θ = −2", k: 2 },
      { ang: "θ 为其他角度", d: "既不平行，也不垂直", c: "−1 < cos θ < 1", p: "投影有正有负", k: 3 }
    ];
    for (i = 0; i < rows.length; i++) {
      var y = 62 + i * 82, hit = s.kind === rows[i].k;
      el("rect", {
        x: 476, y: y, width: 368, height: 74, rx: 9,
        fill: hit ? BG[rows[i].k] : "#ffffff",
        stroke: hit ? COL[rows[i].k] + "66" : "#e6e9ee",
        "stroke-width": hit ? 1.4 : 1
      }, g);
      el("rect", { x: 476, y: y + 16, width: 3.5, height: 42, rx: 2, fill: COL[rows[i].k] }, g);
      tx(g, 492, y + 31, rows[i].ang, "#151a21", "start", 11, 700);
      tx(g, 492, y + 53, rows[i].d, "#5a6472", "start", 9.2);
      tx(g, 836, y + 31, rows[i].c, "#3a3a35", "end", 9.4, 700);
      tx(g, 836, y + 53, rows[i].p, "#8a94a0", "end", 9);
    }
    tx(g, 476, 408, "cos θ 的符号定关系：＋同向、0 垂直、−反向。", "#5a6472", "start", 9.2);
    tx(g, 476, 426, "|cos θ| 不到 1 且不为 0 时，两向量不平行。", "#5a6472", "start", 9.2);
  }

  function drawNarrowRight(g) {
    var P = L.right, s = calc(A), y = 388, zx = 180, sc = 140, i;
    el("rect", { x: P.x, y: P.y, width: P.w, height: P.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, g);
    tx(g, 28, 350, "cos θ 与关系类型", "#5a6472", "start", 10, 700);
    el("line", { x1: 40, y1: y, x2: 320, y2: y, stroke: "#d5dce3", "stroke-width": 1.4 }, g);
    var tk = [-1, -0.5, 0, 0.5, 1];
    for (i = 0; i < tk.length; i++) {
      var x = zx + sc * tk[i];
      el("line", { x1: num(x), y1: y - 4, x2: num(x), y2: y + 4, stroke: "#9aa3ae", "stroke-width": 1 }, g);
      tx(g, x, y + 16, (tk[i] < 0 ? "−" : "") + (tk[i] === 0.5 ? "0.5" : tk[i] === -0.5 ? "0.5" : Math.abs(tk[i])), "#8a94a0", "middle", 8.2);
    }
    var mx = zx + sc * s.cos;
    el("line", { x1: zx, y1: y, x2: num(mx), y2: y, stroke: COL[s.kind], "stroke-width": 6, "stroke-linecap": "round", opacity: 0.3 }, g);
    el("circle", { cx: num(mx), cy: y, r: 5.5, fill: "#ffffff", stroke: COL[s.kind], "stroke-width": 2 }, g);
    tx(g, 40, 440, "cos θ = " + s.cos.toFixed(2), "#151a21", "start", 13, 700);
    tx(g, 40, 466, "投影 2cos θ = " + s.proj.toFixed(2), "#5a6472", "start", 9.8);
    tx(g, 40, 500, "关系：" + KIND[s.kind], COL[s.kind], "start", 14, 700);
    var why = [
      "夹角 0°，方向完全一致，模可不同",
      "cos θ = 0，夹角 90°，不平行",
      "夹角 180°，方向相反，仍平行",
      "方向既不平行，也不垂直"
    ][s.kind];
    tx(g, 40, 524, why, "#5a6472", "start", 9.2);
    tx(g, 40, 566, "0° 同向；90°/270° 垂直", "#5a6472", "start", 9.2);
    tx(g, 40, 588, "180° 反向；其余不平行", "#5a6472", "start", 9.2);
    tx(g, 40, 616, "零向量方向任意，与任意向量平行", "#5a6472", "start", 9.2);
    tx(g, 40, 644, "|a| = 2，|b| = 1（固定）", "#8a94a0", "start", 9.2);
  }

  function draw() {
    var gA = $("gxA"), gB = $("gxB");
    gA.textContent = ""; gB.textContent = "";
    if (L === W) { drawLeft(gA); drawWideRight(gB); }
    else { drawLeft(gA); drawNarrowRight(gB); }
  }

  function render() {
    if (!G) { L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N; G = geom(); stage.setAttribute('viewBox', L.vb); }
    var s = calc(A), st = s.kind, col = COL[st], bg = BG[st];
    $("gxVa").textContent = Math.round(A) + "°";
    $("gxVb").textContent = s.cos.toFixed(2);
    $("gxVc").textContent = s.proj.toFixed(2);
    $("gxVs").textContent = KIND[st];
    $("gxVsn").textContent = SN[st];
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "55";
    $("gxVs").style.color = col;
    draw();
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    G = geom();
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    /* 停留帧在 90°（垂直），共 2.5 秒；0° 开场只停 1.2 秒 */
    loop: [{ t: 0, v: 0 }, { t: 1.2, v: 0 }, { t: 4, v: 90 }, { t: 6.5, v: 90 }, { t: 9, v: 180 }, { t: 11.5, v: 270 }, { t: 13.5, v: 0 }],
    keys: [0, 90, 180, 270],
    value: A, min: 0, max: 360, step: 15,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = {
    calc: calc,
    cases: [
      { v: 0, eq: { cos: 1, kind: 0 } },
      { v: 90, eq: { cos: 0, kind: 1 } },
      { v: 180, eq: { cos: -1, kind: 2 } },
      { v: 270, eq: { cos: 0, kind: 1 } }
    ]
  };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
</body>
</html>
