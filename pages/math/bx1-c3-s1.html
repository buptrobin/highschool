<p class="gx-lede">3.1 是整册函数的地基：初中把函数当成「一个式子」，这一节把它升级成「两个实数集之间的对应关系」，后面 3.2 单调性、3.3 奇偶性、3.4 幂函数全建在这句话上。最容易错的一件事：拿到题目先算 f(某数)，而忘了先问「这个 x 在不在定义域里」——<b>定义域优先</b>不是口号，是第一步。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题卡上写左边这句，不写右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 函数的定义<span class="q-src">人教A版必修第一册 · 第3章第1节</span></p>
<p class="q-b">设 A、B 是非空的实数集，如果对于集合 A 中的任意一个数 x，按照某种确定的对应关系 f，在集合 B 中都有唯一确定的数 y 和它对应，那么就称 f：A→B 为从集合 A 到集合 B 的一个函数。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个条件</b>组成——① A、B 都是非空实数集；② A 中<b>任意</b>一个 x 都有对应；③ 对应的 y <b>唯一</b>。少第 ② 条，定义域就缩水；少第 ③ 条，一个 x 对出两个 y，直接不是函数。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 函数的三要素<span class="q-src">人教A版必修第一册 · 第3章第1节</span></p>
<p class="q-b">函数的三要素：定义域、对应关系、值域。其中定义域与对应关系一旦确定，值域也就随之确定。</p>
<p class="q-n">→ 翻成人话：三要素里只有<b>两个是自由的</b>（定义域、对应关系），值域是算出来的结果。所以「<b>定义域优先</b>」有硬理由：它是自变量那一边唯一能被人为规定的东西，先定它，后面的单调区间、值域才有地方可写。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 分段函数<span class="q-src">人教A版必修第一册 · 第3章第1节</span></p>
<p class="q-b">在定义域的不同部分有不同的对应关系，但它是一个函数。</p>
<p class="q-n">→ 翻成人话：只讲了一件事——<b>分段函数是一个函数</b>，不是两个、三个。几段只是同一个 f 在不同区间上的不同写法，定义域是各段区间的<b>并集</b>，拿一个 x 代进去，只走其中一段。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>定义里的条件</th><th>课本怎么写</th><th>缺了它会怎样</th></tr></thead>
<tbody>
<tr><td>条件 ①</td><td>A、B 是<b>非空实数集</b></td><td>A 是空集就没有 x 可对应，写不出函数；B 里有非实数就超出「数集」</td></tr>
<tr><td>条件 ②</td><td>对 A 中<b>任意</b>一个数 x</td><td>只对一部分 x 有对应，那部分才叫定义域，剩下的要从 A 里挖掉</td></tr>
<tr><td>条件 ③</td><td>都有<b>唯一</b>确定的数 y</td><td>一个 x 配出两个 y，例如 x² + y² = 1 里的 y，就不是函数</td></tr>
<tr class="key"><td>真正的区别</td><td>按<b>确定的对应关系 f</b></td><td>f 是「对应关系」，不是「公式」：一张表格、一条曲线都可以是 f</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">背法：<b>非空实数集 → 任意 → 唯一</b>，三个词按顺序背。考场口决：先看 x 能不能取（定义域优先），再看一个 x 是不是只出一个 y（唯一），这两步就能挡掉 90% 的概念判断题。</p>
</section>

<section class="gx-sec" id="b">
<h2><span class="sn">02</span>拆开看</h2>
<p class="gx-h2s">四张图：各讲一件事，按「是什么 → 怎么变 → 怎么用」排。</p>

<figure class="gx-fig">
<div class="fig-cap">
<span class="fig-no">图 1</span><span class="fig-t">函数定义的三个关键词</span>
<span class="bdg bdg-must">必考</span>
</div>
<p class="fig-s">课本那句定义里真正出题的是三个词：<b>任意</b>、<b>唯一</b>、<b>非空实数集</b>。判断「是不是函数」时按卡片顺序逐个过，先问 x 取遍没有，再问 y 唯一没有。三个词全过才叫函数。</p>
<div class="gx-svgbox">
<svg viewBox="0 0 820 260" role="img" aria-label="函数定义的三个关键词：任意、唯一、非空实数集">
<rect x="16" y="16" width="788" height="228" rx="10" fill="#f8fbfd" stroke="#dbe7ef"/>
<text x="36" y="42" font-size="11.5" font-weight="700" fill="#151a21">定义的三个关键词（按顺序过）</text>
<rect x="40" y="60" width="230" height="112" rx="8" fill="#ffffff" stroke="#b8e6d0"/>
<text x="52" y="84" font-size="10" font-weight="700" fill="#2f8a5b">① 任意</text>
<text x="52" y="106" font-size="9.4" fill="#3a3a35">A 中每一个 x 都要有对应</text>
<text x="52" y="124" font-size="9.4" fill="#3a3a35">不能挑着取：只对 x&gt;0 有</text>
<text x="52" y="142" font-size="9.4" fill="#3a3a35">对应，定义域就只是 x&gt;0</text>
<rect x="295" y="60" width="230" height="112" rx="8" fill="#ffffff" stroke="#c7d9f5"/>
<text x="307" y="84" font-size="10" font-weight="700" fill="#2563eb">② 唯一</text>
<text x="307" y="106" font-size="9.4" fill="#3a3a35">一个 x 只准配一个 y</text>
<text x="307" y="124" font-size="9.4" fill="#3a3a35">配出两个 y 就不是函数</text>
<text x="307" y="142" font-size="9.4" fill="#3a3a35">y 可以相同，x 不能重复</text>
<rect x="550" y="60" width="230" height="112" rx="8" fill="#ffffff" stroke="#e8d9b6"/>
<text x="562" y="84" font-size="10" font-weight="700" fill="#b8791f">③ 非空实数集</text>
<text x="562" y="106" font-size="9.4" fill="#3a3a35">A、B 都得是非空数集</text>
<text x="562" y="124" font-size="9.4" fill="#3a3a35">空集里没有 x，写不成函数</text>
<text x="562" y="142" font-size="9.4" fill="#3a3a35">B 里也只能是数，不装别的东西</text>
<rect x="40" y="188" width="740" height="34" rx="7" fill="#eef6fb" stroke="#c7e0ef"/>
<text x="410" y="209" text-anchor="middle" font-size="9.6" fill="#1f4e6b">三个词缺一个就不是函数；做题时先验 ③（x 能不能取），再验 ②（y 唯不唯一）</text>
</svg>
<span class="gx-zoomchip">点击放大</span>
</div>
<p class="gx-take">判断「y 是 x 的函数」只有一套流程：<b>先看定义域非空，再看每个 x 的 y 唯一</b>——和图像是否连续、式子好不好看无关。</p>
<p class="gx-note">常见误判：把「一个 y 对应两个 x」当成违规。y = x² 里 y = 4 时 x = ±2，这完全合规：<b>唯一</b>约束的是 x → y 这个方向，反方向不管。</p>
</figure>

<figure class="gx-fig">
<div class="fig-cap">
<span class="fig-no">图 2</span><span class="fig-t">三要素与定义域的三类限制</span>
<span class="bdg bdg-key">辨析</span>
</div>
<p class="fig-s">三要素里值域是被定义域和对应关系「算」出来的，所以写解答时先把<b>定义域优先</b>写出来。求定义域只有三类拦路虎：分母、偶次根号、零次幂（对数在第 4 章再补一条）。三者同时出现就取<b>交集</b>。</p>
<div class="gx-svgbox">
<svg viewBox="0 0 820 240" role="img" aria-label="函数三要素与定义域的三类限制：分母、偶次根、零次幂">
<rect x="16" y="16" width="788" height="208" rx="10" fill="#f8fbfd" stroke="#dbe7ef"/>

<text x="52" y="94" font-size="9.2" fill="#3a3a35">x 的取值集合，就是 A</text>
<rect x="295" y="56" width="230" height="48" rx="8" fill="#ffffff" stroke="#c7d9f5"/>
<text x="307" y="76" font-size="9.8" font-weight="700" fill="#2563eb">对应关系</text>
<text x="307" y="94" font-size="9.2" fill="#3a3a35">f：式子 / 表格 / 图象</text>
<rect x="550" y="56" width="230" height="48" rx="8" fill="#ffffff" stroke="#d6dbe2"/>

<text x="150" y="139" font-size="9.4" fill="#3a3a35">y = 1/(x−1) 要 x ≠ 1，写成 {x | x ≠ 1}</text>
<text x="40" y="159" font-size="9.4" fill="#b8402f">② 偶次根号下 ≥ 0</text>
<text x="180" y="159" font-size="9.4" fill="#3a3a35">y = √(x−2) 要 x ≥ 2，写成 [2, +∞)</text>

<text x="40" y="203" font-size="9.2" fill="#1f4e6b">几条限制同时出现 → 分别解出来再取交集；交集为空就说明这个式子写不成函数</text>

<p class="gx-take"><b>定义域优先</b>：解析式里只要出现分母、偶次根号、零次幂，先列出各自的限制，再取交集，最后才谈值域和单调性。</p>
<p class="gx-note">标准写法：y = √(x−2) + 1/(x−3) 的限制是 x ≥ 2 且 x ≠ 3，定义域写成集合 <span class="gx-fml">{x | x ≥ 2 且 x ≠ 3}</span> 或区间 <span class="gx-fml">[2, 3) ∪ (3, +∞)</span>，两种都算对，但同一道题里不要混用。</p>

<figure class="gx-fig">

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 分段函数求复合函数值<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">已知 <span class="gx-fml">f(x) = x² (x &lt; 0)；2x (0 ≤ x &lt; 2)；4 − x (x ≥ 2)</span>，求 f(f(−1))。陷阱：−1 和算出来的那个数，各自落在哪一段并不相同。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题：由内向外</p>
<p class="s-b">f(f(−1)) 里有两次求值，先算括号最里面那个 f(−1)，把它算成一个具体的数，再把这个数代回 f。不要试图先化简整个 f。</p>
<p class="s-k">用到：复合求值的顺序——内层先算。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 定位内层 −1 属于哪一段</p>
<p class="s-b">比较 −1 与两个分界点 0、2：因为 −1 &lt; 0，所以 −1 落在第一段，用 x² 这个对应关系，f(−1) = (−1)² = 1。</p>
<p class="s-k">用到：分段函数的「先看 x 落在哪一段」——分界点归哪段以等号为准。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 再定位外层 1 属于哪一段</p>
<p class="s-b">现在要算 f(1)。1 满足 0 ≤ 1 &lt; 2，落在第二段，用 2x，所以 f(1) = 2 × 1 = 2。注意 1 不属于第一段，代 x² 会得到 1，恰好也是 1，但过程是错的——换个数就露馅。</p>
<p class="s-k">用到：同一道题里两次定位，每次都要重新比区间。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 写结论并回头验一遍</p>
<p class="s-b">所以 f(f(−1)) = f(1) = 2。检查一遍：内层结果是 1，1 不在 x ≥ 2 那一支，也不在 x &lt; 0 那一支，用的段没串。</p>
<p class="s-k">用到：结论写成一个数，不写「f(f(−1)) = 2x」这种半成品。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 补一句定义域</p>
<p class="s-b">整题的合法性依赖 f 的定义域是 R：−1 和 1 都在 R 里，两次求值都允许。若题目改成 f(x) = x² (x &lt; 0)；2x (0 ≤ x &lt; 2)，没有第三段，则 f(2) 无意义，答案要写成「不存在」。</p>
<p class="s-k">用到：<b>定义域优先</b>——先确认要代的数在定义域内，再动手算。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">解：因为 −1 &lt; 0，所以 f(−1) = (−1)² = 1；<br>又因为 0 ≤ 1 &lt; 2，所以 f(1) = 2 × 1 = 2；<br>故 f(f(−1)) = f(1) = 2。<br>答：f(f(−1)) = 2。</p>
</div>
</div>
</section>
<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「唯一确定」到底什么意思，一个 x 配两个 y 为什么不行？</p>
<p class="a">指 A 中<b>每一个 x 只有一个 y 与它对应</b>，不是「y 只有一个来源」。所以 y = x² 合规（y = 4 时 x = ±2 没关系），而 x² + y² = 1 中 y 不是 x 的函数。判据：过图象上任意一点作<b>平行于 y 轴的直线</b>，与图象最多一个交点。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="一条竖线与图象交于两点，说明一个 x 配了两个 y">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text class="ms" x="120" y="26" text-anchor="middle" font-size="9">x = c 处有两个 y → 不是函数</text>
<circle cx="112" cy="76" r="30" fill="none" stroke="#2563eb" stroke-width="1.6"/>
<line x1="112" y1="36" x2="112" y2="116" stroke="#b8402f" stroke-width="1.1" stroke-dasharray="4 3"/>
<circle cx="112" cy="46" r="3.2" fill="#b8402f"/>
<circle cx="112" cy="106" r="3.2" fill="#b8402f"/>
<text x="120" y="44" font-size="8.4" fill="#b8402f">y₁</text>
<text x="120" y="111" font-size="8.4" fill="#b8402f">y₂</text>
<text x="152" y="80" font-size="8.4" fill="#5a6472">x = c</text>
</svg>
</div>
<div class="qac">
<p class="q">拿到一个式子，定义域怎么「先」求？</p>
<p class="a"><b>定义域优先</b>：动笔第一件事，扫三类限制——分母 ≠ 0、偶次根号下 ≥ 0、零次幂底数 ≠ 0，各自解出来再<b>取交集</b>。交集为空就说明这个式子写不成函数。写完定义域才允许开始化简、求值域。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="定义域的三类限制取交集">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text class="ms" x="20" y="28" font-size="8.8" font-weight="700">定义域：三处限制</text>
<text x="20" y="52" font-size="8.6" fill="#b8402f">① 分母 ≠ 0</text>
<text x="20" y="72" font-size="8.6" fill="#b8402f">② 偶次根号下 ≥ 0</text>
<text x="20" y="92" font-size="8.6" fill="#b8402f">③ 零次幂底数 ≠ 0</text>
<text x="20" y="114" font-size="8.6" fill="#2563eb">三条同时出现 → 取 ∩</text>
</svg>
</div>
<div class="qac">
<p class="q">分段函数是几个函数？答案能写两个吗？</p>
<p class="a"><b>分段函数是一个函数</b>，只能算一个。定义域是各段区间的<b>并集</b>，对应关系还是同一个 f，只是写法按区间分开。写答案时写「f(x) = …」，别写成「f₁(x)、f₂(x)」。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="三段区间拼成一个定义域">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text class="ms" x="20" y="28" font-size="8.8" font-weight="700">三段区间 → 一个定义域</text>
<line x1="24" y1="74" x2="88" y2="74" stroke="#2563eb" stroke-width="3"/>
<line x1="88" y1="74" x2="152" y2="74" stroke="#2f8a5b" stroke-width="3"/>
<line x1="152" y1="74" x2="216" y2="74" stroke="#b8791f" stroke-width="3"/>
<text x="40" y="62" font-size="8.4" fill="#2563eb">x²</text>
<text x="108" y="62" font-size="8.4" fill="#2f8a5b">2x</text>
<text x="176" y="62" font-size="8.4" fill="#b8791f">4−x</text>
<text x="88" y="90" text-anchor="middle" font-size="8.2" fill="#5a6472">0</text>
<text x="152" y="90" text-anchor="middle" font-size="8.2" fill="#5a6472">2</text>
<text x="20" y="112" font-size="8.4" fill="#5a6472">并集 = R，仍是一个函数</text>
</svg>
</div>
<div class="qac">
<p class="q">两个式子长得一样，就是同一函数吗？</p>
<p class="a">不是。判断<b>同一函数要看定义域与对应关系</b>两点，与字母无关。y = x 与 y = x²/x 化简后同为 y = x，但后者定义域是 {x | x ≠ 0}，<b>不是同一函数</b>；而 y = x² 与 s = t² 是同一函数。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="判断同一函数的两条标准">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text class="ms" x="20" y="26" font-size="8.8" font-weight="700">两条都同才算同一函数</text>
<rect x="20" y="38" width="200" height="26" rx="6" fill="#ffffff" stroke="#c7d9f5"/>
<text x="30" y="55" font-size="8.4" fill="#2563eb">① 定义域相同</text>
<rect x="20" y="70" width="200" height="26" rx="6" fill="#ffffff" stroke="#c7d9f5"/>
<text x="30" y="87" font-size="8.4" fill="#2563eb">② 对应关系相同</text>
<text x="20" y="114" font-size="8.4" fill="#b8402f">差一条 → 不是同一函数</text>
</svg>
</div>
<div class="qac">
<p class="q">分界点 x = 2 到底归哪一段？两个值都写行不行？</p>
<p class="a">只归一段，写两个值就是「一个 x 对两个 y」，直接违背定义。看不等式里的等号：<b>0 ≤ x &lt; 2</b> 没有接住 2，<b>x ≥ 2</b> 接住了，所以 f(2) = 4 − 2 = 2。图象上 (2, 4) 是空心点，(2, 2) 是实心点。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="分界点 x 等于 2 时上方空心、下方实心">

<line x1="28" y1="104" x2="212" y2="104" stroke="#8a949f" stroke-width="1"/>

<line x1="40" y1="96" x2="120" y2="50" stroke="#2f8a5b" stroke-width="2"/>
<line x1="120" y1="72" x2="196" y2="98" stroke="#b8791f" stroke-width="2"/>

<circle cx="120" cy="72" r="3.2" fill="#b8791f"/>
<text x="126" y="44" font-size="8" fill="#2f8a5b">(2,4) 空心</text>
<text x="126" y="70" font-size="8" fill="#b8791f">(2,2) 实心</text>
<text x="120" y="118" text-anchor="middle" font-size="8.2" fill="#b8402f">f(2) = 2</text>
</svg>
</div>
<div class="qac">
<p class="q">值域怎么求？直接把 B 抄上去行不行？</p>
<p class="a">不行，值域是<b>实际取到的 y 的集合</b>，只是 B 的子集。分段函数要<b>逐段求值域再取并集</b>：x &lt; 0 得 (0, +∞)，0 ≤ x &lt; 2 得 [0, 4)，x ≥ 2 得 (−∞, 2]，并起来是 R。</p>

<text x="20" y="70" font-size="8.4" fill="#2f8a5b">0≤x&lt;2：[0, 4)</text>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 这个函数分两段，所以是两个函数。</p>
<p class="er-v">✓ <b>分段函数是一个函数</b>，它在定义域的不同部分有不同的对应关系。</p>
<p class="er-w">错在哪：把「写法分几段」当成了「函数有几个」。定义域取各段并集，整体只对应一个 f。</p>
</div>
<div class="er">
<p class="er-x">✗ 已知 f(x) 分段，f(f(−1)) 就先算外面的 f。</p>
<p class="er-v">✓ 由内向外：先算 f(−1) = 1，再算 f(1) = 2。</p>
<p class="er-w">错在哪：外层要代的数是内层算出来的结果，内层没算完，外层无从下手。</p>
</div>
<div class="er">
<p class="er-x">✗ y = x 与 y = x²/x 化简后一样，是同一函数。</p>
<p class="er-v">✓ 判断<b>同一函数要看定义域与对应关系</b>都相同，后者定义域是 {x | x ≠ 0}。</p>
<p class="er-w">错在哪：化简会约掉 x，把 x = 0 这个「坑」一起抹掉了，定义域已经变了。</p>
</div>
<div class="er">
<p class="er-x">✗ 求定义域太麻烦，先算出结果再说。</p>
<p class="er-v">✓ <b>定义域优先</b>：先列分母 ≠ 0、偶次根号下 ≥ 0、零次幂底数 ≠ 0 的限制，取交集。</p>
<p class="er-w">错在哪：定义域是答案的一部分，也是判据——不写定义域，同一函数判断、单调区间、值域全部失去依据。</p>
</div>
<div class="er">
