<p class="gx-lede">这一节是三角函数图象变换的总收口：前面学过的 y=sinx、y=Asinx、y=sin(x+φ)、y=sinωx 全部合并成一个式子，考试里以「求解析式」「求变换过程」「求单调区间」三种面孔出现。最容易丢分的一件事只有一句：周期是 T=2π/ω，ω 在分母上，不是 2πω；一旦写成 2πω，后面每个数都跟着错。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 振幅、相位、初相<span class="q-src">人教A版必修第一册 · 第五章第 5.6 节</span></p>
<p class="q-b">形如 y=Asin(ωx+φ)（A&gt;0，ω&gt;0）的函数，A 叫做振幅，ωx+φ 叫做相位，φ 叫做初相。</p>
<p class="q-n">→ 翻成人话：这句话由<b>四个条件</b>组成：① 形状必须是「一个正弦乘一个系数」；② A&gt;0；③ ω&gt;0；④ 括号里是 ωx+φ 这个顺序。少一个都不叫标准形式——A 是负的要先提负号，ω 是负的要先用诱导公式化正，否则「振幅 A、周期 T=2π/ω」这两句话全部作废。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 周期与频率<span class="q-src">人教A版必修第一册 · 第五章第 5.6 节</span></p>
<p class="q-b">函数 y=Asin(ωx+φ)（A&gt;0，ω&gt;0）的最小正周期 T=2π/ω，频率 f=1/T=ω/(2π)。</p>
<p class="q-n">→ 翻成人话：<b>两个条件</b>：① 先确认 ω&gt;0；② T 和 ω 是反比关系，ω 在分母。所以 ω 变大 → 周期变短 → 图象在横方向上被压扁；ω 变小 → 周期变长 → 被拉宽。写成 T=2πω 就是把反比写成正比，ω=2 时会把 T=π 算成 4π，一条曲线直接画错四倍。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>标准形式的条件</th><th>缺了 / 写错会怎样</th></tr></thead>
<tbody>
<tr><td>A&gt;0</td><td>A&lt;0 时「最大值是 A」变成「最大值是 −A」，先提负号 y=−2sin x=2sin(x+π) 化成 A&gt;0 再用</td></tr>
<tr><td>ω&gt;0</td><td>ω&lt;0 时周期是 T=2π/|ω|，直接代 T=2π/ω 会算出负数，整题判错</td></tr>
<tr><td>括号内先写成 ωx+φ（x 的系数提出）</td><td>y=sin(2x+π/3) 读成「左移 π/3」就错了，实际左移 π/6，因为平移量是 |φ|/ω</td></tr>
<tr><td>平移量的口径要说明是哪条路线</td><td>先平移后伸缩移 |φ| 个单位；先伸缩后平移移 |φ|/ω 个单位，两句话不能混用</td></tr>
<tr class="key"><td>T=2π/ω（ω 在分母）</td><td>写成 T=2πω 的：ω=2 时把 T=π 算成 4π，频率、五点、单调区间连锁全错</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">背法：<span class="gx-fml">T=2π/ω</span>，分母是 ω。自己验一遍——ω=1 时 T=2π（就是 y=sinx 的周期），公式立刻自证；写成 2πω 的话 ω=1 得 2π 也对，所以别用 ω=1 验，要用 ω=2 验：T 应该是 π。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 由最值、周期、定点求解析式<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">已知函数 y=Asin(ωx+φ)（A&gt;0，ω&gt;0，|φ|&lt;π/2）的最大值是 3，最小正周期是 π，图象经过点 (0, 1)。求它的解析式。<br>陷阱：第 3 步会得到两个 φ，必须用 |φ|&lt;π/2 这个条件筛掉一个。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 由最大值定 A</p>
<p class="s-b">标准形式里 A&gt;0，最大值就是 A，所以 A=3。顺手写出最小值 −A=−3，值域是 [−3, 3]。</p>
<p class="s-k">用到：振幅 A 决定最大值 A 与最小值 −A。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 由周期定 ω</p>
<p class="s-b">最小正周期 <span class="gx-fml">T=2π/ω</span>，代入 T=π 得 <span class="gx-fml">2π/ω=π</span>，所以 ω=2。（不是 2πω：写成 2πω=π 会得 ω=1/2，后面全错。）</p>
<p class="s-k">用到：T=2π/ω，ω 在分母上。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 由过点定 φ</p>
<p class="s-b">图象过 (0, 1)，把 x=0 代入得 y=3sinφ=1，所以 sinφ=1/3。因为 |φ|&lt;π/2，φ 只能在第一象限，取 φ=arcsin(1/3) ≈ 0.34。</p>
<p class="s-k">用到：y 轴截距给初相 φ 的一个方程；|φ|&lt;π/2 用来定唯一解。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 写出解析式并回代检验</p>
<p class="s-b">写出 y=3sin(2x+arcsin(1/3))。回代 x=0：3sin(arcsin(1/3))=3×(1/3)=1，与已知点相符；最大值 3、周期 2π/2=π，三个条件全部对上。</p>
<p class="s-k">用到：写完后用原始条件逐条回验，这一步是检查而不是推理。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 换个问法时的口径</p>
<p class="s-b">若题目改问「由 y=sinx 经过怎样的变换得到」，先伸缩后平移的说法是：横坐标缩短到原来的 1/2，再向左平移 arcsin(1/3)/2 个单位，纵坐标伸长到原来的 3 倍。注意平移量是 |φ|/ω，不是 |φ|。</p>
<p class="s-k">用到：先伸缩后平移的平移量是 |φ|/ω。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">解：<br>① 因为 A&gt;0 且最大值为 3，所以 A=3；最小值为 −3。<br>② 由最小正周期 T=2π/ω，得 2π/ω=π，所以 ω=2。<br>③ 图象过点 (0, 1)，代入得 3sin(2·0+φ)=1，即 sinφ=1/3。<br>④ 又 |φ|&lt;π/2，所以 φ=arcsin(1/3)（约 0.3398）。<br>⑤ 所求解析式为 y=3sin(2x+arcsin(1/3))。<br>检验：最大值 3，周期 2π/2=π，x=0 时 y=1，三个条件均满足。</p>
</div>
</div>
</section>
<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">

<div class="qac">
<p class="q">周期到底怎么写？T=2πω 还是 T=2π/ω？</p>
<p class="a">是 <b><span class="gx-fml">T=2π/ω</span>，ω 在分母</b>。ω=2 时 T=π，ω=0.5 时 T=4π。记法：ω=1 时 T=2π（即 y=sinx 的周期），但 ω=1 两种写法都能对上，所以必须用 ω=2 自检。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="ω 与周期的反比关系">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text class="ms" x="20" y="34" font-size="9.6" fill="#b8402f">✗ T=2πω　ω=2 得 4π</text>
<text class="ms" x="20" y="58" font-size="9.6" fill="#2f8a5b">✓ T=2π/ω　ω=2 得 π</text>
<path d="M20 78 L220 78" stroke="#c3ccd6" stroke-width="1" fill="none"/>
<text class="ms" x="20" y="98" font-size="9.4" fill="#5a6472">ω 变大 → T 变小（反比）</text>
<text class="ms" x="20" y="116" font-size="9.4" fill="#5a6472">f=1/T=ω/(2π)</text>
</svg>
</div>

<div class="qac">
<p class="q">先伸缩后平移，到底平移多少个单位？</p>
<p class="a">平移 <b><span class="gx-fml">|φ|/ω</span></b> 个单位，不是 |φ|。因为横坐标先缩到 1/ω，同样一个相位差在图上只剩 1/ω 的长度。例：y=sin(2x+π/3) 左移 π/6。只有「先平移后伸缩」那条路线才移 |φ|。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="先伸缩后平移的平移量">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text class="ms" x="20" y="34" font-size="9.6" fill="#b8402f">✗ 左移 π/3</text>
<text class="ms" x="20" y="56" font-size="9.6" fill="#2f8a5b">✓ 左移 |φ|/ω = π/6</text>
<path d="M20 74 L120 74" stroke="#b8791f" stroke-width="1.1" fill="none"/>
<path d="M120 74 L113 70.5 L113 77.5 Z" fill="#b8791f"/>
<text class="ms" x="20" y="94" font-size="9.4" fill="#5a6472">横缩 1/ω 之后</text>
<text class="ms" x="20" y="114" font-size="9.4" fill="#5a6472">相位差在图上被缩短 ω 倍</text>
</svg>
</div>

<div class="qac">
<p class="q">振幅 A 和最大值是什么关系？</p>
<p class="a">在 A&gt;0 的标准形式下，<b>最大值就是 A，最小值是 −A</b>，不是 A/2。A=3 时值域 [−3, 3]，最大值 3。若写成「振幅等于最大值的一半」，是把它和「最大值与最小值的差的一半」混了。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="振幅决定最大值与最小值">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<path d="M24 40 L216 40" stroke="#b8402f" stroke-width="1" stroke-dasharray="4 3" fill="none"/>
<path d="M24 96 L216 96" stroke="#b8402f" stroke-width="1" stroke-dasharray="4 3" fill="none"/>
<text class="ms" x="30" y="34" font-size="9.4" fill="#b8402f">最大值 = A = 3</text>
<text class="ms" x="30" y="112" font-size="9.4" fill="#b8402f">最小值 = −A = −3</text>
<path d="M40 68 L82 44 L124 68 L166 92 L208 68" stroke="#2563eb" stroke-width="1.8" fill="none"/>
<text class="ms" x="130" y="68" font-size="9.2" fill="#5a6472">值域 [−3, 3]</text>
</svg>
</div>

<div class="qac">
<p class="q">五点法取哪五个点？</p>
<p class="a">让<b>相位 ωx+φ 整体</b>依次取 0、π/2、π、3π/2、2π，再解出对应的五个 x。不是直接取 x=0、π/2、π……那只有在 ω=1 且 φ=0 时才碰巧对。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="五点法的五个关键点">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text class="ms" x="20" y="30" font-size="9.4" fill="#5a6472">相位取 0、π/2、π、3π/2、2π</text>
<path d="M20 90 L220 90" stroke="#c3ccd6" stroke-width="1" fill="none"/>
<circle cx="34" cy="90" r="3" fill="#b8402f"/>
<circle cx="80" cy="66" r="3" fill="#b8402f"/>
<circle cx="126" cy="90" r="3" fill="#b8402f"/>

<circle cx="218" cy="90" r="3" fill="#b8402f"/>
<text class="ms" x="20" y="126" font-size="0" fill="#5a6472">.</text>
</svg>
</div>

<div class="qac">
<p class="q">初相 φ 从图上怎么读？看与 x 轴的交点吗？</p>
<p class="a">不看 x 轴交点，看 <b>y 轴截距</b>：把 x=0 代入得 y=Asinφ，解出 sinφ，再结合 |φ|&lt;π/2 这类范围定唯一值。用 x 轴交点读出来的是 −φ/ω，是零点横坐标，不是 φ。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="由 y 轴截距读初相">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<path d="M40 24 L40 112" stroke="#c3ccd6" stroke-width="1" fill="none"/>
<path d="M24 76 L216 76" stroke="#c3ccd6" stroke-width="1" fill="none"/>
<path d="M40 62 L80 32 L120 62 L160 92 L200 62" stroke="#2563eb" stroke-width="1.8" fill="none"/>

<text class="ms" x="76" y="28" font-size="9.2" fill="#b8402f">读这里的纵坐标</text>
<text class="ms" x="52" y="120" font-size="9.2" fill="#5a6472">y=Asinφ ⇒ sinφ</text>
</svg>
</div>

<div class="qac">
<p class="q">A 是负数怎么办？能直接代数吗？</p>
<p class="a">先用诱导公式化成 A&gt;0：<b>−2sinx=2sin(x+π)</b>，然后再读振幅、周期、最值。不化正就套「最大值 A」，会把最大值写成 −2，方向整个反了。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="A 为负时先化正">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>

<text class="ms" x="20" y="58" font-size="9.6" fill="#2f8a5b">✓ y=2sin(x+π) ⇒ 最大值 2</text>
<path d="M20 74 L220 74" stroke="#c3ccd6" stroke-width="1" fill="none"/>
<text class="ms" x="20" y="94" font-size="9.4" fill="#5a6472">振幅是 |A|，恒为正</text>
<text class="ms" x="20" y="114" font-size="9.4" fill="#5a6472">提负号后 φ 整体加 π</text>

</div>
<p class="gx-note">六问其实是同一件事：先把式子化成 A&gt;0、ω&gt;0 的标准形式，再问「这个字母动的是高度、疏密还是左右」。高度只看 A，疏密只看 ω 且 T=2π/ω，左右平移量要看是哪条路线——先伸缩后平移就是 |φ|/ω。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">

<div class="er">
<p class="er-x">✗ 最小正周期 T=2πω，ω=2 时 T=4π。</p>
<p class="er-v">✓ 最小正周期 T=2π/ω，ω=2 时 T=π。</p>
<p class="er-w">错在哪：ω 在分母。ω 越大，同样的横轴长度里塞进的周期越多，周期必须越短；写成 2πω 就变成「ω 越大周期越长」，和图象直接矛盾。</p>
</div>

<div class="er">
<p class="er-x">✗ y=sin(2x+π/3) 由 y=sin2x 向左平移 π/3 得到。</p>
<p class="er-v">✓ 由 y=sin2x 向左平移 π/6 得到，因为平移量是 <span class="gx-fml">|φ|/ω=(π/3)/2=π/6</span>。</p>
<p class="er-w">错在哪：先伸缩后平移时，横坐标已经缩到 1/ω，平移量也跟着缩成 |φ|/ω。只有先平移后伸缩才移 |φ|。</p>

<p class="er-v">✓ A&gt;0 时最大值是 A、最小值是 −A，振幅本身就是最大值。</p>
<p class="er-w">错在哪：把「振幅 = (最大值 − 最小值)/2」这个对 A&gt;0 恒等于 A 的空式子记成了「一半」。A=3 时最大值 3，不是 1.5。</p>
</div>

<div class="er">
<p class="er-x">✗ 五点法就取 x=0、π/2、π、3π/2、2π。</p>
<p class="er-v">✓ 令相位 ωx+φ 依次取 0、π/2、π、3π/2、2π，再解出五个 x。</p>
<p class="er-w">错在哪：只有 ω=1、φ=0 时两者才重合。ω=2、φ=π/3 时五个点是 −π/6、π/12、π/3、7π/12、5π/6。</p>
</div>

<div class="er">
<p class="er-x">✗ 初相 φ 就是图象与 x 轴交点的横坐标。</p>
<p class="er-v">✓ φ 由 y 轴截距定：x=0 时 y=Asinφ，解出 sinφ 再结合范围取唯一值。</p>
<p class="er-w">错在哪：与 x 轴的交点给的是零点横坐标 x=−φ/ω（再加 kπ/ω），比 φ 多除了一个 ω，量纲和符号都不对。</p>

<div class="er">
<p class="er-x">✗ y=−2sinx 的最大值是 −2，最小值是 2。</p>
<p class="er-v">✓ 先化正：y=−2sinx=2sin(x+π)，最大值 2、最小值 −2、振幅 2。</p>
<p class="er-w">错在哪：标准形式要求 A&gt;0。不化正就套公式，最大值最小值刚好写反，后面的值域、单调区间全部跟着反。</p>
</div>

<div class="er">
<p class="er-x">✗ ω=−2 时周期 T=2π/(−2)=−π。</p>
<p class="er-v">✓ 先用 sin(−2x+φ)=−sin(2x−φ) 化成 ω&gt;0，再用 T=2π/2=π。</p>
<p class="er-w">错在哪：周期是长度，不可能为负。标准形式里 ω&gt;0 是硬条件，ω&lt;0 时应先化正，此时 T=2π/|ω|。</p>

<script>
/* 互动脚本本体（由 build-page.mjs 包进 <script> 里，所以这里不要写 <script> 标签） */
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var GX = window.GX, el = GX.el, tx = GX.tx, $ = GX.$;
  var stage = $("gxStage");
  if (!stage || !window.AutoPilot) return;

  /* 两套坐标：宽屏 880×470，窄屏独立 360×700 */
  var W = { vb: "0 0 880 470", left: { x: 16, y: 16, w: 424, h: 438 }, right: { x: 456, y: 16, w: 408, h: 438 } };
  var N = { vb: "0 0 360 700", left: { x: 8, y: 8, w: 344, h: 300 }, right: { x: 8, y: 320, w: 344, h: 372 } };
  var L = W, G = null, A = 0.5;

  var PI = Math.PI, TAU = 2 * PI;
  var AMP = 2;            /* A = 2 固定 */

  function geom() {
    var p = L.left;
    var x0 = p.x + 28, x1 = p.x + p.w - 22;
    var ay = p.y + p.h * 0.56;
    var amp = Math.min(p.h * 0.20, 92);

      x0: x0, x1: x1, ay: ay, amp: amp,
      X: function (t) { return x0 + t * span / X_MAX; }

  }

  function curve(g, w) {
    var d = "", n = 170, i, t, y;
    for (i = 0; i <= n; i++) {
      t = X_MAX * i / n;
      y = g.ay - g.amp * Math.sin(w * t);
      d += (i ? "L" : "M") + g.X(t).toFixed(1) + " " + y.toFixed(1);
    }

  function arrowH(parent, x1, x2, y, col) {
    el("path", { d: "M" + x1 + " " + y + " L" + x2 + " " + y, stroke: col, "stroke-width": 1.1, fill: "none" }, parent);

    el("path", { d: "M" + x2 + " " + y + " L" + (x2 - 6 * dir) + " " + (y - 3.6) + " L" + (x2 - 6 * dir) + " " + (y + 3.6) + " Z", fill: col }, parent);
  }

  function draw() {
    if (!G) return;
    var g = G, s = calc(A);
    var gA = $("gxA"), gB = $("gxB");
    gA.textContent = ""; gB.textContent = "";
    var p = L.left, pn = L.right;

    el("rect", { x: p.x, y: p.y, width: p.w, height: p.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    tx(gA, p.x + 20, p.y + 26, "y = 2sin(ωx)：ω 只动疏密，不动高度", "#5a6472", "start", 10.5, 700);
    tx(gA, p.x + 20, p.y + 44, "灰虚线 = y=2sinx（ω=1，T=2π）", "#9aa4b2", "start", 8.6, 400);
    tx(gA, p.x + 20, p.y + 58, "蓝实线 = y=2sin(ωx)，A=2 不变", "#2563eb", "start", 8.6, 400);

    /* 坐标轴 */
    el("path", { d: "M" + g.x0 + " " + g.ay + " L" + (g.x1 + 12) + " " + g.ay, stroke: "#8a94a2", "stroke-width": 1.1, fill: "none" }, gA);
    el("path", { d: "M" + (g.x1 + 12) + " " + g.ay + " L" + (g.x1 + 5) + " " + (g.ay - 3.6) + " L" + (g.x1 + 5) + " " + (g.ay + 3.6) + " Z", fill: "#8a94a2" }, gA);
    var yt = g.ay - g.amp - 26, yb = g.ay + g.amp + 20;
    el("path", { d: "M" + g.x0 + " " + yb + " L" + g.x0 + " " + yt, stroke: "#8a94a2", "stroke-width": 1.1, fill: "none" }, gA);
    el("path", { d: "M" + g.x0 + " " + yt + " L" + (g.x0 - 3.6) + " " + (yt + 7) + " L" + (g.x0 + 3.6) + " " + (yt + 7) + " Z", fill: "#8a94a2" }, gA);
    tx(gA, g.x0 - 10, g.ay - g.amp + 4, "2", "#5a6472", "end", 8.6, 400);
    tx(gA, g.x0 - 10, g.ay + g.amp + 4, "−2", "#5a6472", "end", 8.6, 400);

    /* x 轴刻度 */
    var k, xt, lab, anc;
    for (k = 0; k <= 3; k++) {
      xt = g.X(k * TAU);
      el("path", { d: "M" + xt + " " + (g.ay - 4) + " L" + xt + " " + (g.ay + 4), stroke: "#8a94a2", "stroke-width": 1 }, gA);
      lab = k === 0 ? "0" : (k === 1 ? "2π" : (k === 2 ? "4π" : "6π"));
      anc = k === 0 ? "start" : (k === 3 ? "end" : "middle");
      tx(gA, xt, g.ay + 16, lab, "#5a6472", anc, 8.8, 400);
    }

    /* 两条曲线 */
    el("path", { d: curve(g, 1), stroke: "#9aa4b2", "stroke-width": 1.2, "stroke-dasharray": "4 3", fill: "none" }, gA);
    el("path", { d: curve(g, A), stroke: "#2563eb", "stroke-width": 2, fill: "none" }, gA);

    /* 两个相邻波峰 + 周期括号 */
    var p1 = PI / (2 * A), p2 = p1 + TAU / A;
    var q1 = g.X(p1), q2 = g.X(p2), top = g.ay - g.amp;
    el("path", { d: "M" + q1 + " " + top + " L" + q1 + " " + g.ay, stroke: "#b8791f", "stroke-width": 0.9, "stroke-dasharray": "3 3", fill: "none" }, gA);
    el("path", { d: "M" + q2 + " " + top + " L" + q2 + " " + g.ay, stroke: "#b8791f", "stroke-width": 0.9, "stroke-dasharray": "3 3", fill: "none" }, gA);
    el("circle", { cx: q1, cy: top, r: 3.2, fill: "#b8791f" }, gA);
    el("circle", { cx: q2, cy: top, r: 3.2, fill: "#b8791f" }, gA);
    var by = g.ay + g.amp + 44;
    arrowH(gA, q1, q2, by, "#b8791f");
    var mid = (q1 + q2) / 2;
    mid = Math.max(q1 + 34, Math.min(mid, g.x1 - 34));
    tx(gA, mid, by - 7, "T = " + s.T.toFixed(3), "#b8791f", "middle", 9, 700);

    /* 右面板：数值 */
    el("rect", { x: pn.x, y: pn.y, width: pn.w, height: pn.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    tx(gB, pn.x + 20, pn.y + pn.h * 0.06, "读数：ω 只动周期和频率", "#5a6472", "start", 10.5, 700);
    tx(gB, pn.x + 20, pn.y + pn.h * 0.16, "ω", "#151a21", "start", 11, 700);
    tx(gB, pn.x + 44, pn.y + pn.h * 0.16, A.toFixed(1), "#2563eb", "start", 20, 700);
    tx(gB, pn.x + 20, pn.y + pn.h * 0.26, "T = 2π/ω = " + s.T.toFixed(4), "#151a21", "start", 12, 700);
    tx(gB, pn.x + 20, pn.y + pn.h * 0.33, "f = 1/T = ω/(2π) = " + s.f.toFixed(4), "#151a21", "start", 12, 700);
    tx(gB, pn.x + 20, pn.y + pn.h * 0.40, "最大值 = A = 2（不随 ω 变）", "#2f8a5b", "start", 11, 700);
    tx(gB, pn.x + 20, pn.y + pn.h * 0.46, "最小值 = −A = −2", "#2f8a5b", "start", 11, 700);

    /* T 的长度尺：0 → 4π */
    var bx0 = pn.x + 30, bx1 = pn.x + pn.w - 40, bw = bx1 - bx0;
    var base = pn.y + pn.h * 0.62;
    tx(gB, bx0, base - 32, "T 的长度（同一条尺，满格 4π）", "#5a6472", "start", 9, 400);
    tx(gB, bx0, base - 14, "T = " + s.T.toFixed(3), "#b8791f", "start", 10, 700);
    el("path", { d: "M" + bx0 + " " + base + " L" + bx1 + " " + base, stroke: "#c3ccd6", "stroke-width": 1 }, gB);
    var bl = Math.min(bw, s.T / (2 * TAU) * bw);
    el("rect", { x: bx0, y: base - 20, width: bl, height: 20, rx: 4, fill: "#fdf3e0", stroke: "#b8791f" }, gB);
    el("path", { d: "M" + (bx0 + bw / 2) + " " + (base - 26) + " L" + (bx0 + bw / 2) + " " + (base + 6), stroke: "#2563eb", "stroke-width": 1.1, "stroke-dasharray": "3 3", fill: "none" }, gB);
    var tk, tv, tl;
    for (k = 0; k <= 4; k++) {
      tv = k * PI; tk = bx0 + (tv / (2 * TAU)) * bw;
      el("path", { d: "M" + tk + " " + base + " L" + tk + " " + (base + 5), stroke: "#8a94a2", "stroke-width": 1 }, gB);
      tl = k === 0 ? "0" : (k === 1 ? "π" : (k === 2 ? "2π" : (k === 3 ? "3π" : "4π")));
      tx(gB, tk, base + 17, tl, "#8a94a2", k === 0 ? "start" : (k === 4 ? "end" : "middle"), 8.4, 400);
    }
    tx(gB, bx0 + bw / 2, base + 30, "蓝虚线 = 2π，即 ω=1 的位置", "#2563eb", "middle", 8.6, 400);

    /* 状态块 */
    var sy = pn.y + pn.h * 0.74, sh = pn.h * 0.18;
    var st, col, bg, sn;
    if (A > 1.001) { st = "周期变短，图象被压扁"; col = "#b8791f"; bg = "#fdf3e0"; sn = "ω>1 ⇒ T=2π/ω<2π，横方向压缩"; }
    else if (A < 0.999) { st = "周期变长，图象被拉宽"; col = "#2563eb"; bg = "#eaf1fd"; sn = "0<ω<1 ⇒ T=2π/ω>2π，横方向拉伸"; }
    else { st = "T = 2π，最朴素的一条"; col = "#2f8a5b"; bg = "#e6f6ee"; sn = "ω=1 ⇒ 就是 y=2sinx"; }
    el("rect", { x: pn.x + 18, y: sy, width: pn.w - 36, height: sh, rx: 8, fill: bg, stroke: col + "55" }, gB);
    tx(gB, pn.x + 30, sy + sh * 0.42, st, col, "start", 12, 700);
    tx(gB, pn.x + 30, sy + sh * 0.76, sn, col, "start", 8.8, 400);
    tx(gB, pn.x + 20, pn.y + pn.h * 0.965, "端点：ω=0.5 时 T=4π，ω=4 时 T=π/2；最大值恒为 2。", "#5a6472", "start", 8.6, 400);
  }

  function render() {
    if (!G) { L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N; G = geom(); stage.setAttribute("viewBox", L.vb); }
    var s = calc(A), st, col, bg, sn;
    $("gxVa").textContent = A.toFixed(1);
    $("gxVb").textContent = s.T.toFixed(3);
    $("gxVc").textContent = s.f.toFixed(3);
    if (A > 1.001) { st = "压扁"; col = "#b8791f"; bg = "#fdf3e0"; sn = "ω>1：T 变短"; }
    else if (A < 0.999) { st = "拉宽"; col = "#2563eb"; bg = "#eaf1fd"; sn = "0<ω<1：T 变长"; }
    else { st = "T=2π"; col = "#2f8a5b"; bg = "#e6f6ee"; sn = "ω=1：最朴素"; }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    draw();
  }

    G = geom();

    keys: [0.5, 1, 2, 4],
    value: A, min: 0.5, max: 4, step: 0.1,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });

    { v: 1, eq: { T: 6.2832, f: 0.1592 } },
    { v: 2, eq: { T: 3.1416, f: 0.3183 } },
    { v: 0.5, eq: { T: 12.566, f: 0.0796 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
