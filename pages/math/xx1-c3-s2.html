<p class="gx-claim">双曲线只有三件事要背对：<b>c²=a²+b²（与椭圆相反）</b>、<b>必须加绝对值，否则只是一支</b>、<b>渐近线 y=±(b/a)x，b 在分子</b>。</p>
<div class="gx-meta">
<span><i></i>人教A版选择性必修第一册 第3章第2节</span>
<span><i></i>高二 · 选择性必修第一册</span>
<span><i></i>阅读 12 分钟</span>
<span><i></i>含 1 个互动模型</span>
</div>
<p class="gx-lede">椭圆是「到两定点距离之和为定值」，双曲线把和换成<b>差的绝对值</b>，于是曲线从一条闭合的圈变成左右两支。位置在 3.1 椭圆之后、3.3 抛物线之前，是圆锥曲线里唯一「两条曲线 + 两条直线」一起考的一节。最容易错的一处：把椭圆的 a²=b²+c² 顺手写成双曲线的 c²=a²−b²。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 双曲线的定义<span class="q-src">人教A版选择性必修第一册 · 第3章第2节</span></p>
<p class="q-b">平面内与两个定点 F₁、F₂ 的距离之差的绝对值等于常数（小于 |F₁F₂| 且大于 0）的点的轨迹叫做双曲线。这两个定点叫做双曲线的焦点，两焦点间的距离叫做焦距。</p>
<p class="q-n">→ 翻成人话：这句话由<b>五个条件</b>组成：①在平面内；②到两个定点 F₁、F₂；③距离之<b>差</b>（不是和）；④取<b>绝对值</b>；⑤常数 0&lt;2a&lt;|F₁F₂|。少第④条只剩一支，少第⑤条轨迹不存在或退化成一条直线。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 标准方程与 a、b、c<span class="q-src">人教A版选择性必修第一册 · 第3章第2节</span></p>
<p class="q-b">焦点在 x 轴上的双曲线的标准方程是 <span class="gx-fml">x²/a² − y²/b² = 1（a&gt;0，b&gt;0）</span>，其中 <span class="gx-fml">c² = a² + b²</span>。</p>
<p class="q-n">→ 注意这里是<b>加号</b>：<b>c²=a²+b²（与椭圆相反）</b>。椭圆里 a 最大，双曲线里 <b>c 最大</b>；算出 c 再写焦点 (±c, 0)。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 渐近线与离心率<span class="q-src">人教A版选择性必修第一册 · 第3章第2节</span></p>
<p class="q-b">双曲线 x²/a² − y²/b² = 1 的渐近线是 <span class="gx-fml">y = ±(b/a)x</span>，离心率 <span class="gx-fml">e = c/a &gt; 1</span>。</p>
<p class="q-n">→ <b>渐近线 y=±(b/a)x，b 在分子</b>：a 变大开口变窄，b 变大开口变开。e 只由 a、b 的比值决定，永远大于 1。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>定义里的条件</th><th>少写或写错会怎样</th></tr></thead>
<tbody>
<tr><td>在<b>平面</b>内</td><td>空间里得到的是双曲面，不是双曲线</td></tr>
<tr><td>到两个定点 F₁、F₂ 的距离</td><td>没有焦点，c 无从算起，方程写不出</td></tr>
<tr><td>距离之<b>差</b>（不是和）</td><td>距离之和对应的是椭圆，两条曲线完全不同</td></tr>
<tr class="key"><td>取<b>绝对值</b></td><td>不取绝对值只能得到一支（右支或左支），不是整条双曲线</td></tr>
<tr><td>0 &lt; 常数 &lt; |F₁F₂|</td><td>常数 ≥|F₁F₂| 时轨迹不存在；常数 = 0 时退化成 F₁F₂ 的中垂线</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">背定义时把「绝对值」和「小于 |F₁F₂|」当成两个开关：前者决定有没有两支，后者决定有没有轨迹。做题先写这两句，再代公式。</p>
</section>

<div class="gx-ex">
<p class="ex-t">例题 · 由标准方程读 a、b、c、e 与渐近线<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">已知双曲线 x²/9 − y²/16 = 1。(1) 求 a、b、c 与焦点坐标；(2) 求离心率 e 与渐近线方程；(3) 求实轴长、虚轴长、焦距，并指出三者中谁最大。<br><span style="color:#b8402f">陷阱：x² 下面的是 9 还是 16，决定焦点在哪个轴；c 要用加法算。</span></p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 定型：谁在 x² 下面</p>
<p class="s-b">方程里 x² 项系数为正（9 在 x² 下），所以焦点在 x 轴上，a²=9、b²=16，即 a=3、b=4。若 16 在 x² 下面，焦点就跑到 y 轴，后面全要换。</p>
<p class="s-k">用到：标准方程 x²/a²−y²/b²=1 中 a² 是 x² 的分母。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 求 c：只能用加法</p>
<p class="s-b">c² = a² + b² = 9 + 16 = 25，所以 c = 5。焦点为 F₁(−5, 0)、F₂(5, 0)，焦距 |F₁F₂| = 2c = 10。</p>
<p class="s-k">用到：c²=a²+b²（与椭圆相反）；若写成 c²=a²−b²=9−16=−7，根号里是负数，立刻矛盾。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 离心率</p>
<p class="s-b">e = c/a = 5/3。检验范围：5/3 ≈ 1.67 &gt; 1，符合双曲线 e&gt;1；若算出 e&lt;1 说明 a、c 用反了。</p>
<p class="s-k">用到：e=c/a，且双曲线恒有 e&gt;1。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 渐近线：b 在分子</p>
<p class="s-b">渐近线 y = ±(b/a)x = ±(4/3)x。检查：a=3、b=4，b&gt;a，所以斜率大于 1、张口偏开，与图一致。</p>
<p class="s-k">用到：渐近线 y=±(b/a)x，b 在分子；写成 ±(3/4)x 是把分子分母写反。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 三轴长与大小排序</p>
<p class="s-b">实轴长 2a = 6，虚轴长 2b = 8，焦距 2c = 10。排序：2c &gt; 2b &gt; 2a，即 c 最大——这正是 c²=a²+b² 的几何含义（c 是斜边）。</p>
<p class="s-k">用到：实轴对应顶点，虚轴对应矩形的高，焦距对应两焦点。</p>
</li>
</ol>

<p class="gx-note">六问其实是同一件事：先认「谁是斜边 c」，再认「b 在分子」，最后别忘了绝对值。三步都对，双曲线的题就只剩代公式。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ c² = a² − b²，所以 c=√(9−16)。</p>
<p class="er-v">✓ c² = a² + b² = 9 + 16 = 25，c = 5，焦点 (±5, 0)。</p>
<p class="er-w">错在哪：把椭圆的减法照搬到双曲线。双曲线 <b>c²=a²+b²（与椭圆相反）</b>，c 最大，减出来根号里会是负数。</p>
</div>
<div class="er">
<p class="er-x">✗ 点 P 满足 PF₁−PF₂=2a，所以 P 的轨迹是双曲线。</p>
<p class="er-v">✓ |PF₁−PF₂|=2a（0&lt;2a&lt;|F₁F₂|）的点的轨迹才是双曲线。</p>
<p class="er-w">错在哪：没加绝对值只得到一支。<b>必须加绝对值，否则只是一支</b>；两支合起来才叫双曲线。</p>
</div>
<div class="er">
<p class="er-x">✗ x²/9−y²/16=1 的渐近线是 y=±(3/4)x。</p>
<p class="er-v">✓ y=±(b/a)x=±(4/3)x，因为 b=4 在分子、a=3 在分母。</p>
<p class="er-w">错在哪：分子分母写反。记住 <b>渐近线 y=±(b/a)x，b 在分子</b>：矩形的高是 2b。</p>
</div>
<div class="er">
<p class="er-x">✗ 算出 e = 4/5 = 0.8，所以这是双曲线。</p>
<p class="er-v">✓ e = c/a &gt; 1；0&lt;e&lt;1 是椭圆，e=1 是抛物线。</p>
<p class="er-w">错在哪：e&lt;1 说明分子分母用反了，或把椭圆结论套了过来。双曲线的 e 永远大于 1。</p>
</div>
<div class="er">
<p class="er-x">✗ 双曲线的焦点是 (±b, 0) 或 (±a, 0)。</p>
<p class="er-v">✓ 焦点是 (±c, 0)，其中 c=√(a²+b²)，且 c&gt;a。</p>
<p class="er-w">错在哪：焦点由 c 决定，不是由 a 或 b 决定；c 必须比 a 大，算完要检验。</p>
</div>
<div class="er">
<p class="er-x">✗ 看到 x²/9−y²/16=1，谁大谁当 a，所以 a=4，b=3。</p>
<p class="er-v">✓ a² 是 x² 下面的数：a²=9，a=3；b²=16，b=4。</p>
<p class="er-w">错在哪：a、b 由位置决定，不由大小决定。只有椭圆才附带「a&gt;b」的约定，双曲线的 a、b 谁大谁小都行。</p>
</div>
<div class="er">
<p class="er-x">✗ 焦点在 y 轴时，方程写成 x²/a²−y²/b²=1，渐近线还是 ±(b/a)x。</p>
<p class="er-v">✓ 焦点在 y 轴：y²/a²−x²/b²=1，焦点 (0,±c)，渐近线 y=±(a/b)x。</p>
<p class="er-w">错在哪：正项在哪个字母下，焦点就在哪个轴上；渐近线的斜率始终是「正项分母开根 ÷ 负项分母开根」，换轴就要跟着换。</p>
</div>

  var L = W, A = 3, G = null;

  /* 纯函数：虚半轴 b → c、e、k（a=3 固定） */
  function calc(v) {
    var b = v, c = Math.sqrt(9 + b * b);

    /* 单位刻度 */
    var i;

      line(gA, G.cx - 3.5, Y(-i), G.cx + 3.5, Y(-i), "#c9d4dd", 1);

    var sign, j, tt, xx, yy, up, lo;
    for (sign = -1; sign <= 1; sign += 2) {

      el("polyline", { points: up.join(" "), fill: "none", stroke: "#2563eb", "stroke-width": 2.4, "stroke-linejoin": "round" }, gA);

    }

    /* 顶点、虚轴端点、焦点 */
