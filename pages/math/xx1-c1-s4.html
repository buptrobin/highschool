<p class="gx-claim">空间向量的应用只有三件事：<b>用方向向量与法向量判平行、垂直</b>，<b>把三种角化成两个向量的夹角或其补角</b>，<b>用投影算距离</b>。</p>
<div class="gx-meta">
<span><i></i>人教A版选择性必修第一册 · 第一章第四节</span>
<span><i></i>高二 · 选择性必修第一册</span>

<span><i></i>含 1 个互动模型</span>
</div>
<p class="gx-lede">这一节是把第一章前面所有内容（空间向量及其运算、数量积、坐标表示）收口的地方：立体几何里那些「作辅助线—证相似—找垂足」的活，从此换成「建系—写坐标—算内积」。整章后面 1.4.2、1.4.3 的例题都在重复本节这套三步：先找方向向量与法向量，再算内积，最后把内积翻译成角或距离。最容易丢分的一件事是翻译那一步：<b>线面角不是方向向量与法向量的夹角</b>，而是它的余角。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 用向量刻画位置关系<span class="q-src">人教A版选择性必修第一册 · 第一章第四节</span></p>
<p class="q-b">直线 l 的方向向量为 u，平面 α 的法向量为 n，则 l⊥α ⇔ u∥n；l∥α ⇔ u·n=0。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三件事</b>组成——① 先有 l 的方向向量 u（沿 l 任取，不唯一）；② 先有 α 的法向量 n（<b>法向量需垂直于平面内两条相交直线</b>，只垂直一条不算）；③ 再比 u 与 n。少第 ② 条，n 就不是法向量，后面所有结论全部作废。注意 l∥α 还要补一句 l⊄α，否则线在面内也叫「平行于方向」。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 点到平面的距离<span class="q-src">人教A版选择性必修第一册 · 第一章第四节</span></p>
<p class="q-b">点 P 到平面 α 的距离 d=|AP·n|/|n|，其中 A 为平面 α 内任意一点，n 为平面 α 的法向量。</p>
<p class="q-n">→ 翻成人话：<b>两个条件</b>——① A 必须真的在平面 α 内，取哪个点都行，但取错了整条算错；② <b>距离公式要取绝对值</b>，因为 AP·n 可正可负，而距离不能是负数。分母是 |n| 的一次方，不是 |n|²。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 用向量求角<span class="q-src">人教A版选择性必修第一册 · 第一章第四节</span></p>
<p class="q-b">用空间向量求角：线线角、线面角、二面角都归结为两个向量的夹角或其补角。</p>
<p class="q-n">→ 翻成人话：「<b>或其补角</b>」四个字就是全节难点。线线角直接取夹角（规定为锐角或直角）；<b>线面角 = 90° − 方向向量与法向量夹角</b>；二面角要先用图形判断是锐角还是钝角，再决定取夹角还是补角。三个角，三种翻译，别混。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>条件</th><th>缺了会怎样</th></tr></thead>
<tbody>
<tr><td>n 垂直于平面 α 内两条相交直线</td><td>只垂直一条 → n 只是平面内某条直线的垂线，不是法向量</td></tr>
<tr class="key"><td>线面角 = 90° − 方向向量与法向量夹角</td><td>直接把夹角当线面角 → 答案写成它的余角，选择填空必错</td></tr>
<tr><td>分子写成 |AP·n|，取绝对值</td><td>不取绝对值 → 距离算出负数，或符号随点 A 的位置乱跳</td></tr>
<tr><td>分母是 |n|，不是 |n|²</td><td>写成 |n|² → 数值偏小，√3 变 3 这类错很常见</td></tr>
<tr><td>二面角先判锐角还是钝角</td><td>一律取锐角 → 钝二面角答成锐角，大题扣步骤分</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">记法：<b>方向向量沿一条线，法向量垂直一个面</b>。本节所有角与距离都是这两类向量的内积算出来的；背不下公式时，先问自己「这一步用的是 u 还是 n」。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 点到平面的距离<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">求点 P(1,0,2) 到平面 α：x+y+z=0 的距离。<br>（陷阱：平面过原点，取 A(0,0,0) 最省事；换别的点答案必须一样。）</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 读法向量</p>
<p class="s-b">平面写成 x+y+z=0，一次项系数就是法向量：n=(1,1,1)。这一步不用解方程组，因为平面已经是一般式。</p>
<p class="s-k">用到：一般式 Ax+By+Cz+D=0 的法向量是 (A,B,C)。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 在平面内取点 A</p>
<p class="s-b">把 (0,0,0) 代入：0+0+0=0 成立，所以 A(0,0,0) 在 α 内。于是 AP=(1−0, 0−0, 2−0)=(1,0,2)。</p>
<p class="s-k">用到：A 必须是平面内的点，代方程验证一次最稳。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 算内积 AP·n</p>
<p class="s-b">AP·n = 1×1 + 0×1 + 2×1 = 3。这个 3 是「有向投影的分子」，可以为负，所以下一步要加绝对值。</p>
<p class="s-k">用到：数量积的坐标公式。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 算 |n|</p>
<p class="s-b">|n|=√(1²+1²+1²)=√3。分母是一次方，别写成 |n|²=3。</p>
<p class="s-k">用到：向量模的坐标公式。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 代入并取绝对值</p>
<p class="s-b">d=|AP·n| ÷ |n| = |3| ÷ √3 = √3 ≈ 1.732。绝对值保证了距离非负。</p>
<p class="s-k">用到：<b>距离公式要取绝对值</b>，分母是 |n|。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">解：平面 α 的法向量可取 n=(1,1,1)。<br>在 α 内取点 A(0,0,0)，则 <span class="gx-fml">AP=(1,0,2)</span>，<span class="gx-fml">AP·n=1+0+2=3</span>，<span class="gx-fml">|n|=√3</span>。<br>所以点 P 到平面 α 的距离 <span class="gx-fml">d=|AP·n| ÷ |n| = 3 ÷ √3 = √3</span>。<br>答：距离为 √3。<br>（若取 A(1,−1,0)，则 AP=(0,1,2)，AP·n=3，d 仍为 √3，说明 A 的取法不影响结果。）</p>
</div>
</div>
</section>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「线面角不就是方向向量和法向量的夹角吗，为什么答案差一个余角？」</p>
<p class="a">不是。θ 是 u 与 n 的夹角，φ 是斜线与射影的夹角，两者互余：<b>线面角 = 90° − 方向向量与法向量夹角</b>。所以写 <span class="gx-fml">sin φ = |u·n| ÷ (|u||n|)</span>，不是 cos φ。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="方向向量与法向量夹角 theta 和线面角 phi 互余">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="90" y1="104" x2="90" y2="36" stroke="#2563eb" stroke-width="1.6"/>
<line x1="90" y1="104" x2="170" y2="66" stroke="#b8402f" stroke-width="1.6"/>
<path d="M90,60 A44,44 0 0 1 129.6,85.1" fill="none" stroke="#b8791f" stroke-width="1.3"/>
<text x="102" y="66" font-size="10" fill="#b8791f" font-weight="700">θ</text>
<text x="94" y="34" font-size="9" fill="#2563eb">n</text>
<text x="174" y="64" font-size="9" fill="#b8402f">u</text>
<text x="120" y="120" font-size="9" text-anchor="middle" fill="#3a3a35">φ = 90° − θ</text>
</svg>
</div>
<div class="qac">
<p class="q">「距离公式 d=AP·n/|n| 看着挺顺，为什么课本非要加绝对值？」</p>
<p class="a">因为 AP·n 可正可负：P 在法向量指向的一侧为正，另一侧为负，而距离不能是负数。<b>距离公式要取绝对值</b>，写成 <span class="gx-fml">d=|AP·n| ÷ |n|</span> 才对。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="点在平面两侧时 AP 与 n 内积一正一负，取绝对值后距离相同">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="30" y1="66" x2="210" y2="66" stroke="#9dc3d8" stroke-width="1.4"/>
<line x1="70" y1="40" x2="70" y2="66" stroke="#b8402f" stroke-dasharray="3 2"/>
<line x1="170" y1="92" x2="170" y2="66" stroke="#b8402f" stroke-dasharray="3 2"/>
<circle cx="70" cy="40" r="2.6" fill="#b8402f"/>
<circle cx="170" cy="92" r="2.6" fill="#b8402f"/>
<text x="78" y="38" font-size="9" fill="#b8402f">AP·n=+3</text>
<text x="178" y="100" font-size="9" fill="#b8402f">AP·n=−3</text>
<text x="120" y="118" font-size="9" text-anchor="middle" fill="#2f8a5b">取 |·| 后距离相同</text>
</svg>
</div>
<div class="qac">
<p class="q">「题目只给了一个平面，法向量到底怎么求？」</p>
<p class="a">设 n=(x,y,z)，在平面内找两条相交直线的方向向量 AB、AC，解 <span class="gx-fml">n·AB=0 且 n·AC=0</span>，取一组非零解。<b>法向量需垂直于平面内两条相交直线</b>，只对角一条线列方程，解出来的不是法向量。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="法向量同时垂直平面内两条相交直线 AB 与 AC">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="120" y1="88" x2="56" y2="106" stroke="#7a8794" stroke-width="1.4"/>
<line x1="120" y1="88" x2="184" y2="106" stroke="#7a8794" stroke-width="1.4"/>
<line x1="120" y1="88" x2="120" y2="34" stroke="#2563eb" stroke-width="1.6"/>
<polygon points="120,28 115,42 125,42" fill="#2563eb"/>
<circle cx="120" cy="88" r="2.4" fill="#151a21"/>
<text x="124" y="44" font-size="9" fill="#2563eb">n</text>
<text x="46" y="112" font-size="9" fill="#5a6472">B</text>
<text x="186" y="112" font-size="9" fill="#5a6472">C</text>
<text x="120" y="118" font-size="9" text-anchor="middle" fill="#3a3a35">n·AB=0，n·AC=0</text>
</svg>
</div>
<div class="qac">
<p class="q">「二面角我算出 cos θ=1/2，直接写 60° 不行吗？」</p>
<p class="a">不一定行。|cos φ| 只给大小，锐钝要靠图形判断：两个法向量同指内外时 <b>θ=180°−φ</b>，一内一外时 θ=φ。写成 60° 还是 120°，差的就是这一句判断。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="两个半平面与两法向量，钝二面角取 180 度减夹角">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="120" y1="34" x2="120" y2="106" stroke="#151a21" stroke-width="1.2"/>
<line x1="120" y1="58" x2="58" y2="98" stroke="#9dc3d8" stroke-width="1.4"/>
<line x1="120" y1="58" x2="182" y2="98" stroke="#b9d3a8" stroke-width="1.4"/>
<line x1="90" y1="100" x2="78" y2="60" stroke="#2563eb" stroke-width="1.4"/>
<line x1="150" y1="100" x2="162" y2="60" stroke="#2f8a5b" stroke-width="1.4"/>
<text x="64" y="56" font-size="9" fill="#2563eb">n₁</text>
<text x="166" y="56" font-size="9" fill="#2f8a5b">n₂</text>
<text x="120" y="120" font-size="9" text-anchor="middle" fill="#b8402f">θ = 180° − φ</text>
</svg>
</div>
<div class="qac">
<p class="q">「法向量我写成 n=(2,2,2)，会被判错吗？」</p>
<p class="a">不会。法向量只要求方向，长度随意：任意非零倍数 λn 都是法向量。代入 d=|AP·n| ÷ |n| 时分子分母同乘 |λ|，<b>d 与 λ 无关</b>——这也是可以用 n=(1,1,1) 代替 (2,2,2) 的理由。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="法向量取 n 与 2n 得到相同的距离">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="70" y1="102" x2="70" y2="46" stroke="#2563eb" stroke-width="1.5"/>
<polygon points="70,40 65,54 75,54" fill="#2563eb"/>
<line x1="150" y1="102" x2="150" y2="26" stroke="#b8791f" stroke-width="1.5"/>
<polygon points="150,20 145,34 155,34" fill="#b8791f"/>
<text x="76" y="48" font-size="9" fill="#2563eb">n</text>
<text x="156" y="30" font-size="9" fill="#b8791f">2n</text>
<text x="120" y="120" font-size="9" text-anchor="middle" fill="#3a3a35">d 不变，只差长度</text>
</svg>
</div>
<div class="qac">
<p class="q">「证明线面平行，算出 u·n=0 就够了吗？」</p>
<p class="a">不够，还要说明直线不在平面内。<b>u·n=0</b> 只说明方向向量与法向量垂直，线可能在面内。标准写法：「u·n=0，且 l⊄α，故 l∥α」，缺后半句扣步骤分。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="直线方向向量与法向量内积为零，直线平行于平面">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="26" y1="92" x2="214" y2="92" stroke="#9dc3d8" stroke-width="1.4"/>
<line x1="52" y1="52" x2="188" y2="52" stroke="#b8402f" stroke-width="1.5"/>
<polygon points="194,52 180,47 180,57" fill="#b8402f"/>
<line x1="120" y1="92" x2="120" y2="64" stroke="#2563eb" stroke-width="1.4"/>
<text x="126" y="72" font-size="9" fill="#2563eb">n</text>
<text x="196" y="48" font-size="9" fill="#b8402f">u</text>
<text x="34" y="88" font-size="9" fill="#5a6472">α</text>
<text x="120" y="118" font-size="9" text-anchor="middle" fill="#3a3a35">u·n=0 ⇒ 平行或在面内</text>
</svg>
</div>
</div>
<p class="gx-note">六问其实是同一件事：<b>先算内积，再决定怎么翻译</b>。角要问「互余还是互补」，距离要问「有没有取绝对值」，法向量要问「是不是真的垂直于面」。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 设平面法向量 n=(1,1,1)，直线方向向量 u=(1,2,1)，所以线面角 θ=arccos(4/√18)。</p>
<p class="er-v">✓ cos⟨u,n⟩=4/√18，故 <span class="gx-fml">sin φ=|cos⟨u,n⟩|=4/√18</span>，φ=arcsin(4/√18)。</p>
<p class="er-w">错在哪：<b>线面角 = 90° − 方向向量与法向量夹角</b>，不是夹角本身。夹角与线面角互余，正弦余弦要换过来用。</p>
</div>
<div class="er">
<p class="er-x">✗ d = AP·n ÷ |n| = −3 ÷ √3 = −√3。</p>
<p class="er-v">✓ <span class="gx-fml">d=|AP·n| ÷ |n| = |−3| ÷ √3 = √3</span>。</p>
<p class="er-w">错在哪：<b>距离公式要取绝对值</b>。AP·n 是带符号的投影，距离是非负数，负号必须去掉。</p>
</div>
<div class="er">
<p class="er-x">✗ n·AB=0，所以 n 是平面 α 的法向量。</p>
<p class="er-v">✓ n·AB=0 且 n·AC=0，其中 AB、AC 是 α 内两条相交直线，故 n⊥α。</p>
<p class="er-w">错在哪：<b>法向量需垂直于平面内两条相交直线</b>。只垂直一条，n 可能斜着穿过平面。</p>
</div>
<div class="er">
<p class="er-x">✗ 两法向量夹角余弦为 −1/2，所以二面角是 60°。</p>
<p class="er-v">✓ 由图形知二面角为钝角，故 θ=180°−60°=120°。</p>
<p class="er-w">错在哪：法向量夹角与二面角相等或互补，<b>锐钝必须看图判</b>，不能一律写成锐角。</p>
</div>
<div class="er">
<p class="er-x">✗ d = |AP·n| ÷ |n|² = 3 ÷ 3 = 1。</p>
<p class="er-v">✓ <span class="gx-fml">d = |AP·n| ÷ |n| = 3 ÷ √3 = √3</span>。</p>
<p class="er-w">错在哪：分母是 |n| 的一次方。|n|² 只在算 cos 的分母 |u||n| 里才会出现两个模相乘。</p>
</div>
<div class="er">
<p class="er-x">✗ 换成 A(1,−1,0) 以后算出的 d 变了，说明取点不同答案不同。</p>
<p class="er-v">✓ 换点后 AP 变了，但 AP·n 不变，d 仍是 √3，与 A 的取法无关。</p>
<p class="er-w">错在哪：AP·n=(P−A)·n=P·n−A·n，而 A 在平面内使 A·n 恒定，所以结果不随 A 变。</p>
</div>
<div class="er">
<p class="er-x">✗ 直线 l 的方向向量 u 满足 u·n=0，所以 l∥α。</p>
<p class="er-v">✓ u·n=0 且 l⊄α，所以 l∥α。</p>
<p class="er-w">错在哪：漏了「l 不在 α 内」。线在面内时 u·n=0 同样成立，结论却是 l⊂α。</p>
</div>
</div>

  /* 两套坐标：宽屏 880×470，窄屏独立 360×700 */
  var W = { vb: "0 0 880 470", left: { x: 16, y: 16, w: 424, h: 438 }, right: { x: 456, y: 16, w: 408, h: 438 } };
  var N = { vb: "0 0 360 700", left: { x: 8, y: 8, w: 344, h: 300 }, right: { x: 8, y: 320, w: 344, h: 372 } };
  var L = W, A = 3, G = null;

  /* 纯函数：参数 t → 距离。render() 和 __model.cases 都用它 */
  function calc(v) {
    var t = Math.round(v * 2) / 2;
    var d = Math.abs(3 + t) / Math.sqrt(3);
    return { d: d, onPlane: Math.abs(3 + t) < 1e-9 ? 1 : 0, s: 3 + t };
  }

  function geom() {
    return { s: L === W ? 1 : 0.72, cx: L.left.x + L.left.w * 0.48, cy: L.left.y + L.left.h * 0.53 };
  }

  /* 3D → 屏幕：x 向右、y 向上、z 向左下（斜二测风格的示意投影） */
  function P3(x, y, z) {
    return { x: G.cx + (44 * x - 30 * z) * G.s, y: G.cy + (26 * z - 16 * x - 40 * y) * G.s };
  }
  function pt(p) { return p.x.toFixed(1) + "," + p.y.toFixed(1); }
  function line(g, a, b, col, w, dash) {
    var o = { x1: a.x.toFixed(1), y1: a.y.toFixed(1), x2: b.x.toFixed(1), y2: b.y.toFixed(1), stroke: col, "stroke-width": w };
    if (dash) o["stroke-dasharray"] = dash;
    el("line", o, g);
  }
  function dot(g, p, col, r) { el("circle", { cx: p.x.toFixed(1), cy: p.y.toFixed(1), r: r || 3, fill: col }, g); }

  function draw() {
    var gA = $("gxA"), gB = $("gxB");
    gA.textContent = ""; gB.textContent = "";
    var t = A, d = Math.abs(3 + t) / Math.sqrt(3), lf = L.left, rt = L.right;

    el("rect", { x: lf.x, y: lf.y, width: lf.w, height: lf.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    tx(gA, lf.x + 16, lf.y + 24, "平面 x+y+z=0 与点 P(1, t, 2)", "#5a6472", "start", 10.5, 700);

    /* 平面 α：x+y+z=0 上的一个平行四边形 */
    var c1 = P3(-2, 2, 0), c2 = P3(2, 0, -2), c3 = P3(2, -2, 0), c4 = P3(-2, 0, 2);
    el("polygon", { points: [c1, c2, c3, c4].map(pt).join(" "), fill: "#eef6fb", stroke: "#9dc3d8" }, gA);
    var tagA = P3(-1.5, 1.5, 0);
    tx(gA, tagA.x - 8, tagA.y + 4, "α", "#5a6472", "middle", 11, 700);

    /* 坐标轴（带箭头与单位刻度） */
    var O = P3(0, 0, 0);
    var ax = [{ d: [44, -16], v: P3(2.6, 0, 0), n: "x" }, { d: [0, -40], v: P3(0, 2.6, 0), n: "y" }, { d: [-30, 26], v: P3(0, 0, 2.6), n: "z" }];
    for (var i = 0; i < ax.length; i++) {
      var e = ax[i].v, len = Math.sqrt(ax[i].d[0] * ax[i].d[0] + ax[i].d[1] * ax[i].d[1]);
      var ux = ax[i].d[0] / len, uy = ax[i].d[1] / len;
      line(gA, O, e, "#b8c2cc", 1.2);
      var hx = e.x + ux * 7 * G.s, hy = e.y + uy * 7 * G.s;
      el("polygon", { points: pt({ x: e.x + ux * 10 * G.s, y: e.y + uy * 10 * G.s }) + " " + pt({ x: hx - uy * 3.4, y: hy + ux * 3.4 }) + " " + pt({ x: hx + uy * 3.4, y: hy - ux * 3.4 }), fill: "#b8c2cc" }, gA);
      for (var k = 1; k <= 2; k++) {
        var b = P3(ax[i].d[0] * k / 44, ax[i].d[1] * k / 40, 0);
        if (i === 1) b = P3(0, k, 0);
        if (i === 2) b = P3(0, 0, k);
        line(gA, { x: b.x - (-uy) * 2.4 * G.s, y: b.y - ux * 2.4 * G.s }, { x: b.x + (-uy) * 2.4 * G.s, y: b.y + ux * 2.4 * G.s }, "#b8c2cc", 1);
      }
      tx(gA, e.x + ux * 14 * G.s, e.y + uy * 14 * G.s + 3, ax[i].n, "#9aa6b2", "middle", 10, 400);
    }

    /* 法向量 n 与「点到平面的垂线段」都沿同一方向 */
    var nTip = P3(2.4, 2.4, 2.4);
    line(gA, O, nTip, "#2563eb", 1.8);
    var nu = { x: nTip.x - O.x, y: nTip.y - O.y }, nl = Math.sqrt(nu.x * nu.x + nu.y * nu.y);
    nu = { x: nu.x / nl, y: nu.y / nl };
    el("polygon", { points: pt({ x: nTip.x + nu.x * 9, y: nTip.y + nu.y * 9 }) + " " + pt({ x: nTip.x - nu.y * 4, y: nTip.y + nu.x * 4 }) + " " + pt({ x: nTip.x + nu.y * 4, y: nTip.y - nu.x * 4 }), fill: "#2563eb" }, gA);
    tx(gA, nTip.x + 12, nTip.y - 4, "n", "#2563eb", "start", 11, 700);

    var Pp = P3(1, t, 2), Hp = P3(-t / 3, (2 * t - 3) / 3, (3 - t) / 3);

    /* AP（A 取原点）与 PH */
    line(gA, O, Pp, "#7a8794", 1.2, "4 3");
    line(gA, Pp, Hp, "#b8402f", 2.2);
    dot(gA, O, "#151a21", 3);
    tx(gA, O.x - 12, O.y + 14, "A", "#5a6472", "middle", 10, 400);
    dot(gA, Pp, "#b8402f", 3.2);
    tx(gA, Pp.x + 11, Pp.y - 5, "P", "#b8402f", "start", 10, 700);
    dot(gA, Hp, "#b8402f", 2.8);
    tx(gA, Hp.x + 8, Hp.y + 13, "H", "#b8402f", "start", 10, 400);

    /* 垂足的直角标记 */
    var hu = { x: (Pp.x - Hp.x) / Math.max(1, Math.abs(Pp.y - Hp.y) + 1), y: (Pp.y - Hp.y) / Math.max(1, Math.abs(Pp.y - Hp.y) + 1) };
    var hlen = 9;
    var p1 = { x: Hp.x + hu.x * hlen, y: Hp.y + hu.y * hlen };
    line(gA, p1, { x: p1.x - 8, y: p1.y + 2 }, "#7a8794", 1);
    line(gA, { x: Hp.x - 8, y: Hp.y + 2 }, { x: Hp.x - 8 + hu.x * hlen, y: Hp.y + 2 + hu.y * hlen }, "#7a8794", 1);

    /* d 标注：取 PH 中点，往右下错开 */
    var mid = { x: (Pp.x + Hp.x) / 2 + 9, y: (Pp.y + Hp.y) / 2 };
    tx(gA, mid.x, mid.y, "d", "#b8402f", "start", 11, 700);
    tx(gA, lf.x + 16, lf.y + lf.h - 14, "A 在平面内，PH⊥α，|PH| 就是距离", "#7a8794", "start", 9.4, 400);

    /* 右侧数值面板 */
    el("rect", { x: rt.x, y: rt.y, width: rt.w, height: rt.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    var rx = rt.x + 20;
    tx(gB, rx, rt.y + 30, "数值与判断", "#5a6472", "start", 10.5, 700);
    tx(gB, rx, rt.y + 58, "平面 x+y+z=0，n=(1,1,1)", "#3a3a35", "start", 9.6, 400);
    tx(gB, rx, rt.y + 80, "AP·n = 3+t = " + (3 + t).toFixed(1), "#3a3a35", "start", 9.6, 400);
    tx(gB, rx, rt.y + 102, "|n| = √3 ≈ 1.732", "#3a3a35", "start", 9.6, 400);
    tx(gB, rx, rt.y + 124, "d = |3+t| ÷ |n|", "#3a3a35", "start", 9.6, 400);
    tx(gB, rx, rt.y + 160, "距离 d", "#7a8794", "start", 9.4, 400);
    tx(gB, rx, rt.y + 200, d.toFixed(3), d < 1e-9 ? "#2f8a5b" : "#2563eb", "start", 27, 700);

    /* 距离条：0 → 2√3 */
    var bx = rx, bw = rt.w - 60, by = rt.y + 246, maxD = 2 * Math.sqrt(3);
    el("rect", { x: bx, y: by, width: bw, height: 8, rx: 4, fill: "#eef1f4" }, gB);
    el("rect", { x: bx, y: by, width: Math.max(1, bw * d / maxD).toFixed(1), height: 8, rx: 4, fill: d < 1e-9 ? "#2f8a5b" : "#2563eb" }, gB);
    tx(gB, bx, by + 22, "0", "#9aa6b2", "start", 9, 400);
    tx(gB, bx + bw / 2, by + 22, "√3", "#9aa6b2", "middle", 9, 400);
    tx(gB, bx + bw, by + 22, "2√3", "#9aa6b2", "end", 9, 400);

    if (d < 1e-9) {
      tx(gB, rx, rt.y + 292, "点在平面内：3+t=0", "#2f8a5b", "start", 10, 700);
    } else {
      tx(gB, rx, rt.y + 292, "点在平面外，d 随 t 线性变", "#2563eb", "start", 10, 700);
    }
    tx(gB, rx, rt.y + 318, "t=−3 时 P 落在 α 上，d=0", "#7a8794", "start", 9.2, 400);
  }

  function render() {
    if (!G) { L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N; G = geom(); stage.setAttribute("viewBox", L.vb); }
    var t = A, s = calc(t), d = s.d, onPlane = s.onPlane, st, col, bg, sn;
    $("gxVa").textContent = String(t);
    $("gxVb").textContent = String(3 + t);
    $("gxVc").textContent = d.toFixed(3);
    if (onPlane) { st = "点在平面内"; col = "#2f8a5b"; bg = "#e6f6ee"; sn = "3+t=0，P 满足平面方程"; }
    else { st = "点在平面外"; col = "#2563eb"; bg = "#e8f0fd"; sn = "3+t≠0，d 大于 0"; }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    draw();
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    G = geom();
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 3 }, { t: 1.2, v: 3 }, { t: 4, v: 0 }, { t: 6.5, v: 0 }, { t: 9, v: -3 }, { t: 11.5, v: -3 }, { t: 13.5, v: 3 }],
    keys: [3, 0, -3],
    value: A, min: -3, max: 3, step: 0.5,
    idle: 5000,
    onChange: function (v) { A = Math.round(v * 2) / 2; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc, cases: [
    { v: 0, eq: { d: 1.7321 } },
    { v: 3, eq: { d: 3.4641 } },
    { v: -3, eq: { d: 0, onPlane: 1 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
</body>
</html>
