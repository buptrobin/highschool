<p class="gx-claim">数学归纳法不是「多试几个」，而是<b>奠基 + 递推</b>这两步缺一不可：先证明 n=n₀ 成立，再证明「n=k 成立 ⇒ n=k+1 成立」。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边的课本句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 数学归纳法的两个步骤<span class="q-src">人教A版选择性必修第二册 · 第四章第4节</span></p>
<p class="q-b">证明一个与正整数 n 有关的命题，可按下列步骤进行：(1) 证明当 n=n₀ 时命题成立；(2) 假设 n=k（k≥n₀）时命题成立，证明 n=k+1 时命题也成立。</p>
<p class="q-n">→ 翻成人话：这段话只由<b>两个条件</b>组成。条件①管「起点」，条件②管「从这一格走到下一格」。条件②里还藏着两个小要求：k 必须满足 k≥n₀，而且<b>必须把「n=k 成立」这句话用上</b>。少任何一个，写的都不是数学归纳法。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 结论怎么写<span class="q-src">人教A版选择性必修第二册 · 第四章第4节</span></p>
<p class="q-b">完成这两步，就可以断定命题对从 n₀ 开始的所有正整数 n 都成立。</p>
<p class="q-n">→ 翻成人话：这句话是答题卡上的<b>收尾句</b>，不是客套。「从 n₀ 开始」「所有正整数」两个限定一个都不能丢，丢了就是结论范围没交代，按步给分时直接扣一分。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 方法的名称<span class="q-src">人教A版选择性必修第二册 · 第四章第4节</span></p>
<p class="q-b">这种证明方法叫做数学归纳法。</p>
<p class="q-n">→ 翻成人话：名字里的「归纳」指的是<b>由 k 推 k+1 的递推</b>，不是「观察前几项猜规律」。猜规律可以帮你找到要证的式子，但猜出来的式子还得用这两步去证。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>要满足的条件</th><th>具体做法</th><th>缺了会怎样</th></tr></thead>
<tbody>
<tr><td>条件① 奠基</td><td>证明 n=n₀ 时命题成立（本节例子里 n₀=1）</td><td>链条没有起点，后面的递推全部悬空，命题可能根本不成立</td></tr>
<tr><td>条件② 递推</td><td>假设 n=k（k≥n₀）成立，证 n=k+1 也成立</td><td>只验证 1、2、3 几个值，永远证不到「所有正整数」</td></tr>
<tr class="key"><td>条件② 的核心动作</td><td>把「n=k 时成立」这句话<b>代进去用</b>，再补上多出来的那一项</td><td>不用归纳假设，就退化成对每个 k 单独硬算，不是数学归纳法，写得再对也不给分</td></tr>
<tr><td>条件③ k 的范围</td><td>写明 k≥n₀（n₀=1 时写 k≥1，k∈N*）</td><td>k 取到范围外，递推的依据不成立，第二步是空话</td></tr>
<tr><td>收尾句</td><td>由①②知，对一切 n≥n₀ 的正整数 n，命题都成立</td><td>答案没闭合，判卷时算「未完成证明」</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">背法：<b>一验、二设、三推、四结</b>——验 n₀、设 n=k、推 n=k+1、结「对一切正整数」。整张表只高亮一行，因为真正决定这道题给不给分的是第三行：<b>你有没有用上归纳假设</b>。</p>
</section>

<h2><span class="sn">02</span>拆开看</h2>
<p class="gx-h2s">四张图各讲一件事：先看多米诺为什么必须两块条件，再看两步怎么写，再看 k→k+1 多出来的那一项，最后看缺一步会怎么塌。</p>

<p class="fig-s">整排骨牌能全倒，只依赖两件事：第一块被推倒（奠基），以及任意一块倒下都能压倒下一块（递推）。第二步里的「假设 n=k 成立」，相当于「假设第 k 块已经倒了」。</p>

<p class="gx-take">只推倒第一块、或只承认「每块能推下一块」，都不能让整排倒下——所以<b>两步缺一不可</b>。</p>
<p class="gx-note">对应关系：第一块倒 = 奠基；「第 k 块倒 ⇒ 第 k+1 块倒」= 递推。第二步里的 k 是任取的一块，不是某一块具体的牌，所以写的时候要保留字母 k。</p>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。第 (2) 问是个陷阱，别急着往下翻。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 用数学归纳法证明恒等式<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">(1) 用数学归纳法证明：1+3+5+…+(2n−1) = n²（n∈N*）。<br>(2) 某同学第二步写成：「假设 n=k 时 1+3+…+(2k−1)=k²，则 n=k+1 时，1+3+…+(2k+1)=(k+1)²，右边恰好是完全平方，所以成立。」指出他的错误。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 定 n₀ 与命题形式</p>
<p class="s-b">n₀=1。左边是前 n 个奇数之和（末项 2n−1），右边是 n²。要证的是「对一切正整数 n，左边 = 右边」，所以三步：奠基、递推、收尾。</p>
<p class="s-k">用到：n₀ 就是让左边第一项有意义的最小正整数，本题为 1。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 奠基：验 n=1</p>
<p class="s-b">当 n=1 时，左边 = 1，右边 = 1² = 1，左边 = 右边，所以 n=1 时命题成立。</p>
<p class="s-k">用到：条件①。一个数也要两边都算出来再比，不能只写「显然成立」。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 设 n=k（k≥1）</p>
<p class="s-b">假设当 n=k（k≥1，k∈N*）时命题成立，即 1+3+5+…+(2k−1) = k²。把这个式子原样抄下来，它就是接下来唯一能用的武器。</p>
<p class="s-k">用到：归纳假设。k 的范围必须写，写成 k∈N* 或 k≥1。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 推 n=k+1（写出增加项）</p>
<p class="s-b">当 n=k+1 时，左边 = 1+3+…+(2k−1)+(2k+1)。括号里那串正好是归纳假设的左边，换成 k²，得 k²+(2k+1)=(k+1)²，正好等于 n=k+1 时的右边。所以 n=k+1 时命题也成立。</p>
<p class="s-k">用到：条件②。关键动作是把前 k 项<b>打包成 k²</b>，只单独处理多出来的 2k+1（不是 2k，也不是 2k+2）。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收尾，并点破 (2) 的错</p>
<p class="s-b">由①②知，对一切正整数 n，1+3+5+…+(2n−1)=n² 都成立。(2) 的写法把要证的结论直接当已知用了：n=k+1 时的左边他写成了 1+3+…+(2k+1)，却没说明「前 k 项 = k²」，等于没有用归纳假设，是循环论证。</p>
<p class="s-k">用到：结论句「由①②知，对一切正整数 n」+ 第二步必须用上假设。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">(1) ① 当 n=1 时，左边 = 1，右边 = 1² = 1，左边 = 右边，命题成立。<br>② 假设当 n=k（k≥1，k∈N*）时命题成立，即 1+3+5+…+(2k−1) = k²。则当 n=k+1 时，左边 = 1+3+5+…+(2k−1)+(2k+1) = k²+(2k+1) = (k+1)² = 右边，所以 n=k+1 时命题也成立。<br>③ 由①②知，对一切正整数 n，1+3+5+…+(2n−1) = n² 都成立。<br>(2) 错在第二步没有用上归纳假设：他把 n=k+1 时的左边直接写成待证的式子并默认它等于 (k+1)²，属于循环论证；正确做法是把前 k 项换成假设中的 k²，再单独加上增加项 2k+1。</p>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">

<div class="qac">
<p class="q">「我把 n=1,2,3,4 都代进去是对的，这不算证明吗？」</p>

<div class="qac">
<p class="q">「第二步我直接算 n=k+1 的左边，为什么被判 0 分？」</p>

<div class="qac">
<p class="q">「k 到 k+1，左边到底多出什么？我老写错成 2k。」</p>
<p class="a">左边第 n 项是 2n−1，把 n 换成 k+1 得 2(k+1)−1 = <b>2k+1</b>。写成 2k 是忘了减 1，写成 2k+2 是把它当成了 2n。右边增量是 (k+1)²−k²，算出来也是 2k+1。</p>

<div class="qac">
<p class="q">「数学归纳法和反证法有什么区别？不都是假设吗？」</p>
<p class="a">反证法是<b>假设结论不成立</b>去导出矛盾（否定式假设）；数学归纳法是<b>假设 n=k 时成立</b>去推 n=k+1（肯定式假设，只推一步）。前者一次推翻，后者逐格传递，方向完全相反。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="归纳法向右逐格传递，反证法假设否定导出矛盾">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="16" y="32" font-size="9" font-weight="700" fill="#2563eb">归纳：k → k+1</text>
<line x1="24" y1="46" x2="106" y2="46" stroke="#2563eb" stroke-width="1.5"/>
<polygon points="110,46 100,41.5 100,50.5" fill="#2563eb"/>
<circle cx="24" cy="46" r="3" fill="#2563eb"/><circle cx="52" cy="46" r="3" fill="#2563eb"/><circle cx="80" cy="46" r="3" fill="#2563eb"/>
<text x="120" y="49" font-size="8.6" fill="#2563eb">假设成立 ⇒ 下一步成立</text>
<text x="16" y="82" font-size="9" font-weight="700" fill="#b8402f">反证：假设不成立</text>
<line x1="24" y1="96" x2="106" y2="96" stroke="#b8402f" stroke-width="1.5"/>
<polygon points="110,96 100,91.5 100,100.5" fill="#b8402f"/>
<text x="120" y="99" font-size="8.6" fill="#b8402f">推出矛盾 ⇒ 原结论成立</text>
<text x="120" y="118" text-anchor="middle" font-size="8.6" fill="#6b7480">假设的内容正好相反</text>
</svg>
</div>

</div>
<p class="gx-note">六问其实是同一件事：<b>数学归纳法是两步的机器，少一步或不用假设，机器就空转</b>。考场上先写「① 奠基」，再写「② 假设 n=k…」，最后写「由①②知」，分数就稳了。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">

<div class="er">
<p class="er-x">✗ n=1,2,3 时都成立，所以对一切正整数 n 成立。</p>
<p class="er-v">✓ 当 n=1 时左边 = 右边，命题成立；假设 n=k 时成立，可推出 n=k+1 时也成立。由①②知对一切正整数 n 成立。</p>
<p class="er-w">错在哪：<b>只验证、没递推</b>。有限个正例推不出无限个结论，缺了条件②。</p>
</div>

<div class="er">
<p class="er-x">✗ 假设 n=k 时成立。当 n=k+1 时，1+3+…+(2k+1)=(k+1)²，成立。</p>
<p class="er-v">✓ 假设 n=k 时 1+3+…+(2k−1)=k²。则 n=k+1 时，左边 = k²+(2k+1) = (k+1)²。</p>
<p class="er-w">错在哪：<b>没用上归纳假设</b>，把要证的结论又写了一遍，是循环论证。递推必须经过「前 k 项 = k²」这一换。</p>
</div>

<div class="er">
<p class="er-x">✗ 假设 n=k 时命题成立，则 n=k+1 时命题也成立（不写 k 的范围）。</p>
<p class="er-v">✓ 假设 n=k（k≥n₀，k∈N*）时命题成立，则 n=k+1 时命题也成立。</p>
<p class="er-w">错在哪：<b>k 的取值范围没交代</b>。k 一旦取到 n₀ 以外，递推的依据不成立，第二步等于空话。</p>
</div>

<div class="er">
<p class="er-x">✗ 从 k 到 k+1，左边增加了 2k 项。</p>
<p class="er-v">✓ 从 k 到 k+1，左边增加了第 k+1 个奇数，即 2(k+1)−1 = 2k+1。</p>
<p class="er-w">错在哪：<b>增加项写错</b>。左边只多一项（不是 2k 项），且这一项是 2k+1，写成 2k 或 2k+2 都会让后面的恒等式对不上。</p>
</div>

<div class="er">
<p class="er-x">✗ 由①②可知，命题成立。</p>
<p class="er-v">✓ 由①②知，对一切 n≥n₀ 的正整数 n，命题都成立。</p>
<p class="er-w">错在哪：<b>结论范围没写全</b>。「从 n₀ 开始」「所有正整数」是这句话的两个限定，丢了就答不完整。</p>
</div>

<div class="er">
<p class="er-x">✗ 奠基时把 n=1 和 n=k 同时代进同一个式子，再令它们相等。</p>
<p class="er-v">✓ 奠基只代 n=n₀；递推里先固定 k 用假设，再把 n 换成 k+1，两个式子各管一段。</p>
<p class="er-w">错在哪：<b>把 n=k 和 n=k+1 混在同一个式子里</b>。归纳假设和待证结论必须是两个不同的式子，混用等于自己证自己。</p>
</div>

<div class="er">
<p class="er-x">✗ 第二步只写「同理可证 n=k+1 时成立」。</p>
<p class="er-v">✓ 第二步写出完整链条：左边 = [假设的左边] + 增加项 = 假设的右边 + 增加项 = 目标右边。</p>
<p class="er-w">错在哪：<b>省略了增加项和代换过程</b>。阅卷按步给分，这一步正是采分点，写「同理」直接丢分。</p>
</div>

</div>

<script>
/* 互动脚本：数学归纳法 k → k+1 的增量（由 build-page.mjs 包进 <script> 里，不要写 <script> 标签） */
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var GX = window.GX, el = GX.el, tx = GX.tx, $ = GX.$;
  var stage = $("gxStage");
  if (!stage || !window.AutoPilot) return;

  /* 两套坐标：宽屏 880×470，窄屏独立 360×700 */
  var W = { vb: "0 0 880 470", left: { x: 16, y: 16, w: 424, h: 438 }, right: { x: 456, y: 16, w: 408, h: 438 } };
  var N = { vb: "0 0 360 700", left: { x: 8, y: 8, w: 344, h: 300 }, right: { x: 8, y: 320, w: 344, h: 372 } };
  var L = W, G = null, A = 1;

  /* 纯函数：k → 数值。render() 和 __model.cases 都用它 */
  function calc(v) {
    var k = Math.round(v);
    var inc = 2 * k + 1;                    /* 从 k 到 k+1，左边多出来的那一项 */
    var dl = inc;                           /* 左边增量 */
    var dr = (k + 1) * (k + 1) - k * k;     /* 右边增量，也等于 2k+1 */
    var same = dl === dr ? 1 : 0;
    return { k: k, inc: inc, dl: dl, dr: dr, same: same };
  }

  /* 面板几何（与 k 无关，只在宽度变化时重建） */
  function geom() {
    return { left: L.left, right: L.right };
  }

  /* 方格阵：n×n；kIn 给出时，最上一行与最右一列是「新增的 L 形」 */
  function cells(parent, ox, oy, n, cell, kIn) {
    for (var i = 0; i < n; i++) {
      for (var j = 0; j < n; j++) {
        var isNew = kIn !== undefined && (i === 0 || j === n - 1);
        el("rect", {
          x: ox + j * cell, y: oy + i * cell, width: cell, height: cell, rx: 2,
          fill: isNew ? "#fbe9d8" : "#eef4fd",
          stroke: isNew ? "#b8791f" : "#9aa7b3", "stroke-width": 1
        }, parent);
      }
    }
  }

  function draw(s) {
    var gA = $("gxA"), gB = $("gxB");
    gA.textContent = ""; gB.textContent = "";
    var PA = G.left, PB = G.right;
    var k = s.k;

    /* 左面板：n=k，左边垒成的 k² 正方形 */
    el("rect", { x: PA.x, y: PA.y, width: PA.w, height: PA.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    tx(gA, PA.x + 20, PA.y + 30, "n=k：前 k 个奇数垒成正方形", "#5a6472", "start", 10.5, 700);
    var availA = Math.min(PA.w - 100, PA.h - 150);
    var cA = Math.max(18, Math.min(46, Math.floor(availA / k)));
    var oxA = PA.x + (PA.w - k * cA) / 2, oyA = PA.y + 78;
    cells(gA, oxA, oyA, k, cA);
    tx(gA, PA.x + 20, PA.y + PA.h - 44, "1+3+…+(2k−1) = k²", "#2563eb", "start", 12, 700);
    tx(gA, PA.x + 20, PA.y + PA.h - 24, "k=" + k + " 时，左边 = " + (k * k) + "（共 " + k + " 项）", "#5a6472", "start", 9.6, 400);

    /* 右面板：n=k+1，(k+1)² 里比 k² 多出的 L 形 = 2k+1 */
    el("rect", { x: PB.x, y: PB.y, width: PB.w, height: PB.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    tx(gB, PB.x + 20, PB.y + 30, "n=k+1：多出的 L 形 = 2k+1", "#5a6472", "start", 10.5, 700);
    var availB = Math.min(PB.w - 100, PB.h - 170);
    var cB = Math.max(16, Math.min(40, Math.floor(availB / (k + 1))));
    var n2 = k + 1;
    var oxB = PB.x + (PB.w - n2 * cB) / 2, oyB = PB.y + 78;
    cells(gB, oxB, oyB, n2, cB, k);
    tx(gB, PB.x + 20, PB.y + PB.h - 62, "(k+1)²−k² = " + s.dr, "#b8791f", "start", 11.5, 700);
    tx(gB, PB.x + 20, PB.y + PB.h - 44, "左边增加项 2(k+1)−1 = " + s.inc, "#b8402f", "start", 10, 700);
    tx(gB, PB.x + 20, PB.y + PB.h - 24, "k² + (2k+1) = (k+1)²，" + (s.same ? "两边增量恒等" : "不相等"), "#2f8a5b", "start", 9.6, 700);
  }

  function render() {
    if (!G) { L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N; G = geom(); stage.setAttribute("viewBox", L.vb); }
    var s = calc(A), st, col, bg, sn;
    $("gxVa").textContent = String(s.k);
    $("gxVb").textContent = String(s.inc);
    $("gxVc").textContent = String(s.dr);
    if (s.k === 1) { st = "奠基"; col = "#2f8a5b"; bg = "#e6f6ee"; sn = "n=1：左边 1 = 右边 1²，起点成立"; }
    else { st = "递推"; col = "#2563eb"; bg = "#eef4fd"; sn = "用假设 k²，加上 2k+1 得 (k+1)²"; }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    draw(s);
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    G = geom();
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 1 }, { t: 1.2, v: 1 }, { t: 4, v: 3 }, { t: 6.5, v: 3 }, { t: 9, v: 6 }, { t: 11.5, v: 4 }, { t: 13.5, v: 1 }],
    keys: [1, 3, 6],
    value: A, min: 1, max: 6, step: 1,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc, cases: [
    { v: 1, eq: { inc: 3, same: 1 } },
    { v: 3, eq: { inc: 7, same: 1 } },
    { v: 6, eq: { inc: 13, same: 1 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
