<p class="gx-claim">等比数列只认两件事：<b>相邻两项的比是同一个常数 q</b>，<b>指数是 n−1 不是 n</b>；求和时先看 <b>q 是不是 1</b>。</p>

<p class="gx-lede">第 4 章先从等差讲到等比：等差看「差」，等比看「比」。这一节真正会丢分的不是定义，而是三个细节——q 能不能为 0、通项里指数写 n 还是 n−1、以及 q=1 时求和公式的分母为 0。前两个靠背准，第三个只能靠「先分情况」这个动作。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 等比数列的定义<span class="q-src">人教A版选择性必修第二册 · 第四章第3节</span></p>
<p class="q-b">一般地，如果一个数列从第 2 项起，每一项与它的前一项的比等于同一个常数，那么这个数列叫做等比数列，这个常数叫做等比数列的公比，公比通常用字母 q 表示（q≠0）。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个条件</b>组成——① 从第 2 项起（第一项没有前一项，不参与检验）；② 每一个比值都相等，不能只验前两个；③ 这个常数 q≠0，因为分母是前一项，q=0 会让后一项全变成 0，比值也就没意义了。三条缺一条，就不是等比数列。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 通项公式<span class="q-src">人教A版选择性必修第二册 · 第四章第3节</span></p>
<p class="q-b">首项为 a₁、公比为 q 的等比数列的通项公式为 aₙ=a₁qⁿ⁻¹。</p>
<p class="q-n">→ 翻成人话：从 a₁ 走到 aₙ 一共乘了 <b>n−1 次</b> q，所以指数是 n−1。另外两个条件同样要盯住：<b>q≠0 且首项 a₁≠0</b>——否则每一项都是 0，数列确实「每项比都相等」却算不上等比数列，而且通项公式也退化成一个常数 0。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 前 n 项和公式<span class="q-src">人教A版选择性必修第二册 · 第四章第3节</span></p>
<p class="q-b">当 q≠1 时，Sₙ=a₁(1−qⁿ)/(1−q)；当 q=1 时，Sₙ=na₁。</p>
<p class="q-n">→ 翻成人话：这个公式<b>分成两段</b>，不是一个式子。q=1 时分母 1−q=0，公式直接无意义，必须单独算——此时数列是常数列 a₁,a₁,…,a₁，和就是 n 个 a₁ 相加。所以任何时候拿到「求 Sₙ」，第一步都是先问 q 等不等于 1。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>条件</th><th>缺了它会怎样</th></tr></thead>
<tbody>
<tr><td>从第 2 项起，每项与前一项的比都相等</td><td>只验 a₂÷a₁ 就下结论，遇到 1,2,4,8,15… 会误判成等比</td></tr>
<tr><td>这个比是同一个常数 q（不随 n 变）</td><td>比值时大时小只能叫「有规律」，不能叫等比</td></tr>
<tr><td>q≠0（且首项 a₁≠0）</td><td>0,0,0,… 每项比都是 0，但它不是等比数列；aₙ=a₁qⁿ⁻¹ 也失去意义</td></tr>
<tr><td>通项里指数写 n−1</td><td>写成 a₁qⁿ 会把 a₂ 算成 a₁q²，整题错位一项</td></tr>
<tr class="key"><td>求 Sₙ 前先判断 q 是否为 1</td><td>q=1 直接套 a₁(1−qⁿ)/(1−q)，分母为 0，属于「公式失效仍套用」，过程分全扣</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">背法：定义抓「同一个常数」，通项抓「n−1」，求和抓「分两段」。整张表只有最后一行高亮，因为它是唯一一个「式子本身会崩」的条件——前四条错在理解，这条错在算术上直接除零。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 等比数列通项与求和<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">已知等比数列 {aₙ} 中，a₁=1，公比 q=2。（1）求 a₆；（2）求前 6 项和 S₆。（3）若把条件改成 q=1，S₆ 又是多少？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 认条件</p>
<p class="s-b">这是等比数列，给出首项 a₁=1 与公比 q=2，q≠0、a₁≠0，两个前提都满足，可以直接用通项公式。</p>
<p class="s-k">用到：等比数列定义中 q≠0 且首项≠0 的条件。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 写通项，指数用 n−1</p>
<p class="s-b">aₙ=a₁qⁿ⁻¹=1×2ⁿ⁻¹=2ⁿ⁻¹。求第 6 项就把 n=6 代入：a₆=2⁶⁻¹=2⁵=32。</p>
<p class="s-k">用到：aₙ=a₁qⁿ⁻¹，指数是 n−1 不是 n。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 求和前先看 q</p>
<p class="s-b">q=2≠1，所以可以用 Sₙ=a₁(1−qⁿ)/(1−q)。代入 a₁=1、q=2、n=6：S₆=(1−2⁶)/(1−2)=(1−64)/(−1)=63。</p>
<p class="s-k">用到：q≠1 时的求和公式。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 验算</p>
<p class="s-b">逐项加：1+2+4+8+16+32=63，与公式一致。a₆=32 也正好是第 6 项，说明指数没有错位。</p>
<p class="s-k">用到：前 6 项逐项相加的检验。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 换成 q=1 再走一次</p>
<p class="s-b">q=1 时数列为 1,1,1,1,1,1，是常数列。此时分母 1−q=0，求和公式失效，不能代入；直接 S₆=6a₁=6×1=6。</p>
<p class="s-k">用到：q=1 必须分情况，Sₙ=na₁。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）由 aₙ=a₁qⁿ⁻¹ 得 a₆=1×2⁵=32。<br>（2）因为 q=2≠1，所以 S₆=a₁(1−q⁶)/(1−q)=(1−2⁶)/(1−2)=63。<br>（3）当 q=1 时，数列为常数列，S₆=6a₁=6；此时不能代入 a₁(1−q⁶)/(1−q)，因为分母 1−q=0，公式失效，必须分情况讨论。</p>
</div>
</div>
</section>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「公比 q 能不能等于 0？首项能不能是 0？」</p>
<p class="a">都不能。定义要求 q≠0，因为 q 是「后项除以前项」得到的比值，前项为 0 时比值无意义；首项 a₁≠0 也必须有，否则整个数列全是 0，比值恒为 0 却<b>不叫等比数列</b>。所以判断前先看这两条。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="全零数列不是等比数列">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="32" font-size="9.4" text-anchor="middle" fill="#5a6472">0, 0, 0, 0, …</text>
<text x="120" y="56" font-size="9.4" text-anchor="middle" fill="#b8402f">比值恒为 0，但 q≠0</text>
<text x="120" y="82" font-size="9.4" text-anchor="middle" fill="#b8402f">⇒ 不是等比数列</text>
<line x1="40" y1="98" x2="200" y2="98" stroke="#e0b3ab"/>
<text x="120" y="114" font-size="9" text-anchor="middle" fill="#8a94a3">a₁≠0 且 q≠0 是前提</text>
</svg>
</div>
<div class="qac">
<p class="q">「q=1 的时候，Sₙ 还能套 a₁(1−qⁿ)/(1−q) 吗？」</p>
<p class="a">不能。q=1 时 1−q=0，式子的分母为 0，公式失效；此时数列是常数列，<b>Sₙ=na₁</b>。写解答时必须先分情况：当 q=1 时 Sₙ=na₁；当 q≠1 时再用公式。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="q等于1时常数列求和">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="30" y1="70" x2="210" y2="70" stroke="#94a3b8"/>
<line x1="30" y1="70" x2="30" y2="30" stroke="#94a3b8"/>
<line x1="56" y1="46" x2="184" y2="46" stroke="#b8402f" stroke-width="2"/>
<circle cx="56" cy="46" r="3" fill="#b8402f"/><circle cx="98" cy="46" r="3" fill="#b8402f"/>
<circle cx="140" cy="46" r="3" fill="#b8402f"/><circle cx="184" cy="46" r="3" fill="#b8402f"/>
<text x="120" y="92" font-size="9.2" text-anchor="middle" fill="#b8402f">分母 1−q=0 ⇒ 失效</text>
<text x="120" y="112" font-size="9.4" text-anchor="middle" fill="#2f6b4c">Sₙ=na₁</text>
</svg>
</div>
<div class="qac">
<p class="q">「通项到底是 a₁qⁿ 还是 a₁qⁿ⁻¹？」</p>
<p class="a">是 <b>a₁qⁿ⁻¹</b>。a₁ 本身已经是 q 的 0 次方，第 n 项乘了 n−1 次。自检办法：把 n=1 代进去，必须恰好得到 a₁。例如 a₁=1、q=2 时 a₆=2⁵=32，不是 2⁶=64。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="指数n减1的对照">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="38" font-size="9.6" text-anchor="middle" fill="#b8402f">✗ a₆=a₁q⁶=64</text>
<text x="120" y="62" font-size="9.6" text-anchor="middle" fill="#2f8a5b">✓ a₆=a₁q⁵=32</text>
<line x1="36" y1="78" x2="204" y2="78" stroke="#dde4ea"/>
<text x="120" y="96" font-size="9.2" text-anchor="middle" fill="#5a6472">指数 = 项数 − 1</text>
<text x="120" y="114" font-size="9" text-anchor="middle" fill="#8a94a3">n=1 代入应得 a₁</text>
</svg>
</div>
<div class="qac">
<p class="q">「公比怎么算？到底谁除谁？」</p>
<p class="a">用<b>后项除以前项</b>：q=aₙ₊₁/aₙ（n≥1），方向反了就得到 1/q。验证时至少算两组，确认比值相等才叫等比；只算 a₂/a₁ 就下结论是常见错法。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="公比用后项除以前项">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="38" font-size="9.8" text-anchor="middle" fill="#2f8a5b">q = a₂ / a₁ = a₃ / a₂</text>
<text x="120" y="62" font-size="9.4" text-anchor="middle" fill="#5a6472">后项 ÷ 前项</text>
<text x="120" y="88" font-size="9.2" text-anchor="middle" fill="#b8402f">✗ a₁ / a₂ 得 1/q</text>
<text x="120" y="110" font-size="9" text-anchor="middle" fill="#8a94a3">至少验两组比值相等</text>
</svg>
</div>
<div class="qac">
<p class="q">「等比中项只有一个吗？」</p>
<p class="a">一般是<b>两个，互为相反数 ±√(ab)</b>，因为 b²=ac 只约束 b 的平方。若 a、b 异号则没有实数等比中项；若题目限定在正数范围内，才写正的那个。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="等比中项有两个">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="36" font-size="9.6" text-anchor="middle" fill="#5a6472">a, b, c 等比 ⇒ b²=ac</text>
<text x="120" y="62" font-size="9.8" text-anchor="middle" fill="#2f8a5b">b = ±√(ac)</text>
<text x="120" y="88" font-size="9.2" text-anchor="middle" fill="#b8402f">✗ 只写 b=√(ac)</text>
<text x="120" y="110" font-size="9" text-anchor="middle" fill="#8a94a3">异号时无实数中项</text>
</svg>
</div>
<div class="qac">
<p class="q">「等比数列一定单调吗？q&lt;0 就不存在？」</p>
<p class="a">都不对。q&lt;0 完全合法，此时各项<b>正负交替</b>，既不是递增也不是递减；q=1 是常数列；只有 q&gt;0 且 a₁&gt;0 时才有「q&gt;1 递增、0&lt;q&lt;1 递减」的结论。所以单调性必须带着 q 的符号讨论。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="负公比时正负交替">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="28" y1="70" x2="214" y2="70" stroke="#94a3b8"/>
<circle cx="52" cy="46" r="3.4" fill="#2f8a5b"/><circle cx="88" cy="94" r="3.4" fill="#b8402f"/>
<circle cx="124" cy="46" r="3.4" fill="#2f8a5b"/><circle cx="160" cy="94" r="3.4" fill="#b8402f"/>
<circle cx="196" cy="46" r="3.4" fill="#2f8a5b"/>
<text x="120" y="118" font-size="9" text-anchor="middle" fill="#8a94a3">q&lt;0：正负交替，非单调</text>
</svg>
</div>
</div>
<p class="gx-note">六问其实是同一件事：把「q≠0、首项≠0、指数 n−1、q=1 分情况」这四个字面上的前提，逐条落到笔下。定义背得再熟，答题时漏写一句「当 q=1 时」，那一问就是零分。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 已知 q=1，S₆=a₁(1−q⁶)/(1−q)=(1−1)/(1−1)</p>

<p class="er-w">错在哪：分母 1−q=0，公式失效仍然套用，等于除以 0，过程分直接扣光。</p>

<div class="er">
<p class="er-x">✗ a₆=a₁q⁶=1×2⁶=64</p>

<p class="er-w">错在哪：指数是 n−1 不是 n，a₁ 本身已占掉 q 的 0 次方，整体错位一项。</p>
</div>
<div class="er">
<p class="er-x">✗ q=a₁/a₂，所以 q=1/2</p>
<p class="er-v">✓ q=a₂/a₁，公比等于后项除以前项</p>
<p class="er-w">错在哪：方向反了，算出来是 1/q；用这个 q 求通项会得到整条倒过来的数列。</p>
</div>
<div class="er">
<p class="er-x">✗ 2 与 8 的等比中项是 4</p>
<p class="er-v">✓ 2 与 8 的等比中项是 ±4，因为 b²=16</p>
<p class="er-w">错在哪：只取了正根，漏掉 −4；只有题目限定正数范围时才写 4。</p>
</div>
<div class="er">
<p class="er-x">✗ 公比 q 必须大于 0，q&lt;0 时不是等比数列</p>

<p class="er-w">错在哪：把「q≠0」记成了「q&gt;0」，凭空多出一个条件，负公比的题就无从下手。</p>
</div>
<div class="er">
<p class="er-x">✗ 数列 0,0,0,… 每项比都是 0，所以是等比数列，q=0</p>
<p class="er-v">✓ 等比数列要求 q≠0 且首项 a₁≠0，全零数列不是等比数列</p>
<p class="er-w">错在哪：只验了「比值相等」，漏掉 q≠0 与首项≠0 这两个硬前提。</p>
</div>
<div class="er">
<p class="er-x">✗ 求 Sₙ 时直接写 Sₙ=a₁(1−qⁿ)/(1−q)，不说明 q 的情况</p>
<p class="er-v">✓ 先讨论：当 q=1 时 Sₙ=na₁；当 q≠1 时 Sₙ=a₁(1−qⁿ)/(1−q)</p>
<p class="er-w">错在哪：题目里 q 若是含字母的式子，q=1 完全可能成立，不分类就是漏解。</p>

  /* 两套坐标：宽屏 880×470，窄屏独立 360×700 */
  var W = { vb: "0 0 880 470", left: { x: 16, y: 16, w: 424, h: 438 }, right: { x: 456, y: 16, w: 408, h: 438 } };
  var N = { vb: "0 0 360 700", left: { x: 8, y: 8, w: 344, h: 300 }, right: { x: 8, y: 320, w: 344, h: 372 } };
  var L = W, A = 0.5, G = null;

  function num(x) {
    if (!isFinite(x)) return "—";
    if (Math.abs(x - Math.round(x)) < 1e-9) return String(Math.round(x));
    if (Math.abs(x) >= 10) return x.toFixed(1);
    return String(Math.round(x * 1000) / 1000);
  }

  /* 纯函数：公比 q → 第 6 项、前 6 项和、能否用求和公式。render() 和 __model.cases 都用它 */
  function calc(q) {
    var a1 = 1, eq1 = Math.abs(q - 1) < 1e-9;
    var a6 = Math.pow(q, 5);
    var s6 = eq1 ? 6 * a1 : a1 * (1 - Math.pow(q, 6)) / (1 - q);
    var terms = [], i;
    for (i = 0; i < 6; i++) terms.push(a1 * Math.pow(q, i));
    return { q: q, a1: a1, a6: a6, s6: s6, ok: eq1 ? 0 : 1, terms: terms };
  }

  function geom() {
    var wide = L === W;
    return {
      wide: wide,
      plot: wide
        ? { x: L.left.x + 56, y: L.left.y + 52, w: L.left.w - 84, h: L.left.h - 118 }
        : { x: L.left.x + 50, y: L.left.y + 46, w: L.left.w - 72, h: L.left.h - 98 },
      rc: { x: L.right.x + (wide ? 22 : 16), y0: L.right.y + 32, w: L.right.w - (wide ? 44 : 32) }
    };
  }

  /* 中文按字数换行，避免长句冲出面板 */
  function wrap(parent, x, y, s, maxW, fs, col, lh) {
    var per = Math.max(6, Math.floor(maxW / fs)), lines = [], cur = "";
    for (var i = 0; i < s.length; i++) { cur += s.charAt(i); if (cur.length >= per) { lines.push(cur); cur = ""; } }
    if (cur) lines.push(cur);
    for (var k = 0; k < lines.length; k++) tx(parent, x, y + k * lh, lines[k], col, "start", fs, 400);
  }

  function draw() {
    var s = calc(A), i;
    var gA = $("gxA"), gB = $("gxB");
    gA.textContent = ""; gB.textContent = "";
    el("rect", { x: L.left.x, y: L.left.y, width: L.left.w, height: L.left.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    el("rect", { x: L.right.x, y: L.right.y, width: L.right.w, height: L.right.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    tx(gA, L.left.x + 20, L.left.y + 30, "点列 aₙ：n=1…6，首项 a₁=1", "#5a6472", "start", 10.5, 700);
    tx(gB, L.right.x + 20, L.right.y + 30, "S₆ 的构成与公式状态", "#5a6472", "start", 10.5, 700);

    var P = G.plot, yMax = Math.max(s.a6, 1) * 1.1;
    function Y(v) { return P.y + P.h - (v / yMax) * P.h; }

    el("line", { x1: P.x, y1: P.y, x2: P.x, y2: P.y + P.h, stroke: "#94a3b8", "stroke-width": 1.2 }, gA);
    el("polygon", { points: P.x + "," + (P.y - 9) + " " + (P.x - 4) + "," + (P.y + 1) + " " + (P.x + 4) + "," + (P.y + 1), fill: "#94a3b8" }, gA);
    el("line", { x1: P.x, y1: P.y + P.h, x2: P.x + P.w, y2: P.y + P.h, stroke: "#94a3b8", "stroke-width": 1.2 }, gA);
    el("polygon", { points: (P.x + P.w + 9) + "," + (P.y + P.h) + " " + (P.x + P.w) + "," + (P.y + P.h - 4) + " " + (P.x + P.w) + "," + (P.y + P.h + 4), fill: "#94a3b8" }, gA);
    tx(gA, P.x - 6, P.y - 12, "aₙ", "#5a6472", "start", 9.4, 400);

    var ticks = [0, yMax / 2, yMax];
    for (i = 0; i < 3; i++) {
      var ty = Y(ticks[i]);
      el("line", { x1: P.x - 4, y1: ty, x2: P.x, y2: ty, stroke: "#c3cdd8" }, gA);
      tx(gA, P.x - 8, ty + 3, num(ticks[i]), "#8a94a3", "end", 8.4, 400);
    }

    var xs = [];
    for (i = 0; i < 6; i++) {
      var xN = P.x + 16 + i * (P.w - 32) / 5;
      xs.push(xN);
      el("line", { x1: xN, y1: P.y + P.h, x2: xN, y2: P.y + P.h + 4, stroke: "#c3cdd8" }, gA);
      tx(gA, xN, P.y + P.h + 15, String(i + 1), "#8a94a3", "middle", 8.4, 400);
    }
    tx(gA, P.x + P.w, P.y + P.h + 30, "n", "#5a6472", "end", 9.4, 400);

    el("line", { x1: P.x, y1: Y(1), x2: P.x + P.w, y2: Y(1), stroke: "#8a94a3", "stroke-width": 1, "stroke-dasharray": "4 4" }, gA);
    tx(gA, P.x + P.w - 2, Y(1) - 6, "a₁=1", "#8a94a3", "end", 8.8, 400);

    var pts = [];
    for (i = 0; i < 6; i++) pts.push(xs[i] + "," + Y(s.terms[i]).toFixed(1));
    el("polyline", { points: pts.join(" "), fill: "none", stroke: "#2563eb", "stroke-width": 2 }, gA);
    for (i = 0; i < 6; i++) el("circle", { cx: xs[i], cy: Y(s.terms[i]), r: 3.2, fill: "#2563eb" }, gA);

    tx(gA, xs[5], Y(s.terms[5]) - 10, "a₆=" + num(s.a6), "#b8402f", "middle", 9, 700);

    /* 右半：6 项拼成 S₆ 的堆叠条 + 公式状态 */
    var R = G.rc, sx = R.x, sy = R.y0 + 30, sw = R.w, sh = 26, acc = 0;
    var cols = ["#dbeafe", "#bfdbfe", "#93c5fd", "#60a5fa", "#3b82f6", "#2563eb"];
    var total = Math.max(s.s6, 1e-9);
    for (i = 0; i < 6; i++) {
      var wSeg = sw * s.terms[i] / total;
      el("rect", { x: sx + acc, y: sy, width: Math.max(wSeg, 0.6), height: sh, fill: cols[i], stroke: "#ffffff", "stroke-width": 0.8 }, gB);
      acc += wSeg;
    }
    tx(gB, R.x, sy + sh + 16, "S₆ = a₁+a₂+…+a₆ = " + num(s.s6), "#151a21", "start", 10, 700);

    var fy = sy + sh + 34;
    if (s.ok) {
      el("rect", { x: R.x - 4, y: fy, width: R.w + 8, height: 46, rx: 6, fill: "#eef6f1", stroke: "#b8e6d0" }, gB);
      tx(gB, R.x, fy + 18, "q≠1：S₆=(1−q⁶)/(1−q)", "#2f6b4c", "start", 9.6, 700);
      tx(gB, R.x, fy + 34, "分母 1−q≠0，公式可以用", "#2f6b4c", "start", 9.2, 400);
    } else {
      el("rect", { x: R.x - 4, y: fy, width: R.w + 8, height: 46, rx: 6, fill: "#fbeae7", stroke: "#e0b3ab" }, gB);
      tx(gB, R.x, fy + 18, "q=1：1−q=0 ⇒ 公式失效", "#b8402f", "start", 9.6, 700);
      tx(gB, R.x, fy + 34, "常数列：S₆=6a₁=6", "#b8402f", "start", 9.2, 400);
    }
    var msg = s.ok
      ? (A > 1 ? "q>1：点列越往后越陡，第 6 项已明显大于首项。" : "0<q<1：点列逐项衰减，贴着 x 轴趋近 0。")
      : "q=1：每项都等于 a₁，点列是水平直线；求和必须改用 S₆=6a₁。";
    wrap(gB, R.x, fy + 66, msg, R.w, 9.4, "#3a3a35", 15);
  }

  function render() {
    if (!G) { L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N; G = geom(); stage.setAttribute("viewBox", L.vb); }
    var s = calc(A), st, col, bg, sn;
    $("gxVa").textContent = A.toFixed(1);
    $("gxVb").textContent = num(s.a6);
    $("gxVc").textContent = num(s.s6);
    if (s.ok === 0) { st = "不能用"; col = "#b8402f"; bg = "#fbeae7"; sn = "q=1 常数列，S₆=6a₁"; }
    else if (A > 1) { st = "能用"; col = "#2f8a5b"; bg = "#e6f6ee"; sn = "q>1，递增"; }
    else { st = "能用"; col = "#2f8a5b"; bg = "#e6f6ee"; sn = "0<q<1，递减"; }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    draw();
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    G = geom();
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 0.5 }, { t: 1.2, v: 0.5 }, { t: 4, v: 1 }, { t: 6.5, v: 1 }, { t: 9, v: 2 }, { t: 11.5, v: 1.5 }, { t: 13.5, v: 0.5 }],
    keys: [0.5, 1, 1.5, 2],
    value: A, min: 0.5, max: 2, step: 0.1,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc, cases: [
    { v: 1, eq: { a6: 1, s6: 6, ok: 0 } },
    { v: 2, eq: { a6: 32, s6: 63 } },
    { v: 0.5, eq: { a6: 0.03125, s6: 1.96875 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
</body>
</html>
