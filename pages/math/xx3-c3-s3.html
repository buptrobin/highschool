<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 2×2 列联表<span class="q-src">人教A版选择性必修第三册 · 第八章第三节</span></p>
<p class="q-b">设 A、B 为两个分类变量，从样本中得到分类数据，按两个变量的取值交叉排列所成的表格，叫做 2×2 列联表；表中 a、b、c、d 是四个交叉计数，n = a+b+c+d 是样本容量。</p>
<p class="q-n">→ 翻成人话：把 100 个人先按「哪一组」分行、再按「有效 / 无效」分列，四个格子里填人数，最后补上<b>行合计、列合计</b>。这张表有三个条件：① 行是分组、列是结果；② 四格互不重叠；③ 右下角必须是<b>总人数 n</b>。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · χ² 统计量<span class="q-src">人教A版选择性必修第三册 · 第八章第三节</span></p>
<p class="q-b"><span class="gx-fml">χ² = n(ad − bc)² / [(a+b)(c+d)(a+c)(b+d)]</span>，其中 n = a + b + c + d 为样本容量。</p>
<p class="q-n">→ 翻成人话：先<b>对角相乘再相减</b>（ad − bc），把差<b>平方</b>，乘上<b>总人数 n</b>，再除以四个合计的乘积。三个条件缺一不可：① n 是总人数；② 分子整体平方；③ 分母四个合计一个都不能少。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 判断规则<span class="q-src">人教A版选择性必修第三册 · 第八章第三节</span></p>
<p class="q-b">若 χ² ≥ 3.841，则有 95% 的把握认为变量 A 与 B 有关联；若 χ² ≥ 6.635，则有 99% 的把握认为变量 A 与 B 有关联；否则不能作出这样的判断。</p>
<p class="q-n">→ 翻成人话：两条线、三种写法。「否则」那一句是<b>不能作出「有关联」的判断</b>，不是「两个变量没有关系」——差一个字的措辞，整道题的结论分就没了。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>条件</th><th>正确做法</th><th>写错会怎样</th></tr></thead>
<tbody>
<tr><td>四个格子的含义</td><td>a=甲有效、b=甲无效、c=乙有效、d=乙无效</td><td>含义说反，解释全反；但 ad−bc 只变号，平方后 χ² 不变</td></tr>
<tr><td>分子要平方</td><td>先算 ad−bc，再把差平方</td><td>忘记平方，χ² 被压小，该判显著时判不出来</td></tr>
<tr><td>分母四个合计</td><td>(a+b)(c+d)(a+c)(b+d) 一个都不能少</td><td>少乘一个，χ² 被放大几倍，凭空「显著」</td></tr>
<tr class="key"><td>n 是谁</td><td>n = a+b+c+d，是<b>总人数</b></td><td>用成一组人数（如 100），χ² 只剩正确值的一半</td></tr>
<tr><td>与临界值比较</td><td>和 3.841 比得 95%，和 6.635 比得 99%</td><td>两个临界值记反，把握程度说错</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">背法：<b>对角相减 → 平方 → 乘总人数 → 除四个合计</b>。整张表最该盯住的是高亮那一行：公式里的 n 是总人数，不是甲组或乙组的人数，这一处代错，后面全错。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 独立性检验的完整书写<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">某机构调查一种训练方法是否有效：甲组 100 人中有 75 人有效、25 人无效；乙组 100 人中有 60 人有效、40 人无效。问：能否据此认为「有效率」与「分组」有关联？请写出完整过程与结论。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题：确认是两个分类变量</p>
<p class="s-b">变量一是分组（甲 / 乙），变量二是结果（有效 / 无效），都是分类变量，用 2×2 列联表与独立性检验，χ² 的临界值查 3.841 与 6.635。</p>
<p class="s-k">用到：独立性检验的适用对象——两个分类变量是否有关联。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 列表：把四个数放对格子</p>
<p class="s-b">甲组有效 a=75、甲组无效 b=25、乙组有效 c=60、乙组无效 d=40。行合计 100、100，列合计 a+c=135、b+d=65，总人数 n=200。</p>
<p class="s-k">用到：2×2 列联表的行列约定，n=a+b+c+d 是<b>总人数</b>。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 代入：先算 ad−bc 再平方</p>
<p class="s-b">ad−bc = 75×40 − 25×60 = 3000 − 1500 = 1500，平方得 2250000。分母 = 100×100×135×65 = 87750000，分子 = 200×2250000 = 450000000。</p>
<p class="s-k">用到：χ² = n(ad−bc)²/[(a+b)(c+d)(a+c)(b+d)]，n 取 200。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 算值：χ²≈5.128</p>
<p class="s-b">χ² = 450000000 ÷ 87750000 ≈ 5.128。注意这里是 5.128，不是 51.28，也不是 2.56——分母四个合计少乘一个，结果就会差好几倍。</p>
<p class="s-k">用到：分步约分，最后保留三到四位小数即可。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 比较临界值并写结论</p>
<p class="s-b">5.128 &gt; 3.841 但 5.128 &lt; 6.635，落在 95% 这一档。结论写「有 95% 的把握认为有效率与分组有关联」，不能写「有效率与分组一定有关」。</p>
<p class="s-k">用到：3.841 ↔ 95%、6.635 ↔ 99%；不到 3.841 只能写「没有充分证据」。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">① 列出 2×2 列联表：a=75，b=25，c=60，d=40，n=a+b+c+d=200。<br>
② 计算 ad−bc = 75×40 − 25×60 = 1500，(ad−bc)² = 2250000。<br>
③ 代入公式：χ² = 200×2250000 / (100×100×135×65) = 450000000 / 87750000 ≈ 5.128。<br>
④ 因为 5.128 &gt; 3.841，所以有 95% 的把握认为「有效率」与「分组」有关联。<br>
⑤ 说明：这里的 95% 是判断的把握程度，不等于两个变量一定有关；若要说得更强，必须 χ² ≥ 6.635。</p>
</div>
</div>

<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">

<div class="qac">
<p class="q">算出 χ²=5.128，结论能不能写「两个变量一定有关」？</p>
<p class="a">不能。χ² ≥ 3.841 只说明在「两个变量无关联」的前提下，出现当前数据的概率不超过 5%，所以写「<b>有 95% 的把握认为有关联</b>」。结论是概率式的判断，不是确定关系。</p>

<p class="q">χ² 算出来只有 1.2，能说「两个变量无关」吗？</p>
<p class="a">不能。χ² 小只说明<b>没有充分证据</b>说明有关联，可能是真的无关，也可能只是样本量不够。标准写法是「不能据此认为两个变量有关联」，反过来说「无关」就越界了。</p>

<p class="q">公式 χ² = n(ad−bc)²/[(a+b)(c+d)(a+c)(b+d)] 里的 n 是甲组人数吗？</p>
<p class="a">不是。n 是<b>总人数</b> a+b+c+d。例题里甲组 100、乙组 100，n 要取 200；误用 100 会让 χ² 只剩一半（2.56），刚好从显著掉回不显著。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 因为 χ²=5.128&gt;3.841，所以两个变量有关。</p>
<p class="er-v">✓ 因为 χ²=5.128&gt;3.841，所以有 95% 的把握认为两个变量有关联。</p>
<p class="er-w">错在哪：漏掉「95% 的把握」，把概率判断写成了确定关系。</p>
</div>
<div class="er">
<p class="er-x">✗ χ²=1.2&lt;3.841，所以两个变量没有关系。</p>
<p class="er-v">✓ χ²=1.2&lt;3.841，所以没有充分证据说明两个变量有关联。</p>
<p class="er-w">错在哪：χ² 小只能说证据不足，不能说无关——这两句话方向相反。</p>
</div>
<div class="er">
<p class="er-x">✗ χ² = 100×(ad−bc)²/[(a+b)(c+d)(a+c)(b+d)]，n 用甲组的 100。</p>
<p class="er-v">✓ χ² = 200×(ad−bc)²/[(a+b)(c+d)(a+c)(b+d)]，n=a+b+c+d 是总人数。</p>
<p class="er-w">错在哪：公式里的 n 是总人数 200，用成一组人数会让 χ² 直接减半。</p>
</div>
<div class="er">
<p class="er-x">✗ χ² = n(ad−bc)/[(a+b)(c+d)(a+c)(b+d)]，差算完就除。</p>
<p class="er-v">✓ χ² = n(ad−bc)²/[(a+b)(c+d)(a+c)(b+d)]，差要先平方。</p>
<p class="er-w">错在哪：忘记平方，负差还会算出负的 χ²，与「χ² 非负」直接矛盾。</p>
