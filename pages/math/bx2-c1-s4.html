<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 余弦定理<span class="q-src">人教A版必修第二册 · 第六章 6.4 平面向量的应用</span></p>
<p class="q-b">三角形中任何一边的平方，等于其他两边平方的和减去这两边与它们夹角的余弦的积的两倍，即 a² = b² + c² − 2bc·cosA。</p>
<p class="q-n">→ 翻成人话，这句话由<b>三个条件</b>组成：① 三个量必须取自<b>同一个三角形</b>；② 那个角必须是<b>这两条边的夹角</b>（也就是这条边所对的角）；③ 中间是<b>减</b>号，不是加号。少掉条件②，代进去的就是补角，答案必错；把减号写成加号，钝角三角形的第三边会被算小。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 正弦定理<span class="q-src">人教A版必修第二册 · 第六章 6.4 平面向量的应用</span></p>
<p class="q-b">在一个三角形中，各边和它所对角的正弦的比相等，即 a/sinA = b/sinB = c/sinC。</p>
<p class="q-n">→ 翻成人话，这句话由<b>两个条件</b>组成：① 边与角必须是<b>相对</b>的一对（a 对 A，不能 a 对 B）；② 等式成立的前提是三角形<b>确实存在</b>。它只能定「比」，不能定「角」——因为 sinB = sin(180° − B)，同一个正弦值往往对应两个角，所以已知两边和其中一边的对角时，必须讨论一解、两解。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 用向量方法解决平面几何问题<span class="q-src">人教A版必修第二册 · 第六章 6.4 平面向量的应用</span></p>
<p class="q-b">用向量方法解决平面几何问题：把长度、角度转化为向量的模与数量积。</p>
<p class="q-n">→ 翻成人话，这句话由<b>三个动作</b>组成：① 选一组<b>基底</b>，把图中每条边写成向量；② 要用到的几何关系翻译成<b>向量的运算</b>——长度用模、角度用数量积、平行用共线定理 b = λa、垂直用 a·b = 0；③ 算完再翻译回几何结论。缺了动作③，答案停在算式上，拿不到几何分。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>已知条件</th><th>该用哪个定理</th><th>漏掉哪一步会出错</th></tr></thead>
<tbody>
<tr><td>两角 + 任一边</td><td>正弦定理</td><td>第三个角由内角和补出，结果必唯一，漏了它就没法配边</td></tr>
<tr><td>三边</td><td>余弦定理（求角）</td><td>不先验「两边之和大于第三边」，会解出根本不存在的三角形</td></tr>
<tr><td>两边 + 夹角</td><td>余弦定理（求第三边）</td><td>把夹角取成补角，R 与 c 全部算错</td></tr>
<tr class="key"><td>两边 + 其中一边的对角</td><td>正弦定理 + 讨论</td><td>sinB 相同可能对应 B 与 180° − B，不讨论就丢解或多解</td></tr>
<tr><td>三个角</td><td>两个定理都不够</td><td>形状确定、大小不定，没有唯一解，必须再给一条边</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只高亮 1 行：真正的分水岭是「给的角是不是两边的夹角」。是夹角就走余弦定理（一次到位、不用讨论）；是某边的对角就走正弦定理（先算 sin 值、再讨论解的个数）。</p>
</section>

<section class="gx-sec" id="b">
<h2><span class="sn">02</span>拆开看</h2>
<p class="gx-h2s">四张图：各讲一件事，按「是什么 → 怎么变 → 怎么用」排。</p>

<figure class="gx-fig">
<div class="fig-cap">
<span class="fig-no">图 1</span><span class="fig-t">余弦定理的向量证明：c² = (a − b)²</span>
<span class="bdg bdg-must">必考</span>
</div>
<p class="fig-s">把三角形三条边看成向量，则 <b>AB = CB − CA</b>，第三边 c 就是两个向量的<b>差</b>。差的平方展开出来必带交叉项 −2CB·CA，交叉项再换成模与余弦，就得到 a² = b² + c² − 2bc·cosA。注意图中角弧画在 C 处，标的就是夹角 ∠C 本身。</p>

<text x="466" y="164" font-size="10.5" fill="#b8402f">减号来自「差的平方」展开的交叉项</text>

<p class="gx-note">图中红箭头是 AB，蓝箭头是 CA 和 CB——注意 AB 的起点在 A、终点在 B，方向别画反，画反了减号就变成加号。</p>
</figure>

<figure class="gx-fig">

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 力的合成与余弦定理<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">两个力 F₁ = 3 N、F₂ = 4 N 同时作用在一个物体上，它们的夹角为 60°。（1）求合力 R 的大小；（2）夹角为多大时，合力恰好为 5 N？<br>陷阱：夹角 θ 是<b>两个力的夹角</b>，公式里是 2F₁F₂·cosθ 加号；若题目改成「求两力之差的大小」，才换成减号。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题与转化</p>
<p class="s-b">力的合成＝向量加法：合力就是以 F₁、F₂ 为邻边的平行四边形的对角线，R = |F₁ + F₂|。已知两边（3 N、4 N）和它们的夹角（60°），是标准的「两边一夹角」型，直接走余弦定理，不需要讨论。</p>
<p class="s-k">用到：向量加法的平行四边形法则；余弦定理的适用条件。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 写出公式</p>
<p class="s-b">R² = |F₁ + F₂|² = |F₁|² + |F₂|² + 2F₁F₂·cosθ。代入 F₁ = 3、F₂ = 4，得 R² = 9 + 16 + 24cosθ = 25 + 24cosθ。这一步先把公式写死，后面两次代入都只用它。</p>
<p class="s-k">用到：数量积展开式 |a + b|² = |a|² + |b|² + 2a·b。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 代 θ = 60° 求 R</p>
<p class="s-b">cos60° = 0.5，所以 R² = 25 + 24 × 0.5 = 25 + 12 = 37，R = √37 ≈ 6.08 N。R 大于 4，说明锐角时合力比两个分力都大——但这不是普遍规律。</p>
<p class="s-k">用到：特殊角的余弦值；开方取正根（长度非负）。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 反解夹角</p>
<p class="s-b">令 R = 5，则 25 = 25 + 24cosθ，即 24cosθ = 0，cosθ = 0，θ = 90°。因为 θ ∈ [0°, 180°]，cos 在这个区间上单调递减，所以解唯一，不用讨论。</p>
<p class="s-k">用到：余弦定理的逆用；θ 的取值范围决定解的个数。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 检验与作答</p>
<p class="s-b">θ = 90° 时两个力互相垂直，R = √(9 + 16) = 5，正是 3-4-5 直角三角形，与勾股定理一致。回看两问：R 是长度，必须带单位 N；θ 是角度，必须写「90°」而不是「π/2」以外的近似值。</p>
<p class="s-k">用到：勾股定理作为特例校验；答题单位与有效数字。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）合力的大小 R 满足 R² = F₁² + F₂² + 2F₁F₂·cosθ（余弦定理），代入 F₁ = 3、F₂ = 4、θ = 60°：R² = 9 + 16 + 2 × 3 × 4 × cos60° = 9 + 16 + 12 = 37，故 R = √37 ≈ 6.08 N。<br>（2）由 R = 5 得 25 = 9 + 16 + 24cosθ，即 24cosθ = 0，cosθ = 0，又 θ ∈ [0°, 180°]，所以 θ = 90°。<br>答：合力约为 6.08 N；当夹角为 90° 时合力为 5 N。</p>
</div>
</div>
</section>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">余弦定理里为什么是减号，不是加号？</p>
<p class="a">因为 <span class="gx-fml">c² = |a − b|²</span>，是<b>两个向量之差的平方</b>。差的平方展开出交叉项 <span class="gx-fml">−2ab·cosC</span>，减号就来自这里。换成和 |a + b|²，才是加号（那是对角线，不是第三边）。夹角 C 为钝角时 cosC &lt; 0，减一个负数，c² 变大——正好对应<b>钝角对最长边</b>。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="钝角三角形：钝角处余弦为负，第三边变长">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<polygon points="34,104 196,104 108,44" fill="#eff5ff" stroke="#2563eb" stroke-width="1.6"/>
<path d="M 90.9 57.9 A 22 22 0 0 0 126.2 56.4" fill="none" stroke="#b8791f" stroke-width="1.4"/>
<text x="120" y="120" font-size="9" fill="#b8402f" text-anchor="middle">钝角 ⇒ cosC &lt; 0 ⇒ c² 更大</text>
</svg>
</div>

<div class="qac">
<p class="q">正弦定理为什么可能给出两个解？</p>
<p class="a">它给的是 <span class="gx-fml">sinB = b·sinA ÷ a</span>，而 sin 在 (0°, 180°) 上不是单调的：<b>sinB 与 sin(180° − B) 相等</b>。所以同一个 sin 值对应两个候选角，两个都要代回「内角和 &lt; 180°」验一遍。判据是先算高 <span class="gx-fml">h = b·sinA</span>：<b>b·sinA &lt; a &lt; b</b> 才有两解。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="同一底边上两个三角形共用一边与一个对角，即两解">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="30" y1="104" x2="190" y2="104" stroke="#c9d5df" stroke-width="1.4"/>
<line x1="30" y1="104" x2="120" y2="44" stroke="#2563eb" stroke-width="1.6"/>
<line x1="120" y1="44" x2="96" y2="104" stroke="#2563eb" stroke-width="1.4"/>
<line x1="120" y1="44" x2="160" y2="104" stroke="#b8791f" stroke-width="1.4"/>
<text x="96" y="118" font-size="9" fill="#2563eb" text-anchor="middle">B₁</text>
<text x="160" y="118" font-size="9" fill="#b8791f" text-anchor="middle">B₂</text>
<text x="34" y="86" font-size="9" fill="#b8402f">两解</text>
</svg>
</div>

<div class="qac">
<p class="q">合力什么时候最大、什么时候最小？</p>
<p class="a">同向 <b>θ = 0°</b> 时最大，<span class="gx-fml">R = F₁ + F₂ = 7 N</span>；反向 <b>θ = 180°</b> 时最小，<span class="gx-fml">R = |F₁ − F₂| = 1 N</span>。所以 1 ≤ R ≤ 7，<b>合力不一定大于分力</b>：θ = 120° 时 R ≈ 3.61 N &lt; 4 N。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="同向相加得7，反向相减得1">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="30" y1="46" x2="96" y2="46" stroke="#2563eb" stroke-width="2"/>
<polygon points="96,46 87,42 87,50" fill="#2563eb"/>
<line x1="30" y1="64" x2="112" y2="64" stroke="#2f8a5b" stroke-width="2"/>
<polygon points="112,64 103,60 103,68" fill="#2f8a5b"/>
<line x1="30" y1="100" x2="96" y2="100" stroke="#2563eb" stroke-width="2"/>
<line x1="96" y1="100" x2="58" y2="100" stroke="#b8402f" stroke-width="2"/>
<polygon points="58,100 67,96 67,104" fill="#b8402f"/>
<text x="122" y="54" font-size="9" fill="#2f8a5b">同向 R = 7</text>
<text x="122" y="106" font-size="9" fill="#b8402f">反向 R = 1</text>
</svg>
</div>

<div class="qac">
<p class="q">用向量证明两直线平行，用什么条件？</p>
<p class="a">用<b>共线定理</b>：存在实数 λ 使 <span class="gx-fml">b = λa</span>（a ≠ 0）。它管的是「方向相同或相反 + 长度成比例」。<span class="gx-fml">a·b = 0</span> 是垂直的判据，两者不能互换——这是本节最高频的零分点。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="向量a与b共线且b等于2a">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="34" y1="90" x2="134" y2="90" stroke="#2563eb" stroke-width="2"/>
<polygon points="134,90 125,86 125,94" fill="#2563eb"/>
<line x1="34" y1="108" x2="214" y2="108" stroke="#2f8a5b" stroke-width="2"/>
<polygon points="214,108 205,104 205,112" fill="#2f8a5b"/>
<text x="40" y="78" font-size="9" fill="#2563eb">a</text>
<text x="40" y="126" font-size="9" fill="#2f8a5b">b = 2a ⇒ 两线平行</text>
</svg>
</div>

<div class="qac">
<p class="q">用向量求两条直线的夹角，公式是什么？</p>
<p class="a"><span class="gx-fml">cosθ = (a·b) ÷ (|a|·|b|)</span>，θ ∈ [0°, 180°]。分母是两个模的乘积，<b>不能漏</b>；算完看符号定钝锐：cosθ &gt; 0 为锐角，cosθ &lt; 0 为钝角，cosθ = 0 即垂直。求「直线夹角」时若只要锐角，再取绝对值。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="两向量夹角与数量积公式">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="50" y1="96" x2="170" y2="80" stroke="#2563eb" stroke-width="2"/>
<polygon points="170,80 161.6,85.2 160.5,77.2" fill="#2563eb"/>
<line x1="50" y1="96" x2="120" y2="30" stroke="#2f8a5b" stroke-width="2"/>
<polygon points="120,30 116.2,39.1 110.8,33.3" fill="#2f8a5b"/>
<path d="M 74 92 A 24 24 0 0 0 66 72" fill="none" stroke="#b8791f" stroke-width="1.4"/>
<text x="46" y="124" font-size="9" fill="#3a3a35">cosθ = a·b ÷ (|a|·|b|)</text>
</svg>
</div>

<div class="qac">
<p class="q">「大边对大角」怎么用正弦定理理解？</p>
<p class="a">由 <span class="gx-fml">a ÷ sinA = b ÷ sinB</span> 得 a : b = sinA : sinB，所以<b>边与它的对角的正弦同序</b>：a &gt; b ⇔ sinA &gt; sinB。要小心的是正弦不单调——只有再加上「A、B 同为锐角」或「一个是钝角」的条件，才能由 sinA &gt; sinB 直接推出 A &gt; B。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="三角形中最长的边对着最大的角">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<polygon points="30,104 190,104 96,40" fill="#eff5ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="110" y="120" font-size="9" fill="#3a3a35" text-anchor="middle">a 最大 ⇒ A 最大</text>
</svg>
</div>
</div>
<p class="gx-note">六问其实是同一件事：<b>每个定理都只管一种已知条件的组合</b>。余弦定理吃「夹角 / 三边」，所以中间带减号；正弦定理吃「对角」，所以要看 sin 的互补性；向量法只是把几何关系换成模、数量积和共线定理——选错入口，后面全错。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 余弦定理：a² = b² + c² + 2bc·cosA</p>
<p class="er-v">✓ a² = b² + c² − 2bc·cosA</p>
<p class="er-w">错在哪：这个式子是 |b + c|² 的展开，算的是平行四边形对角线；三角形第三边是两个向量之差，交叉项必须带减号。</p>
</div>
<div class="er">
<p class="er-x">✗ 已知 a、b 和 A，由 sinB = b·sinA ÷ a 直接得唯一解</p>
<p class="er-v">✓ 先算 b·sinA，按 b·sinA &lt; a &lt; b 判一解/两解/无解，再验内角和</p>
<p class="er-w">错在哪：sin 值相同对应 B 与 180° − B 两个角，跳过讨论就是丢解或保留无效解。</p>
</div>
<div class="er">
<p class="er-x">✗ 合力一定比每个分力都大</p>
<p class="er-v">✓ 1 ≤ R ≤ 7；θ = 120° 时 R ≈ 3.61 N，小于 F₂ = 4 N</p>
<p class="er-w">错在哪：把「同向相加」当成了普遍规律。夹角越大合力越小，反向时最小为 |F₁ − F₂|。</p>
</div>
<div class="er">
<p class="er-x">✗ 三边 2、3、6 直接用余弦定理求角</p>

<script>
/* 互动脚本本体（由 build-page.mjs 包进 <script> 里，所以这里不要写 <script> 标签） */
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var GX = window.GX, el = GX.el, tx = GX.tx, $ = GX.$;
  var stage = $("gxStage");
  if (!stage || !window.AutoPilot) return;

  /* 两套坐标：宽屏 880×470，窄屏独立 360×700（不硬缩） */
  var W = {
    vb: "0 0 880 470",
    left: { x: 16, y: 16, w: 424, h: 438, ox: 175, oy: 305, sc: 35, ar: 36, fs: 11, lh: 21 },
    right: { x: 456, y: 16, w: 408, h: 438, x0: 505, x1: 828, y0: 422, y1: 64 }
  };
  var N = {
    vb: "0 0 360 700",
    left: { x: 8, y: 8, w: 344, h: 300, ox: 145, oy: 225, sc: 27, ar: 28, fs: 9.5, lh: 18 },
    right: { x: 8, y: 320, w: 344, h: 372, x0: 56, x1: 340, y0: 660, y1: 376 }
  };
  var L = W, A = 0;

  /* 纯函数：夹角 θ（度）→ 合力 R。render() 与 __model.cases 共用这一个真值 */
  function calc(v) {
    var th = v * Math.PI / 180;
    var R2 = 9 + 16 + 24 * Math.cos(th);          /* 25 + 24cosθ */
    return { R: Math.sqrt(R2), R2: R2, theta: v, cos: Math.cos(th) };
  }

  function nn(v) { return Math.round(v * 10) / 10; }

  function seg(g, x1, y1, x2, y2, col, w, dash, mk) {
    var o = { x1: nn(x1), y1: nn(y1), x2: nn(x2), y2: nn(y2), stroke: col, "stroke-width": w };
    if (dash) o["stroke-dasharray"] = dash;
    if (mk) o["marker-end"] = "url(#" + mk + ")";
    el("line", o, g);
  }

  function marker(defs, id, col) {
    var m = el("marker", {
      id: id, viewBox: "0 0 10 10", refX: 8, refY: 5,
      markerWidth: 6, markerHeight: 6, orient: "auto"
    }, defs);
    el("path", { d: "M0 0 L10 5 L0 10 Z", fill: col }, m);
  }

  function setupDefs() {
    var old = stage.querySelector("defs");
    if (old) old.parentNode.removeChild(old);
    var defs = el("defs", null, stage);
    marker(defs, "gxArwB", "#2563eb");
    marker(defs, "gxArwR", "#b8402f");
    marker(defs, "gxArwG", "#2f8a5b");
  }

  /* ---------------- 左边：平行四边形 ---------------- */
  function drawLeft(g, s) {
    var p = L.left, ox = p.ox, oy = p.oy, sc = p.sc;
    var th = s.theta * Math.PI / 180, cs = Math.cos(th), sn = Math.sin(th);
    var f1 = { x: ox + 3 * sc, y: oy };
    var f2 = { x: ox + 4 * sc * cs, y: oy - 4 * sc * sn };
    var rt = { x: f1.x + (f2.x - ox), y: f1.y + (f2.y - oy) };

    el("rect", { x: p.x, y: p.y, width: p.w, height: p.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, g);

    /* 平行四边形填充 */
    el("path", {
      d: "M " + nn(ox) + " " + nn(oy) + " L " + nn(f1.x) + " " + nn(f1.y) +
         " L " + nn(rt.x) + " " + nn(rt.y) + " L " + nn(f2.x) + " " + nn(f2.y) + " Z",
      fill: "#eff5ff", stroke: "none", opacity: 0.8
    }, g);

    /* 两条虚线补完平行四边形（只覆盖 θ 在 (1°,179°) 时才有意义） */
    if (s.theta > 1 && s.theta < 179) {
      seg(g, f1.x, f1.y, rt.x, rt.y, "#9fb3c8", 1.2, "5 4");
      seg(g, f2.x, f2.y, rt.x, rt.y, "#9fb3c8", 1.2, "5 4");
    }

    /* 三个向量 */
    seg(g, ox, oy, f1.x, f1.y, "#2563eb", 2.4, null, "gxArwB");
    seg(g, ox, oy, f2.x, f2.y, "#2563eb", 2.4, null, "gxArwB");
    seg(g, ox, oy, rt.x, rt.y, "#b8402f", 2.8, null, "gxArwR");

    /* 夹角弧：y 轴朝下 ⇒ 数学上的逆时针 = sweep-flag 0 */
    if (s.theta > 1) {
      var ax = ox + p.ar * cs, ay = oy - p.ar * sn;
      el("path", {
        d: "M " + nn(ox + p.ar) + " " + nn(oy) + " A " + p.ar + " " + p.ar + " 0 0 0 " + nn(ax) + " " + nn(ay),
        fill: "none", stroke: "#b8791f", "stroke-width": 1.6
      }, g);
      var mid = th / 2, lr = p.ar + 15;
      tx(g, ox + lr * Math.cos(mid), oy - lr * Math.sin(mid) - 4,
        "θ = " + Math.round(s.theta) + "°", "#b8791f", "start", p.fs - 0.5, 700, true);
    }

    /* 单位标尺：1 N 有多长，图上量得出来 */
    var sy = p.y + p.h - 26, sx = p.x + 24;
    seg(g, sx, sy, sx + sc, sy, "#5a6472", 2);
    seg(g, sx, sy - 4, sx, sy + 4, "#5a6472", 1.4);
    seg(g, sx + sc, sy - 4, sx + sc, sy + 4, "#5a6472", 1.4);
    tx(g, sx + sc + 6, sy + 3.5, "1 N", "#5a6472", "start", p.fs - 0.5, 400);

    el("circle", { cx: ox, cy: oy, r: 3, fill: "#151a21" }, g);
    tx(g, ox - 9, oy + 15, "O", "#151a21", "end", p.fs + 1, 700);

    /* 左上角的读数块（固定位置，不跟着向量跑，避免出界） */
    var bx = p.x + 18, by = p.y + 30;
    tx(g, bx, by, "F₁ = 3 N，F₂ = 4 N，同起点 O", "#5a6472", "start", p.fs, 400);
    tx(g, bx, by + p.lh, "θ = " + Math.round(s.theta) + "°，R = " + s.R.toFixed(2) + " N",
      s.R > 5.001 ? "#2f8a5b" : (s.R < 4.999 ? "#2563eb" : "#b8791f"), "start", p.fs + 2, 700);
    tx(g, bx, by + p.lh * 2, "R² = 25 + 24cosθ = " + s.R2.toFixed(2), "#3a3a35", "start", p.fs, 400);
  }

  /* ---------------- 右边：R–θ 曲线 ---------------- */
  function drawRight(g, s) {
    var p = L.right;
    var x0 = p.x0, x1 = p.x1, y0 = p.y0, y1 = p.y1;
    function X(t) { return x0 + t / 180 * (x1 - x0); }
    function Y(r) { return y0 - r / 7.6 * (y0 - y1); }

    el("rect", { x: p.x, y: p.y, width: p.w, height: p.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, g);
    tx(g, p.x + 20, p.y + 24, "合力 R 随夹角 θ 的变化", "#5a6472", "start", 10.5, 700);
    tx(g, p.x + p.w - 16, p.y + 24, "R ∈ [1, 7]", "#8a939f", "end", 9.5, 400);

    /* 刻度线：R = 1 / 5 / 7，5 这一条是 3-4-5 的分界 */
    var ticks = [1, 5, 7], i;
    for (i = 0; i < ticks.length; i++) {
      var r = ticks[i], yy = Y(r);
      seg(g, x0, yy, x1, yy, r === 5 ? "#e8c48a" : "#eef2f5", r === 5 ? 1.4 : 1, r === 5 ? "6 4" : null);
      tx(g, x0 - 6, yy + 3.5, String(r), r === 5 ? "#b8791f" : "#8a939f", "end", 9.5, r === 5 ? 700 : 400);
    }

    /* 坐标轴 */
    seg(g, x0, y0, x1, y0, "#9fb3c8", 1.3, null, "gxArwG");
    seg(g, x0, y0, x0, y1, "#9fb3c8", 1.3, null, "gxArwG");
    tx(g, X(0), y0 + 15, "0°", "#8a939f", "middle", 9.5, 400);
    tx(g, X(90), y0 + 15, "90°", "#8a939f", "middle", 9.5, 400);
    tx(g, X(180), y0 + 15, "180°", "#8a939f", "middle", 9.5, 400);
    tx(g, x1 - 2, y0 - 8, "θ", "#8a939f", "end", 9.5, 400);

    /* 曲线：R = √(25 + 24cosθ) */
    var pts = [], t, d = "M", R;
    for (t = 0; t <= 180.001; t += 3) {
      R = Math.sqrt(25 + 24 * Math.cos(t * Math.PI / 180));
      pts.push([X(t), Y(R)]);
      d += (pts.length === 1 ? " " : " L ") + nn(X(t)) + " " + nn(Y(R));
    }
    el("path", { d: d, fill: "none", stroke: "#2563eb", "stroke-width": 2.2, "stroke-linejoin": "round" }, g);

    /* 当前点 */
    var cx = X(s.theta), cy = Y(s.R);
    seg(g, cx, cy, cx, y0, "#c7dbfa", 1.1, "4 3");
    el("circle", { cx: nn(cx), cy: nn(cy), r: 4.2, fill: "#b8402f" }, g);
    el("circle", { cx: nn(cx), cy: nn(cy), r: 7.2, fill: "none", stroke: "#b8402f", "stroke-width": 1, opacity: 0.35 }, g);

    var lx = Math.min(cx + 9, x1 - (L === N ? 66 : 74));
    var ly = Math.max(cy - 10, y1 + 14);
    tx(g, lx, ly, "R = " + s.R.toFixed(2), "#b8402f", "start", 9.5, 700, true);
  }

  function draw() {
    var gA = $("gxA"), gB = $("gxB");
    if (!gA || !gB) return;
    gA.textContent = ""; gB.textContent = "";
    var s = calc(A);
    drawLeft(gA, s);
    drawRight(gB, s);
  }

  var lastKey = "";
  function render() {
    var key = A.toFixed(2);
    if (key === lastKey) return;
    lastKey = key;
    var s = calc(A), R = s.R, th = s.theta, st, col, bg, sn;
    if (th < 89.75) { st = "合力大于 5"; col = "#2f8a5b"; bg = "#e6f6ee"; sn = "θ < 90°，R > 5"; }
    else if (th > 90.25) { st = "合力小于 5"; col = "#2563eb"; bg = "#eff5ff"; sn = "θ > 90°，最小到 1 N"; }
    else { st = "合力恰为 5"; col = "#b8791f"; bg = "#fdf3e0"; sn = "θ = 90°，3-4-5 勾股"; }

    $("gxVa").textContent = Math.round(th) + "°";
    $("gxVb").textContent = R.toFixed(2);
    $("gxVc").textContent = s.R2.toFixed(2);
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    draw();
  }

  function layout() {
    var host = stage.parentElement;
    var wide = (host ? host.getBoundingClientRect().width : 880) >= 640;
    L = wide ? W : N;
    stage.setAttribute("viewBox", L.vb);
    lastKey = "";
    setupDefs();
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  /* 停留帧在 90°：t=4→6.5 与 t=9→11.5 各停 2.5 秒，都不动 */
  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [
      { t: 0, v: 0 }, { t: 1.2, v: 0 },
      { t: 4, v: 90 }, { t: 6.5, v: 90 },
      { t: 9, v: 180 }, { t: 11.5, v: 180 },
      { t: 13.5, v: 0 }
    ],
    keys: [0, 60, 90, 180],
    value: A, min: 0, max: 180, step: 5,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc, cases: [
    { v: 0, eq: { R: 7 } },
    { v: 60, eq: { R: 6.083 } },
    { v: 90, eq: { R: 5 } },
    { v: 120, eq: { R: 3.606 } },
    { v: 180, eq: { R: 1 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
