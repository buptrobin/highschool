<p class="gx-claim">一句话说清本节最该记住的判断：<b>形如 a+bi（a，b∈R）的数才是复数</b> + <b>虚部是 b、纯虚数要 a=0 且 b≠0、复数不能比大小</b>。</p>

<span><i></i>人教A版必修第二册 第七章第1节</span>

<span><i></i>含 1 个互动模型</span>
</div>
<p class="gx-lede">第七章从「数不够用」讲起：在实数范围内 x²=−1 没有解，于是规定 i²=−1，把数系扩充到复数。这一节只做三件事——给出复数的定义、把复数分成实数与虚数、把复数放到复平面上看成一个点与一个向量。最容易丢分的地方有三处：虚部是实数 b 而不是 bi；纯虚数必须 a=0 且 b≠0；两个复数只能判断相等或不等，不能比较大小。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 复数的定义<span class="q-src">人教A版必修第二册 · 第七章第1节</span></p>
<p class="q-b">我们把形如 a+bi（a，b∈R）的数叫做复数，其中 i 叫做虚数单位；规定 i²=−1。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个条件</b>组成——① 必须写成 a+bi 这个形式；② a 与 b 都是实数（b∈R 一个字母都不能少）；③ i 是虚数单位，且 i²=−1。少掉 b∈R，a+bi 就只是个含字母的式子，称不上复数；少掉 i²=−1，i 就退化成普通字母，扩数系这件事也就没发生。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 实部与虚部<span class="q-src">人教A版必修第二册 · 第七章第1节</span></p>
<p class="q-b">a 与 b 分别叫做复数 z=a+bi 的实部与虚部。</p>
<p class="q-n">→ 翻成人话：这里只说了<b>两个条件</b>——实部是 a，虚部是 b，两个都是<b>实数</b>。所以 z=1−2i 的虚部是 −2，<b>不是 −2i</b>：虚部这个名字指的是那个实数系数，i 不跟着搬家。把虚部写成 bi 是本节第一号扣分点。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 复数相等<span class="q-src">人教A版必修第二册 · 第七章第1节</span></p>
<p class="q-b">两个复数相等的充要条件是它们的实部与虚部分别相等。</p>
<p class="q-n">→ 翻成人话：<span class="gx-fml">z₁=a+bi，z₂=c+di，z₁=z₂ ⇔ a=c 且 b=d</span>，<b>两个条件同时成立</b>，少一个都不行。这条只解决「相等」，它并没有给复数一套大小顺序——复数不能比较大小，写成 z₁&gt;z₂ 是没有意义的。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>判据</th><th>教材要求</th><th>缺了或写错会怎样</th></tr></thead>
<tbody>
<tr><td>形式</td><td>写成 a+bi，且 a，b∈R</td><td>不写成这个形式，实部、虚部无从谈起</td></tr>
<tr><td>虚部</td><td>虚部是实数 b</td><td>写成 bi 就直接丢分，后面方程也列错</td></tr>
<tr class="key"><td>纯虚数</td><td>a=0 且 b≠0，两个条件同时成立</td><td>只写 a=0 会把 0 算成纯虚数；b=0 时它只是实数 0</td></tr>
<tr><td>相等</td><td>实部与虚部分别相等</td><td>只比模相等就下结论，会把 1+i 与 1−i 判成相等</td></tr>
<tr><td>大小</td><td>没有大小顺序，只能判相等或不等</td><td>写 z₁&gt;z₂ 是无意义的式子（除非两者都是实数）</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">背法：先看 b 决定虚实，再看 a 决定纯不纯；写虚部只写那个实数，不写 i。整张表只有「纯虚数」这一行是判定题真正的分界线——它是本节唯一需要两个条件同时成立的判定。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 由实部虚部反求参数<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">已知复数 z=(m²−1)+(m+1)i，其中 m 为实数。当 m 为何值时，（1）z 是实数？（2）z 是纯虚数？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 先把 a 与 b 标出来</p>
<p class="s-b">按 z=a+bi 对位：a=m²−1，b=m+1。注意虚部是 b=m+1 这个实数，不是 (m+1)i。再写两条判据：z 为实数 ⇔ b=0；z 为纯虚数 ⇔ a=0 且 b≠0。</p>
<p class="s-k">用到：复数 z=a+bi 的实部、虚部定义。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 实数只要虚部为零</p>
<p class="s-b">令 b=m+1=0，得 m=−1。代回验证：a=(−1)²−1=0，此时 z=0+0i=0，0 是实数，符合要求。</p>
<p class="s-k">用到：b=0 时 a+bi 就是实数 a。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 纯虚数先令实部为零</p>
<p class="s-b">令 a=m²−1=0，得 m=1 或 m=−1。这一步只解决了一半的条件，还不能直接下结论。</p>
<p class="s-k">用到：纯虚数的第一个条件 a=0。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 再用 b≠0 取舍</p>
<p class="s-b">把两个候选代进 b：m=1 时 b=2≠0，z=2i，是纯虚数；m=−1 时 b=0，z=0，它是实数而不是纯虚数，舍去。</p>
<p class="s-k">用到：纯虚数的第二个条件 b≠0，两个条件必须同时成立。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 分两问写结论</p>
<p class="s-b">（1）m=−1；（2）m=1。答案要分开写，并且在第（2）问后面写出「因为 m=−1 时 b=0，z=0 不是纯虚数」。</p>
<p class="s-k">用到：分类讨论与取舍的书写规范。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">由 z=(m²−1)+(m+1)i 得 实部 a=m²−1，虚部 b=m+1。<br>
（1）z 为实数 ⇔ b=0，即 m+1=0，所以 <b>m=−1</b>；此时 a=0，z=0 是实数。<br>
（2）z 为纯虚数 ⇔ a=0 且 b≠0。由 a=m²−1=0 得 m=1 或 m=−1；又 b=m+1≠0，即 m≠−1，所以 <b>m=1</b>，此时 z=2i。<br>
易错提醒：虚部是 m+1 这个实数（不是 (m+1)i）；m=−1 时 z=0，0 是实数，不是纯虚数。</p>
</div>
</div>
</section>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">z=1−2i 的虚部到底是 −2 还是 −2i？</p>
<p class="a">是 <b>−2</b>。课本说「a 与 b 分别叫做实部与虚部」，虚部是那个<b>实数 b</b>，i 不算在虚部里。写成 −2i 会连带把后面的方程也列错。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="z 等于 1 减 2i，实部 1，虚部负 2 而不是负 2i">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="32" text-anchor="middle" font-size="9.5" fill="#151a21">z = 1 − 2i</text>
<text x="40" y="62" font-size="9" fill="#2563eb">实部 a = 1</text>
<text x="40" y="86" font-size="9" fill="#2563eb">虚部 b = −2</text>
<text x="40" y="110" font-size="9" fill="#b8402f">✗ 写成 −2i</text>
</svg>
</div>
<div class="qac">
<p class="q">纯虚数和虚数到底差在哪？0 算纯虚数吗？</p>
<p class="a">虚数只要 <b>b≠0</b>；纯虚数要 <b>a=0 且 b≠0</b>，两个条件同时成立。0 的 b=0，所以 0 是<b>实数</b>，不是纯虚数。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="虚数与纯虚数的条件对比，0 是实数">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="20" y="34" font-size="9" fill="#3a3a35">虚数：b ≠ 0</text>
<text x="20" y="58" font-size="9" fill="#b8791f">纯虚数：a = 0 且 b ≠ 0</text>
<text x="20" y="82" font-size="9" fill="#2f8a5b">纯虚数 ⊂ 虚数</text>
<text x="20" y="108" font-size="9" fill="#b8402f">0 的 b = 0 → 实数</text>
</svg>
</div>
<div class="qac">
<p class="q">复数能比较大小吗？1+i 与 1 谁大？</p>
<p class="a"><b>不能</b>。复数没有大小顺序，两个复数之间只有<b>相等与不等</b>两种关系。写 1+i&gt;1 是无意义的式子；只有二者都是实数时，比的才是实数的大小。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="复数不能比较大小，只有相等与不等">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="20" y="42" font-size="9.5" fill="#b8402f">✗ 1 + i &gt; 1 无意义</text>
<text x="20" y="72" font-size="9" fill="#2f8a5b">✓ 只有 z₁ = z₂ 与 z₁ ≠ z₂</text>
<text x="20" y="100" font-size="9" fill="#6b7280">比大小需要「谁在右谁在左」</text>
<text x="20" y="118" font-size="9" fill="#6b7280">复平面是平面，没有左右</text>
</svg>
</div>
<div class="qac">
<p class="q">i² 等于多少？i³ 呢？i⁴ 呢？</p>
<p class="a">i²=<b>−1</b>，i³=i²·i=<b>−i</b>，i⁴=(i²)²=<b>1</b>。四个一循环，指数除以 4 看余数即可。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="i 的幂按 i、负 1、负 i、1 循环">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<rect x="14" y="40" width="50" height="36" rx="6" fill="#fff" stroke="#c7dbfa"/>
<text x="39" y="63" text-anchor="middle" font-size="9" fill="#2563eb">i¹ = i</text>
<rect x="70" y="40" width="50" height="36" rx="6" fill="#fff" stroke="#c7dbfa"/>
<text x="95" y="63" text-anchor="middle" font-size="9" fill="#2563eb">i² = −1</text>
<rect x="126" y="40" width="50" height="36" rx="6" fill="#fff" stroke="#c7dbfa"/>
<text x="151" y="63" text-anchor="middle" font-size="9" fill="#2563eb">i³ = −i</text>
<rect x="182" y="40" width="50" height="36" rx="6" fill="#fff" stroke="#c7dbfa"/>
<text x="207" y="63" text-anchor="middle" font-size="9" fill="#2563eb">i⁴ = 1</text>
<text x="120" y="100" text-anchor="middle" font-size="9" fill="#6b7280">i 的幂以 4 为周期循环</text>
</svg>
</div>
<div class="qac">
<p class="q">两个复数相等，要满足几个条件？</p>
<p class="a">两个条件：<b>实部与虚部分别相等</b>。<span class="gx-fml">z₁=a+bi，z₂=c+di，z₁=z₂ ⇔ a=c 且 b=d</span>。只比模相等不够——1+i 与 1−i 的模都是 √2，但两者不相等。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="复数相等需要实部与虚部分别相等，模相等不够">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="36" text-anchor="middle" font-size="9.5" fill="#151a21">a + bi = c + di</text>
<text x="120" y="64" text-anchor="middle" font-size="9" fill="#2f8a5b">⇔ a = c 且 b = d</text>
<text x="120" y="92" text-anchor="middle" font-size="9" fill="#b8791f">|z₁| = |z₂| 推不出 z₁ = z₂</text>
<text x="120" y="114" text-anchor="middle" font-size="9" fill="#6b7280">1+i 与 1−i 模都是 √2</text>
</svg>
</div>
<div class="qac">
<p class="q">复平面上的点和复数是什么关系？</p>
<p class="a"><b>一一对应</b>：点 Z(a，b) ↔ 复数 a+bi ↔ 向量 OZ。实轴上的点对应实数，虚轴上的点（除原点）对应纯虚数。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="点、复数、向量一一对应，实轴上的点是实数">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="38" text-anchor="middle" font-size="9" fill="#2563eb">点 Z(a，b)</text>
<text x="120" y="58" text-anchor="middle" font-size="9" fill="#6b7280">↕ 一一对应</text>
<text x="120" y="78" text-anchor="middle" font-size="9" fill="#2563eb">复数 a + bi</text>
<text x="120" y="98" text-anchor="middle" font-size="9" fill="#6b7280">↕ 同一个向量</text>
<text x="120" y="118" text-anchor="middle" font-size="9" fill="#2f8a5b">向量 OZ</text>
</svg>
</div>
</div>
<p class="gx-note">六问其实是同一件事：先把 z 拆成「实部 a、虚部 b、类型」三样，再按定义逐条对。虚部只写 b、纯虚数要两个条件、复数不比大小——这三条就是分类讨论的全部边界。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ z=1−2i 的虚部是 −2i</p>
<p class="er-v">✓ 虚部是 −2</p>
<p class="er-w">错在哪：虚部是实数 b，不是 bi；i 不跟着进虚部。</p>
</div>
<div class="er">
<p class="er-x">✗ 纯虚数只要实部等于 0</p>
<p class="er-v">✓ 纯虚数要 a=0 且 b≠0</p>
<p class="er-w">错在哪：只满足 a=0 的 0 是实数，不是纯虚数，两个条件缺一不可。</p>
</div>
<div class="er">
<p class="er-x">✗ 1+i 比 1 大，因为实部相同但多了虚部</p>
<p class="er-v">✓ 复数不能比较大小，只能判相等或不等</p>
<p class="er-w">错在哪：复数没有大小顺序，z₁&gt;z₂ 没有定义；只有实数才能比大小。</p>
</div>
<div class="er">
<p class="er-x">✗ i²=1，所以 i=±1</p>
<p class="er-v">✓ i²=−1，i 不是实数</p>
<p class="er-w">错在哪：把 i² 记成 1 会让整个扩数系失效；i 不落在实轴上，不能和实数比大小。</p>
</div>
<div class="er">
<p class="er-x">✗ 0 是纯虚数，因为它的实部是 0</p>
<p class="er-v">✓ 0 是实数（b=0）</p>
<p class="er-w">错在哪：纯虚数要求 b≠0，而 0 的虚部 b=0，所以 0 属于实数。</p>
</div>
<div class="er">
<p class="er-x">✗ 两个复数模相等，所以它们相等</p>
<p class="er-v">✓ 实部与虚部分别相等才相等</p>
<p class="er-w">错在哪：模只表示到原点的距离，1+i 与 1−i 模都是 √2 却不相等。</p>
</div>

<script>
/* 7.1 复数的概念 · 复平面上的点随辐角旋转（模固定 |z|=2）
   calc(v) 是唯一真值：v = 辐角 θ（度）→ 实部 re = 2cosθ、虚部 im = 2sinθ、类型 type */
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var GX = window.GX, el = GX.el, tx = GX.tx, $ = GX.$, n1 = GX.n1;
  var stage = $("gxStage");
  if (!stage || !window.AutoPilot) return;

  /* 两套坐标：宽屏 880×470，窄屏独立 360×700 */
  var W = { vb: "0 0 880 470", left: { x: 16, y: 16, w: 424, h: 438 }, right: { x: 456, y: 16, w: 408, h: 438 } };
  var N = { vb: "0 0 360 700", left: { x: 8, y: 8, w: 344, h: 300 }, right: { x: 8, y: 320, w: 344, h: 372 } };
  var L = W, A = 0;

  function fmt(x) { return (Math.abs(x) < 0.005 ? 0 : x).toFixed(2); }

  /* 纯函数：θ（度）→ 实部、虚部、模、类型（0 实数 / 1 纯虚数 / 2 一般虚数） */
  function calc(v) {
    var th = v * Math.PI / 180;
    var re = 2 * Math.cos(th), im = 2 * Math.sin(th);
    if (Math.abs(re) < 1e-9) re = 0;
    if (Math.abs(im) < 1e-9) im = 0;
    var type = 0;
    if (Math.abs(im) >= 1e-9) type = Math.abs(re) >= 1e-9 ? 2 : 1;
    return { re: re, im: im, mod: 2, type: type };
  }

  function head(g, x1, y1, x2, y2, col, sz) {
    var a = Math.atan2(y2 - y1, x2 - x1), s = sz || 7;
    var p1x = x2 - s * Math.cos(a - 0.4), p1y = y2 - s * Math.sin(a - 0.4);
    var p2x = x2 - s * Math.cos(a + 0.4), p2y = y2 - s * Math.sin(a + 0.4);
    el("polygon", { points: n1(x2) + "," + n1(y2) + " " + n1(p1x) + "," + n1(p1y) + " " + n1(p2x) + "," + n1(p2y), fill: col }, g);
  }

  function drawPlane(g, s) {
    var p = L.left, cx = p.x + p.w / 2, cy = p.y + p.h / 2 + 8;
    var sc = Math.min(p.w, p.h) * 0.165;          /* 1 个单位 = sc 像素，模 2 就是 2sc */
    var ax = sc * 2.2;
    el("rect", { x: p.x, y: p.y, width: p.w, height: p.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, g);
    tx(g, p.x + 18, p.y + 26, "复平面 · 模 |z| = 2", "#5a6472", "start", 10.5, 700);
    el("circle", { cx: n1(cx), cy: n1(cy), r: n1(sc * 2), fill: "none", stroke: "#dbe7ef", "stroke-dasharray": "4 4" }, g);

    /* 实轴、虚轴（带箭头与单位刻度） */
    el("path", { d: "M" + n1(cx - ax) + " " + n1(cy) + " L" + n1(cx + ax) + " " + n1(cy), stroke: "#3a3a35", "stroke-width": 1.2 }, g);
    head(g, cx, cy, cx + ax, cy, "#3a3a35", 7);
    el("path", { d: "M" + n1(cx) + " " + n1(cy + ax) + " L" + n1(cx) + " " + n1(cy - ax), stroke: "#3a3a35", "stroke-width": 1.2 }, g);
    head(g, cx, cy, cx, cy - ax, "#3a3a35", 7);
    tx(g, cx + ax - 6, cy + 30, "实轴", "#3a3a35", "end", 9.5, 400);
    tx(g, cx + 8, cy - ax + 10, "虚轴", "#3a3a35", "start", 9.5, 400);
    tx(g, cx - 6, cy + 13, "O", "#6b7280", "end", 9.5, 400);

    for (var k = -2; k <= 2; k++) {
      if (!k) continue;
      var x = cx + sc * k, y = cy - sc * k;
      el("path", { d: "M" + n1(x) + " " + n1(cy - 4) + " L" + n1(x) + " " + n1(cy + 4), stroke: "#3a3a35", "stroke-width": 1 }, g);
      tx(g, x, cy + 15, String(k).replace("-", "−"), "#6b7280", "middle", 8.6, 400);
      el("path", { d: "M" + n1(cx - 4) + " " + n1(y) + " L" + n1(cx + 4) + " " + n1(y), stroke: "#3a3a35", "stroke-width": 1 }, g);
      tx(g, cx - 7, y + 3, String(k).replace("-", "−"), "#6b7280", "end", 8.6, 400);
    }

    var th = A * Math.PI / 180;
    var px = cx + sc * s.re, py = cy - sc * s.im;
    /* 到两轴的虚线投影 */
    el("path", { d: "M" + n1(px) + " " + n1(py) + " L" + n1(px) + " " + n1(cy), stroke: "#b8c6d4", "stroke-width": 1, "stroke-dasharray": "4 3" }, g);
    el("path", { d: "M" + n1(px) + " " + n1(py) + " L" + n1(cx) + " " + n1(py), stroke: "#b8c6d4", "stroke-width": 1, "stroke-dasharray": "4 3" }, g);

    /* 辐角弧：屏幕 y 轴朝下，数学逆时针 = sweep-flag 0 */
    if (A > 0.5) {
      var ar = sc * 0.62, e = Math.min(A, 359.4) * Math.PI / 180;
      var x1 = cx + ar, y1 = cy;
      var x2 = cx + ar * Math.cos(e), y2 = cy - ar * Math.sin(e);
      el("path", {
        d: "M" + n1(x1) + " " + n1(y1) + " A" + n1(ar) + " " + n1(ar) + " 0 " + (A > 180 ? 1 : 0) + " 0 " + n1(x2) + " " + n1(y2),
        fill: "none", stroke: "#b8791f", "stroke-width": 1.6
      }, g);
      var am = th / 2;
      tx(g, cx + (ar + 14) * Math.cos(am), cy - (ar + 14) * Math.sin(am) + 4, "θ", "#b8791f", "middle", 10, 700);
    }

    /* 向量 OZ + 点 z */
    el("path", { d: "M" + n1(cx) + " " + n1(cy) + " L" + n1(px) + " " + n1(py), stroke: "#2563eb", "stroke-width": 1.8 }, g);
    head(g, cx, cy, px, py, "#2563eb", 8);
    el("circle", { cx: n1(px), cy: n1(py), r: 3.6, fill: "#2563eb" }, g);
    /* 点标签按位置避让：贴右边界时移到点的左侧，落在虚轴上时移到点的上下 */
    var lx = px + 8, ly = py - 6, anc = "start";
    if (lx + 26 > p.x + p.w - 6) { lx = px - 8; anc = "end"; }
    if (Math.abs(s.re) < 0.1) ly = s.im > 0 ? py + 18 : py - 10;
    tx(g, lx, ly, "z", "#2563eb", anc, 10.5, 700);
    tx(g, p.x + 18, p.y + p.h - 14, "|z| = 2，θ 从实轴正方向逆时针量", "#6b7280", "start", 9, 400);
  }

  function drawNum(g, s) {
    var p = L.right, x = p.x + 22, w = p.w - 44;
    el("rect", { x: p.x, y: p.y, width: p.w, height: p.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, g);
    tx(g, x, p.y + 28, "z = a + bi 的分解", "#5a6472", "start", 10.5, 700);
    var imStr = s.im >= 0 ? "+ " + fmt(s.im) : "− " + fmt(Math.abs(s.im));
    tx(g, x, p.y + 58, "z = " + fmt(s.re) + " " + imStr + "i", "#151a21", "start", 12, 700);
    tx(g, x, p.y + 86, "① 实部 a = 2cosθ = " + fmt(s.re), "#2563eb", "start", 10.5, 700);
    tx(g, x, p.y + 110, "② 虚部 b = 2sinθ = " + fmt(s.im), "#2563eb", "start", 10.5, 700);
    tx(g, x, p.y + 134, "③ 模 |z| = 2（固定不变）", "#6b7280", "start", 9.6, 400);

    var t = s.type, nm, why, col, bg;
    if (t === 0) { nm = "实数"; why = "b = 0，点落在实轴上"; col = "#2f8a5b"; bg = "#e6f6ee"; }
    else if (t === 1) { nm = "纯虚数"; why = "a = 0 且 b ≠ 0，点落在虚轴上"; col = "#2563eb"; bg = "#eff5ff"; }
    else { nm = "一般虚数"; why = "a ≠ 0 且 b ≠ 0"; col = "#b8791f"; bg = "#fdf3e0"; }

    el("rect", { x: x - 6, y: p.y + 150, width: w, height: 88, rx: 10, fill: bg, stroke: col + "44" }, g);
    tx(g, x + 6, p.y + 174, "④ 类型判断", "#6b7280", "start", 9.4, 400);
    tx(g, x + 6, p.y + 200, nm, col, "start", 16, 700);
    tx(g, x + 6, p.y + 222, why, col, "start", 9.6, 400);

    tx(g, x, p.y + 262, "θ = 0°、180°：b = 0 → 实数", "#3a3a35", "start", 9.6, 400);
    tx(g, x, p.y + 284, "θ = 90°、270°：a = 0 且 b ≠ 0", "#3a3a35", "start", 9.6, 400);
    tx(g, x, p.y + 306, "→ 纯虚数（两个条件同时成立）", "#b8791f", "start", 9.6, 400);
    tx(g, x, p.y + 332, "虚部是 b，不是 bi；0 是实数", "#b8402f", "start", 9.6, 400);
    if (p.h > 400) {
      tx(g, x, p.y + 362, "复数不能比较大小：只有相等与不等", "#6b7280", "start", 9.6, 400);
      tx(g, x, p.y + 386, "复数 → 点 Z(a，b) → 向量 OZ", "#6b7280", "start", 9.6, 400);
    }
  }

  function render() {
    var gA = $("gxA"), gB = $("gxB"), s = calc(A);
    gA.textContent = ""; gB.textContent = "";
    $("gxVa").textContent = Math.round(A) + "°";
    $("gxVb").textContent = fmt(s.re);
    $("gxVc").textContent = fmt(s.im);
    var st, sn, col, bg;
    if (s.type === 0) { st = "实数"; sn = "b=0，落在实轴上"; col = "#2f8a5b"; bg = "#e6f6ee"; }
    else if (s.type === 1) { st = "纯虚数"; sn = "a=0 且 b≠0"; col = "#2563eb"; bg = "#eff5ff"; }
    else { st = "一般虚数"; sn = "a≠0 且 b≠0"; col = "#b8791f"; bg = "#fdf3e0"; }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    drawPlane(gA, s);
    drawNum(gB, s);
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 0 }, { t: 1.2, v: 0 }, { t: 4, v: 90 }, { t: 6.5, v: 90 }, { t: 9, v: 180 }, { t: 11.5, v: 270 }, { t: 13.5, v: 0 }],
    keys: [0, 90, 180, 270],
    value: A, min: 0, max: 360, step: 15,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc, cases: [
    { v: 0, eq: { re: 2, im: 0, type: 0 } },
    { v: 90, eq: { re: 0, im: 2, type: 1 } },
    { v: 180, eq: { re: -2, im: 0, type: 0 } },
    { v: 45, eq: { re: 1.414, im: 1.414, type: 2 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
