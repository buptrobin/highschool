<p class="gx-lede">这一节把「圆」从几何图形翻译成方程：直线用一次方程，圆用二次方程，而且必须是「平方和」那一类。全节只有一件事要反复做——把一个二次方程认成圆。最容易错的不是配方本身，而是三步之后忘了回头：<b>一般方程不判 D²+E²−4F>0 就直接说它是圆</b>，标准方程里把 (x−a) 读成圆心 a，半径把 r² 直接当成 r。这一页把这三处各拆两遍。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 圆的标准方程<span class="q-src">人教A版选择性必修第一册 · 第二章第四节</span></p>
<p class="q-b">方程 (x−a)²+(y−b)²=r² 叫做圆的标准方程，其中圆心为 (a,b)，半径为 r。</p>
<p class="q-n">→ 翻成人话：这是<b>两个条件加一个限制</b>。① 左边必须是「x 减去某个数」的平方加「y 减去某个数」的平方，平方和不能拆开、不能出现 xy；② 右边只有一个数 r²；③ r>0。写成 (x+a)²，圆心就是 (−a,b) 而不是 (a,b)——<b>括号里减谁，圆心就是谁</b>，符号读反是这一节的第一号错。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 圆的一般方程<span class="q-src">人教A版选择性必修第一册 · 第二章第四节</span></p>
<p class="q-b">方程 x²+y²+Dx+Ey+F=0（D²+E²−4F&gt;0）叫做圆的一般方程。</p>
<p class="q-n">→ 翻成人话：括号里那句 <b>D²+E²−4F&gt;0</b> 是方程的一部分，不是补充说明。缺了它这个式子只是「一个二次方程」：=0 时它只表示一个点，&lt;0 时它什么都不表示。所以<b>拿到一般方程的第一件事是算 D²+E²−4F，不是配方</b>。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 配方后的圆心与半径<span class="q-src">人教A版选择性必修第一册 · 第二章第四节</span></p>
<p class="q-b">把 x²+y²+Dx+Ey+F=0 配方，得 (x+D/2)²+(y+E/2)²=(D²+E²−4F)/4，所以圆心为 (−D/2,−E/2)，半径 r=½√(D²+E²−4F)。</p>
<p class="q-n">→ 翻成人话：右边是 <b>4 分之判别量</b>，它等于 r²，所以半径要<b>先开方、再除以 2</b>。只除以 2 不开方，半径会大得离谱；只开方不除以 2，会大 √2 倍。另外注意：标准方程里 (x+D/2) 再取反才是圆心的横坐标，所以圆心是 (−D/2,−E/2)，不是 (D/2,E/2)，更不是 (D,E)。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>一般方程 x²+y²+Dx+Ey+F=0 要满足的条件</th><th>缺了这一条会怎样</th></tr></thead>
<tbody>
<tr><td>x² 与 y² 的系数相等，且都是 1</td><td>系数不等，图形是椭圆或双曲线，配方后右边是「两个不同的平方项」，不是圆</td></tr>
<tr><td>没有 xy 这一项</td><td>有 xy 项说明圆被「斜着」放，含 x、含 y 的项配不成两个独立的完全平方</td></tr>
<tr class="key"><td>D²+E²−4F&gt;0（判别量，必须先算）</td><td>=0 时配方得 r²=0，只表示一个点；&lt;0 时右边为负数，没有实数半径，方程无轨迹</td></tr>
<tr><td>配方后右边等于 r²，半径 r=½√(D²+E²−4F)</td><td>直接把 (D²+E²−4F)/4 当半径，或忘了除以 2，半径数值全错</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只高亮 1 行。背法：一般方程就是标准方程展开后的样子，所以每一条判据都能从 (x−a)²+(y−b)²=r² 反推回去；考场上记不清就现场配一次方，别背半句。注意表里写的是 D²+E²−4F，不是 D²+E²−F，也不是 D²+E²−4F/4。</p>
</section>

<text x="440" y="98" font-size="9.2" fill="#3a3a35">① 圆心在弦的垂直平分线上</text>
<text x="440" y="116" font-size="9.2" fill="#3a3a35">② 两条中垂线相交，交点即圆心 (a,b)</text>
<text x="440" y="134" font-size="9.2" fill="#3a3a35">③ 圆心到任一点的距离就是半径 r</text>
<text x="440" y="152" font-size="9.2" fill="#3a3a35">④ 直接写 (x−a)²+(y−b)²=r²</text>
<text x="440" y="172" font-size="9.2" fill="#b8402f">✗ 把圆心写成 (−a,−b)，半径又忘了开方</text>
</svg>
<span class="gx-zoomchip">点击放大</span>
</div>
<p class="gx-take">给点就用一般式硬代，给几何条件就先找圆心；<b>两种方法的收尾句都是「所以圆的方程为…，圆心…，半径…」，半径必须是开方后的数</b>。</p>
</figure>
</section>

<h2><span class="sn">03</span>自己拖一下<span class="bdg bdg-must">核心</span></h2>
<p class="gx-h2s">圆心钉在 (1,2) 不动，只拖半径 r：看圆什么时候碰到 x 轴、碰到几次。</p>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。每一步只推进一个动作。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 三点定圆<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">求过三点 O(0,0)、A(1,1)、B(4,2) 的圆的方程，并写出圆心与半径。<span style="color:#b8402f">陷阱：三个点都代进去只得到三个方程，D、E、F 必须一起解完才算做完。</span></p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 定方法</p>
<p class="s-b">三点确定一个圆，但圆心坐标和半径都不知道。用待定系数法：设圆的一般方程 x²+y²+Dx+Ey+F=0，只要求出 D、E、F 三个数，方程就定了。</p>
<p class="s-k">用到：一般方程的形式；三个未知数要三个方程。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 代入 O(0,0)</p>
<p class="s-b">把 x=0、y=0 代入：0+0+0+0+F=0，得 F=0。这一步最省事，先做它，后面两个方程就只剩 D、E。</p>
<p class="s-k">用到：点在圆上 ⇔ 坐标满足方程。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 代入 A(1,1) 与 B(4,2)</p>
<p class="s-b">代入 A：1+1+D+E+F=0，用 F=0 得 <b>D+E=−2</b>。代入 B：16+4+4D+2E+F=0，用 F=0 得 <b>4D+2E=−20</b>，即 2D+E=−10。两个方程联立。</p>
<p class="s-k">用到：每个点给一个方程；x²、y² 要按坐标平方算，别漏。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 解方程组</p>
<p class="s-b">两式相减：(2D+E)−(D+E)=−10−(−2)，得 <b>D=−8</b>；代回 D+E=−2，得 <b>E=6</b>。于是 x²+y²−8x+6y=0。</p>
<p class="s-k">用到：二元一次方程组；未知数回代要逐个核。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 判符号、报圆心半径</p>
<p class="s-b">先算判别量：D²+E²−4F=64+36−0=100&gt;0，所以它确实是圆。再读圆心 (−D/2,−E/2)=(4,−3)，半径 r=½√100=5。<b>半径是开方后再除以 2，不是 100/4。</b></p>
<p class="s-k">用到：D²+E²−4F&gt;0 才是圆；圆心 (−D/2,−E/2)；r=½√(D²+E²−4F)。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">设圆的方程为 x²+y²+Dx+Ey+F=0。<br>
因为圆过 O(0,0)，所以 F=0。<br>
因为圆过 A(1,1)，所以 1+1+D+E=0，即 D+E=−2。<br>
因为圆过 B(4,2)，所以 16+4+4D+2E=0，即 2D+E=−10。<br>
两式相减得 D=−8，代回得 E=6。<br>
所以圆的方程为 <span class="gx-fml">x²+y²−8x+6y=0</span>。<br>
因为 D²+E²−4F=64+36=100&gt;0，所以该方程表示圆。<br>
圆心为 (−D/2,−E/2)，即 (4,−3)；半径 r=½√(D²+E²−4F)=½√100=5。<br>
所以圆的方程为 x²+y²−8x+6y=0，圆心 (4,−3)，半径 5。</p>
</div>
</div>
</section>
<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「一般方程 x²+y²+Dx+Ey+F=0，写出来就是个圆吧？」</p>
<p class="a">不一定。<b>只有 D²+E²−4F&gt;0 时它才表示圆</b>；等于 0 时只表示一个点，小于 0 时无轨迹。所以拿到一般方程的第一步是算 D²+E²−4F，不是直接配方报圆心。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="判别量三种符号的三种结论">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text class="ms" x="120" y="30" text-anchor="middle" font-size="9" font-weight="700">先算 D²+E²−4F</text>
<text class="ms" x="120" y="52" text-anchor="middle" font-size="8.5">&gt; 0 → 圆</text>
<text class="ms" x="120" y="72" text-anchor="middle" font-size="8.5">= 0 → 一个点</text>
<text class="ms" x="120" y="92" text-anchor="middle" font-size="8.5">&lt; 0 → 无轨迹</text>
<text class="ms" x="120" y="112" text-anchor="middle" font-size="8" fill="#b8402f">不判符号就写「圆」，扣分</text>
</svg>
</div>
<div class="qac">
<p class="q">「(x−3)²+(y+1)²=4，圆心是 (3,1) 吧？」</p>
<p class="a">圆心是 <b>(3,−1)</b>。括号里减谁，圆心坐标就是谁：x−3 给横坐标 3；y+1 要看成 y−(−1)，给纵坐标 −1。<b>标准方程里是 (x−a)，不是 (x+a)</b>，符号一致地读，别一半反一半正。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="标准方程里减号与圆心符号的对应">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text class="ms" x="120" y="30" text-anchor="middle" font-size="9" font-weight="700">括号里减谁，圆心就是谁</text>
<text class="ms" x="120" y="54" text-anchor="middle" font-size="9">(x−3)² → 横坐标 3</text>
<text class="ms" x="120" y="76" text-anchor="middle" font-size="9">(y+1)² = (y−(−1))² → 纵坐标 −1</text>
<text class="ms" x="120" y="102" text-anchor="middle" font-size="8.5" fill="#b8402f">✗ 写成 (x+3)² 就把圆心读成 (−3,1)</text>
</svg>
</div>
<div class="qac">
<p class="q">「判别式等于 0 的时候，圆缩成一个点是吗？」</p>
<p class="a">是，而且这个点就是圆心 <b>(−D/2,−E/2)</b>。此时配方右边 r²=0，半径 r=0，图形退化成一个点，<b>不能再说它是圆</b>；答题要写「表示点 (−D/2,−E/2)」。判别式小于 0 则相反，右边为负，没有实数半径，无轨迹。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="判别式等于零时圆退化成一个点">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<circle cx="76" cy="66" r="26" fill="none" stroke="#b8791f" stroke-width="1.2" stroke-dasharray="4 3"/>
<circle cx="76" cy="66" r="3.4" fill="#b8402f"/>
<text class="ms" x="150" y="56" text-anchor="middle" font-size="8.5">r² = 0</text>
<text class="ms" x="150" y="76" text-anchor="middle" font-size="8.5">半径缩成 0</text>
<text class="ms" x="120" y="112" text-anchor="middle" font-size="8.5">只表示点 (−D/2, −E/2)</text>
</svg>
</div>
<div class="qac">
<p class="q">「半径公式 r=½√(D²+E²−4F)，那个 ½ 是背下来的吗？」</p>
<p class="a">不是背的，是配出来的。配方后右边是 (D²+E²−4F)/4，它等于 r²，所以 <b>r=√[(D²+E²−4F)/4]=½√(D²+E²−4F)</b>。<b>半径要开方再除以 2</b>：只除以 2 会大得离谱，只开方会大 √2 倍。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="半径公式里二分之一的来源">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text class="ms" x="120" y="34" text-anchor="middle" font-size="8.5">配方右边 = (D²+E²−4F)/4 = r²</text>
<text class="ms" x="120" y="62" text-anchor="middle" font-size="9" font-weight="700">r = √[(D²+E²−4F)/4]</text>
<text class="ms" x="120" y="88" text-anchor="middle" font-size="9" font-weight="700">r = ½√(D²+E²−4F)</text>
<text class="ms" x="120" y="110" text-anchor="middle" font-size="8" fill="#b8402f">✗ r = D²+E²−4F（既没开方也没除 2）</text>
</svg>
</div>
<div class="qac">
<p class="q">「求圆的方程，是不是只能设一般式硬代点？」</p>
<p class="a">两条路：给三个点就设一般式待定系数；给弦、切点、圆心所在直线这些线索就用几何法，<b>先由垂直平分线交点定圆心，再用距离得半径</b>。两条路收尾一样：写出方程、报圆心、报半径。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="待定系数法与几何法两条路线">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<rect x="18" y="26" width="98" height="72" rx="6" fill="#ffffff" stroke="#2563eb"/>
<text class="ms" x="67" y="46" text-anchor="middle" font-size="8.5" font-weight="700">待定系数</text>
<text class="ms" x="67" y="64" text-anchor="middle" font-size="8">给三个点</text>
<text class="ms" x="67" y="82" text-anchor="middle" font-size="8">解 D、E、F</text>
<rect x="124" y="26" width="98" height="72" rx="6" fill="#ffffff" stroke="#2f8a5b"/>
<text class="ms" x="173" y="46" text-anchor="middle" font-size="8.5" font-weight="700">几何法</text>
<text class="ms" x="173" y="64" text-anchor="middle" font-size="8">定圆心</text>
<text class="ms" x="173" y="82" text-anchor="middle" font-size="8">量半径</text>
<text class="ms" x="120" y="116" text-anchor="middle" font-size="8">两条路都要写「圆心…半径…」</text>
</svg>
</div>
<div class="qac">
<p class="q">「圆心在原点的时候，方程长什么样？」</p>
<p class="a">标准方程退化成 <b>x²+y²=r²</b>，圆心 (0,0)，半径 r。一般方程里则是 D=E=0，即 x²+y²+F=0，此时判别量 D²+E²−4F=−4F，<b>必须 −4F&gt;0 即 F&lt;0 才是圆</b>；这也顺带说明一般方程里 F 可以是负数。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="圆心在原点时的方程形式">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<circle cx="70" cy="66" r="28" fill="none" stroke="#2563eb" stroke-width="1.6"/>
<circle cx="70" cy="66" r="2.6" fill="#b8402f"/>
<text class="ms" x="146" y="46" text-anchor="middle" font-size="9" font-weight="700">x² + y² = r²</text>
<text class="ms" x="146" y="70" text-anchor="middle" font-size="8">圆心 (0,0)</text>
<text class="ms" x="146" y="90" text-anchor="middle" font-size="8">D=E=0，须 F&lt;0</text>
</svg>
</div>
</div>
<p class="gx-note">六问其实是同一件事：<b>认方程</b>。一般方程先验判别量，标准方程先读符号，半径先开方再除 2——三个动作走完，圆才不会认错。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 方程 x²+y²+Dx+Ey+F=0 表示一个圆，圆心 (−D/2,−E/2)。</p>
<p class="er-v">✓ 当 D²+E²−4F&gt;0 时，方程 x²+y²+Dx+Ey+F=0 表示圆，圆心 (−D/2,−E/2)。</p>
<p class="er-w">错在哪：漏了前提。判别量 ≤0 时它不表示圆，答题必须<b>先写 D²+E²−4F&gt;0 再谈圆心</b>。</p>
</div>
<div class="er">
<p class="er-x">✗ 由 x²+y²+Dx+Ey+F=0 得圆心为 (D,E)。</p>
<p class="er-v">✓ 圆心为 (−D/2,−E/2)，半径 r=½√(D²+E²−4F)。</p>
<p class="er-w">错在哪：配方后是 (x+D/2)²+(y+E/2)²，<b>括号里是加号，所以圆心取负、还要除以 2</b>；直接抄 D、E 两处都错。</p>
</div>
<div class="er">
<p class="er-x">✗ 半径 r=D²+E²−4F，代入得 r=100。</p>
<p class="er-v">✓ 半径 r=½√(D²+E²−4F)，代入得 r=½√100=5。</p>
<p class="er-w">错在哪：<b>半径要开方再除以 2</b>。右边拿到的是 r² 的 4 倍，不是 r。</p>
</div>
<div class="er">
<p class="er-x">✗ 由 (x+3)²+(y−1)²=16 得圆心 (3,−1)，半径 16。</p>
<p class="er-v">✓ 圆心 (−3,1)，半径 r=√16=4。</p>
<p class="er-w">错在哪：两处一起错。<b>标准方程里是 (x−a) 不是 (x+a)</b>，x+3 即 x−(−3)，横坐标是 −3；右边是 r²，半径要开方。</p>
</div>
<div class="er">
<p class="er-x">✗ 判别式是 D²+E²−F，大于 0 就是圆。</p>
<p class="er-v">✓ 判别式是 D²+E²−4F，大于 0 才是圆。</p>
<p class="er-w">错在哪：漏了系数 4。它来自配方时两边加的 (D/2)² 与 (E/2)² 通分，<b>少这个 4，临界值全错</b>。</p>
</div>
<div class="er">
<p class="er-x">✗ 过三点 A(1,1)、B(4,2)、C(1,1) 求不出圆的方程。</p>
<p class="er-v">✓ 不共线的三点确定一个圆；若三点共线则不存在过这三点的圆。</p>
<p class="er-w">错在哪：判断依据是<b>三点是否共线</b>，不是「能不能解出方程组」。三点型题目里 F 常常直接为 0（有一个点是原点时）。</p>
</div>
<div class="er">
<p class="er-x">✗ 解出 D=−8、E=6 就交卷：圆的方程是 x²+y²−8x+6y=0。</p>
<p class="er-v">✓ 再验 D²+E²−4F=100&gt;0，得圆心 (4,−3)、半径 5，最后一句写全。</p>
<p class="er-w">错在哪：题目问「圆心与半径」时，<b>不写收尾句就丢分</b>；而且不验判别量，等于没证明它是圆。</p>
</div>
</div>
</section>

<script>
/* 互动脚本本体（由 build-page.mjs 包进 <script> 里，所以这里不要写 <script> 标签） */
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var GX = window.GX, el = GX.el, tx = GX.tx, $ = GX.$;
  var stage = $("gxStage");
  if (!stage || !window.AutoPilot) return;

  /* 两套坐标：宽屏 880×470，窄屏独立 360×700 */
  var W = { vb: "0 0 880 470", left: { x: 16, y: 16, w: 424, h: 438 }, right: { x: 456, y: 16, w: 408, h: 438 },
            ox: 200, oy: 330, u: 34, ax1: 42, ax2: 418, ay1: 418, ay2: 70 };
  var N = { vb: "0 0 360 700", left: { x: 8, y: 8, w: 344, h: 300 }, right: { x: 8, y: 320, w: 344, h: 372 },
            ox: 150, oy: 225, u: 22, ax1: 20, ax2: 340, ay1: 296, ay2: 48 };
  var L = W, G = null, A = 3;

  /* 纯函数：半径 r → 交点数 n、判别量 disc。render() 和 __model.cases 都用它 */
  function calc(v) {
    var r = Math.round(v * 2) / 2;
    var disc = Math.round((r * r - 4) * 100) / 100;
    var n = r < 2 ? 0 : (r > 2 ? 2 : 1);
    return { r: r, disc: disc, n: n };
  }
  function fmt(x) { return String(Math.round(x * 100) / 100); }

  function geom() {
    return { ox: L.ox, oy: L.oy, u: L.u, ax1: L.ax1, ax2: L.ax2, ay1: L.ay1, ay2: L.ay2 };
  }

  /* 中文按字数换行，避免长句冲出面板 */
  function wrap(parent, x, y, s, maxW, fs, col, lh) {
    var per = Math.max(6, Math.floor(maxW / fs)), lines = [], cur = "";
    for (var i = 0; i < s.length; i++) { cur += s.charAt(i); if (cur.length >= per) { lines.push(cur); cur = ""; } }
    if (cur) lines.push(cur);
    for (var k = 0; k < lines.length; k++) tx(parent, x, y + k * lh, lines[k], col, "start", fs, 400);
  }

  function draw() {
    var gA = $("gxA"), gB = $("gxB");
    var s = calc(A), r = s.r, n = s.n, disc = s.disc;
    var ox = G.ox, oy = G.oy, u = G.u;
    gA.textContent = ""; gB.textContent = "";

    /* ---------- 左：坐标系 + 圆 + x 轴交点 ---------- */
    el("rect", { x: L.left.x, y: L.left.y, width: L.left.w, height: L.left.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    tx(gA, L.left.x + 18, L.left.y + 26, "圆 (x−1)²+(y−2)²=r² 与 x 轴", "#5a6472", "start", L === W ? 10.5 : 9.6, 700);

    el("line", { x1: G.ax1, y1: oy, x2: G.ax2, y2: oy, stroke: "#8a939e", "stroke-width": 1.3 }, gA);
    el("polygon", { points: G.ax2 + "," + oy + " " + (G.ax2 - 13) + "," + (oy - 5.5) + " " + (G.ax2 - 13) + "," + (oy + 5.5), fill: "#8a939e" }, gA);
    el("line", { x1: ox, y1: G.ay1, x2: ox, y2: G.ay2, stroke: "#8a939e", "stroke-width": 1.3 }, gA);
    el("polygon", { points: ox + "," + G.ay2 + " " + (ox - 5.5) + "," + (G.ay2 + 13) + " " + (ox + 5.5) + "," + (G.ay2 + 13), fill: "#8a939e" }, gA);
    tx(gA, G.ax2 - 6, oy + 20, "x", "#5a6472", "end", 9.6, 400);
    tx(gA, ox + 10, G.ay2 + 13, "y", "#5a6472", "start", 9.6, 400);
    tx(gA, ox - 12, oy + 19, "O", "#5a6472", "end", 9.4, 400);

    /* 单位刻度 */
    for (var i = -3; i <= 6; i++) {
      var px = ox + i * u;
      if (px > G.ax1 + 6 && px < G.ax2 - 14) {
        el("line", { x1: px, y1: oy - 4, x2: px, y2: oy + 4, stroke: "#9aa4ae", "stroke-width": 1 }, gA);
        if (i > 0 && i <= 5 && i % 2 === 1) tx(gA, px, oy + 17, String(i), "#5a6472", "middle", 8.5, 400);
      }
    }
    for (var j = 1; j <= 5; j++) {
      var py = oy - j * u;
      if (py > G.ay2 + 12) {
        el("line", { x1: ox - 4, y1: py, x2: ox + 4, y2: py, stroke: "#9aa4ae", "stroke-width": 1 }, gA);
        if (j % 2 === 1) tx(gA, ox - 9, py + 3, String(j), "#5a6472", "end", 8.5, 400);
      }
    }

    var cx = ox + u, cy = oy - 2 * u, rp = r * u;

    /* 圆心到 x 轴的距离 d=2 */
    el("line", { x1: cx, y1: cy, x2: cx, y2: oy, stroke: "#9aa4ae", "stroke-width": 1, "stroke-dasharray": "4 3" }, gA);
    tx(gA, cx + 6, (cy + oy) / 2 + 3, "d=2", "#8a939e", "start", 8.6, 400);

    /* 圆 */
    el("circle", { cx: cx, cy: cy, r: rp, fill: "#2563eb", "fill-opacity": 0.07, stroke: "#2563eb", "stroke-width": 1.8 }, gA);

    /* 半径 r */
    var ang = -0.9, rx = cx + rp * Math.cos(ang), ry = cy + rp * Math.sin(ang);
    el("line", { x1: cx, y1: cy, x2: rx, y2: ry, stroke: "#b8791f", "stroke-width": 1.5 }, gA);
    tx(gA, rx + 5, ry - 5, "r", "#b8402f", "start", 9.6, 700);

    /* 圆心 */
    el("circle", { cx: cx, cy: cy, r: 3.2, fill: "#b8402f" }, gA);
    tx(gA, cx + 7, cy - 7, "C(1,2)", "#b8402f", "start", 9.4, 700);

    /* 与 x 轴的交点 */
    if (n === 2) {
      var sq = Math.sqrt(disc);
      var xa = ox + (1 - sq) * u, xb = ox + (1 + sq) * u;
      el("circle", { cx: xa, cy: oy, r: 3.6, fill: "#b8402f" }, gA);
      el("circle", { cx: xb, cy: oy, r: 3.6, fill: "#b8402f" }, gA);
      tx(gA, xa, oy - 9, "A", "#b8402f", "middle", 9.4, 700);
      tx(gA, xb, oy - 9, "B", "#b8402f", "middle", 9.4, 700);
      el("line", { x1: ox + u, y1: oy, x2: ox + u, y2: oy - 18, stroke: "#2f8a5b", "stroke-width": 1.2 }, gA);
    } else if (n === 1) {
      el("circle", { cx: ox + u, cy: oy, r: 4, fill: "#b8791f" }, gA);
      tx(gA, ox + u + 8, oy - 10, "切点 (1,0)", "#b8791f", "start", 9.4, 700);
    }

    /* ---------- 右：读数 ---------- */
    el("rect", { x: L.right.x, y: L.right.y, width: L.right.w, height: L.right.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    tx(gB, L.right.x + 18, L.right.y + 28, "读数（半径一变，判别量就变）", "#5a6472", "start", 10.5, 700);
    var x0 = L.right.x + 18, y0 = L.right.y + 60, dy = L === W ? 24 : 22, fs = L === W ? 10.4 : 9.8;
    tx(gB, x0, y0, "(x−1)² + (y−2)² = r²", "#151a21", "start", 12.5, 700);
    tx(gB, x0, y0 + dy, "圆心 C(1, 2)，半径 r = " + fmt(r), "#3a3a35", "start", fs, 400);
    tx(gB, x0, y0 + dy * 2, "令 y = 0：(x−1)² = r² − 4", "#3a3a35", "start", fs, 400);
    tx(gB, x0, y0 + dy * 3, "判别量 Δ = r² − 4 = " + fmt(disc), n === 1 ? "#b8791f" : (n === 0 ? "#b8402f" : "#2f8a5b"), "start", fs, 700);
    var pts = n === 0 ? "与 x 轴没有交点"
      : n === 1 ? "只有 1 个交点 (1, 0)"
      : "2 个交点 (1−√Δ, 0)、(1+√Δ, 0)";
    tx(gB, x0, y0 + dy * 4, pts, "#3a3a35", "start", fs, 400);
    var col2 = n === 1 ? "#b8791f" : (n === 0 ? "#b8402f" : "#2f8a5b");
    wrap(gB, x0, y0 + dy * 5 + 8, n === 0 ? "Δ<0：圆整体在 x 轴上方，相离。" : (n === 1 ? "Δ=0：圆与 x 轴相切，只有一个公共点。" : "Δ>0：圆穿过 x 轴，两个公共点。"),
      L.right.w - 36, fs, col2, 18);
  }

  function render() {
    if (!G) { L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N; G = geom(); stage.setAttribute("viewBox", L.vb); }
    var s = calc(A), st, col, bg, sn;
    $("gxVa").textContent = fmt(s.r);
    $("gxVb").textContent = fmt(s.disc);
    $("gxVc").textContent = String(s.n);
    if (s.r < 2) { st = "与 x 轴相离"; col = "#b8402f"; bg = "#fbeae7"; sn = "r<2，够不到 x 轴"; }
    else if (s.r === 2) { st = "与 x 轴相切"; col = "#b8791f"; bg = "#fdf3e0"; sn = "r=2，半径等于 d=2"; }
    else { st = "相交于两点"; col = "#2f8a5b"; bg = "#e6f6ee"; sn = "r>2，穿过 x 轴"; }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    draw();
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    G = geom();
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 3 }, { t: 1.2, v: 3 }, { t: 4, v: 2 }, { t: 6.5, v: 2 }, { t: 9, v: 1 }, { t: 11.5, v: 4 }, { t: 13.5, v: 3 }],
    keys: [1, 2, 3, 4],
    value: A, min: 0.5, max: 5, step: 0.5,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc, cases: [
    { v: 1, eq: { n: 0, disc: -3 } },
    { v: 2, eq: { n: 1, disc: 0 } },
    { v: 3, eq: { n: 2, disc: 5 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
</body>
</html>
