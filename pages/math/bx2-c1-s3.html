<p class="gx-lede">这一节把 6.2 的向量加减、数乘、数量积从几何语言翻译成坐标语言：先证明「两个不共线向量足以表示整个平面」，再建坐标系，把向量运算全部变成实数运算。最容易错的一件事，是把共线判据写成点积为 0——点积为 0 是垂直，共线必须用叉积 x₁y₂−x₂y₁=0。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先把定理和两个坐标判据背成标准表述；答题时写课本这句，不写右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 平面向量基本定理<span class="q-src">人教A版必修第二册 · 第6章第3节</span></p>
<p class="q-b">如果 e₁，e₂ 是同一平面内的两个不共线向量，那么对于这一平面内的任一向量 a，有且只有一对实数 λ₁，λ₂，使 a=λ₁e₁+λ₂e₂。</p>
<p class="q-n">→ 翻成人话：这句话压着<b>三个条件</b>——① 两个向量在<b>同一平面</b>内；② 它们<b>不共线</b>；③ 对平面内<b>任一</b>向量 a，系数 λ₁、λ₂ <b>存在且唯一</b>。少②，两个向量只张成一条直线，线外的 a 写不出来，系数也会有无数组。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 共线的坐标判据<span class="q-src">人教A版必修第二册 · 第6章第3节</span></p>
<p class="q-b">设 a=(x₁,y₁)，b=(x₂,y₂)，则 a∥b ⇔ x₁y₂−x₂y₁=0。</p>
<p class="q-n">→ 这个式子是<b>交叉相乘再相减</b>（叉积）：等于 0 说明两向量张成的平行四边形面积塌成 0，也就是落在同一条直线上。它和点积 x₁x₂+y₁y₂=0 长得像，但点积为 0 管的是<b>垂直</b>，别混。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 数量积的坐标表示<span class="q-src">人教A版必修第二册 · 第6章第3节</span></p>
<p class="q-b">设 a=(x₁,y₁)，b=(x₂,y₂)，则 a·b=x₁x₂+y₁y₂。</p>
<p class="q-n">→ 点积是<b>对应坐标相乘再相加</b>，结果是一个<b>实数</b>，不是向量。a、b 非零时，a·b=0 ⇔ 夹角 90° ⇔ <b>垂直</b>；要判共线，仍然回到上面的叉积。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>条件</th><th>缺了会怎样</th></tr></thead>
<tbody>
<tr><td>同一平面</td><td>定理只讨论「这一平面内」的向量；换一个平面，要重新取基底、重新算系数</td></tr>
<tr class="key"><td>基底不共线</td><td>两向量共线时只张成一条直线，线外的 a 写不出来；同一向量还会对应无数组系数</td></tr>
<tr><td>系数存在</td><td>作图保证：过 a 的终点分别作 e₁、e₂ 的平行线，两个交点给出 λ₁、λ₂</td></tr>
<tr><td>系数唯一</td><td>不共线保证两条平行线只有一个交点；换基底则系数换、向量 a 本身不变</td></tr>
<tr><td>坐标＝终点−起点</td><td>起点不在原点时，直接拿终点坐标当 AB 的坐标，会把向量整体平移错</td></tr>
</tbody>
</table>
</div>
<p class="gx-note"><b>背法：</b>基底「不共线」换来「存在且唯一」；判据是两把尺子——叉积 x₁y₂−x₂y₁ 管<b>共线</b>与面积，点积 x₁x₂+y₁y₂ 管<b>垂直</b>与夹角。这一页里这条口径会出现三次以上，因为考试就错在这里。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。两个小问用的是两把不同的尺子。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 共线与垂直的坐标判定<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">已知 a=(2,1)，b=(t,3)。(1) 当 t 为何值时，a∥b？(2) 当 t 为何值时，a⊥b？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性</p>
<p class="s-b">两个小问分别问<b>共线</b>与<b>垂直</b>，判据不同：共线用叉积 x₁y₂−x₂y₁=0，垂直用点积 x₁x₂+y₁y₂=0。先把坐标对齐：x₁=2，y₁=1；x₂=t，y₂=3。</p>
<p class="s-k">用到：共线判据、垂直判据</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 第 (1) 问：写叉积</p>
<p class="s-b">a∥b ⇔ x₁y₂−x₂y₁=0，代入得 2×3−t×1=0，即 <b>6−t=0</b>，所以 <b>t=6</b>。</p>
<p class="s-k">用到：叉积 x₁y₂−x₂y₁</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 第 (2) 问：写点积</p>
<p class="s-b">a⊥b ⇔ x₁x₂+y₁y₂=0，代入得 2t+1×3=0，即 <b>2t+3=0</b>，所以 <b>t=−3/2</b>。</p>
<p class="s-k">用到：点积 x₁x₂+y₁y₂</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 回代检验</p>
<p class="s-b">t=6 时 b=(6,3)=3a，λ=3&gt;0，确实同向共线；t=−3/2 时 b=(−3/2,3)，a·b=2×(−3/2)+3=0，确实垂直。两个答案来自两个判据，互不干扰。</p>
<p class="s-k">用到：共线包含同向与反向</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 写成答题卡</p>
<p class="s-b">每条都先写判据再代数字，最后写「所以」；只写 t=6、t=−3/2 会被判跳步。还要说明 t 是实数，题目没有给范围。</p>
<p class="s-k">用到：规范表述</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">(1) 由 a∥b 得 x₁y₂−x₂y₁=0，即 2×3−t×1=0，解得 <b>t=6</b>。<br>
(2) 由 a⊥b 得 x₁x₂+y₁y₂=0，即 2t+3=0，解得 <b>t=−3/2</b>。<br>
检验：t=6 时 b=(6,3)=3a，a 与 b 同向共线；t=−3/2 时 a·b=0，a 与 b 垂直。<br>
答：当 t=6 时 a∥b；当 t=−3/2 时 a⊥b。</p>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「两个向量不共线」这个条件，到底卡住了什么？</p>
<p class="a">卡住<b>张成整个平面</b>。若 e₁、e₂ 共线，λ₁e₁+λ₂e₂ 只能落在这一条直线上，线外的 a 写不出来；而且同一个向量会有无数组系数。基底要「能表示平面内任一向量」，所以必须不共线。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="共线基底只张成一条直线">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="96" y1="22" x2="96" y2="112" stroke="#b8402f" stroke-width="2"/>
<circle cx="168" cy="48" r="3.5" fill="#2563eb"/>
<text x="108" y="66" font-size="9" fill="#3a3a35">只张成一条线</text>
<text x="108" y="84" font-size="9" fill="#3a3a35">线外的 a 写不出</text>
</svg>
</div>
<div class="qac">
<p class="q">「有且只有一对 λ₁、λ₂」，唯一性是怎么来的？</p>
<p class="a">设 a=λ₁e₁+λ₂e₂=μ₁e₁+μ₂e₂，相减得 (λ₁−μ₁)e₁+(λ₂−μ₂)e₂=0。因为 e₁、e₂ <b>不共线</b>，只有两个系数都为 0 才成立，所以 λ₁=μ₁、λ₂=μ₂。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="唯一性由不共线推出">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="16" y="34" font-size="9" fill="#3a3a35">假设有两对系数</text>
<text x="16" y="58" font-size="9" fill="#3a3a35">λ₁e₁+λ₂e₂ = μ₁e₁+μ₂e₂</text>
<text x="16" y="82" font-size="9" fill="#3a3a35">⇒ (λ₁−μ₁)e₁ = −(λ₂−μ₂)e₂</text>
<text x="16" y="106" font-size="9" fill="#2563eb">不共线 ⇒ 系数全为 0</text>
</svg>
</div>
<div class="qac">
<p class="q">共线条件为什么是叉积为 0，不是点积为 0？</p>
<p class="a">叉积 x₁y₂−x₂y₁ 是以 a、b 为邻边的平行四边形的<b>有向面积</b>；面积为 0 ⇔ 两向量落在同一条直线上 ⇔ <b>共线</b>。点积 x₁x₂+y₁y₂ 是投影的乘积，它为 0 说明夹角 90°，是<b>垂直</b>。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="叉积为零时平行四边形面积为零">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<polygon points="24,104 76,96 98,40 46,48" fill="#b8791f" opacity="0.2" stroke="#b8791f"/>
<text x="108" y="60" font-size="9" fill="#3a3a35">det=0 ⇒ 面积 0</text>
<text x="108" y="80" font-size="9" fill="#3a3a35">⇒ a∥b</text>
</svg>
</div>
<div class="qac">
<p class="q">点积为 0 又是什么关系？</p>
<p class="a">a·b=|a||b|cosθ。a、b 非零时，a·b=0 ⇔ cosθ=0 ⇔ θ=90° ⇔ <b>垂直</b>。所以垂直判据是 x₁x₂+y₁y₂=0，不是叉积；做题先问「判共线还是判垂直」，再选式子。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="点积为零表示垂直">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="56" y1="100" x2="168" y2="100" stroke="#2563eb" stroke-width="2"/>
<polygon points="168,100 158,96 158,104" fill="#2563eb"/>
<line x1="56" y1="100" x2="56" y2="30" stroke="#b8791f" stroke-width="2"/>
<polygon points="56,30 52,40 60,40" fill="#b8791f"/>
<polygon points="56,86 70,86 70,100" fill="none" stroke="#2f8a5b" stroke-width="1.4"/>
<text x="82" y="52" font-size="9" fill="#3a3a35">a·b=0 ⇔ θ=90°</text>
<text x="82" y="72" font-size="9" fill="#3a3a35">点积判垂直</text>
</svg>
</div>
<div class="qac">
<p class="q">AB 的坐标，是终点 B 的坐标吗？</p>
<p class="a">不是。AB=(x₂−x₁, y₂−y₁)，<b>终点减起点</b>；只有位置向量 OA 的坐标才等于点 A 的坐标。平移不改变向量，所以可以把 AB 平移到原点，读出终点坐标。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="向量 AB 的坐标等于终点减起点">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="22" y="28" font-size="9" fill="#3a3a35">AB = OB − OA</text>
<circle cx="60" cy="92" r="3" fill="#151a21"/>
<circle cx="172" cy="56" r="3" fill="#151a21"/>
<line x1="60" y1="92" x2="172" y2="56" stroke="#2563eb" stroke-width="2"/>
<polygon points="172,56 161,55 164,63" fill="#2563eb"/>
<text x="22" y="118" font-size="9" fill="#5a6472">只有 OA 的坐标 = 点 A 的坐标</text>
</svg>
</div>
<div class="qac">
<p class="q">零向量能不能当基底？</p>
<p class="a">不能。0 与任何向量都<b>共线</b>，0=0·e₁+0·e₂ 的系数也不唯一，张不成平面。基底必须是同一平面内<b>两个不共线的非零向量</b>；这也是定理开头要先声明「不共线」的原因。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="零向量不能作基底">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="16" y="42" font-size="9" fill="#3a3a35">0 = 0·e₁ + 0·e₂</text>
<text x="16" y="68" font-size="9" fill="#3a3a35">系数不唯一，张不成平面</text>
<text x="16" y="94" font-size="9" fill="#b8402f">0 与任何向量共线</text>
</svg>
</div>
</div>
<p class="gx-note">六问其实是三件事：基底「不共线」，分解才「唯一」；<b>共线用叉积、垂直用点积</b>；坐标永远是「终点减起点」。考试把这三件事拆成六种问法，判据却只有这三条。</p>
</section>

<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 任意两个向量都能当基底。</p>
<p class="er-v">✓ 只有同一平面内两个不共线的非零向量才能作基底。</p>
<p class="er-w">错在哪：共线向量只张成一条直线，线外的向量表示不出，系数也不唯一。</p>
</div>
<div class="er">
<p class="er-x">✗ a∥b ⇔ x₁x₂+y₁y₂=0。</p>
<p class="er-v">✓ a∥b ⇔ x₁y₂−x₂y₁=0。</p>
<p class="er-w">错在哪：把叉积和点积拿反了；x₁x₂+y₁y₂=0 是<b>垂直</b>，不是共线。</p>
</div>
<div class="er">
<p class="er-x">✗ a⊥b ⇔ x₁y₂−x₂y₁=0。</p>
<p class="er-v">✓ a⊥b ⇔ x₁x₂+y₁y₂=0。</p>
<p class="er-w">错在哪：叉积管共线与面积，点积管垂直与夹角，两把尺子各有分工。</p>
</div>
<div class="er">
<p class="er-x">✗ 向量 AB 的坐标就是点 B 的坐标。</p>
<p class="er-v">✓ AB=(x₂−x₁, y₂−y₁)，终点坐标减起点坐标。</p>
<p class="er-w">错在哪：只有起点在原点时，位置向量的坐标才等于终点坐标；否则会整体平移错。</p>
</div>
<div class="er">
<p class="er-x">✗ a∥b，所以 a 与 b 一定同向。</p>
<p class="er-v">✓ a∥b 时 b=λa：λ&gt;0 同向，λ&lt;0 反向。</p>
<p class="er-w">错在哪：共线包含同向与反向两种，λ 的符号决定方向，不能默认同向。</p>
</div>
<div class="er">
<p class="er-x">✗ 分解的系数 λ₁、λ₂ 可以不唯一，取一组方便的就行。</p>
<p class="er-v">✓ 基底不共线时，λ₁、λ₂ 是唯一的一对。</p>
<p class="er-w">错在哪：唯一性正是「不共线」换来的；系数不唯一，坐标就没法定义。</p>
</div>
<div class="er">
<p class="er-x">✗ a·b = x₁y₂−x₂y₁。</p>
<p class="er-v">✓ a·b = x₁x₂+y₁y₂。</p>
<p class="er-w">错在哪：点积是「对应坐标相乘再相加」，叉积才是「交叉相乘再相减」，两个式子不能互换。</p>
</div>
