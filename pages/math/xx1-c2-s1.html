<p class="gx-lede">这一节是第二章的入口：后面点到直线的距离、两直线平行与垂直，全都要先会把「方向」翻译成数。翻译工具只有两件——倾斜角 α 和斜率 k=tanα，再加一条两点式公式。最容易错的一件事不是算错，而是<b>把「斜率不存在」写成 0</b>：0 是水平线（α=0°）的斜率，竖直线（α=90°）根本没有斜率，两者不是大小关系，是「有」和「没有」。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">倾斜角的定义与范围<span class="q-src">人教A版选择性必修第一册 · 第二章第一节</span></p>
<p class="q-b">当直线 l 与 x 轴相交时，我们以 x 轴为基准，x 轴正向与直线 l 向上的方向之间所成的角 α 叫做直线 l 的倾斜角。当直线 l 与 x 轴平行或重合时，我们规定它的倾斜角为 0°。因此，倾斜角的取值范围是 0°≤α&lt;180°。</p>
<p class="q-n">→ 三个条件：① 顶点取 l 与 x 轴的交点（平行或重合时规定 α=0°）；② 一条边固定为 x 轴正方向；③ 另一条边取直线<b>向上</b>的方向，量出最小正角。少一个就会量到另一个角。终点是开区间上界：α=180° 与 α=0° 是同一条直线，所以<b>范围不含 180°</b>，写成 0°≤α≤180° 就错了。</p>
</div>

<div class="gx-quote">
<p class="q-t">斜率的定义<span class="q-src">人教A版选择性必修第一册 · 第二章第一节</span></p>
<p class="q-b">直线 l 的倾斜角 α 的正切值叫做直线 l 的斜率，即 <span class="gx-fml">k = tan α（α ≠ 90°）</span>。当 α=90° 时，直线 l 的斜率不存在。</p>
<p class="q-n">→ 两个条件：① α 必须先算出来；② α≠90°。缺第二条，tan90° 没有定义，k 就<b>不存在</b>——不能补一个 0。0 是 α=0° 那条水平线的斜率，所以「k=0」和「k 不存在」是两种直线，一个躺平、一个站直。</p>
</div>

<div class="gx-quote">
<p class="q-t">经过两点的斜率公式<span class="q-src">人教A版选择性必修第一册 · 第二章第一节</span></p>
<p class="q-b">经过两点 P₁(x₁,y₁)、P₂(x₂,y₂)（x₁≠x₂）的直线的斜率公式为 <span class="gx-fml">k = (y₂ − y₁) / (x₂ − x₁)</span>。</p>
<p class="q-n">→ 只有一个条件：x₁≠x₂，即分母不为 0。x₁=x₂ 时两点连线是竖直线，α=90°，斜率不存在；公式不是「算不出来」，而是这条直线本来就没有斜率，答题时必须写这句话，不能写分母为 0 就算了。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>条件（缺一不可）</th><th>缺了会怎样</th></tr></thead>
<tbody>
<tr><td>从 x 轴正向逆时针量到直线向上方向，取最小正角</td><td>量成另一个方向的角，α 与 180°−α 互换，k 整体变号</td></tr>
<tr><td>0°≤α&lt;180°，<b>不含 180°</b></td><td>写成 α≤180°：同一条直线有了两个倾斜角，α 就不唯一</td></tr>
<tr class="key"><td>α≠90° 才能写 k=tanα</td><td>α=90° 时 tan 无定义 → 斜率<b>不存在</b>，写成 0 直接判错</td></tr>
<tr><td>两点式要求 x₁≠x₂</td><td>x₁=x₂ 时 Δx=0，分母为 0，斜率不存在（竖直线）</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只高亮一行：<b>α=90°</b>。判断斜率在不在，只问一句「α 是不是 90°」（用两点式时问「x₁ 是否等于 x₂」）；只要成立，答案就写「斜率不存在」，不写 k=…。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 由两点求斜率和倾斜角<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">已知直线 l 经过 A(1,2)、B(3,6) 两点。<br>（1）求直线 l 的斜率 k；（2）求直线 l 的倾斜角 α（精确到 0.1°）；<br>（3）若把 B 换成 B′(1,6)，直线 AB′ 的斜率与倾斜角各是什么？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题：求倾斜角，先求斜率</p>
<p class="s-b">倾斜角不能直接由两点读出，路线固定：两点 → 两点式求 k → 解 tanα=k → 按 k 的符号定 α 的范围。先检查 x₁≠x₂：1≠3，分母不为 0，斜率存在。</p>
<p class="s-k">用到：两点式的前提 x₁≠x₂；k=tanα 的前提 α≠90°。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 代两点式</p>
<p class="s-b"><span class="gx-fml">k = (y₂ − y₁) / (x₂ − x₁) = (6 − 2) / (3 − 1) = 4/2 = 2</span>。分子是纵坐标之差、分母是横坐标之差，顺序写反会得到 1/2。</p>
<p class="s-k">用到：k=(y₂−y₁)/(x₂−x₁)；与取 A 为 P₁ 还是 P₂ 无关。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 由 k 反求 α（判象限）</p>
<p class="s-b">由 <span class="gx-fml">tan α = 2</span> 且 k=2&gt;0，得 α∈(0°,90°)，在这个区间上 tan 单调递增，所以解唯一：α=arctan2≈63.4°。若算出 k=−2，则 α∈(90°,180°)，答案是 180°−arctan2≈116.6°，不是计算器上的 −63.4°。</p>
<p class="s-k">用到：k 的符号定 α 所在区间；tanα=m 求 α 要判象限，只按计算器会给错角。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 检验范围</p>
<p class="s-b">63.4° 落在 0°≤α&lt;180° 内，且不等于 90°，所以它确实是一个倾斜角；同时 k=2 是实数，说明斜率存在。两个条件都过，答案才算完。</p>
<p class="s-k">用到：倾斜角范围 [0°,180°)（不含 180°）；α=90° 时斜率不存在。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 变式：横坐标相等</p>
<p class="s-b">A(1,2)、B′(1,6) 满足 x₁=x₂=1，Δx=0，两点式分母为 0，斜率<b>不存在</b>；此时直线是竖直线，倾斜角 α=90°。答题要写「斜率不存在」，不能写 0，也不能写 ∞。</p>
<p class="s-k">用到：x₁=x₂ ⇒ 斜率不存在、α=90°；「不存在」与「等于 0」是两回事。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）因为 1≠3，所以直线 l 的斜率存在，<span class="gx-fml">k = (6 − 2) / (3 − 1) = 2</span>。<br>（2）设倾斜角为 α，则 <span class="gx-fml">tan α = 2</span>。因为 k=2&gt;0，所以 α∈(0°,90°)；在此区间内 tanα 单调递增，解唯一，<span class="gx-fml">α = arctan 2 ≈ 63.4°</span>。<br>（3）把 B 换成 B′(1,6) 后，x₁=x₂=1，Δx=x₂−x₁=0，两点式分母为 0，所以直线 AB′ 的斜率<b>不存在</b>；该直线垂直于 x 轴，倾斜角 α=90°。<br>答：k=2，α≈63.4°；变式的斜率不存在，α=90°。</p>
</div>
</div>
</section>
<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">倾斜角写成 0°≤α≤180° 行不行？多一个等号而已吧？</p>
<p class="a">不行。倾斜角范围是 <b>0°≤α&lt;180°，不含 180°</b>。α=180° 与 α=0° 指的是同一条水平线，把 180° 收进来，一条直线就有两个倾斜角，倾斜角就不再唯一。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="0 度和 180 度指向同一条水平线，180 度被打叉">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="26" y1="92" x2="208" y2="92" stroke="#2563eb" stroke-width="2"/>

<circle cx="214" cy="92" r="4" fill="#ffffff" stroke="#b8402f" stroke-width="1.8"/>

<text x="208" y="76" font-size="9" text-anchor="middle" fill="#b8402f">180°</text>
<text x="120" y="112" font-size="8.6" text-anchor="middle" fill="#5a6472">同一条直线，只有一个倾斜角</text>
</svg>
</div>
<div class="qac">
<p class="q">竖直线那么陡，斜率总该是 0 吧？或者无穷大？</p>
<p class="a">都不是。α=90° 时 tan90° 无定义，所以斜率<b>不存在</b>；0 是 α=0°（水平线）的斜率，∞ 不是实数，也不能写。答案只写三个字：不存在。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="竖直线倾斜角 90 度，斜率不存在">

<text x="24" y="66" font-size="8.8" fill="#5a6472">不是 0</text>
</svg>
</div>
<div class="qac">
<p class="q">两条直线斜率一样，它们就一定平行吗？</p>
<p class="a">两条直线斜率<b>都存在</b>且相等时，它们平行或重合（还要看是否同一条直线）；斜率都不存在时，两条都垂直于 x 轴，也平行或重合。反过来，平行直线的斜率不一定相等——两条竖直线就都没有斜率。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="两条斜率相同的平行直线">

</div>
<div class="qac">
<p class="q">由 tanα=−2 求 α，计算器给 −63.4°，直接抄行不行？</p>
<p class="a">不行。倾斜角必须落在 <b>[0°,180°)</b> 内，负数不是倾斜角。先看 k 的符号定象限：k&lt;0 ⇒ α∈(90°,180°)，所以 <span class="gx-fml">α = 180° − arctan 2 ≈ 116.6°</span>。k&gt;0 时 α∈(0°,90°)，直接取 arctan 值即可。</p>

<div class="qac">
<p class="q">水平线的倾斜角是 0° 还是 90°？它的斜率呢？</p>
<p class="a">与 x 轴平行或重合的直线，倾斜角规定为 <b>α=0°</b>，此时 k=tan0°=0，斜率存在且等于 0。90° 是竖直线，两条线正好差 90°，不要混。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 倾斜角的取值范围是 0°≤α≤180°。</p>
<p class="er-v">✓ 倾斜角的取值范围是 0°≤α&lt;180°，<b>不含 180°</b>。</p>
<p class="er-w">错在哪：180° 与 0° 是同一条水平线的两个名字，收进 180° 倾斜角就不唯一；考试填空只认左闭右开。</p>
</div>

  function fmt(k) {
    if (k === null) return "不存在";
    if (Math.abs(k) < 1e-9) return "0";
    var s = Math.abs(k) >= 10 ? k.toFixed(1) : k.toFixed(2);
    if (s.indexOf(".") >= 0) s = s.replace(/\.?0+$/, "");

  }

    g.oy = lf.y + lf.h - (wd ? 96 : 62);
    g.R = wd ? 146 : 88;
    g.axL = wd ? 172 : 126;
    g.axU = wd ? 292 : 188;
    g.axD = wd ? 72 : 48;
    g.x0 = rt.x + (wd ? 44 : 34);
    g.x1 = rt.x + rt.w - (wd ? 26 : 20);
    g.yc = rt.y + (wd ? 214 : 178);
    g.ys = wd ? 114 : 76;
    return g;
  }

  function Xa(a) { return G.x0 + (a / 180) * (G.x1 - G.x0); }
  function Yk(k) { return G.yc - (k / KMAX) * G.ys; }
  function P(a, k) { return Xa(a).toFixed(1) + "," + Yk(k).toFixed(1); }

  function arw(g, x1, y1, x2, y2) {

    el("polygon", { points: (x2 + ux * 6) + "," + (y2 + uy * 6) + " " + (x2 - ux * 5 - uy * 4.5) + "," + (y2 - uy * 5 + ux * 4.5) + " " + (x2 - ux * 5 + uy * 4.5) + "," + (y2 - uy * 5 - ux * 4.5), fill: C }, g);
  }
  function tic(g, x, y, w) { el("line", { x1: x, y1: y - w, x2: x, y2: y + w, stroke: C, "stroke-width": 1.3 }, g); }

  function branch(lo, hi) {

      p.push(P(a, k));
    }
    return p;
  }

  function draw() {
    var gA = $("gxA"), gB = $("gxB"), s = calc(A), g = G, lf = L.left, rt = L.right, i, p, kk, a1;

    arw(gA, g.ox - g.axL, g.oy, g.ox + g.axL + 2, g.oy);
    arw(gA, g.ox, g.oy + g.axD, g.ox, g.oy - g.axU - 2);
    var st = g.wd ? 38 : 27;
    for (i = 1; i <= 4; i++) { tic(gA, g.ox + i * st, g.oy, 3.5); tic(gA, g.ox - i * st, g.oy, 3.5); }
    tx(gA, g.ox - 16, g.oy + 16, "O", "#5a6472", "middle", 9.6, 400);
    tx(gA, g.ox + g.axL + 4, g.oy + 18, "x", "#5a6472", "middle", 9.6, 700);
    tx(gA, g.ox + 13, g.oy - g.axU + 4, "y", "#5a6472", "middle", 9.6, 700);

    /* 左：直线（α=90° 的竖直线单独画粗、变红） */
    var dx = Math.cos(s.rad), dy = -Math.sin(s.rad), vert = s.a === 90;
    if (s.a === 180) { dx = 1; dy = 0; }
    el("line", {
      x1: g.ox - dx * g.R * 0.4, y1: g.oy - dy * g.R * 0.4, x2: g.ox + dx * g.R, y2: g.oy + dy * g.R,
      stroke: vert ? "#b8402f" : "#2563eb", "stroke-width": vert ? 2.8 : 2.2
    }, gA);
    if (s.a > 0) {
      var r = g.wd ? 56 : 42, ex = g.ox + r * dx, ey = g.oy + r * dy, mrad = s.rad / 2, mr = r + (g.wd ? 24 : 18);
      el("path", { d: "M" + (g.ox + r) + "," + g.oy + " A" + r + "," + r + " 0 0 0 " + ex.toFixed(1) + "," + ey.toFixed(1), fill: "none", stroke: "#b8791f", "stroke-width": 1.8 }, gA);
      tx(gA, g.ox + mr * Math.cos(mrad), g.oy - mr * Math.sin(mrad) + 4, "α=" + s.a + "°", "#b8791f", "middle", 10.5, 700);
    }
    if (vert) el("path", { d: "M" + (g.ox + 14) + "," + g.oy + " L" + (g.ox + 14) + "," + (g.oy - 14) + " L" + g.ox + "," + (g.oy - 14), fill: "none", stroke: "#b8791f", "stroke-width": 1.4 }, gA);
    tx(gA, lf.x + 18, lf.y + lf.h - 18,
      s.a === 180 ? "180° 不是倾斜角：它与 0° 是同一条线" : (s.ok ? "k=" + fmt(s.k) + "，符号定上升或下降" : "α=90°：斜率不存在，不是 0"),

    if (s.ok) {

      el("line", { x1: mx - 6, y1: g.yc + 6, x2: mx + 6, y2: g.yc - 6, stroke: "#b8402f", "stroke-width": 2 }, gB);

    }

  }

    var s = calc(A), st, col, bg, sn;

    $("gxVb").textContent = s.ok ? fmt(s.k) : "不存在";
    $("gxVc").textContent = s.dir;

    else if (s.a === 0) { st = "存在"; col = "#2f8a5b"; bg = "#e6f6ee"; sn = "k=0，水平线"; }
    else if (s.a < 90) { st = "存在"; col = "#2563eb"; bg = "#eaf1fe"; sn = "k>0，直线上升"; }
    else { st = "存在"; col = "#b8791f"; bg = "#fdf3e0"; sn = "k<0，直线下降"; }

    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    $("gxVb").style.color = s.ok ? "#151a21" : col;
    draw();
  }

    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    G = geom();
    stage.setAttribute("viewBox", L.vb);
    render();
  }
