<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">二项式定理<span class="q-src">人教A版选择性必修第三册 · 第六章第3节</span></p>
<p class="q-b">一般地，对于任意正整数 n，都有 (a+b)ⁿ=C(n,0)aⁿ+C(n,1)aⁿ⁻¹b+…+C(n,k)aⁿ⁻ᵏbᵏ+…+C(n,n)bⁿ。这个公式叫做二项式定理，右边的多项式叫做 (a+b)ⁿ 的二项展开式。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个条件</b>组成。① n 是正整数，展开式一共 n+1 项；② 每一项里 a 的指数从 n 一路降到 0、b 的指数从 0 一路升到 n；③ 任何一项的两个指数加起来都恰好等于 n。少记第 ② 条，通项就会写反；少记第 ③ 条，就查不出自己写反了。</p>
</div>

<div class="gx-quote">
<p class="q-t">二项展开式的通项公式<span class="q-src">人教A版选择性必修第三册 · 第六章第3节</span></p>
<p class="q-b">展开式中的第 k+1 项叫做二项展开式的通项，即 T(k+1)=C(n,k)aⁿ⁻ᵏbᵏ（k=0,1,2,…,n）。</p>
<p class="q-n">→ 翻成人话：注意两件事。第一，下标是 k+1 而不是 k，因为 k 从 0 开始数；第二，<b>a 的指数是 n−k、b 的指数是 k</b>，永远 a 在前面降、b 在后面升，顺序反了整项就错。</p>
</div>

<div class="gx-quote">
<p class="q-t">二项式系数的性质<span class="q-src">人教A版选择性必修第三册 · 第六章第3节</span></p>
<p class="q-b">C(n,0)+C(n,1)+…+C(n,n)=2ⁿ；展开式中二项式系数最大的项是中间项，n 为偶数时是第 n/2+1 项，n 为奇数时是第 (n+1)/2 项与第 (n+3)/2 项。</p>
<p class="q-n">→ 翻成人话：这条性质是把 a=b=1 代进去得到的，所以<b>二项式系数之和是 2ⁿ 不是 2n</b>；而「最大的是哪一项」必须先看 n 的奇偶——n 偶只有一项最大，n 奇有两项并列最大。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>条件</th><th>缺了它 / 记错它会怎样</th></tr></thead>
<tbody>
<tr><td>n 是正整数，展开式共 n+1 项</td><td>数成 n 项，后面数项数、定中间项位置全跟着错</td></tr>
<tr><td>通项里 a 的指数是 n−k、b 的指数是 k</td><td>两个指数写反，令 6−k=3 变成令 k=3 之外的错式，x³ 的系数直接算不出来</td></tr>
<tr><td>每一项两个指数之和等于 n</td><td>丢掉这个自检，写反了也发现不了</td></tr>
<tr class="key"><td>中间项位置看 n 的奇偶</td><td>n 偶 → 第 n/2+1 项；n 奇 → 第 (n+1)/2 与第 (n+3)/2 两项并列最大。一律写成「第 n/2 项」必错</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只高亮 1 行：真正的坎是<b>中间项位置</b>，它由 n 的奇偶决定，不由系数大小决定。背法只有一句——先把通项 T(k+1)=C(n,k)aⁿ⁻ᵏbᵏ 写出来，再往里面塞数字；不要背展开式的长相。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 求指定次项的系数并判断系数最大的项<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">已知 (2x+1)⁶。(1) 求展开式中 x³ 的系数；(2) 求展开式中二项式系数最大的项，并说明该项的系数是否为所有项系数中最大的。<b>陷阱</b>：第 (2) 问两问只差「二项式」三个字，答案不一定相同。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 写通项，别展开</p>
<p class="s-b">把 a 看成 2x、b 看成 1，n=6，直接套通项公式：T(k+1)=C(6,k)(2x)⁶⁻ᵏ·1ᵏ。括号里是两个数的和，所以 a 的指数是 n−k=6−k、b 的指数是 k，这里 b=1 不影响 x 的次数。</p>
<p class="s-k">用到：通项公式 T(k+1)=C(n,k)aⁿ⁻ᵏbᵏ。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 只要 x，先列指数方程</p>
<p class="s-b">x 的指数来自 (2x)⁶⁻ᵏ，等于 6−k。要求 x³，就令 6−k=3，解得 k=3。注意方程左边是 6−k 而不是 k——通项里 a 的指数是 n−k、b 的指数是 k，写反就会解出 k=3 之外的另一个数。</p>
<p class="s-k">用到：指数方程 6−k=3；a 的指数是 n−k。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 算出系数，别漏前面的 2</p>
<p class="s-b">k=3 时该项为 C(6,3)(2x)³·1³=20·8x³=160x³。系数是 C(6,3)×2³=20×8=160。如果只写 C(6,3)=20，就把 2³=8 漏掉了。</p>
<p class="s-k">用到：C(6,3)=20；项的系数 = 二项式系数 × 数字系数的幂。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 第 (2) 问先定位，再算值</p>
<p class="s-b">n=6 是偶数，二项式系数最大的项是第 n/2+1=4 项，即 k=3 那一项，二项式系数为 C(6,3)=20。该项为 C(6,3)(2x)³=160x³。这里必须说明「中间项看 n 的奇偶」，n 偶只有一项最大。</p>
<p class="s-k">用到：n 偶 → 第 n/2+1 项；二项式系数最大是 C(6,3)=20。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 回答「是不是系数最大」</p>
<p class="s-b">二项式系数最大在第 4 项，但项的系数还要乘 2⁶⁻ᵏ。逐项算：64, 192, 240, 160, 60, 12, 1，最大的是第 3 项 240，不是第 4 项。所以第 (2) 问的两小问答案不同，必须分开答。</p>
<p class="s-k">用到：二项式系数 ≠ 项的系数；系数和是另一个数（729=3⁶）。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">(1) 通项 T(k+1)=C(6,k)(2x)⁶⁻ᵏ·1ᵏ=C(6,k)·2⁶⁻ᵏ·x⁶⁻ᵏ。令 6−k=3，得 k=3。故 x³ 的系数为 C(6,3)×2³=20×8=160。<br>(2) n=6 为偶数，二项式系数最大的项为第 n/2+1=4 项，即 T₄=C(6,3)(2x)³=160x³，二项式系数为 20。各项系数依次为 64, 192, 240, 160, 60, 12, 1，故系数最大的项是第 3 项 T₃=C(6,2)(2x)⁴=15×16x⁴=240x⁴，系数为 240。结论：二项式系数最大的项是第 4 项，系数最大的项是第 3 项，两者不同。</p>
</div>
</div>
</section>

<p class="a">固定写法：<b>a 的指数是 n−k、b 的指数是 k</b>，两者之和恒等于 n。k 从 0 数到 n；看到 a 在前面，指数就从 n 开始降。</p>

<p class="a">不是。二项式系数只是 C(n,k)，和恒为 <b>2ⁿ</b>；项的系数要把 a、b 自带的数字乘进去，(1+2x)⁶ 的系数和是 <b>3⁶=729</b>，两者的最大项都可能不在同一项。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="二项式系数与项的系数两行对照，和分别为 64 与 729">

<text x="16" y="52" font-size="8.5" fill="#8b95a3">和 = 64 = 2⁶，最大 20</text>

<div class="qac">
<p class="q">「n 为偶数时，到底是第几项的二项式系数最大？」</p>
<p class="a">n 为偶数时是第 <b>n/2+1</b> 项（只有一项）；n 为奇数时第 (n+1)/2 项与第 (n+3)/2 项并列最大。<b>中间项看 n 的奇偶</b>，不看系数大小去猜。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="n 偶数时正中一项最大，n 奇数时中间两项并列最大">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="16" y="32" font-size="9" fill="#3a3a35">n=6：1 6 15 20 15 6 1</text>
<rect x="104" y="40" width="30" height="18" rx="4" fill="#e6f6ee" stroke="#8fd0ae"/>
<text x="119" y="53" text-anchor="middle" font-size="9" fill="#1c6b45">20</text>
<text x="150" y="53" font-size="8.6" fill="#1c6b45">第 4 项</text>
<text x="16" y="82" font-size="9" fill="#3a3a35">n=5：1 5 10 10 5 1</text>
<rect x="86" y="90" width="52" height="18" rx="4" fill="#fdf3e0" stroke="#e8c182"/>
<text x="112" y="103" text-anchor="middle" font-size="9" fill="#b8791f">10 10</text>
<text x="150" y="103" font-size="8.6" fill="#b8791f">第 3、4 项</text>
</svg>
</div>
<div class="qac">
<p class="q">「常数项怎么求？为什么我总是算成 x 的一次项？」</p>
<p class="a">常数项就是 x 的指数为 <b>0</b> 的那一项：先写通项、把 x 的指数整理成关于 k 的式子，再令它等于 0 解出 k。忘记「指数为 0」这个条件，就会停在某个错误的 k 上。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="常数项由令 x 的指数等于 0 求出">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="16" y="34" font-size="9" fill="#3a3a35">x 的指数 → 关于 k 的式子</text>
<text x="16" y="60" font-size="9.5" fill="#3a3a35">令指数 = 0</text>
<text x="16" y="86" font-size="9.5" fill="#2f8a5b">解出整数 k → 常数项</text>
<text x="16" y="112" font-size="8.6" fill="#b8402f">k 不是整数 ⇒ 无常数项</text>
</svg>
</div>
<div class="qac">
<p class="q">「杨辉三角相邻两行，除了看还能干什么？」</p>
<p class="a">下一行每个数等于<b>肩上两个数之和</b>，翻译成组合数就是 C(n,k)=C(n−1,k−1)+C(n−1,k)；行内对称给出 C(n,k)=C(n,n−k)。这两条是化简与证明系数组的入口。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="杨辉三角中下一行的数等于肩上两数之和">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="70" y="38" text-anchor="middle" font-size="10" fill="#5a6472">10</text>
<text x="170" y="38" text-anchor="middle" font-size="10" fill="#5a6472">10</text>
<path d="M78 44 L112 70" stroke="#8b95a3" stroke-width="1.2" fill="none"/>
<path d="M162 44 L128 70" stroke="#8b95a3" stroke-width="1.2" fill="none"/>
<text x="120" y="82" text-anchor="middle" font-size="11" font-weight="700" fill="#1c6b45">20</text>
<text x="120" y="108" text-anchor="middle" font-size="8.6" fill="#5a6472">C(n,k)=C(n−1,k−1)+C(n−1,k)</text>
</svg>
</div>
</div>
<p class="gx-note">六问其实是同一件事：所有答案都从同一行通项 T(k+1)=C(n,k)aⁿ⁻ᵏbᵏ 出发。指数分配记住 a 降 b 升（a 的指数是 n−k、b 的指数是 k）；系数和靠赋值，得 2ⁿ 不是 2n；最值靠 n 的奇偶定位，再看是否要乘数字系数。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 通项写成 T(k+1)=C(n,k)aᵏbⁿ⁻ᵏ。</p>
<p class="er-v">✓ T(k+1)=C(n,k)aⁿ⁻ᵏbᵏ（k=0,1,…,n）。</p>
<p class="er-w">错在哪：把 a、b 的指数写反了。<b>a 的指数是 n−k、b 的指数是 k</b>，自检办法是两项指数之和必须等于 n；写反时求和也对，但解出的 k 全错。</p>
</div>
<div class="er">
<p class="er-x">✗ 二项式系数之和为 2n。</p>
<p class="er-v">✓ C(n,0)+C(n,1)+…+C(n,n)=2ⁿ。</p>
<p class="er-w">错在哪：漏了「赋值」这一步，把 2ⁿ 记成 2n。n=4 时正确值是 16 而 2n 只有 8，<b>系数和是 2ⁿ 不是 2n</b>。</p>
</div>
<div class="er">
<p class="er-x">✗ (1+2x)⁶ 的系数和是 2⁶=64。</p>
<p class="er-v">✓ 二项式系数和是 2⁶=64；各项系数之和令 x=1，得 3⁶=729。</p>
<p class="er-w">错在哪：把二项式系数当成项的系数。括号里的 2 也要跟着乘，二项式系数和是 2ⁿ，项的系数和是 (1+2)ⁿ。</p>
</div>
<div class="er">
<p class="er-x">✗ n=6 时二项式系数最大的是第 3 项。</p>
<p class="er-v">✓ n=6 为偶数，二项式系数最大的是第 n/2+1=4 项。</p>
<p class="er-w">错在哪：项序与 k 差 1，而且<b>中间项看 n 的奇偶</b>：n 偶是第 n/2+1 项，n 奇是第 (n+1)/2 与第 (n+3)/2 两项。</p>
</div>
<div class="er">
<p class="er-x">✗ 求常数项时，令 C(n,k) 中的 k=0。</p>
<p class="er-v">✓ 令含 x 那部分的指数整体等于 0，解出 k。</p>
<p class="er-w">错在哪：常数项由 x 的指数为 0 决定，不由 k 是否为 0 决定；k=0 那一项通常是 x 的最高次项，恰好相反。</p>
</div>
<div class="er">
<p class="er-x">✗ (2x+1)⁶ 中 x³ 的系数是 C(6,3)=20。</p>
<p class="er-v">✓ 是 C(6,3)×2³=20×8=160。</p>
<p class="er-w">错在哪：<b>忘记 C(n,k) 前的数字系数</b>。a=2x 的 2 要连同指数一起算，(2x)³ 的系数是 8 不是 1。</p>
</div>
<div class="er">
<p class="er-x">✗ (a+b)⁶ 的展开式共有 6 项。</p>
<p class="er-v">✓ 共有 n+1=7 项，末项是 C(6,6)b⁶。</p>
<p class="er-w">错在哪：项数比 n 多 1，因为 k 从 0 取到 n；数错项数会让中间项位置、末项编号全跟着错。</p>
</div>
</div>

<script>
/* 互动脚本本体（由 build-page.mjs 包进 <script> 里，所以这里不要写 <script> 标签） */
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var GX = window.GX, el = GX.el, tx = GX.tx, $ = GX.$;
  var stage = $("gxStage");
  if (!stage || !window.AutoPilot) return;

  /* 两套坐标：宽屏 880×470，窄屏独立 360×700 */
  var W = { vb: "0 0 880 470", left: { x: 16, y: 16, w: 424, h: 438 }, right: { x: 456, y: 16, w: 408, h: 438 } };
  var N = { vb: "0 0 360 700", left: { x: 8, y: 8, w: 344, h: 300 }, right: { x: 8, y: 320, w: 344, h: 372 } };
  var L = W, A = 0, G = null;

  /* 组合数 C(n,k)，连乘实现 */
  function C(n, k) {
    if (k < 0 || k > n) return 0;
    var r = 1, i;
    for (i = 1; i <= k; i++) r = r * (n - k + i) / i;
    return Math.round(r);
  }

  /* 纯函数：n → 数值。render() 和 __model.cases 都用它 */
  function calc(v) {
    var n = Math.max(0, Math.min(6, Math.round(v)));
    var row = [], k;
    for (k = 0; k <= n; k++) row.push(C(n, k));
    var sum = 0;
    for (k = 0; k < row.length; k++) sum += row[k];
    var mid = C(n, Math.floor(n / 2));
    return { n: n, row: row, sum: sum, mid: mid, terms: n + 1, exp: Math.pow(2, n) };
  }

  function geom() {
    if (L === N) {
      return {
        tri: { cx: 180, y0: 58, dy: 30, sp: 44, bw: 36, bh: 22 },
        bar: { x0: 46, base: 628, k: 250 / 64, step: 43, bw: 28 }
      };
    }
    return {
      tri: { cx: 228, y0: 78, dy: 40, sp: 46, bw: 38, bh: 24 },
      bar: { x0: 500, base: 372, k: 276 / 64, step: 44, bw: 32 }
    };
  }

  /* 中文按字数换行，避免长句冲出面板 */
  function wrap(parent, x, y, s, maxW, fs, col, lh) {
    var per = Math.max(6, Math.floor(maxW / fs)), lines = [], cur = "";
    for (var i = 0; i < s.length; i++) { cur += s.charAt(i); if (cur.length >= per) { lines.push(cur); cur = ""; } }
    if (cur) lines.push(cur);
    for (var k = 0; k < lines.length; k++) tx(parent, x, y + k * lh, lines[k], col, "start", fs, 400);
  }

  function draw(s) {
    var gA = $("gxA"), gB = $("gxB"), p = L.left, q = L.right, T = G.tri, B = G.bar;
    gA.textContent = ""; gB.textContent = "";
    el("rect", { x: p.x, y: p.y, width: p.w, height: p.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    el("rect", { x: q.x, y: q.y, width: q.w, height: q.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    tx(gA, p.x + 18, p.y + 26, "杨辉三角 · 第 " + s.n + " 行（n+1 = " + s.terms + " 个数）", "#5a6472", "start", 10.5, 700);
    tx(gB, q.x + 18, q.y + 26, "系数和 2ⁿ：n 每加 1 就翻一倍", "#5a6472", "start", 10.5, 700);

    /* 左：杨辉三角长到第 n 行，最大系数标绿 */
    var r, k, cx, cy, val, isMid;
    for (r = 0; r <= s.n; r++) {
      for (k = 0; k <= r; k++) {
        cx = T.cx - (r * T.sp) / 2 + k * T.sp;
        cy = T.y0 + r * T.dy;
        val = C(r, k);
        isMid = (r === s.n) && (val === s.mid);
        el("rect", {
          x: cx - T.bw / 2, y: cy - T.bh / 2, width: T.bw, height: T.bh, rx: 5,
          fill: r === s.n ? (isMid ? "#e6f6ee" : "#eaf0fb") : "#ffffff",
          stroke: r === s.n ? (isMid ? "#8fd0ae" : "#b6c9ea") : "#e2e8ef"
        }, gA);
        tx(gA, cx, cy + 4, String(val),
          r === s.n ? (isMid ? "#1c6b45" : "#2563eb") : "#7b8694",
          "middle", isMid ? 11 : 9.6, isMid ? 700 : 400);
      }
    }
    tx(gA, p.x + 18, p.y + p.h - 46, "首尾为 1、左右对称；中间项看 n 的奇偶", "#7b8694", "start", 9.2, 400);
    tx(gA, p.x + 18, p.y + p.h - 28, "最大系数 C(n,⌊n/2⌋) = " + s.mid, "#1c6b45", "start", 9.2, 700);

    /* 右：2ⁿ 的柱状图，坐标轴带箭头与刻度 */
    var xEnd = B.x0 + 6 * B.step + B.bw / 2 + 10;
    el("line", { x1: B.x0 - 26, y1: B.base, x2: xEnd, y2: B.base, stroke: "#9aa5b1", "stroke-width": 1.2 }, gB);
    el("polygon", { points: xEnd + "," + (B.base - 4) + " " + (xEnd + 8) + "," + B.base + " " + xEnd + "," + (B.base + 4), fill: "#9aa5b1" }, gB);
    el("line", { x1: B.x0 - 26, y1: B.base, x2: B.x0 - 26, y2: B.base - 64 * B.k - 30, stroke: "#9aa5b1", "stroke-width": 1.2 }, gB);
    for (r = 0; r <= 6; r++) {
      var h = Math.pow(2, r) * B.k, bx = B.x0 + r * B.step, on = r <= s.n;
      el("rect", {
        x: bx - B.bw / 2, y: B.base - h, width: B.bw, height: h, rx: 3,
        fill: r === s.n ? "#2563eb" : (on ? "#9dc0f0" : "#e8edf4"),
        stroke: r === s.n ? "#2563eb" : (on ? "#9dc0f0" : "#e8edf4")
      }, gB);
      tx(gB, bx, B.base - h - 6, String(Math.pow(2, r)), r === s.n ? "#2563eb" : "#8b95a3", "middle", 8.6, r === s.n ? 700 : 400);
      tx(gB, bx, B.base + 14, String(r), r === s.n ? "#2563eb" : "#8b95a3", "middle", 8.6, r === s.n ? 700 : 400);
    }
    tx(gB, B.x0 - 36, B.base - 64 * B.k - 40, "和", "#8b95a3", "start", 9, 400);
    tx(gB, xEnd - 6, B.base + 14, "n", "#8b95a3", "middle", 9, 400);
    tx(gB, q.x + 18, q.y + q.h - 42, "n=4：1+4+6+4+1 = 16 = 2⁴", "#1c6b45", "start", 9.4, 700);
    tx(gB, q.x + 18, q.y + q.h - 24, "系数和是 2ⁿ 不是 2n：2n 只有 8", "#b8402f", "start", 9.4, 700);
  }

  function render() {
    if (!G) { L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N; G = geom(); stage.setAttribute("viewBox", L.vb); }
    A = Math.max(0, Math.min(6, Math.round(A)));
    var s = calc(A), st, col, bg, sn;
    $("gxVa").textContent = String(s.n);
    $("gxVb").textContent = String(s.sum);
    $("gxVc").textContent = String(s.mid);
    if (s.n === 0) {
      st = "只有一项"; col = "#2563eb"; bg = "#eaf0fb"; sn = "(a+b)⁰=1，系数和 1";
    } else if (s.n % 2 === 0) {
      st = "系数成对对称"; col = "#2f8a5b"; bg = "#e6f6ee";
      sn = "中间的 " + s.mid + " 最大（第 " + (s.n / 2 + 1) + " 项）";
    } else {
      st = "中间两项并列"; col = "#b8791f"; bg = "#fdf3e0";
      sn = "第 " + (s.n + 1) / 2 + "、第 " + (s.n + 3) / 2 + " 项并列，最大 " + s.mid;
    }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    draw(s);
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    G = geom();
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 0 }, { t: 1.2, v: 0 }, { t: 4, v: 4 }, { t: 6.5, v: 4 }, { t: 9, v: 6 }, { t: 11.5, v: 3 }, { t: 13.5, v: 0 }],
    keys: [0, 4, 6],
    value: A, min: 0, max: 6, step: 1,
    idle: 5000,
    onChange: function (v) { A = Math.round(v); render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc, cases: [
    { v: 2, eq: { sum: 4, mid: 2 } },
    { v: 4, eq: { sum: 16, mid: 6 } },
    { v: 6, eq: { sum: 64, mid: 20 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
