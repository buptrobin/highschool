<p class="gx-lede">这一节是第五章的开头：先把「角」从 0°–360° 的框里放出来，允许任意大小、允许负；再换一把更省事的尺子——弧度制。后面所有三角函数（诱导公式、图象、周期性）都建在这两个约定上：象限决定符号，弧度决定公式长什么样。最容易错的一件事：以为转了一整圈角就不一样了，其实 390° 和 30° 的终边完全重合，它们只差 360° 的整数倍。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 任意角与象限角<span class="q-src">人教A版必修第一册 · 第五章第一节</span></p>
<p class="q-b">一条射线绕它的端点旋转，按逆时针方向旋转形成的角叫做正角，按顺时针方向旋转形成的角叫做负角；如果一条射线没有作任何旋转，就称它形成了一个零角。使角的顶点与原点重合，角的始边与 x 轴的非负半轴重合，那么角的终边在第几象限，就说这个角是第几象限角。</p>
<p class="q-n">→ 翻成人话：判象限角要同时满足<b>三个条件</b>：① 顶点在原点；② 始边与 x 轴非负半轴重合；③ 终边落在某个象限的<b>内部</b>。第 ③ 条的重点是「内部」——终边压在坐标轴上时，这个角哪个象限都不属于，它叫<b>轴线角</b>，<b>轴线角不算象限角</b>。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 终边相同的角<span class="q-src">人教A版必修第一册 · 第五章第一节</span></p>
<p class="q-b">所有与角 α 终边相同的角，连同角 α 在内，可构成一个集合 S = {β | β = α + k·360°，k∈Z}，即任一与角 α 终边相同的角，都可以表示成角 α 与整数个周角的和。</p>
<p class="q-n">→ 这句话只有两个零件：<b>k∈Z</b> 和 <b>360°</b>。漏了 k∈Z，你只写出了「加一圈」的那一个角；把 360° 写成 180°，你写出的就不是终边相同的角，而是终边关于原点对称的角。判据只有一句：<b>终边相同的角差 360° 的整数倍</b>。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 弧度制<span class="q-src">人教A版必修第一册 · 第五章第一节</span></p>
<p class="q-b">长度等于半径长的圆弧所对的圆心角叫做 1 弧度的角，记作 1 rad；用弧度作单位来度量角的制度叫做弧度制。半径为 r 的圆的圆心角 α 所对弧的长为 l，则 <span class="gx-fml">|α| = l / r</span>。由此得到弧长公式 <span class="gx-fml">l = |α|·r</span>，扇形面积公式 <span class="gx-fml">S = ½ l r</span>。</p>
<p class="q-n">→ 三个信息：① 1 rad 是「弧长 = 半径」对出来的角，与圆画多大无关；② 它等于比值 l/r，所以弧度数是一个<b>没有单位</b>的实数；③ <span class="gx-fml">π rad = 180°</span>，度化弧度乘 π/180。正因为 α 是纯数，<b>弧长公式里的角必须用弧度</b>，代 60° 进去就全错。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>条件（缺一不可）</th><th>缺了会怎样</th></tr></thead>
<tbody>
<tr><td>顶点在原点，始边与 x 轴非负半轴重合</td><td>同一根终边会被读成不同的角，象限判断失去统一口径</td></tr>
<tr><td>终边落在象限的<b>内部</b></td><td>0°、90°、180°、270° 这些压轴的角没有象限，<b>轴线角不算象限角</b></td></tr>
<tr class="key"><td>β = α + k·360°，<b>k∈Z</b></td><td>少写 k∈Z 只得到「加一圈」一个角；写成 180° 则差 180°，终边根本不同</td></tr>
<tr><td>弧长公式 l = |α|·r 中 α 用弧度</td><td>把 60 当度数代进去，弧长会放大到 57 倍多，整题作废</td></tr>
<tr><td>度化弧度乘 π/180，弧度化度乘 180/π</td><td>方向乘反或漏乘 π，答案差一个 π 的因子</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">背法：<b>看终边 → 先减整圈 → 再看落在哪</b>。减整圈就是把角写成 α + k·360°，减到 0°–360° 之间再看；落在象限里才有象限号，压在坐标轴上就写「轴线角」。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 负角化弧度并写终边相同的角<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">（1）把 <b>−120°</b> 化为弧度；（2）判断 −120° 是第几象限角；（3）写出与 −120° 终边相同的角的集合。陷阱：负角的「顺时针」方向和集合里 k∈Z 的写法。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定性</p>
<p class="s-b">负号只说明旋转方向是顺时针，不改变它可以化成弧度、也可以有象限这一事实；先老老实实做度化弧度，再判终边，最后写集合。</p>
<p class="s-k">用到：正角、负角、零角的规定；度化弧度 × π/180。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 度化弧度</p>
<p class="s-b">−120° = −120 × π/180 = −2π/3。分子分母同除 60，别急着写 −120π/180 当答案。</p>
<p class="s-k">用到：<span class="gx-fml">1° = π/180 rad</span>，结果保留 π。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 判象限（先减整圈）</p>
<p class="s-b">−120° 终边与 −120° + 360° = 240° 相同；240° 落在 180° 与 270° 之间，在第三象限内部，且 240° 不是 90° 的整数倍，不是轴线角，所以 −120° 是<b>第三象限角</b>。</p>
<p class="s-k">用到：判象限先把它写成 α + k·360°（0° ≤ α &lt; 360°）的形式。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 写终边相同的角的集合</p>
<p class="s-b">在弧度制下，「一圈」是 2π，所以集合写成 {β | β = −2π/3 + 2kπ，k∈Z}。如果要写角度制版本，就是 {β | β = −120° + k·360°，k∈Z}；两种写法不能混用单位。</p>
<p class="s-k">用到：S = {β | β = α + k·360°，k∈Z}，弧度制下把 360° 换成 2π。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 回代验算</p>
<p class="s-b">取 k = 1：−2π/3 + 2π = 4π/3（即 240°），与 −120° 终边相同，正确。再取 k = 0 得 −2π/3 本身，说明 α 也在集合里。</p>
<p class="s-k">用到：终边相同的角差 2π 的整数倍（角度制下差 360° 的整数倍）。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）−120° = −120 × π/180 = <span class="gx-fml">−2π/3</span>。<br>（2）因为 −120° + 360° = 240°，240° 在 180° 与 270° 之间，所以 −120° 是<b>第三象限角</b>（不是轴线角）。<br>（3）与它终边相同的角的集合为 <span class="gx-fml">{β | β = −2π/3 + 2kπ，k∈Z}</span>；写成角度制为 {β | β = −120° + k·360°，k∈Z}。<br>得分点：π/180 的换算方向、k∈Z 必须写、2π 与 360° 不能混用。</p>
</div>
</div>
</section>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「两个角终边相同，它们的差到底是多少？」</p>
<p class="a">差是 <b>360° 的整数倍</b>（弧度制下是 2π 的整数倍），不是 180°，也不是「差不多一整圈」。差 180° 的两根终边是反向延长线，永远不重合。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="同一终边上的两个角相差360度">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<circle cx="74" cy="68" r="34" fill="none" stroke="#cfd8e3" stroke-width="1.2"/>
<line x1="74" y1="68" x2="103.4" y2="51" stroke="#2563eb" stroke-width="2"/>
<circle cx="103.4" cy="51" r="3" fill="#2563eb"/>
<text x="110" y="48" font-size="9" fill="#2563eb">30°</text>
<text x="110" y="62" font-size="9" fill="#b8791f">390°</text>
<text x="120" y="118" font-size="9" fill="#3a3a35" text-anchor="middle">差 360° 的整数倍</text>
</svg>
</div>

<div class="qac">
<p class="q">「90°、180° 的终边那么特殊，算第几象限角？」</p>
<p class="a">都不算。<b>轴线角不算象限角</b>——终边落在 x 轴或 y 轴上时，这个角不属于任何象限。所有轴线角可以统一写成 β = k·90°（k∈Z），答题时就写「轴线角（不在任何象限）」。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="终边压在坐标轴上的轴线角">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="40" y1="80" x2="200" y2="80" stroke="#8a97a6" stroke-width="1.2"/>
<line x1="120" y1="112" x2="120" y2="30" stroke="#8a97a6" stroke-width="1.2"/>
<text x="204" y="84" font-size="9" fill="#5a6472">x</text>
<text x="126" y="32" font-size="9" fill="#5a6472">y</text>
<text x="56" y="56" font-size="9" fill="#b8791f">终边压轴</text>
<text x="56" y="100" font-size="9" fill="#b8402f">不算象限角</text>
</svg>
</div>

<div class="qac">
<p class="q">「1 rad 到底是多少度？能直接说 1 rad = 1° 吗？」</p>
<p class="a">不能。<span class="gx-fml">π rad = 180°</span>，所以 <span class="gx-fml">1 rad = 180/π ≈ 57.30°</span>。rad 是个提醒你「这是弧度数」的记号，弧度数本身没有单位。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="1弧度约等于57.30度">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<path d="M 100 92 A 40 40 0 0 0 81.6 58.3" fill="none" stroke="#b8791f" stroke-width="1.6"/>
<text x="108" y="52" font-size="9.4" fill="#b8402f">1 rad ≈ 57.30°</text>
<text x="108" y="70" font-size="9.4" fill="#3a3a35">π rad = 180°</text>
<text x="108" y="90" font-size="9" fill="#7a8794">换算系数 180/π</text>
</svg>
</div>

<div class="qac">
<p class="q">「弧长公式 l = |α|r，α 可以填 60° 吗？」</p>
<p class="a">不行，<b>弧长公式里的角必须用弧度</b>。60° 要先化成 π/3 再代。填 60 进去，等于把角放大成 60 rad，结果错 57 倍多。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="弧长公式中的角要用弧度">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="46" font-size="10" fill="#1d4ed8" text-anchor="middle">l = |α| · r</text>
<text x="120" y="70" font-size="9" fill="#2f8a5b" text-anchor="middle">α 填弧度，如 π/3</text>
<text x="120" y="94" font-size="9" fill="#b8402f" text-anchor="middle">α 填角度 ⇒ 公式失效</text>
</svg>
</div>

<div class="qac">
<p class="q">「−120° 是负角，那它还有象限吗？」</p>
<p class="a">有。负角只是顺时针转出来的角，照样能判终边：−120° + 360° = 240°，终边落在第三象限内部，所以是<b>第三象限角</b>；它也不是轴线角（240 不是 90 的整数倍）。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="负120度化为240度落在第三象限">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="56" y1="80" x2="188" y2="80" stroke="#8a97a6" stroke-width="1.2"/>
<line x1="120" y1="112" x2="120" y2="30" stroke="#8a97a6" stroke-width="1.2"/>
<line x1="120" y1="80" x2="101" y2="113" stroke="#b8402f" stroke-width="2"/>
<text x="134" y="34" font-size="9" fill="#b8402f">−120°</text>
<text x="134" y="50" font-size="9" fill="#3a3a35">= 240°</text>
<text x="134" y="66" font-size="9" fill="#2f8a5b">第 Ⅲ 象限</text>
</svg>
</div>

<div class="qac">
<p class="q">「S = ½lr 和 S = ½|α|r²，考试写哪个？」</p>
<p class="a">两个都对，是同一个式子：把 <span class="gx-fml">l = |α|r</span> 代进 <span class="gx-fml">S = ½lr</span> 就得到 <span class="gx-fml">S = ½|α|r²</span>。已知弧长用第一个，已知圆心角用第二个；两者都要求 α <b>用弧度</b>。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="扇形面积的两个公式">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="44" font-size="10" fill="#1d4ed8" text-anchor="middle">S = ½ l r</text>
<text x="120" y="66" font-size="10" fill="#1d4ed8" text-anchor="middle">S = ½ |α| r²</text>
<text x="120" y="94" font-size="9" fill="#2f8a5b" text-anchor="middle">把 l = |α|r 代进去即得</text>
</svg>
</div>
</div>
<p class="gx-note">六问其实是同一件事的三个零件：<b>判终边先减整圈</b>（差 360° 的整数倍）、<b>压轴的角没有象限号</b>（轴线角不算象限角）、<b>公式里只认弧度</b>（弧长公式里的角必须用弧度）。把这三句钉住，本节 90% 的坑都填平了。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 与 30° 终边相同的角是 210°，它们差 180°。</p>
<p class="er-v">✓ 与 30° 终边相同的角是 30° + k·360°（k∈Z）；差 180° 的 210° 终边与它反向，不重合。</p>
<p class="er-w">错在哪：把「差 180°」当成了终边相同。<b>终边相同的角差 360° 的整数倍</b>，180° 不是 360° 的整数倍。</p>
</div>
<div class="er">
<p class="er-x">✗ 90° 的终边在 y 轴正半轴上，所以它是第一（或第二）象限角。</p>
<p class="er-v">✓ 90° 的终边落在 y 轴上，是轴线角，不属于任何象限。</p>
<p class="er-w">错在哪：<b>轴线角不算象限角</b>。终边必须落在象限的<b>内部</b>才有象限号，压在轴上就没有。</p>
</div>
<div class="er">
<p class="er-x">✗ 半径 r = 2、圆心角 60°，所以弧长 l = |60| × 2 = 120。</p>
<p class="er-v">✓ 先把 60° 化为 π/3，再算 l = |α|·r = (π/3) × 2 = 2π/3。</p>
<p class="er-w">错在哪：<b>弧长公式里的角必须用弧度</b>，代进去的是弧度的数值，不是度数。</p>
</div>
<div class="er">
<p class="er-x">✗ 120° = 120π rad。</p>
<p class="er-v">✓ 120° = 120 × π/180 = 2π/3。</p>
<p class="er-w">错在哪：度化弧度要乘 <b>π/180</b>，不是乘 π。乘 π 等于把 1° 当成 1 rad。</p>
</div>
<div class="er">
<p class="er-x">✗ 与 α 终边相同的角的集合是 {β | β = α + k·360°}。</p>
<p class="er-v">✓ {β | β = α + k·360°，<b>k∈Z</b>}，弧度制下写作 {β | β = α + 2kπ，k∈Z}。</p>
<p class="er-w">错在哪：漏写 k∈Z，集合里只剩「加一圈」的那一个角，也说不清 k 是什么数。</p>
</div>
<div class="er">
<p class="er-x">✗ 负角是「倒着转」的，不能算角，也不能化成弧度。</p>
<p class="er-v">✓ 按顺时针方向旋转形成的角叫负角，它同样是角，同样能化弧度、判象限。</p>
<p class="er-w">错在哪：<b>任意角</b>包括正角、负角和零角；负号只表示旋转方向，不影响后续所有运算。</p>
</div>
<div class="er">
<p class="er-x">✗ 1 rad = 1°，π rad = 3.14 rad。</p>
<p class="er-v">✓ 1 rad ≈ 57.30°，π rad = 180°；π 是 3.14159…，不是 3.14 rad。</p>

<script>
/* 互动脚本本体（由 build-page.mjs 包进 <script> 里，所以这里不要写 <script> 标签） */
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var GX = window.GX, el = GX.el, tx = GX.tx, $ = GX.$;
  var stage = $("gxStage");
  if (!stage || !window.AutoPilot) return;

  /* 两套坐标：宽屏 880×470，窄屏独立 360×700 */
  var W = { vb: "0 0 880 470", left: { x: 16, y: 16, w: 424, h: 438 }, right: { x: 452, y: 16, w: 412, h: 438 } };
  var N = { vb: "0 0 360 700", left: { x: 8, y: 8, w: 344, h: 322 }, right: { x: 8, y: 338, w: 344, h: 354 } };
  var L = W, A = 30, G = null;

  /* 纯函数：角 θ（度）→ 弧度 / 最小正角 / 象限。render() 与 __model.cases 都用它 */
  function calc(v) {
    var th = Math.round(v);
    var rad = th * Math.PI / 180;
    var cot = ((th % 360) + 360) % 360;          /* 终边相同的最小正角 */
    var quad = cot % 90 === 0 ? 0 : Math.floor(cot / 90) + 1;   /* 0 表示轴线角 */
    return { th: th, rad: rad, cot: cot, quad: quad, turns: Math.floor(th / 360) };
  }

  function geom() {
    var lo = L.left;
    var cx = lo.x + lo.w / 2, cy = lo.y + lo.h / 2 + 8;
    var R = Math.min(lo.w, lo.h) / 2 - 48;
    return { cx: cx, cy: cy, R: R, ar: R * 0.34 };
  }

  function draw(s) {
    var gA = $("gxA"), gB = $("gxB"), i, t, byy, col = s.quad === 0 ? "#b8791f" : "#2f8a5b";
    gA.textContent = ""; gB.textContent = "";
    el("rect", { x: L.left.x, y: L.left.y, width: L.left.w, height: L.left.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    el("rect", { x: L.right.x, y: L.right.y, width: L.right.w, height: L.right.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    var cx = G.cx, cy = G.cy, R = G.R;
    tx(gA, L.left.x + 18, L.left.y + 26, "单位圆：终边只看余角", "#5a6472", "start", 10.5, 700);

    /* 单位圆 + 坐标轴（带箭头与 1/2 刻度） */
    el("circle", { cx: cx, cy: cy, r: R, fill: "#ffffff", stroke: "#cfd8e3", "stroke-width": 1.2 }, gA);
    el("line", { x1: cx - R - 18, y1: cy, x2: cx + R + 18, y2: cy, stroke: "#8a97a6", "stroke-width": 1.2 }, gA);
    el("polygon", { points: (cx + R + 26) + "," + cy + " " + (cx + R + 15) + "," + (cy - 4.5) + " " + (cx + R + 15) + "," + (cy + 4.5), fill: "#8a97a6" }, gA);
    el("line", { x1: cx, y1: cy + R + 18, x2: cx, y2: cy - R - 18, stroke: "#8a97a6", "stroke-width": 1.2 }, gA);
    el("polygon", { points: cx + "," + (cy - R - 26) + " " + (cx - 4.5) + "," + (cy - R - 15) + " " + (cx + 4.5) + "," + (cy - R - 15), fill: "#8a97a6" }, gA);
    for (i = -1; i <= 1; i += 2) {
      t = cx + R * 0.5 * i;
      el("line", { x1: t, y1: cy - 4, x2: t, y2: cy + 4, stroke: "#8a97a6", "stroke-width": 1 }, gA);
      t = cy + R * 0.5 * i;
      el("line", { x1: cx - 4, y1: t, x2: cx + 4, y2: t, stroke: "#8a97a6", "stroke-width": 1 }, gA);
    }
    tx(gA, cx + R + 8, cy + 17, "x", "#5a6472", "start", 9.6, 400);
    tx(gA, cx + 8, cy - R - 8, "y", "#5a6472", "start", 9.6, 400);
    tx(gA, cx - 14, cy + 16, "O", "#6b7280", "start", 9.4, 400);

    /* 象限标注（罗马数字，浅灰底） */
    var qn = ["Ⅰ", "Ⅱ", "Ⅲ", "Ⅳ"], qx = [1, -1, -1, 1], qy = [-1, -1, 1, 1];
    for (i = 0; i < 4; i++) tx(gA, cx + qx[i] * R * 0.58, cy + qy[i] * R * 0.58 + 5, qn[i], "#c3ccd6", "middle", 14, 700);

    /* 终边（数学逆时针：y 轴朝下，故屏幕坐标 sy = cy − R·sinθ） */
    var a = s.cot * Math.PI / 180, ct = Math.cos(a), st = Math.sin(a);
    var ex = cx + R * ct, ey = cy - R * st, ux = ct, uy = -st, px = -uy, py = ux, h = 9;
    el("line", { x1: cx, y1: cy, x2: ex, y2: ey, stroke: "#2563eb", "stroke-width": 2.4 }, gA);
    el("polygon", {
      points: ex + "," + ey + " " + (ex - ux * h + px * h * 0.55) + "," + (ey - uy * h + py * h * 0.55) + " "
        + (ex - ux * h - px * h * 0.55) + "," + (ey - uy * h - py * h * 0.55), fill: "#2563eb"
    }, gA);
    /* 角度弧线：逆时针 sweep-flag = 0 */
    if (s.cot > 0) {
      el("path", {
        d: "M " + (cx + G.ar) + " " + cy + " A " + G.ar + " " + G.ar + " 0 " + (s.cot > 180 ? 1 : 0) + " 0 "
          + (cx + G.ar * ct) + " " + (cy - G.ar * st), fill: "none", stroke: "#b8791f", "stroke-width": 1.8
      }, gA);
    }
    var ma = s.cot / 2 * Math.PI / 180, lr = G.ar + 20;
    tx(gA, cx + lr * Math.cos(ma), cy - lr * Math.sin(ma) + 4, s.cot + "°", "#b8791f", "middle", 10, 700);
    tx(gA, L.left.x + 18, L.left.y + L.left.h - 14, "已转 " + s.turns + " 整圈，余角 " + s.cot + "°", "#5a6472", "start", 10, 400);

    /* 右栏：数值与化简 */
    var rx = L.right.x + 24, ry = L.right.y + 28, rw = L.right.w - 48;
    tx(gB, rx, ry, "数值与化简", "#5a6472", "start", 10.5, 700);
    var by = ry + 36, bx0 = rx + 4, bx1 = rx + rw - 10;
    el("line", { x1: bx0, y1: by, x2: bx1, y2: by, stroke: "#cfd8e3", "stroke-width": 2 }, gB);
    for (i = 0; i <= 4; i++) {
      t = bx0 + (bx1 - bx0) * i / 4;
      el("line", { x1: t, y1: by - 4, x2: t, y2: by + 4, stroke: "#8a97a6", "stroke-width": 1 }, gB);
      tx(gB, t, by + 17, String(i * 180) + "°", "#8a97a6", "middle", 8.5, 400);
    }
    el("circle", { cx: bx0 + (bx1 - bx0) * (s.th / 720), cy: by, r: 5, fill: "#2563eb" }, gB);

    var ly = by + 44;
    tx(gB, rx, ly, "θ = " + s.th + "° → " + s.rad.toFixed(4) + " rad", "#3a3a35", "start", 10, 400);
    tx(gB, rx, ly + 17, "整圈数 " + s.turns + "，余角 " + s.cot + "°", "#3a3a35", "start", 10, 400);
    tx(gB, rx, ly + 34, "终边相同的角：β = " + s.cot + "° + k·360°，k∈Z", "#3a3a35", "start", 10, 400);
    tx(gB, rx, ly + 51, "θ 每加 360°，弧度加 2π，余角不变", "#7a8794", "start", 9.4, 400);

    /* 关键帧对照（弧度换算） */
    var rby = ly + 76, rows = [["0°", "0 rad", "轴线角"], ["30°", "π/6", "第 1 象限"], ["90°", "π/2", "轴线角"], ["390°", "13π/6", "与 30° 同终边"]];
    tx(gB, rx, rby, "关键帧对照", "#5a6472", "start", 10, 700);
    for (i = 0; i < rows.length; i++) {
      t = rby + 18 + i * 16;
      tx(gB, rx, t, rows[i][0], "#3a3a35", "start", 9.4, 700);
      tx(gB, rx + 46, t, rows[i][1], "#1d4ed8", "start", 9.4, 400);
      tx(gB, rx + 110, t, rows[i][2], "#7a8794", "start", 9.4, 400);
    }

    /* 状态判断块 */
    byy = Math.min(rby + 104, L.right.y + L.right.h - 88);
    el("rect", { x: rx - 10, y: byy, width: rw + 20, height: 76, rx: 8, fill: s.quad === 0 ? "#fdf3e0" : "#e6f6ee", stroke: col + "55" }, gB);
    tx(gB, rx, byy + 26, s.quad === 0 ? "轴线角" : "第 " + s.quad + " 象限角", col, "start", 13, 700);
    tx(gB, rx, byy + 46, s.quad === 0 ? "终边压在坐标轴上，不算任何象限" : "终边落在第 " + s.quad + " 象限内部", "#5a6472", "start", 9.4, 400);
    tx(gB, rx, byy + 64, "判据：先减整圈，看余角落在哪", "#7a8794", "start", 9.4, 400);
  }

  function render() {
    if (!G) { L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N; G = geom(); stage.setAttribute("viewBox", L.vb); }
    var s = calc(A), st, col, bg, sn;
    $("gxVa").textContent = s.th + "°";
    $("gxVb").textContent = s.rad.toFixed(4);
    $("gxVc").textContent = s.cot + "°";
    if (s.quad === 0) { st = "轴线角"; col = "#b8791f"; bg = "#fdf3e0"; sn = "终边在坐标轴上，不算象限"; }
    else { st = "第 " + s.quad + " 象限角"; col = "#2f8a5b"; bg = "#e6f6ee"; sn = "终边落在第 " + s.quad + " 象限内部"; }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    draw(s);
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    stage.setAttribute("viewBox", L.vb);
    G = geom();
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 30 }, { t: 1.2, v: 30 }, { t: 4, v: 180 }, { t: 6.5, v: 180 }, { t: 9, v: 390 }, { t: 11.5, v: 390 }, { t: 13.5, v: 30 }],
    keys: [30, 180, 390],
    value: A, min: 0, max: 720, step: 15,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc, cases: [
    { v: 30, eq: { rad: 0.5236, cot: 30, quad: 1 } },
    { v: 390, eq: { rad: 6.8068, cot: 30, quad: 1 } },
    { v: 180, eq: { rad: 3.1416, cot: 180, quad: 0 } },
    { v: 720, eq: { rad: 12.5664, cot: 0, quad: 0 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
