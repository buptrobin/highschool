<p class="gx-claim">一句话说清本节最该记住的判断：<b>导数是平均变化率的极限值</b>，<b>不是两点之间的斜率</b>；f′(x₀) 这个数就是曲线在 (x₀,f(x₀)) 处<b>切线</b>的斜率。</p>
<div class="gx-meta">
<span><i></i>人教A版选择性必修第二册 第五章第1节</span>
<span><i></i>高二 · 选择性必修第二册</span>
<span><i></i>阅读 12 分钟</span>

<p class="gx-lede">这一节是整册「导数」的地基：先把平均变化率写出来，再让 Δx 无限趋近于 0，得到导数 f′(x₀)；它的几何意义是切线斜率，物理意义是瞬时速度。最容易错的一件事：把 Δx 直接代成 0 去算，或者把导数据说成「两点的斜率」——导数是一个极限值，落脚点是<b>一个点</b>。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 平均变化率<span class="q-src">人教A版选择性必修第二册 · 第五章第1节</span></p>
<p class="q-b">函数 y=f(x) 从 x₀ 到 x₀+Δx 的平均变化率是 <span class="gx-fml">Δy/Δx =［f(x₀+Δx) − f(x₀)］/Δx</span>。</p>
<p class="q-n">→ 翻成人话：这是「两点的纵坐标差 ÷ 横坐标差」，几何上就是过那两点的<b>割线斜率</b>。它由<b>两个条件</b>组成：①起点 x₀ 定住；②增量 Δx≠0。少第二个（Δx=0）分母为零，式子直接没有意义。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 导数的定义<span class="q-src">人教A版选择性必修第二册 · 第五章第1节</span></p>
<p class="q-b">当 Δx 无限趋近于 0 时，平均变化率 Δy/Δx 趋近于一个确定的值，这个值叫做 f(x) 在 x₀ 处的导数，记作 <span class="gx-fml">f′(x₀) = lim(Δx→0) Δy/Δx</span>。</p>
<p class="q-n">→ 翻成人话：三个条件缺一不可：①Δx<b>无限趋近于 0</b>（是个过程，不是代 0）；②平均变化率要<b>趋近于一个确定的值</b>；③这个值记作 f′(x₀)，它是一个<b>数</b>。少了「趋近于确定的值」这一条，就是不可导——比如 y=|x| 在 x=0 处左右两边的比值不一样，没有确定的极限。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 几何意义<span class="q-src">人教A版选择性必修第二册 · 第五章第1节</span></p>
<p class="q-b">函数 y=f(x) 在 x=x₀ 处的导数 f′(x₀)，就是曲线 y=f(x) 在点 (x₀,f(x₀)) 处的切线斜率，即 <span class="gx-fml">k = f′(x₀)</span>。</p>
<p class="q-n">→ 翻成人话：把「切线」两个字划出来。割线要两个点才能定，切线只有<b>一个</b>切点，所以 f′(x₀) 里只出现 x₀，不出现 Δx——这也正是它和平均变化率的根本区别。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>条件</th><th>做到了会怎样</th><th>缺了会怎样</th></tr></thead>
<tbody>
<tr><td>① Δx≠0（可正可负）</td><td><span class="gx-fml">Δy/Δx</span> 有定义，是割线斜率</td><td>分母为 0，式子无意义；代 0 算出的是 0/0 型，不是导数</td></tr>
<tr><td>② Δx 无限趋近于 0</td><td>割线绕切点转动，趋近于切线，斜率趋近于 f′(x₀)</td><td>停在某个 h，只能得到平均变化率 2+h，比导数多了 h</td></tr>
<tr class="key"><td>③ 比值趋近于<b>确定</b>的值</td><td><span class="gx-fml">f′(x₀) = lim(Δx→0) Δy/Δx</span> 存在，是一个实数，等于切线斜率</td><td>左右极限不等（如 y=|x| 在 x=0），f′(x₀) 不存在，谈切线斜率也没意义</td></tr>
<tr><td>④ 指明「在 x₀ 处」</td><td>f′(x₀) 是个具体的数</td><td>只写 f′ 或 f′(x)，那是导函数，是一整个函数，不是这个点的斜率</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">背法一句话：<b>先写平均变化率（两点）→ 再取极限（一点）</b>。顺序不能反，「取极限」这一步是本节全部难度的来源。整张表只高亮第 ③ 行，因为它决定了「有没有导数」。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 用定义求导数并说明几何意义<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">已知 f(x)=x²。（1）求 f′(1)，并说明它的几何意义；（2）曲线 y=x² 在点 (1,1) 处的切线斜率是多少？写出该切线方程。<span style="color:#b8402f">陷阱：第（1）问必须写出极限过程，只写「f′(1)=2」不算完成。</span></p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 定 x₀ 与增量</p>
<p class="s-b">题目问「在 x₀=1 处」，先把这个前提写在最前面：x₀=1，自变量从 1 变到 1+Δx，Δx≠0（可正可负）。再写出函数值的增量 Δy=f(1+Δx)−f(1)=(1+Δx)²−1。</p>
<p class="s-k">用到：平均变化率的两个条件——起点定住、Δx≠0。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 算差商，先化简再取极限</p>
<p class="s-b">Δy/Δx =［(1+Δx)²−1］/Δx=(1+2Δx+Δx²−1)/Δx=(2Δx+Δx²)/Δx=2+Δx。这里能约掉 Δx，正是因为 Δx≠0；若一开始就令 Δx=0，得到 0/0，什么也算不出来。</p>
<p class="s-k">用到：Δx≠0 是约分的许可证。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 取极限，指出它是极限值</p>
<p class="s-b">因为当 Δx 无限趋近于 0 时，2+Δx 无限趋近于 2，所以 <span class="gx-fml">f′(1) = lim(Δx→0)(2+Δx) = 2</span>。注意这一步得到的是一个<b>数</b>，不是一对点的斜率；导数是极限值，Δx 从未真的等于 0。</p>
<p class="s-k">用到：导数定义式中的 lim(Δx→0)。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 说几何意义</p>
<p class="s-b">f′(1)=2 表示曲线 y=x² 在点 (1,1) 处的切线斜率为 2。判定要点：这是<b>切线</b>斜率，不是割线斜率；切点只有一个 (1,1)，所以答案里不该再出现 Δx。</p>
<p class="s-k">用到：导数的几何意义 = 该点切线斜率。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 写出切线方程并复核</p>
<p class="s-b">由点斜式 <span class="gx-fml">y−1 = 2(x−1)</span>，得 <span class="gx-fml">y = 2x−1</span>。复核：把 x=1 代回得 y=1，切点在线上；再验证 y=2x−1 与 y=x² 只有一个公共点：x²=2x−1 ⇒ x²−2x+1=0 ⇒ (x−1)²=0，判别式为 0，确实相切。</p>
<p class="s-k">用到：点斜式 + 判别式复核「只有一个公共点」。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）x₀=1，<span class="gx-fml">Δy/Δx =［(1+Δx)²−1²］/Δx = (2Δx+Δx²)/Δx = 2+Δx</span>（Δx≠0）。当 Δx→0 时，2+Δx→2，故 <span class="gx-fml">f′(1) = lim(Δx→0)(2+Δx) = 2</span>。几何意义：曲线 y=x² 在点 (1,1) 处的切线斜率为 2。<br>（2）由（1）切线斜率为 2，切线方程 <span class="gx-fml">y−1 = 2(x−1)</span>，即 <span class="gx-fml">y = 2x−1</span>。<br>易错提示：不可写「Δx=0 时 Δy/Δx=2」；不可把 f′(1)=2 说成过 (1,1) 与 (2,4) 两点的割线斜率（那是 3）。</p>
</div>
</div>
</section>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「平均变化率和导数不就差一个 Δx 吗，是不是一回事？」</p>
<p class="a">不是。平均变化率是<b>两点</b>的差商 Δy/Δx，随 Δx 变，等于割线斜率；导数是它<b>当 Δx→0 时的极限值</b>，是一个数，等于切线斜率。写答案时若式子里还有 Δx，就只是平均变化率。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="割线与切线对比">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="26" y1="106" x2="216" y2="106" stroke="#8a94a0" stroke-width="1"/>
<line x1="34" y1="112" x2="34" y2="26" stroke="#8a94a0" stroke-width="1"/>
<path d="M38 104 Q110 92 190 58" fill="none" stroke="#2563eb" stroke-width="1.5"/>
<line x1="42" y1="102" x2="180" y2="66" stroke="#b8791f" stroke-width="1.2" stroke-dasharray="4 3"/>
<circle cx="112" cy="90" r="2.8" fill="#b8402f"/>
<text x="120" y="122" font-size="8.4" fill="#b8402f">h→0 才成切线</text>
<text x="150" y="52" font-size="8.4" fill="#b8791f">割线</text>
</svg>
</div>
<div class="qac">
<p class="q">「求 f′(1) 时，我直接令 Δx=0 代进去，为什么不行？」</p>
<p class="a">因为 Δx 在<b>分母</b>上，Δx=0 会让 Δy/Δx 变成无意义（0/0）。Δx 可正可负，但<b>不能等于 0</b>；正确做法是先化简约掉分母的 Δx，得到 <span class="gx-fml">2+Δx</span>，再让 Δx→0，得 2。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="Δx 趋于 0 但取不到 0">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="30" y1="96" x2="210" y2="96" stroke="#8a94a0" stroke-width="1"/>
<text x="30" y="112" font-size="8.4" fill="#5a6472">Δx</text>
<circle cx="62" cy="96" r="3" fill="#b8791f"/>
<circle cx="120" cy="96" r="3" fill="#b8791f"/>
<circle cx="176" cy="96" r="3" fill="#b8791f"/>
<path d="M180 84 Q200 84 206 96" fill="none" stroke="#8a94a0" stroke-width="1" stroke-dasharray="3 2"/>
<circle cx="206" cy="96" r="4" fill="none" stroke="#b8402f" stroke-width="1.4"/>
<text x="168" y="74" font-size="8.4" fill="#b8402f">0 取不到</text>
</svg>
</div>
<div class="qac">
<p class="q">「f′(x₀) 算出来是 2，那就写点 (1,2) 吧？」</p>
<p class="a">错。导数是一个<b>数</b>，不表示点。f′(1)=2 是<b>斜率</b>；对应的点是 (1,f(1))=(1,1)。把 2 当成纵坐标，就是「导数写成点坐标」的经典扣分。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="点是 1,1 而斜率是 2">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="26" y1="106" x2="216" y2="106" stroke="#8a94a0" stroke-width="1"/>
<line x1="44" y1="60" x2="44" y2="24" stroke="#8a94a0" stroke-width="1"/>
<line x1="44" y1="60" x2="74" y2="60" stroke="#8a94a0" stroke-width="1"/>

<div class="qac">
<p class="q">「f′(x₀) 是负数，说明曲线在往下掉吗？」</p>
<p class="a">说明该点<b>切线斜率为负</b>，切线从左上往右下倾斜，函数在 x₀ 附近随 x 增大而减小。要强调的是「在 x₀ 处」局部趋势，不能据此断言整个定义域都递减。</p>

<text x="152" y="66" font-size="8.4" fill="#b8402f">k=f′(x₀)&lt;0</text>
<text x="44" y="122" font-size="8.2" fill="#5a6472">局部：x 增，y 减</text>

</div>
<div class="qac">
<p class="q">「f′(x₀)=0 时，切线是什么样子？」</p>
<p class="a">切线<b>水平</b>（平行于 x 轴或与 x 轴重合），斜率为 0。但 f′(x₀)=0 只是「切线水平」，<b>不能直接说这是最高点或最低点</b>——那要另外判断两侧的增减。</p>

<path d="M40 32 Q110 118 196 40" fill="none" stroke="#2563eb" stroke-width="1.5"/>

<circle cx="112" cy="76" r="2.8" fill="#2f8a5b"/>
<text x="120" y="70" font-size="8.4" fill="#2f8a5b">切线水平 k=0</text>
<text x="44" y="122" font-size="8.2" fill="#5a6472">不等于「一定是极值点」</text>
</svg>
</div>
<div class="qac">
<p class="q">「f′(x₀) 和 f′(x) 有什么不一样？」</p>
<p class="a">f′(x₀) 是<b>一个数</b>，是曲线在 x₀ 处切线的斜率；f′(x) 是<b>导函数</b>，是一个函数，把 x 代成 x₀ 才得到前者。答「在 x₀ 处的斜率」时写 f′(x₀)，别漏掉那个下标 0。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="导函数与某点导数的关系">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="26" y1="96" x2="212" y2="96" stroke="#8a94a0" stroke-width="1"/>
<path d="M36 34 L196 80" stroke="#2f8a5b" stroke-width="1.5"/>
<line x1="116" y1="34" x2="116" y2="96" stroke="#b8791f" stroke-width="1" stroke-dasharray="3 2"/>
<circle cx="116" cy="57" r="2.8" fill="#b8402f"/>
<text x="124" y="54" font-size="8.4" fill="#b8402f">f′(x₀)：一个数</text>
<text x="130" y="30" font-size="8.4" fill="#2f8a5b">f′(x)：一条线</text>
<text x="36" y="112" font-size="8.2" fill="#5a6472">把 x₀ 代进 f′(x) 才落地</text>
</svg>
</div>
</div>
<p class="gx-note">收尾点明：这六问其实是同一件事——<b>分清「两点」和「一点」</b>。带 Δx 的是两点（平均变化率、割线）；取完极限只剩一个 x₀ 的是一点（导数、切线）。Δx 只是趋近于 0，永远不等于 0。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 当 Δx→0 时 Δy/Δx 就是 Δx=0 时的 Δy/Δx，直接代 0 得 0/0。</p>
<p class="er-v">✓ Δx 无限趋近于 0 但 Δx≠0；先把 <span class="gx-fml">Δy/Δx</span> 化简为 <span class="gx-fml">2+Δx</span>，再取极限得 2。</p>
<p class="er-w">错在哪：把「极限过程」当成了「代入取值」，Δx 在分母上，取 0 就无意义。</p>
</div>
<div class="er">
<p class="er-x">✗ f′(1)=2 就是过 (1,1) 与 (2,4) 两点的割线斜率。</p>
<p class="er-v">✓ f′(1)=2 是曲线在点 (1,1) 处<b>切线</b>的斜率；两点 (1,1)、(2,4) 的割线斜率是 3，那是平均变化率。</p>
<p class="er-w">错在哪：混淆割线与切线，本质是把极限值当成了差商。</p>
</div>
<div class="er">
<p class="er-x">✗ 平均变化率 2+h 就是导数，h 取多少都无所谓。</p>
<p class="er-v">✓ 平均变化率是 2+h，随 h 变；只有它的极限值 2 才是导数，两者相差恰好 h。</p>
<p class="er-w">错在哪：没说「Δx→0」，平均变化率不是导数，它只是通向导数的那一步。</p>
</div>
<div class="er">
<p class="er-x">✗ 因为 f′(1)=2，所以切点是 (1,2)。</p>
<p class="er-v">✓ f′(1)=2 给出的是斜率；切点是 (1,f(1))=(1,1)，切线为 y−1=2(x−1)。</p>
<p class="er-w">错在哪：把导数当成点的纵坐标——导数是数，不是点。</p>
</div>
<div class="er">
<p class="er-x">✗ 曲线 y=x² 的导数是 2，所以它的切线斜率都是 2。</p>
<p class="er-v">✓ 必须说「在 x₀ 处」：y=x² 在 x=1 处 f′(1)=2，在 x=3 处 f′(3)=6；不同点斜率不同。</p>
<p class="er-w">错在哪：漏掉了「在 x₀ 处」这个前提，把一个点的导数当成了整条曲线的属性。</p>
</div>
<div class="er">
<p class="er-x">✗ 只要是连续曲线，每个点都一定有导数。</p>
<p class="er-v">✓ 连续不一定可导。y=|x| 在 x=0 处，Δx&gt;0 时比值为 1、Δx&lt;0 时比值为 −1，极限不存在，故 f′(0) 不存在。</p>
<p class="er-w">错在哪：忽略了定义里「趋近于一个<b>确定</b>的值」这一条；左右不一致就没有导数。</p>
</div>
<div class="er">
<p class="er-x">✗ 瞬时速度就是某一小段时间内的平均速度，取小一点就行。</p>
<p class="er-v">✓ 瞬时速度 v(t₀) 是平均速度 Δs/Δt 当 Δt→0 时的极限，即 s′(t₀)，是位移—时间图像在该点切线的斜率。</p>
<p class="er-w">错在哪：还是「取小一点」的近似思维；极限值是一个确定的数，不是近似值。</p>
</div>
</div>

    tx(g, (mx(1) + mx(x1)) / 2, my(1) + 15, "Δx=h", "#b8402f", "middle", 9, 700);
