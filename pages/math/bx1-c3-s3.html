<p class="gx-claim">判断幂函数只看两件事：<b>系数必须是 1</b>、<b>指数必须是常数</b>；再看指数 α 的正负定单调、奇偶定象限。</p>
<div class="gx-meta">
<span><i></i>人教A版必修第一册 第3章第3节</span>
<span><i></i>高一 · 必修第一册</span>
<span><i></i>阅读 12 分钟</span>
<span><i></i>含 1 个互动模型</span>
</div>
<p class="gx-lede">幂函数是必修第一册里「长得最简单、判得最严」的一类函数：教材只给了一句定义，考试却年年拿它和指数函数摆在一起考。这一节要盯住的那件事是——<b>y=2x² 不是幂函数</b>，因为系数不是 1；<b>y=x^α 与 y=α^x 不是一回事</b>，因为自变量所在的位置不同。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 幂函数的定义<span class="q-src">人教A版必修第一册 · 第3章第3节</span></p>
<p class="q-b">一般地，形如 <span class="gx-fml">y=x^α</span> 的函数叫做幂函数，其中 α 为常数。</p>
<p class="q-n">→ 翻成人话：这一句由<b>三个条件</b>组成——① 系数必须是 1（前面不能有 2、−1、1/3 这类数）；② 指数是<b>常数</b> α，不含自变量；③ 整个式子只有 x^α 这一项，不能加 1、不能乘别的函数。少任何一个就不是幂函数：y=2x² 违反①，y=x^x 违反②，y=x²+1 违反③。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 公共点<span class="q-src">人教A版必修第一册 · 第3章第3节</span></p>
<p class="q-b">幂函数 y=x^α 的图象都过点 (1,1)。</p>
<p class="q-n">→ 翻成人话：因为 1^α=1 对任何常数 α 都成立，所以这个公共点<b>与 α 无关</b>，画图时先把它点上去。注意它只说 (1,1)：<b>(0,0) 并不是都过</b>，α=−1、α=0 就都不过原点。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 单调性<span class="q-src">人教A版必修第一册 · 第3章第3节</span></p>
<p class="q-b">当 α&gt;0 时，幂函数在 (0,+∞) 上单调递增；当 α&lt;0 时，在 (0,+∞) 上单调递减。</p>
<p class="q-n">→ 翻成人话：这句话的适用范围被锁死在<b>区间 (0,+∞)</b> 上，答题时必须把这个区间写出来，不能写成「在 R 上递增」。α=0 是第三种情况：y=x⁰=1（x≠0），在 (0,+∞) 上是常函数，既不增也不减。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>判据</th><th>合格的样子</th><th>缺了这一条会怎样</th></tr></thead>
<tbody>
<tr><td>形式：只有 x^α 一项</td><td>y=x³、y=x^(1/2)</td><td>y=x²+1 多了一个常数项，图象整体上移，不是幂函数</td></tr>
<tr class="key"><td>系数：必须是 1</td><td>y=x²（系数 1 省略不写）</td><td>y=2x²、y=−x³、y=(1/2)x 全都不是幂函数，这是最常考的一刀</td></tr>
<tr><td>指数：是常数 α</td><td>y=x^5、y=x^(−1)</td><td>y=x^x 的指数含 x，属于指数里套自变量，不是幂函数</td></tr>
<tr><td>自变量位置：在底数上</td><td>y=x^α（x 是底数）</td><td>y=α^x 的自变量在指数上，那是指数函数，两回事</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">背法：一句话——「<b>底数是 x、系数是 1、指数是常数</b>」。三样对不上任何一样，先别急着代公式，先判它根本不是幂函数。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 由单调性反求指数中的参数<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">已知幂函数 <span class="gx-fml">f(x)=x^(m²−2m−3)</span>（m∈Z）在 (0,+∞) 上单调递减，求 m 的值。陷阱：解出 −1&lt;m&lt;3 之后忘了 m 只能取整数，或者把端点 −1、3 也塞进去。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 认型</p>
<p class="s-b">题目说「已知幂函数」，说明它已经符合 y=x^α 的形式：系数是 1、只有一项，指数 α=m²−2m−3 是常数（虽然含 m，但对 x 来说是常数）。所以可以直接用幂函数的性质，不用再判定义域。</p>
<p class="s-k">用到：幂函数的定义——系数为 1、指数是常数。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 翻译条件</p>
<p class="s-b">「在 (0,+∞) 上单调递减」⇔ 指数 α&lt;0。这条性质只看指数的符号，与 m 的具体值无关，所以先写不等式：<span class="gx-fml">m²−2m−3&lt;0</span>。</p>
<p class="s-k">用到：α&lt;0 ⇒ 在 (0,+∞) 上递减。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 解不等式</p>
<p class="s-b">分解因式：(m−3)(m+1)&lt;0，得 −1&lt;m&lt;3。这一步要写出因式分解，不能只报区间，否则过程分拿不到。</p>
<p class="s-k">用到：一元二次不等式的解法（开口向上、取两根之间）。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 用整数条件筛</p>
<p class="s-b">m∈Z，且 −1&lt;m&lt;3，逐个取整：m=0,1,2。端点 −1 与 3 使指数等于 0，此时 y=x⁰=1（x≠0）在 (0,+∞) 上是常函数，不递减，必须舍去。</p>
<p class="s-k">用到：α=0 是常函数，不满足「递减」。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 回代检验</p>
<p class="s-b">m=0 时指数 −3，m=1 时指数 −4，m=2 时指数 −3，三个都小于 0，都在 (0,+∞) 上递减，且都符合幂函数形式。答案：m=0,1,2。</p>
<p class="s-k">用到：回代验证，防止过程中丢解或增解。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">因为 f(x)=x^(m²−2m−3) 是幂函数，指数 α=m²−2m−3 为常数。<br>
由 f(x) 在 (0,+∞) 上单调递减，得 α&lt;0，即 m²−2m−3&lt;0。<br>
因式分解得 (m−3)(m+1)&lt;0，解得 −1&lt;m&lt;3。<br>
又 m∈Z，所以 m=0,1,2。<br>
检验：m=0,2 时指数为 −3，m=1 时指数为 −4，均小于 0，在 (0,+∞) 上递减，符合题意。<br>
故 m 的值为 0,1,2。</p>
</div>
</div>
</section>
<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「y=2x² 也是幂函数吧？反正都是 x 的几次方。」</p>
<p class="a">不是。幂函数要求<b>系数必须为 1</b>，y=2x² 的系数是 2，只能叫「二次函数」。判断时先看系数，再看指数是不是常数。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="y=2x² 前面多了系数 2，不是幂函数">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text class="ms" x="120" y="46" text-anchor="middle" font-size="12" font-weight="700" fill="#b8402f">y = 2·x²</text>
<text class="ms" x="120" y="70" text-anchor="middle" font-size="10" fill="#3a3a35">系数 2 ≠ 1</text>
<text class="ms" x="120" y="92" text-anchor="middle" font-size="10" fill="#3a3a35">⇒ 不是幂函数</text>
</svg>
</div>
<div class="qac">
<p class="q">「幂函数的图象都过原点 (0,0) 吧？」</p>
<p class="a">不是。幂函数的公共点是 <b>(1,1)</b>，因为 1^α=1 恒成立；α=−1、α=0 时图象都不过原点，α=½ 时 x=0 处根本没定义。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="公共点是 1,1，不是原点">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="46" y1="100" x2="196" y2="100" stroke="#9aa6b2"/>
<line x1="60" y1="110" x2="60" y2="34" stroke="#9aa6b2"/>
<circle cx="106" cy="66" r="4" fill="#151a21"/>
<text class="ms" x="116" y="62" font-size="10" fill="#151a21">(1,1) 必过</text>
<text class="ms" x="116" y="94" font-size="9.4" fill="#b8402f">(0,0) 不一定</text>
</svg>
</div>
<div class="qac">
<p class="q">「α&lt;0 时图象在哪个象限？过不过原点？」</p>
<p class="a">在 (0,+∞) 上的一支落在<b>第一象限</b>；另一支看 α 的奇偶——α=−1 落在第三象限，α=−2 落在第二象限。<b>α&lt;0 时图象不过原点</b>，且以两轴为渐近线。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="α 小于 0 时图象不过原点">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="30" y1="76" x2="208" y2="76" stroke="#9aa6b2"/>
<line x1="72" y1="116" x2="72" y2="26" stroke="#9aa6b2"/>
<polyline points="80,30 84,56 94,66 118,72 160,74 200,75" fill="none" stroke="#b8402f" stroke-width="2"/>
<text class="ms" x="30" y="112" font-size="9.2" fill="#3a3a35">α&lt;0：不过 O，以轴为渐近线</text>
</svg>
</div>
<div class="qac">
<p class="q">「α 是偶数时是奇函数还是偶函数？」</p>
<p class="a">是<b>偶函数</b>，图象关于 y 轴对称；α 是奇数时为奇函数，图象关于原点对称。判奇偶看指数的<b>奇偶</b>，不是看指数的正负。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="α 为偶数时图象关于 y 轴对称">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="46" y1="100" x2="196" y2="100" stroke="#9aa6b2"/>
<line x1="120" y1="112" x2="120" y2="30" stroke="#9aa6b2"/>
<polyline points="70,44 96,80 120,100 144,80 170,44" fill="none" stroke="#2f8a5b" stroke-width="2"/>
<text class="ms" x="132" y="50" font-size="10" fill="#2f8a5b">α=2：偶</text>
<text class="ms" x="40" y="122" font-size="9" fill="#3a3a35">左右对称，不是中心对称</text>
</svg>
</div>
<div class="qac">
<p class="q">「y=x⁰ 和 y=1 是同一个函数吗？」</p>
<p class="a">不是。y=x⁰ 的定义域是 <b>x≠0</b>（0⁰ 无意义），图象是直线 y=1 上挖掉 (0,1) 一个点；y=1 的定义域是 R。定义域不同就是不同的函数，<span class="gx-fml">x⁰=1（x≠0）</span>与 <span class="gx-fml">y=1（x∈R）</span>不是同一个函数。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="y=x⁰ 在 x=0 处是空心点">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="36" y1="84" x2="206" y2="84" stroke="#9aa6b2"/>
<line x1="112" y1="116" x2="112" y2="30" stroke="#9aa6b2"/>
<line x1="112" y1="60" x2="200" y2="60" stroke="#b8791f" stroke-width="2"/>
<circle cx="112" cy="60" r="3.6" fill="#ffffff" stroke="#b8791f" stroke-width="1.6"/>
<text class="ms" x="40" y="52" font-size="9.4" fill="#3a3a35">(0,1) 是空的</text>
</svg>
</div>
<div class="qac">
<p class="q">「幂函数和指数函数不都是 x 的方吗？」</p>
<p class="a">不是一回事。幂函数 y=x^α 的自变量在<b>底数</b>上、系数为 1、必过 (1,1)；指数函数 y=α^x（α&gt;0 且 α≠1）的自变量在<b>指数</b>上、必过 (0,1)。位置不同，性质全不同。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="幂函数与指数函数自变量位置不同">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text class="ms" x="120" y="40" text-anchor="middle" font-size="11" font-weight="700" fill="#2563eb">y = x^α</text>
<text class="ms" x="120" y="58" text-anchor="middle" font-size="9" fill="#3a3a35">x 在底数：幂函数</text>
<text class="ms" x="120" y="86" text-anchor="middle" font-size="11" font-weight="700" fill="#b8791f">y = α^x</text>
<text class="ms" x="120" y="104" text-anchor="middle" font-size="9" fill="#3a3a35">x 在指数：指数函数</text>
</svg>
</div>
</div>
<p class="gx-note">这六问其实是同一件事：先把式子的「形」摆正——系数是不是 1、指数是不是常数、自变量在底数还是在指数上；形对了，公共点、单调性、奇偶性才有资格谈。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ y=2x²、y=x²+1 都是幂函数，只是系数不同。</p>
<p class="er-v">✓ 幂函数必须形如 y=x^α：系数为 1，指数 α 为常数，且只有这一项。</p>
<p class="er-w">错在哪：把「二次函数」当成了「幂函数」。系数必须为 1，多一个常数项、多一个系数，就都不是幂函数。</p>
</div>
<div class="er">
<p class="er-x">✗ 幂函数的图象都经过原点 (0,0)。</p>
<p class="er-v">✓ 幂函数 y=x^α 的图象都过点 (1,1)。</p>
<p class="er-w">错在哪：1^α=1 恒成立，所以 (1,1) 必过；而 0^α 在 α≤0 时没有意义，α&lt;0 时图象根本不过原点。</p>
</div>
<div class="er">
<p class="er-x">✗ α&lt;0 时幂函数递减，图象还是从原点出发往下走。</p>
<p class="er-v">✓ α&lt;0 时在 (0,+∞) 上单调递减，图象以两坐标轴为渐近线，不过原点。</p>
<p class="er-w">错在哪：把「递减」画成了「过原点的下降直线」。α&lt;0 时 x 越小 y 越大，曲线被坐标轴卡住，永远碰不到原点。</p>
</div>
<div class="er">
<p class="er-x">✗ y=x^α 和 y=α^x 都是幂函数，只是写法不同。</p>
<p class="er-v">✓ 幂函数是 y=x^α（自变量在底数上）；y=α^x 是指数函数（自变量在指数上），两者不是一回事。</p>
<p class="er-w">错在哪：只看「有个 α」就下结论。判断依据是自变量 x 站在底数还是指数上，这一换位置，过点、单调性、定义域全变。</p>
</div>
<div class="er">
<p class="er-x">✗ α 是负数，所以 y=x^α 是奇函数。</p>
<p class="er-v">✓ α 为奇数时是奇函数，α 为偶数时是偶函数；奇偶性只看指数的奇偶，与正负无关。</p>
<p class="er-w">错在哪：把两套判据混成一套。正负管的是单调性与定义域，奇偶管的是对称性，要分开写。</p>
</div>
<div class="er">
<p class="er-x">✗ y=x⁰ 就是 y=1，两个函数完全一样。</p>
<p class="er-v">✓ y=x⁰=1（x≠0），定义域是 {x|x≠0}；y=1 的定义域是 R。</p>
<p class="er-w">错在哪：忽略 0⁰ 无意义。图象上差一个空心点 (0,1)，定义域不同就不是同一个函数。</p>
</div>
<div class="er">
<p class="er-x">✗ 因为 α&lt;0 时递减，所以幂函数在 R 上单调递减。</p>
<p class="er-v">✓ 课本只保证在 (0,+∞) 上的单调性，答题必须写出这个区间。</p>
<p class="er-w">错在哪：把结论的适用范围放大了。α&lt;0 时 x=0 处无定义，图象分两支，根本谈不上在 R 上单调。</p>
</div>

<script>
/* 互动脚本本体（由 build-page.mjs 包进 <script> 里，所以这里不要写 <script> 标签） */
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var GX = window.GX, el = GX.el, tx = GX.tx, $ = GX.$;
  var stage = $("gxStage");
  if (!stage || !window.AutoPilot) return;

  /* 两套坐标：宽屏 880×470，窄屏独立 360×700 */
  var W = { vb: "0 0 880 470", left: { x: 16, y: 16, w: 424, h: 438 }, right: { x: 456, y: 16, w: 408, h: 438 } };
  var N = { vb: "0 0 360 700", left: { x: 8, y: 8, w: 344, h: 300 }, right: { x: 8, y: 320, w: 344, h: 372 } };
  var L = W, A = -1, G = null;
  var CL = { ink: "#151a21", mut: "#7b8794", line: "#9aa6b2", pos: "#2563eb", zero: "#b8791f", neg: "#b8402f", ok: "#2f8a5b" };

  /* 纯函数：指数 α → 三个量。render() 和 __model.cases 都用它 */
  function calc(v) { return { y1: 1, y2: Math.pow(2, v), mono: v > 0 ? 1 : v === 0 ? 0 : -1 }; }
  function fmt(v) { return String(v).replace("-", "−"); }

  function geom() {
    var p = L.left, q = L.right, w = L === W;
    var t = p.y + (w ? 66 : 54), b = p.y + p.h - (w ? 30 : 18);
    var ox = p.x + (w ? 40 : 24), r = p.x + p.w - (w ? 22 : 14), ymax = 4.4, ymin = -1.6;
    var sy = (b - t) / (ymax - ymin);
    return { p: p, q: q, w: w, ox: ox, oy: t + ymax * sy, sx: (r - ox) / 4, sy: sy, top: t, bot: b, r: r, ymax: ymax, ymin: ymin };
  }

  function arrow(p, x1, y1, x2, y2) {
    var a = Math.atan2(y2 - y1, x2 - x1), s = 9, c = Math.cos, n = Math.sin;
    el("line", { x1: x1, y1: y1, x2: x2, y2: y2, stroke: "#5a6472", "stroke-width": 1.2 }, p);
    el("polygon", { points: x2 + "," + y2 + " " + (x2 - s * c(a - .42)).toFixed(1) + "," + (y2 - s * n(a - .42)).toFixed(1) + " " + (x2 - s * c(a + .42)).toFixed(1) + "," + (y2 - s * n(a + .42)).toFixed(1), fill: "#5a6472" }, p);
  }

  /* 取点：右支 x>0；左支只在 α 为整数时存在 */
  function segs(g, v, neg) {
    var out = [], cur = [], i, x, y;
    for (i = 0; i <= 400; i++) {
      x = neg ? -(0.02 + i * 0.01) : 0.02 + i * 0.01;
      if (!neg && x > 4) break;
      y = Math.pow(x, v);
      if (!isFinite(y) || y > g.ymax - .03 || y < g.ymin + .03) { if (cur.length > 1) out.push(cur); cur = []; continue; }
      cur.push((g.ox + x * g.sx).toFixed(1) + "," + (g.oy - y * g.sy).toFixed(1));
    }
    if (cur.length > 1) out.push(cur);
    return out;
  }

  function draw() {
    var gA = $("gxA"), gB = $("gxB"), g = G, s = calc(A), k;
    gA.textContent = ""; gB.textContent = "";
    var col = s.mono > 0 ? CL.pos : s.mono === 0 ? CL.zero : CL.neg;
    el("rect", { x: g.p.x, y: g.p.y, width: g.p.w, height: g.p.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    tx(gA, g.p.x + 22, g.p.y + 30, "y = x^α 的图象　α = " + fmt(A), CL.ink, "start", 11, 700);

    /* 坐标轴：带箭头与单位刻度 */
    arrow(gA, g.ox - 16, g.oy, g.r + 18, g.oy);
    arrow(gA, g.ox, g.bot + 8, g.ox, g.top - 12);
    tx(gA, g.ox - 12, g.oy + 15, "O", CL.mut, "end", 9);
    tx(gA, g.r + 20, g.oy + 4, "x", CL.mut, "start", 9.5);
    tx(gA, g.ox + 6, g.top - 14, "y", CL.mut, "start", 9.5);
    for (k = 1; k <= 4; k++) {
      el("line", { x1: g.ox + k * g.sx, y1: g.oy, x2: g.ox + k * g.sx, y2: g.oy + 5, stroke: CL.line }, gA);
      tx(gA, g.ox + k * g.sx, g.oy + 17, String(k), CL.mut, "middle", 8.6);
      el("line", { x1: g.ox, y1: g.oy - k * g.sy, x2: g.ox - 5, y2: g.oy - k * g.sy, stroke: CL.line }, gA);
      tx(gA, g.ox - 9, g.oy - k * g.sy + 3.4, String(k), CL.mut, "end", 8.6);
    }
    el("line", { x1: g.ox, y1: g.oy + g.sy, x2: g.ox - 5, y2: g.oy + g.sy, stroke: CL.line }, gA);
    tx(gA, g.ox - 9, g.oy + g.sy + 3.4, "−1", CL.mut, "end", 8.6);

    function stroke(list, c) {
      for (var i = 0; i < list.length; i++) el("polyline", { points: list[i].join(" "), fill: "none", stroke: c, "stroke-width": 2.4, "stroke-linecap": "round" }, gA);
    }
    stroke(segs(g, A, false), col);
    if (A === Math.round(A)) stroke(segs(g, A, true), col);

    var p1x = g.ox + g.sx, p1y = g.oy - g.sy;
    el("circle", { cx: p1x, cy: p1y, r: 4.4, fill: CL.ink }, gA);
    tx(gA, p1x + 8, p1y - 6, "(1,1)", CL.ink, "start", 9.2, 700);
    var p2x = g.ox + 2 * g.sx, p2y = g.oy - s.y2 * g.sy;
    if (s.y2 <= g.ymax - .05 && s.y2 >= g.ymin + .05) {
      el("line", { x1: p2x, y1: p2y, x2: g.ox, y2: p2y, stroke: CL.line, "stroke-dasharray": "4 3" }, gA);
      el("line", { x1: p2x, y1: p2y, x2: p2x, y2: g.oy, stroke: CL.line, "stroke-dasharray": "4 3" }, gA);
      el("circle", { cx: p2x, cy: p2y, r: 4.4, fill: col }, gA);
      tx(gA, p2x + 8, p2y - 6, "2^α = " + s.y2.toFixed(2), col, "start", 9.2, 700);
    } else {
      tx(gA, g.p.x + g.p.w - 18, g.top + 6, "x=2 时 2^α=" + s.y2.toFixed(2) + "，已冲出画面", col, "end", 9, 700);
    }

    /* 右侧：三个量一起看 */
    el("rect", { x: g.q.x, y: g.q.y, width: g.q.w, height: g.q.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    tx(gB, g.q.x + 20, g.q.y + 32, "α = " + fmt(A) + " 时三个量一起看", "#5a6472", "start", 10.5, 700);
    var cx = g.q.x + (g.w ? 22 : 16), cw = g.q.w - (g.w ? 44 : 32);
    var cy = g.q.y + 62, ch = g.w ? 84 : 92, gap = g.w ? 100 : 104;
    var rows = [
      ["① 公共点 (1,1)", "必过，与 α 无关", "因为 1^α = 1 恒成立"],
      ["② x=2 处的值 2^α", s.y2.toFixed(2), "α=−1 时只有 0.50"],
      ["③ (0,+∞) 上的单调性", s.mono > 0 ? "递增" : s.mono === 0 ? "常函数" : "递减", s.mono > 0 ? "α>0：越往右越高" : s.mono === 0 ? "y=1（x≠0），不增不减" : "α<0：不过原点，以轴为渐近线"]
    ];
    var r, y0, ax, bwd = g.w ? 130 : 92;
    for (r = 0; r < 3; r++) {
      y0 = cy + r * gap;
      el("rect", { x: cx, y: y0, width: cw, height: ch, rx: 8, fill: "#f8fbfd", stroke: "#e6e9ee" }, gB);
      tx(gB, cx + 14, y0 + 22, rows[r][0], CL.mut, "start", 9.4);
      tx(gB, cx + 14, y0 + 50, rows[r][1], r === 2 ? col : r === 1 ? CL.ink : CL.ok, "start", g.w ? 17 : 14, 700);
      tx(gB, cx + 14, y0 + 70, rows[r][2], "#5a6472", "start", 8.8);
      if (r === 1) {
        el("rect", { x: cx + cw - bwd - 20, y: y0 + 58, width: bwd, height: 7, rx: 3.5, fill: "#eef1f4" }, gB);
        el("rect", { x: cx + cw - bwd - 20, y: y0 + 58, width: Math.max(4, bwd * Math.min(1, s.y2 / 4)), height: 7, rx: 3.5, fill: col }, gB);
      }
      if (r === 2) {
        ax = cx + cw - 26;
        if (s.mono > 0) arrow(gB, ax, y0 + 66, ax, y0 + 36);
        else if (s.mono < 0) arrow(gB, ax, y0 + 36, ax, y0 + 66);
        else el("line", { x1: ax - 14, y1: y0 + 51, x2: ax + 14, y2: y0 + 51, stroke: CL.zero, "stroke-width": 2, "stroke-dasharray": "5 3" }, gB);
      }
    }
    tx(gB, cx, g.q.y + g.q.h - 16, "曲线颜色 = 单调性：蓝增 / 琥珀常 / 红减", CL.mut, "start", 8.8);
  }

  function render() {
    if (!G) { L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N; G = geom(); stage.setAttribute("viewBox", L.vb); }
    var s = calc(A), st, col, bg, sn;
    $("gxVa").textContent = fmt(A);
    $("gxVb").textContent = s.y2.toFixed(2);
    $("gxVc").textContent = "1";
    if (s.mono > 0) { st = "(0,+∞) 递增"; col = CL.pos; bg = "#e8f0fe"; sn = "α>0：越往右越高"; }
    else if (s.mono === 0) { st = "常函数"; col = CL.zero; bg = "#fdf3e0"; sn = "y=1（x≠0），不增不减"; }
    else { st = "(0,+∞) 递减"; col = CL.neg; bg = "#fbeae7"; sn = "α<0：不过原点，以轴为渐近线"; }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    draw();
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    G = geom();
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";

  var ap = AutoPilot.create({
    mount: stage, follow: $("gxSl"),
    loop: [{ t: 0, v: -2 }, { t: 1.2, v: -2 }, { t: 4, v: -1 }, { t: 6.5, v: 0.5 }, { t: 9, v: 2 }, { t: 11.5, v: 3 }, { t: 13.5, v: -2 }],
    keys: [-2, -1, 0.5, 2],
    value: A, min: -2, max: 3, step: 0.5, idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc, cases: [
    { v: -1, eq: { y2: 0.5, mono: -1 } },
    { v: 0.5, eq: { y2: 1.414, mono: 1 } },
    { v: 2, eq: { y2: 4, mono: 1 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
