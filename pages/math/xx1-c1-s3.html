<p class="gx-claim">空间向量的坐标运算只有一条主线：<b>对应分量各算各的</b>；判位置关系时，<b>垂直 ⇔ 数量积为 0</b>，<b>平行要三个分量成比例</b>。</p>

<p class="gx-lede">这一节把空间向量从「画在图上」搬成「写成三数组」：建好空间直角坐标系，向量 a 就对应唯一的三元有序实数组 (x, y, z)，加法、减法、数乘、数量积全部变成对 x、y、z 的算术。它是本章后面用向量法证平行垂直、求空间角的全部工具。最容易错的一件事：把「垂直」和「平行」的判据混着用 —— 垂直看数量积是否为 0，平行看三个分量是否成比例，而模是三项平方和。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 空间向量的坐标运算<span class="q-src">人教A版选择性必修第一册 · 第一章 1.3</span></p>
<p class="q-b">设 <span class="gx-fml">a=(x₁,y₁,z₁)</span>，<span class="gx-fml">b=(x₂,y₂,z₂)</span>，则 <span class="gx-fml">a+b=(x₁+x₂, y₁+y₂, z₁+z₂)</span>，<span class="gx-fml">a−b=(x₁−x₂, y₁−y₂, z₁−z₂)</span>，<span class="gx-fml">λa=(λx₁, λy₁, λz₁)</span>。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个条件</b>组成 —— ①先有一个空间直角坐标系 Oxyz，i、j、k 是两两垂直的单位向量；②向量 a 写成 x i + y j + z k，才记作 (x, y, z)；③加减数乘都是「同名分量对着算」。少掉 ①，坐标就没有意义；少掉 ③，就会出现 (x₁+y₂, …) 这种错位。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 数量积的坐标表示<span class="q-src">人教A版选择性必修第一册 · 第一章 1.3</span></p>
<p class="q-b">已知 <span class="gx-fml">a=(x₁,y₁,z₁)</span>，<span class="gx-fml">b=(x₂,y₂,z₂)</span>，则 <span class="gx-fml">a·b=x₁x₂+y₁y₂+z₁z₂</span>；<span class="gx-fml">|a|=√(x₁²+y₁²+z₁²)</span>。</p>
<p class="q-n">→ 翻成人话：数量积是「<b>先对应相乘，再把三个积相加</b>」，结果是一个<b>实数</b>，不是向量。三个积一个都不能少，z₁z₂ 这一项是空间区别于平面的地方；模是三项平方和再开方，同样少一项就错。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 平行与垂直的判定<span class="q-src">人教A版选择性必修第一册 · 第一章 1.3</span></p>
<p class="q-b">设 a、b 为非零向量，则 <span class="gx-fml">a⊥b ⇔ x₁x₂+y₁y₂+z₁z₂=0</span>；<span class="gx-fml">a∥b ⇔ x₁=λx₂，y₁=λy₂，z₁=λz₂（λ∈R）</span>。</p>
<p class="q-n">→ 翻成人话：两个判据各管一件事，<b>垂直 ⇔ 数量积为 0</b>，<b>平行要三个分量成比例</b>。垂直是「乘完加起来等于 0」，平行是「三个分量被同一个 λ 串起来」，不能互相替代；平行漏掉 z 分量，就等于默认所有向量都在同一个平面里。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>要判断的</th><th>正确判据</th><th>漏一个分量会怎样</th></tr></thead>
<tbody>
<tr><td>垂直 a⊥b</td><td><span class="gx-fml">x₁x₂+y₁y₂+z₁z₂=0</span>（非零向量）</td><td>只算 x₁x₂+y₁y₂，会把 z 方向上的「斜着垂直」判成不垂直</td></tr>
<tr class="key"><td>平行 a∥b</td><td>三个分量成同一比例：<span class="gx-fml">x₁=λx₂，y₁=λy₂，z₁=λz₂</span></td><td>只看 x、y，会漏掉 z 分量给出的 λ，把「方向根本不同」当成平行</td></tr>
<tr><td>模 |a|</td><td>三项平方和再开方：<span class="gx-fml">√(x₁²+y₁²+z₁²)</span></td><td>写成两项，相当于把空间向量压回平面，答案整体偏小</td></tr>
<tr><td>夹角 cos θ</td><td><span class="gx-fml">a·b / (|a||b|)</span>，分母是两个模的乘积</td><td>分母只写 |a|，余弦值被放大，角度自然算错</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">背法：<b>垂直 ⇔ 数量积为 0；平行要三个分量成比例；模是三项平方和。</b>三句话各管一件事，考场上先问自己「这题判的是哪一件事」，再动笔。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。第（2）问藏着一个容易漏掉的分量。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 垂直与平行的坐标判定<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">已知空间向量 a=(1,1,0)，b=(t,0,1)，t∈R。（1）若 a⊥b，求 t；（2）若 a∥b，求 t。两问用的是同一条判据吗？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题：两问判据不同</p>
<p class="s-b">（1）问垂直，用「数量积为 0」；（2）问平行，用「三个分量成比例」。先把 a、b 的三个分量对齐写出来：a=(1,1,0)，b=(t,0,1)，z 分量分别是 0 和 1，不能默认它不存在。</p>
<p class="s-k">用到：空间向量的坐标表示，三元有序实数组。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 第（1）问：算数量积</p>
<p class="s-b">a·b=1·t+1·0+0·1=t。垂直要求 a·b=0，所以 t=0。</p>
<p class="s-k">用到：a·b=x₁x₂+y₁y₂+z₁z₂。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 第（1）问：回代检验</p>
<p class="s-b">t=0 时 b=(0,0,1)，a·b=1·0+1·0+0·1=0，且 a、b 都是非零向量，所以 a⊥b 成立。答案：t=0。</p>
<p class="s-k">用到：垂直 ⇔ 数量积为 0（前提是非零向量）。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 第（2）问：三个分量成比例</p>
<p class="s-b">若 a∥b，存在 λ 使 a=λb，即 1=λt，1=λ·0，0=λ·1。由 z 分量得 λ=0；把 λ=0 代回 x 分量，得 1=0，矛盾。</p>
<p class="s-k">用到：平行要三个分量成比例，λ 必须同时满足三式。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收尾：陷阱在 z 分量</p>
<p class="s-b">只比 x、y 的人会想：取 t=1、λ=1 好像让 x 分量成立，但 y 分量 1=λ·0 已经矛盾，z 分量 0=λ·1 又要求 λ=0。三个分量一起看，结论是：不存在这样的 t。</p>
<p class="s-k">用到：平行必须三个分量一起检验，z 分量不能省。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）a⊥b ⇔ a·b=0。a·b=1·t+1·0+0·1=t，所以 t=0；此时 a、b 均为非零向量，垂直成立。<br>（2）若 a∥b，则存在实数 λ 使 a=λb，即 1=λt，1=λ·0，0=λ·1。由 z 分量得 λ=0，代入 x 分量得 1=0，矛盾，所以不存在实数 t 使 a∥b。<br>易错：第（2）问必须三个分量一起列式，只比 x、y 会漏掉 z 分量给出的 λ=0。</p>
</div>
</div>
</section>
<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「垂直和平行到底分别用什么判据？」</p>
<p class="a">垂直 ⇔ 数量积为 0：<b>x₁x₂+y₁y₂+z₁z₂=0</b>；平行要三个分量成比例：<b>x₁=λx₂，y₁=λy₂，z₁=λz₂</b>。一个算「乘完再相加」，一个看「三个比是否相等」，不能互换。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="垂直与平行的判据对照">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="20" y="30" font-size="9" font-weight="700" fill="#2563eb">⊥ 垂直</text>
<text x="20" y="46" font-size="9" fill="#3a3a35">x₁x₂+y₁y₂+z₁z₂=0</text>
<line x1="20" y1="58" x2="220" y2="58" stroke="#dde4ea"/>
<text x="20" y="76" font-size="9" font-weight="700" fill="#b8791f">∥ 平行</text>
<text x="20" y="92" font-size="9" fill="#3a3a35">x₁=λx₂，y₁=λy₂，z₁=λz₂</text>
<text x="20" y="112" font-size="8.6" fill="#5a6472">一个算乘加，一个看比例</text>
</svg>
</div>
<div class="qac">
<p class="q">「模是几项的平方和？」</p>
<p class="a"><b>三项</b>。<b>模是三项平方和</b>：|a|=√(x₁²+y₁²+z₁²)。空间向量有三个分量，平方和就有三项，根号里少写一项，等于把空间压回平面，数值一定偏小。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="模的三项平方和">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="20" y="32" font-size="9.6" font-weight="700" fill="#2f8a5b">|a| = √(x₁²+y₁²+z₁²)</text>
<rect x="20" y="46" width="40" height="30" rx="5" fill="#e6f6ee" stroke="#b8e6d0"/>
<text x="40" y="65" text-anchor="middle" font-size="9" fill="#2f8a5b">x₁²</text>
<rect x="70" y="46" width="40" height="30" rx="5" fill="#e6f6ee" stroke="#b8e6d0"/>
<text x="90" y="65" text-anchor="middle" font-size="9" fill="#2f8a5b">y₁²</text>
<rect x="120" y="46" width="40" height="30" rx="5" fill="#e6f6ee" stroke="#b8e6d0"/>
<text x="140" y="65" text-anchor="middle" font-size="9" fill="#2f8a5b">z₁²</text>
<text x="20" y="100" font-size="8.8" fill="#5a6472">三项都在根号里，缺一不可</text>
</svg>
</div>
<div class="qac">
<p class="q">「两个向量平行，能不能只看 x、y 分量？」</p>
<p class="a">不能。<b>平行要三个分量成比例</b>，z 分量同样给出同一个 λ。只看 x、y，会把「z 方向对不上」的两个向量误判成平行；正确做法是三式一起列，出现矛盾就说明不存在这样的 λ。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="平行时三个分量都要检验">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="20" y="28" font-size="8.8" font-weight="700" fill="#151a21">平行要三个分量成比例</text>
<rect x="20" y="38" width="66" height="26" rx="4" fill="#eef6ff" stroke="#bcd7f5"/>
<text x="53" y="55" text-anchor="middle" font-size="8.8" fill="#2563eb">x₁=λx₂</text>
<rect x="92" y="38" width="66" height="26" rx="4" fill="#eef6ff" stroke="#bcd7f5"/>
<text x="125" y="55" text-anchor="middle" font-size="8.8" fill="#2563eb">y₁=λy₂</text>
<rect x="164" y="38" width="60" height="26" rx="4" fill="#fbeae7" stroke="#e6b3aa"/>
<text x="194" y="55" text-anchor="middle" font-size="8.8" fill="#b8402f">z₁=λz₂</text>
<text x="20" y="86" font-size="8.8" fill="#5a6472">只查前两个：漏掉 z 给出的 λ</text>
<text x="20" y="104" font-size="8.8" fill="#b8402f">三个比必须相等，缺一即不平行</text>
</svg>
</div>
<div class="qac">
<p class="q">「数量积为 0，就一定垂直吗？」</p>
<p class="a">要加前提：a、b 都是<b>非零向量</b>时，a·b=0 ⇔ a⊥b。零向量与任何向量的数量积都是 0，但零向量方向不确定，课本的垂直判定限定在非零向量上，答题时写出这一句才严密。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="数量积为 0 判定垂直的前提">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="20" y="32" font-size="9.6" font-weight="700" fill="#151a21">a·b=0 ⇒ a⊥b？</text>
<text x="20" y="58" font-size="9" fill="#b8402f">还要：a≠0 且 b≠0</text>
<text x="20" y="80" font-size="8.8" fill="#5a6472">零向量方向任意，</text>
<text x="20" y="96" font-size="8.8" fill="#5a6472">课本约定不参与垂直判定</text>
<text x="20" y="114" font-size="8.6" fill="#2563eb">答题写「非零向量」四个字</text>
</svg>
</div>
<div class="qac">
<p class="q">「夹角公式的分母到底是什么？」</p>
<p class="a">是 <b>|a|·|b|</b>，两个模的乘积。分母漏一个模是高频错，会让余弦值整体偏大；另外 cos θ 的符号直接对应锐角、直角、钝角，算出负数不要急着取绝对值。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="夹角余弦的分母是两个模的乘积">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="20" y="36" font-size="11" font-weight="700" fill="#2563eb">cos θ =</text>
<text x="96" y="32" font-size="10" font-weight="700" fill="#151a21">a·b</text>
<line x1="92" y1="42" x2="150" y2="42" stroke="#151a21"/>
<text x="80" y="60" font-size="10" font-weight="700" fill="#151a21">|a|·|b|</text>
<text x="20" y="88" font-size="8.8" fill="#5a6472">分母是两个模的乘积，不是一个</text>
<text x="20" y="106" font-size="8.8" fill="#b8402f">漏一个模 ⇒ 余弦偏大 ⇒ 角错</text>
</svg>
</div>
<div class="qac">
<p class="q">「空间坐标与平面坐标的差别在哪？」</p>
<p class="a">只多一个 z 分量，但每一处都要补：点写成 (x,y,z)、<b>模是三项平方和</b>、<b>平行要三个分量成比例</b>、数量积多一项 z₁z₂。判据本身没变，变的是「项数」。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="平面坐标与空间坐标的差别">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="20" y="32" font-size="8.8" font-weight="700" fill="#5a6472">平面：两项</text>
<text x="20" y="50" font-size="8.8" fill="#3a3a35">(x, y)，√(x²+y²)</text>
<line x1="20" y1="62" x2="220" y2="62" stroke="#dde4ea"/>
<text x="20" y="80" font-size="8.8" font-weight="700" fill="#2563eb">空间：三项</text>
<text x="20" y="98" font-size="8.8" fill="#3a3a35">(x, y, z)，√(x²+y²+z²)</text>
<text x="20" y="116" font-size="8.6" fill="#b8402f">每处都要补上第三项</text>
</svg>
</div>
</div>
<p class="gx-note">六问其实是同一件事：空间比平面多一个 z 分量 —— 数量积多一项、模多一项平方、平行多一个比例。判据一条都没变，变的是「别把第三项弄丢」。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 因为 a∥b，所以 a·b=0。</p>
<p class="er-v">✓ 平行要三个分量成比例；垂直 ⇔ 数量积为 0。</p>
<p class="er-w">错在哪：把两条判据对调了，平行与数量积没有直接关系。</p>
</div>
<div class="er">
<p class="er-x">✗ 判 a⊥b，只算 x₁x₂+y₁y₂=0 就够了。</p>
<p class="er-v">✓ a⊥b ⇔ x₁x₂+y₁y₂+z₁z₂=0，三项相加。</p>
<p class="er-w">错在哪：漏掉 z₁z₂，等于只在平面里判垂直。</p>
</div>
<div class="er">
<p class="er-x">✗ |a|=√(x₁²+y₁²)。</p>
<p class="er-v">✓ 模是三项平方和：|a|=√(x₁²+y₁²+z₁²)。</p>
<p class="er-w">错在哪：空间向量有三个分量，少一项结果偏小。</p>
</div>
<div class="er">
<p class="er-x">✗ 只要 x₁/x₂=y₁/y₂，两个向量就平行。</p>
<p class="er-v">✓ 平行要三个分量成比例，还要 z₁=λz₂，且 λ 必须同时满足三式。</p>
<p class="er-w">错在哪：z 分量可能给出矛盾的 λ，必须一起检验。</p>
</div>
<div class="er">

<script>
/* 互动脚本本体（由 build-page.mjs 包进 <script> 里，所以这里不要写 <script> 标签） */
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var GX = window.GX, el = GX.el, tx = GX.tx, $ = GX.$;
  var stage = $("gxStage");
  if (!stage || !window.AutoPilot) return;

  /* 两套坐标：宽屏 880×470，窄屏独立 360×700 */
  var W = { vb: "0 0 880 470", left: { x: 16, y: 16, w: 424, h: 438 }, right: { x: 456, y: 16, w: 408, h: 438 } };
  var N = { vb: "0 0 360 700", left: { x: 8, y: 8, w: 344, h: 300 }, right: { x: 8, y: 316, w: 344, h: 376 } };
  var L = W, G = null, A = 0;

  /* 纯函数：t → 数值。render() 和 __model.cases 都用它 */
  function calc(v) {
    var t = Number(v);
    return {
      dot: t,
      perp: t === 0 ? 1 : 0,
      absB: Math.sqrt(t * t + 1),
      cos: t / (Math.SQRT2 * Math.sqrt(t * t + 1))
    };
  }

  function geom() {
    var narrow = L === N;
    return {
      narrow: narrow,
      s: narrow ? 42 : 62,
      ox: narrow ? 172 : 218,
      oy: narrow ? 246 : 372,
      rx: L.right.x + 18,
      ry: L.right.y + 58,
      lh: narrow ? 25 : 30,
      fs: narrow ? 9.2 : 10.2
    };
  }

  /* 空间点 → 屏幕点：x 向右，y 向右上（进深），z 向上 */
  function P3(x, y, z) {
    return { x: G.ox + x * G.s + y * G.s * 0.55, y: G.oy - z * G.s - y * G.s * 0.45 };
  }

  function seg(g, p, q, col, w, dash) {
    var a = { x1: p.x, y1: p.y, x2: q.x, y2: q.y, stroke: col, "stroke-width": w || 1.4 };
    if (dash) a["stroke-dasharray"] = dash;
    el("line", a, g);
  }

  function head(g, p, q, col) {
    var an = Math.atan2(q.y - p.y, q.x - p.x), h = 9;
    el("polygon", {
      points: q.x + "," + q.y + " " +
        (q.x - h * Math.cos(an - 0.42)) + "," + (q.y - h * Math.sin(an - 0.42)) + " " +
        (q.x - h * Math.cos(an + 0.42)) + "," + (q.y - h * Math.sin(an + 0.42)),
      fill: col
    }, g);
  }

  function arrow(g, p, q, col, w) {
    seg(g, p, q, col, w || 2.4);
    head(g, p, q, col);
  }

  function draw() {
    var gA = $("gxA"), gB = $("gxB");
    gA.textContent = ""; gB.textContent = "";
    var s = calc(A), lf = L.left, rg = L.right;

    /* 左：坐标系 + 两个向量 */
    el("rect", { x: lf.x, y: lf.y, width: lf.w, height: lf.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    tx(gA, lf.x + 18, lf.y + 24, "空间直角坐标系中的 a 与 b", "#5a6472", "start", 10.5, 700);

    var O = P3(0, 0, 0), ax = P3(2.6, 0, 0), ay = P3(0, 2.2, 0), az = P3(0, 0, 2);
    arrow(gA, O, ax, "#5a6472", 1.3);
    arrow(gA, O, ay, "#5a6472", 1.3);
    arrow(gA, O, az, "#5a6472", 1.3);
    tx(gA, ax.x + 6, ax.y + 4, "x", "#5a6472", "start", 10.5, 700);
    tx(gA, ay.x + 5, ay.y - 6, "y", "#5a6472", "start", 10.5, 700);
    tx(gA, az.x - 6, az.y - 8, "z", "#5a6472", "end", 10.5, 700);
    tx(gA, O.x - 8, O.y + 16, "O", "#5a6472", "end", 10, 700);

    var u, q;
    for (u = 1; u <= 2; u++) {
      q = P3(u, 0, 0);
      seg(gA, { x: q.x, y: q.y - 4 }, { x: q.x, y: q.y + 4 }, "#9aa7b4", 1);
      q = P3(0, u, 0);
      seg(gA, { x: q.x - 2.6, y: q.y - 2.1 }, { x: q.x + 2.6, y: q.y + 2.1 }, "#9aa7b4", 1);
      q = P3(0, 0, u);
      seg(gA, { x: q.x - 4, y: q.y }, { x: q.x + 4, y: q.y }, "#9aa7b4", 1);
    }

    var pa = P3(1, 1, 0), pb = P3(A, 0, 1), foot = P3(A, 0, 0);
    seg(gA, pb, foot, "#9aa7b4", 1, "4 3");
    seg(gA, O, pa, "#2563eb", 2.4);
    head(gA, O, pa, "#2563eb");
    seg(gA, O, pb, "#2f8a5b", 2.4);
    head(gA, O, pb, "#2f8a5b");
    el("circle", { cx: foot.x, cy: foot.y, r: 2.6, fill: "#9aa7b4" }, gA);
    tx(gA, pa.x + 10, pa.y - 7, "a", "#2563eb", "start", 11.5, 700);
    tx(gA, pb.x + (A >= 0 ? 10 : -18), pb.y - 7, "b", "#2f8a5b", "start", 11.5, 700);
    tx(gA, lf.x + 18, lf.y + lf.h - 16, "a=(1,1,0) 固定；b=(t,0,1) 随 t 变", "#5a6472", "start", 9.2, 400);

    if (s.perp) {
      tx(gA, lf.x + lf.w - 20, lf.y + 46, "a ⊥ b（数量积为 0）", "#2563eb", "end", 10.5, 700);
    } else {
      tx(gA, lf.x + lf.w - 20, lf.y + 46, "a 与 b 不垂直", "#b8791f", "end", 10.5, 700);
    }

    /* 右：数值口径 */
    el("rect", { x: rg.x, y: rg.y, width: rg.w, height: rg.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    tx(gB, G.rx, rg.y + 28, "数值：一个实数 + 一个状态", "#5a6472", "start", 10.5, 700);

    var y = G.ry;
    tx(gB, G.rx, y, "a = (1, 1, 0)", "#3a3a35", "start", G.fs, 400);
    y += G.lh;
    tx(gB, G.rx, y, "b = (t, 0, 1)，t = " + A.toFixed(1), "#3a3a35", "start", G.fs, 400);
    y += G.lh;
    tx(gB, G.rx, y, "a·b = 1·t + 1·0 + 0·1 = " + s.dot.toFixed(1), "#2563eb", "start", G.fs, 700);
    y += G.lh;
    tx(gB, G.rx, y, "|b| = √(t²+1) = " + s.absB.toFixed(3), "#3a3a35", "start", G.fs, 400);
    y += G.lh;
    tx(gB, G.rx, y, "cos θ = t / (√2·√(t²+1))", "#3a3a35", "start", G.fs, 400);
    y += G.lh;
    tx(gB, G.rx + 20, y, "= " + s.cos.toFixed(3), "#3a3a35", "start", G.fs, 400);

    y += G.lh;
    seg(gB, { x: G.rx, y: y - 12 }, { x: rg.x + rg.w - 18, y: y - 12 }, "#e6e9ee", 1);

    if (s.perp) {
      tx(gB, G.rx, y, "a·b = 0 ⇒ a ⊥ b", "#2563eb", "start", G.fs + 0.4, 700);
    } else {
      tx(gB, G.rx, y, "a·b ≠ 0 ⇒ 不垂直", "#b8791f", "start", G.fs, 700);
    }
    y += G.lh;
    tx(gB, G.rx, y, "垂直 ⇔ 数量积为 0", "#5a6472", "start", G.fs - 0.4, 400);

    /* t 的数轴 */
    var rl = rg.x + 30, rr = rg.x + rg.w - 30, ry = rg.y + rg.h - 62;
    seg(gB, { x: rl, y: ry }, { x: rr, y: ry }, "#c8d2db", 1.4);
    var ks = [-2, -1, 0, 1, 2], k, mx;
    for (k = 0; k < ks.length; k++) {
      u = ks[k];
      mx = rl + (u + 2) / 4 * (rr - rl);
      seg(gB, { x: mx, y: ry - 4 }, { x: mx, y: ry + 4 }, "#c8d2db", 1.2);
      tx(gB, mx, ry + 18, String(u), "#9aa7b4", "middle", 8.6, 400);
    }
    mx = rl + (A + 2) / 4 * (rr - rl);
    el("circle", { cx: mx, cy: ry, r: 5, fill: s.perp ? "#2563eb" : "#b8791f" }, gB);
  }

  function render() {
    if (!G) { L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N; G = geom(); stage.setAttribute('viewBox', L.vb); }
    var s = calc(A), st, col, bg, sn;
    $("gxVa").textContent = A.toFixed(1);
    $("gxVb").textContent = s.dot.toFixed(1);
    $("gxVc").textContent = s.cos.toFixed(3);
    if (s.perp) { st = "垂直"; col = "#2563eb"; bg = "#eef6ff"; sn = "数量积为 0"; }
    else { st = "不垂直"; col = "#b8791f"; bg = "#fdf3e0"; sn = "数量积不为 0"; }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    draw();
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    G = geom();
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: -2 }, { t: 1.2, v: -2 }, { t: 4, v: 0 }, { t: 6.5, v: 0 }, { t: 9, v: 2 }, { t: 11.5, v: 1 }, { t: 13.5, v: -2 }],
    keys: [-2, 0, 1, 2],
    value: A, min: -2, max: 2, step: 0.5,
    idle: 5000,
    onChange: function (v) { A = parseFloat(v); render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc, cases: [
    { v: 0, eq: { dot: 0, perp: 1, cos: 0 } },
    { v: 1, eq: { dot: 1, perp: 0, cos: 0.5 } },
    { v: -2, eq: { dot: -2, perp: 0, cos: -0.6325 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
