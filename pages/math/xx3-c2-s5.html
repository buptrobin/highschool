<p class="gx-claim">正态分布只看两件事：<b>μ 决定曲线在哪</b>、<b>σ 决定曲线多胖</b>；曲线的高度不是概率，<b>曲线下的面积才是概率</b>。</p>
<div class="gx-meta">
<span><i></i>人教A版选择性必修第三册 第7章第5节</span>
<span><i></i>高二 · 选择性必修第三册</span>
<span><i></i>阅读 13 分钟</span>
<span><i></i>含 1 个互动模型</span>
</div>
<p class="gx-lede">7.5 是「离散型随机变量」之后第一次正式处理连续型随机变量：分布列换成了概率密度曲线，求和换成了面积。理解上唯一的门槛是——<b>曲线本身不产生概率，曲线下的面积才产生概率</b>；计算上唯一要背的是 3σ 原则的三个固定数。最容易错的是把峰值 1/(σ√(2π)) 当成「概率」，以及 σ 变大时以为面积也跟着变大。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 正态分布的定义<span class="q-src">人教A版选择性必修第三册 · 第7章第5节</span></p>
<p class="q-b">若随机变量 X 的概率密度函数为 <span class="gx-fml">f(x) = 1/(σ√(2π)) · e^(−(x−μ)²/(2σ²))，x ∈ (−∞, +∞)</span>，则称 X 服从正态分布，记作 <span class="gx-fml">X ~ N(μ, σ²)</span>，其中 μ、σ 分别是均值与标准差，σ&gt;0。</p>
<p class="q-n">→ 翻成人话：这条式子由<b>四个条件</b>组成——① σ&gt;0；② 曲线关于 x=μ 对称；③ 曲线与 x 轴之间<b>总面积恒为 1</b>；④ 峰值在 x=μ 处、高度为 1/(σ√(2π))。前三条规定「谁有资格叫概率密度」，第四条只是刻画形状。少一条就不是正态分布；把第四条当概率，就必扣分。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 曲线的几何特征<span class="q-src">人教A版选择性必修第三册 · 第7章第5节</span></p>
<p class="q-b">正态曲线关于直线 x=μ 对称；σ 越大，曲线越「矮胖」，表示总体分布越分散；σ 越小，曲线越「瘦高」，表示总体分布越集中。</p>
<p class="q-n">→ 翻成人话：μ 只管<b>左右位置</b>（平移），σ 只管<b>胖瘦</b>（压缩与拉伸）。但「胖瘦」压的是宽度，面积由 1 锁死：σ 变大曲线变矮，是为了把同样的面积摊得更宽，<b>面积仍是 1</b>。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 3σ 原则<span class="q-src">人教A版选择性必修第三册 · 第7章第5节</span></p>
<p class="q-b">P(μ−σ&lt;X≤μ+σ) ≈ 0.6827，P(μ−2σ&lt;X≤μ+2σ) ≈ 0.9545，P(μ−3σ&lt;X≤μ+3σ) ≈ 0.9973。可以看到，正态总体几乎总取值于区间 (μ−3σ, μ+3σ) 之内。</p>
<p class="q-n">→ 翻成人话：这三个数是<b>固定值</b>，与 μ、σ 的具体取值无关（所以叫「原则」不叫「公式」）。它们是「查不到表时的近似口径」，答题写 0.6827 / 0.9545 / 0.9973，不要写 0.68 / 0.95 / 0.99。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>条件</th><th>标准表述（答题照写）</th><th>搞错了会怎样</th></tr></thead>
<tbody>
<tr><td>① σ&gt;0</td><td>σ 是标准差，恒取正值，μ 才是对称轴</td><td>把 σ 与 μ 的位置写反 ⇒ N(90,100) 读成 σ=90</td></tr>
<tr class="key"><td>② 面积才是概率</td><td>曲线与 x 轴之间总面积 = 1，P(a&lt;X≤b) = 该段面积</td><td>拿高度当概率 ⇒ 算出 0.3989 这种「概率」，直接零分</td></tr>
<tr><td>③ 对称轴 x=μ</td><td>曲线关于 x=μ 左右对称，两侧面积各 1/2</td><td>求单侧概率忘记除以 2，答案翻倍</td></tr>
<tr><td>④ 3σ 固定值</td><td>0.6827 / 0.9545 / 0.9973，与 μ、σ 无关</td><td>自己编 0.68 / 0.95 / 0.99，精度不够照样扣</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">背法：把这条曲线想成一个<b>装了 1 升水的气球</b>——水量（面积）永远是 1，σ 是把气球压扁或拉高，μ 是把它整体拎到哪。压扁了当然会矮，但水一点没少。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 正态分布求区间概率<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">某次考试的数学成绩 X 服从正态分布 N(90, 100)。（1）求 P(80&lt;X≤100)；（2）求 P(X&gt;110)；（3）估计这次考试中成绩在 (70, 110) 之外的学生比例。<b>陷阱</b>：第（2）问不是 1−0.9545=0.0455，因为那是双侧。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 读出 μ 与 σ</p>
<p class="s-b">N(90,100) 的第二个数是<b>方差</b> σ²，不是标准差。所以 μ=90，σ²=100，σ=10。这一步写反，后面全错。</p>
<p class="s-k">用到：X~N(μ,σ²)，σ&gt;0；σ²=100 ⇒ σ=10。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 把区间翻译成 μ±kσ</p>
<p class="s-b">80=90−10=μ−σ，100=90+10=μ+σ，所以 (80,100] 正好是 μ±σ 一段。直接用 3σ 原则的第一个数：P(80&lt;X≤100)≈0.6827。</p>
<p class="s-k">用到：P(μ−σ&lt;X≤μ+σ)≈0.6827。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 第（2）问先看是单侧还是双侧</p>
<p class="s-b">110=90+2×10=μ+2σ。P(μ−2σ&lt;X≤μ+2σ)≈0.9545 是<b>双侧</b>尾巴合计 0.0455，由对称性两侧各一半，所以 P(X&gt;110)=(1−0.9545)/2=0.02275≈0.0228。</p>
<p class="s-k">用到：对称轴 x=μ 两侧面积各 1/2；单侧概率要除 2。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 第（3）问用两层口径核对</p>
<p class="s-b">(70,110] 就是 μ±2σ，面积 0.9545，落在它之外的是 1−0.9545=0.0455，约 4.55%。注意这里问「之外」是双侧，<b>不用除 2</b>——和上一步正好相反，判断依据永远是「区间是否关于 μ 对称」。</p>
<p class="s-k">用到：双侧外部 = 1−P(μ−2σ&lt;X≤μ+2σ)；单侧外部 = 该值 ÷2。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 写进答题卡的样子</p>
<p class="s-b">三问都要先写「μ=90，σ=10」再写区间对应关系，最后才代 0.6827 / 0.9545。只写数字不写区间，过程分拿不到。</p>
<p class="s-k">用到：3σ 原则的三个固定值 0.6827 / 0.9545 / 0.9973。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">由 X~N(90,100) 得 μ=90，σ=10。<br>（1）80=μ−σ，100=μ+σ，故 P(80&lt;X≤100)=P(μ−σ&lt;X≤μ+σ)≈0.6827。<br>（2）110=μ+2σ，P(μ−2σ&lt;X≤μ+2σ)≈0.9545，由正态曲线的对称性，P(X&gt;μ+2σ)=(1−0.9545)/2=0.02275≈0.0228。<br>（3）70=μ−2σ，110=μ+2σ，(70,110] 之外的比例为 1−0.9545=0.0455，即约 4.55%。<br>答：（1）0.6827；（2）0.0228；（3）约 4.55%。</p>
</div>
</div>
</section>
<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「曲线最高点那个 0.3989，不就是 X=0 的概率吗？」</p>
<p class="a">不是。<b>曲线高度不是概率，面积才是概率</b>；纵轴是概率密度 f(x)，P(X=某个确定值)=0，所以任何一点的「高度」都不可能是概率。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="峰值高度标注 0.3989 的钟形曲线，旁边写着高度不是概率">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<path d="M34,110 Q70,108 90,96 Q106,86 114,62 Q117,48 120,46 Q123,48 126,62 Q134,86 150,96 Q170,108 206,110" fill="#e8f1fd" stroke="#2563eb" stroke-width="1.4"/>
<line x1="120" y1="46" x2="120" y2="110" stroke="#94a3b8" stroke-dasharray="2 2"/>
<text x="126" y="42" font-size="8.4" fill="#3a3a35">高度 0.3989</text>
<text x="126" y="122" font-size="8.4" fill="#b8402f">≠ 概率</text>
</svg>
</div>
<div class="qac">
<p class="q">「σ 从 1 变成 2，曲线矮了一半，面积是不是也小了？」</p>
<p class="a">没有。<b>σ 变大曲线变矮但面积仍是 1</b>；峰值从 0.3989 降到 0.1995，宽度同步变宽，两者正好抵消，总量恒为 1。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="一条高瘦曲线和一条矮胖曲线，面积都等于 1">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<path d="M74,110 Q94,108 104,92 Q113,78 117,44 Q118,38 120,36 Q122,38 123,44 Q127,78 136,92 Q146,108 166,110" fill="none" stroke="#2563eb" stroke-width="1.4"/>
<path d="M26,110 Q62,108 86,99 Q109,90 118,76 Q120,72 122,76 Q131,90 154,99 Q178,108 214,110" fill="#e8f1fd" stroke="#2f8a5b" stroke-width="1.4"/>
<text x="164" y="40" font-size="8.4" fill="#2563eb">σ=1</text>
<text x="196" y="90" font-size="8.4" fill="#2f8a5b">σ=2</text>
<text x="30" y="122" font-size="8.4" fill="#b8402f">两个面积都是 1</text>
</svg>
</div>
<div class="qac">
<p class="q">「3σ 原则那三个数要背到几位？」</p>
<p class="a"><b>3σ 原则是 0.6827 / 0.9545 / 0.9973</b>，四位小数，三个数固定不变，与 μ、σ 无关。写 0.68、0.95、0.99 在解答题里算精度不足。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="三行固定概率值 0.6827、0.9545、0.9973">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="26" y="40" font-size="8.8" fill="#3a3a35">μ±σ</text>
<text x="96" y="40" font-size="8.8" font-weight="700" fill="#1d4ed8">0.6827</text>
<text x="26" y="68" font-size="8.8" fill="#3a3a35">μ±2σ</text>
<text x="96" y="68" font-size="8.8" font-weight="700" fill="#1d4ed8">0.9545</text>
<text x="26" y="96" font-size="8.8" fill="#3a3a35">μ±3σ</text>
<text x="96" y="96" font-size="8.8" font-weight="700" fill="#1d4ed8">0.9973</text>
</svg>
</div>
<div class="qac">
<p class="q">「连续型随机变量，为什么 P(X=90)=0？」</p>
<p class="a">因为 X 取某个确定值的概率等于<b>该点处「竖线」的面积</b>，而一条竖线没有宽度，面积为 0。这就是 P(a&lt;X≤b)=P(a≤X&lt;b) 可以随意改写的原因。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="曲线上 x 等于 90 处的一条竖线，宽度为 0 所以面积为 0">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<path d="M34,110 Q70,108 90,96 Q106,86 114,62 Q117,48 120,46 Q123,48 126,62 Q134,86 150,96 Q170,108 206,110" fill="#e8f1fd" stroke="#2563eb" stroke-width="1.4"/>
<line x1="140" y1="110" x2="140" y2="82" stroke="#b8402f" stroke-width="2.2"/>
<text x="146" y="80" font-size="8.4" fill="#b8402f">宽度 0 ⇒ 面积 0</text>
</svg>
</div>
<div class="qac">
<p class="q">「μ 变大，曲线除了平移还会变什么？」</p>
<p class="a">什么都不变。<b>μ 只决定对称轴的位置</b>，形状、峰值、面积全部保留；反之 σ 变才改形状，μ 不变。答题时先定谁在动。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="两条形状相同只是左右错开的曲线">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<path d="M22,108 Q46,106 60,96 Q72,86 76,70 Q78,64 80,62 Q82,64 84,70 Q88,86 100,96 Q114,106 138,108" fill="none" stroke="#a2603a" stroke-width="1.3"/>
<path d="M110,108 Q134,106 148,96 Q160,86 164,70 Q166,64 168,62 Q170,64 172,70 Q176,86 188,96 Q202,106 226,108" fill="none" stroke="#2f8a5b" stroke-width="1.3"/>
<line x1="80" y1="46" x2="168" y2="46" stroke="#2563eb" stroke-width="1"/>
<text x="124" y="42" font-size="8.2" fill="#2563eb">平移</text>
<text x="22" y="122" font-size="8.4" fill="#3a3a35">形状与面积不变，只是位置变了</text>
</svg>
</div>
<div class="qac">
<p class="q">「知道 P(X&lt;80) 有用吗？能不能推出 P(X&gt;100)？」</p>
<p class="a">能，靠<b>关于 x=μ 的对称性</b>：对称位置的两段面积相等，两侧合计占 1−中部面积。常用三句：P(X&lt;μ)=P(X&gt;μ)=0.5，P(X&gt;μ+a)=P(X&lt;μ−a)，尾部合计 =1−中部。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="关于 μ 对称的两个尾部区域面积相等">

<path d="M34,110 Q70,108 90,96 L90,110 Z" fill="#f6c9c2" stroke="#b8402f" stroke-width="1"/>
<path d="M150,96 Q170,108 206,110 L150,110 Z" fill="#f6c9c2" stroke="#b8402f" stroke-width="1"/>
<line x1="120" y1="110" x2="120" y2="44" stroke="#94a3b8" stroke-dasharray="2 2"/>
<text x="120" y="42" font-size="8.4" fill="#5a6472" text-anchor="middle">μ</text>
<text x="26" y="124" font-size="8.2" fill="#b8402f">两块面积相等</text>
</svg>
</div>
</div>
<p class="gx-note">六问其实是同一件事：<b>概率只认面积</b>。高度、宽度、位置都只是形状信息，凡是要「求概率」，一律回到「哪一段面积、关于 μ 对不对称、要不要除以 2」这三步。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 由图可知 P(X=0)=0.3989。</p>
<p class="er-v">✓ 曲线在 x=0 处的高度为 f(0)=1/(σ√(2π))≈0.3989；P(X=0)=0，概率等于曲线下相应区间的面积。</p>
<p class="er-w">错在哪：曲线高度不是概率，面积才是概率。</p>
</div>
<div class="er">
<p class="er-x">✗ σ 变大后曲线变矮，说明取值更集中、面积变小。</p>
<p class="er-v">✓ σ 越大分布越分散，曲线越矮胖；但曲线下总面积恒为 1，σ 变大曲线变矮而面积仍是 1。</p>
<p class="er-w">错在哪：把「矮」当成「总面积小」，还顺手把「分散」说成「集中」。</p>
</div>
<div class="er">
<p class="er-x">✗ P(μ−σ&lt;X≤μ+σ)≈0.68，P(μ−2σ&lt;X≤μ+2σ)≈0.95。</p>
<p class="er-v">✓ 3σ 原则是 0.6827 / 0.9545 / 0.9973，三位有效数字以上，与 μ、σ 取值无关。</p>
<p class="er-w">错在哪：数字精度不够，解答题里按错值扣分。</p>
</div>
<div class="er">
<p class="er-x">✗ 由 P(μ−2σ&lt;X≤μ+2σ)=0.9545 得 P(X&gt;μ+2σ)=0.0455。</p>
<p class="er-v">✓ 0.9545 是双侧面积，两侧尾巴对称，故 P(X&gt;μ+2σ)=(1−0.9545)/2≈0.0228。</p>
<p class="er-w">错在哪：求单侧概率忘记除以 2，答案刚好翻倍。</p>
</div>
<div class="er">
<p class="er-x">✗ 因为 X~N(90,100)，所以 μ=100，σ=90。</p>
<p class="er-v">✓ N(μ,σ²) 的第二个数是方差，故 μ=90，σ²=100，σ=10。</p>
<p class="er-w">错在哪：μ 与 σ 位置写反，还把方差当成了标准差。</p>
</div>
<div class="er">
<p class="er-x">✗ 直接用公式算出 P(80&lt;X≤100) 的精确值。</p>
<p class="er-v">✓ 该积分没有初等原函数，教材口径是用 3σ 原则近似（或查标准正态分布表）。</p>
<p class="er-w">错在哪：以为正态分布总能算出精确值，写「=0.682689……」反而露怯。</p>
</div>
<div class="er">
<p class="er-x">✗ 正态曲线关于 y 轴对称。</p>
<p class="er-v">✓ 正态曲线关于直线 x=μ 对称；只有 μ=0 时才恰好与 y 轴重合。</p>
<p class="er-w">错在哪：把「标准正态」的特例当成了普遍结论。</p>
</div>

<script>
/* 互动脚本本体（由 build-page.mjs 包进 <script> 里，所以这里不要写 <script> 标签） */
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var GX = window.GX, el = GX.el, tx = GX.tx, $ = GX.$;
  var stage = $("gxStage");
  if (!stage || !window.AutoPilot) return;

  /* 两套坐标：宽屏 880×470，窄屏独立 360×700 */
  var W = { vb: "0 0 880 470", left: { x: 16, y: 16, w: 424, h: 438 }, right: { x: 456, y: 16, w: 408, h: 438 } };
  var N = { vb: "0 0 360 700", left: { x: 8, y: 8, w: 344, h: 300 }, right: { x: 8, y: 320, w: 344, h: 372 } };
  var L = W, A = 1, G = null;

  var SQ2PI = Math.sqrt(2 * Math.PI);
  function pdf(x, s) { return Math.exp(-(x * x) / (2 * s * s)) / (s * SQ2PI); }

  /* 纯函数：σ → 数值。render() 与 __model.cases 共用 */
  function calc(v) {
    var s = Math.max(0.25, Number(v) || 1);
    return {
      peak: 1 / (SQ2PI * s),   // 峰值高度
      p1: 0.6827,              // P(|X|<σ)，恒定
      p2: 0.9545,              // P(|X|<2σ)，恒定
      p3: 0.9973               // P(|X|<3σ)，恒定
    };
  }

  function geom() {
    var wide = (L === W), p = L.left, q = L.right;
    var pad = wide ? 30 : 20;
    return {
      wide: wide,
      base: p.y + p.h - (wide ? 62 : 54),
      x0: p.x + p.w / 2,
      sc: (p.w - 2 * pad) / 9,
      k: wide ? 330 : 205
    };
  }

  function bellPoint(x, s) { return G.x0 + x * G.sc; }
  function bellY(x, s) { return G.base - pdf(x, s) * G.k; }

  function curvePath(s) {
    var d = [], i, x, n = 150;
    for (i = 0; i <= n; i++) {
      x = -4.5 + (9 * i) / n;
      d.push((i ? "L" : "M") + bellPoint(x).toFixed(1) + "," + bellY(x, s).toFixed(1));
    }
    return d.join(" ");
  }

  function bandPath(s, a) {
    var d = [], i, x, n = 48;
    for (i = 0; i <= n; i++) {
      x = -a + (2 * a * i) / n;
      d.push((i ? "L" : "M") + bellPoint(x).toFixed(1) + "," + bellY(x, s).toFixed(1));
    }
    d.push("L" + bellPoint(a).toFixed(1) + "," + G.base);
    d.push("L" + bellPoint(-a).toFixed(1) + "," + G.base + " Z");
    return d.join(" ");
  }

  function draw(s) {
    var gA = $("gxA"), gB = $("gxB"), p = L.left, q = L.right;
    var col = s < 0.95 ? "#2563eb" : (s > 1.05 ? "#2f8a5b" : "#1d4ed8");
    gA.textContent = ""; gB.textContent = "";
    el("rect", { x: p.x, y: p.y, width: p.w, height: p.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    tx(gA, p.x + 18, p.y + 28, "N(0, σ²) 的曲线与 μ±σ 段", "#5a6472", "start", 10.2, 700);

    /* 坐标轴 */
    el("line", { x1: G.x0, y1: G.base, x2: G.x0, y2: G.base - 300, stroke: "#9aa4b0" }, gA);
    el("polygon", { points: (G.x0) + "," + (G.base - 306) + " " + (G.x0 - 4) + "," + (G.base - 296) + " " + (G.x0 + 4) + "," + (G.base - 296), fill: "#9aa4b0" }, gA);
    var xl = G.x0 + 4.5 * G.sc;
    el("line", { x1: G.x0 - 4.5 * G.sc, y1: G.base, x2: xl - 6, y2: G.base, stroke: "#9aa4b0" }, gA);
    el("polygon", { points: (xl) + "," + G.base + " " + (xl - 9) + "," + (G.base - 3.5) + " " + (xl - 9) + "," + (G.base + 3.5), fill: "#9aa4b0" }, gA);
    tx(gA, xl - 2, G.base - 8, "x", "#5a6472", "end", 9, 400);

    var i, x;
    for (i = -3; i <= 3; i++) {
      if (i === 0) continue;
      x = bellPoint(i);
      el("line", { x1: x, y1: G.base, x2: x, y2: G.base + 5, stroke: "#9aa4b0" }, gA);
      tx(gA, x, G.base + 17, String(i), "#5a6472", "middle", 8.8, 400);
    }
    tx(gA, G.x0, G.base + 17, "μ=0", "#151a21", "middle", 8.8, 700);

    /* 阴影：μ±σ 段 */
    el("path", { d: bandPath(s, s), fill: "#cfe4fb", stroke: "none" }, gA);
    /* 2σ 虚线 */
    [-2, 2].forEach(function (t) {
      var xx = bellPoint(t * s);
      if (xx > G.x0 - 4.4 * G.sc && xx < xl) {
        el("line", { x1: xx, y1: G.base, x2: xx, y2: bellY(t * s, s), stroke: "#94a3b8", "stroke-dasharray": "3 3" }, gA);
      }
    });
    el("path", { d: curvePath(s), fill: "none", stroke: col, "stroke-width": 2.1 }, gA);

    var py = bellY(0, s), pk = 1 / (SQ2PI * s);
    el("circle", { cx: G.x0, cy: py, r: 2.6, fill: col }, gA);
    tx(gA, Math.min(G.x0 + 12, xl - 96), py - 7, "峰值 " + pk.toFixed(4), "#3a3a35", "start", 8.8, 700);
    tx(gA, p.x + 18, p.y + p.h - 10, "阴影 = μ±σ 段，面积恒为 0.6827（与 σ 无关）", "#5a6472", "start", 8.6, 400);

    /* 右面板：峰值柱 + 固定面积条 */
    el("rect", { x: q.x, y: q.y, width: q.w, height: q.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    tx(gB, q.x + 18, q.y + 28, "峰值随 σ 变，面积不变", "#5a6472", "start", 10.2, 700);
    var cands = [0.5, 1, 2, 3], maxP = 1 / (SQ2PI * 0.5);
    var bw = q.w * 0.66, bx = q.x + q.w * 0.17, gap = bw / 4;
    var baseY = q.y + q.h - (G.wide ? 168 : 148);
    var maxH = G.wide ? 190 : 150;
    tx(gB, q.x + 18, q.y + 48, "σ 取 0.5 / 1 / 2 / 3 时的峰值", "#8a929c", "start", 8.4, 400);
    cands.forEach(function (c, idx) {
      var hh = (1 / (SQ2PI * c)) / maxP * maxH;
      var cur = Math.abs(c - s) < 0.13;
      var cx = bx + idx * gap + gap * 0.24;
      el("rect", { x: cx, y: baseY - hh, width: gap * 0.52, height: hh, rx: 3, fill: cur ? "#2563eb" : "#dbe7ef" }, gB);
      tx(gB, cx + gap * 0.26, baseY + 13, "σ=", "#8a929c", "middle", 8, 400);
      tx(gB, cx + gap * 0.26, baseY + 25, String(c), "#5a6472", "middle", 8.4, 700);
      tx(gB, cx + gap * 0.26, baseY - hh - 4, (1 / (SQ2PI * c)).toFixed(3), "#3a3a35", "middle", 7.8, 400);
    });

    var areaY = baseY + (G.wide ? 58 : 52);
    tx(gB, bx, areaY - 6, "曲线下总面积（≡ 概率总量）", "#8a929c", "start", 8.4, 400);
    el("rect", { x: bx, y: areaY, width: bw, height: 15, rx: 4, fill: "#e8f1fd", stroke: "#9ec8f5" }, gB);
    tx(gB, bx + bw / 2, areaY + 11, "面积 = 1，σ 怎么变都是 1", "#1d4ed8", "middle", 8.6, 700);
  }

  function render() {
    if (!G) { L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N; G = geom(); stage.setAttribute("viewBox", L.vb); }
    var s = calc(A), st, col, bg, sn;
    $("gxVa").textContent = Number(A).toFixed(2);
    $("gxVb").textContent = s.peak.toFixed(4);
    $("gxVc").textContent = s.p1.toFixed(4);
    if (A < 0.95) { st = "越高越瘦"; col = "#b8402f"; bg = "#fbeae7"; sn = "分布集中，面积仍是 1"; }
    else if (A <= 1.05) { st = "标准正态"; col = "#2563eb"; bg = "#e8f1fd"; sn = "峰值 0.3989，最好记的一格"; }
    else { st = "越矮越胖"; col = "#2f8a5b"; bg = "#e6f6ee"; sn = "分布分散，面积仍是 1"; }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    draw(A);
  }

  function layout() { L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N; G = geom(); stage.setAttribute("viewBox", L.vb); render(); }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 0.5 }, { t: 1.2, v: 0.5 }, { t: 4, v: 1 }, { t: 6.5, v: 1 }, { t: 9, v: 3 }, { t: 11.5, v: 2 }, { t: 13.5, v: 0.5 }],
    keys: [0.5, 1, 2, 3],
    value: A, min: 0.5, max: 3, step: 0.25,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc, cases: [
    { v: 1, eq: { peak: 0.3989, p1: 0.6827, p2: 0.9545 } },
    { v: 2, eq: { peak: 0.1995, p1: 0.6827, p3: 0.9973 } },
    { v: 0.5, eq: { peak: 0.7979, p1: 0.6827 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
