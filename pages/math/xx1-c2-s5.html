<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 直线与圆的位置关系<span class="q-src">人教A版选择性必修第一册 · 第二章第五节</span></p>
<p class="q-b">直线 <span class="gx-fml">Ax+By+C=0</span> 与圆 <span class="gx-fml">(x−a)²+(y−b)²=r²</span>，圆心到直线的距离 <span class="gx-fml">d=|Aa+Bb+C|/√(A²+B²)</span>。则 d&lt;r ⇔ 相交，d=r ⇔ 相切，d&gt;r ⇔ 相离。</p>
<p class="q-n">→ 翻成人话：判断只要两个数比大小。三个条件缺一不可：①直线化成一般式，②读出圆心与半径，③用点到直线距离公式算出 d。少第③步、直接联立方程硬算，含参题里最容易漏根。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 圆与圆的位置关系<span class="q-src">人教A版选择性必修第一册 · 第二章第五节</span></p>
<p class="q-b">两圆半径分别为 <span class="gx-fml">r₁</span>、<span class="gx-fml">r₂</span>，圆心距为 d，则 d&gt;r₁+r₂ ⇔ 外离；d=r₁+r₂ ⇔ 外切；|r₁−r₂|&lt;d&lt;r₁+r₂ ⇔ 相交；d=|r₁−r₂| ⇔ 内切；0≤d&lt;|r₁−r₂| ⇔ 内含。</p>
<p class="q-n">→ 翻成人话：圆与圆要比 r₁+r₂ 与 |r₁−r₂| 两个量，d 落在哪一段就判哪一种。只记住 r₁+r₂ 这一侧，内切和内含会一起判错——两个量中间那一段才是「相交」。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 弦长公式<span class="q-src">人教A版选择性必修第一册 · 第二章第五节</span></p>
<p class="q-b">直线与圆相交时，设圆心到直线的距离为 d，圆的半径为 r，则弦长 <span class="gx-fml">l=2√(r²−d²)</span>。</p>
<p class="q-n">→ 翻成人话：弦长公式里的 d 是圆心到直线的距离，不是圆心到弦端点的距离。半弦、d、半径 r 三条边正好拼成一个直角三角形：<span class="gx-fml">r²=d²+(l/2)²</span>。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>条件</th><th>少一步会怎样</th></tr></thead>
<tbody>
<tr><td>直线先化成一般式，圆先化成标准式</td><td>圆心、半径读错，d 跟着错，后面全废</td></tr>
<tr><td>d 用点到直线距离公式算，d 是圆心到直线的距离</td><td>拿圆心到弦端点的距离当 d，弦长必错</td></tr>
<tr><td>圆与圆：d 同时和 r₁+r₂、|r₁−r₂| 比</td><td>只比 r₁+r₂，内切判成相交，内含判成内切</td></tr>
<tr class="key"><td>相切时 d=r，弦长为 0</td><td>相切还写「两个公共点」，答案自相矛盾</td></tr>
<tr><td>联立方程用判别式 Δ，须先保证二次项系数不为 0</td><td>二次项系数含参时为 0，退化成一次方程，漏解</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">背法：直线与圆只比一个 d 与 r；圆与圆要比 r₁+r₂ 与 |r₁−r₂| 两个量；d 永远是「圆心到直线」的距离，不是到交点的距离。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 弦长计算（解答题）<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">已知圆 C: x²+y²=25，直线 l: 3x+4y−15=0。(1) 判断直线 l 与圆 C 的位置关系；(2) 若相交，求弦长 |AB|。<span style="color:#b8402f">陷阱：d 是圆心到直线的距离，不是圆心到弦端点的距离。</span></p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题：先把两边的信息读全</p>
<p class="s-b">圆已经是标准式，圆心 O(0,0)，半径 r=5。直线是一般式，A=3、B=4、C=−15。判断位置只需要一个数 d，不必先求交点。</p>
<p class="s-k">用到：圆的标准方程、直线的一般式。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 算 d，再和 r 比</p>
<p class="s-b"><span class="gx-fml">d=|3×0+4×0−15|/√(3²+4²)=15/5=3</span>。因为 3&lt;5，即 d&lt;r，所以直线 l 与圆 C 相交，有两个公共点。</p>
<p class="s-k">用到：点到直线距离公式；d 是圆心到直线的距离。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 搭直角三角形，求半弦</p>
<p class="s-b">过 O 作 AB 的垂线，垂足为 M，则 M 是 AB 中点，且 <span class="gx-fml">|OM|=d=3</span>、<span class="gx-fml">|OA|=r=5</span>。在 Rt△OMA 中，<span class="gx-fml">|AM|=√(25−9)=4</span>。</p>
<p class="s-k">用到：垂径定理 + 勾股定理。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 半弦乘 2 得弦长</p>
<p class="s-b"><span class="gx-fml">|AB|=2|AM|=2√(25−3²)=2×4=8</span>。这一步只差「乘 2」，漏掉就只得 4。</p>
<p class="s-k">用到：弦长公式 l=2√(r²−d²)。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 回读，检查口径</p>
<p class="s-b">确认 8 是由 3-4-5 直角三角形来的：d=3、半弦 4、r=5。若把 d 写成圆心到弦端点的距离，就得到 5 与 0，三角形直接退化，说明口径错了。</p>
<p class="s-k">用到：量纲与口径自检。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>

</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">① 圆心 O(0,0)，半径 r=5。<br>
② d=|3×0+4×0−15|/√(3²+4²)=15/5=3，这里 d 是圆心到直线 l 的距离。<br>
③ 因为 d=3&lt;5=r，所以直线 l 与圆 C 相交，有两个公共点。<br>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">

<div class="qac">
<p class="q">「判断直线与圆的位置，到底要算几个量？」</p>
<p class="a">只算一个：圆心到直线的距离 d，再和半径 r 比。<b>d&lt;r 相交、d=r 相切、d&gt;r 相离</b>，公共点个数依次是 2、1、0。不必联立方程组。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="圆心到直线的距离 d 与半径 r 比较">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<circle cx="96" cy="62" r="34" fill="#eef5ff" stroke="#2563eb" stroke-width="1.6"/>
<line x1="20" y1="88" x2="212" y2="88" stroke="#5a6472" stroke-width="1.4"/>
<line x1="96" y1="62" x2="96" y2="88" stroke="#b8791f" stroke-width="1.6" stroke-dasharray="4 3"/>
<text x="84" y="56" font-size="9" fill="#2563eb" text-anchor="end">O</text>
<text x="102" y="80" font-size="9" fill="#b8791f">d</text>
<text x="134" y="56" font-size="9" fill="#2f8a5b">r</text>
<text x="212" y="116" font-size="9" fill="#5a6472" text-anchor="end">d &lt; r 相交</text>
</svg>
</div>

<div class="qac">
<p class="q">「圆与圆不是只要比 r₁+r₂ 吗？」</p>
<p class="a">不够。圆与圆要比 r₁+r₂ 与 |r₁−r₂| 两个量：<b>d 落在两者之间才是相交</b>；d=|r₁−r₂| 内切，d&lt;|r₁−r₂| 内含。只比 r₁+r₂，内切和内含会一起判错。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="两圆圆心距 d 要同时与 r₁+r₂、|r₁−r₂| 比较">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<circle cx="86" cy="52" r="30" fill="#eef5ff" stroke="#2563eb" stroke-width="1.6"/>
<circle cx="146" cy="52" r="18" fill="#e6f6ee" stroke="#2f8a5b" stroke-width="1.6"/>
<line x1="86" y1="52" x2="86" y2="96" stroke="#9aa4b1" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="146" y1="52" x2="146" y2="96" stroke="#9aa4b1" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="86" y1="96" x2="146" y2="96" stroke="#b8791f" stroke-width="1.6"/>
<text x="116" y="110" font-size="9" fill="#b8791f" text-anchor="middle">d</text>
<text x="20" y="122" font-size="8.6" fill="#5a6472">比 r₁+r₂，也比 |r₁−r₂|</text>
</svg>
</div>

<div class="qac">
<p class="q">「弦长公式 l=2√(r²−d²) 里的 d，是圆心到弦端点的距离吗？」</p>
<p class="a">不是。弦长公式里的 d 是<b>圆心到直线的距离</b>，也就是圆心到弦的垂线段长度。半弦、d、半径拼成直角三角形，r 是斜边。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="半弦、圆心到直线的距离与半径构成的直角三角形">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<circle cx="106" cy="58" r="44" fill="#eef5ff" stroke="#2563eb" stroke-width="1.6"/>
<line x1="66" y1="86" x2="146" y2="86" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
<line x1="106" y1="58" x2="106" y2="86" stroke="#b8791f" stroke-width="1.6" stroke-dasharray="4 3"/>
<path d="M106,78 L114,78 L114,86" fill="none" stroke="#b8791f" stroke-width="1.1"/>
<text x="94" y="52" font-size="9" fill="#2563eb" text-anchor="end">O</text>
<text x="112" y="72" font-size="9" fill="#b8791f">d</text>
<text x="126" y="80" font-size="9" fill="#2f8a5b">l/2</text>
<text x="70" y="120" font-size="8.6" fill="#5a6472">r ² = d ² + (l/2) ²</text>
</svg>
</div>

<div class="qac">
<p class="q">「相切的时候，弦长是多少？」</p>
<p class="a"><b>相切时弦长为 0</b>：两个交点重合成一个切点，l=2√(r²−r²)=0。所以相切只能写「一个公共点」，写「两个公共点」就自相矛盾。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="相切时圆心到直线的距离等于半径，弦长为 0">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<circle cx="110" cy="56" r="34" fill="#fdf3e0" stroke="#b8791f" stroke-width="1.6"/>
<line x1="20" y1="90" x2="212" y2="90" stroke="#5a6472" stroke-width="1.4"/>
<line x1="110" y1="56" x2="110" y2="90" stroke="#b8791f" stroke-width="1.6" stroke-dasharray="4 3"/>
<circle cx="110" cy="90" r="3" fill="#b8791f"/>
<text x="98" y="50" font-size="9" fill="#b8791f" text-anchor="end">O</text>
<text x="150" y="50" font-size="9" fill="#b8791f">d = r</text>
<text x="150" y="112" font-size="9" fill="#b8402f">l = 0</text>
</svg>
</div>

<div class="qac">
<p class="q">「内含和内切怎么分？两个都是小圆在大圆里。」</p>
<p class="a">看 d 与 |r₁−r₂| 是否相等：<b>d=|r₁−r₂| 是内切，1 个公共点</b>；<b>d&lt;|r₁−r₂| 是内含，0 个公共点</b>。两个圆的位置关系一共五种，两个等号各对应一种相切。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="内切时两圆有一个公共点，内含时没有公共点">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<circle cx="88" cy="58" r="40" fill="#eef5ff" stroke="#2563eb" stroke-width="1.6"/>
<circle cx="110" cy="58" r="18" fill="#e6f6ee" stroke="#2f8a5b" stroke-width="1.6"/>
<line x1="88" y1="58" x2="110" y2="58" stroke="#b8791f" stroke-width="1.4" stroke-dasharray="3 3"/>
<text x="96" y="52" font-size="8" fill="#b8791f">d</text>
<text x="20" y="118" font-size="8.6" fill="#5a6472">内切 d=|r₁−r₂|　内含 d&lt;|r₁−r₂|</text>
</svg>
</div>

<div class="qac">
<p class="q">「用判别式 Δ 判断可以吗？」</p>
<p class="a">可以，但不是首选。联立消元后 Δ&gt;0 相交、Δ=0 相切、Δ&lt;0 相离；<b>二次项系数含参时须先讨论是否为 0</b>，否则退化成一次方程漏解。考试优先用 d 与 r，计算量小且不用讨论。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="判别式与距离判据的对比">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="20" y="40" font-size="9" fill="#5a6472">联立消元 → Δ 的符号</text>
<text x="20" y="66" font-size="9" fill="#b8402f">Δ&lt;0 相离　Δ=0 相切　Δ&gt;0 相交</text>
<text x="20" y="94" font-size="9" fill="#2563eb">先看二次项系数是否为 0</text>
<text x="20" y="116" font-size="8.6" fill="#5a6472">优先：d 与 r 比，不用讨论</text>
</svg>
</div>

</div>
<p class="gx-note">六问其实是同一件事：先算出一个「距离」，再和半径或半径的和差比；比完才允许动笔算弦长。</p>

<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 圆与圆只要 d&lt;r₁+r₂ 就判相交。</p>
<p class="er-v">✓ d 要同时和 r₁+r₂、|r₁−r₂| 比：|r₁−r₂|&lt;d&lt;r₁+r₂ 才是相交。</p>
<p class="er-w">错在哪：只比一个量，内切（d=|r₁−r₂|）和内含（d&lt;|r₁−r₂|）会被一起塞进「相交」。</p>
</div>
<div class="er">
<p class="er-x">✗ 弦长 l=√(r²−d²)。</p>
<p class="er-v">✓ l=2√(r²−d²)，根号里是 r²−d²，外面还要乘 2。</p>
<p class="er-w">错在哪：√(r²−d²) 只是半弦，漏乘 2 得一半；把 r²−d² 当弦长则是漏开方。</p>
</div>
<div class="er">
<p class="er-x">✗ d 就是圆心到弦端点 A 的距离。</p>
<p class="er-v">✓ d 是圆心到直线的距离，即圆心到弦的垂线段 OM。</p>
<p class="er-w">错在哪：弦长公式里的 d 是圆心到直线的距离；到端点的距离是半径 r，代进去三角形就退化。</p>
</div>
<div class="er">
<p class="er-x">✗ 内含就是内切，都是小圆套在大圆里。</p>
<p class="er-v">✓ 内切 d=|r₁−r₂|，1 个公共点；内含 d&lt;|r₁−r₂|，0 个公共点。</p>
<p class="er-w">错在哪：差别在 d 与 |r₁−r₂| 是否取等号，公共点个数差一个。</p>
</div>
<div class="er">
<p class="er-x">✗ 相切时有两个交点，弦长用 2√(r²−d²) 算。</p>
<p class="er-v">✓ 相切时 d=r，只有一个公共点，弦长为 0。</p>
<p class="er-w">错在哪：相切时弦长为 0，再套公式得到 l=0 却写「两个公共点」，前后矛盾。</p>
</div>
<div class="er">
<p class="er-x">✗ 联立后直接用 Δ 判，不看二次项系数。</p>
<p class="er-v">✓ 先确认二次项系数不为 0；为 0 时方程退化，要单独讨论。</p>
<p class="er-w">错在哪：含参直线可能退化成一次方程，此时 Δ 根本不存在，漏掉一整类情况。</p>
</div>
<div class="er">
<p class="er-x">✗ 圆与圆判位置时拿 r 和 d 比大小。</p>
<p class="er-v">✓ 圆与圆用的是 r₁+r₂ 与 |r₁−r₂|，不是单独某个半径。</p>
<p class="er-w">错在哪：把直线与圆的判据照搬过来，量纲都对不上，判据整段作废。</p>
</div>
</div>

<script>
/* 互动：滑块 d = 圆心到直线的距离，r = 5 固定 */
document.addEventListener("DOMContentLoaded", function () {
"use strict";
var GX = window.GX, el = GX.el, tx = GX.tx, $ = GX.$;
var stage = $("gxStage");
if (!stage || !window.AutoPilot) return;

var R = 5;
var W = { vb: "0 0 880 470", mobile: false, left: { x: 16, y: 16, w: 424, h: 438 }, right: { x: 456, y: 16, w: 408, h: 438 } };
var N = { vb: "0 0 360 700", mobile: true, left: { x: 8, y: 8, w: 344, h: 300 }, right: { x: 8, y: 320, w: 344, h: 372 } };
var L = W, A = 3, G = null;

/* 纯函数：d → 弦长、半弦、状态（0 相交 / 1 相切 / 2 相离） */
function calc(v) {
var d = Math.round(v * 2) / 2, inside = d <= R + 1e-9;
var half = inside ? Math.sqrt(Math.max(0, R * R - d * d)) : 0;
var state = d < R - 1e-9 ? 0 : (d < R + 1e-9 ? 1 : 2);
return { d: d, half: half, chord: 2 * half, state: state };
}

function geom() {
var g = {};
g.cx = L.left.x + L.left.w / 2;
g.cy = L.left.y + (L.mobile ? 152 : 206);
g.sc = L.mobile ? 14 : 18;
g.r = R * g.sc;
g.x0 = L.right.x + (L.mobile ? 46 : 58);
g.x1 = L.right.x + L.right.w - 26;
g.y0 = L.right.y + (L.mobile ? 246 : 330);
g.y1 = L.right.y + (L.mobile ? 62 : 76);
return g;
}

function draw(s) {
var gA = $("gxA"), gB = $("gxB");
gA.textContent = ""; gB.textContent = "";
var x0 = G.x0, x1 = G.x1, y0 = G.y0, y1 = G.y1, ly = G.cy + s.d * G.sc, i, k, xv, yv, lv, dd;

/* 左：圆、直线、弦、垂线段 */
el("rect", { x: L.left.x, y: L.left.y, width: L.left.w, height: L.left.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
tx(gA, L.left.x + 18, L.left.y + (L.mobile ? 24 : 30), "圆 O：r = 5，直线到 O 的距离 d", "#5a6472", "start", 10.5, 700);
el("circle", { cx: G.cx, cy: G.cy, r: G.r, fill: "#eef5ff", stroke: "#2563eb", "stroke-width": 1.8 }, gA);
el("line", { x1: L.left.x + 22, y1: ly, x2: L.left.x + L.left.w - 22, y2: ly, stroke: "#5a6472", "stroke-width": 1.6 }, gA);
if (s.state === 0) {
var hw = s.half * G.sc;
el("line", { x1: G.cx - hw, y1: ly, x2: G.cx + hw, y2: ly, stroke: "#2563eb", "stroke-width": 4.5, "stroke-linecap": "round" }, gA);
el("circle", { cx: G.cx - hw, cy: ly, r: 3.4, fill: "#ffffff", stroke: "#2563eb", "stroke-width": 2 }, gA);
el("circle", { cx: G.cx + hw, cy: ly, r: 3.4, fill: "#ffffff", stroke: "#2563eb", "stroke-width": 2 }, gA);
tx(gA, G.cx - hw - 6, ly - 10, "A", "#2563eb", "end", 10, 700);
tx(gA, G.cx + hw + 6, ly - 10, "B", "#2563eb", "start", 10, 700);
el("line", { x1: G.cx, y1: G.cy, x2: G.cx - hw, y2: ly, stroke: "#2f8a5b", "stroke-width": 1.6, "stroke-dasharray": "5 4" }, gA);
}
if (s.d > 0.01) {
el("line", { x1: G.cx, y1: G.cy, x2: G.cx, y2: ly, stroke: "#b8791f", "stroke-width": 2, "stroke-dasharray": "6 4" }, gA);
el("path", { d: "M" + G.cx + "," + (ly - 9) + " L" + (G.cx + 9) + "," + (ly - 9) + " L" + (G.cx + 9) + "," + ly, fill: "none", stroke: "#b8791f", "stroke-width": 1.3 }, gA);
el("circle", { cx: G.cx, cy: ly, r: 3, fill: "#b8791f" }, gA);
tx(gA, G.cx - 6, ly + 16, "M", "#b8791f", "end", 9.8, 700);
tx(gA, G.cx + 14, G.cy + (ly - G.cy) / 2 + 4, "d = " + s.d.toFixed(1), "#b8791f", "start", 9.8, 700);
} else {
tx(gA, G.cx + 16, G.cy + 18, "d = 0：直线过圆心", "#b8791f", "start", 9.4, 700);
}
el("circle", { cx: G.cx, cy: G.cy, r: 3.2, fill: "#2563eb" }, gA);
tx(gA, G.cx - 8, G.cy - 9, "O", "#2563eb", "end", 10.5, 700);
tx(gA, G.cx - G.r - 8, G.cy + 4, "r = 5", "#2f8a5b", "end", 9.6, 700);
var cap = s.state === 0 ? "相交：d < r，两个公共点，l = 2√(25−d²)"
: (s.state === 1 ? "相切：d = r，一个公共点，弦长为 0" : "相离：d > r，没有公共点，不能求弦长");
tx(gA, L.left.x + 18, L.left.y + L.left.h - 14, cap, s.state === 2 ? "#b8402f" : (s.state === 1 ? "#b8791f" : "#2563eb"), "start", 9.4, 700);

/* 右：弦长随 d 的曲线 */
el("rect", { x: L.right.x, y: L.right.y, width: L.right.w, height: L.right.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
tx(gB, L.right.x + 18, L.right.y + (L.mobile ? 24 : 30), "弦长 l 随 d 变化：l = 2√(25−d²)", "#5a6472", "start", 10.5, 700);
el("line", { x1: x0, y1: y0, x2: x1, y2: y0, stroke: "#9aa4b1", "stroke-width": 1.3 }, gB);
el("line", { x1: x0, y1: y0, x2: x0, y2: y1, stroke: "#9aa4b1", "stroke-width": 1.3 }, gB);
el("path", { d: "M" + x1 + "," + y0 + " l-8,-4.5 l0,9 z", fill: "#9aa4b1" }, gB);
el("path", { d: "M" + x0 + "," + y1 + " l-4.5,8 l9,0 z", fill: "#9aa4b1" }, gB);
tx(gB, x1 - 2, y0 - 8, "d", "#5a6472", "end", 10, 700);
tx(gB, x0 - 8, y1 - 12, "l", "#5a6472", "end", 10, 700);
for (i = 0; i <= 8; i += 2) {
xv = x0 + (i / 8) * (x1 - x0);
el("line", { x1: xv, y1: y0, x2: xv, y2: y0 + 4, stroke: "#9aa4b1" }, gB);
tx(gB, xv, y0 + 15, String(i), "#8a94a3", "middle", 8.5, 400);
}
for (i = 0; i <= 10; i += 5) {
yv = y0 - (i / 10) * (y0 - y1);
el("line", { x1: x0 - 4, y1: yv, x2: x0, y2: yv, stroke: "#9aa4b1" }, gB);
tx(gB, x0 - 8, yv + 3.5, String(i), "#8a94a3", "end", 8.5, 400);
}
var pts = [];
for (k = 0; k <= 20; k++) {
dd = k * 0.25;
lv = 2 * Math.sqrt(Math.max(0, R * R - dd * dd));
pts.push((x0 + (dd / 8) * (x1 - x0)).toFixed(1) + "," + (y0 - (lv / 10) * (y0 - y1)).toFixed(1));
}
el("polyline", { points: pts.join(" "), fill: "none", stroke: "#2563eb", "stroke-width": 2.6 }, gB);
el("line", { x1: x0 + (5 / 8) * (x1 - x0), y1: y0, x2: x1, y2: y0, stroke: "#b8402f", "stroke-width": 2.4, "stroke-dasharray": "7 4" }, gB);
var md = x0 + (s.d / 8) * (x1 - x0), ml = y0 - (s.chord / 10) * (y0 - y1);
el("line", { x1: md, y1: y0, x2: md, y2: ml, stroke: "#b8791f", "stroke-width": 1.2, "stroke-dasharray": "4 3" }, gB);
el("circle", { cx: md, cy: ml, r: 5.5, fill: "#ffffff", stroke: "#b8791f", "stroke-width": 2.6 }, gB);
var rt = md > x0 + 0.72 * (x1 - x0);
tx(gB, md + (rt ? -9 : 9), ml - 9, "l = " + s.chord.toFixed(1), "#b8791f", rt ? "end" : "start", 9.8, 700);
tx(gB, L.right.x + 18, L.right.y + L.right.h - (L.mobile ? 52 : 60), "d = 5 是分界：相切，弦长为 0", "#b8791f", "start", 9.4, 700);
tx(gB, L.right.x + 18, L.right.y + L.right.h - (L.mobile ? 34 : 40), "d > 5 相离：红虚线，l 恒为 0", "#b8402f", "start", 9.4, 400);
tx(gB, L.right.x + 18, L.right.y + L.right.h - (L.mobile ? 16 : 20), "d = 3 时半弦 4、弦长 8（3-4-5）", "#2563eb", "start", 9.4, 700);
}

function render() {
if (!G) { L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N; G = geom(); stage.setAttribute("viewBox", L.vb); }
var s = calc(A), st, col, bg, sn;
$("gxVa").textContent = s.d.toFixed(1);
$("gxVb").textContent = s.chord.toFixed(1);
$("gxVc").textContent = s.half.toFixed(2);
if (s.state === 0) { st = "相交"; col = "#2563eb"; bg = "#e8f0fe"; sn = "d<r，两个公共点"; }
else if (s.state === 1) { st = "相切"; col = "#b8791f"; bg = "#fdf3e0"; sn = "d=r，弦长为 0"; }
else { st = "相离"; col = "#b8402f"; bg = "#fbeae7"; sn = "d>r，没有公共点"; }
$("gxVs").textContent = st;
$("gxVsn").textContent = sn;
$("gxStBox").style.background = bg;
$("gxStBox").style.borderColor = col + "44";
$("gxVs").style.color = col;
draw(s);
}

function layout() {
L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
G = geom();
stage.setAttribute("viewBox", L.vb);
render();
}

var apBadge = $("gxAp"), apTxt = $("gxApTxt");
function setMode(m) {
if (!apBadge) return;
apBadge.classList.toggle("is-auto", m === "auto");
apBadge.classList.toggle("is-manual", m !== "auto");
if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";

follow: $("gxSl"),
loop: [{ t: 0, v: 0 }, { t: 1.2, v: 0 }, { t: 4, v: 3 }, { t: 6.5, v: 3 }, { t: 9, v: 5 }, { t: 11.5, v: 7 }, { t: 13.5, v: 0 }],

});

window.__model = { calc: calc, cases: [
{ v: 0, eq: { chord: 10, state: 0 } },

{ v: 5, eq: { chord: 0, state: 1 } },
{ v: 7, eq: { chord: 0, state: 2 } }
] };

var tmr = null;
window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
layout();
});
