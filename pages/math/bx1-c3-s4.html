<p class="gx-lede">这一节在第三章的末尾：前面学了一次函数、二次函数、分段函数的图象与性质，这一节把它们拿去解决「定价、用料、路程」这类真问题。课本给的是一套五步流程，考试考的却是流程里最容易跳过的两步——<b>写定义域</b>和<b>回代检验</b>。最常见的失分不是算错顶点，而是压根没写「由实际意义得 10 ≤ p &lt; 25」，或者把销售额当成了利润。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 用函数模型解决实际问题<span class="q-src">人教A版必修第一册 · 第三章第4节</span></p>
<p class="q-b">用函数模型解决实际问题的一般步骤是：审题、设变量、建立函数关系、求最值、还原。</p>
<p class="q-n">→ 翻成人话：这五步是一条链，不是五个并列动作。①审题先问「谁是自变量、它的实际范围是多少」；②设变量要把单位写进名字（p 元、q 件、L 元）；③建模要写出等量关系再整理成函数；④求最值只能在第①步得到的范围内找；⑤还原要把数学答案翻译成「售价多少元、最大利润多少元」。<b>五个条件</b>里少第①步，后面四步全白算。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 自变量的取值范围<span class="q-src">人教A版必修第一册 · 第三章第4节</span></p>
<p class="q-b">实际问题中，自变量的取值范围由实际意义决定。</p>
<p class="q-n">→ 翻成人话：这句话只讲<b>一个条件</b>，却是全节最贵的一句话——定义域要被实际意义卡住：价格不能为负、销量不能为负、件数要取整数。所以答题时先写「由实际意义，q=100−4p&gt;0，得 10 ≤ p &lt; 25」，再动笔求顶点。顶点求对了但定义域没写，照样扣分。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>五步</th><th>具体要求</th><th>漏了会怎样</th></tr></thead>
<tbody>
<tr><td>① 审题</td><td>找出自变量，并写出它的实际取值范围</td><td>后面在错误的区间里求最值，答案整体作废</td></tr>
<tr><td>② 设变量</td><td>单位写进名字：p（元/件）、q（件）、L（元）</td><td>单位混用，最后一步数量级错</td></tr>
<tr><td>③ 建立函数关系</td><td>先写等量关系（利润=单件利润×销量），再整理成解析式</td><td>把销售额 p·q 当利润，整题方向错</td></tr>
<tr class="key"><td>④ 求最值</td><td>只在定义域内找：先看顶点在不在区间内，再看端点</td><td>顶点落在区间外仍取顶点，最值取错</td></tr>
<tr><td>⑤ 还原与检验</td><td>把 p、q 代回实际情境检验，并写清单位作答</td><td>算出负销量、负件数也照写，结论不可用</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只高亮 1 行：第④步。背法——五步里只有第③④步在「算」，其余三步都在「想」，而考场上丢的分多半丢在想的那三步上。<b>结果要回代检验</b>，不是走过场：q=30 件、p=17.5 元都对得上，答案才敢往答题卡上写。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 二次函数模型求最大利润<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">某商品成本为 10 元/件。当售价为 p 元/件时，日销量 q=100−4p 件。求日利润最大时的售价与最大日利润。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题设变量</p>
<p class="s-b">设售价为 p 元/件，日销量为 q 件，日利润为 L 元。成本 10 元/件 ⇒ 每卖一件赚 (p−10) 元。</p>
<p class="s-k">用到：设变量时把单位写进名字，后面单位才不会乱。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 定定义域（本步最容易丢）</p>
<p class="s-b">销量不能为负：q=100−4p&gt;0 ⇒ p&lt;25；售价要高于成本才有利润可谈：p≥10。所以 10 ≤ p &lt; 25。</p>
<p class="s-k">用到：定义域要被实际意义卡住——这一步写在解析式之前，不是之后补。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 建立函数关系</p>
<p class="s-b"><span class="gx-fml">L=(p−10)(100−4p)=−4p²+140p−1000</span></p>
<p class="s-k">用到：利润=单件利润×销量；不是售价×销量。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 在定义域内求最值</p>
<p class="s-b"><span class="gx-fml">L=−4(p²−35p)−1000=−4(p−17.5)²+225</span>，顶点 p=17.5。因为 17.5∈[10, 25)，顶点在定义域内，所以 L 的最大值为 225。</p>
<p class="s-k">用到：先判断顶点在不在定义域内，再决定取顶点还是取端点。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 回代检验并作答</p>
<p class="s-b">p=17.5 时 q=100−4×17.5=30（件）&gt;0，售价 17.5 元高于成本 10 元，符合实际。答：售价定为 17.5 元/件时日利润最大，最大日利润为 225 元。</p>
<p class="s-k">用到：结果要回代检验——代回的是实际情境，不是再算一遍抛物线。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">设售价 p 元/件，日销量 q=100−4p 件，日利润 L 元。<br>由实际意义 q&gt;0，即 100−4p&gt;0，得 10 ≤ p &lt; 25。<br>L=(p−10)(100−4p)=−4p²+140p−1000=−4(p−17.5)²+225。<br>∵ 17.5∈[10, 25)，∴ 当 p=17.5 时，L 取最大值 225。<br>检验：q=100−4×17.5=30&gt;0，符合实际。<br>答：售价定为 17.5 元/件时，日利润最大，最大日利润为 225 元。</p>
</div>
</div>
</section>
<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「建模的第一步到底是干什么？」</p>
<p class="a">审题：找出<b>自变量</b>并写出它的<b>实际取值范围</b>。不是先列式——变量和范围没定，列出来的式子没有意义。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="第一步：定自变量与范围">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<rect x="24" y="44" width="56" height="34" rx="6" fill="#e6f6ee" stroke="#2f8a5b"/>
<text x="52" y="65" text-anchor="middle" font-size="9" fill="#1f6b47">定自变量</text>
<rect x="92" y="44" width="56" height="34" rx="6" fill="#fdf3e0" stroke="#b8791f"/>
<text x="120" y="65" text-anchor="middle" font-size="9" fill="#8a5a12">定范围</text>
<rect x="160" y="44" width="56" height="34" rx="6" fill="#ffffff" stroke="#dde4ea"/>
<text x="188" y="65" text-anchor="middle" font-size="9" fill="#5a6472">再列式</text>
<text x="120" y="102" text-anchor="middle" font-size="9" fill="#5a6472">①② 先做，③ 才轮到算</text>
</svg>
</div>
<div class="qac">
<p class="q">「定义域为什么非得看实际意义？」</p>
<p class="a">因为数学上能算的区间不一定有实际意义：销量为负、件数为小数都要切掉。<b>定义域要被实际意义卡住</b>，比如 q&gt;0 ⇒ p&lt;25。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="数轴上把 q 小于 0 的部分切掉">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<rect x="150" y="52" width="62" height="28" fill="#fbeae7"/>
<line x1="28" y1="66" x2="220" y2="66" stroke="#5a6472" stroke-width="1.4"/>
<line x1="150" y1="52" x2="150" y2="80" stroke="#b8402f" stroke-width="1.2"/>
<text x="28" y="52" font-size="9" fill="#5a6472">p=10</text>
<text x="144" y="94" font-size="9" fill="#b8402f">p=25：q=0</text>
<text x="182" y="94" font-size="9" fill="#b8402f">q&lt;0 舍去</text>
</svg>
</div>
<div class="qac">
<p class="q">「最值一定在顶点吗？」</p>
<p class="a">不一定。<b>顶点在定义域内</b>才取顶点；顶点在定义域外时函数在区间上单调，<b>最值取在端点</b>。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="顶点在区间外时最值取端点">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<path d="M32 96 Q120 6 208 96" fill="none" stroke="#b8402f" stroke-width="2"/>
<line x1="34" y1="100" x2="122" y2="100" stroke="#2563eb" stroke-width="2.4"/>
<circle cx="120" cy="100" r="4" fill="#b8402f"/>
<text x="128" y="96" font-size="9" fill="#b8402f">最大值在这个端点</text>
<text x="34" y="116" font-size="9" fill="#2563eb">定义域只到这里</text>
</svg>
</div>
<div class="qac">
<p class="q">「销量算出负数说明什么？」</p>
<p class="a">说明 <b>p 取到了实际不允许的值</b>，应该从定义域里去掉，而不是照代公式算出一个负利润。负销量不是数学错误，是范围错误。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="直线越过横轴后销量为负">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="30" y1="60" x2="216" y2="60" stroke="#5a6472" stroke-width="1.2"/>
<line x1="30" y1="20" x2="30" y2="100" stroke="#5a6472" stroke-width="1.2"/>
<line x1="46" y1="30" x2="200" y2="104" stroke="#2563eb" stroke-width="2"/>
<text x="152" y="118" font-size="9" fill="#b8402f">p 太大，q 变负</text>
</svg>
</div>
<div class="qac">
<p class="q">「分段函数模型怎么求最值？」</p>
<p class="a">逐段求：<b>每段各自求最值</b>，再比较取最大者；分段点归哪一段要在答案里写清，端点值单独算。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="分段函数两段分别求最值">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>

<path d="M96 54 L210 74" fill="none" stroke="#2f8a5b" stroke-width="2"/>

<text x="40" y="110" font-size="9" fill="#2563eb">第一段</text>
<text x="150" y="110" font-size="9" fill="#2f8a5b">第二段</text>
<text x="104" y="44" font-size="9" fill="#b8791f">分段点</text>
</svg>
</div>
<div class="qac">
<p class="q">「算完要不要检验？」</p>
<p class="a">要。<b>结果要回代检验</b>：把 p、q 代回情境，看销量是否为正、价格是否高于成本、单位是否一致，再写「答」。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="结果回代检验的回路">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>

<rect x="136" y="40" width="72" height="30" rx="6" fill="#e6f6ee" stroke="#2f8a5b"/>
<text x="172" y="59" text-anchor="middle" font-size="9" fill="#1f6b47">回代检验</text>
<path d="M104 55 L132 55" stroke="#5a6472" stroke-width="1.4"/>
<path d="M46 70 Q46 100 120 100 Q180 100 180 74" fill="none" stroke="#b8402f" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="120" y="116" text-anchor="middle" font-size="9" fill="#b8402f">不符就回去改定义域</text>
</svg>
</div>
</div>
<p class="gx-note">六问其实是同一件事：<b>先划范围，再在范围里找最值，最后回代</b>。定义域错了，②④崩；取值范围判断错了，③崩；不检验，⑤⑥崩——全在同一个链条上。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 求出顶点 p=17.5，直接写「最大利润 225 元」。</p>
<p class="er-v">✓ 由实际意义 q=100−4p&gt;0 得 10 ≤ p &lt; 25；∵ 17.5∈[10, 25)，∴ 当 p=17.5 时 L 取最大值 225。</p>
<p class="er-w">错在哪：没写定义域就开始求最值。定义域要被实际意义卡住，数学上的全体实数不是本题的范围。</p>
</div>
<div class="er">
<p class="er-x">✗ 利润 L=p·q，即 L=p(100−4p)。</p>
<p class="er-v">✓ 利润 L=(p−10)q=(p−10)(100−4p)。</p>
<p class="er-w">错在哪：p·q 是销售额（营业额），没扣成本。利润=单件利润×销量，单件利润是 p−10。</p>
</div>
<div class="er">
<p class="er-x">✗ p=30 时 q=100−4×30=−20，L=(30−10)×(−20)=−400，所以 p=30 亏 400 元。</p>
<p class="er-v">✓ p=30 时 q&lt;0，不符合实际，应把 p=30 排除在定义域之外。</p>
<p class="er-w">错在哪：销量为负也照算。算出负销量说明 p 越界，不是说明亏本。</p>
</div>
<div class="er">
<p class="er-x">✗ 二次函数的最大值一定在顶点，代顶点公式就行。</p>
<p class="er-v">✓ 最值不一定在顶点：顶点在定义域内才取顶点，否则比较区间端点。</p>
<p class="er-w">错在哪：把「开口向下的抛物线有最大值」偷换成「最大值一定在顶点」。顶点是全局最大，不是区间最大。</p>
</div>
<div class="er">
<p class="er-x">✗ 单件利润 7.5 元乘销量 30，直接写「225 件」。</p>
<p class="er-v">✓ 7.5 元/件 × 30 件 = 225 元，答「最大日利润 225 元」。</p>
<p class="er-w">错在哪：单位没跟着走。元/件 × 件 = 元，答案的单位要和问的量一致。</p>
</div>
<div class="er">
<p class="er-x">✗ 算出 p=17.5、L=225，写完「答」就交卷。</p>
<p class="er-v">✓ 检验：q=100−4×17.5=30&gt;0，p=17.5&gt;10，符合实际，再作答。</p>
<p class="er-w">错在哪：结果要回代检验。检验的是实际情境（销量为正、价格高于成本），不是把抛物线再算一遍。</p>
</div>
<div class="er">
<p class="er-x">✗ 分段计费题只算了一段，另一段「看着差不多」就抄过来。</p>
<p class="er-v">✓ 分段模型每段各自求最值，再比较取最大者，分段点单独检验归属。</p>
<p class="er-w">错在哪：漏段或漏比较。分段函数的最值是「各段最值里的最大者」，不是某一段的最值。</p>
</div>
</div>

  function Y(l) { return G.lp.y - l / LMAX * G.lp.h; }
  function RX(p) { return G.rp.x + (p - P0) / (P1 - P0) * G.rp.w; }
  function RY(q) { return G.rp.y - q / QMAX * G.rp.h; }

  function arrow(g, x1, y1, x2, y2, col) {
    el("line", { x1: x1, y1: y1, x2: x2, y2: y2, stroke: col, "stroke-width": 1.3 }, g);
    var a = Math.atan2(y2 - y1, x2 - x1), s = 5.6;
    var d = "M" + x2 + " " + y2 +
      " L" + (x2 - s * Math.cos(a - 0.38)).toFixed(1) + " " + (y2 - s * Math.sin(a - 0.38)).toFixed(1) +
      " L" + (x2 - s * Math.cos(a + 0.38)).toFixed(1) + " " + (y2 - s * Math.sin(a + 0.38)).toFixed(1) + " Z";
    el("path", { d: d, fill: col }, g);
  }

  function panel(g, b, title, fill) {
    el("rect", { x: b.x, y: b.y, width: b.w, height: b.h, rx: 10, fill: fill || "#f8fbfd", stroke: "#dbe7ef" }, g);
    tx(g, b.x + 12, b.y + 24, title, "#5a6472", "start", G.ts, 700);
  }

  function draw() {
    var g = G, gA = $("gxA"), gB = $("gxB"), s = calc(A);
    gA.textContent = ""; gB.textContent = "";
    var ink = "#5a6472", hot = "#b8402f", amber = "#b8791f";

    /* ---------- 左：利润曲线 ---------- */
    panel(gA, g.left, "① 利润曲线  L=(p−10)(100−4p)");
    var lp = g.lp;
    arrow(gA, lp.x - 14, lp.y, lp.x + lp.w + 16, lp.y, ink);
    arrow(gA, lp.x, lp.y + 14, lp.x, lp.y - lp.h - 14, ink);
    tx(gA, lp.x - 4, lp.y + 15, "O", ink, "end", G.ts, 400);
    tx(gA, lp.x + 8, lp.y - lp.h + 14, "L/元", ink, "start", G.ts, 400);
    tx(gA, lp.x, lp.y + 34, "p/元", ink, "start", G.ts, 400);
    [10, 15, 20, 25].forEach(function (p) {
      el("line", { x1: X(p), y1: lp.y, x2: X(p), y2: lp.y + 4, stroke: ink, "stroke-width": 1 }, gA);
      tx(gA, X(p), lp.y + 16, String(p), ink, "middle", G.ts, 400);
    });
    [100, 200].forEach(function (l) {
      el("line", { x1: lp.x - 4, y1: Y(l), x2: lp.x, y2: Y(l), stroke: ink, "stroke-width": 1 }, gA);
      tx(gA, lp.x - 8, Y(l) + 4, String(l), ink, "end", G.ts, 400);
    });
    var x10 = X(P0), x25 = X(P1), vy = Y(225), vx = X(17.5);
    el("path", { d: "M" + x10 + " " + lp.y + " Q" + vx + " " + (2 * vy - lp.y).toFixed(1) + " " + x25 + " " + lp.y,
      fill: "none", stroke: "#2563eb", "stroke-width": 2.2 }, gA);
    el("circle", { cx: vx, cy: vy, r: 3.4, fill: "#fff", stroke: amber, "stroke-width": 1.6 }, gA);
    tx(gA, vx + 8, vy - 10, "顶点 (17.5, 225)", amber, "start", G.ts, 700);

    var px = X(A), py = Y(s.L);
    el("line", { x1: px, y1: py, x2: px, y2: lp.y, stroke: hot, "stroke-width": 1.1, "stroke-dasharray": "4 3" }, gA);
    el("line", { x1: lp.x, y1: py, x2: px, y2: py, stroke: hot, "stroke-width": 1.1, "stroke-dasharray": "4 3" }, gA);
    el("circle", { cx: px, cy: py, r: g.ds + 0.6, fill: hot, stroke: "#fff", "stroke-width": 1.4 }, gA);
    var lx = px + 10, la = "start", ly = py + 18;
    if (px > lp.x + lp.w - 96) { lx = px - 10; la = "end"; }
    if (py > lp.y - 26) ly = py - 14;
    tx(gA, lx, ly, "p=" + A.toFixed(1) + "，L=" + Math.round(s.L), hot, la, G.ts, 700);

    /* ---------- 右：销量直线 ---------- */
    panel(gB, g.right, "② 销量直线  q=100−4p", "#ffffff");
    var rp = g.rp;
    arrow(gB, rp.x - 14, rp.y, rp.x + rp.w + 16, rp.y, ink);
    arrow(gB, rp.x, rp.y + 14, rp.x, rp.y - rp.h - 14, ink);
    tx(gB, rp.x - 4, rp.y + 15, "O", ink, "end", G.ts, 400);
    tx(gB, rp.x + 8, rp.y - rp.h + 14, "q/件", ink, "start", G.ts, 400);
    tx(gB, rp.x + rp.w - 40, rp.y - 8, "p/元", ink, "start", G.ts, 400);
    [10, 15, 20, 25].forEach(function (p) {
      el("line", { x1: RX(p), y1: rp.y, x2: RX(p), y2: rp.y + 4, stroke: ink, "stroke-width": 1 }, gB);
      tx(gB, RX(p), rp.y + 16, String(p), ink, "middle", G.ts, 400);
    });
    [30, 60].forEach(function (q) {
      el("line", { x1: rp.x - 4, y1: RY(q), x2: rp.x, y2: RY(q), stroke: ink, "stroke-width": 1 }, gB);
      tx(gB, rp.x - 8, RY(q) + 4, String(q), ink, "end", G.ts, 400);
    });
    el("line", { x1: RX(P0), y1: RY(60), x2: RX(P1), y2: RY(0), stroke: "#2563eb", "stroke-width": 2.2 }, gB);
    el("line", { x1: RX(P1), y1: RY(0), x2: RX(P1), y2: RY(52), stroke: hot, "stroke-width": 1.2, "stroke-dasharray": "4 3" }, gB);

    var qx = RX(A), qy = RY(s.q);
    el("line", { x1: qx, y1: qy, x2: qx, y2: rp.y, stroke: hot, "stroke-width": 1.1, "stroke-dasharray": "4 3" }, gB);
    el("line", { x1: rp.x, y1: qy, x2: qx, y2: qy, stroke: hot, "stroke-width": 1.1, "stroke-dasharray": "4 3" }, gB);
    el("circle", { cx: qx, cy: qy, r: g.ds + 0.6, fill: amber, stroke: "#fff", "stroke-width": 1.4 }, gB);
    var tx2 = qx + 10, an2 = "start";
    if (qx > rp.x + rp.w - 92) { tx2 = qx - 10; an2 = "end"; }
    tx(gB, tx2, qy - 10, "q=" + Math.round(s.q) + " 件", amber, an2, G.ts, 700);
    tx(gB, rp.x, rp.y + 30, "p≥25 时 q≤0，越界", hot, "start", G.ts, 400);
  }

  function render() {
    if (!G) { L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N; G = geom(); stage.setAttribute("viewBox", L.vb); }
    var s = calc(A), st, col, bg, sn;
    $("gxVa").textContent = A.toFixed(1);
    $("gxVb").textContent = String(Math.round(s.q));
    $("gxVc").textContent = String(Math.round(s.L));
    if (A < 17.5 - 1e-9) { st = "涨价还能多赚"; col = "#2563eb"; bg = "#e8f0fe"; sn = "p<17.5，利润还在升"; }
    else if (Math.abs(A - 17.5) < 1e-9) { st = "利润最大 225"; col = "#2f8a5b"; bg = "#e6f6ee"; sn = "顶点：p=17.5"; }
    else { st = "涨价反而少赚"; col = "#b8402f"; bg = "#fbeae7"; sn = "p>17.5，已过顶点"; }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    draw();
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    G = geom();
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 15 }, { t: 1.2, v: 15 }, { t: 4, v: 17.5 }, { t: 6.5, v: 17.5 }, { t: 9, v: 20 }, { t: 11.5, v: 25 }, { t: 13.5, v: 15 }],
    keys: [15, 17.5, 20, 25],
    value: A, min: 15, max: 25, step: 0.5,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc, cases: [
    { v: 15, eq: { q: 40, L: 200 } },
    { v: 17.5, eq: { q: 30, L: 225 } },
    { v: 20, eq: { q: 20, L: 200 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
</body>
