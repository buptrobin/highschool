<p class="gx-lede">这一节是整章「空间几何体」的起点：先把棱柱、棱锥、棱台三个多面体的定义咬准，再认识圆柱、圆锥、圆台、球四个旋转体，后面学表面积、体积全靠这些名字。最容易错的一件事是把「侧棱都相等」当成棱柱的判据——那只是斜棱柱里恰好发生的情况，真正的判据是侧棱互相平行。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 棱柱<span class="q-src">人教A版必修第二册 · 第8章第1节</span></p>
<p class="q-b">有两个面互相平行，其余各面都是四边形，并且每相邻两个四边形的公共边都互相平行，由这些面所围成的多面体叫做棱柱。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个条件</b>组成（① 两个面平行 ② 其余各面是四边形 ③ 相邻四边形的公共边互相平行），少一个就不是棱柱。第 ③ 条说的就是<b>侧棱互相平行</b>，它才是判据；「侧棱相等」课本没要求。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 棱锥<span class="q-src">人教A版必修第二册 · 第8章第1节</span></p>
<p class="q-b">有一个面是多边形，其余各面都是有一个公共顶点的三角形，由这些面所围成的多面体叫做棱锥。</p>
<p class="q-n">→ 翻成人话：<b>两个条件</b>：① 有一个面是多边形（底面）；② 其余各面是三角形，而且这些三角形<b>共用同一个顶点</b>。少了「公共顶点」，就只是「一堆三角形围起来」，不是棱锥。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 棱台<span class="q-src">人教A版必修第二册 · 第8章第1节</span></p>
<p class="q-b">用平行于棱锥底面的平面去截棱锥，底面与截面之间的部分叫做棱台。</p>
<p class="q-n">→ 翻成人话：只有<b>一个条件</b>，但它是身份证明：<b>棱台必须由棱锥截得</b>，截面还要平行于底面。所以棱台的侧棱延长后一定交于一点（原来棱锥的顶点）；随手把棱柱斜着切一刀，得到的不叫棱台。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>判据</th><th>课本条件（拆成一条一条）</th><th>缺了这一条会怎样</th></tr></thead>
<tbody>
<tr><td>棱柱</td><td>有两个面互相平行且全等</td><td>没有一对平行面，就不是棱柱，可能是棱锥或棱台</td></tr>
<tr><td>棱柱</td><td>其余各面都是四边形</td><td>出现三角形或曲面，就不是棱柱（圆柱有曲面，不算）</td></tr>
<tr class="key"><td>棱柱</td><td>相邻四边形的公共边互相平行（侧棱互相平行）</td><td>侧棱延长后交于一点，那是棱台或棱锥，不是棱柱</td></tr>
<tr><td>棱锥</td><td>一个面是多边形，其余各面是有公共顶点的三角形</td><td>三角形不共顶点，只是「多面体」，不是棱锥</td></tr>
<tr><td>棱台</td><td>用平行于底面的平面截棱锥，取底面与截面之间那部分</td><td>不是截出来的、或截面不平行于底面，侧棱延长不交于一点</td></tr>
<tr><td>多面体</td><td>每个面都是平面多边形</td><td>含曲面就不是多面体：圆柱、圆锥、圆台、球都被排除</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只高亮 1 行：棱柱的第 ③ 条。背法一句话——<b>棱柱数「侧棱平行」，棱台数「延长交于一点」，多面体数「有没有曲面」</b>。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 由顶点数反求棱柱<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">一个棱柱共有 12 个顶点。(1) 它是几棱柱？(2) 它有多少条棱、多少个面？(3) 用欧拉公式验证你的结果。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题：顶点从哪来</p>
<p class="s-b">棱柱的顶点只出现在上、下两个底面上，每个底面是 n 边形，各有 n 个顶点，所以 V = 2n。题目给的是「棱柱」，可以直接用这个关系。</p>
<p class="s-k">用到：棱柱的结构——两个全等且平行的底面 + n 个侧面。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 求 n</p>
<p class="s-b">由 2n = 12 得 n = 6，所以它是六棱柱，底面是六边形。</p>
<p class="s-k">用到：V = 2n 反解。注意别答成「12 棱柱」——12 是顶点数，不是边数。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 数棱</p>
<p class="s-b">侧棱 n = 6 条；上底面 6 条、下底面 6 条。共 E = 3n = 18 条。</p>
<p class="s-k">用到：E = 3n。易错点是最容易只数侧棱，答成 6 或 12。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 数面</p>
<p class="s-b">侧面是 6 个四边形，加上上、下两个底面，共 F = n + 2 = 8 个面。</p>
<p class="s-k">用到：F = n+2。侧面数 = 底面边数，这是棱柱的固定关系。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 用欧拉公式验证</p>
<p class="s-b">代入 V − E + F = 12 − 18 + 8 = 2，等于 2，说明三个数互相吻合，答案可信。</p>
<p class="s-k">用到：欧拉公式 <span class="gx-fml">V − E + F = 2</span>（只对多面体成立）。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">(1) 设底面是 n 边形。棱柱的上、下底面各有 n 个顶点，故 V = 2n = 12，得 n = 6，所以它是六棱柱。<br>(2) 棱数 E = 3n = 18 条（侧棱 6 条 + 两底各 6 条）；面数 F = n + 2 = 8 个（侧面 6 个 + 底面 2 个）。<br>(3) 验证：V − E + F = 12 − 18 + 8 = 2，符合欧拉公式。</p>
</div>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「棱柱的侧棱有什么要求？长度相等就行吧？」</p>
<p class="a">不是。<b>棱柱的侧棱互相平行</b>，这是定义里明写的条件；长度相等课本没要求（斜棱柱的侧棱也相等，但那是由平行推出来的，不能拿来当判据）。反过来，侧棱延长后交于一点，那是棱锥或棱台。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="两条互相平行的侧棱">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="84" y1="24" x2="84" y2="92" stroke="#2563eb" stroke-width="1.4"/>
<line x1="156" y1="24" x2="156" y2="92" stroke="#2563eb" stroke-width="1.4"/>
<text x="120" y="66" text-anchor="middle" font-size="14" fill="#b8402f">∥</text>
<text x="120" y="114" text-anchor="middle" font-size="8.4" fill="#5a6472">侧棱互相平行（不是「相等」就够）</text>
</svg>
</div>
<div class="qac">
<p class="q">「棱台和棱柱看着差不多，怎么一眼分开？」</p>
<p class="a">看侧棱方向：<b>棱柱的侧棱互相平行</b>；棱台的侧棱延长后交于一点。更根本的一条是<b>棱台必须由棱锥截得</b>——截面还得平行于底面，所以棱台的两个底面是相似多边形，不能随便截一个多面体就叫棱台。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="棱台侧棱延长交于一点">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<polygon points="102,36 138,36 144,43 96,43" fill="#d7e8fd" stroke="#2563eb"/>
<polygon points="76,100 164,100 171,93 83,93" fill="#fdf4e4" stroke="#b8791f"/>
<line x1="76" y1="100" x2="102" y2="36" stroke="#2563eb" stroke-width="1.2"/>
<line x1="164" y1="100" x2="138" y2="36" stroke="#2563eb" stroke-width="1.2"/>
<line x1="102" y1="36" x2="120" y2="17" stroke="#b8402f" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="138" y1="36" x2="120" y2="17" stroke="#b8402f" stroke-width="1" stroke-dasharray="3 3"/>
<circle cx="120" cy="17" r="2.4" fill="#b8402f"/>
<text x="120" y="118" text-anchor="middle" font-size="8.4" fill="#5a6472">侧棱延长交于一点 → 棱台</text>
</svg>
</div>
<div class="qac">
<p class="q">「球圆圆的，也算多面体吧？」</p>
<p class="a">不算。<b>球不是多面体</b>：多面体要求围成它的每个面都是平面多边形，而球面是曲面，球连一个平面多边形都没有。圆柱、圆锥、圆台同样被排除——它们都叫旋转体。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="球面是曲面，不是多面体">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<circle cx="90" cy="62" r="40" fill="#e8f2fe" stroke="#2563eb" stroke-width="1.3"/>
<ellipse cx="90" cy="62" rx="40" ry="12" fill="none" stroke="#9aabb9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="90" y="66" text-anchor="middle" font-size="8.6" fill="#2563eb">曲面</text>
<text x="146" y="50" font-size="15" fill="#b8402f">✗</text>
<text x="148" y="68" font-size="8.4" fill="#5a6472">多面体？</text>
<text x="120" y="118" text-anchor="middle" font-size="8.4" fill="#5a6472">每个面都是平面多边形 → 球不合格</text>
</svg>
</div>
<div class="qac">
<p class="q">「欧拉公式是棱柱专用的吗？棱锥能用吗？」</p>
<p class="a">能用，只要求是多面体。<b>对任意多面体都有 V − E + F = 2</b>：四棱锥 V=5、E=8、F=5，代进去 5−8+5=2。棱台也是多面体，一样成立；不能用的是圆柱、圆锥、球这些含曲面的旋转体。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="四棱锥验证欧拉公式">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<polygon points="80,96 160,96 148,84 92,84" fill="#fdf4e4" stroke="#b8791f"/>
<line x1="120" y1="30" x2="80" y2="96" stroke="#b8791f" stroke-width="1.2"/>
<line x1="120" y1="30" x2="160" y2="96" stroke="#b8791f" stroke-width="1.2"/>
<line x1="120" y1="30" x2="92" y2="84" stroke="#b8791f" stroke-width="1.2"/>
<line x1="120" y1="30" x2="148" y2="84" stroke="#b8791f" stroke-width="1.2"/>
<text x="120" y="120" text-anchor="middle" font-size="8.6" fill="#5a6472">四棱锥：5 − 8 + 5 = 2</text>
</svg>
</div>
<div class="qac">
<p class="q">「圆柱的侧面展开是长方形还是矩形？有区别吗？」</p>
<p class="a">是矩形，长等于底面周长 2πr，宽等于母线长 l。叫「长方形」在初中没问题，高中答「矩形」更稳。顺带记住：圆柱的母线有无数条，但每条都平行且相等，所以它是旋转体，不是「有无数条母线就不是旋转体」。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="圆柱侧面展开成矩形">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<ellipse cx="58" cy="34" rx="24" ry="8" fill="#e8f2fe" stroke="#2563eb" stroke-width="1.2"/>
<line x1="34" y1="34" x2="34" y2="90" stroke="#2563eb" stroke-width="1.2"/>
<line x1="82" y1="34" x2="82" y2="90" stroke="#2563eb" stroke-width="1.2"/>
<path d="M34,90 A24,8 0 0 0 82,90" fill="none" stroke="#2563eb" stroke-width="1.2"/>
<text x="58" y="114" text-anchor="middle" font-size="8.4" fill="#5a6472">圆柱</text>
<rect x="130" y="40" width="84" height="48" fill="#fdf4e4" stroke="#b8791f" stroke-width="1.2"/>
<text x="172" y="70" text-anchor="middle" font-size="8.4" fill="#b8791f">2πr × l</text>
<text x="172" y="114" text-anchor="middle" font-size="8.4" fill="#5a6472">矩形</text>
</svg>
</div>
<div class="qac">
<p class="q">「『正棱柱』的『正』是说它长得端正吗？」</p>
<p class="a">不是形容外形，是两个条件：<b>底面是正多边形</b>，并且<b>侧棱垂直于底面</b>（即先要是直棱柱）。只满足第一条叫「直棱柱但底面不正」，不是正棱柱；斜棱柱底面再正也不是。所以「正棱柱的底面可以是任意多边形」是错的。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="正棱柱：底面是正多边形且侧棱垂直底面">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<polygon points="120,28 154,44 154,70 120,86 86,70 86,44" fill="#d7e8fd" stroke="#2563eb" stroke-width="1.3"/>
<text x="120" y="60" text-anchor="middle" font-size="8.4" fill="#2563eb">正六边形</text>
<text x="120" y="104" text-anchor="middle" font-size="8.4" fill="#5a6472">底面是正多边形</text>
<text x="120" y="118" text-anchor="middle" font-size="8.4" fill="#b8791f">侧棱 ⊥ 底面（直棱柱）</text>
</svg>
</div>
</div>
<p class="gx-note">这六问其实是同一件事：先判断「是不是多面体」（有没有曲面），再看「侧棱什么关系」（平行 / 交于一点 / 不平行也不交），最后才轮到数 V、E、F。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 侧棱都相等，所以它是棱柱。</p>
<p class="er-v">✓ 棱柱的侧棱互相平行；「相等」不是判据。</p>
<p class="er-w">错在哪：把结论当条件。侧棱相等是棱柱（或斜棱柱）的性质，定义要求的是相邻侧面的公共边互相平行；侧棱延长交于一点的是棱台。</p>
</div>
<div class="er">
<p class="er-x">✗ 把棱柱斜着切一刀，上面那部分就是棱台。</p>
<p class="er-v">✓ 棱台必须由棱锥截得：用平行于棱锥底面的平面去截，取底面与截面之间的部分。</p>
<p class="er-w">错在哪：截的对象和截的方向都不对。不是棱锥、截面不平行于底面，截出来的侧棱延长就不会交于一点，两个底面也不相似。</p>
</div>
<div class="er">
<p class="er-x">✗ 球是多面体，它的面是一个曲面。</p>
<p class="er-v">✓ 球不是多面体；球面是曲面，多面体要求每个面都是平面多边形。</p>
<p class="er-w">错在哪：自己把「面」偷换成「曲面」。这句话前后半句就矛盾——多面体的面不可能是曲面。</p>
</div>
<div class="er">
<p class="er-x">✗ 六棱柱有 12 个顶点，所以也有 12 个面。</p>
<p class="er-v">✓ 六棱柱 V=12、E=18、F=8，三个数各不相同；面数 F=n+2。</p>
<p class="er-w">错在哪：把顶点数和面数混成一个数。用欧拉公式一验就知道：12−18+8=2，若 F 也取 12，结果变成 6，不成立。</p>
</div>
<div class="er">
<p class="er-x">✗ 圆柱有无数条母线，所以它不是旋转体。</p>
<p class="er-v">✓ 圆柱是矩形绕它的一条边旋转一周形成的，是旋转体；无数条母线互相平行且相等，正是旋转体的特征。</p>
<p class="er-w">错在哪：因果反了。「母线有无数条」不是否定旋转体的理由，圆柱的每一条母线都是旋转时同一个点划出的轨迹。</p>
</div>
<div class="er">
<p class="er-x">✗ 正棱柱就是底面很「正」的棱柱，底面随便什么多边形都行。</p>
<p class="er-v">✓ 正棱柱要同时满足：底面是正多边形，且侧棱垂直于底面（是直棱柱）。</p>
<p class="er-w">错在哪：漏了「侧棱⊥底面」这个条件，也把「正多边形」理解成「看起来端正」。斜棱柱底面是正六边形，也不是正棱柱。</p>
</div>
<div class="er">
<p class="er-x">✗ 棱柱的侧面都是矩形。</p>
<p class="er-v">✓ 直棱柱的侧面是矩形；斜棱柱的侧面是平行四边形。</p>
<p class="er-w">错在哪：以偏概全。课本只说侧面是「四边形」且公共边互相平行，平行四边形就够了；只有侧棱垂直于底面时，平行四边形才退化成矩形。</p>
</div>
</div>
