<p class="gx-claim">一句话说清本节最该记住的判断：<b>频率是试验值、会波动，概率是客观值、不变</b>；<b>「稳定于」不等于「相等」</b>。</p>

<span><i></i>人教A版必修第二册 · 第十章第三节</span>
<span><i></i>高一 · 必修第二册</span>
<span><i></i>阅读 12 分钟</span>
<span><i></i>含 1 个互动模型</span>
</div>
<p class="gx-lede">10.1 讲有限样本空间的古典概型，10.2 讲事件的运算，这一节把「概率到底怎么来」补上：当试验结果不是等可能、或者根本数不清基本事件时，我们只能靠<b>频率</b>去估。全节只有一条主线——频率会晃、概率不动；所以频率能用来<b>估计</b>概率，永远不能用来<b>等于</b>概率。最容易丢分的一处，就是把某次试验算出的 0.58 直接写成 P(正面)=0.58。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 频率的稳定性<span class="q-src">人教A版必修第二册 · 第十章第三节</span></p>
<p class="q-b">频率是随机的，在试验前不能确定；随着试验次数的增加，频率会逐渐稳定于概率。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个条件</b>组成：① 频率是<b>试验值</b>，做一次一个样，试验前算不出来，所以它会波动；② 概率是事件的本质属性，是<b>客观值</b>，不随试验次数变化；③ 「稳定于」描述的是一种<b>趋势</b>，指的是 n 越来越大时频率往概率身边靠，而不是某一次试验的结果正好落在概率上。少任何一个，就会写出「频率就是概率」。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 用频率估计概率<span class="q-src">人教A版必修第二册 · 第十章第三节</span></p>
<p class="q-b">我们可以用频率估计概率，也可以用随机模拟的方法估计概率。</p>
<p class="q-n">→ 翻成人话：两个「可以」说明频率只是<b>工具</b>，不是定义。既然只是估计，答案里就必须出现「估计」二字，写成 <span class="gx-fml">P(A) ≈ 0.58</span> 而不是 <span class="gx-fml">P(A) = 0.58</span>。随机模拟则是把「真做试验」换成「用随机数产生试验结果」，省时间、可重复，估计的是同一个概率。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 概率的属性<span class="q-src">人教A版必修第二册 · 第十章第三节</span></p>
<p class="q-b">概率是事件的本质属性，不随试验次数变化。</p>
<p class="q-n">→ 翻成人话：一枚均匀硬币，抛 10 次还是抛 10000 次，P(正面)<b>始终是 0.5</b>，变的只有频率。这句话是判断题的高频考点：凡是写「概率随试验次数增大而接近 0.5」「做够多次概率就变成 0.5」的，都错。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>「用频率估计概率」的条件</th><th>满足了会怎样</th><th>缺了会怎样</th></tr></thead>
<tbody>
<tr><td>每次试验的条件相同、独立重复</td><td>频率稳定到同一个数，这个数才配叫概率的估计</td><td>换了硬币、换了机器、换了下手的人，频率稳定到另一个数，估的不是原来那个概率</td></tr>
<tr class="key"><td>试验次数 n 足够大</td><td>频率在概率附近抖动，偏离的典型量级约 ±1/(2√n)</td><td>n 只有几十次，频率可能是 0.58、0.62、0.44，这次估出来的值完全不可信</td></tr>
<tr><td>把结果写成「估计值」</td><td><span class="gx-fml">P(A) ≈ 0.58</span>，步骤分拿满</td><td>写成 <span class="gx-fml">P(A) = 0.58</span>，把试验值当成客观值，直接判错</td></tr>
<tr><td>模拟时随机数的模型与实际一致</td><td>模拟频率能近似真实概率，可以代替笨重的真实试验</td><td>用等可能的随机数代替明显不等可能的事件，模拟结果系统性偏一边，越算越错</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">答题口径：<b>频率 → 估计 → 概率</b>，箭头是单向的。写「由频率估计得 P(A) ≈ 0.58」拿分，写「P(A)=0.58」丢分；「稳定于」后面跟的永远是概率，不是某一次算出的频率。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 频率与概率的辨析 + 计算<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">抛掷一枚硬币 100 次，其中正面朝上 58 次。<br>（1）能否说这枚硬币正面朝上的概率是 0.58？为什么？<br>（2）若继续抛到 10000 次，正面累计出现 5003 次，此时正面朝上的频率是多少？据此估计 P(正面) 是多少？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 先把两个量算出来</p>
<p class="s-b">m 是频数、n 是试验次数：第一次 m=58、n=100，频率 f = m/n = 58/100 = 0.58。0.58 是这次试验算出来的读数，不是概率。</p>
<p class="s-k">用到：频率 = 频数 ÷ 试验次数，它是试验值。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 判断（1）：不能</p>
<p class="s-b">理由有两条，都要写：① 频率是试验值，会随试验变化而波动，换一组 100 次可能得到 0.51、0.62；② 概率是事件的本质属性，客观存在、不随试验次数变化，均匀硬币的 P(正面)=0.5 不因这 100 次的结果而改。</p>
<p class="s-k">用到：频率会波动、概率不变。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 补一句量化依据</p>
<p class="s-b">n=100 时，频率偏离概率的典型量级约 <span class="gx-fml">1/(2√100) = 0.05</span>。0.58 与 0.5 差 0.08，和这个量级同阶，属于小样本的正常抖动，并不说明概率是 0.58。</p>
<p class="s-k">用到：次数少时频率不可信，偏差量级约 ±1/(2√n)。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 算（2）的合并频率</p>
<p class="s-b">累计到 10000 次时 m=5003、n=10000，f = 5003/10000 = 0.5003。注意是累计频数除以累计次数，不是把两段的频率取平均。</p>
<p class="s-k">用到：同一串试验里频率由累计频数重新算。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 下结论，带「≈」</p>
<p class="s-b">n 从 100 增到 10000，f 从 0.58 落到 0.5003，稳定在 0.5 附近，所以估计 P(正面) ≈ 0.5。这里只能写估计：0.5003 是频率，不是概率，稳定于不等于相等。</p>
<p class="s-k">用到：用频率估计概率，写 ≈。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）不能。<br>① 这 100 次试验的频率 f = 58/100 = 0.58 是试验值，会随试验变化而波动，试验前不能确定；<br>② 概率是事件的本质属性，是客观值，不随试验次数变化，均匀硬币 P(正面)=0.5；<br>③ n=100 时频率偏离概率的典型量级约 1/(2√100)=0.05，0.58 只差 0.08，属于次数较少时的正常波动，不能作为概率的值。<br>（2）累计频率 f = 5003/10000 = 0.5003。随着试验次数增大，频率稳定于 0.5，故估计 P(正面) ≈ 0.5，说明这枚硬币可近似看作均匀硬币。<br>注意：全程不能写 P(正面)=0.58 或 P(正面)=0.5003，「稳定于」不等于「相等」。</p>
</div>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">频率和概率到底差在哪？能不能直接说频率就是概率？</p>
<p class="a">不能。<b>频率是试验值</b>，做一次算一次，会随试验变化而波动；<b>概率是事件的本质属性</b>，是客观值，不随试验次数变化。两者的联系只有一条：n 越来越大时频率稳定于概率，所以可以<b>用频率估计概率</b>。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="频率会变而概率不变">

</div>
<div class="qac">
<p class="q">「频率稳定于概率」里的「稳定于」是什么意思？就是相等吗？</p>
<p class="a">不是相等。它说的是<b>趋势</b>：n 越来越大时频率在概率附近摆动的幅度越来越小，最后可以要多近有多近。n=10000 时频率照样是 0.5003 这种数，<b>稳定于 ≠ 相等</b>，写答案时用「≈」不用「=」。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="频率曲线靠近概率线但不落到线上">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>

<p class="q">只抛 20 次，算出正面频率 0.65，能说概率是 0.65 吗？</p>
<p class="a">不能。<b>次数少时频率不可信</b>：n=20 时偏离量级约 1/(2√20)≈0.11，0.65 完全在小样本的正常抖动范围内。这次算出来的值只能算一次读数，估不出概率，得把 n 加上去再看频率稳不稳。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="次数少时频率在概率附近乱跳">

<p class="q">随机模拟又没真抛硬币，凭什么能估计概率？</p>
<p class="a">因为它<b>模拟的仍然是频率</b>。只要随机数的产生方式和实际事件的可能比例一致（均匀硬币就按 1:1 出 0/1），模拟出的频率就与真实试验的频率服从同一个规律，n 大时同样稳定于概率。它的好处是快、可重复、能做上万次。</p>

<p class="er-x">✗ 概率是 0.5，所以抛 100 次一定有 50 次正面。</p>
<p class="er-v">✓ 概率 0.5 表示每次试验中正面出现的可能性大小，100 次中正面次数是随机的，在 50 附近波动。</p>
<p class="er-w">错在哪：把「概率」当成「次数配额」。稳定下来的是比例，不是次数。</p>
</div>
<div class="er">
<p class="er-x">✗ 频率稳定于概率，所以 n 足够大时频率就等于概率。</p>
<p class="er-v">✓ 稳定于是趋势：n 越大频率在概率附近摆动的幅度越小，但不会停在概率上。</p>
<p class="er-w">错在哪：偷换「稳定于」和「相等」。n=10000 时 f=0.5003，仍然不等于 0.5。</p>
</div>
<div class="er">
<p class="er-x">✗ 试验次数越多，概率就越接近 0.5。</p>
<p class="er-v">✓ 概率是事件的本质属性，不随试验次数变化；变的是频率。</p>
<p class="er-w">错在哪：主语搞反了。这句话把「频率接近概率」写成了「概率接近频率」。</p>
</div>
<div class="er">
<p class="er-x">✗ 次数越多，频率一定越接近概率，一步比一步近。</p>
<p class="er-v">✓ 总体上频率会越来越靠近概率，但过程中可以出现某一步反而更远，这是趋势不是单调。</p>
<p class="er-w">错在哪：把统计规律当成单调函数。波动永远存在，只是幅度变小。</p>
</div>
<div class="er">
<p class="er-x">✗ 随机模拟不是真做实验，算出来的频率没有意义。</p>
<p class="er-v">✓ 随机模拟用随机数代替试验结果，模型与实际一致时，模拟频率同样可以估计概率。</p>
<p class="er-w">错在哪：漏了「模拟的仍是频率」这一点。它省的是时间，不是可靠性。</p>
</div>
<div class="er">
<p class="er-x">✗ n 足够大以后频率就不再变化了。</p>
<p class="er-v">✓ 频率永远在波动，只是 n 越大波动幅度越小（约 ±1/(2√n)）。</p>
<p class="er-w">错在哪：把「幅度变小」读成了「停止波动」。n=10000 时 f 仍在 0.5 附近小幅跳。</p>
</div>

<script>
/* 互动脚本：滑块 = 试验次数 n，纯函数 calc(v) → 偏离量级 bound 与三组模拟曲线的实际偏离 */
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var GX = window.GX, el = GX.el, tx = GX.tx, $ = GX.$;
  var stage = $("gxStage");
  if (!stage || !window.AutoPilot) return;

  /* 两套坐标：宽屏 880×470，窄屏独立 360×700 */
  var W = { vb: "0 0 880 470", left: { x: 16, y: 16, w: 424, h: 438 }, right: { x: 456, y: 16, w: 408, h: 438 } };
  var N = { vb: "0 0 360 700", left: { x: 8, y: 8, w: 344, h: 300 }, right: { x: 8, y: 320, w: 344, h: 372 } };
  var L = W, A = 10, MIN = 10, MAX = 10000;

  /* 固定种子的三组「抛 10000 次」记录，保证 calc 是纯函数、重跑结果一致 */
  function series(seed) {
    var s = seed, sum = 0, pref = [0], i;
    for (i = 1; i <= MAX; i++) {
      s = (Math.imul(s, 1103515245) + 12345) & 0x7fffffff;
      sum += s / 2147483648 < 0.5 ? 1 : 0;
      pref.push(sum);
    }
    return pref;
  }
  var SS = [series(20230107), series(773), series(65537)];
  var COL = ["#2563eb", "#b8791f", "#2f8a5b"];

  function calc(v) {
    var n = Math.max(MIN, Math.min(MAX, Math.round(v / 10) * 10)), i, dev = 0, d;
    for (i = 0; i < 3; i++) {
      d = Math.abs(SS[i][n] / n - 0.5);
      if (d > dev) dev = d;
    }
    return { n: n, bound: 1 / (2 * Math.sqrt(n)), dev: dev };
  }

  function draw() {
    var gA = $("gxA"), gB = $("gxB");
    gA.textContent = ""; gB.textContent = "";
    var s = calc(A);
    var cx0 = L.left.x + 56, cx1 = L.left.x + L.left.w - 18;
    var cyt = L.left.y + 44, cyb = L.left.y + L.left.h - 48, hh = cyb - cyt;
    var i, k, n, x, y, pts, bd = Math.min(0.5, s.bound);

    el("rect", { x: L.left.x, y: L.left.y, width: L.left.w, height: L.left.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    tx(gA, L.left.x + 16, L.left.y + 24, "频率 f 随试验次数 n 变化（对数横轴）", "#5a6472", "start", 10, 700);

    /* 允许偏离的带：bound 随 n 变大而变窄 */
    var yHi = cyb - (0.5 + bd) * hh, yLo = cyb - (0.5 - bd) * hh;
    el("rect", { x: cx0, y: yHi, width: cx1 - cx0, height: yLo - yHi, fill: "#e6f0fb", opacity: 0.9 }, gA);
    el("line", { x1: cx0, y1: yHi, x2: cx1, y2: yHi, stroke: "#2563eb", "stroke-width": 1, "stroke-dasharray": "4 3", opacity: 0.65 }, gA);
    el("line", { x1: cx0, y1: yLo, x2: cx1, y2: yLo, stroke: "#2563eb", "stroke-width": 1, "stroke-dasharray": "4 3", opacity: 0.65 }, gA);
    el("line", { x1: cx0, y1: cyb - 0.5 * hh, x2: cx1, y2: cyb - 0.5 * hh, stroke: "#b8402f", "stroke-width": 1.2, "stroke-dasharray": "5 4" }, gA);
    tx(gA, cx1 - 2, yHi - 6, "允许偏离 ±" + s.bound.toFixed(3), "#2563eb", "end", 9, 400);

    /* 坐标轴 + 箭头 + 刻度 */
    el("line", { x1: cx0, y1: cyb, x2: cx1, y2: cyb, stroke: "#8c96a3", "stroke-width": 1.1 }, gA);
    el("polygon", { points: (cx1 + 6) + "," + cyb + " " + (cx1 - 6) + "," + (cyb - 5) + " " + (cx1 - 6) + "," + (cyb + 5), fill: "#8c96a3" }, gA);
    el("line", { x1: cx0, y1: cyb, x2: cx0, y2: cyt, stroke: "#8c96a3", "stroke-width": 1.1 }, gA);
    el("polygon", { points: cx0 + "," + (cyt - 6) + " " + (cx0 - 5) + "," + (cyt + 6) + " " + (cx0 + 5) + "," + (cyt + 6), fill: "#8c96a3" }, gA);
    [0, 0.5, 1].forEach(function (f) {
      tx(gA, cx0 - 7, cyb - f * hh + 3.2, f === 0 ? "0" : String(f), "#8c96a3", "end", 8.4, 400);
    });
    [10, 100, 1000, 10000].forEach(function (nn) {
      tx(gA, cx0 + (Math.log(nn) / Math.LN10 / 4) * (cx1 - cx0), cyb + 15, String(nn), "#8c96a3", "middle", 8.4, 400);
    });
    tx(gA, cx0, cyb + 31, "试验次数 n（对数刻度）→", "#5a6472", "start", 9, 400);

    /* 三条模拟曲线，n 越大越挤向 0.5 */
    for (i = 0; i < 3; i++) {
      pts = "";
      for (k = 10; k <= 40; k++) {
        n = Math.round(Math.pow(10, k / 10));
        x = cx0 + (Math.log(n) / Math.LN10 / 4) * (cx1 - cx0);
        y = cyb - (SS[i][n] / n) * hh;
        pts += (pts ? " " : "") + x.toFixed(1) + "," + y.toFixed(1);
      }
      el("polyline", { points: pts, fill: "none", stroke: COL[i], "stroke-width": 1.6 }, gA);
    }
    var xn = cx0 + (Math.log(s.n) / Math.LN10 / 4) * (cx1 - cx0);
    el("line", { x1: xn, y1: cyt, x2: xn, y2: cyb, stroke: "#c9d2db", "stroke-width": 1, "stroke-dasharray": "3 3" }, gA);
    for (i = 0; i < 3; i++) {
      el("circle", { cx: xn, cy: cyb - (SS[i][s.n] / s.n) * hh, r: 3.6, fill: COL[i], stroke: "#ffffff", "stroke-width": 1 }, gA);
    }

    /* 右栏：幅度尺，与 n=100 的参照对比 */
    el("rect", { x: L.right.x, y: L.right.y, width: L.right.w, height: L.right.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    var rx = L.right.x + 22, rw = L.right.w - 44;
    tx(gB, rx, L.right.y + 28, "偏离幅度的尺子", "#5a6472", "start", 10, 700);
    tx(gB, rx, L.right.y + 72, "±" + s.bound.toFixed(3), "#2563eb", "start", 25, 700);
    tx(gB, rx, L.right.y + 96, "1/(2√n)：示意量级", "#8c96a3", "start", 9, 400);
    tx(gB, rx, L.right.y + 114, "f 大致落在 " + (0.5 - s.bound).toFixed(3) + " ~ " + (0.5 + s.bound).toFixed(3), "#3a3a35", "start", 9, 400);
    var yB = L.right.y + L.right.h - 92, maxH = L.right.h * 0.34;
    var h1 = Math.min(1, s.bound / 0.15811) * maxH, h2 = Math.min(1, 0.05 / 0.15811) * maxH;
    el("rect", { x: rx + 20, y: yB - h1, width: 48, height: h1, rx: 3, fill: "#2563eb" }, gB);
    el("rect", { x: rx + 124, y: yB - h2, width: 48, height: h2, rx: 3, fill: "none", stroke: "#b8791f", "stroke-width": 1.2, "stroke-dasharray": "4 3" }, gB);
    el("line", { x1: rx, y1: yB, x2: Math.min(rx + 240, L.right.x + rw + 22), y2: yB, stroke: "#8c96a3", "stroke-width": 1 }, gB);
    tx(gB, rx + 44, yB + 16, "现在 n=" + s.n, "#2563eb", "middle", 8.6, 400);
    tx(gB, rx + 148, yB + 16, "参照 n=100", "#b8791f", "middle", 8.6, 400);
    tx(gB, rx, yB + 46, "三条曲线此刻 f = " + (SS[0][s.n] / s.n).toFixed(3) + " / " + (SS[1][s.n] / s.n).toFixed(3) + " / " + (SS[2][s.n] / s.n).toFixed(3), "#3a3a35", "start", 8.8, 400);
    tx(gB, rx, yB + 64, "n 每乘 4，这个幅度就减半", "#8c96a3", "start", 8.8, 400);
  }

  function render() {
    var s = calc(A), st, col, bg, sn;
    $("gxVa").textContent = String(s.n);
    $("gxVb").textContent = "±" + s.bound.toFixed(3);
    $("gxVc").textContent = s.dev.toFixed(3);
    if (s.n < 50) { st = "乱跳"; col = "#b8402f"; bg = "#fbeae7"; sn = "次数少，不可信"; }
    else if (s.n < 1000) { st = "逐渐稳定"; col = "#b8791f"; bg = "#fdf3e0"; sn = "带还宽"; }
    else if (s.n < 5000) { st = "接近 0.5"; col = "#2563eb"; bg = "#e8f0fd"; sn = "带已很窄"; }
    else { st = "稳定于 0.5"; col = "#2f8a5b"; bg = "#e6f6ee"; sn = "稳定但不等"; }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    draw();
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  /* 停留帧：n=100 处停 2.4 秒（bound=0.05，频率还会晃），再走到 10000 */
  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 10 }, { t: 0.9, v: 10 }, { t: 3.6, v: 100 }, { t: 6, v: 100 }, { t: 8.5, v: 10000 }, { t: 11, v: 10000 }, { t: 13, v: 10 }],
    keys: [10, 100, 1000, 10000],
    value: A, min: MIN, max: MAX, step: 10,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc, cases: [
    { v: 100, eq: { bound: 0.05 } },
    { v: 400, eq: { bound: 0.025 } },
    { v: 10000, eq: { bound: 0.005 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
