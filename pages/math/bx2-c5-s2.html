<p class="gx-lede">上一节刚学完概率的加法公式，这一节把「乘法」补上：互斥事件用加法，独立事件用乘法，可这两个词在生活里都叫「没关系」，考场上却完全是两件事。整节只有三个判据要练熟——独立用定义式验算、互斥看交集是否为空、求「至少一个发生」时先转成对立事件。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写下面这些原句，不写口语版。</p>

<div class="gx-quote">
<p class="q-t">定义 · 事件的相互独立性<span class="q-src">人教A版必修第二册 · 第十章第2节</span></p>
<p class="q-b">对任意两个事件 A 与 B，如果 <span class="gx-fml">P(AB)=P(A)P(B)</span> 成立，则称事件 A 与事件 B 相互独立。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个条件</b>组成——①对象是两个事件；②算的是同时发生的概率 P(AB)；③必须和 P(A)·P(B) 相等。注意它是「定义」，不是「性质」：能不能说独立，靠这个式子算，不靠「互不影响」这种说法。</p>
</div>

<div class="gx-quote">
<p class="q-t">性质 · 独立事件的对立事件<span class="q-src">人教A版必修第二册 · 第十章第2节</span></p>
<p class="q-b">如果事件 A 与 B 相互独立，那么 A 与 B̄、Ā 与 B、Ā 与 B̄ 也都相互独立。</p>
<p class="q-n">→ 翻成人话：<b>四个式子只要成立一个，另外三个自动成立</b>。所以「甲、乙都没破译」可以直接写 (1−P(A))(1−P(B))，不必先证明两个「没成功」也独立——课本已经替你证了。</p>
</div>

<div class="gx-quote">
<p class="q-t">公式 · 独立事件的并集<span class="q-src">人教A版必修第二册 · 第十章第2节</span></p>
<p class="q-b">如果 A 与 B 相互独立，则 <span class="gx-fml">P(A∪B)=P(A)+P(B)−P(A)P(B)</span>。</p>
<p class="q-n">→ 翻成人话：这仍是加法公式 P(A∪B)=P(A)+P(B)−P(AB)，只是把 P(AB) 换成了 P(A)·P(B)。<b>互斥时 P(AB)=0，独立时 P(AB)=P(A)P(B)</b>，两个减项完全不是一回事，混用就直接丢分。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>要判定的东西</th><th>必须写成什么样</th><th>缺了这一条会怎样</th></tr></thead>
<tbody>
<tr><td>事件 A 与 B 相互独立</td><td>P(AB)=P(A)·P(B)，且 P(A)、P(B) 都算得出</td><td>只写「互不影响」，无判据，解答题不给分</td></tr>
<tr class="key"><td>事件 A 与 B 互斥</td><td>AB=∅，即 P(AB)=0（P(A)、P(B) 均大于 0）</td><td>把 P(AB)=0 当成独立，结论正好反了</td></tr>
<tr><td>求 P(A∪B)</td><td>独立代 P(A)P(B)，互斥代 0</td><td>减项代错，答案偏大或偏小</td></tr>
<tr><td>「至少有一个发生」</td><td>1−P(Ā B̄)，独立时 =1−(1−P(A))(1−P(B))</td><td>写成 P(A)+P(B)，重复部分算了两遍</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">背法：<b>独立看乘、互斥看空</b>。四个字对四个字，考场上先在心里念一遍，再动笔写式子；只高亮的那一行是本节最容易被整段写反的地方。</p>
</section>

<section class="gx-sec" id="b">
<h2><span class="sn">02</span>拆开看</h2>
<p class="gx-h2s">四张图：各讲一件事，按「是什么 → 怎么变 → 怎么用」排。</p>

<figure class="gx-fig">
<div class="fig-cap">
<span class="fig-no">图 1</span><span class="fig-t">独立的定义与乘法公式</span>
<span class="bdg bdg-must">必考</span>
</div>
<p class="fig-s">先把「同时发生」拆成两段概率相乘：P(AB) 就是把 P(A) 再乘上 P(B)。系数 0.5 不是背的，是 P(B) 的值；A 与 B 的地位可以互换，所以式子两边对称。</p>
<div class="gx-svgbox">
<svg viewBox="0 0 820 260" role="img" aria-label="独立的定义与乘法公式示意">
<rect x="16" y="16" width="788" height="228" rx="10" fill="#f8fbfd" stroke="#dbe7ef"/>
<text x="36" y="42" font-size="11.5" font-weight="700" fill="#151a21">P(AB)=P(A)·P(B)：同时发生 = 两次概率相乘</text>
<rect x="44" y="60" width="150" height="68" rx="8" fill="#ffffff" stroke="#b8e6d0"/>
<text x="56" y="82" font-size="10" font-weight="700" fill="#151a21">事件 A</text>
<text x="56" y="99" font-size="9.4" fill="#3a3a35">甲破译成功</text>
<text x="56" y="115" font-size="9.6" font-weight="700" fill="#2f8a5b">P(A)=0.6</text>
<text x="204" y="100" font-size="20" fill="#5a6472">×</text>
<rect x="222" y="60" width="150" height="68" rx="8" fill="#ffffff" stroke="#b8e6d0"/>
<text x="234" y="82" font-size="10" font-weight="700" fill="#151a21">事件 B</text>
<text x="234" y="99" font-size="9.4" fill="#3a3a35">乙破译成功</text>
<text x="234" y="115" font-size="9.6" font-weight="700" fill="#2f8a5b">P(B)=0.5</text>
<text x="382" y="100" font-size="17" fill="#5a6472">=</text>
<rect x="400" y="60" width="180" height="68" rx="8" fill="#eef7f2" stroke="#2f8a5b"/>
<text x="412" y="82" font-size="10" font-weight="700" fill="#151a21">事件 AB（同时发生）</text>
<text x="412" y="99" font-size="9.4" fill="#3a3a35">两人都破译成功</text>
<text x="412" y="115" font-size="9.6" font-weight="700" fill="#2f8a5b">P(AB)=0.6×0.5=0.3</text>
<rect x="596" y="60" width="188" height="68" rx="8" fill="#fffdf5" stroke="#e2d3a8"/>
<text x="608" y="82" font-size="9.6" font-weight="700" fill="#b8791f">判据只有这一条</text>
<text x="608" y="99" font-size="9.2" fill="#3a3a35">P(AB)=P(A)·P(B) 成立</text>
<text x="608" y="115" font-size="9.2" fill="#3a3a35">才可称 A 与 B 相互独立</text>
<rect x="44" y="146" width="740" height="80" rx="8" fill="#ffffff" stroke="#e6e9ee"/>
<text x="60" y="170" font-size="9.6" fill="#151a21">① 式子是对称的：P(AB)=P(A)P(B)=P(B)P(A)，所以「A 对 B 独立」与「B 对 A 独立」是同一件事。</text>
<text x="60" y="190" font-size="9.6" fill="#151a21">② 乘法公式反过来用：已知独立又知 P(A)、P(B)，直接乘出 P(AB)，这是考卷上最常见的两行。</text>
<text x="60" y="210" font-size="9.6" fill="#151a21">③ 若 P(A)=0 或 P(B)=0，式子恒成立，此时谈独立没有信息量，题目一般会避开这种极端值。</text>
</svg>
<span class="gx-zoomchip">点击放大</span>
</div>
<p class="gx-take">独立不是「两件事没关系」，而是 <span class="gx-fml">P(AB)=P(A)·P(B)</span> 这一个等式成立；等式不成立就是不独立，没有中间状态。</p>
<p class="gx-note">口径提醒：独立由 P(AB)=P(A)P(B) 判定，所以判断前<b>必须先有概率值</b>。只给文字描述（「互不影响」）的题目，出题人是在暗示你按独立算，但答题时仍要写出 P(AB)=P(A)P(B) 这一步。</p>
</figure>

<figure class="gx-fig">
<div class="fig-cap">
<span class="fig-no">图 2</span><span class="fig-t">互斥与独立：Venn 图与数值对照</span>
<span class="bdg bdg-key">辨析</span>
</div>
<p class="fig-s">左边两圆不相交，交集是空集，P(AB)=0；右边两圆相交，重叠部分正好是 0.25。取 P(A)=P(B)=0.5 时，互斥事件的并集是 1，独立事件的并集是 0.75——同一组边缘概率，结论差 0.25。</p>
<div class="gx-svgbox">
<svg viewBox="0 0 820 240" role="img" aria-label="互斥与独立的维恩图与数值对照">
<rect x="16" y="16" width="788" height="208" rx="10" fill="#f8fbfd" stroke="#dbe7ef"/>
<text x="36" y="42" font-size="11.5" font-weight="700" fill="#151a21">互斥：AB=∅（P(AB)=0）　　独立：P(AB)=P(A)P(B)=0.25</text>
<rect x="40" y="56" width="352" height="152" rx="8" fill="#ffffff" stroke="#e6e9ee"/>
<text x="52" y="76" font-size="9.8" font-weight="700" fill="#b8402f">互斥（不相容）</text>

<circle cx="252" cy="122" r="38" fill="#fbeae7" stroke="#b8402f"/>

<text x="234" y="126" font-size="9.4" fill="#151a21">B 0.5</text>
<text x="52" y="182" font-size="9.2" fill="#3a3a35">P(AB)=0　P(A∪B)=0.5+0.5=1</text>
<text x="52" y="198" font-size="9.2" fill="#b8402f">0 ≠ 0.25，所以互斥的两个事件不独立</text>
<rect x="412" y="56" width="372" height="152" rx="8" fill="#ffffff" stroke="#e6e9ee"/>
<text x="424" y="76" font-size="9.8" font-weight="700" fill="#2f8a5b">独立</text>
<circle cx="540" cy="122" r="38" fill="#e6f6ee" stroke="#2f8a5b"/>
<circle cx="646" cy="122" r="38" fill="#e6f6ee" stroke="#2f8a5b"/>
<text x="512" y="126" font-size="9.4" fill="#151a21">A 0.5</text>
<text x="636" y="126" font-size="9.4" fill="#151a21">B 0.5</text>
<text x="572" y="126" font-size="9.2" font-weight="700" fill="#2f8a5b">0.25</text>
<text x="424" y="182" font-size="9.2" fill="#3a3a35">P(AB)=0.5×0.5=0.25　P(A∪B)=0.75</text>

<text x="36" y="228" font-size="9.2" fill="#5a6472">互斥是「集合关系」，独立是「概率关系」；只有 P(A)、P(B) 有一个为 0 时，互斥才可能同时独立。</text>
</svg>
<span class="gx-zoomchip">点击放大</span>
</div>
<p class="gx-take">互斥 ≠ 独立：互斥说的是两个事件不能同时发生，独立说的是同时发生的概率恰好等于两概率之积；当 P(A)>0 且 P(B)>0 时，<b>互斥一定导致不独立</b>。</p>
</figure>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 相互独立事件求「至少一个」的概率<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">甲、乙两人独立破译一份密码，甲成功的概率是 0.6，乙成功的概率是 0.5。求密码被破译的概率。（陷阱：两人都成功这种情况只能算一次，不能加两遍。）</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 设事件</p>
<p class="s-b">设 A＝「甲破译成功」，B＝「乙破译成功」。「密码被破译」这件事是 A 与 B 至少有一个发生，即 A∪B。</p>
<p class="s-k">用到：事件的语言，先把目标翻译成集合式。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 用上「独立」</p>
<p class="s-b">题干说「独立」，意思是 P(AB)=P(A)·P(B)=0.6×0.5=0.3。它不是互斥，所以 P(AB) 不等于 0，两条路确实可能同时走通。</p>
<p class="s-k">用到：独立判定式 P(AB)=P(A)P(B)，一条式子定生死。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 选对立事件</p>
<p class="s-b">正面算要分三种：甲中乙不中、乙中甲不中、甲乙都中。改成对立事件「密码没被破译」，只有一种：两人都失败，即 Ā B̄。由独立性，Ā 与 B̄ 也独立。</p>
<p class="s-k">用到：A 与 B 独立 ⇒ Ā 与 B̄ 也独立；「至少一个」用 1−都不发生。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 算数</p>
<p class="s-b">P(Ā B̄)=(1−0.6)(1−0.5)=0.4×0.5=0.2，所以 P(A∪B)=1−0.2=0.8。若用并集公式核对：0.6+0.5−0.3=0.8，两条路一致。</p>
<p class="s-k">用到：乘法公式 + 对立事件公式，双路验算最稳。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 写结论</p>
<p class="s-b">密码被破译的概率为 0.8。答完检查一句：0.8 明显小于 0.6+0.5=1.1，说明重叠部分被减掉了，量级合理。</p>
<p class="s-k">用到：概率必须落在 0 到 1 之间，越界就是公式用错。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">设 A＝「甲破译成功」，B＝「乙破译成功」，A 与 B 相互独立。<br>
① 密码被破译＝A∪B，其对立事件为 Ā B̄（两人都没破译）。<br>
② 由 A 与 B 独立知 Ā 与 B̄ 也独立，故 <span class="gx-fml">P(Ā B̄)=(1−P(A))(1−P(B))=0.4×0.5=0.2</span>。<br>
③ <span class="gx-fml">P(A∪B)=1−P(Ā B̄)=1−0.2=0.8</span>。<br>
答：密码被破译的概率为 0.8。</p>
</div>
</div>
</section>
<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「题目只写了『两人互不影响』，我能直接说独立吗？」</p>
<p class="a">能按独立算，但解答题要补一句判据：独立由 <b>P(AB)=P(A)P(B)</b> 判定，口语描述只是出题人的提示，不是证明。写完这一步再往下乘。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="独立判据式子">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="42" font-size="9" fill="#5a6472" text-anchor="middle">判据（唯一）</text>
<text x="120" y="66" font-size="11" font-weight="700" fill="#2563eb" text-anchor="middle">P(AB)=P(A)·P(B)</text>
<text x="120" y="92" font-size="9" fill="#3a3a35" text-anchor="middle">成立 → 相互独立</text>
<text x="120" y="110" font-size="9" fill="#3a3a35" text-anchor="middle">不成立 → 不独立</text>
</svg>
</div>
<div class="qac">
<p class="q">「互斥和独立到底差在哪？不都是两件事没关系吗？」</p>
<p class="a"><b>互斥≠独立</b>。互斥是集合关系 AB=∅，两件事不能同时发生；独立是概率关系 P(AB)=P(A)P(B)。P(A)、P(B) 都大于 0 时，互斥必导致 P(AB)=0≠P(A)P(B)，所以互斥的两个事件一定不独立。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="互斥与独立对照">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<circle cx="62" cy="52" r="22" fill="#fbeae7" stroke="#b8402f"/>
<circle cx="106" cy="52" r="22" fill="#fbeae7" stroke="#b8402f"/>
<text x="84" y="96" font-size="9" fill="#b8402f" text-anchor="middle">互斥：AB=∅</text>
<circle cx="158" cy="50" r="22" fill="#e6f6ee" stroke="#2f8a5b"/>
<circle cx="190" cy="50" r="22" fill="#e6f6ee" stroke="#2f8a5b"/>
<text x="174" y="96" font-size="9" fill="#2f8a5b" text-anchor="middle">独立：有重叠</text>
<text x="120" y="116" font-size="9" fill="#5a6472" text-anchor="middle">左边交集为空，右边交集不为空</text>
</svg>
</div>
<div class="qac">
<p class="q">「求『至少一个发生』，我直接 P(A)+P(B) 行不行？」</p>
<p class="a">不行，中间重叠算了两遍。「至少一个用 1−都不发生」：P=1−P(Ā B̄)，独立时 =1−(1−P(A))(1−P(B))。本例 1−0.4×0.5=0.8，比 1.1 小，这才是合法概率。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="一减都不发生的线段图">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<rect x="26" y="46" width="46" height="26" fill="#fbeae7" stroke="#b8402f"/>
<rect x="72" y="46" width="142" height="26" fill="#e6f6ee" stroke="#2f8a5b"/>
<text x="49" y="63" font-size="8" fill="#b8402f" text-anchor="middle">0.2</text>
<text x="143" y="63" font-size="8" fill="#2f8a5b" text-anchor="middle">1−0.2=0.8</text>
<text x="120" y="92" font-size="9" fill="#3a3a35" text-anchor="middle">两段拼满，整条长度是 1</text>
<text x="120" y="112" font-size="9" fill="#2563eb" text-anchor="middle">P=1−(1−0.6)(1−0.5)</text>
</svg>
</div>
<div class="qac">
<p class="q">「题目给了 P(AB)、P(A)、P(B)，反过来能判独立吗？」</p>
<p class="a">能，这正是定义式的用法：算出 P(A)·P(B) 与 P(AB) 比较，相等就独立。注意比较的是<b>数值</b>，不是事件描述；四舍五入造成的 0.001 级偏差不改变结论。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="代入数值比较">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="38" font-size="9" fill="#5a6472" text-anchor="middle">已知 P(A)=0.4，P(B)=0.5</text>
<text x="120" y="62" font-size="10" font-weight="700" fill="#2563eb" text-anchor="middle">P(A)P(B)=0.20</text>
<text x="120" y="84" font-size="9" fill="#3a3a35" text-anchor="middle">若 P(AB)=0.20 → 独立</text>
<text x="120" y="104" font-size="9" fill="#b8402f" text-anchor="middle">若 P(AB)=0 → 互斥，必不独立</text>
</svg>
</div>
<div class="qac">
<p class="q">「三个事件相互独立，是不是两两独立就够了？」</p>
<p class="a">不够。要 4 个等式：P(AB)=P(A)P(B)、P(AC)=P(A)P(C)、P(BC)=P(B)P(C)，再加 P(ABC)=P(A)P(B)P(C)。两两独立只是前三条，第四条可以单独翻车。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="三个等式加一个乘积式">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="34" font-size="9" fill="#5a6472" text-anchor="middle">两两独立（3 条）</text>
<text x="120" y="54" font-size="9" fill="#3a3a35" text-anchor="middle">P(AB)、P(AC)、P(BC) 各自可拆</text>
<text x="120" y="78" font-size="9" fill="#b8791f" text-anchor="middle">还要第 4 条（容易漏）</text>
<text x="120" y="98" font-size="10" font-weight="700" fill="#2563eb" text-anchor="middle">P(ABC)=P(A)P(B)P(C)</text>
<text x="120" y="116" font-size="8.6" fill="#5a6472" text-anchor="middle">四个全成立才叫「相互独立」</text>
</svg>
</div>
<div class="qac">
<p class="q">「同一件事重复做 3 次，恰好 2 次成功怎么算？」</p>
<p class="a">先认模型：<b>n 次独立重复试验</b>。每条的路径概率都是 p²(1−p)，共 C(3,2)=3 条路径，所以 P=C(3,2)·p²·(1−p)。系数 C(n,k) 是选位置，不是选概率。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="三次试验恰好两次成功的路径">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="34" font-size="9" fill="#5a6472" text-anchor="middle">恰好 2 次成功 = 3 条路径</text>
<text x="120" y="58" font-size="9" fill="#3a3a35" text-anchor="middle">中中不 · 中不中 · 不中中</text>
<text x="120" y="82" font-size="9" fill="#3a3a35" text-anchor="middle">每条概率都是 p²(1−p)</text>
<text x="120" y="106" font-size="10" font-weight="700" fill="#2563eb" text-anchor="middle">P=C(3,2)p²(1−p)</text>
</svg>
</div>
</div>
<p class="gx-note">六问其实是同一件事：<b>先把文字翻成式子，再选对判据</b>。独立用乘法、互斥看交集、至少一个取对立——三条路走顺了，这一节就没有新题型。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ A 与 B 互斥，所以 A 与 B 相互独立。</p>
<p class="er-v">✓ 互斥≠独立。互斥是 AB=∅（P(AB)=0），独立是 P(AB)=P(A)P(B)；P(A)、P(B) 均大于 0 时，两者不可能同时成立。</p>
<p class="er-w">错在哪：把集合关系和概率关系画了等号，结论正好相反。</p>
</div>
<div class="er">
<p class="er-x">✗ A 与 B 相互独立，所以 P(A∪B)=P(A)+P(B)。</p>
<p class="er-v">✓ 独立事件用 P(A∪B)=P(A)+P(B)−P(A)P(B)；只有互斥事件才直接相加。</p>
<p class="er-w">错在哪：独立时 P(AB) 一般不为 0，直接相加把重叠算了两遍，结果可能超过 1。</p>
</div>
<div class="er">
<p class="er-x">✗ 「至少一人命中」的概率＝P(A)+P(B)。</p>
<p class="er-v">✓ 「至少一个用 1−都不发生」：P=1−P(Ā B̄)=1−(1−P(A))(1−P(B))。</p>
<p class="er-w">错在哪：三人以上时还会加出大于 1 的数，直接暴露公式用错。</p>
</div>
<div class="er">
<p class="er-x">✗ 要相互独立，必须 P(A)=P(B)。</p>
<p class="er-v">✓ 判据只有一条：P(AB)=P(A)P(B)。两个概率不相等照样可以独立，如 0.6 与 0.5，只要 P(AB)=0.3。</p>
<p class="er-w">错在哪：把「对称的式子」误读成「相等的概率」，多加了一个不存在的条件。</p>
</div>
<div class="er">
<p class="er-x">✗ 甲成功的概率 0.6、乙只有 0.5，一大一小，所以不独立。</p>
<p class="er-v">✓ 独立性与概率的<b>大小</b>无关，只与 P(AB) 是否等于 P(A)P(B) 有关。</p>
<p class="er-w">错在哪：用「数值差多少」代替判据，属于凭感觉下结论。</p>
</div>
<div class="er">
<p class="er-x">✗ 两次试验互不影响，所以一定 P(AB)=P(A)P(B)，不用再算。</p>
<p class="er-v">✓ 独立由 P(AB)=P(A)P(B) 判定，这是定义；实际计算时正是要用它把 P(AB) 乘出来。</p>
<p class="er-w">错在哪：把要用的等式当成已经证过的结论，答题卡上少一行关键判据。</p>
</div>
<div class="er">
<p class="er-x">✗ A、B、C 两两独立，所以 A、B、C 相互独立。</p>
<p class="er-v">✓ 还要加上 P(ABC)=P(A)P(B)P(C)，四个等式全成立才叫相互独立。</p>
<p class="er-w">错在哪：漏掉三事件的乘积式，这是选修与模考常见的最后一击。</p>
</div>
</div>

  var W = { vb: "0 0 880 470", left: { x: 16, y: 16, w: 424, h: 438 }, right: { x: 456, y: 16, w: 408, h: 438 } };
  var N = { vb: "0 0 360 700", left: { x: 8, y: 8, w: 344, h: 300 }, right: { x: 8, y: 8 + 312, w: 344, h: 372 } };
  /* A 用「百分比」存滑块位置（0.05–1 记作 5–100），calc 只吃 0–1 的小数 */
  var L = W, A = 50;

  var C = { blue: "#2563eb", green: "#2f8a5b", amber: "#b8791f", red: "#b8402f", gray: "#5a6472", ink: "#151a21" };

  /* 纯函数：参数 → 数值。render() 和 __model.cases 都用它 */
  function calc(v) {
    var PA = Math.max(0, Math.min(1, v));
    var both = PA * 0.5;
    var union = PA + 0.5 - both;
    var none = (1 - PA) * 0.5;
    return { pa: PA, both: both, union: union, none: none };
  }

  function bar(g, x, y, w, h, fill, stroke, dash) {
    el("rect", {
      x: x, y: y, width: Math.max(1, w), height: h, rx: 3,
      fill: fill, stroke: stroke || fill, "stroke-width": 1,
      "stroke-dasharray": dash || "none"
    }, g);
  }

  function axis(g, x, y, w, fs) {
    el("line", { x1: x, y1: y, x2: x + w, y2: y, stroke: "#98a4b3", "stroke-width": 1 }, g);
    for (var i = 0; i <= 4; i++) {
      var px = x + w * i / 4;
      el("line", { x1: px, y1: y, x2: px, y2: y + 4, stroke: "#98a4b3", "stroke-width": 1 }, g);
      tx(g, px, y + 15, i === 0 ? "0" : i === 4 ? "1" : (i / 4).toFixed(2).replace("0.", "."), C.gray, "middle", fs, 400);
    }
  }

  function draw() {
    var gA = $("gxA"), gB = $("gxB");
    gA.textContent = ""; gB.textContent = "";
    var s = calc(A / 100), p = L.left, q = L.right, narrow = L === N;
    var fs = narrow ? 8.4 : 9.2;

    /* ---------- 左：四条概率条 ---------- */
    el("rect", { x: p.x, y: p.y, width: p.w, height: p.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    tx(gA, p.x + 16, p.y + 25, "概率条（长度按比例，满格为 1）", C.gray, "start", narrow ? 9.6 : 10.5, 700);

    var x0 = p.x + 92, maxW = p.w - 152;
    var rowH = (p.h - 120) / 4, y0 = p.y + 62;
    var rows = [
      { lb: "P(A)", w: s.pa, fill: "#cfe0f9", stroke: C.blue, val: s.pa.toFixed(2), col: C.blue },
      { lb: "P(B)=0.5", w: 0.5, fill: "#fbeed6", stroke: C.amber, val: "0.50", col: C.amber },
      { lb: "P(AB)", w: s.both, fill: "#d6f0e2", stroke: C.green, val: s.both.toFixed(3), col: C.green },
      { lb: "P(A∪B)", w: s.union, fill: "#e3dcf7", stroke: "#6d4fc4", val: s.union.toFixed(3), col: "#6d4fc4" }
    ];
    for (var i = 0; i < 4; i++) {
      var r = rows[i], ry = y0 + i * rowH;
      tx(gA, p.x + 14, ry + 12, r.lb, C.ink, "start", fs + 0.4, 700);
      if (i === 3) {
        /* 虚线 = P(A)+0.5 的天真和，实条 = 真正的并集，差的正是 P(AB) */
        bar(gA, x0, ry + 2, (s.pa + 0.5) * maxW, 20, "#ffffff", C.red, "4 3");
        bar(gA, x0, ry + 2, s.union * maxW, 20, r.fill, r.stroke);
        tx(gA, x0, ry - 3, "虚线 P(A)+0.5，实条减掉重叠", C.red, "start", fs - 0.6, 400);
      } else {
        bar(gA, x0, ry + 2, r.w * maxW, 20, r.fill, r.stroke);
      }
      tx(gA, p.x + p.w - 14, ry + 17, r.val, r.col, "end", fs + 0.6, 700);
    }
    axis(gA, x0, y0 + 4 * rowH + 8, maxW, fs - 0.6);

    /* ---------- 右：Venn 图 ---------- */
    el("rect", { x: q.x, y: q.y, width: q.w, height: q.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    tx(gB, q.x + 16, q.y + 25, "Venn 图：重叠那块就是 P(AB)", C.gray, "start", narrow ? 9.6 : 10.5, 700);

    var k = narrow ? 0.84 : 1;
    var cx = q.x + q.w / 2, cy = q.y + (narrow ? 118 : 150);
    var rA = (32 + 50 * s.pa) * k, rB = (32 + 50 * 0.5) * k;
    var mn = Math.min(rA, rB), d = rA + rB - 2 * (s.both * mn * 1.25), dmin = Math.abs(rA - rB) + 4;
    if (d < dmin) d = dmin;
    if (d > rA + rB - 2) d = rA + rB - 2;
    var ax = cx - d / 2, bx = cx + d / 2;
    el("circle", { cx: ax, cy: cy, r: rA, fill: "#cfe0f9", "fill-opacity": 0.75, stroke: C.blue, "stroke-width": 1.2 }, gB);
    el("circle", { cx: bx, cy: cy, r: rB, fill: "#fbeed6", "fill-opacity": 0.7, stroke: C.amber, "stroke-width": 1.2 }, gB);
    tx(gB, ax - rA * 0.5, cy + 4, "A", C.blue, "middle", fs + 1.4, 700);
    tx(gB, bx + rB * 0.5, cy + 4, "B", C.amber, "middle", fs + 1.4, 700);
    tx(gB, cx, cy - 8, "P(AB)", C.green, "middle", fs - 0.4, 700);
    tx(gB, cx, cy + 8, s.both.toFixed(3), C.green, "middle", fs + 0.2, 700);

    var fy = q.y + q.h - 96;
    el("line", { x1: q.x + 16, y1: fy - 22, x2: q.x + q.w - 16, y2: fy - 22, stroke: "#e6e9ee", "stroke-width": 1 }, gB);
    tx(gB, q.x + 16, fy, "① P(AB)=P(A)×0.5=" + s.both.toFixed(3), C.ink, "start", fs, 400);
    tx(gB, q.x + 16, fy + 22, "② P(A∪B)=P(A)+0.5−P(AB)=" + s.union.toFixed(3), C.ink, "start", fs, 400);
    tx(gB, q.x + 16, fy + 44, "③ 都不发生 =(1−P(A))×0.5=" + s.none.toFixed(3), C.gray, "start", fs, 400);
    tx(gB, q.x + 16, fy + 66, s.union < 0.999 ? "并集小于 P(A)+0.5：重叠只算一次" : "只有 P(A)=1，并集才追平 1", C.red, "start", fs - 0.4, 700);
  }

  function render() {
    var s = calc(A / 100), st, col, bg, sn;
    $("gxVa").textContent = s.pa.toFixed(2);
    $("gxVb").textContent = s.both.toFixed(3);
    $("gxVc").textContent = s.union.toFixed(3);
    if (A < 40) { st = "被吃掉一截"; col = C.amber; bg = "#fdf3e0"; sn = "并集明显小于 P(A)+0.5"; }
    else if (A < 100) { st = "并集未满 1"; col = C.blue; bg = "#eaf1fd"; sn = A === 50 ? "各 1/2：重叠 0.25，并 0.75" : "重叠 = P(A)×0.5，只减一次"; }
    else { st = "A 必然发生"; col = C.green; bg = "#e6f6ee"; sn = "P(A)=1，并集才等于 1"; }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    draw();
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 20 }, { t: 1.2, v: 20 }, { t: 4, v: 50 }, { t: 6.5, v: 50 }, { t: 9, v: 100 }, { t: 11.5, v: 100 }, { t: 13, v: 20 }],
    keys: [20, 50, 100],
    value: A, min: 5, max: 100, step: 5,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc, cases: [
    { v: 0.2, eq: { both: 0.1, union: 0.6 } },
    { v: 0.5, eq: { both: 0.25, union: 0.75 } },
    { v: 1, eq: { both: 0.5, union: 1 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
</body>
</html>
