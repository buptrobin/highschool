<p class="gx-lede">2.1 刚把不等式的基本性质理完，2.2 立刻给出这一章唯一的「万能工具」：<span class="gx-fml">√(ab) ≤ (a+b)/2</span>。它本身不难，难在它有三个前置条件，考场上八成的失分不是算错，而是条件没验、方向搞反。这一页把三条件、两个方向、一张半圆图放在一起，配一个可以拖的 a+b = 10 模型，让你看清「等号取不到就没有最值」到底长什么样。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 基本不等式<span class="q-src">人教A版必修第一册 · 第二章 2.2</span></p>
<p class="q-b">如果 a &gt; 0，b &gt; 0，那么 <span class="gx-fml">√(ab) ≤ (a+b)/2</span>，当且仅当 a = b 时等号成立。</p>
<p class="q-n">→ 翻成人话：两个<b>正数</b>的几何平均数不超过算术平均数。这句话由<b>三个条件</b>组成——① a、b 都为正（一正）；② 和或积有一个是定值（二定）；③ a = b 能在取值范围内取到（三相等）。少一个，等号就不成立；等号不成立，就没有最值。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 常用变形<span class="q-src">人教A版必修第一册 · 第二章 2.2</span></p>
<p class="q-b">把上式两边同乘 2，得 <span class="gx-fml">a + b ≥ 2√(ab)</span>（a &gt; 0，b &gt; 0），当且仅当 a = b 时等号成立。</p>
<p class="q-n">→ 翻成人话：考卷上更常用这个方向——<b>左边是和，右边是积</b>。所以「和定」时把和代进去，右边就成了定值，积被它压住；「积定」时反过来把积代进去，和就被它托住。这就是<b>和定求积最大、积定求和最小</b>两个方向的来源。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 用基本不等式求最值的条件<span class="q-src">人教A版必修第一册 · 第二章 2.2</span></p>
<p class="q-b">用基本不等式求最值时，要注意「一正、二定、三相等」：各项为正；和或积为定值；等号能够取到。</p>
<p class="q-n">→ 翻成人话：这三条是<b>使用许可证</b>，不是解题步骤。写解答时三句都要落地：先写「因为 x &gt; 0，所以……」，再写「又 x · (4/x) = 4 为定值」，最后写「当且仅当 x = 2 时等号成立」。三句缺一句，扣分点就在那一句上。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>条件</th><th>上考场要检查什么</th><th>缺了会怎样</th></tr></thead>
<tbody>
<tr><td>一正</td><td>a &gt; 0 且 b &gt; 0，负数先换元变正</td><td>√(ab) 在实数范围无意义，不等式直接作废</td></tr>
<tr><td>二定</td><td>a + b 或 ab 有一个是常数</td><td>右边跟着变量一起动，压不住，求不出最值</td></tr>
<tr class="key"><td>三相等</td><td>a = b 的解落在定义域内</td><td>等号取不到就没有最值，只能用单调性另求</td></tr>
<tr><td>方向</td><td>和定求积最大 / 积定求和最小</td><td>方向反了，把最大值当最小值写，全错</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">背法：<b>一正二定三相等</b>是许可证，<b>和定求积最大、积定求和最小</b>是方向。整张表只高亮「三相等」这一行，因为它是唯一一个「算完了才发现用错」的条件——前两个条件扫一眼题干就知道，第三个必须动笔解方程。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 积定求和的最小值<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">已知 x &gt; 0，求 <span class="gx-fml">x + 4/x</span> 的最小值，并指出取得最小值时 x 的值。若把条件改成 x &lt; 0，结论会怎样变？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 先验「一正」</p>
<p class="s-b">题干给 x &gt; 0，所以 x 与 4/x 都是正数，满足「一正」。这一步不能省：若 x &lt; 0，两项都为负，公式不能直接套。</p>
<p class="s-k">用到：一正二定三相等里的「一正」。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 找「二定」</p>
<p class="s-b">两项相乘：x · (4/x) = 4，与 x 无关，是定值。积定 ⇒ 求和的最小值，方向定为「积定求和最小」。</p>
<p class="s-k">用到：积定求和最小；把积算成常数是这一步的全部工作。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 套基本不等式</p>
<p class="s-b">由 a + b ≥ 2√(ab)（a，b &gt; 0），取 a = x、b = 4/x，得 x + 4/x ≥ 2√(x · 4/x) = 2√4 = 4。</p>
<p class="s-k">用到：a + b ≥ 2√(ab)，注意根号里是 ab，不是 2ab。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 验「三相等」</p>
<p class="s-b">等号成立要 a = b，即 x = 4/x，解得 x = 2 或 x = −2；条件 x &gt; 0 只留 x = 2。等号能取到，所以 4 是最小值，不是下界。</p>
<p class="s-k">用到：三相等——解出的 x 必须落在定义域里。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 换条件，看结论怎么翻</p>
<p class="s-b">若 x &lt; 0，则 −x &gt; 0，x + 4/x = −[(−x) + 4/(−x)] ≤ −2√4 = −4，当且仅当 x = −2 时取到。此时 4 不再是下界，函数的最大值是 −4。</p>
<p class="s-k">用到：一正不满足时先提负号，把负数换成正数再用公式。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">因为 x &gt; 0，所以 x &gt; 0，4/x &gt; 0，满足「一正」；<br>
又 x · (4/x) = 4 为定值，满足「二定」；<br>
由基本不等式得 x + 4/x ≥ 2√(x · 4/x) = 2√4 = 4；<br>
当且仅当 x = 4/x，即 x = 2（满足 x &gt; 0）时等号成立，满足「三相等」。<br>
所以当 x = 2 时，x + 4/x 取得最小值 4。<br>
若 x &lt; 0：x + 4/x = −[(−x) + 4/(−x)] ≤ −2√4 = −4，当且仅当 x = −2 时取等号，此时有最大值 −4，没有最小值。</p>
</div>
</div>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">用基本不等式求最值，到底要验哪三个条件？</p>
<p class="a"><b>一正二定三相等</b>：各项为正；和或积有一个是常数；等号能在定义域内取到。三个条件是并列的许可证，缺一个就不能写 ≥。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="三个条件清单">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="22" y="36" font-size="9.4" fill="#151a21">① 一正：a &gt; 0，b &gt; 0</text>
<text x="22" y="60" font-size="9.4" fill="#151a21">② 二定：和或积是常数</text>
<text x="22" y="84" font-size="9.4" fill="#151a21">③ 三相等：a = b 有解</text>
<text x="22" y="110" font-size="8.8" fill="#b8402f">缺一条，≥ 就不能写</text>
</svg>
</div>
<div class="qac">
<p class="q">公式套上了，但等号取不到，会怎样？</p>
<p class="a">算出来的只是<b>下界</b>，不是最小值——<b>等号取不到就没有最值</b>。此时要改用单调性，在区间端点处求真正的最值。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="等号点落在定义域外">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="22" y="28" font-size="9" fill="#151a21">x ≥ 3 时，公式给出 ≥ 4</text>
<text x="22" y="46" font-size="9" fill="#151a21">等号要 x = 2，不在范围</text>
<line x1="22" y1="88" x2="214" y2="88" stroke="#5a6472" stroke-width="1.2"/>
<polygon points="206,84 216,88 206,92" fill="#5a6472"/>
<line x1="76" y1="82" x2="76" y2="94" stroke="#5a6472" stroke-width="1.2"/>
<line x1="120" y1="82" x2="120" y2="94" stroke="#5a6472" stroke-width="1.2"/>
<circle cx="76" cy="88" r="5" fill="none" stroke="#b8402f" stroke-width="1.4"/>
<text x="76" y="108" font-size="9" fill="#b8402f" text-anchor="middle">2</text>
<text x="120" y="108" font-size="9" fill="#b8402f" text-anchor="middle">3</text>
<text x="22" y="68" font-size="9" fill="#b8402f">等号取不到就没有最值</text>
</svg>
</div>
<div class="qac">
<p class="q">和是定值，求的是积的什么值？</p>
<p class="a">求<b>最大值</b>。<b>和定求积最大</b>：a + b = S 时 ab ≤ (S/2)²，在 a = b = S/2 处取到。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="和定时积的抛物线封顶">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="20" y="26" font-size="9" fill="#151a21">和定 → 积有最大值</text>
<polyline points="40,100 70,60 100,44 120,40 140,44 170,60 200,100" fill="none" stroke="#2563eb" stroke-width="1.8"/>
<line x1="120" y1="40" x2="120" y2="100" stroke="#b8791f" stroke-width="1" stroke-dasharray="3 2"/>
<circle cx="120" cy="40" r="3.4" fill="#b8402f"/>
<text x="20" y="118" font-size="9" fill="#5a6472">a + b = 10 ⇒ ab ≤ 25</text>
</svg>
</div>
<div class="qac">
<p class="q">积是定值，求的是和的什么值？</p>
<p class="a">求<b>最小值</b>。<b>积定求和最小</b>：ab = P 时 a + b ≥ 2√P，在 a = b = √P 处取到。方向与上一问正好相反。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="积定时和的曲线见底">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="20" y="26" font-size="9" fill="#151a21">积定 → 和有最小值</text>
<polyline points="40,40 60,78 90,96 120,100 150,96 180,78 200,40" fill="none" stroke="#2563eb" stroke-width="1.8"/>
<line x1="120" y1="58" x2="120" y2="100" stroke="#b8791f" stroke-width="1" stroke-dasharray="3 2"/>
<circle cx="120" cy="100" r="3.4" fill="#b8402f"/>
<text x="20" y="118" font-size="9" fill="#5a6472">x·(4/x) = 4 ⇒ 和 ≥ 4</text>
</svg>
</div>
<div class="qac">
<p class="q">为什么必须要求 a、b 都是正数？</p>
<p class="a">因为右边要出现 √(ab)，实数范围内要求 ab ≥ 0；但仅 ab ≥ 0 不够——a、b 同为负时 (a+b)/2 为负，<b>不等式方向就反了</b>。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="负数反例">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="20" y="32" font-size="9" fill="#151a21">√(ab) 只要求 ab ≥ 0</text>
<text x="20" y="56" font-size="9" fill="#151a21">但 ab ≥ 0 不够用：</text>
<text x="20" y="80" font-size="9" fill="#151a21">a = −1，b = −4 时 √4 = 2</text>
<text x="20" y="102" font-size="9" fill="#151a21">而 (a+b)/2 = −2.5</text>
<text x="20" y="120" font-size="8.8" fill="#b8402f">2 ≤ −2.5 不成立，方向反了</text>
</svg>
</div>
<div class="qac">
<p class="q">x + 4/x 在 x &lt; 0 时，最小值是多少？</p>
<p class="a">没有最小值，只有<b>最大值 −4</b>（x = −2 时取到）。一提负号：x + 4/x = −[(−x) + 4/(−x)] ≤ −2√4 = −4。先化正，再套公式。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="x 为负时结论翻转">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="20" y="30" font-size="9" fill="#151a21">x &lt; 0：两项都是负数</text>
<text x="20" y="54" font-size="9" fill="#151a21">提负号后两项变正</text>
<text x="20" y="78" font-size="9" fill="#151a21">−(t + 4/t) ≤ −4</text>
<text x="20" y="102" font-size="9" fill="#2f8a5b">最大值 −4，在 x = −2 处</text>
<text x="20" y="120" font-size="8.8" fill="#b8402f">没有最小值</text>
</svg>
</div>
</div>
<p class="gx-note">六问其实是一件事：<b>一正二定三相等</b>决定公式能不能用，<b>和定求积最大、积定求和最小</b>决定求的是哪个方向，<b>等号取不到就没有最值</b>决定你写的那个数算不算数。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 由 a + b ≥ 2√(ab) 得，a + b 的最小值是 2√(ab)。</p>
<p class="er-v">✓ 当 ab 为定值时，a + b ≥ 2√(ab) 才给出最小值 2√(ab)。</p>
<p class="er-w">错在哪：二定没验。ab 不是常数时，右边跟着 a、b 一起变，压不住，这句话等于没说。</p>
</div>
<div class="er">
<p class="er-x">✗ 因为 x &gt; 0，所以 x + 4/x ≥ 2√4 = 4，最小值是 4。</p>
<p class="er-v">✓ x + 4/x ≥ 2√(x·4/x) = 4，当且仅当 x = 2 时等号成立，故最小值为 4。</p>
<p class="er-w">错在哪：三相等没落地。不写「当且仅当 x = 2」，4 只是下界；阅卷时这一句单独给分。</p>
</div>
<div class="er">
<p class="er-x">✗ 已知 a + b = 10，求 ab 的最小值。</p>
<p class="er-v">✓ 和定求积最大：a + b = 10 时 ab ≤ 25，最大值为 25，在 a = b = 5 时取到。</p>
<p class="er-w">错在哪：方向反了。和是定值时积只能求最大，求「积的最小值」答案会滑到 0（端点趋近），根本不是最值点。</p>
</div>
<div class="er">
<p class="er-x">✗ 由基本不等式得 a + b ≥ √(2ab)。</p>
<p class="er-v">✓ a + b ≥ 2√(ab)（a，b &gt; 0），当且仅当 a = b 时等号成立。</p>
<p class="er-w">错在哪：把根号外的 2 挪进了根号。2√(ab) 与 √(2ab) 差一个 √2 倍，代 a = b = 1 立刻看出 2 ≠ √2。</p>
</div>
<div class="er">
<p class="er-x">✗ 对任意实数 a、b，都有 a + b ≥ 2√(ab)。</p>
<p class="er-v">✓ 只有 a &gt; 0 且 b &gt; 0 时，a + b ≥ 2√(ab) 才成立。</p>
<p class="er-w">错在哪：一正。a、b 异号时 √(ab) 无意义；同为负时左边为负、右边为正，不等号反向。</p>
</div>
<div class="er">
<p class="er-x">✗ x ≥ 3 时，x + 4/x ≥ 4，所以最小值是 4。</p>
<p class="er-v">✓ 等号要 x = 2，不在 x ≥ 3 内；由单调性得最小值 3 + 4/3 = 13/3。</p>
<p class="er-w">错在哪：等号取不到就没有最值。区间端点卡住等号时，必须换成单调性求值。</p>
</div>
<div class="er">
<p class="er-x">✗ 把 x + 4/x 拆成 x + 1/x + 3/x，三项直接用公式相加。</p>
<p class="er-v">✓ 拆项后重新验等号：需 x = 1/x = 3/x，无解，说明这个拆法取不到等号，不能用。</p>
<p class="er-w">错在哪：拆项后不再验等号。凑定值时怎么拆都可以试，但拆完必须回头解一次「各项相等」。</p>
</div>
</div>

  var W = { vb: "0 0 880 470", left: { x: 16, y: 16, w: 424, h: 438 }, right: { x: 456, y: 16, w: 408, h: 438 },
    seg: { x0: 56, y: 140, px: 34 }, rect: { x: 70, y: 400, px: 13 },
    g: { ox: 520, oy: 404, px: 32, py: 5.6, ax: 846, ay: 84 }, fs: { t: 10.5, l: 9.6, s: 9 } };
  var N = { vb: "0 0 360 700", left: { x: 8, y: 8, w: 344, h: 300 }, right: { x: 8, y: 320, w: 344, h: 372 },
    seg: { x0: 34, y: 120, px: 27 }, rect: { x: 44, y: 256, px: 9 },
    g: { ox: 58, oy: 660, px: 28, py: 12, ax: 346, ay: 344 }, fs: { t: 9.6, l: 9, s: 8.4 } };
  var L = W, G = null, A = 1;

  /* 纯函数：a → 其余三个量。render() 与 __model.cases 共用 */
  function calc(v) { var b = 10 - v, prod = v * b; return { a: v, b: b, prod: prod, gap: 25 - prod }; }

  function pts(C) {
    var out = [], g = C.g, a;
    for (a = 0; a < 10.001; a += 0.25) out.push((g.ox + a * g.px).toFixed(1) + "," + (g.oy - a * (10 - a) * g.py).toFixed(1));
    return out.join(" ");
  }

  function draw() {
    var C = G, gA = $("gxA"), gB = $("gxB"), s = calc(A), g = C.g, sp = C.seg, r = C.rect, i, x;
    var peakY = g.oy - 25 * g.py, px = g.ox + s.a * g.px, py = g.oy - s.prod * g.py, right = s.a > 6.5;
    var xa = sp.x0 + s.a * sp.px, xe = sp.x0 + 10 * sp.px, w = s.a * r.px, h = s.b * r.px;
    gA.textContent = ""; gB.textContent = "";
    el("rect", { x: C.left.x, y: C.left.y, width: C.left.w, height: C.left.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    tx(gA, C.left.x + 20, C.left.y + 30, "矩形：长 a、宽 b，a + b = 10", "#5a6472", "start", C.fs.t, 700);
    tx(gA, C.left.x + 20, C.left.y + 52, "周长固定为 20，面积就是积 ab", "#8a94a3", "start", C.fs.s, 400);
    el("line", { x1: sp.x0, y1: sp.y, x2: xe, y2: sp.y, stroke: "#c9d4e0", "stroke-width": 8, "stroke-linecap": "round" }, gA);
    el("line", { x1: sp.x0, y1: sp.y, x2: xa, y2: sp.y, stroke: "#2563eb", "stroke-width": 8, "stroke-linecap": "round" }, gA);
    el("line", { x1: xa, y1: sp.y - 14, x2: xa, y2: sp.y + 14, stroke: "#151a21", "stroke-width": 1.4 }, gA);
    tx(gA, (sp.x0 + xa) / 2, sp.y - 8, "a = " + s.a.toFixed(1), "#2563eb", "middle", C.fs.l, 700);
    tx(gA, (xa + xe) / 2, sp.y + 20, "b = " + s.b.toFixed(1), "#b8791f", "middle", C.fs.l, 700);
    el("rect", { x: r.x, y: r.y - h, width: w, height: h, fill: "#eaf2ff", stroke: "#2563eb", "stroke-width": 1.4 }, gA);
    tx(gA, r.x, r.y + 22, "面积 ab = " + s.prod.toFixed(2), "#2563eb", "start", C.fs.l, 700);
    tx(gA, r.x, r.y + 40, "与最大值 25 相差 " + s.gap.toFixed(2), "#8a94a3", "start", C.fs.s, 400);

    el("rect", { x: C.right.x, y: C.right.y, width: C.right.w, height: C.right.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    tx(gB, C.right.x + 20, C.right.y + 30, "积 ab 随 a 的变化", "#5a6472", "start", C.fs.t, 700);
    el("line", { x1: g.ox, y1: g.oy, x2: g.ax, y2: g.oy, stroke: "#5a6472", "stroke-width": 1.3 }, gB);
    el("polygon", { points: (g.ax - 9) + "," + (g.oy - 4) + " " + (g.ax + 1) + "," + g.oy + " " + (g.ax - 9) + "," + (g.oy + 4), fill: "#5a6472" }, gB);
    el("line", { x1: g.ox, y1: g.oy + 16, x2: g.ox, y2: g.ay, stroke: "#5a6472", "stroke-width": 1.3 }, gB);
    el("polygon", { points: (g.ox - 4) + "," + (g.ay + 9) + " " + g.ox + "," + (g.ay - 1) + " " + (g.ox + 4) + "," + (g.ay + 9), fill: "#5a6472" }, gB);
    var ticks = [2, 5, 8];
    for (i = 0; i < ticks.length; i++) {
      x = g.ox + ticks[i] * g.px;
      el("line", { x1: x, y1: g.oy - 5, x2: x, y2: g.oy + 5, stroke: "#5a6472", "stroke-width": 1.2 }, gB);
      tx(gB, x, g.oy + 18, String(ticks[i]), "#3a3a35", "middle", C.fs.s, 400);
    }
    el("line", { x1: g.ox - 5, y1: peakY, x2: g.ox + 5, y2: peakY, stroke: "#5a6472", "stroke-width": 1.2 }, gB);
    tx(gB, g.ox - 8, peakY + 4, "25", "#b8402f", "end", C.fs.s, 400);
    el("line", { x1: g.ox + 5 * g.px, y1: peakY, x2: g.ox + 5 * g.px, y2: g.oy, stroke: "#b8791f", "stroke-width": 1, "stroke-dasharray": "4 3" }, gB);
    el("line", { x1: g.ox, y1: peakY, x2: g.ox + 5 * g.px, y2: peakY, stroke: "#b8791f", "stroke-width": 1, "stroke-dasharray": "4 3" }, gB);
    el("polyline", { points: pts(C), fill: "none", stroke: "#2563eb", "stroke-width": 2 }, gB);
    if (s.gap > 0.001) {
      el("line", { x1: px, y1: py, x2: px, y2: peakY, stroke: "#b8402f", "stroke-width": 1.4, "stroke-dasharray": "3 3" }, gB);
      tx(gB, px + (right ? -8 : 8), (py + peakY) / 2 + 3, "差 " + s.gap.toFixed(2), "#b8402f", right ? "end" : "start", C.fs.s, 700);
    }
    el("circle", { cx: px, cy: py, r: 5, fill: "#b8402f", stroke: "#ffffff", "stroke-width": 1.5 }, gB);
    tx(gB, px + (right ? -10 : 10), py - 8, "ab = " + s.prod.toFixed(2), "#151a21", right ? "end" : "start", C.fs.l, 700);
    tx(gB, g.ox + 10, g.ay + 22, "a = b = 5 时 ab 取到最大 25", "#b8791f", "start", C.fs.s, 700);
    tx(gB, g.ax - 6, g.oy + 22, "a", "#5a6472", "end", C.fs.s, 400);
    tx(gB, g.ox + 8, g.ay + 8, "ab", "#5a6472", "start", C.fs.s, 400);
  }

  function render() {
    if (!G) { L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N; G = geom(); stage.setAttribute("viewBox", L.vb); }
    var s = calc(A), st, col, bg, sn;
    $("gxVa").textContent = s.a.toFixed(1);
    $("gxVb").textContent = s.b.toFixed(1);
    $("gxVc").textContent = s.prod.toFixed(2);
    if (Math.abs(s.gap) < 0.001) { st = "等号成立"; col = "#2f8a5b"; bg = "#e6f6ee"; sn = "a = b，积取到最大 25"; }
    else { st = "没取到最大值"; col = "#b8791f"; bg = "#fdf3e0"; sn = "差 25 − ab = " + s.gap.toFixed(2); }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    draw();
  }

  function geom() { return L; }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    G = null;
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  var ap = AutoPilot.create({
    mount: stage, follow: $("gxSl"),
    loop: [{ t: 0, v: 1 }, { t: 1.2, v: 1 }, { t: 4, v: 5 }, { t: 6.5, v: 5 }, { t: 9, v: 9 }, { t: 11.5, v: 1 }, { t: 13.5, v: 1 }],
    keys: [1, 3, 5, 9], value: A, min: 0.5, max: 9.5, step: 0.5, idle: 5000,
    onChange: function (v) { A = v; render(); }, onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc, cases: [
    { v: 1, eq: { b: 9, prod: 9 } }, { v: 5, eq: { b: 5, prod: 25 } }, { v: 9, eq: { b: 1, prod: 9 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
