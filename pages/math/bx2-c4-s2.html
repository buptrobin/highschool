<p class="gx-claim">用样本估计总体，先分清三个口径：<b>直方图纵轴是频率/组距</b>，<b>中位数不是平均数</b>，<b>方差越小越稳定</b>。</p>
<div class="gx-meta">
<span><i></i>人教A版必修第二册 第九章第二节</span>
<span><i></i>高一 · 必修第二册</span>
<span><i></i>阅读 12 分钟</span>
<span><i></i>含 1 个互动模型</span>
</div>
<p class="gx-lede">这一节把「一堆数据」压缩成几个数：百分位数、平均数、中位数、众数、方差、标准差，再用样本的这些数字去估计总体。最容易错的一件事，是看见直方图就把纵轴读成频率——纵轴其实是「频率/组距」，面积才是频率。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 百分位数<span class="q-src">人教A版必修第二册 · 第九章第二节</span></p>
<p class="q-b">一般地，一组数据的第 p 百分位数是这样一个值，它使得这组数据中至少有 p% 的数据小于或等于这个值，且至少有 (100−p)% 的数据大于或等于这个值。</p>
<p class="q-n">→ 翻成人话：这句话同时包含<b>两个条件</b>：① 至少有 p% 的数据 ≤ 这个值；② 至少有 (100−p)% 的数据 ≥ 这个值。两个都成立，才配叫「第 p 百分位数」。取 p=50，就是中位数，它只由数据的位置决定，不由平均数决定。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 方差与标准差<span class="q-src">人教A版必修第二册 · 第九章第二节</span></p>
<p class="q-b">一组数据的方差 s²=(1/n)Σ(xᵢ−x̄)²，标准差 s=√(s²)。</p>
<p class="q-n">→ 翻成人话：方差先看<b>每个数与平均数的差</b>，平方后求平均；平方是为了让正负偏差不互相抵消。所以 s²≥0，s≥0；s 与原数据同单位，s² 的单位是原单位的平方。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 频率分布直方图<span class="q-src">人教A版必修第二册 · 第九章第二节</span></p>
<p class="q-b">在频率分布直方图中，每个小矩形的面积等于相应区间的频率。</p>
<p class="q-n">→ 翻成人话：纵轴不是「频率」，而是「<b>频率/组距</b>」；小矩形的高 × 组距才是频率。所有小矩形的面积之和为 1，所以频率分布直方图看的是<b>面积</b>，不是高。组距不同时，尤其不能直接比高。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>统计量</th><th>定义 / 算法</th><th>最容易错成</th></tr></thead>
<tbody>
<tr><td>第 p 百分位数</td><td>至少有 p% 的数据 ≤ 它，且至少有 (100−p)% 的数据 ≥ 它</td><td>把「p%」当成排名第 p 名</td></tr>
<tr class="key"><td>中位数</td><td>第 50 百分位数；奇数个取正中间，偶数个取中间两数的平均</td><td>直接用平均数代替中位数</td></tr>
<tr><td>众数</td><td>出现次数最多的数据，可以不唯一；直方图中常用最高矩形底边中点估计</td><td>把最高矩形的高当成众数</td></tr>
<tr><td>平均数</td><td><span class="gx-fml">x̄=(1/n)Σxᵢ</span>，每个数据都参与运算</td><td>认为平均数不受极端值影响</td></tr>
<tr><td>方差 / 标准差</td><td><span class="gx-fml">s²=(1/n)Σ(xᵢ−x̄)²，s=√(s²)</span></td><td>认为方差越大越稳定</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">背法：先问「这个数由位置定，还是由每个数参与运算定？」中位数、众数看位置，平均数、方差每个数都参与。极端值只能拖动后一类。</p>
</section>

<p class="ex-t">例题 · 极端值改变后的三个统计量<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">某组数据为 8,9,9,10,10,10,11,11,12。把其中的 12 改成 21 后，平均数、中位数、方差分别怎么变？若有变化，写出变化后的值。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题：只改一个数，先看总和</p>
<p class="s-b">原数据共 9 个，总和是 90。把 12 改成 21，只有一项增加 9，所以新总和是 99；数据个数仍是 9。</p>
<p class="s-k">用到：平均数的分子是总和，分母是数据个数。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 平均数：总和变了，个数没变</p>
<p class="s-b">原平均数 <span class="gx-fml">x̄=90/9=10</span>；新平均数 <span class="gx-fml">x̄'=99/9=11</span>。平均数增加 1，被极端值 21 拉大了。</p>
<p class="s-k">用到：平均数的定义；每个数据都参与运算。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 中位数：只看排序后的位置</p>
<p class="s-b">原数据排序后是 8,9,9,10,<b>10</b>,10,11,11,12，第 5 个数是 10。把 12 改成 21 后，第 5 个数仍是 10，所以中位数不变。</p>
<p class="s-k">用到：中位数是第 50 百分位数，由位置决定，不是平均数。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 方差：换平均数重新算偏差</p>
<p class="s-b">原方差 <span class="gx-fml">s²=(4+1+1+0+0+0+1+1+4)/9=12/9=4/3</span>。新数据对 11 的偏差是 −3,−2,−2,−1,−1,−1,0,0,10，平方和为 120，所以 <span class="gx-fml">s'²=120/9=40/3≈13.3</span>。</p>
<p class="s-k">用到：方差公式；分母是 n，不是 n−1。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收口：三个结论分开写</p>
<p class="s-b">平均数由 10 变为 11，增加 1；中位数仍为 10，不变；方差由 4/3 增大到 40/3，约 13.3，数据更分散。标准差由 <span class="gx-fml">2√3/3≈1.15</span> 增大到 <span class="gx-fml">2√30/3≈3.65</span>。</p>
<p class="s-k">用到：方差越小越稳定；方差变大说明离散程度变大。</p>
</li>

  var L = W, A = 0;

  function calc(v) {
    var d = [8, 9, 9, 10, 10, 10, 11, 11, 12 + v], n = d.length, sum = 0, i;
    for (i = 0; i < n; i++) sum += d[i];
    var mean = sum / n, ss = 0;
    for (i = 0; i < n; i++) ss += (d[i] - mean) * (d[i] - mean);
    return { mean: mean, median: 10, sd: Math.sqrt(ss / n), variance: ss / n, d: v };
  }

  function line(g, x1, y1, x2, y2, c, w, dash) {
    var a = { x1: x1, y1: y1, x2: x2, y2: y2, stroke: c, "stroke-width": w || 1.2 };
    if (dash) a["stroke-dasharray"] = dash;
    el("line", a, g);
  }
  function dot(g, x, y, r, c) { el("circle", { cx: x, cy: y, r: r, fill: c }, g); }

  function drawLeft(gA, s) {
    var x = L.left.x, y = L.left.y, w = L.left.w, h = L.left.h;
    el("rect", { x: x, y: y, width: w, height: h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    tx(gA, x + 16, y + 26, "9 个数据：极端值在移动", "#5a6472", "start", 10.5, 700);
    tx(gA, x + 16, y + 46, "8, 9, 9, 10, 10, 10, 11, 11, 12+Δ", "#7a8694", "start", 9.2, 400);
    dot(gA, x + 18, y + 64, 4, "#b8791f");
    tx(gA, x + 28, y + 68, "x̄ " + s.mean.toFixed(2), "#b8791f", "start", 9.2, 700);
    dot(gA, x + 112, y + 64, 4, "#2f8a5b");
    tx(gA, x + 122, y + 68, "中位数 " + s.median.toFixed(2), "#2f8a5b", "start", 9.2, 700);

    var axisY = y + h - 52, x0 = x + 36, x1 = x + w - 22, lo = 6, hi = 32;
    function X(v) { return x0 + (v - lo) / (hi - lo) * (x1 - x0); }
    line(gA, x0, axisY, x1, axisY, "#7a8694", 1.2);
    el("path", { d: "M" + (x1 - 7) + " " + (axisY - 4) + "l7 4-7 4z", fill: "#7a8694" }, gA);
    [6, 10, 14, 18, 22, 26, 30].forEach(function (v) {
      line(gA, X(v), axisY - 3, X(v), axisY + 3, "#7a8694", 1);
      tx(gA, X(v), axisY + 15, String(v), "#7a8694", "middle", 8.2, 400);
    });
    tx(gA, x1, axisY + 32, "数据值", "#7a8694", "end", 8.2, 400);

    var top = y + 84;
    line(gA, X(s.median), top, X(s.median), axisY - 14, "#2f8a5b", 2, "5 4");
    line(gA, X(s.mean), top, X(s.mean), axisY - 14, "#b8791f", 1.7);
    tx(gA, X(s.mean), top - 5, "x̄", "#b8791f", "middle", 9, 700);
    tx(gA, X(s.median), top + 10, "M", "#2f8a5b", "middle", 9, 700);

    var vals = [8, 9, 9, 10, 10, 10, 11, 11, 12 + s.d], cnt = {}, order = [];
    vals.forEach(function (v) { if (cnt[v] === undefined) { cnt[v] = 0; order.push(v); } cnt[v]++; });
    order.forEach(function (v) {
      for (var k = 0; k < cnt[v]; k++) {
        var cy = axisY - 18 - k * 12;
        dot(gA, X(v), cy, 5, v > 15 ? "#b8402f" : "#2563eb");
        if (v > 15 && k === cnt[v] - 1) {
          tx(gA, X(v), cy - 9, "极端值", "#b8402f", X(v) > x1 - 38 ? "end" : "middle", 8.4, 700);
        }
      }
    });
    // 中位数在轴上再标一次，强调“位置不动”
    dot(gA, X(10), axisY, 4, "#2f8a5b");
    tx(gA, X(10), axisY - 4, "第 5 个", "#2f8a5b", "middle", 7.8, 700);
  }

  function drawRight(gB, s) {
    var x = L.right.x, y = L.right.y, w = L.right.w, h = L.right.h;
    el("rect", { x: x, y: y, width: w, height: h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    tx(gB, x + 16, y + 26, "谁被极端值拉走？", "#5a6472", "start", 10.5, 700);
    tx(gB, x + 16, y + 45, "同一把尺子：看统计量离开 10 多远", "#7a8694", "start", 8.8, 400);

    function meter(label, val, yy, lo, hi, col, fmt) {
      var tx0 = x + 18, tx1 = x + w - 18, tw = tx1 - tx0;
      tx(gB, x + 16, yy, label, "#3a3a35", "start", 9.6, 700);
      tx(gB, x + w - 16, yy, fmt, col, "end", 9.6, 700);
      el("rect", { x: tx0, y: yy + 10, width: tw, height: 8, rx: 4, fill: "#eef2f6" }, gB);
      var baseX = tx0 + (10 - lo) / (hi - lo) * tw;
      var valX = tx0 + (val - lo) / (hi - lo) * tw;
      if (Math.abs(valX - baseX) > 0.5) {
        el("rect", { x: Math.min(baseX, valX), y: yy + 10, width: Math.abs(valX - baseX), height: 8, rx: 4, fill: col }, gB);
      }
      line(gB, baseX, yy + 6, baseX, yy + 22, "#8792a0", 1);
      dot(gB, valX, yy + 14, 5, col);
    }
    meter("平均数 x̄", s.mean, y + 80, 8, 13, "#b8791f", s.mean.toFixed(2));
    meter("中位数 M", s.median, y + 147, 8, 13, "#2f8a5b", s.median.toFixed(2));
    meter("标准差 s", s.sd, y + 214, 0, 7, "#2563eb", s.sd.toFixed(3));

    var sy = y + h - 62;
    el("rect", { x: x + 16, y: sy, width: w - 32, height: 46, rx: 7, fill: "#f8fbfd", stroke: "#dbe7ef" }, gB);
    tx(gB, x + 26, sy + 18, "均值 +" + (s.mean - 10).toFixed(1) + "，中位数 +" + (s.median - 10).toFixed(1), "#3a3a35", "start", 8.8, 700);
    tx(gB, x + 26, sy + 35, "标准差 " + s.sd.toFixed(3) + "：尾部越长，s 越大", "#5a6472", "start", 8.4, 400);
  }

  function draw() {
    var s = calc(A), gA = $("gxA"), gB = $("gxB");
    gA.textContent = ""; gB.textContent = "";
    drawLeft(gA, s);
    drawRight(gB, s);
  }

  function render() {
    var s = calc(A), st, col, bg, sn, lb = document.querySelector(".gx-board .bar .lb");
    if (lb) lb.textContent = "偏移 Δ = " + A;
    $("gxVa").textContent = s.mean.toFixed(2);
    $("gxVb").textContent = s.median.toFixed(2);
    $("gxVc").textContent = s.sd.toFixed(3);
    if (A === 0) { st = "对称"; sn = "均值=中位数"; col = "#2563eb"; bg = "#e8f0fe"; }
    else if (A <= 9) { st = "轻微右偏"; sn = "均值开始大于中位数"; col = "#b8791f"; bg = "#fdf3e0"; }
    else { st = "严重右偏"; sn = "均值被极端值拖走"; col = "#b8402f"; bg = "#fbeae7"; }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    draw();
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 0 }, { t: 1.2, v: 0 }, { t: 4, v: 9 }, { t: 6.5, v: 9 }, { t: 9, v: 18 }, { t: 11.5, v: 18 }, { t: 13, v: 0 }],
    keys: [0, 9, 18],
    value: A, min: 0, max: 18, step: 1,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc, cases: [
    { v: 0, eq: { mean: 10, median: 10, sd: 1.155 } },
    { v: 9, eq: { mean: 11, median: 10, sd: 3.651 } },
    { v: 18, eq: { mean: 12, median: 10, sd: 6.429 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
</body>
</html>
