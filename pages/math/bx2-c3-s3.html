<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 柱体、锥体、台体的体积<span class="q-src">人教A版必修第二册 · 第八章第三节</span></p>
<p class="q-b">棱柱的体积 <span class="gx-fml">V = Sh</span>；棱锥的体积 <span class="gx-fml">V = (1/3)Sh</span>；棱台的体积 <span class="gx-fml">V = (1/3)h(S + √(SS′) + S′)</span>，其中 S、S′ 分别为上、下底面的面积，h 为高。</p>
<p class="q-n">→ 翻成人话：三个公式共用一个骨架「底面积 × 高」，差别只在系数。它由<b>三个条件</b>组成：① S、S′ 必须是与高垂直的底面面积，不是侧面面积；② h 是两个底面之间的距离，斜棱柱的侧棱长不是 h；③ 锥体的 1/3 不能丢，丢了答案正好放大三倍。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 球的表面积与体积<span class="q-src">人教A版必修第二册 · 第八章第三节</span></p>
<p class="q-b">球的体积 <span class="gx-fml">V = (4/3)πR³</span>，球的表面积 <span class="gx-fml">S = 4πR²</span>，其中 R 为球的半径。</p>
<p class="q-n">→ 翻成人话：两个公式都只由半径 R 决定，看着短，错得最多。三个条件：① 公式里的 R 是半径，给直径要先除以 2；② 表面积系数是 4，等于大圆面积 πR² 的四倍，写成 2πR² 就少了一半；③ 体积里是 R³，所以 R 变 2 倍体积变 8 倍，不是 2 倍。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 圆柱、圆锥的侧面积<span class="q-src">人教A版必修第二册 · 第八章第三节</span></p>
<p class="q-b">圆柱的侧面积 <span class="gx-fml">S = 2πrl</span>，圆锥的侧面积 <span class="gx-fml">S = πrl</span>，其中 r 为底面半径，l 为母线长。</p>
<p class="q-n">→ 翻成人话：侧面积是「把侧面剪开摊平」以后量出来的面积。三个条件：① 圆柱摊成长方形，长是底面周长 2πr、宽是母线 l；② 圆锥摊成扇形，半径 l、弧长 2πr，按扇形面积算出来正好 πrl；③ 侧面积不含底面，题目问「表面积」时必须再加上底面圆的面积。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>公式</th><th>成立要满足的条件</th><th>缺了会怎样</th></tr></thead>
<tbody>
<tr><td>V = Sh（柱体）</td><td>S 是与高垂直的底面积，h 是两底面距离</td><td>拿斜棱柱的侧棱当高，体积算大</td></tr>
<tr class="key"><td>V = (1/3)Sh（锥体）</td><td>与同底等高的柱体相比才恰好是 1/3</td><td>漏掉 1/3，答案放大三倍</td></tr>
<tr><td>V = (1/3)h(S+√(SS′)+S′)（台体）</td><td>棱台、圆台通用；S=0 退化成锥，S=S′ 退化成柱</td><td>以为只管圆台，棱台不敢套</td></tr>
<tr><td>S = 4πR²（球）</td><td>R 是半径；球只有一个面，没有底面</td><td>写成 2πR²，表面积少一半</td></tr>
<tr><td>S表 = S侧 + 2S底（柱）</td><td>表面积＝全部面的面积之和</td><td>只加侧面，少两个底面</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">记忆口径只有一个字：<b>看顶面收成什么</b>。顶面不出头 → V=Sh；收到一个点（锥）→ 乘 1/3；收成一块面（台）→ 乘 1/3 并且把两个底面积连同 √(SS′) 一起算。整张表只高亮锥体那一行，因为它是唯一「系数不显眼却扣分最狠」的。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 已知球的表面积求体积<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">一个球的表面积是 36π，求它的体积。<br>（陷阱点：36π 是「表面积」，不是体积；解出来的 R 要说明取正根。）</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题定式</p>
<p class="s-b">已知 S、求 V，两个公式里只有 R 是公共的，所以路径唯一：先用 4πR² 把 R 解出来，再代进 (4/3)πR³。</p>
<p class="s-k">用到：球的表面积 S = 4πR²、体积 V = (4/3)πR³。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 解出半径 R</p>
<p class="s-b">由 4πR² = 36π，两边同除 4π 得 R² = 9；因为 R 是长度，取 R = 3。这里除的是 4π，不是 2π，也不是 4——系数写错，这一步就废了。</p>
<p class="s-k">用到：球的表面积公式；R > 0 舍去负根。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 代入体积公式</p>
<p class="s-b">V = (4/3)π × 3³ = (4/3)π × 27 = 36π。3³ 先算，再乘 (4/3)，最后乘 π，不要跳步。</p>
<p class="s-k">用到：V = (4/3)πR³；系数 4/3 不能漏。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 检查口径与单位</p>
<p class="s-b">36π 是体积，单位必须是立方单位；如果题目给的是直径 6，要先折成 R = 3 再代。答案写成「36π 立方单位」，不能只写 36π。</p>
<p class="s-k">用到：表面积用平方单位、体积用立方单位，两者不可比大小。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 变式一句话</p>
<p class="s-b">若把条件改成「表面积变为原来的 4 倍」，则 R 变为 2 倍（因为 S 里是 R²），体积变为 8 倍（因为 V 里是 R³）。这类比例题不用求 R。</p>
<p class="s-k">用到：S ∝ R²、V ∝ R³。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">解：设球的半径为 R。<br>① 由球的表面积公式 <span class="gx-fml">S = 4πR²</span>，得 4πR² = 36π，所以 R² = 9；又 R &gt; 0，故 R = 3。<br>② 由球的体积公式 <span class="gx-fml">V = (4/3)πR³</span>，得 V = (4/3)π × 3³ = 36π。<br>答：这个球的体积是 36π 立方单位。<br>易错对照：写成 2πR² = 36π 会得 R² = 18，R 不是整数，答案必错；漏掉 (4/3) 得 27π；把 36π 直接当体积答，是没看清「表面积」三个字。</p>
</div>
</div>
</section>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「柱体是 V=Sh，那锥体不也是底面积乘高吗？」</p>
<p class="a">不是。同底等高的锥体体积只有柱体的 <b>1/3</b>，所以 V = (1/3)Sh。三个同样的锥才能装满一个柱，这是「锥体有 1/3」的来源。</p>

<div class="qac">
<p class="q">「侧面积和表面积到底差什么？」</p>
<p class="a">侧面积只算侧面（曲面或几个侧面），<b>表面积＝侧面积＋所有底面</b>。圆柱差 2 个底面圆，圆锥差 1 个。</p>

</div>
<div class="qac">
<p class="q">「球和它外切的等底等高圆柱，体积比是多少？」</p>
<p class="a">恒为 <b>2 ∶ 3</b>，与半径无关。算 V = (4/3)πR³ 除以 V柱 = πR²·2R，正好得 2/3，可以拿来自检球体积公式记没记错。</p>

<p class="q">「台体公式那么长，什么时候能不用它？」</p>
<p class="a">两个端点会自动退化：<b>S′ = S 时变柱体 V = Sh</b>，<b>S′ = 0 时变锥体 V = (1/3)Sh</b>。所以台体公式不用背特例，代进去自己就退化了。</p>

<p class="q">「组合体的表面积为什么不能把两块直接加起来？」</p>
<p class="a">因为接面粘上以后<b>不在外表面上了</b>，两块各算了一次，就多算了两遍。做法：拆成基本体，逐个列朝外的面，接面划掉。</p>

<p class="q">「半径变成原来的 2 倍，体积为什么是 8 倍不是 2 倍？」</p>
<p class="a">因为 V 里是 <b>R³</b>：(4/3)π(2R)³ = 8 × (4/3)πR³。同理表面积是 <b>R²</b>，变 2 倍半径只变 4 倍。记「体积三次、面积二次」。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 圆锥的体积 V = Sh，底面积乘高就行。</p>
<p class="er-v">✓ 锥体的体积 V = (1/3)Sh。</p>
<p class="er-w">错在哪：锥体有 1/3，漏了答案正好放大三倍。柱体才是 V = Sh。</p>
</div>
<div class="er">
<p class="er-x">✗ 球的表面积 S = 2πR²。</p>
<p class="er-v">✓ 球的表面积 S = 4πR²，体积 V = (4/3)πR³。</p>
<p class="er-w">错在哪：2πR² 只是半球那层曲面的面积；球表面积是 4πR²，等于 4 个大圆，写成 2πR² 少一半。</p>
</div>
<div class="er">
<p class="er-x">✗ 圆柱的表面积就是 2πrl。</p>
<p class="er-v">✓ 圆柱的表面积 S = 2πrl + 2πr²，其中 2πrl 是侧面积。</p>
<p class="er-w">错在哪：表面积含底面、侧面积不含。2πrl 只是侧面，还要补上下两个底面。</p>
</div>
<div class="er">
<p class="er-x">✗ 半径变为原来的 2 倍，体积也变为 2 倍。</p>
<p class="er-v">✓ V = (4/3)πR³，R 变为 2R 时 V 变为 8V。</p>
<p class="er-w">错在哪：体积里是 R³，2³ = 8；表面积里是 R²，才变 4 倍。倍数要跟着指数走。</p>
</div>
<div class="er">
<p class="er-x">✗ V = (1/3)h(S+√(SS′)+S′) 是圆台专用公式，棱台不能套。</p>
<p class="er-v">✓ 台体体积公式对棱台和圆台都成立。</p>
<p class="er-w">错在哪：公式只认「两个平行底面 + 高」，与底面是圆还是多边形无关；S、S′ 是面积，不是半径或边长。</p>
</div>
<div class="er">
<p class="er-x">✗ 圆锥的侧面积 S = πr²。</p>
<p class="er-v">✓ 圆锥的侧面积 S = πrl，l 是母线长；πr² 是底面圆的面积。</p>
<p class="er-w">错在哪：把母线 l 当成了半径 r。只有在 l = r 时两式才碰巧相等，而圆锥里母线一定比半径长。</p>
</div>
<div class="er">
<p class="er-x">✗ 组合体的表面积等于两部分表面积相加。</p>
<p class="er-v">✓ 表面积＝各外表面面积之和，被粘住的接面要划掉。</p>
<p class="er-w">错在哪：接面不在外表面上了，两块各算一次就重复算了两遍；体积才可以直接相加。</p>
</div>
</div>
</section>

  var W = { vb: "0 0 880 470", left: { x: 16, y: 16, w: 424, h: 438 }, right: { x: 456, y: 16, w: 408, h: 438 } };
  var N = { vb: "0 0 360 700", left: { x: 8, y: 8, w: 344, h: 300 }, right: { x: 8, y: 320, w: 344, h: 372 } };
  var L = W, A = 1, VMAX = 523.599;

  /* 纯函数：半径 R → 体积、表面积、与等底等高圆柱的体积比。render() 和 __model.cases 都用它 */
  function calc(R) {
    var V = 4 / 3 * Math.PI * R * R * R;
    var S = 4 * Math.PI * R * R;
    return { V: V, S: S, k: V / (2 * Math.PI * R * R * R) };
  }

  function draw() {
    var gA = $("gxA"), gB = $("gxB"), s = calc(A), i;
    gA.textContent = ""; gB.textContent = "";
    var P = L.left, Q = L.right;
    el("rect", { x: P.x, y: P.y, width: P.w, height: P.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    tx(gA, P.x + 18, P.y + 28, "球与它的等底等高圆柱（半径 R、高 2R）", "#5a6472", "start", 10.5, 700);

    var wide = (L === W), sc = wide ? 16 : 12, base = wide ? 26 : 20;
    var r = base + (A - 1) * sc, ry = r * 0.22;
    var cx = P.x + P.w / 2, cy = P.y + P.h / 2 + 6;

    el("line", { x1: cx - r, y1: cy - r, x2: cx - r, y2: cy + r, stroke: "#c69a4e", "stroke-dasharray": "5 4" }, gA);
    el("line", { x1: cx + r, y1: cy - r, x2: cx + r, y2: cy + r, stroke: "#c69a4e", "stroke-dasharray": "5 4" }, gA);
    el("ellipse", { cx: cx, cy: cy - r, rx: r, ry: ry, fill: "none", stroke: "#c69a4e", "stroke-dasharray": "5 4" }, gA);
    el("ellipse", { cx: cx, cy: cy + r, rx: r, ry: ry, fill: "none", stroke: "#c69a4e", "stroke-dasharray": "5 4" }, gA);
    el("circle", { cx: cx, cy: cy, r: r, fill: "#e8f2fb", stroke: "#2563eb", "stroke-width": 1.4 }, gA);
    el("ellipse", { cx: cx, cy: cy, rx: r, ry: r * 0.3, fill: "none", stroke: "#6a9ec9", "stroke-dasharray": "3 3" }, gA);
    el("line", { x1: cx, y1: cy, x2: cx + r, y2: cy, stroke: "#b8402f", "stroke-width": 1.2 }, gA);
    tx(gA, cx + r / 2, cy - 7, "R", "#b8402f", "middle", 10, 700);
    tx(gA, cx + r + 7, cy + 3, "2R", "#b8791f", "start", 9.5, 400);
    tx(gA, cx, cy - r - 12, "R = " + A.toFixed(1), "#2563eb", "middle", 9.5, 700);
    tx(gA, cx, cy + r + 36, "V球 ∶ V柱 = 2 ∶ 3", "#b8791f", "middle", 9.5, 400);

    el("rect", { x: Q.x, y: Q.y, width: Q.w, height: Q.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    tx(gB, Q.x + 18, Q.y + 28, "V 与 S 的数值（同一条刻度）", "#5a6472", "start", 10.5, 700);

    var barX = Q.x + 18, barW = Q.w - 90;
    var rows = [{ k: "V（体积）", v: s.V, y: Q.y + 62, c: "#2563eb", l: Q.y + 56 },
                { k: "S（表面积）", v: s.S, y: Q.y + 110, c: "#2f8a5b", l: Q.y + 104 }];
    for (i = 0; i < rows.length; i++) {
      var w = Math.max(3, rows[i].v / VMAX * barW);
      tx(gB, barX, rows[i].l, rows[i].k, "#7b8794", "start", 9.5, 400);
      tx(gB, Q.x + Q.w - 16, rows[i].l, rows[i].v.toFixed(1), "#151a21", "end", 10, 700);
      el("rect", { x: barX, y: rows[i].y, width: w, height: 22, rx: 4, fill: rows[i].c, "fill-opacity": "0.8" }, gB);
    }
    tx(gB, barX, Q.y + 152, "刻度 0 → " + VMAX.toFixed(0) + "，两根条可以直接比长短", "#7b8794", "start", 9, 400);
    tx(gB, barX, Q.y + 178, "体积比 k = V ÷ V柱 = " + s.k.toFixed(2) + "（恒为 2/3）", "#b8791f", "start", 9.5, 700);
    tx(gB, barX, Q.y + 200, A < 3 ? "V 的数值 < S 的数值" : (A > 3 ? "V 的数值 > S 的数值" : "113.1 = 113.1，只是数值巧合"), A < 3 ? "#2563eb" : (A > 3 ? "#2f8a5b" : "#b8402f"), "start", 9.5, 700);
    tx(gB, barX, Q.y + 228, "V = (4/3)πR³ = " + s.V.toFixed(1), "#151a21", "start", 9.5, 400);
    tx(gB, barX, Q.y + 248, "S = 4πR² = " + s.S.toFixed(1), "#151a21", "start", 9.5, 400);
  }

  function render() {
    var s = calc(A), st, col, bg, sn;
    $("gxVa").textContent = A.toFixed(1);
    $("gxVb").textContent = s.V.toFixed(1);
    $("gxVc").textContent = s.S.toFixed(1);
    if (A < 3) { st = "V 小于 S"; col = "#2563eb"; bg = "#e8f2fb"; sn = "R³ 还追不上 R²"; }
    else if (A > 3) { st = "V 反超 S"; col = "#2f8a5b"; bg = "#e6f6ee"; sn = "R³ 涨得比 R² 快"; }
    else { st = "数值相等"; col = "#b8402f"; bg = "#fbeae7"; sn = "113.1 撞上了，但单位不同"; }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    draw();
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 1 }, { t: 1.2, v: 1 }, { t: 4, v: 3 }, { t: 6.5, v: 3 }, { t: 9, v: 5 }, { t: 11.5, v: 5 }, { t: 13, v: 1 }],
    keys: [1, 2, 3, 5],
    value: A, min: 1, max: 5, step: 0.5,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc, cases: [
    { v: 1, eq: { V: 4.189, S: 12.566, k: 0.6667 } },
    { v: 3, eq: { V: 113.097, S: 113.097, k: 0.6667 } },
    { v: 5, eq: { V: 523.599, S: 314.159, k: 0.6667 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
