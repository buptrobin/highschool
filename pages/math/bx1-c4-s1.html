<p class="gx-claim">一句话说清本节最该记住的判断：<b>分数指数幂的底数必须为正</b> + <b>ⁿ√(aⁿ) 偶次等于 |a|</b>。</p>
<div class="gx-meta">
<span><i></i>人教A版必修第一册 第四章第 1 节</span>
<span><i></i>高一 · 必修第一册</span>
<span><i></i>阅读 12 分钟</span>
<span><i></i>含 1 个互动模型</span>
</div>
<p class="gx-lede">指数是整章的入口：后面指数函数、对数、幂函数全挂在「a^x 的运算」上。这一节真正要过的关只有三道——把根式写成 a^(m/n) 时底数必须为正、负指数是倒数（0 的负指数没有意义）、ⁿ√(aⁿ) 在 n 为偶数时等于 |a| 而不是 a。三条里错一条，后面所有化简题都会连锁失分。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · n 次方根<span class="q-src">人教A版必修第一册 · 第四章第 1 节</span></p>
<p class="q-b">若 xⁿ=a（n&gt;1，n∈N*），则 x 叫做 a 的 n 次方根；正数的偶次方根有两个，负数没有偶次方根。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个条件</b>组成——① n 是大于 1 的正整数；② 偶次方根要给出正负两个；③ 负数没有偶次方根。少第 ③ 条，就会写 √(−4) = −2 这种根本不存在的数。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 分数指数幂<span class="q-src">人教A版必修第一册 · 第四章第 1 节</span></p>
<p class="q-b">a^(m/n) = ⁿ√(a^m)（a&gt;0，m，n∈N*，n&gt;1）。</p>
<p class="q-n">→ 翻成人话：<b>三个条件</b>一个都不能丢——底数 a 必须大于 0、指数分子 m 与根指数 n 都是正整数、n 还要大于 1。底数为负时这条互化不成立；0 的负指数幂同样没有意义。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 指数运算法则<span class="q-src">人教A版必修第一册 · 第四章第 1 节</span></p>
<p class="q-b">同底数幂相乘：a^m·a^n = a^(m+n)；幂的乘方：(a^m)^n = a^(mn)。</p>
<p class="q-n">→ 翻成人话：两条法则<b>底数都不变</b>，区别只在指数「做加法」还是「做乘法」。把 a^m·a^n 写成 a^(mn) 是最常见的一处错，也是本节唯一需要靠对比记忆的地方。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>条件</th><th>不满足时会发生什么</th></tr></thead>
<tbody>
<tr><td>a&gt;0（分数指数幂）</td><td>a=−4 时 a^(1/2)=√(−4) 不是实数，互化公式失效</td></tr>
<tr><td>n&gt;1 且 n∈N*</td><td>n=1 时 ⁿ√ 退化成 a 本身，这一层规定没有内容</td></tr>
<tr><td>偶次方根取正负两个</td><td>只写一个就丢解：16 的四次方根是 ±2，而 √16 只表示算术根 2</td></tr>
<tr class="key"><td>a≠0（零指数与负指数）</td><td>0^(−1)=1/0 没有意义；0^(−2)、0⁰ 同样无意义——负指数是倒数，分母不能为 0</td></tr>
<tr><td>同底数（乘法与除法法则）</td><td>底数不同不能合并指数：2³·3² 不能写成 6⁵</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只高亮 1 行：负指数是倒数，所以底数一旦为 0 就整条失效。答题卡上写「因为 a≠0，所以 a^(−n)=1/aⁿ」，比只写结果稳。</p>
</section>

<section class="gx-sec" id="c">
<h2><span class="sn">03</span>自己拖一下<span class="bdg bdg-must">核心</span></h2>
<p class="gx-h2s">拖「指数 x」，看 2^x 与 2^(−x) 两个数怎么互相反着走，乘积始终钉在 1。</p>

<figure class="gx-fig">
<div class="fig-cap">
<span class="fig-no">互动 1</span><span class="fig-t">指数 x → 2^x、2^(−x) 与它们的乘积</span>
<span class="bdg bdg-key">B 级</span>
<span class="gx-ap" id="gxAp"><i></i><span id="gxApTxt">自动演示中</span></span>
</div>
<p class="fig-s">盯住 ② 2^x 与 ③ 2^(−x)：x 增大时一个变大、一个变小，乘积那一栏永远是 1。x=0 是分界线——往右 2^x&gt;1，往左 0&lt;2^x&lt;1，两侧的数互为倒数。</p>
<div class="gx-board">
<svg id="gxStage" viewBox="0 0 880 470" tabindex="0" role="application" aria-label="指数互动模型">
<g id="gxA"></g>
<g id="gxB"></g>
</svg>
<div class="bar">
<span class="lb">指数 x</span>
<input type="range" id="gxSl" min="-3" max="3" step="0.5" value="0" aria-label="指数 x">
<p class="hint">键盘 ← → 也能调；直接点画布，会跳到下一个关键值。</p>
</div>
</div>
<div class="stats" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:8px">
<div class="st"><div class="k">① 指数 x</div><div class="v" id="gxVa">0</div><div class="s">−3 ~ 3，步长 0.5</div></div>
<div class="st"><div class="k">② 2^x</div><div class="v" id="gxVb">1.000</div><div class="s">底数固定为 2</div></div>
<div class="st"><div class="k">③ 2^(−x)</div><div class="v" id="gxVc">1.000</div><div class="s">负指数是倒数</div></div>
<div class="st state" id="gxStBox"><div class="k">④ 状态判断</div><div class="v" id="gxVs">—</div><div class="s" id="gxVsn">—</div></div>
</div>
<p class="gx-take">x=0 是分界：此时 2⁰=1，两侧的 2^x 与 2^(−x) 互为倒数，乘积恒为 1——这就是同底数幂相乘 a^m·a^n=a^(m+n) 在 m+n=0 时的样子。</p>
<p class="gx-note">模型口径：2^x 与 2^(−x) 都按实数计算，显示保留三位小数；乘积一栏只做校验用，断言值为 1。x 只取 0.5 的整数倍，所以图中曲线是采样点连线，不是严格光滑曲线。</p>
</figure>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 分数指数幂与负指数幂的化简<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">计算 8^(2/3) + (1/2)^(−2)。（两个陷阱：8^(2/3) 不是 8²÷3；(1/2)^(−2) 不是 −(1/2)²。）</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题：先统一底数</p>
<p class="s-b">8=2³，(1/2)=2⁻¹，两项都能化成以 2 为底的幂，再各自用运算法则。</p>
<p class="s-k">用到：底数相同才能合并指数；负指数是倒数。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 化 8^(2/3)</p>
<p class="s-b">8^(2/3)=(2³)^(2/3)=2^(3×2/3)=2²=4。括号外的指数相乘，这是幂的乘方。</p>
<p class="s-k">用到：(a^m)^n=a^(mn)，此时 a=2&gt;0，条件满足。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 化 (1/2)^(−2)</p>
<p class="s-b">(1/2)^(−2)=1/(1/2)²=1/(1/4)=4。负指数先把幂翻到分母，再平方。</p>
<p class="s-k">用到：a^(−n)=1/aⁿ（a≠0）；(1/2)≠0，式子有意义。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 相加</p>
<p class="s-b">两项都是 4，4+4=8。两个幂底数相同但指数不同，不能合并成一个幂，只能先各算各的再相加。</p>
<p class="s-k">用到：只有同底数幂相乘才能加指数，加法没有合并法则。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 换条路验算</p>
<p class="s-b">(1/2)^(−2)=(2⁻¹)^(−2)=2^(−1×−2)=2²=4，与第 3 步一致；8^(2/3)=³√(8²)=³√64=4，与第 2 步一致。</p>
<p class="s-k">用到：a^(m/n)=ⁿ√(a^m)；两条路径同结果才算做对。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">解：8^(2/3)=(2³)^(2/3)=2²=4；　　　(1/2)^(−2)=1/(1/2)²=4；　　　所以 8^(2/3)+(1/2)^(−2)=4+4=8。<br>说明：负指数是倒数，底数 (1/2)≠0 时 (1/2)^(−2)=1/(1/2)²；若底数为 0，如 0^(−1)，则无意义，不能计算。</p>
</div>
</div>
</section>
<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「ⁿ√(aⁿ) 一定等于 a 吧？」</p>
<p class="a">不一定。<b>n 为偶数时 ⁿ√(aⁿ)=|a|</b>，n 为奇数时才等于 a。因为偶次方根的结果不能为负，而 a 可以是负数。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="按 n 的奇偶分类取绝对值">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="34" text-anchor="middle" font-size="9.5" font-weight="700" fill="#151a21">先看 n 的奇偶</text>
<text x="120" y="58" text-anchor="middle" font-size="9" fill="#3a3a35">n 奇：ⁿ√(aⁿ)=a</text>
<text x="120" y="76" text-anchor="middle" font-size="9" fill="#3a3a35">n 偶：ⁿ√(aⁿ)=|a|</text>
<text x="120" y="100" text-anchor="middle" font-size="9" fill="#b8402f">⁴√((−3)⁴)=3，不是 −3</text>
</svg>
</div>
<div class="qac">
<p class="q">「负指数是不是把负号提到前面？」</p>
<p class="a">不是。<b>负指数是倒数</b>：a^(−n)=1/aⁿ（a≠0）。负号进的是分母，不是整个式子的正负号，所以 a^(−n)≠−aⁿ。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="负指数化为倒数">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="48" text-anchor="middle" font-size="9.5" font-weight="700" fill="#151a21">a^(−n)=1/aⁿ（a≠0）</text>
<text x="120" y="70" text-anchor="middle" font-size="9" fill="#3a3a35">2⁻³=1/2³=1/8</text>
<text x="120" y="96" text-anchor="middle" font-size="9" fill="#b8402f">2⁻³ ≠ −8</text>
</svg>
</div>
<div class="qac">
<p class="q">「0 的负指数幂等于 0 吗？」</p>
<p class="a"><b>0 的负指数幂没有意义</b>。负指数是倒数，0^(−1)=1/0 分母为 0，式子不存在；0 只有正指数幂等于 0。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="0 的负指数无意义">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#fdf2f0" stroke="#e8b7ae"/>
<text x="120" y="44" text-anchor="middle" font-size="10" font-weight="700" fill="#b8402f">0^(−1)=1/0</text>
<text x="120" y="68" text-anchor="middle" font-size="9" fill="#3a3a35">分母为 0 ⇒ 无意义</text>
<text x="120" y="94" text-anchor="middle" font-size="9" fill="#5a6472">0 的正指数幂才等于 0</text>
</svg>
</div>
<div class="qac">
<p class="q">「分数指数幂的底数为什么非要正数？」</p>
<p class="a">因为 a^(m/n)=ⁿ√(a^m) 要求对任意 m、n 都有<b>唯一确定的实数</b>。a&lt;0 时偶次根开不出来，法则就会自相矛盾，所以课本统一规定 a&gt;0。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="分数指数幂要求底数为正">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="40" text-anchor="middle" font-size="9.5" font-weight="700" fill="#151a21">a^(m/n)=ⁿ√(a^m)</text>
<text x="120" y="62" text-anchor="middle" font-size="9" fill="#3a3a35">前提：a&gt;0，m,n∈N*，n&gt;1</text>
<text x="120" y="86" text-anchor="middle" font-size="9" fill="#b8402f">a&lt;0 遇偶次根：不是实数</text>
</svg>
</div>
<div class="qac">
<p class="q">「a^m·a^n 和 (a^m)^n 差在哪？」</p>
<p class="a">指数<b>相加</b>还是<b>相乘</b>。两个幂并排相乘是 a^(m+n)；(a^m)^n 是幂再乘方，指数相乘得 a^(mn)。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="两条法则的指数加法与乘法">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="38" text-anchor="middle" font-size="9.5" font-weight="700" fill="#2f8a5b">a^m·a^n = a^(m+n)</text>
<text x="120" y="56" text-anchor="middle" font-size="8.8" fill="#5a6472">并排相乘 → 指数相加</text>
<text x="120" y="82" text-anchor="middle" font-size="9.5" font-weight="700" fill="#b8791f">(a^m)^n = a^(mn)</text>
<text x="120" y="100" text-anchor="middle" font-size="8.8" fill="#5a6472">括号外有指数 → 指数相乘</text>
</svg>
</div>
<div class="qac">
<p class="q">「2^(1/2) 不就是 1 吗？」</p>
<p class="a">不是。2^(1/2)=√2≈1.414，是<b>无理数</b>，比 1 大、比 2 小。分数指数幂只是根式的另一种写法，不改变数值。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="根号 2 在数轴上的位置">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="34" text-anchor="middle" font-size="9.5" font-weight="700" fill="#151a21">2^(1/2)=√2≈1.414</text>
<line x1="34" y1="86" x2="206" y2="86" stroke="#8a94a3" stroke-width="1.2"/>
<text x="34" y="104" text-anchor="middle" font-size="8.6" fill="#5a6472">1</text>
<text x="120" y="104" text-anchor="middle" font-size="8.6" fill="#5a6472">1.5</text>
<text x="120" y="74" text-anchor="middle" font-size="8.6" fill="#b8402f">√2 在这里</text>
</svg>
</div>
</div>
<p class="gx-note">六问其实是同一件事：先把<b>底数与根指数</b>的条件摆出来，再动指数。条件不满足就没有式子，谈不上算错还是算对。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ ⁿ√(aⁿ)=a，对任何 n 都成立</p>
<p class="er-v">✓ n 为偶数时 ⁿ√(aⁿ)=|a|；n 为奇数时才等于 a</p>
<p class="er-w">错在哪：偶次方根的结果不能为负，⁴√((−3)⁴)=3，直接写 −3 就把符号弄丢了。</p>
</div>
<div class="er">
<p class="er-x">✗ a^(−n)=−aⁿ，负号提到前面</p>
<p class="er-v">✓ a^(−n)=1/aⁿ（a≠0），负指数是倒数</p>
<p class="er-w">错在哪：负号进的是分母。2⁻³=1/8，不是 −8；一个小于 1 的正数，不可能变成负数。</p>
</div>
<div class="er">
<p class="er-x">✗ 0^(−1)=0，因为底数是 0</p>
<p class="er-v">✓ 0 的负指数幂没有意义（负指数是倒数，分母不能为 0）</p>
<p class="er-w">错在哪：0^(−1)=1/0 根本不存在，写成 0 等于给一个不存在的式子硬塞了值。</p>
</div>
<div class="er">
<p class="er-x">✗ a^m·a^n=a^(mn)</p>
<p class="er-v">✓ a^m·a^n=a^(m+n)；(a^m)^n=a^(mn)</p>
<p class="er-w">错在哪：并排相乘用加法，括号外还有指数才用乘法，两条法则的适用对象不同。</p>
</div>
<div class="er">
<p class="er-x">✗ 分数指数幂的底数取负数也能算，比如 (−8)^(2/3)=4</p>
<p class="er-v">✓ a^(m/n)=ⁿ√(a^m) 的前提是 a&gt;0、n&gt;1</p>
<p class="er-w">错在哪：负底数配偶次根在实数范围内没有定义，换个 m、n 就会自相矛盾，所以课本统一要求 a&gt;0。</p>
</div>
<div class="er">
<p class="er-x">✗ 2^(1/2)=1，指数是分数就约掉了</p>
<p class="er-v">✓ 2^(1/2)=√2≈1.414，是无理数</p>
<p class="er-w">错在哪：分数指数幂只是根式的另一种写法，2^(1/2) 表示「平方得 2 的正数」，不是 2 除以 2。</p>
</div>
<div class="er">
<p class="er-x">✗ 8^(2/3)=8²÷3=64/3</p>
<p class="er-v">✓ 8^(2/3)=(2³)^(2/3)=2²=4</p>
<p class="er-w">错在哪：分母 3 是根指数不是除数。正确读法是「先 3 次方根、再平方」，顺序换过来 ³√(8²)=³√64=4 也一样。</p>
</div>
</div>
</section>

      yy2 = Math.pow(2, -xx);
      if (yy2 > 8.5) break;
      d2 += (first2 ? "M" : "L") + G.X(xx).toFixed(1) + " " + G.Y(yy2).toFixed(1) + " ";
      first2 = false;
    }
    el("path", { d: d2, fill: "none", stroke: "#2f8a5b", "stroke-width": 1.5, "stroke-dasharray": "5 4" }, gA);

    /* 当前 x 上的两个点：2^x 与 2^(−x) 互为倒数 */
    var pxx = G.X(A), py1v = G.Y(Math.pow(2, A)), py2v = G.Y(Math.pow(2, -A));
    el("line", { x1: pxx, y1: G.py1, x2: pxx, y2: Math.min(py1v, py2v), stroke: "#dbe7ef", "stroke-dasharray": "3 3" }, gA);
    el("circle", { cx: pxx, cy: py1v, r: 4.5, fill: "#2563eb" }, gA);
    el("circle", { cx: pxx, cy: py2v, r: 4.5, fill: "#2f8a5b" }, gA);
    var anchor = A > 1.8 ? "end" : "start", dx = A > 1.8 ? -8 : 8;
    tx(gA, pxx + dx, py1v - 7, "2^x", "#2563eb", anchor, 9, 700);
    tx(gA, pxx + dx, py2v + 13, "2^(−x)", "#2f8a5b", anchor, 9, 700);
    tx(gA, pxx, G.py1 + 30, "x=" + fmt(A), "#b8791f", "middle", 9, 700);

    /* 右面板：两条对数刻度条 + 乘积恒为 1 */
    var s = calc(A);
    el("rect", { x: r.x, y: r.y, width: r.w, height: r.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    tx(gB, r.x + 18, r.y + 26, "同一个 x，两个互为倒数的幂", "#5a6472", "start", 10.5, 700);
    var bx = r.x + 20, bw = r.w - 40;
    var rows = [
      { t: "2^x", v: s.pw, c: "#2563eb", y: r.y + 64 },
      { t: "2^(−x)", v: s.inv, c: "#2f8a5b", y: r.y + 132 }
    ];
    for (var i = 0; i < rows.length; i++) {
      var row = rows[i];
      tx(gB, bx, row.y, row.t, row.c, "start", 10.5, 700);
      tx(gB, r.x + r.w - 20, row.y, fmt3(row.v), "#151a21", "end", 11.5, 700);
      var t = (Math.log2(row.v) + 3.5) / 7;
      t = Math.max(0.015, Math.min(1, t));
      el("rect", { x: bx, y: row.y + 8, width: bw, height: 8, rx: 4, fill: "#eef2f6" }, gB);
      el("rect", { x: bx, y: row.y + 8, width: Math.max(4, bw * t), height: 8, rx: 4, fill: row.c }, gB);
    }
    el("rect", { x: bx, y: r.y + 176, width: bw, height: 52, rx: 8, fill: "#e6f6ee", stroke: "#b8e6d0" }, gB);
    tx(gB, bx + bw / 2, r.y + 198, "2^x · 2^(−x) = 1", "#2f8a5b", "middle", 13, 700);
    tx(gB, bx + bw / 2, r.y + 216, "同底数幂相乘，指数相加得 0", "#3a3a35", "middle", 8.8, 400);
    tx(gB, bx, r.y + 254, "x=0 时两者都等于 1，是分界线", "#5a6472", "start", 9, 400);
    tx(gB, bx, r.y + 274, "x>0：2^x>1；x<0：0<2^x<1", "#5a6472", "start", 9, 400);
  }

  function render() {
    if (!G) { L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N; G = geom(); stage.setAttribute("viewBox", L.vb); }
    var s = calc(A), st, col, bg, sn;
    $("gxVa").textContent = fmt(A);
    $("gxVb").textContent = fmt3(s.pw);
    $("gxVc").textContent = fmt3(s.inv);
    if (A > 0) { st = "2^x>1"; col = "#2563eb"; bg = "#e8f0fd"; sn = "x>0，指数为正，幂大于 1"; }
    else if (A === 0) { st = "2^x=1"; col = "#b8791f"; bg = "#fdf3e0"; sn = "两侧互为倒数，乘积恒为 1"; }
    else { st = "0<2^x<1"; col = "#2f8a5b"; bg = "#e6f6ee"; sn = "x<0，负指数是倒数，幂小于 1"; }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    draw();
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    stage.setAttribute("viewBox", L.vb);
    G = geom();
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: -3 }, { t: 1.2, v: -3 }, { t: 4, v: 0 }, { t: 6.5, v: 0 }, { t: 9, v: 1.5 }, { t: 11.5, v: 3 }, { t: 13.5, v: -3 }],
    keys: [-3, 0, 1.5, 3],
    value: A, min: -3, max: 3, step: 0.5,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc, cases: [
    { v: -1, eq: { pw: 0.5, inv: 2 } },
    { v: 0, eq: { pw: 1, inv: 1 } },
    { v: 3, eq: { pw: 8, inv: 0.125 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
</body>
