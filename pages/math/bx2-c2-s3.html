<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 复数的三角形式<span class="q-src">人教A版必修第二册 · 第七章第三节</span></p>
<p class="q-b">复数 z=a+bi 可以表示为 z=r(cosθ+isinθ)，其中 r=|z|，θ 是以 x 轴的非负半轴为始边、向量 OZ 为终边的角，叫做复数 z 的辐角。</p>
<p class="q-n">→ 翻成人话：这条式子由<b>三个条件</b>组成。① r 是模，必须 r=|z|=√(a²+b²) ≥ 0，并且同时满足 a=r cosθ、b=r sinθ；② 括号里是<b>同一个角 θ</b> 的余弦和正弦，中间必须是「+」；③ θ 只决定方向，相差 2kπ 的角表示同一个点，所以<b>辐角不唯一</b>，通常取 0 ≤ θ &lt; 2π 的那个主值。三个条件少一个，写出来的就不是三角形式。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 乘法法则<span class="q-src">人教A版必修第二册 · 第七章第三节</span></p>
<p class="q-b">两个复数相乘，积的模等于各复数的模的积，积的辐角等于各复数的辐角的和。</p>
<p class="q-n">→ 注意两个动词：模「<b>乘</b>」、角「<b>加</b>」。只有写成三角形式，这条结论才这么干净；回到 a+bi 去硬展开，只能得到一堆实部虚部的乘积。若两个辐角的和达到或超过 360°，要先减去 360° 再写答案。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 除法法则<span class="q-src">人教A版必修第二册 · 第七章第三节</span></p>
<p class="q-b">两个复数相除，商的模等于各复数的模的商，商的辐角等于各复数的辐角的差。</p>
<p class="q-n">→ 除法是乘法的逆运算，所以角从「加」变「<b>减</b>」，模从「乘」变「<b>除</b>」。前提是除数 z₂ ≠ 0：模为 0 不能作除数，商的辐角也就无从谈起。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>条件</th><th>写错 / 缺了会怎样</th></tr></thead>
<tbody>
<tr><td>r=|z|=√(a²+b²) ≥ 0</td><td>把模写成 a²+b²，长度直接错掉一个量级，后面全塌</td></tr>
<tr><td>同一个角 θ 的 cos 与 sin</td><td>写成 r(cosθ+isinφ) 就不是某个复数的标准写法，两个角各说各话</td></tr>
<tr class="key"><td>括号里中间是「+」号</td><td>写成 cosθ−isinθ，等价于辐角取 −θ，方向关于 x 轴翻了个身</td></tr>
<tr><td>辐角取同一个 θ（不唯一）</td><td>只写 θ=30° 会漏掉 390°、−330°；解方程 zⁿ=1 时会把根漏掉</td></tr>
<tr><td>除法要求 z₂≠0</td><td>模为 0 不能作除数；商的辐角等于辐角之差也就没有意义</td></tr>
<tr><td>乘除是角「加减」，不是角「乘除」</td><td>把 30°×60° 当辐角，答案从 90° 变成 1800°，整题作废</td></tr>
</tbody>
</table>
</div>
<p class="gx-note"><b>背法</b>：模走乘除、角走加减。三角形式里那个加号是「cos 与 i sin」之间的连接符，不是两个角之间的运算——两个角之间永远是加或减。</p>
</section>

<section class="gx-sec" id="b">
<h2><span class="sn">02</span>拆开看</h2>
<p class="gx-h2s">四张图：各讲一件事，按「是什么 → 怎么变 → 怎么用」排。</p>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 三角形式求积<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">计算 <span class="gx-fml">2(cos30°+isin30°) · 3(cos60°+isin60°)</span>。<br>(1) 写出积的模与辐角；(2) 把结果化成 a+bi 的形式。<br>陷阱：辐角那一栏，很容易顺手写成 30°×60°。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 读出每个因数的 r 与 θ</p>
<p class="s-b">z₁ 的模是括号外的 2、辐角是括号里的 30°；z₂ 的模是 3、辐角是 60°。<b>r 永远在括号外</b>，括号里的 cos 与 sin 共用同一个 θ，别把 2 当实部。</p>
<p class="s-k">用到：三角形式 z=r(cosθ+isinθ) 中 r 与 θ 的位置</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 模相乘</p>
<p class="s-b">|z₁z₂| = 2 × 3 = <b>6</b>。模是长度，两个长度叠在一起是「乘」，不是「加」；写 2+3=5 的地方，通常是把法则记反了。</p>
<p class="s-k">用到：积的模等于各复数模的积</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 辐角相加</p>
<p class="s-b">arg(z₁z₂) = 30° + 60° = <b>90°</b>。角与角之间只做加、减，不做乘、除；90° 已经在 [0°,360°) 内，不必再减 360°。</p>
<p class="s-k">用到：积的辐角等于各复数辐角的和</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 合成三角形式</p>
<p class="s-b">积 = 6(cos90° + i sin90°)，<b>括号里中间是加号</b>。若写成 6(cos90° − i sin90°)，表示的是辐角 −90° 的另一个数，方向完全相反。</p>
<p class="s-k">用到：三角形式的结构（cos 与 i sin 之间必须是「+」）</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 化成代数形式</p>
<p class="s-b">cos90°=0、sin90°=1，所以 6(0 + i·1) = <b>6i</b>。检查一下：6i 的模是 6、在虚轴正半轴上，辐角 90°，和上一步对得上。</p>
<p class="s-k">用到：a = r cosθ、b = r sinθ</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">① 积的模：|z₁z₂| = 2 × 3 = 6（模相乘）；<br>② 积的辐角：arg(z₁z₂) = 30° + 60° = 90°（角相加，在 [0°,360°) 内，不必再减 360°）；<br>③ 三角形式：6(cos90° + i sin90°)；<br>④ 代数形式：cos90°=0、sin90°=1，故原式 = 6i。<br>结论：两个复数相乘，<b>模相乘、辐角相加</b>。</p>
</div>
</div>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「同一个 z，辐角到底是 30° 还是 390°？」</p>
<p class="a">都是。辐角是 <b>θ+2kπ（k∈Z）的一整族</b>，因为转整圈还回到原来的点；答题默认写 <b>0°≤θ&lt;360°</b> 的主值，题目给了范围就按范围取。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="辐角 30 度与 390 度指向同一点">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<circle cx="86" cy="58" r="34" fill="none" stroke="#b8d4f0" stroke-width="1.2"/>
<line x1="86" y1="58" x2="115.4" y2="41" stroke="#2563eb" stroke-width="1.6"/>
<circle cx="115.4" cy="41" r="3" fill="#2563eb"/>
<path d="M 104 58 A 18 18 0 0 0 101.6 49" fill="none" stroke="#b8791f" stroke-width="1.4"/>
<text x="124" y="79" font-size="9" fill="#b8791f">30°</text>
<text x="120" y="110" font-size="9" fill="#5a6472" text-anchor="middle">390° = 30° + 360°：同一点</text>
</svg>
</div>
<div class="qac">
<p class="q">「三角形式能写成 cosθ − i sinθ 吗？」</p>
<p class="a">不能。<b>中间必须是「+」</b>：cosθ−isinθ = cos(−θ)+isin(−θ)，它表示辐角为 −θ 的<b>另一个</b>复数，方向关于 x 轴对称过去。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="辐角 θ 与 −θ 关于实轴对称">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<circle cx="86" cy="62" r="38" fill="none" stroke="#b8d4f0" stroke-width="1.2"/>
<line x1="86" y1="62" x2="115.1" y2="37.6" stroke="#2563eb" stroke-width="1.6"/>
<line x1="86" y1="62" x2="115.1" y2="86.4" stroke="#b8402f" stroke-width="1.6"/>
<circle cx="115.1" cy="37.6" r="3" fill="#2563eb"/>
<circle cx="115.1" cy="86.4" r="3" fill="#b8402f"/>
<text x="120" y="36" font-size="9" fill="#2563eb">θ</text>
<text x="120" y="93" font-size="9" fill="#b8402f">−θ</text>
<text x="120" y="116" font-size="9" fill="#5a6472" text-anchor="middle">cosθ − i sinθ 就是辐角 −θ</text>
</svg>
</div>
<div class="qac">
<p class="q">「两个复数相乘，为什么不把辐角也乘起来？」</p>
<p class="a">因为乘法在几何上是<b>旋转</b>：把 z₁ 逆时针转过 θ₂，转过的角当然是相加；伸缩才用乘。<b>角走加减、模走乘除</b>，两件事不能串。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="乘法：把 z1 逆时针转过 θ2">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<circle cx="84" cy="66" r="26" fill="none" stroke="#b8d4f0" stroke-width="1.1" stroke-dasharray="3 3"/>
<line x1="84" y1="66" x2="129.1" y2="49.6" stroke="#2563eb" stroke-width="1.8"/>
<line x1="84" y1="66" x2="100.4" y2="20.9" stroke="#b8791f" stroke-width="1.8"/>
<polygon points="129.1,49.6 123.4,54.4 121.6,49.5" fill="#2563eb"/>
<polygon points="100.4,20.9 100.4,28.4 95.6,26.6" fill="#b8791f"/>
<path d="M 112.2 55.7 A 30 30 0 0 0 94.3 37.8" fill="none" stroke="#b8791f" stroke-width="1.3"/>
<text x="114" y="32" font-size="9" fill="#b8791f">转 θ₂</text>
<text x="120" y="116" font-size="9" fill="#5a6472" text-anchor="middle">旋转用角，伸缩用模</text>
</svg>
</div>
<div class="qac">
<p class="q">「除法为什么是辐角相减？」</p>
<p class="a">除法是乘法的逆运算：若 w = z·z₂，则 arg w = arg z + arg z₂，反过来 <b>arg z = arg w − arg z₂</b>。所以商的方向是「差」。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="除法：商的方向是辐角相减">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<circle cx="84" cy="66" r="26" fill="none" stroke="#b8d4f0" stroke-width="1.1" stroke-dasharray="3 3"/>
<line x1="84" y1="66" x2="75.3" y2="16.8" stroke="#2563eb" stroke-width="1.8"/>
<line x1="84" y1="66" x2="112.9" y2="31.5" stroke="#b8791f" stroke-width="1.8"/>
<polygon points="75.3,16.8 79.1,23.2 73.9,24.2" fill="#2563eb"/>
<polygon points="112.9,31.5 110.4,38.6 106.4,35.2" fill="#b8791f"/>
<path d="M 103.3 43 A 30 30 0 0 0 78.8 36.5" fill="none" stroke="#b8791f" stroke-width="1.3"/>
<text x="116" y="48" font-size="9" fill="#b8791f">减 θ₂</text>
<text x="120" y="116" font-size="9" fill="#5a6472" text-anchor="middle">方向反着转，角就相减</text>
</svg>
</div>
<div class="qac">
<p class="q">「棣莫弗定理怎么用？」</p>
<p class="a">先化成<b>三角形式</b>，再套 (cosθ+isinθ)ⁿ = cos nθ + i sin nθ：模取 n 次方、辐角乘整数 n，最后把辐角对 360° 取余。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="棣莫弗定理：辐角变成 nθ">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<circle cx="86" cy="64" r="38" fill="none" stroke="#b8d4f0" stroke-width="1.2"/>
<line x1="86" y1="64" x2="118.9" y2="45" stroke="#2563eb" stroke-width="1.6"/>
<line x1="86" y1="64" x2="99" y2="28.3" stroke="#b8791f" stroke-width="1.6"/>
<circle cx="118.9" cy="45" r="3" fill="#2563eb"/>
<circle cx="99" cy="28.3" r="3" fill="#b8791f"/>
<path d="M 108.5 51 A 26 26 0 0 0 94.9 39.6" fill="none" stroke="#b8791f" stroke-width="1.3"/>
<text x="123" y="43" font-size="9" fill="#2563eb">θ</text>
<text x="104" y="25" font-size="9" fill="#b8791f">nθ</text>
<text x="120" y="116" font-size="9" fill="#5a6472" text-anchor="middle">模取 n 次方，辐角乘整数 n</text>
</svg>
</div>
<div class="qac">
<p class="q">「1 的立方根有几个？辐角各是多少？」</p>
<p class="a"><b>3 个</b>。由 z³=1 得 3θ = 0° + k·360°（k=0,1,2），所以 θ = 0°、120°、240°，它们把单位圆三等分。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="1 的三个立方根均分单位圆">

<p class="gx-note">这六问其实是同一件事：把复数看成「<b>长度 + 角度</b>」。乘法就是长度相乘、角度相加，除法反着来；「辐角不唯一」和「中间那个加号」，都是这条视角的副产品。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 辐角就是 30°，只有这一个值。</p>
<p class="er-v">✓ 辐角为 θ + 2kπ（k∈Z），通常取 0 ≤ θ &lt; 2π 的主值。</p>
<p class="er-w">错在哪：把一个代表当成了全部。解 zⁿ=1 这类题时，漏掉的正是 +2kπ 带来的其余根。</p>
</div>
<div class="er">
<p class="er-x">✗ z = r(cosθ − isinθ)。</p>
<p class="er-v">✓ z = r(cosθ + isinθ)，括号里中间是加号。</p>
<p class="er-w">错在哪：减号等价于把辐角改成 −θ，画出来是关于 x 轴对称的另一个点，不是原来的 z。</p>
</div>
<div class="er">
<p class="er-x">✗ 两个复数相乘，积的辐角等于辐角之积（30°×60°=1800°）。</p>
<p class="er-v">✓ 积的辐角等于各复数辐角的和（30°+60°=90°）。</p>
<p class="er-w">错在哪：乘法在几何上是旋转，转过的角要相加；角相乘没有任何几何对应，还会算出 1800° 这种荒谬的值。</p>
</div>
<div class="er">
<p class="er-x">✗ 两个复数相乘，积的模等于模的和（2+3=5）。</p>
<p class="er-v">✓ 积的模等于各复数模的积（2×3=6）。</p>
<p class="er-w">错在哪：模是长度，长度叠起来是相似放大（乘），不是并排相加。</p>
</div>
<div class="er">
<p class="er-x">✗ 30° + 330° = 360°，所以积的辐角写 360°。</p>
<p class="er-v">✓ 360° 与 0° 是同一个方向，主值写 0°。</p>
<p class="er-w">错在哪：主值范围是 0° ≤ θ &lt; 360°（左闭右开），端点 360° 必须减成 0°，否则和「辐角不唯一」自相矛盾。</p>
</div>
<div class="er">
<p class="er-x">✗ 模 |z| = a² + b²。</p>
<p class="er-v">✓ 模 |z| = √(a²+b²)。</p>
<p class="er-w">错在哪：a²+b² 是长度的平方（勾股定理），少开了一次方，r 会和 r² 混起来，后面模相乘全部错。</p>
</div>
<div class="er">
<p class="er-x">✗ 两个复数相除，商的辐角等于辐角之和。</p>
<p class="er-v">✓ 商的辐角等于各复数辐角的差。</p>
<p class="er-w">错在哪：除法是乘法的逆运算，方向反着转，角就从「加」变成「减」；模也从「乘」变成「除」。</p>
</div>
</div>

<script>
/* 互动脚本本体（由 build-page.mjs 包进 <script> 里，所以这里不要写 <script> 标签） */
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var GX = window.GX, el = GX.el, tx = GX.tx, $ = GX.$;
  var stage = $("gxStage");
  if (!stage || !window.AutoPilot) return;

  /* 两套坐标：宽屏 880×470，窄屏独立 360×700 */
  var W = { vb: "0 0 880 470", left: { x: 16, y: 16, w: 424, h: 438 }, right: { x: 456, y: 16, w: 408, h: 438 } };
  var N = { vb: "0 0 360 700", left: { x: 8, y: 8, w: 344, h: 300 }, right: { x: 8, y: 320, w: 344, h: 372 } };
  var L = W, A = 0;

  var R1 = 2, R2 = 3, TH1 = 30, MOD = R1 * R2;

  /* 纯函数：参数 → 数值。render() 和 __model.cases 都用它 */
  function calc(v) {
    var sum = TH1 + v;
    return { mod: MOD, arg: ((sum % 360) + 360) % 360, sum: sum };
  }

  function rad(d) { return d * Math.PI / 180; }
  function px(cx, cy, r, deg) { return [cx + r * Math.cos(rad(deg)), cy - r * Math.sin(rad(deg))]; }

  /* y 轴朝下 ⇒ 数学逆时针 = sweep-flag 0 */
  function arcPath(cx, cy, r, a0, a1) {
    if (a1 - a0 < 0.4) return "";
    var s = px(cx, cy, r, a0), e = px(cx, cy, r, a1);
    var large = (a1 - a0) > 180 ? 1 : 0;
    return "M " + GX.n1(s[0]) + " " + GX.n1(s[1]) + " A " + GX.n1(r) + " " + GX.n1(r) + " 0 " + large + " 0 " + GX.n1(e[0]) + " " + GX.n1(e[1]);
  }

  function arrow(g, x1, y1, x2, y2, col, w, size) {
    el("line", { x1: GX.n1(x1), y1: GX.n1(y1), x2: GX.n1(x2), y2: GX.n1(y2), stroke: col, "stroke-width": w, "stroke-linecap": "round" }, g);
    var ang = Math.atan2(y2 - y1, x2 - x1), k = size || 8, half = k * 0.45;
    var ux = Math.cos(ang), uy = Math.sin(ang);
    var bx = x2 - k * ux, by = y2 - k * uy;
    var p = [GX.n1(x2), GX.n1(y2), GX.n1(bx - half * uy), GX.n1(by + half * ux), GX.n1(bx + half * uy), GX.n1(by - half * ux)].join(" ");
    el("polygon", { points: p, fill: col }, g);
  }

  /* 中文按字数换行，返回写完后的 y */
  function wrap(parent, x, y, s, maxW, fs, col, lh, weight) {
    var per = Math.max(6, Math.floor(maxW / fs)), lines = [], cur = "";
    for (var i = 0; i < s.length; i++) { cur += s.charAt(i); if (cur.length >= per) { lines.push(cur); cur = ""; } }
    if (cur) lines.push(cur);
    for (var k = 0; k < lines.length; k++) tx(parent, x, y + k * (lh || 16), lines[k], col, "start", fs, weight || 400);
    return y + lines.length * (lh || 16);
  }

  function draw() {
    var gA = $("gxA"), gB = $("gxB");
    if (!gA || !gB) return;
    gA.textContent = ""; gB.textContent = "";
    var s = calc(A), narrow = (L === N);

    /* ---------- 左：复平面 ---------- */
    el("rect", { x: L.left.x, y: L.left.y, width: L.left.w, height: L.left.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    tx(gA, L.left.x + 18, L.left.y + 26, "复平面：模 × 模，辐角 + θ", "#5a6472", "start", 10.5, 700);

    var cx = L.left.x + L.left.w / 2;
    var cy = L.left.y + L.left.h / 2 + 8;
    var unit = (Math.min(L.left.w, L.left.h) / 2 - 42) / 6;
    var ax = unit * 6 + 22;

    arrow(gA, cx - ax, cy, cx + ax, cy, "#c3ccd6", 1.2, 7);
    arrow(gA, cx, cy + ax, cx, cy - ax, "#c3ccd6", 1.2, 7);
    tx(gA, cx + ax + 3, cy + 14, "x", "#8a94a3", "start", 10);
    tx(gA, cx + 5, cy - ax - 4, "y", "#8a94a3", "start", 10);

    /* 单位圆与 r=2、r=3 的参考圆 */
    el("circle", { cx: cx, cy: cy, r: GX.n1(unit), fill: "none", stroke: "#b8d4f0", "stroke-width": 1 }, gA);
    el("circle", { cx: cx, cy: cy, r: GX.n1(unit * 2), fill: "none", stroke: "#e2ecf7", "stroke-width": 0.9, "stroke-dasharray": "2 3" }, gA);
    el("circle", { cx: cx, cy: cy, r: GX.n1(unit * 3), fill: "none", stroke: "#e2ecf7", "stroke-width": 0.9, "stroke-dasharray": "2 3" }, gA);
    for (var t = 1; t <= 6; t++) {
      el("line", { x1: GX.n1(cx + unit * t), y1: GX.n1(cy - 3), x2: GX.n1(cx + unit * t), y2: GX.n1(cy + 3), stroke: "#c3ccd6", "stroke-width": 1 }, gA);
      el("line", { x1: GX.n1(cx - 3), y1: GX.n1(cy - unit * t), x2: GX.n1(cx + 3), y2: GX.n1(cy - unit * t), stroke: "#c3ccd6", "stroke-width": 1 }, gA);
    }

    /* 30° 弧（z₁ 的辐角） */
    var d30 = arcPath(cx, cy, unit * 1.15, 0, 30);
    if (d30) el("path", { d: d30, fill: "none", stroke: "#2563eb", "stroke-width": 1.3 }, gA);
    var l30 = px(cx, cy, unit * 1.15 + 15, 15);
    tx(gA, l30[0], l30[1] + 4, "30°", "#2563eb", "start", 9.2, 600, true);

    /* 加上 θ 的弧：从 30° 转到 30°+θ */
    if (A > 0.4) {
      var end = Math.min(s.sum, 360);
      var dth = arcPath(cx, cy, unit * 4.2, 30, end);
      if (dth) el("path", { d: dth, fill: "none", stroke: "#b8791f", "stroke-width": 1.9, "stroke-linecap": "round" }, gA);
      if (s.sum > 360) {
        var dth2 = arcPath(cx, cy, unit * 4.2, 0, s.arg);
        if (dth2) el("path", { d: dth2, fill: "none", stroke: "#b8791f", "stroke-width": 1.9, "stroke-dasharray": "5 3" }, gA);
      }
      var mid = Math.min(30 + (end - 30) / 2, 359);
      var pm = px(cx, cy, unit * 4.2 + 13, mid);
      tx(gA, pm[0], pm[1] + 4, "θ", "#b8791f", "middle", 9.6, 700, true);
    }

    /* 三个向量 */
    var p1 = px(cx, cy, unit * 2, 30), p2 = px(cx, cy, unit * 3, A), p3 = px(cx, cy, unit * 6, s.arg);
    arrow(gA, cx, cy, p1[0], p1[1], "#2563eb", 2, 8);
    arrow(gA, cx, cy, p2[0], p2[1], "#2f8a5b", 2, 8);
    arrow(gA, cx, cy, p3[0], p3[1], "#b8791f", 2.2, 9);

    tag(gA, cx, cy, unit * 2, 30, "z₁", "#2563eb");
    tag(gA, cx, cy, unit * 3, A, "z₂", "#2f8a5b");
    tag(gA, cx, cy, unit * 6, s.arg, "z₁z₂", "#b8791f");
    tx(gA, cx - 7, cy + 15, "O", "#8a94a3", "end", 9.5);

    /* ---------- 右：算式 ---------- */
    var R = L.right, pad = 18, xx = R.x + pad, maxW = R.w - pad * 2;
    el("rect", { x: R.x, y: R.y, width: R.w, height: R.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    tx(gB, xx, R.y + 26, "算一算：积的模与辐角", "#5a6472", "start", 10.5, 700);

    var y = R.y + 52;
    y = wrap(gB, xx, y, "z₁ = 2(cos30° + isin30°)", maxW, 9.6, "#3a3a35");
    y = wrap(gB, xx, y, "z₂ = 3(cos" + Math.round(A) + "° + isin" + Math.round(A) + "°)", maxW, 9.6, "#2f8a5b");
    y += 6;
    y = wrap(gB, xx, y, "模：2 × 3 = " + MOD + "（模相乘）", maxW, 9.6, "#3a3a35");
    y = wrap(gB, xx, y, "角：30° + " + Math.round(A) + "° = " + s.sum + "°", maxW, 9.6, "#3a3a35");
    if (s.sum >= 360) {
      y = wrap(gB, xx, y, "和 ≥ 360° ⇒ " + s.sum + "° − 360° = " + s.arg + "°", maxW, 9.6, "#b8402f", 16, 700);
    } else {
      y = wrap(gB, xx, y, "在 [0°,360°) 内，不用减", maxW, 9.6, "#5a6472");
    }
    y = wrap(gB, xx, y, "积 = 6(cos" + s.arg + "° + isin" + s.arg + "°)", maxW, 9.6, "#b8791f", 16, 700);

    /* 0–360° 表盘 */
    var ry = Math.max(y + 14, R.y + R.h * (narrow ? 0.55 : 0.56));
    if (ry > R.y + R.h - 96) ry = R.y + R.h - 96;
    var rx = R.x + pad, rw = R.w - pad * 2;
    el("line", { x1: rx, y1: GX.n1(ry), x2: GX.n1(rx + rw), y2: GX.n1(ry), stroke: "#e3e9ef", "stroke-width": 6, "stroke-linecap": "round" }, gB);
    for (var i = 0; i <= 4; i++) {
      var tx0 = rx + rw * i / 4;
      el("line", { x1: GX.n1(tx0), y1: GX.n1(ry - 7), x2: GX.n1(tx0), y2: GX.n1(ry + 7), stroke: "#c3ccd6", "stroke-width": 1 }, gB);
      tx(gB, tx0, ry + 20, i * 90 + "°", "#8a94a3", "middle", 9, 400);
    }
    el("line", { x1: rx, y1: GX.n1(ry - 4), x2: GX.n1(rx + rw), y2: GX.n1(ry - 4), stroke: "#b8791f", "stroke-width": 2, "stroke-linecap": "round", opacity: "0.25" }, gB);
    var mx = rx + rw * s.arg / 360;
    el("line", { x1: GX.n1(mx), y1: GX.n1(ry - 11), x2: GX.n1(mx), y2: GX.n1(ry + 11), stroke: "#b8791f", "stroke-width": 2.6 }, gB);
    tx(gB, GX.clamp(mx, rx + 18, rx + rw - 18), ry - 17, "积的辐角 " + s.arg + "°", "#b8791f", "middle", 9.2, 700);

    var ly = ry + 44;
    tx(gB, xx, ly, "● 蓝：z₁，固定 30°", "#2563eb", "start", 9.2);
    tx(gB, xx, ly + 15, "● 绿：z₂，辐角 = θ", "#2f8a5b", "start", 9.2);
    tx(gB, xx, ly + 30, "● 琥珀：积，辐角 = (30°+θ) 对 360° 取余", "#b8791f", "start", 9.2);
  }

  /* 向量末端标签：沿法线偏一点，避开箭头本身 */
  function tag(g, cx, cy, r, deg, text, col) {
    var p = px(cx, cy, r, deg);
    var ux = Math.cos(rad(deg)), uy = -Math.sin(rad(deg));
    var nx = -uy, ny = ux;
    if (ny > 0) { nx = -nx; ny = -ny; }
    tx(g, p[0] + nx * 12, p[1] + ny * 12 + 4, text, col, "middle", 9.6, 700, true);
  }

  function render() {
    var s = calc(A), st, col, bg, sn, a = Math.round(A);
    $("gxVa").textContent = a + "°";
    $("gxVb").textContent = String(s.mod);
    $("gxVc").textContent = s.arg + "°";
    if (s.sum >= 360) {
      st = s.arg === 0 ? "绕回实轴正半轴" : "绕过 360°，回到第一象限";
      col = "#b8791f"; bg = "#fdf3e0";
      sn = "30°+" + a + "°= " + s.sum + "°，减 360° 得 " + s.arg + "°";
    } else if (a === 0) {
      st = "与 z₁ 同向"; col = "#2563eb"; bg = "#eff5ff";
      sn = "θ=0°，z₂ 与 z₁ 重合";
    } else if (s.arg < 90) {
      st = "第一象限，继续转"; col = "#2f8a5b"; bg = "#e6f6ee";
      sn = "积的辐角 " + s.arg + "° 在 0°–90°";
    } else if (s.arg < 180) {
      st = "转到了第二象限"; col = "#2f8a5b"; bg = "#e6f6ee";
      sn = "积的辐角 " + s.arg + "° 在 90°–180°";
    } else if (s.arg < 270) {
      st = "转到了第三象限"; col = "#2f8a5b"; bg = "#e6f6ee";
      sn = "积的辐角 " + s.arg + "° 在 180°–270°";
    } else {
      st = "转到了第四象限"; col = "#2f8a5b"; bg = "#e6f6ee";
      sn = "积的辐角 " + s.arg + "° 在 270°–360°";
    }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    draw();
  }

    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 0 }, { t: 1.2, v: 0 }, { t: 4, v: 90 }, { t: 6.5, v: 90 }, { t: 9, v: 180 }, { t: 11.5, v: 330 }, { t: 13.5, v: 0 }],
    keys: [0, 90, 180, 330],
    value: A, min: 0, max: 360, step: 1,
    idle: 5000,
    /* 角度取整数度：拖动/自走的中间值不取整，会出现 359.99° 这种「差一点没绕回」的假状态 */
    onChange: function (v) { A = Math.round(v); render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc, cases: [
    { v: 0, eq: { mod: 6, arg: 30 } },
    { v: 90, eq: { mod: 6, arg: 120 } },
    { v: 180, eq: { mod: 6, arg: 210 } },
    { v: 330, eq: { mod: 6, arg: 0 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
