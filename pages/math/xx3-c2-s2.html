<p class="gx-lede">这一节把「随机事件」升级成「可以算的数」：先给每个试验结果配一个实数，得到随机变量 X；再把 X 的全部取值与对应概率列成两行表格，得到分布列。它是后面二项分布、超几何分布、均值与方差的统一入口——后面所有公式，本质都在读这张表。<br>最容易错的一件事：算完不检查「概率和是不是恰好 1」就往下做，等于带着漏掉的取值进考场。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句课本话，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 随机变量<span class="q-src">人教A版选择性必修第三册 · 第七章第2节</span></p>
<p class="q-b">一般地，对于随机试验的每一个可能的结果，都有一个确定的实数与之对应，这样的变量称为随机变量，常用字母 X、Y、ξ 表示。随机变量随着试验结果的变化而变化。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个条件</b>组成——① 试验结果是随机的、不确定的；② 每个结果都<b>唯一</b>对应一个实数；③ 这个数随结果变化。少掉②，写出来的只是一个随手起的代号，谈不上 P(X=xᵢ)。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 分布列<span class="q-src">人教A版选择性必修第三册 · 第七章第2节</span></p>
<p class="q-b">设离散型随机变量 X 的所有可能取值为 x₁, x₂, …, xₙ，X 取每一个值 xᵢ 的概率为 pᵢ（i=1,2,…,n），则称这张表为 X 的概率分布列，简称分布列。</p>
<p class="q-n">→ 关键词是两个：「<b>所有</b>可能取值」和「<b>每一个</b>」。漏一个取值，概率和永远凑不出 1；只写几个取值，那叫部分概率，不叫分布列。表格必须写成表，不能写成一句话。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 两条性质<span class="q-src">人教A版选择性必修第三册 · 第七章第2节</span></p>
<p class="q-b">离散型随机变量的分布列具有性质：① pᵢ ≥ 0（i=1,2,…,n）；② p₁ + p₂ + … + pₙ = 1。</p>
<p class="q-n">→ 这两条是<b>自检器</b>，不是装饰：算完先扫一眼有没有负数（概率不能为负），再把所有概率加起来。和不是 1，就说明取值漏了、重了，或某个概率算错——此时必须停下重查，不能硬着头皮写答案。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>分布列要满足的条件</th><th>具体写法</th><th>缺了会怎样</th></tr></thead>
<tbody>
<tr><td>取值列全</td><td>X 的所有可能取值 x₁, x₂, …, xₙ 一个不漏</td><td>漏一个 ⇒ 概率和 &lt; 1，整题作废</td></tr>
<tr><td>概率非负</td><td>每个 pᵢ ≥ 0，概率不能为负</td><td>出现负数 ⇒ 该取值或该概率算错</td></tr>
<tr class="key"><td>概率和恰为 1</td><td>p₁ + p₂ + … + pₙ = 1（恰好，不是约等于）</td><td>和 ≠ 1 ⇒ 必有漏算或重算，先停下查题</td></tr>
<tr><td>写成表格</td><td>上行放取值、下行放概率，逐列对齐</td><td>写成文字叙述 ⇒ 对应关系看不见，不得分</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只高亮 1 行：真正要盯死的是「和为 1」——它既是检验，也是最后一步。写分布列的固定顺序：<b>先列全取值 → 再逐个算概率 → 最后加一遍验证</b>。顺序颠倒，就容易一边算一边漏。</p>
</section>

<p class="gx-h2s">拖「成功概率 p」，看两点分布的分布列怎么整体倾斜，以及最后那个和为什么永远不动。</p>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 求分布列<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">袋中装有 3 个红球、2 个白球，从中任取 2 个球。设 X 为取到的红球个数，求 X 的分布列，并求 P(X≤1)。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 定 X，列全取值</p>
<p class="s-b">「任取 2 个」→ 红球个数最少 0 个（两个都是白球），最多 2 个（两个都是红球），中间还能取 1 个。所以 X 的全部取值为 <b>0、1、2</b>，共 3 个，一个都不能少。</p>
<p class="s-k">用到：离散型随机变量的取值要列全，这直接决定表格有几列。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 算样本点总数</p>
<p class="s-b">从 5 个球中任取 2 个，与顺序无关，是组合问题：总数 n = C(5,2) = 10。这 10 个样本点等可能，可以用古典概型算概率。</p>
<p class="s-k">用到：古典概型——样本点有限且等可能，P(A)=事件 A 含的样本点数 ÷ 总数。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 逐个取值算概率</p>
<p class="s-b">取 0 个红球＝取 2 个白球：P(X=0) = C(3,0)C(2,2)/C(5,2) = 1/10。<br>取 1 个红球＝1 红 1 白：P(X=1) = C(3,1)C(2,1)/C(5,2) = 6/10。<br>取 2 个红球＝2 个都是红球：P(X=2) = C(3,2)C(2,0)/C(5,2) = 3/10。</p>
<p class="s-k">用到：「先分类再分步」计数：红球取法数 × 白球取法数。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 自检：非负 + 和为 1</p>
<p class="s-b">三个概率 1/10、6/10、3/10 都 ≥ 0；相加得 (1+6+3)/10 = 10/10 = 1。两条性质都通过，说明取值没有漏、概率没有算错。和不是 1 就说明还有取值没找到，必须回去查。</p>
<p class="s-k">用到：pᵢ ≥ 0 与 p₁+p₂+…+pₙ = 1 是分布列的两条性质，也是唯一的自检手段。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 写成两行表格，再累加</p>
<p class="s-b">分布列写成上行取值 0、1、2，下行概率 1/10、6/10、3/10。求 P(X≤1) 时把 a=1 左边（含 1）的列相加：P(X≤1) = P(X=0) + P(X=1) = 1/10 + 6/10 = 7/10。</p>
<p class="s-k">用到：P(X≤a) 用分布列累加，不是连乘，也不是 1 减去某一项。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">X 的所有可能取值为 0，1，2。<br>
样本点总数 C(5,2) = 10。<br>
P(X=0) = C(3,0)C(2,2)/C(5,2) = 1/10；<br>
P(X=1) = C(3,1)C(2,1)/C(5,2) = 6/10；<br>
P(X=2) = C(3,2)C(2,0)/C(5,2) = 3/10。<br>
验证：1/10 + 6/10 + 3/10 = 1，且各概率均非负，故 X 的分布列为<br>
<span class="gx-fml">P(X=0)=1/10，P(X=1)=6/10，P(X=2)=3/10</span><br>
（答题卡上写成两行表格：上行 X 取 0、1、2，下行 P 取 1/10、6/10、3/10。）<br>
所以 P(X≤1) = P(X=0) + P(X=1) = 1/10 + 6/10 = 7/10。</p>
</div>
</div>
</section>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「分布列必须满足什么？」</p>
<p class="a">两条性质缺一不可：<b>① 每个 pᵢ ≥ 0（概率不能为负）；② p₁+p₂+…+pₙ = 1（概率和恰为 1）</b>。此外所有取值必须列全，且写成两行表格。这四条里任何一条不满足，这张表就不是分布列。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="分布列四条要求的清单">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="20" y="30" font-size="9" fill="#151a21">① 取值列全 ② pᵢ ≥ 0</text>
<text x="20" y="48" font-size="9" fill="#151a21">③ 概率和恰为 1 ④ 写成两行表</text>
<rect x="20" y="62" width="200" height="22" rx="4" fill="#e6f6ee" stroke="#b8e6d0"/>
<text x="30" y="77" font-size="8.6" fill="#2f8a5b">四条全过 → 才叫分布列</text>
<text x="20" y="104" font-size="8.4" fill="#6b7480">少一条都不给分</text>
</svg>
</div>
<div class="qac">
<p class="q">「概率加起来不是 1，说明什么？」</p>
<p class="a">说明这张表<b>还不是分布列</b>，必有一处错：要么<b>有取值没列全</b>（最常见，漏了最大或最小的那个取值），要么某个概率算错、要么各列重复计算。此时不能写「约为 1」蒙过去，必须回去把取值重新数一遍，再逐个重算。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="概率和为1.1的错误情形">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#fbeae7" stroke="#e8b7ad"/>
<text x="20" y="30" font-size="9" fill="#b8402f">0.5 + 0.6 = 1.1 ≠ 1</text>
<rect x="20" y="42" width="60" height="14" rx="3" fill="#b8402f"/>
<rect x="84" y="36" width="72" height="20" rx="3" fill="#d98a7a"/>
<text x="20" y="76" font-size="8.6" fill="#8a4a3a">两列就超过 1 ⇒ 取值或概率必错</text>
<text x="20" y="94" font-size="8.6" fill="#8a4a3a">先数列，再重算，别硬写</text>
<text x="20" y="114" font-size="8.4" fill="#b8402f">概率和必须恰好为 1</text>
</svg>
</div>
<div class="qac">
<p class="q">「随机变量一定是数吗？」</p>
<p class="a">是。<b>随机变量是定义在样本空间上的实值变量</b>，取的值是实数，不是文字、不是事件。「掷出正面」是事件不是随机变量；令 X=1 表示正面、X=0 表示反面，X 才是随机变量。所以写分布列时上行一定写数。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="事件到实数的对应">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<rect x="20" y="40" width="80" height="44" rx="6" fill="#ffffff" stroke="#b8e6d0"/>
<text x="30" y="58" font-size="8.6" fill="#3a3a35">结果：正面</text>
<text x="30" y="74" font-size="8.4" fill="#6b7480">（这是事件）</text>
<path d="M104 62 H 140" stroke="#8f9aa8" stroke-width="1.4"/>
<polygon points="140,58 150,62 140,66" fill="#8f9aa8"/>
<rect x="152" y="40" width="68" height="44" rx="6" fill="#eef6ff" stroke="#2563eb55"/>
<text x="164" y="68" font-size="11" font-weight="700" fill="#2563eb">X = 1</text>
<text x="20" y="108" font-size="8.4" fill="#5a6472">取值是实数，所以能算概率</text>
</svg>
</div>
<div class="qac">
<p class="q">「离散型和连续型差在哪？」</p>
<p class="a">看取值能不能<b>一个一个列出来</b>。离散型：取值是有限个或可列无限个（0、1、2…），可以写成两行分布列。连续型：取值填满一个区间，列不出来，<b>单个点的概率为 0</b>，要用密度曲线下的面积算区间概率，不能写分布列。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="离散取点与连续区间的对比">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="20" y="28" font-size="8.6" fill="#5a6472">离散：一个个点</text>
<circle cx="34" cy="46" r="4" fill="#2563eb"/><circle cx="66" cy="46" r="4" fill="#2563eb"/>
<circle cx="98" cy="46" r="4" fill="#2563eb"/><circle cx="130" cy="46" r="4" fill="#2563eb"/>
<text x="20" y="76" font-size="8.6" fill="#5a6472">连续：一整段</text>
<rect x="20" y="86" width="130" height="16" rx="4" fill="#9fb4cc"/>
<text x="162" y="50" font-size="8.4" fill="#2f8a5b">能列出来</text>
<text x="162" y="98" font-size="8.4" fill="#b8791f">列不出来</text>
</svg>
</div>
<div class="qac">
<p class="q">「P(X≤2) 怎么算？」</p>
<p class="a">用分布列<b>累加</b>：把满足 X≤2 的所有列的概率相加，即 P(X≤2)=P(X=0)+P(X=1)+P(X=2)。若 2 已是最大取值，结果就是 1。<b>不能连乘</b>（连乘是求「同时发生」），也不能把 2 当成概率去乘。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="累加求P(X≤2)">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<rect x="26" y="60" width="34" height="40" rx="3" fill="#2563eb"/>
<rect x="72" y="40" width="34" height="60" rx="3" fill="#2563eb"/>
<rect x="118" y="52" width="34" height="48" rx="3" fill="#2563eb"/>
<text x="43" y="114" font-size="8.6" fill="#3a3a35" text-anchor="middle">0</text>
<text x="89" y="114" font-size="8.6" fill="#3a3a35" text-anchor="middle">1</text>
<text x="135" y="114" font-size="8.6" fill="#3a3a35" text-anchor="middle">2</text>
<path d="M18 30 H 160" stroke="#2f8a5b" stroke-width="1.4"/>
<text x="170" y="33" font-size="8.4" fill="#2f8a5b">全加</text>
<text x="26" y="20" font-size="8.4" fill="#5a6472">P(X≤2)</text>
</svg>
</div>
<div class="qac">
<p class="q">「分布列能写成公式吗？」</p>
<p class="a">可以，但公式必须与表格<b>完全一致</b>：公式给出的是 P(X=k) 的通项，表格给出的是每一个具体取值。考试里如果题目问「求分布列」，<b>必须列出全部取值和概率</b>（写成两行表格），只写一个通项公式通常不给满分；问「求概率」时用公式更快。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="通项公式与两行表格的对应">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="20" y="30" font-size="9" fill="#3a3a35">公式：P(X=k) = C(3,k)C(2,2−k)/10</text>
<rect x="20" y="44" width="200" height="20" rx="3" fill="#ffffff" stroke="#c9d6e2"/>
<rect x="20" y="64" width="200" height="20" rx="3" fill="#eef6ff" stroke="#c9d6e2"/>
<text x="30" y="58" font-size="8.4" fill="#3a3a35">X　0　　1　　2</text>
<text x="30" y="78" font-size="8.4" fill="#2f8a5b">P　1/10　6/10　3/10</text>
<text x="20" y="104" font-size="8.4" fill="#6b7480">问分布列 ⇒ 必须把表列全</text>
</svg>
</div>
</div>
<p class="gx-note">这六问其实是同一件事：分布列是一张<b>必须完整、必须自洽</b>的表——取值列全、概率非负、和恰为 1、写成两行。所有扣分都从这四条里漏掉一条开始。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ X 可能取 0、1，所以 P(X=0)=0.4，P(X=1)=0.5。</p>
<p class="er-v">✓ X 的所有可能取值为 0，1，2，且 P(X=0)=0.1，P(X=1)=0.6，P(X=2)=0.3，和为 1。</p>
<p class="er-w">错在哪：漏写了取值 2。分布列必须列全所有取值；漏一个，概率和只有 0.9，一眼就能看出表不成立。</p>
</div>
<div class="er">
<p class="er-x">✗ 概率和等于 0.9，约等于 1，就按这个写下去。</p>
<p class="er-v">✓ 概率和必须恰好为 1；0.9 ≠ 1，先回去补全取值、重算概率，再写分布列。</p>
<p class="er-w">错在哪：没有「约等于 1」。和不为 1 说明表本身是错的，继续往下算只会全错。</p>
</div>
<div class="er">
<p class="er-x">✗ 由 1 − 0.6 − 0.5 = −0.1 得 P(X=2) = −0.1。</p>
<p class="er-v">✓ 概率不能为负；算出负数说明前面某个概率或取值错了，必须重算。</p>
<p class="er-w">错在哪：把负数当答案交上去。pᵢ ≥ 0 是不可越过的红线，出现负数等于自己宣布这张表作废。</p>
</div>
<div class="er">
<p class="er-x">✗ X 的取值是「取到红球」「取到白球」。</p>
<p class="er-v">✓ X 表示取到的红球个数，取值为 0，1，2；「取到红球」是事件，不是 X 的取值。</p>
<p class="er-w">错在哪：把事件当成了取值。随机变量取的是实数，表格上行只能写数，写文字就没法算概率和。</p>
</div>
<div class="er">
<p class="er-x">✗ P(X≤2) = P(X=0)×P(X=1)×P(X=2)。</p>
<p class="er-v">✓ P(X≤2) = P(X=0) + P(X=1) + P(X=2)，由分布列累加得到。</p>
<p class="er-w">错在哪：把「或」用成了「且」。X≤2 是几个互斥情形的并，概率相加；连乘是求同时发生，这里根本不适用。</p>
</div>
<div class="er">
<p class="er-x">✗ 分布列：X 取 0 的概率是十分之一，取 1 的概率是十分之六，取 2 的概率是十分之三。</p>
<p class="er-v">✓ 写成两行表格：上行 X 为 0、1、2，下行 P 为 1/10、6/10、3/10。</p>
<p class="er-w">错在哪：写成文字叙述。分布列的「列」就是表格，取值与概率必须逐列对齐，写成句子阅卷时看不到对应关系。</p>
</div>
<div class="er">
<p class="er-x">✗ 表格上行写 0、1、2，下行写 0.1、0.3、0.6，顺序照抄题目。</p>
<p class="er-v">✓ 下行概率必须与上行取值逐列对应：0↔0.1，1↔0.6，2↔0.3，和恰为 1。</p>
<p class="er-w">错在哪：上下两行错位。概率和仍是 1，但每个取值的概率都配错了，属于「看起来对、其实全错」。</p>
</div>
</div>

<script>
/* 互动脚本本体（由 build-page.mjs 包进 <script> 里，禁止写 <script> 标签） */
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var GX = window.GX, el = GX.el, tx = GX.tx, $ = GX.$;
  var stage = $("gxStage");
  if (!stage || !window.AutoPilot) return;

  /* 两套坐标：宽屏 880×470，窄屏独立 360×700 */
  var W = { vb: "0 0 880 470", left: { x: 16, y: 16, w: 424, h: 438 }, right: { x: 456, y: 16, w: 408, h: 438 } };
  var N = { vb: "0 0 360 700", left: { x: 8, y: 8, w: 344, h: 330 }, right: { x: 8, y: 348, w: 344, h: 344 } };
  var L = W, G = null, A = 0.1;

  /* 纯函数：成功概率 p → 两点分布的分布列。render 与 __model.cases 共用 */
  function calc(v) {
    var p = Math.round(v * 100) / 100;
    var p0 = 1 - p, p1 = p;
    return { p: p, p0: p0, p1: p1, sum: p0 + p1, cdf0: p0 };
  }

  /* 几何：表格 / 柱子 / 右栏的分层坐标 */
  function geom() {
    var nar = L === N, l = L.left, g = {};
    g.nar = nar;
    g.labelW = nar ? 62 : 72;
    g.tw = Math.min(l.w - 28, nar ? 300 : 340);
    g.tx = l.x + (l.w - g.tw) / 2;
    g.dataW = (g.tw - g.labelW) / 2;
    g.rowY = l.y + (nar ? 54 : 72);
    g.rowH = nar ? 46 : 52;
    g.c0 = g.tx + g.labelW + g.dataW / 2;
    g.c1 = g.tx + g.labelW + g.dataW * 1.5;
    g.base = l.y + l.h - (nar ? 26 : 62);
    g.maxH = Math.min(nar ? 104 : 132, g.base - (g.rowY + 2 * g.rowH) - 30);
    g.bw = nar ? 74 : 90;
    g.rx = L.right.x + 18;
    g.rw = L.right.w - 36;
    g.barY = L.right.y + (nar ? 46 : 52);
    g.barH = nar ? 30 : 36;
    g.lineY = g.barY + g.barH + (nar ? 50 : 58);
    g.step = nar ? 24 : 26;
    return g;
  }

  /* 中文按字数换行，避免长句冲出面板 */
  function wrap(parent, x, y, s, maxW, fs, col, lh) {
    var per = Math.max(6, Math.floor(maxW / fs)), lines = [], cur = "";
    for (var i = 0; i < s.length; i++) { cur += s.charAt(i); if (cur.length >= per) { lines.push(cur); cur = ""; } }
    if (cur) lines.push(cur);
    for (var k = 0; k < lines.length; k++) tx(parent, x, y + k * lh, lines[k], col, "start", fs, 400);
  }

  function draw() {
    var gA = $("gxA"), gB = $("gxB");
    gA.textContent = ""; gB.textContent = "";
    var s = calc(A), g = G, p0 = s.p0, p1 = s.p1, f = function (v) { return v.toFixed(2); };

    /* 左：分布列两行表格 + 对齐的柱形 */
    el("rect", { x: L.left.x, y: L.left.y, width: L.left.w, height: L.left.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    tx(gA, L.left.x + 20, L.left.y + 30, "X ~ 两点分布：上行取值，下行概率", "#5a6472", "start", 10.5, 700);
    el("rect", { x: g.tx, y: g.rowY, width: g.tw, height: 2 * g.rowH, rx: 6, fill: "#ffffff", stroke: "#c9d6e2" }, gA);
    el("path", { d: "M" + (g.tx + g.labelW) + " " + g.rowY + " V " + (g.rowY + 2 * g.rowH) +
      " M" + (g.tx + g.labelW + g.dataW) + " " + g.rowY + " V " + (g.rowY + 2 * g.rowH) +
      " M" + g.tx + " " + (g.rowY + g.rowH) + " H " + (g.tx + g.tw), stroke: "#dbe7ef", fill: "none" }, gA);
    tx(gA, g.tx + g.labelW / 2, g.rowY + g.rowH / 2 + 5, "X", "#151a21", "middle", 12.5, 700);
    tx(gA, g.c0, g.rowY + g.rowH / 2 + 5, "0", "#3a3a35", "middle", 12, 400);
    tx(gA, g.c1, g.rowY + g.rowH / 2 + 5, "1", "#3a3a35", "middle", 12, 400);
    tx(gA, g.tx + g.labelW / 2, g.rowY + g.rowH * 1.5 + 5, "P", "#151a21", "middle", 12.5, 700);
    tx(gA, g.c0, g.rowY + g.rowH * 1.5 + 5, f(p0), "#2f8a5b", "middle", 12, 700);
    tx(gA, g.c1, g.rowY + g.rowH * 1.5 + 5, f(p1), "#2f8a5b", "middle", 12, 700);

    el("path", { d: "M" + (g.tx - 10) + " " + g.base + " H " + (g.tx + g.tw + 4), stroke: "#8f9aa8", "stroke-width": 1.4, fill: "none" }, gA);
    el("polygon", { points: (g.tx + g.tw + 4) + "," + (g.base - 4) + " " + (g.tx + g.tw + 14) + "," + g.base + " " + (g.tx + g.tw + 4) + "," + (g.base + 4) }, gA).setAttribute("fill", "#8f9aa8");
    var hs = [{ c: g.c0, v: p0, k: "0" }, { c: g.c1, v: p1, k: "1" }];
    for (var i = 0; i < hs.length; i++) {
      var h = Math.max(2, g.maxH * hs[i].v);
      el("rect", { x: hs[i].c - g.bw / 2, y: g.base - h, width: g.bw, height: h, rx: 3, fill: "#2563eb", "fill-opacity": 0.85 }, gA);
      tx(gA, hs[i].c, g.base - h - 9, hs[i].v.toFixed(2), "#2563eb", "middle", 10, 700);
      tx(gA, hs[i].c, g.base + 18, "X = " + hs[i].k, "#5a6472", "middle", 10, 400);
    }
    tx(gA, g.tx, g.rowY - 12, "分布列（两行表格）", "#8f9aa8", "start", 9.4, 400);

    /* 右：和恰为 1 的堆叠条 + 自检结论 */
    el("rect", { x: L.right.x, y: L.right.y, width: L.right.w, height: L.right.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    tx(gB, L.right.x + 20, L.right.y + 30, "自检：概率和恰为 1", "#5a6472", "start", 10.5, 700);
    tx(gB, g.rx, g.barY - 10, "P(X=0) + P(X=1)", "#8f9aa8", "start", 9.4, 400);
    el("rect", { x: g.rx, y: g.barY, width: g.rw * p0, height: g.barH, rx: 4, fill: "#2563eb", "fill-opacity": 0.85 }, gB);
    el("rect", { x: g.rx + g.rw * p0, y: g.barY, width: Math.max(0, g.rw * p1), height: g.barH, rx: 4, fill: "#93b8f0" }, gB);
    if (g.rw * p0 > 56) tx(gB, g.rx + g.rw * p0 / 2, g.barY + g.barH / 2 + 4, f(p0), "#ffffff", "middle", 10, 700);
    if (g.rw * p1 > 56) tx(gB, g.rx + g.rw * p0 + g.rw * p1 / 2, g.barY + g.barH / 2 + 4, f(p1), "#1b3a63", "middle", 10, 700);
    tx(gB, g.rx, g.barY + g.barH + 18, "两段拼满整条 ⇒ 概率和恰好为 1.00", "#2f8a5b", "start", 9.6, 700);

    var x0 = L.right.x + 20, ly = g.lineY, st = g.step;
    tx(gB, x0, ly, "p₀ = P(X=0) = 1 − p = " + f(p0), "#3a3a35", "start", 10.4, 400);
    tx(gB, x0, ly + st, "p₁ = P(X=1) = p = " + f(p1), "#3a3a35", "start", 10.4, 400);
    tx(gB, x0, ly + st * 2, "p₀ + p₁ = " + f(p0 + p1) + "（恒为 1）", "#2f8a5b", "start", 10.4, 700);
    tx(gB, x0, ly + st * 3, "P(X≤0) = p₀ = " + f(p0), "#2563eb", "start", 10.4, 700);

    var wy = ly + st * 3 + (g.nar ? 34 : 42);
    wrap(gB, x0, wy, "分布列要列全所有取值：X 只取 0、1 两个值，漏一个概率和就不为 1。", L.right.w - 40, g.nar ? 9.2 : 9.6, "#5a6472", 15);
    wrap(gB, x0, wy + (g.nar ? 40 : 54), "概率不能为负：p 在 0.1–0.9 之间，两个概率都 ≥ 0。", L.right.w - 40, g.nar ? 9.2 : 9.6, "#5a6472", 15);
  }

  function render() {
    if (!G) { L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N; G = geom(); stage.setAttribute("viewBox", L.vb); }
    var s = calc(A);
    $("gxVa").textContent = s.p.toFixed(2);
    $("gxVb").textContent = s.p0.toFixed(2);
    $("gxVc").textContent = s.p1.toFixed(2);
    $("gxVs").textContent = "和为 1";
    $("gxVsn").textContent = "p₀+p₁=" + (s.p0 + s.p1).toFixed(2) + " 恒成立";
    $("gxStBox").style.background = "#e6f6ee";
    $("gxStBox").style.borderColor = "#2f8a5b44";
    $("gxVs").style.color = "#2f8a5b";
    draw();
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    G = geom();
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 0.1 }, { t: 1.2, v: 0.1 }, { t: 4, v: 0.5 }, { t: 6.5, v: 0.5 }, { t: 9, v: 0.9 }, { t: 11.5, v: 0.7 }, { t: 13.5, v: 0.1 }],
    keys: [0.1, 0.5, 0.9],
    value: A, min: 0.1, max: 0.9, step: 0.05,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc, cases: [
    { v: 0.3, eq: { p0: 0.7, p1: 0.3, sum: 1 } },
    { v: 0.5, eq: { p0: 0.5, p1: 0.5, sum: 1 } },
    { v: 0.9, eq: { p0: 0.1, p1: 0.9, sum: 1 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
