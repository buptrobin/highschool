<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆条件。答题时写左边的定理原文，不写右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 直线与平面平行的判定定理<span class="q-src">人教A版必修第二册 · 第八章第五节</span></p>
<p class="q-b">平面外一条直线与此平面内的一条直线平行，则该直线与此平面平行。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个条件</b>组成——① 直线 l 在平面 α 外（记作 l ⊄ α）；② 平面 α 内有一条直线 a；③ l 与 a 平行。结论是 l ∥ α。三个条件里最容易被跳过的是①：如果 l 本来就躺在 α 内，②③照样能成立（面内两条平行直线多得是），但结论「l 与 α 平行」反而是错的。所以必须强调直线在平面外。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 平面与平面平行的判定定理<span class="q-src">人教A版必修第二册 · 第八章第五节</span></p>
<p class="q-b">一个平面内的两条相交直线与另一个平面平行，则这两个平面平行。</p>
<p class="q-n">→ 翻成人话：四个条件——① a ⊂ β；② b ⊂ β；③ a 与 b 相交于点 P；④ a ∥ α 且 b ∥ α。结论 β ∥ α。这里的「相交」不是修辞：一条直线平行于 α 只能把 β 卡在一个方向上，第二组位置靠另一条直线来锁，两条直线一旦平行就锁不住，β 照样可以斜着穿过 α。面面平行要两条相交直线。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 直线与平面平行的性质定理<span class="q-src">人教A版必修第二册 · 第八章第五节</span></p>
<p class="q-b">一条直线与一个平面平行，如果过该直线的平面与此平面相交，那么该直线与交线平行。</p>
<p class="q-n">→ 翻成人话：已知 l ∥ α，想得到「线线平行」，必须自己造一个过 l 的平面 β，并且让 β 与 α 真的相交，交线记作 a，才有 l ∥ a。也就是说，线面平行不能直接推线线平行，中间必须过一道「平面与平面相交」的手续。这一步是性质定理的全部价值，也是证明题里最常被漏写的一句。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>定理</th><th>条件（少一个都不行）</th><th>少了它会怎样</th></tr></thead>
<tbody>
<tr><td>线面平行判定</td><td>l ⊄ α，即直线在平面外</td><td>l ⊂ α 时面内仍有平行线，结论自相矛盾；必须强调直线在平面外</td></tr>
<tr><td>线面平行判定</td><td>α 内有一条直线 a，且 l ∥ a</td><td>只说「l 与 α 内某个方向平行」不算，a 必须真的落在 α 内</td></tr>
<tr class="key"><td>面面平行判定</td><td>β 内两条<b>相交</b>直线都平行于 α</td><td>两条平行直线锁不住平面，β 可以绕这组平行线转动后与 α 相交；面面平行要两条相交直线</td></tr>
<tr><td>线面平行性质</td><td>过 l 的平面 β 与 α 相交于 a</td><td>不作出交线就没有线线平行；线面平行不能直接推线线平行</td></tr>
<tr><td>面面平行性质</td><td>第三个平面 γ 与 α、β 都相交</td><td>没有截平面，两个面内的直线没有任何可比的公共对象</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">背法：<b>判定是「由线到面」，性质是「由面到线」</b>。判定的方向是往结论走，所以要凑条件；性质的方向是从结论出发，所以要作辅助平面。凡是「已知平行求平行」的题，先问自己走的是哪一边，再决定补哪一句。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。注意每一步只写一个判断。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 正方体中证明线面平行<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">如图，在正方体 ABCD-A₁B₁C₁D₁ 中，求证：BD ∥ 平面 B₁D₁C。<br>陷阱：BD 与 B₁D₁ 平行这一点很容易看出来，但「BD 不在平面 B₁D₁C 内」必须写出来，否则判定定理少一个条件。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 定方向</p>
<p class="s-b">要证的是「线面平行」，落在判定定理上：需要在平面 B₁D₁C 内找一条与 BD 平行的直线。所以先不急着写结论，先在面 B₁D₁C 的三条边 B₁D₁、D₁C、CB₁ 里挑一条。</p>
<p class="s-k">用到：线面平行的判定定理——线在面外、面内一条线、两线平行。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 造平行</p>
<p class="s-b">连接 B₁D₁。在正方体中，BB₁ ∥ DD₁ 且 BB₁ = DD₁，所以四边形 BB₁D₁D 是平行四边形，于是 BD ∥ B₁D₁。</p>
<p class="s-k">用到：正方体侧棱平行且相等 → 一组对边平行且相等的四边形是平行四边形。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 写位置关系</p>
<p class="s-b">BD 在底面 ABCD 内，而平面 B₁D₁C 与底面只交于一点 C 附近的一条线，BD 不在平面 B₁D₁C 内，记作 BD ⊄ 平面 B₁D₁C。同时 B₁D₁ 是平面 B₁D₁C 内的一条直线，记作 B₁D₁ ⊂ 平面 B₁D₁C。</p>
<p class="s-k">用到：点、线、面位置关系的符号表达；这一步就是「直线在平面外」的证据。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 套定理下结论</p>
<p class="s-b">因为 BD ⊄ 平面 B₁D₁C，B₁D₁ ⊂ 平面 B₁D₁C，且 BD ∥ B₁D₁，由直线与平面平行的判定定理，得 BD ∥ 平面 B₁D₁C。</p>
<p class="s-k">用到：判定定理的三个条件一次写全，顺序照课本。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 回头检查</p>
<p class="s-b">三句话缺一不可：BD ⊄ 面、B₁D₁ ⊂ 面、BD ∥ B₁D₁。少写第二句，读者不知道平行线在不在面内；少写第一句，就等于承认 BD 可能躺在面内，结论直接失效。最后一句必须点明用的是判定定理，不能只写「所以平行」。</p>
<p class="s-k">用到：判定定理与性质定理的分工，判定是由线到面。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">证明：连接 B₁D₁。<br>∵ 在正方体 ABCD-A₁B₁C₁D₁ 中，BB₁ ∥ DD₁ 且 BB₁ = DD₁，∴ 四边形 BB₁D₁D 为平行四边形，∴ BD ∥ B₁D₁。<br>∵ BD ⊄ 平面 B₁D₁C，B₁D₁ ⊂ 平面 B₁D₁C，<br>∴ 由直线与平面平行的判定定理，得 BD ∥ 平面 B₁D₁C。</p>
</div>
</div>
</section>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">

<div class="qac">
<p class="q">线面平行的判定定理，为什么一定要写「直线在平面外」？</p>
<p class="a">因为少了这一条，结论会变成假的：若 l 本来就在 α 内，α 内当然还有一条直线与 l 平行，②③照样成立，可得出的却是 l ⊂ α 而不是 l ∥ α。所以必须强调<b>直线在平面外</b>，答题时先写 l ⊄ α 再往下推。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="直线在面外与直线在面内的对比">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<polygon points="30,96 168,96 206,66 68,66" fill="#eaf3fa" stroke="#7ba7c9"/>
<line x1="46" y1="44" x2="120" y2="44" stroke="#2563eb" stroke-width="2"/>
<text x="126" y="48" font-size="9" fill="#2563eb">l ⊄ α</text>
<line x1="80" y1="86" x2="162" y2="86" stroke="#b8402f" stroke-width="2" stroke-dasharray="4 3"/>
<text x="120" y="112" font-size="8.6" fill="#b8402f">在面内 ⇒ 结论失效</text>
</svg>
</div>

<div class="qac">
<p class="q">面面平行的判定，为什么非要两条直线「相交」？</p>
<p class="a">一条直线只锁住一个方向，平面还能绕这条直线转动，转到位就可能与另一个平面相交。两条相交直线把平面内的两个方向都钉死，平面才彻底固定。所以面面平行要<b>两条相交直线</b>，两条平行直线不够。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="两条相交直线与两条平行直线的对比">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<polygon points="24,104 128,104 160,72 56,72" fill="#eaf3fa" stroke="#7ba7c9"/>
<line x1="52" y1="96" x2="118" y2="80" stroke="#2563eb" stroke-width="1.8"/>
<line x1="70" y1="76" x2="108" y2="98" stroke="#2563eb" stroke-width="1.8"/>
<circle cx="87" cy="88" r="2" fill="#b8402f"/>
<text x="86" y="120" font-size="8.4" fill="#2f8a5b">相交 ✔</text>
<line x1="140" y1="88" x2="196" y2="88" stroke="#8c949e" stroke-width="1.6"/>
<line x1="140" y1="100" x2="196" y2="100" stroke="#8c949e" stroke-width="1.6"/>
<text x="140" y="120" font-size="8.4" fill="#b8402f">平行 ✘</text>
</svg>
</div>

<div class="qac">
<p class="q">已知 l ∥ α，能直接说 l 平行于 α 内的某条直线吗？</p>
<p class="a">不能。l 与 α 内的直线可能平行，也可能异面。要得到线线平行，必须再作一个过 l 的平面 β，使 β ∩ α = a，才有 l ∥ a。结论：线面平行<b>不能直接推线线平行</b>，中间要靠交线过渡。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="线面平行需要借助交线才能得到线线平行">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<polygon points="24,104 148,104 186,74 62,74" fill="#eaf3fa" stroke="#7ba7c9"/>
<line x1="52" y1="44" x2="132" y2="44" stroke="#2563eb" stroke-width="2"/>
<text x="138" y="48" font-size="8.6" fill="#2563eb">l ∥ α</text>
<line x1="60" y1="94" x2="150" y2="94" stroke="#b8791f" stroke-width="2"/>
<text x="152" y="98" font-size="8.6" fill="#b8791f">a？</text>
<text x="40" y="122" font-size="8.4" fill="#b8402f">缺交线就没有 l ∥ a</text>
</svg>
</div>

<div class="qac">
<p class="q">两个平面平行，其中一个面内的一条直线与另一个面是什么关系？</p>
<p class="a">这条直线与另一个平面平行（不会相交）。理由：α ∥ β 时它们没有公共点，于是 β 内任取一条直线 b，a 与 b 也无公共点；又 a ⊂ α、b ⊂ β，而 α 与 β 无公共点，所以 a 与 b 无公共点；把 b 取遍 β 内的直线，就得到 a 与 β 无公共点，即 a ∥ β。注意这不是性质定理，是定义的直接推论。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="两平面平行时一面内的直线平行于另一面">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<polygon points="24,104 140,104 172,80 56,80" fill="#eaf3fa" stroke="#7ba7c9"/>
<polygon points="24,66 140,66 172,42 56,42" fill="#fdf3e0" stroke="#d9b273"/>
<line x1="52" y1="96" x2="112" y2="96" stroke="#2563eb" stroke-width="2"/>
<line x1="52" y1="58" x2="112" y2="58" stroke="#2563eb" stroke-width="2"/>
<text x="176" y="62" font-size="8.4" fill="#b8791f">β</text>
<text x="176" y="100" font-size="8.4" fill="#2f6d94">α</text>
<text x="42" y="122" font-size="8.4" fill="#2f8a5b">a 与 α 无公共点</text>
</svg>
</div>

<div class="qac">
<p class="q">平行于同一个平面的两条直线，一定平行吗？</p>
<p class="a">不一定。两条直线都平行于 α，只能说明它们与 α 都没有公共点，方向却可以任意：可以平行，可以相交，也可以异面。举反例最快：在 α 上方的两个不同高度各画一条水平线，它们平行；把其中一条转 90°，仍然平行于 α，但两条线已经垂直。所以「同平行于一面的两线平行」是典型错句。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="两条直线都平行于同一平面但彼此不平行">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<polygon points="24,106 156,106 192,78 60,78" fill="#eaf3fa" stroke="#7ba7c9"/>
<line x1="48" y1="50" x2="120" y2="50" stroke="#2563eb" stroke-width="2"/>
<line x1="130" y1="30" x2="130" y2="64" stroke="#2f8a5b" stroke-width="2"/>
<text x="44" y="44" font-size="8.4" fill="#2563eb">l₁ ∥ α</text>
<text x="136" y="30" font-size="8.4" fill="#2f8a5b">l₂ ∥ α</text>
<text x="70" y="124" font-size="8.4" fill="#b8402f">l₁ 与 l₂ 相交 · 不平行</text>
</svg>
</div>

<div class="qac">
<p class="q">用性质定理时，那条「交线」怎么找？</p>
<p class="a">三步：① 过已知直线 l 作（或找出）一个平面 β——通常借题目里已有的面，如正方体的侧面、对角面；② 说明 β 与 α 确实相交，交线记作 a；③ 写 l ⊂ β、l ∥ α、β ∩ α = a ⇒ l ∥ a。找交线的关键，是把 l 的两个端点或它所在的现成平面「兜」进去。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="过直线作平面截出交线">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<polygon points="24,108 150,108 186,80 60,80" fill="#eaf3fa" stroke="#7ba7c9"/>
<polygon points="80,36 156,36 138,100 62,100" fill="#dbeafe" stroke="#93b4d8" stroke-dasharray="4 3"/>
<line x1="86" y1="46" x2="150" y2="46" stroke="#2563eb" stroke-width="2"/>
<line x1="72" y1="94" x2="140" y2="94" stroke="#b8791f" stroke-width="2"/>
<text x="152" y="50" font-size="8.4" fill="#2563eb">l</text>
<text x="142" y="98" font-size="8.4" fill="#b8791f">a</text>
<text x="120" y="30" font-size="8.4" fill="#4a5563">β</text>
<text x="40" y="124" font-size="8.4" fill="#2f8a5b">β ∩ α = a</text>
</svg>
</div>

</div>
<p class="gx-note">六问其实是同一件事：<b>判定要凑条件，性质要造辅助面</b>。凡是「线面平行」的题，先判断自己是在用判定（由线到面）还是用性质（由面到线），再决定补哪一句；凡是「面面平行」的判定，先检查那两条线有没有交点。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 已知 a ⊂ α，b ∥ a，所以 b ∥ α。</p>
<p class="er-v">✓ b ⊄ α，a ⊂ α，b ∥ a ⇒ b ∥ α。</p>
<p class="er-w">错在哪：漏了「b 在平面外」。必须强调直线在平面外，否则 b 可能在 α 内——面内两条平行线完全合法，结论却是 b ⊂ α。</p>
</div>
<div class="er">
<p class="er-x">✗ β 内有两条直线都平行于 α，所以 β ∥ α。</p>
<p class="er-v">✓ β 内两条<b>相交</b>直线都平行于 α ⇒ β ∥ α。</p>
<p class="er-w">错在哪：平行线锁不住平面。面面平行要两条相交直线，题目里常见「两条平行线」的构图，就是专门挖这个坑。</p>
</div>
<div class="er">
<p class="er-x">✗ 因为 l ∥ α，a ⊂ α，所以 l ∥ a。</p>
<p class="er-v">✓ l ∥ α，l ⊂ β，β ∩ α = a ⇒ l ∥ a。</p>
<p class="er-w">错在哪：线面平行不能直接推线线平行，l 与 α 内的 a 还可能是异面。必须补出过 l 的平面 β 与交线 a。</p>
</div>
<div class="er">
<p class="er-x">✗ l₁ ∥ α，l₂ ∥ α，所以 l₁ ∥ l₂。</p>
<p class="er-v">✓ 平行于同一平面的两条直线可能平行、相交或异面，不能判定。</p>
<p class="er-w">错在哪：把「同向约束」当成「同向」。两条线各自与 α 无公共点，彼此的方向毫无关系。</p>
</div>
<div class="er">
<p class="er-x">✗ 若 α ∥ β，则 α 内任一直线与 β 内任一直线都平行。</p>
<p class="er-v">✓ 若 α ∥ β，a ⊂ α，则 a ∥ β；a 与 β 内的直线可能平行，也可能异面。</p>
<p class="er-w">错在哪：面面平行只保证「没有公共点」，不保证方向一致。要由面面平行得到线线平行，得让第三个平面 γ 去截，交线才平行。</p>
</div>
<div class="er">
<p class="er-x">✗ 判定定理条件太多，写「BD ∥ B₁D₁，所以 BD ∥ 平面 B₁D₁C」就够了。</p>
<p class="er-v">✓ BD ⊄ 平面 B₁D₁C，B₁D₁ ⊂ 平面 B₁D₁C，BD ∥ B₁D₁ ⇒ BD ∥ 平面 B₁D₁C。</p>
<p class="er-w">错在哪：判定定理是「三个条件推一个结论」，评分按条件给分。省掉「线在面外」这一条，逻辑上不成立，卷面上也直接扣分。</p>
</div>
<div class="er">
<p class="er-x">✗ 两个平面平行，所以它们没有公共直线，也没有公共点，因此其中一个面内的直线与另一个面必定无交点——这句对，但据此说「两面的直线都平行」就错了。</p>
<p class="er-v">✓ 面面平行 ⇒ 一个面内的直线平行于另一个面；要线线平行，仍需第三个平面截出两条交线。</p>
<p class="er-w">错在哪：把「线与面平行」偷换成「线与线平行」。这正是线面平行不能直接推线线平行的同一处毛病，换到面面平行上又犯一次。</p>
</div>
</div>
</section>

    /* ---------- 左：平面 α 与斜线 l ---------- */
    el("rect", { x: lb.x, y: lb.y, width: lb.w, height: lb.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    tx(gA, lb.x + 20, lb.y + 30, "线 l 与平面 α 所成角 θ", "#5a6472", "start", 10.5, 700);

    /* 平面 α：中心 o，前边方向 (1,0)，纵深方向 (qx,qy) */
    var A1 = [o.x - p - g.qx, o.y - g.qy], A2 = [o.x + p - g.qx, o.y - g.qy];
    var A3 = [o.x + p + g.qx, o.y + g.qy], A4 = [o.x - p + g.qx, o.y + g.qy];
    el("polygon", { points: A1.join(" ") + " " + A2.join(" ") + " " + A3.join(" ") + " " + A4.join(" "), fill: "#eaf3fa", stroke: "#7ba7c9", "stroke-width": 1.2 }, gA);
    tx(gA, o.x + p + g.qx + 8, o.y + g.qy + 16, "α", "#2f6d94", "start", 11.5, 700);

    /* 面内参考直线 a（判定定理要找的那条平行线） */
    el("line", { x1: o.x - p * 0.86, y1: o.y, x2: o.x + p * 0.86, y2: o.y, stroke: "#2f8a5b", "stroke-width": 2, "stroke-linecap": "round" }, gA);
    tx(gA, o.x + p * 0.86 + 5, o.y + 4, "a", "#2f8a5b", "start", 11, 700);

    /* 斜线 l：方向 = cosθ·(1,0) + sinθ·(0,-1)，长度 p */
    var lx = o.x + p * Math.cos(th), ly = o.y - p * Math.sin(th);
    el("line", { x1: o.x, y1: o.y, x2: lx, y2: ly, stroke: "#2563eb", "stroke-width": 2.4, "stroke-linecap": "round" }, gA);
    el("circle", { cx: o.x, cy: o.y, r: 3, fill: "#b8791f" }, gA);
    tx(gA, o.x - 14, o.y + 18, "O", "#b8791f", "middle", 9.5, 700);
    tx(gA, lx + 7, ly - 3, "l", "#2563eb", "start", 11.5, 700);

    /* 由 l 上一点向 α 作垂线，垂足 F；θ 的弧线在 O 处 */
    var fx = o.x + p * Math.cos(th), fy = o.y;
    if (A > 4) {
      el("line", { x1: lx, y1: ly, x2: fx, y2: fy, stroke: "#b8791f", "stroke-width": 1.1, "stroke-dasharray": "4 4" }, gA);
      el("path", { d: "M " + (o.x + 46) + " " + o.y + " A 46 46 0 0 0 " + (o.x + 46 * Math.cos(th)) + " " + (o.y - 46 * Math.sin(th)), fill: "none", stroke: "#b8402f", "stroke-width": 1.4 }, gA);
      tx(gA, o.x + 58 * Math.cos(th / 2) - 4, o.y - 58 * Math.sin(th / 2) + 12, "θ", "#b8402f", "middle", 10.5, 700);
      tx(gA, fx + 6, fy + 16, "垂足", "#8c949e", "start", 9, 400);
    } else {
      wrap(gA, lb.x + 20, o.y + 52, "θ = 0°：l 落在 α 内或与 α 平行——判定定理要的是「在平面外」那一支", lb.w - 40, 9.6, "#b8402f", 15);
    }

    /* ---------- 右：sinθ 曲线 ---------- */
    el("rect", { x: rb.x, y: rb.y, width: rb.w, height: rb.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    tx(gB, rb.x + 20, rb.y + 30, "sinθ 随 θ 的变化", "#5a6472", "start", 10.5, 700);
    var x0 = rb.x + rb.w * 0.16, x1 = rb.x + rb.w * 0.90;
    var y0 = rb.y + rb.h * 0.86, y1 = rb.y + rb.h * 0.17;
    var fx2 = function (deg) { return x0 + (deg / 90) * (x1 - x0); };
    var fy2 = function (val) { return y0 - val * (y0 - y1); };

    el("line", { x1: x0, y1: y0, x2: x1 + 8, y2: y0, stroke: "#9aa4b0", "stroke-width": 1.1 }, gB);
    el("line", { x1: x0, y1: y0, x2: x0, y2: y1 - 8, stroke: "#9aa4b0", "stroke-width": 1.1 }, gB);
    el("polygon", { points: (x1 + 8) + "," + y0 + " " + (x1 + 1) + "," + (y0 - 3.5) + " " + (x1 + 1) + "," + (y0 + 3.5), fill: "#9aa4b0" }, gB);
    el("polygon", { points: x0 + "," + (y1 - 8) + " " + (x0 - 3.5) + "," + (y1 - 1) + " " + (x0 + 3.5) + "," + (y1 - 1), fill: "#9aa4b0" }, gB);
    tx(gB, x1 - 2, y0 - 9, "θ", "#5a6472", "end", 10, 700);
    tx(gB, x0 - 8, y1 - 6, "sinθ", "#5a6472", "start", 10, 700);
    var tk = [0, 30, 60, 90], i, d = "";
    for (i = 0; i < tk.length; i++) {
      el("line", { x1: fx2(tk[i]), y1: y0, x2: fx2(tk[i]), y2: y0 + 4, stroke: "#9aa4b0" }, gB);
      tx(gB, fx2(tk[i]), y0 + 20, tk[i] + "°", "#6b7480", "middle", 8.6, 400);
    }
    el("line", { x1: x0, y1: fy2(0.5), x2: x0 - 4, y2: fy2(0.5), stroke: "#9aa4b0" }, gB);
    tx(gB, x0 - 7, fy2(0.5) + 3, "0.5", "#6b7480", "end", 8.6, 400);
    tx(gB, x0 - 7, fy2(1) + 3, "1.0", "#6b7480", "end", 8.6, 400);
    for (i = 0; i <= 90; i += 3) {
      d += (i === 0 ? "M " : " L ") + fx2(i).toFixed(1) + " " + fy2(Math.sin(i * Math.PI / 180)).toFixed(1);
    }
    el("path", { d: d, fill: "none", stroke: "#93b4d8", "stroke-width": 1.8 }, gB);
    el("line", { x1: fx2(A), y1: fy2(s.sinT), x2: fx2(A), y2: y0, stroke: "#b8402f", "stroke-dasharray": "3 4", "stroke-width": 1 }, gB);
    el("circle", { cx: fx2(A), cy: fy2(s.sinT), r: 4, fill: "#b8402f" }, gB);
    var lx2 = fx2(A) > (x0 + x1) / 2 ? fx2(A) - 8 : fx2(A) + 8;
    tx(gB, lx2, fy2(s.sinT) - 8, "sin" + A + "° = " + s.sinT.toFixed(3), "#b8402f", fx2(A) > (x0 + x1) / 2 ? "end" : "start", 9.4, 700);
    wrap(gB, rb.x + 20, rb.y + rb.h - 16, "曲线是 sinθ；θ=0° 与 θ=90° 是两个端点状态", rb.w - 40, 9.2, "#6b7480", 14);
  }

  function render() {
    var s = calc(A), st, col, bg, sn;
    $("gxVa").textContent = A + "°";
    $("gxVb").textContent = s.sinT.toFixed(3);
    $("gxVc").textContent = s.normal + "°";
    if (A === 0) { st = "平行 / 在面内"; col = "#2f8a5b"; bg = "#e6f6ee"; sn = "θ=0°，l ⊂ α 或 l ∥ α"; }
    else if (A < 90) { st = "斜交"; col = "#b8791f"; bg = "#fdf3e0"; sn = "0° < θ < 90°，l 与 α 相交"; }
    else { st = "垂直"; col = "#2563eb"; bg = "#eaf1fd"; sn = "θ=90°，l ⊥ α，下一节的主题"; }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    draw();
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 0 }, { t: 1.2, v: 0 }, { t: 4, v: 30 }, { t: 6.5, v: 30 }, { t: 9, v: 90 }, { t: 11.5, v: 90 }, { t: 13, v: 0 }],
    keys: [0, 30, 60, 90],
    value: A, min: 0, max: 90, step: 5,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc, cases: [
    { v: 0, eq: { sinT: 0, kind: 0 } },
    { v: 30, eq: { sinT: 0.5, kind: 1 } },
    { v: 90, eq: { sinT: 1, kind: 2 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
</body>
</html>
