<p class="gx-lede">概率是必修第二册里唯一「定义很短、用起来全是坑」的一节：课本用三句话定义了样本点、样本空间、随机事件，剩下的全是计数。整章的其余内容（事件的运算、频率与概率、古典概型）都架在这一节的三句话上。最容易错的一件事不在定义里，而在数数上——样本点什么时候算两个、什么时候算一个，一旦口径不统一，n 和 k 就不是同一个空间的量，概率必错。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 随机试验与样本空间<span class="q-src">人教A版必修第二册 · 第10章第1节</span></p>
<p class="q-b">我们把对随机现象的实现和对它的观察称为随机试验；随机试验的每个可能的基本结果称为样本点，全体样本点的集合称为样本空间。</p>
<p class="q-n">→ 这句话里嵌着<b>三个条件</b>：①「可以重复观察」是试验的前提，否则只有一次记录、谈不上概率；②「基本结果」表示不能再拆，掷两枚骰子得 (3,4) 是一个样本点，不能拆成「先 3 后 4」两个结果；③「全体」是集合，所以样本空间记作 <span class="gx-fml">Ω = {ω₁, ω₂, …, ωₙ}</span>。少掉③的「全体」，你手里的集合就只是某个事件，不是样本空间。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 随机事件与基本事件<span class="q-src">人教A版必修第二册 · 第10章第1节</span></p>
<p class="q-b">样本空间 Ω 的子集称为随机事件；只包含一个样本点的事件称为基本事件。</p>
<p class="q-n">→ 关键在<b>「子集」两个字</b>：事件不是「一件事」，是 Ω 的一个子集，所以事件之间能取交、取并、取补。由此自动得到两条口径：A <b>⊆</b> Ω 一定成立；∅ 与 Ω 本身也是子集，分别叫不可能事件与必然事件。只含一个样本点的事件叫基本事件，写作 {ω}，它与样本点 ω 是两个对象——一个是集合，一个是元素，答题时别把符号混着写。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 古典概型<span class="q-src">人教A版必修第二册 · 第10章第1节</span></p>
<p class="q-b">一般地，设试验 E 是古典概型，样本空间 Ω 包含 n 个样本点，事件 A 包含其中的 k 个样本点，则 P(A)=k/n。</p>
<p class="q-n">→ 这条公式<b>没有任何自由发挥的余地</b>，但它的三个部分各有一个前提：①「E 是古典概型」= 有限且等可能，两个都满足才成立；②n 与 k 必须<b>在同一个样本空间里数</b>，口径一致；③k ≤ n，所以 P(A) ∈ [0,1] 是算出来的结论，不是另记的规矩。缺①，k/n 只是频率的近似；缺②，n 与 k 不同口径，分数直接报废。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>条件</th><th>标准表述</th><th>缺了会怎样</th></tr></thead>
<tbody>
<tr><td>① 有限性</td><td>样本空间 Ω 只含有限个样本点，个数记为 n</td><td>n 数不出来，k/n 失去分母（如「在 [0,1] 上任取一数」）</td></tr>
<tr><td>② 等可能性</td><td>每个样本点出现的可能性相等</td><td>只能靠大量重复试验估频率，不能直接写 k/n</td></tr>
<tr class="key"><td>③ 计数口径</td><td>样本点按有序数对记，(1,2) 与 (2,1) 是两个不同的样本点</td><td>n 与 k 口径不一致，分子分母不在同一个样本空间，概率必错</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">背法：①②是古典概型的<b>定义条件</b>，答题要先写「有限且等可能」再动笔；③不是定义条件，是<b>计数纪律</b>——它不改变模型，只决定你的 n 是 36 还是 21。把③当成条件一起背，是因为考场上的失分几乎全在③。</p>
</section>

<p class="ex-t">例题 · 古典概型的计数<span class="bdg bdg-must">必考</span></p>

<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 定性：先确认是古典概型</p>
<p class="s-b">两枚骰子「质地均匀」，每个有序数对出现的可能性相等；点对总数只有 36 个，是有限的。有限与等可能两条同时成立，所以可以直用 P(A) = k/n。</p>
<p class="s-k">用到：古典概型的两个条件，缺一条就只能用频率估计。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 建样本空间：按有序数对列</p>
<p class="s-b">把结果记作 (i, j)，i 是第一枚的点数、j 是第二枚的点数，i、j ∈ {1,2,3,4,5,6}。样本空间 Ω 含 36 个样本点：(1,1)、(1,2)、…、(6,6)。这里必须按有序数：第一枚 3、第二枚 4 与第一枚 4、第二枚 3 是两次不同的试验结果，是<b>两个</b>样本点。</p>
<p class="s-k">用到：样本点要按有序数，n = 36 而不是 21。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 数 k：把和为 7 的数对列全</p>
<p class="s-b">和为 7 的样本点：(1,6)、(2,5)、(3,4)、(4,3)、(5,2)、(6,1)，共 6 个。第一枚每取 1 到 6 中一个值，第二枚就被唯一确定，所以正好 6 个，既没漏也没重。</p>
<p class="s-k">用到：k 与 n 在同一口径下数，都是有序数对。</p>
</li>
<li class="step" hidden>

<p class="s-b">和为 7：P = 6/36 = 1/6。和为 2：只有 (1,1) 一个样本点，P = 1/36。两个结果都在 [0,1] 内，符合 P(A) 的范围。</p>
<p class="s-k">用到：P(A) = k/n；和为 2 时 k = 1。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 回扣第 (3) 问：错在「只有一种凑法」</p>
<p class="s-b">和为 8 的样本点是 (2,6)、(3,5)、(4,4)、(5,3)、(6,2)，共 5 个，P = 5/36；和为 7 是 6 个，P = 1/6。若按无序数只数「凑法」，和为 7 会数成 3 种、和为 8 数成 2 种，两种口径得到的分数都不对——而且各「凑法」并不等可能，(4,4) 只有 1 个有序数对，(2,6) 有 2 个。</p>
<p class="s-k">用到：样本点要按有序数；等可能性要求每个样本点等可能，不是每种凑法等可能。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 掷两枚骰子，和为 7 有 3 种凑法（1+6、2+5、3+4），所以 P = 3/36。</p>
<p class="er-v">✓ 样本点按有序数对记，(1,6) 与 (6,1) 是两个样本点，和为 7 共 6 个样本点，P = 6/36 = 1/6。</p>
<p class="er-w">错在哪：漏解一半。样本点要按有序数，n = 36 是 6×6 的有序数对总数，k 必须用同一口径数，否则分子分母不在同一个样本空间。</p>
</div>
<div class="er">
<p class="er-x">✗ A 与 B 互斥，所以 A 与 B 对立。</p>
<p class="er-v">✓ A∩B = ∅ 只说明互斥；还要 A∪B = Ω 才能说对立。互斥不一定对立。</p>
<p class="er-w">错在哪：把「不能同时发生」当成「必有一个发生」。掷两枚骰子，和为 7 与和为 8 互斥但不对立——和可以是 9，两个都没发生。</p>
</div>
<div class="er">
<p class="er-x">✗ 不管什么情况，都有 P(A∪B) = P(A) + P(B)。</p>
<p class="er-v">✓ P(A∪B) = P(A) + P(B) 只对互斥成立；一般情形是 P(A∪B) = P(A) + P(B) − P(A∩B)。</p>
<p class="er-w">错在哪：不互斥时 A∩B 被加了两遍。若 P(A)=0.6、P(B)=0.7 且 A、B 不互斥，硬加得 1.3，概率已经越界，可模型本身完全合法。</p>
</div>
<div class="er">
<p class="er-x">✗ 概率为 0 的事件就是不可能事件，概率为 1 的事件就是必然事件。</p>
<p class="er-v">✓ 不可能事件概率必为 0，但概率为 0 的事件不一定不可能；只在有限等可能的古典概型里两者才等价。</p>
<p class="er-w">错在哪：把「P(∅)=0」当成充要条件。在 [0,1] 上任取一点，取到 0.5 的概率为 0，却是可能发生的。</p>
</div>
<div class="er">
<p class="er-x">✗ 只要样本点个数有限，就能用 P(A) = k/n。</p>
<p class="er-v">✓ 古典概型要同时满足有限与等可能；有限而不等可能时，P(A) = k/n 不成立。</p>
<p class="er-w">错在哪：漏掉「等可能」。骰子灌铅时样本点仍是 6 个，但各点出现的可能性不相等，只能用大量重复试验的频率估计概率。</p>
</div>
<div class="er">
<p class="er-x">✗ 用无序数对算：n = 21，和为 7 有 3 个，所以 P = 3/21 = 1/7。</p>
<p class="er-v">✓ 无序样本点不等可能（(4,4) 只有 1 个有序数对，(2,6) 有 2 个），不能作古典概型的样本空间。</p>
<p class="er-w">错在哪：分母换了口径却仍套 k/n。古典概型的前提被破坏，得到的 1/7 既不是概率也不是频率，只是算错的分数。</p>
</div>
<div class="er">
<p class="er-x">✗ 两个事件的概率相加超过 1，说明题目数据有问题。</p>
<p class="er-v">✓ P(A)+P(B) 可以大于 1，P(A∪B) 才必须不超过 1；不互斥时 P(A∪B) = P(A)+P(B) − P(A∩B)。</p>
<p class="er-w">错在哪：把「P(A) ≤ 1」的范围限制错记到「两个概率之和」上。范围只约束单个事件与并事件，不约束两个事件概率之和。</p>
</div>

document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var GX = window.GX, el = GX.el, tx = GX.tx, $ = GX.$;

  if (!stage || !window.AutoPilot) return;

  /* 两套坐标：宽屏 880×470，窄屏独立 360×700 */
  var W = { vb: "0 0 880 470", left: { x: 16, y: 16, w: 424, h: 438 }, right: { x: 456, y: 16, w: 408, h: 438 } };
  var N = { vb: "0 0 360 700", left: { x: 8, y: 8, w: 344, h: 300 }, right: { x: 8, y: 320, w: 344, h: 372 } };
  var L = W, A = 2;

  /* 纯函数：点数和 s → ways / p。render() 与 __model.cases 共用它 */
  function calc(v) {
    var s = Math.round(v);
    var ways = 6 - Math.abs(s - 7);
    return { s: s, ways: ways, p: ways / 36 };
  }

  /* 36 分之 ways 的约分写法 */
  function frac(w) {
    var g = 1, i;
    for (i = 2; i <= w; i++) { if (w % i === 0 && 36 % i === 0) g = i; }
    return g > 1 ? (w / g) + "/" + (36 / g) : w + "/36";
  }

  /* 中文按字数换行，避免长句冲出面板 */
  function wrap(parent, x, y, s, maxW, fs, col, lh) {
    var per = Math.max(6, Math.floor(maxW / fs)), lines = [], cur = "";
    for (var i = 0; i < s.length; i++) { cur += s.charAt(i); if (cur.length >= per) { lines.push(cur); cur = ""; } }
    if (cur) lines.push(cur);
    for (var k = 0; k < lines.length; k++) tx(parent, x, y + k * lh, lines[k], col, "start", fs, 400);
  }

  function draw() {
    var gA = $("gxA"), gB = $("gxB");
    gA.textContent = ""; gB.textContent = "";
    var d = calc(A), s = d.s, i, j;

    /* ================= 左：6×6 有序数对网格 ================= */
    el("rect", { x: L.left.x, y: L.left.y, width: L.left.w, height: L.left.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    tx(gA, L.left.x + 16, L.left.y + 26, "有序数对 (i, j)：n = 6 × 6 = 36", "#5a6472", "start", 10.5, 700);

    var cell = Math.min((L.left.w - 78) / 6, (L.left.h - 120) / 6);
    var x0 = L.left.x + 46, y0 = L.left.y + 64;
    var lf = Math.min(10, Math.max(8, cell * 0.34));

    for (i = 1; i <= 6; i++) {
      tx(gA, x0 - 9, y0 + (i - 0.5) * cell + 3.4, String(i), "#7b8593", "end", lf, 400);

          String(i + j), on ? "#ffffff" : "#c3cbd6", "middle", lf * 0.92, on ? 700 : 400);
      }
    }
    for (j = 1; j <= 6; j++) {
      tx(gA, x0 + (j - 0.5) * cell, y0 - 8, String(j), "#7b8593", "middle", lf, 400);
    }
    tx(gA, x0 - 9, y0 - 8, "i\\j", "#9aa4b0", "end", lf * 0.9, 700);

    var noteY = y0 + 6 * cell + 24;
    tx(gA, L.left.x + 16, noteY, "亮格 = 和为 " + s + " 的样本点，共 " + d.ways + " 个", "#2563eb", "start", 9.2, 700);
    wrap(gA, L.left.x + 16, noteY + 17, "每个格是一个样本点：(1,6) 与 (6,1) 算两个，样本点必须按有序数对记。", L.left.w - 32, 8.8, "#7b8593", 13);

    /* ================= 右：ways 条形图（11 根柱） ================= */
    el("rect", { x: L.right.x, y: L.right.y, width: L.right.w, height: L.right.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    tx(gB, L.right.x + 16, L.right.y + 26, "和为 s 的样本点数与概率", "#5a6472", "start", 10.5, 700);
    tx(gB, L.right.x + 16, L.right.y + 50, "ways = 6 − |s − 7| = " + d.ways, "#3a3a35", "start", 9.4, 400);
    tx(gB, L.right.x + 16, L.right.y + 70, "p = " + d.ways + "/36 = " + frac(d.ways) + " ≈ " + d.p.toFixed(3),
      "#2563eb", "start", 9.6, 700);

    var baseY = L.right.y + L.right.h - 44;
    var topY = L.right.y + 92;
    var maxH = baseY - topY;
    var step = (L.right.w - 52) / 11;
    var bx = L.right.x + 28;
    var k, ss, ww, bh;

    /* 坐标轴：带箭头与刻度 */
    el("line", { x1: bx, y1: baseY, x2: bx, y2: topY - 10, stroke: "#9aa4b0", "stroke-width": 1.1 }, gB);
    el("path", { d: "M" + bx + " " + (topY - 18) + " l4.2 8 h-8.4 z", fill: "#9aa4b0" }, gB);
    el("line", { x1: bx, y1: baseY, x2: bx + 11 * step + 4, y2: baseY, stroke: "#9aa4b0", "stroke-width": 1.1 }, gB);
    el("path", { d: "M" + (bx + 11 * step + 12) + " " + baseY + " l-8 -4.2 v8.4 z", fill: "#9aa4b0" }, gB);
    for (k = 0; k <= 6; k += 2) {
      var gy = baseY - (k / 6) * maxH;
      el("line", { x1: bx - 4, y1: gy, x2: bx, y2: gy, stroke: "#c3cbd6", "stroke-width": 1 }, gB);
      tx(gB, bx - 7, gy + 3, String(k), "#9aa4b0", "end", 8.2, 400);
    }

    for (k = 0; k < 11; k++) {
      ss = k + 2;
      ww = 6 - Math.abs(ss - 7);
      bh = (ww / 6) * maxH;
      var cx = bx + (k + 0.5) * step;
      var on2 = (ss === s);
      el("rect", {
        x: cx - step * 0.3, y: baseY - bh, width: step * 0.6, height: bh,
        rx: 2.5, fill: on2 ? "#2563eb" : "#dbe3ec", stroke: on2 ? "#1d4ed8" : "none"
      }, gB);
      tx(gB, cx, baseY + 15, String(ss), on2 ? "#2563eb" : "#9aa4b0", "middle", 8.6, on2 ? 700 : 400);
      if (on2) {
        tx(gB, cx, baseY - bh - 6, String(ww), "#2563eb", "middle", 9, 700);
      }
    }
    tx(gB, bx + 2, baseY + 30, "s（两枚骰子的点数和）", "#7b8593", "start", 8.4, 400);
    tx(gB, bx - 7, topY - 26, "ways", "#9aa4b0", "end", 8.4, 400);
  }

  function render() {
    var d = calc(A), st, col, bg, sn;
    $("gxVa").textContent = String(d.s);
    $("gxVb").textContent = String(d.ways);
    $("gxVc").textContent = frac(d.ways) + " ≈ " + d.p.toFixed(3);
    if (d.s === 7) {

    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 2 }, { t: 1.2, v: 2 }, { t: 4, v: 7 }, { t: 6.5, v: 7 },
           { t: 9, v: 12 }, { t: 11.5, v: 12 }, { t: 13, v: 2 }],

  });

  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
