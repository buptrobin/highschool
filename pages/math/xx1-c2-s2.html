<p class="gx-claim">直线的方程这一节只考一件事：<b>给定什么条件，选哪个形式</b>，以及<b>哪个形式在哪一格失效</b>——点斜式管不了竖直线，截距式管不了过原点，b 是纵截距不是距离。</p>
<div class="gx-meta">
<span><i></i>人教A版选择性必修第一册 第二章第二节</span>

<span><i></i>阅读 12 分钟</span>
<span><i></i>含 1 个互动模型</span>
</div>
<p class="gx-lede">上一节刚把「倾斜角与斜率」定下来，这一节就把它变成可以写进答题卡的方程。整章的路线是：斜率 → 方程 → 位置关系 → 距离，所以这一节是后面所有联立、平行垂直判断的地基。最容易错的一件事不是公式记不住，而是<b>不管条件够不够就往上套</b>：过点 (2,3) 且垂直于 x 轴的直线，点斜式一个字母都写不出来，因为它根本没有斜率。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 点斜式<span class="q-src">人教A版选择性必修第一册 · 第二章第二节</span></p>
<p class="q-b">经过点 P₀(x₀, y₀)、斜率为 k 的直线 l 的方程是 <span class="gx-fml">y − y₀ = k(x − x₀)</span>，这个方程叫做直线的点斜式方程。</p>
<p class="q-n">→ 翻成人话：这句话由<b>两个条件</b>组成（① 一个定点 P₀；② 斜率 k 存在且已知）。少一个都不行——斜率不存在时点斜式里 k 根本无处可放，那条竖直线只能另写成 x = x₀。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 斜截式<span class="q-src">人教A版选择性必修第一册 · 第二章第二节</span></p>
<p class="q-b">斜率是 k、纵截距是 b 的直线的方程是 <span class="gx-fml">y = kx + b</span>，这个方程叫做直线的斜截式方程。</p>
<p class="q-n">→ 两个条件（① k 存在；② b 是<b>纵截距</b>，即直线与 y 轴交点 (0, b) 的纵坐标）。b 是一个坐标，不是一个长度：它可以为负、可以为 0，写 |b| 就已经错了。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 一般式<span class="q-src">人教A版选择性必修第一册 · 第二章第二节</span></p>
<p class="q-b">关于 x、y 的二元一次方程 <span class="gx-fml">Ax + By + C = 0</span>（A、B 不同时为 0）都表示一条直线，它叫做直线的一般式方程。</p>
<p class="q-n">→ 三个条件（① A、B、C 是实数；② A、B 不同时为 0；③ 允许 A = 0 或 B = 0）。第三条正是一般式的价值：它把竖直线 x = x₀ 也收进来了，所以「所有直线都能写成一般式」。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>形式</th><th>成立要什么条件</th><th>缺了这个条件会怎样</th></tr></thead>
<tbody>
<tr><td>点斜式 y − y₀ = k(x − x₀)</td><td>斜率 k 存在</td><td>竖直线 x = x₀ 写不出来，只能单独写，答题时漏掉这一类就丢分</td></tr>
<tr><td>斜截式 y = kx + b</td><td>斜率 k 存在；b 是纵截距</td><td>b 取负值时若写成 |b|，直线会画到 y 轴另一侧；k 不存在时同样失效</td></tr>
<tr><td>两点式 (y − y₁)/(y₂ − y₁) = (x − x₁)/(x₂ − x₁)</td><td>x₁ ≠ x₂ 且 y₁ ≠ y₂</td><td>水平线、竖直线都不能用（分母为 0），要先单独判断</td></tr>
<tr><td>截距式 x/a + y/b = 1</td><td>a ≠ 0 且 b ≠ 0（两个截距都不为 0）</td><td>过原点的直线、与坐标轴平行的直线都不能用，因为截距是 0 或不存在</td></tr>
<tr class="key"><td>一般式 Ax + By + C = 0</td><td>A、B 不同时为 0</td><td>能表示平面上任意一条直线，包括竖直线——所以它是最保险的收尾形式</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">背法只有两句：先问「<b>斜率存在吗</b>」，再问「<b>过不过原点</b>」。第一个问题决定能不能用点斜式/斜截式，第二个决定能不能用截距式；两个问题都含糊，就直接写一般式。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 由点与斜率求方程<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">已知直线 l 经过点 P(1, 2)，且斜率为 −3。<br>（1）求直线 l 的方程，并化成一般式；<br>（2）判断点 Q(0, 5) 是否在直线 l 上。<br>陷阱：题目若改成「经过点 (1, 2) 且垂直于 x 轴」，斜率不存在，上面的解法整条作废。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题：条件够不够用点斜式</p>
<p class="s-b">题目给了一个定点 P(1, 2) 和一个斜率 k = −3，正好是点斜式的两个条件。斜率给出且是个实数，说明斜率存在，不必讨论竖直线。</p>
<p class="s-k">用到：点斜式需要「定点 + 斜率」两个条件，缺一不可。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 代点斜式</p>
<p class="s-b">把 x₀ = 1、y₀ = 2、k = −3 代进 <span class="gx-fml">y − y₀ = k(x − x₀)</span>，得 y − 2 = −3(x − 1)。注意两个括号里都是「坐标减坐标」，别写成 x + 1。</p>
<p class="s-k">用到：点斜式的标准形式，减号是坐标差的意思。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 化成斜截式看结构</p>
<p class="s-b">展开右边：y − 2 = −3x + 3，移项得 y = −3x + 5。由此读到 k = −3、b = 5，直线与 y 轴交于 (0, 5)，与 x 轴交于 (5/3, 0)。</p>
<p class="s-k">用到：斜截式 y = kx + b 中 b 是纵截距，5 是正数，交点在 y 轴正半轴。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 化成一般式</p>
<p class="s-b">把 y = −3x + 5 全移到一边：3x + y − 5 = 0。整理标准是「x 项、y 项、常数项」依次排列，且让 x 的系数为正，这样同一根直线的写法才唯一。</p>
<p class="s-k">用到：一般式 Ax + By + C = 0，要求 A、B 不同时为 0，这里 A = 3、B = 1。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 验算并回答第 (2) 问</p>
<p class="s-b">代 P(1, 2)：3×1 + 2 − 5 = 0 ✓。代 Q(0, 5)：3×0 + 5 − 5 = 0 ✓，所以 Q 在直线 l 上——它其实就是 y 轴截距点。</p>
<p class="s-k">用到：点在直线上 ⇔ 坐标满足方程，这一步能兜住前面所有的算错。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）∵ 直线 l 经过点 P(1, 2)，斜率 k = −3，<br>∴ 由点斜式得 y − 2 = −3(x − 1)，<br>即 y = −3x + 5，<br>化成一般式得 3x + y − 5 = 0。<br>（2）将 Q(0, 5) 的坐标代入 3x + y − 5：3×0 + 5 − 5 = 0，等式成立，<br>∴ 点 Q(0, 5) 在直线 l 上。<br>【易错提醒】若题设为「垂直于 x 轴」，则斜率不存在，应直接写 x = 1，不能套点斜式。</p>
</div>
</div>
</section>
<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「点斜式和斜截式不是万能的吗？竖直线怎么就不行了？」</p>
<p class="a">因为竖直线<b>没有斜率 k</b>，点斜式与斜截式里那个 k 位置是空的。竖直线只能写成 <b>x = x₀</b>，或写成一般式 x − x₀ = 0。题目说「垂直于 x 轴」「倾斜角 90°」时，第一反应就该是它。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="竖直线x=x0没有斜率">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="30" y1="70" x2="210" y2="70" stroke="#98a4b0" stroke-width="1"/>
<line x1="120" y1="112" x2="120" y2="26" stroke="#98a4b0" stroke-width="1"/>
<line x1="90" y1="26" x2="90" y2="112" stroke="#b8402f" stroke-width="2"/>
<text x="96" y="36" font-size="8.6" fill="#b8402f">x = x₀</text>
<text x="60" y="86" font-size="8.2" fill="#b8402f">Δx = 0 ⇒ k 不存在</text>
</svg>
</div>

<div class="qac">
<p class="q">「纵截距 b 会是负的吗？截距不是长度吗？」</p>
<p class="a">可以是负的，也可以是 0。<b>截距是交点坐标，不是距离</b>：直线与 y 轴交于 (0, b)，b &lt; 0 就说明交点在 y 轴负半轴。只有问「距离」时才取 |b|，而且要写清是「原点到交点的距离」。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="纵截距b可以为负">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="26" y1="62" x2="214" y2="62" stroke="#98a4b0" stroke-width="1"/>
<line x1="110" y1="116" x2="110" y2="20" stroke="#98a4b0" stroke-width="1"/>
<line x1="40" y1="40" x2="200" y2="86" stroke="#2563eb" stroke-width="2"/>
<circle cx="110" cy="62" r="2.6" fill="#b8402f"/>
<text x="116" y="58" font-size="8.2" fill="#b8402f">(0, 0)</text>
<circle cx="110" cy="95" r="2.6" fill="#2f8a5b"/>
<text x="116" y="99" font-size="8.2" fill="#2f8a5b">(0, −2)，b = −2</text>
</svg>
</div>

<div class="qac">
<p class="q">「截距式 x/a + y/b = 1 什么时候不能用？」</p>
<p class="a">只要有一个截距为 0 就不能用：<b>过原点</b>的直线两个截距都是 0，<b>垂直于 x 轴</b>的直线没有 y 截距，<b>垂直于 y 轴</b>的直线没有 x 截距。所以截距式要求两个截距都不为 0，用之前先确认直线不过原点、也不与坐标轴平行。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="截距式为0时失效">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="26" y1="70" x2="214" y2="70" stroke="#98a4b0" stroke-width="1"/>
<line x1="110" y1="116" x2="110" y2="20" stroke="#98a4b0" stroke-width="1"/>
<line x1="40" y1="100" x2="190" y2="40" stroke="#b8402f" stroke-width="2"/>
<circle cx="110" cy="70" r="3" fill="#b8402f"/>
<text x="118" y="88" font-size="8.2" fill="#b8402f">过原点：a = b = 0</text>
<text x="30" y="40" font-size="8.2" fill="#8a95a1">x/a + y/b = 1 失效</text>
</svg>
</div>

<div class="qac">
<p class="q">「都有斜截式了，一般式还要它干什么？」</p>
<p class="a">因为只有一般式<b>能表示所有直线</b>，包括 x = x₀ 这种没有斜率的。它还有个好处：判断平行与垂直时可以直接看系数（A₁B₂ − A₂B₁ = 0 为平行），不用先讨论斜率是否存在。所以课本把一般式当作最后的统一形式。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="一般式包含所有直线">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="44" y1="80" x2="194" y2="80" stroke="#98a4b0" stroke-width="1"/>
<line x1="76" y1="114" x2="76" y2="26" stroke="#98a4b0" stroke-width="1"/>
<line x1="52" y1="96" x2="176" y2="36" stroke="#2f8a5b" stroke-width="2"/>
<line x1="140" y1="112" x2="140" y2="30" stroke="#2563eb" stroke-width="2"/>
<text x="146" y="40" font-size="8.2" fill="#2563eb">x = 2 也是直线</text>
<text x="196" y="100" font-size="9.4" font-weight="700" fill="#3a3a35">✓</text>
</svg>
</div>

<div class="qac">
<p class="q">「题目给的截距是 3，那 b 就是 3 吧？」</p>
<p class="a">要看是哪个截距。斜截式 y = kx + b 里的 b <b>只是纵截距</b>；横截距是直线与 x 轴交点的横坐标，得令 y = 0 解出来，对 y = kx + b 就是 −b/k。两个都叫「截距」，但一个是 b，一个是 −b/k，混用会把直线画错一整格。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="纵截距与横截距的区别">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="26" y1="92" x2="214" y2="92" stroke="#98a4b0" stroke-width="1"/>
<line x1="76" y1="116" x2="76" y2="22" stroke="#98a4b0" stroke-width="1"/>
<line x1="40" y1="112" x2="180" y2="30" stroke="#2563eb" stroke-width="2"/>
<circle cx="76" cy="48" r="2.8" fill="#b8791f"/>
<text x="82" y="45" font-size="8.2" fill="#b8791f">纵截距 b</text>
<circle cx="152" cy="92" r="2.8" fill="#2f8a5b"/>
<text x="128" y="108" font-size="8.2" fill="#2f8a5b">横截距 −b/k</text>
</svg>
</div>

<div class="qac">
<p class="q">「两点式和点斜式是两个公式要背吗？」</p>
<p class="a">只要背一个。两点式就是<b>先用两点算出斜率 k，再代点斜式</b>：k = (y₂ − y₁)/(x₂ − x₁)，然后 y − y₁ = k(x − x₁)，整理即得两点式。记住这个来源，就不必担心 x₁ = x₂ 或 y₁ = y₂ 时公式失效——那时你本来就知道该另写 x = x₀ 或 y = y₀。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="两点式由点斜式推出">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="26" y1="100" x2="214" y2="100" stroke="#98a4b0" stroke-width="1"/>
<line x1="52" y1="116" x2="52" y2="22" stroke="#98a4b0" stroke-width="1"/>
<line x1="52" y1="100" x2="196" y2="36" stroke="#2563eb" stroke-width="2"/>
<circle cx="88" cy="82" r="3" fill="#b8402f"/>
<circle cx="160" cy="52" r="3" fill="#b8402f"/>
<text x="62" y="88" font-size="8.2" fill="#b8402f">(x₁, y₁)</text>
<text x="166" y="50" font-size="8.2" fill="#b8402f">(x₂, y₂)</text>
<text x="96" y="118" font-size="8" fill="#8a95a1">先算 k，再代点斜式</text>
</svg>
</div>
</div>
<p class="gx-note">收尾一句：这六问其实是同一件事——<b>每个形式都有自己的「适用条件」</b>，先查条件再用公式，比背五个公式管用。三处必踩的坑是：点斜式表示不了竖直线、b 是纵截距不是距离、截距式要求两个截距都不为 0。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 过点 (2, 3) 且垂直于 x 轴的直线：y − 3 = k(x − 2)，k 不存在就写 k = 0</p>
<p class="er-v">✓ 斜率不存在时，直线方程为 x = 2（也可写成 x − 2 = 0，这是一般式）</p>
<p class="er-w">错在哪：点斜式<b>表示不了竖直线</b>——竖直线根本没有斜率，不存在「k 取 0」这回事，k = 0 是水平线 y = 3。</p>
</div>
<div class="er">
<p class="er-x">✗ 直线 y = 2x − 4 的纵截距是 4，因为它到原点的距离是 4</p>
<p class="er-v">✓ 纵截距 b = −4，直线与 y 轴交于 (0, −4)；到原点的距离 |b| = 4 是另一个概念</p>
<p class="er-w">错在哪：<b>b 是纵截距，是交点的纵坐标，可为负</b>；把它当距离取绝对值，直线就被搬到了 y 轴正半轴，图画错、象限也全错。</p>
</div>
<div class="er">
<p class="er-x">✗ 过原点的直线斜率为 2，由截距式得 x/0 + y/0 = 1</p>
<p class="er-v">✓ 截距式要求两个截距都不为 0，过原点时不能用，应写 y = 2x</p>
<p class="er-w">错在哪：<b>截距式要求两个截距都不为 0</b>，a = 0 或 b = 0 时分母为 0，式子本身就没意义。</p>
</div>
<div class="er">
<p class="er-x">✗ 方程 Ax + By + C = 0 都表示直线，比如 0·x + 0·y + 1 = 0 表示 x 轴</p>
<p class="er-v">✓ 一般式必须 A、B 不同时为 0；A = B = 0 时方程变成 C = 0，不是直线</p>
<p class="er-w">错在哪：漏掉了「A、B 不同时为 0」这一条，这是判断一个方程是否为一般式的<b>唯一门槛</b>。</p>
</div>
<div class="er">
<p class="er-x">✗ 由 y = −3x + 5 得一般式：y = −3x + 5</p>
<p class="er-v">✓ 移项整理为 3x + y − 5 = 0（x 的系数取正，按 x、y、常数排列）</p>
<p class="er-w">错在哪：一般式必须是 <b>Ax + By + C = 0</b> 的规范形状；只移一半、留着等号右边的数，或把系数写成 −3x − y + 5 = 0，都不算化到一般式。</p>
</div>
<div class="er">
<p class="er-x">✗ 由点斜式 y − 2 = −3(x − 1) 直接读斜截距 b = 2</p>
<p class="er-v">✓ 先化成 y = −3x + 5，再读 k = −3、b = 5</p>
<p class="er-w">错在哪：把点斜式里的 y₀ = 2 当成了 b。<b>b 只有在 y = kx + b 这个形状里才是纵截距</b>，其他形式里的数字都有自己的身份。</p>
</div>
<div class="er">
<p class="er-x">✗ 直线在两轴上的截距相等，所以斜率一定是 −1</p>
<p class="er-v">✓ 截距相等要分两类：a = b ≠ 0 时斜率 −1；a = b = 0（过原点）时截距式失效，斜率任意</p>
<p class="er-w">错在哪：又一次倒在「<b>截距可以为 0</b>」上。截距相等 ⇒ 漏掉过原点这一类，是压轴小题的经典陷阱。</p>
</div>

<script>

  var N = { vb: "0 0 360 700", left: { x: 8, y: 8, w: 344, h: 300 }, right: { x: 8, y: 320, w: 344, h: 372 } };

  /* 纯函数：纵截距 b → 两个截距与所过象限。render() 和 __model.cases 都用它 */

    roundRect(g, l.x, l.y, l.w, l.h, 10, "#f8fbfd", "#dbe7ef");

    tx(g, l.x + 18, l.y + 44, "当前 b = " + fmt(s.b), "#94a1ae", "start", 9.6 * k, 400);

    el("path", { d: "M0,0 L7,3.2 L0,6.4 Z", fill: "#98a4b0" }, mk);

    tx(g, px(-2.5), py(3.5), "Ⅱ", "#d4dde5", "middle", 14, 700);
    tx(g, px(-2.5), py(-3.5), "Ⅲ", "#d4dde5", "middle", 14, 700);
    tx(g, px(2.4), py(-3.5), "Ⅳ", "#d4dde5", "middle", 14, 700);

    el("line", { x1: l.x + 18, y1: G.cy, x2: l.x + l.w - 14, y2: G.cy, stroke: "#98a4b0", "stroke-width": 1.2, "marker-end": "url(#gxax)" }, g);
    el("line", { x1: G.cx, y1: l.y + l.h - 10, x2: G.cx, y2: l.y + 16, stroke: "#98a4b0", "stroke-width": 1.2, "marker-end": "url(#gxax)" }, g);
    tx(g, l.x + l.w - 14, G.cy + 16, "x", "#98a4b0", "middle", 10, 400);
    tx(g, G.cx + 12, l.y + 20, "y", "#98a4b0", "start", 10, 400);

    for (i = -4; i <= 4; i++) {
      if (i === 0) continue;
      el("line", { x1: px(i), y1: G.cy - 4, x2: px(i), y2: G.cy + 4, stroke: "#c3ccd6", "stroke-width": 1 }, g);
      el("line", { x1: G.cx - 4, y1: py(i), x2: G.cx + 4, y2: py(i), stroke: "#c3ccd6", "stroke-width": 1 }, g);
      tx(g, px(i), G.cy + 16, fmt(i), "#94a1ae", "middle", 8.2, 400);
      tx(g, G.cx - 9, py(i) + 3, fmt(i), "#94a1ae", "end", 8.2, 400);
    }
    tx(g, G.cx - 8, G.cy + 15, "O", "#8a95a1", "end", 9, 400);

    var sg = seg(s.b);
    if (sg) el("line", { x1: sg[0], y1: sg[1], x2: sg[2], y2: sg[3], stroke: "#2563eb", "stroke-width": 2.4, "stroke-linecap": "round" }, g);

    if (s.b === 0) {
      el("circle", { cx: G.cx, cy: G.cy, r: 9, fill: "none", stroke: "#b8791f", "stroke-width": 1.4, "stroke-dasharray": "4 3" }, g);
      el("circle", { cx: G.cx, cy: G.cy, r: 3.4, fill: "#b8791f" }, g);
      tx(g, G.cx + 16, G.cy + 36, "过原点：两个截距都是 0", "#b8791f", "start", 9.2, 700);
      tx(g, G.cx + 16, G.cy + 51, "截距式 x/a + y/b = 1 失效", "#b8791f", "start", 9, 400);
    } else {
      el("circle", { cx: px(0), cy: py(s.y0), r: 4, fill: "#2f8a5b" }, g);
      el("circle", { cx: px(s.x0), cy: G.cy, r: 4, fill: "#b8791f" }, g);
      var lx = px(0) + 10, ly = py(s.y0) + (s.b > 0 ? 16 : -9);
      tx(g, lx, ly, "(0, " + fmt(s.b) + ")", "#2f8a5b", "start", 9.2, 700);
      tx(g, px(s.x0), G.cy + 34, "(" + fmt(s.x0) + ", 0)", "#b8791f", "middle", 9.2, 700);
      el("line", { x1: px(s.x0), y1: G.cy + 5, x2: px(s.x0), y2: G.cy + 25, stroke: "#b8791f", "stroke-width": 0.8, "stroke-dasharray": "3 2" }, g);
    }
  }

  function drawRight(g, s) {
    var R = L.right, rx = R.x + 20, iw = R.w - 40, k = Math.min(1, iw / 344);
    var y1 = R.y + 26, y2 = y1 + 30, y3 = y2 + 14, y4 = y3 + 22, y5 = y4 + 22,
        y6 = y5 + 28, y7 = y6 + 22, y8 = y7 + 12, y9 = y8 + 20, y10 = y9 + 28,
        y11 = y10 + 14, y12 = y11 + 20, y13 = y12 + 21, y14 = y13 + 34;
    var col = s.b > 0 ? "#2f8a5b" : (s.b === 0 ? "#b8791f" : "#2563eb");

    roundRect(g, R.x, R.y, R.w, R.h, 10, "#ffffff", "#e6e9ee");
    tx(g, rx, y1, "当前方程", "#94a1ae", "start", 9.8 * k, 400);
    tx(g, rx, y2, "y = 2x" + (s.b === 0 ? "" : (s.b > 0 ? " + " + s.b : " − " + Math.abs(s.b))), "#151a21", "start", 19 * k, 700);
    el("line", { x1: rx, y1: y3, x2: rx + iw, y2: y3, stroke: "#eef2f6", "stroke-width": 1 }, g);

    tx(g, rx, y4, "与 y 轴交点 (0, b)", "#5a6472", "start", 9.6 * k, 400);
    tx(g, rx, y5, "(0, " + fmt(s.y0) + ")", "#2f8a5b", "start", 13 * k, 700);
    tx(g, rx, y6, "与 x 轴交点 (−b/2, 0)", "#5a6472", "start", 9.6 * k, 400);
    tx(g, rx, y7, "(" + fmt(s.x0) + ", 0)", "#b8791f", "start", 13 * k, 700);

    el("line", { x1: rx, y1: y8, x2: rx + iw, y2: y8, stroke: "#eef2f6", "stroke-width": 1 }, g);

  }

  function draw() {
    var gA = $("gxA"), gB = $("gxB");
    gA.textContent = ""; gB.textContent = "";

    drawLeft(gA, s);

  function render() {

    var s = calc(B), col, bg;

    $("gxVa").textContent = fmt(s.b);
    $("gxVb").textContent = fmt(s.x0);

    keys: [-4, 0, 2, 4],
