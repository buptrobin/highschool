<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边的教材句子，不写右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 全称量词<span class="q-src">人教A版必修第一册 · 第一章第五节</span></p>
<p class="q-b">"所有的""任意一个"在逻辑中通常叫做全称量词，用符号 ∀ 表示。含有全称量词的命题，叫做全称量词命题。</p>
<p class="q-n">→ 翻成人话：句子里出现「所有 / 任意 / 每一个 / 一切 / 都」，它就是全称量词命题，写成 <span class="gx-fml">∀x∈M, p(x)</span>。它由<b>两个条件</b>组成：① 范围 M 写死；② M 里的<b>每一个</b> x 都让 p(x) 成立。少一个都判假。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 存在量词<span class="q-src">人教A版必修第一册 · 第一章第五节</span></p>
<p class="q-b">"存在一个""至少有一个"在逻辑中通常叫做存在量词，用符号 ∃ 表示。含有存在量词的命题，叫做存在量词命题。</p>
<p class="q-n">→ 翻成人话：句子里出现「存在 / 至少有一个 / 有解 / 能找到」，就是存在量词命题，写成 <span class="gx-fml">∃x∈M, p(x)</span>。同样<b>两个条件</b>：① 范围 M 写死；② M 里<b>至少揪出一个</b> x 让 p(x) 成立，揪出来就赢，不用管别人。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 两条否定规则<span class="q-src">人教A版必修第一册 · 第一章第五节</span></p>
<p class="q-b">全称量词命题的否定是存在量词命题：¬(∀x∈M, p(x)) ⇔ ∃x∈M, ¬p(x)。存在量词命题的否定是全称量词命题：¬(∃x∈M, p(x)) ⇔ ∀x∈M, ¬p(x)。</p>
<p class="q-n">→ 翻成人话：这两条其实只有<b>一个动作组合</b>——量词换掉（∀ ⇔ ∃），结论取反（p(x) → ¬p(x)），范围 M 一个字都不动。两条缺一条就不是否定。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>否定三条件</th><th>只做到一半会怎样</th></tr></thead>
<tbody>
<tr><td>① 换量词：∀ 变 ∃（或 ∃ 变 ∀）</td><td>量词不动，写出来的句子与原句真假同步，绝不是否定</td></tr>
<tr><td>② 否结论：p(x) 变 ¬p(x)</td><td>结论不动，只把量词挪了个位置，等于换了个说法，真值没反过来</td></tr>
<tr><td>③ 范围不动：x∈M 原样照抄</td><td>顺手把 M 改大或改小，否定的是「另一个范围内的命题」，答非所问</td></tr>
<tr class="key"><td>①② 必须同时做</td><td>漏任何一条，「否定」就变成另一个命题，这是本节第一大扣分点</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">口径提醒：本节说的「否定」都是<b>命题的否定</b>——只否定结论，真假正好相反。别和「否命题」混：只有「若 p 则 q」这种形式才谈否命题（若 ¬p 则 ¬q），量词命题只谈否定。另外「∀ 命题为假」的判据是<b>存在一个反例</b>，不是「全部都不成立」。</p>
</section>

<section class="gx-sec" id="b">
<h2><span class="sn">02</span>拆开看</h2>
<p class="gx-h2s">四张图：各讲一件事，按「怎么读 → 怎么否 → 怎么算 → 怎么判断」排。</p>

<figure class="gx-fig">
<div class="fig-cap">
<span class="fig-no">图 1</span><span class="fig-t">∀ 与 ∃ 的读法：一个挑全部，一个揪一个</span>
<span class="bdg bdg-must">必考</span>
</div>
<p class="fig-s">先看符号，再看它后面跟的那个「范围 M」——量词决定的是<b>要检查多少个 x</b>，M 决定的是<b>在哪儿检查</b>。∀ 要求全查一遍，∃ 只要求查到一个。判断真假时，先问自己「我需要检查几个」。</p>
<div class="gx-svgbox">
<svg viewBox="0 0 820 260" role="img" aria-label="全称量词与存在量词的符号、读法、例子与真假判据对照">
<rect x="16" y="16" width="788" height="228" rx="10" fill="#f8fbfd" stroke="#dbe7ef"/>
<text x="36" y="42" font-size="11.5" font-weight="700" fill="#151a21">两个量词只差一件事：要检查「全部」还是「一个」</text>
<rect x="40" y="58" width="358" height="176" rx="8" fill="#ffffff" stroke="#b8cdf0"/>
<text x="56" y="86" font-size="15" font-weight="700" fill="#2563eb">∀  全称量词</text>
<text x="56" y="110" font-size="9.6" fill="#3a3a35">读作：对任意一个 / 所有的 / 每一个</text>
<text x="56" y="132" font-size="9.4" fill="#2f8a5b">例：∀x∈R，x²≥0　真（每个都成立）</text>
<text x="56" y="152" font-size="9.4" fill="#b8402f">例：∀x∈R，x²&gt;0　假（x=0 就不行）</text>
<text x="56" y="180" font-size="9.4" fill="#3a3a35">判真：范围内随便挑一个都必须成立</text>
<text x="56" y="199" font-size="9.4" fill="#3a3a35">判假：揪出 1 个反例就够，不用全查</text>
<text x="56" y="220" font-size="9.4" fill="#5a6472">一句话：∀ 是「一个都不能漏」</text>
<rect x="422" y="58" width="358" height="176" rx="8" fill="#ffffff" stroke="#b8e6d0"/>
<text x="438" y="86" font-size="15" font-weight="700" fill="#2f8a5b">∃  存在量词</text>
<text x="438" y="110" font-size="9.6" fill="#3a3a35">读作：存在一个 / 至少有一个 / 有</text>
<text x="438" y="132" font-size="9.4" fill="#2f8a5b">例：∃x∈R，x²=2　真（x=√2 就行）</text>
<text x="438" y="152" font-size="9.4" fill="#b8402f">例：∃x∈R，x²&lt;0　假（一个都找不到）</text>
<text x="438" y="180" font-size="9.4" fill="#3a3a35">判真：能揪出 1 个成立的就够了</text>
<text x="438" y="199" font-size="9.4" fill="#3a3a35">判假：要说明范围内全部都不成立</text>
<text x="438" y="220" font-size="9.4" fill="#5a6472">一句话：∃ 是「有一个就算赢」</text>
</svg>
<span class="gx-zoomchip">点击放大</span>
</div>
<p class="gx-take">∀ 判假只需一个反例，∃ 判真只需一个实例——两个量词的「省力方向」正好相反。</p>
</figure>

<figure class="gx-fig">
<div class="fig-cap">
<span class="fig-no">图 2</span><span class="fig-t">否定的两条规则：换量词 ＋ 否结论</span>
<span class="bdg bdg-key">辨析</span>
</div>
<p class="fig-s">两条规则长得对称，其实只是同一个动作套在两处：<b>量词对调</b>、<b>结论加 ¬</b>。看图时数一数箭头有几个——两个箭头都走完才算否定，只走一个是本节最常见的错。</p>
<div class="gx-svgbox">
<svg viewBox="0 0 820 248" role="img" aria-label="全称量词命题与存在量词命题的否定规则，换量词加否结论">
<rect x="16" y="16" width="788" height="220" rx="10" fill="#f8fbfd" stroke="#dbe7ef"/>
<text x="36" y="42" font-size="11.5" font-weight="700" fill="#151a21">否定 = 换量词 ＋ 否结论（两个方向各一次）</text>
<rect x="40" y="56" width="740" height="66" rx="8" fill="#eef4ff" stroke="#c7d8f5"/>
<text x="58" y="82" font-size="12.5" font-weight="700" fill="#2563eb">¬(∀x∈M, p(x))　⇔　∃x∈M, ¬p(x)</text>
<text x="58" y="106" font-size="9.4" fill="#3a3a35">动作：∀ 换成 ∃，再把 p(x) 换成 ¬p(x)；范围 M 不动</text>
<rect x="40" y="130" width="740" height="66" rx="8" fill="#e9f7f0" stroke="#b8e6d0"/>
<text x="58" y="156" font-size="12.5" font-weight="700" fill="#2f8a5b">¬(∃x∈M, p(x))　⇔　∀x∈M, ¬p(x)</text>
<text x="58" y="180" font-size="9.4" fill="#3a3a35">动作：∃ 换成 ∀，再把 p(x) 换成 ¬p(x)；范围 M 不动</text>
<text x="40" y="219" font-size="9.6" fill="#b8402f">✗ 只换量词、不否结论：写出来的是「另一个命题」，不是原命题的否定。</text>
</svg>
<span class="gx-zoomchip">点击放大</span>
</div>
<p class="gx-take">否定要同时换量词和否结论：只换量词得到的是新命题，只否结论得到的是半成品，两个都不给分。</p>
<p class="gx-note">自查手法：把否定句再否定一次，能回到原句才算对。<b>¬(¬(∀x,p(x)))</b> 应该等于 <b>∀x,p(x)</b>。</p>
</figure>
<figure class="gx-fig">
<div class="fig-cap">

<section class="gx-sec" id="c">
<h2><span class="sn">03</span>自己拖一下<span class="bdg bdg-must">核心</span></h2>
<p class="gx-h2s">拖「参数 a」，看抛物线怎么在 x 轴上进出，右边三个数怎么跟着变。</p>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 恒成立求参数范围<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">已知命题「∀x∈R，x²+ax+1&gt;0」是真命题，求实数 a 的取值范围。<br>（2）若把条件改为「∀x∈R，x²+ax+1≥0」，答案怎么变？——这一问是本题的陷阱点。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 把命题翻译成图形</p>
<p class="s-b">这是全称量词命题，范围是全体实数，所以要求抛物线 y=x²+ax+1 上的每一个点都在 x 轴上方。二次项系数 1&gt;0，开口向上，于是问题变成「抛物线与 x 轴有几个交点」。</p>
<p class="s-k">用到：全称量词命题的含义（范围内每个 x 都要成立）、二次函数图象与 x 轴的位置关系。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 写出判据</p>
<p class="s-b">整条抛物线在 x 轴上方 ⇔ 与 x 轴没有交点 ⇔ 方程 x²+ax+1=0 无实根 ⇔ Δ&lt;0。其中 Δ=a²−4·1·1=a²−4。</p>
<p class="s-k">用到：判别式 Δ=b²−4ac，以及「Δ&lt;0 ⇔ 无实根」。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 解不等式</p>
<p class="s-b">由 a²−4&lt;0 得 (a−2)(a+2)&lt;0，所以 −2&lt;a&lt;2。注意这是开区间，两个端点都不取。</p>
<p class="s-k">用到：一元二次不等式的解法（因式分解 + 定区间）。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 单独验边界（最容易丢分）</p>
<p class="s-b">代入 a=2：式子变成 x²+2x+1=(x+1)²，取 x=−1 时它等于 0，不满足 &gt;0，所以 a=2 不成立；代入 a=−2 得 (x−1)²，同理 x=1 时等于 0。可见 |a|=2 时 Δ=0，顶点正好压在 x 轴上，那一点等于 0，不满足 &gt;0，因此端点必须舍去。</p>
<p class="s-k">用到：临界情形的单独检验、反例把一个 ∀ 命题推翻的手法。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 变式：把 &gt;0 换成 ≥0</p>
<p class="s-b">条件放宽成「允许等于 0」，抛物线可以与 x 轴相切，于是判据从 Δ&lt;0 放宽为 Δ≤0，即 a²−4≤0，解得 −2≤a≤2。差别只在两个端点，但答案从开区间变成闭区间。</p>
<p class="s-k">用到：「&gt;0 恒成立 ⇔ Δ&lt;0」与「≥0 恒成立 ⇔ Δ≤0」这一对对应关系。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）因为 1&gt;0，抛物线 y=x²+ax+1 开口向上，故 ∀x∈R，x²+ax+1&gt;0 恒成立 ⇔ Δ=a²−4&lt;0，解得 −2&lt;a&lt;2。<br>当 a=2 时，x²+2x+1=(x+1)²，x=−1 时值为 0，不满足 &gt;0；当 a=−2 时，x²−2x+1=(x−1)²，x=1 时值为 0，同理不满足。故端点不取。<br>所以 a 的取值范围是 (−2, 2)。<br>（2）若改为 ≥0 恒成立，则允许相切，条件放宽为 Δ=a²−4≤0，解得 −2≤a≤2，即 [−2, 2]。</p>
</div>
</div>
</section>
<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">写一个命题的否定，到底要改几个地方？</p>
<p class="a">改两个：<b>换量词</b>（∀ ⇄ ∃）＋<b>否结论</b>（p(x) → ¬p(x)）。范围 M 一个字不动。只换一个，写出来的就不是否定。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="否定需要换量词和否结论两个动作">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="34" text-anchor="middle" font-size="9" font-weight="700" fill="#151a21">否定 = 两个动作同时做</text>
<rect x="20" y="46" width="86" height="32" rx="6" fill="#eef4ff" stroke="#c7d8f5"/>
<text x="63" y="67" text-anchor="middle" font-size="11" font-weight="700" fill="#2563eb">∀ ⇄ ∃</text>
<text x="120" y="68" text-anchor="middle" font-size="12" fill="#5a6472">+</text>
<rect x="136" y="46" width="84" height="32" rx="6" fill="#e9f7f0" stroke="#b8e6d0"/>
<text x="178" y="67" text-anchor="middle" font-size="11" font-weight="700" fill="#2f8a5b">p → ¬p</text>
<text x="120" y="108" text-anchor="middle" font-size="8.6" fill="#b8402f">少走一个，就不是否定</text>
</svg>
</div>
<div class="qac">
<p class="q">要说明「∀x∈M，p(x)」是假命题，需要举几个反例？</p>
<p class="a"><b>一个就够</b>。找到一个 x₀∈M 使 p(x₀) 不成立，全称量词命题立刻为假；反过来，要证它为真才必须覆盖 M 里的每一个 x。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="数轴上一个反例推翻全称命题">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="30" y1="66" x2="212" y2="66" stroke="#9aa4b2" stroke-width="1.1"/>
<circle cx="76" cy="66" r="4" fill="#2f8a5b"/>
<circle cx="120" cy="66" r="5" fill="#b8402f"/>
<circle cx="166" cy="66" r="4" fill="#2f8a5b"/>
<text x="120" y="50" text-anchor="middle" font-size="11" font-weight="700" fill="#b8402f">✗</text>
<text x="120" y="92" text-anchor="middle" font-size="8.6" fill="#3a3a35">这一个不成立，命题就假</text>
<text x="120" y="114" text-anchor="middle" font-size="8.6" font-weight="700" fill="#b8402f">不需要把反例全列出来</text>
</svg>
</div>
<div class="qac">
<p class="q">「所有 x 都满足 p」的否定，是「所有 x 都不满足 p」吗？</p>
<p class="a">不是。否定是<b>存在一个 x 不满足 p</b>——只要有一个例外就够。「所有都不」比原句还强，它和原句可以同时为假。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="所有都满足的否定是存在一个不满足">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="36" text-anchor="middle" font-size="8.6" fill="#3a3a35">原句：∀x，p(x)</text>
<text x="120" y="66" text-anchor="middle" font-size="8.6" fill="#b8402f">✗ ∀x，¬p(x)　（所有都不）</text>
<text x="120" y="94" text-anchor="middle" font-size="8.6" font-weight="700" fill="#2f8a5b">✓ ∃x，¬p(x)　（有一个不）</text>
<text x="120" y="116" text-anchor="middle" font-size="8.2" fill="#5a6472">「都」→「有一个不」</text>
</svg>
</div>
<div class="qac">
<p class="q">「恒成立」和判别式到底是什么关系？</p>
<p class="a">a&gt;0 时：<b>ax²+bx+c&gt;0 恒成立 ⇔ Δ&lt;0</b>；<b>ax²+bx+c≥0 恒成立 ⇔ Δ≤0</b>。判据是「抛物线与 x 轴没有交点」，Δ 只是这件事的算法说法。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="恒成立时抛物线整条在x轴上方">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="34" y1="98" x2="206" y2="98" stroke="#9aa4b2" stroke-width="1.1"/>
<path d="M56 92 Q120 36 184 92" fill="none" stroke="#2563eb" stroke-width="2"/>
<text x="120" y="30" text-anchor="middle" font-size="9" font-weight="700" fill="#2563eb">y = ax² + bx + c（a&gt;0）</text>
<text x="120" y="118" text-anchor="middle" font-size="8.6" fill="#2f8a5b">整条在 x 轴上方 ⇔ 无交点 ⇔ Δ &lt; 0</text>
</svg>
</div>
<div class="qac">
<p class="q">存在量词命题怎么证真、怎么证假？</p>
<p class="a">证真：<b>举出一个具体的 x</b>（最好写清怎么找到的）。证假：说明范围内<b>每一个 x 都不成立</b>，通常先取否定化成 ∀ 命题再整体论证，比如配方、用判别式。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="存在量词命题证真与证假的两条路径">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<rect x="18" y="24" width="204" height="38" rx="6" fill="#e9f7f0" stroke="#b8e6d0"/>
<text x="120" y="46" text-anchor="middle" font-size="8.8" fill="#2f8a5b">证真：举一个 x₀ 代进去</text>
<rect x="18" y="70" width="204" height="42" rx="6" fill="#fbeae7" stroke="#eec4bc"/>
<text x="120" y="88" text-anchor="middle" font-size="8.8" fill="#b8402f">证假：否定成 ∀x，¬p(x)</text>
<text x="120" y="103" text-anchor="middle" font-size="8.2" fill="#5a6472">再对全体 x 论证</text>
</svg>
</div>
<div class="qac">
<p class="q">x²+ax+1&gt;0 与 x²+ax+1≥0，答案差在哪？</p>
<p class="a">只差端点：<b>&gt;0 恒成立 ⇔ Δ&lt;0 ⇔ −2&lt;a&lt;2</b>；<b>≥0 恒成立 ⇔ Δ≤0 ⇔ −2≤a≤2</b>。因为 |a|=2 时 Δ=0，顶点等于 0，不满足 &gt;0 但满足 ≥0，所以开区间要变成闭区间。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="大于零与大于等于零的区间端点差异">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="34" text-anchor="middle" font-size="8.6" fill="#3a3a35">&gt;0 恒成立：(−2, 2)　端点不取</text>
<line x1="40" y1="58" x2="200" y2="58" stroke="#9aa4b2" stroke-width="1.1"/>
<circle cx="80" cy="58" r="4.4" fill="#ffffff" stroke="#b8402f" stroke-width="1.6"/>
<circle cx="160" cy="58" r="4.4" fill="#ffffff" stroke="#b8402f" stroke-width="1.6"/>
<line x1="84" y1="58" x2="156" y2="58" stroke="#b8402f" stroke-width="2.4"/>
<text x="120" y="88" text-anchor="middle" font-size="8.6" fill="#3a3a35">≥0 恒成立：[−2, 2]　端点取到</text>
<line x1="40" y1="106" x2="200" y2="106" stroke="#9aa4b2" stroke-width="1.1"/>
<circle cx="80" cy="106" r="4.4" fill="#2f8a5b"/>
<circle cx="160" cy="106" r="4.4" fill="#2f8a5b"/>
<line x1="80" y1="106" x2="160" y2="106" stroke="#2f8a5b" stroke-width="2.4"/>
</svg>
</div>
</div>
<p class="gx-note">这六问其实是同一件事：<b>量词决定「要检查几个 x」</b>。全部要检查 → 否命题靠一个反例；存在就够 → 否命题要全体否定。所有否定题、恒成立题都在这一条上分叉。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ ∀x∈R，x²&gt;0 的否定是 ∃x∈R，x²&gt;0。</p>
<p class="er-v">✓ ∀x∈R，x²&gt;0 的否定是 ∃x∈R，x²≤0。</p>
<p class="er-w">错在哪：只换了量词，结论没否。否定要同时换量词和否结论，「&gt;0」必须翻成「≤0」。</p>
</div>
<div class="er">
<p class="er-x">✗ 上面这个 ∃x∈R，x²≤0 是原命题的否命题。</p>
<p class="er-v">✓ 它是原命题的否定（只否定结论，真假相反）。</p>
<p class="er-w">错在哪：把「命题的否定」和「否命题」当成一回事。否命题只对「若 p 则 q」才有，量词命题只谈否定。</p>
</div>
<div class="er">
<p class="er-x">✗ 要说明 ∀x∈R，x²&gt;0 是假命题，得把所有不成立的 x 都举出来。</p>
<p class="er-v">✓ 举出 x=0 即可：0²=0 不满足 &gt;0，故原命题为假。</p>
<p class="er-w">错在哪：∀ 命题为假只需一个反例，找一个就收笔；把「证真」的要求套到了「证假」上。</p>
</div>
<div class="er">
<p class="er-x">✗ 「至少有一个 x 满足 p」的否定是「至少有一个 x 不满足 p」。</p>
<p class="er-v">✓ 否定是「所有 x 都不满足 p」，即 ∀x∈M，¬p(x)。</p>
<p class="er-w">错在哪：只否了结论，量词没换。两条必须同时动，否则写出来的是另一个命题。</p>
</div>
<div class="er">
<p class="er-x">✗ x²+ax+1&gt;0 对任意 x 成立，所以 Δ=a²−4&gt;0。</p>
<p class="er-v">✓ 恒成立要求抛物线与 x 轴无交点，所以 Δ=a²−4&lt;0，得 −2&lt;a&lt;2。</p>
<p class="er-w">错在哪：判别式方向反了。Δ&gt;0 恰恰是「有两个交点、会出现 ≤0 的 x」，正好把事情办砸。</p>
</div>
<div class="er">
<p class="er-x">✗ 「x²+ax+1≥0 恒成立」和「&gt;0 恒成立」用同一个条件，都是 Δ&lt;0。</p>
<p class="er-v">✓ &gt;0 用 Δ&lt;0（得 −2&lt;a&lt;2）；≥0 用 Δ≤0（得 −2≤a≤2）。</p>
<p class="er-w">错在哪：|a|=2 时 Δ=0，顶点等于 0，不满足 &gt;0 但满足 ≥0。一个等号之差，把开区间写成闭区间就是错。</p>
</div>
<div class="er">
<p class="er-x">✗ ∀x∈R，x²+ax+1&gt;0 的否定是 ∃x∈R，x²+ax+1&lt;0。</p>
<p class="er-v">✓ 否定是 ∃x∈R，x²+ax+1≤0。</p>
<p class="er-w">错在哪：把「不大于」写成了「小于」。&gt; 的反面是 ≤，等号那一格必须接住，和上一行是同一类毛病。</p>
</div>
</div>

  function fmt(a) { return (a % 1 === 0) ? String(a) : a.toFixed(1); }

  /* 中文按字数换行，避免长句冲出面板 */
  function wrap(parent, x, y, s, maxW, fs, col, lh, wt) {
    var per = Math.max(6, Math.floor(maxW / fs)), lines = [], cur = "";
    for (var i = 0; i < s.length; i++) { cur += s.charAt(i); if (cur.length >= per) { lines.push(cur); cur = ""; } }
    if (cur) lines.push(cur);
    for (var k = 0; k < lines.length; k++) tx(parent, x, y + k * lh, lines[k], col, "start", fs, wt || 400);
  }

  function geom() {
    var p = L.left, wide = L === W;
    var pl = wide ? 46 : 34, pr = wide ? 24 : 18, pt = wide ? 56 : 44, pb = wide ? 58 : 48;
    var plot = { x: p.x + pl, y: p.y + pt, w: p.w - pl - pr, h: p.h - pt - pb };
    return {
      wide: wide, plot: plot,
      X: function (m) { return plot.x + (m - XMIN) / (XMAX - XMIN) * plot.w; },
      Y: function (m) { return plot.y + (YMAX - m) / (YMAX - YMIN) * plot.h; }
    };
  }

  function seg(parent, x1, y1, x2, y2, col, w, dash) {
    var o = { x1: x1, y1: y1, x2: x2, y2: y2, stroke: col, "stroke-width": w || 1.2 };
    if (dash) o["stroke-dasharray"] = dash;
    el("line", o, parent);
  }

  function draw() {
    var gA = $("gxA"), gB = $("gxB");
    gA.textContent = ""; gB.textContent = "";
    var s = calc(A), wide = G.wide, p = L.left, r = L.right, pl = G.plot;
    el("rect", { x: p.x, y: p.y, width: p.w, height: p.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    tx(gA, p.x + 20, p.y + 30, "抛物线 y = x² + ax + 1 与 x 轴", "#5a6472", "start", wide ? 10.5 : 9.4, 700);

    var oy = G.Y(0), ox = G.X(0);
    seg(gA, pl.x - 12, oy, pl.x + pl.w, oy, "#9aa4b2", 1.2);
    el("path", { d: "M" + (pl.x + pl.w) + " " + oy + " l-9 -4 v8 z", fill: "#9aa4b2" }, gA);
    seg(gA, ox, pl.y + pl.h, ox, pl.y, "#9aa4b2", 1.2);
    el("path", { d: "M" + ox + " " + pl.y + " l-4 9 h8 z", fill: "#9aa4b2" }, gA);
    tx(gA, ox - 8, oy + 14, "O", "#8a94a6", "end", 8.6, 400);
    tx(gA, pl.x + pl.w - 4, oy - 8, "x", "#8a94a6", "end", 9, 400);
    tx(gA, ox + 8, pl.y + 10, "y", "#8a94a6", "start", 9, 400);

    var i;
    for (i = XMIN; i <= XMAX; i++) {
      if (i === 0) continue;
      seg(gA, G.X(i), oy - 3, G.X(i), oy + 3, "#9aa4b2", 1);
      tx(gA, G.X(i), oy + 15, String(i).replace("-", "−"), "#8a94a6", "middle", 8.4, 400);
    }
    [2, 4].forEach(function (v) {
      seg(gA, ox - 3, G.Y(v), ox + 3, G.Y(v), "#9aa4b2", 1);
      tx(gA, ox - 8, G.Y(v) + 3.2, String(v), "#8a94a6", "end", 8.4, 400);
    });

    /* 只画 y ≤ 4 的那一段，避免曲线冲出面板 */
    var aa = s.a, sq = Math.sqrt(aa * aa + 12);
    var x1 = Math.max(XMIN, (-aa - sq) / 2), x2 = Math.min(XMAX, (-aa + sq) / 2);
    var pts = [], k, xx, yy;
    for (k = 0; k <= 60; k++) {
      xx = x1 + (x2 - x1) * k / 60;
      yy = xx * xx + aa * xx + 1;
      if (yy <= YMAX + 0.02) pts.push(G.X(xx).toFixed(2) + " " + G.Y(yy).toFixed(2));
    }
    if (pts.length > 1) {
      el("path", { d: "M" + pts.join(" L"), fill: "none", stroke: "#2563eb", "stroke-width": 2.2, "stroke-linecap": "round" }, gA);
    }

    /* 顶点：命题翻转就看它有没有落到 x 轴上 */
    var vx = -aa / 2, vy = 1 - aa * aa / 4;
    seg(gA, G.X(vx), G.Y(vy), G.X(vx), oy, "#b8791f", 1, "4 4");
    el("circle", { cx: G.X(vx), cy: G.Y(vy), r: 4, fill: "#b8791f" }, gA);
    tx(gA, G.X(vx) + 7, G.Y(vy) - 6, "顶点", "#b8791f", "start", 8.4, 700);

    if (s.disc >= 0) {
      var q = Math.sqrt(s.disc);
      [-1, 1].forEach(function (t) {
        var rx = (-aa + t * q) / 2;
        if (rx < XMIN - 0.02 || rx > XMAX + 0.02) return;
        el("circle", { cx: G.X(rx), cy: oy, r: 3.4, fill: "#b8402f" }, gA);
      });
    }
    tx(gA, p.x + 20, p.y + p.h - 14, "开口向上：整条在水面上方才恒成立", "#5a6472", "start", wide ? 9.2 : 8.6, 400);

    /* 右栏：把「符号 → 真假」一步步写出来 */
    el("rect", { x: r.x, y: r.y, width: r.w, height: r.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    tx(gB, r.x + 20, r.y + 30, "命题真假怎么读", "#5a6472", "start", wide ? 10.5 : 9.4, 700);
    var fs = wide ? 11 : 9.6, lh = wide ? 26 : 24, ry = r.y + (wide ? 64 : 56);
    tx(gB, r.x + 20, ry, "P：∀x∈R，x² + ax + 1 > 0", "#2563eb", "start", fs, 700);
    ry += lh;
    tx(gB, r.x + 20, ry, "a = " + fmt(s.a), "#3a3a35", "start", fs, 400);
    ry += lh;
    tx(gB, r.x + 20, ry, "Δ = a² − 4 = " + s.disc.toFixed(2), "#3a3a35", "start", fs, 400);
    ry += lh;
    tx(gB, r.x + 20, ry, "顶点纵坐标 1 − a²/4 = " + s.vert.toFixed(2), "#3a3a35", "start", fs, 400);

    var bx = r.x + 20, bw = r.w - 40, bh = wide ? 132 : 120;
    var by = r.y + r.h - bh - 22, big, col, bg, why;
    if (Math.abs(s.a) < 2) {
      big = "命题 P 为真"; col = "#2f8a5b"; bg = "#e6f6ee";
      why = "Δ < 0：抛物线与 x 轴无交点，整条在 x 轴上方，∀x∈R 都成立。";
    } else if (Math.abs(s.a) === 2) {
      big = "命题 P 为假"; col = "#b8791f"; bg = "#fdf3e0";
      why = "|a| = 2 时 Δ = 0：顶点正好落在 x 轴上，那一点等于 0，不满足 >0。";
    } else {
      big = "命题 P 为假"; col = "#b8402f"; bg = "#fbeae7";
      why = "Δ > 0：与 x 轴有两个交点，交点之间有 x 使式子 ≤0，反例现成。";
    }
    el("rect", { x: bx, y: by, width: bw, height: bh, rx: 8, fill: bg, stroke: col + "44" }, gB);
    tx(gB, bx + 14, by + 30, big, col, "start", wide ? 13 : 12, 700);
    wrap(gB, bx + 14, by + 54, why, bw - 28, wide ? 9.8 : 9.2, "#3a3a35", 15, 400);
    tx(gB, bx + 14, by + bh - 12, "判据：恒成立 ⇔ Δ < 0 ⇔ 无交点", col, "start", 8.8, 700);
  }

  function render() {
    if (!G) { L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N; G = geom(); stage.setAttribute("viewBox", L.vb); }
    var s = calc(A), st, col, bg, sn;
    $("gxVa").textContent = fmt(s.a);
    $("gxVb").textContent = s.disc.toFixed(1);
    $("gxVc").textContent = s.vert.toFixed(1);
    if (Math.abs(s.a) < 2) { st = "真"; col = "#2f8a5b"; bg = "#e6f6ee"; sn = "Δ<0，恒成立"; }
    else if (Math.abs(s.a) === 2) { st = "假"; col = "#b8791f"; bg = "#fdf3e0"; sn = "Δ=0，|a|=2 不满足 >0"; }
    else { st = "假"; col = "#b8402f"; bg = "#fbeae7"; sn = "Δ>0，能揪出反例"; }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    draw();
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    G = geom();
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: -3 }, { t: 1.2, v: -3 }, { t: 4, v: 0 }, { t: 6.5, v: 0 }, { t: 9, v: 2 }, { t: 11.5, v: 3 }, { t: 13.5, v: -3 }],
    keys: [-3, 0, 2, 3],
    value: A, min: -3, max: 3, step: 0.5,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc, cases: [
    { v: 0, eq: { disc: -4, truth: 1 } },
    { v: 2, eq: { disc: 0, truth: 0 } },
    { v: 3, eq: { disc: 5, truth: 0 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
</body>
</html>
