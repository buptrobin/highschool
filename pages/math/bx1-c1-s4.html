<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 充分条件与必要条件<span class="q-src">人教A版必修第一册 · 第一章第四节</span></p>
<p class="q-b">一般地，「若 p，则 q」为真命题，记作 p⇒q，这时称 p 是 q 的充分条件，q 是 p 的必要条件。</p>
<p class="q-n">→ 翻成人话：一句话塞进<b>两个名字</b>，而它们说的是同一件事 p⇒q——「p 是 q 的充分条件」和「q 是 p 的必要条件」是同一个箭头的两头。所以充分、必要不是两个条件，是一次推出的两种读法。<b>方向不能反（p 是 q 的充分 ≠ q 是 p 的充分）</b>：前半句的主语是 p，后半句的主语变成了 q，位置一换，句子就换了意思。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 充分不必要与必要不充分<span class="q-src">人教A版必修第一册 · 第一章第四节</span></p>
<p class="q-b">若 p⇒q 且 q⇏p，则 p 是 q 的充分不必要条件；若 q⇒p 且 p⇏q，则 p 是 q 的必要不充分条件。</p>
<p class="q-n">→ 翻成人话：四类条件都由<b>两个方向</b>的成绩单决定，一行两格，各填「成立 / 不成立」。p⇒q 那一格决定「充分」二字，q⇒p 那一格决定「必要」二字；两格都打勾才叫充要，都不打勾叫既不充分也不必要。只填一格就写答案，等于蒙。<b>两个方向都要验</b>，这是本节唯一的操作规范。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 充要条件<span class="q-src">人教A版必修第一册 · 第一章第四节</span></p>
<p class="q-b">若 p⇔q，则 p 是 q 的充要条件，也说 p 与 q 互为充要条件。</p>
<p class="q-n">→ 翻成人话：p⇔q 就是 p⇒q 与 q⇒p <b>两个方向都成立</b>的合写，读作「p 与 q 等价」。注意它<b>不等于</b>「p 与 q 相等」：两个说法不同的命题可以互相推出（例如「x 是偶数」与「x+1 是奇数」），这时候它们互为充要条件，但不是同一个句子。集合语言里 p⇔q 对应两个范围完全重合。</p>
</div>

<div style="overflow-x:auto">

<p class="gx-fml">p⇒q 且 q⇏p ⇔ 充分不必要</p>
<p class="gx-note">整张表只高亮 1 行。背法：先在草稿写「谁 ⇒ 谁」，再把「充分」贴给箭头起点、「必要」贴给箭头终点；最后用「小范围推大范围」复核一遍——范围小的那个一定是充分条件。反过来用这条口诀去验，能抓住绝大多数方向错误。</p>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 四类条件的判定<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">已知 p：x&gt;1，q：x&gt;0。判断 p 是 q 的什么条件，并说明理由；再回答：q 是 p 的什么条件？<br>陷阱：题干后半句换了主语，很多答案在第二问把方向写反，或者干脆不答第二问。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题：把 p、q 先变成范围</p>
<p class="s-b">p 对应区间 (1,+∞)，q 对应区间 (0,+∞)。两个都是开区间，端点取不到，所以数轴上画空心点。这一步不写理由，只画图。</p>
<p class="s-k">用到：命题即集合，p 成立 ⇔ x 落在 p 的范围内。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 验第一个方向 p⇒q</p>
<p class="s-b">任取 x 满足 x&gt;1，因为 1&gt;0，所以 x&gt;0 也成立，故 p⇒q。换成区间话：区间 (1,+∞) 整段落进 (0,+∞)，小范围推大范围，成立。</p>
<p class="s-k">用到：p⇒q ⇔ p 的范围 ⊆ q 的范围。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 验第二个方向 q⇒p</p>
<p class="s-b">举反例即可：取 x=0.5，此时 q 真（0.5&gt;0），但 p 假（0.5 不大于 1），所以 q⇒p 不成立，记作 q⇏p。一个反例就够，不必再多举。</p>
<p class="s-k">用到：判「不成立」只需一个反例；判「成立」必须推理。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 查表下结论</p>
<p class="s-b">第一格通、第二格不通，查表得 p 是 q 的充分不必要条件。于是有 q 是 p 的必要不充分条件——同一组事实，主语换成 q，性质就跟着换。</p>
<p class="s-k">用到：充分 ↔ 必要是一对互称，方向不能反（p 是 q 的充分 ≠ q 是 p 的充分）。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 用集合口径复核一遍</p>
<p class="s-b">p 的范围比 q 的范围小，小范围推大范围，所以 p 充分；大范围推不出小范围，所以 p 不必要。两条结论与第 4 步一致，答案可以落笔。</p>
<p class="s-k">用到：小范围推大范围——小的是充分，大的是必要。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">① p⇒q 成立：若 x&gt;1，则 x&gt;0。② q⇏p：取 x=0.5，q 成立而 p 不成立。③ 由 p⇒q 且 q⇏p，得 <b>p 是 q 的充分不必要条件</b>。④ 反过来，q 是 p 的必要不充分条件（不能说成「q 是 p 的充分条件」，方向反了）。⑤ 集合口径：p 的范围 (1,+∞) 是 q 的范围 (0,+∞) 的真子集，小范围推大范围，故充分不必要。</p>
</div>
</div>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">

<div class="qac">
<p class="q">「充分条件的方向我总是记反，有没有一句能定死的话？」</p>
<p class="a">读句子先找箭头起点：<b>「A 是 B 的充分条件」⇔ A⇒B</b>，「是」字前面的是起点。记不住就把句子翻成「有 A 就够 B」，够的那个在箭头起点。<b>方向不能反（p 是 q 的充分 ≠ q 是 p 的充分）</b>，两句话的箭头正好对调。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="p 是 q 的充分条件，箭头从 p 指向 q">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<rect x="26" y="34" width="60" height="30" rx="6" fill="#ffffff" stroke="#2563eb"/>
<text x="56" y="53" text-anchor="middle" font-size="10" font-weight="700" fill="#2563eb">p</text>
<rect x="154" y="34" width="60" height="30" rx="6" fill="#ffffff" stroke="#2f8a5b"/>
<text x="184" y="53" text-anchor="middle" font-size="10" font-weight="700" fill="#2f8a5b">q</text>
<line x1="90" y1="49" x2="142" y2="49" stroke="#2563eb" stroke-width="1.6"/>
<polygon points="148,49 136,44 136,54" fill="#2563eb"/>
<text x="120" y="92" text-anchor="middle" font-size="8.6" fill="#5a6472">p 是 q 的充分条件</text>
<text x="120" y="108" text-anchor="middle" font-size="8.6" fill="#5a6472">看 p⇒q，不是 q⇒p</text>
</svg>
</div>

<div class="qac">
<p class="q">「小范围和大范围，到底谁是谁的充分条件？」</p>
<p class="a"><b>小范围推大范围</b>：范围小的那个是充分条件，范围大的那个是必要条件。理由是集合包含——小的整段落进大的里面，所以小的成立必有大的成立。反过来不成立，所以大的不充分。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="小圆套在大圆里，小范围推大范围">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<ellipse cx="120" cy="64" rx="82" ry="46" fill="#eef6ff" stroke="#b8d4f0"/>
<ellipse cx="96" cy="64" rx="34" ry="20" fill="#ffffff" stroke="#2563eb"/>
<text x="96" y="67" text-anchor="middle" font-size="8.6" font-weight="700" fill="#151a21">小</text>
<text x="160" y="96" text-anchor="middle" font-size="8.4" fill="#5a6472">大</text>
<text x="120" y="118" text-anchor="middle" font-size="8.6" fill="#2f8a5b">小的充分，大的必要</text>
</svg>
</div>

<div class="qac">
<p class="q">「充要条件是不是两向都成立？」</p>
<p class="a">是。<b>p⇔q 就是 p⇒q 与 q⇒p 同时成立</b>，两格都打勾才写「充要」。它<b>不等于 p 与 q 相等</b>：说法不同的两个命题只要互相推出，就互为充要条件。集合口径下，两向都成立 ⇔ 两个范围完全重合。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="两个箭头互相指向，表示 p 与 q 等价">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<rect x="24" y="38" width="58" height="28" rx="6" fill="#ffffff" stroke="#2563eb"/>
<text x="53" y="57" text-anchor="middle" font-size="10" font-weight="700" fill="#2563eb">p</text>
<rect x="158" y="38" width="58" height="28" rx="6" fill="#ffffff" stroke="#2563eb"/>
<text x="187" y="57" text-anchor="middle" font-size="10" font-weight="700" fill="#2563eb">q</text>
<line x1="86" y1="44" x2="150" y2="44" stroke="#2563eb" stroke-width="1.5"/>
<polygon points="156,44 144,39 144,49" fill="#2563eb"/>
<line x1="154" y1="60" x2="90" y2="60" stroke="#2563eb" stroke-width="1.5"/>
<polygon points="84,60 96,55 96,65" fill="#2563eb"/>
<text x="120" y="96" text-anchor="middle" font-size="8.6" fill="#5a6472">p⇔q</text>
<text x="120" y="112" text-anchor="middle" font-size="8.6" fill="#5a6472">两向都通才叫充要</text>
</svg>
</div>

<div class="qac">
<p class="q">「p 是 q 的充分条件，那 q 是 p 的什么条件？」</p>
<p class="a">是 <b>p 的必要条件</b>。这就是课本那个句子的后半截：同一个 p⇒q，「p 是 q 的充分条件」与「q 是 p 的必要条件」说的是同一件事。<b>方向不能反，但主语可以换</b>——换主语时性质跟着换名字，不能照抄「充分」两个字。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="同一个箭头从左到右读与从右到左读，得到两个名字">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<rect x="26" y="40" width="56" height="26" rx="6" fill="#ffffff" stroke="#2563eb"/>
<text x="54" y="58" text-anchor="middle" font-size="10" font-weight="700" fill="#2563eb">p</text>
<rect x="158" y="40" width="56" height="26" rx="6" fill="#ffffff" stroke="#2f8a5b"/>
<text x="186" y="58" text-anchor="middle" font-size="10" font-weight="700" fill="#2f8a5b">q</text>
<line x1="86" y1="53" x2="150" y2="53" stroke="#2563eb" stroke-width="1.6"/>
<polygon points="156,53 144,48 144,58" fill="#2563eb"/>
<text x="120" y="90" text-anchor="middle" font-size="8.4" fill="#5a6472">p 充分 · q 必要</text>
<text x="120" y="107" text-anchor="middle" font-size="8.4" fill="#b8402f">别写成 q 是 p 的充分</text>
</svg>
</div>

<div class="qac">
<p class="q">「能不能只看一个方向就下结论？」</p>
<p class="a">不能。<b>两个方向都要验</b>：p⇒q 那格决定「充分」，q⇒p 那格决定「必要」，四类条件正是两格的组合，少一格就只剩一半信息。只验 p⇒q 最多能说「p 是 q 的充分条件」，说成「充要」就是加了没验过的第二格。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="两格成绩单，第二格空着不能下结论">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<rect x="34" y="34" width="80" height="30" rx="6" fill="#e6f6ee" stroke="#b8e6d0"/>
<text x="74" y="53" text-anchor="middle" font-size="9" fill="#2f8a5b">p⇒q ✓</text>
<rect x="126" y="34" width="80" height="30" rx="6" fill="#fdf3e0" stroke="#e8d3ac"/>
<text x="166" y="53" text-anchor="middle" font-size="9" fill="#b8791f">q⇒p ？</text>
<text x="120" y="88" text-anchor="middle" font-size="8.6" fill="#5a6472">第二格空着，结论只能是</text>
<text x="120" y="106" text-anchor="middle" font-size="8.6" font-weight="700" fill="#b8402f">「充分」而不是「充要」</text>
</svg>
</div>

<div class="qac">
<p class="q">「『x&gt;1 的充分条件是 x&gt;2』这句话对吗？」</p>
<p class="a">对。注意句式：「A 的充分条件是 B」等价于 <b>B⇒A</b>，起点在「是」字后面，和「B 是 A 的充分条件」同义。这里 x&gt;2 的范围更小，<b>小范围推大范围</b>，x&gt;2⇒x&gt;1 成立，所以句子成立。反过来写「x&gt;1 的充分条件是 x&gt;1.5」也对，但「x&gt;0」就不对。</p>

</div>

</div>
<p class="gx-note">六问其实是同一件事的两面：问「方向」时在数箭头起点，问「范围」时在比包含关系。把每题都退回「谁包含谁 + 两个方向各打一次勾」，就不需要背四句定义——四类条件只是两格成绩单的四种组合，方向不能反、两个方向都要验、小范围推大范围，这三条串起来就是全部判据。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 因为 p⇒q，所以「q 是 p 的充分条件」。</p>
<p class="er-v">✓ 因为 p⇒q，所以 p 是 q 的充分条件，q 是 p 的必要条件。</p>
<p class="er-w">错在哪：主语和箭头起点对不上。p⇒q 里箭头从 p 出发，充分这个名字只能贴给 p；<b>方向不能反（p 是 q 的充分 ≠ q 是 p 的充分）</b>。</p>
</div>

<div class="er">
<p class="er-x">✗ p 的范围比 q 大，所以 p⇒q，p 是 q 的充分条件。</p>
<p class="er-v">✓ p 的范围比 q 小（p⊆q），所以 p⇒q，p 是 q 的充分条件。</p>
<p class="er-w">错在哪：把「小范围推大范围」记反了。大范围里挑一个元素，未必落在小范围里，所以大推不出来；只有小范围的整段被包住，才能推。</p>
</div>

<div class="er">
<p class="er-x">✗ 我验了 p⇒q 成立，所以 p 是 q 的充要条件。</p>
<p class="er-v">✓ 验过 p⇒q 与 q⇒p 两个方向都成立，才可以说 p 是 q 的充要条件。</p>
<p class="er-w">错在哪：<b>两个方向都要验</b>，只验一格最多得到「充分条件」，第二格没验就写「充要」，等于凭空多写了一半结论。</p>
</div>

<div class="er">
<p class="er-x">✗ p 是 q 的充要条件，说明 p 和 q 是同一个命题。</p>
<p class="er-v">✓ p⇔q 表示 p 与 q 可以互相推出，两句话说法可以完全不同。</p>
<p class="er-w">错在哪：把「等价」当成了「相等」。「x 是偶数」与「x+1 是奇数」互为充要条件，但它们是两个不同的句子；充要讲的是推出关系，不是文字一模一样。</p>
</div>

<div class="er">
<p class="er-x">✗ q 是 p 的必要条件，意思是 q 没什么用，可有可无。</p>
<p class="er-v">✓ q 是 p 的必要条件，意思是 q 不成立时 p 一定不成立，缺它不行。</p>
<p class="er-w">错在哪：把「必要」理解成了「次要」。必要条件是底线：它在，p 未必成立；它不在，p 一定不成立。所以必要条件是拿来排除的，不是拿来充数的。</p>
</div>

<div class="er">
<p class="er-x">✗ p：x²&lt;0（无解），它什么都能推，所以它是任何 q 的充分条件。</p>
<p class="er-v">✓ 空集是任何集合的子集，所以「无解」的 p 在形式上能推出任何 q，但本题不讨论这种退化情形，应说明 p 无解。</p>
<p class="er-w">错在哪：把空集的性质直接搬来当结论，却不交代前提。考试里遇到「p 无解」，先写清 p 的解集是 ∅，再谈推出，别只丢一句「什么都能推」。</p>
</div>

<div class="er">
<p class="er-x">✗ p⇏q，所以 p 不是 q 的条件。</p>
<p class="er-v">✓ p⇏q，所以 p 不是 q 的充分条件；它仍可能是 q 的必要条件。</p>
<p class="er-w">错在哪：漏掉了「充分」二字。条件有四类，一个方向不成立只否掉一半身份；要说「不是 q 的充分条件」，并且还要去看另一个方向。</p>
</div>
