<p class="gx-lede">这一节是第四章的收口：前面学了指对数函数的图象与性质，这里把它们变成「找零点、判存在、估近似值」的三件工具。最容易错的一件事：把零点当成点，把「至少一个」读成「恰好一个」，把 f(a)·f(b)&lt;0 当成充要条件——三个坑，本页各拆两遍。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 函数的零点<span class="q-src">人教A版必修第一册 · 第四章第五节</span></p>
<p class="q-b">对于函数 y=f(x)，使 f(x)=0 的实数 x 叫做函数 y=f(x) 的零点。</p>
<p class="q-n">→ 翻成人话：三个词要咬住。<b>①</b> 是实数 x，不是坐标点；<b>②</b> 它让 f(x)=0 成立；<b>③</b> 零点<b>是一个数</b>，写 x₀=1.3247…，不写 (1.3247, 0)。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 零点存在定理<span class="q-src">人教A版必修第一册 · 第四章第五节</span></p>
<p class="q-b">如果函数 y=f(x) 在区间 [a,b] 上的图象是一条连续不断的曲线，且有 f(a)·f(b)&lt;0，那么函数 y=f(x) 在区间 (a,b) 内至少有一个零点。</p>
<p class="q-n">→ 翻成人话：两个条件缺一不可——<b>①</b> 闭区间上连续；<b>②</b> 端点函数值异号。结论只有「至少有一个 x₀∈(a,b)」，定理<b>只保证至少一个</b>，几个、唯一不唯一，它都不管。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 二分法<span class="q-src">人教A版必修第一册 · 第四章第五节</span></p>
<p class="q-b">对于在区间 [a,b] 上连续不断且 f(a)·f(b)&lt;0 的函数 y=f(x)，通过不断地把函数 f(x) 的零点所在的区间一分为二，使区间的两个端点逐步逼近零点，进而得到零点近似值的方法叫做二分法。</p>
<p class="q-n">→ 翻成人话：二分法不是新定理，是定理的<b>用法</b>。每次取中点、算 f(m)、看符号、扔掉一半，<b>给的是近似值</b>，精度由区间长度控制。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>条件 / 结论</th><th>标准写法</th><th>缺了会怎样</th></tr></thead>
<tbody>
<tr><td>① 连续</td><td>y=f(x) 在闭区间 [a,b] 上的图象是一条连续不断的曲线</td><td>图象中间断开，可能「跳」过 x 轴却没有交点</td></tr>
<tr><td>② 异号</td><td>f(a)·f(b)&lt;0，两个端点分居 x 轴两侧</td><td>只知道同号时，可能一个零点也没有，如 f(x)=x²+1</td></tr>
<tr class="key"><td>结论</td><td>存在 x₀∈(a,b)，使 f(x₀)=0，即「至少一个」</td><td>把「至少一个」读成「恰好一个」——本节最常见的扣分点</td></tr>
<tr><td>加强</td><td>再加 f(x) 在 [a,b] 上单调</td><td>不单调就只能数出下限，二分法也可能收敛到另一个零点</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">背法：连续 + 异号 ⇒ 至少一个；再加单调 ⇒ 恰好一个。注意方向：f(a)·f(b)&lt;0 是<b>充分不必要条件</b>——它成立必有零点，但有零点时它不一定成立。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>

<div class="gx-ex">
<p class="ex-t">例题 · 零点存在定理 + 二分法估计<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">证明函数 <span class="gx-fml">f(x)=x³−x−1</span> 在区间 (1,2) 内存在零点，并估计这个零点（精确到 0.01）。<br>小陷阱：题目只要「存在」和「估计」，不要你解三次方程；也别把「至少一个」答成「恰好一个」。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题：要证存在，先找端点</p>
<p class="s-b">「在 (1,2) 内存在零点」是存在性问题，用零点存在定理：先确认连续，再算两个端点的函数值看符号。</p>
<p class="s-k">用到：零点存在定理的两个条件，一个都不能省。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 算端点值，验证异号</p>
<p class="s-b"><span class="gx-fml">f(1)=1³−1−1=−1&lt;0</span>，<span class="gx-fml">f(2)=8−2−1=5&gt;0</span>，所以 f(1)·f(2)=−5&lt;0，两个端点分居 x 轴两侧。</p>
<p class="s-k">用到：异号条件；多项式函数在 R 上连续，连续条件也成立。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 引用定理，只写「至少一个」</p>
<p class="s-b">因为 f(x)=x³−x−1 在 [1,2] 上的图象是一条连续不断的曲线，且 f(1)·f(2)&lt;0，由零点存在定理，f(x) 在 (1,2) 内至少有一个零点。</p>
<p class="s-k">用到：定理结论的准确措辞——「至少一个」，不是「恰好一个」。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 二分，缩小区间</p>
<p class="s-b">取中点 1.5：<span class="gx-fml">f(1.5)=3.375−1.5−1=0.875&gt;0</span>，与 f(1)&lt;0 异号，所以零点在 (1,1.5)。再取 1.25：<span class="gx-fml">f(1.25)=1.953125−1.25−1=−0.296875&lt;0</span>，所以零点在 (1.25,1.5)。</p>
<p class="s-k">用到：每次都用「f(a)·f(m) 的符号」决定保留哪一半。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 算到精度，写近似值</p>
<p class="s-b">继续：f(1.375)=0.2246&gt;0 ⇒ (1.25,1.375)；f(1.3125)=−0.0515&lt;0 ⇒ (1.3125,1.375)；f(1.34375)&gt;0 ⇒ (1.3125,1.34375)；再两次后区间为 (1.3203,1.3281)，长度 0.0078&lt;0.01，取中点得 x₀≈1.32。</p>
<p class="s-k">用到：停止条件是区间长度小于精度；输出的是近似值。</p>
</li>
</ol>

<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">证明：f(x)=x³−x−1 在 [1,2] 上连续，且 f(1)=−1&lt;0，f(2)=5&gt;0，即 f(1)·f(2)&lt;0。由零点存在定理，f(x) 在区间 (1,2) 内至少有一个零点。</p>
<p class="ans-b">估计（二分法）：f(1.5)=0.875&gt;0，得零点在 (1,1.5)；f(1.25)&lt;0，得零点在 (1.25,1.5)；f(1.375)&gt;0，得零点在 (1.25,1.375)；依次取中点，直到区间长度小于 0.01，得零点在 (1.3203,1.3281)，故 x₀≈1.32。</p>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">零点是一个点 (x₀,0) 吗？</p>
<p class="a">不是。零点是使 <b>f(x)=0 的实数 x₀</b>，是一个数；点 (x₀,0) 是图象与 x 轴的交点。答「零点为 (1,0)」直接扣分，应写「零点为 1」。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="零点是一个数，交点是点">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="30" y1="88" x2="204" y2="88" stroke="#8a97a4" stroke-width="1.1"/>
<polygon points="204,84 212,88 204,92" fill="#8a97a4"/>
<circle cx="118" cy="88" r="4" fill="#ffffff" stroke="#2f8a5b" stroke-width="1.8"/>
<text x="118" y="108" font-size="9" fill="#2f8a5b" text-anchor="middle">零点 = 数 x₀</text>
<text x="124" y="76" font-size="9" fill="#b8402f">交点 (x₀,0)</text>
</svg>
</div>
<div class="qac">
<p class="q">用零点存在定理，要写全哪几个条件？</p>
<p class="a">两个都要写：① <b>f(x) 在闭区间 [a,b] 上的图象连续不断</b>；② <b>f(a)·f(b)&lt;0</b>。结论写「在 (a,b) 内至少存在一个 x₀，使 f(x₀)=0」。少写连续，过程分丢一半。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="零点存在定理的两个条件">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="20" y="34" font-size="9.4" fill="#151a21">① [a,b] 上图象连续不断</text>
<text x="20" y="54" font-size="9.4" fill="#151a21">② f(a)·f(b) &lt; 0</text>
<line x1="20" y1="66" x2="220" y2="66" stroke="#dde4ea" stroke-width="1"/>
<text x="20" y="86" font-size="9.4" fill="#2f8a5b">⇒ 存在 x₀∈(a,b)，f(x₀)=0</text>
<text x="20" y="106" font-size="9.2" fill="#b8791f">结论止于「至少一个」</text>
</svg>
</div>
<div class="qac">
<p class="q">定理能保证零点唯一吗？</p>
<p class="a">不能。定理只保证「至少一个」。图 2 里曲线穿了三次就有三个零点。要说唯一，必须<b>再加 f(x) 在 [a,b] 上单调</b>：至少一个 + 至多一个 = 恰好一个。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="端点异号但曲线穿过三次">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="24" y1="74" x2="216" y2="74" stroke="#8a97a4" stroke-width="1.1"/>
<polygon points="216,70 224,74 216,78" fill="#8a97a4"/>
<path d="M 34,96 C 58,104 66,62 86,74 C 106,86 116,62 136,74 C 156,86 168,62 188,74 C 198,80 204,56 212,44" fill="none" stroke="#2563eb" stroke-width="1.8"/>

<circle cx="136" cy="74" r="3.2" fill="#ffffff" stroke="#2f8a5b" stroke-width="1.6"/>
<circle cx="188" cy="74" r="3.2" fill="#ffffff" stroke="#2f8a5b" stroke-width="1.6"/>
<text x="120" y="112" font-size="9" fill="#5a6472" text-anchor="middle">3 个零点：至少一个 ≠ 唯一</text>
</svg>
</div>
<div class="qac">
<p class="q">二分法什么时候停？</p>
<p class="a">预先给定精度 ε：当<b>区间长度 |b−a|&lt;ε</b> 时停止，取中点作近似值；若某步 f(m)=0，直接停。停止前每一步都必须保持 f(a)·f(b)&lt;0。</p>

<text x="24" y="112" font-size="9" fill="#5a6472">|b−a|&lt;ε 就停，输出中点</text>
</svg>
</div>
<div class="qac">
<p class="q">f(a)·f(b)&gt;0 说明没有零点吗？</p>
<p class="a">不能这么说。f(a)·f(b)&gt;0 只说明<b>定理用不上</b>，不是没有零点：f(x)=x²−1 在 [−2,2] 上两端同号，里面仍有两个零点。所以 f(a)·f(b)&lt;0 是<b>充分不必要条件</b>。</p>

</div>
<div class="qac">
<p class="q">零点、方程的根、图象交点是什么关系？</p>
<p class="a">同一件事的三种说法：<b>f(x₀)=0 ⇔ x₀ 是方程 f(x)=0 的根 ⇔ 点 (x₀,0) 在 y=f(x) 的图象上</b>。零点指那个数，交点指那个点，答题时别混。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="零点、方程根、图象交点三者等价">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="20" y="38" font-size="9.4" fill="#151a21">f(x₀)=0</text>
<text x="20" y="62" font-size="9.4" fill="#151a21">⇔ x₀ 是方程 f(x)=0 的根</text>
<text x="20" y="86" font-size="9.4" fill="#151a21">⇔ (x₀,0) 在图象上</text>
<text x="20" y="110" font-size="9.2" fill="#b8791f">零点 = 数 x₀，不是点</text>

<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 函数 f(x)=x²−1 的零点是 (−1,0) 和 (1,0)。</p>

<p class="er-w">错在哪：零点是一个数，不是点；(−1,0)、(1,0) 是图象与 x 轴的交点。</p>

<div class="er">
<p class="er-x">✗ 因为 f(1)·f(2)&lt;0，所以 f(x) 在 (1,2) 内恰有一个零点。</p>

<p class="er-w">错在哪：定理只保证至少一个；要唯一必须再加 f(x) 在 [1,2] 上单调。</p>

<div class="er">
<p class="er-x">✗ f(1)·f(2)&gt;0，所以 f(x) 在 (1,2) 内没有零点。</p>

<p class="er-w">错在哪：把充分条件当成了必要条件；f(a)·f(b)&lt;0 是充分不必要条件。</p>

<div class="er">

<p class="er-v">✓ 二分法的前提是 f(x) 在 [a,b] 上连续不断，且 f(a)·f(b)&lt;0。</p>

<p class="er-w">错在哪：存在性不等于可求性；定理连零点在哪一段都不给。</p>

<p class="er-w">错在哪：结论是开区间，端点被排除；这也是二分法能一直缩小的原因。</p>
</div>

<p class="er-v">✓ 定理只给存在性下限「至少一个」；个数要靠单调性、图象或进一步分析。</p>
<p class="er-w">错在哪：混淆了存在性与唯一性；「至少一个」和「恰好一个」是两个结论。</p>
