<div class="gx-meta">

<p class="gx-lede">8.6 是立体几何证明题的「发动机」：前面 8.5 讲平行，这一节讲垂直，两条线一套路——把空间问题压回平面。全节只有三个判定/定义，但每一个都带一个「不可省的条件」：线面垂直判定要两条<b>相交</b>直线，面面垂直判定要一个面<b>经过</b>另一个面的垂线，线面角要量斜线与<b>射影</b>的夹角。最容易错的一件事：把「二面角 120°」直接说成「两平面夹角 120°」——两平面的夹角只取不超过 90° 的那个，所以二面角 120° 时两平面夹角是 60°。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边的原话，不要写右边的人话。</p>

<div class="gx-quote">
<p class="q-t">判定定理 · 线面垂直<span class="q-src">人教A版必修第二册 · 第八章第6节</span></p>
<p class="q-b">如果一条直线与一个平面内的两条相交直线都垂直，则该直线与此平面垂直。</p>
<p class="q-n">→ 翻成人话：这条定理由<b>三个条件</b>组成：① 直线垂直于平面内的一条直线 m；② 直线垂直于平面内的另一条直线 n；③ m 与 n <b>相交</b>。少掉③，写「垂直于平面内两条平行直线」是推不出线面垂直的——判定要两条相交直线。</p>
</div>

<div class="gx-quote">
<p class="q-t">判定定理 · 面面垂直<span class="q-src">人教A版必修第二册 · 第八章第6节</span></p>
<p class="q-b">如果一个平面经过另一个平面的垂线，则这两个平面垂直。</p>
<p class="q-n">→ 翻成人话：<b>两个条件</b>：① 有一条直线 l 垂直于平面 α；② l 落在平面 β 内（β <b>经过</b> l）。少掉②，只能说 l⊥α，说不出 β⊥α。这条定理是「线面垂直 ⇒ 面面垂直」的通道，方向不能倒着用。</p>
</div>

<div class="gx-quote">
<p class="q-t">定义 · 直线和平面所成的角<span class="q-src">人教A版必修第二册 · 第八章第6节</span></p>
<p class="q-b">平面的一条斜线和它在平面上的射影所成的角，叫做这条直线和这个平面所成的角。</p>
<p class="q-n">→ 翻成人话：<b>三个动作</b>：① 斜线上取一点（不是斜足）向平面作垂线，得垂足；② 连垂足与斜足，这条线就是<b>射影</b>；③ 量斜线与射影的夹角。所以线面角是<b>斜线—射影</b>的角，不是斜线与平面内任意直线的角；它的范围是 <span class="gx-fml">0° ≤ θ ≤ 90°</span>，线面角永远 ≤90°。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>定理 / 定义</th><th>需要的条件（缺一不可）</th><th>少一个会怎样</th></tr></thead>
<tbody>
<tr><td>线面垂直判定</td><td>垂直于平面内两条直线，且这两条直线 <b>相交</b></td><td>两条是平行直线时，平面还能绕这条直线转，推不出垂直</td></tr>
<tr class="key"><td>线面垂直判定（真正的区别）</td><td>「两条相交直线」里的 <b>相交</b> 是判定要两条相交直线的全部要害</td><td>漏写「相交」，整道证明的根据就塌了，判 0 分起步</td></tr>
<tr><td>面面垂直判定</td><td>一个平面 <b>经过</b> 另一个平面的 <b>垂线</b></td><td>只说「都垂直于第三个平面」或「有公共棱」，都推不出面面垂直</td></tr>
<tr><td>线面角</td><td>斜线、垂线、<b>射影</b> 三件套齐全</td><td>拿斜线去和平面内一条随便的直线量角，量出来的不是线面角</td></tr>
<tr><td>二面角的平面角</td><td>在棱上取一点，两个面内各作 <b>垂直于棱</b> 的射线</td><td>两条射线不垂直于棱，角的大小随取点变化，不是平面角</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只高亮 1 行。背法：三个判定都问自己「条件齐了没有」——线面垂直问「相交了吗」，面面垂直问「这条垂线在这个面里吗」，线面角问「射影找到了吗」。</p>
</section>

<h2><span class="sn">02</span>拆开看</h2>
<p class="gx-h2s">四张图：判定怎么用 → 面面怎么接 → 角怎么量 → 二面角怎么定。</p>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 正方体里的线面垂直证明<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">如图，在正方体 ABCD-A₁B₁C₁D₁ 中，求证：AC⊥平面 BDD₁B₁。想一想：要证线面垂直，得在平面 BDD₁B₁ 里找几条直线？它们要不要相交？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题与化归</p>
<p class="s-b">要证 AC⊥平面 BDD₁B₁，直接用定义要说明 AC 垂直于平面内<b>所有</b>直线，做不到。改用判定定理：只需在平面 BDD₁B₁ 内找到两条相交直线都与 AC 垂直。</p>
<p class="s-k">用到：线面垂直的判定——把线面垂直化归为两次线线垂直。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 第一条直线 BD</p>
<p class="s-b">四边形 ABCD 是正方形，它的两条对角线互相垂直，所以 AC⊥BD。又 BD⊂平面 BDD₁B₁，方向对上了。</p>
<p class="s-k">用到：正方形对角线互相垂直；线在面内记作 BD⊂α。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 第二条直线 DD₁</p>
<p class="s-b">DD₁ 是正方体的侧棱，DD₁⊥平面 ABCD；而 AC⊂平面 ABCD，由线面垂直的定义得 DD₁⊥AC，即 AC⊥DD₁。又 DD₁⊂平面 BDD₁B₁。</p>
<p class="s-k">用到：线面垂直的定义（线垂直于面，就垂直于面内每条直线）。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 交代「相交」</p>
<p class="s-b">BD 与 DD₁ 都在平面 BDD₁B₁ 内，且 BD∩DD₁=D，两条直线确实相交。这一步是判定要两条相交直线的落地，不能省。</p>
<p class="s-k">用到：判定定理的条件③；两条平行直线不行。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 下结论</p>
<p class="s-b">AC⊥BD，AC⊥DD₁，BD∩DD₁=D，BD、DD₁⊂平面 BDD₁B₁，由线面垂直的判定定理得 AC⊥平面 BDD₁B₁。</p>
<p class="s-k">用到：判定定理，五个短句一句都不能少。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">证明：① 因为 ABCD 是正方形，所以 AC⊥BD。② 因为 DD₁⊥平面 ABCD，AC⊂平面 ABCD，所以 DD₁⊥AC，即 AC⊥DD₁。③ 又 BD∩DD₁=D，且 BD、DD₁⊂平面 BDD₁B₁。④ 由线面垂直的判定定理，AC⊥平面 BDD₁B₁。<br>注意：②③ 顺序可调，但「BD∩DD₁=D」与「BD、DD₁ 在平面内」这两句必须写出来，这是「两条相交直线」的全部内容。</p>
</div>
</div>
</section>
<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「线面垂直判定为什么非要两条<b>相交</b>直线？两条平行不行吗？」</p>
<p class="a">不行。两条平行直线只确定一个方向，平面还能绕它们转，压不住。只有两条相交直线把平面「钉死」在两个方向上，直线才真的垂直于整个平面——判定要两条相交直线，容不得「平行」。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="两相交直线把平面钉死，两条平行线压不住">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<path d="M30,100 L200,78" stroke="#2f6f8f" stroke-width="1.6"/>
<path d="M70,60 L170,110" stroke="#b8791f" stroke-width="1.6"/>
<path d="M120,86 L120,30" stroke="#b8402f" stroke-width="1.8"/>
<circle cx="120" cy="86" r="2.4" fill="#b8402f"/>
<text x="128" y="48" font-size="9" fill="#b8402f">l</text>
<text x="104" y="100" font-size="9" fill="#5a6472">P</text>
<text x="24" y="30" font-size="9" fill="#3a3a35">m∩n=P ⇒ 钉死</text>
</svg>
</div>
<div class="qac">
<p class="q">「线面角最大能到多少？会不会出现 120°？」</p>
<p class="a">最大 90°。线面角是斜线与<b>射影</b>的夹角，在直角三角形 POA 里 ∠PAO 是锐角，两个端点 θ=0°（线在面内）与 θ=90°（线垂直于面）。所以线面角 ≤90°，永远不可能是钝角。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="线面角θ在直角三角形中，最大90度">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<path d="M24,104 L216,96" stroke="#7aa8c4" stroke-width="1.3"/>
<path d="M96,104 L96,36" stroke="#b8402f" stroke-width="1.5"/>
<path d="M96,36 L176,98" stroke="#2f6f8f" stroke-width="1.5"/>
<path d="M96,104 L176,98" stroke="#b8791f" stroke-width="1.5"/>
<path d="M132,99 A36,36 0 0,1 120,70" fill="none" stroke="#2f8a5b" stroke-width="1.3"/>
<text x="136" y="78" font-size="9.5" fill="#2f8a5b">θ</text>
<text x="86" y="34" font-size="9" fill="#2f6f8f">P</text>
<text x="80" y="116" font-size="9" fill="#b8402f">O</text>
<text x="180" y="112" font-size="9" fill="#b8791f">A</text>
<text x="24" y="28" font-size="9" fill="#3a3a35">0° ≤ θ ≤ 90°</text>
</svg>
</div>
<div class="qac">
<p class="q">「二面角是 120°，那两平面的夹角也是 120° 吧？」</p>
<p class="a">不是。<b>二面角 120° 时两平面夹角是 60°</b>。二面角可以取 0°–180°，而两平面的夹角按定义取不超过 90° 的那个，即 min(θ, 180°−θ)。考卷上问「两平面所成的角」，答案只能 ≤90°。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="二面角120度，两平面夹角取60度">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<path d="M40,96 L150,86" stroke="#5a6472" stroke-width="1.8"/>
<path d="M150,86 L210,116" stroke="#7aa8c4" stroke-width="1.5"/>
<path d="M150,86 L70,40" stroke="#c99036" stroke-width="1.5"/>
<path d="M190,99 A44,44 0 0,0 171,52" fill="none" stroke="#b8402f" stroke-width="1.4"/>
<text x="164" y="86" font-size="9.5" fill="#b8402f">120°</text>
<text x="24" y="28" font-size="9" fill="#3a3a35">夹角 = 180°−120° = 60°</text>
</svg>
</div>
<div class="qac">
<p class="q">「两个平面垂直，那一个面里的直线都垂直于另一个面吧？」</p>
<p class="a">不是。β⊥α 只能保证 β 内<b>垂直于棱</b>的那条直线垂直于 α（由面面垂直的性质定理），β 内和棱平行的直线平行于 α，斜的直线与 α 斜交。面面垂直推不出「面内任意直线都垂直」。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="面面垂直时，面内只有垂直于棱的直线才垂直另一个面">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<path d="M30,104 L200,92" stroke="#7aa8c4" stroke-width="1.4"/>
<path d="M96,110 L96,32" stroke="#c99036" stroke-width="1.4"/>
<path d="M96,106 L128,66" stroke="#b8402f" stroke-width="1.6"/>
<path d="M96,106 L124,104" stroke="#2f6f8f" stroke-width="1.6"/>
<text x="132" y="62" font-size="9" fill="#b8402f">⊥棱：⊥α</text>
<text x="130" y="114" font-size="9" fill="#2f6f8f">∥棱：不⊥α</text>
</svg>
</div>
<div class="qac">
<p class="q">「一条直线垂直于平面内无数条直线，不就垂直这个平面了吗？」</p>
<p class="a">不一定。若这无数条是<b>互相平行</b>的，它们只给了一个方向，推不出线面垂直。判定要两条<b>相交</b>直线；「无数条」不等于「两条相交」，这是命题人最爱设的坑。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="垂直于无数条平行直线，推不出线面垂直">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<path d="M120,30 L120,104" stroke="#b8402f" stroke-width="1.7"/>
<path d="M44,60 L200,56" stroke="#2f6f8f" stroke-width="1.3"/>
<path d="M44,74 L200,70" stroke="#2f6f8f" stroke-width="1.3"/>
<path d="M44,88 L200,84" stroke="#2f6f8f" stroke-width="1.3"/>
<text x="126" y="42" font-size="9" fill="#b8402f">l</text>
<text x="24" y="28" font-size="9" fill="#3a3a35">全都平行：不够</text>
</svg>
</div>
<div class="qac">
<p class="q">「线面角的射影到底怎么找？我总是量错角。」</p>
<p class="a">从斜线上<b>斜足以外</b>的一点向平面作垂线，垂足记 O，斜足记 A，连 OA 就是射影，量 ∠PAO。射影一定是从垂足连到斜足；别拿斜线与平面内随手画的直线量角。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="射影是从垂足O连到斜足A的线段OA">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<path d="M24,100 L216,90" stroke="#7aa8c4" stroke-width="1.3"/>
<circle cx="100" cy="32" r="3" fill="#2f6f8f"/>
<path d="M100,32 L100,96" stroke="#b8402f" stroke-width="1.4"/>
<path d="M100,32 L186,92" stroke="#2f6f8f" stroke-width="1.5"/>
<path d="M100,96 L186,92" stroke="#b8791f" stroke-width="1.8"/>
<text x="100" y="26" font-size="9" fill="#2f6f8f">P</text>
<text x="86" y="110" font-size="9" fill="#b8402f">O</text>
<text x="190" y="104" font-size="9" fill="#b8791f">A</text>
<text x="24" y="26" font-size="9" fill="#3a3a35">OA 才是射影</text>
</svg>
</div>
</div>
<p class="gx-note">六问其实是同一件事：每个判定/定义都由「几个条件」拼成，考试就是抽掉其中一个条件问你「还成立吗」。判定要两条相交直线、线面角 ≤90°、二面角 120° 时两平面夹角是 60°，这三句是本节最常被抽走的那三块砖。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 因为 l⊥m，l⊥n，m、n 都在平面 α 内，所以 l⊥α。</p>
<p class="er-v">✓ 因为 l⊥m，l⊥n，m∩n=P，m、n⊂α，所以 l⊥α。</p>
<p class="er-w">错在哪：漏了「相交」。判定要两条相交直线，两条平行的不行，必须补 m∩n=P。</p>
</div>
<div class="er">
<p class="er-x">✗ 直线 PA 与平面 α 所成的角是 120°。</p>
<p class="er-v">✓ 直线 PA 与平面 α 所成的角 θ 满足 0°≤θ≤90°，是 ∠PAO（O 为垂足，OA 为射影）。</p>
<p class="er-w">错在哪：线面角 ≤90°，是斜线与射影的锐角；写成钝角，说明量的是斜线与平面内某条直线的角。</p>
</div>
<div class="er">
<p class="er-x">✗ 二面角 α-l-β 是 120°，所以两平面 α、β 的夹角是 120°。</p>
<p class="er-v">✓ 二面角 120° 时两平面夹角是 60°，因为两平面的夹角取 min(θ,180°−θ)≤90°。</p>
<p class="er-w">错在哪：把「二面角」和「两平面的夹角」当成同一个量，钝二面角要取补角。</p>
</div>
<div class="er">
<p class="er-x">✗ 因为 β⊥α，所以 β 内任意一条直线都垂直于 α。</p>
<p class="er-v">✓ 因为 β⊥α，所以在 β 内作垂直于棱的直线 l，则 l⊥α。</p>
<p class="er-w">错在哪：面面垂直的性质只保证「垂直于棱的那条线」垂直另一个面，β 内的平行线、斜线都不垂直 α。</p>
</div>
<div class="er">
<p class="er-x">✗ 直线 l 垂直于平面 α 内无数条直线，所以 l⊥α。</p>
<p class="er-v">✓ 直线 l 垂直于平面 α 内两条相交直线，所以 l⊥α。</p>
<p class="er-w">错在哪：那无数条可能互相平行，只给了一个方向；判定要两条相交直线。</p>
</div>
<div class="er">
<p class="er-x">✗ 直线 PA 与平面 α 所成的角，是 PA 与平面内任意一条直线的夹角。</p>
<p class="er-v">✓ 直线 PA 与平面 α 所成的角，是 PA 与它在 α 上的射影 OA 所成的角 ∠PAO。</p>
<p class="er-w">错在哪：射影是唯一的，随手画的直线不叫射影；「任意直线」这个说法直接判错。</p>
</div>
<div class="er">
<p class="er-x">✗ 在棱 l 上取点 O，在 α 内作 OA，在 β 内作 OB，∠AOB 就是二面角的平面角。</p>
<p class="er-v">✓ 在棱 l 上取点 O，在 α 内作 OA⊥l，在 β 内作 OB⊥l，∠AOB 才是平面角。</p>
<p class="er-w">错在哪：少了「垂直于棱」。两条射线不垂直于棱时，角的大小会随取点变化，不是平面角。</p>
</div>
</div>
</section>

<script src="../../assets/gx.js"></script>

<script>
/* 互动脚本本体（由 build-page.mjs 包进 <script> 里，所以这里不要写 <script> 标签） */
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var GX = window.GX, el = GX.el, tx = GX.tx, $ = GX.$;
  var stage = $("gxStage");
  if (!stage || !window.AutoPilot) return;

  /* 两套坐标：宽屏 880×470，窄屏独立 360×700 */
  var W = { vb: "0 0 880 470", left: { x: 16, y: 16, w: 424, h: 438 }, right: { x: 456, y: 16, w: 408, h: 438 } };
  var N = { vb: "0 0 360 700", left: { x: 8, y: 8, w: 344, h: 300 }, right: { x: 8, y: 320, w: 344, h: 372 } };
  var L = W, A = 60;

  /* 纯函数：二面角大小 θ → 两平面的夹角（取 ≤90° 的那个） */
  function calc(v) {
    var th = Math.max(0, Math.min(180, v));
    var ang = Math.min(th, 180 - th);
    var kind = th < 90 ? 0 : (th === 90 ? 1 : 2);
    return { angle: ang, kind: kind, sup: 180 - th };
  }

  var BLUE = "#2563eb", GRN = "#2f8a5b", AMB = "#b8791f", RED = "#b8402f", INK = "#3a3a35", GRAY = "#5a6472";

  /* 中文按字数换行，避免长句冲出面板 */
  function wrap(parent, x, y, s, maxW, fs, col, lh) {
    var per = Math.max(6, Math.floor(maxW / fs)), lines = [], cur = "";
    for (var i = 0; i < s.length; i++) { cur += s.charAt(i); if (cur.length >= per) { lines.push(cur); cur = ""; } }
    if (cur) lines.push(cur);
    for (var k = 0; k < lines.length; k++) tx(parent, x, y + k * lh, lines[k], col, "start", fs, 400);
  }

  function panel(g, p, title) {
    el("rect", { x: p.x, y: p.y, width: p.w, height: p.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, g);
    tx(g, p.x + 14, p.y + 24, title, GRAY, "start", 10.5, 700);
  }

  function draw() {
    var gA = $("gxA"), gB = $("gxB");
    gA.textContent = ""; gB.textContent = "";
    var s = calc(A), lp = L.left;
    panel(gA, lp, "二面角 α-l-β（截面看角，两条射线都垂直于棱 l）");

    var Ox = lp.x + lp.w * 0.30, Oy = lp.y + lp.h * 0.74;
    var LL = lp.w * 0.36;
    var wx = lp.w * 0.085, wy = -lp.h * 0.105;
    var th = Math.max(0, Math.min(180, A)) * Math.PI / 180;
    var ax = 0.927, ay = 0.375;
    var bx = ax * Math.cos(th) + ay * Math.sin(th);
    var by = -ax * Math.sin(th) + ay * Math.cos(th);

    /* 两个半平面：各自从棱出发，沿射线方向铺开，再沿棱的方向（深度）平移 */
    el("path", {
      d: "M" + Ox + "," + Oy + " L" + (Ox + LL * ax) + "," + (Oy + LL * ay) +
        " L" + (Ox + LL * ax + wx) + "," + (Oy + LL * ay + wy) +
        " L" + (Ox + wx) + "," + (Oy + wy) + " Z",
      fill: "#eef6fb", stroke: "#7aa8c4", "stroke-width": 1.3
    }, gA);
    el("path", {
      d: "M" + Ox + "," + Oy + " L" + (Ox + LL * bx) + "," + (Oy + LL * by) +
        " L" + (Ox + LL * bx + wx) + "," + (Oy + LL * by + wy) +
        " L" + (Ox + wx) + "," + (Oy + wy) + " Z",
      fill: "#fdf3e0", "fill-opacity": 0.78, stroke: "#c99036", "stroke-width": 1.3
    }, gA);

    /* 棱 l：两条线都垂直于它，所以它在截面上退化成一个点 O，用深度方向画一段 */
    el("path", {
      d: "M" + (Ox - wx * 0.45) + "," + (Oy - wy * 0.45) + " L" + (Ox + wx * 2.1) + "," + (Oy + wy * 2.1),
      stroke: "#5a6472", "stroke-width": 2.4
    }, gA);
    tx(gA, Ox + wx * 2.1 + 6, Oy + wy * 2.1 + 4, "l", GRAY, "start", 11, 700);

    /* 两条射线 OA、OB，都垂直于棱 */
    el("path", { d: "M" + Ox + "," + Oy + " L" + (Ox + LL * ax) + "," + (Oy + LL * ay), stroke: "#2f6f8f", "stroke-width": 1.9 }, gA);
    el("path", { d: "M" + Ox + "," + Oy + " L" + (Ox + LL * bx) + "," + (Oy + LL * by), stroke: RED, "stroke-width": 1.9 }, gA);

    /* 平面角 θ 的弧：数学逆时针 ⇒ sweep 0 */
    var r = LL * 0.30;
    if (A > 2) {
      el("path", {
        d: "M" + (Ox + r * ax) + "," + (Oy + r * ay) + " A" + r + "," + r + " 0 0,0 " + (Ox + r * bx) + "," + (Oy + r * by),
        fill: "none", stroke: GRN, "stroke-width": 1.5
      }, gA);
    }
    var mx = Ox + r * 1.22 * (ax + bx) / 2, my = Oy + r * 1.22 * (ay + by) / 2;
    tx(gA, mx + 2, my + 4, "θ", GRN, "middle", 11, 700);

    el("circle", { cx: Ox, cy: Oy, r: 2.8, fill: "#5a6472" }, gA);
    tx(gA, Ox - 8, Oy + 15, "O", GRAY, "end", 10.5, 700);
    tx(gA, Ox + LL * ax + 6, Oy + LL * ay + 6, "A", "#2f6f8f", "start", 10.5, 700);
    tx(gA, Ox + LL * bx + 4, Oy + LL * by - 4, "B", RED, "start", 10.5, 700);
    tx(gA, Ox + LL * ax * 0.42 + wx * 0.55, Oy + LL * ay * 0.42 + wy * 0.55, "α", "#3c6b86", "middle", 11, 700);
    tx(gA, Ox + LL * bx * 0.42 + wx * 0.55, Oy + LL * by * 0.42 + wy * 0.55, "β", AMB, "middle", 11, 700);

    wrap(gA, lp.x + 14, lp.y + lp.h - 34, "两平面夹角 = min(θ, 180°−θ) ≤ 90°", lp.w - 28, 9.4, GRAY, 14);

    /* 右图：θ 从 0° 到 180°，夹角是一条折返的「山形」 */
    var rp = L.right;
    panel(gB, rp, "θ → 两平面的夹角（90° 是分水岭）");
    var px0 = rp.x + rp.w * 0.15, px1 = rp.x + rp.w * 0.84;
    var py0 = rp.y + rp.h * 0.78, py1 = rp.y + rp.h * 0.20;
    var X = function (d) { return px0 + (d / 180) * (px1 - px0); };
    var Y = function (a) { return py0 - (a / 90) * (py0 - py1); };

    el("path", { d: "M" + px0 + "," + py0 + " L" + (px1 + 9) + "," + py0, stroke: "#9aa6b2", "stroke-width": 1.1 }, gB);
    el("path", { d: "M" + (px1 + 9) + "," + py0 + " L" + (px1 + 1) + "," + (py0 - 3.6) + " L" + (px1 + 1) + "," + (py0 + 3.6) + " Z", fill: "#9aa6b2" }, gB);
    el("path", { d: "M" + px0 + "," + py0 + " L" + px0 + "," + (py1 - 9), stroke: "#9aa6b2", "stroke-width": 1.1 }, gB);
    el("path", { d: "M" + px0 + "," + (py1 - 9) + " L" + (px0 - 3.6) + "," + (py1 - 1) + " L" + (px0 + 3.6) + "," + (py1 - 1) + " Z", fill: "#9aa6b2" }, gB);

    var d = "", i, a0;
    for (i = 0; i <= 180; i += 10) {
      a0 = Math.min(i, 180 - i);
      d += (i === 0 ? "M" : " L") + X(i) + "," + Y(a0);
    }
    el("path", { d: d, fill: "none", stroke: BLUE, "stroke-width": 2 }, gB);
    el("path", { d: "M" + px0 + "," + Y(90) + " L" + px1 + "," + Y(90), stroke: "#e6e9ee", "stroke-dasharray": "4 4", "stroke-width": 1 }, gB);
    el("path", { d: "M" + X(90) + "," + py0 + " L" + X(90) + "," + Y(90), stroke: "#e6e9ee", "stroke-dasharray": "4 4", "stroke-width": 1 }, gB);

    var tk = [0, 45, 90, 135, 180];
    for (i = 0; i < tk.length; i++) {
      el("path", { d: "M" + X(tk[i]) + "," + py0 + " L" + X(tk[i]) + "," + (py0 + 4), stroke: "#9aa6b2", "stroke-width": 1 }, gB);
      tx(gB, X(tk[i]), py0 + 15, tk[i] + "°", GRAY, "middle", 8.6, 400);
    }
    var yk = [0, 45, 90];
    for (i = 0; i < yk.length; i++) {
      el("path", { d: "M" + (px0 - 4) + "," + Y(yk[i]) + " L" + px0 + "," + Y(yk[i]), stroke: "#9aa6b2", "stroke-width": 1 }, gB);
      tx(gB, px0 - 7, Y(yk[i]) + 3, yk[i] + "°", GRAY, "end", 8.6, 400);
    }

    var cx = X(A), cy = Y(s.angle);
    el("path", { d: "M" + cx + "," + py0 + " L" + cx + "," + cy, stroke: RED, "stroke-dasharray": "3 3", "stroke-width": 1 }, gB);
    el("circle", { cx: cx, cy: cy, r: 4.6, fill: "#ffffff", stroke: RED, "stroke-width": 1.8 }, gB);

    var lab = "θ=" + Math.round(A) + "°，夹角=" + Math.round(s.angle) + "°";
    var anc = A > 96 ? "end" : "start";
    tx(gB, cx + (A > 96 ? -8 : 8), cy - 10, lab, RED, anc, 9.2, 700);
    tx(gB, px0 - 7, py1 - 12, "夹角", GRAY, "end", 8.6, 700);
    tx(gB, px1, py0 + 30, "θ", GRAY, "middle", 8.6, 700);
    wrap(gB, rp.x + 14, rp.y + rp.h - 46, "山形顶点在 θ=90°：直二面角，两平面垂直；钝角一侧的夹角是 180°−θ。", rp.w - 28, 9.2, GRAY, 13);
  }

  function render() {
    var s = calc(A), st, col, bg, sn;
    $("gxVa").textContent = Math.round(A) + "°";
    $("gxVb").textContent = Math.round(s.angle) + "°";
    $("gxVc").textContent = Math.round(s.sup) + "°";
    if (s.kind === 0) { st = "锐二面角"; col = AMB; bg = "#fdf3e0"; sn = "θ<90°：夹角就等于 θ"; }
    else if (s.kind === 1) { st = "直二面角"; col = GRN; bg = "#e6f6ee"; sn = "θ=90°：α⊥β，两平面垂直"; }
    else { st = "钝二面角"; col = RED; bg = "#fbeae7"; sn = "θ>90°：夹角取 180°−θ"; }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    draw();
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 60 }, { t: 1.2, v: 60 }, { t: 4, v: 90 }, { t: 6.5, v: 90 }, { t: 9, v: 120 }, { t: 11.5, v: 120 }, { t: 13, v: 60 }],
    keys: [60, 90, 120, 180],
    value: A, min: 0, max: 180, step: 5,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc, cases: [
    { v: 60, eq: { angle: 60, kind: 0, sup: 120 } },
    { v: 90, eq: { angle: 90, kind: 1, sup: 90 } },
    { v: 120, eq: { angle: 60, kind: 2, sup: 60 } },
    { v: 180, eq: { angle: 0, sup: 0 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
