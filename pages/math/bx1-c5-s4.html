<p class="gx-lede">这一节是「三角函数」从式子走向图象的分界线：前面只算值，这里开始看整条曲线怎么起伏、怎么重复。最容易错的一件事，是把 sin/cos 的周期 2π 顺手写给 tan，或者把单调区间写成 [−π/2, π/2] 而漏掉 2kπ。记住：图象有五个关键点，性质有四栏表，答题按表写。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 正弦函数的性质<span class="q-src">人教A版必修第一册 · 第五章第4节</span></p>
<p class="q-b">正弦函数 y=sin x 的定义域是 R，值域是 [−1, 1]，最小正周期是 2π。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个条件</b>组成——① 对任意实数 x 都有定义；② 函数值被压在 −1 与 1 之间；③ 每隔 2π 图象完整重复一次。少写「最小」两个字，周期就成了 4π、6π 也算对，高考按错处理；值域写成 [0,1] 则是把正弦当成了 |sin x|。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 单调性<span class="q-src">人教A版必修第一册 · 第五章第4节</span></p>
<p class="q-b">正弦函数在 [−π/2+2kπ, π/2+2kπ] (k∈Z) 上递增，在 [π/2+2kπ, 3π/2+2kπ] (k∈Z) 上递减。</p>
<p class="q-n">→ 翻成人话：单调区间是<b>一整套区间</b>，不是一段。k 取遍所有整数，所以 [−π/2, π/2]、[3π/2, 5π/2] 都递增；漏掉 +2kπ，就等于只承认原点附近那一段，是本节最高频的扣分点。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 正切函数的定义域与周期<span class="q-src">人教A版必修第一册 · 第五章第4节</span></p>
<p class="q-b">正切函数 y=tan x 的定义域是 {x | x≠π/2+kπ, k∈Z}，最小正周期是 π。</p>
<p class="q-n">→ 翻成人话：正切的周期是 <b>π 不是 2π</b>；定义域要挖掉所有使 cos x=0 的点，写成 x≠π/2+kπ 才完整。周期和定义域这两条必须同时写，缺一条整题失分。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>要记的结论</th><th>必须带的条件</th><th>漏了会怎样</th></tr></thead>
<tbody>
<tr><td>sin x、cos x 的值域 [−1, 1]</td><td>在定义域 R 上整体看</td><td>只看一段图象，会把值域写成 [0, 1]</td></tr>
<tr class="key"><td>单调区间 [−π/2+2kπ, π/2+2kπ] 等</td><td>结尾必须写 +2kπ，k∈Z</td><td>只写 [−π/2, π/2]，对一个周期，判 0 分</td></tr>
<tr><td>最小正周期：sin/cos 为 2π，tan 为 π</td><td>按函数区分，不能一律 2π</td><td>tan 的周期写成 2π，直接概念错</td></tr>
<tr><td>对称轴 x=π/2+kπ（sin/cos）</td><td>对称中心是点 (kπ, 0)</td><td>把中心写成轴，或把轴写成点，概念混淆</td></tr>
<tr><td>tan x 的定义域 x≠π/2+kπ</td><td>分母 cos x≠0</td><td>漏掉 π/2+kπ，定义域残缺</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">背法：周期看函数，单调看区间，对称看对象。三句各管一件事，答题时逐条对号，不要用一句「周期是 2π」包打天下。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 求周期与最大值<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">已知函数 <span class="gx-fml">y = 2sin(2x − π/3)</span>。（1）求它的最小正周期；（2）求它的最大值，以及取到最大值时 x 的集合。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题，对照标准形</p>
<p class="s-b">函数已经是 y = A sin(ωx + φ) 的标准形，读出 A = 2，ω = 2，φ = −π/3。周期只由 ω 决定，最大值只由 A 决定，两者互不干扰。</p>
<p class="s-k">用到：y = A sin(ωx + φ) 中 A 叫振幅、ω 决定周期。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 算最小正周期</p>
<p class="s-b">T = 2π/|ω| = 2π/2 = π。注意分母是 ω 的绝对值，不是 2π 乘 ω；分子 2π 是因为正弦的周期是 2π，与振幅 A=2 无关。</p>
<p class="s-k">用到：周期公式 T = 2π/|ω|，sin/cos 用 2π，tan 才用 π。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 求最大值</p>
<p class="s-b">因为 sin 的值域是 [−1, 1]，所以 2sin(2x−π/3) 的值域是 [−2, 2]，最大值是 2（由振幅 A=2 决定），最小值是 −2。</p>
<p class="s-k">用到：值域 [−|A|, |A|]；最大值为 |A|，不是 A² 也不是 2π。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 列取到最大值的条件</p>
<p class="s-b">令 2x − π/3 = π/2 + 2kπ (k∈Z)。解出 2x = 5π/6 + 2kπ，所以 x = 5π/12 + kπ (k∈Z)。这里必须带 2kπ，因为正弦每转一圈才回到峰值一次。</p>
<p class="s-k">用到：sin θ = 1 ⇔ θ = π/2 + 2kπ；单调区间与最值条件都要带 2kπ。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 写规范答案</p>
<p class="s-b">先写周期，再写最大值，最后写取到最大值时 x 的集合；集合要写 {x | x = 5π/12 + kπ, k∈Z}，不能只写一个 x = 5π/12。</p>
<p class="s-k">用到：答案的完整性——周期、最值、取等条件三件套。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）T = 2π/|ω| = 2π/2 = π，所以最小正周期为 π。<br>（2）当 sin(2x−π/3) = 1 时，y 取最大值 2。由 2x−π/3 = π/2+2kπ (k∈Z)，得 x = 5π/12+kπ (k∈Z)。所以最大值为 2，取到最大值时 x 的集合为 {x | x = 5π/12+kπ, k∈Z}。</p>
</div>
</div>
</section>
<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「sin 和 tan 的周期不都是 2π 吗？」</p>
<p class="a">不是。<b>sin、cos 的最小正周期是 2π，tan 的是 π</b>。周期看函数本身，不能一律套 2π；正切图象每隔 π 就完整重复一次。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="正弦周期 2π 与正切周期 π 的对比">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text class="ms" x="120" y="30" text-anchor="middle" font-size="9" fill="#5a6472">周期看函数</text>
<text class="ms" x="120" y="62" text-anchor="middle" font-size="10" fill="#2563eb">sin x：T = 2π</text>
<text class="ms" x="120" y="88" text-anchor="middle" font-size="10" fill="#b8791f">tan x：T = π</text>
<text class="ms" x="120" y="112" text-anchor="middle" font-size="8" fill="#5a6472">写错一个，整题概念分没了</text>
</svg>
</div>

<div class="qac">
<p class="q">「单调区间写 [−π/2, π/2] 为什么算错？」</p>
<p class="a">因为正弦函数是周期函数，<b>增区间是一整套，必须写 [−π/2+2kπ, π/2+2kπ]，k∈Z</b>。漏掉 2kπ 只描述了原点附近那一个周期，漏解就是错。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="单调区间必须加 2kπ 的示意">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text class="ms" x="120" y="30" text-anchor="middle" font-size="9" fill="#5a6472">增区间要写全</text>
<text class="ms" x="120" y="58" text-anchor="middle" font-size="9.4" fill="#b8402f">✗ [−π/2, π/2]</text>
<text class="ms" x="120" y="82" text-anchor="middle" font-size="9.4" fill="#2f8a5b">✓ [−π/2+2kπ, π/2+2kπ]</text>
<text class="ms" x="120" y="108" text-anchor="middle" font-size="8" fill="#5a6472">k∈Z，一圈都不能少</text>
</svg>
</div>

<div class="qac">
<p class="q">「对称轴和对称中心怎么总写反？」</p>
<p class="a"><b>对称轴是直线，对称中心是点</b>。对 sin x：对称轴 x=π/2+kπ，对称中心 (kπ, 0)；对 cos x：对称轴 x=kπ，对称中心 (π/2+kπ, 0)。写中心必须带括号和纵坐标 0。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="对称轴是直线、对称中心是点的示意">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="60" y1="26" x2="60" y2="108" stroke="#b8402f" stroke-width="1.4" stroke-dasharray="4 3"/>
<circle cx="60" cy="76" r="3.4" fill="#2f8a5b"/>
<text class="ms" x="70" y="46" font-size="8.4" fill="#b8402f">轴：x=π/2+kπ</text>
<text class="ms" x="70" y="88" font-size="8.4" fill="#2f8a5b">中心：(kπ, 0)</text>
<text class="ms" x="120" y="118" text-anchor="middle" font-size="7.8" fill="#5a6472">直线 vs 点，别混</text>
</svg>
</div>

<div class="qac">
<p class="q">「余弦曲线和正弦曲线差多少？」</p>
<p class="a">差一个相位：<b>cos x = sin(x+π/2)</b>，所以把正弦曲线向左平移 π/2 就得到余弦曲线。两者形状完全相同，周期都是 2π，只是起点一个在 0、一个在 1。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="余弦曲线由正弦曲线左移二分之派得到">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<path d="M24 78 Q48 38 72 78 T120 78 T168 78 T216 78" fill="none" stroke="#2563eb" stroke-width="1.6"/>
<path d="M24 100 Q48 60 72 100 T120 100 T168 100 T216 100" fill="none" stroke="#2f8a5b" stroke-width="1.6"/>
<text class="ms" x="120" y="28" text-anchor="middle" font-size="8.6" fill="#5a6472">左移 π/2</text>
<text class="ms" x="120" y="122" text-anchor="middle" font-size="7.8" fill="#5a6472">蓝 sin，绿 cos</text>
</svg>
</div>

<div class="qac">
<p class="q">「tan x 的定义域为什么不是 R？」</p>
<p class="a">因为 tan x = sin x / cos x，<b>cos x=0 的点要挖掉</b>，即 x=π/2+kπ (k∈Z)。写成 {x | x≠π/2+kπ, k∈Z}，渐近线就在这些位置。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="正切定义域挖掉二分之派加 k 派">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="20" y1="76" x2="220" y2="76" stroke="#8d98a6" stroke-width="1"/>
<line x1="80" y1="24" x2="80" y2="108" stroke="#b8402f" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="160" y1="24" x2="160" y2="108" stroke="#b8402f" stroke-width="1.2" stroke-dasharray="4 3"/>
<text class="ms" x="80" y="120" text-anchor="middle" font-size="8" fill="#b8402f">π/2</text>
<text class="ms" x="160" y="120" text-anchor="middle" font-size="8" fill="#b8402f">3π/2</text>
<text class="ms" x="120" y="30" text-anchor="middle" font-size="8.6" fill="#5a6472">定义域挖掉渐近线</text>
</svg>
</div>

<div class="qac">
<p class="q">「最大值就是振幅吗？」</p>
<p class="a">对 y=A sin(ωx+φ)+b，<b>最大值是 |A|+b，最小值是 −|A|+b</b>；只有 b=0 时最大值才等于 |A|。本题 y=2sin(2x−π/3) 的最大值是 2，不是 2π，也不是 ω。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="振幅决定最大值但不等于周期">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="24" y1="70" x2="216" y2="70" stroke="#c3ccd6" stroke-width="1"/>
<path d="M24 70 Q45 34 66 70 T108 70 T150 70 T192 70" fill="none" stroke="#2563eb" stroke-width="1.6"/>
<text class="ms" x="120" y="24" text-anchor="middle" font-size="8.6" fill="#5a6472">y = 2sin(2x−π/3)</text>
<text class="ms" x="120" y="96" text-anchor="middle" font-size="9" fill="#2f8a5b">最大值 |A| = 2</text>
<text class="ms" x="120" y="114" text-anchor="middle" font-size="8" fill="#b8402f">周期是 π，与 2 无关</text>
</svg>
</div>
</div>
<p class="gx-note">六问其实是同一件事：周期、单调、对称、定义域、最值，各自有各自的「取值范围 + 参数 k」。答题时先问自己「这个结论属于哪一栏」，再动笔。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ tan x 的最小正周期是 2π。</p>
<p class="er-v">✓ tan x 的最小正周期是 π；sin x、cos x 的最小正周期才是 2π。</p>
<p class="er-w">错在哪：把正弦余弦的周期套给了正切。周期看函数，tan 的图象每隔 π 就重复一次。</p>
</div>
<div class="er">
<p class="er-x">✗ sin x 的单调递增区间是 [−π/2, π/2]。</p>
<p class="er-v">✓ sin x 的单调递增区间是 [−π/2+2kπ, π/2+2kπ]，k∈Z。</p>
<p class="er-w">错在哪：漏了 +2kπ，只写了一个周期。单调区间是一整套，k 要取遍所有整数。</p>
</div>
<div class="er">
<p class="er-x">✗ sin x 的对称中心是 x=π/2+kπ。</p>
<p class="er-v">✓ sin x 的对称轴是直线 x=π/2+kπ，对称中心是点 (kπ, 0)。</p>
<p class="er-w">错在哪：对称轴与对称中心混了。轴是直线，中心是点，写法上就差了括号和纵坐标。</p>
</div>
<div class="er">
<p class="er-x">✗ tan x 的定义域是 R。</p>
<p class="er-v">✓ tan x 的定义域是 {x | x≠π/2+kπ, k∈Z}。</p>
<p class="er-w">错在哪：漏掉 cos x=0 的点。正切在这些位置没有定义，图象在那里有竖直渐近线。</p>
</div>
<div class="er">
<p class="er-x">✗ y=2sin(2x−π/3) 的最大值是 2π。</p>
<p class="er-v">✓ y=2sin(2x−π/3) 的最大值是 2，最小正周期是 π。</p>
<p class="er-w">错在哪：把周期当成了最大值。最大值由振幅 |A|=2 决定，周期由 ω=2 决定，两件事分开算。</p>
</div>
<div class="er">
<p class="er-x">✗ 周期公式是 T = 2π·ω。</p>
<p class="er-v">✓ 周期公式是 T = 2π/|ω|。</p>
<p class="er-w">错在哪：乘除颠倒。ω 越大图象压缩得越厉害、周期越短，所以 ω 在分母上。</p>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var GX = window.GX, el = GX.el, tx = GX.tx, $ = GX.$;
  var stage = $("gxStage");
  if (!stage || !window.AutoPilot) return;
  var W = {
    vb: "0 0 880 470",
    left: { x: 16, y: 16, w: 424, h: 438 },
    right: { x: 456, y: 16, w: 408, h: 438 },
    cx: 228, cy: 258, r: 138,
    px0: 500, px1: 840, py: 250, amp: 90
  };
  var N = {
    vb: "0 0 360 700",
    left: { x: 8, y: 8, w: 344, h: 300 },
    right: { x: 8, y: 320, w: 344, h: 372 },
    cx: 160, cy: 170, r: 92,
    px0: 44, px1: 336, py: 505, amp: 62
  };
  var L = W, G = null, A = 0;

  function calc(v) {
    var t = v * Math.PI / 180;
    return { sin: Number(Math.sin(t).toFixed(4)), cos: Number(Math.cos(t).toFixed(4)) };
  }

  function geom() { return L; }

  function status(v) {
    if (v === 90) return { t: "sin 到峰顶 1", sn: "x=90°，cos 同时为 0", col: "#2f8a5b", bg: "#e6f6ee" };
    if (v === 270) return { t: "sin 到谷底 −1", sn: "x=270°，cos 同时为 0", col: "#b8402f", bg: "#fbeae7" };
    if (v === 180) return { t: "sin 递减", sn: "x=180°：sin 从 1 掉到 0，cos 到 −1", col: "#b8791f", bg: "#fdf3e0" };
    if (v === 0 || v === 360) return { t: "sin = 0，cos = 1", sn: "0° 与 360° 对应同一个点", col: "#2563eb", bg: "#e8f0fe" };
    if (v < 90 || v > 270) return { t: "sin 递增", sn: "x 在 (0°,90°) 或 (270°,360°) 内，sin 上升", col: "#2563eb", bg: "#e8f0fe" };
    return { t: "sin 递减", sn: "x 在 (90°,270°) 内，sin 从 1 掉到 −1", col: "#b8791f", bg: "#fdf3e0" };
  }

  function draw() {
    var L = G, gA = $("gxA"), gB = $("gxB");
    gA.textContent = ""; gB.textContent = "";
    var th = A * Math.PI / 180;
    var px = L.cx + L.r * Math.cos(th), py = L.cy - L.r * Math.sin(th);

    /* 单位圆 */
    el("rect", { x: L.left.x, y: L.left.y, width: L.left.w, height: L.left.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    tx(gA, L.left.x + 20, L.left.y + 28, "单位圆：角 x 的终边", "#5a6472", "start", 10.5, 700);
    el("line", { x1: L.cx - L.r - 28, y1: L.cy, x2: L.cx + L.r + 24, y2: L.cy, stroke: "#8d98a6", "stroke-width": 1.1 }, gA);
    el("polygon", { points: (L.cx + L.r + 24) + "," + L.cy + " " + (L.cx + L.r + 14) + "," + (L.cy - 4) + " " + (L.cx + L.r + 14) + "," + (L.cy + 4), fill: "#8d98a6" }, gA);
    el("line", { x1: L.cx, y1: L.cy + L.r + 28, x2: L.cx, y2: L.cy - L.r - 22, stroke: "#8d98a6", "stroke-width": 1.1 }, gA);
    el("polygon", { points: L.cx + "," + (L.cy - L.r - 22) + " " + (L.cx - 4) + "," + (L.cy - L.r - 12) + " " + (L.cx + 4) + "," + (L.cy - L.r - 12), fill: "#8d98a6" }, gA);
    el("circle", { cx: L.cx, cy: L.cy, r: L.r, fill: "#ffffff", stroke: "#c3ccd6", "stroke-width": 1.2 }, gA);
    var rr = L.r * 0.42;
    if (A >= 360) {
      el("circle", { cx: L.cx, cy: L.cy, r: rr, fill: "none", stroke: "#b8791f", "stroke-width": 2 }, gA);
    } else if (th > 0.0001) {
      var ex = L.cx + rr * Math.cos(th), ey = L.cy - rr * Math.sin(th);
      el("path", { d: "M " + (L.cx + rr) + " " + L.cy + " A " + rr + " " + rr + " 0 " + (th > Math.PI ? 1 : 0) + " 0 " + ex + " " + ey, fill: "none", stroke: "#b8791f", "stroke-width": 2 }, gA);
    }
    el("line", { x1: L.cx, y1: L.cy, x2: px, y2: L.cy, stroke: "#2f8a5b", "stroke-width": 5, "stroke-opacity": 0.35 }, gA);
    el("line", { x1: px, y1: L.cy, x2: px, y2: py, stroke: "#2563eb", "stroke-width": 2.2, "stroke-dasharray": "5 4" }, gA);
    el("line", { x1: L.cx, y1: L.cy, x2: px, y2: py, stroke: "#151a21", "stroke-width": 1.6 }, gA);
    el("circle", { cx: px, cy: py, r: 4.6, fill: "#b8791f" }, gA);
    tx(gA, L.cx + L.r + 10, L.cy + 4, "1", "#5a6472", "start", 9, 400);
    tx(gA, L.cx - L.r - 10, L.cy + 4, "−1", "#5a6472", "end", 9, 400);
    tx(gA, L.cx - 14, L.cy + 15, "O", "#5a6472", "end", 9, 400);
    if (Math.abs(px - L.cx) > 34) tx(gA, (L.cx + px) / 2, L.cy + 15, "cos x", "#2f8a5b", "middle", 8.8, 700);
    if (Math.abs(py - L.cy) > 34) tx(gA, px + 9, (L.cy + py) / 2, "sin x", "#2563eb", "start", 8.8, 700);
    tx(gA, L.cx, L.cy + L.r + 26, "x = " + A + "°", "#b8791f", "middle", 11, 700);

    /* 曲线 */
    el("rect", { x: L.right.x, y: L.right.y, width: L.right.w, height: L.right.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    tx(gB, L.right.x + 20, L.right.y + 28, "一个周期：sin x（蓝）、cos x（绿）", "#5a6472", "start", 10.5, 700);
    el("line", { x1: L.px0 - 14, y1: L.py, x2: L.px1 + 10, y2: L.py, stroke: "#8d98a6", "stroke-width": 1.1 }, gB);
    el("line", { x1: L.px0, y1: L.py + L.amp + 16, x2: L.px0, y2: L.py - L.amp - 16, stroke: "#8d98a6", "stroke-width": 1.1 }, gB);
    var ps = "", pc = "", d;
    for (d = 0; d <= 360; d += 5) {
      var xx = L.px0 + (L.px1 - L.px0) * d / 360;
      ps += (d === 0 ? "M" : "L") + xx.toFixed(1) + " " + (L.py - L.amp * Math.sin(d * Math.PI / 180)).toFixed(1) + " ";
      pc += (d === 0 ? "M" : "L") + xx.toFixed(1) + " " + (L.py - L.amp * Math.cos(d * Math.PI / 180)).toFixed(1) + " ";
    }
    el("path", { d: ps, fill: "none", stroke: "#2563eb", "stroke-width": 2.1 }, gB);
    el("path", { d: pc, fill: "none", stroke: "#2f8a5b", "stroke-width": 2.1 }, gB);
    var qx = L.px0 + (L.px1 - L.px0) * A / 360;
    el("line", { x1: qx, y1: L.py - L.amp - 10, x2: qx, y2: L.py + L.amp + 10, stroke: "#b8791f", "stroke-width": 1.1, "stroke-dasharray": "4 3" }, gB);
    el("circle", { cx: qx, cy: L.py - L.amp * Math.sin(th), r: 4.2, fill: "#2563eb" }, gB);
    el("circle", { cx: qx, cy: L.py - L.amp * Math.cos(th), r: 4.2, fill: "#2f8a5b" }, gB);
    var marks = [0, 90, 180, 270, 360];
    for (var i = 0; i < marks.length; i++) {
      var mx = L.px0 + (L.px1 - L.px0) * marks[i] / 360;
      tx(gB, mx, L.py + 17, marks[i] + "°", "#5a6472", "middle", 8.4, 400);
    }
    tx(gB, L.px0 - 8, L.py - L.amp + 4, "1", "#5a6472", "end", 8.4, 400);
    tx(gB, L.px0 - 8, L.py + L.amp + 4, "−1", "#5a6472", "end", 8.4, 400);
    var ly = L.py + L.amp + (L.right.h > 400 ? 62 : 44);
    tx(gB, L.right.x + 24, ly + 4, "sin x", "#2563eb", "start", 9.6, 700);
    tx(gB, L.right.x + 84, ly + 4, "cos x", "#2f8a5b", "start", 9.6, 700);
    tx(gB, L.right.x + 24, ly + 24, "sin 周期 2π = 360°；tan 才是 π", "#5a6472", "start", 8.6, 400);
  }

  function render() {
    if (!G) { L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N; G = geom(); stage.setAttribute("viewBox", L.vb); }
    var s = calc(A), st = status(A);
    $("gxVa").textContent = A + "°";
    $("gxVb").textContent = s.sin.toFixed(2);
    $("gxVc").textContent = s.cos.toFixed(2);
    $("gxVs").textContent = st.t;
    $("gxVsn").textContent = st.sn;
    $("gxStBox").style.background = st.bg;
    $("gxStBox").style.borderColor = st.col + "44";
    $("gxVs").style.color = st.col;
    draw();
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    G = null;
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 0 }, { t: 1.2, v: 0 }, { t: 4, v: 90 }, { t: 6.5, v: 180 }, { t: 9, v: 180 }, { t: 11.5, v: 270 }, { t: 13.5, v: 0 }],
    keys: [0, 90, 180, 270],
    value: A, min: 0, max: 360, step: 15,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc, cases: [
    { v: 30, eq: { sin: 0.5, cos: 0.866 } },
    { v: 90, eq: { sin: 1, cos: 0 } },
    { v: 180, eq: { sin: 0, cos: -1 } },
    { v: 270, eq: { sin: -1, cos: 0 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
