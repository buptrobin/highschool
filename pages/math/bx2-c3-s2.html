<p class="gx-claim">斜二测画法只做三件事：<b>建系</b>、<b>角取 45°</b>、<b>只有 y 方向减半</b>。</p>

<p class="gx-lede">这一节在立体几何的开头：先把空间图形画到平面上，后面画棱柱、棱锥、棱台才有统一的画法。判断画得对不对只有三把尺子——角是不是 45°、平行关系有没有保住、y 方向有没有减半。最容易错的地方是「只有 y 方向减半」被记成「整体缩小一半」，于是面积比被写成 1/2，其实它是 √2/4 ≈ 0.354。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 斜二测画法的三条规则<span class="q-src">人教A版必修第二册 · 第8章第2节</span></p>
<p class="q-b">「在已知图形中取互相垂直的 x 轴和 y 轴，两轴交于点 O；画直观图时，把它们画成对应的 x′ 轴与 y′ 轴，两轴交于点 O′，且使 ∠x′O′y′ = 45°（或 135°）。已知图形中平行于 x 轴或 y 轴的线段，在直观图中分别画成平行于 x′ 轴或 y′ 轴的线段。已知图形中平行于 x 轴的线段，在直观图中长度不变；平行于 y 轴的线段，长度变为原来的一半。」</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个条件</b>组成——① 建系，x⊥y，交于 O；② 角是 45°（或 135°），不是 90°；③ <b>只有 y 方向减半</b>，x 方向长度不变。少第②条就成了正投影，少第③条画出来还是原图。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 平行性与长度<span class="q-src">人教A版必修第二册 · 第8章第2节</span></p>
<p class="q-b">「原图中平行的线段，在直观图中仍然平行；原图中相等的线段，在直观图中不一定相等。」</p>
<p class="q-n">→ 这句话决定了直观图的性质：<b>平行性保留，长度和角度不保留</b>。所以正方形能画成平行四边形、圆能画成椭圆，但它们不能再用来量角。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 立体图形要多一条 z′ 轴<span class="q-src">人教A版必修第二册 · 第8章第2节</span></p>
<p class="q-b">「画空间图形的直观图时，在 x 轴、y 轴之外再取 z 轴；在直观图中 z′ 轴与 x′ 轴垂直，平行于 z 轴的线段长度保持不变。」</p>
<p class="q-n">→ 加成：立体图形比平面图形多一个方向，但减半的规矩没变——仍然<b>只有 y 方向减半</b>，x 方向和 z 方向都不动。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>条件</th><th>具体做法</th><th>缺了会怎样</th></tr></thead>
<tbody>
<tr><td>① 建系</td><td>原图取互相垂直的 x 轴、y 轴，交于 O</td><td>没有「平行于坐标轴」的判据，无从下手</td></tr>
<tr><td>② 定角</td><td>∠x′O′y′ = 45°（或 135°）</td><td>画成 90° 就是正投影，面积比从 √2/4 变成 1/2</td></tr>
<tr><td>③ 保平行</td><td>平行于 x 轴、y 轴的线段，仍画成平行于 x′ 轴、y′ 轴</td><td>平行四边形画成一般四边形，图形无法还原</td></tr>
<tr><td>④ 保 x 向</td><td>平行于 x 轴的线段长度不变</td><td>底边被缩短，整个图形比例失真</td></tr>
<tr class="key"><td>⑤ 只减 y 向</td><td>平行于 y 轴的线段长度变为原来的一半</td><td>不减半就还是原图；x 也减半就整体缩小，面积比被错算成 1/4</td></tr>
<tr><td>⑥ 立体图形</td><td>加 z′ 轴，z′ ⊥ x′，平行于 z 轴的线段长度不变</td><td>棱柱的高画错，立体图形整体垮掉</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只高亮第 ⑤ 行：那是斜二测和「整体缩小」唯一的区别。检查一张直观图，先量 y 方向的长度有没有减半，再看角是不是 45°，最后才看形状像不像。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 直观图面积（解答题）<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">边长为 2 的正方形 ABCD，边 AB 平行于 x 轴、边 AD 平行于 y 轴。用斜二测画法画出它的直观图 A′B′C′D′，求这个直观图的面积。<br>陷阱：很多人算出「2」，因为把面积比当成了 1/2。请你写出完整过程，并用公式核对一次。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题，先把原图面积摆出来</p>
<p class="s-b">正方形边长 2，原面积 S = 2×2 = 4。题目问的是「直观图的面积」，不是原图的面积，也不是周长。</p>
<p class="s-k">用到：正方形面积公式，先把 S 记下来，后面要用 (√2/4)S 核对。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 看底边：平行于 x 轴的线段长度不变</p>
<p class="s-b">AB 平行于 x 轴，所以 A′B′ 平行于 x′ 轴，且 A′B′ = AB = 2。底边一步就定：a′ = 2。</p>
<p class="s-k">用到：规则三前半句——平行于 x 轴的线段长度不变，不是减半。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 看另一条边：只有 y 方向减半，但它还斜着</p>
<p class="s-b">AD 平行于 y 轴，所以 A′D′ 平行于 y′ 轴，长度变成 2×(1/2) = 1。关键在下一步：这条边与 x′ 轴成 45°，它贡献的「高」只是它的竖直分量，即 h′ = 1·sin45° = √2/2 ≈ 0.707，不是 1。</p>
<p class="s-k">用到：规则二的 45° 角 + 规则三的减半，两件事同时作用在这条边上。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 底乘高，算出面积</p>
<p class="s-b">S′ = a′ · h′ = 2 × (√2/2) = √2 ≈ 1.414。注意 2 没有被减半，被减半的只有 y 方向那一条边。</p>
<p class="s-k">用到：平行四边形面积 = 底 × 高，高是垂直于底的那段，不是斜边。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 用公式核对，顺手排掉 1/2 这个坑</p>
<p class="s-b">S′ = (√2/4)·S = (√2/4)×4 = √2 ≈ 1.414，与逐边计算一致。面积比 √2/4 ≈ 0.354，不是 1/2；若得 2，就是把「y 方向减半」错当成「面积减半」。</p>
<p class="s-k">用到：面积比公式 (1/2)sin45° = √2/4，作为验算工具。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">① 原图是边长为 2 的正方形，面积 S = 2² = 4。<br>② 边 AB 平行于 x 轴，在直观图中 A′B′ 平行于 x′ 轴且长度不变，故 A′B′ = 2。<br>③ 边 AD 平行于 y 轴，在直观图中 A′D′ 平行于 y′ 轴，长度减半为 2×(1/2) = 1；又因 ∠x′O′y′ = 45°，A′D′ 在垂直于 A′B′ 方向上的投影为 h′ = 1·sin45° = √2/2。<br>④ 直观图是平行四边形，S′ = A′B′·h′ = 2 × √2/2 = √2。<br>⑤ 用公式核对：S′ = (√2/4)S = (√2/4)×4 = √2 ≈ 1.414，一致。面积比约为 0.354，不是 1/2。<br>答：直观图的面积为 √2（约 1.414）。</p>
</div>
</div>
</section>
<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「斜二测画法里，到底是哪个方向减半？」</p>

<p class="a">45° 是画法约定，不是推导出来的结论：它让立体感出来，又让高恰好是 <b>(1/2)·sin45°</b>，于是面积比固定成 √2/4。换成 30° 也能画出「像」的图，但面积比会变成 (1/2)sin30° = 1/4，不再是教材的斜二测。<b>角是 45° 不是 90°</b>。</p>

<p class="a">不是。减半的是<b>长度</b>，而且只有 y 方向；高还要再乘 sin45°，所以面积比是 <b>√2/4 ≈ 0.354</b>，不是 1/2。只有 θ = 90°（正投影）时面积比才等于 1/2。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 「斜二测画法就是把图形整体缩小一半，x 方向也减半。」</p>
<p class="er-v">✓ 只有平行于 y 轴的线段长度变为原来的一半；平行于 x 轴的线段长度不变。</p>
<p class="er-w">错在哪：把「y 方向减半」扩大成「整体缩小」。x 方向一旦也减半，底边就错了，整张图作废。</p>
</div>
<div class="er">
<p class="er-x">✗ 「y 方向减半，所以直观图的面积是原图的 1/2。」</p>
<p class="er-v">✓ 直观图面积 S′ = (√2/4)·S ≈ 0.354S，面积比不是 1/2。</p>
<p class="er-w">错在哪：长度减半不等于面积减半，何况只有 y 方向减半、高还要乘 sin45°。1/2 是 θ = 90° 正投影的值。</p>
</div>
<div class="er">
<p class="er-x">✗ 「画直观图时，把 y′ 轴画成与 x′ 轴垂直，这样更像原图。」</p>
<p class="er-v">✓ ∠x′O′y′ = 45°（或 135°），角是 45° 不是 90°。</p>
<p class="er-w">错在哪：90° 是正投影的画法，画出来面积比变成 1/2，已经不是斜二测直观图。</p>
</div>
<div class="er">
<p class="er-x">✗ 「圆的直观图还是圆，只是变小了一点。」</p>
<p class="er-v">✓ 圆的直观图是椭圆，长轴 2R 沿 x′ 轴，短轴 R 沿 y′ 轴。</p>
<p class="er-w">错在哪：两个方向缩的比例不同（x 不变、y 减半），正圆不可能保持圆形。</p>
</div>
<div class="er">
<p class="er-x">✗ 「图形越大，直观图和原图的面积比就越大。」</p>
<p class="er-v">✓ 面积比恒为 √2/4 ≈ 0.354，与图形大小、形状都无关。</p>
<p class="er-w">错在哪：比的是两个面积的比值，分子分母同时放大同样的倍数，比值不动。</p>
</div>
<div class="er">
<p class="er-x">✗ 「斜二测画法只能画正方形这类简单图形。」</p>
<p class="er-v">✓ 平面图形都能画；画空间图形时再加 z′ 轴，z′ ⊥ x′，平行于 z 轴的线段长度不变。</p>
<p class="er-w">错在哪：把例题的适用范围当成了画法的适用范围。棱柱、棱锥、圆台都用它画。</p>
</div>
<div class="er">
<p class="er-x">✗ 「直观图里原来相等的线段，画出来还相等。」</p>
<p class="er-v">✓ 原图中平行的线段在直观图中仍平行；但相等的线段在直观图中不一定相等。</p>
<p class="er-w">错在哪：斜二测保住的是平行关系，不是长度关系。只有平行于 x 轴（立体图形还包括 z 轴）的线段长度才不变。</p>

<script>

document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var GX = window.GX, el = GX.el, tx = GX.tx, $ = GX.$;
  var stage = $("gxStage");
  if (!stage || !window.AutoPilot) return;

  /* 两套坐标：宽屏 880×470，窄屏独立 360×700 */
  var W = { vb: "0 0 880 470", left: { x: 16, y: 16, w: 424, h: 438 }, right: { x: 456, y: 16, w: 408, h: 438 } };
  var N = { vb: "0 0 360 700", left: { x: 8, y: 8, w: 344, h: 300 }, right: { x: 8, y: 320, w: 344, h: 372 } };
  var L = W, A = 45;

  /* 纯函数：θ（度）→ 面积比与直观图的高。底不变，高 = (1/2)·b·sinθ，b = 2 */
  function calc(v) {
    var s = Math.sin(v * Math.PI / 180);
    return { ratio: 0.5 * s, h: s };
  }

  function line(g, x1, y1, x2, y2, col, w, dash) {
    var o = { x1: x1, y1: y1, x2: x2, y2: y2, stroke: col, "stroke-width": w || 1.2 };

  function head(g, x, y, dx, dy, col) {

  }

  function draw() {
    var gA = $("gxA"), gB = $("gxB");
    gA.textContent = ""; gB.textContent = "";
    var r = Math.min(A, 89.6) * Math.PI / 180, sn = Math.sin(r), cs = Math.cos(r);

    /* 左：直观图平行四边形（底 2 不变，y 方向 1，倾角 θ） */
    el("rect", { x: L.left.x, y: L.left.y, width: L.left.w, height: L.left.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    tx(gA, L.left.x + 20, L.left.y + 30, "直观图：底 2 不变，y 方向 1", "#5a6472", "start", 10.5, 700);
    var u = Math.min(L.left.w * 0.17, L.left.h * 0.22);
    var ox = L.left.x + L.left.w * 0.30, oy = L.left.y + L.left.h * 0.72;
    var ax = ox + 2 * u, cx = ox + u * cs, cy = oy - u * sn;
    line(gA, ox - 34, oy, ax + 46, oy, "#9aa7b4", 1.2);
    head(gA, ax + 46, oy, -9, -4, "#9aa7b4"); head(gA, ax + 46, oy, -9, 4, "#9aa7b4");
    var yx = ox + u * 1.45 * cs, yy = oy - u * 1.45 * sn;
    line(gA, ox, oy, yx, yy, "#b8791f", 1.2);
    head(gA, yx, yy, -8 * cs - 4 * sn, 8 * sn - 4 * cs, "#b8791f");

    if (sn > 0.08) line(gA, cx, cy, cx, oy, "#b8791f", 1.1, "4 3");
    if (A >= 5) {
      var ar = Math.min(34, u * 0.55);

      tx(gA, ox + ar * 1.35 * Math.cos(r / 2) + 2, oy - ar * 1.35 * Math.sin(r / 2) + 4, "θ", "#b8791f", "start", 9.5, 700);
    }
    tx(gA, ox - 10, oy + 16, "O′", "#3a3a35", "start", 9.2, 400);
    tx(gA, ax + 4, oy + 16, "A′", "#3a3a35", "start", 9.2, 400);
    tx(gA, ax + 8, oy - 6, "2", "#2f8a5b", "start", 9.6, 700);
    tx(gA, yx + 5, yy - 6, "y′", "#5a6472", "start", 9.2, 400);
    if (sn > 0.12) tx(gA, cx + 5, (cy + oy) / 2, "h", "#b8791f", "start", 9.4, 700);
    tx(gA, ox, oy + 34, "等高看得见：h = 1·sinθ", "#5a6472", "start", 9.2, 400);

    /* 右：面积比曲线 */
    el("rect", { x: L.right.x, y: L.right.y, width: L.right.w, height: L.right.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    tx(gB, L.right.x + 20, L.right.y + 30, "面积比 S′/S = (1/2)sinθ", "#5a6472", "start", 10.5, 700);
    var gx = L.right.x + 56, gy = L.right.y + L.right.h - 56, gw = L.right.w - 88, gh = L.right.h - 132;
    function yOf(v) { return gy - (v / 0.6) * gh; }
    line(gB, gx, gy, gx, gy - gh + 8, "#c9d3dc", 1.1);
    line(gB, gx, gy, gx + gw + 6, gy, "#c9d3dc", 1.1);
    line(gB, gx, yOf(0.5), gx + gw, yOf(0.5), "#d9dee4", 1, "5 4");
    line(gB, gx, yOf(0.35355), gx + gw, yOf(0.35355), "#2f8a5b", 1, "4 4");
    tx(gB, gx - 8, yOf(0.5) + 4, "1/2", "#8a949f", "end", 8.6, 400);
    tx(gB, gx - 8, yOf(0.35355) + 4, "√2/4", "#2f8a5b", "end", 8.6, 400);
    var d = "", i, v, s2;
    for (i = 0; i <= 18; i++) {
      v = i * 5; s2 = 0.5 * Math.sin(v * Math.PI / 180);

    }
    el("path", { d: d, fill: "none", stroke: "#b8791f", "stroke-width": 2 }, gB);
    el("circle", { cx: gx + gw * 0.5, cy: yOf(0.35355), r: 3.4, fill: "#2f8a5b" }, gB);
    var pr = calc(A).ratio;
    el("line", { x1: gx + gw * A / 90, y1: yOf(pr), x2: gx + gw * A / 90, y2: gy, stroke: "#b8791f", "stroke-width": 1, "stroke-dasharray": "3 3" }, gB);
    el("circle", { cx: gx + gw * A / 90, cy: yOf(pr), r: 5, fill: "#b8791f" }, gB);
    tx(gB, gx, gy + 16, "0°", "#8a949f", "start", 8.8, 400);
    tx(gB, gx + gw * 0.5, gy + 16, "45°", "#2f8a5b", "middle", 8.8, 700);
    tx(gB, gx + gw, gy + 16, "90°", "#8a949f", "end", 8.8, 400);
    tx(gB, gx + gw * 0.5, gy + 32, "θ（y′ 轴与 x′ 轴的夹角）", "#5a6472", "middle", 8.8, 400);
  }

  function render() {
    var s = calc(A), st, col, bg, sn;
    $("gxVa").textContent = String(Math.round(A)) + "°";
    $("gxVb").textContent = s.ratio.toFixed(3);
    $("gxVc").textContent = s.h.toFixed(2);
    if (A <= 0) { st = "退化"; col = "#b8402f"; bg = "#fbeae7"; sn = "两轴重合，图形压成一条线，面积为 0"; }

  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });

});
