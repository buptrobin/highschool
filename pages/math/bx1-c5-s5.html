<p class="gx-lede">这一节是第五章的收口：先用单位圆推出两角差的余弦，再令 β=α 得到二倍角，最后把 asinx+bcosx 收成一个正弦。三块内容其实是一条链，链条上每一环都只靠<b>平方关系</b>和<b>符号</b>两件事。最容易错的一件事：cos2α 有三个等价形式，选错只是多算两步；但开方漏掉 ± 是直接丢分。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 两角差的余弦公式<span class="q-src">人教A版必修第一册 · 第五章第五节</span></p>
<p class="q-b">对于任意角 α，β，有 cos(α−β)=cosαcosβ+sinαsinβ。此公式给出了任意角 α，β 的正弦、余弦与其差角的余弦之间的关系。</p>
<p class="q-n">→ 翻成人话：这句话由<b>两个条件</b>组成——① α、β 是<b>任意角</b>（不限于锐角，所以能代负角、代 2α）；② 右边是<b>同名函数相乘再相加</b>，中间是「减号配加号」。少掉①就只能算锐角，少掉②符号必错。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 二倍角的正弦、余弦<span class="q-src">人教A版必修第一册 · 第五章第五节</span></p>
<p class="q-b"><span class="gx-fml">sin2α = 2sinαcosα</span>；<span class="gx-fml">cos2α = cos²α−sin²α = 2cos²α−1 = 1−2sin²α</span>。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个条件</b>组成——① 角是 <b>2α</b> 与 <b>α</b> 的倍数关系，不是 α 与 β；② 余弦的三个式子<b>同源</b>，靠 sin²α+cos²α=1 互相消元得到；③ 三个式子<b>值相等、算量不同</b>，所以「按需选」是公式的一部分，不是技巧。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 同角三角函数的基本关系<span class="q-src">人教A版必修第一册 · 第五章第五节</span></p>
<p class="q-b">同一个角 α 的正弦、余弦的平方和等于 1，即 <span class="gx-fml">sin²α + cos²α = 1</span>。</p>
<p class="q-n">→ 翻成人话：这句话由<b>一个条件</b>组成——必须是<b>同一个角</b>。它有两个用法：正向消元（把 cos²α 换成 1−sin²α），反向开方（cosα=±√(1−sin²α)）。开方出来的 ± 不是可写可不写，符号由 α 所在象限决定。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>公式成立靠什么</th><th>具体内容</th><th>缺了会怎样</th></tr></thead>
<tbody>
<tr><td>角是任意角</td><td>差角公式对任意 α、β 成立，可代负角、可代 2α</td><td>只敢代锐角，遇到 π+α 就卡住</td></tr>
<tr><td>减号配加号</td><td>cos(α−β) 右边是「加」，cos(α+β) 右边才是「减」</td><td>和差角四个公式的符号全串</td></tr>
<tr><td>β 换成 α</td><td>和角公式里令 β=α，才得到 sin2α=2sinαcosα</td><td>以为二倍角是另一条公式，记混系数</td></tr>
<tr class="key"><td>开方要带 ±</td><td>cosα=±√(1−sin²α)，± 由 α 所在象限决定</td><td>只写正根，答案直接错一半</td></tr>
<tr><td>三形式同源</td><td>cos2α=cos²α−sin²α=2cos²α−1=1−2sin²α</td><td>只背一种，已知 sinα 时多算两步还易错</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">背法：<b>和差看符号、二倍看系数、开方看象限</b>。整张表只有一行是高亮的那条——开方不带 ±，是本卷最常见的整题丢分点。</p>
</section>

<section class="gx-sec" id="b">
<h2><span class="sn">02</span>拆开看</h2>
<p class="gx-h2s">四张图：各讲一件事，按「是什么 → 怎么变 → 怎么用」排。</p>

<figure class="gx-fig">
<div class="fig-cap">

<span class="bdg bdg-must">必考</span>
</div>
<p class="fig-s">先看<b>函数名</b>：余弦公式右边是<b>同名</b>相乘（cos 配 cos、sin 配 sin），正弦公式右边是<b>异名</b>相乘（sin 配 cos）。再看<b>中间符号</b>：余弦「减变加、加变减」，正弦「同号照抄」。表里四行就是全部，tan 那行由 sin 除以 cos 得到，分母符号正好相反。</p>
<div class="gx-svgbox">
<svg viewBox="0 0 820 300" role="img" aria-label="两角和与差的余弦、正弦、正切公式表">
<rect x="16" y="16" width="788" height="268" rx="10" fill="#f8fbfd" stroke="#dbe7ef"/>
<text x="36" y="42" font-size="11.5" font-weight="700" fill="#151a21">和差角公式：四行全覆盖</text>

<text x="600" y="246" font-size="9.4" fill="#5a6472">分子同号，分母反过来</text>
<text x="40" y="272" font-size="9.2" fill="#8a94a0">用法：令 β=α，上面第一、三行立刻退化成二倍角公式——二倍角不是新公式。</text>
</svg>
<span class="gx-zoomchip">点击放大</span>
</div>
<p class="gx-take">和差角只要记两件事：<b>余弦同名、正弦异名</b>；<b>余弦的符号要反、正弦的照抄</b>。二倍角是把 β 写成 α 的特例。</p>
<p class="gx-note">口径提醒：表中 α、β 都是任意角，所以可以代负角、代 π/2+α，这是后面化简的底气。</p>
</figure>

<figure class="gx-fig">
<div class="fig-cap">
<span class="fig-no">图 2</span><span class="fig-t">cos2α 的三种形式与选用顺序</span>
<span class="bdg bdg-key">辨析</span>
</div>
<p class="fig-s">三个式子算出来是<b>同一个数</b>，区别只在<b>需要哪个已知量</b>。看题干给了 sinα 就用第三种（只含 sin²α），给了 cosα 就用第二种（只含 cos²α），两个都给了才用第一种。选错不会算错，但会把一步能出的结果拖成三步，中间还多一次平方出错的机会。</p>
<div class="gx-svgbox">
<svg viewBox="0 0 820 300" role="img" aria-label="二倍角余弦的三种形式与选用条件">
<rect x="16" y="16" width="788" height="268" rx="10" fill="#f8fbfd" stroke="#dbe7ef"/>
<text x="36" y="42" font-size="11.5" font-weight="700" fill="#151a21">sin2α 一个式子，cos2α 三个式子</text>
<rect x="40" y="56" width="740" height="46" rx="8" fill="#ffffff" stroke="#b8d9f2"/>
<text x="56" y="76" font-size="9.6" font-weight="700" fill="#2563eb">sin2α</text>
<text x="120" y="76" font-size="10" fill="#151a21">sin2α = 2sinαcosα</text>
<text x="380" y="76" font-size="9.4" fill="#5a6472">只要 sinα、cosα 都有值，直接乘，只有这一种写法</text>
<text x="56" y="93" font-size="9.2" fill="#8a94a0">系数是 2，不是 2α；sin2α ≠ 2sinα</text>

<rect x="40" y="114" width="236" height="104" rx="8" fill="#ffffff" stroke="#cfe0ee"/>
<text x="54" y="136" font-size="9.4" font-weight="700" fill="#5a6472">形式一</text>
<text x="54" y="158" font-size="9.8" fill="#151a21">cos2α = cos²α − sin²α</text>
<text x="54" y="180" font-size="9.2" fill="#5a6472">sinα、cosα 都知道时最省</text>
<text x="54" y="198" font-size="9.2" fill="#5a6472">一步代入，不用转公式</text>

<rect x="292" y="114" width="236" height="104" rx="8" fill="#ffffff" stroke="#cfe0ee"/>

<rect x="544" y="114" width="236" height="104" rx="8" fill="#ffffff" stroke="#b8e6d0"/>

<text x="558" y="158" font-size="9.8" fill="#151a21">cos2α = 1 − 2sin²α</text>
<text x="558" y="180" font-size="9.2" fill="#5a6472">只已知 sinα 时用它</text>
<text x="558" y="198" font-size="9.2" fill="#5a6472">不用管 cosα 的正负</text>

<line x1="40" y1="232" x2="780" y2="232" stroke="#e6eef4"/>
<text x="40" y="254" font-size="9.4" fill="#3a3a35">三个式子的关系：把 cos²α−sin²α 中的 cos²α 换成 1−sin²α 得形式三，把 sin²α 换成 1−cos²α 得形式二。</text>
<text x="40" y="272" font-size="9.2" fill="#8a94a0">所以「三种形式按需选」不是背三个公式，是背一条 sin²α+cos²α=1 加两次消元。</text>

<p class="gx-take">先看题干给了<b>哪个函数值</b>，再挑<b>只含这个函数</b>的形式：给 sinα 选 <span class="gx-fml">cos2α = 1 − 2sin²α</span>，给 cosα 选 <span class="gx-fml">cos2α = 2cos²α − 1</span>。</p>

<figure class="gx-fig">
<div class="fig-cap">
<span class="fig-no">图 3</span><span class="fig-t">平方关系与开方的符号判定</span>

<p class="fig-s">左边四格是<b>符号表</b>：sin、cos、tan 在各象限的正负。右边是从 sin²α+cos²α=1 反解 cosα 的过程，开方那一步必须先写 ±，再<b>回象限表查符号</b>。所以顺序是固定的：先定象限 → 再定符号 → 最后才写数。</p>

<figure class="gx-fig">

<p class="fig-s">把系数当成直角三角形的两条直角边：<b>a 是 sinx 的系数</b>，<b>b 是 cosx 的系数</b>，斜边就是振幅 √(a²+b²)。角 φ 由 tanφ=b/a 定，并且要<b>看 (a, b) 落在哪个象限</b>才能定 φ 的真值，只写 arctan 会漏掉第二、三象限的情况。</p>

<text x="36" y="42" font-size="11.5" font-weight="700" fill="#151a21">系数三角形 → 振幅与初相</text>
<line x1="84" y1="110" x2="84" y2="244" stroke="#2563eb" stroke-width="1.6"/>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 给一个函数值求二倍角<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">已知 <span class="gx-fml">sinα = 3/5</span>，且 <span class="gx-fml">α ∈ (π/2, π)</span>，求 sin2α 与 cos2α 的值。<br>陷阱：题干没给 cosα，需要自己用平方关系求，<b>而开方有正负两个根</b>。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 先定象限，不急着算</p>
<p class="s-b">α∈(π/2, π) ⇒ α 是第二象限角 ⇒ sinα&gt;0，cosα&lt;0。已知 sinα=3/5&gt;0，与象限一致。这一步只写结论，不写数字。</p>
<p class="s-k">用到：三角函数在各象限的符号。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 用 sin²α+cos²α=1 求 cosα，开方带 ±</p>
<p class="s-b">cos²α = 1 − sin²α = 1 − 9/25 = 16/25，所以 cosα = ±4/5。由第 1 步 cosα&lt;0，取 cosα = −4/5。<b>± 不能省，也不能凭感觉取正。</b></p>
<p class="s-k">用到：平方关系 + 象限定号。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · sin2α 代二倍角正弦</p>
<p class="s-b"><span class="gx-fml">sin2α = 2sinαcosα</span> = 2 × (3/5) × (−4/5) = −24/25。</p>
<p class="s-k">用到：sin2α=2sinαcosα，系数是 2 不是 2α。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · cos2α 选只含 sinα 的形式</p>
<p class="s-b">题干只给了 sinα，所以选 <b><span class="gx-fml">cos2α = 1 − 2sin²α</span></b> = 1 − 2 × 9/25 = 1 − 18/25 = 7/25。若用 cos²α−sin²α 也能得 16/25 − 9/25 = 7/25，但要先把 cosα 平方。</p>
<p class="s-k">用到：二倍角余弦三种形式，按已知量选一种。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 用象限做一次合理性检验</p>
<p class="s-b">α∈(π/2, π) ⇒ 2α∈(π, 2π)，是第三或第四象限角。算得 sin2α=−24/25&lt;0、cos2α=7/25&gt;0，对应的正是第四象限，自洽。</p>
<p class="s-k">用到：角的范围 + 两个函数值的符号互相印证。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">解：因为 α∈(π/2, π)，所以 cosα&lt;0。<br>
由 sin²α+cos²α=1 得 cos²α=1−(3/5)²=16/25，故 cosα=−4/5。<br>
所以 sin2α=2sinαcosα=2×(3/5)×(−4/5)=−24/25；<br>
cos2α=1−2sin²α=1−2×(3/5)²=1−18/25=7/25。<br>
（也可由 cos2α=cos²α−sin²α=16/25−9/25=7/25 验算。）</p>
</div>
</div>
</section>
<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">二倍角公式到底有几种写法？要背几个？</p>
<p class="a">真正要记的是<b>两个</b>：<span class="gx-fml">sin2α = 2sinαcosα</span> 和 <span class="gx-fml">cos2α = cos²α−sin²α</span>。另外两个式子由 <b>sin²α+cos²α=1</b> 消元得到，所以 cos2α 共<b>三种形式</b>，值相同、算量不同。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="二倍角公式的两个来源与三个形式">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="36" text-anchor="middle" font-size="9.5" fill="#151a21">sin2α = 2sinαcosα</text>
<text x="120" y="60" text-anchor="middle" font-size="9.5" fill="#151a21">cos2α = cos²α − sin²α</text>
<line x1="40" y1="72" x2="200" y2="72" stroke="#c9d6e0"/>
<text x="120" y="94" text-anchor="middle" font-size="9" fill="#2563eb">↓ 用 sin²α+cos²α=1 消元</text>
<text x="120" y="114" text-anchor="middle" font-size="9" fill="#2f8a5b">再得 2cos²α−1 与 1−2sin²α</text>
</svg>
</div>
<div class="qac">
<p class="q">开方求 cosα，为什么答案要带 ±？什么时候可以不写？</p>
<p class="a">因为 cos²α=1−sin²α 只确定<b>平方值</b>，正负两个数平方后一样。所以先写 <b>±</b>，再看 α 所在象限定号；<b>只有当题干已经给出角所在象限</b>时才不必讨论，不是可以不写。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="开方取正负由象限决定">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="34" text-anchor="middle" font-size="9" fill="#5a6472">cos²α = 1 − sin²α</text>
<text x="120" y="64" text-anchor="middle" font-size="10" fill="#b8402f">cosα = ±√(1 − sin²α)</text>
<text x="72" y="92" text-anchor="middle" font-size="8.6" fill="#2f8a5b">一、四象限取 +</text>
<text x="176" y="92" text-anchor="middle" font-size="8.6" fill="#2f8a5b">二、三象限取 −</text>
<text x="120" y="114" text-anchor="middle" font-size="8.6" fill="#8a94a0">漏 ± = 漏一半答案</text>
</svg>
</div>
<div class="qac">
<p class="q">asinx+bcosx 怎么收成一个正弦？系数怎么摆？</p>
<p class="a">提出振幅 <b>√(a²+b²)</b>，括号里就成了 cosφ·sinx + sinφ·cosx，正好是<b>和角正弦</b>。摆法是死的：<b>a 是 sinx 的系数、b 是 cosx 的系数</b>，tanφ=b/a 且 φ 与 (a, b) 同象限。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="辅助角公式的系数三角形">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="56" y1="42" x2="56" y2="100" stroke="#2563eb" stroke-width="1.5"/>
<line x1="56" y1="100" x2="150" y2="100" stroke="#2563eb" stroke-width="1.5"/>
<line x1="56" y1="42" x2="150" y2="100" stroke="#b8402f" stroke-width="1.6"/>
<text x="46" y="74" font-size="9" fill="#2563eb">a</text>
<text x="102" y="114" font-size="9" fill="#2563eb">b</text>
<text x="112" y="60" font-size="8.6" fill="#b8402f">√(a²+b²)</text>
<text x="66" y="58" font-size="9" fill="#2f8a5b">φ</text>
<text x="168" y="76" font-size="8.8" fill="#151a21">tanφ = b/a</text>
</svg>
</div>
<div class="qac">
<p class="q">求 cos2α 时，三个形式选哪个最快？</p>
<p class="a">看题干给了谁：<b>只给 sinα</b> 就用 1−2sin²α，<b>只给 cosα</b> 就用 2cos²α−1，<b>两个都有</b>才用 cos²α−sin²α。选对形式能少一次开方、少一次判断符号。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="按已知量选择 cos2α 的形式">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="16" y="34" font-size="8.8" fill="#5a6472">已知 → 选用</text>
<line x1="16" y1="42" x2="224" y2="42" stroke="#dde4ea"/>
<text x="16" y="64" font-size="8.8" fill="#151a21">给 sinα →  1 − 2sin²α</text>
<text x="16" y="86" font-size="8.8" fill="#151a21">给 cosα →  2cos²α − 1</text>
<text x="16" y="108" font-size="8.8" fill="#151a21">都给　 →  cos²α − sin²α</text>
</svg>
</div>
<div class="qac">
<p class="q">sin²α+cos²α 到底等于几？会不会随 α 变？</p>
<p class="a">恒等于 <b>1</b>，不随 α 变，因为它就是单位圆上点的坐标平方和（x²+y²=r²=1）。它是<b>恒等式</b>，不是方程，所以不能「解出 α」。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="单位圆上正弦余弦平方和为 1">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<circle cx="88" cy="66" r="40" fill="none" stroke="#2563eb"/>
<line x1="48" y1="66" x2="128" y2="66" stroke="#8a94a0"/>
<line x1="88" y1="26" x2="88" y2="106" stroke="#8a94a0"/>
<line x1="88" y1="66" x2="116" y2="38" stroke="#b8402f" stroke-width="1.6"/>
<text x="132" y="60" font-size="8.6" fill="#5a6472">x=cosα</text>
<text x="132" y="76" font-size="8.6" fill="#5a6472">y=sinα</text>
<text x="132" y="94" font-size="8.8" fill="#2f8a5b">x²+y²=1</text>
</svg>
</div>
<div class="qac">
<p class="q">半角公式和二倍角是什么关系？要单独背吗？</p>
<p class="a">不用单独背。把二倍角余弦 <b>cos2α=1−2sin²α</b> 里的角<b>换成 α/2</b>，即 cosα=1−2sin²(α/2)，反解就得到 sin²(α/2)=(1−cosα)/2。开方时同样<b>要带 ±，由 α/2 的象限定</b>。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="由二倍角推出半角公式">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="34" text-anchor="middle" font-size="8.8" fill="#151a21">cos2α = 1 − 2sin²α</text>
<text x="120" y="58" text-anchor="middle" font-size="8.6" fill="#2563eb">角换成 α/2 ↓</text>
<text x="120" y="82" text-anchor="middle" font-size="8.8" fill="#151a21">cosα = 1 − 2sin²(α/2)</text>
<text x="120" y="108" text-anchor="middle" font-size="8.8" fill="#2f8a5b">sin²(α/2) = (1 − cosα)/2</text>
</svg>
</div>
</div>
<p class="gx-note">六问其实是同一件事：<b>凡是求值，先定象限；凡是变形，先看已知量</b>。二倍角三种形式按需选、开方带 ± 由象限定、sin²α+cos²α=1 做桥——三条贯穿全节。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ sin2α = 2sinα</p>
<p class="er-v">✓ sin2α = 2sinαcosα</p>
<p class="er-w">错在哪：二倍角的正弦是<b>两个函数相乘</b>，不是把一个 sin 乘 2。2 是系数，2α 才是角。</p>
</div>
<div class="er">
<p class="er-x">✗ 由 sinα=3/5 得 cosα=4/5</p>
<p class="er-v">✓ cosα = ±√(1−sin²α) = ±4/5，再由 α 的象限定号（第二象限取 −4/5）</p>
<p class="er-w">错在哪：开方只取了正根。平方关系只给平方值，<b>符号必须由象限定</b>；本题 α∈(π/2,π)，cosα&lt;0。</p>
</div>
<div class="er">
<p class="er-x">✗ cos2α 就背 cos²α−sin²α 一个式子，别的不用管</p>
<p class="er-v">✓ cos2α=cos²α−sin²α=2cos²α−1=1−2sin²α，按已知量选一种</p>
<p class="er-w">错在哪：只背一种不算错，但已知 sinα 时会多算一次 cosα、多判断一次符号。<b>三种形式按需选</b>是公式的一部分。</p>
</div>
<div class="er">
<p class="er-x">✗ sin²α + cos²α = 2</p>
<p class="er-v">✓ sin²α + cos²α = 1（同一个角）</p>
<p class="er-w">错在哪：把「平方和」记成了「两个 1 相加」。它是单位圆上 x²+y²=1，<b>恒等于 1</b>，与 α 无关。</p>
</div>
<div class="er">
<p class="er-x">✗ 3sinx + 4cosx = 5sin(x+φ)，其中 tanφ = 3/4</p>
<p class="er-v">✓ 5sin(x+φ)，其中 tanφ = b/a = 4/3，且 φ 与 (3, 4) 同象限</p>
<p class="er-w">错在哪：φ 的分子分母写反了。a 配 sinx、b 配 cosx，所以 tanφ = b/a；写反等于取余角，整题平移。</p>
</div>
<div class="er">
<p class="er-x">✗ 已知 sinα=3/5，α 没说在哪，那 cosα 就是正的</p>
<p class="er-v">✓ 未给象限时要分类讨论：cosα = ±4/5，两种都可能</p>
<p class="er-w">错在哪：题干没给范围时 <b>± 都要留</b>，答案是两组。忽略 α 的象限是本节最隐蔽的丢分点。</p>
</div>
<div class="er">
<p class="er-x">✗ sinα² 表示 (sinα)²</p>
<p class="er-v">✓ sin²α 表示 (sinα)²；sinα² 表示 sin(α²)</p>
<p class="er-w">错在哪：约定俗成，平方写在函数名上而不是角上。抄公式时写错位置，阅卷按 sin(α²) 读。</p>
</div>
</div>
</section>

document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var GX = window.GX, el = GX.el, tx = GX.tx, $ = GX.$;
  var stage = $("gxStage");
  if (!stage || !window.AutoPilot) return;

  /* 两套独立坐标：宽屏 880×470，窄屏 360×700 */
  var W = { vb: "0 0 880 470", ro: 1, left: { x: 16, y: 16, w: 424, h: 438 }, right: { x: 456, y: 16, w: 408, h: 438 },
    ci: { x: 150, y: 250, r: 92 }, pl: { x0: 530, x1: 830, y0: 235, k: 118, t: 95, b: 375, lx: 522, ty: 106 } };
  var N = { vb: "0 0 360 700", ro: 0, left: { x: 8, y: 8, w: 344, h: 300 }, right: { x: 8, y: 320, w: 344, h: 372 },
    ci: { x: 180, y: 150, r: 72 }, pl: { x0: 70, x1: 326, y0: 520, k: 76, t: 404, b: 628, lx: 62, ty: 432 } };
  var L = W, A = 0, G = null;

  /* 纯函数：唯一真值来源 */
  function calc(v) {
    var r = v * Math.PI / 180, s = Math.sin(r), c = Math.cos(r);
    return { a: v, s2: Math.sin(2 * r), c2: Math.cos(2 * r), one: s * s + c * c };
  }
  function f3(n) { return n.toFixed(3); }
  function seg(g, x1, y1, x2, y2, c, w, d) {
    el("line", { x1: x1, y1: y1, x2: x2, y2: y2, stroke: c, "stroke-width": w, "stroke-dasharray": d || "none" }, g);
  }
  function head(g, x, y, u) {
    el("polygon", { points: u ? x + "," + (y - 8) + " " + (x - 3.6) + "," + y + " " + (x + 3.6) + "," + y
      : (x + 8) + "," + y + " " + x + "," + (y - 3.6) + " " + x + "," + (y + 3.6), fill: "#9aa6b2" }, g);
  }
  function arc(g, c, rr, deg) {
    var e = deg * Math.PI / 180;
    el("path", { d: "M" + (c.x + rr) + "," + c.y + " A" + rr + "," + rr + " 0 " + (deg > 180 ? 1 : 0) + " 0 " +
      (c.x + rr * Math.cos(e)).toFixed(1) + "," + (c.y - rr * Math.sin(e)).toFixed(1),
      fill: "none", stroke: "#2563eb", "stroke-width": 1.4 }, g);
  }

  function draw() {
    var gA = $("gxA"), gB = $("gxB"), s = calc(A), r = A * Math.PI / 180, c = L.ci, p = L.pl;
    gA.textContent = ""; gB.textContent = "";

    /* ---------- 左：单位圆 ---------- */
    el("rect", { x: L.left.x, y: L.left.y, width: L.left.w, height: L.left.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    tx(gA, L.left.x + 20, L.left.y + 26, "单位圆：α 与 2α 的终边", "#5a6472", "start", 10.5, 700);
    seg(gA, c.x - c.r - 26, c.y, c.x + c.r + 26, c.y, "#9aa6b2", 1); head(gA, c.x + c.r + 26, c.y);
    seg(gA, c.x, c.y + c.r + 26, c.x, c.y - c.r - 26, "#9aa6b2", 1); head(gA, c.x, c.y - c.r - 26, 1);
    el("circle", { cx: c.x, cy: c.y, r: c.r, fill: "none", stroke: "#c9d6e0", "stroke-width": 1.4 }, gA);
    tx(gA, c.x - 10, c.y + 14, "O", "#8a94a0", "end", 8.6, 400);
    tx(gA, c.x + c.r + 16, c.y - 6, "x", "#8a94a0", "start", 8.6, 400);
    tx(gA, c.x + 6, c.y - c.r - 16, "y", "#8a94a0", "start", 8.6, 400);

    var xa = c.x + c.r * Math.cos(r), ya = c.y - c.r * Math.sin(r);
    seg(gA, c.x, c.y, c.x + c.r * Math.cos(2 * r), c.y - c.r * Math.sin(2 * r), "#b8402f", 1.3, "4 3");
    seg(gA, c.x, c.y, xa, ya, "#2563eb", 1.8);
    seg(gA, xa, ya, xa, c.y, "#b9c9d8", 1, "2 3");
    seg(gA, xa, ya, c.x, ya, "#b9c9d8", 1, "2 3");
    el("circle", { cx: xa, cy: ya, r: 4, fill: "#2563eb" }, gA);
    arc(gA, c, 30, A);
    arc(gA, c, 48, 2 * A);
    tx(gA, c.x + 40 * Math.cos(r / 2), c.y - 40 * Math.sin(r / 2) + 3, "α", "#2563eb", "middle", 9.4, 700);
    tx(gA, c.x + 62 * Math.cos(r), c.y - 62 * Math.sin(r) + 3, "2α", "#b8402f", "middle", 9.4, 700);

    if (L.ro) {
      var rx = L.left.x + 264, ry = L.left.y + 132;
      tx(gA, rx, ry, "此刻读数", "#5a6472", "start", 9.6, 700);
      tx(gA, rx, ry + 26, "α = " + A + "°，2α = " + (2 * A) + "°", "#3a3a35", "start", 9.4, 400);
      tx(gA, rx, ry + 50, "sinα = " + f3(Math.sin(r)), "#3a3a35", "start", 9.4, 400);
      tx(gA, rx, ry + 74, "cosα = " + f3(Math.cos(r)), "#3a3a35", "start", 9.4, 400);
      tx(gA, rx, ry + 100, "sin2α = " + f3(s.s2), "#2563eb", "start", 9.4, 400);
      tx(gA, rx, ry + 124, "cos2α = " + f3(s.c2), "#2f8a5b", "start", 9.4, 400);
      tx(gA, rx, ry + 150, "sin²α + cos²α = " + f3(s.one), "#2563eb", "start", 9.4, 700);
    } else {
      var by = c.y + c.r + 26;
      tx(gA, L.left.x + 14, by, "α = " + A + "°，2α = " + (2 * A) + "°", "#3a3a35", "start", 9, 400);
      tx(gA, L.left.x + 14, by + 20, "sin2α = " + f3(s.s2) + "　cos2α = " + f3(s.c2), "#3a3a35", "start", 9, 400);
      tx(gA, L.left.x + 14, by + 40, "sin²α + cos²α = " + f3(s.one), "#2563eb", "start", 9, 700);
    }

    /* ---------- 右：两条曲线 ---------- */
    el("rect", { x: L.right.x, y: L.right.y, width: L.right.w, height: L.right.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    tx(gB, L.right.x + 20, L.right.y + 30, "曲线：sin2α 与 cos2α（0°–90°）", "#5a6472", "start", 10.5, 700);
    seg(gB, p.x0 - 16, p.y0, p.x1 + 8, p.y0, "#9aa6b2", 1); head(gB, p.x1 + 8, p.y0);
    seg(gB, p.x0, p.b, p.x0, p.t - 8, "#9aa6b2", 1); head(gB, p.x0, p.t - 8, 1);

    var vs = [1, 0, -1], i, yv;
    for (i = 0; i < 3; i++) {
      yv = p.y0 - vs[i] * p.k;
      seg(gB, p.x0 - 4, yv, p.x0, yv, "#c9d6e0", 1);
      tx(gB, p.lx, yv + 3, vs[i] === 1 ? "1" : (vs[i] === 0 ? "0" : "−1"), "#8a94a0", "end", 8.6, 400);
    }
    var ds = [0, 30, 45, 60, 90], j, xd;
    for (j = 0; j < 5; j++) {
      xd = p.x0 + ds[j] / 90 * (p.x1 - p.x0);
      seg(gB, xd, p.y0 - 4, xd, p.y0 + 4, "#c9d6e0", 1);
      tx(gB, xd, p.y0 + 20, ds[j] + "°", "#8a94a0", "middle", 8.6, 400);
    }

    var ps = "", pc = "", d, x, y1, y2;
    for (d = 0; d <= 90; d += 2) {
      x = p.x0 + d / 90 * (p.x1 - p.x0);
      y1 = p.y0 - Math.sin(2 * d * Math.PI / 180) * p.k;
      y2 = p.y0 - Math.cos(2 * d * Math.PI / 180) * p.k;
      ps += (d === 0 ? "M" : "L") + x.toFixed(1) + "," + y1.toFixed(1);
      pc += (d === 0 ? "M" : "L") + x.toFixed(1) + "," + y2.toFixed(1);
    }
    el("path", { d: ps, fill: "none", stroke: "#2563eb", "stroke-width": 1.8 }, gB);
    el("path", { d: pc, fill: "none", stroke: "#2f8a5b", "stroke-width": 1.8 }, gB);

    /* 45° 停留帧：sin2α 峰值 1，cos2α 过 0 */
    var x45 = p.x0 + 0.5 * (p.x1 - p.x0);
    seg(gB, x45, p.y0 - p.k, x45, p.y0 + p.k, "#e0b4ac", 1, "3 3");
    tx(gB, x45 + 6, p.y0 - p.k - 8, "峰值 sin2α = 1", "#2563eb", "start", 8.8, 700);
    tx(gB, x45 + 6, p.y0 - 14, "cos2α = 0", "#2f8a5b", "start", 8.8, 700);
    seg(gB, p.x0 + 14, p.ty, p.x0 + 32, p.ty, "#2563eb", 2);
    tx(gB, p.x0 + 38, p.ty + 3, "sin2α", "#2563eb", "start", 8.8, 700);
    seg(gB, p.x0 + 14, p.ty + 18, p.x0 + 32, p.ty + 18, "#2f8a5b", 2);
    tx(gB, p.x0 + 38, p.ty + 21, "cos2α", "#2f8a5b", "start", 8.8, 700);

    var xc = p.x0 + A / 90 * (p.x1 - p.x0);
    seg(gB, xc, p.y0 - s.s2 * p.k, xc, p.y0, "#b9c9d8", 1, "2 3");
    el("circle", { cx: xc, cy: p.y0 - s.s2 * p.k, r: 4, fill: "#2563eb" }, gB);
    el("circle", { cx: xc, cy: p.y0 - s.c2 * p.k, r: 4, fill: "#2f8a5b" }, gB);

    tx(gB, L.right.x + 20, L.right.y + L.right.h - 56, "sin²α + cos²α = " + f3(s.one) + "（恒为 1）", "#2563eb", "start", 9.4, 700);
    tx(gB, L.right.x + 20, L.right.y + L.right.h - 34, "α = " + A + "°，2α = " + (2 * A) + "°", "#3a3a35", "start", 9.4, 400);
  }

  function render() {
    if (!G) { L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N; G = 1; stage.setAttribute("viewBox", L.vb); }
    var s = calc(A), st, col, bg, sn;
    $("gxVa").textContent = A + "°";
    $("gxVb").textContent = f3(s.s2);
    $("gxVc").textContent = f3(s.c2);
    if (A < 45) { st = "cos2α > 0"; col = "#2563eb"; bg = "#eaf2fe"; sn = "2α < 90°，仍在第一象限"; }
    else if (A === 45) { st = "cos2α = 0"; col = "#b8791f"; bg = "#fdf3e0"; sn = "2α = 90°，sin2α 取到最大值 1"; }
    else { st = "cos2α < 0"; col = "#2f8a5b"; bg = "#e6f6ee"; sn = "2α > 90°，余弦转负"; }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    draw();
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    G = 1;
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 0 }, { t: 1.2, v: 0 }, { t: 4, v: 45 }, { t: 6.5, v: 45 }, { t: 9, v: 60 }, { t: 11.5, v: 90 }, { t: 13.5, v: 0 }],
    keys: [0, 30, 45, 60],
    value: A, min: 0, max: 90, step: 5,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc, cases: [
    { v: 30, eq: { s2: 0.866, c2: 0.5 } },
    { v: 45, eq: { s2: 1, c2: 0 } },
    { v: 60, eq: { s2: 0.866, c2: -0.5 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
</body>
</html>
