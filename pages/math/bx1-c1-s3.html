<p class="gx-lede">这一节把「集合」从一句话变成一个算式：交集取公共部分，并集把两边倒进一个篮子，补集是把全集挖去一块。三个运算各自的定义只有一句，但卷面上的分几乎都丢在三个小地方——并集里重复元素只写一次、补集要先有全集、以及「或」包含「且」这件事上。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 交集<span class="q-src">人教A版必修第一册 · 第一章第三节</span></p>
<p class="q-b">由属于 A 且属于 B 的所有元素组成的集合，叫做 A 与 B 的交集，记作 A∩B。</p>
<p class="q-n">→ 翻成人话：这句话由<b>两个条件</b>组成，① x∈A ② x∈B，必须<b>同时</b>成立。写成 <span class="gx-fml">A∩B = {x | x∈A 且 x∈B}</span>。「且」是同时满足，不是二选一；少看一个条件，就会把交集写成并集。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 并集<span class="q-src">人教A版必修第一册 · 第一章第三节</span></p>
<p class="q-b">由属于 A 或属于 B 的所有元素组成的集合，叫做 A 与 B 的并集，记作 A∪B。</p>
<p class="q-n">→ 翻成人话：条件只有一个，但满足<b>任意一个</b>就算进来，写成 <span class="gx-fml">A∪B = {x | x∈A 或 x∈B}</span>。核心口径是<b>「或」包含「且」</b>：A∩B 里的元素同样在 A∪B 里。既然是「所有元素组成的集合」，就受集合的互异性约束——<b>并集里重复元素只写一次</b>。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 补集<span class="q-src">人教A版必修第一册 · 第一章第三节</span></p>
<p class="q-b">若 A⊆U，由 U 中不属于 A 的所有元素组成的集合，叫做 A 在 U 中的补集，记作 ∁ᵤA。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个条件</b>组成，① 先有全集 U ② A⊆U ③ 元素在 U 内、且不在 A 内。写成 <span class="gx-fml">∁ᵤA = {x | x∈U 且 x∉A}</span>。<b>补集要先有全集</b>，同一个 A 换一个 U，补集就完全不同——离开 U 写 ∁ᵤA 等于没定义。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>必须满足的条件</th><th>对应的运算与写法</th><th>缺了这一条会怎样</th></tr></thead>
<tbody>
<tr><td>既属于 A 又属于 B</td><td>A∩B = {x | x∈A 且 x∈B}，取公共部分</td><td>把「且」读成「或」，交集写成并集，元素个数直接翻倍</td></tr>
<tr class="key"><td>属于 A 或属于 B，满足一个即可</td><td>A∪B = {x | x∈A 或 x∈B}，并集里重复元素只写一次</td><td>公共元素写两遍，集合写成 {1,1,2}，违反互异性；或把「或」当「只属于一边」</td></tr>
<tr><td>先给定全集 U，且 A⊆U</td><td>∁ᵤA = {x | x∈U 且 x∉A}，在 U 内挖去 A</td><td>没写全集就求补集，∁ᵣA 与 ∁ₙA 混为一谈，答案失去意义</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">口径提醒：整张表只有并集那一行标红（key），因为「或」包含「且」＋重复元素只写一次这两件事，是本节一半的扣分点。答题时先写「因为 x∈A 或 x∈B」，再动笔列元素。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 区间型交、并、补<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">已知 A={x | −1&lt;x≤3}，B={x | x≥2}，全集 U=R。求 A∩B、A∪B、∁ᵣA。（图 2 给了图形，这一步练答题卡上的写法：每一步都要说出端点的开闭理由。）</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题：先把集合化成区间</p>
<p class="s-b">A=(−1, 3]：左端开、右端闭，因为原式是 −1&lt;x≤3。B=[2, +∞)：2 处实心，因为写的是 x≥2。四个要盯的数是 −1、3、2。</p>
<p class="s-k">用到：区间与数轴的对应关系，端点开闭由不等号决定。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 求 A∩B：两个条件同时成立</p>
<p class="s-b">「且」：−1&lt;x≤3 与 x≥2 同时成立，取重叠部分得 2≤x≤3。2 处：B 含 2，A 也含 2（因为 2&gt;−1），所以交集含 2，写 ≤。3 处：A 含 3，B 也含 3，写 ≤。</p>
<p class="s-k">用到：交集定义 {x | x∈A 且 x∈B}。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 求 A∪B：满足一个就进来</p>
<p class="s-b">「或」包含「且」：A 覆盖 (−1,3]，B 覆盖 [2,+∞)，两者的公共部分 [2,3] 在并集里只算一次。合起来 −1 右边全部有元素，得 <span class="gx-fml">A∪B = {x | x&gt;−1}</span>；−1 取不到，所以是 &gt; 不是 ≥。</p>
<p class="s-k">用到：并集定义、「或」包含「且」、并集里重复元素只写一次。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 求 ∁ᵣA：先确认全集</p>
<p class="s-b">补集要先有全集：这里 U=R，所以在整条数轴上挖去 (−1,3]。−1 本来就不在 A 里，挖完仍然取得到，写 x≤−1；3 在 A 里，挖掉后取不到，写 x&gt;3。两段中间没有元素，必须用「或」连接。</p>
<p class="s-k">用到：∁ᵤA={x | x∈U 且 x∉A}，全集 U=R。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 端点复核（30 秒的自查）</p>
<p class="s-b">把三个特殊值代回去：x=−1 → 不在 A，故 −1∈∁ᵣA，与 x≤−1 相符；x=3 → 在 A，故 3∉∁ᵣA，与 x&gt;3 相符；x=2 → 在 A 也在 B，所以 2∈A∩B，交集写 2≤x。三个端点全对上，答案才敢抄。</p>
<p class="s-k">用到：端点代入法，专治开闭写反。</p>
</li>
</ol>

<button id="gxNext" type="button">下一步</button>

<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">A∩B = {x | 2 ≤ x ≤ 3}；理由：需同时满足 −1&lt;x≤3 与 x≥2，取重叠段，2、3 两处都被两个集合包含，故两端都闭。<br>A∪B = {x | x &gt; −1}；理由：B 已覆盖 x≥2，A 覆盖 (−1,3]，公共部分 [2,3] 在并集中只算一次（并集里重复元素只写一次），故并集为 −1 右侧全体，−1 处开。<br>∁ᵣA = {x | x ≤ −1 或 x &gt; 3}；理由：全集 U=R，在 R 中挖去 (−1,3]，−1 不属于 A 故保留（取等号），3 属于 A 故挖掉（不取等号），两段之间用「或」连接，不能用「且」。</p>

<text class="ms" x="120" y="112" text-anchor="middle" font-size="8.6">(−1, 3]</text>
</svg>
</div>

<div class="qac">
<p class="q">「A∩B=∅ 是不是说明两个集合里有一个是空的？」</p>
<p class="a">不是。交集为空只说明<b>没有公共元素</b>，两个集合各自可以很满：{1,2} 与 {3,4} 的交集是 ∅，并集却有 4 个元素。空集是 ∅ 本身，不是一个集合为空。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="两个不相交的圆，交集为空">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<circle cx="88" cy="60" r="32" fill="#eaf2fd" stroke="#2563eb" stroke-width="1.2"/>
<circle cx="156" cy="60" r="32" fill="#eaf2fd" stroke="#2563eb" stroke-width="1.2"/>
<text class="ms" x="120" y="112" text-anchor="middle" font-size="9">A∩B = ∅，但 A、B 都不空</text>
</svg>
</div>

<div class="qac">
<p class="q">「A∩B=A 说明了什么？」</p>
<p class="a">说明 <b>A⊆B</b>：A 的每一个元素都在 B 里，交完还是 A 本身。别写成 A=B——B 可以比 A 多。同理 A∪B=A ⇔ B⊆A。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="小圆完全落在另一个圆内">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<circle cx="118" cy="62" r="42" fill="#eaf2fd" stroke="#2563eb" stroke-width="1.2"/>
<circle cx="106" cy="62" r="22" fill="#b9d4f8" stroke="#2563eb" stroke-width="1.2"/>
<text class="ms" x="106" y="66" text-anchor="middle" font-size="9">A</text>
<text class="ms" x="146" y="46" font-size="9">B</text>
<text class="ms" x="120" y="118" text-anchor="middle" font-size="8.6">A∩B = A ⇔ A ⊆ B</text>
</svg>
</div>
</div>
<p class="gx-note">这六问其实是同一件事：先判「元素属于谁」，再判「端点和全集给全了没有」。前四问答对了，最后两问只是它的两种变形。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ {1,2}∪{2,3}={1,2,2,3}</p>
<p class="er-v">✓ {1,2}∪{2,3}={1,2,3}</p>
<p class="er-w">错在哪：并集里重复元素只写一次，元素重复写就违反集合的互异性，整题判错。</p>
</div>
<div class="er">
<p class="er-x">✗ ∁A={x | x≤−1 或 x&gt;3}（不说明全集）</p>
<p class="er-v">✓ 设全集 U=R，则 ∁ᵣA={x | x≤−1 或 x&gt;3}</p>
<p class="er-w">错在哪：补集要先有全集，∁ᵣA 与 ∁ₙA 是两个不同的集合，不写全集等于没下定义。</p>
</div>
<div class="er">
<p class="er-x">✗ {x | −1&lt;x≤3} 在数轴上把 −1 画实心、3 画空心</p>
<p class="er-v">✓ −1 画空心圈、3 画实心点，标成 (−1, 3]</p>
<p class="er-w">错在哪：空心/实心只由不等号有没有等号决定，画反了端点，后面交并补全跟着错。</p>
</div>
<div class="er">
<p class="er-x">✗ x∈A 或 x∈B 的意思是「只能属于其中一个」</p>
<p class="er-v">✓ x∈A 或 x∈B 表示至少属于一个，两个都属也可以</p>
<p class="er-w">错在哪：<b>「或」包含「且」</b>，公共元素照样进并集；按「二选一」去掉公共部分，并集会少元素。</p>
</div>
<div class="er">
<p class="er-x">✗ 由 A∩B=A 得 A=B</p>
<p class="er-v">✓ A∩B=A ⇔ A⊆B</p>
<p class="er-w">错在哪：交集等于 A 只说明 A 被 B 装下了，B 可以更大；A=B 是更强的条件（还要 A⊇B）。</p>
</div>
<div class="er">
<p class="er-x">✗ |A∪B|=|A|+|B|</p>
<p class="er-v">✓ |A∪B|=|A|+|B|−|A∩B|</p>
<p class="er-w">错在哪：忘减公共部分。并集里重复元素只写一次，公共元素被数了两遍，必须减掉一次 |A∩B|。</p>
</div>
<div class="er">
<p class="er-x">✗ 含参题算出 a≤−1 或 a≥3 还写「A∩B≠∅ 时 a 的范围」</p>
<p class="er-v">✓ 先解 a+2&gt;1 且 a&lt;3，再端点单试，得 −1&lt;a&lt;3</p>
<p class="er-w">错在哪：把「碰得上」的条件当成了「碰不上」；端点处交集恰好为空，所以等号必须抠掉。</p>
</div>
</div>

document.addEventListener("DOMContentLoaded", function () {

  /* 纯函数：k = A∩B 的元素个数 → 三个量。render() 与 __model.cases 共用 */

  function geom() {
    var lb = L.left, rb = L.right, pad = 16;
    var u = { x: lb.x + pad, y: lb.y + 44, w: lb.w - 2 * pad, h: lb.h - 62 };

      el("rect", { x: G.bar.x, y: y, width: G.bar.w, height: G.bar.h, rx: 4, fill: "#eef2f6" }, gB);
      el("rect", { x: G.bar.x, y: y, width: Math.max(2, G.bar.w * r.v / r.tot), height: G.bar.h, rx: 4, fill: r.col }, gB);
      tx(gB, G.bar.x + G.bar.w + 14, y + 12, String(r.v), r.col, "start", 12, 700);
    }
    tx(gB, L.right.x + 18, L.right.y + L.right.h - 40, "|A∪B| = 12 − k 条条在缩，∁ᵤA 那条不动", "#151a21", "start", 9.6, 700);
    tx(gB, L.right.x + 18, L.right.y + L.right.h - 18, "k 取 0、3、6 三格看跳变", "#7d8896", "start", 9.2, 400);
  }

  function render() {
    if (!G) { L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N; G = geom(); stage.setAttribute("viewBox", L.vb); }
    var s = calc(A), st, col, bg, sn;
