<p class="gx-lede">这一节是第六章的「运算工具箱」：6.3 的坐标运算、6.4 的正弦定理与余弦定理，全都要先过这里的加法、数乘和数量积。最容易错的一件事是：<b>数量积的结果是数量，不是向量</b>；它可以为正、为零、为负，符号完全由 cosθ 决定。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 向量的加法<span class="q-src">人教A版必修第二册 · 第六章第2节</span></p>
<p class="q-b">求两个向量和的运算，叫做向量的加法；向量加法的三角形法则与平行四边形法则。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个条件</b>组成——① 两个向量；② 首尾相接（三角形法则）或起点重合（平行四边形法则）；③ 和是从起点指向终点的向量。缺了②，画出来的就不是 a+b，而是另一条边。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 数乘<span class="q-src">人教A版必修第二册 · 第六章第2节</span></p>
<p class="q-b">一般地，我们规定实数 λ 与向量 a 的积是一个向量，这种运算叫做数乘。</p>
<p class="q-n">→ 翻成人话：两个条件——① 乘的是<b>实数</b>，不是向量；② 结果仍是<b>向量</b>，长度为 |λ||a|，λ 的符号决定同向还是反向。λ=0 时得到零向量，不说方向。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 数量积<span class="q-src">人教A版必修第二册 · 第六章第2节</span></p>
<p class="q-b">已知两个非零向量 a 与 b，我们把数量 |a||b|cosθ 叫做 a 与 b 的数量积（或内积），记作 a·b。</p>
<p class="q-n">→ 翻成人话：这句话也由<b>三个条件</b>组成——① a、b 都是非零向量；② θ 是两向量<b>起点重合</b>后所成的角，范围 0°–180°；③ 结果是数量 |a||b|cosθ，不是向量。少一个，符号或结果类型就错。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>条件</th><th>满足了能做什么</th><th>缺了会怎样</th></tr></thead>
<tbody>
<tr><td>a、b 非零</td><td>θ 有定义，cosθ 才能取到 −1 到 1</td><td>有零向量时 θ 无定义，但规定 0·b=0，结果仍是数</td></tr>
<tr class="key"><td>起点重合</td><td>θ 取两向量之间的角，0°–180°</td><td>不平移到同一起点，就把外角当夹角，符号整个反掉</td></tr>
<tr><td>乘 cosθ</td><td>a·b=|a||b|cosθ，可正可负可为零</td><td>漏掉 cosθ 就变成 |a||b|，把数量积当成模长乘积</td></tr>
<tr><td>θ 在 0°–180°</td><td>90° 时 a·b=0，钝角时 a·b&lt;0</td><td>取到 200° 会与 160° 算出同一个 cos，却报错符号</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只高亮 1 行：<b>起点重合</b>。做题时先问自己「两个向量的起点在不在一起」，再算 cosθ，比背公式更少出错。数量积的口径：模长 × 模长 × 夹角的余弦，答案是数。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。这题把数量积、模长、平方三件事串在一起。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 数量积与和向量的模<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">已知 |a|=2，|b|=3，a 与 b 的夹角为 120°。<br>(1) 求 a·b；(2) 求 |a+b|。<br><span style="color:#8f3226">陷阱：|a+b| 不等于 |a|+|b|，也不能只算 √(|a|²+|b|²)。</span></p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 定公式与角</p>
<p class="s-b">数量积用 a·b=|a||b|cosθ。这里的 θ 是 120°，不是 180°−120°=60°——两向量起点已经重合，120° 就是夹角。</p>
<p class="s-k">用到：数量积定义，θ∈[0°,180°]。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 代入算 a·b</p>
<p class="s-b">a·b = 2×3×cos120° = 6×(−1/2) = −3。cos120° 是负的，所以数量积为负，这一步的符号就是后面能算对的关键。</p>
<p class="s-k">用到：cos120° = −1/2（第二象限角的余弦为负）。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 先平方，再开方</p>
<p class="s-b">|a+b|² = (a+b)·(a+b) = |a|² + 2a·b + |b|² = 4 + 2×(−3) + 9 = 7。注意中间项是 2a·b，不是 2|a||b|。</p>
<p class="s-k">用到：|v|² = v·v，以及数量积对加法的分配律。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 取算术根</p>
<p class="s-b">|a+b| = √7 ≈ 2.65。模长非负，只取正根；写成 ±√7 就错了。</p>
<p class="s-k">用到：模长的定义 |v| = √(v·v)。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 用三角不等式校验</p>
<p class="s-b">√7 &lt; 2+3 = 5，与「两边之和大于第三边」一致。如果算出 5，说明把 a+b 当成了同向；如果算出 √13，说明漏掉了 2a·b。</p>
<p class="s-k">用到：|a+b| ≤ |a|+|b|，同向取等。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">解：(1) a·b = |a||b|cos120° = 2×3×(−1/2) = <b>−3</b>。<br>(2) |a+b|² = (a+b)² = |a|² + 2a·b + |b|² = 4 + 2×(−3) + 9 = 7，所以 |a+b| = <b>√7</b>。<br>答：a·b = −3，|a+b| = √7。</p>
</div>
</div>
</section>

<p class="q">a·b 算出来是向量还是数？</p>
<p class="a">是<b>数量</b>：|a||b|cosθ 是三个实数相乘，结果可正可负可为零；答题时不能给 a·b 加箭头。</p>

<p class="q">(a·b)c 与 a(b·c) 相等吗？</p>
<p class="a">不相等。a·b 与 b·c 都是数：<b>前者与 c 共线</b>，<b>后者与 a 共线</b>；数量积不满足结合律。</p>

    var half = wide ? 150 : 100, right = wide ? 200 : 150;
    var t = A * Math.PI / 180, c = Math.cos(t), sn = Math.sin(t);

    tx(g, L.left.x + 20, L.left.y + 28,
      wide ? "左：a 沿 x 轴，b 与 a 的夹角为 θ" : "左：a、b 共起点，夹角 θ",
      "#5a6472", "start", wide ? 10.5 : 9.5, 700);
    tx(g, L.left.x + 20, L.left.y + (wide ? 56 : 54),
      "θ = " + Math.round(A) + "°", BLUE, "start", wide ? 14 : 12.5, 700);

    /* x 轴 + 刻度 */
    seg(g, o.x - half, o.y, o.x + right, o.y, { col: DGRAY, w: 1.4, mk: "gxMkG" });
    for (var k = -2; k <= 2; k++) {
      seg(g, o.x + k * o.s, o.y - (wide ? 4 : 3), o.x + k * o.s, o.y + (wide ? 4 : 3), { col: DGRAY, w: 1.2 });
    }
    var ty = o.y + (wide ? 22 : 20);
    tx(g, o.x - 2 * o.s, ty, "−2", GRAY, "middle", wide ? 9 : 8, 400);
    tx(g, o.x, ty, "0", GRAY, "middle", wide ? 9 : 8, 400);
    tx(g, o.x + 2 * o.s, ty, "2", GRAY, "middle", wide ? 9 : 8, 400);

    /* 向量 a、b */
    seg(g, o.x, o.y, o.x + 2 * o.s, o.y, { col: BLUE, w: 2.6, mk: "gxMkB" });
    var bx = o.x + 2 * o.s * c, by = o.y - 2 * o.s * sn;
    seg(g, o.x, o.y, bx, by, { col: BLUE, w: 2.6, mk: "gxMkB" });

    /* 投影：O 到垂足 H */
    var hx = o.x + 2 * o.s * c;
    if (Math.abs(c) > 0.05) seg(g, o.x, o.y, hx, o.y, { col: AMBER, w: wide ? 5 : 4.5, mk: "gxMkA" });
    if (sn > 0.08) {
      seg(g, hx, by, hx, o.y, { col: GRAY, w: 1.2, dash: "5 4" });
      var sg = c >= 0 ? -1 : 1;
      el("path", {
        d: "M " + n(hx + sg * 10) + " " + n(o.y) + " L " + n(hx + sg * 10) + " " + n(o.y - 10) +
           " L " + n(hx) + " " + n(o.y - 10),
        fill: "none", stroke: "#9aa4b2", "stroke-width": 1.2
      }, g);
    }

    /* 夹角弧：y 轴朝下 ⇒ 逆时针 = sweep-flag 0 */
    if (sn > 0.02) {
      var r = wide ? 44 : 26;
      el("path", {
        d: "M " + n(o.x + r) + " " + n(o.y) + " A " + r + " " + r + " 0 0 0 " +
           n(o.x + r * c) + " " + n(o.y - r * sn),
        fill: "none", stroke: AMBER, "stroke-width": 1.6
      }, g);
    }

    /* 字母标签 */
    tx(g, o.x + o.s, o.y + 16, "a", BLUE, "middle", 11, 700);
    var lx = o.x + o.s * c, ly = o.y - o.s * sn;
    tx(g, lx + 14 * sn, ly - 14 * c, "b", BLUE, "middle", 11, 700);
    tx(g, o.x - 10, o.y + 18, "O", "#5a6472", "end", 10, 400);

    tx(g, L.left.x + 20, L.left.y + L.left.h - 18,
      wide ? "蓝：向量 a、b　橙：b 在 a 上的投影 2cosθ　虚线：垂足线"
           : "蓝：a、b　橙：投影 2cosθ",
      "#5a6472", "start", wide ? 9.5 : 8.5, 400);
  }

  function drawRight(g) {
    var P = wide ? { x0: 520, x1: 824, y0: 250, sy: 32 }
                 : { x0: 96, x1: 336, y0: 560, sy: 24 };
    var i, d, xx, yy;

    tx(g, L.right.x + 20, L.right.y + 28,
      wide ? "右：a·b = 4cosθ 随 θ 的曲线" : "右：a·b 随 θ 的变化",
      "#5a6472", "start", wide ? 10.5 : 9.5, 700);

    seg(g, P.x0 - (wide ? 22 : 18), P.y0, P.x1 + 4, P.y0, { col: DGRAY, w: 1.4, mk: "gxMkG" });
    seg(g, P.x0, P.y0 + 4 * P.sy + (wide ? 14 : 10), P.x0, P.y0 - 4 * P.sy - (wide ? 14 : 10),
      { col: DGRAY, w: 1.4, mk: "gxMkG" });

    for (i = -4; i <= 4; i++) {
      seg(g, P.x0 - 4, P.y0 - i * P.sy, P.x0, P.y0 - i * P.sy, { col: DGRAY, w: 1.2 });
    }
    [4, 2, 0, -2, -4].forEach(function (k) {
      tx(g, P.x0 - 8, P.y0 - k * P.sy + 3, k < 0 ? "−" + (-k) : String(k),
        GRAY, "end", wide ? 9 : 8, 400);
    });
    [0, 45, 90, 135, 180].forEach(function (dd) {
      var gx = P.x0 + (P.x1 - P.x0) * dd / 180;
      seg(g, gx, P.y0, gx, P.y0 + 4, { col: DGRAY, w: 1.2 });
      tx(g, gx, P.y0 + (wide ? 18 : 16), String(dd), GRAY, "middle", wide ? 9 : 8, 400);
    });

    /* 曲线 a·b = 4cosθ */
    var pts = [];
    for (d = 0; d <= 180; d += 5) {
      xx = P.x0 + (P.x1 - P.x0) * d / 180;
      yy = P.y0 - 4 * Math.cos(d * Math.PI / 180) * P.sy;
      pts.push([xx, yy]);
    }
    var pd = "M " + n(pts[0][0]) + " " + n(pts[0][1]);
    for (i = 1; i < pts.length; i++) pd += " L " + n(pts[i][0]) + " " + n(pts[i][1]);
    el("path", { d: pd, fill: "none", stroke: BLUE, "stroke-width": 2.2, "stroke-linejoin": "round" }, g);

    /* 90° 零点 + 当前点 */
    el("circle", { cx: n(P.x0 + (P.x1 - P.x0) / 2), cy: n(P.y0), r: 3.5, fill: AMBER }, g);
    var t = A * Math.PI / 180;
    var px = P.x0 + (P.x1 - P.x0) * A / 180;
    var py = P.y0 - 4 * Math.cos(t) * P.sy;
    if (Math.abs(py - P.y0) > 0.6) seg(g, px, py, px, P.y0, { col: GRAY, w: 1, dash: "4 4" });
    if (Math.abs(px - P.x0) > 0.6) seg(g, px, py, P.x0, py, { col: GRAY, w: 1, dash: "4 4" });
    el("circle", { cx: n(px), cy: n(py), r: 5.4, fill: BLUE, stroke: "#ffffff", "stroke-width": 2 }, g);
  }

  function draw() {
    var gA = $("gxA"), gB = $("gxB");
    if (!gA || !gB) return;
    gA.textContent = ""; gB.textContent = "";
    el("rect", { x: L.left.x, y: L.left.y, width: L.left.w, height: L.left.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    el("rect", { x: L.right.x, y: L.right.y, width: L.right.w, height: L.right.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    mk(gA, "gxMkB", BLUE); mk(gA, "gxMkA", AMBER); mk(gA, "gxMkG", GRAY);
    drawLeft(gA);
    drawRight(gB);
  }

  function f2(x) {
    var s = (Math.abs(x) < 0.005 ? 0 : x).toFixed(2);
    return s.charAt(0) === "-" ? "−" + s.slice(1) : s;
  }

  function render() {
    var s = calc(A), st, col, bg, sn;
    $("gxVa").textContent = Math.round(A) + "°";
    $("gxVb").textContent = f2(s.dot);
    $("gxVc").textContent = f2(s.proj);
    if (s.kind === 0) {
      st = "锐角，a·b>0"; col = "#2563eb"; bg = "#eff5ff";
      sn = "投影落在 a 的正方向上";
    } else if (s.kind === 1) {
      st = "垂直，a·b=0"; col = "#b8791f"; bg = "#fdf3e0";
      sn = "投影缩成一个点，数量积为零";
    } else {
      st = "钝角，a·b<0"; col = "#b8402f"; bg = "#fbeae7";
      sn = "投影落在 a 的反向延长线上";
    }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxVb").style.color = col;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    draw();
  }

  function layout() {
    var w = stage.parentElement ? stage.parentElement.getBoundingClientRect().width : 0;
    wide = w >= 640;
    L = wide ? W : N;
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [
      { t: 0, v: 0 }, { t: 1.2, v: 0 },
      { t: 4, v: 90 }, { t: 6.5, v: 90 },
      { t: 9, v: 150 }, { t: 11.5, v: 150 },
      { t: 13.5, v: 0 }
    ],
    keys: [0, 60, 90, 150],
    value: A, min: 0, max: 180, step: 5,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = {
    calc: calc,
    cases: [
      { v: 0, eq: { dot: 4, proj: 2 } },
      { v: 60, eq: { dot: 2, proj: 1 } },
      { v: 90, eq: { dot: 0, proj: 0 } },
      { v: 120, eq: { dot: -2, proj: -1 } },
      { v: 180, eq: { dot: -4, proj: -2 } }
    ]
  };

  var tmr = null;
  window.addEventListener("resize", function () {
    clearTimeout(tmr);
    tmr = setTimeout(layout, 150);
  });
  layout();
});
</script>
</body>
</html>
