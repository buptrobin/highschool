<p class="gx-lede">椭圆、双曲线之后，圆锥曲线最后一个成员。它比前两个都简单：只有一个参数 p，一个方程，一条对称轴。但正因为简单，考场上最容易在三件小事上丢分——焦点写成 (p,0)，准线漏掉负号，把 2p 当成 p。这一页把这三个坑各说两遍以上，最后用一道 5 分小题验证。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 抛物线的定义<span class="q-src">人教A版选择性必修第一册 · 第三章第三节</span></p>
<p class="q-b">平面内与一个定点 F 和一条定直线 l（F∉l）距离相等的点的轨迹叫做抛物线。定点 F 叫做抛物线的焦点，定直线 l 叫做抛物线的准线。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个条件</b>组成——① 有一个定点 F；② 有一条定直线 l，且 F 不在 l 上；③ 动点到两者的距离相等。少任何一个，轨迹都不是抛物线：F 落在 l 上时，轨迹退化成过 F 且垂直于 l 的一条直线。注意定义里只出现「距离」，没有出现 p，p 是后面为了写方程才引进的。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 标准方程<span class="q-src">人教A版选择性必修第一册 · 第三章第三节</span></p>
<p class="q-b">方程 y²=2px（p&gt;0）叫做抛物线的标准方程，它的焦点坐标是 (p/2,0)，准线方程是 x=−p/2。</p>
<p class="q-n">→ 翻成人话：这里要盯住<b>两件事</b>。第一，焦点横坐标是 <b>p/2</b>，不是 p，也不是 2p；第二，准线是 <b>x=−p/2</b>，<b>前面必须带负号</b>。因为 2p 是「2 乘 p」的整体，所以看到 y²=8x 时，先算 2p=8 得 p=4，焦点才是 (2,0)、准线才是 x=−2；直接拿 8 去对半会算成 (4,0)，就错了一整题。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 焦半径<span class="q-src">人教A版选择性必修第一册 · 第三章第三节</span></p>
<p class="q-b">设抛物线上一点 P(x₀,y₀)，则 P 到焦点 F 的距离（焦半径）|PF|=x₀+p/2。</p>
<p class="q-n">→ 翻成人话：这个公式不是新东西，它就是定义 |PF|=|PH| 换个写法。H 是 P 到准线的垂足，|PH| 是从 x₀ 量到 x=−p/2 的水平距离，等于 x₀−(−p/2)=x₀+p/2。所以<b>记不住就别记，画一条水平线过去</b>。注意最后一项是 p/2，不是 p。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>条件</th><th>缺了会怎样</th></tr></thead>
<tbody>
<tr><td>有一个定点 F（焦点）</td><td>只剩一条直线，谈不上「到两点距离」，没有轨迹可定义</td></tr>
<tr><td>有一条定直线 l（准线）</td><td>准线是量距离的标尺，缺了就没有第二个参照物</td></tr>
<tr><td>F∉l</td><td>F 在 l 上时，等距点的轨迹退化为过 F 且垂直于 l 的直线，不是曲线</td></tr>
<tr class="key"><td>动点到 F 的距离 = 到 l 的距离</td><td>这是唯一的约束；比值改成 0&lt;e&lt;1 得椭圆，e&gt;1 得双曲线，等于 1 才是抛物线</td></tr>
<tr><td>p&gt;0，开口向右</td><td>开口方向反过来，方程变成 y²=−2px，焦点 (−p/2,0)，准线 x=p/2</td></tr>
<tr><td>顶点在原点，对称轴为 x 轴</td><td>换成一般位置，方程不再长成 y²=2px 这种最简形式</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">背法：定义只管「等距」，方程才管 p。考卷上问焦点、准线，一律先回到 2p=那个系数，把 p 解出来，再写 (p/2,0) 和 x=−p/2——两步分开写，负号就不会丢。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 由焦半径反求横坐标<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">已知抛物线 y²=8x 上一点 P 到焦点 F 的距离为 5，求点 P 的横坐标 x₀。若 P 在 x 轴上方，再写出 P 的坐标。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题：先分清 2p 和 p</p>
<p class="s-b">方程是 y²=8x，与标准形式 y²=2px 对比，<b>8 是 2p 的位置，不是 p</b>。所以 2p=8，p=4。这一步错了，后面全错。</p>
<p class="s-k">用到：标准方程 y²=2px（p&gt;0）里 2p 是系数。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 写出焦点与准线</p>
<p class="s-b">焦点横坐标是 p/2=2，所以 F(2,0)；准线是 x=−p/2，即 <b>x=−2</b>，负号必须写。因为 p&gt;0，开口向右。</p>
<p class="s-k">用到：焦点 (p/2,0)、准线 x=−p/2。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 把「到焦点的距离」翻成坐标</p>
<p class="s-b">P(x₀,y₀) 在抛物线上，焦半径 |PF|=x₀+p/2=x₀+2。题目给 |PF|=5，于是 x₀+2=5。</p>
<p class="s-k">用到：焦半径公式 |PF|=x₀+p/2（本质是到准线的水平距离）。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 解出 x₀ 并回代</p>
<p class="s-b">x₀=5−2=3。因为 P 在抛物线上，y₀²=8×3=24，所以 y₀=±2√6。题目说 P 在 x 轴上方，取 y₀=2√6，P(3,2√6)。</p>
<p class="s-k">用到：点在曲线上 ⇒ 坐标满足方程。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 检验（考场上省 30 秒）</p>
<p class="s-b">回到定义验证：P 到准线 x=−2 的距离是 3−(−2)=5，与 |PF|=5 相等，符合抛物线定义，答案自洽。</p>
<p class="s-k">用到：定义 |PF|=|PH| 是最好用的验算工具。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">解：抛物线 y²=8x 中 2p=8，故 p=4。<br>
焦点 F(2,0)，准线 l：x=−2。<br>
设 P(x₀,y₀)，由焦半径公式 |PF|=x₀+p/2=x₀+2，<br>
又 |PF|=5，得 x₀+2=5，所以 x₀=3。<br>
又 y₀²=8x₀=24，P 在 x 轴上方，故 y₀=2√6。<br>
所以 P 的横坐标为 3，P(3,2√6)。<br>
检验：P 到准线距离 =3−(−2)=5=|PF|，符合定义。</p>
</div>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「y²=2px 的焦点坐标直接写 (p,0) 行不行？」</p>
<p class="a">不行。<b>焦点是 (p/2,0)</b>，横坐标要除以 2。记法：焦点在顶点右侧 p/2 处，顶点是原点，所以是 (p/2,0)。</p>

</svg>
</div>

<div class="qac">
<p class="q">「准线写成 x=p/2 会扣分吗？」</p>
<p class="a">会，而且一扣就带偏后面。<b>准线是 x=−p/2</b>，<b>负号必须写</b>。准线在顶点左侧，横坐标是负的；漏了负号，焦半径也会跟着算错。</p>

<line x1="20" y1="66" x2="222" y2="66" stroke="#5a6472" stroke-width="1.2"/>
<line x1="64" y1="24" x2="64" y2="112" stroke="#b8402f" stroke-width="1.5" stroke-dasharray="5 4"/>
<circle cx="120" cy="66" r="3" fill="#2f8a5b"/>
<text x="70" y="38" font-size="9.5" fill="#b8402f">x=−p/2（负号）</text>
<text x="126" y="60" font-size="9" fill="#2f8a5b">O</text>
</svg>
</div>

<div class="qac">
<p class="q">「y²=8x 里 p 就是 8 吧？」</p>
<p class="a">不是。<b>2p 是系数，p 要除 2</b>。2p=8 ⇒ p=4，于是焦点 (2,0)、准线 x=−2、焦半径 x₀+2。这一步是整节最高频的失分点。</p>

<text x="24" y="108" font-size="9" fill="#2f8a5b">焦点才写 p/2=2</text>
</svg>
</div>

<div class="qac">
<p class="q">「焦半径 |PF|=x₀+p/2 是背的还是推的？」</p>
<p class="a">推的，一行就出来。P 到准线 x=−p/2 的水平距离 = x₀−(−p/2) = <b>x₀+p/2</b>，再由定义 |PF|=|PH| 得证。末项是 p/2，<b>不是 p</b>。</p>

<div class="qac">
<p class="q">「p 越大，开口越宽还是越窄？」</p>
<p class="a"><b>p 越大开口越宽</b>。同一 x 处，|y|=√(2px) 随 p 增大而增大。p=8 的抛物线比 p=1 的张得开得多。</p>

<p class="er-x">✗ 准线是 x=p/2。</p>
<p class="er-v">✓ 准线方程是 x=−p/2，负号不能省。</p>
<p class="er-w">错在哪：准线在顶点左侧，横坐标取负值。漏掉负号，|PH|=x₀−p/2，焦半径公式也会跟着错。</p>

<div class="er">
<p class="er-x">✗ y²=8x 中 p=8，所以焦点 (4,0)。</p>
<p class="er-v">✓ 2p=8，p=4，焦点 (2,0)，准线 x=−2。</p>
<p class="er-w">错在哪：2p 是系数，不等于 p。看到系数先除 2 得 p，再写 p/2。</p>
</div>

<div class="er">

<p class="er-v">✓ 焦半径 |PF|=x₀+p/2。</p>
<p class="er-w">错在哪：|PH| 是 x₀−(−p/2)，两个负号相消后是加 p/2，不是加 p。</p>
</div>

<div class="er">
<p class="er-x">✗ y²=2px（p&gt;0）开口向左。</p>
<p class="er-v">✓ p&gt;0 时开口向右，焦点在 x 轴正半轴。</p>
<p class="er-w">错在哪：只看「y²」就以为方向由 y 决定。开口方向看 x 的符号：x=y²/(2p)≥0，所以向右。</p>
</div>

<div class="er">
<p class="er-x">✗ 抛物线没有离心率，课本没给。</p>
<p class="er-v">✓ 抛物线离心率 e=1，因为｜PF｜=｜PH｜。</p>
<p class="er-w">错在哪：离心率定义就是到焦点距离与到准线距离之比，抛物线定义里这个比恒为 1，不是没有，是恰为 1。</p>
</div>

<div class="er">
<p class="er-x">✗ 抛物线关于 x 轴、y 轴都对称。</p>
<p class="er-v">✓ 抛物线只有一条对称轴，即 x 轴；不关于 y 轴对称。</p>
<p class="er-w">错在哪：y²=2px 中 y 换成 −y 方程不变（关于 x 轴对称），x 换成 −x 方程改变（不关于 y 轴对称）。</p>

<script>
/* 互动脚本本体（由 build-page.mjs 包进 <script> 里，所以这里不要写 <script> 标签） */
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var GX = window.GX, el = GX.el, tx = GX.tx, $ = GX.$;
  var stage = $("gxStage");
  if (!stage || !window.AutoPilot) return;

  /* 两套坐标：宽屏 880×470，窄屏独立 360×700 */
  var W = { vb: "0 0 880 470", left: { x: 16, y: 16, w: 424, h: 438 }, right: { x: 456, y: 16, w: 408, h: 438 } };
  var N = { vb: "0 0 360 700", left: { x: 8, y: 8, w: 344, h: 300 }, right: { x: 8, y: 320, w: 344, h: 372 } };
  var L = W, G = null, A = 1;

  /* 纯函数：参数 p → 数值。render() 和 __model.cases 都用它 */
  function calc(v) {
    return { p: v, coef: 2 * v, fx: v / 2, dir: -v / 2, r1: 1 + v / 2 };
  }

  function n(x) {
    return Math.abs(x - Math.round(x)) < 1e-9 ? String(Math.round(x)) : x.toFixed(1);
  }

  function geom() {
    var wide = (L === W), lf = L.left;
    var k = wide ? 22 : 16;
    return {
      k: k,
      ox: lf.x + (wide ? 150 : 130),
      oy: lf.y + lf.h * 0.5,
      x0: lf.x + 10, x1: lf.x + lf.w - 10,
      y0: lf.y + 10, y1: lf.y + lf.h - 10
    };
  }

  function arrowX(g, x, y) {
    el("line", { x1: x - 9, y1: y - 4, x2: x, y2: y, stroke: "#5a6472", "stroke-width": 1.2 }, g);
    el("line", { x1: x - 9, y1: y + 4, x2: x, y2: y, stroke: "#5a6472", "stroke-width": 1.2 }, g);
  }
  function arrowY(g, x, y) {
    el("line", { x1: x - 4, y1: y + 9, x2: x, y2: y, stroke: "#5a6472", "stroke-width": 1.2 }, g);
    el("line", { x1: x + 4, y1: y + 9, x2: x, y2: y, stroke: "#5a6472", "stroke-width": 1.2 }, g);
  }

  function draw() {
    var gA = $("gxA"), gB = $("gxB");
    gA.textContent = ""; gB.textContent = "";
    var s = calc(A), g = G, lf = L.left, rb = L.right;
    var X = function (u) { return g.ox + u * g.k; };
    var Y = function (v) { return g.oy - v * g.k; };

    /* ---------- 左：抛物线本体 ---------- */
    el("rect", { x: lf.x, y: lf.y, width: lf.w, height: lf.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    tx(gA, lf.x + 18, lf.y + 26, "y²=2px", "#5a6472", "start", 11, 700);

    var uMax = (g.x1 - g.ox) / g.k;
    var vMax = Math.min((g.oy - g.y0) / g.k, (g.y1 - g.oy) / g.k);

    /* 坐标轴 + 单位刻度 */
    el("line", { x1: g.x0, y1: g.oy, x2: g.x1 - 2, y2: g.oy, stroke: "#5a6472", "stroke-width": 1.2 }, gA);
    el("line", { x1: g.ox, y1: g.y1, x2: g.ox, y2: g.y0 + 2, stroke: "#5a6472", "stroke-width": 1.2 }, gA);
    arrowX(gA, g.x1, g.oy); arrowY(gA, g.ox, g.y0);
    tx(gA, g.x1 - 8, g.oy + 16, "x", "#5a6472", "start", 10, 400);
    tx(gA, g.ox + 8, g.y0 + 10, "y", "#5a6472", "start", 10, 400);
    var u, v;
    for (u = 2; u <= uMax - 1.6; u += 2) {
      el("line", { x1: X(u), y1: g.oy - 3, x2: X(u), y2: g.oy + 3, stroke: "#8a94a3", "stroke-width": 1 }, gA);
      tx(gA, X(u), g.oy + 15, String(u), "#8a94a3", "middle", 8.5, 400);
    }
    for (v = 2; v <= vMax - 0.4; v += 2) {
      el("line", { x1: g.ox - 3, y1: Y(v), x2: g.ox + 3, y2: Y(v), stroke: "#8a94a3", "stroke-width": 1 }, gA);
      tx(gA, g.ox - 6, Y(v) + 3, String(v), "#8a94a3", "end", 8.5, 400);
      el("line", { x1: g.ox - 3, y1: Y(-v), x2: g.ox + 3, y2: Y(-v), stroke: "#8a94a3", "stroke-width": 1 }, gA);
      tx(gA, g.ox - 6, Y(-v) + 3, "−" + String(v), "#8a94a3", "end", 8.5, 400);
    }

    /* 准线（虚线，带负号） */
    var dx = X(s.dir);
    el("line", { x1: dx, y1: g.y0 + 12, x2: dx, y2: g.y1 - 10, stroke: "#b8402f", "stroke-width": 1.5, "stroke-dasharray": "6 4" }, gA);
    tx(gA, dx + 5, g.y0 + 30, "x=−" + n(Math.abs(s.dir)), "#b8402f", "start", 9.5, 700);

    /* 抛物线 */
    var vLim = Math.min(vMax, Math.sqrt(2 * A * uMax));
    var pts = [], i, t;
    for (i = 0; i <= 42; i++) {
      t = -vLim + 2 * vLim * i / 42;
      pts.push(n(X(t * t / (2 * A))) + "," + n(Y(t)));
    }
    el("polyline", { points: pts.join(" "), fill: "none", stroke: "#2563eb", "stroke-width": 2.4 }, gA);

    /* 顶点、焦点 */
    el("circle", { cx: g.ox, cy: g.oy, r: 3.2, fill: "#2f8a5b" }, gA);
    tx(gA, g.ox - 14, g.oy + 17, "O", "#2f8a5b", "middle", 9.5, 700);
    el("circle", { cx: X(s.fx), cy: g.oy, r: 3.6, fill: "#b8402f" }, gA);
    tx(gA, X(s.fx) + 6, g.oy - 7, "F(" + n(s.fx) + ",0)", "#b8402f", "start", 9.5, 700);

    /* 点 (1,y₀) 的焦半径 */
    var py = Math.sqrt(2 * A);
    if (py < vLim - 0.05) {
      var px = X(1), pyy = Y(py);
      el("line", { x1: px, y1: pyy, x2: X(s.fx), y2: g.oy, stroke: "#2563eb", "stroke-width": 2 }, gA);
      el("circle", { cx: px, cy: pyy, r: 3.2, fill: "#2563eb" }, gA);
      tx(gA, px + 6, pyy - 7, "P", "#2563eb", "start", 9.5, 700);
      tx(gA, px, g.oy + 15, "1", "#8a94a3", "middle", 8.5, 400);
    }

    /* ---------- 右：数值面板 ---------- */
    el("rect", { x: rb.x, y: rb.y, width: rb.w, height: rb.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    tx(gB, rb.x + 22, rb.y + 30, "p 一变，四个量一起变", "#5a6472", "start", 11, 700);
    var cm = "#3a3a35";
    tx(gB, rb.x + 22, rb.y + 62, "系数 2p = " + n(s.coef), cm, "start", 10.5, 400);
    tx(gB, rb.x + 22, rb.y + 88, "参数 p = 2p ÷ 2 = " + n(s.p), cm, "start", 10.5, 400);
    tx(gB, rb.x + 22, rb.y + 114, "焦点 F(p/2,0) = (" + n(s.fx) + ",0)", "#b8402f", "start", 10.5, 700);
    tx(gB, rb.x + 22, rb.y + 140, "准线 x = −p/2，即 x=−" + n(Math.abs(s.dir)), "#b8402f", "start", 10.5, 700);
    tx(gB, rb.x + 22, rb.y + 166, "焦半径 1+p/2 = " + n(s.r1), "#2563eb", "start", 10.5, 700);

    var bx0 = rb.x + 24, bw = rb.w - 48, by0 = rb.y + 206;
    el("line", { x1: bx0, y1: by0, x2: bx0 + bw, y2: by0, stroke: "#e6e9ee", "stroke-width": 1.6 }, gB);
    el("line", { x1: bx0 + bw, y1: by0 - 8, x2: bx0 + bw, y2: by0 + 8, stroke: "#e6e9ee", "stroke-width": 1.6 }, gB);
    el("rect", { x: bx0, y: by0 - 9, width: Math.max(3, bw * s.r1 / 5), height: 18, rx: 4, fill: "#2563eb" }, gB);
    tx(gB, bx0, by0 + 24, "0", "#8a94a3", "start", 8.5, 400);
    tx(gB, bx0 + bw, by0 + 24, "5", "#8a94a3", "end", 8.5, 400);
    tx(gB, rb.x + 22, by0 + 48, "焦半径刻度条（p=8 时最长，为 5）", "#5a6472", "start", 9.5, 400);
    tx(gB, rb.x + 22, by0 + 74, "p=4 是停留帧：" + "F(2,0)、x=−2、焦半径 3", "#2f8a5b", "start", 9.5, 700);
    tx(gB, rb.x + 22, by0 + 98, "焦点与准线始终关于顶点对称", "#2f8a5b", "start", 9.5, 400);
  }

  function render() {
    if (!G) { L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N; G = geom(); stage.setAttribute("viewBox", L.vb); }
    var s = calc(A), st, col, bg, sn;
    $("gxVa").textContent = n(A);
    $("gxVb").textContent = n(s.fx);
    $("gxVc").textContent = n(s.r1);
    if (A < 3) { st = "开口偏窄"; col = "#b8791f"; bg = "#fdf3e0"; sn = "焦点离顶点很近"; }
    else if (A <= 5.5) { st = "开口适中"; col = "#2f8a5b"; bg = "#e6f6ee"; sn = "焦点 (p/2,0) 已过 2"; }
    else { st = "开口很宽"; col = "#2563eb"; bg = "#e8effd"; sn = "焦点随 p 一起外移"; }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    draw();
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    G = geom();
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 1 }, { t: 1.2, v: 1 }, { t: 4, v: 4 }, { t: 6.5, v: 4 }, { t: 9, v: 8 }, { t: 11.5, v: 2 }, { t: 13.5, v: 1 }],
    keys: [1, 2, 4, 8],
    value: A, min: 1, max: 8, step: 0.5,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc, cases: [
    { v: 2, eq: { p: 2, coef: 4, fx: 1, dir: -1, r1: 2 } },
    { v: 4, eq: { p: 4, coef: 8, fx: 2, dir: -2, r1: 3 } },
    { v: 8, eq: { p: 8, coef: 16, fx: 4, dir: -4, r1: 5 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
