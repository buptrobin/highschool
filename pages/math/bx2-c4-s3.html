<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 用样本估计总体<span class="q-src">人教A版必修第二册 · 第九章第3节</span></p>
<p class="q-b">用样本的频率分布估计总体的频率分布，用样本的数字特征估计总体的数字特征。</p>
<p class="q-n">→ 翻成人话：句子里两次出现的动词都是<b>「估计」</b>，不是「等于」、不是「代表」、更不是「就是」。它由<b>三个条件</b>共同成立：① 样本要随机抽取、对总体有代表性；② 样本量要足够大；③ 报结论时要给出误差范围。少任何一个，这句话就不成立——样本只能估计总体，一旦写成「总体就是」，整道题的分就没了。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 两组比较<span class="q-src">人教A版必修第二册 · 第九章第3节</span></p>
<p class="q-b">在比较两个群体的某项指标时，可以分别计算它们的平均数与标准差，也可以用频率分布直方图直观比较。</p>
<p class="q-n">→ 翻成人话：注意「平均数<b>与</b>标准差」这个并列结构，两个都要报。平均数说「中心在哪」，标准差说「散得多开」，只报一个就是在瞒信息。比较两组要同时看平均数与离散程度，这是本节第二条硬规矩。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 样本量<span class="q-src">人教A版必修第二册 · 第九章第3节</span></p>
<p class="q-b">样本量越大，用样本估计总体的误差一般越小。</p>
<p class="q-n">→ 翻成人话：三个关键词——「越大」「一般」「越小」。误差随 n 增大而减小，但这是<b>趋势</b>不是保证：n 变大只是把随机误差压小，如果抽样本身有偏（只抽了爱健身的部门），误差不会因为 n 变大而消失，反而会更自信地错。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>条件</th><th>做到时的规范说法</th><th>缺了会怎样</th></tr></thead>
<tbody>
<tr><td>样本随机抽取、有代表性</td><td>「用样本比例估计总体比例」</td><td>只抽后勤部，30% 只反映后勤，不能推全公司</td></tr>
<tr><td>样本量足够大</td><td>「n=400，误差范围约 ±4.5%」</td><td>n=20 时误差 ±22%，结论没有信息量</td></tr>
<tr><td>报结论时给出误差范围</td><td>「总体比例约在 25.5%–34.5% 之间」</td><td>只写「30%」会被当成真值，属于断言总体</td></tr>
<tr class="key"><td>比较两组时同时报平均数与标准差</td><td>「平均数接近，但乙组标准差大得多，分布更分散」</td><td>只比平均数，会把两组判成「一样」——这正是本节最爱考的一刀</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">背法：把「估计」当成动词圈出来，答题时凡是想写「就是」「一定」「说明总体」的地方，都改写成「估计」「约」「大约在……之间」。整张表只有最后一行是高亮行。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 用样本比例估计总体比例<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">某公司随机抽取 400 名员工体检，其中超重 120 人。<br>（1）能否说「该公司员工的超重比例就是 30%」？为什么？<br>（2）求超重比例的 95% 误差范围，并估计该公司超重比例的所在区间。<br><span class="gx-note" style="margin:6px 0 0">陷阱点：题干里「就是」两个字，是整道题的判分点。</span></p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 定性：先判「能不能断言」</p>
<p class="s-b">样本比例 p̂ = 120/400 = 0.30。这是<b>样本</b>里超重的频率，不是总体比例。题目问「就是 30%」，属于对总体下断言，而样本只能估计总体，因此不能这样说。</p>
<p class="s-k">用到：用样本的频率估计总体的频率——动词是「估计」。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 选公式，写清每个字母</p>
<p class="s-b">比例型指标的误差范围用 <span class="gx-fml">moe = 1.96√(p̂(1 − p̂)/n)</span>。这里 p̂ = 0.30，n = 400，1.96 是 95% 置信水平对应的系数。先写公式再代数，分步给分。</p>
<p class="s-k">用到：误差范围 = 系数 × 样本比例的标准差。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 代入计算，控制有效数字</p>
<p class="s-b">p̂(1 − p̂) = 0.3 × 0.7 = 0.21；0.21 ÷ 400 = 0.000525；√0.000525 ≈ 0.0229；0.0229 × 1.96 ≈ 0.0449。所以误差范围约 <b>±4.5%</b>（即 ±0.045）。</p>
<p class="s-k">用到：开方与近似计算，中间步骤保留 4 位有效数字。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 写出区间，说清「±」的含义</p>
<p class="s-b">超重比例的估计区间为 30% − 4.5% 到 30% + 4.5%，即约 <b>25.5% 到 34.5%</b>。这里的 ±4.5% 是<b>绝对百分点</b>，不是「相对误差 4.5%」。</p>
<p class="s-k">用到：p̂ ± moe 的区间写法。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 回到设问，给出「能/不能」的完整回答</p>
<p class="s-b">不能断言「就是 30%」。规范表述是：可以估计该公司员工的超重比例约为 30%，95% 的误差范围约 ±4.5%，即总体超重比例大约在 25.5% 到 34.5% 之间；若要把范围压得更窄，应增大样本量。</p>
<p class="s-k">用到：结论必须落在区间上；「增大 n」是误差随 n 增大而减小的直接应用。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）不能。120/400 = 0.30 只是样本中超重的频率，样本只能估计总体，不能据此断言总体超重比例就是 30%。<br>（2）由 <span class="gx-fml">moe = 1.96√(p̂(1 − p̂)/n)</span>，取 p̂ = 0.30，n = 400，得 moe = 1.96√(0.3 × 0.7 ÷ 400) = 1.96 × 0.0229 ≈ 0.045，即误差范围约 ±4.5%。<br>（3）故该公司员工的超重比例估计在 30% ± 4.5%，即约 25.5%–34.5% 之间，95% 置信水平。<br>（4）若需更小的误差范围，可增大样本量 n——误差随 n 增大而减小，但只按 1/√n 缩小。</p>
</div>
</div>
</section>
<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「抽了 400 人，样本能代表 3200 人的总体吗？」</p>
<p class="a">能用来<b>估计</b>，不能用来<b>断言</b>。前提是这 400 人是<b>随机抽取</b>的：每个人被抽到的机会相同，样本的构成才会接近总体。若只抽某个部门，样本就有偏，再大的 n 也救不回来。</p>

<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>

<rect x="32" y="58" width="70" height="38" rx="5" fill="#5cb98c"/>
<text x="36" y="76" font-size="8.4" fill="#ffffff" font-weight="700">随机样本</text>
<text x="36" y="89" font-size="8.4" fill="#ffffff">400 人</text>
<path d="M150 78 L178 78" stroke="#8fa0ae" stroke-width="1.6"/><polygon points="178,74 188,78 178,82" fill="#8fa0ae"/>
<text x="152" y="112" font-size="8.4" fill="#7a8593">只能估计</text>
<text x="196" y="70" font-size="8.4" fill="#b8402f">≠ 就是</text>
</svg>
</div>
<div class="qac">
<p class="q">「两个部门平均数都是 24，是不是就一样了？」</p>
<p class="a">不是。平均数只定「位置」，<b>标准差定「胖瘦」</b>。甲组 s = 2.3 说明数据贴着 24；乙组 s = 4.1 说明两头的极端值多。比较两组要同时看平均数与离散程度，缺一个都不能下结论。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="平均数相同但离散程度不同的两条曲线">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<path d="M20 104 L20 32" stroke="#8fa0ae" stroke-width="1.4"/>
<path d="M20 104 L224 104" stroke="#8fa0ae" stroke-width="1.4"/>
<path d="M92 104 L92 34" stroke="#b8402f" stroke-width="1" stroke-dasharray="3 2"/>
<path d="M52 104 C 74 104 78 46 92 46 C 106 46 110 104 132 104" fill="none" stroke="#2f8a5b" stroke-width="2"/>
<path d="M40 104 C 70 104 76 66 92 66 C 108 66 114 104 144 104" fill="none" stroke="#b8791f" stroke-width="2"/>
<text x="98" y="28" font-size="8.4" fill="#b8402f">x̄ 相同</text>
<text x="140" y="60" font-size="8.4" fill="#2f8a5b">s 小</text>
<text x="150" y="84" font-size="8.4" fill="#b8791f">s 大</text>
</svg>
</div>
<div class="qac">
<p class="q">「误差范围到底怎么算？为啥乘 1.96？」</p>
<p class="a">比例型：<span class="gx-fml">moe = 1.96√(p̂(1 − p̂)/n)</span>。1.96 是 95% 置信水平对应的系数（正态分布两侧各 2.5% 的分位点）；n 在分母、又在根号里，所以 <b>n 越大误差越小</b>，且只按 1/√n 缩。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="误差范围公式示意">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="46" font-size="10.5" text-anchor="middle" fill="#151a21" font-weight="700">moe = 1.96√(p̂(1−p̂)/n)</text>
<text x="120" y="70" font-size="9" text-anchor="middle" fill="#5a6472">p̂ = 0.30，n = 400</text>
<text x="120" y="94" font-size="11" text-anchor="middle" fill="#b8402f" font-weight="700">≈ ±4.5%</text>
</svg>
</div>
<div class="qac">
<p class="q">「样本量翻 4 倍，误差就减半吗？」</p>
<p class="a">对，比例型指标就是这样：误差范围里有 √n，n 变 4 倍则 √n 变 2 倍，误差减半。所以 n 从 100 到 400，误差从 ±9.8% 到 ±4.9%；再到 1600，只到 ±2.5%——<b>越往后越不划算</b>。</p>

<rect x="26" y="70" width="76" height="14" rx="3" fill="#c99a4b"/>
<text x="108" y="81" font-size="8.4" fill="#b8791f">±4.9%</text>
<rect x="26" y="96" width="38" height="14" rx="3" fill="#5cb98c"/>
<text x="70" y="107" font-size="8.4" fill="#2f8a5b">±2.5%</text>

<div class="qac">
<p class="q">「都随机抽了，还分层抽样干什么？」</p>
<p class="a">因为随机不等于抽得均匀。公司里行政、后勤、车间的人数与作息差别很大，纯随机可能把某一类人抽少了。分层抽样按部门<b>按比例抽</b>，保证每一层都被代表，结论才不偏——这一步防的是<b>偏差</b>，不是误差。</p>

<div class="qac">
<p class="q">「统计里的『显著』是什么意思？」</p>
<p class="a">不是「差别很大」，而是「这么大的差别，用随机波动解释不掉」。判断办法还是回到误差范围：若两组区间<b>明显错开</b>，才敢说差异显著；区间大幅重叠时，只能写「未发现显著差异」。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 样本里超重占 30%，所以公司超重比例就是 30%。</p>
<p class="er-v">✓ 用样本比例估计总体比例，并根据样本量给出误差范围。</p>
<p class="er-w">错在哪：把「估计」写成「就是」，等于用样本替总体下断言——样本只能估计总体。</p>
</div>
<div class="er">
<p class="er-x">✗ 两组平均数都是 24，所以两组员工的体型一样。</p>
<p class="er-v">✓ 两组平均数接近，但标准差分别为 2.3 与 4.1，乙组分布更分散。</p>
<p class="er-w">错在哪：漏掉离散程度。比较两组要同时看平均数与离散程度。</p>
</div>
<div class="er">
<p class="er-x">✗ 样本量越大，结论就一定越正确。</p>
<p class="er-v">✓ 样本量越大，误差一般越小；但若抽样有偏，结论仍会偏离总体。</p>
<p class="er-w">错在哪：大 n 只能压小随机误差，压不掉抽样偏差。误差随 n 增大而减小，不等于结论必然正确。</p>
</div>
<div class="er">
<p class="er-x">✗ 公司有 3200 人，误差范围应该比 400 人的小公司更大。</p>
<p class="er-v">✓ 误差范围由样本量 n 与 p̂ 决定，与总体规模基本无关。</p>
<p class="er-w">错在哪：把总体规模当成误差来源。公式里只有 p̂ 和 n，没有 N。</p>
</div>
<div class="er">
<p class="er-x">✗ 从直方图上能看出每个人 BMI 是多少。</p>
<p class="er-v">✓ 直方图只显示各组的频率（面积），读不出原始数据。</p>
<p class="er-w">错在哪：混淆了原始数据与频率分布。整理这一步的产物是表和图，不是名单。</p>
</div>
<div class="er">
<p class="er-x">✗ 只统计上午在岗的员工就够了，反正人不少。</p>
<p class="er-v">✓ 应按部门分层随机抽样，保证样本对总体有代表性。</p>
<p class="er-w">错在哪：样本有偏。上夜班的员工系统性地被排除，n 再大也补不回来。</p>
</div>
<div class="er">
<p class="er-x">✗ 误差范围 ±4.5% 的意思是相对误差 4.5%。</p>
<p class="er-v">✓ 误差范围 ±4.5% 是绝对百分点，即比例在 25.5%–34.5% 之间。</p>
<p class="er-w">错在哪：把百分点当百分比。写答案时直接给区间端点，最不容易被扣分。</p>
</div>
</div>
</section>

<script src="../../assets/gx.js"></script>

<script>
/* 互动脚本本体（由 build-page.mjs 包进 <script> 里，所以这里不要写 <script> 标签） */
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var GX = window.GX, el = GX.el, tx = GX.tx, $ = GX.$;
  var stage = $("gxStage");
  if (!stage || !window.AutoPilot) return;

  /* 两套坐标：宽屏 880×470，窄屏独立 360×700 */
  var W = { vb: "0 0 880 470", left: { x: 16, y: 16, w: 424, h: 438 }, right: { x: 456, y: 16, w: 408, h: 438 } };
  var N = { vb: "0 0 360 700", left: { x: 8, y: 8, w: 344, h: 300 }, right: { x: 8, y: 320, w: 344, h: 372 } };
  var L = W, A = 400, P = 0.5;
  var MOE_MAX = 1.96 * Math.sqrt(0.25 / 100), MOE_MIN = 1.96 * Math.sqrt(0.25 / 1600);

  /* 纯函数：样本量 → 95% 误差范围与总体比例区间。render() 与 __model.cases 都用它 */
  function calc(v) {
    var n = Math.max(100, Math.min(1600, v));
    var moe = 1.96 * Math.sqrt(0.25 / n);
    return { moe: moe, lo: P - moe, hi: P + moe };
  }

  function pct(x) { return (x * 100).toFixed(1) + "%"; }

  function draw() {
    var gA = $("gxA"), gB = $("gxB");
    gA.textContent = ""; gB.textContent = "";
    var s = calc(A);
    var lx = L.left.x, ly = L.left.y, lw = L.left.w, lh = L.left.h;
    var rx = L.right.x, ry = L.right.y, rw = L.right.w, rh = L.right.h;

    el("rect", { x: lx, y: ly, width: lw, height: lh, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    tx(gA, lx + 18, ly + 28, "样本比例 p̂ 的 95% 波动范围", "#5a6472", "start", 10.5, 700);

    var ax = lx + 26, bx = lx + lw - 26, ay = ly + lh - 52;
    function X(u) { return ax + u * (bx - ax); }
    var cx = X(0.5);

    el("path", { d: "M" + ax + " " + ay + " L" + bx + " " + ay, stroke: "#8fa0ae", "stroke-width": 1.6 }, gA);
    el("polygon", { points: (bx - 14) + "," + (ay - 5) + " " + (bx + 2) + "," + ay + " " + (bx - 14) + "," + (ay + 5), fill: "#8fa0ae" }, gA);
    tx(gA, ax - 2, ay + 18, "0.3", "#7a8593", "start", 9, 400);
    tx(gA, cx, ay + 18, "0.5", "#7a8593", "middle", 9, 400);
    tx(gA, bx, ay + 18, "0.7", "#7a8593", "end", 9, 400);

    var half = (s.moe / 0.4) * (bx - ax);
    var bandTop = ay - 108;
    el("rect", { x: cx - half, y: bandTop, width: 2 * half, height: 30, rx: 4, fill: "#dcecf7", stroke: "#9dc3e0" }, gA);
    el("path", { d: "M" + cx + " " + (bandTop - 8) + " L" + cx + " " + (ay - 6), stroke: "#9aa7b4", "stroke-width": 1.2, "stroke-dasharray": "4 3" }, gA);
    tx(gA, cx, bandTop - 14, "p = 0.5", "#5a6472", "middle", 9, 400);
    tx(gA, cx + half + 6, bandTop + 19, "±" + pct(s.moe), "#2f6f9e", "start", 9.4, 700);
    tx(gA, ax, bandTop + 46, "每次抽 " + Math.round(A) + " 人，p̂ 有 95% 的概率落在这条带子里", "#5a6472", "start", 9, 400);

    /* 示意：12 个模拟的 p̂，抖动幅度随 moe 变 */
    var dy = bandTop - 34;
    for (var i = 0; i < 12; i++) {
      var t = Math.sin((i + 1) * 12.9898) * 43758.5453;
      t = t - Math.floor(t);
      var off = (t * 2 - 1) * half;
      el("circle", { cx: cx + off, cy: dy - (i % 2) * 12, r: 3, fill: i % 3 === 0 ? "#6b7d8d" : "#a9b8c5" }, gA);
    }
    tx(gA, ax, dy - 34, "12 次重复抽样的 p̂ 落在哪", "#7a8593", "start", 9, 400);

    el("rect", { x: rx, y: ry, width: rw, height: rh, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    tx(gB, rx + 18, ry + 28, "误差范围随 n 增大而减小", "#5a6472", "start", 10.5, 700);

    var ox = rx + 30, oy2 = ry + rh - 56, tw = rw - 60;
    function NX(n) { return ox + ((n - 100) / 1500) * tw; }
    function MY(m) { return oy2 - ((m - MOE_MIN) / (MOE_MAX - MOE_MIN)) * (rh - 156); }

    el("path", { d: "M" + ox + " " + oy2 + " L" + (ox + tw) + " " + oy2, stroke: "#8fa0ae", "stroke-width": 1.5 }, gB);
    el("path", { d: "M" + ox + " " + oy2 + " L" + ox + " " + MY(MOE_MAX - 0.002), stroke: "#8fa0ae", "stroke-width": 1.5 }, gB);
    el("polygon", { points: (ox - 5) + "," + (MY(MOE_MAX) + 6) + " " + ox + "," + (MY(MOE_MAX) - 6) + " " + (ox + 5) + "," + (MY(MOE_MAX) + 6), fill: "#8fa0ae" }, gB);
    tx(gB, ox, oy2 + 17, "n=100", "#7a8593", "start", 8.6, 400);
    tx(gB, ox + tw, oy2 + 17, "n=1600", "#7a8593", "end", 8.6, 400);
    tx(gB, rx + 18, ry + 46, "纵轴：误差范围，从 ±9.8%（n=100）收到 ±2.5%（n=1600）", "#7a8593", "start", 9, 400);

    var d = "", k;
    for (k = 100; k <= 1600; k += 50) {
      d += (k === 100 ? "M" : "L") + NX(k).toFixed(1) + " " + MY(calc(k).moe).toFixed(1) + " ";
    }
    el("path", { d: d, fill: "none", stroke: "#2563eb", "stroke-width": 2.2 }, gB);

    [400, 900, 1600].forEach(function (n) {
      el("circle", { cx: NX(n), cy: MY(calc(n).moe), r: 3, fill: "#9aa7b4" }, gB);
    });
    el("circle", { cx: NX(A), cy: MY(s.moe), r: 5.5, fill: "#2563eb" }, gB);
    tx(gB, Math.min(NX(A) + 10, ox + tw - 40), MY(s.moe) - 8, "±" + pct(s.moe), "#2563eb", "start", 9.4, 700);
  }

  function render() {
    var s = calc(A), st, col, bg, sn;
    $("gxVa").textContent = String(Math.round(A));
    $("gxVb").textContent = "±" + pct(s.moe);
    $("gxVc").textContent = pct(s.lo) + "–" + pct(s.hi);
    if (A < 250) { st = "只能粗略估计"; col = "#b8402f"; bg = "#fbeae7"; sn = "误差超过 ±6%，别下强结论"; }
    else if (A < 1200) { st = "结论可用，仍需报范围"; col = "#b8791f"; bg = "#fdf3e0"; sn = "误差约 ±3%~6%，写答案要带区间"; }
    else { st = "可以下较肯定的结论"; col = "#2f8a5b"; bg = "#e6f6ee"; sn = "误差已压到 ±3% 以内"; }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    draw();
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 400 }, { t: 0.9, v: 100 }, { t: 2.4, v: 100 }, { t: 5.2, v: 400 }, { t: 7.7, v: 400 }, { t: 10.2, v: 900 }, { t: 12.2, v: 1600 }, { t: 14, v: 400 }],
    keys: [100, 400, 900, 1600],
    value: A, min: 100, max: 1600, step: 10,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc, cases: [
    { v: 100, eq: { moe: 0.098 } },
    { v: 400, eq: { moe: 0.049 } },
    { v: 900, eq: { moe: 0.0327 } },
    { v: 1600, eq: { moe: 0.0245 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
