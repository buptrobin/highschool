<p class="gx-claim">等差数列只有三个可考的点：<b>公差是后项减前项</b>、<b>aₙ 是 n 的一次函数</b>、<b>Sₙ 是 n 的二次函数且常数项为 0</b>。</p>
<div class="gx-meta">
<span><i></i>人教A版选择性必修第二册 第四章 4.2</span>
<span><i></i>高二 · 选择性必修第二册</span>
<span><i></i>阅读 12 分钟</span>
<span><i></i>含 1 个互动模型</span>
</div>
<p class="gx-lede">4.1 用 aₙ 与 Sₙ 两个符号把数列的语言搭好，4.2 就让这套语言第一次长出「可算」的骨架：只要多给一个公差 d，整条数列就被钉死了。这一节真正难的不是记公式，而是三个方向性判断——公差是谁减谁、aₙ 的图象为什么是一条直线、Sₙ 为什么没有常数项。把这三件事想反，后面等差求和、错位相减、数列不等式会一路错下去。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 等差数列的定义<span class="q-src">人教A版选择性必修第二册 · 第四章 4.2</span></p>
<p class="q-b">一般地，如果一个数列从第 2 项起，每一项与它的前一项的差等于同一个常数，那么这个数列叫做等差数列，这个常数叫做等差数列的公差，公差通常用字母 d 表示。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个条件</b>组成——① 从<b>第 2 项</b>起（不是从第 1 项起，因为第 1 项没有前一项）；② 每一项<b>减它的前一项</b>（方向固定：后减前）；③ 差是<b>同一个常数</b>（每一项都验，不是头两项相等就算）。少掉第 ② 条，d 会整体变号；少掉第 ③ 条，那只是「差值在变的数列」，通项公式不能套。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 通项公式<span class="q-src">人教A版选择性必修第二册 · 第四章 4.2</span></p>
<p class="q-b">由等差数列的定义可得 aₙ = a₁ + (n − 1)d，当 n = 1 时也成立，这就是等差数列的通项公式。</p>
<p class="q-n">→ 翻成人话：从 a₁ 走到 aₙ 一共要跨 <b>n − 1 步</b>，不是 n 步——这是全章最高频的差一错误。把 n = 1 代进去得 a₁ = a₁ + 0·d，正好成立，所以公式对一切正整数 n 有效。它是关于 n 的<b>一次函数</b>（d ≠ 0 时），斜率是 d，在 n 轴上的截距是 a₁ − d。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 前 n 项和公式<span class="q-src">人教A版选择性必修第二册 · 第四章 4.2</span></p>
<p class="q-b">等差数列的前 n 项和公式为 Sₙ = n(a₁ + aₙ)/2，又有 Sₙ = na₁ + n(n − 1)d/2。</p>
<p class="q-n">→ 翻成人话：两个公式是<b>同一件事的两种写法</b>，用哪个看已知条件——给了 aₙ 用第一个（首末相加），只给 a₁、d 用第二个。展开第二个得 Sₙ = (d/2)n² + (a₁ − d/2)n，所以 Sₙ 是 n 的<b>二次函数且常数项为 0</b>：S₀ = 0 永远成立，这就是「常数项为 0」的证据。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>条件</th><th>满足时的后果</th><th>缺了会怎样</th></tr></thead>
<tbody>
<tr><td>从第 2 项起，后项减前项是同一常数 d</td><td>整条数列由 a₁ 与 d 唯一确定，可套通项、可套求和</td><td>只是普通数列，aₙ = a₁ + (n − 1)d 不成立，一切公式作废</td></tr>
<tr><td>d ≠ 0</td><td>aₙ 是 n 的一次函数，图象是斜率 d 的一条直线，严格单调</td><td>d = 0 时常数列，斜率 0，仍是一次函数（不能说不存在公差）</td></tr>
<tr><td>n 就是项数，从 1 开始数</td><td>aₙ 与 Sₙ 里的 n 与「第几项」一一对应</td><td>把 a₃ 到 a₇ 的项数算成 7 − 3 + 1 = 5 之外的花样，Sₙ 立刻错</td></tr>
<tr class="key"><td>公差的方向：d = aₙ₊₁ − aₙ（后项减前项）</td><td>递推 aₙ₊₁ = aₙ + d 与通项公式同号，递增时 d &gt; 0</td><td>写成 aₙ − aₙ₊₁ 就得到 −d，递增数列会算出 d &lt; 0，整题反向</td></tr>
<tr><td>2a₂ = a₁ + a₃（等差中项）</td><td>任意连续三项可互推，已知两项能补中间项</td><td>写成 a₁ + a₃ = a₂ 就丢了系数 2，中项公式退化成错误等式</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只高亮 1 行：<b>公差方向</b>。背法一句话——「后减前，正着走」：d &gt; 0 数列递增，d &lt; 0 数列递减，d = 0 数列不变。先把方向定死，再谈公式。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 由两项求基本量再求和<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">已知等差数列 {aₙ} 中 a₃ = 7，a₇ = 15。求 a₁、公差 d 与 S₁₀。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题：把两个条件都写成「a₁ + 几个 d」</p>
<p class="s-b">a₃ 是从 a₁ 走 <b>2 步</b>到的地方，a₇ 走 6 步，于是 <span class="gx-fml">a₃ = a₁ + 2d = 7，a₇ = a₁ + 6d = 15</span>。两个未知数 a₁、d，两个方程，方程数够。</p>
<p class="s-k">用到：通项公式 aₙ = a₁ + (n − 1)d，步数是 n − 1 不是 n。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 求 d：两式相减，把 a₁ 消掉</p>
<p class="s-b">后式减前式：<span class="gx-fml">(a₁ + 6d) − (a₁ + 2d) = 15 − 7</span>，即 <span class="gx-fml">4d = 8</span>，得 <span class="gx-fml">d = 2</span>。注意左边是 6 − 2 = 4 个 d，正好对应下标差 7 − 3 = 4：<b>下标的差就是 d 的个数</b>。</p>
<p class="s-k">用到：d = (a₇ − a₃)/(7 − 3)，本质是「后减前、项数差」。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 求 a₁：代回任一个等式</p>
<p class="s-b">代 a₃ = 7 得 <span class="gx-fml">a₁ + 2 × 2 = 7</span>，所以 <span class="gx-fml">a₁ = 3</span>。代另一个验：a₁ + 6 × 2 = 3 + 12 = 15 ✓。</p>
<p class="s-k">用到：把求出的 d 回代，另一条方程用来验算。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 求 a₁₀，为求和做准备</p>
<p class="s-b"><span class="gx-fml">a₁₀ = a₁ + 9d = 3 + 9 × 2 = 21</span>。也可以从 a₇ 走 3 步：a₁₀ = 15 + 3 × 2 = 21，两条路要一致。</p>
<p class="s-k">用到：通项公式；跨项走「几步」永远等于下标之差。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 求和：用含 a₁₀ 的那个公式最省</p>
<p class="s-b"><span class="gx-fml">S₁₀ = 10(a₁ + a₁₀)/2 = 10 × (3 + 21)/2 = 10 × 12 = 120</span>。若改用 Sₙ = na₁ + n(n − 1)d/2，得 10 × 3 + 10 × 9 × 2/2 = 30 + 90 = 120，两个公式必须给出同一个数。</p>
<p class="s-k">用到：Sₙ = n(a₁ + aₙ)/2，项数 n = 10（10 项，不是 9 项）。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">设公差为 d。由 <span class="gx-fml">a₇ − a₃ = 4d</span> 得 <span class="gx-fml">d = (15 − 7)/(7 − 3) = 2</span>。由 <span class="gx-fml">a₃ = a₁ + 2d</span> 得 <span class="gx-fml">a₁ = 7 − 2 × 2 = 3</span>。所以 <span class="gx-fml">a₁₀ = a₁ + 9d = 3 + 18 = 21</span>，<span class="gx-fml">S₁₀ = 10(a₁ + a₁₀)/2 = 10 × 24/2 = 120</span>。答：a₁ = 3，d = 2，S₁₀ = 120。</p>
</div>
</div>
</section>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「公差到底是谁减谁？我总怕方向反。」</p>
<p class="a">永远是<b>后项减前项</b>：<span class="gx-fml">d = aₙ₊₁ − aₙ</span>。所以 d &gt; 0 ⇔ 数列递增，d &lt; 0 ⇔ 递减。用 aₙ − aₙ₊₁ 得到的是 −d，整题反向。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="数轴上后项减前项的方向">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="26" y1="66" x2="176" y2="66" stroke="#8a97a6" stroke-width="1.2"/>
<polygon points="176,66 167,62 167,70" fill="#8a97a6"/>
<circle cx="46" cy="66" r="4" fill="#2563eb"/>
<circle cx="126" cy="66" r="4" fill="#2563eb"/>
<text class="ms" x="46" y="86" text-anchor="middle" font-size="9">aₙ</text>
<text class="ms" x="126" y="86" text-anchor="middle" font-size="9">aₙ₊₁</text>
<text class="ms" x="120" y="42" text-anchor="middle" font-size="9">d = aₙ₊₁ − aₙ</text>
<text class="ms" x="120" y="112" text-anchor="middle" font-size="8.4" fill="#b8402f">反了就是 −d</text>
</svg>
</div>
<div class="qac">
<p class="q">「d = 0 的数列还算等差数列吗？」</p>
<p class="a">算。定义只要求差是<b>同一个常数</b>，0 是常数。此时是常数列，每一项都等于 a₁，Sₙ = na₁；只是「公差为 0」，不是「没有公差」。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="公差为零时常数列的点在同一水平线上">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="26" y1="86" x2="176" y2="86" stroke="#8a97a6" stroke-width="1.2"/>
<circle cx="50" cy="62" r="4" fill="#2563eb"/>
<circle cx="90" cy="62" r="4" fill="#2563eb"/>
<circle cx="130" cy="62" r="4" fill="#2563eb"/>
<circle cx="170" cy="62" r="4" fill="#2563eb"/>
<line x1="50" y1="62" x2="170" y2="62" stroke="#2563eb" stroke-width="1" stroke-dasharray="4 3"/>
<text class="ms" x="120" y="44" text-anchor="middle" font-size="9">d = 0，点走平</text>
<text class="ms" x="120" y="110" text-anchor="middle" font-size="8.4" fill="#5a6472">常数列，仍算等差</text>
</svg>
</div>
<div class="qac">
<p class="q">「aₙ 是 n 的几次函数？二次吗？」</p>
<p class="a">是<b>一次函数</b>：<span class="gx-fml">aₙ = dn + (a₁ − d)</span>，斜率是 d。d ≠ 0 时图象是一条斜直线；d = 0 时是水平直线（斜率 0），仍属一次函数。所以点 (n, aₙ) 一定共线。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="点列落在一条斜直线上">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="26" y1="102" x2="212" y2="102" stroke="#8a97a6" stroke-width="1.2"/>
<line x1="26" y1="102" x2="26" y2="28" stroke="#8a97a6" stroke-width="1.2"/>
<line x1="36" y1="94" x2="200" y2="36" stroke="#2563eb" stroke-width="1" stroke-dasharray="4 3"/>
<circle cx="56" cy="88" r="3.6" fill="#2563eb"/>
<circle cx="92" cy="74" r="3.6" fill="#2563eb"/>
<circle cx="128" cy="60" r="3.6" fill="#2563eb"/>
<circle cx="164" cy="46" r="3.6" fill="#2563eb"/>
<text class="ms" x="212" y="114" text-anchor="end" font-size="8.6">n</text>
<text class="ms" x="34" y="26" font-size="8.6">aₙ</text>
<text class="ms" x="120" y="122" text-anchor="middle" font-size="8.4" fill="#5a6472">点列共线 ⇔ 等差</text>
</svg>
</div>
<div class="qac">
<p class="q">「Sₙ 的常数项为什么一定是 0？」</p>
<p class="a">因为 <span class="gx-fml">Sₙ = (d/2)n² + (a₁ − d/2)n</span> 展开后没有不含 n 的项。等价说法：n = 0 时一项都没加，<b>S₀ = 0</b>，图象过原点。所以写成 Sₙ = (d/2)n² + (a₁ − d/2)n + c（c ≠ 0）必错。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="过原点的抛物线">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="30" y1="104" x2="214" y2="104" stroke="#8a97a6" stroke-width="1.2"/>
<line x1="30" y1="104" x2="30" y2="26" stroke="#8a97a6" stroke-width="1.2"/>
<path d="M30 104 Q60 30 120 44 Q170 58 196 30" fill="none" stroke="#2563eb" stroke-width="1.6"/>
<circle cx="30" cy="104" r="4" fill="#b8402f"/>
<text class="ms" x="40" y="118" font-size="8.4" fill="#b8402f">S₀ = 0</text>
<text class="ms" x="120" y="22" text-anchor="middle" font-size="8.6">Sₙ 是 n 的二次函数</text>
</svg>
</div>
<div class="qac">
<p class="q">「等差中项怎么用？只能用来验算吗？」</p>
<p class="a">不只是验算。连续三项满足 <span class="gx-fml">2a₂ = a₁ + a₃</span>，三项里<b>知二求一</b>；也能反过来判定「三项成等差」。注意中间项的系数是 2，漏掉 2 就是最常见的错。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="三项中中间项在正中间">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="34" y1="74" x2="206" y2="74" stroke="#8a97a6" stroke-width="1.2"/>
<circle cx="60" cy="74" r="4" fill="#2563eb"/>
<circle cx="120" cy="74" r="5" fill="#b8402f"/>
<circle cx="180" cy="74" r="4" fill="#2563eb"/>
<line x1="60" y1="60" x2="120" y2="60" stroke="#b8791f" stroke-width="1"/>
<line x1="120" y1="60" x2="180" y2="60" stroke="#b8791f" stroke-width="1"/>
<text class="ms" x="60" y="92" text-anchor="middle" font-size="9">a₁</text>
<text class="ms" x="120" y="92" text-anchor="middle" font-size="9">a₂</text>
<text class="ms" x="180" y="92" text-anchor="middle" font-size="9">a₃</text>
<text class="ms" x="120" y="48" text-anchor="middle" font-size="8.6" fill="#b8791f">等距</text>
<text class="ms" x="120" y="116" text-anchor="middle" font-size="8.4" fill="#5a6472">2a₂ = a₁ + a₃</text>
</svg>
</div>
<div class="qac">
<p class="q">「只给两个项，能把整条数列定下来吗？」</p>
<p class="a">能，只要这两项<b>下标不同</b>。由 <span class="gx-fml">d = (aₘ − aₙ)/(m − n)</span> 先算 d，再回代求 a₁，两个未知量两个方程，解唯一。反过来，只给一个项就定不下来。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="两个已知项确定公差">

<text class="ms" x="66" y="102" text-anchor="middle" font-size="9">a₃ = 7</text>
<text class="ms" x="166" y="102" text-anchor="middle" font-size="9">a₇ = 15</text>
<path d="M66 70 Q116 50 166 70" fill="none" stroke="#b8791f" stroke-width="1.2"/>
<text class="ms" x="116" y="44" text-anchor="middle" font-size="8.8">4 个 d</text>
<text class="ms" x="120" y="120" text-anchor="middle" font-size="8.4" fill="#5a6472">d = (15 − 7) ÷ (7 − 3)</text>

</div>
</div>
<p class="gx-note">六问其实是同一件事：先定方向（d 是后减前），再定次数（aₙ 一次、Sₙ 二次且过原点），最后才动笔算。方向对了，公式只是把「等差」翻译成算式。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 公差 d = aₙ − aₙ₊₁，所以 d = 11 − 14 = −3。</p>
<p class="er-v">✓ 公差 d = aₙ₊₁ − aₙ，所以 d = 14 − 11 = 3。</p>
<p class="er-w">错在哪：定义写的是「每一项与它的<b>前一项</b>的差」，被减数是后项。方向反了，d 整体变号，递增数列会被判成递减。</p>
</div>
<div class="er">
<p class="er-x">✗ 从 a₃ 到 a₇ 一共 7 − 3 + 1 = 5 项，所以跨了 5 个 d。</p>
<p class="er-v">✓ 从 a₃ 到 a₇ 跨 7 − 3 = 4 步，所以 a₇ − a₃ = 4d。</p>
<p class="er-w">错在哪：把「项数」当成「步数」。区间里数个数要 +1，但跨的步数就是下标之差，两者差 1。</p>
</div>
<div class="er">
<p class="er-x">✗ Sₙ = n(a₁ + aₙ)，直接代 a₁ = 3、a₁₀ = 21 得 S₁₀ = 240。</p>
<p class="er-v">✓ Sₙ = n(a₁ + aₙ)/2，S₁₀ = 10 × 24 / 2 = 120。</p>
<p class="er-w">错在哪：漏了除以 2。梯形面积是两个梯形拼成一个平行四边形的一半，那个 1/2 不能丢；可以用 n = 1 检验：S₁ 必须等于 a₁。</p>
</div>
<div class="er">
<p class="er-x">✗ aₙ = 2 + 3(n − 1) 展开成 n 的二次函数，所以 aₙ 的图象是抛物线。</p>
<p class="er-v">✓ aₙ = 3n − 1 是 n 的一次函数，点 (n, aₙ) 共线。</p>
<p class="er-w">错在哪：把 aₙ 和 Sₙ 的次数搞混了。<b>aₙ 一次、Sₙ 二次</b>，是这一节最容易对调的一对结论。</p>
</div>
<div class="er">
<p class="er-x">✗ 这个数列每项都一样，所以它不是等差数列，没有公差。</p>
<p class="er-v">✓ 它是公差 d = 0 的等差数列（常数列），Sₙ = na₁。</p>
<p class="er-w">错在哪：0 是常数，定义只要求「同一个常数」。d = 0 时是常数列，公式 aₙ = a₁ + (n − 1)d 照样成立。</p>
</div>
<div class="er">
<p class="er-x">✗ 三项成等差，所以 a₁ + a₃ = a₂。</p>
<p class="er-v">✓ 三项成等差 ⇔ 2a₂ = a₁ + a₃ ⇔ a₂ = (a₁ + a₃)/2。</p>
<p class="er-w">错在哪：中项要乘 2。用 a₁ = 2、a₂ = 5、a₃ = 8 验：2 + 8 = 10 ≠ 5，而 2 × 5 = 10 才成立。</p>
</div>
<div class="er">
<p class="er-x">✗ aₙ = a₁ + nd，所以 a₅ = 2 + 5 × 3 = 17。</p>
<p class="er-v">✓ aₙ = a₁ + (n − 1)d，所以 a₅ = 2 + 4 × 3 = 14。</p>
<p class="er-w">错在哪：从 a₁ 走到 aₙ 只跨 n − 1 步。用 n = 1 自检：a₁ = a₁ + 0·d 才对，写成 a₁ + d 就多走了一步。</p>
</div>

<script>

document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var GX = window.GX, el = GX.el, tx = GX.tx, $ = GX.$;
  var stage = $("gxStage");
  if (!stage || !window.AutoPilot) return;

  /* 两套坐标：宽屏 880×470，窄屏独立 360×700 */
  var W = {
    vb: "0 0 880 470",
    L: { x: 16, y: 16, w: 424, h: 438 }, lin: { x0: 64, y0: 396, x1: 408, y1: 64 },
    R: { x: 456, y: 16, w: 408, h: 438 }, rin: { x0: 504, y0: 396, x1: 840, y1: 72 }
  };
  var N = {
    vb: "0 0 360 700",
    L: { x: 8, y: 8, w: 344, h: 308 }, lin: { x0: 52, y0: 276, x1: 324, y1: 52 },
    R: { x: 8, y: 324, w: 344, h: 368 }, rin: { x0: 52, y0: 660, x1: 324, y1: 360 }
  };
  var L = W, A = 1, G = null;

  var A1 = 2, D = 3, NMAX = 12;
  var AMAX = A1 + (NMAX - 1) * D;                       /* 35 */
  var SMAX = NMAX * (2 * A1 + (NMAX - 1) * D) / 2;      /* 222 */

  /* 纯函数：序号 n → 通项、前 n 项和、中项检验。render() 与 __model.cases 都用它 */
  function calc(v) {
    var n = Math.round(v);
    if (!isFinite(n) || n < 1) n = 1;
    if (n > NMAX) n = NMAX;
    var an = A1 + D * (n - 1);
    var sn = n * (A1 + an) / 2;
    return { n: n, an: an, sn: sn, mid: 2 * (A1 + D) - A1 - (A1 + 2 * D) };
  }

  function geom() {
    var li = L.lin, ri = L.rin;
    return {
      lx: function (n) { return li.x0 + (n - 1) * (li.x1 - li.x0) / (NMAX - 1); },
      ly: function (a) { return li.y0 - (a - A1) * (li.y0 - li.y1) / (AMAX - A1); },
      rx: function (n) { return ri.x0 + (n - 1) * (ri.x1 - ri.x0) / (NMAX - 1); },
      ry: function (s) { return ri.y0 - s * (ri.y0 - ri.y1) / SMAX; }
    };
  }

  function axesBox(g, x0, y0, x1, y1) {
    el("line", { x1: x0, y1: y0, x2: x1, y2: y0, stroke: "#8a97a6", "stroke-width": 1.2 }, g);
    el("polygon", { points: x1 + "," + y0 + " " + (x1 - 9) + "," + (y0 - 4) + " " + (x1 - 9) + "," + (y0 + 4), fill: "#8a97a6" }, g);
    el("line", { x1: x0, y1: y0, x2: x0, y2: y1, stroke: "#8a97a6", "stroke-width": 1.2 }, g);
    el("polygon", { points: x0 + "," + y1 + " " + (x0 - 4) + "," + (y1 + 9) + " " + (x0 + 4) + "," + (y1 + 9), fill: "#8a97a6" }, g);
  }

  function draw(s) {
    var gA = $("gxA"), gB = $("gxB");
    gA.textContent = ""; gB.textContent = "";
    el("rect", { x: L.L.x, y: L.L.y, width: L.L.w, height: L.L.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    tx(gA, L.L.x + 16, L.L.y + 28, "aₙ = 2 + 3(n − 1)：点列共线，斜率 = d", "#5a6472", "start", 10.5, 700);
    var li = L.lin;
    axesBox(gA, li.x0, li.y0, li.x1 + 10, li.y1 - 8);
    tx(gA, li.x1 + 10, li.y0 + 20, "n", "#5a6472", "middle", 10, 700);
    tx(gA, li.x0, li.y0 + 34, "相邻两项固定加 3 ⇒ 斜率就是 d", "#8a97a6", "start", 9, 400);
    var li2 = L.lin, i, px, py;
    for (i = 1; i <= NMAX; i++) {
      px = G.lx(i);
      el("line", { x1: px, y1: li2.y0 - 3, x2: px, y2: li2.y0 + 3, stroke: "#8a97a6", "stroke-width": 0.9 }, gA);
      if (i === 1 || i === 5 || i === 10) tx(gA, px, li2.y0 + 17, String(i), "#5a6472", "middle", 9, 400);
    }
    tx(gA, li2.x0 - 8, li2.y0 + 4, "2", "#5a6472", "end", 9, 400);
    tx(gA, li2.x0 - 8, G.ly(AMAX) + 4, String(AMAX), "#5a6472", "end", 9, 400);
    el("line", { x1: G.lx(1), y1: G.ly(2), x2: G.lx(NMAX), y2: G.ly(AMAX), stroke: "#2563eb", "stroke-width": 1, "stroke-dasharray": "5 4", opacity: 0.5 }, gA);
    for (i = 1; i <= NMAX; i++) {
      el("circle", { cx: G.lx(i), cy: G.ly(A1 + D * (i - 1)), r: 3.4, fill: "#2563eb" }, gA);
    }
    px = G.lx(s.n); py = G.ly(s.an);
    el("line", { x1: px, y1: py, x2: px, y2: li2.y0, stroke: "#b8402f", "stroke-width": 1, "stroke-dasharray": "4 4" }, gA);
    el("circle", { cx: px, cy: py, r: 6, fill: "#b8402f" }, gA);
    if (px > li2.x1 - 90) tx(gA, px - 11, py - 10, "aₙ = " + s.an, "#b8402f", "end", 9.6, 700);
    else tx(gA, px + 11, py - 10, "aₙ = " + s.an, "#b8402f", "start", 9.6, 700);

    el("rect", { x: L.R.x, y: L.R.y, width: L.R.w, height: L.R.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    tx(gB, L.R.x + 16, L.R.y + 28, "Sₙ 与 n：过原点的抛物线", "#5a6472", "start", 10.5, 700);
    var ri = L.rin;
    axesBox(gB, ri.x0, ri.y0, ri.x1 + 10, ri.y1 - 8);
    tx(gB, ri.x1 + 10, ri.y0 + 20, "n", "#5a6472", "middle", 10, 700);
    if (L === W) tx(gB, ri.x0, ri.y0 + 34, "n 每加 1，Sₙ 的增加量越来越大", "#8a97a6", "start", 9, 400);
    for (i = 1; i <= NMAX; i++) {
      px = G.rx(i);
      el("line", { x1: px, y1: ri.y0 - 3, x2: px, y2: ri.y0 + 3, stroke: "#8a97a6", "stroke-width": 0.9 }, gB);
      if (i === 1 || i === 5 || i === 10) tx(gB, px, ri.y0 + 17, String(i), "#5a6472", "middle", 9, 400);
    }
    var pts = [];
    for (i = 1; i <= NMAX; i++) {
      pts.push(G.rx(i) + "," + G.ry(A1 * i + i * (i - 1) * D / 2));
    }
    el("polyline", { points: pts.join(" "), fill: "none", stroke: "#2563eb", "stroke-width": 1.4, opacity: 0.8 }, gB);
    for (i = 1; i <= NMAX; i++) {
      el("circle", { cx: G.rx(i), cy: G.ry(A1 * i + i * (i - 1) * D / 2), r: 3.4, fill: "#2563eb" }, gB);
    }
    el("circle", { cx: G.rx(0), cy: G.ry(0), r: 4.2, fill: "#ffffff", stroke: "#2f8a5b", "stroke-width": 1.6 }, gB);
    tx(gB, G.rx(0), ri.y0 + 17, "S₀ = 0", "#2f8a5b", "middle", 8.6, 700);
    px = G.rx(s.n); py = G.ry(s.sn);
    el("line", { x1: px, y1: py, x2: px, y2: ri.y0, stroke: "#b8402f", "stroke-width": 1, "stroke-dasharray": "4 4" }, gB);
    el("circle", { cx: px, cy: py, r: 6, fill: "#b8402f" }, gB);
    if (px > ri.x1 - 80) tx(gB, px - 11, py - 9, "Sₙ = " + s.sn, "#b8402f", "end", 9.6, 700);
    else tx(gB, px + 11, py - 9, "Sₙ = " + s.sn, "#b8402f", "start", 9.6, 700);
  }

  function render() {
    if (!G) { L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N; G = geom(); stage.setAttribute("viewBox", L.vb); }
    var s = calc(A), st, col, bg, sn;
    $("gxVa").textContent = String(s.n);
    $("gxVb").textContent = String(s.an);
    $("gxVc").textContent = String(s.sn);
    if (s.n === 1) { st = "首项"; col = "#2563eb"; bg = "#e8f0fd"; sn = "S₁ = a₁ = 2"; }
    else { st = "累加中"; col = "#2f8a5b"; bg = "#e6f6ee"; sn = "Sₙ = n(2 + aₙ)/2"; }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    draw(s);
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    G = geom();
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 1 }, { t: 1.2, v: 1 }, { t: 4, v: 5 }, { t: 6.5, v: 5 }, { t: 9, v: 10 }, { t: 11.5, v: 7 }, { t: 13.5, v: 1 }],
    keys: [1, 5, 10],
    value: A, min: 1, max: NMAX, step: 1,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc, cases: [
    { v: 1, eq: { an: 2, sn: 2 } },
    { v: 5, eq: { an: 14, sn: 40 } },
    { v: 10, eq: { an: 29, sn: 155 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
