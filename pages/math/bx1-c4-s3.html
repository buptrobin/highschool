<p class="gx-claim">一句话说清本节最该记住的判断：<b>对数就是指数式里的那个指数</b>，所以<b>真数必须大于 0</b>、<b>法则只对乘除乘方生效</b>。</p>
<div class="gx-meta">
<span><i></i>人教A版必修第一册 第4章第3节</span>
<span><i></i>高一 · 必修第一册</span>
<span><i></i>阅读 12 分钟</span>
<span><i></i>含 1 个互动模型</span>
</div>
<p class="gx-lede">4.3 是本章的一道门坎：指数把「翻倍」写成「2 的几次方」，对数把「几次方」原样还原成一个次数。后面所有比较大小、解指数方程、求定义域的题，都要先过这道互化的门。最容易错的一件事，是把 log 当成人畜无害的括号：它只回答「a 的几次方等于 N」，真数小于等于 0 时它压根没有答案，中间是加号时它也一步都拆不开。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 对数的概念<span class="q-src">人教A版必修第一册 · 第4章第3节</span></p>
<p class="q-b">一般地，如果 <span class="gx-fml">a^b = N</span>（a&gt;0，且 a≠1），那么数 b 叫做以 a 为底 N 的对数，记作 <span class="gx-fml">b = log_a N</span>，其中 a 叫做对数的底数，N 叫做真数。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个条件</b>组成，① 底数 a&gt;0，② 底数 a≠1，③ 真数 N&gt;0。少任何一个，log_a N 就不再是一个确定的数：a 是负数时 a^b 在实数内不总有意义；a=1 时 1^b 恒等于 1，b 取几都对得上同一个 N，对数不唯一；N≤0 时根本没有 b 能满足 a^b=N。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 对数恒等式与特殊值<span class="q-src">人教A版必修第一册 · 第4章第3节</span></p>
<p class="q-b">由对数的定义可以得到：<span class="gx-fml">a^(log_a N) = N</span>；<span class="gx-fml">log_a 1 = 0</span>；<span class="gx-fml">log_a a = 1</span>。</p>
<p class="q-n">→ 翻成人话：这三条不是三条独立记忆，全部是把 a^b=N 里的 b 换成对应的值读出来的：b 取 log_a N 就是恒等式，b 取 0 得 a⁰=1，b 取 1 得 a¹=a。答题时写「由对数定义得」，比写「由公式得」更稳。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 对数的运算性质<span class="q-src">人教A版必修第一册 · 第4章第3节</span></p>
<p class="q-b">如果 a&gt;0，且 a≠1，M&gt;0，N&gt;0，那么 <span class="gx-fml">log_a(MN) = log_a M + log_a N</span>；<span class="gx-fml">log_a(M/N) = log_a M − log_a N</span>；<span class="gx-fml">log_a M^n = n·log_a M</span>（n∈R）。</p>
<p class="q-n">→ 翻成人话：三条法则做的是同一件事——把<b>真数层面</b>的乘、除、乘方，降级成<b>对数层面</b>的加、减、乘。前提是 M&gt;0 且 N&gt;0 同时成立（少了这个前提法则直接失效），而且<b>三条里没有任何一条管加法</b>，log_a(M+N) 不能拆。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>定理的条件</th><th>缺了这一条会怎样</th></tr></thead>
<tbody>
<tr><td>底数 a&gt;0</td><td>a 为负数时，a^(1/2) 这类值在实数范围内不存在，b 无从谈起</td></tr>
<tr><td>底数 a≠1</td><td>1^b 恒等于 1：无论 b 取几，指数式都成立，对数就不唯一，log_1 N 无法定义</td></tr>
<tr class="key"><td>真数 N&gt;0</td><td>N≤0 时不存在实数 b 使 a^b=N，log_a N 直接没有意义；求定义域时这是第一道关</td></tr>
<tr><td>法则的前提 M&gt;0、N&gt;0</td><td>法则失效：M、N 有一个非正，右边两个对数里至少一个不存在，等式两边不能同时成立</td></tr>
<tr><td>法则只覆盖乘、除、乘方</td><td>log_a(M+N) ≠ log_a M + log_a N，加减运算没有对应的拆分法则</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只高亮 1 行。背法：把 log_a N 念成「a 的几次方等于 N」这一整句话，念不通就是无意义——「2 的几次方等于 −8」念不通，所以 log₂(−8) 不存在；「1 的几次方等于 5」也念不通，所以底数不能是 1。所有条件都是从这一句念出来的，不是额外附加的规定。</p>
</section>

<section class="gx-sec" id="b">
<h2><span class="sn">02</span>拆开看</h2>
<p class="gx-h2s">四张图：各讲一件事，按「是什么 → 怎么变 → 怎么用」排。</p>

<figure class="gx-fig">
<div class="fig-cap">
<span class="fig-no">图 1</span><span class="fig-t">指数式与对数式互化</span>
<span class="bdg bdg-must">必考</span>
</div>
<p class="fig-s">互化的动作只有一个：底数 a 原地不动，指数 b 与真数 N 交换位置。先看左边的指数式，读成一句话，再把「几次方」那个数单独拎出来，右边就是对数式。反过来也一样，所以两个式子说的是同一件事，不是两个公式。</p>
<div class="gx-svgbox">
<svg viewBox="0 0 820 260" role="img" aria-label="指数式 a 的 b 次方等于 N 与对数式 log 以 a 为底 N 等于 b 之间的互化关系图">
<rect x="16" y="16" width="788" height="228" rx="10" fill="#f8fbfd" stroke="#dbe7ef"/>
<text x="36" y="42" font-size="11.5" font-weight="700" fill="#151a21">指数式 ⇄ 对数式：底数不动，指数与对数值互换位置</text>

<rect x="40" y="74" width="300" height="86" rx="8" fill="#ffffff" stroke="#b8e6d0"/>
<text x="56" y="96" font-size="9.6" font-weight="700" fill="#2f8a5b">指数式 · 已知底和指数求幂</text>
<text x="56" y="124" font-size="16" font-weight="700" fill="#151a21">a^b = N</text>
<text x="56" y="148" font-size="9.4" fill="#5a6472">例：2³ = 8，读作「2 的 3 次方等于 8」</text>

<path d="M 352 117 L 428 117" stroke="#9aa7b4" stroke-width="1.6" fill="none"/>
<path d="M 428 117 l -11 -5 l 0 10 z" fill="#9aa7b4"/>
<text x="390" y="108" font-size="9" fill="#5a6472" text-anchor="middle">互化</text>

<rect x="440" y="74" width="300" height="86" rx="8" fill="#ffffff" stroke="#cfe0f6"/>
<text x="456" y="96" font-size="9.6" font-weight="700" fill="#2563eb">对数式 · 已知底和幂求指数</text>
<text x="456" y="124" font-size="16" font-weight="700" fill="#151a21">log_a N = b</text>
<text x="456" y="148" font-size="9.4" fill="#5a6472">例：log₂ 8 = 3，读作「2 的 3 次方是 8」</text>

<text x="40" y="188" font-size="9.4" fill="#3a3a35">① 底数 a 在两个式子里是同一个数，位置不变：a^b = N ⇔ log_a N = b（a&gt;0，a≠1）。</text>
<text x="40" y="208" font-size="9.4" fill="#3a3a35">② 指数 b 搬过去成了对数值 b，幂 N 搬过去成了真数 N；只换位置，不换数值。</text>
<text x="40" y="228" font-size="9.4" font-weight="700" fill="#b8402f">③ 因为 a^b 对一切实数 b 恒为正，所以真数 N 必须大于 0：log₂0 与 log₂(−8) 都不存在。</text>
</svg>
<span class="gx-zoomchip">点击放大</span>
</div>
<p class="gx-take">看到 log_a N 就先在心里念成「a 的几次方等于 N」，念不通就是无意义，念通了答案往往不用算。</p>
<p class="gx-note">互化是本节唯一需要动手的动作，其余三条法则、换底公式、恒等式全部由它推出来。考试里 log₂ 8 这类值不允许列竖式，只能靠互化直接读。</p>
</figure>

<figure class="gx-fig">
<div class="fig-cap">
<span class="fig-no">图 2</span><span class="fig-t">三个特殊值：1、0、自身</span>
<span class="bdg bdg-key">辨析</span>
</div>
<p class="fig-s">三个特殊值分别盯住真数取 1、真数等于底数、以及对数恒等式。它们的共同来源是同一个式子的三个特例，所以要错只会一起错：把 log_a 1 写成 1、把 log_a a 写成 0，都是把「指数取几」记混了。</p>
<div class="gx-svgbox">
<svg viewBox="0 0 820 240" role="img" aria-label="对数的三个特殊值：log 以 a 为底 1 等于 0、log 以 a 为底 a 等于 1、a 的 log 以 a 为底 N 次方等于 N">
<rect x="16" y="16" width="788" height="208" rx="10" fill="#f8fbfd" stroke="#dbe7ef"/>
<text x="36" y="42" font-size="11.5" font-weight="700" fill="#151a21">三个特殊值：真数为 1 → 0；真数等于底数 → 1；取对数再还原 → 原数</text>

<rect x="40" y="62" width="236" height="104" rx="8" fill="#ffffff" stroke="#e6e9ee"/>
<text x="56" y="90" font-size="14" font-weight="700" fill="#151a21">log_a 1 = 0</text>
<text x="56" y="114" font-size="10.5" fill="#2563eb">因为 a⁰ = 1</text>
<text x="56" y="138" font-size="9.4" fill="#3a3a35">真数只要是 1，对数必为 0</text>
<text x="56" y="154" font-size="9.4" fill="#3a3a35">与底数取几无关（a&gt;0，a≠1）</text>

<rect x="292" y="62" width="236" height="104" rx="8" fill="#ffffff" stroke="#e6e9ee"/>
<text x="308" y="90" font-size="14" font-weight="700" fill="#151a21">log_a a = 1</text>
<text x="308" y="114" font-size="10.5" fill="#2563eb">因为 a¹ = a</text>
<text x="308" y="138" font-size="9.4" fill="#3a3a35">真数等于底数，对数为 1</text>
<text x="308" y="154" font-size="9.4" fill="#3a3a35">不是 0：a 的一次方才等于 a</text>

<rect x="544" y="62" width="236" height="104" rx="8" fill="#ffffff" stroke="#e6e9ee"/>
<text x="560" y="90" font-size="13" font-weight="700" fill="#151a21">a^(log_a N) = N</text>
<text x="560" y="114" font-size="10.5" fill="#2563eb">对数恒等式</text>
<text x="560" y="138" font-size="9.4" fill="#3a3a35">先取对数、再还原，值不变</text>
<text x="560" y="154" font-size="9.4" fill="#3a3a35">例：2^(log₂ 5) = 5</text>

<text x="40" y="196" font-size="9.6" fill="#b8402f">三个特殊值全部由 a^b = N 直接读出：把 b 分别取 0、取 1、取 log_a N，一步移项都不用做。</text>
<text x="40" y="214" font-size="9.4" fill="#5a6472">前两条只管「1」和「自身」，第三条才是把幂算回去的工具，别把恒等式当成 log_a(N·N)=N。</text>
</svg>
<span class="gx-zoomchip">点击放大</span>
</div>
<p class="gx-take">log_a 1 = 0 和 log_a a = 1 是零算力题，写错只可能是把 0 和 1 填反了，落笔前用「a 的几次方」念一遍即可。</p>
</figure>

<figure class="gx-fig">
<div class="fig-cap">
<span class="fig-no">图 3</span><span class="fig-t">三条运算法则：乘变加、除变减、乘方变乘</span>
<span class="bdg bdg-must">必考</span>
</div>
<p class="fig-s">三条法则的动作方向完全一致：真数上做乘、除、乘方，搬到对数上就变成加、减、乘。看图时先确认最下面那行红框——它标出的是三道法则唯一覆盖不到的地方：真数之间是加号或减号时，一步也不能拆。</p>
<div class="gx-svgbox">
<svg viewBox="0 0 820 250" role="img" aria-label="对数三条运算法则：积的对数等于对数的和、商的对数等于对数的差、幂的对数等于对数的倍数，以及和的对数不能拆">
<rect x="16" y="16" width="788" height="218" rx="10" fill="#f8fbfd" stroke="#dbe7ef"/>
<text x="36" y="42" font-size="11.5" font-weight="700" fill="#151a21">三条法则：真数降一级，对数升一级</text>

<rect x="32" y="58" width="756" height="34" rx="6" fill="#ffffff" stroke="#e6e9ee"/>
<rect x="32" y="58" width="96" height="34" rx="6" fill="#eef6ff" stroke="#cfe0f6"/>
<text x="80" y="80" font-size="9.6" font-weight="700" fill="#2563eb" text-anchor="middle">乘 → 加</text>
<text x="146" y="80" font-size="10.6" font-weight="700" fill="#151a21">log_a(MN) = log_a M + log_a N</text>
<text x="782" y="79" font-size="8.8" fill="#5a6472" text-anchor="end">前提 M&gt;0，N&gt;0</text>

<rect x="32" y="96" width="756" height="34" rx="6" fill="#ffffff" stroke="#e6e9ee"/>
<rect x="32" y="96" width="96" height="34" rx="6" fill="#eef6ff" stroke="#cfe0f6"/>
<text x="80" y="118" font-size="9.6" font-weight="700" fill="#2563eb" text-anchor="middle">除 → 减</text>
<text x="146" y="118" font-size="10.6" font-weight="700" fill="#151a21">log_a(M/N) = log_a M − log_a N</text>
<text x="782" y="117" font-size="8.8" fill="#5a6472" text-anchor="end">顺序不能反</text>

<rect x="32" y="134" width="756" height="34" rx="6" fill="#ffffff" stroke="#e6e9ee"/>
<rect x="32" y="134" width="96" height="34" rx="6" fill="#eef6ff" stroke="#cfe0f6"/>
<text x="80" y="156" font-size="9.6" font-weight="700" fill="#2563eb" text-anchor="middle">乘方 → 倍</text>
<text x="146" y="156" font-size="10.6" font-weight="700" fill="#151a21">log_a M^n = n · log_a M</text>
<text x="782" y="155" font-size="8.8" fill="#5a6472" text-anchor="end">n∈R，真数仍要 M&gt;0</text>

<rect x="32" y="178" width="756" height="40" rx="6" fill="#fbeae7" stroke="#f0c6bd"/>
<text x="48" y="196" font-size="10.6" font-weight="700" fill="#b8402f">✗ log_a(M + N) ≠ log_a M + log_a N</text>
<text x="48" y="211" font-size="8.8" fill="#8a3a2c">法则里没有「和的对数」这一条：真数之间是加号或减号，就一步也不能拆。</text>
</svg>
<span class="gx-zoomchip">点击放大</span>
</div>
<p class="gx-take">法则只把真数的乘、除、乘方降级，遇到真数的加减只能整体留着，或者先用换底公式算成小数再加减。</p>
<p class="gx-note">自检方法：拆完之后右边的对数必须都有意义。若 M、N 中有一个非正，右边立刻出现不存在的对数，说明这一步拆错了——法则的前提本来就是 M&gt;0、N&gt;0。</p>
</figure>

<figure class="gx-fig">
<div class="fig-cap">
<span class="fig-no">图 4</span><span class="fig-t">换底公式与常用对数 lg、自然对数 ln</span>
<span class="bdg bdg-ext">延伸</span>
</div>
<p class="fig-s">换底公式解决的是「底数不是 10、不是 e，计算器上按不出来」的问题：把任意底 a 换成另一个能算的底 c。下面两栏是两个最常用的 c：以 10 为底的 lg 和以 e 为底的 ln。注意倒数关系那条，它是换底公式取 c=b 时的特例，方向极易写反。</p>
<div class="gx-svgbox">
<svg viewBox="0 0 820 230" role="img" aria-label="换底公式 log 以 a 为底 b 等于 log 以 c 为底 b 除以 log 以 c 为底 a，以及常用对数 lg 和自然对数 ln">
<rect x="16" y="16" width="788" height="198" rx="10" fill="#f8fbfd" stroke="#dbe7ef"/>
<text x="36" y="42" font-size="11.5" font-weight="700" fill="#151a21">换底公式：把算不出来的底，换成一个算得出来的底</text>

<text x="410" y="78" font-size="15" font-weight="700" fill="#151a21" text-anchor="middle">log_a b = log_c b / log_c a</text>
<text x="410" y="102" font-size="10" fill="#b8402f" text-anchor="middle">取 c = b 即得 log_a b = 1 / log_b a —— 这是倒数关系，写反是最常见的失分</text>

<rect x="40" y="118" width="350" height="78" rx="8" fill="#ffffff" stroke="#e6e9ee"/>
<text x="56" y="142" font-size="11" font-weight="700" fill="#2563eb">常用对数 lg N = log₁₀ N</text>
<text x="56" y="164" font-size="9" fill="#3a3a35">底数是 10，写法上把 10 省掉；计算器的 log 键就是它</text>
<text x="56" y="182" font-size="9" fill="#3a3a35">例：lg 100 = 2，lg 0.1 = −1</text>

<rect x="430" y="118" width="350" height="78" rx="8" fill="#ffffff" stroke="#e6e9ee"/>
<text x="446" y="142" font-size="11" font-weight="700" fill="#2f8a5b">自然对数 ln N = log_e N</text>

<section class="gx-sec" id="c">
<h2><span class="sn">03</span>自己拖一下<span class="bdg bdg-must">核心</span></h2>
<p class="gx-h2s">拖「指数 k」，看左边 2^k 的方阵怎么长、右边四个对数怎么跟着变。盯住 k 从 3 变到 4 的那一下。</p>

<figure class="gx-fig">
<div class="fig-cap">

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 对数式的计算（含负指数与拆项陷阱）<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">计算 <span class="gx-fml">log₂ 8 + log₂(1/4)</span>。若把题中的加号换成乘号，即求 <span class="gx-fml">log₂(8 × 1/4)</span>，结果是否相同？若换成真数相加，即 <span class="gx-fml">log₂(8 + 1/4)</span>，能否拆成上面两个对数之和？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题：先查真数</p>
<p class="s-b">两项的真数分别是 8 和 1/4，都大于 0，两项都存在，可以直接算。写出前提：8&gt;0，1/4&gt;0（真数必须大于 0）。</p>
<p class="s-k">用到：对数的定义域——真数必须大于 0。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 第一项互化</p>
<p class="s-b">把 log₂ 8 念成「2 的几次方等于 8」。因为 2³ = 8，所以 log₂ 8 = 3。</p>
<p class="s-k">用到：指数式与对数式互化 a^b = N ⇔ log_a N = b。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 第二项先化成分数幂</p>
<p class="s-b">1/4 = 2^(−2)，所以 log₂(1/4) = −2。也可用商法则：log₂(1/4) = log₂ 1 − log₂ 4 = 0 − 2 = −2，两条路结果一致。</p>
<p class="s-k">用到：负指数与 log_a 1 = 0；商的对数法则。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 相加得结果</p>
<p class="s-b">log₂ 8 + log₂(1/4) = 3 + (−2) = 1。</p>
<p class="s-k">用到：同底对数相加，直接合并数值。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 回头处理两个追问</p>
<p class="s-b">换乘号：log₂(8 × 1/4) = log₂ 2 = 1，与上一步相同——这正是积的对数法则 log_a(MN) = log_a M + log_a N。换加号：log₂(8 + 1/4) = log₂(33/4)，它不等于 3 + (−2) = 1，因为 log_a(M + N) ≠ log_a M + log_a N，法则里没有「和的对数」。</p>
<p class="s-k">用到：运算法则只覆盖乘、除、乘方，加法不能拆。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">解：因为 8&gt;0，1/4&gt;0，所以两式均有意义。<br>
① log₂ 8 = 3（由 2³ = 8 得）；<br>
② 1/4 = 2^(−2)，故 log₂(1/4) = −2；<br>
③ 所以 log₂ 8 + log₂(1/4) = 3 + (−2) = 1。<br>
追问一：log₂(8 × 1/4) = log₂ 2 = 1，与①+②相同，符合 log_a(MN) = log_a M + log_a N。<br>
追问二：log₂(8 + 1/4) = log₂(33/4) ≠ 1，因为 log_a(M + N) ≠ log_a M + log_a N，真数为和时不能用运算法则拆分。</p>
</div>
</div>
</section>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「真数为什么必须大于 0？题目又不考这个。」</p>
<p class="a">因为 a^b 对任意实数 b 都恒为正，所以 a^b=N 里的 N 不可能取到 0 或负数，<b>log_a N 的存在前提就是 N&gt;0</b>。求定义域时，凡是真数位置上的式子都要满足 &gt;0，这一条年年考。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="指数函数图像始终在横轴上方，所以真数必须大于 0">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="16" y="24" font-size="8.6" fill="#5a6472">y = 2^x 的图像永远在 x 轴上方</text>
<line x1="16" y1="100" x2="224" y2="100" stroke="#9aa7b4" stroke-width="1"/>
<path d="M 20 96 Q 120 92 222 26" stroke="#2563eb" fill="none" stroke-width="1.8"/>
<text x="222" y="118" font-size="8.4" fill="#b8402f" text-anchor="end">y 恒 &gt; 0 ⇒ 真数 N &gt; 0</text>
</svg>
</div>
<div class="qac">
<p class="q">「log_a(M + N) 能不能拆成 log_a M + log_a N？」</p>
<p class="a"><b>不能。</b>运算法则只对乘、除、乘方生效，真数之间是加号或减号时没有任何法则可用。正确做法是先把 M+N 算成一个数，或者整体留到换底后再处理。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="真数为乘积时可以拆成对数相加，真数为和时不能拆">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="16" y="28" font-size="8.6" fill="#5a6472">法则只管乘、除、乘方</text>
<text x="16" y="56" font-size="9" fill="#2f8a5b">✓ log_a(M·N) = log_a M + log_a N</text>
<text x="16" y="82" font-size="9" fill="#b8402f">✗ log_a(M+N) = log_a M + log_a N</text>
<line x1="16" y1="94" x2="224" y2="94" stroke="#dde4ea" stroke-width="1"/>
<text x="16" y="112" font-size="8.4" fill="#3a3a35">和的对数只能整体算，一步也拆不开</text>
</svg>
</div>
<div class="qac">
<p class="q">「换底公式到底怎么写？我总是写反。」</p>
<p class="a"><b>log_a b = log_c b / log_c a</b>，分子是真数、分母是原底，两个 log 的底都换成新底 c。取 c=b 得 <b>log_a b = 1 / log_b a</b>，两者互为倒数，用 log₂ 8 = 3 与 log₈ 2 = 1/3 一验就知道方向。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="换底公式与倒数关系">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="16" y="28" font-size="8.6" fill="#5a6472">换成能算的底 c</text>
<text x="16" y="54" font-size="9.6" font-weight="700" fill="#151a21">log_a b = log_c b / log_c a</text>
<text x="16" y="82" font-size="9.2" font-weight="700" fill="#b8402f">特例：log_a b = 1 / log_b a</text>
<text x="16" y="108" font-size="8.4" fill="#3a3a35">分子放真数，分母放原底，别上下颠倒</text>
</svg>
</div>
<div class="qac">
<p class="q">「lg 和 ln 分别是以什么为底？它们是不是一回事？」</p>
<p class="a"><b>lg N = log₁₀ N，底数是 10；ln N = log_e N，底数是 e≈2.718 28。</b>两者底数不同，不是同一个函数，只有 N=1 时都等于 0。lg 是计算器上的 log 键，ln 是自然对数键。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="常用对数以 10 为底，自然对数以 e 为底">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="16" y="38" font-size="9.4" font-weight="700" fill="#2563eb">lg N = log₁₀ N</text>
<text x="16" y="58" font-size="8.6" fill="#3a3a35">底数 10，例：lg 100 = 2</text>
<line x1="16" y1="70" x2="224" y2="70" stroke="#dde4ea" stroke-width="1"/>
<text x="16" y="90" font-size="9.4" font-weight="700" fill="#2f8a5b">ln N = log_e N</text>
<text x="16" y="110" font-size="8.6" fill="#3a3a35">底数 e，例：ln e = 1</text>
</svg>
</div>
<div class="qac">
<p class="q">「log_a 1 等于多少？是不是 1？」</p>
<p class="a"><b>等于 0。</b>因为 a⁰=1，而 a¹=a。区分方法：真数是 1 时对数为 0，真数等于底数时对数为 1，两者正好反过来，写之前用「a 的几次方」念一遍。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="真数为 1 时对数为 0，真数等于底数时对数为 1">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="16" y="36" font-size="9" fill="#3a3a35">真数 = 1 → 对数 = 0</text>
<text x="16" y="56" font-size="9.4" font-weight="700" fill="#2563eb">log_a 1 = 0（因 a⁰=1）</text>
<line x1="16" y1="70" x2="224" y2="70" stroke="#dde4ea" stroke-width="1"/>
<text x="16" y="90" font-size="9" fill="#3a3a35">真数 = 底数 → 对数 = 1</text>
<text x="16" y="110" font-size="9.4" font-weight="700" fill="#2f8a5b">log_a a = 1（因 a¹=a）</text>
</svg>
</div>
<div class="qac">
<p class="q">「负数和 0 有对数吗？log₂0 是不是就等于 0？」</p>
<p class="a"><b>没有，负数与 0 都没有对数。</b>log₂ 0 不是 0，而是「2 的几次方等于 0」念不通，所以<b>无意义</b>。注意区分：真数是 1 时对数为 0（log₂1=0），真数本身是 0 时对数不存在（log₂0 无意义）。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="数轴上小于等于 0 的部分没有对数">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="16" y="30" font-size="8.6" fill="#5a6472">数轴：真数只能落在正半轴</text>
<rect x="16" y="66" width="92" height="26" fill="#fbeae7" stroke="#f0c6bd"/>
<text x="20" y="52" font-size="8.4" fill="#b8402f">这段无对数（N≤0）</text>
<line x1="16" y1="88" x2="224" y2="88" stroke="#9aa7b4" stroke-width="1"/>
<circle cx="178" cy="88" r="3.6" fill="#2f8a5b"/>
<text x="178" y="106" font-size="8.6" fill="#2f8a5b" text-anchor="middle">log₂ 8 = 3</text>
<text x="62" y="106" font-size="8.6" fill="#b8402f" text-anchor="middle">log₂ 0 无意义</text>
</svg>
</div>
</div>
<p class="gx-note">六问其实是同一件事：log_a N 永远是「a 的几次方等于 N」这一句话的缩写。真数不够正，这句话念不通；真数之间是加号，这句话拆不开；底数不认识，就用换底公式把它翻译成一认识的底。念得通就必对，念不通就别下笔。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ log(M + N) = log M + log N</p>
<p class="er-v">✓ log_a(MN) = log_a M + log_a N，真数为和时不能拆</p>
<p class="er-w">错在哪：法则只把真数的乘、除、乘方降级，见到加号就一步也不能拆。反例：log₂(8+8)=4，而 log₂8+log₂8=6。</p>
</div>
<div class="er">
<p class="er-x">✗ 真数可以小于等于 0，只要算得出来就行</p>
<p class="er-v">✓ 真数必须大于 0，即 log_a N 中要求 N&gt;0</p>
<p class="er-w">错在哪：a^b 恒为正，log₂(−8) 等于「2 的几次方是 −8」这一句念不通的话，答案是无意义，不是 −3。</p>
</div>
<div class="er">
<p class="er-x">✗ log_a b = log_b a</p>
<p class="er-v">✓ log_a b = log_c b / log_c a，特例 log_a b = 1 / log_b a</p>
<p class="er-w">错在哪：换底公式写反了。用 log₂8=3、log₈2=1/3 一代入立刻露馅，两者是倒数，不是相等。</p>
</div>
<div class="er">
<p class="er-x">✗ lg 是以 e 为底的对数，ln 是以 10 为底</p>
<p class="er-v">✓ lg N = log₁₀ N，ln N = log_e N</p>
<p class="er-w">错在哪：两个缩写记串了。lg 来自 common logarithm（常用对数，底 10），ln 来自 natural logarithm（自然对数，底 e）。</p>
</div>
<div class="er">
<p class="er-x">✗ log_a a = 0，log_a 1 = 1</p>
<p class="er-v">✓ log_a a = 1，log_a 1 = 0</p>
<p class="er-w">错在哪：两个特殊值填反了。判断依据是 a¹=a 与 a⁰=1，把指数抄到等号右边就对了。</p>
</div>
<div class="er">
<p class="er-x">✗ log_a(M − N) = log_a M − log_a N</p>
<p class="er-v">✓ log_a(M/N) = log_a M − log_a N，真数为差时不能用</p>
<p class="er-w">错在哪：把「真数相除」偷换成「真数相减」。减号在真数内部时没有法则，只有 8÷2 这种除法才能变成对数相减。</p>
</div>
<div class="er">
<p class="er-x">✗ 用运算法则时不看 M&gt;0、N&gt;0，直接拆开算</p>
<p class="er-v">✓ 先验证 M&gt;0 且 N&gt;0，再用法则</p>
<p class="er-w">错在哪：前提不成立时右边会出现不存在的对数。例：log₂[(−2)×(−4)] 有意义且等于 3，但拆成 log₂(−2)+log₂(−4) 就两项都不存在了。</p>
</div>
</div>
</section>

    el("rect", { x: L.left.x, y: L.left.y, width: L.left.w, height: L.left.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    tx(gA, L.left.x + 18, L.left.y + 28, "指数式 2^k = N：翻 k 次倍", "#5a6472", "start", 10.5, 700);
    tx(gA, L.left.x + 18, L.left.y + 46, "一块 = 乘一次 2；块数就是对数", "#8a94a2", "start", 8.6, 400);

    var hb = s.k > 0 ? Math.min(30, (G.baseY - G.topY) / s.k) : 0;
    el("line", { x1: G.bx - 8, y1: G.baseY, x2: G.bx + G.bw + 118, y2: G.baseY, stroke: "#9aa7b4", "stroke-width": 1 }, gA);
    for (j = 1; j <= s.k; j++) {
      y = G.baseY - j * hb;
      el("rect", { x: G.bx, y: y, width: G.bw, height: hb - 1, rx: 3, fill: j === s.k ? "#eef6ff" : "#ffffff", stroke: j === s.k ? "#2563eb" : "#cfe0f6" }, gA);
      tx(gA, G.bx + 7, y + hb / 2 + 2.8, "×2", "#2563eb", "start", 7.6, 700);
      tx(gA, G.bx + G.bw + 8, y + hb / 2 + 2.8, "2^" + j + " = " + Math.pow(2, j), "#3a3a35", "start", 8, 400);
    }
    if (s.k === 0) tx(gA, G.bx, G.baseY - 14, "k=0：还没开始翻倍，N=1", "#b8791f", "start", 8.6, 700);
    tx(gA, G.bx, G.baseY + 22, "真数 N = 2^" + s.k + " = " + s.n, "#151a21", "start", 10.4, 700);

    el("rect", { x: L.right.x, y: L.right.y, width: L.right.w, height: L.right.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    tx(gB, G.rx, L.right.y + 28, "四个对数一起看：乘变加、乘方变倍", "#5a6472", "start", 10.5, 700);
    var rows = [
      ["真数 N = 2^k（恒为正）", "N = " + s.n, "#2563eb", "#eef6ff"],
      ["log₂N = k：翻几次倍", "log₂" + s.n + " = " + s.lg, "#2f8a5b", "#e6f6ee"],
      ["log₂(2N) = k+1：再翻一倍", "log₂" + (2 * s.n) + " = " + s.lg2n, "#b8791f", "#fdf3e0"],
      ["log₂(N²) = 2k：平方即乘方", "log₂" + (s.n * s.n) + " = " + s.lg2sq, "#3f6fa8", "#eef3f9"]
    ];
    for (i = 0; i < 4; i++) {
      y = G.r0 + i * (G.rh + G.rg);
      el("rect", { x: G.rx, y: y, width: G.rw, height: G.rh, rx: 8, fill: rows[i][3], stroke: rows[i][2] + "44" }, gB);
      tx(gB, G.rx + 12, y + (G.rh >= 50 ? 18 : 16), rows[i][0], "#5a6472", "start", 8.6, 700);
      tx(gB, G.rx + 12, y + G.rh - (G.rh >= 50 ? 12 : 10), rows[i][1], rows[i][2], "start", G.rf, 700);
    }
    y = G.r0 + 4 * (G.rh + G.rg) - G.rg + 22;
    tx(gB, G.rx, y, "2^k 恒大于 0 ⇒ 真数 N 一定大于 0", "#b8402f", "start", 8.8, 700);
  }

  function render() {
    if (!G) { L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N; G = geom(); stage.setAttribute("viewBox", L.vb); }
    var s = calc(A), st, col, bg, sn;
    $("gxVa").textContent = String(s.k);
    $("gxVb").textContent = String(s.n);
    $("gxVc").textContent = String(s.lg);
    if (s.k === 0) { st = "对数为 0"; col = "#b8791f"; bg = "#fdf3e0"; sn = "N=1，一次都没翻"; }
    else { st = "翻倍 " + s.k + " 次"; col = "#2f8a5b"; bg = "#e6f6ee"; sn = "每翻一倍，对数加 1"; }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    draw();
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    G = geom();
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 0 }, { t: 1.2, v: 0 }, { t: 4, v: 3 }, { t: 6.5, v: 3 }, { t: 9, v: 6 }, { t: 11.5, v: 10 }, { t: 13.5, v: 0 }],
    keys: [0, 3, 6, 10],
    value: A, min: 0, max: 10, step: 1,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc, cases: [
    { v: 0, eq: { n: 1, lg: 0 } },
    { v: 3, eq: { n: 8, lg: 3 } },
    { v: 10, eq: { n: 1024, lg: 10 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
