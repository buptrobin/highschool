<p class="gx-lede">这一节把「二次函数图象」「一元二次方程的根」「一元二次不等式的解集」三件事拧成一根绳：图象与 x 轴交点的横坐标就是方程的根，而根正是解集的端点。上一节刚学完一元二次方程的求根公式，这一节直接拿它去写解集；下一节基本不等式又要用「恒成立」的判据，所以这里的 Δ 三种情况必须一次分清。最容易错的一件事：二次项系数是负数时不变号就往下做，最后把「取两边」和「取中间」整个写反。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 三个二次的关系<span class="q-src">人教A版必修第一册 · 第二章第3节</span></p>
<p class="q-b">二次函数 y=ax²+bx+c 的图象与 x 轴交点的横坐标，就是方程 ax²+bx+c=0 的根。</p>
<p class="q-n">→ 翻成人话：这句话只讲<b>一根绳子上的两个结</b>——把 y 令成 0，图象上的交点就变成方程里的根，横坐标一个也不多、一个也不少。所以「有几个交点」和「有几个根」是同一个问题，只看 <b>Δ 的符号</b>；而「解集写到哪儿为止」也由这两个横坐标决定。它<b>不含</b>开口方向、也不含不等号方向，这两件事要另加。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 判别式与根的个数<span class="q-src">人教A版必修第一册 · 第二章第3节</span></p>
<p class="q-b">判别式 Δ=b²−4ac：Δ&gt;0 时方程有两个不相等的实数根；Δ=0 时有两个相等的实数根；Δ&lt;0 时没有实数根。</p>
<p class="q-n">→ 翻成人话：这是<b>三个条件、三种结局</b>的排他分类，Δ 的符号只有正、零、负三种，所以图象与 x 轴的交点只有 2 个、1 个、0 个三种，不会有第四种。注意 Δ=0 时交点<b>是有的</b>，只是两个交点重合成了顶点——这一步写错，后面整道题的解集都会跟着错。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 解不等式的四步<span class="q-src">人教A版必修第一册 · 第二章第3节</span></p>
<p class="q-b">解一元二次不等式要「看开口、算判别式、求根、写解集」。</p>
<p class="q-n">→ 翻成人话：四个动作有<b>先后顺序</b>，顺序换了就会白算。① 看开口（二次项系数正负，负的<b>要先乘 −1 并变号</b>）；② 算 <span class="gx-fml">Δ=b²−4ac</span>；③ 求根（因式分解或求根公式）；④ 写解集（&gt;0 取两边、&lt;0 取中间，端点开闭看有没有等号）。四步里第 ① 步最容易漏，第 ④ 步最容易反。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>条件</th><th>做到位</th><th>缺了会怎样</th></tr></thead>
<tbody>
<tr><td>① 二次项系数为正</td><td>a&gt;0，开口向上；为负先乘 −1 并变号</td><td>开口方向判反，&gt;0 与 &lt;0 的解集互换</td></tr>
<tr><td>② 算判别式</td><td>Δ=b²−4ac，先定交点个数</td><td>不知道有没有交点，根无从谈起</td></tr>
<tr><td>③ 求根</td><td>因式分解或 x=(−b±√Δ)/(2a)</td><td>解集端点写不出，只能写个大概</td></tr>
<tr class="key"><td>④ Δ=0 的收尾</td><td>解集写成 {x|x≠x₀}，不是空集</td><td>把相切当成「无解」，整题零分</td></tr>
<tr><td>⑤ 定取法</td><td>&gt;0 取两边、&lt;0 取中间（a&gt;0）</td><td>「或」写成「且」，解集形状整个错</td></tr>
<tr><td>⑥ 端点开闭</td><td>&gt; &lt; 空心，≥ ≤ 实心</td><td>把 −1&lt;x&lt;3 抄成 −1≤x≤3</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">这张表的用法：做完一道题，从 ① 到 ⑥ 逐条对一遍，哪条没写就补哪条。三个扣分点全在表里——④ 行（Δ=0 写成空集）、① 行（二次项系数为负要先变号）、⑤ 行（&gt;0 取两边、&lt;0 取中间搞反）。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 解一元二次不等式<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">解不等式 x²−2x−3&gt;0。（做完再想一层：如果把 &gt; 改成 &lt;，解集会变成什么？改成 ≥ 呢？）</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 看开口、算判别式</p>
<p class="s-b">二次项系数 a=1&gt;0，开口向上；Δ=(−2)²−4·1·(−3)=4+12=16&gt;0，所以方程有两个不相等的实根，图象与 x 轴有两个交点。</p>
<p class="s-k">用到：图 1 的分类——Δ&gt;0 对应 2 个交点，解集必然是「两段」的形状。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 求根</p>
<p class="s-b">因式分解 x²−2x−3=(x−3)(x+1)，令 (x−3)(x+1)=0，得 x₁=−1，x₂=3。用求根公式核对：x=(2±√16)/2=1±2，同样是 −1 与 3。</p>
<p class="s-k">用到：因式分解与求根公式是同一件事的两条路，分解对了就不用再套公式。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 定取法：&gt;0 取两边还是取中间</p>
<p class="s-b">两根 −1、3 把数轴分成三段：x&lt;−1、−1&lt;x&lt;3、x&gt;3。开口向上，图象在 x 轴上方的部分在两根外侧，所以 &gt;0 取两边：x&lt;−1 或 x&gt;3。</p>
<p class="s-k">用到：&gt;0 取两边、&lt;0 取中间——判据只有两条：开口方向 + 不等号方向。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 写解集（集合与区间两种写法）</p>
<p class="s-b">解集为 {x|x&lt;−1 或 x&gt;3}，写成区间是 (−∞,−1)∪(3,+∞)。注意中间用「或」连接两段，不能用「且」；端点是开的，因为原不等式没有等号。</p>
<p class="s-k">用到：集合描述法与区间表示等价，端点开闭由不等号决定。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 变式：改成 &lt; 与 ≥ 会怎样</p>
<p class="s-b">改成 x²−2x−3&lt;0：开口不变，&lt;0 取中间，解集 {x|−1&lt;x&lt;3}，即 (−1,3)。改成 ≥0：形状仍是取两边，只把端点改为闭，解集 {x|x≤−1 或 x≥3}，即 (−∞,−1]∪[3,+∞)。</p>
<p class="s-k">用到：变号只改端点开闭或取法，不改变已经算出的两根；这正是「先算根、再定形状」的顺序价值。</p>
</li>
</ol>

<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">解：① 因为 a=1&gt;0，所以抛物线开口向上；② Δ=(−2)²−4×1×(−3)=16&gt;0，方程 x²−2x−3=0 有两个不相等的实根；③ 由 (x−3)(x+1)=0 得 x₁=−1，x₂=3；④ 因为开口向上且所求为 &gt;0，取两边，所以不等式的解集为 {x|x&lt;−1 或 x&gt;3}，即 (−∞,−1)∪(3,+∞)。</p>

<p class="q">含参的二次不等式，为什么非要分类讨论？</p>
<p class="a">因为字母 <b>a 是否为 0、是正还是负</b> 直接决定它是不是二次不等式、开口朝哪，Δ 的符号也随之不定；分类的标准是让 <b>每一步的符号都确定</b>，先分 a=0 与 a≠0，再分 a 的正负，最后按 Δ 分三种。</p>

<div class="qac">
<p class="q">解集能用区间写吗？两种写法哪个更保险？</p>
<p class="a">都能用。<b>集合描述法最保险</b>，区间写法要并集符号 ∪ 逐段连起来：两段写 (−∞,−1)∪(3,+∞)，中间一段写 (−1,3)；∅ 与 R 不要硬写成区间，端点开闭要和不等号一致。</p>

<p class="gx-note">六问其实是同一件事：先把「开口 / Δ / 根」这三个量定死，解集只是把它们翻译成集合。翻译规则只有两条——&gt;0 取两边、&lt;0 取中间（a&gt;0 时），加上「Δ=0 时解集是 x≠x₀」这一个例外。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ Δ=0，方程没有根，所以不等式的解集是 ∅。</p>
<p class="er-v">✓ Δ=0 时方程有两个相等实根 x₀，a&gt;0 且解 &gt;0 时解集为 {x|x≠x₀}。</p>
<p class="er-w">错在哪：把「两个根重合」当成「没有根」。相切时图象除顶点外都在 x 轴上方，只挖掉一个点。</p>
</div>
<div class="er">
<p class="er-x">✗ 解 −x²+2x+3&gt;0，直接算 Δ=16，两根 −1、3，所以取两边 x&lt;−1 或 x&gt;3。</p>
<p class="er-v">✓ 二次项系数为负要先乘 −1 并变号：x²−2x−3&lt;0，解得 −1&lt;x&lt;3。</p>
<p class="er-w">错在哪：只乘 −1 却没把 &gt; 变成 &lt;，开口方向与不等号方向对不上，取法整个反了。</p>
</div>
<div class="er">
<p class="er-x">✗ x²−2x−3&gt;0 的解集是 −1&lt;x&lt;3。</p>
<p class="er-v">✓ 开口向上，&gt;0 取两边：x&lt;−1 或 x&gt;3；&lt;0 才取中间 −1&lt;x&lt;3。</p>
<p class="er-w">错在哪：&gt;0 取两边、&lt;0 取中间记混了。记法：&gt;0 要「离两根远」，&lt;0 要「夹在两根之间」。</p>
</div>
<div class="er">
<p class="er-x">✗ x²−2x−3=(x−3)(x−1)，所以两根是 3 和 1。</p>
<p class="er-v">✓ x²−2x−3=(x−3)(x+1)，两根 −1 与 3（核对：−3×1=−3，−3+1=−2）。</p>
<p class="er-w">错在哪：常数项符号错，展开后一次项系数对不上。分解完必须乘回去验一次。</p>
</div>
<div class="er">
<p class="er-x">✗ 关于 x 的不等式 ax²−2x+1&gt;0，按 a&gt;0 讨论就行了。</p>
<p class="er-v">✓ 先分 a=0（退化为一次不等式）与 a≠0，再分 a&gt;0、a&lt;0，最后按 Δ 分三种情况。</p>
<p class="er-w">错在哪：含参不分类。a=0 时它不是二次不等式，套判别式会算出根本不存在的根。</p>
</div>
<div class="er">
<p class="er-x">✗ 两根 −1、3，所以解集是 −1≤x≤3。</p>
<p class="er-v">✓ 原不等式是严格不等号，端点不取：−1&lt;x&lt;3（区间 (−1,3)）。</p>
<p class="er-w">错在哪：把方程的根直接当解集端点却不判开闭，端点该空心的写成了实心。</p>
</div>
<div class="er">
<p class="er-x">✗ 解集是 x&lt;−1 且 x&gt;3。</p>
<p class="er-v">✓ 解集是 {x|x&lt;−1 或 x&gt;3}，两段取并集，写成 (−∞,−1)∪(3,+∞)。</p>
<p class="er-w">错在哪：「且」要求同时满足，一个数不可能既小于 −1 又大于 3，这样写等于空集。</p>
</div>
