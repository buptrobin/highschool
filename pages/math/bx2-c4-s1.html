<p class="gx-claim">简单随机抽样 = <b>逐个不放回</b> + <b>机会相等</b>；分层抽样 = <b>层内随机</b> + <b>层间独立</b> + <b>按层大小比例分配</b>（不是平均分）。</p>
<div class="gx-meta">
<span><i></i>人教A版必修第二册 第九章 统计 9.1</span>
<span><i></i>高一 · 必修第二册</span>
<span><i></i>阅读 12 分钟</span>
<span><i></i>含 1 个互动模型</span>
</div>
<p class="gx-lede">这一节是第九章统计的入口：先把「怎么从总体里取样本」定成可操作的规则，后面用样本估计总体才有依据。最容易错的一件事是：把「随机」理解成「随手」，漏掉「逐个不放回」和「机会相等」中的任何一条，就不是简单随机抽样；把分层理解成「每层抽一样多」，就不是比例分配。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 简单随机抽样<span class="q-src">人教A版必修第二册 · 第九章 9.1</span></p>
<p class="q-b">一般地，设一个总体含有 N 个个体，从中逐个不放回地抽取 n 个个体作为样本（n≤N），如果每次抽取时总体内的各个个体被抽到的机会都相等，就把这种抽样方法叫做简单随机抽样。</p>
<p class="q-n">→ 三个条件：①<b>逐个</b>抽；②<b>不放回</b>；③每次抽取时每个个体被抽到的<b>机会都相等</b>。少任何一条就不是简单随机抽样——有放回地抽，同一个个体可能被重复抽到，机会结构就变了。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 分层随机抽样<span class="q-src">人教A版必修第二册 · 第九章 9.1</span></p>
<p class="q-b">一般地，按一个或多个变量把总体划分成若干个子总体，每个个体属于且仅属于一个子总体，在每个子总体中独立地进行简单随机抽样，再把所有子总体中抽取的样本合在一起作为总样本，这样的抽样方法称为分层随机抽样。</p>
<p class="q-n">→ 注意「<b>在每个子总体中独立地进行简单随机抽样</b>」：分层不代替随机，只负责分组；层内仍然要逐个不放回、机会相等，层与层之间互不影响。所以分层是层内随机、层间独立。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 比例分配<span class="q-src">人教A版必修第二册 · 第九章 9.1</span></p>
<p class="q-b">在分层随机抽样中，如果每层样本量都与层的大小成比例，那么称这种样本量的分配方式为比例分配。</p>
<p class="q-n">→ 「与层的大小<b>成比例</b>」写成算式是 <span class="gx-fml">nᵢ = n × Nᵢ / N</span>，层大人多抽、层小人少抽，三层的抽取比相等（都等于 n/N）。它不是把 n 平均分成几份。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>条件</th><th>具体要求</th><th>缺了会怎样</th></tr></thead>
<tbody>
<tr><td>① 逐个抽取</td><td>一次取一个个体，不整批抓</td><td>无法保证每个个体机会相等，不叫简单随机抽样</td></tr>
<tr><td>② 不放回</td><td>抽出的个体不再放回总体</td><td>同一人可能被重复抽到，样本重复、机会被放大</td></tr>
<tr><td>③ 机会相等</td><td>每次抽取时每个个体被抽到的可能性相同</td><td>变成「方便抽样」，样本有偏，估计不可信</td></tr>
<tr class="key"><td>④ 比例分配</td><td>nᵢ = n × Nᵢ / N，各层抽取比相同</td><td>抽成「每层一样多」，样本结构与总体结构不一致，分层白做</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">背法：简单随机数「逐个不放回、机会相等」两个动作；分层数「层内随机、层间独立、按比例分」三个动作。表格只高亮第 ④ 行，因为它是分层抽样与「平均分」的唯一分界线。</p>
</section>

<section class="gx-sec" id="b">
<h2><span class="sn">02</span>拆开看</h2>
<p class="gx-h2s">四张图：各讲一件事，按「怎么抽 → 怎么分层 → 估得准不准 → 抽多少」排。</p>

<figure class="gx-fig">
<div class="fig-cap">
<span class="fig-no">图 1</span><span class="fig-t">简单随机抽样的两种实现：抽签法与随机数法</span>
<span class="bdg bdg-must">必考</span>
</div>
<p class="fig-s">两种做法的编号、抽取、剔除规则不同，但要满足的条件完全一样：逐个不放回、机会相等。选择题常问「哪种做法不是简单随机抽样」，答案往往就藏在「放回」和「重复编号」这两步里。</p>
<div class="gx-svgbox">
<svg viewBox="0 0 820 260" role="img" aria-label="抽签法与随机数法的四步对照">
<rect x="16" y="16" width="788" height="228" rx="10" fill="#f8fbfd" stroke="#dbe7ef"/>
<text x="36" y="42" font-size="11.5" font-weight="700" fill="#151a21">两种做法，同一套条件：逐个不放回 + 机会相等</text>
<rect x="40" y="58" width="350" height="168" rx="8" fill="#ffffff" stroke="#b8e6d0"/>
<text x="52" y="80" font-size="9.8" font-weight="700" fill="#2f8a5b">抽签法（抓阄）</text>
<text x="52" y="102" font-size="9.4" fill="#3a3a35">① 把 N 个个体编号 1，2，…，N</text>
<text x="52" y="120" font-size="9.4" fill="#3a3a35">② 号签放入容器，搅拌均匀</text>
<text x="52" y="138" font-size="9.4" fill="#3a3a35">③ 每次随机抽出 1 个，不放回</text>
<text x="52" y="156" font-size="9.4" fill="#3a3a35">④ 抽满 n 个，组成样本</text>
<text x="52" y="180" font-size="9" fill="#7b8794">关键：搅拌保证机会相等</text>
<text x="52" y="198" font-size="9" fill="#7b8794">关键：抽出后不放回</text>
<text x="52" y="216" font-size="9" fill="#7b8794">适用：总体容量 N 较小时</text>
<rect x="430" y="58" width="350" height="168" rx="8" fill="#ffffff" stroke="#c9c9c9"/>
<text x="442" y="80" font-size="9.8" font-weight="700" fill="#2563eb">随机数法</text>
<text x="442" y="102" font-size="9.4" fill="#3a3a35">① 编号，位数对齐（如 001～600）</text>
<text x="442" y="120" font-size="9.4" fill="#3a3a35">② 用随机数表或计算器产生随机数</text>
<text x="442" y="138" font-size="9.4" fill="#3a3a35">③ 剔除超范围的和重复的编号</text>
<text x="442" y="156" font-size="9.4" fill="#3a3a35">④ 取满 n 个不同编号，组成样本</text>
<text x="442" y="180" font-size="9" fill="#7b8794">关键：重复编号必须剔除（不放回）</text>
<text x="442" y="198" font-size="9" fill="#7b8794">关键：超范围编号必须剔除</text>
<text x="442" y="216" font-size="9" fill="#7b8794">适用：总体容量 N 较大时</text>
</svg>
<span class="gx-zoomchip">点击放大</span>

<p class="gx-take">只要出现「放回后再抽」或「保留重复编号」，就<b>不是</b>简单随机抽样——条件③机会相等当场失效。</p>
<p class="gx-note">口径：抽签法和随机数法都是简单随机抽样的具体实现，不是两种不同的抽样方法。</p>
</figure>

<figure class="gx-fig">

<p class="fig-s">先按变量把总体切成互不重叠的层（每个个体属于且仅属于一层），再在每层内独立地做简单随机抽样，最后把各层样本合起来。样本量按层的大小成比例，不是每层平分。</p>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 分层抽样中的比例分配<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">某校高一年级 600 人、高二年级 500 人、高三年级 400 人。为了解学生的视力情况，用分层随机抽样的方法从这三个年级中抽取 150 人进行调查，三个年级各应抽取多少人？若改成每个年级各抽 50 人，是否符合比例分配？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题：确定抽样方法</p>
<p class="s-b">总体按「年级」这一个变量分成了三个互不重叠的子总体（600、500、400），每个学生属于且仅属于一个年级，题目要求「分层随机抽样」——所以是层内简单随机、层间独立，样本量按层的大小比例分配，不是平均分。</p>
<p class="s-k">用到：分层随机抽样的定义（每个个体属于且仅属于一个子总体）。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 求总体容量与抽样比</p>
<p class="s-b">总体容量 N = 600+500+400 = 1500（人），样本量 n = 150（人）。<span class="gx-fml">抽样比 = n / N = 150 / 1500 = 1/10</span>。这个 1/10 就是每一层都要用的「抽中比」。</p>
<p class="s-k">用到：比例分配的定义——每层样本量与该层大小成比例。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 逐层按比例算</p>
<p class="s-b">高一：600 × 1/10 = 60（人）；高二：500 × 1/10 = 50（人）；高三：400 × 1/10 = 40（人）。写出通式 <span class="gx-fml">nᵢ = n × Nᵢ / N</span>，三层用的 n/N 是同一个数。</p>
<p class="s-k">用到：nᵢ = n × Nᵢ / N。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 检验两个「相等」</p>
<p class="s-b">先验总量：60+50+40 = 150，与要求的样本量一致。再验抽中比：60/600 = 50/500 = 40/400 = 1/10，三层相同。<b>注意不是</b>「三层样本量相等」——若各抽 50 人，总量 150 恰好也对，但 50/600 ≠ 50/500 ≠ 50/400，样本结构与总体结构（6∶5∶4）不一致，不属于比例分配。</p>
<p class="s-k">用到：比例分配判据＝各层抽中比相等，不是各层样本量相等。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 回到层内</p>
<p class="s-b">三个年级的人数定下来后，还要在<b>每个年级内部</b>再用简单随机抽样（抽签法或随机数法）抽出对应人数，逐个不放回、机会相等。分层只解决「分几组、各组抽几个」，不代替层内的随机抽取。</p>
<p class="s-k">用到：层内简单随机、层间独立。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">总体容量 N=600+500+400=1500，样本量 n=150，抽样比为 150/1500=1/10。<br>
按比例分配：高一样本量 600×1/10=60（人），高二样本量 500×1/10=50（人），高三样本量 400×1/10=40（人）。<br>
检验：60+50+40=150，且 60/600=50/500=40/400=1/10，各层抽中比相等，符合比例分配；各年级内部再分别进行简单随机抽样。<br>
各抽 50 人不符合比例分配：虽然总数 150 相同，但三层抽中比分别为 1/12、1/10、1/8 不相等，样本结构与总体结构不一致。</p>
</div>
</div>
</section>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「简单随机抽样到底要满足几个条件？我写『随机抽』算不算？」</p>
<p class="a">两个动作缺一不可：<b>逐个不放回</b>地抽取，且每次抽取时每个个体被抽到的<b>机会都相等</b>。只说「随机」不算——有放回地抽同样随机，但同一人可能被重复抽到，不满足「不放回」。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="简单随机抽样的两个条件">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="30" font-size="9" font-weight="700" fill="#5a6472" text-anchor="middle">两个条件，缺一不可</text>
<circle cx="32" cy="56" r="6" fill="#e6f6ee" stroke="#2f8a5b"/>
<text x="48" y="60" font-size="9" fill="#3a3a35">① 逐个抽取、不放回</text>
<circle cx="32" cy="84" r="6" fill="#e6f6ee" stroke="#2f8a5b"/>
<text x="48" y="88" font-size="9" fill="#3a3a35">② 每次机会都相等</text>
<text x="120" y="112" font-size="8.4" fill="#b8402f" text-anchor="middle">有放回抽 ⇒ 不是简单随机抽样</text>
</svg>
</div>

<div class="qac">
<p class="q">「分层抽样，每个层里面还要不要随机抽？」</p>
<p class="a">要。分层只负责把总体切成互不重叠的层，<b>层内仍要独立地进行简单随机抽样</b>（逐个不放回、机会相等）。所以分层是「层内随机、层间独立」——不做层内随机，样本就有偏。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="层内简单随机、层间独立">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<rect x="26" y="26" width="58" height="46" rx="6" fill="#dfeafd" stroke="#8fa8de"/>
<rect x="91" y="26" width="58" height="46" rx="6" fill="#dfeafd" stroke="#8fa8de"/>
<rect x="156" y="26" width="58" height="46" rx="6" fill="#dfeafd" stroke="#8fa8de"/>
<text x="55" y="54" font-size="8.4" fill="#2563eb" text-anchor="middle">层 1</text>
<text x="120" y="54" font-size="8.4" fill="#2563eb" text-anchor="middle">层 2</text>
<text x="185" y="54" font-size="8.4" fill="#2563eb" text-anchor="middle">层 3</text>
<text x="120" y="90" font-size="8.6" fill="#3a3a35" text-anchor="middle">每层内各自简单随机抽样</text>
<text x="120" y="110" font-size="8.4" fill="#2f8a5b" text-anchor="middle">层与层互不影响＝层间独立</text>
</svg>
</div>

<div class="qac">
<p class="q">「比例分配的样本量怎么算？是不是每层一样多？」</p>
<p class="a">先算抽样比 <b>n/N</b>，再逐层乘：<b>nᵢ = n × Nᵢ / N</b>。判断标准是各层<b>抽中比相等</b>，不是各层样本量相等；平均分会让层大的人抽中比偏小，样本结构失真。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="按层大小成比例分配样本量">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<rect x="24" y="26" width="96" height="18" rx="4" fill="#d7ecfb" stroke="#7fb6dd"/>
<text x="128" y="40" font-size="8.4" fill="#2563eb">60</text>
<rect x="24" y="54" width="80" height="18" rx="4" fill="#d7ecfb" stroke="#7fb6dd"/>
<text x="112" y="68" font-size="8.4" fill="#2563eb">50</text>
<rect x="24" y="82" width="64" height="18" rx="4" fill="#d7ecfb" stroke="#7fb6dd"/>
<text x="96" y="96" font-size="8.4" fill="#2563eb">40</text>
<text x="120" y="116" font-size="8.4" fill="#3a3a35" text-anchor="middle">600∶500∶400 对应 60∶50∶40</text>
</svg>
</div>

<div class="qac">
<p class="q">「样本量越大误差越小，那我干脆抽 10000 个？」</p>
<p class="a">不能无限增大。标准误与 √n 成反比，n 增大 4 倍误差才减半，<b>收益递减</b>；而且抽样要花人力经费，总体容量也有限。做题时按题目给的 n，不按「越大越好」。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="标准误随样本量递减的曲线">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>

<text x="120" y="120" font-size="8.4" fill="#5a6472" text-anchor="middle">n 越大越平：收益递减</text>
</svg>
</div>

<div class="qac">
<p class="q">「系统抽样和简单随机抽样有什么区别？考试怎么区分？」</p>
<p class="a">系统抽样先把总体<b>编号、按固定间隔 k 抽取</b>（如每 10 人抽 1 人），抽到的位置由第一个随机数决定；简单随机抽样是<b>逐个不放回、机会相等</b>地抽。系统抽样操作方便，但若总体存在周期性，样本会有偏——所以它不是简单随机抽样。</p>

<p class="q">「样本均值能代表总体均值吗？答案写『μ=…』行不行？」</p>
<p class="a">能用 x̄ <b>估计</b> μ，但一般 x̄ ≠ μ，所以答案要写「估计值为 …」。n 越大，x̄ 在 μ 附近摆动的幅度越小（标准误 1/√n 变小），估计越可靠。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 有放回地随机抽取，也是简单随机抽样。</p>
<p class="er-v">✓ 简单随机抽样要求逐个<b>不放回</b>地抽取，且每次抽取时各个个体被抽到的机会都相等。</p>
<p class="er-w">错在哪：有放回会让同一个个体被重复抽到，「不放回」这条被破坏，机会结构也变了。</p>
</div>
<div class="er">
<p class="er-x">✗ 分层抽样就是每个层抽一样多的人。</p>
<p class="er-v">✓ 比例分配时，每层样本量与该层的大小成比例，nᵢ = n × Nᵢ / N，各层抽中比相等。</p>
<p class="er-w">错在哪：把「比例分配」偷换成「平均分」，这是本节最常扣分的一处。</p>
</div>
<div class="er">
<p class="er-x">✗ 分层抽样分好层就能抽，层内随便取几个人。</p>
<p class="er-v">✓ 在每个子总体中<b>独立地进行简单随机抽样</b>，再把各层样本合起来作为总样本。</p>
<p class="er-w">错在哪：漏掉「层内随机」——层内简单随机、层间独立，两个都要写。</p>
</div>
<div class="er">
<p class="er-x">✗ 样本量变成 2 倍，抽样误差就变成一半。</p>
<p class="er-v">✓ 标准误 se = σ/√n，与 √n 成反比：n 变 4 倍，se 才减半。</p>
<p class="er-w">错在哪：把 1/√n 当成 1/n 用，n=25 的 se=2 不是 n=4 的 1/6，而是 1/2.5。</p>
</div>
<div class="er">
<p class="er-x">✗ 样本均值一定等于总体均值，直接写 μ = 172。</p>
<p class="er-v">✓ 用样本均值 x̄ 估计总体均值 μ，应写「μ 的估计值为 172」。</p>
<p class="er-w">错在哪：x̄ 是随机变量，随样本不同而变，一般不等于 μ。</p>

<div class="er">
<p class="er-x">✗ 总体容量越大，抽样误差就越大。</p>
<p class="er-v">✓ 抽样误差（标准误）由 σ 和样本量 n 决定，se = σ/√n，与总体容量 N 无直接关系。</p>
<p class="er-w">错在哪：把「总体大」当成「难估」；决定精度的是抽了多少，不是总体有多少。</p>
</div>
<div class="er">
<p class="er-x">✗ 随机数法抽到重复编号时，多算一个人也无所谓。</p>
<p class="er-v">✓ 随机数法中超出编号范围的数和<b>重复的编号都必须剔除</b>，直到取满 n 个不同编号。</p>
<p class="er-w">错在哪：保留重复编号等于「放回再抽」，破坏逐个不放回，也破坏机会相等。</p>

<script>
/* 互动脚本本体（由 build-page.mjs 包进 <script> 里，所以这里不要写 <script> 标签） */
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var GX = window.GX, el = GX.el, tx = GX.tx, $ = GX.$;
  var stage = $("gxStage");
  if (!stage || !window.AutoPilot) return;

  /* 两套坐标：宽屏 880×470，窄屏独立 360×700 */
  var W = { vb: "0 0 880 470", left: { x: 16, y: 16, w: 424, h: 438 }, right: { x: 456, y: 16, w: 408, h: 438 } };
  var N = { vb: "0 0 360 700", left: { x: 8, y: 8, w: 344, h: 300 }, right: { x: 8, y: 320, w: 344, h: 372 } };
  var L = W, A = 25, SD = 10;

  /* 纯函数：样本量 → 抽样误差。render() 和 __model.cases 都用它 */
  function calc(v) {
    var n = Math.max(1, v), se = SD / Math.sqrt(n);
    return { n: n, se: se, rel: se / SD };
  }

  function xOfN(n, R) {
    var x0 = R.x + 54, x1 = R.x + R.w - 26;
    return x0 + (Math.sqrt(n) - 2) / 18 * (x1 - x0);
  }
  function yOfSe(se, R) {
    var y0 = R.y + R.h - 78, yT = R.y + 74;
    return y0 - se / 5.2 * (y0 - yT);
  }

  function drawAxes(g, R, x0, x1, y0) {
    el("line", { x1: x0, y1: y0, x2: x1 - 12, y2: y0, stroke: "#8d9aa6", "stroke-width": 1.3 }, g);
    el("polygon", { points: (x1 - 13) + "," + (y0 - 5) + " " + x1 + "," + y0 + " " + (x1 - 13) + "," + (y0 + 5), fill: "#8d9aa6" }, g);
  }

  /* 左图：x̄ 的分布随 se 变窄 */
  function drawLeft(g, R, s) {
    el("rect", { x: R.x, y: R.y, width: R.w, height: R.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, g);
    tx(g, R.x + 18, R.y + 26, "样本均值 x̄ 的分布：se 越小越窄", "#5a6472", "start", 10.5, 700);
    var x0 = R.x + 24, x1 = R.x + R.w - 26, base = R.y + R.h - 74, top = R.y + 62;
    var cx = (x0 + x1) / 2, sg = Math.max(3, R.w * 0.30 * (s.se / 5)), amp = (base - top) * 0.94;
    drawAxes(g, R, x0, x1, base);
    var d = "", i, x, y;
    for (i = 0; i <= 40; i++) {
      x = x0 + (x1 - x0) * i / 40;
      y = base - amp * Math.exp(-(x - cx) * (x - cx) / (2 * sg * sg));
      d += (i ? " L" : "M") + x.toFixed(1) + "," + y.toFixed(1);
    }
    el("path", { d: d, fill: "none", stroke: "#2563eb", "stroke-width": 1.8 }, g);
    el("line", { x1: cx, y1: top - 6, x2: cx, y2: base, stroke: "#b8791f", "stroke-width": 1.2, "stroke-dasharray": "4 3" }, g);
    tx(g, cx, top - 12, "μ", "#b8791f", "middle", 9.4, 700);
    el("line", { x1: cx - sg, y1: base - 6, x2: cx - sg, y2: base + 6, stroke: "#b8402f", "stroke-width": 1.4 }, g);
    el("line", { x1: cx + sg, y1: base - 6, x2: cx + sg, y2: base + 6, stroke: "#b8402f", "stroke-width": 1.4 }, g);
    if (sg > 36) {
      tx(g, cx - sg, base + 22, "μ−se", "#b8402f", "middle", 8.4, 400);
      tx(g, cx + sg, base + 22, "μ+se", "#b8402f", "middle", 8.4, 400);
    }
    tx(g, x0, base + 22, "x̄ 取值", "#7b8794", "start", 8.4, 400);
    tx(g, R.x + 18, R.y + R.h - 34, "抽 n=" + Math.round(s.n) + " 个个体时，se=" + s.se.toFixed(2), "#2563eb", "start", 9.4, 700);
    tx(g, R.x + 18, R.y + R.h - 16, "曲线越窄 ⇒ x̄ 越贴近 μ ⇒ 估计越稳", "#7b8794", "start", 9, 400);
  }

  /* 右图：se=10/√n 曲线 + 当前点 */
  function drawRight(g, R, s) {
    el("rect", { x: R.x, y: R.y, width: R.w, height: R.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, g);
    tx(g, R.x + 18, R.y + 26, "se = 10/√n（σ=10）", "#5a6472", "start", 10.5, 700);
    var x0 = R.x + 54, x1 = R.x + R.w - 26, y0 = R.y + R.h - 78, yT = R.y + 74, k, yy, d = "", n;
    drawAxes(g, R, x0, x1, y0);
    el("line", { x1: x0, y1: y0, x2: x0, y2: yT - 8, stroke: "#8d9aa6", "stroke-width": 1.3 }, g);
    el("polygon", { points: (x0 - 5) + "," + (yT - 7) + " " + x0 + "," + (yT - 24) + " " + (x0 + 5) + "," + (yT - 7), fill: "#8d9aa6" }, g);
    tx(g, x0 + 8, yT - 18, "se", "#5a6472", "start", 9, 700);
    for (k = 0; k <= 5; k++) {
      yy = yOfSe(k, R);
      el("line", { x1: x0 - 4, y1: yy, x2: x0, y2: yy, stroke: "#b9c4cd" }, g);
      tx(g, x0 - 8, yy + 3, String(k), "#7b8794", "end", 8.4, 400);
    }
    for (n = 4; n <= 400; n *= 1.4) {
      d += (d ? " L" : "M") + xOfN(n, R).toFixed(1) + "," + yOfSe(SD / Math.sqrt(n), R).toFixed(1);
    }
    d += " L" + xOfN(400, R).toFixed(1) + "," + yOfSe(SD / Math.sqrt(400), R).toFixed(1);
    el("path", { d: d, fill: "none", stroke: "#2563eb", "stroke-width": 2 }, g);
    [4, 25, 100, 400].forEach(function (m) {
      tx(g, xOfN(m, R), y0 + 16, String(m), "#7b8794", "middle", 8.4, 400);
    });
    tx(g, (x0 + x1) / 2, y0 + 32, "样本量 n", "#5a6472", "middle", 8.8, 400);
    var px = xOfN(s.n, R), py = yOfSe(s.se, R);
    el("line", { x1: x0, y1: py, x2: px, y2: py, stroke: "#c3d5ea", "stroke-dasharray": "4 3" }, g);
    el("line", { x1: px, y1: py, x2: px, y2: y0, stroke: "#c3d5ea", "stroke-dasharray": "4 3" }, g);
    el("circle", { cx: px, cy: py, r: 4.4, fill: "#b8402f" }, g);
    var lab = "n=" + Math.round(s.n) + "，se=" + s.se.toFixed(2), right = px > x1 - 108;
    tx(g, right ? px - 9 : px + 9, py - 10, lab, "#b8402f", right ? "end" : "start", 8.8, 700);
    tx(g, R.x + 18, R.y + R.h - 14, "n×4 ⇒ se÷2：误差按 1/√n 缩小，不按 n", "#7b8794", "start", 8.8, 400);
  }

  function draw() {
    var gA = $("gxA"), gB = $("gxB"), s = calc(A);
    gA.textContent = ""; gB.textContent = "";
    drawLeft(gA, L.left, s);
    drawRight(gB, L.right, s);
  }

  function render() {
    var s = calc(A), st, col, bg, sn;
    $("gxVa").textContent = String(Math.round(s.n));
    $("gxVb").textContent = s.se.toFixed(2);
    $("gxVc").textContent = Math.round(s.rel * 100) + "%";
    if (s.n < 10) { st = "误差大"; col = "#b8402f"; bg = "#fbeae7"; sn = "样本太少，se≥3.2"; }
    else if (s.n < 25) { st = "偏小"; col = "#b8791f"; bg = "#fdf3e0"; sn = "再多抽一点更稳"; }
    else if (s.n <= 100) { st = "够用"; col = "#2f8a5b"; bg = "#e6f6ee"; sn = "se 已降到 2 至 1"; }
    else if (s.n <= 300) { st = "较稳"; col = "#2563eb"; bg = "#e8f0fd"; sn = "se 在 0.58 到 1 之间"; }
    else { st = "收益递减"; col = "#2f8a5b"; bg = "#e6f6ee"; sn = "误差已很小，再增不划算"; }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    draw();
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 4 }, { t: 1.2, v: 4 }, { t: 4, v: 25 }, { t: 6.5, v: 25 }, { t: 9, v: 400 }, { t: 11.5, v: 400 }, { t: 13, v: 4 }],
    keys: [4, 25, 100, 400],
    value: A, min: 4, max: 400, step: 1,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc, cases: [
    { v: 4, eq: { se: 5 } },
    { v: 25, eq: { se: 2 } },
    { v: 100, eq: { se: 1 } },
    { v: 400, eq: { se: 0.5 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
