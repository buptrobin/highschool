<p class="gx-claim">一元线性回归只做一件事：在散点里挑一条直线，让<b>残差平方和 Q 最小</b>；记住三个判据——<b>残差是 y−ŷ</b>、<b>Q 最小就是最小二乘</b>、<b>回归直线一定过样本中心 (x̄,ȳ)</b>。</p>
<div class="gx-meta">
<span><i></i>人教A版选择性必修第三册 第八章第2节</span>

<span><i></i>阅读 12 分钟</span>

<p class="gx-lede">第八章先讲「成对数据的相关性」，这一节把相关性落到一条能算、能预测的直线上：用最小二乘求出 b̂ 与 â，得到经验回归方程 ŷ=b̂x+â，再用残差去看它拟合得好不好。最常见的一处翻车是把残差写成 ŷ−y（预测减观测），符号全反，后面 Q、残差图、判断拟合优度全部跟着错。另一处是只会代公式、不知道这条线为什么一定过样本中心 (x̄,ȳ)。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 经验回归方程<span class="q-src">人教A版选择性必修第三册 · 第八章第2节</span></p>
<p class="q-b">经验回归方程 ŷ=b̂x+â，其中 b̂=Σ(xᵢ−x̄)(yᵢ−ȳ)/Σ(xᵢ−x̄)²，â=ȳ−b̂x̄。</p>
<p class="q-n">→ 翻成人话：这句话是<b>三个条件</b>串起来的——① b̂ 的分子是「叉积和」Σ(xᵢ−x̄)(yᵢ−ȳ)，不是 ΣxᵢΣyᵢ；② 分母是同名变量的平方和 Σ(xᵢ−x̄)²，必须有平方；③ â 不是独立算的，它由 ȳ−b̂x̄ 倒推出来。少一个条件，b̂ 与 â 就配不上一组数。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 残差与残差平方和<span class="q-src">人教A版选择性必修第三册 · 第八章第2节</span></p>
<p class="q-b">残差 eᵢ=yᵢ−ŷᵢ，残差平方和 Q=Σ(yᵢ−ŷᵢ)² 越小，拟合效果越好。</p>
<p class="q-n">→ 翻成人话：残差是观测减预测 y−ŷ，方向不能反——观测在直线上方，eᵢ 为正。Q 是全部残差平方相加，平方把正负抵消掉，只留「离得多远」。所以 Q 最小就是最小二乘，Q 越小直线贴得越紧。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 样本中心<span class="q-src">人教A版选择性必修第三册 · 第八章第2节</span></p>
<p class="q-b">经验回归直线一定过样本中心点 (x̄,ȳ)。</p>
<p class="q-n">→ 翻成人话：把 â=ȳ−b̂x̄ 代回方程，得 ŷ−ȳ=b̂(x−x̄)，x=x̄ 时右端为 0，于是 ŷ=ȳ。这条不是巧合而是恒等式：<b>回归直线一定过样本中心 (x̄,ȳ)</b>，任何一组数据都成立，考试常拿它出「不过中心」的错选项。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>条件</th><th>标准写法</th><th>缺了会怎样</th></tr></thead>
<tbody>
<tr><td>分子是叉积和</td><td>Σ(xᵢ−x̄)(yᵢ−ȳ)</td><td>写成 ΣxᵢΣyᵢ 或 Σxᵢyᵢ，数值完全对不上</td></tr>
<tr><td>分母是同名平方和</td><td>Σ(xᵢ−x̄)²=10</td><td>漏平方会算出负数或量纲错，b̂ 无从谈起</td></tr>
<tr><td>截距由 b̂ 倒推</td><td>â=ȳ−b̂x̄</td><td>另起炉灶硬算 â，直线就不过 (x̄,ȳ)</td></tr>
<tr class="key"><td>残差方向</td><td>eᵢ=yᵢ−ŷᵢ（观测减预测）</td><td>写成 ŷᵢ−yᵢ，每个残差符号全反，Q 却不变、判断题必错</td></tr>
<tr><td>Q 的口径</td><td>Q=Σ(yᵢ−ŷᵢ)²，取最小</td><td>以为 Q 最小是「算得最省事」，不知道那正是最小二乘的定义</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">背法：<b>叉积和除以平方和，截距回头找中心</b>。整张表只有一行是「方向性」的错——残差是观测减预测 y−ŷ，其余四行都是算错而不是理解错。做题时先写 x̄、ȳ 两个数，再写 Σ(xᵢ−x̄)(yᵢ−ȳ) 与 Σ(xᵢ−x̄)²，最后才动笔算 b̂，顺序别倒。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 求经验回归方程并说明原因<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">某研究小组收集到 5 组数据 (1,2)(2,3)(3,5)(4,6)(5,8)。<br>（1）求 y 关于 x 的经验回归方程 ŷ=b̂x+â；<br>（2）判断该直线是否经过样本中心，并由此说明 «Q 最小就是最小二乘» 的含义。<br>陷阱：「b̂ 的分子是叉积和还是 Σx·Σy？」「残差是 y−ŷ 还是 ŷ−y？」</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 先写两个均值</p>
<p class="s-b">x̄=(1+2+3+4+5)/5=3，ȳ=(2+3+5+6+8)/5=24/5=4.8。样本中心是 (3,4.8)。</p>
<p class="s-k">用到：均值定义。先把中心点算出来，后面 â 要用它倒推。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 列叉积和与平方和</p>
<p class="s-b">Σ(xᵢ−x̄)(yᵢ−ȳ)=(−2)(−2.8)+(−1)(−1.8)+0·0.2+1·1.2+2·3.2=5.6+1.8+0+1.2+6.4=15；Σ(xᵢ−x̄)²=4+1+0+1+4=10。</p>
<p class="s-k">用到：b̂ 的分子是叉积和 Σ(xᵢ−x̄)(yᵢ−ȳ)，不是 ΣxᵢΣyᵢ=15×24=360。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 相除得 b̂</p>
<p class="s-b">b̂=15/10=1.5。含义：x 每增加 1，y 平均增加 1.5。</p>
<p class="s-k">用到：b̂ 的几何意义是斜率，不是相关系数；|b̂| 大小还依赖单位。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 用中心点倒推 â</p>
<p class="s-b">â=ȳ−b̂x̄=4.8−1.5×3=0.3，故经验回归方程为 ŷ=1.5x+0.3。</p>
<p class="s-k">用到：回归直线一定过样本中心 (x̄,ȳ)，把 (3,4.8) 代入 ŷ=1.5x+â 立刻得 â=0.3，这也是最好的验算。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 验算 Q 并回答第（2）问</p>
<p class="s-b">五个残差为 0.2、−0.3、0.2、−0.3、0.2，Q=0.04+0.09+0.04+0.09+0.04=0.3，比 b=0.5 时的 55.3、b=2.5 时的 55.3 都小。直线过 (3,4.8)，即 ŷ(3)=1.5×3+0.3=4.8=ȳ。Q 最小就是最小二乘：b̂=1.5 之所以被选中，唯一理由就是它让 Q 达到最小。</p>
<p class="s-k">用到：残差是观测减预测 y−ŷ；Q 最小就是最小二乘，二者是同一句话的两种说法。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）x̄=3，ȳ=4.8；Σ(xᵢ−x̄)(yᵢ−ȳ)=15，Σ(xᵢ−x̄)²=10；b̂=15/10=1.5；â=ȳ−b̂x̄=4.8−1.5×3=0.3。所以经验回归方程为 ŷ=1.5x+0.3。<br>（2）因为 â=ȳ−b̂x̄，代入得 ŷ−ȳ=b̂(x−x̄)，当 x=x̄ 时 ŷ=ȳ，所以回归直线一定过样本中心 (3,4.8)。最小二乘的含义是：在所有形如 ŷ=â+bx 的直线中，b̂=1.5、â=0.3 使残差平方和 Q=Σ(yᵢ−ŷᵢ)²=0.3 达到最小，故 Q 最小就是最小二乘。<br>（3）残差按 eᵢ=yᵢ−ŷᵢ 计算（观测减预测），得 0.2、−0.3、0.2、−0.3、0.2，符号交替、绝对值都不超过 0.3，说明直线与散点吻合较好；不能把它们写成 ŷᵢ−yᵢ。</p>
</div>
</div>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 回归直线是拟合出来的，不一定经过样本中心。</p>
<p class="er-v">✓ 经验回归直线一定过样本中心点 (x̄,ȳ)。</p>
<p class="er-w">错在哪：由 â=ȳ−b̂x̄ 恒可得 ŷ−ȳ=b̂(x−x̄)，x=x̄ 时 ŷ=ȳ，这是恒等式，不是「碰巧经过」。答题时可以直接用它验算 â。</p>
</div>
<div class="er">
<p class="er-x">✗ 残差 eᵢ=ŷᵢ−yᵢ，即预测减观测。</p>
<p class="er-v">✓ 残差 eᵢ=yᵢ−ŷᵢ，观测减预测。</p>
<p class="er-w">错在哪：方向反了每个残差的符号全反。平方和 Q 不变，所以求 Q 的题看不出来，但残差图、正负判断、拟合分析全错。记法：残差是「实测减应该」。</p>
</div>
<div class="er">
<p class="er-x">✗ b̂ 的分子是 Σxᵢ·Σyᵢ，把两个和乘一下。</p>
<p class="er-v">✓ b̂=Σ(xᵢ−x̄)(yᵢ−ȳ)/Σ(xᵢ−x̄)²，分子是逐组配对的叉积和。</p>
<p class="er-w">错在哪：Σxᵢ·Σyᵢ 把 5 组配对信息全丢了，量纲也不对（本组数据会算出 360 而不是 15）。必须先把 x、y 各自减去均值，再对应相乘、再相加。</p>
</div>
<div class="er">
<p class="er-x">✗ 经验回归方程算出来了，x 代多大都行，预测都准。</p>
<p class="er-v">✓ 回归方程只宜在样本 x 的取值范围内用于预测，外推需谨慎。</p>
<p class="er-w">错在哪：外推段没有观测支撑，直线只是按斜率惯性延伸。本例 x=8 算出 12.3，实际可能只有 9。考试写「预测值仅作参考」才拿满。</p>
</div>
<div class="er">
<p class="er-x">✗ â=b̂x̄−ȳ，先算斜率再照式子代入。</p>
<p class="er-v">✓ â=ȳ−b̂x̄，截距由样本中心倒推。</p>
<p class="er-w">错在哪：减数与被减数颠倒。判据很好记：把 (x̄,ȳ) 代进 ŷ=b̂x+â 必须成立，即 ȳ=b̂x̄+â，所以 â=ȳ−b̂x̄。算完代回中心点验算一遍，错了立刻发现。</p>
</div>
<div class="er">
<p class="er-x">✗ 残差平方和 Q=0，说明模型一定选对了。</p>
<p class="er-v">✓ Q 小说明这组数据上拟合得紧，不代表模型合理或预测可靠。</p>
<p class="er-w">错在哪：Q=0 只表示 5 个点恰好共线，样本太小或变量太多都会造成这种「贴着过」，对样本外毫无保证，属过拟合。判断拟合好坏还要看残差图是否随机、样本是否有代表性。</p>
</div>
<div class="er">
<p class="er-x">✗ 最小二乘就是「计算量最小的算法」。</p>
<p class="er-v">✓ 最小二乘指使残差平方和 Q=Σ(yᵢ−ŷᵢ)² 达到最小的估计方法。</p>
<p class="er-w">错在哪：「最小」修饰的是 Q，不是计算量。Q 最小就是最小二乘，这是定义级的等价说法，答概念题时要原样写出来。</p>
</div>
</div>
<p class="gx-note">七条里前三条是「写错符号和公式」，后四条是「理解错口径」。统一的自检动作只有两个：算完把 (x̄,ȳ) 代回直线看是否成立；把每个残差按 y−ŷ 写出来看符号是否符合「点在线上方为正」。</p>
</section>

<script>
/* 互动脚本本体（由 build-page.mjs 包进 <script> 里，所以这里不要写 <script> 标签） */
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var GX = window.GX, el = GX.el, tx = GX.tx, $ = GX.$;
  var stage = $("gxStage");
  if (!stage || !window.AutoPilot) return;

  /* 两套坐标：宽屏 880×470，窄屏独立 360×700 */
  var W = { vb: "0 0 880 470", left: { x: 16, y: 16, w: 424, h: 438 }, right: { x: 456, y: 16, w: 408, h: 438 } };
  var N = { vb: "0 0 360 700", left: { x: 8, y: 8, w: 344, h: 300 }, right: { x: 8, y: 320, w: 344, h: 372 } };
  var L = W, A = 0.5, G = null;

  var XS = [1, 2, 3, 4, 5], YS = [2, 3, 5, 6, 8], C0 = 0.3, BX = 1.5, YMAX = 14;

  /* 纯函数：斜率 b → 残差平方和 Q。render() 和 __model.cases 都用它 */
  function qof(b) {
    var q = 0;
    for (var i = 0; i < 5; i++) { var e = YS[i] - C0 - b * XS[i]; q += e * e; }
    return q;
  }
  function calc(v) {
    var b = Math.round(v * 10) / 10;
    return { b: b, q: qof(b), yh: C0 + 3 * b, nobs: 5 };
  }

  function geom() {
    var l = L.left, r = L.right;
    return {
      sx: function (x) { return l.x + 52 + (x / 5.6) * (l.w - 72); },
      sy: function (y) { return l.y + l.h - 30 - (y / YMAX) * (l.h - 62); },
      bx: function (b) { return r.x + 56 + ((b - 0.5) / 2) * (r.w - 80); },
      qy: function (q) { return r.y + r.h - 36 - (q / 60) * (r.h - 70); }
    };
  }

  function draw() {
    var gA = $("gxA"), gB = $("gxB");
    gA.textContent = ""; gB.textContent = "";
    var l = L.left, r = L.right, s = calc(A), i;

    var defs = el("defs", {}, gA);
    var mk = el("marker", { id: "gxAr", viewBox: "0 0 10 10", refX: 8, refY: 5, markerWidth: 6, markerHeight: 6, orient: "auto" }, defs);
    el("path", { d: "M0 0 L10 5 L0 10 z", fill: "#9aa7b4" }, mk);

    el("rect", { x: l.x, y: l.y, width: l.w, height: l.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    tx(gA, l.x + 56, l.y + 24, "散点与直线 ŷ = 0.3 + b·x", "#5a6472", "start", 10.5, 700);

    el("line", { x1: G.sx(0), y1: G.sy(0), x2: G.sx(5.6), y2: G.sy(0), stroke: "#9aa7b4", "stroke-width": 1.2, "marker-end": "url(#gxAr)" }, gA);
    el("line", { x1: G.sx(0), y1: G.sy(0), x2: G.sx(0), y2: G.sy(YMAX), stroke: "#9aa7b4", "stroke-width": 1.2, "marker-end": "url(#gxAr)" }, gA);
    tx(gA, G.sx(0) - 14, G.sy(YMAX) + 4, "y", "#5a6472", "end", 10, 700);
    tx(gA, G.sx(5.6) + 2, G.sy(0) + 4, "x", "#5a6472", "start", 10, 700);
    for (i = 1; i <= 5; i++) tx(gA, G.sx(i), G.sy(0) + 15, String(i), "#5a6472", "middle", 9.2, 400);
    var yt = [2, 4, 6, 8, 10, 12];
    for (i = 0; i < yt.length; i++) {
      tx(gA, G.sx(0) - 6, G.sy(yt[i]) + 3, String(yt[i]), "#5a6472", "end", 9.2, 400);
      el("line", { x1: G.sx(0) - 3, y1: G.sy(yt[i]), x2: G.sx(0), y2: G.sy(yt[i]), stroke: "#c7d2dc", "stroke-width": 1 }, gA);
    }

    /* 当前直线（超出 0..YMAX 的部分截断，避免冲出画布） */
    var x1 = 0.4, x2 = Math.min(5.5, (YMAX - 0.4) / s.b);
    var y1 = C0 + s.b * x1, y2 = C0 + s.b * x2;
    el("line", { x1: G.sx(x1), y1: G.sy(y1), x2: G.sx(x2), y2: G.sy(y2), stroke: "#2563eb", "stroke-width": 2.2 }, gA);

    /* 残差：竖直小线段（观测 − 预测） */
    for (i = 0; i < 5; i++) {
      var px = G.sx(XS[i]), yh = C0 + s.b * XS[i];
      var py = G.sy(YMAX) + (G.sy(0) - G.sy(YMAX));
      el("line", { x1: px, y1: G.sy(YS[i]), x2: px, y2: Math.max(G.sy(yh), G.sy(YMAX)), stroke: "#b8791f", "stroke-width": 2.4, "stroke-dasharray": "3 2" }, gA);
      void py;
      el("circle", { cx: px, cy: G.sy(YS[i]), r: 4.2, fill: "#b8402f" }, gA);
    }

    var cx = G.sx(3), cy = G.sy(4.8);
    el("line", { x1: G.sx(0), y1: cy, x2: cx, y2: cy, stroke: "#2f8a5b", "stroke-width": 1, "stroke-dasharray": "4 3", opacity: 0.7 }, gA);
    el("line", { x1: cx, y1: G.sy(0), x2: cx, y2: cy, stroke: "#2f8a5b", "stroke-width": 1, "stroke-dasharray": "4 3", opacity: 0.7 }, gA);
    el("circle", { cx: cx, cy: cy, r: 6, fill: "none", stroke: "#2f8a5b", "stroke-width": 2 }, gA);
    tx(gA, cx + 9, cy - 6, "样本中心 (3,4.8)", "#2f8a5b", "start", 9, 700);

    /* 右：Q(b) 抛物线 */
    el("rect", { x: r.x, y: r.y, width: r.w, height: r.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    tx(gB, r.x + 16, r.y + 24, "Q(b)=Σ(yᵢ−0.3−b·xᵢ)²", "#5a6472", "start", 10.5, 700);
    el("line", { x1: G.bx(0.5), y1: G.qy(0), x2: r.x + r.w - 22, y2: G.qy(0), stroke: "#9aa7b4", "stroke-width": 1.2, "marker-end": "url(#gxAr)" }, gB);
    el("line", { x1: G.bx(0.5), y1: G.qy(0), x2: G.bx(0.5), y2: G.qy(60), stroke: "#9aa7b4", "stroke-width": 1.2, "marker-end": "url(#gxAr)" }, gB);
    tx(gB, G.bx(0.5) - 30, G.qy(60) + 4, "Q", "#5a6472", "end", 10, 700);
    tx(gB, G.bx(2.5) + 14, G.qy(0) + 4, "b", "#5a6472", "start", 10, 700);
    var bt = [0.5, 1.0, 1.5, 2.0, 2.5];
    for (i = 0; i < bt.length; i++) tx(gB, G.bx(bt[i]), G.qy(0) + 15, bt[i].toFixed(1), "#5a6472", "middle", 9.2, 400);
    var qt = [15, 30, 45, 60];
    for (i = 0; i < qt.length; i++) tx(gB, G.bx(0.5) - 6, G.qy(qt[i]) + 3, String(qt[i]), "#5a6472", "end", 9.2, 400);

    var pts = "";
    for (i = 0; i <= 20; i++) {
      var bb = 0.5 + i * 0.1;
      pts += G.bx(bb).toFixed(1) + "," + G.qy(qof(bb)).toFixed(1) + " ";
    }
    el("polyline", { points: pts, fill: "none", stroke: "#2563eb", "stroke-width": 2.2 }, gB);

    el("circle", { cx: G.bx(BX), cy: G.qy(0.3), r: 5, fill: "#2f8a5b" }, gB);
    el("line", { x1: G.bx(BX), y1: G.qy(0.3), x2: G.bx(BX), y2: G.qy(0), stroke: "#2f8a5b", "stroke-width": 1, "stroke-dasharray": "3 3" }, gB);
    tx(gB, G.bx(BX) - 8, G.qy(0.3) - 10, "b̂=1.5，Q=0.3", "#2f8a5b", "middle", 9.4, 700);

    el("circle", { cx: G.bx(s.b), cy: G.qy(s.q), r: 5.6, fill: "#b8402f" }, gB);
    el("line", { x1: G.bx(s.b), y1: G.qy(s.q), x2: G.bx(s.b), y2: G.qy(0), stroke: "#b8402f", "stroke-width": 1.2, "stroke-dasharray": "4 3" }, gB);
    tx(gB, r.x + r.w - 14, r.y + 24, "当前 Q=" + s.q.toFixed(1), "#b8402f", "end", 9.6, 700);
  }

  function render() {
    if (!G) { L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N; G = geom(); stage.setAttribute("viewBox", L.vb); }
    var s = calc(A), st, col, bg, sn, d = Math.abs(s.b - BX);
    $("gxVa").textContent = s.b.toFixed(1);
    $("gxVb").textContent = s.q.toFixed(1);
    $("gxVc").textContent = s.yh.toFixed(1);
    if (d < 0.05) { st = "Q 最小"; col = "#2f8a5b"; bg = "#e6f6ee"; sn = "最小二乘 · 过 (3,4.8)"; }
    else if (d < 0.6) { st = "偏了一点"; col = "#b8791f"; bg = "#fdf3e0"; sn = "Q 正在变大"; }
    else { st = "偏离很远"; col = "#b8402f"; bg = "#fbeae7"; sn = "残差平方和很大"; }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    draw();
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    G = geom();
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 0.5 }, { t: 1.2, v: 0.5 }, { t: 4, v: 1.5 }, { t: 6.5, v: 1.5 }, { t: 9, v: 2.5 }, { t: 11.5, v: 1 }, { t: 13.5, v: 0.5 }],
    keys: [0.5, 1, 1.5, 2.5],
    value: A, min: 0.5, max: 2.5, step: 0.1,
    idle: 5000,
    onChange: function (v) { A = Math.round(v * 10) / 10; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc, cases: [
    { v: 0.5, eq: { q: 55.3 } },
    { v: 1.5, eq: { q: 0.3 } },
    { v: 2.5, eq: { q: 55.3 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
