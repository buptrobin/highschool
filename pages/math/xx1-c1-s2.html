<p class="gx-claim">空间向量基本定理只讲一件事：<b>三个不共面的向量</b>能把任一空间向量 p 写成 <b>唯一</b> 的 x a + y b + z c；门槛是「不共面」，不是「有三个」。</p>
<div class="gx-meta">
<span><i></i>人教A版选择性必修第一册 第1章第2节</span>
<span><i></i>高二 · 选择性必修第一册</span>
<span><i></i>阅读 12 分钟</span>
<span><i></i>含 1 个互动模型</span>
</div>
<p class="gx-lede">上一节把平面向量基本定理搬进空间：平面上两个不共线向量就够用，空间里必须三个不共面向量。这一节的位置很关键——后面用坐标算空间向量、求法向量、建系，全靠「分解唯一」这四个字撑着，坐标才配叫坐标。最容易错的是把「三个向量」当成基底的充分条件：三个共面向量凑够数也不行。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 空间向量基本定理<span class="q-src">人教A版选择性必修第一册 · 第1章第2节</span></p>
<p class="q-b">如果三个向量 a、b、c 不共面，那么对任意一个空间向量 p，存在唯一的有序实数组 (x,y,z)，使 <span class="gx-fml">p = x a + y b + z c</span>。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个条件</b>组成——① a、b、c <b>不共面</b>；② p 是<b>任意</b>空间向量，不是某个特殊向量；③ 有序实数组 (x,y,z) <b>存在且唯一</b>。缺①：三个向量压在同一张平面内，平面外的 p 根本分解不出来；缺③：同一个 p 能写出两组系数，坐标就没法定义了。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 基底与基向量<span class="q-src">人教A版选择性必修第一册 · 第1章第2节</span></p>
<p class="q-b">a、b、c 叫做空间的一个基底，它们都是基向量。</p>
<p class="q-n">→ 「<b>一个</b>基底」不是「<b>唯一</b>的基底」：任意三个不共面的向量都能当基底，所以空间有无穷多组基底；但一旦选定，分解就是唯一的。还要注意「基向量」不是「单位向量」，也不要求两两垂直、不要求长度相等。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 任意三个不共面的向量<span class="q-src">人教A版选择性必修第一册 · 第1章第2节</span></p>
<p class="q-b">任意三个不共面的向量都可以构成空间的一个基底。</p>
<p class="q-n">→ 判据只有一条：<b>不共面</b>。长短、夹角、方向全都随便。反过来说，只要三个向量共面（包括其中两个共线、或有一个是零向量），它们就张不出整个空间，不能作基底。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>定理里的条件</th><th>课本怎么写</th><th>缺了会怎样</th></tr></thead>
<tbody>
<tr><td>① 三个向量不共面</td><td>「三个向量 a、b、c 不共面」</td><td>只张成一张平面，平面外的 p 分解不出来，{a,b,c} 也不能叫基底</td></tr>
<tr><td>② p 是任意空间向量</td><td>「对任意一个空间向量 p」</td><td>若 p 本来就落在 a、b 张成的平面内，第三个系数 z 必为 0，c 白选</td></tr>
<tr class="key"><td>③ 存在且唯一</td><td>「存在唯一的有序实数组 (x,y,z)」</td><td>不唯一，就没法把 (x,y,z) 叫作 p 的坐标，建系、求法向量全部失效</td></tr>
<tr><td>隐含：基向量都非零</td><td>「它们都是基向量」</td><td>零向量与任何向量共面，夹了零向量的三个向量一定共面，作不了基底</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">给分句式背这两句：「因为 a、b、c 不共面，所以 {a,b,c} 是空间的一个基底」→「由空间向量基本定理，存在唯一的有序实数组 (x,y,z)，使 p=xa+yb+zc」。阅卷看的就是「不共面」和「唯一」两个词，只写结果不给分。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 共面条件反求系数<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">已知 {a,b,c} 是空间的一个基底，p = a + 2b + zc。<br>（1）若 p 与 a、b 共面，求 z 的值；<br>（2）反过来，若 z ≠ 0，p 与 a、b 还共面吗？说明理由。<br>陷阱：条件是「{a,b,c} 是基底」，不是「a、b、c 是三个向量」。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题：先把「基底」翻译成条件</p>
<p class="s-b">{a,b,c} 是空间的一个基底 ⇒ a、b、c 不共面 ⇒ 由空间向量基本定理，任一空间向量关于这组基底的分解存在且唯一。</p>
<p class="s-k">用到：基底必须不共面；分解唯一。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 把「共面」翻译成系数</p>
<p class="s-b">p 与 a、b 共面 ⇔ 存在实数 m、n，使 <span class="gx-fml">p = m a + n b</span>（平面向量基本定理，a、b 不共线）。也就是说：p 的分解式里 c 的系数必须为 0。</p>
<p class="s-k">用到：共面 ⇔ 能用平面内两个不共线向量表示。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 比系数，一次定值</p>
<p class="s-b"><span class="gx-fml">p = 1·a + 2·b + z·c</span> 与 <span class="gx-fml">p = m·a + n·b + 0·c</span> 是同一个 p 关于同一组基底的两种写法。由分解唯一，系数必须逐项相等：m=1，n=2，<b>z=0</b>。</p>
<p class="s-k">用到：分解唯一 ⇒ 系数对应相等（这是「比系数法」的合法性来源）。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 反面追问：z≠0 呢</p>
<p class="s-b">若 z≠0，则 p − a − 2b = z·c ≠ 0，即 c = (1/z)(p − a − 2b)。一旦 p 落在 a、b 张成的平面内，c 也成了 a、b 的线性组合，三个向量就共面，与「{a,b,c} 是基底」矛盾。所以 z≠0 时 p 一定不在该平面内。</p>
<p class="s-k">用到：反证 + 基底必须不共面。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 4</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）因为 {a,b,c} 是空间的一个基底，所以 a、b、c 不共面，任一空间向量关于它的分解唯一。又 p 与 a、b 共面，故存在实数 m、n 使 p = m a + n b，即 p = m a + n b + 0·c。与 p = a + 2b + z c 比较系数，由分解唯一得 z = 0。<br>（2）不共面。若 z ≠ 0，由 p = a + 2b + z c 得 c = (1/z)·p − (1/z)·a − (2/z)·b。若 p 与 a、b 共面，则 c 可写成 a、b 的线性组合，于是 a、b、c 共面，与 {a,b,c} 是基底矛盾。故 z ≠ 0 时 p 不在 a、b 张成的平面内，三个基向量都得用上。<br>答：z = 0。</p>
</div>
</div>
</section>
<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「基底到底要几个向量？两个不行吗？」</p>
<p class="a">空间的基底要 <b>三个</b>，而且必须<b>不共面</b>。平面是二维，两个不共线就够；空间多了一维，就得多一个把向量「挑出平面」的基向量。少一个只能张成平面或直线。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="三个不共面向量张成空间">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<circle cx="70" cy="98" r="2.5" fill="#151a21"/>
<line x1="70" y1="98" x2="150" y2="98" stroke="#b8402f" stroke-width="2"/>
<line x1="70" y1="98" x2="120" y2="70" stroke="#2563eb" stroke-width="2"/>
<line x1="70" y1="98" x2="70" y2="34" stroke="#2f8a5b" stroke-width="2"/>
<text x="155" y="102" font-size="9" fill="#b8402f">a</text>
<text x="124" y="66" font-size="9" fill="#2563eb">b</text>
<text x="60" y="32" font-size="9" fill="#2f8a5b" text-anchor="end">c</text>
<text x="196" y="30" font-size="8.5" fill="#5a6472" text-anchor="end">三个，不共面</text>
</svg>
</div>
<div class="qac">
<p class="q">「我随手拿三个向量，只要数量够就能当基底吧？」</p>
<p class="a">不能。三个向量<b>共面</b>就只张成一张平面，秩仍是 2，平面外的向量写不出来，<b>共面的三个向量不能作基底</b>。判断只看一条：不共面。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="三个共面向量不能作基底">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<polygon points="24,88 170,72 216,104 70,120" fill="#e8f1fb" stroke="#a9c8e8"/>
<line x1="70" y1="96" x2="120" y2="90" stroke="#b8402f" stroke-width="1.8"/>
<line x1="70" y1="96" x2="104" y2="78" stroke="#2563eb" stroke-width="1.8"/>
<line x1="70" y1="96" x2="134" y2="86" stroke="#2f8a5b" stroke-width="1.8"/>
<text x="200" y="34" font-size="9" font-weight="700" fill="#b8402f" text-anchor="end">✗ 共面不行</text>
<text x="30" y="34" font-size="8.5" fill="#5a6472">只张成一张平面</text>
</svg>
</div>
<div class="qac">
<p class="q">「凭什么说 (x,y,z) 唯一？换种凑法不行吗？」</p>
<p class="a">反证：若 p = x a+y b+z c = x′a+y′b+z′c，相减得 (x−x′)a+(y−y′)b+(z−z′)c = <b>0</b>。三个向量不共面，这个等式只可能三个系数全为 0，故 x=x′、y=y′、z=z′，<b>分解唯一</b>。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="两面写法的差为零向量">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="120" y="46" font-size="9" fill="#3a3a35" text-anchor="middle">(x−x′)a+(y−y′)b+(z−z′)c = 0</text>
<text x="120" y="72" font-size="9" fill="#2f8a5b" text-anchor="middle">不共面 ⇒ 三个系数全为 0</text>
<text x="120" y="96" font-size="9" font-weight="700" fill="#2563eb" text-anchor="middle">⇒ x=x′、y=y′、z=z′</text>
</svg>
</div>
<div class="qac">
<p class="q">「算出 z=0，是不是说明 c 没用、基底只剩两个？」</p>
<p class="a">不是。z=0 只说明 <b>p 与 a、b 共面</b>，p 这个向量用不到 c；{a,b,c} 仍然是空间的一个基底。只有当所有要研究的向量都落在同一张平面内时，才谈得上「基底退化成两个」。此时 <span class="gx-fml">p = 1a + 2b + 0·c</span>。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="z 等于 0 时 p 落在平面内">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="26" y1="104" x2="214" y2="80" stroke="#a9c8e8" stroke-width="1.4"/>
<line x1="70" y1="98" x2="180" y2="88" stroke="#2563eb" stroke-width="2"/>
<circle cx="70" cy="98" r="2.5" fill="#151a21"/>
<text x="186" y="84" font-size="9" fill="#2563eb">p</text>
<text x="30" y="34" font-size="8.5" fill="#5a6472">p 在平面内，z 的系数为 0</text>
</svg>
</div>
<div class="qac">
<p class="q">「零向量也能算基向量吧，反正凑够三个了？」</p>
<p class="a">不能。零向量与<b>任何</b>向量共面，三个向量里夹一个零向量必然共面，作不了基底；而且它指不出任何方向，一个方向都张不开。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="零向量不能作基向量">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<circle cx="86" cy="76" r="3" fill="#b8402f"/>
<text x="96" y="80" font-size="9" fill="#b8402f">0（零向量，长度 0）</text>
<text x="86" y="52" font-size="9" font-weight="700" fill="#b8402f" text-anchor="middle">✗</text>
<text x="120" y="108" font-size="8.5" fill="#5a6472" text-anchor="middle">零向量与任何向量共面</text>
</svg>
</div>
<div class="qac">
<p class="q">「同一个 p，换个基底坐标就不一样了？」</p>
<p class="a">会变。坐标是「关于某组基底的<b>分解系数</b>」，p 本身不变，(x,y,z) 随基底变。<b>分解唯一</b>指的是「同一组基底内唯一」，不是「跨基底不变」。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="换基底坐标改变">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<rect x="18" y="20" width="94" height="92" rx="6" fill="#ffffff" stroke="#dde4ea"/>
<rect x="128" y="20" width="94" height="92" rx="6" fill="#ffffff" stroke="#dde4ea"/>
<line x1="40" y1="92" x2="100" y2="92" stroke="#b8402f" stroke-width="1.6"/>
<line x1="40" y1="92" x2="40" y2="44" stroke="#2f8a5b" stroke-width="1.6"/>
<line x1="150" y1="92" x2="210" y2="74" stroke="#b8402f" stroke-width="1.6"/>
<line x1="150" y1="92" x2="150" y2="44" stroke="#2f8a5b" stroke-width="1.6"/>
<text x="65" y="42" font-size="8.5" fill="#3a3a35" text-anchor="middle">(1, 2, 0)</text>
<text x="175" y="42" font-size="8.5" fill="#3a3a35" text-anchor="middle">(2, 1, 1)</text>
<text x="65" y="108" font-size="8" fill="#6b7280" text-anchor="middle">基底 e₁,e₂,e₃</text>
<text x="175" y="108" font-size="8" fill="#6b7280" text-anchor="middle">基底 a,b,c</text>
</svg>
</div>
</div>
<p class="gx-note">六问其实是一件事：定理的两个词——「不共面」保证分解写得出来，「唯一」保证 (x,y,z) 配叫坐标。哪一问拿不准，就回到这两个词上找答案。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 任意三个向量都能作空间的一个基底。</p>
<p class="er-v">✓ 任意三个<b>不共面</b>的向量都可以构成空间的一个基底。</p>
<p class="er-w">错在哪：把「三个」当成了充分条件。三个共面向量只张成一张平面，秩是 2，作不了基底。</p>
</div>
<div class="er">
<p class="er-x">✗ 同一个 p 的分解不唯一，可以凑出好几种 (x,y,z)。</p>
<p class="er-v">✓ 基底选定后，有序实数组 (x,y,z) 由空间向量基本定理唯一确定。</p>
<p class="er-w">错在哪：漏掉「唯一」。不唯一，坐标就无从定义，后面的建系运算全部失效。</p>
</div>
<div class="er">
<p class="er-x">✗ p = a + 2b + 0·c，所以基底退化成 {a,b} 两个基向量。</p>
<p class="er-v">✓ p 与 a、b 共面，z=0 只说明 p 用不到 c；{a,b,c} 仍是空间的一个基底。</p>
<p class="er-w">错在哪：把「某个向量的系数为 0」当成「基底少了一个向量」。退化的是这向量的分解，不是基底。</p>
</div>
<div class="er">
<p class="er-x">✗ 再加个零向量，凑够三个就能当基底。</p>
<p class="er-v">✓ 基向量都必须是非零向量；含零向量的三个向量必然共面。</p>
<p class="er-w">错在哪：零向量与任何向量共面，一加进来整组就共面了，连方向都提供不了。</p>
</div>
<div class="er">
<p class="er-x">✗ 基向量必须是单位向量，最好还两两垂直。</p>
<p class="er-v">✓ 基向量只要求三个向量不共面，长度、夹角都不限。</p>
<p class="er-w">错在哪：把「单位正交基底」当成了唯一合法的基底。单位正交只是最方便的一种，不是必须的。</p>
</div>
<div class="er">
<p class="er-x">✗ 基底换了，p 的坐标还是 (x,y,z)。</p>
<p class="er-v">✓ 换基底，同一个 p 的分解系数会变；坐标是「关于某组基底」的。</p>
<p class="er-w">错在哪：把坐标当成向量本身的属性。向量是客观的，坐标依赖基底，写坐标必须说明用哪组基底。</p>
</div>
<div class="er">

<script>
/* 互动脚本本体（由 build-page.mjs 包进 <script> 里，所以这里不要写 <script> 标签） */
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var GX = window.GX, el = GX.el, tx = GX.tx, $ = GX.$;
  var stage = $("gxStage");
  if (!stage || !window.AutoPilot) return;

  /* 两套坐标：宽屏 880×470，窄屏独立 360×700 */
  var W = {
    vb: "0 0 880 470",
    left: { x: 16, y: 16, w: 424, h: 438, k: 70, ox: 95, oy: 352, lab: [244, 340] },
    right: { x: 456, y: 16, w: 408, h: 438 }
  };
  var N = {
    vb: "0 0 360 700",
    left: { x: 8, y: 8, w: 344, h: 300, k: 44, ox: 130, oy: 253, lab: [236, 242] },
    right: { x: 8, y: 320, w: 344, h: 372 }
  };
  var L = W, A = 0, G = null;

  /* 三个不共面的基向量（示意，非真实夹角） */
  var VA = [1, 0, 0], VB = [0.5, 0.87, 0], VC = [0.25, 0.15, 0.96];
  var C_A = "#b8402f", C_B = "#2563eb", C_C = "#b8791f", C_P = "#1d4ed8";

  function fmt(v) {
    var r = Math.round(v * 10) / 10;
    return (r === 0 ? 0 : r).toString();
  }

  /* 纯函数：参数 → 数值。render() 和 __model.cases 都用它 */
  function calc(v) {
    var z = Math.round(Number(v) * 10) / 10 || 0;
    return { x: 1, y: 2, z: z, coef: [1, 2, z], inPlane: z === 0 ? 1 : 0, d: Math.abs(z) };
  }

  function wrap(parent, x, y, s, maxW, fs, col, lh) {
    var per = Math.max(6, Math.floor(maxW / fs)), lines = [], cur = "";
    for (var i = 0; i < s.length; i++) { cur += s.charAt(i); if (cur.length >= per) { lines.push(cur); cur = ""; } }
    if (cur) lines.push(cur);
    for (var k = 0; k < lines.length; k++) tx(parent, x, y + k * lh, lines[k], col, "start", fs, 400);
  }

  function geom() { return L; }
  function pr(q) {
    var k = G.left.k, ox = G.left.ox, oy = G.left.oy;
    return [ox + k * (0.86 * q[0] + 0.42 * q[1]), oy - k * (0.5 * q[1] + 0.86 * q[2])];
  }
  function arrow(g, p0, p1, col, w, dash) {
    el("line", { x1: p0[0], y1: p0[1], x2: p1[0], y2: p1[1], stroke: col, "stroke-width": w, "stroke-linecap": "round", "stroke-dasharray": dash || "none" }, g);
    var dx = p1[0] - p0[0], dy = p1[1] - p0[1], d = Math.sqrt(dx * dx + dy * dy) || 1;
    dx /= d; dy /= d;
    var bx = p1[0] - dx * 10, by = p1[1] - dy * 10;
    el("polygon", { points: p1[0] + "," + p1[1] + " " + (bx - dy * 4.4) + "," + (by + dx * 4.4) + " " + (bx + dy * 4.4) + "," + (by - dx * 4.4), fill: col }, g);
  }

  function draw() {
    var gA = $("gxA"), gB = $("gxB");
    gA.textContent = ""; gB.textContent = "";
    var s = calc(A), P = G.left, R = G.right, z = s.z;
    el("rect", { x: P.x, y: P.y, width: P.w, height: P.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    tx(gA, P.x + 18, P.y + 26, "三个不共面的基向量与 p", "#5a6472", "start", 10.5, 700);

    var O = pr([0, 0, 0]), Pa = pr(VA), Pb = pr(VB), Pc = pr(VC);
    var Pab = pr([2, 1.74, 0]), Pp = pr([2 + 0.25 * z, 1.74 + 0.15 * z, 0.96 * z]);

    /* a、b 张成的平面 */
    var cs = [[-0.2, -0.2], [2.2, -0.2], [2.2, 2.4], [-0.2, 2.4]], pts = [];
    for (var i = 0; i < 4; i++) { var q = pr([cs[i][0] + 0.5 * cs[i][1], 0.87 * cs[i][1], 0]); pts.push(q[0] + "," + q[1]); }
    el("polygon", { points: pts.join(" "), fill: "#e8f1fb", stroke: "#a9c8e8", "stroke-width": 1 }, gA);
    tx(gA, P.lab[0], P.lab[1], "平面：a、b 张成", "#7b8794", "end", 9.4, 400);

    /* 分解链：O → a → a+2b → +z c = p */
    el("line", { x1: Pa[0], y1: Pa[1], x2: Pab[0], y2: Pab[1], stroke: "#9aa3ad", "stroke-width": 1.1, "stroke-dasharray": "5 4" }, gA);
    if (z !== 0) el("line", { x1: Pab[0], y1: Pab[1], x2: Pp[0], y2: Pp[1], stroke: C_C, "stroke-width": 1.8, "stroke-dasharray": "5 4" }, gA);

    arrow(gA, O, Pa, C_A, 2.2);
    arrow(gA, O, Pb, C_B, 2.2);
    arrow(gA, O, Pc, C_C, 1.8, "5 4");
    arrow(gA, O, Pp, C_P, 2.8);

    el("circle", { cx: O[0], cy: O[1], r: 3, fill: "#151a21" }, gA);
    tx(gA, Pa[0] + 10, Pa[1] + 16, "a", C_A, "start", 12.5, 700);
    tx(gA, Pb[0] + 11, Pb[1] - 4, "b", C_B, "start", 12.5, 700);
    tx(gA, Pc[0] - 7, Pc[1] + 2, "c", C_C, "end", 12.5, 700);
    tx(gA, O[0] - 9, O[1] + 15, "O", "#5a6472", "end", 11, 400);
    tx(gA, Pp[0] + 11, Pp[1] - 3, "p", C_P, "start", 13, 700);
    if (Math.abs(z) >= 0.5) {
      tx(gA, (Pab[0] + Pp[0]) / 2 + 9, (Pab[1] + Pp[1]) / 2, "z c", C_C, "start", 10.5, 700);
    }

    /* 右栏：有序实数组 + 三个系数的条形图 */
    el("rect", { x: R.x, y: R.y, width: R.w, height: R.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    tx(gB, R.x + 18, R.y + 30, "p 的有序实数组 (x, y, z)", "#5a6472", "start", 10.5, 700);
    tx(gB, R.x + 18, R.y + 72, "(" + s.x + ", " + s.y + ", " + fmt(z) + ")", C_P, "start", 21, 700);

    var tall = R.h > 400, y0 = R.y + (tall ? 122 : 112), gap = tall ? 40 : 38;
    var tX = R.x + 40, tW = R.w - 96, cx = tX + tW / 2, half = tW / 2, maxA = 2.2;
    var rows = [[s.x, "x", C_B], [s.y, "y", C_B], [z, "z", z === 0 ? "#9aa3ad" : C_C]];
    for (var r = 0; r < 3; r++) {
      var yy = y0 + r * gap, val = rows[r][0];
      tx(gB, R.x + 16, yy + 4, rows[r][1], "#3a3a35", "start", 11, 700);
      el("rect", { x: tX, y: yy - 7, width: tW, height: 14, rx: 7, fill: "#f1f4f7" }, gB);
      el("line", { x1: cx, y1: yy - 10, x2: cx, y2: yy + 10, stroke: "#c9d2da", "stroke-width": 1 }, gB);
      var len = Math.min(Math.abs(val) / maxA, 1) * half;
      if (len > 0.8) {
        el("rect", { x: val >= 0 ? cx : cx - len, y: yy - 7, width: len, height: 14, rx: 4, fill: rows[r][2] }, gB);
      }
      tx(gB, R.x + R.w - 16, yy + 4, fmt(val), "#3a3a35", "end", 11.5, 700);
    }

    var sy = R.y + (tall ? 262 : 240), ok = s.inPlane === 1;
    el("line", { x1: R.x + 18, y1: sy - 16, x2: R.x + R.w - 18, y2: sy - 16, stroke: "#e6e9ee" }, gB);
    tx(gB, R.x + 18, sy, ok ? "z = 0 ⇒ p 落在平面内" : "z ≠ 0 ⇒ p 挑出平面", ok ? "#2f8a5b" : "#b8791f", "start", 12, 700);
    wrap(gB, R.x + 18, sy + 22, ok
      ? "此时 p = 1a + 2b，c 的系数是 0：两个基向量 a、b 就够用，基底在 p 身上退化成两个。"
      : "此时 p 不在 a、b 张成的平面内，三个基向量都得用上，少一个就分解不出来。",
      R.w - 36, 9.6, "#3a3a35", 15);
  }

  function render() {
    if (!G) { L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N; G = geom(); stage.setAttribute("viewBox", L.vb); }
    var s = calc(A), ok = s.inPlane === 1;
    $("gxVa").textContent = fmt(s.z);
    $("gxVb").textContent = "(1, 2, " + fmt(s.z) + ")";
    $("gxVc").textContent = s.d.toFixed(1);
    $("gxVs").textContent = ok ? "两个够用" : "三个都用";
    $("gxVsn").textContent = ok ? "p 与 a、b 共面" : "p 挑出平面";
    $("gxVs").style.color = ok ? "#2f8a5b" : "#b8791f";
    $("gxStBox").style.background = ok ? "#e6f6ee" : "#fdf3e0";
    $("gxStBox").style.borderColor = (ok ? "#2f8a5b" : "#b8791f") + "44";
    draw();
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    G = geom();
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 0 }, { t: 1.2, v: 0 }, { t: 4, v: 1 }, { t: 6.5, v: 1 }, { t: 9, v: -2 }, { t: 11.5, v: 2 }, { t: 13.5, v: 0 }],
    keys: [0, 1, -2, 2],
    value: A, min: -2, max: 2, step: 0.5,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc, cases: [
    { v: 0, eq: { inPlane: 1, z: 0 } },
    { v: 1, eq: { inPlane: 0, z: 1 } },
    { v: -2, eq: { inPlane: 0, z: -2 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
