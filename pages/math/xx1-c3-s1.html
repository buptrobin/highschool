<p class="gx-claim">一句话说清本节最该记住的判断：<b>到两定点距离之和为常数 2a，且 2a 大于 |F₁F₂|</b> 才是椭圆；<b>a² = b² + c²，a 最长</b>。</p>
<div class="gx-meta">
<span><i></i>人教A版选择性必修第一册 第3章第1节</span>
<span><i></i>高二 · 选择性必修第一册</span>
<span><i></i>阅读 12 分钟</span>
<span><i></i>含 1 个互动模型</span>
</div>
<p class="gx-lede">椭圆是圆锥曲线的第一站：它把「到两点的距离之和」变成一条方程，后面双曲线、抛物线都照这个套路走。这一节最容易错的不是公式，而是<b>三个数谁最大</b>——把 c² = a² − b² 记成 c² = a² + b²，焦点会算到短轴上，整题作废。另外，2a 与 |F₁F₂| 的大小关系，是判断「是不是椭圆」的第一道门。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 椭圆的定义<span class="q-src">人教A版选择性必修第一册 · 第3章第1节</span></p>
<p class="q-b">平面内与两个定点 F₁、F₂ 的距离之和等于常数（大于 |F₁F₂|）的点的轨迹叫做椭圆。这两个定点叫做椭圆的焦点，两焦点间的距离叫做椭圆的焦距。</p>
<p class="q-n">→ 翻成人话，这句话由<b>三个条件</b>组成：① 在同一个平面内；② 到两个定点的距离之和等于同一个常数 2a；③ 这个常数<b>大于</b> |F₁F₂|。少第③条就出不来椭圆：2a = |F₁F₂| 时轨迹退化成线段 F₁F₂，2a 小于 |F₁F₂| 时一个点也没有。所以「2a 必须大于 |F₁F₂|」不是补充说明，是定义的一部分。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 标准方程<span class="q-src">人教A版选择性必修第一册 · 第3章第1节</span></p>
<p class="q-b">以经过焦点 F₁、F₂ 的直线为 x 轴，线段 F₁F₂ 的垂直平分线为 y 轴建立直角坐标系，椭圆的标准方程为 <span class="gx-fml">x²/a² + y²/b² = 1（a > b > 0）</span>，其中 <span class="gx-fml">b² = a² − c²</span>。</p>
<p class="q-n">→ 两个要点：① 方程右边的 1 不能丢，分母是<b>平方</b>不是 a、b 本身；② 三个数满足 <span class="gx-fml">c² = a² − b²</span>，等价于 <span class="gx-fml">a² = b² + c²</span>——a 是斜边，所以 <b>a 最大</b>。分母大的那个数就是 a，它对应的轴就是长轴，焦点也在这条轴上。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 离心率<span class="q-src">人教A版选择性必修第一册 · 第3章第1节</span></p>
<p class="q-b">椭圆的焦距与长轴长的比 c/a 叫做椭圆的离心率，用 e 表示，即 <span class="gx-fml">e = c/a</span>。因为 0 &lt; c &lt; a，所以 <span class="gx-fml">0 &lt; e &lt; 1</span>。</p>
<p class="q-n">→ e 只由 c 与 a 的比值决定：e 越接近 1（c 越接近 a，b 越小），椭圆越扁；e 越接近 0（c 趋近 0，b 趋近 a），椭圆越接近圆。记住 <b>0 &lt; e &lt; 1</b>，取不到 0 也取不到 1：e = 0 时两焦点重合、圆不是椭圆的标准形式，e = 1 时 b = 0，曲线退化。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>定义里的条件</th><th>缺了这一条会怎样</th></tr></thead>
<tbody>
<tr><td>平面内两个定点 F₁、F₂（焦距 |F₁F₂| = 2c）</td><td>没有两个焦点，标准方程里的 c 无从谈起，写不出 (±c,0)</td></tr>
<tr><td>到两焦点的距离之和为常数 2a</td><td>P 可以乱跑，轨迹不是曲线，是任意点集</td></tr>
<tr class="key"><td>2a 必须大于 |F₁F₂| = 2c，即 a &gt; c</td><td>2a = 2c 时轨迹是线段 F₁F₂；2a &lt; 2c 时轨迹不存在</td></tr>
<tr><td>a² = b² + c²（a 最大）</td><td>记成 c² = a² + b²，会把焦点放到短轴上，坐标、离心率全错</td></tr>
<tr><td>0 &lt; e &lt; 1</td><td>e 取到 1 表示 b = 0，曲线退化成线段，不再是椭圆</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">背法：先定 a、b（分母开方），再用 <span class="gx-fml">c² = a² − b²</span> 反求 c；最后用 <span class="gx-fml">e = c/a</span> 定形状。顺序反了（先猜 c 再凑 a）必错。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 由标准方程求焦点与离心率<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">已知椭圆 <span class="gx-fml">x²/25 + y²/9 = 1</span>，求它的焦点坐标与离心率。追问：若把方程改成 x²/9 + y²/25 = 1，焦点在哪里？两个小题都要写出 a、b、c 的来源。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 认分母，定 a、b</p>
<p class="s-b">分母 25 &gt; 9，所以 a² = 25、b² = 9，得 a = 5、b = 3。分母大的那个数开方是长半轴，这是唯一判据。</p>
<p class="s-k">用到：标准方程 x²/a² + y²/b² = 1 中 a &gt; b &gt; 0，a² 一定在较大的分母上。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 用 c² = a² − b² 求 c</p>
<p class="s-b">c² = a² − b² = 25 − 9 = 16，所以 c = 4。注意是<b>减</b>：c² = a² − b²，a 最大，别写成 c² = a² + b²。</p>
<p class="s-k">用到：a、b、c 构成的直角三角形，a 是斜边。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 定焦点位置</p>
<p class="s-b">a² 在 x² 下面，说明长轴在 x 轴上，焦点在 x 轴上，坐标是 (±c, 0) = (±4, 0)。写成 (0, ±4) 就是把轴看反了。</p>
<p class="s-k">用到：焦点在长轴（分母大者所在轴）上。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 算离心率</p>
<p class="s-b">e = c/a = 4/5 = 0.8。e 是一个比值，没有单位；0 &lt; 0.8 &lt; 1，符合椭圆的范围。</p>
<p class="s-k">用到：e = c/a，且 0 &lt; e &lt; 1。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 追问：交换分母</p>
<p class="s-b">x²/9 + y²/25 = 1 中 25 &gt; 9，a² = 25 在 y² 下面，长轴在 y 轴上：a = 5、b = 3、c = 4 都不变，但焦点变成 (0, ±4)，e 仍是 4/5。</p>
<p class="s-k">用到：参数由分母大小决定，焦点位置由 a² 所在的轴决定；换个说法——两个方程形状完全一样，只是转了 90°。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">由 x²/25 + y²/9 = 1 知 a² = 25，b² = 9，且 25 &gt; 9，所以 a = 5，b = 3，长轴在 x 轴上。<br>由 c² = a² − b² = 25 − 9 = 16 得 c = 4。<br>所以焦点坐标为 F₁(−4, 0)、F₂(4, 0)，离心率 e = c/a = 4/5 = 0.8。<br>若方程为 x²/9 + y²/25 = 1，则 a² = 25 在 y² 下方，长轴在 y 轴上，焦点为 (0, −4)、(0, 4)，e 仍为 4/5。</p>
</div>
</div>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 由 c² = a² + b² 得 c = √(25 + 9) = √34，所以焦点是 (±√34, 0)。</p>
<p class="er-v">✓ 因为 a 最大，所以 a² = b² + c²，即 c² = a² − b² = 25 − 9 = 16，c = 4，焦点 (±4, 0)。</p>
<p class="er-w">错在哪：把 a、b、c 的加减关系记反了。c 是直角边，只能是 a² 减去 b²；写 c² = a² + b² 会算出 c &gt; a，焦点比顶点还远。</p>
</div>
<div class="er">
<p class="er-x">✗ 到两定点距离之和为 10、两定点相距 12 的点，轨迹是椭圆。</p>
<p class="er-v">✓ 因为 2a = 10 &lt; |F₁F₂| = 12，轨迹不存在；椭圆要求 2a &gt; |F₁F₂|。</p>
<p class="er-w">错在哪：漏了定义括号里的「大于 |F₁F₂|」这个条件。2a 小于焦距时三角形两边之和小于第三边，无解；2a 等于焦距时只有线段。</p>

<div class="er">
<p class="er-x">✗ 这个椭圆很扁，离心率大概是 e = 1.2。</p>
<p class="er-v">✓ 椭圆的离心率满足 0 &lt; e &lt; 1，e 只能无限接近 1，不能取到 1 或超过 1。</p>
<p class="er-w">错在哪：把「很扁」直接等价于 e ≥ 1。e = 1 时 b = 0，曲线退化成线段，不再是椭圆；e 越大只是越扁。</p>
</div>
<div class="er">
<p class="er-x">✗ x²/25 + y²/9 = 1 的焦点是 (0, ±4)。</p>
<p class="er-v">✓ 25 &gt; 9，a² = 25 在 x² 下面，长轴在 x 轴上，焦点是 (±4, 0)。</p>
<p class="er-w">错在哪：焦点坐标的轴写反了。焦点一定在长轴（a² 所在的那条轴）上，本题的 a² 跟着 x² 走。</p>
</div>
<div class="er">
<p class="er-x">✗ 方程 x²/9 + y²/25 = 1 中 a = 3，b = 5，所以 c = √(9 − 25) 算不出来。</p>

<div class="er">
<p class="er-x">✗ 离心率 e = b/a = 3/5。</p>
<p class="er-v">✓ e = c/a = 4/5，离心率是<b>半焦距</b>与长半轴的比，不是短半轴。</p>
<p class="er-w">错在哪：把 c 换成了 b。a、b、c 三个数里，只有 c 与 a 的比刻画「扁」，b/a 虽然也在 (0,1) 内，但它只是 √(1 − e²)。</p>
</div>
<div class="er">
<p class="er-x">✗ 点 P 越靠近长轴端点，|PF₁| + |PF₂| 就越大。</p>

  function calc(v) {
    var b = Number(v), a = 5;
    var c = Math.sqrt(Math.max(0, a * a - b * b));
    return { a: a, b: b, c: c, e: c / a };
  }
  function fmt(x) { return Math.abs(x - Math.round(x)) < 1e-9 ? String(Math.round(x)) : x.toFixed(1); }

  function ln(g, x1, y1, x2, y2, col, w, dash) {
    var o = { x1: x1, y1: y1, x2: x2, y2: y2, stroke: col, "stroke-width": w || 1.2 };
    if (dash) o["stroke-dasharray"] = dash;
    return el("line", o, g);
  }
  function dot(g, x, y, r, col) { return el("circle", { cx: x, cy: y, r: r, fill: col }, g); }

  function geom() {
    var lf = L.left, rt = L.right;
    var s = Math.min((lf.w - 96) / 10, (lf.h - 118) / 10);
    return { s: s, cx: lf.x + lf.w / 2, cy: lf.y + lf.h * 0.56, lf: lf, rt: rt };
  }

  function draw() {
    var d = calc(A), gA = $("gxA"), gB = $("gxB");
    gA.textContent = ""; gB.textContent = "";
    var lf = L.left, rt = L.right, s = G.s, cx = G.cx, cy = G.cy;
    var R = 5 * s;

    el("rect", { x: lf.x, y: lf.y, width: lf.w, height: lf.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    tx(gA, lf.x + 20, lf.y + 28, "坐标轴 + 椭圆（a = 5 固定）", "#5a6472", "start", 10.5, 700);
    tx(gA, lf.x + 20, lf.y + 48, "b = " + fmt(d.b) + "　c = " + d.c.toFixed(2) + "　e = " + d.e.toFixed(3), "#8a94a6", "start", 9.6, 400);

    /* 坐标轴（带箭头与刻度） */
    ln(gA, cx - R - 18, cy, cx + R + 18, cy, "#9aa6b4", 1.1);
    ln(gA, cx, cy + R + 18, cx, cy - R - 18, "#9aa6b4", 1.1);
    el("polygon", { points: (cx + R + 26) + "," + cy + " " + (cx + R + 16) + "," + (cy - 4.5) + " " + (cx + R + 16) + "," + (cy + 4.5), fill: "#9aa6b4" }, gA);
    el("polygon", { points: cx + "," + (cy - R - 26) + " " + (cx - 4.5) + "," + (cy - R - 16) + " " + (cx + 4.5) + "," + (cy - R - 16), fill: "#9aa6b4" }, gA);
    tx(gA, cx + R + 26, cy - 8, "x", "#8a94a6", "middle", 10, 700);
    tx(gA, cx + 9, cy - R - 24, "y", "#8a94a6", "start", 10, 700);
    for (var i = 1; i <= 5; i++) {
      ln(gA, cx + i * s, cy - 3, cx + i * s, cy + 3, "#9aa6b4", 1);
      ln(gA, cx - i * s, cy - 3, cx - i * s, cy + 3, "#9aa6b4", 1);
    }
    tx(gA, cx + R, cy + 15, "5", "#8a94a6", "middle", 9, 400);
    tx(gA, cx - R, cy + 15, "−5", "#8a94a6", "middle", 9, 400);

    /* 极限：b→a 时的圆（虚线参考） */
    el("ellipse", { cx: cx, cy: cy, rx: R, ry: R, fill: "none", stroke: "#c8d2dc", "stroke-width": 1, "stroke-dasharray": "4 4" }, gA);
    /* 椭圆本身 */
    el("ellipse", { cx: cx, cy: cy, rx: R, ry: Math.max(2, d.b * s), fill: "rgba(37,99,235,.07)", stroke: "#2563eb", "stroke-width": 2 }, gA);
    /* 焦点 */
    dot(gA, cx - d.c * s, cy, 4, "#b8402f");
    dot(gA, cx + d.c * s, cy, 4, "#b8402f");
    tx(gA, cx - d.c * s - 6, cy + 20, "F₁", "#b8402f", "end", 9.6, 700);
    tx(gA, cx + d.c * s + 6, cy + 20, "F₂", "#b8402f", "start", 9.6, 700);
    dot(gA, cx, cy, 2.6, "#5a6472");
    tx(gA, cx - 7, cy - 7, "O", "#5a6472", "end", 9.4, 700);

    /* a、b、c 直角三角形：O(0,0)、B(0,b)、F(c,0) */
    var by = cy - d.b * s, fx = cx + d.c * s;
    ln(gA, cx, cy, cx, by, "#b8791f", 1.6);
    ln(gA, cx, cy, fx, cy, "#2f8a5b", 1.6);
    ln(gA, cx, by, fx, cy, "#2563eb", 1.6);
    ln(gA, cx, cy, cx + 11, cy, "#8a94a6", 1);
    ln(gA, cx + 11, cy, cx + 11, cy - 11, "#8a94a6", 1);
    tx(gA, cx - 8, (cy + by) / 2, "b", "#b8791f", "end", 10.5, 700);
    tx(gA, (cx + fx) / 2, cy + 15, "c", "#2f8a5b", "middle", 10.5, 700);
    tx(gA, (cx + fx) / 2 + 10, (cy + by) / 2 - 6, "a", "#2563eb", "start", 10.5, 700);
    tx(gA, cx + 6, by - 6, "B(0, b)", "#b8791f", "start", 8.8, 400);

    /* 右栏：离心率标尺 */
    el("rect", { x: rt.x, y: rt.y, width: rt.w, height: rt.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    tx(gB, rt.x + 20, rt.y + 28, "离心率 e 标尺（0 < e < 1）", "#5a6472", "start", 10.5, 700);
    var x0 = rt.x + 48, x1 = rt.x + rt.w - 48, ry = rt.y + 108;
    ln(gB, x0, ry, x1, ry, "#c8d2dc", 1.4);
    ln(gB, x0, ry, x0 + (x1 - x0) * d.e, ry, "#b8402f", 3);
    ln(gB, x0, ry - 8, x0, ry + 8, "#9aa6b4", 1.2);
    ln(gB, x0 + (x1 - x0) / 2, ry - 6, x0 + (x1 - x0) / 2, ry + 6, "#9aa6b4", 1.2);
    ln(gB, x1, ry - 8, x1, ry + 8, "#9aa6b4", 1.2);
    tx(gB, x0, ry + 19, "0", "#8a94a6", "middle", 9, 400);
    tx(gB, x0 + (x1 - x0) / 2, ry + 19, "0.5", "#8a94a6", "middle", 9, 400);
    tx(gB, x1, ry + 19, "1", "#8a94a6", "middle", 9, 400);
    dot(gB, x0 + (x1 - x0) * d.e, ry, 5.4, "#b8402f");
    tx(gB, x0 + (x1 - x0) * d.e, ry - 16, "e = " + d.e.toFixed(3), "#b8402f", "middle", 10, 700);
    tx(gB, x0, ry + 42, "← 越左越圆", "#2f8a5b", "start", 9.2, 400);
    tx(gB, x1, ry + 42, "越扁 →", "#b8402f", "end", 9.2, 400);

    var ty = ry + 76;
    ln(gB, rt.x + 24, ty - 18, rt.x + rt.w - 24, ty - 18, "#eef1f4", 1);
    tx(gB, rt.x + 24, ty, "c = √(25 − b²) = " + d.c.toFixed(2), "#3a3a35", "start", 9.8, 400);
    tx(gB, rt.x + 24, ty + 20, "e = c / a = " + d.c.toFixed(2) + " / 5", "#3a3a35", "start", 9.8, 400);
    tx(gB, rt.x + 24, ty + 40, "2a = 10.00 ＞ 2c = " + (2 * d.c).toFixed(2), "#2f8a5b", "start", 9.8, 700);
    tx(gB, rt.x + 24, ty + 60, "b → a（4.5）时 c → 0，e → 0", "#5a6472", "start", 9.8, 400);
    tx(gB, rt.x + 24, ty + 80, "0 < e < 1：e 越大越扁", "#b8791f", "start", 9.8, 700);
  }

  function render() {
    if (!G) { L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N; G = geom(); stage.setAttribute("viewBox", L.vb); }
    var s = calc(A), st, col, bg, sn;
    $("gxVa").textContent = fmt(s.b);
    $("gxVb").textContent = s.c.toFixed(2);
    $("gxVc").textContent = s.e.toFixed(3);
    if (s.b <= 2) { st = "很扁"; col = "#b8402f"; bg = "#fbeae7"; sn = "b 小 → c 大 → e 大，越扁"; }
    else if (s.b <= 3.5) { st = "偏扁"; col = "#b8791f"; bg = "#fdf3e0"; sn = "e 居中，椭圆被压着"; }
    else { st = "接近圆"; col = "#2f8a5b"; bg = "#e6f6ee"; sn = "b 逼近 a，e 趋近 0"; }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    draw();
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    stage.setAttribute("viewBox", L.vb);
    G = geom();
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 1 }, { t: 1.2, v: 1 }, { t: 4, v: 4 }, { t: 6.5, v: 4 }, { t: 9, v: 4.5 }, { t: 11.5, v: 4.5 }, { t: 13, v: 2.5 }, { t: 14.5, v: 1 }],
    keys: [1, 2.5, 4, 4.5],
    value: A, min: 1, max: 4.5, step: 0.5,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc, cases: [
    { v: 3, eq: { c: 4, e: 0.8 } },
    { v: 4, eq: { c: 3, e: 0.6 } },
    { v: 4.5, eq: { c: 2.1794, e: 0.4359 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
</body>
</html>
