<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 均值（数学期望）<span class="q-src">人教A版选择性必修第三册 · 第七章第三节</span></p>
<p class="q-b">一般地，若离散型随机变量 X 的分布列为 P(X=xᵢ)=pᵢ（i=1,2,…,n），则称 E(X)=x₁p₁+x₂p₂+…+xₙpₙ 为 X 的均值（数学期望）。</p>
<p class="q-n">→ 翻成人话：这是<b>加权平均</b>——每个取值乘以它自己的概率再求和，概率就是权重，不是把 x₁、x₂、x₃ 加起来除以 3。它成立的<b>条件</b>有两条：① pᵢ ≥ 0；② p₁+p₂+…+pₙ = 1。少第二条，这个「平均」就没有归一化，算出来的数不带任何意义。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 方差与标准差<span class="q-src">人教A版选择性必修第三册 · 第七章第三节</span></p>
<p class="q-b">称 D(X)=(x₁−E(X))²p₁+(x₂−E(X))²p₂+…+(xₙ−E(X))²pₙ 为 X 的方差，并称 √D(X) 为 X 的标准差。方差和标准差都反映了随机变量取值的离散程度。</p>
<p class="q-n">→ 翻成人话：先量每个取值「离均值有多远」（xᵢ−E(X)），再平方，再按概率<b>加权</b>平均。为什么要平方：距离有正有负，直接加权会互相抵消，把「散」抵消成 0；平方后每一项都非负，还能放大远端的偏离。代价是<b>单位跟着平方</b>，所以才要标准差 √D(X) 把单位开回来。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本结论 · 线性性质<span class="q-src">人教A版选择性必修第三册 · 第七章第三节</span></p>
<p class="q-b">对任意实数 a、b，有 E(aX+b)=aE(X)+b；特别地，D(aX+b)=a²D(X)。</p>
<p class="q-n">→ 翻成人话：b 只是把整条分布列<b>整体平移</b>，形状一点没变，所以均值跟着平移、方差一点不动；a 把每个「离均值的距离」都放大成 a 倍，平方之后自然是 a² 倍。这两条式子的差别就是本节最高频的扣分点：<b>E 里 b 留着，D 里 b 没了</b>。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>条件</th><th>满足时成立</th><th>缺了会怎样</th></tr></thead>
<tbody>
<tr><td>pᵢ ≥ 0 且 Σpᵢ = 1</td><td>E(X)、D(X) 的求和才有意义</td><td>概率和不为 1，加权平均失去归一化，答案必错</td></tr>
<tr class="key"><td>每项写成 xᵢ·pᵢ（加权）</td><td>E(X) 是加权平均</td><td>写成 (x₁+x₂+x₃)/3 就退化成算术平均，是本节第一号错</td></tr>
<tr><td>方差每项带 pᵢ</td><td>得到的是「平均平方距离」</td><td>只加 (xᵢ−E(X))² 不加权，得到的是离差平方和，值偏大</td></tr>
<tr><td>常数 b 加在 X 上</td><td>E 平移 b，D 完全不变</td><td>以为 D(aX+b)=a²D(X)+b，多写一个 b</td></tr>
<tr><td>乘数 a 乘在 X 上</td><td>E 乘 a，D 乘 a²</td><td>写成 aD(X)，少乘一次 a，2 倍变 4 倍的地方写成 2 倍</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">背法：把「加权」两个字钉在 E 上，把「平方」两个字钉在 D 上。方差的单位是原数据单位的平方——X 的单位是「元」，D(X) 的单位是「元的平方」，答卷上写「方差 0.49 元」是错的，写「0.49」或「0.49 元的平方」才对。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 由分布列求 E(X)、D(X) 与线性变换<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">已知离散型随机变量 X 的分布列为 P(X=1)=0.2，P(X=2)=0.5，P(X=3)=0.3。求 E(X)、D(X)，以及 E(2X+1)、D(2X+1)。（陷阱：D(2X+1) 不等于 2D(X)+1。）</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题与验算</p>
<p class="s-b">先看概率和：0.2+0.5+0.3=1，且都非负，分布列合法，可以动公式。四个待求量里 E(X)、D(X) 是入口，E(2X+1)、D(2X+1) 一律靠线性性质从 E(X)、D(X) 直接推，不要重算一遍分布列。</p>
<p class="s-k">用到：分布列的合法性（Σpᵢ=1）是加权平均的前提。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 求 E(X)：加权平均</p>
<p class="s-b">E(X)=1×0.2+2×0.5+3×0.3=0.2+1.0+0.9=2.1。<span class="gx-fml">E(X)=x₁p₁+x₂p₂+x₃p₃</span> 每一项都要乘概率；写成 (1+2+3)/3=2 是算术平均，错。</p>
<p class="s-k">用到：均值是加权平均，不是算术平均；2.1 也不在分布列的取值里。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 求 D(X)：先算偏差，再平方，再乘概率</p>
<p class="s-b">偏差：1−2.1=−1.1，2−2.1=−0.1，3−2.1=0.9。平方：1.21、0.01、0.81。乘概率：1.21×0.2=0.242，0.01×0.5=0.005，0.81×0.3=0.243。相加：D(X)=0.242+0.005+0.243=0.49。</p>
<p class="s-k">用到：<span class="gx-fml">D(X)=(x₁−E(X))²p₁+(x₂−E(X))²p₂+(x₃−E(X))²p₃</span>，每一步都带 pᵢ，漏乘概率是第二号错。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 求 E(2X+1)：用线性性质</p>
<p class="s-b">E(2X+1)=2E(X)+1=2×2.1+1=5.2。常数 1 要留着，少了它就变成 4.2。</p>
<p class="s-k">用到：E(aX+b)=aE(X)+b，a 和 b 两个常数都保留。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 求 D(2X+1)：平方进方差，常数不进</p>
<p class="s-b">D(2X+1)=2²·D(X)=4×0.49=1.96。<span class="gx-fml">D(aX+b)=a²D(X)</span>，所以 +1 被完全吃掉；写成 2×0.49=0.98 或 2²×0.49+1=2.96 都是错的。</p>
<p class="s-k">用到：D(aX+b)=a²D(X)，常数 b 不改变方差。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">① 因为 0.2+0.5+0.3=1，分布列合法。<br>
② E(X)=1×0.2+2×0.5+3×0.3=0.2+1.0+0.9=2.1。<br>
③ D(X)=(1−2.1)²×0.2+(2−2.1)²×0.5+(3−2.1)²×0.3=1.21×0.2+0.01×0.5+0.81×0.3=0.242+0.005+0.243=0.49。<br>
④ 由 E(aX+b)=aE(X)+b，得 E(2X+1)=2×2.1+1=5.2。<br>
⑤ 由 D(aX+b)=a²D(X)，得 D(2X+1)=2²×0.49=4×0.49=1.96。<br>
答：E(X)=2.1，D(X)=0.49，E(2X+1)=5.2，D(2X+1)=1.96。</p>
</div>
</div>
</section>
<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「方差公式里为什么要平方？直接算离均差不好吗？」</p>
<p class="a">不好。离均差有正有负，加权相加会互相抵消——X 取 1、2、3 时偏差 −1、0、+1 加起来正好是 0，散得再开也算成 0。<b>平方让每一项都 ≥ 0</b>，还放大远端偏离，才是「离散程度」。代价是单位变成原单位的平方，所以另配一个 σ(X)=√D(X)。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="三个偏差相加为 0">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="30" y1="62" x2="210" y2="62" stroke="#8a94a3"/>
<circle cx="60" cy="62" r="5" fill="#2563eb"/><circle cx="120" cy="62" r="5" fill="#2563eb"/><circle cx="180" cy="62" r="5" fill="#2563eb"/>
<text x="60" y="82" font-size="9" fill="#3a3a35" text-anchor="middle">−1</text>
<text x="120" y="82" font-size="9" fill="#3a3a35" text-anchor="middle">0</text>
<text x="180" y="82" font-size="9" fill="#3a3a35" text-anchor="middle">+1</text>
<text x="120" y="40" font-size="9" fill="#b8402f" text-anchor="middle">相加 = 0，散被抵消</text>
<text x="120" y="106" font-size="9" fill="#2f8a5b" text-anchor="middle">平方后 1+0+1=2，平均 2/3</text>
</svg>
</div>
<div class="qac">
<p class="q">「D(aX+b) 里 a 和 b 各自怎么进？」</p>
<p class="a"><b>D(aX+b)=a²D(X)</b>：a 平方后进方差，b 一点不进。a 把每个离均差放大 a 倍，平方就成 a² 倍；b 只是整体平移，形状没变。<b>常数 b 不改变方差</b>，写成 a²D(X)+b 是本单元最高频的错。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="a 平方进方差，b 不进">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<circle cx="40" cy="46" r="4" fill="#2563eb"/><circle cx="56" cy="46" r="4" fill="#2563eb"/><circle cx="72" cy="46" r="4" fill="#2563eb"/>
<circle cx="40" cy="92" r="4" fill="#b8791f"/><circle cx="72" cy="92" r="4" fill="#b8791f"/><circle cx="104" cy="92" r="4" fill="#b8791f"/>
<text x="34" y="34" font-size="9" fill="#5a6472">X 间距 1</text>
<text x="34" y="112" font-size="9" fill="#b8791f">aX 间距 a</text>
<text x="150" y="52" font-size="9" fill="#b8402f">方差 ×a²</text>
<text x="150" y="70" font-size="9" fill="#2f8a5b">+b 方差不变</text>
</svg>
</div>
<div class="qac">
<p class="q">「均值一定是分布列里的某个取值吗？」</p>
<p class="a">不一定。E(X) 是<b>加权平均</b>，是支点位置，可以落在两个取值中间：P(X=1)=0.2、P(X=2)=0.5、P(X=3)=0.3 时 E(X)=2.1，2.1 就不是 X 的取值。<b>均值是加权平均不是算术平均</b>，所以它也不必等于「中间那个」。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="支点 2.1 落在两个取值之间">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="26" y1="70" x2="214" y2="70" stroke="#8a94a3"/>
<circle cx="50" cy="70" r="5" fill="#2563eb"/><circle cx="110" cy="70" r="5" fill="#2563eb"/><circle cx="170" cy="70" r="5" fill="#2563eb"/>
<path d="M122,72 L110,100 L134,100 Z" fill="#f2c9a0" stroke="#cf8b4a"/>
<text x="50" y="90" font-size="9" fill="#3a3a35" text-anchor="middle">1</text>
<text x="110" y="90" font-size="9" fill="#3a3a35" text-anchor="middle">2</text>
<text x="170" y="90" font-size="9" fill="#3a3a35" text-anchor="middle">3</text>
<text x="122" y="116" font-size="9" fill="#b8791f" text-anchor="middle">E(X)=2.1</text>
</svg>
</div>
<div class="qac">
<p class="q">「方差可能是负数吗？D(X)=0 说明什么？」</p>
<p class="a">不可能为负。每一项 (xᵢ−E(X))²pᵢ 都是「平方 × 非负概率」，<b>求和必 ≥ 0</b>，所以任何算出的负方差都是笔误。D(X)=0 当且仅当 X 以概率 1 取常数，此时没有「散」可言。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="各项非负，柱高都不低于零轴">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="24" y1="96" x2="216" y2="96" stroke="#8a94a3"/>
<rect x="52" y="60" width="30" height="36" rx="3" fill="#cfe3f7" stroke="#7fb0dc"/>
<rect x="106" y="96" width="30" height="0" rx="2" fill="#f6d7d1"/>
<rect x="160" y="46" width="30" height="50" rx="3" fill="#cfe3f7" stroke="#7fb0dc"/>
<text x="67" y="112" font-size="9" fill="#3a3a35" text-anchor="middle">0.31</text>
<text x="121" y="112" font-size="9" fill="#3a3a35" text-anchor="middle">0</text>
<text x="175" y="112" font-size="9" fill="#3a3a35" text-anchor="middle">0.43</text>
<text x="120" y="30" font-size="9" fill="#2f8a5b" text-anchor="middle">每项 ≥ 0，所以 D(X) ≥ 0</text>
</svg>
</div>
<div class="qac">
<p class="q">「标准差和方差到底什么关系，答卷上写哪个？」</p>
<p class="a"><b>σ(X)=√D(X)</b>，方差开方就是标准差。题干要「方差」就写 D(X)=0.49，要「标准差」再写 σ(X)=0.7，<b>别把 0.49 直接当标准差</b>。σ 的好处是单位回到原单位：X 的单位是「元」，D(X) 是「元的平方」，σ(X) 又是「元」。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="面积 0.49 的方块，边长 0.7">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<rect x="52" y="34" width="70" height="70" rx="4" fill="#e8f2ef" stroke="#2f8a5b"/>
<text x="87" y="74" font-size="10" fill="#2f8a5b" text-anchor="middle">面积 0.49</text>
<text x="87" y="120" font-size="9" fill="#5a6472" text-anchor="middle">边长 = √0.49 = 0.7</text>
<text x="150" y="66" font-size="9" fill="#3a3a35">D(X)=0.49</text>
<text x="150" y="84" font-size="9" fill="#2f8a5b" font-weight="700">σ(X)=0.7</text>
</svg>
</div>
<div class="qac">
<p class="q">「E(X+Y) 和 D(X+Y) 都能直接拆开相加吗？」</p>
<p class="a">期望一定能拆：<b>E(X+Y)=E(X)+E(Y)</b>，对任意两个随机变量都成立，不需要独立。方差不行：<b>D(X+Y)=D(X)+D(Y) 只在 X、Y 相互独立时成立</b>；不独立时还多一项协变的部分，不能拆。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="期望可加，方差需独立">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<rect x="30" y="30" width="60" height="26" rx="4" fill="#e8f2ef" stroke="#2f8a5b"/>
<rect x="120" y="30" width="60" height="26" rx="4" fill="#e8f2ef" stroke="#2f8a5b"/>
<text x="60" y="48" font-size="9" fill="#2f8a5b" text-anchor="middle">E(X)+E(Y)</text>
<text x="150" y="48" font-size="9" fill="#2f8a5b" text-anchor="middle">恒成立</text>
<rect x="30" y="72" width="60" height="26" rx="4" fill="#fdf0d8" stroke="#cf8b4a"/>
<text x="60" y="90" font-size="9" fill="#b8791f" text-anchor="middle">D(X)+D(Y)</text>
<text x="150" y="90" font-size="9" fill="#b8791f" text-anchor="middle">需独立</text>
<text x="100" y="48" font-size="9" fill="#5a6472" text-anchor="middle">=</text>
<text x="100" y="90" font-size="9" fill="#5a6472" text-anchor="middle">≠</text>
</svg>
</div>
</div>
<p class="gx-note">六问其实是同一件事：<b>E 只管「搬」，D 只管「散」</b>。抓住这一点，加减常数不影响 D、乘 a 进方差要平方、均值等于支点而不是算术平均，全都是它的推论。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ D(aX+b)=aD(X)</p>
<p class="er-v">✓ D(aX+b)=a²D(X)</p>
<p class="er-w">错在哪：把 a 直接搬进方差，漏了平方。2X+1 时 D=4×0.49=1.96，写成 2×0.49=0.98 就丢了一半。</p>
</div>
<div class="er">
<p class="er-x">✗ 常数 b 会让方差变大，D(aX+b)=a²D(X)+b</p>
<p class="er-v">✓ 常数 b 不改变方差，D(aX+b)=a²D(X)</p>
<p class="er-w">错在哪：b 只是把整条分布列平移，形状没变，散的程度当然不变；被平移的只有均值 E(aX+b)=aE(X)+b。</p>
</div>
<div class="er">
<p class="er-x">✗ D(X)=(1−2.1)²+(2−2.1)²+(3−2.1)²=3.23</p>
<p class="er-v">✓ D(X)=(1−2.1)²×0.2+(2−2.1)²×0.5+(3−2.1)²×0.3=0.49</p>
