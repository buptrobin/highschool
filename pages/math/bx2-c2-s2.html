<p class="gx-claim">复数的四则运算＝<b>实部跟实部、虚部跟虚部</b>的整式运算：乘法里 <b>i² 换成 −1</b>，除法里 <b>分子分母同乘分母的共轭</b>。</p>
<div class="gx-meta">
<span><i></i>人教A版必修第二册 第七章第2节</span>
<span><i></i>高一 · 必修第二册</span>
<span><i></i>阅读 12 分钟</span>
<span><i></i>含 1 个互动模型</span>
</div>
<p class="gx-lede">7.1 把复数写成 a+bi、把点搬进复平面，7.2 才开始真正「算」。这一节的分水岭只有一句话：复数的运算照整式的规矩来，唯一多出来的动作是——碰到 i² 就换成 −1。乘法漏换 i²、除法乘了分母本身而不是它的共轭，就是本节两大失分点。学完这一节，你手上要备三件工具：加减法（合并同类项）、乘除法（展开＋实数化）、z·z̄ = |z|²（把复数变回实数的开关）。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 复数的加法<span class="q-src">人教A版必修第二册 · 第七章第2节</span></p>
<p class="q-b">两个复数的和仍是一个复数，它的实部是原来两个复数实部的和，虚部是原来两个复数虚部的和。</p>
<p class="q-n">→ 翻成人话，这句话压着<b>三个条件</b>：① 和仍然写成 a+bi，不许缩成实数；② 实部只跟实部相加；③ 虚部只跟虚部相加。少掉①就会把「2+3i 与 4−3i 的和是 6」写成结论——虚部没了，但它明明还在，只是算成了 0。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 复数的乘法<span class="q-src">人教A版必修第二册 · 第七章第2节</span></p>
<p class="q-b">(a+bi)(c+di) = (ac−bd) + (ad+bc)i。</p>
<p class="q-n">→ 这个公式不是背出来的，是<b>三个动作</b>做出来的：按多项式展开得 ac+adi+bci+bdi²；把 <b>i² 换成 −1</b>，于是 bdi² 变成 −bd；再把实部、虚部分开写。缺了中间那一步，答案里就会残留一个 i² 项，这是本节第一大扣分点。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 复数的除法<span class="q-src">人教A版必修第二册 · 第七章第2节</span></p>
<p class="q-b">复数除法：分子分母同乘分母的共轭复数，把分母化为实数。</p>
<p class="q-n">→ 两个条件：① 乘的是分母 c+di 的<b>共轭</b> c−di，不是 c+di 本身；② 分子、分母必须<b>同时乘</b>，值才不变。乘错成 c+di，分母变成 (c+di)²，仍然是复数，「实数化」这一步就白做了。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>运算</th><th>必须做到的动作</th><th>漏了会怎样</th></tr></thead>
<tbody>
<tr><td>加法 / 减法</td><td>实部加实部、虚部加虚部，结果仍写成 a+bi</td><td>减去 c+di 时只减了实部，虚部符号没变</td></tr>
<tr class="key"><td>乘法</td><td>展开后把 i² 换成 −1，bd 随之变成 −bd</td><td>答案里残留 i² 项，实部虚部全错</td></tr>
<tr><td>除法</td><td>分子分母同乘分母的共轭 c−di</td><td>分母仍是复数，没有完成实数化</td></tr>
<tr><td>共轭的乘积</td><td>z·z̄ = a²+b² = |z|²，结果是实数</td><td>以为结果还是复数，或把共轭当成绝对值</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只高亮了一行（乘法），因为它是本节唯一「公式和直觉打架」的地方：三次展开人人会，i² 换成 −1 却总有人忘。背法：加法照抄、乘法换 i²、除法乘共轭。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 复数乘法与除法<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">计算：(1) (1+2i)(3−i)；(2) (1+2i)÷(3−i)。第(2)问要求结果写成 a+bi 的形式，并写出分母变成了哪个实数。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题 | 两个小题，先乘后除</p>
<p class="s-b">第(1)问是乘法，直接按多项式展开；第(2)问是除法，分母 3−i 不是实数，先找它的共轭。</p>
<p class="s-k">用到：复数乘法照整式展开、除法要「分母实数化」。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 展开 | 先不动 i²</p>
<p class="s-b"><span class="gx-fml">(1+2i)(3−i) = 1·3 + 1·(−i) + 2i·3 + 2i·(−i) = 3 − i + 6i − 2i²</span></p>
<p class="s-k">用到：多项式乘法（每一项都要乘到），此时 −2i² 先原样保留。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 换 i² | 把 i² 换成 −1</p>
<p class="s-b">因为 <span class="gx-fml">i² = −1</span>，所以 <span class="gx-fml">−2i² = −2×(−1) = +2</span>，于是 <span class="gx-fml">3 − i + 6i + 2 = 5 + 5i</span>。</p>
<p class="s-k">用到：乘法里 i² 换成 −1，−bd 的负号就是从这一步来的。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 除法填空 | 分子分母同乘共轭 3+i</p>
<p class="s-b">分母 3−i 的共轭是 3+i，分子分母同乘它：<span class="gx-fml">(1+2i)÷(3−i) = (1+2i)(3+i) / [(3−i)(3+i)]</span>。</p>
<p class="s-k">用到：除法乘共轭；分母 <span class="gx-fml">(3−i)(3+i) = 3²+1² = 10</span>，i 消失了。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 收尾 | 分子展开并检查</p>
<p class="s-b">分子 <span class="gx-fml">(1+2i)(3+i) = 3 + i + 6i + 2i² = 1 + 7i</span>，所以结果是 <span class="gx-fml">(1+7i)/10 = 1/10 + 7/10 i</span>。检查：分母是 10，实数，可以写成 a+bi。</p>
<p class="s-k">用到：分子展开时 i² 再换一次 −1；分母实数化完成后才算完。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">(1) (1+2i)(3−i) = 3 − i + 6i − 2i² = 3 + 5i − 2i²；由 i² = −1 得 −2i² = 2，故原式 = 5 + 5i。<br>
(2) (1+2i)÷(3−i) = (1+2i)(3+i) / [(3−i)(3+i)] = (3 + i + 6i + 2i²)/10 = (1+7i)/10 = 1/10 + 7/10 i。<br>
其中分母 (3−i)(3+i) = 3²+1² = 10，是实数；乘的 3+i 是 3−i 的共轭，不是 3−i 本身。</p>
</div>
</div>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「乘法展开完，那个 i² 到底要不要动？」</p>
<p class="a">必须动。<b>i² = −1 是规定，不是字母</b>；把 i² 换成 −1，2i² 才变成 −2，实部和虚部才能各自合并。留着 i² 等于没算完。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="把 i 平方换成负一后实部合并">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text class="ms" x="120" y="40" text-anchor="middle" font-size="10">3 + 5i − 2i²</text>
<text class="ms" x="120" y="64" text-anchor="middle" font-size="9">↓ i² 换成 −1</text>
<text class="ms" x="120" y="90" text-anchor="middle" font-size="10" font-weight="700">3 + 5i + 2 = 5 + 5i</text>
<text class="ms" x="120" y="112" text-anchor="middle" font-size="8.6">换掉之后，实部才真正合并</text>
</svg>
</div>
<div class="qac">
<p class="q">「乘 i 在复平面上干了什么？」</p>
<p class="a">逆时针转 90°，长度不变。因为 |i|=1、arg i=90°，<b>乘法＝模相乘＋辐角相加</b>，所以乘 i 只旋转不伸缩；连乘两次 i 就是转 180°，等于乘 −1。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="乘 i 是逆时针转九十度">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="40" y1="100" x2="204" y2="100" stroke="#94a3b8" stroke-width="1.1"/>
<line x1="40" y1="100" x2="40" y2="34" stroke="#94a3b8" stroke-width="1.1"/>
<path d="M 100 100 A 60 60 0 0 0 40 40" fill="none" stroke="#b8791f" stroke-width="1.3"/>

<text class="ms" x="28" y="38" font-size="8.6">i</text>
<text class="ms" x="120" y="70" font-size="8.6">逆时针 90°</text>
</svg>
</div>
<div class="qac">
<p class="q">「除法为什么乘共轭，乘分母本身不行吗？」</p>
<p class="a">不行。分母实数化只能用 <b>(c+di)(c−di) = c²+d²</b>，(c+di)² 展开后仍带 i，分母还是复数。所以除法的动作是「分子分母同乘分母的共轭」，缺一个条件都不算完成。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="乘共轭得到实数，乘本身仍是复数">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<rect x="20" y="26" width="200" height="34" rx="6" fill="#e6f6ee" stroke="#9fd7bc"/>
<text class="ms" x="32" y="47" font-size="9">✓ 同乘 c−di：分母 = c²+d²</text>
<rect x="20" y="70" width="200" height="34" rx="6" fill="#fbeae7" stroke="#e8b4ab"/>
<text class="ms" x="32" y="91" font-size="9">✗ 同乘 c+di：分母仍带 i</text>
</svg>
</div>
<div class="qac">
<p class="q">「两个共轭复数乘起来是什么？」</p>
<p class="a">是实数。<b>z·z̄ = (a+bi)(a−bi) = a²+b² = |z|²</b>，交叉项 +abi 与 −abi 正好抵消。这就是把复数变回实数的开关，除法靠它，求模也靠它。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="共轭相乘得到实数的平方">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="26" y1="66" x2="214" y2="66" stroke="#94a3b8" stroke-width="1.1"/>

<circle cx="168" cy="90" r="3.4" fill="#2f8a5b"/>
<text class="ms" x="178" y="42" font-size="8.6">z</text>
<text class="ms" x="178" y="94" font-size="8.6">z̄</text>
<text class="ms" x="120" y="122" text-anchor="middle" font-size="8.6">关于实轴对称，乘起来 = a²+b²</text>
</svg>
</div>
<div class="qac">
<p class="q">「两个复数相加，结果是实数还是复数？」</p>
<p class="a">仍是复数，写成 a+bi。<b>只有当虚部之和恰好为 0 时</b>，结果才落在实轴上（如 (2+3i)+(4−3i)=6）。另外：<b>两个虚数不能比较大小</b>，只能判断相等或不相等。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="两个复数的和落在实轴上的情形">

<line x1="26" y1="86" x2="216" y2="86" stroke="#94a3b8" stroke-width="1.1"/>

<div class="qac">
<p class="q">「z·z̄ 和 |z|² 是一回事吗？」</p>
<p class="a">是同一个数：<b>z·z̄ = a²+b² = |z|²</b>，非负实数。但 <b>共轭不是绝对值</b>：z̄ 仍是复数（一个点），|z| 是长度（一个数），别把两者混着写。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="z 乘 z 共轭等于模的平方">

<text class="ms" x="120" y="70" text-anchor="middle" font-size="9">(a+bi)(a−bi) = a²+b²</text>
<text class="ms" x="120" y="96" text-anchor="middle" font-size="9">结果是非负实数，不是复数</text>
<text class="ms" x="120" y="116" text-anchor="middle" font-size="8.6">共轭改的是虚部符号，不是长度</text>
</svg>

<p class="gx-note">六问其实是同一件事：复数运算＝整式运算 + <b>i² 换成 −1</b> + <b>除法乘共轭</b>。前两问管乘法，后三问管除法与共轭，第五问提醒你别把复数当实数用——它不能比大小。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ (a+bi)(c+di) = ac + bdi</p>
<p class="er-v">✓ (a+bi)(c+di) = ac + adi + bci + bdi² = (ac−bd) + (ad+bc)i</p>
<p class="er-w">错在哪：把两个二项式相乘写成了「首项乘首项、尾项乘尾项」，漏掉两条交叉项；即使展开对了，还要再走一步 i² 换成 −1。</p>
</div>
<div class="er">
<p class="er-x">✗ i² = 1，所以 2i² = 2</p>
<p class="er-v">✓ i² = −1，所以 2i² = −2</p>
<p class="er-w">错在哪：符号记反。乘法里 i² 换成 −1，bd 那一项才带负号；记成 +1 会让实部整体偏大 2bd。</p>
</div>
<div class="er">
<p class="er-x">✗ 除法就把分子分母都乘 (c+di)</p>
<p class="er-v">✓ 分子分母同乘分母的共轭 (c−di)，使分母变成 c²+d²</p>
<p class="er-w">错在哪：乘错了对象。乘 c+di 得 (c+di)²，分母仍是复数，根本没有实数化，这一步等于白做。</p>
</div>
<div class="er">
<p class="er-x">✗ 共轭就是取绝对值，z̄ = |z|</p>
<p class="er-v">✓ z̄ = a−bi 仍是复数；|z| = √(a²+b²) 是实数</p>
<p class="er-w">错在哪：把「点」和「长度」混了。共轭只把虚部变号，模是非负实数，两者由 z·z̄ = |z|² 联系，不是相等。</p>
</div>
<div class="er">
<p class="er-x">✗ z·z̄ 的结果还是复数，写成 a²+b²+0i 就行</p>
<p class="er-v">✓ z·z̄ = a²+b² = |z|²，是一个实数</p>
<p class="er-w">错在哪：虚部确实是 0，但结论要写「实数」；写成 0i 说明你还没意识到交叉项已经抵消干净了。</p>
</div>
<div class="er">
<p class="er-x">✗ 复数加法时要把 i² 项合并进去</p>
<p class="er-v">✓ 加减法只合并实部与实部、虚部与虚部，不出现 i²</p>
<p class="er-w">错在哪：把乘法的动作搬到加法上。加减法是「照抄结构、各自合并」，整式加减里不会有二次项。</p>
</div>
<div class="er">
<p class="er-x">✗ 因为 3+2i 与 1+5i 都是复数，所以 3+2i &lt; 1+5i</p>
<p class="er-v">✓ 两个复数（只要不都是实数）不能比较大小，只能判断相等或不相等</p>
<p class="er-w">错在哪：复数没有大小顺序。不等式只对实数成立；要比较就先化成实数（如比较模），否则不能写 &lt; 或 &gt;。</p>
</div>
