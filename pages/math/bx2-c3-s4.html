<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 基本事实 1<span class="q-src">人教A版必修第二册 · 第八章第4节</span></p>
<p class="q-b">过不在一条直线上的三个点，有且只有一个平面。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个条件</b>组成——①有三个点；②这三个点「不在一条直线上」；③「有且只有一个」= 存在且唯一。缺第 ② 个会怎样？三点共线时，过这条直线的平面有无数个，平面就定不下来。所以「三点确定平面」这句话本身是错的，必须补上「不共线」。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 基本事实 2<span class="q-src">人教A版必修第二册 · 第八章第4节</span></p>
<p class="q-b">如果一条直线上的两个点在一个平面内，那么这条直线在这个平面内。</p>
<p class="q-n">→ 翻成人话：条件只有<b>两个</b>——①直线上有两个点；②这两个点都在同一个平面内。结论是整条直线都在这个平面内。这是判定「线在面内」的唯一依据：想说明一条线躺在面里，就去面上找它的两个点，别去数公共点。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 异面直线的定义<span class="q-src">人教A版必修第二册 · 第八章第4节</span></p>
<p class="q-b">不同在任何一个平面内的两条直线叫做异面直线。</p>
<p class="q-n">→ 翻成人话：关键词是「任何<b>一个</b>」。只要找得到一个平面同时装下这两条线，它们就叫共面直线；找不到，才叫异面。所以判异面的正确顺序是「先判共面，再看公共点」，只盯「有没有交点」一定出事——异面 ≠ 不相交。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>结论</th><th>需要的条件</th><th>缺了这个条件会怎样</th></tr></thead>
<tbody>
<tr><td>基本事实 1 · 三点定面</td><td>① 有三个点　② 三点不在同一条直线上</td><td>只给两个点 → 平面有无数个；三点共线 → 平面也有无数个</td></tr>
<tr><td>基本事实 2 · 线在面内</td><td>直线上的两个点都在这个平面内</td><td>只知一个点在面内 → 只能得到「直线过这个点」，定不了整条线在面内</td></tr>
<tr class="key"><td>异面直线</td><td>不同在任何一个平面内</td><td>只写「不相交」→ 把平行线也算成异面，判定整题作废</td></tr>
<tr><td>基本事实 3 · 面面相交</td><td>两个不重合的平面有一个公共点</td><td>漏写「不重合」→ 重合的平面有无数个公共点，不是一条直线</td></tr>
<tr><td>直线与平面平行</td><td>直线在平面外，且与平面没有公共点</td><td>漏写「在平面外」→ 把「直线在平面内」也当成平行，这是第三种关系</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">全表只高亮 1 行，就是异面那行。背法一句话：<b>先问共不共面，再问几个公共点</b>。两个答案一组合，8.4 所有位置关系都能报出名字。注意「直线在平面内」是独立的一种关系，不是相交的特例，也不是平行的特例。</p>
</section>

<span class="fig-no">图 4</span><span class="fig-t">两个平面的两种位置关系</span>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 异面直线的计数<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">在正方体 ABCD-A₁B₁C₁D₁ 中，与棱 AB 异面的棱有几条？分别是哪几条？（陷阱：把「不相交」直接当成「异面」，于是把与 AB 平行的棱也数了进去。）</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题：把「异面」翻译成可操作的判据</p>
<p class="s-b">异面的定义是「不同在任何一个平面内」，所以判异面要两步走：先看这两条线能不能装进同一个平面，再看有没有公共点。只数交点是错的，因为平行也不相交。</p>
<p class="s-k">用到：异面直线的定义（关键词「任何一个平面」）。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 先清掉与 AB 平行的 3 条</p>
<p class="s-b">与 AB 同方向、等长的棱是 CD、A₁B₁、C₁D₁。平行线一定共面（初中的平行定义就要求在同一平面内），既然共面，就不是异面，这 3 条直接排除。</p>
<p class="s-k">用到：平行 ⇒ 共面，共面 ⇒ 不可能是异面。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 再清掉与 AB 相交的 4 条</p>
<p class="s-b">与 AB 有公共点的棱：底面上 BC、DA 分别交 AB 于 B、A；侧面上 BB₁、AA₁ 也分别交 AB 于 B、A。共 4 条。相交的两条线显然共面（两条相交直线确定一个平面），排除。</p>
<p class="s-k">用到：相交 = 共面 + 恰有 1 个公共点。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 剩下 4 条逐条验证</p>
<p class="s-b">B₁C₁ 在顶面 A₁B₁C₁D₁ 内，与 AB 方向不同、无公共点；CC₁、DD₁ 是竖直棱，与 AB 既不相交也不平行；A₁D₁ 在顶面内，与 AB 也无公共点且不平行。这 4 条都找不到同时装下它们与 AB 的平面。反证一句更稳：若 B₁C₁ 与 AB 共面，则 A、B、B₁、C₁ 四点共面，而 B₁、C₁ 在顶面、A、B 在底面，两个平面重合，矛盾。</p>
<p class="s-k">用到：基本事实 1（不共线三点定一个平面）+ 反证法。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 用减法核对</p>
<p class="s-b">12 条棱 − 1 条（AB 自己）− 3 条（与 AB 平行）− 4 条（与 AB 相交）= 4 条，和逐条数出来的结果一致。这就是这类题的通用算法：异面数 = 12 − 1 − 平行数 − 相交数。</p>
<p class="s-k">用到：分类不重不漏——三条一类，加起来必须是 11。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">与棱 AB 异面的棱有 <b>4 条</b>，分别是 B₁C₁、C₁C、D₁D、A₁D₁。<br>
① 与 AB 平行的棱为 CD、A₁B₁、C₁D₁，平行线必共面，故不是异面；<br>
② 与 AB 相交的棱为 BC、DA、BB₁、AA₁，相交线必共面，故不是异面；<br>
③ 余下 B₁C₁、C₁C、D₁D、A₁D₁ 与 AB 既不平行也无公共点，不同在任何一个平面内，故为异面直线；<br>
④ 核对：12 − 1 − 3 − 4 = 4，与①②③一致。</p>
</div>

<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>

<p class="q">「异面直线为什么不等于不相交？」</p>

<p class="a">不行。<b>过不在一条直线上的三个点，有且只有一个平面</b>。三点共线时，过这条直线的平面有无数个，「确定」就无从谈起。所以用三点证共面前，必须先说明三点不共线（用反证法，或点明「三点不在同一条直线上」）。</p>

<p class="a">不算。<b>直线在平面内是第三种位置关系</b>：公共点无数个，符号写 l⊂α。相交只有一个公共点，写 l∩α=P；平行没有公共点，写 l∥α。三者靠公共点个数（无数 / 1 / 0）分开，漏掉「线在面内」这一种，就等于丢了一整类。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 异面直线就是不相交的两条直线。</p>
<p class="er-v">✓ 不同在任何一个平面内的两条直线叫做异面直线；不相交的直线还可能是平行直线。</p>
<p class="er-w">错在哪：异面 ≠ 不相交。「不相交」漏掉了「不共面」这个核心条件，平行线立刻被误判成异面。</p>
</div>
<div class="er">
<p class="er-x">✗ 任意三点确定一个平面。</p>
<p class="er-v">✓ 过不在一条直线上的三个点，有且只有一个平面。</p>
<p class="er-w">错在哪：少写「不在一条直线上」。三点共线时过该直线的平面有无数个，「确定」不成立。</p>
</div>
<div class="er">
<p class="er-x">✗ 直线与平面的位置关系只有相交和平行两种。</p>
<p class="er-v">✓ 直线在平面内（l⊂α，无数个公共点）、直线与平面相交（l∩α=P）、直线与平面平行（l∥α）三种。</p>
<p class="er-w">错在哪：漏掉「直线在平面内」这第三种关系；它既不是相交，也不是平行，公共点个数是「无数个」。</p>
</div>
<div class="er">
<p class="er-x">✗ 两个平面相交，有无数个公共点。</p>
<p class="er-v">✓ 两个不重合的平面若有一个公共点，则有且只有一条过该点的公共直线。</p>
<p class="er-w">错在哪：结论停在「无数个点」不算答完，必须落到「一条公共直线」上，这是基本事实 3 的原话要求。</p>
</div>
<div class="er">
<p class="er-x">✗ 异面直线可以画在同一个平面里，只是画得远一点。</p>
<p class="er-v">✓ 异面直线不同在任何一个平面内，画图只是示意，任何一张平面图都装不下它们。</p>
<p class="er-w">错在哪：把「画不出来」当成「画得远」。示意图形里永远有平面，异面直线只能各在一个平面里交叉出现。</p>
</div>
<div class="er">
<p class="er-x">✗ 共面的两条直线一定相交。</p>
<p class="er-v">✓ 共面直线有两种：相交（1 个公共点）和平行（0 个公共点）。</p>
<p class="er-w">错在哪：把「共面」直接推成「相交」。共面只提供可能性，公共点个数才决定是相交还是平行。</p>

  var N = { vb: "0 0 360 700", left: { x: 8, y: 8, w: 344, h: 300 }, right: { x: 8, y: 320, w: 344, h: 372 } };
  var L = W, A = 1;

  /* 11 条非 AB 棱，按规格顺序；t 关系类型 0 平行 1 相交 2 异面，h 是否被挡住 */
  var EDGES = [
    { k: 1, n: "BC", a: "B", b: "C", t: 1, h: 0 },
    { k: 2, n: "CD", a: "C", b: "D", t: 0, h: 1 },
    { k: 3, n: "DA", a: "D", b: "A", t: 1, h: 1 },
    { k: 4, n: "A₁B₁", a: "A1", b: "B1", t: 0, h: 0 },

  /* 纯函数：参数 k → 关系类型与计数。render() 与 __model.cases 都用它 */

      name: e.n,
      type: e.t,
      par: 3,
      cross: 4,

  }

  /* 中文按字数换行，避免长句冲出面板 */
  function wrap(parent, x, y, s, maxW, fs, col, lh) {

    var LB = {

      A1: [-9, -6, "end"], B1: [9, -6, "start"], C1: [9, 5, "start"], D1: [-9, 2, "end"]
