<p class="gx-lede">这一节把「导数」从算斜率的工具，变成判断函数形状的工具：导数正负决定单调区间，导数变号决定极值点。它在整章里是承上启下的一节——上一节刚会求导，后面 5.4 的最值、5.5 的恒成立问题全靠这一节的两条判据。最容易错的一件事不是不会求导，而是把 f′(x₀)=0 直接当成极值点，以及把两个单调区间用「∪」连起来写。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 导数与单调性<span class="q-src">人教A版选择性必修第二册 · 第五章 5.3</span></p>
<p class="q-b">一般地，在某个区间 (a,b) 内，如果 f′(x)&gt;0，那么函数 y=f(x) 在这个区间内单调递增；如果 f′(x)&lt;0，那么函数 y=f(x) 在这个区间内单调递减。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个条件</b>组成：① 讨论的是同一个区间 (a,b)；② f′(x) 在该区间内<b>恒</b>正或恒负，只在个别点等于 0 不影响结论；③ 结论只给单调性，<b>不给极值</b>。少掉「恒」字，f(x)=x³ 在 x=0 就会被误判——它在 x=0 处 f′(0)=0，可整个定义域上仍是增函数。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 极值的判定<span class="q-src">人教A版选择性必修第二册 · 第五章 5.3</span></p>
<p class="q-b">设函数 f(x) 在点 x₀ 附近有定义。如果 f′(x₀)=0，且在 x₀ 的左侧 f′(x)&gt;0、右侧 f′(x)&lt;0，那么 f(x₀) 是极大值；如果 f′(x₀)=0，且在 x₀ 的左侧 f′(x)&lt;0、右侧 f′(x)&gt;0，那么 f(x₀) 是极小值。</p>
<p class="q-n">→ <b>两个条件缺一不可</b>：① f′(x₀)=0；② x₀ 左右两侧导数<b>异号</b>。只有①，x₀ 只能叫驻点，不能叫极值点；教科书给的现成反例就是 f(x)=x³ 在 x=0：f′(0)=0，但两侧 f′(x)=3x² 都是正的，不变号，所以 x=0 不是极值点。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 求极值的步骤<span class="q-src">人教A版选择性必修第二册 · 第五章 5.3</span></p>
<p class="q-b">求函数 y=f(x) 的极值的方法是：求导数 f′(x)；解方程 f′(x)=0；当 f′(x₀)=0 时，如果在 x₀ 附近左侧 f′(x)&gt;0、右侧 f′(x)&lt;0，那么 f(x₀) 是极大值；如果在 x₀ 附近左侧 f′(x)&lt;0、右侧 f′(x)&gt;0，那么 f(x₀) 是极小值。</p>
<p class="q-n">→ 四步：求导 → 解 f′(x)=0 → <b>判两侧符号</b> → 定极大或极小。第 3 步才是给分点：跳过它直接读第 2 步的根，等于把「候选点」当成了「结论」，这是本节最集中的失分处。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>条件</th><th>少了它会怎样</th><th>正确口径（可直接抄）</th></tr></thead>
<tbody>
<tr><td>f′(x)&gt;0 在区间内恒成立</td><td>只在个别点为正，判不出单调性</td><td>在 (a,b) 上 f′(x)&gt;0，故 f(x) 在 (a,b) 上单调递增</td></tr>
<tr><td>f′(x₀)=0（候选点）</td><td>x₀ 连驻点都不是，一定不是极值点</td><td>令 f′(x)=0，得候选点 x=x₀</td></tr>
<tr class="key"><td>f′(x₀)=0 <b>且</b> 两侧异号</td><td>只是驻点，如 f(x)=x³ 的 x=0</td><td>f′ 由正变负 ⇒ f(x₀) 为极大值；由负变正 ⇒ 极小值</td></tr>
<tr><td>极值只在 x₀ 的邻域内比较</td><td>把极大值当成整个定义域上的最大值</td><td>极值是局部概念，最值要连端点一起比</td></tr>
<tr><td>候选点落在定义域内</td><td>根在定义域外也当极值点算</td><td>先写定义域，再解 f′(x)=0，最后筛根</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">整张表只高亮 1 行。背法：判极值要<b>两句一起写</b>——「f′(x₀)=0」+「左右两侧变号」；只写第一句，阅卷按 0 分处理。单调区间同理：<b>几个区间分开写，中间用逗号或「和」，不能写成并集</b>。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 求单调区间与极值<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">已知函数 f(x)=x³−3x。<br>（1）求 f(x) 的单调区间；（2）求 f(x) 的极值。<br>陷阱：第（1）问的两个增区间能不能写成 (−∞,−1)∪(1,+∞)？第（2）问能不能顺手把「极大值 2」写成「最大值 2」？</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 写定义域，求导数</p>
<p class="s-b">定义域是 R。求导得 <span class="gx-fml">f′(x)=3x²−3=3(x−1)(x+1)</span>，因式分解是为了下一步直接读符号。</p>
<p class="s-k">用到：基本求导公式；因式分解决定后面判号的效率。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 解 f′(x)=0，找候选点</p>
<p class="s-b">令 f′(x)=0，得 x=−1 或 x=1，两个根都在定义域 R 内，都是候选点。<b>到这里还不能说它们是极值点</b>——候选点只是「有可能是」。</p>
<p class="s-k">用到：驻点的意义；候选点要落在定义域内。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 判两侧符号（给分动作）</p>
<p class="s-b">在 −1 左侧取 x=−2：f′(−2)=9&gt;0；在 −1 与 1 之间取 x=0：f′(0)=−3&lt;0；在 1 右侧取 x=2：f′(2)=9&gt;0。所以符号是 + → − → +，两个候选点都<b>变号</b>，都是极值点。</p>
<p class="s-k">用到：<b>f′(x₀)=0 不代表是极值点，还要看两侧符号</b>。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 写单调区间</p>
<p class="s-b">f′(x)&gt;0 的区间是 (−∞,−1) 与 (1,+∞)，f′(x)&lt;0 的区间是 (−1,1)。所以单调递增区间为 (−∞,−1) 和 (1,+∞)，单调递减区间为 (−1,1)。</p>
<p class="s-k">用到：<b>单调区间不能写成并集</b>——两个增区间之间隔着一段减区间，写成 (−∞,−1)∪(1,+∞) 是重复扣分点。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 定极值，并说清它不是最值</p>
<p class="s-b">x=−1 处 f′ 由正变负，故 f(−1)=2 为极大值；x=1 处 f′ 由负变正，故 f(1)=−2 为极小值。这里极大值 2 比极小值 −2 大，纯属本例的巧合，<b>极值是局部概念</b>，不负责全定义域的大小。</p>
<p class="s-k">用到：极值的定义；<b>极值是局部概念，最值要连端点一起比</b>。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）定义域为 R。f′(x)=3x²−3=3(x−1)(x+1)。令 f′(x)=0，得 x=−1 或 x=1。当 x&lt;−1 时 f′(x)&gt;0；当 −1&lt;x&lt;1 时 f′(x)&lt;0；当 x&gt;1 时 f′(x)&gt;0。所以 f(x) 的单调递增区间为 (−∞,−1) 和 (1,+∞)，单调递减区间为 (−1,1)。（两个增区间分开写，不写成并集。）<br>（2）由（1）的符号变化：x=−1 时 f′(x) 由正变负，f(−1)=2 为极大值；x=1 时 f′(x) 由负变正，f(1)=−2 为极小值。若题目改问闭区间 [−2,2] 上的最值，还要算 f(−2)=−2、f(2)=2，与极值 2、−2 一起比，才得最大值 2、最小值 −2——<b>极值是局部概念，最值要连端点一起比</b>。</p>
</div>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「f′(x₀)=0，是不是就能说 x₀ 是极值点？」</p>
<p class="a">不能。<b>f′(x₀)=0 不代表是极值点，还要看两侧符号</b>：两侧异号才是极值点，两侧同号只是驻点（f(x)=x³ 在 x=0）。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="导数为零但两侧同号，曲线仍在上升">

<p class="q">「增区间有两段，能不能写成 (−∞,−1)∪(1,+∞)？」</p>
<p class="a">不能。<b>单调区间不能写成并集</b>：并集表示「整个集合上一个单调」，而 f 在 (−1,1) 上是递减的。规范写法是「(−∞,−1) 和 (1,+∞)」或用逗号分开。</p>

<div class="qac">
<p class="q">「极大值就是最大值吗？极值怎么和最值分？」</p>
<p class="a">不是。<b>极值是局部概念，最值要连端点一起比</b>：极值只在 x₀ 的小邻域内比大小，最值是整个定义域（含端点）上最大的那个。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="闭区间上端点值与极值一起比较才得最值">

<div class="qac">
<p class="q">「极大值一定比极小值大吗？」</p>
<p class="a">不一定。极大值、极小值各自只是<b>局部</b>最高的点、最低的点，两个不同邻域里的量没有可比性：完全可能「极大值 1 &lt; 极小值 3」。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="极大值与极小值来自不同邻域，不能直接比大小">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>

<div class="qac">
<p class="q">「闭区间上的最值怎么求？」</p>
<p class="a">三步：求 f′(x) 并解出区间内的极值点 → 算出所有极值 → 再算两个端点值，<b>一起比大小</b>，最大的是最大值、最小的是最小值。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="闭区间最值：极值与端点值放在一起比">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text x="24" y="34" font-size="8.8" fill="#3a3a35">候选值共 4 个：</text>
<text x="24" y="52" font-size="8.8" fill="#b8791f">极大值 f(x₁)、极小值 f(x₂)</text>
<text x="24" y="70" font-size="8.8" fill="#b8402f">端点值 f(a)、f(b)</text>
<line x1="24" y1="82" x2="216" y2="82" stroke="#c7d0d9" stroke-width="1"/>
<text x="24" y="102" font-size="8.6" fill="#2f8a5b">四个数一起比 ⇒ 最大值 / 最小值</text>
<text x="24" y="118" font-size="8.2" fill="#5a6472">少算端点，是最常见的丢分</text>
</svg>
</div>
<div class="qac">
<p class="q">「f′(x)&gt;0 的那个区间，端点要不要去掉？」</p>
<p class="a">不影响判定。f′(x)&gt;0 在开区间 (a,b) 上恒成立就能得单调递增；端点处 f′ 恰为 0 也不破坏单调性（f(x)=x³ 在 R 上递增）。写开区间最稳，但区间不能超出定义域。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="开区间内导数为正，端点处导数为零不影响单调性">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="20" y1="86" x2="220" y2="86" stroke="#9aa5b1" stroke-width="1"/>
<circle cx="46" cy="86" r="3.4" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<circle cx="196" cy="86" r="3.4" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<text x="46" y="76" font-size="8.6" fill="#2563eb" text-anchor="middle">a</text>
<text x="196" y="76" font-size="8.6" fill="#2563eb" text-anchor="middle">b</text>
<text x="120" y="76" font-size="8.8" fill="#2f8a5b" text-anchor="middle">f′(x)&gt;0</text>
<text x="120" y="106" font-size="8.4" fill="#5a6472" text-anchor="middle">端点处 f′ 可为 0，不影响递增</text>
</svg>
</div>
</div>
<p class="gx-note">六问其实是同一件事：<b>把「必要条件」当成「充要条件」</b>。f′=0 只是候选，变号才是判决；单调区间是分开的几段，不是一个大集合；极值只管局部，最值才管全局。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 由 f′(x₀)=0 得 x₀ 是极值点。</p>
<p class="er-v">✓ 由 f′(x₀)=0 得 x₀ 是候选点；再由 x₀ 两侧 f′ 异号，得 x₀ 是极值点。</p>
<p class="er-w">错在哪：把必要条件当充要条件。<b>f′(x₀)=0 不代表是极值点，还要看两侧符号</b>，f(x)=x³ 在 x=0 就是反例。</p>
</div>
<div class="er">
<p class="er-x">✗ f(x)=x³−3x 的单调递增区间是 (−∞,−1)∪(1,+∞)。</p>
<p class="er-v">✓ 单调递增区间为 (−∞,−1) 和 (1,+∞)；单调递减区间为 (−1,1)。</p>
<p class="er-w">错在哪：<b>单调区间不能写成并集</b>。并集表示整个集合上单调，而 f 在 (−1,1) 上是减的。</p>
</div>
<div class="er">
<p class="er-x">✗ 极大值 2 比极小值 −2 大，所以最大值是 2。</p>
<p class="er-v">✓ 极值是局部概念，最值要连端点一起比：把端点值与极值放在一起才能定最大值。</p>
<p class="er-w">错在哪：<b>极值是局部概念，最值要连端点一起比</b>；开区间上甚至可能根本没有最大值。</p>
</div>
<div class="er">
<p class="er-x">✗ f(x)=x³−3x 在 x=−1 和 x=1 处取得极值点。</p>
<p class="er-v">✓ f(x) 在 x=−1 处取得极大值 f(−1)=2，在 x=1 处取得极小值 f(1)=−2。</p>
<p class="er-w">错在哪：极值点是横坐标 x₀，极值是函数值 f(x₀)。写成「取得极值点」是概念混用。</p>
</div>
<div class="er">
<p class="er-x">✗ 因为 f′(x)=3x²≥0，所以 x=0 是极小值点。</p>
<p class="er-v">✓ 因为 f′(x)=3x²≥0 恒成立，所以 f(x)=x³ 在 R 上单调递增，没有极值点。</p>
<p class="er-w">错在哪：f′≥0 判的是单调性，不是极值；x=0 两侧同号，不变号就没有极值。</p>
</div>
<div class="er">
<p class="er-x">✗ 令 f′(x)=0 解得 x=3，所以 x=3 是极大值点。</p>
<p class="er-v">✓ 先写定义域：x=3 不在定义域内，舍去；极值点只在定义域内部讨论。</p>
<p class="er-w">错在哪：<b>忽略定义域</b>。定义域外的根连候选点都不是。</p>
</div>
<div class="er">
<p class="er-x">✗ 单调区间就是把 f′(x)&gt;0 的解集抄上去，端点随便是开是闭。</p>
<p class="er-v">✓ 单调区间要在定义域内讨论，端点写开写闭都不影响结论，但不能超出定义域。</p>
<p class="er-w">错在哪：把不等式解集直接当结论，不检查端点是否在定义域内。</p>
</div>
</div>
