<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。答题时写左边这句，不是右边的人话。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 数列与项<span class="q-src">人教A版选择性必修第二册 · 第4章第1节</span></p>
<p class="q-b">按照确定的顺序排列的一列数叫做数列，数列中的每一个数叫做这个数列的项。</p>
<p class="q-n">→ 翻成人话：这句话由<b>三个条件</b>组成 —— ① 是「一列数」，可以重复、可以是同一个数反复出现；② 排列有<b>确定的顺序</b>；③ 顺序换掉就是<b>另一个</b>数列，1, 2, 3 与 3, 2, 1 是两个数列。少掉「顺序」这一条，就退化成集合，后面所有关于第 n 项的讨论都没有意义。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 通项公式<span class="q-src">人教A版选择性必修第二册 · 第4章第1节</span></p>
<p class="q-b">如果数列 {aₙ} 的第 n 项与序号 n 之间的关系可以用一个式子表示，那么这个式子叫做这个数列的通项公式。</p>
<p class="q-n">→ 翻成人话：<b>两个条件</b> —— ① 式子的自变量是<b>序号 n</b>，它的取值范围是正整数集 N*（n = 1, 2, 3, …）；② 给一个 n 就能<b>唯一</b>算出 aₙ，不许出现一个 n 对两个值。所以通项公式的定义域从 n = 1 开始，没有 a₀ 这种东西。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 前 n 项和与 aₙ 的关系<span class="q-src">人教A版选择性必修第二册 · 第4章第1节</span></p>
<p class="q-b">数列 {aₙ} 的前 n 项和 Sₙ = a₁ + a₂ + … + aₙ；当 n ≥ 2 时，aₙ = Sₙ − Sₙ₋₁。</p>
<p class="q-n">→ 翻成人话：注意「当 n ≥ 2 时」这五个字是<b>条件本身</b>，不是语气词。n = 1 时会出现 S₀ = a₁ + … + a₀，这是没定义的，所以 n = 1 只能用 a₁ = S₁ 单独算。这就是「分段写」的来源。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>条件</th><th>满足时的样子</th><th>缺了会怎样</th></tr></thead>
<tbody>
<tr><td>一列数，元素可重复</td><td>1, 1, 1, … 也是数列</td><td>当成集合就被去重，{1, 1, 1} = {1}，项数不见了</td></tr>
<tr><td>顺序确定且不可交换</td><td>1, 2, 3 与 3, 2, 1 是两个数列</td><td>写「顺序无关」直接判错，通项公式也对不上</td></tr>
<tr><td>通项公式的 n ∈ N*</td><td>aₙ = 2n − 1，n = 1, 2, 3, …</td><td>从 n = 0 起算会多出一个 a₀ = −1，定义域就错了</td></tr>
<tr class="key"><td>aₙ = Sₙ − Sₙ₋₁ 的 n ≥ 2</td><td>n ≥ 2 用相减；n = 1 单独用 a₁ = S₁</td><td>n = 1 时硬套会出现 S₀，无意义，答案必错</td></tr>
<tr><td>递推公式要配首项</td><td>a₁ = 1 且 aₙ = aₙ₋₁ + 2（n ≥ 2）</td><td>只给递推关系，数列可以差一个常数，整列都定不下来</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">背法：把「有序」「n ≥ 2」「n ∈ N*」当成三个开关，动笔前先各自确认一次。试卷上扣分的地方几乎都在这三个开关上。</p>
</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点「下一步」。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 由递推公式求通项与前 n 项和<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">已知数列 {aₙ} 满足 a₁ = 1，aₙ = aₙ₋₁ + 2（n ≥ 2）。（1）求数列 {aₙ} 的通项公式；（2）求前 5 项和 S₅，并写出 Sₙ。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 审题：认出这是递推公式</p>
<p class="s-b">题目给的是「后一项 = 前一项 + 2」，属于递推公式，不是通项公式，n ≥ 2 说明第 1 项由 a₁ 单独给出。先确认首项在不在：a₁ = 1 已给，数列被唯一确定，可以往下算。</p>
<p class="s-k">用到：递推公式必须配首项，缺首项就定不下数列。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 2 步 · 往后写几项，看规律</p>
<p class="s-b">a₁ = 1；a₂ = a₁ + 2 = 3；a₃ = a₂ + 2 = 5；a₄ = 7；a₅ = 9。得到 1, 3, 5, 7, 9, …，每一项比前一项多 2。</p>
<p class="s-k">用到：数列是有序的，写项必须按 n 从小到大排，不能乱序。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 3 步 · 认成等差数列，写通项</p>
<p class="s-b">从第 2 项起每一项减前一项都等于 2（常数），所以 {aₙ} 是首项 1、公差 2 的等差数列。由 aₙ = a₁ + (n − 1)d 得 aₙ = 1 + (n − 1)×2 = 2n − 1。</p>
<p class="s-k">用到：aₙ = a₁ + (n − 1)d，n ∈ N*。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 4 步 · 回头验 n = 1</p>
<p class="s-b">用 aₙ = 2n − 1 算 n = 1：2×1 − 1 = 1，正好等于 a₁，所以这个通项公式对 n ≥ 1 全部成立，不需要分段。这一步不能省：如果 n = 1 对不上，就要写成分段形式。</p>
<p class="s-k">用到：通项公式定义在正整数集上，代回 n = 1 检验是固定动作。</p>
</li>
<li class="step" hidden>
<p class="s-h">第 5 步 · 求 S₅，再写 Sₙ</p>
<p class="s-b">S₅ = a₁ + a₂ + a₃ + a₄ + a₅ = 1 + 3 + 5 + 7 + 9 = 25。一般地，前 n 个奇数之和 Sₙ = 1 + 3 + … + (2n − 1) = n²，代 n = 5 得 25，与逐项相加一致。</p>
<p class="s-k">用到：Sₙ 是「前 n 项全加起来」，不是第 n 项。</p>
</li>
</ol>
<div class="exbar">
<button id="gxNext" type="button">下一步</button>
<span class="cnt" id="gxCnt">1 / 5</span>
</div>
<div class="ans" id="gxAns" hidden>
<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）由 aₙ − aₙ₋₁ = 2（n ≥ 2）知 {aₙ} 是首项 a₁ = 1、公差 d = 2 的等差数列，<br>所以 aₙ = a₁ + (n − 1)d = 1 + 2(n − 1) = 2n − 1（n ∈ N*）。<br>检验：n = 1 时 2×1 − 1 = 1 = a₁，通项公式对一切 n ∈ N* 成立。<br>（2）S₅ = 1 + 3 + 5 + 7 + 9 = 25；一般地 Sₙ = n²（n ∈ N*），代 n = 5 得 S₅ = 25，一致。<br>【注意】若改用 aₙ = Sₙ − Sₙ₋₁ 求 aₙ，只能对 n ≥ 2 用；n = 1 必须单独由 a₁ = S₁ 得到，否则写成 S₀ 就没有意义。</p>
</div>
</div>
</section>
<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">六问，都是「你以为懂了、一写就错」的地方。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「把 1, 2, 3 换成 3, 2, 1，还是同一个数列吧？」</p>
<p class="a">不是。<b>数列是有序的</b>，顺序一换就是另一个数列。判断两个数列是否相同，要项数相同<b>且</b>对应位置的项都相同；1, 2, 3 与 3, 2, 1 的第 1 项就不同，是两个数列。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="两个顺序不同的数列互不相等">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text class="ms" x="120" y="40" text-anchor="middle" font-size="10">1, 2, 3</text>
<text class="ms" x="120" y="64" text-anchor="middle" font-size="10" fill="#b8402f">≠</text>
<text class="ms" x="120" y="88" text-anchor="middle" font-size="10">3, 2, 1</text>
<text class="ms" x="120" y="110" text-anchor="middle" font-size="8.4" fill="#6b7684">顺序不同 ⇒ 两个数列</text>
</svg>
</div>
<div class="qac">
<p class="q">「aₙ = Sₙ − Sₙ₋₁ 这么好用，n = 1 也直接套？」</p>
<p class="a">不行。<b>这条式子只对 n ≥ 2 成立</b>。n = 1 时右边是 S₁ − S₀，S₀ 没有定义。正确写法是分两段：a₁ = S₁，n ≥ 2 时 aₙ = Sₙ − Sₙ₋₁，最后再检验两段能不能合并。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="n 等于 1 时不能用 S n 减 S n 减 1">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text class="ms" x="120" y="40" text-anchor="middle" font-size="9.4">n = 1</text>
<text class="ms" x="120" y="62" text-anchor="middle" font-size="9.4" fill="#2f8a5b">a₁ = S₁ ✓</text>
<text class="ms" x="120" y="86" text-anchor="middle" font-size="9.4" fill="#b8402f">S₁ − S₀ ✗</text>
<text class="ms" x="120" y="110" text-anchor="middle" font-size="8.4" fill="#6b7684">S₀ 无定义，只能 n ≥ 2 相减</text>
</svg>
</div>
<div class="qac">
<p class="q">「通项公式只能写一个吧？写上 aₙ = 2n − 1 就完事了？」</p>
<p class="a">不唯一。aₙ = 2n − 1 与 aₙ = 2(n − 1) + 1 是同一个数列的不同写法，只要对每个 n 算出的 aₙ 相同即可。但不管写成哪种，<b>n 的定义域都是正整数集</b>，不能从 n = 0 起算。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="同一个数列的两种通项公式写法">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text class="ms" x="120" y="44" text-anchor="middle" font-size="9.4">aₙ = 2n − 1</text>
<text class="ms" x="120" y="66" text-anchor="middle" font-size="9.4">= 2(n − 1) + 1</text>
<text class="ms" x="120" y="92" text-anchor="middle" font-size="8.6" fill="#2b3a4a">两种写法，同一个数列</text>
<text class="ms" x="120" y="112" text-anchor="middle" font-size="8.4" fill="#6b7684">n ∈ N*，从 1 开始</text>
</svg>
</div>
<div class="qac">
<p class="q">「数列总得写完吧，写不完的就不叫数列？」</p>
<p class="a">项数有限的叫有穷数列，项数无限的叫<b>无穷数列</b>。1, 3, 5, 7, … 后面加省略号就是无穷数列，只要通项公式能对每个 n 都算出项，它就是合法的数列。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="带省略号的无穷数列">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<circle cx="46" cy="66" r="4" fill="#2563eb"/>
<circle cx="78" cy="66" r="4" fill="#2563eb"/>
<circle cx="110" cy="66" r="4" fill="#2563eb"/>
<circle cx="142" cy="66" r="4" fill="#2563eb"/>
<text class="ms" x="176" y="70" text-anchor="middle" font-size="12" fill="#5a6472">…</text>
<text class="ms" x="120" y="104" text-anchor="middle" font-size="8.4" fill="#6b7684">1, 3, 5, 7, … 无穷数列</text>
</svg>
</div>
<div class="qac">
<p class="q">「点列图的横坐标，写 aₙ 还是写 n？」</p>
<p class="a">横坐标是<b>序号 n</b>，纵坐标才是项 aₙ。而且点列图<b>只画点、不连线</b>：横轴上 n = 1 与 n = 2 之间没有「第 1.5 项」，连起来会让人误以为项是连续变化的。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="点列图横轴是序号 n 纵轴是项">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="34" y1="96" x2="212" y2="96" stroke="#5a6472" stroke-width="1"/>
<line x1="34" y1="96" x2="34" y2="32" stroke="#5a6472" stroke-width="1"/>
<circle cx="72" cy="80" r="3" fill="#2563eb"/>
<circle cx="110" cy="64" r="3" fill="#2563eb"/>
<circle cx="148" cy="48" r="3" fill="#2563eb"/>
<text class="ms" x="206" y="110" text-anchor="end" font-size="8" fill="#5a6472">序号 n</text>
<text class="ms" x="40" y="30" font-size="8" fill="#5a6472">aₙ</text>
</svg>
</div>
<div class="qac">
<p class="q">「递推公式都给了，还差什么？」</p>
<p class="a">差<b>首项</b>。只给 aₙ₊₁ = aₙ + 2，0, 2, 4, … 和 5, 7, 9, … 都满足，数列不唯一；补上 a₁ = 1 之后，每一项都由前一项唯一决定，数列才被确定。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="递推公式必须配合首项">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<rect x="30" y="46" width="52" height="26" rx="5" fill="#ffffff" stroke="#b8e6d0"/>
<text class="ms" x="56" y="63" text-anchor="middle" font-size="8.6">a₁</text>
<line x1="86" y1="59" x2="116" y2="59" stroke="#2f8a5b" stroke-width="1"/>
<path d="M122 59 L113 55 L113 63 Z" fill="#2f8a5b"/>
<rect x="126" y="46" width="60" height="26" rx="5" fill="#ffffff" stroke="#b8e6d0"/>
<text class="ms" x="156" y="63" text-anchor="middle" font-size="8.6">a₂</text>
<text class="ms" x="120" y="96" text-anchor="middle" font-size="8.4" fill="#6b7684">首项 + 递推 ⇒ 唯一确定</text>
</svg>
</div>
</div>
<p class="gx-note">这六问其实是同一件事：先问「这个记号的定义域在哪」，再动笔。有序、n ≥ 2、n ∈ N* 三个开关确认过，六问都不会错。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 数列 1, 2, 3 与 3, 2, 1 只是写法不同，是同一个数列。</p>
<p class="er-v">✓ 数列是有序的，1, 2, 3 与 3, 2, 1 是两个不同的数列。</p>
<p class="er-w">错在哪：把数列当成了集合。集合看元素，数列看「第几项是什么」。</p>
</div>
<div class="er">
<p class="er-x">✗ 已知 Sₙ = n²，则 aₙ = Sₙ − Sₙ₋₁ 对一切 n ∈ N* 都成立。</p>
<p class="er-v">✓ 当 n ≥ 2 时 aₙ = Sₙ − Sₙ₋₁；n = 1 时 a₁ = S₁。</p>
<p class="er-w">错在哪：n = 1 会算出 S₀，S₀ 没有定义；a₁ 必须单独由 S₁ 得到。</p>
</div>
<div class="er">
<p class="er-x">✗ 通项公式 aₙ = 2n − 3 中的 n 可以取 0, 1, 2, …。</p>
<p class="er-v">✓ 通项公式定义在正整数集上，n ∈ N*，即 n = 1, 2, 3, …。</p>
<p class="er-w">错在哪：下标从 0 起算会凭空多出 a₀，与课本定义不符。</p>
</div>
<div class="er">
<p class="er-x">✗ 数列 {1, 1, 1} 就是 {1}，重复的项要去掉。</p>
<p class="er-v">✓ 数列 1, 1, 1 有三项，a₁ = a₂ = a₃ = 1，项可以重复。</p>
<p class="er-w">错在哪：套了集合的「互异性」。数列允许相同的项重复出现。</p>
</div>
<div class="er">
<p class="er-x">✗ 点列图要把这些点用折线连起来才看得出趋势。</p>
<p class="er-v">✓ 点列图只画点，横轴是序号 n，纵轴是项 aₙ，不连线。</p>
<p class="er-w">错在哪：n 只能取正整数，n = 1 与 n = 2 之间没有项，连线是伪造的中间值。</p>
</div>
<div class="er">
<p class="er-x">✗ 已知 aₙ₊₁ = aₙ + 2，就能求出唯一的通项公式。</p>
<p class="er-v">✓ 递推公式必须配首项，a₁ = 1 且 aₙ₊₁ = aₙ + 2 才能确定数列。</p>
<p class="er-w">错在哪：只给递推关系，整列可以上下平移，答案会差一个常数。</p>
</div>
<div class="er">
<p class="er-x">✗ 数列的项数一定是有限个，写不完的不能叫数列。</p>
<p class="er-v">✓ 项数有限的叫有穷数列，项数无限的叫无穷数列，两者都是数列。</p>
<p class="er-w">错在哪：把「能写完」当成了定义的一部分，忽略了无穷数列。</p>
</div>
</div>

<script src="../../assets/gx.js"></script>
<script src="../../assets/autopilot.js"></script>
<script>
/* 互动脚本本体（由 build-page.mjs 包进 <script> 里，所以这里不要写 <script> 标签） */
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var GX = window.GX, el = GX.el, tx = GX.tx, $ = GX.$;
  var stage = $("gxStage");
  if (!stage || !window.AutoPilot) return;

  /* 两套坐标：宽屏 880×470，窄屏独立 360×700 */
  var W = { vb: "0 0 880 470", left: { x: 16, y: 16, w: 424, h: 438 }, right: { x: 456, y: 16, w: 408, h: 438 } };
  var N = { vb: "0 0 360 700", left: { x: 8, y: 8, w: 344, h: 300 }, right: { x: 8, y: 320, w: 344, h: 372 } };
  var L = W, G = null, A = 5;
  var NMAX = 10, AMAX = 19, SMAX = 100;

  /* 纯函数：序号 n → aₙ、Sₙ、Sₙ − Sₙ₋₁。render() 和 __model.cases 都用它 */
  function calc(v) {
    var n = Math.round(v);
    if (n < 1) n = 1;
    if (n > NMAX) n = NMAX;
    var an = 2 * n - 1, sn = n * n;
    var prev = n >= 2 ? (n - 1) * (n - 1) : null;
    var gap = n >= 2 ? sn - prev : an;
    return { n: n, an: an, sn: sn, prev: prev, gap: gap };
  }

  function geom() {
    var narrow = L === N, l = L.left, r = L.right;
    var g = {};
    g.lx = l.x + (narrow ? 46 : 50);
    g.ly = l.y + l.h - (narrow ? 56 : 62);
    g.lw = l.w - (narrow ? 76 : 96);
    g.lh = l.h - (narrow ? 110 : 126);
    g.rx = r.x + (narrow ? 46 : 50);
    g.ry = r.y + r.h - (narrow ? 56 : 64);
    g.rw = r.w - (narrow ? 76 : 96);
    g.rh = r.h - (narrow ? 110 : 130);
    return g;
  }
  var px = function (n) { return G.lx + n * G.lw / NMAX; };
  var py = function (a) { return G.ly - a * G.lh / AMAX; };
  var sy = function (s) { return G.ry - s * G.rh / SMAX; };

  function arrow(g, x1, y1, x2, y2, col) {
    el("line", { x1: x1, y1: y1, x2: x2, y2: y2, stroke: col, "stroke-width": 1.1 }, g);
  }
  function tip(g, x, y, dir, col) {
    var d = dir === "r" ? "M" + x + " " + y + " L" + (x - 8) + " " + (y - 4) + " L" + (x - 8) + " " + (y + 4) + " Z"
      : "M" + x + " " + y + " L" + (x - 4) + " " + (y + 8) + " L" + (x + 4) + " " + (y + 8) + " Z";
    el("path", { d: d, fill: col }, g);
  }

  function draw() {
    var s = calc(A), gA = $("gxA"), gB = $("gxB"), l = L.left, r = L.right, i, n, cx, cy;
    gA.textContent = ""; gB.textContent = "";

    /* 左：aₙ 的点列（横轴序号 n，纵轴 aₙ，只画点不连线） */
    el("rect", { x: l.x, y: l.y, width: l.w, height: l.h, rx: 10, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    tx(gA, l.x + 16, l.y + 26, "点列：横轴序号 n，纵轴项 aₙ", "#5a6472", "start", 10, 700);
    arrow(gA, G.lx, G.ly, G.lx + G.lw + 16, G.ly, "#5a6472");
    tip(gA, G.lx + G.lw + 16, G.ly, "r", "#5a6472");
    arrow(gA, G.lx, G.ly, G.lx, G.ly - G.lh - 12, "#5a6472");
    tip(gA, G.lx, G.ly - G.lh - 12, "u", "#5a6472");
    tx(gA, G.lx + G.lw + 10, G.ly - 8, "n", "#5a6472", "end", 9.5, 400);
    tx(gA, G.lx - 12, G.ly - G.lh - 6, "aₙ", "#5a6472", "start", 9.5, 400);
    for (i = 1; i <= NMAX; i++) {
      if (L === N && i % 2 === 1) continue;
      tx(gA, px(i), G.ly + 14, String(i), "#5a6472", "middle", 8.6, 400);
    }
    for (i = 5; i <= 15; i += 5) {
      tx(gA, G.lx - 6, py(i) + 3, String(i), "#5a6472", "end", 8.6, 400);
    }
    for (i = 1; i <= NMAX; i++) {
      cx = px(i); cy = py(2 * i - 1);
      if (i === s.n) {
        el("line", { x1: cx, y1: cy, x2: cx, y2: G.ly, stroke: "#b8402f", "stroke-width": 1, "stroke-dasharray": "3 3" }, gA);
        el("circle", { cx: cx, cy: cy, r: 4.6, fill: "#b8402f" }, gA);
      } else {
        el("circle", { cx: cx, cy: cy, r: 3.1, fill: "#2563eb" }, gA);
      }
    }
    tx(gA, px(s.n) + (s.n > 8 ? -8 : 8), py(s.an) - 8, "aₙ =" + s.an, "#b8402f", s.n > 8 ? "end" : "start", 9.2, 700);

    /* 右：Sₙ 的柱高，相邻两柱之差就是 aₙ */
    el("rect", { x: r.x, y: r.y, width: r.w, height: r.h, rx: 10, fill: "#ffffff", stroke: "#e6e9ee" }, gB);
    tx(gB, r.x + 16, r.y + 26, "Sₙ = n² 的柱高", "#5a6472", "start", 10, 700);
    tx(gB, r.x + 16, r.y + 44, "相邻两柱高度差 = aₙ", "#8b95a3", "start", 9, 400);
    arrow(gB, G.rx, G.ry, G.rx + G.rw + 16, G.ry, "#5a6472");
    tip(gB, G.rx + G.rw + 16, G.ry, "r", "#5a6472");
    arrow(gB, G.rx, G.ry, G.rx, G.ry - G.rh - 12, "#5a6472");
    tip(gB, G.rx, G.ry - G.rh - 12, "u", "#5a6472");
    tx(gB, G.rx + G.rw + 10, G.ry - 8, "n", "#5a6472", "end", 9.5, 400);
    tx(gB, G.rx - 8, G.ry - G.rh - 6, "Sₙ", "#5a6472", "start", 9.5, 400);
    tx(gB, G.rx - 6, sy(100) + 3, "100", "#5a6472", "end", 8.6, 400);
    tx(gB, G.rx - 6, sy(50) + 3, "50", "#5a6472", "end", 8.6, 400);
    var slot = G.rw / NMAX, bw = slot * 0.58;
    for (i = 1; i <= NMAX; i++) {
      n = i * i;
      el("rect", {
        x: G.rx + (i - 1) * slot + (slot - bw) / 2, y: sy(n), width: bw, height: G.ry - sy(n),
        rx: 2, fill: i === s.n ? "#b8402f" : "#a9c9f2", stroke: "none"
      }, gB);
      if (!(L === N) || i % 2 === 0) tx(gB, G.rx + (i - 0.5) * slot, G.ry + 14, String(i), "#5a6472", "middle", 8.6, 400);
    }
    if (s.n >= 2) {
      el("line", { x1: G.rx, y1: sy(s.prev), x2: G.rx + G.rw, y2: sy(s.prev), stroke: "#b8402f", "stroke-width": 1, "stroke-dasharray": "4 3" }, gB);
      var xm = G.rx + (s.n - 0.5) * slot;
      el("line", { x1: xm, y1: sy(s.prev) - 2, x2: xm, y2: sy(s.sn) + 2, stroke: "#b8402f", "stroke-width": 1.2 }, gB);
      tx(gB, G.rx + 4, G.ry + 38, "Sₙ − Sₙ₋₁ = " + s.sn + " − " + s.prev + " = " + s.gap + " = aₙ", "#b8402f", "start", 9.4, 700);
    } else {
      tx(gB, G.rx + 4, G.ry + 38, "n = 1：a₁ = S₁ = 1，S₀ 无定义", "#b8402f", "start", 9.4, 700);
      tx(gB, G.rx + 4, G.ry + 54, "所以 n = 1 不能相减", "#8b95a3", "start", 9, 400);
    }
  }

  function render() {
    if (!G) { L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N; G = geom(); stage.setAttribute("viewBox", L.vb); }
    var s = calc(A), st, col, bg, sn;
    $("gxVa").textContent = String(s.n);
    $("gxVb").textContent = String(s.an);
    $("gxVc").textContent = String(s.sn);
    if (s.n === 1) { st = "a₁ = S₁"; col = "#b8402f"; bg = "#fbeae7"; sn = "不能减 S₀"; }
    else { st = "aₙ = Sₙ − Sₙ₋₁"; col = "#2f8a5b"; bg = "#e6f6ee"; sn = "n ≥ 2 可相减"; }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    draw();
  }

  function layout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    G = geom();
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  var apBadge = $("gxAp"), apTxt = $("gxApTxt");
  function setMode(m) {
    if (!apBadge) return;
    apBadge.classList.toggle("is-auto", m === "auto");
    apBadge.classList.toggle("is-manual", m !== "auto");
    if (apTxt) apTxt.textContent = m === "auto" ? "自动演示中" : "你接管了";
  }

  var ap = AutoPilot.create({
    mount: stage,
    follow: $("gxSl"),
    loop: [{ t: 0, v: 1 }, { t: 1.2, v: 1 }, { t: 4, v: 5 }, { t: 6.5, v: 5 }, { t: 9, v: 10 }, { t: 11.5, v: 7 }, { t: 13.5, v: 1 }],
    keys: [1, 5, 10],
    value: A, min: 1, max: NMAX, step: 1,
    idle: 5000,
    onChange: function (v) { A = v; render(); },
    onMode: setMode
  });
  window.__ap = ap;
  window.__model = { calc: calc, cases: [
    { v: 3, eq: { an: 5, sn: 9 } },
    { v: 5, eq: { an: 9, sn: 25, gap: 9 } },
    { v: 10, eq: { an: 19, sn: 100 } }
  ] };

  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 150); });
  layout();
});
</script>
</body>
