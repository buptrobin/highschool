    <p class="q-b">藏粮于地，就是通过保护耕地、提升地力、改善农业基础设施，把粮食生产能力储存在土地里，而不是只靠库存。（据教材问题研究材料整理）</p>
    <p class="q-n">→ 翻成人话：粮食产能 = 耕地面积 × 单位面积产量。面积靠“红线”守住，单产靠“地力 + 设施”提上来；两者都沉淀在土地上，所以叫“藏”。</p>

  L = stage.parentElement.getBoundingClientRect().width >= 640 ? WIDE : NARROW;
  stage.setAttribute("viewBox", L.vb);
  render();
});
</script>
</body>
