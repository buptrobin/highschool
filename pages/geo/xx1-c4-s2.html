<p class="gx-lede">洋流把<b>风带、气候、渔场、海洋污染</b>串成一节：风带吹出洋流，洋流改写沿岸气候，寒暖流交汇与上升流又决定渔场。丢分通常不在名称，而在<b>环流方向画反、把西风漂流当成暖流</b>。</p>

<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再看解释。</p>
<div class="gx-quote">
<p class="q-t">课本原话 · 洋流的性质分类<span class="q-src">人教版（2019）选择性必修1 · 第四章第二节</span></p>
<p class="q-b">洋流又称海流，是指海水沿一定方向有规律的大规模流动。……按照性质，洋流可分为暖流和寒流：从水温高的海区流向水温低的海区的洋流，叫作暖流；从水温低的海区流向水温高的海区的洋流，叫作寒流。</p>
<p class="q-n">→ 性质由「与流经海区的水温比较」决定，与半球无关：赤道附近可以有寒流（秘鲁寒流），高纬也可以有暖流（北大西洋暖流）。</p>
</div>
<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>暖流</th><th>寒流</th></tr></thead>
<tbody>
<tr><td>流向</td><td>低纬 → 高纬</td><td>高纬 → 低纬</td></tr>
<tr><td>水温与流经海区比</td><td>高于流经海区</td><td>低于流经海区</td></tr>
<tr class="key"><td>等温线凸向</td><td>向高纬凸出</td><td>向低纬凸出</td></tr>
<tr><td>对沿岸气候</td><td>增温增湿</td><td>降温减湿</td></tr>
<tr><td>典型实例</td><td>墨西哥湾暖流、北大西洋暖流、日本暖流</td><td>秘鲁寒流、加利福尼亚寒流、本格拉寒流</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">最容易背错的是第三行：等温线凸向与洋流流向一致，暖流把等温线往高纬「顶」。判读时先看凸向定性质，再谈冷暖。</p>
<div class="gx-quote">
<p class="q-t">课本原话 · 分布规律<span class="q-src">人教版（2019）选择性必修1 · 第四章第二节</span></p>
<p class="q-b">中低纬度海区形成以副热带为中心的大洋环流，北半球呈顺时针方向流动，南半球呈逆时针方向流动；北半球中高纬度海区形成以副极地为中心的大洋环流，呈逆时针方向流动；南半球中高纬度形成西风漂流；北印度洋海区形成季风洋流，夏季呈顺时针方向流动，冬季呈逆时针方向流动。</p>
<p class="q-n">→ 方向由风带决定：信风带吹出低纬一支，西风带吹出中纬一支，加大陆阻挡围成闭合环流，于是「北顺南逆」。南半球 40°—60° 无陆地阻挡，环流不闭合，只剩西风漂流。</p>
</div>
<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>影响</th><th>机制</th><th>实例</th></tr></thead>
<tbody>
<tr><td>气候</td><td>暖流增温增湿，寒流降温减湿</td><td>西欧温带海洋性气候；南美西岸热带沙漠逼近赤道</td></tr>
<tr><td>航行</td><td>顺流省时省燃料，逆流费时；寒流流经处多海雾、多冰山</td><td>纽芬兰以东海雾；拉布拉多寒流带来的冰山</td></tr>
<tr><td>污染</td><td>加快污染物扩散与净化，同时扩大污染范围</td><td>油膜随洋流漂移，先扩散后沉降</td></tr>
</tbody>
</table>
</div>

</section>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>

<div class="gx-ex">
<p class="ex-t">例题 · 洋流性质、气候与渔场<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">甲、乙两地位于 30°N 附近的大陆两岸，纬度相近，年均温分别为 12℃ 和 20℃；甲地沿海有大型渔场。判断甲、乙沿岸洋流的性质并说明理由，分析洋流对两地气候的影响，并说明甲地渔场的成因。</p>
<ol class="steps" id="gxSteps">
<li class="step"><p class="s-h">第 1 步 · 先排除太阳辐射</p><p class="s-b">两地纬度相近，正午太阳高度与昼长基本相同，接收的太阳辐射相近；年均温却相差 8℃，差异只能来自下垫面——沿岸洋流。</p><p class="s-k">用到：影响气温的因素（纬度、下垫面）</p></li>
<li class="step" hidden><p class="s-h">第 2 步 · 用温度定性质</p><p class="s-b">甲地 12℃ 低于同纬度平均，沿岸为寒流；乙地 20℃ 高于同纬度平均，沿岸为暖流。</p><p class="s-k">用到：寒流降温、暖流增温</p></li>
<li class="step" hidden><p class="s-h">第 3 步 · 把理由写成课本语言</p><p class="s-b">甲地寒流由水温低的海区流向水温高的海区，水温低于流经海区；乙地暖流由水温高的海区流向水温低的海区，水温高于流经海区。只写「甲冷乙热」不给分。</p><p class="s-k">用到：洋流的性质分类</p></li>
<li class="step" hidden><p class="s-h">第 4 步 · 气候影响要落到降水</p><p class="s-b">甲地寒流降温减湿，沿岸气流稳定、降水少，形成热带沙漠气候；乙地暖流增温增湿，沿岸降水增多、气温年较差变小。</p><p class="s-k">用到：洋流对沿岸气候的影响</p></li>
<li class="step" hidden><p class="s-h">第 5 步 · 渔场写成链条</p><p class="s-b">甲地位于 30°N 大陆西岸，是副热带环流的东岸，沿岸为寒流；副热带海区盛行信风，离岸风把表层海水吹离海岸，深层冷水上涌形成上升补偿流，营养盐上泛，浮游生物繁盛，鱼类集聚；沿岸大陆架浅海，光照充足。</p><p class="s-k">用到：渔场成因（上升补偿流 + 大陆架）</p></li>
</ol>

<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">① 甲为寒流，乙为暖流。甲地水温低于同纬度，寒流由水温低的海区流向水温高的海区；乙地相反。<br>② 甲地寒流降温减湿，降水少，形成热带沙漠气候；乙地暖流增温增湿，降水多，气温年较差小。<br>③ 甲位于副热带环流东岸，沿岸寒流；信风为离岸风，表层海水离岸，深层冷水上涌形成上升补偿流，营养盐上泛，浮游生物繁盛，鱼类集聚；沿岸大陆架宽广，光照充足。</p>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">五问，覆盖定义、反直觉、易错、边界与应用。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">寒流的水温一定比暖流低吗？</p>
<p class="a">不一定。性质比的是「与流经海区的水温」，同一海区寒流更低；不同纬度不能直接比，赤道寒流可能比高纬暖流更暖。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="同纬度寒暖流水温对比">
<rect x="16" y="16" width="208" height="96" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text class="ms" x="28" y="42">高纬 8℃ → 低纬 20℃</text>
<text class="ms" x="28" y="60">寒流：低于流经海区</text>
<text class="ms" x="28" y="86">低纬 25℃ → 高纬 15℃</text>
<text class="ms" x="28" y="104">暖流：高于流经海区</text>
</svg>
</div>
<div class="qac">
<p class="q">同是 30° 附近，为什么大陆西岸冷、东岸暖？</p>
<p class="a">副热带环流决定了两岸性质：东岸（大陆西岸）是寒流，西岸（大陆东岸）是暖流。北顺南逆，两岸正好相反。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="30度纬线两岸洋流性质">
<rect x="16" y="16" width="208" height="96" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="28" y1="64" x2="212" y2="64" stroke="#c3d5e0" stroke-dasharray="4 3"/>
<text class="ms" x="30" y="86">西岸 寒流 ↓</text>
<text class="ms" x="140" y="86">东岸 暖流 ↑</text>
<text class="ms" x="30" y="44">30°N 纬线</text>
</svg>
</div>
<div class="qac">
<p class="q">北印度洋夏季洋流是顺时针还是逆时针？</p>
<p class="a">顺时针。夏季西南季风把海水吹向东，环流闭合为顺时针；冬季东北季风相反。记「夏顺冬逆」，不要记反。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="北印度洋季风洋流方向">
<rect x="16" y="16" width="208" height="96" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text class="ms" x="28" y="46">夏季 西南季风 → 顺时针</text>
<text class="ms" x="28" y="74">冬季 东北季风 → 逆时针</text>
<text class="ms" x="28" y="100">同一片海，季节反转</text>
</svg>
</div>
<div class="qac">
<p class="q">西风漂流为什么是寒流？</p>
<p class="a">南半球 40°—60° 无陆地阻挡，海水自西向东环绕南极，水源来自较高纬的冷海水，水温低于流经海区；北半球同纬度有陆地阻挡，形不成这条洋流。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="南半球西风漂流示意图">
<rect x="16" y="16" width="208" height="96" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="28" y1="40" x2="212" y2="40" stroke="#c3d5e0" stroke-dasharray="4 3"/>
<line x1="28" y1="92" x2="212" y2="92" stroke="#c3d5e0" stroke-dasharray="4 3"/>
<text class="ms" x="30" y="64">40°S — 60°S  自西向东 →</text>
<text class="ms" x="30" y="84">寒流 · 无陆地阻挡</text>
</svg>
</div>
<div class="qac">
<p class="q">厄尔尼诺年秘鲁渔场为什么减产？</p>
<p class="a">赤道东太平洋水温异常升高，暖水堆积使温跃层加深，上升流减弱，营养盐上泛减少，浮游生物与鱼类随之减少。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="厄尔尼诺年上升流减弱">
<rect x="16" y="16" width="208" height="96" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="28" y1="40" x2="212" y2="40" stroke="#9fc3d8"/>
<line x1="150" y1="92" x2="150" y2="52" stroke="#0f766e" stroke-dasharray="3 3" opacity=".6"/>
<text class="ms" x="30" y="62">东太平洋 水温偏高</text>
<text class="ms" x="30" y="80">上升流减弱</text>
<text class="ms" x="30" y="100">→ 渔场减产</text>
</svg>
</div>
</div>
<p class="gx-note">这五问其实是同一件事：洋流的方向由风带和大陆轮廓决定，性质由流向决定，气候与渔场的后果再由性质推出来。</p>
</section>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>
<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 南半球中低纬大洋环流呈顺时针方向</p>

<p class="er-w">错在哪：把「北顺南逆」记成「都顺时针」。用风带推：东南信风加西风在南半球围成的环流是逆时针。</p>
</div>
<div class="er">
<p class="er-x">✗ 西风漂流是暖流，因为它把温暖海水带向高纬</p>

<p class="er-w">错在哪：把「西风」当成「暖」。西风漂流水来自较高纬，本身温度低；北半球同纬度没有这条洋流。</p>
</div>
<div class="er">
<p class="er-x">✗ 寒流都分布在南半球，暖流都分布在北半球</p>
<p class="er-v">✓ 寒暖流按性质划分，南北半球都有寒流和暖流</p>
<p class="er-w">错在哪：混淆「性质」与「半球」。加利福尼亚寒流、加那利寒流都在北半球。</p>
</div>
<div class="er">
<p class="er-x">✗ 渔场的成因就是寒暖流交汇</p>
<p class="er-v">✓ 渔场成因包括寒暖流交汇、上升补偿流和大陆架</p>
<p class="er-w">错在哪：漏掉秘鲁渔场，它只有上升补偿流；答题要写「机制 → 营养盐 → 浮游生物 → 鱼类」链条。</p>
</div>
<div class="er">
<p class="er-x">✗ 寒流增温增湿，暖流降温减湿</p>
<p class="er-v">✓ 暖流增温增湿，寒流降温减湿</p>
<p class="er-w">错在哪：两者说反。校验：西欧受北大西洋暖流影响温和湿润，南美西岸受秘鲁寒流影响干旱。</p>
</div>
<div class="er">
<p class="er-x">✗ 北印度洋季风洋流夏季逆时针、冬季顺时针</p>
<p class="er-v">✓ 夏季顺时针、冬季逆时针（夏顺冬逆）</p>
<p class="er-w">错在哪：季节写反。夏季西南季风推动海水向东，环流闭合为顺时针。</p>
</div>
</div>
