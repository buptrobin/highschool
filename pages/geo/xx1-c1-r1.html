<section class="gx-sec" id="a">
  <h2><span class="sn">01</span>问题长什么样</h2>
  <p class="gx-h2s">问题研究课没有定义要背，要背的是"这道题的结构"：三个词、三个数、四个动作。</p>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 研究课题<span class="q-src">人教版（2019）选择性必修1 · 第一章问题研究</span></p>
    <p class="q-b">人类是否需要人造月亮？</p>
    <p class="q-n">→ 这句话里有三个词要拆开：<b>"需要"</b>是价值判断，<b>"人造月亮"</b>是一套技术方案，
    <b>"人类"</b>其实不是全人类——受益的是特定纬度、特定时段的城市。三个词不拆，答案就会变成"我觉得"。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">背景材料 · 俄罗斯「旗帜」计划<span class="q-src">1993 年 · 公开报道通行值</span></p>
    <p class="q-b">1993 年 2 月，俄罗斯用"进步 M-15"号货运飞船在轨道上展开了一面直径约 20 m 的反射镜，
    把阳光反射到地面，形成一个直径约 5 km 的光斑，以约 8 km/s 的速度从法国南部扫过欧洲上空；
    1999 年的"旗帜-2.5"（25 m）在展开时被天线挂住撕裂，计划终止。</p>
    <p class="q-n">→ 三个数字要记：<b>20 m</b>（镜面）、<b>5 km</b>（光斑）、<b>8 km/s</b>（光斑移动）。
    它们已经预告了后面所有争论：镜面不大、光斑不大，而且跑得极快。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本要求 · 问题研究怎么答<span class="q-src">人教版（2019）选择性必修1 · 问题研究栏目</span></p>
    <p class="q-b">问题研究的一般过程：提出问题—收集资料—分析论证—得出结论。</p>
    <p class="q-n">→ 四个动作里，<b>"分析论证"</b>占分最多。它要求三件事：<b>先立标准</b>、<b>再摆证据</b>、
    最后才说"需要 / 不需要"。少了中间两步，就只剩一个观点。</p>
  </div>

  <p class="gx-h2s" style="margin-top:18px">把两边的主张并排放，会看到每一条主张背后都缺一个数（<b>高亮那一行最容易被漏掉</b>）：</p>

<section class="gx-sec" id="d">
  <h2><span class="sn">04</span>一道题走一遍</h2>

    <p class="ex-t">例题<span class="bdg bdg-must">必考</span></p>
    <p class="ex-q">某公司发布"人造月亮"方案：向约 500 km 高的轨道发射 <b>3 面直径 200 m</b> 的反射镜，
    "让莫斯科的冬夜亮如白昼"。已知莫斯科城区东西跨度约 <b>30 km</b>，冬至夜长约 17 小时。<br><br>
    （1）要判断"亮如白昼"是否成立，还需要哪些数据？<br>
    （2）从两个不同角度说明该方案难以实现。<br>
    （3）写出你的结论，必须带条件。</p>

    <ol class="steps" id="gxSteps">
      <li class="step">
        <p class="s-h">第 1 步 · 先把"如白昼"换成一个数</p>
        <p class="s-b">"白昼"的判据是照度。晴天正午约 1×10⁵ lx，所以"亮如白昼"至少要 10⁴ lx 量级。
        先把这个词换成一个数，题目才有可检验的对象；这一步不做，后面所有讨论都会变成"我觉得挺亮的"。</p>
        <p class="s-k">用到：照度是判断"亮不亮"的物理量</p>
      </li>
      <li class="step" hidden>
        <p class="s-h">第 2 步 · 按公式反推，列数据清单</p>
        <p class="s-b">第（1）问要的是"还缺什么"，不是"我觉得缺什么"。照度由 D、ρ、h 决定，光斑由 D、h 决定，
        够不够"如白昼"还取决于照多久、照多大。清单就是：<b>镜面直径与反射率、轨道高度、光斑直径、
        单次过境时长与重现周期、目标区所需照度与面积、发射质量与成本</b>。</p>
        <p class="s-k">用到：从公式反推自变量（D、ρ、h）</p>
      </li>
      <li class="step" hidden>
        <p class="s-h">第 3 步 · 代入模型，把数字算出来</p>
        <p class="s-b">D=200 m、h=500 km：每面约 <b>222 lx</b>、光斑 <b>4.7 km</b>。3 面即使"叠加"也只约 <b>666 lx</b>
        （这是取上限：镜面在不同轨道面，不可能同时照到同一处），
        是晴天正午的 0.7%，离 10⁴ lx 还差 15 倍。覆盖上，3 个光斑拼起来约 52 km²，
        而 30 km 见方的城区约 900 km²——<b>覆盖率不到 6%</b>。</p>
        <p class="s-k">用到：E ∝ [D/(D+0.009h)]²；光斑面积 = π/4 × 光斑直径²</p>
      </li>
      <li class="step" hidden>
        <p class="s-h">第 4 步 · 换一个角度，别只盯亮度</p>
        <p class="s-b">第（2）问要"两个角度"，就得跳出亮度：一是<b>物理约束</b>（光斑在动，一次过境只有几分钟，
        下一圈约 95 分钟后）；二是<b>代价</b>（光污染、发射与在轨风险、法律归属）。
        这两条都不是"再多发几面镜子"能解决的——它们随规模变大而变糟。</p>
        <p class="s-k">用到：评价标准三条——必要性、可行性、代价</p>
      </li>
      <li class="step" hidden>
        <p class="s-h">第 5 步 · 结论写成"带条件"的</p>
        <p class="s-b">结论句式：<b>在"替代城市照明"的前提下不需要</b>，因为 LED 加储能能以低得多的代价提供同等照度，
        还不产生光污染；<b>在"灾害应急、局部短时、电网中断"的前提下可以讨论</b>，
        但得先证明它比发电机和移动灯塔更便宜、更可靠。</p>
        <p class="s-k">用到：结论 = 判断 + 前提 + 理由</p>
      </li>
    </ol>

<script>
/* 人造月亮 · 反射镜照度估算器（等 page.js / gx.js 就绪后运行） */
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var GX = window.GX, $ = GX.$, el = GX.el, tx = GX.tx, n1 = GX.n1, clamp = GX.clamp;
  var stage = $("gxStage");
  if (!stage) return;

  var K = 1361 * 0.9 * 100;   /* 122 490：太阳常数 × 反射率 × 光视效能 */
  var H = 500;                /* 当前轨道高度 km */

  var WIDE = {
    vb: "0 0 880 440",
    sc: { x: 16, y: 18, w: 488, h: 404, gy: 362, oTop: 92, oBot: 196, mx: 196, sx: 262,
          pxKm: 26, sun: [62, 74], mw0: 14, mwK: 20,
          bld: [[286, 16], [304, 26], [322, 18], [342, 30], [362, 20], [382, 26], [402, 14], [424, 22]] },
    ru: { x: 520, y: 18, w: 344, h: 404, ax: 586, top: 84, bot: 366, lab: 842, tick: 578, cur: 596 }
  };
  var NARROW = {
    vb: "0 0 360 520",
    sc: { x: 12, y: 12, w: 336, h: 240, gy: 210, oTop: 62, oBot: 132, mx: 150, sx: 196,
          pxKm: 17, sun: [38, 46], mw0: 12, mwK: 16,
          bld: [[216, 12], [232, 20], [248, 14], [266, 24], [284, 16], [302, 20]] },
    ru: { x: 12, y: 258, w: 336, h: 250, ax: 64, top: 312, bot: 496, lab: 338, tick: 56, cur: 74 }
  };
  var L = WIDE, REF = {};

  function yOf(v) {
    var ru = L.ru;
    return ru.bot - (Math.log(v) / Math.LN10 + 1) * (ru.bot - ru.top) / 6;
  }

  function fmt(v) {
    if (v < 10) return v.toFixed(1);
    return Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  }

  function build() {
    var gA = $("gxA"), gB = $("gxB");
    var sc = L.sc, ru = L.ru, i, yy;
    gA.textContent = ""; gB.textContent = "";
    REF = {};

    /* ---------- 左：轨道与地面 ---------- */
    el("rect", { x: sc.x, y: sc.y, width: sc.w, height: sc.h, rx: 12, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    tx(gA, sc.x + 12, sc.y + 24, "① 轨道上的反射镜", "#151a21", "start", 11, 700);

    el("circle", { cx: sc.sun[0], cy: sc.sun[1], r: 12, fill: "#f7d98a", stroke: "#d9a832", "stroke-width": 1.2 }, gA);
    REF.ray1 = el("line", { stroke: "#b8791f", "stroke-width": 1, "stroke-dasharray": "3 3" }, gA);
    REF.ray2 = el("line", { stroke: "#b8791f", "stroke-width": 1, "stroke-dasharray": "3 3" }, gA);

    REF.orbit = el("line", { x1: sc.x + 14, x2: sc.x + sc.w - 34, stroke: "#b8d8e8", "stroke-width": 1.1, "stroke-dasharray": "6 5" }, gA);
    REF.arrow = el("path", { fill: "#0891b2" }, gA);
    REF.tH = tx(gA, sc.x + 14, 0, "", "#3f6f92", "start", 10, 700);

    REF.beam = el("path", { fill: "#fbe9c9", opacity: 0.55 }, gA);

    el("line", { x1: sc.x + 10, y1: sc.gy, x2: sc.x + sc.w - 10, y2: sc.gy, stroke: "#c9c2b0", "stroke-width": 1.3 }, gA);
    for (i = sc.x + 22; i < sc.x + sc.w - 16; i += 28) {
      el("line", { x1: i, y1: sc.gy + 2, x2: i + 9, y2: sc.gy + 11, stroke: "#d8d2c4", "stroke-width": 1 }, gA);
    }
    sc.bld.forEach(function (b) {
      el("rect", { x: b[0], y: sc.gy - b[1], width: 14, height: b[1], fill: "#dfe8ef", stroke: "#bccbd8", "stroke-width": 0.8 }, gA);
    });

    REF.spot = el("ellipse", { cy: sc.gy, ry: 10, fill: "#f3c98a", "fill-opacity": 0.55, stroke: "#b8791f", "stroke-width": 1.2, "stroke-dasharray": "4 3" }, gA);
    REF.tSpot = tx(gA, 0, sc.gy + 24, "", "#8a5c14", "middle", 10, 700);

    REF.mirror = el("ellipse", { fill: "#eef6fb", stroke: "#2f6f8a", "stroke-width": 1.6 }, gA);
    REF.tD = tx(gA, 0, 0, "", "#0b6580", "start", 10, 700);

    /* ---------- 右：对数标尺 ---------- */
    el("rect", { x: ru.x, y: ru.y, width: ru.w, height: ru.h, rx: 12, fill: "#f8fbfd", stroke: "#dbe7ef" }, gB);
    tx(gB, ru.x + 16, ru.y + 26, "② 地面照度标尺（对数）", "#151a21", "start", 11, 700);
    tx(gB, ru.x + 16, ru.y + 44, "每一格 ×10；虚线是判断亮不亮的尺子", "#5a6472", "start", 8.5);

    var days = ["10⁻¹", "10⁰", "10¹", "10²", "10³", "10⁴", "10⁵"];
    el("line", { x1: ru.ax, y1: ru.top, x2: ru.ax, y2: ru.bot, stroke: "#c9c2b0", "stroke-width": 1.2 }, gB);
    for (i = 0; i < 7; i++) {
      yy = yOf(Math.pow(10, i - 1));
      el("line", { x1: ru.ax, y1: yy, x2: ru.lab, y2: yy, stroke: "#eff2f5", "stroke-width": 1 }, gB);
      el("line", { x1: ru.ax - 4, y1: yy, x2: ru.ax, y2: yy, stroke: "#c9c2b0", "stroke-width": 1 }, gB);
      tx(gB, ru.tick, yy + 3, days[i], "#9aa3ae", "end", 8.5);
    }

    var y10 = yOf(10), y30 = yOf(30);
    el("rect", { x: ru.ax, y: y30, width: ru.lab - ru.ax, height: y10 - y30, fill: "#fdf3e0" }, gB);
    el("line", { x1: ru.ax, y1: y10, x2: ru.lab, y2: y10, stroke: "#e0c48a", "stroke-width": 1, "stroke-dasharray": "4 3" }, gB);
    el("line", { x1: ru.ax, y1: y30, x2: ru.lab, y2: y30, stroke: "#e0c48a", "stroke-width": 1, "stroke-dasharray": "4 3" }, gB);
    tx(gB, ru.lab, (y10 + y30) / 2 + 3, "路灯 10–30 lx", "#8a5c14", "end", 8.5, 700);

    [[1e5, "晴天正午 1×10⁵ lx"], [300, "阅读 300 lx"], [0.2, "满月 0.2 lx"]].forEach(function (r) {
      var y = yOf(r[0]);
      el("line", { x1: ru.ax, y1: y, x2: ru.lab, y2: y, stroke: "#c9c2b0", "stroke-width": 1, "stroke-dasharray": "4 3" }, gB);
      tx(gB, ru.lab, y - 5, r[1], "#5a6472", "end", 8.5, 700);
    });

    REF.cur = el("line", { x1: ru.ax, x2: ru.lab, stroke: "#0891b2", "stroke-width": 2.2 }, gB);
    REF.curDot = el("circle", { cx: ru.ax, r: 4.2, fill: "#fff", stroke: "#0891b2", "stroke-width": 2 }, gB);
    REF.curLab = tx(gB, ru.cur, 0, "", "#0b6580", "start", 11, 700);
  }

  function render() {
    var sc = L.sc, D = +$("gxSl").value, h = H;
    var spread = 0.009 * h * 1000;              /* m */
    var spotM = D + spread;
    var E = K * Math.pow(D / spotM, 2);
    var spotKm = spotM / 1000;
    var yO = sc.oBot - (h - 300) / 500 * (sc.oBot - sc.oTop);
    var hw = sc.mw0 + sc.mwK * D / 500;
    var rx = spotKm * sc.pxKm / 2;
    var mx = sc.mx, sx = sc.sx, gy = sc.gy;

    REF.ray1.setAttribute("x1", n1(sc.sun[0] + 9));
    REF.ray1.setAttribute("y1", n1(sc.sun[1] + 6));
    REF.ray1.setAttribute("x2", n1(mx - hw));
    REF.ray1.setAttribute("y2", n1(yO - 2));
    REF.ray2.setAttribute("x1", n1(sc.sun[0] + 9));
    REF.ray2.setAttribute("y1", n1(sc.sun[1] + 6));
    REF.ray2.setAttribute("x2", n1(mx + hw));
    REF.ray2.setAttribute("y2", n1(yO - 2));

    REF.orbit.setAttribute("y1", n1(yO));
    REF.orbit.setAttribute("y2", n1(yO));
    var ax = sc.x + sc.w - 34;
    REF.arrow.setAttribute("d", "M " + n1(ax) + " " + n1(yO - 5) + " L " + n1(ax + 9) + " " + n1(yO) +
      " L " + n1(ax) + " " + n1(yO + 5) + " z");

    REF.tH.setAttribute("y", n1(yO - 9));
    REF.tH.textContent = "轨道 h = " + h + " km";

    REF.mirror.setAttribute("cx", n1(mx));
    REF.mirror.setAttribute("cy", n1(yO));
    REF.mirror.setAttribute("rx", n1(hw));
    REF.mirror.setAttribute("ry", 3.5);

    REF.beam.setAttribute("d",
      "M " + n1(mx - hw) + " " + n1(yO + 1) +
      " L " + n1(sx - rx) + " " + n1(gy) +
      " L " + n1(sx + rx) + " " + n1(gy) +
      " L " + n1(mx + hw) + " " + n1(yO + 1) + " Z");

    REF.spot.setAttribute("cx", n1(sx));
    REF.spot.setAttribute("rx", n1(rx));
    REF.tSpot.setAttribute("x", n1(sx));
    REF.tSpot.textContent = "光斑 " + spotKm.toFixed(1) + " km · " + fmt(E) + " lx";

    REF.tD.setAttribute("x", n1(mx + hw + 10));
    REF.tD.setAttribute("y", n1(yO - 9));
    REF.tD.textContent = "反射镜 D = " + D + " m";

    /* 读数卡 */
    $("gxVa").textContent = D + " m";
    $("gxVs1").textContent = "轨道 " + h + " km · 反射率 0.90";
    $("gxVe").textContent = fmt(E) + " lx";
    $("gxVs2").textContent = "满月的 " + Math.round(E / 0.2) + " 倍 · 正午的 " + (E / 1e5 * 100).toFixed(2) + "%";
    $("gxVk").textContent = spotKm.toFixed(1) + " km";
    $("gxVs3").textContent = "照到地面约 " + Math.round(Math.PI / 4 * spotKm * spotKm) + " km²";

    var st, sn, col, bg;
    if (E < 0.2) {
      st = "比满月还暗"; sn = "满月约 0.2 lx，这个亮度连影子都照不出来"; col = "#3f6f92"; bg = "#eef6fb";
    } else if (E < 10) {
      st = "远低于路灯"; sn = "约满月的 " + Math.round(E / 0.2) + " 倍，还当不了路灯"; col = "#5a6472"; bg = "#f2f4f6";
    } else if (E < 30) {
      st = "相当于路灯"; sn = "路灯下约 10–30 lx，刚好在这一档"; col = "#1e6640"; bg = "#e6f6ee";
    } else if (E < 300) {
      st = "接近阅读照度"; sn = "阅读标准 300 lx，这里只有它的 " + Math.round(E / 300 * 100) + "%"; col = "#8a5c14"; bg = "#fdf3e0";
    } else if (E < 10000) {
      st = "可以阅读"; sn = "已过阅读标准，但只有正午的 " + (E / 1e5 * 100).toFixed(1) + "%"; col = "#8a5c14"; bg = "#fdf3e0";
    } else {
      st = "接近白天"; sn = "晴天正午约 1×10⁵ lx"; col = "#b8402f"; bg = "#fbeae7";
    }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    var box = $("gxStBox");
    if (box) {
      box.style.background = bg;
      box.style.borderColor = col + "44";
      var kv = box.querySelector(".v");
      if (kv) kv.style.color = col;
    }

    /* 标尺上的当前值 */
    var yE = yOf(clamp(E, 0.1, 1e5));
    REF.cur.setAttribute("y1", n1(yE));
    REF.cur.setAttribute("y2", n1(yE));
    REF.curDot.setAttribute("cy", n1(yE));
    REF.curLab.setAttribute("y", n1(yE - 7));
    REF.curLab.textContent = fmt(E) + " lx";
  }

  function applyLayout() {
    var w = stage.parentElement.getBoundingClientRect().width;
    L = w >= 640 ? WIDE : NARROW;
    stage.setAttribute("viewBox", L.vb);
    build();
    render();
  }

  $("gxSl").addEventListener("input", render);
  $("gxH3").addEventListener("click", function () { H = 300; render(); });
  $("gxH5").addEventListener("click", function () { H = 500; render(); });
  $("gxH8").addEventListener("click", function () { H = 800; render(); });

  stage.addEventListener("keydown", function (ev) {
    if (ev.key === "ArrowLeft" || ev.key === "ArrowRight") {
      ev.preventDefault();
      var sl = $("gxSl");
      var v = clamp(+sl.value + (ev.key === "ArrowRight" ? 5 : -5), 50, 500);
      sl.value = String(v);
      render();
    }
  });

  var tmr = null;
  window.addEventListener("resize", function () {
    clearTimeout(tmr);
    tmr = setTimeout(applyLayout, 180);
  });

  applyLayout();
});
</script>
</body>
</html>
