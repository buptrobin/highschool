<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。</p>
<div class="gx-quote">
<p class="q-t">课本核心表述 · 资源跨区域调配<span class="q-src">人教版（2019）选择性必修2 · 第四章第二节</span></p>
<p class="q-b">资源跨区域调配，是把资源从富集区调往短缺区，以缓解资源分布与消费需求空间不匹配的矛盾，实现资源优化配置。</p>
</div>
<p class="gx-note">最容易背错的是：把输出地写成“只受益”。资源输出地同样付出生态与机会成本。先纠正一个方向：<b>水资源是南多北少</b>，<b>煤炭是北多南少</b>，不要把两者说反。</p>
</section>

<p><b>统筹规划</b>：全流域、多工程统一算水账；<b>生态优先</b>：保障生态流量、落实生态补偿；<b>市场调节</b>：水价气价反映成本；<b>节水优先</b>：先节水治污、再调水。调水不是解决缺水的唯一办法。</p>
<p class="gx-take">调水是补充水源，不是替代节水。南水北调强调<b>先节水后调水、先治污后通水、先环保后用水</b>。</p>

<section class="gx-sec" id="d">
<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点“下一步”。</p>
<div class="gx-ex">
<p class="ex-t">例题 · 华北缺水与中线调水<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">华北某市长期靠开采地下水满足生产生活用水，地下水位持续下降，部分区域出现地面沉降。南水北调中线一期通水后，该市用上丹江口水库来水，地下水位逐步回升。据此回答：（1）说明该市缺水的原因；（2）分析中线调水对该市的影响；（3）说明调水工程需要配套哪些措施。</p>
<ol class="steps" id="gxSteps">
<li class="step"><p class="s-h">第 1 步 · 拆问，不急着写</p><p class="s-b">三问分别是“为什么缺”“调来后怎样”“还要做什么”。第（1）问答自然与人为原因，第（2）问答有利与不利，第（3）问答工程、管理、市场三类措施。</p><p class="s-k">用到：区域资源短缺的分析框架</p></li>
<li class="step" style="display:none"><p class="s-h">第 2 步 · 缺水原因分两层</p><p class="s-b">自然：温带季风气候，降水较少且集中在夏季，地表径流不足，人均水资源少。人为：人口城市密集，工农业用水量大；长期超采地下水；水污染和浪费加重缺口。</p><p class="s-k">用到：自然原因 + 人为原因</p></li>
<li class="step" style="display:none"><p class="s-h">第 3 步 · 影响先落在“该市”</p><p class="s-b">有利：增加水源，缓解生活生产缺水；回补地下水，减缓地面沉降；改善水生态。不利：水价和工程维护成本上升；若不控需，可能形成对调水的依赖。</p><p class="s-k">用到：输入地的收益与代价</p></li>
<li class="step" style="display:none"><p class="s-h">第 4 步 · 配套措施要成体系</p><p class="s-b">工程：管网改造、节水灌溉、雨洪利用、地下水回灌。管理：严格限采、水质监测、生态补偿。市场：水价反映成本，实行阶梯水价。核心是“先节水后调水、先治污后通水、先环保后用水”。</p><p class="s-k">用到：节水优先、生态优先、市场调节</p></li>
<li class="step" style="display:none"><p class="s-h">第 5 步 · 组织成答题卡语言</p><p class="s-b">原因分自然/人为；影响分有利/不利；措施分工程/管理/市场。每点先写结论，再补一句机制，例如“回补地下水→地下水位回升→减缓地面沉降”。</p><p class="s-k">用到：分点、术语、因果链</p></li>
</ol>

<div class="ans" id="gxAns" style="display:none">
<p class="ans-t">参考答案（可抄进答题卡）</p>
<p class="ans-b">（1）自然：温带季风气候，降水较少且集中，地表径流不足，人均水资源少。人为：人口城市密集，工农业用水量大；长期超采地下水；水污染和浪费加剧短缺。<br>（2）有利：增加水源，缓解生产生活缺水；回补地下水，减缓地面沉降；改善水生态。不利：水价与工程维护成本上升；对调水形成一定依赖。<br>（3）节水优先：推广节水灌溉、工业循环用水、阶梯水价；加强治污与水质保护；严控地下水开采并实施回灌；建立生态补偿与工程管护机制；统筹生活、生产、生态用水。</p>
</div>
</div>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">五问，都是同一套判断。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「资源跨区域调配，是不是因为资源总量不够？」</p>
<p class="a">不一定。调配的直接原因是空间错位：资源在富集区，需求在另一处。总量可能不少，但“可经济利用的水或能源”与人口产业不匹配。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="资源与需求错位">
<rect x="20" y="30" width="70" height="40" rx="6" fill="#eef6fb" stroke="#b8d8e8"/>
<text x="55" y="54" text-anchor="middle" font-size="9" fill="#0b6580">资源多</text>
<path d="M96 50 H136" stroke="#0b6580" stroke-width="2"/><path d="M136 45 l7 5 -7 5 z" fill="#0b6580"/>
<rect x="150" y="30" width="70" height="40" rx="6" fill="#fff6e8" stroke="#ecd3a8"/>
<text x="185" y="54" text-anchor="middle" font-size="9" fill="#a35b16">需求大</text>
<text x="120" y="96" text-anchor="middle" font-size="9" fill="#3a3a35">总量 ≠ 空间配置</text>
</svg>
</div>
<div class="qac">
<p class="q">「调水越多，输入地就越受益吗？」</p>
<p class="a">不是。缺口填满后，新增调水的边际收益下降；输出地生态压力、工程成本和水质风险仍在上升。规模要由缺口与生态承载力共同决定。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="调水收益递减与生态压力上升">
<path d="M30 100 V28 M30 100 H212" stroke="#9aa7b2" fill="none"/>
<path d="M30 94 Q120 84 204 38" stroke="#c2410c" stroke-width="2" fill="none"/>
<path d="M30 94 Q140 98 208 32" stroke="#b8402f" stroke-width="2" stroke-dasharray="5 3" fill="none"/>
<text x="42" y="44" font-size="8.5" fill="#c2410c">收益</text>
<text x="166" y="36" font-size="8.5" fill="#b8402f">压力</text>
<text x="120" y="118" text-anchor="middle" font-size="9" fill="#3a3a35">收益递减，压力递增</text>
</svg>
</div>
<div class="qac">
<p class="q">「西气东输对输出地只有好处吗？」</p>
<p class="a">不是。输出地获得收入、就业和基础设施，但也要承担气田耗竭、植被扰动、水资源占用和利益分配等代价。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="西气东输输出地的收益与代价">
<path d="M34 62 H166" stroke="#c2410c" stroke-width="5" stroke-linecap="round"/>
<circle cx="34" cy="62" r="8" fill="#fff9f2" stroke="#c2410c" stroke-width="2"/>
<text x="70" y="44" font-size="8.5" fill="#1e6640">+ 收入、就业</text>
<text x="70" y="86" font-size="8.5" fill="#b8402f">− 生态、耗竭</text>
<path d="M176 54 l10 8 -10 8 z" fill="#c2410c"/>
</svg>
</div>
<div class="qac">
<p class="q">「东线为什么要逐级提水，中线却能自流？」</p>
<p class="a">东线利用京杭运河等河道，沿线地势低平，需泵站逐级提水；中线从丹江口水库引水，水源高程较高，可自流到华北。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="东线提水与中线自流对比">
<line x1="62" y1="100" x2="62" y2="34" stroke="#2b8db3" stroke-width="3"/>
<line x1="120" y1="100" x2="120" y2="34" stroke="#2b8db3" stroke-width="3"/>
<line x1="178" y1="100" x2="178" y2="34" stroke="#2b8db3" stroke-width="2" stroke-dasharray="5 4"/>
<circle cx="62" cy="76" r="6" fill="#eef6fb" stroke="#0b6580" stroke-width="2"/>
<text x="62" y="114" text-anchor="middle" font-size="8.5" fill="#3a3a35">东：提水</text>
<text x="120" y="114" text-anchor="middle" font-size="8.5" fill="#3a3a35">中：自流</text>
<text x="178" y="114" text-anchor="middle" font-size="8.5" fill="#3a3a35">西：规划</text>
</svg>
</div>
<div class="qac">
<p class="q">「调水能不能替代节水？」</p>
<p class="a">不能。调水增加供给，节水管理需求；若不控制用水，调水会诱发新的浪费。教材强调节水优先，调水是补充水源。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="节水优先，调水是补充">
<path d="M40 46 H88 V58 H74 V80 H62 V58 H40 Z" fill="#7cc4dd" stroke="#0b6580"/>
<path d="M74 88 q8 12 0 18 q-8 -6 0 -18 z" fill="#2b8db3"/>
<text x="108" y="54" font-size="9" font-weight="700" fill="#1e6640">节水优先</text>
<text x="108" y="72" font-size="8.5" fill="#3a3a35">调水只是补充</text>
<text x="120" y="116" text-anchor="middle" font-size="8.5" fill="#3a3a35">先节水，再调水</text>
</svg>
</div>
</div>
</section>
<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>
<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 调水越多越好，最好把缺口一次填满。</p>
<p class="er-v">✓ 调水规模要适度：按缺口、生态承载力和成本确定，缺口填满后新增水量收益有限。</p>
<p class="er-w">错在哪：只看到输入地收益，忽略输出地生态压力与边际成本。</p>
</div>
<div class="er">
<p class="er-x">✗ 资源调配对输出地只有好处，反正资源多。</p>
<p class="er-v">✓ 输出地有资源优势变经济优势、就业和基础设施改善，也要承担生态压力、移民和资源耗竭。</p>
<p class="er-w">错在哪：把“资源多”当成“没有代价”，只算输入地一本账。</p>
</div>
<div class="er">
<p class="er-x">✗ 只要把水或气送到，工程就成功了。</p>
<p class="er-v">✓ 还要看沿线基础设施、水质保护、生态补偿和工程管护；南水北调强调先治污后通水。</p>
<p class="er-w">错在哪：忽略沿线与水质，把调配简化成“修一条管子”。</p>
</div>
<div class="er">
<p class="er-x">✗ 南水北调三条线都一样，反正都是从南往北调。</p>
<p class="er-v">✓ 东线借京杭运河、逐级提水；中线从丹江口自流；西线从长江上游调水入黄河上游，仍处规划。</p>
<p class="er-w">错在哪：只记方向，不记水源、线路和地形差异。</p>
</div>
<div class="er">
<p class="er-x">✗ 缺水就调水，调水可以替代节水。</p>
<p class="er-v">✓ 节水优先，调水是补充水源；还要治污、控需、回灌地下水，调水不是解决缺水的唯一办法。</p>
<p class="er-w">错在哪：把增加供给当成唯一手段，忽略需求管理和水生态。</p>
</div>
</div>
</section>

t(g, fx + off, fyLabel, "填补 " + Math.round(fr) + "%", "#c2410c", anchor, 8.5, 700);
t(g, fx + off, pyLabel, "压力 " + Math.round(pr), "#b8402f", anchor, 8.5, 700);
}
function draw() {
var box = $("gxA").parentElement;
L = box && box.getBoundingClientRect().width < 640 ? NARROW : WIDE;
$("gxStage").setAttribute("viewBox", L.vb);
var gA = $("gxA"), gB = $("gxB");
gA.textContent = ""; gB.textContent = "";
drawLeft(gA); drawRight(gB);
}
function render() {
var sl = $("gxSl");
if (sl) Q = +sl.value;
var f = fillAt(Q), pr = pressureAt(Q), st = statusOf(Q);
$("gxVa").textContent = Q;
$("gxVb").textContent = Math.round(f);
$("gxVc").textContent = Math.round(pr);
$("gxVs").textContent = st.name;
$("gxVsn").textContent = st.sub;
$("gxStBox").style.background = st.bg;
$("gxStBox").style.borderColor = st.col + "44";
$("gxVs").style.color = st.col;
$("gxTake").textContent = st.take;
draw();
}
var stage = $("gxStage");
if (stage) {
$("gxSl").addEventListener("input", render);
$("gxP1").addEventListener("click", function () { $("gxSl").value = 30; render(); });
$("gxP2").addEventListener("click", function () { $("gxSl").value = 85; render(); });
$("gxP3").addEventListener("click", function () { $("gxSl").value = 140; render(); });
stage.addEventListener("keydown", function (ev) {
if (ev.key === "ArrowLeft" || ev.key === "ArrowRight") {
ev.preventDefault();
var next = GX.clamp(+$("gxSl").value + (ev.key === "ArrowRight" ? 2 : -2), 0, QMAX);
$("gxSl").value = next; render();
}
});
var tmr = null;
window.addEventListener("resize", function () {
clearTimeout(tmr); tmr = setTimeout(draw, 180);
});
render();
}
var next = $("gxNext"), ans = $("gxAns"), cnt = $("gxCnt");
var steps = Array.prototype.slice.call(document.querySelectorAll("#gxSteps .step"));
if (next && steps.length) {
var i = 0, ansOpen = false;
function stepState() {
cnt.textContent = (i + 1) + " / " + steps.length;
next.textContent = i === steps.length - 1 ? (ansOpen ? "收起答案" : "看答案") : "下一步";
if(i===steps.length-1){next.disabled=false;setTimeout(()=>next.disabled=false,0)}
}
next.addEventListener("click", function () {
if (i < steps.length - 1) {
i += 1; steps[i].style.display = "block";
ansOpen = false; if (ans) ans.style.display = "none";
} else {
ansOpen = !ansOpen;
if (ans) ans.style.display = ansOpen ? "block" : "none";
}
stepState();
});
stepState();
}
});
</script>
