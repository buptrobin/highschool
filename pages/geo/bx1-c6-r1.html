<p class="gx-lede">课本把这一节做成了一次<b>小研究</b>：给你一个县域，三个候选地块，问你仓库建在哪。
它看起来是"开放题"，其实有<b>固定骨架</b>：<b>先摆条件（安全、交通、覆盖、弹性）→ 再给权重 → 最后给结论并说明代价</b>。
这一页要把那套骨架摊开，还要让你亲手拖一次权重，看<b>同一个县、同样三个点，第一名会不会换人</b>。</p>

<section class="gx-sec" id="a">
  <h2><span class="sn">01</span>材料怎么说</h2>
  <p class="gx-h2s">问题研究没有"标准答案"，但有"标准材料"。三则材料读完，问题就清楚了。</p>

  <div class="gx-quote">
    <p class="q-t">教材材料 · 第一则：体系<span class="q-src">人教版（2019）必修第一册 · 第六章 问题研究</span></p>
    <p class="q-b">我国建立<b>中央和地方两级</b>救灾物资储备体系：中央储备库负责跨省区的大宗物资调配，
    地方（省、市、县）储备库负责本区域内的就近保障，形成<b>分级储备、就近调运、逐级补充</b>的格局。</p>
    <p class="gx-n">→ 关键词是<b>"分级"</b>：不是全国建几个大库就完事，而是<b>每一级都要有自己的库</b>。
    原因很简单：<b>灾害发生后最缺的是头 72 小时的物资</b>，而从千里之外调运，
    最快也要一天以上。<b>级别越低，离灾区越近，越快——但能存的越少。</b>
    这个"快与多的矛盾"，是整节的逻辑起点。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">教材材料 · 第二则：条件<span class="q-src">人教版（2019）必修第一册 · 第六章 问题研究</span></p>
    <p class="q-b">救灾物资储备库的选址，一般要考虑：<b>交通便利</b>（靠近公路、铁路、机场）；
    <b>地势较高、地质稳定</b>，避开洪涝、滑坡、泥石流等灾害隐患点；
    <b>靠近灾害多发区和人口密集区</b>，使服务范围覆盖主要受灾区域；
    <b>场地有扩展余地</b>，并便于平时利用。</p>
    <p class="gx-n">→ 四条可分两类：
    <b>"不能自己先被淹"（安全）+ "物资要出得去"（交通）</b>是<b>硬约束</b>，
    做不到就直接淘汰；<b>"覆盖多少人"（覆盖）+ "以后能不能扩"（弹性）</b>是<b>优化项</b>，
    在合格者之间排序。<b>先淘汰，后排序</b>，这个顺序写进答案里，结构分就稳。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">教材材料 · 第三则：难题<span class="q-src">人教版（2019）必修第一册 · 第六章 问题研究</span></p>
    <p class="q-b">在实际选址中，上述条件往往<b>不能同时满足</b>：
    地势高、安全的地块常在城郊，交通与覆盖较差；
    交通最好、离人口最近的地块，恰恰可能是洪水或内涝风险最高的低洼地。</p>
    <p class="gx-n">→ 这一则才是问题研究的"题眼"：<b>条件互相打架时怎么办？</b>
    答案不是"找一个完美的点"，而是<b>排出优先级 + 用其他办法补短板</b>
    （例如：库建在高地，但用<b>协议储备</b>和<b>前置分库</b>补上"最后一公里"）。
    <b>能写出"补短板"的解，才是高分答案。</b></p>
  </div>

  <p class="gx-h2s" style="margin-top:18px">四条条件，各自对应一句判据和一个"翻车现场"：</p>
  <div style="overflow-x:auto">
  <table class="gx-cmp">
    <thead><tr><th>条件</th><th>判据（怎么算合格）</th><th>常见翻车</th></tr></thead>
    <tbody>
      <tr class="key"><td>安全</td><td>地势较高、地基稳定，<b>不在洪泛区与地灾隐患点</b></td><td>建在河滩、滑坡体下方，"灾时先自救"</td></tr>
      <tr class="key"><td>交通</td><td>靠近高速出口 / 铁路货站 / 机场，<b>进出道路不被淹</b></td><td>唯一通道是低洼路段，一场雨就断</td></tr>
      <tr><td>覆盖</td><td>服务半径内覆盖主要灾区与人口，<b>调运时间短</b></td><td>为省钱建在县域边角，多数乡镇够不着</td></tr>

    <b>A</b> 县城老城区边缘的河滩地，紧邻省道；<br>

    （1）分别指出三个候选地块的主要优势与主要缺陷。<br>
    （2）如果你来决策，会选哪个？说明理由（要求给出你在意的顺序）。<br>
    （3）选定后，如何弥补该地块的短板？<br>

        <b>B</b>：优势——铁路货站旁，<b>交通最稳</b>，地势中等，距县城近；缺陷——需核实是否在洪水影响范围内，

      <tr class="key"><td>库址四条件</td><td><b>安全 · 交通 · 覆盖 · 弹性</b></td><td>2 硬 2 软</td></tr>

<script>
/* 问题研究 · 救灾物资储备库选址（等 page.js 把 #md 渲染成正文之后再跑） */
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var NS = "http://www.w3.org/2000/svg";
  function $(id) { return document.getElementById(id); }
  function el(tag, attrs, parent) {
    var n = document.createElementNS(NS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }
  function n1(v) { return (Math.round(v * 10) / 10).toString(); }

  if (!$("gxStage")) return;

  /* ================= 手机上的图放大 ================= */
  (function () {
    var zoom = $("gxZoom"), inner = $("gxZoomInner");
    if (!zoom || !inner) return;
    Array.prototype.forEach.call(document.querySelectorAll(".gx-svgbox"), function (box) {
      box.style.cursor = "zoom-in";
      box.addEventListener("click", function () {
        if (window.innerWidth > 760) return;
        var svg = box.querySelector("svg");
        if (!svg) return;
        inner.textContent = "";
        inner.appendChild(svg.cloneNode(true));
        zoom.hidden = false;
        document.body.style.overflow = "hidden";
      });
    });
    function close() { zoom.hidden = true; document.body.style.overflow = ""; }
    zoom.addEventListener("click", function (e) {
      if (e.target === zoom || e.target.classList.contains("gx-zoom-x")) close();
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && !zoom.hidden) close();
    });
  })();

  /* ================= 分步揭示 ================= */
  (function () {
    var steps = document.querySelectorAll("#gxSteps .step");
    var ans = $("gxAns"), btn = $("gxNext"), cnt = $("gxCnt");
    if (!steps.length || !btn) return;
    var i = 1;
    function paint() { if (cnt) cnt.textContent = Math.min(i, steps.length) + " / " + steps.length; }
    steps[0].hidden = false;
    paint();
    btn.addEventListener("click", function () {
      if (i < steps.length) { steps[i].hidden = false; i++; }
      if (i >= steps.length) {
        if (ans) ans.hidden = false;
        btn.textContent = "已全部展开";
        btn.disabled = true;
      }
      paint();
    });
  })();

  /* ================= 互动：权重 → 候选点排序 ================= */
  (function () {
    var stage = $("gxStage"), gL = $("gxL"), gR = $("gxR");
    var s1 = $("gxS1"), s2 = $("gxS2"), s3 = $("gxS3");
    var vB = $("gxVb"), vBs = $("gxVbs"), vS = $("gxVs"), vD = $("gxVd"), vDs = $("gxVds"), box = $("gxStBox");

    var WIDE = {
      vb: "0 0 880 440", FS: 1,
      mp: { x0: 40, y0: 78, x1: 500, y1: 372 },
      ch: { x0: 540, x1: 856, top: 118, bottom: 330 },
      mpT: 42, chT: 92
    };
    var NARROW = {
      vb: "0 0 360 560", FS: 1.05,
      mp: { x0: 16, y0: 62, x1: 344, y1: 292 },
      ch: { x0: 16, x1: 344, top: 360, bottom: 512 },
      mpT: 26, chT: 334
    };
    var L = WIDE, FS = 1, W = [60, 20, 20], G = {};

    /* 候选点：分项得分（教学设定值） */
    var SITE = [
      { id: "A", name: "县城", s: [92, 88, 35], tag: "低洼、紧邻省道" },
      { id: "B", name: "铁路货站", s: [85, 70, 62], tag: "交通稳、地势中等" },
      { id: "C", name: "北部高地", s: [48, 45, 95], tag: "最安全、路单一" }
    ];
    var POS = { A: [0.32, 0.89], B: [0.62, 0.56], C: [0.44, 0.26] };

    function pt(u, v) {
      var m = L.mp;
      return [m.x0 + u * (m.x1 - m.x0), m.y0 + v * (m.y1 - m.y0)];
    }
    function scoreAll() {
      var t = W[0] + W[1] + W[2];
      if (t <= 0) { W = [1, 1, 1]; t = 3; }
      return SITE.map(function (o) {
        return { o: o, v: (o.s[0] * W[0] + o.s[1] * W[1] + o.s[2] * W[2]) / t };
      });
    }
    function rankOf(list) {
      var order = list.slice().sort(function (a, b) { return b.v - a.v; });
      var r = {};
      order.forEach(function (o, i) { r[o.o.id] = i + 1; });
      return r;
    }
    function colRank(r) { return r === 1 ? "#2f8a5b" : (r === 2 ? "#b8791f" : "#9aa3ae"); }

    function tx(parent, x, y, s, col, anchor, size, weight, halo) {
      var o = { x: n1(x), y: n1(y), "font-size": (size || 10) * FS, fill: col,
                "text-anchor": anchor || "start", "font-weight": weight || 400 };
      if (halo) o["class"] = "halo";
      var t = el("text", o, parent);
      t.textContent = s;
      return t;
    }

    function build() {
      gL.textContent = ""; gR.textContent = "";
      var m = L.mp, i;

      /* ---------- 左：县域图 ---------- */
      tx(gL, m.x0, L.mpT, "某县：三个候选地块", "#151a21", "start", 10.5, 700);
      tx(gL, m.x0, L.mpT + 15, "圆点颜色 = 当前排名", "#5a6472", "start", 9);

      /* 县域轮廓 */
      var outline = [[0.10, 0.12], [0.46, 0.05], [0.86, 0.15], [0.96, 0.50], [0.84, 0.90], [0.40, 0.96], [0.12, 0.74]];
      var d = outline.map(function (p, k) {
        var q = pt(p[0], p[1]);
        return (k ? " L " : "M ") + n1(q[0]) + " " + n1(q[1]);
      }).join("") + " Z";
      el("path", { d: d, fill: "#f8f9f4", stroke: "#c8d4c0", "stroke-width": 1.5 }, gL);

      /* 洪水淹没带 + 河流 */
      var rA = pt(0.08, 0.82), rB = pt(0.98, 0.56);
      var th = 0.15 * (m.y1 - m.y0);
      el("path", { d: "M " + n1(rA[0]) + " " + n1(rA[1]) + " L " + n1(rB[0]) + " " + n1(rB[1]) +
                      " L " + n1(rB[0]) + " " + n1(rB[1] + th) + " L " + n1(rA[0]) + " " + n1(rA[1] + th) + " Z",
                   fill: "#f6d9c9", opacity: 0.5 }, gL);
      el("path", { d: "M " + n1(rA[0]) + " " + n1(rA[1]) + " L " + n1(rB[0]) + " " + n1(rB[1]) +
                      " L " + n1(rB[0]) + " " + n1(rB[1] + th * 0.36) + " L " + n1(rA[0]) + " " + n1(rA[1] + th * 0.36) + " Z",
                   fill: "#cfe8f2", opacity: 0.9 }, gL);
      tx(gL, rA[0] + 4, rA[1] + th * 0.30, "河流", "#0b6580", "start", 8.5, 700);
      tx(gL, rB[0] - 4, rB[1] + th * 0.92, "淹没带", "#8f3226", "end", 8.5, 700);

      /* 铁路 */
      var tA = pt(0.08, 0.62), tB = pt(0.98, 0.52);
      el("line", { x1: n1(tA[0]), y1: n1(tA[1]), x2: n1(tB[0]), y2: n1(tB[1]),
                   stroke: "#5a6472", "stroke-width": 1.6, "stroke-dasharray": "8 5" }, gL);
      tx(gL, tA[0] + 4, tA[1] - 8, "铁路", "#5a6472", "start", 8.5);

      /* 公路 */
      var hA = pt(0.08, 0.40), hB = pt(0.98, 0.32);
      el("line", { x1: n1(hA[0]), y1: n1(hA[1]), x2: n1(hB[0]), y2: n1(hB[1]),
                   stroke: "#cfd6dc", "stroke-width": 6 }, gL);
      el("line", { x1: n1(hA[0]), y1: n1(hA[1]), x2: n1(hB[0]), y2: n1(hB[1]),
                   stroke: "#fff", "stroke-width": 1, "stroke-dasharray": "8 8" }, gL);
      tx(gL, hA[0] + 4, hA[1] - 8, "省道", "#5a6472", "start", 8.5);

      /* 城区街区 */
      var ub = pt(0.20, 0.69);
      [[0, 0], [16, 0], [0, 16], [16, 16]].forEach(function (o) {
        el("rect", { x: n1(ub[0] + o[0] - 14), y: n1(ub[1] + o[1] - 14), width: 12, height: 12,
                     fill: "#e4e9ee", stroke: "#c9d3dc" }, gL);
      });

      /* 北部台地等高线 */
      var cp = pt(0.44, 0.26);
      [0.075, 0.135, 0.195].forEach(function (r) {
        el("ellipse", { cx: n1(cp[0]), cy: n1(cp[1]),
                        rx: n1(r * (m.x1 - m.x0)), ry: n1(r * (m.y1 - m.y0) * 0.86),
                        fill: "none", stroke: "#cdd6c6", "stroke-width": 1.1, "stroke-dasharray": "5 4" }, gL);
      });
      tx(gL, cp[0] + 14, cp[1] - 16, "台地（等高线）", "#5a6472", "start", 8.5);

      /* 候选点 */
      G.mk = {}; G.sl = {}; G.sc = {};
      SITE.forEach(function (o) {
        var p = pt(POS[o.id][0], POS[o.id][1]);
        G.mk[o.id] = el("circle", { cx: n1(p[0]), cy: n1(p[1]), r: 13, fill: "#9aa3ae",
                                    stroke: "#fff", "stroke-width": 2 }, gL);
        G.sl[o.id] = tx(gL, p[0], p[1] + 4, o.id, "#fff", "middle", 11, 700);
        G.sc[o.id] = tx(gL, p[0] - 20, p[1] + 4, "", "#3a3a35", "end", 8.5, 700, true);
      });
      /* 候选点名称（横向错开，避免压字） */
      var pA = pt(POS.A[0], POS.A[1]), pB = pt(POS.B[0], POS.B[1]), pC = pt(POS.C[0], POS.C[1]);
      tx(gL, pA[0] + 20, pA[1] + 4, "县城（低洼）", "#8f3226", "start", 8.5, 700);
      tx(gL, pB[0] + 20, pB[1] + 4, "铁路货站", "#8a5c14", "start", 8.5, 700);
      tx(gL, pC[0] + 20, pC[1] + 4, "北部高地", "#1e6640", "start", 8.5, 700);

      /* 图例 */
      var ly = m.y1 + 18;
      tx(gL, m.x0, ly, "红＝安全分最低　绿＝当前最优　分数接近时靠附加条件裁决", "#5a6472", "start", 8.5);

      /* ---------- 右：得分条 ---------- */
      var C = L.ch;
      tx(gR, C.x0, L.chT, "加权得分（满分 100）", "#151a21", "start", 10.5, 700);
      G.wt = tx(gR, C.x0, L.chT + 15, "", "#5a6472", "start", 9);

      G.bars = {}; G.vals = {}; G.ranks = {};
      SITE.forEach(function (o, k) {
        var y = C.top + k * 70;
        G.ranks[o.id] = tx(gR, C.x0, y + 5, "", "#9aa3ae", "start", 11, 700);
        tx(gR, C.x0 + 20, y + 5, o.id + " " + o.name, "#3a3a35", "start", 9.5, 700);
        el("rect", { x: n1(C.x0 + 92), y: n1(y - 10), width: 200, height: 20, rx: 4,
                     fill: "#f2f5f7" }, gR);
        G.bars[o.id] = el("rect", { x: n1(C.x0 + 92), y: n1(y - 10), width: 4, height: 20, rx: 4,
                                    fill: "#9aa3ae" }, gR);
        G.vals[o.id] = tx(gR, C.x0 + 300, y + 5, "", "#3a3a35", "start", 9.5, 700);
      });
      tx(gR, C.x0, C.bottom + 24, "权重越大的条件，柱长的差别越明显", "#5a6472", "start", 8.5);
    }

    function render() {
      var list = scoreAll(), rk = rankOf(list), best = list.slice().sort(function (a, b) { return b.v - a.v; })[0];
      var C = L.ch, i;

      var t = W[0] + W[1] + W[2];
      var pct = W.map(function (w) { return Math.round(w / t * 100); });
      G.wt.textContent = "交通 " + pct[0] + "% · 覆盖 " + pct[1] + "% · 安全 " + pct[2] + "%";

      SITE.forEach(function (o, k) {
        G.mk[o.id].setAttribute("fill", colRank(rk[o.id]));
        G.sc[o.id].textContent = n1(list[k].v);
      });

      list.forEach(function (it, k) {
        var y = C.top + k * 70, c = colRank(rk[it.o.id]);
        var wid = Math.max(4, it.v / 100 * 200);
        G.ranks[it.o.id].textContent = (rk[it.o.id] === 1 ? "①" : (rk[it.o.id] === 2 ? "②" : "③"));
        G.ranks[it.o.id].setAttribute("fill", c);
        G.bars[it.o.id].setAttribute("width", n1(wid));
        G.bars[it.o.id].setAttribute("fill", c);
        G.vals[it.o.id].textContent = n1(it.v);
        G.vals[it.o.id].setAttribute("fill", c);
        G.vals[it.o.id].setAttribute("font-weight", rk[it.o.id] === 1 ? 700 : 400);
      });

      var id = best.o.id;
      vB.textContent = id + " " + best.o.name;
      vS.textContent = n1(best.v);
      var sub = {
        A: "安全分最低（35）：交通最快，但处在洪水风险中",
        B: "交通与安全较均衡（85 / 62），需核实洪水影响",
        C: "安全分最高（95），但交通仅 48、道路单一"
      }[id];
      var dec = {
        A: ["先把货发出去", "交通优先：牺牲部分安全性，换取调运速度"],
        B: ["稳妥的折中", "交通与安全兼顾，但要先做防洪处理与第二条通道"],
        C: ["先保证库不被淹", "安全优先：牺牲时效，用县城前置分库补末端"]
      }[id];
      vBs.textContent = sub;
      vD.textContent = dec[0];
      vDs.textContent = dec[1];
      if (box) {
        box.style.background = id === "A" ? "#fbeae7" : (id === "B" ? "#fdf3e0" : "#e6f6ee");
        box.style.borderColor = colRank(1) + "55";
        var kv = box.querySelector(".v");
        if (kv) kv.style.color = "#1e6640";
      }
    }

    function applyLayout() {
      var w = stage.parentElement.getBoundingClientRect().width;
      L = w >= 690 ? WIDE : NARROW;
      FS = L.FS;
      stage.setAttribute("viewBox", L.vb);
      build();
      render();
    }

    function readW() { W = [+s1.value, +s2.value, +s3.value]; render(); }
    s1.addEventListener("input", readW);
    s2.addEventListener("input", readW);
    s3.addEventListener("input", readW);

    $("gxP1").addEventListener("click", function () { s1.value = 60; s2.value = 20; s3.value = 20; readW(); });
    $("gxP2").addEventListener("click", function () { s1.value = 40; s2.value = 30; s3.value = 30; readW(); });
    $("gxP3").addEventListener("click", function () { s1.value = 20; s2.value = 20; s3.value = 60; readW(); });

    var tmr = null;
    window.addEventListener("resize", function () {
      clearTimeout(tmr);
      tmr = setTimeout(applyLayout, 180);
    });

    applyLayout();
  })();
});

</script>
