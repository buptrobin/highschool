<!-- ================= A ================= -->
<section class="gx-sec" id="a">
  <h2><span class="sn">01</span>课本怎么说</h2>
  <p class="gx-h2s">先背标准表述，再看解释。</p>

  <div class="gx-quote">
    <p class="q-t">教材表述 · 气候是怎么形成的<span class="q-src">人教版（2019）选择性必修1 · 第三章第三节</span></p>
    <p class="q-b">气压带和风带的分布与移动，使不同纬度、不同海陆位置的大气环流状况不同，<b>从而形成不同的气候类型</b>；一个地方的气候，由当地多年平均的气温与降水状况共同决定。</p>
    <p class="q-n">→ 拆成三个条件：①<b>纬度</b>决定你被哪几个气压带、风带扫过；②<b>季节移动</b>决定它们什么时候来、待多久；③<b>海陆位置</b>决定风是从海洋吹来还是从陆地吹来。三条各有各的答法，缺一条就答不全。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">教材表述 · 五个类型的降水特征<span class="q-src">人教版（2019）选择性必修1 · 第三章第三节</span></p>
    <p class="q-b">热带雨林气候全年高温多雨；热带草原气候全年高温，分干湿两季；热带沙漠气候全年炎热干燥；地中海气候夏季炎热干燥、冬季温和多雨；温带海洋性气候全年温和湿润。</p>
    <p class="q-n">→ 五句话对应五条因果链，每条都按"<b>谁控制 + 气流升降 + 降水结果</b>"的顺序写。答题时把"谁控制"写出来，是这一节得分与失分的分界线。</p>
  </div>

  <div style="overflow-x:auto">
  <table class="gx-cmp">
    <thead><tr><th>气候类型</th><th>控制的气压带 / 风带</th><th>降水季节分配</th><th>最冷月气温</th></tr></thead>
    <tbody>
      <tr><td>热带雨林</td><td>赤道低压带（终年）</td><td>全年多雨，各月 100 mm 以上</td><td>15 ℃ 以上</td></tr>
      <tr><td>热带草原</td><td>赤道低压带与信风带交替</td><td>湿季多雨、干季少雨（可低于 20 mm）</td><td>15 ℃ 以上</td></tr>
      <tr><td>热带沙漠</td><td>副热带高压带或信风带</td><td>全年少雨，各月 30 mm 以下</td><td>15 ℃ 以上</td></tr>
      <tr class="key"><td>地中海</td><td>副热带高压带与西风带交替</td><td><b>夏干冬雨</b></td><td>0–15 ℃</td></tr>
      <tr><td>温带海洋性</td><td>西风带（终年）</td><td>全年湿润，各月 40–100 mm</td><td>0 ℃ 以上，冬暖</td></tr>
    </tbody>
  </table>
  </div>
  <p class="gx-note">这张表最容易背错的不是"控制因素"，而是<b>最冷月气温那一列</b>：它决定你判热带还是亚热带。只要最冷月在 0 ℃ 以上、又没有热带的高温，就先往亚热带/温带去找。</p>
</section>

  applyLayout();
});
</script>
