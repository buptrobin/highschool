<p class="gx-lede">这一节回答一个问题：上海凭什么带动长三角？答案是<b>城市的辐射功能</b>——城市把生产、服务、管理、创新和交通枢纽功能向外输出，沿交通、通信、产业链把影响送到周边。最容易错的一步，是把辐射理解成"抢资源"。</p>

<!-- ================= A ================= -->
<section class="gx-sec" id="a">
  <h2><span class="sn">01</span>课本怎么说<span class="bdg bdg-must">必考</span></h2>
  <p class="gx-h2s">先背标准表述，再看解释。</p>

  <div class="gx-quote">
    <p class="q-t">课本要点 · 城市的辐射功能<span class="q-src">人教版（2019）选择性必修2 · 第三章第一节（要点摘录）</span></p>
    <p class="q-b">城市是区域的政治、经济、文化中心，具有生产、服务、管理、创新等功能。城市通过交通、通信等与周边地区进行物质、能量、信息的交换，把自身的影响向外传递、带动周边地区发展，这种作用称为城市的辐射功能。城市辐射影响所及的地区，就是它的腹地。</p>
    <p class="q-n">→ 翻成人话：<b>先有功能，才有辐射</b>；功能是"城市能干什么"，辐射是"这些能力怎样外溢到周边"。判断辐射强弱，看三件事：功能等级、通道条件、产业联系。</p>
  </div>

  <div style="overflow-x:auto">
  <table class="gx-cmp">
    <thead><tr><th>功能</th><th>具体部门（举例）</th><th>向外输出什么</th></tr></thead>
    <tbody>
      <tr><td>生产功能</td><td>制造业、加工组装、农产品加工</td><td>产品，以及分包给周边的零部件订单</td></tr>
      <tr><td>服务功能</td><td>金融、商贸、物流、教育、医疗</td><td>周边企业来融资、居民来看病上学</td></tr>
      <tr class="key"><td>管理功能</td><td>行政机构、企业总部、行业组织</td><td>决策、审批、订单从中心发出</td></tr>
      <tr><td>创新功能</td><td>高校、科研院所、研发中心</td><td>新技术、新业态向周边扩散</td></tr>
      <tr><td>交通枢纽</td><td>港口、机场、高铁站、物流园</td><td>人与货在此集散、换装、分拨</td></tr>
    </tbody>
  </table>
  </div>
  <p class="gx-note">这张表最容易背错的是：五类功能不是并列清单。真正"周边替代不了"的是<b>管理</b>与<b>服务</b>——总部和金融在哪里，辐射的方向就由哪里决定；只写交通枢纽，等于只写通道。</p>
  <p class="gx-note"><b>影响辐射强弱的五个因素：</b>城市规模与等级、经济实力、产业结构（生产性服务业占比）、交通通达度、开放程度与创新能力。</p>
</section>
