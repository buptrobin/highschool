<!-- ================= A ================= -->
<section class="gx-sec" id="a">
  <h2><span class="sn">01</span>材料与问题</h2>
  <p class="gx-h2s">先看三个概念，再带着问题读图。这一课的所有结论都要能被数字支撑。</p>

  <div class="gx-quote">
    <p class="q-t">课本要点 · 食物里程<span class="q-src">人教版（2019）必修第二册 · 第五章问题研究</span></p>
    <p class="q-b">食物里程是指食品从生产地到消费者餐桌所经过的运输距离。</p>
    <p class="q-n">→ 它<b>只算“运了多远”</b>，不算怎么种的、怎么加工的、怎么做的。
    食物里程的单位是<b>公里</b>，不是千克二氧化碳——<b>里程和足迹是两回事</b>，这是本课第一个坑。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本要点 · 碳足迹<span class="q-src">人教版（2019）必修第二册 · 第五章问题研究</span></p>
    <p class="q-b">碳足迹是指某一产品（或服务）在整个生命周期中直接和间接产生的温室气体排放总量，通常折算成二氧化碳当量（CO₂e）。</p>
    <p class="q-n">→ 注意<b>三个关键词</b>：<b>整个生命周期</b>（不是某一段）、<b>直接和间接</b>（化肥、电都算）、
    <b>二氧化碳当量</b>（把甲烷等换算成 CO₂ 再加总）。所以它的单位是 <b>kg CO₂e</b>，可以加、可以比。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本要点 · 低碳食品<span class="q-src">人教版（2019）必修第二册 · 第五章问题研究</span></p>
    <p class="q-b">低碳食品是指在生产、加工、运输、消费等环节中温室气体排放较少的食品。判断一种食品是否低碳，要综合考察它的整个生命周期。</p>
    <p class="q-n">→ “低碳”是一个<b>比较结论</b>，不是食品的固有标签：同样买 1 kg 吃的，
    本地露天番茄 0.51、进口空运芦笋 20.5，<b>差了 40 倍</b>。所以答题不能写“蔬菜是低碳食品”，
    要写“<b>在什么条件下</b>它才低碳”。</p>
  </div>

  <p class="gx-h2s" style="margin-top:18px">本页统一用这一套“生产段”数值来算账（单位：kg CO₂e / kg 食品）：</p>
  <div style="overflow-x:auto">
  <table class="gx-cmp">
    <thead><tr><th>食品</th><th>生产段排放</th><th>为什么是这个量级</th></tr></thead>
    <tbody>
      <tr><td>牛肉</td><td>24.5</td><td>反刍动物发酵产生甲烷，饲料种植也耗能</td></tr>
      <tr><td>猪肉</td><td>6.5</td><td>饲料种植 + 粪污处理，低于反刍动物</td></tr>
      <tr><td>鸡蛋</td><td>4.5</td><td>饲料转化率较高，排放集中在饲料</td></tr>
      <tr><td>大米</td><td>4.0</td><td>稻田淹水条件下产生甲烷</td></tr>
      <tr class="key"><td>大棚番茄</td><td>3.0</td><td><b>加温、补光、保温被</b>都在耗能，是大头</td></tr>
      <tr><td>芦笋</td><td>1.5</td><td>本身不高，但常靠空运，运输段会反超</td></tr>
      <tr><td>露天蔬菜</td><td>0.5</td><td>应季露天，几乎只用柴油和化肥</td></tr>
      <tr><td>豆腐</td><td>1.0</td><td>大豆固氮、转化效率高，低于多数动物性食品</td></tr>
    </tbody>
  </table>
  </div>
  <p class="gx-note"><b>本页三个探究问题：</b>① 食物里程越短，碳足迹就越低吗？
  ② 一种食品的碳足迹里，哪一段占比最大、为什么？③ 作为消费者，哪三个选择最有效？<br>
  口径说明：不同研究给出的绝对值差异可达数倍（尤其牛肉），本页<b>全篇统一用上表数值</b>，
  目的是让账算得通、结论站得住，<b>不是各国实测均值</b>。</p>
</section>

    <p class="gx-take">所以要回答“怎么减碳”，先问<b>哪一段最长</b>。蔬菜的最长段是生产，

        <text class="ms" x="120" y="118" text-anchor="middle">浪费 = 白排一遍</text>
      </svg>
    </div>

    <div class="qac">
      <p class="q">「我一个人少买一次，有用吗？」</p>
      <p class="a"><b>有用，但不够。</b>需求端会改变企业采购和政策；但一个人的一次选择改变不了供应链。
      真正有效的是<b>把选择变成常态</b>，再加上<b>企业改进包装与运输、政府完善标识与标准</b>。
      个人、企业、政策三层一起动，才叫“共同性”。</p>
      <svg viewBox="0 0 240 132" role="img" aria-label="个人企业政策三层共同作用">
        <circle cx="46" cy="62" r="16" fill="#ecfbff" stroke="#b8e6f2"/>
        <circle cx="120" cy="62" r="22" fill="#fdf3e0" stroke="#f0dcb4"/>
        <circle cx="202" cy="62" r="28" fill="#e6f6ee" stroke="#bfe0cd"/>
        <text class="ms" x="46" y="102" text-anchor="middle">个人</text>
        <text class="ms" x="120" y="102" text-anchor="middle">企业</text>
        <text class="ms" x="202" y="102" text-anchor="middle">政策</text>
        <text class="ms" x="120" y="22" text-anchor="middle">三层一起动</text>
      </svg>
    </div>

  </div>
  <p class="gx-note">这六问其实是同一句话：<b>碳足迹是“多段相加”，先找最长的哪一段，再谈怎么减。</b>
  所有判断的第一步，永远是问<b>“这段占多少”，而不是“这段有多远”</b>。</p>
</section>

<section class="gx-sec" id="f">
  <h2><span class="sn">06</span>易错清单</h2>
  <p class="gx-h2s">左边是考试里真的会写出来的错句，右边是应该写的样子。后者可以直接背。</p>

  <div style="overflow-x:auto;margin-bottom:16px">
  <table class="gx-cmp">
    <thead><tr><th>概念</th><th>一句话判据</th><th>典型数字</th></tr></thead>
    <tbody>
      <tr><td>食物里程</td><td>只算运输<b>距离</b>，单位 km</td><td>50 km / 1200 km</td></tr>
      <tr class="key"><td>碳足迹</td><td><b>全生命周期</b>排放总量，单位 kg CO₂e</td><td>番茄 0.51 – 3.01</td></tr>
      <tr><td>运输排放</td><td>系数 × 重量 × 距离</td><td>空运是海运的 50 倍</td></tr>
      <tr><td>生产段</td><td>决定量级的那一段</td><td>大棚 3.0 vs 露天 0.5</td></tr>
      <tr><td>低碳食品</td><td>带条件的比较结论</td><td>不是固定标签</td></tr>
      <tr><td>减碳优先级</td><td>生产方式 &gt; 运输方式 &gt; 距离 &gt; 浪费</td><td>−83% / −91% / −4%</td></tr>
    </tbody>
  </table>
  </div>

  <div class="gx-errs">
    <div class="er">
      <p class="er-x">✗ 食物里程越短，碳足迹一定越低</p>
      <p class="er-v">✓ 还要看<b>生产方式</b>：本地大棚 3.01 &gt; 外地露天 0.74</p>
      <p class="er-w">错在哪：用一段（运输）代替了全程（六段）。里程短只说明运输段小。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 碳足迹就是运输过程中排放的二氧化碳</p>
      <p class="er-v">✓ 碳足迹是<b>全生命周期</b>的直接与间接排放，折算成 CO₂e</p>
      <p class="er-w">错在哪：漏了生产、加工、零售、家庭、废弃五段，只算了其中一段。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 进口食品一定比本地食品高碳</p>
      <p class="er-v">✓ 高碳的是<b>空运</b>；海运 + 规模化生产可能低于本地大棚</p>
      <p class="er-w">错在哪：把“国界”当成了“排放”。判据是系数 × 距离，不是产地。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 蔬菜一定比肉低碳</p>
      <p class="er-v">✓ 空运芦笋 20.5 &gt; 本地猪肉 6.5；<b>同类生产方式下</b>植物性食物才普遍更低</p>
      <p class="er-w">错在哪：只比较了“食物类别”，没有比较“怎么种、怎么运”。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 反季节蔬菜一定高碳</p>
      <p class="er-v">✓ 关键看<b>加温补光的能耗</b>；南方露天反季节、或就近供应，排放可能不高</p>
      <p class="er-w">错在哪：把“反季节”直接等同于“大棚加温”。要问清楚是怎么种出来的。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 个人少买一次没用，减碳是国家的事</p>
      <p class="er-v">✓ 需求端会改变企业采购与政策；但个人行动<b>不能替代</b>企业与制度层面的改变</p>
      <p class="er-w">错在哪：两个极端都不对。共同性要求个人、企业、政策三层一起动。</p>
    </div>
