<!-- ================= A ================= -->
<section class="gx-sec" id="a">
  <h2><span class="sn">01</span>课本怎么说</h2>
  <p class="gx-h2s">先背标准表述，再看解释。问题研究的答题卡，认的是术语，不是感想。</p>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 崇明岛在哪里<span class="q-src">人教版（2019）选择性必修1 · 第二章问题研究</span></p>
    <p class="q-b">崇明岛位于长江口，是我国第三大岛。它由长江携带的泥沙在河口堆积而成。</p>
    <p class="q-n">→ 这句话里有三个判据：<b>河口</b>（不是出山口、不是湖口）、<b>沙岛</b>（由泥沙堆积而成）、<b>第三大</b>（台湾岛、海南岛之后）。
    位置决定动力：河口同时有<b>径流减速</b>和<b>海水顶托 + 潮流</b>，这两件事凑在一起，才会在口门以内堆出岛来，而不是堆成一个三角洲尖。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 三角洲怎么形成<span class="q-src">人教版（2019）选择性必修1 · 第二章第三节</span></p>
    <p class="q-b">河流入海或入湖时，地势趋于平缓，河道变得开阔，水流速度减慢，河流携带的泥沙便堆积下来，形成三角洲。</p>
    <p class="q-n">→ 因果链只有三环：<b>河道展宽、坡度变缓 → 流速减慢 → 搬运能力下降 → 泥沙堆积</b>。
    课本用的是"减慢"而不是"停止"：泥沙不是到了海里才沉，而是<b>在流速降到带不动它的那一刻</b>就沉。
    所以"入海"只是提供了一个减速的理由，<b>减不减速、减多少，才决定堆不堆积</b>。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">研究任务 · 这次要回答的三个问题<span class="q-src">人教版（2019）选择性必修1 · 第二章问题研究</span></p>
    <p class="q-b">崇明岛的面积为什么会变化？它的未来会是什么样子？我们应该怎样研究一个正在变化的地貌？</p>
    <p class="q-n">→ 三个问题正好对应三步：<b>① 找收支</b>（来沙和侵蚀谁大）、<b>② 看边界条件</b>（海平面、工程、围垦）、<b>③ 给情景结论</b>（分情况说，不带"一定"）。
    这套顺序不只对崇明岛有效，黄河三角洲、尼罗河三角洲照样能套。</p>
  </div>

  <p class="gx-h2s" style="margin-top:18px">三种"堆出来的地貌"经常被混成一个，其实位置和动力都不一样（<b>高亮那一行是本页的主角</b>）：</p>
  <div style="overflow-x:auto">
  <table class="gx-cmp">
    <thead><tr><th>地貌</th><th>形成位置</th><th>主导动力</th><th>形态</th></tr></thead>
    <tbody>
      <tr><td>冲积扇</td><td>河流出山口</td><td>坡度骤减、水流分散</td><td>扇形，顶点在山口</td></tr>
      <tr><td>三角洲</td><td>河流入海（湖）口</td><td>流速减慢、泥沙堆积</td><td>向海推进，尖角朝海</td></tr>
      <tr class="key"><td>河口沙岛</td><td>河口口门以内</td><td>径流减速 + 海水顶托 + 潮流</td><td>长条沙洲并列成岛</td></tr>
    </tbody>
  </table>
  </div>
  <p class="gx-note">崇明岛是<b>长江三角洲的一部分</b>，但不是"一片扇面"，而是<b>沙洲并列、淤高成岛</b>。
  答"崇明岛是冲积扇"直接丢分：冲积扇的关键词是<b>出山口</b>和<b>坡度骤减</b>，崇明岛的关键词是<b>口门</b>和<b>海水顶托</b>。</p>
</section>

    tx(gB, L.bT[0], L.bT[1], "② 面积—时间曲线（100 年）", "#151a21", "start", 11.5 * L.fs, 700);
    tx(gB, L.leg2[0], L.leg2[1], "虚线 = 今天 1 200 km²", "#8a8272", L.leg2[2], 8.5 * L.fs);

    el("line", { x1: L.px[0], y1: L.py[1], x2: L.px[0], y2: L.py[0], stroke: "#c9c2b0", "stroke-width": 1 }, gB);
    el("line", { x1: L.px[0], y1: L.py[0], x2: L.px[1], y2: L.py[0], stroke: "#c9c2b0", "stroke-width": 1 }, gB);

    for (i = 0; i < L.yt.length; i++) {
      var yv = yArea(L.yt[i]);
      el("line", { x1: L.px[0], y1: yv, x2: L.px[1], y2: yv, stroke: "#eef2f6", "stroke-width": 1 }, gB);
      tx(gB, L.px[0] - 8, yv + 3, String(L.yt[i]), "#9aa3ae", "end", 8.5 * L.fs);
    }
    tx(gB, L.px[0] - 8, L.py[0] + 3, "0", "#9aa3ae", "end", 8.5 * L.fs);
    for (i = 0; i < L.xt.length; i++) {
      tx(gB, xYear(L.xt[i]), L.xLabY, String(L.xt[i]), "#9aa3ae", "middle", 8.5 * L.fs);
    }
    tx(gB, L.unit[0], L.unit[1], "横轴：年　纵轴：面积 km²", "#9aa3ae", "start", 8.5 * L.fs);

    REF.dash = el("line", { x1: L.px[0], y1: 0, x2: L.px[1], y2: 0, stroke: "#d9c9a8",
      "stroke-width": 1.1, "stroke-dasharray": "5 4" }, gB);
    REF.curve = el("path", { d: "M 0 0", fill: "none", stroke: "#0891b2", "stroke-width": 2.4,
      "stroke-linejoin": "round" }, gB);
    REF.dot = el("circle", { cx: 0, cy: 0, r: 3.8, fill: "#fff", stroke: "#0891b2", "stroke-width": 1.8 }, gB);
    REF.endLab = tx(gB, 0, 0, "", "#151a21", "end", 9.5 * L.fs, 700);
  }

  function stateOf(net) {
    if (Math.abs(net) < 0.05) {
      return { t: "收支平衡 · 面积零增长", c: "#0b6580", bg: "#eef6fb" };
    }
    if (net < 0) {
      return { t: "蚀退", c: "#b8402f", bg: "#fbeae7" };
    }
    if (net < 0.5) {
      return { t: "基本稳定", c: "#3f6f92", bg: "#eef6fb" };
    }
    if (net < 2) {
      return { t: "缓慢淤涨", c: "#8a5c14", bg: "#fdf3e0" };
    }
    return { t: "快速淤涨", c: "#1e6640", bg: "#e6f6ee" };
  }

  function render() {
    var L = LAY;
    var net = Q - EROD;
    var dA = net * K;
    var a100 = Math.max(0, A0 + dA * YRS);
    var s = Math.sqrt(a100 / A0);
    var st = stateOf(net);

    /* 岛形：面积按比例缩放，线性尺寸取 √(A/A0) */
    REF.iso.setAttribute("rx", n1(L.rx * s));
    REF.iso.setAttribute("ry", n1(L.ry * s));
    REF.aS.textContent = "100 年后 " + Math.round(a100) + " km²（虚线为今天）";

    var top = L.cy - L.ry * s;
    var show = a100 >= 2600;
    REF.jLine.setAttribute("y1", n1(top));
    REF.jLine.setAttribute("opacity", show ? 0.9 : 0);
    REF.jArrow.setAttribute("d", show
      ? "M " + n1(L.cx) + " " + n1(L.joinY + 2) + " l -4 8 l 8 0 z" : "");
    REF.jLab.setAttribute("opacity", show ? 1 : 0);
    REF.jLab.setAttribute("y", n1(Math.max(L.joinY + 16, (top + L.joinY) / 2 + 4)));

    /* 曲线 */
    var yS = yArea(A0), yE = yArea(a100);
    REF.dash.setAttribute("y1", n1(yS)); REF.dash.setAttribute("y2", n1(yS));
    REF.curve.setAttribute("d", "M " + n1(L.px[0]) + " " + n1(yS) + " L " + n1(L.px[1]) + " " + n1(yE));
    REF.curve.setAttribute("stroke", st.c);
    REF.dot.setAttribute("cx", n1(L.px[1]));
    REF.dot.setAttribute("cy", n1(yE));
    REF.dot.setAttribute("stroke", st.c);
    REF.endLab.setAttribute("x", n1(L.px[1] - 4));
    REF.endLab.setAttribute("y", n1(yE - 9));
    REF.endLab.setAttribute("fill", st.c);
    REF.endLab.textContent = "100 年后 " + Math.round(a100) + " km²";

    /* 三张数值卡 + 状态卡 */
    $("gxVq").textContent = Q.toFixed(1) + " 亿吨/年";
    $("gxVqs").textContent = "侵蚀固定 1.2 亿吨/年";
    $("gxVn").textContent = (net > 0 ? "+" : "") + net.toFixed(1) + " 亿吨/年";
    $("gxVns").textContent = "= " + Q.toFixed(1) + " − 1.2";
    $("gxVd").textContent = (dA > 0 ? "+" : "") + dA.toFixed(1) + " km²/年";
    $("gxVds").textContent = "净堆积 × 8 km²/亿吨（示意）";
    $("gxVs").textContent = st.t;
    $("gxVss").textContent = "100 年后约 " + Math.round(a100) + " km²";

    var box = $("gxStBox");
    if (box) {
      box.style.background = st.bg;
      box.style.borderColor = st.c + "44";
      var kv = box.querySelector(".v");
      if (kv) kv.style.color = st.c;
    }

    var sl = $("gxSl");
    var sv = String(Math.round(Q * 10) / 10);
    if (sl && sl.value !== sv) sl.value = sv;
  }

  function applyLayout() {
    var w = stage.parentElement.getBoundingClientRect().width;
    LAY = w >= 640 ? WIDE : NARROW;
    stage.setAttribute("viewBox", LAY.vb);
    build();
    render();
  }

  var sl = $("gxSl");
  if (sl) {
    sl.addEventListener("input", function () {
      Q = Math.min(5, Math.max(0, +this.value));
      render();
    });
  }
  var presets = { gxP1: 4.8, gxP2: 1.5, gxP3: 1.2, gxP4: 0 };
  Object.keys(presets).forEach(function (id) {
    var b = $(id);
    if (b) b.addEventListener("click", function () { Q = presets[id]; render(); });
  });

  stage.addEventListener("keydown", function (ev) {
    if (ev.key === "ArrowLeft" || ev.key === "ArrowRight") {
      ev.preventDefault();
      Q = GX.clamp(Q + (ev.key === "ArrowRight" ? 0.1 : -0.1), 0, 5);
      Q = Math.round(Q * 10) / 10;
      render();
    }
  });

  var tmr = null;
  window.addEventListener("resize", function () {
    clearTimeout(tmr);
    tmr = setTimeout(applyLayout, 180);
  });

  applyLayout();
});
</script>
</body>
</html>
