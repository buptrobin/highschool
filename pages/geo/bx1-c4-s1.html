<p class="gx-claim">四种地貌，考来考去只有一句话：<b>这块地方是被搬走的，还是被堆下来的。</b></p>
<div class="gx-meta">
  <span><i></i>人教版必修第一册 第四章第一节</span>
  <span><i></i>高一 · 地貌</span>
  <span><i></i>阅读 14 分钟</span>
  <span><i></i>含 1 个互动模型</span>
</div>
<p class="gx-lede">这一节把"地貌"拆成四类，但它们的骨架是同一个：<b>外力作用 = 侵蚀（搬走）+ 堆积（卸下）</b>。
喀斯特的搬运工是"溶于水"，河流是"流水冲",风沙是"风吹"，海岸是"海浪拍"。
只要你能说清"这块石头是被什么搬走的、又在哪里卸下"，四类地貌全部打通。</p>

<!-- ================= A ================= -->
<section class="gx-sec" id="a">
  <h2><span class="sn">01</span>课本怎么说</h2>
  <p class="gx-h2s">先背标准表述，再看解释。顺序反了，答题时就写不出术语。</p>

  <div class="gx-quote">
    <p class="q-t">课本原话<span class="q-src">人教版（2019）必修第一册 · 第四章第一节</span></p>
    <p class="q-b">组成地壳的岩石有一部分是可溶性岩石，如石灰岩等。在适当条件下，这类岩石的物质溶于水并被带走，或重新沉淀，从而在地表和地下形成形态各异的地貌，统称为喀斯特地貌。</p>
    <p class="q-n">→ 这句话里有 <b>两个动作</b>，缺一不可：<b>① 溶于水被带走</b>（溶蚀）、<b>② 重新沉淀</b>（淀积）。
    这两个动作会在图上分成两类地貌——凡是"凹进去、被掏空"的（溶沟、溶洞、峰林），都是①；凡是"长出来、被填上"的（石钟乳、石笋、石柱），都是②。</p>
  </div>
  <p class="gx-note">最容易忽略的是开头那半句：<b>可溶性岩石</b>是前提。没有石灰岩这类岩石，水再多也长不出喀斯特。
  所以答"成因"时，只写"流水侵蚀"会丢分，要写<b>"含二氧化碳的流水对可溶性岩石（石灰岩）的溶蚀作用"</b>。</p>

  <p class="gx-h2s" style="margin-top:18px">另外三类，课本的各一句定义：</p>
  <div class="gx-cmp-wrap" style="overflow-x:auto">
  <table class="gx-cmp">
    <thead><tr><th>类型</th><th>课本定义的关键词</th><th>主要分布</th></tr></thead>
    <tbody>
      <tr><td>河流地貌</td><td>河流作用于地表所形成的各种地貌</td><td>所有有大河的地方</td></tr>
      <tr><td>风沙地貌</td><td>在<b>干旱地区</b>，以<b>风力</b>为主形成的各种地貌</td><td>我国西北地区</td></tr>
      <tr><td>海岸地貌</td><td>海岸在<b>海浪等作用</b>下形成的各种地貌</td><td>沿海地带</td></tr>
    </tbody>
  </table>
  </div>
  <p class="gx-note">三句话的句式一模一样：<b>「什么力 + 作用在什么上 + 形成的地貌」</b>。
  照这个句式答题，术语永远不会漏。注意"风沙地貌"的分布要补一句课本原话：<b>在多沙的河谷地带、植被稀少的沙质湖岸和海岸，也能看到风沙地貌</b>——
  它不等于"只有西北有"，这是选择题的常设陷阱。</p>
</section>

<!-- ================= B ================= -->
<section class="gx-sec" id="b">
  <h2><span class="sn">02</span>拆开看</h2>
  <p class="gx-h2s">四张图，一张对应一类地貌。每张只看一件事：哪里在被搬走，哪里在被堆下。</p>

  <!-- 图1 喀斯特 -->
  <figure class="gx-fig">
    <div class="fig-cap">
      <span class="fig-no">图 1</span><span class="fig-t">喀斯特地貌：一个立体的"溶解系统"</span>
      <span class="bdg bdg-diff">辨析</span>
    </div>
    <p class="fig-s">地表和地下是<b>同一套作用</b>的两头：含有二氧化碳的水从地表渗下去，一路溶蚀岩石，
    在地表掏出溶沟、在地下掏出溶洞；水在洞里滴落时二氧化碳逸出，碳酸钙重新沉淀，又从洞顶、洞底"长"出石钟乳和石笋。
    <b>蓝色是被搬走，琥珀是被堆下。</b></p>

      <tr><td>侵蚀标志</td><td>溶沟、溶洞、峰林</td><td>"V"形谷、河曲凹岸</td><td>风蚀蘑菇、雅丹</td><td>海蚀崖、海蚀柱</td></tr>
      <tr><td>堆积标志</td><td>石钟乳、石笋</td><td>冲积扇、三角洲</td><td>沙丘</td><td>海滩、沙坝</td></tr>
      <tr class="key"><td>判据</td><td colspan="4"><b>形态上凹进去、被掏空的 = 侵蚀；凸出来、被填上的 = 堆积</b>——四类地貌通用一条判据</td></tr>
    </tbody>
  </table>
  </div>

  <div class="gx-errs">
    <div class="er">
      <p class="er-x">✗ 石钟乳和石笋是流水溶蚀形成的</p>
      <p class="er-v">✓ 二者都是<b>流水淀积（化学沉淀）</b>形成的；溶蚀形成的是溶洞、溶沟、峰林</p>
      <p class="er-w">错在哪：把"在洞里"当成了"被溶蚀"。洞是被溶蚀出来的，洞里长出来的东西是被<b>填进去</b>的。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 凹岸堆积、凸岸侵蚀</p>
      <p class="er-v">✓ <b>凹岸侵蚀、凸岸堆积</b>；凹岸岸陡水深宜建港，凸岸岸缓沙洲宜聚落</p>
      <p class="er-w">错在哪：凭"凹"字想成"凹进去所以堆东西"。实际是表层水流冲向凹岸把岸脚掏空。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 三角洲的形成原因是河流带来的泥沙多</p>
      <p class="er-v">✓ 泥沙多只是其一，还必须<b>流速骤减</b>并有<b>海（湖）水顶托</b>；潮汐洋流强则不易形成</p>
      <p class="er-w">错在哪：只答了"物质来源"，漏掉"卸载条件"。堆积地貌永远是"有东西可堆 + 搬不动了"两件事。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 风蚀蘑菇是因为岩石下部比上部软</p>
      <p class="er-v">✓ 是因为<b>风沙贴近地面运动</b>，下部受磨蚀远强于上部，与岩石软硬无必然关系</p>
      <p class="er-w">错在哪：把"被磨得多"归因成"本身软"。同理，雅丹的垄槽延伸方向与<b>盛行风向一致</b>。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 新月形沙丘的陡坡是迎风坡</p>
      <p class="er-v">✓ <b>缓坡迎风、陡坡背风</b>；沙丘整体向下风方向移动</p>
      <p class="er-w">错在哪：想成"风把坡吹陡了"。实际风是<b>把沙一级级吹上缓坡</b>，翻过脊线才在背风侧塌成陡坡。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ "V"形谷是河流侧蚀形成的</p>
      <p class="er-v">✓ "V"形谷是<b>下蚀（向下侵蚀）</b>为主形成的，出现在<b>上游</b>；侧蚀加强后河谷才拓宽成槽形</p>
      <p class="er-w">错在哪：混淆三种侵蚀的方向。下蚀切深、侧蚀拓宽、溯源侵蚀让河谷变长，三者对应三种形态。</p>
    </div>
  </div>

<script>
/* 常见地貌类型 · 讲义交互（等 page.js 把 #md 渲染成正文之后再跑） */
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var NS = "http://www.w3.org/2000/svg";
  function $(id) { return document.getElementById(id); }
  function el(tag, attrs, parent) {
    var n = document.createElementNS(NS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }
  function n1(v) { return (Math.round(v * 10) / 10).toString(); }

  if (!$("gxStage")) return;

  /* ================= 手机的图放大 ================= */
  (function () {
    var zoom = $("gxZoom"), inner = $("gxZoomInner");
    if (!zoom || !inner) return;
    var boxes = document.querySelectorAll(".gx-svgbox");
    Array.prototype.forEach.call(boxes, function (box) {
      box.style.cursor = "zoom-in";
      box.addEventListener("click", function () {
        if (window.innerWidth > 760) return;
        var svg = box.querySelector("svg");
        if (!svg) return;
        inner.innerHTML = "";
        inner.appendChild(svg.cloneNode(true));
        zoom.hidden = false;
        document.body.style.overflow = "hidden";
      });
    });
    function close() { zoom.hidden = true; document.body.style.overflow = ""; }
    zoom.addEventListener("click", function (e) {
      if (e.target === zoom || e.target.classList.contains("gx-zoom-x")) close();
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && !zoom.hidden) close();
    });
  })();

  /* ================= 分步揭示 ================= */
  (function () {
    var steps = document.querySelectorAll("#gxSteps .step");
    var ans = $("gxAns"), btn = $("gxNext"), cnt = $("gxCnt");
    if (!steps.length || !btn) return;
    var i = 1;
    function paint() {
      if (cnt) cnt.textContent = Math.min(i, steps.length) + " / " + steps.length;
    }
    steps[0].hidden = false;
    paint();
    btn.addEventListener("click", function () {
      if (i < steps.length) { steps[i].hidden = false; i++; }
      if (i >= steps.length) {
        if (ans) ans.hidden = false;
        btn.textContent = "已全部展开";
        btn.disabled = true;
      }
      paint();
    });
  })();

  /* ================= 互动：溶蚀 ⇄ 淀积 ================= */
  (function () {
    var stage = $("gxStage"), gCave = $("gxCave"), gChart = $("gxChart");
    var sl = $("gxSl"), vC = $("gxVc"), vN = $("gxVn"), vS = $("gxVs"), vSn = $("gxVsn"), box = $("gxStBox");

    var WIDE = { vb: "0 0 880 400", cave: { x: 14, y: 16, w: 492, h: 368 }, chart: { x: 534, y: 46, w: 336, h: 298 }, bp: 620 };
    var NARROW = { vb: "0 0 360 600", cave: { x: 6, y: 12, w: 348, h: 268 }, chart: { x: 14, y: 334, w: 332, h: 240 }, bp: 620 };
    var L = WIDE, FS = 1, C = 78, dragging = false, R = {};

    /* ---- 洞穴剖面几何（u,v 均为 0..1 的相对坐标） ---- */
    function X(u) { return L.cave.x + u * L.cave.w; }
    function Y(v) { return L.cave.y + v * L.cave.h; }

    function caveD(cx, cy, rx, ry) {
      var d = "", n = 40, i, a, k, x, y;
      for (i = 0; i <= n; i++) {
        a = i / n * Math.PI * 2;
        k = 1 + 0.10 * Math.sin(3 * a + 0.6) + 0.06 * Math.cos(5 * a + 1.1);
        x = cx + rx * k * Math.cos(a);
        y = cy + ry * k * Math.sin(a);
        d += (i ? " L " : "M ") + n1(x) + " " + n1(y);
      }
      return d + " Z";
    }

    function build() {
      gCave.textContent = ""; gChart.textContent = "";
      var CB = L.cave;

      /* --- 岩层 --- */
      el("rect", { x: CB.x, y: Y(0.26), width: CB.w, height: Y(1) - Y(0.26),
                   fill: "#f2efe6", stroke: "#c9c2b0", "stroke-width": 1.2 }, gCave);
      el("line", { x1: CB.x, y1: Y(0.26), x2: CB.x + CB.w, y2: Y(0.26),
                   stroke: "#a8a08c", "stroke-width": 1.8 }, gCave);

      R.groove = el("path", { fill: "none", stroke: "#a08b62", "stroke-width": 1.6,
                              "stroke-linejoin": "round" }, gCave);
      R.cav = el("path", { fill: "#ffffff", stroke: "#a89f8c", "stroke-width": 1.3 }, gCave);
      R.river = el("path", { fill: "#cfe9f2", stroke: "#a7d3e2", "stroke-width": 1 }, gCave);

      R.stals = []; R.stags = [];
      for (var i = 0; i < 4; i++) R.stals.push(el("path", { fill: "#f7e9cf", stroke: "#c9a35f", "stroke-width": 1 }, gCave));
      for (var j = 0; j < 3; j++) R.stags.push(el("path", { fill: "#f7e9cf", stroke: "#c9a35f", "stroke-width": 1 }, gCave));

      R.drops = [el("circle", { r: 2.6, fill: "#5fb0c9" }, gCave),
                 el("circle", { r: 2.1, fill: "#5fb0c9" }, gCave)];

      var t1 = el("text", { x: n1(X(0.035)), y: n1(Y(0.335)), "font-size": 12.5 * FS, fill: "#8a8272" }, gCave);
      t1.textContent = "石灰岩";
      R.rivLab = el("text", { x: n1(X(0.5)), y: n1(Y(0.70)), "font-size": 11.5 * FS, "font-weight": 700,
                              fill: "#2f7f99", "text-anchor": "middle" }, gCave);
      R.rivLab.textContent = "地下河";

      /* --- 右侧：速率曲线 --- */
      var CH = L.chart, PL = 40, PR = 12, PT = 18, PB = 42;
      function cx(c) { return CH.x + PL + (c / 100) * (CH.w - PL - PR); }
      function cy(r) { return CH.y + CH.h - PB - (r / 100) * (CH.h - PT - PB); }
      R.cx = cx; R.cy = cy;

      el("line", { x1: cx(0), y1: cy(0), x2: cx(100) + 6, y2: cy(0), stroke: "#c9c2b0", "stroke-width": 1.3 }, gChart);
      el("line", { x1: cx(0), y1: cy(0), x2: cx(0), y2: cy(100) - 6, stroke: "#c9c2b0", "stroke-width": 1.3 }, gChart);

      [25, 50, 75].forEach(function (gv) {
        el("line", { x1: cx(gv), y1: cy(0), x2: cx(gv), y2: cy(100),
                     stroke: "#eceff3", "stroke-width": 1 }, gChart);
      });

      el("path", { d: "M " + cx(0) + " " + cy(0) + " L " + cx(100) + " " + cy(100),
                   stroke: "#0891b2", "stroke-width": 2.4, fill: "none" }, gChart);
      el("path", { d: "M " + cx(0) + " " + cy(100) + " L " + cx(100) + " " + cy(0),
                   stroke: "#b8791f", "stroke-width": 2.4, fill: "none", "stroke-dasharray": "6 4" }, gChart);

      el("circle", { cx: cx(50), cy: cy(50), r: 4, fill: "#fff", stroke: "#5a6472", "stroke-width": 1.6 }, gChart);

      R.mark = el("line", { stroke: "#0891b2", "stroke-width": 7, "stroke-linecap": "round", opacity: 0.28 }, gChart);
      R.dotD = el("circle", { r: 4.2, fill: "#0891b2" }, gChart);
      R.dotP = el("circle", { r: 4.2, fill: "#b8791f" }, gChart);
      R.vline = el("line", { stroke: "#9aa3ae", "stroke-width": 1, "stroke-dasharray": "3 4" }, gChart);

      function tx(x, y, s, col, anchor, size, weight, halo) {
        var o = { x: x, y: y, "font-size": (size || 10.5) * FS, fill: col,
                  "text-anchor": anchor || "start", "font-weight": weight || 400 };
        if (halo) o["class"] = "halo";
        var t = el("text", o, gChart);
        t.textContent = s;
        return t;
      }
      tx(cx(100), cy(100) - 9, "溶蚀速率", "#0b6580", "end", 12, 700);
      tx(cx(0) + 3, cy(100) - 9, "淀积速率", "#8a5c14", "start", 12, 700);
      tx(cx(50) + 9, cy(50) + 16, "平衡点 50", "#5a6472", "start", 11.5, 700, true);
      tx(cx(14), cy(50) + 4, "淀积占优", "#b8791f", "middle", 11.5, 700, true);
      tx(cx(88), cy(50) + 4, "溶蚀占优", "#0b6580", "middle", 11.5, 700, true);
      tx(cx(100), cy(0) + 34, "水中 CO₂ 浓度 →", "#5a6472", "end", 11.5);
      tx(cx(0), cy(0) + 15, "0", "#9aa3ae", "middle", 10.5);
      tx(cx(50), cy(0) + 15, "50", "#9aa3ae", "middle", 10.5);
      tx(cx(100), cy(0) + 15, "100", "#9aa3ae", "middle", 10.5);
    }

    /* ---- 单一 render ---- */
    function spike(x, yBase, len, w, up) {
      var tipY = up ? yBase - len : yBase + len, mid = yBase + (up ? -len : len) * 0.72;
      return "M " + n1(x - w) + " " + n1(yBase) +
             " Q " + n1(x - w * 0.34) + " " + n1(mid) + " " + n1(x) + " " + n1(tipY) +
             " Q " + n1(x + w * 0.34) + " " + n1(mid) + " " + n1(x + w) + " " + n1(yBase) + " Z";
    }

    function render() {
      var dis = C / 100, dep = 1 - dis, net = 2 * C - 100;
      var CB = L.cave;
      var cxu = 0.5, cyu = 0.66;
      var rx = (0.17 + 0.16 * dis) * CB.w;
      var ry = (0.16 + 0.030 * dis) * CB.h;
      var pcx = X(cxu), pcy = Y(cyu), H = 2 * ry;

      R.cav.setAttribute("d", caveD(pcx, pcy, rx, ry));

      /* 溶沟 */
      var g = "", n = 5, u0 = 0.54, u1 = 0.93, stp = (u1 - u0) / (n * 2);
      var depth = (0.008 + 0.048 * dis);
      for (var i = 0; i <= n * 2; i++) {
        var u = u0 + i * stp;
        g += (i ? " L " : "M ") + n1(X(u)) + " " + n1(Y(0.26 + (i % 2 ? depth : 0)));
      }
      R.groove.setAttribute("d", g);

      /* 地下河 */
      var rt = pcy + ry * 0.70, rb = pcy + ry * 0.94, rh = rx * 0.62;
      R.river.setAttribute("d", "M " + n1(pcx - rh) + " " + n1(rt) +
        " L " + n1(pcx + rh) + " " + n1(rt) +
        " L " + n1(pcx + rh * 0.9) + " " + n1(rb) +
        " L " + n1(pcx - rh * 0.9) + " " + n1(rb) + " Z");
      R.rivLab.setAttribute("x", n1(pcx));
      R.rivLab.setAttribute("y", n1(rb - (rb - rt) * 0.28));

      /* 石钟乳 / 石笋：长度 = 基础残根 + 随淀积增长；中间那一对最终连成石柱 */
      var baseS = H * (0.14 + 0.24 * dep);
      var baseG = H * (0.12 + 0.18 * dep);
      var pS = baseS * 1.5, pG = baseG * 1.5;
      if (pS + pG > 0.94 * H) { var sc = 0.94 * H / (pS + pG); pS *= sc; pG *= sc; }

      var TA = [-0.62, -0.2, 0.24, 0.62];
      for (var a = 0; a < 4; a++) {
        var t = TA[a], q = Math.sqrt(Math.max(0, 1 - t * t));
        var bx = pcx + rx * t, by = pcy - ry * q * 0.96;
        var len = a === 1 ? pS : baseS;
        R.stals[a].setAttribute("d", spike(bx, by, len, Math.max(3.4, len * 0.15), false));
      }

      var TB = [-0.62, -0.2, 0.24];
      for (var b = 0; b < 3; b++) {
        var tb = TB[b], qb = Math.sqrt(Math.max(0, 1 - tb * tb));
        var sx = pcx + rx * tb, sy = pcy + ry * qb * 0.95;
        var ln = b === 1 ? pG : baseG;
        R.stags[b].setAttribute("d", spike(sx, sy, ln, Math.max(3.6, ln * 0.16), true));
      }

      /* 水滴：跟随石钟乳尖端 */
      var t2 = TA[2], q2 = Math.sqrt(1 - t2 * t2);
      var tipx = pcx + rx * t2, tipy = pcy - ry * q2 * 0.96 + baseS;
      R.drops[0].setAttribute("cx", n1(tipx + 1));
      R.drops[0].setAttribute("cy", n1(tipy + 9));
      R.drops[1].setAttribute("cx", n1(tipx - 6));
      R.drops[1].setAttribute("cy", n1(tipy + 26));

      /* 曲线上的游标 */
      var cx = R.cx, cy = R.cy;
      R.mark.setAttribute("x1", cx(C)); R.mark.setAttribute("x2", cx(C));
      R.mark.setAttribute("y1", cy(Math.min(dis * 100, dep * 100)));
      R.mark.setAttribute("y2", cy(Math.max(dis * 100, dep * 100)));
      R.mark.setAttribute("stroke", net >= 0 ? "#0891b2" : "#b8791f");
      R.dotD.setAttribute("cx", cx(C)); R.dotD.setAttribute("cy", cy(C));
      R.dotP.setAttribute("cx", cx(C)); R.dotP.setAttribute("cy", cy(100 - C));
      R.vline.setAttribute("x1", cx(C)); R.vline.setAttribute("x2", cx(C));
      R.vline.setAttribute("y1", cy(0)); R.vline.setAttribute("y2", cy(100));

      /* 数值卡 */
      vC.textContent = C;
      vN.textContent = (net > 0 ? "+" : net < 0 ? "−" : "") + Math.abs(net);

      var st, sn, col, bg;
      if (net > 6) { st = "溶蚀为主"; sn = "洞腔扩大 · 石钟乳被“饿”住"; col = "#0b6580"; bg = "#ecfbff"; }
      else if (net < -6) { st = "淀积为主"; sn = "石钟乳 · 石笋快速生长"; col = "#8a5c14"; bg = "#fdf3e0"; }
      else { st = "动态平衡"; sn = "溶蚀与淀积相抵 · 形态稳定"; col = "#5a6472"; bg = "#f4f7f9"; }
      vS.textContent = st; vSn.textContent = sn;
      vS.style.color = col;
      box.style.background = bg;
      box.style.borderColor = col + "44";
      if (sl.value !== String(C)) sl.value = C;
    }

    function applyLayout() {
      var w = stage.parentElement.getBoundingClientRect().width;
      L = w >= WIDE.bp ? WIDE : NARROW;
      FS = (L === WIDE) ? 1 : 1.25;
      stage.setAttribute("viewBox", L.vb);
      build();
      render();
    }

    /* ---- 输入 ---- */
    sl.addEventListener("input", function () { C = +this.value; render(); });
    $("gxP1").addEventListener("click", function () { C = 12; render(); });
    $("gxP2").addEventListener("click", function () { C = 50; render(); });
    $("gxP3").addEventListener("click", function () { C = 86; render(); });

    function setFromX(clientX) {
      var bb = stage.getBoundingClientRect();
      var vb = parseFloat(L.vb.split(" ")[2]) / bb.width;
      var x = (clientX - bb.left) * vb;
      var CH = L.chart;
      var r = (x - CH.x - 40) / (CH.w - 52);
      C = Math.max(0, Math.min(100, Math.round(r * 100)));
      render();
    }
    stage.addEventListener("pointerdown", function (ev) {
      dragging = true;
      try { stage.setPointerCapture(ev.pointerId); } catch (e) {}
      setFromX(ev.clientX);
    });
    stage.addEventListener("pointermove", function (ev) {
      if (!dragging) return;
      ev.preventDefault();
      setFromX(ev.clientX);
    });
    ["pointerup", "pointercancel"].forEach(function (e) {
      stage.addEventListener(e, function () { dragging = false; });
    });
    window.addEventListener("blur", function () { dragging = false; });

    var tmr = null;
    window.addEventListener("resize", function () {
      clearTimeout(tmr);
      tmr = setTimeout(applyLayout, 180);
    });

    applyLayout();
  })();
});
</script>
