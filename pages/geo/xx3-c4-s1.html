<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆关键词。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 生态文明的内涵<span class="q-src">人教版（2019）选择性必修3 · 第四章第一节</span></p>
<p class="q-b">生态文明是工业文明发展到一定阶段的产物，是实现人与自然和谐共生的新要求。建设生态文明，要以资源环境承载能力为基础，以自然规律为准则，以可持续发展、人与自然和谐共生为目标，走生产发展、生活富裕、生态良好的文明发展道路。</p>
<p class="q-n">→ 翻成人话：不是“不发展”，而是换方式——发展继续，资源消耗、污染排放和生态破坏降下来。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 两山理念<span class="q-src">人教版（2019）选择性必修3 · 第四章第一节</span></p>
<p class="q-b">绿水青山就是金山银山。保护生态环境就是保护生产力，改善生态环境就是发展生产力。</p>
<p class="q-n">→ 翻成人话：生态优势可转化为经济优势；保护是把“生态资本”守住并经营好。</p>
</div>

<div style="overflow-x:auto">

<tr><td>自然的位置</td><td>征服、索取的对象</td><td>生命共同体，保护生产力</td></tr>

<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点“下一步”。</p>

<div class="gx-ex">
<p class="ex-t">例题 · 工业园区的循环经济<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">某工业园区以钢铁、建材、化工为主，年耗能 500 万吨标煤，年产生固废 300 万吨，综合利用率仅 40%，固废多堆存填埋，产品同质化。问：（1）说明该园区发展模式存在的问题；（2）分析其发展循环经济的途径；（3）说明其对国家安全的意义。</p>
<ol class="steps" id="gxSteps">
<li class="step">
<p class="s-h">第 1 步 · 先给模式定性</p>
<p class="s-b">500 万吨标煤=高耗能，300 万吨固废=高排放，40% 利用率=低利用：线性经济。</p>
<p class="s-k">用到：传统工业文明与线性经济的特征。</p>
</li>
<li class="step" hidden>

      ev.preventDefault();
      A = GX.clamp(A + (ev.key === "ArrowRight" ? 5 : -5), 0, 100);
      render();
    }
  });
  var tmr = null;
  window.addEventListener("resize", function () { clearTimeout(tmr); tmr = setTimeout(layout, 180); });
  layout();
});
</script>
