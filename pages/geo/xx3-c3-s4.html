<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆因果链。</p>

<div class="gx-quote">

  <p class="q-b">全球气候变化是指全球气候平均状态随时间发生的变化，通常以全球变暖为主要特征；海平面上升、极端天气事件增多、冰川退缩和生态带移动是其重要表现。</p>
  <p class="q-n">→ 三个关键词：<b>全球</b>（空间尺度）、<b>平均状态</b>（不是一次天气）、<b>长期变化</b>（几十年以上）。</p>

<div class="gx-ex">
  <p class="ex-t">例题 · 岛国与海平面<span class="bdg bdg-must">必考</span></p>
  <p class="ex-q">某岛国陆地最高海拔约 2 m，人口约 11 万，所在海域海平面上升速率约 3 mm/年。该国珊瑚礁广布，旅游与渔业占经济比重高。说明该国面临的主要威胁，分析全球气候变化对国家安全的影响途径，并提出减缓与适应措施。</p>
