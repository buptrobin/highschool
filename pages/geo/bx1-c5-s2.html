<p class="gx-claim">土壤是<b>气候和生物用时间熬出来的一层皮</b>，肥不肥看的是水肥气热能不能同时供上。</p>
<div class="gx-meta">
  <span><i></i>人教版必修第一册 第五章第二节</span>
  <span><i></i>高一 · 植被与土壤</span>

</div>
<p class="gx-lede">这一节有三块内容：<b>土壤是什么</b>（组成 + 质地 + 剖面）、<b>土壤从哪来</b>（六个成土因素）、
<b>土壤有什么用</b>（功能与养护）。考试最爱考的是中间那块——
尤其是<b>"生物是最基本、最活跃的因素"</b>和<b>"气候越湿热，有机质反而越少"</b>这两条。</p>

<!-- ================= A ================= -->
<section class="gx-sec" id="a">
  <h2><span class="sn">01</span>课本怎么说</h2>
  <p class="gx-h2s">先背标准表述，再看解释。顺序反了，答题时就写不出术语。</p>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 定义与组成<span class="q-src">人教版（2019）必修第一册 · 第五章第二节</span></p>
    <p class="q-b">土壤是陆地表层具有一定肥力、能够生长植物的疏松表层，由矿物质、有机质、水分和空气四种物质组成。</p>
    <p class="q-n">→ 定义里有 <b>三个限定词</b>：<b>陆地表层</b>（位置）、<b>具有一定肥力</b>（性质）、
    <b>能够生长植物</b>（功能）。三者同时成立才叫土壤——石头、沙子、水泥地都不是。
    组成里的 <b>四种物质</b>要按"固、液、气"三相对上号：矿物质和有机质是<b>固相</b>，水分是<b>液相</b>，空气是<b>气相</b>。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 成土因素<span class="q-src">人教版（2019）必修第一册 · 第五章第二节</span></p>
    <p class="q-b">成土母质是土壤发育的物质基础，决定了土壤矿物质的成分和养分状况；生物是影响土壤发育的最基本也是最活跃的因素；气候直接影响土壤的水热状况；地貌影响水热条件的再分配；时间决定土壤发育的程度；人类活动对土壤的影响极为深刻。</p>
    <p class="q-n">→ 六个因素各管一件事，<b>不能互换</b>：<b>母质管"底子"</b>（成分与质地）、<b>生物管"有机质"</b>（最活跃）、
    <b>气候管"快慢"</b>（风化与分解速度）、<b>地貌管"分配"</b>（水热在坡上怎么分）、
    <b>时间管"厚薄"</b>、<b>人类管"改造"</b>。答题时问哪个就答哪个，写成"气候是最活跃的因素"直接判错。</p>
  </div>

  <p class="gx-note">另一个必须背的定义是<b>土壤肥力</b>：土壤能<b>同时并持续</b>供应和协调植物生长所需的<b>水、肥、气、热</b>的能力。
  注意"同时""持续""协调"三个词——只写"有机质多"就窄了，那只是"肥"这一项。</p>

  <p class="gx-h2s" style="margin-top:18px">三种土壤质地：一眼看出"透气"和"保肥"是个跷跷板：</p>
  <div style="overflow-x:auto">
  <table class="gx-cmp">
    <thead><tr><th>质地</th><th>通气透水性</th><th>蓄水保肥性</th><th>耕作性</th></tr></thead>
    <tbody>
      <tr><td>砂土</td><td>强</td><td>弱</td><td>易耕作，但有机质分解快、养分易流失</td></tr>
      <tr class="key"><td>壤土</td><td>良好</td><td>强</td><td><b>农业生产理想的土壤质地</b></td></tr>
      <tr><td>黏土</td><td>差</td><td>强</td><td>质地黏重、不易耕作，但保肥好、有机质易积累</td></tr>
    </tbody>
  </table>
  </div>
  <p class="gx-note">高亮那一行之所以"理想"，是因为它<b>两头都不极端</b>：砂土透气但漏水漏肥，黏土保水但闷根。
  壤土正好在中间——<b>通气与保水同时达标</b>，这就是"协调"二字的含义。</p>
</section>

<section class="gx-sec" id="b">
  <h2><span class="sn">02</span>拆开看</h2>
  <p class="gx-h2s">四张图：土壤由什么组成、剖面长什么样、六个因素各管什么、质地怎么选。</p>

  <!-- 图1 组成 -->
  <figure class="gx-fig">
    <div class="fig-cap">
      <span class="fig-no">图 1</span><span class="fig-t">理想土壤的"配方"：固、液、气各占一块</span>
    </div>

      <p class="er-x">✗ 耕作土壤也有完整的淋溶层和淀积层</p>
      <p class="er-v">✓ 耕作土壤分<b>耕作层 → 犁底层 → 自然土层</b>，反复耕作打乱了自然层次</p>
      <p class="er-w">错在哪：把自然剖面套到农田上。耕地被人翻过、压过、施过肥，层次早就不是原样了。</p>
    </div>
  </div>
</section>

<div class="gx-zoom" id="gxZoom" hidden>
  <span class="gx-zoom-tip">双指放大 · 左右滑动看全图</span>
  <button class="gx-zoom-x" type="button" aria-label="关闭">✕</button>
  <div id="gxZoomInner"></div>

</script>
<script src="../../assets/page.js"></script>
<script src="../../assets/geo-autopilot.js"></script>
<script>
/* 土壤 · 讲义交互（等 page.js 把 #md 渲染成正文之后再跑） */
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var NS = "http://www.w3.org/2000/svg";
  function $(id) { return document.getElementById(id); }
  function el(tag, attrs, parent) {
    var n = document.createElementNS(NS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }
  function n1(v) { return (Math.round(v * 10) / 10).toString(); }

  if (!$("gxStage")) return;

  /* ================= 手机的图放大 ================= */
  (function () {
    var zoom = $("gxZoom"), inner = $("gxZoomInner");
    if (!zoom || !inner) return;
    Array.prototype.forEach.call(document.querySelectorAll(".gx-svgbox"), function (box) {
      box.style.cursor = "zoom-in";
      box.addEventListener("click", function () {
        if (window.innerWidth > 760) return;
        var svg = box.querySelector("svg");
        if (!svg) return;
        inner.textContent = "";
        inner.appendChild(svg.cloneNode(true));
        zoom.hidden = false;
        document.body.style.overflow = "hidden";
      });
    });
    function close() { zoom.hidden = true; document.body.style.overflow = ""; }
    zoom.addEventListener("click", function (e) {
      if (e.target === zoom || e.target.classList.contains("gx-zoom-x")) close();
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && !zoom.hidden) close();
    });
  })();

  /* ================= 分步揭示 ================= */
  (function () {
    var steps = document.querySelectorAll("#gxSteps .step");
    var ans = $("gxAns"), btn = $("gxNext"), cnt = $("gxCnt");
    if (!steps.length || !btn) return;
    var i = 1;
    function paint() { if (cnt) cnt.textContent = Math.min(i, steps.length) + " / " + steps.length; }
    steps[0].hidden = false;
    paint();
    btn.addEventListener("click", function () {
      if (i < steps.length) { steps[i].hidden = false; i++; }
      if (i >= steps.length) {
        if (ans) ans.hidden = false;
        btn.textContent = "已全部展开";
        btn.disabled = true;
      }
      paint();
    });
  })();

  /* ================= 互动：温度 → 有机质 ================= */
  (function () {
    var stage = $("gxStage"), gSoil = $("gxSoil"), gTemp = $("gxTemp");
    var sl = $("gxSl"), vT = $("gxVt"), vO = $("gxVo"), vS = $("gxVs"), vSn = $("gxVsn"), box = $("gxStBox");

    var WIDE = {
      vb: "0 0 880 370", FS: 1,
      soil: { x: 140, w: 180, y: 130, bot: 340 },
      ax: { x: 520, y: 200, w: 320 }, bp: 620
    };
    var NARROW = {
      vb: "0 0 360 520", FS: 1.2,
      soil: { x: 100, w: 140, y: 110, bot: 290 },
      ax: { x: 14, y: 410, w: 330 }, bp: 620
    };
    var L = WIDE, FS = 1, T = 2, dragging = false, R = {};
    var T0 = -5, T1 = 26;

    function omOf(t) { return 100 / (1 + Math.exp((t - 8) / 5)); }

    function soilColor(om) {
      var k = 1 - om / 100;
      return "rgb(" + Math.round(58 + 120 * k) + "," + Math.round(46 + 46 * k) + "," + Math.round(34 + 24 * k) + ")";
    }

    function tx(x, y, s, col, anchor, size, weight, halo) {
      var o = { x: n1(x), y: n1(y), "font-size": (size || 10.5) * FS, fill: col,
                "text-anchor": anchor || "start", "font-weight": weight || 400 };
      if (halo) o["class"] = "halo";
      var t = el("text", o, null);
      t.textContent = s;
      return t;
    }

    function build() {
      gSoil.textContent = ""; gTemp.textContent = "";
      var S = L.soil, A = L.ax;

      /* 土壤柱背景 */
      R.hum = el("rect", { x: S.x, width: S.w, fill: "#3d3022" }, gSoil);
      R.mid = el("rect", { x: S.x, width: S.w, fill: "#9c8264" }, gSoil);
      R.mother = el("rect", { x: S.x, y: S.y + 110, width: S.w, height: S.bot - S.y - 110,
                              fill: "#c6b89c" }, gSoil);
      el("rect", { x: S.x, y: S.y, width: S.w, height: S.bot - S.y,
                   fill: "none", stroke: "#8a8272", "stroke-width": 1.6 }, gSoil);

      /* 落叶（固定输入） */
      R.leaves = [];
      for (var i = 0; i < 6; i++) {
        R.leaves.push(el("ellipse", { rx: 7, ry: 3.4, fill: "#8a7a55" }, gSoil));
      }
      var lt = tx(S.x + S.w + 8, S.y - 16, "落叶（输入固定）", "#8a7a55", "start", 9.5);
      gSoil.appendChild(lt);

      /* 左右标注 */
      R.hLab = tx(S.x - 10, 0, "腐殖质层", "#3a3a35", "end", 10.5, 700);
      gSoil.appendChild(R.hLab);
      R.hVal = tx(S.x - 10, 0, "", "#8a5c14", "end", 9.5);
      gSoil.appendChild(R.hVal);
      var mt = tx(S.x - 10, S.y + 150, "母质层", "#8a7a5e", "end", 10);
      gSoil.appendChild(mt);
      var top = tx(S.x - 10, S.y - 6, "地表", "#9aa3ae", "end", 9.5);
      gSoil.appendChild(top);

      R.gTop = tx(S.x + S.w / 2, S.bot + 18, "", "#5a6472", "middle", 10);
      gSoil.appendChild(R.gTop);

      /* 温度轴 */
      var ay = A.y, aw = A.w;
      var segs = [[-5, 0, "#8a9aa0", "冻土", "#fff"],
                  [0, 8, "#4a3b2a", "黑土", "#fff"],
                  [8, 14, "#8a6a4a", "棕壤", "#fff"],
                  [14, 20, "#b8955e", "黄壤", "#3a3a35"],
                  [20, 26, "#a8532e", "红壤", "#fff"]];
      segs.forEach(function (s) {
        var x1 = A.x + (s[0] - T0) / (T1 - T0) * aw;
        var x2 = A.x + (s[1] - T0) / (T1 - T0) * aw;
        el("rect", { x: n1(x1), y: ay - 16, width: n1(x2 - x1), height: 32, fill: s[2] }, gTemp);
        var lb = tx((x1 + x2) / 2, ay + 5, s[3], s[4], "middle", 10.5, 700);
        gTemp.appendChild(lb);
      });
      el("line", { x1: A.x, y1: ay + 16, x2: A.x + aw, y2: ay + 16, stroke: "#c9c2b0", "stroke-width": 1.2 }, gTemp);
      [[-5, "−5"], [8, "8"], [20, "20"], [26, "26"]].forEach(function (g) {
        var xx = A.x + (g[0] - T0) / (T1 - T0) * aw;
        var lt2 = tx(xx, ay + 34, g[1], "#9aa3ae", "middle", 9.5);
        gTemp.appendChild(lt2);
      });
      var cap = tx(A.x, ay + 54, "年均温（℃）→", "#5a6472", "start", 10);
      gTemp.appendChild(cap);

      R.cur = el("path", { fill: "#b8402f" }, gTemp);
      R.cline = el("line", { stroke: "#b8402f", "stroke-width": 1.6 }, gTemp);
      R.ctxt = el("text", { "font-size": 11 * FS, fill: "#b8402f", "font-weight": 700,
                            "text-anchor": "middle" }, gTemp);
    }

    function render() {
      var S = L.soil, A = L.ax;
      var om = omOf(T);
      var hh = 12 + om / 100 * 78;            /* 腐殖质层厚度（相对） */

      R.hum.setAttribute("y", n1(S.y));
      R.hum.setAttribute("height", n1(hh));
      R.hum.setAttribute("fill", soilColor(om));

      R.mid.setAttribute("y", n1(S.y + hh));
      R.mid.setAttribute("height", n1(Math.min(30, S.bot - S.y - hh)));
      R.mother.setAttribute("y", n1(S.y + hh + 30));
      R.mother.setAttribute("height", n1(Math.max(0, S.bot - S.y - hh - 30)));

      /* 落叶位置 */
      for (var i = 0; i < R.leaves.length; i++) {
        R.leaves[i].setAttribute("cx", n1(S.x + 20 + i * (S.w - 40) / (R.leaves.length - 1)));
        R.leaves[i].setAttribute("cy", n1(S.y - 12 - (i % 3) * 6));
      }

      var small = hh < 40;
      var lx = small ? S.x + S.w + 8 : S.x - 10;
      var la = small ? "start" : "end";
      R.hLab.setAttribute("x", n1(lx)); R.hLab.setAttribute("text-anchor", la);
      R.hVal.setAttribute("x", n1(lx)); R.hVal.setAttribute("text-anchor", la);
      R.hLab.setAttribute("y", n1(small ? S.y + hh + 16 : S.y + hh / 2 + 2));
      R.hVal.setAttribute("y", n1(small ? S.y + hh + 30 : S.y + hh / 2 + 16));
      R.hVal.textContent = "厚度 ≈ " + Math.round(hh / 90 * 100) + "%";

      var st;
      if (T < 0) st = "冻土";
      else if (T < 8) st = "黑土";
      else if (T < 14) st = "棕壤";
      else if (T < 20) st = "黄壤";
      else st = "红壤";
      R.gTop.textContent = "当前：" + st;

      /* 游标 */
      var cx = A.x + (T - T0) / (T1 - T0) * A.w;
      R.cline.setAttribute("x1", n1(cx)); R.cline.setAttribute("x2", n1(cx));
      R.cline.setAttribute("y1", n1(A.y - 17)); R.cline.setAttribute("y2", n1(A.y + 16));
      R.cur.setAttribute("d", "M " + n1(cx) + " " + n1(A.y - 17) + " l -6 -11 l 12 0 z");
      R.ctxt.setAttribute("x", n1(cx));
      R.ctxt.setAttribute("y", n1(A.y - 33));
      R.ctxt.textContent = T.toFixed(1) + " ℃";

      /* 数值卡 */
      vT.textContent = T.toFixed(1) + " ℃";
      vO.textContent = Math.round(om);

      var sn, cc, bg;
      if (T < 0) { sn = "分解极慢 · 有机质大量积累"; cc = "#0b6580"; bg = "#ecfbff"; }
      else if (T < 8) { sn = "腐殖质层深厚 · 分解慢"; cc = "#1e6640"; bg = "#e6f6ee"; }
      else if (T < 14) { sn = "有机质中等 · 淋溶开始增强"; cc = "#8a5c14"; bg = "#fdf3e0"; }
      else if (T < 20) { sn = "淋溶较强 · 有机质偏少"; cc = "#8a5c14"; bg = "#fdf3e0"; }
      else { sn = "酸性黏重 · 有机质少"; cc = "#b8402f"; bg = "#fbeae7"; }
      vS.textContent = st; vSn.textContent = sn;
      vS.style.color = cc;
      box.style.background = bg;
      box.style.borderColor = cc + "44";
      if (sl.value !== String(T)) sl.value = T;
    }

    function applyLayout() {
      var w = stage.parentElement.getBoundingClientRect().width;
      L = w >= WIDE.bp ? WIDE : NARROW;
      FS = L.FS;
      stage.setAttribute("viewBox", L.vb);
      build();
      render();
    }

    sl.addEventListener("input", function () { T = +this.value; render(); });
    $("gxP1").addEventListener("click", function () { T = -4; render(); });
    $("gxP2").addEventListener("click", function () { T = 8; render(); });
    $("gxP3").addEventListener("click", function () { T = 16; render(); });
    $("gxP4").addEventListener("click", function () { T = 24; render(); });

    function setFromX(clientX) {
      var bb = stage.getBoundingClientRect();
      var vbw = parseFloat(L.vb.split(" ")[2]);
      var x = (clientX - bb.left) * (vbw / bb.width);
      var frac = (x - L.ax.x) / L.ax.w;
      T = Math.max(T0, Math.min(T1, Math.round((T0 + frac * (T1 - T0)) * 2) / 2));
      render();
    }
    stage.addEventListener("pointerdown", function (ev) {
      dragging = true;
      try { stage.setPointerCapture(ev.pointerId); } catch (e) {}
      setFromX(ev.clientX);
    });
    stage.addEventListener("pointermove", function (ev) {
      if (!dragging) return;
      ev.preventDefault();
      setFromX(ev.clientX);
    });
    ["pointerup", "pointercancel"].forEach(function (e) {
      stage.addEventListener(e, function () { dragging = false; });
    });
    window.addEventListener("blur", function () { dragging = false; });

    var tmr = null;
    window.addEventListener("resize", function () {
      clearTimeout(tmr);
      tmr = setTimeout(applyLayout, 180);
    });

    applyLayout();
  })();
});
</script>
