      tk = "当前 " + Math.round(R) + "%：留存约 " + v.toFixed(1) + " 亿元，约 " + Math.round(100 - v / V * 100) + "% 的增加值外流；就业乘数约 " + Math.round(m) + " 人/亿元。配套率每提高 10 个百分点，留存约增加 9 亿元。";
    }
    $("gxTake").innerHTML = tk;
  }

  function render() {
    var gA = $("gxA"), gB = $("gxB");
    gA.textContent = ""; gB.textContent = "";
    drawChain(gA); drawCurve(gB);
    paint();
  }

  function applyLayout() {
    var wide = stage.parentElement.getBoundingClientRect().width >= 640;
    L = wide ? WIDE : NARROW;
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  $("gxSl").addEventListener("input", function () { R = +this.value; render(); });
  $("gxP1").addEventListener("click", function () { R = 0; render(); });
  $("gxP2").addEventListener("click", function () { R = 70; render(); });
  stage.addEventListener("keydown", function (ev) {
    if (ev.key === "ArrowLeft" || ev.key === "ArrowRight") {
      ev.preventDefault();
      R = GX.clamp(R + (ev.key === "ArrowRight" ? 5 : -5), 0, 100);
      render();
    }
  });
  var tmr = null;
  window.addEventListener("resize", function () {
    clearTimeout(tmr); tmr = setTimeout(applyLayout, 180);
  });
  applyLayout();
});
</script>
</body>
</html>
