<!-- ================= A ================= -->
<section class="gx-sec" id="a">
  <h2><span class="sn">01</span>课本怎么说</h2>
  <p class="gx-h2s">先背标准表述，再看解释。顺序反了，答题时就写不出术语。</p>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 防灾减灾手段<span class="q-src">人教版（2019）必修第一册 · 第六章第三节</span></p>
    <p class="q-b">防灾减灾手段主要有灾害监测、灾害防御、灾害救援与救助、灾后恢复等。
    灾害监测依靠气象、水文、地质、海洋等监测站网和卫星遥感等手段，及时发现灾害的发生与发展；
    灾害防御包括修建水库、堤坝、护坡等工程性措施，以及制定法律法规、开展宣传教育等非工程性措施。</p>
    <p class="gx-n">→ <b>四个手段要按"时间顺序"记</b>：<b>灾前（监测、防御）→ 灾中（救援与救助）→ 灾后（恢复）</b>。
    每个手段都要能说出<b>"一个工程措施 + 一个非工程措施"</b>，
    因为几乎所有"提出措施"的题，阅卷点里都有这两类。
    <b>只写"加强监测预报"最多得一半分</b>，剩下的分在"工程措施"上。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 自救与互救<span class="q-src">人教版（2019）必修第一册 · 第六章第三节</span></p>
    <p class="q-b">自救与互救包括灾前准备、灾中救助和灾后自我保护。
    灾前要了解所在地区可能发生的灾害，准备必要的应急物品，熟悉逃生路线；
    灾中要保持冷静，就近避险，服从指挥；灾后要注意防范次生灾害，做好卫生防疫。</p>
    <p class="gx-n">→ 三个阶段的关键词各只有一个：
    <b>灾前 = "准备"</b>（知道、有物、认路、演练）；
    <b>灾中 = "就近"</b>（不是"快跑"——很多伤亡发生在跑的路上）；
    <b>灾后 = "防次生 + 防疫情"</b>。
    <b>"就近避险"这四个字是本节最值钱的四个字</b>，它与"往哪跑"一起决定了生还率。</p>
  </div>

  <p class="gx-h2s" style="margin-top:18px">四个手段 × 具体做法，考"措施"时直接照着挑：</p>
  <div style="overflow-x:auto">
  <table class="gx-cmp">
    <thead><tr><th>手段</th><th>工程性措施</th><th>非工程性措施</th></tr></thead>
    <tbody>
      <tr><td>灾害监测</td><td>建气象站、水文站、地震台、海洋浮标</td><td><b>卫星遥感监测、群测群防、预警信息发布</b></td></tr>
      <tr class="key"><td>灾害防御</td><td>修水库堤坝、护坡挡墙、排导槽、避让搬迁</td><td><b>法律法规、规划避让、宣传教育、应急演练</b></td></tr>
      <tr><td>救援与救助</td><td>救援通道、应急避难场所、物资储备库</td><td>应急预案、救援队伍、社会捐助、保险</td></tr>
      <tr><td>灾后恢复</td><td>重建住房、修复道路与供水供电</td><td>心理援助、生产自救、总结经验修订预案</td></tr>
    </tbody>
  </table>
  </div>
  <p class="gx-note">记忆抓手：<b>能"修"的是工程性，能"管"的是非工程性</b>。
  题目问"针对城市内涝提出措施"，答"疏浚河道、提标改造管网、建蓄洪区（工程）+ 预警、应急预案、控制开发强度（非工程）"，
  两栏各写两条，结构分就稳了。</p>
</section>

  <p class="gx-h2s">四张图：四个手段怎么闭环、预警凭什么能"抢时间"、灾前该准备什么、灾中该往哪跑。</p>

  <!-- 图1 四手段闭环 -->

  <p class="gx-h2s">把震中距拉开，看"你能用的那几秒"是怎么被距离决定的。</p>

  <figure class="gx-fig">
    <div class="fig-cap">
      <span class="fig-no">图 5</span><span class="fig-t">震中距越远，预警时间越长——但摇晃越轻</span>
    </div>
    <p class="fig-s">拖动滑块改变<b>震中距</b>。左边是<b>时间轴</b>：P 波到达台站、发出预警、S 波到达你的位置，
    中间那段绿色区间就是<b>预警时间</b>。右边是<b>预警时间随震中距的变化曲线</b>。
    你要看出三件事：<b>① 预警时间与震中距成正比</b>（每 10 km 约 1.2 秒）；
    <b>② 震中附近几公里处，预警时间几乎为 0</b>——这就是"预警盲区"；

    当地气象部门提前发布了暴雨橙色预警。<br><br>
    （1）说明该县易发生泥石流的条件。<br>
    （2）泥石流发生时，当地居民正确的逃生方向是什么？为什么？<br>
    （3）从"灾前—灾中—灾后"三个阶段，为该县提出防灾减灾措施。<br>

        <b>③水</b>：7 月暴雨集中，是激发条件；<b>④人类活动</b>：沟口建房、陡坡开垦使危险区人口增加。
        <b>"位于洪积扇上"这句话是题眼</b>——它直接说明聚落占用了泥石流的堆积区。</p>
        <p class="s-k">用到：泥石流的形成条件</p>

        <p class="s-b">正确方向是<b>垂直于沟谷（垂直于泥石流流动方向）向两侧山坡高处跑</b>。

        <p class="s-k">用到：灾中自救的方向判断</p>

        <p class="s-k">用到：防灾减灾的四个手段</p>

        <b>②从预警到灾害发生的时间可能很短</b>，偏远山区信息到达慢；
        <b>③预警无法阻止灾害本身发生</b>，工程措施与避让才是根本。
        <b>写"作用"只有一半分，写"局限"才是高分点。</b></p>

      <b>灾中</b>：及时发布预警，组织居民<b>垂直沟谷方向撤离</b>至安全高地，开放应急避难场所，调集救援队伍与物资。<br>

      <b>局限</b>：预警主要针对<b>降水</b>，难以精确预报泥石流发生的<b>具体时间与地点</b>；

      <p class="er-v">✓ 目前只能<b>预警</b>：利用 P 波与 S 波的速度差争取几秒到几十秒</p>
      <p class="er-w">错在哪：把"预警"说成"预报"。这一个词之差，是这道题的判分点。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 泥石流来了要赶紧往山下跑</p>
      <p class="er-v">✓ <b>垂直于沟谷向两侧山坡高处跑</b></p>
      <p class="er-w">错在哪：泥石流沿沟谷向下游冲，顺沟跑等于与它同路。方向反了，跑得越快越危险。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 洪水来了顺着水流方向跑，跑得快就行</p>
      <p class="er-v">✓ <b>垂直于水流</b>向高处转移，不涉水穿越积水路段</p>
      <p class="er-w">错在哪：洪水流速常大于人的奔跑与涉水能力，30 cm 急流即可冲倒成人。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 地震时应该马上跑到楼下空地</p>
      <p class="er-v">✓ 先<b>就近避险</b>（伏地遮挡手抓牢），<b>震动停止后</b>再撤离</p>
      <p class="er-w">错在哪：剧烈震动时奔跑极易被坠落物砸伤，楼梯间是最危险的位置之一。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 防灾减灾只要"加强监测预报"</p>
      <p class="er-v">✓ 要写<b>工程措施 + 非工程措施</b>，覆盖灾前、灾中、灾后</p>
      <p class="er-w">错在哪：只写了一个手段。措施题的分点，往往就是按手段给的。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 有了预警，灾害就不会造成损失</p>
      <p class="er-v">✓ 预警<b>减少</b>损失，但<b>不能阻止灾害发生</b>，还有盲区与信息延迟</p>
      <p class="er-w">错在哪：把"减轻"当成"消除"。这是"作用与局限"题的必答点。</p>
    </div>
  </div>
</section>

<footer class="gx-foot">
  对应 <b>人教版（2019）必修第一册 第六章第三节「防灾减灾」</b>（四个手段、自救与互救）· 生成自 <code>eli5-high</code> skill<br>
  数据口径：P 波取 6.0 km/s、S 波取 3.5 km/s（地壳中常用值），预警时间按两者到达时间差计算，
  <b>不含台站处理与信息分发延迟</b>（实际会短 1—3 秒）。<br>
  图 5 的曲线为教学示意，<b>不代表任何一次地震的实际预警能力</b>；预警盲区范围随台站布设而变。
</footer>

<div class="gx-zoom" id="gxZoom" hidden>
  <span class="gx-zoom-tip">双指放大 · 左右滑动看全图</span>
  <button class="gx-zoom-x" type="button" aria-label="关闭">✕</button>
  <div id="gxZoomInner"></div>
</div>

<script src="../../assets/page.js"></script>
<script>
/* 防灾减灾 · 讲义交互（等 page.js 把 #md 渲染成正文之后再跑） */
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var NS = "http://www.w3.org/2000/svg";
  function $(id) { return document.getElementById(id); }
  function el(tag, attrs, parent) {
    var n = document.createElementNS(NS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }
  function n1(v) { return (Math.round(v * 10) / 10).toString(); }

  if (!$("gxStage")) return;

  /* ================= 手机上的图放大 ================= */
  (function () {
    var zoom = $("gxZoom"), inner = $("gxZoomInner");
    if (!zoom || !inner) return;
    Array.prototype.forEach.call(document.querySelectorAll(".gx-svgbox"), function (box) {
      box.style.cursor = "zoom-in";
      box.addEventListener("click", function () {
        if (window.innerWidth > 760) return;
        var svg = box.querySelector("svg");
        if (!svg) return;
        inner.textContent = "";
        inner.appendChild(svg.cloneNode(true));
        zoom.hidden = false;
        document.body.style.overflow = "hidden";
      });
    });
    function close() { zoom.hidden = true; document.body.style.overflow = ""; }
    zoom.addEventListener("click", function (e) {
      if (e.target === zoom || e.target.classList.contains("gx-zoom-x")) close();
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && !zoom.hidden) close();
    });
  })();

  /* ================= 分步揭示 ================= */
  (function () {
    var steps = document.querySelectorAll("#gxSteps .step");
    var ans = $("gxAns"), btn = $("gxNext"), cnt = $("gxCnt");
    if (!steps.length || !btn) return;
    var i = 1;
    function paint() { if (cnt) cnt.textContent = Math.min(i, steps.length) + " / " + steps.length; }
    steps[0].hidden = false;
    paint();
    btn.addEventListener("click", function () {
      if (i < steps.length) { steps[i].hidden = false; i++; }
      if (i >= steps.length) {
        if (ans) ans.hidden = false;
        btn.textContent = "已全部展开";
        btn.disabled = true;
      }
      paint();
    });
  })();

  /* ================= 互动：震中距 → 预警时间 ================= */
  (function () {
    var stage = $("gxStage"), gL = $("gxL"), gR = $("gxR");
    var sl = $("gxSl"), vD = $("gxVd"), vT = $("gxVt"), vS = $("gxVs"), vSn = $("gxVsn"), box = $("gxStBox");

    var WIDE = {
      vb: "0 0 880 440", FS: 1,
      tl: { x0: 50, x1: 450, ax: 200 },
      ch: { x0: 500, x1: 830, top: 70, gy: 300 },
      tlT: 30, chT: 30
    };
    var NARROW = {
      vb: "0 0 360 540", FS: 1.05,
      tl: { x0: 24, x1: 336, ax: 150 },
      ch: { x0: 54, x1: 300, top: 320, gy: 470 },
      tlT: 22, chT: 296
    };
    var L = WIDE, FS = 1, R = 50, dragging = false, G = {};

    var RMAX = 150, TMAX = 45, VP = 6.0, VS = 3.5;
    var K = 1 / VS - 1 / VP;  /* 0.11905 s/km */

    function tP(r) { return r / VP; }
    function tS(r) { return r / VS; }
    function lead(r) { return r * K; }
    function xT(t) { return L.tl.x0 + (t / TMAX) * (L.tl.x1 - L.tl.x0); }
    function xR(r) { return L.ch.x0 + (r / RMAX) * (L.ch.x1 - L.ch.x0); }
    function yLead(v) { return L.ch.gy - (v / 18) * (L.ch.gy - L.ch.top); }

    function stateOf(t) {
      if (t < 3) return { n: "只能就近躲避", st: "来不及撤离：立刻伏地、遮挡、手抓牢", c: "#b8402f" };
      if (t < 10) return { n: "躲到桌下", st: "够时间钻到坚固桌下或承重墙角", c: "#b8791f" };
      if (t < 20) return { n: "可撤离低层", st: "低层可从安全通道有序撤到室外空旷处", c: "#0b6580" };
      return { n: "可组织撤离", st: "有时间组织人员撤离、关闭燃气与电源", c: "#2f8a5b" };
    }

    function tx(parent, x, y, s, col, anchor, size, weight, halo) {
      var o = { x: n1(x), y: n1(y), "font-size": (size || 10) * FS, fill: col,
                "text-anchor": anchor || "start", "font-weight": weight || 400 };
      if (halo) o["class"] = "halo";
      var t = el("text", o, parent);
      t.textContent = s;
      return t;
    }

    function build() {
      gL.textContent = ""; gR.textContent = "";
      var T = L.tl, C = L.ch, i;

      /* ---------- 左：时间轴 ---------- */
      tx(gL, T.x0, L.tlT, "时间轴：从地震发生到摇晃开始", "#151a21", "start", 10.5, 700);
      tx(gL, T.x0, L.tlT + 15, "绿色区间 = 你能用的预警时间", "#5a6472", "start", 9);

      el("line", { x1: n1(T.x0), y1: n1(T.ax), x2: n1(T.x1), y2: n1(T.ax),
                   stroke: "#c9d3dc", "stroke-width": 1.2 }, gL);
      for (i = 0; i <= TMAX; i += 5) {
        var x = xT(i);
        el("line", { x1: n1(x), y1: n1(T.ax), x2: n1(x), y2: n1(T.ax + 6),
                     stroke: "#c9d3dc", "stroke-width": 1 }, gL);
        tx(gL, x, T.ax + 20, String(i), "#9aa3ae", "middle", 8);
      }
      tx(gL, T.x1, T.ax + 34, "秒", "#9aa3ae", "end", 8);

      /* 事件标记 */
      G.eq = el("circle", { cx: n1(T.x0), cy: n1(T.ax), r: 4.5, fill: "#b8402f" }, gL);
      tx(gL, T.x0, T.ax - 12, "地震", "#b8402f", "middle", 8.5, 700);

      G.pm = el("line", { y1: n1(T.ax - 8), y2: n1(T.ax + 8), stroke: "#0b6580", "stroke-width": 2 }, gL);
      G.sm = el("line", { y1: n1(T.ax - 8), y2: n1(T.ax + 8), stroke: "#b8402f", "stroke-width": 2 }, gL);
      G.pT = tx(gL, 0, 0, "", "#0b6580", "middle", 8.5, 700);
      G.sT = tx(gL, 0, 0, "", "#b8402f", "middle", 8.5, 700);

      /* 预警窗口条 */
      G.win = el("rect", { y: n1(T.ax - 9), height: 18, fill: "#e6f6ee", stroke: "#bfe0cd" }, gL);
      G.winT = tx(gL, 0, 0, "", "#1e6640", "middle", 8.5, 700);
      G.gap = el("line", { y1: n1(T.ax + 30), y2: n1(T.ax + 30), stroke: "#2f8a5b", "stroke-width": 1.4 }, gL);

      /* 说明行 */
      tx(gL, T.x0, T.ax + 76, "P 波先到台站 → 立即用电磁波发出预警 →", "#5a6472", "start", 9);
      tx(gL, T.x0, T.ax + 92, "S 波还在路上，这几秒就是你唯一的机会。", "#5a6472", "start", 9);

      /* ---------- 右：曲线 ---------- */
      tx(gR, C.x0, L.chT, "预警时间与震中距成正比", "#151a21", "start", 10.5, 700);
      tx(gR, C.x0, L.chT + 15, "每 10 km 约多 1.2 秒", "#5a6472", "start", 9);

      /* 盲区 */
      el("rect", { x: n1(xR(5)), y: n1(C.top), width: n1(xR(20) - xR(5)),
                   height: n1(C.gy - C.top), fill: "#fbeae7", opacity: 0.7 }, gR);
      tx(gR, xR(20) + 4, C.top + 14, "预警盲区", "#8f3226", "start", 8.5, 700);

      [0, 6, 12, 18].forEach(function (v) {
        var y = yLead(v);
        el("line", { x1: n1(C.x0), y1: n1(y), x2: n1(C.x1), y2: n1(y),
                     stroke: "#eef2f5", "stroke-width": 1 }, gR);
        tx(gR, C.x0 - 5, y + 3, String(v), "#9aa3ae", "end", 8);
      });
      [10, 50, 100, 150].forEach(function (r) {
        var x = xR(r);
        el("line", { x1: n1(x), y1: n1(C.top), x2: n1(x), y2: n1(C.gy),
                     stroke: "#f2f5f7", "stroke-width": 1 }, gR);
        tx(gR, x, C.gy + 15, String(r), "#9aa3ae", "middle", 8);
      });
      tx(gR, C.x1, C.gy + 29, "震中距 km", "#9aa3ae", "end", 8);
      tx(gR, C.x0 - 5, C.top - 8, "s", "#9aa3ae", "end", 8);
      el("line", { x1: n1(C.x0), y1: n1(C.gy), x2: n1(C.x1), y2: n1(C.gy), stroke: "#c9d3dc" }, gR);
      el("line", { x1: n1(C.x0), y1: n1(C.top), x2: n1(C.x0), y2: n1(C.gy), stroke: "#c9d3dc" }, gR);

      el("path", { d: "M " + n1(xR(5)) + " " + n1(yLead(lead(5))) + " L " +
                      n1(xR(RMAX)) + " " + n1(yLead(lead(RMAX))),
                   fill: "none", stroke: "#2f8a5b", "stroke-width": 2.4 }, gR);

      G.cv = el("line", { y1: n1(C.top), y2: n1(C.gy), stroke: "#5a6472",
                          "stroke-width": 1.1, "stroke-dasharray": "5 4" }, gR);
      G.cd = el("circle", { r: 4.2, fill: "#2f8a5b", stroke: "#fff", "stroke-width": 1.3 }, gR);
      G.ct = tx(gR, 0, 0, "", "#1e6640", "start", 9, 700, true);
    }

    function render() {
      var T = L.tl, C = L.ch;
      var lp = tP(R), ls = tS(R), lt = lead(R), st = stateOf(lt);

      /* 时间轴上的两点 */
      var xp = xT(lp), xs = xT(ls);
      G.pm.setAttribute("x1", n1(xp));
      G.pm.setAttribute("x2", n1(xp));
      G.sm.setAttribute("x1", n1(xs));
      G.sm.setAttribute("x2", n1(xs));

      G.pT.setAttribute("x", n1(xp));
      G.pT.setAttribute("y", n1(T.ax - 22));
      G.pT.textContent = "P 波 " + n1(lp) + " s";
      G.sT.setAttribute("x", n1(xs));
      G.sT.setAttribute("y", n1(T.ax - 40));
      G.sT.textContent = "S 波 " + n1(ls) + " s";

      G.win.setAttribute("x", n1(xp));
      G.win.setAttribute("width", n1(Math.max(2, xs - xp)));
      G.winT.setAttribute("x", n1((xp + xs) / 2));
      G.winT.setAttribute("y", n1(T.ax + 46));
      G.winT.textContent = n1(lt) + " s";

      G.gap.setAttribute("x1", n1(xp));
      G.gap.setAttribute("x2", n1(xs));

      /* 曲线游标 */
      var cx = xR(R), cy = yLead(lt);
      G.cv.setAttribute("x1", n1(cx));
      G.cv.setAttribute("x2", n1(cx));
      G.cd.setAttribute("cx", n1(cx));
      G.cd.setAttribute("cy", n1(cy));
      G.ct.setAttribute("x", n1(Math.min(cx + 7, C.x1 - 34)));
      G.ct.setAttribute("y", n1(cy - 8));
      G.ct.textContent = n1(lt) + " s";

      vD.textContent = Math.round(R) + " km";
      vT.textContent = n1(lt) + " s";
      vS.textContent = st.n;
      vSn.textContent = st.st;
      if (box) {
        box.style.background = lt < 3 ? "#fbeae7" : (lt < 10 ? "#fdf3e0" : "#eef6fb");
        box.style.borderColor = st.c + "44";
        var kv = box.querySelector(".v");
        if (kv) kv.style.color = st.c;
      }
      if (sl.value !== String(Math.round(R))) sl.value = String(Math.round(R));
    }

    function applyLayout() {
      var w = stage.parentElement.getBoundingClientRect().width;
      L = w >= 690 ? WIDE : NARROW;
      FS = L.FS;
      stage.setAttribute("viewBox", L.vb);
      build();
      render();
    }

    sl.addEventListener("input", function () { R = +this.value; render(); });
    $("gxP1").addEventListener("click", function () { R = 10; render(); });
    $("gxP2").addEventListener("click", function () { R = 50; render(); });
    $("gxP3").addEventListener("click", function () { R = 100; render(); });
    $("gxP4").addEventListener("click", function () { R = 150; render(); });

    function setFromX(clientX) {
      var bb = stage.getBoundingClientRect();
      var vbw = parseFloat(L.vb.split(" ")[2]);
      var xx = (clientX - bb.left) * (vbw / bb.width);
      var f = (xx - L.tl.x0) / (L.tl.x1 - L.tl.x0);
      var t = Math.max(0, Math.min(1, f)) * TMAX;
      R = Math.max(5, Math.min(RMAX, Math.round(t / K)));
      render();
    }
    stage.addEventListener("pointerdown", function (ev) {
      dragging = true;
      try { stage.setPointerCapture(ev.pointerId); } catch (e) {}
      setFromX(ev.clientX);
    });
    stage.addEventListener("pointermove", function (ev) {
      if (!dragging) return;
      ev.preventDefault();
      setFromX(ev.clientX);
    });
    ["pointerup", "pointercancel"].forEach(function (e) {
      stage.addEventListener(e, function () { dragging = false; });
    });
    window.addEventListener("blur", function () { dragging = false; });
    stage.addEventListener("keydown", function (ev) {
      if (ev.key === "ArrowLeft" || ev.key === "ArrowRight") {
        ev.preventDefault();
        R = Math.max(5, Math.min(RMAX, R + (ev.key === "ArrowRight" ? 10 : -10)));
        render();
      }
    });

    var tmr = null;
    window.addEventListener("resize", function () {
      clearTimeout(tmr);
      tmr = setTimeout(applyLayout, 180);
    });

    applyLayout();
  })();
});

</script>
