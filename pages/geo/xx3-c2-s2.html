<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再看它拆成哪几问。</p>
<div class="gx-quote">
<p class="q-t">课本表述 · 能源安全<span class="q-src">人教版（2019）选择性必修3 · 第二章第二节</span></p>
<p class="q-b">能源安全，是一个国家或地区能够持续、稳定、及时、足量、经济地获取所需能源，并保障能源使用不损害生态环境的状态与能力。</p>
<p class="q-n">→ 拆成四问：<b>够不够</b>（供应）、<b>贵不贵</b>（价格）、<b>运不运得回</b>（通道与储备）、<b>干不干净</b>（碳排放）。四问里任何一问出问题，都会传导到经济与社会。</p>
</div>
<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>看哪一层</th><th>只盯"有没有油"</th><th>完整的能源安全</th></tr></thead>
<tbody>
<tr><td>供应</td><td>国内产量够不够</td><td>国内产能 + 多元进口 + 替代能源</td></tr>
<tr><td>价格</td><td>国际油价高低</td><td>价格波动对工业、交通、民生的冲击</td></tr>
<tr class="key"><td>通道</td><td>常常被跳过</td><td>马六甲等海上节点 + 中俄、中哈、中缅陆上通道</td></tr>
<tr><td>储备</td><td>有没有库存</td><td>战略石油储备 + 应急释放能力</td></tr>
<tr><td>环境</td><td>基本不考虑</td><td>煤炭清洁利用 + 非化石替代 + 碳减排</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">最容易背漏的是"通道"和"储备"：它们不增加一滴油，却决定危机时油能不能到、能撑多久。</p>
</section>

<div class="gx-ex">
<p class="ex-t">例题<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">我国某年石油消费量 7.5 亿吨，国内产量 2 亿吨，进口量 5.5 亿吨，其中约七成进口经马六甲海峡。据此回答：（1）计算我国石油的对外依存度。（2）说明我国能源安全面临的主要风险。（3）提出保障能源安全的措施。</p>
<ol class="steps" id="gxSteps">
<li class="step"><p class="s-h">第 1 步 · 先认分母</p><p class="s-b">对外依存度 = 进口量 ÷ 消费量，分母是"消费"，不是"产量"，也不是"进口＋产量"。</p><p class="s-k">用到：对外依存度的定义</p></li>
<li class="step" hidden><p class="s-h">第 2 步 · 代入计算</p><p class="s-b">5.5 ÷ 7.5 ≈ 0.733，即约 73%。含义是每消费 100 吨石油，约 73 吨来自进口。</p><p class="s-k">用到：5.5 亿吨、7.5 亿吨</p></li>
<li class="step" hidden><p class="s-h">第 3 步 · 把数字翻译成风险</p><p class="s-b">"约 73%"说明依存度高；"七成经马六甲"说明通道集中；产量只有 2 亿吨，说明增储上产空间有限；再补储备不足与结构偏煤。</p><p class="s-k">用到：依存度、通道、产量、储备、结构</p></li>
<li class="step" hidden><p class="s-h">第 4 步 · 风险分四层写</p><p class="s-b">①供应与价格受国际市场牵动；②通道集中，海峡受阻风险大；③战略储备与应急能力不足；④煤炭占比高，碳排放和运输压力大。</p><p class="s-k">用到：图 2 的风险链</p></li>
<li class="step" hidden><p class="s-h">第 5 步 · 措施对着风险写</p><p class="s-b">①节能提效；②发展风、光、水、核；③多元进口与通道，用好中俄、中哈、中缅；④战略石油储备；⑤煤炭清洁高效利用。</p><p class="s-k">用到：一节一条，别堆名词</p></li>
</ol>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>
<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 能源安全就是看有没有石油，石油够用就安全。</p>

<p class="er-w">错在哪：只盯"油够不够"，漏掉买不买得起、运不运得回、存不存得住、用得干不干净。</p>
</div>
<div class="er">
<p class="er-x">✗ 我国进口石油多，但航线是现成的，不用管通道。</p>
<p class="er-v">✓ 进口通道高度集中，马六甲海峡等节点是能源安全的"咽喉"。</p>
<p class="er-w">错在哪：通道不增加一滴油，却决定危机时油能不能到；要陆海并举、多元通道。</p>
</div>
<div class="er">
<p class="er-x">✗ 我国煤炭多，所以能源安全没有问题。</p>
<p class="er-v">✓ 煤炭多只解决"有没有"，还带来碳排放、运输和清洁利用问题。</p>
<p class="er-w">错在哪：把"数量安全"当成"全面安全"；煤炭要清洁高效利用，运输压力也不小。</p>
</div>
<div class="er">
<p class="er-x">✗ 风电、光伏是清洁能源，出力稳定，可以完全替代煤电。</p>
<p class="er-v">✓ 风、光有间歇性和波动性，要靠储能、电网调节和多元电源兜底。</p>
<p class="er-w">错在哪：把"清洁"当成"稳定"；非化石能源也要解决消纳和调峰。</p>
</div>
<div class="er">
<p class="er-x">✗ 提高能效就是增加供给，反正都是多搞能源。</p>
<p class="er-v">✓ 节能提效是"节流"，增加供给是"开源"，二者不是一回事。</p>
<p class="er-w">错在哪：混淆"少用"和"多产"；保障能源安全要节流与开源并举。</p>

document.getElementById("gxP10").addEventListener("click", function () { nf = 10; render(); });
document.getElementById("gxP35").addEventListener("click", function () { nf = 35; render(); });
document.getElementById("gxP60").addEventListener("click", function () { nf = 60; render(); });
stage.addEventListener("keydown", function (ev) {
if (ev.key === "ArrowLeft" || ev.key === "ArrowRight") {
ev.preventDefault();
nf = Math.max(10, Math.min(60, nf + (ev.key === "ArrowRight" ? 1 : -1)));
render();
}
});
var tmr = null;
window.addEventListener("resize", function () {
clearTimeout(tmr);
tmr = setTimeout(applyLayout, 180);
});
applyLayout();
});
</script>
</body>
