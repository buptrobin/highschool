<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再看解释。</p>

<div class="gx-quote">
<p class="q-t">课本表述 · 自然环境的服务功能<span class="q-src">人教版（2019）选择性必修3 · 第一章第一节</span></p>
<p class="q-b">自然环境的服务功能，是指自然环境对人类生存和发展所提供的各种惠益，主要包括供给服务、调节服务、文化服务和支撑服务。</p>
<p class="q-n">→ 抓三个词："人类生存和发展"限定受益对象；"惠益"说明不只有实物；"四类"里支撑服务不直接被消费，却为另外三类托底。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>自然资源</th><th>自然环境的服务功能</th></tr></thead>
<tbody>
<tr><td>存在形态</td><td>物质与能量</td><td>过程与功能</td></tr>
<tr><td>典型例子</td><td>淡水、木材、矿产</td><td>洪水调蓄、净化空气、旅游审美</td></tr>
<tr><td>消费方式</td><td>可开采、可直接使用</td><td>多数在利用过程中被享受</td></tr>
<tr><td>受损表现</td><td>储量减少乃至枯竭</td><td>功能减弱，且恢复慢</td></tr>
<tr class="key"><td>两者关系</td><td>资源是供给服务的一部分</td><td>还包括调节、文化、支撑服务</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">这张表最容易背错的是把四类服务并列成清单：支撑服务不直接提供产品，却通过土壤形成、养分循环和初级生产维持另外三类。</p>
</section>

<p class="ex-t">例题<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">某湿地被围垦为农田，粮食产量明显增加，但当地洪涝加剧、水质下降，越冬鸟类数量减少。结合自然环境的服务功能，回答：（1）说明该湿地四类服务功能的变化；（2）分析服务功能之间此消彼长的原因；（3）提出兼顾粮食生产与生态保护的措施。</p>
<ol class="steps" id="gxSteps">
<li class="step"><p class="s-h">第 1 步 · 拆题：四类服务逐一对照</p><p class="s-b">题目问"变化"，就要写"改造前→改造后"，并把四类服务分开写。只写"生态环境变差"拿不到分。</p><p class="s-k">用到：服务功能的四类划分</p></li>
<li class="step" hidden><p class="s-h">第 2 步 · 供给服务：粮食增产不等于供给全面增加</p><p class="s-b">围垦后粮食供给上升，但湿地提供的淡水、水产、芦苇等产品减少，供给结构变得单一。</p><p class="s-k">用到：供给服务</p></li>
<li class="step" hidden><p class="s-h">第 3 步 · 调节服务：找"洪涝加剧"的证据</p><p class="s-b">湿地面积缩小，调蓄洪水、净化水质、调节气候的能力下降。洪涝加剧、水质下降正是调节服务退化的表现。</p><p class="s-k">用到：调节服务</p></li>
<li class="step" hidden><p class="s-h">第 4 步 · 文化服务与支撑服务：别漏掉基础</p><p class="s-b">鸟类栖息地破坏，观鸟、科研与教育价值下降，属文化服务；水文与土壤条件改变，养分循环、初级生产减弱，属支撑服务，而支撑服务是另外三类的基础。</p><p class="s-k">用到：文化服务、支撑服务</p></li>
<li class="step" hidden><p class="s-h">第 5 步 · 归因与措施：竞争同一份资源</p><p class="s-b">四类服务竞争同一块土地、同一份水与养分；围垦改变湿地水文与物质循环，供给上升以调节、文化、支撑下降为代价。措施分两条线：退耕还湿、保留生态水位与栖息地；提高单产、建设高标准农田、建立生态补偿。</p><p class="s-k">用到：服务之间的权衡</p></li>
</ol>
