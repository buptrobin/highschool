<p class="gx-lede">这一节把“全球大气怎么动”压成一条链：<b>三圈环流 → 七个气压带 → 六个风带 → 随季节整体平移</b>。考试真正拉分的地方不是背名字，而是给一个纬度、一个月份，判断它受谁控制、是干是湿。先记住两条主线：成因分热力与动力，位置随直射点南北移动。</p>

<!-- ================= A ================= -->
<section class="gx-sec" id="a">
  <h2><span class="sn">01</span>课本怎么说</h2>
  <p class="gx-h2s">先把“成因”和“位置”分开记，这是全节的两条主线。</p>

  <div class="gx-quote">
    <p class="q-t">课本表述 · 从单圈到三圈<span class="q-src">人教版（2019）选择性必修1 · 第三章第二节</span></p>
    <p class="q-b">假设地球表面均匀、不自转，赤道受热上升、极地冷却下沉，近地面形成单圈环流。考虑地转偏向力后，单圈环流被分裂为低纬、中纬、高纬三个环流圈。</p>
    <p class="q-n">→ 三个条件缺一不可：① 地表均匀 ② 考虑地转偏向力 ③ 太阳直射赤道。少一个，环流形态就变——季节移动就是“直射点不总在赤道”带来的。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本表述 · 七带六风与季节移动<span class="q-src">人教版（2019）选择性必修1 · 第三章第二节</span></p>
    <p class="q-b">全球近地面共有七个气压带和六个风带。赤道低压带与极地高压带由热力原因形成，副热带高压带与副极地低压带由动力原因形成。气压带和风带的位置随太阳直射点的移动而移动；就北半球而言，大致夏季北移、冬季南移。</p>
    <p class="q-n">→ 四个名字、两种成因：热力是“冷热不均直接导致”，动力是“气流在高空堆积或辐散、被迫下沉或上升”。移动的是位置，不是成因。</p>
  </div>

  <div style="overflow-x:auto">
  <table class="gx-cmp">
    <thead><tr><th>气压带</th><th>位置</th><th>成因</th><th>垂直气流</th><th>天气</th></tr></thead>
    <tbody>
      <tr><td>赤道低压带</td><td>0° 附近</td><td>热力：受热上升</td><td>上升</td><td>多对流雨</td></tr>
      <tr class="key"><td>副热带高压带</td><td>南北纬 30° 附近</td><td>动力：高空气流堆积下沉</td><td>下沉</td><td>干燥</td></tr>
      <tr><td>副极地低压带</td><td>南北纬 60° 附近</td><td>动力：冷暖气流相遇抬升</td><td>上升</td><td>多锋面雨</td></tr>
      <tr><td>极地高压带</td><td>南北纬 90° 附近</td><td>热力：冷却下沉</td><td>下沉</td><td>干冷</td></tr>
    </tbody>
  </table>
  </div>
  <p class="gx-note">这张表最容易背反的是副高：它是“动力”高压，不是“热力”高压；赤道低压才是“热力”低压。判断只看一句——气流是“被热起来的”，还是“被挤下来的”。</p>
</section>

      <p class="er-w">错在哪：把“低压”和“动力”绑定。低压有两种，赤道是<b>热</b>出来的，副极地才是冷暖气流相遇<b>抬</b>出来的。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 北半球信风是东南风。</p>
      <p class="er-v">✓ 北半球信风是东北风（来向东北）。</p>
      <p class="er-w">错在哪：只记“从副高吹向赤道”，忘了北半球右偏。南半球左偏，才是东南信风。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 气压带和风带常年固定在 0°、30°、60°。</p>
      <p class="er-v">✓ 位置随太阳直射点南北移动，幅度约 5°–10°。</p>
      <p class="er-w">错在哪：把“平均位置”当成“固定位置”。7 月副高中心约 38°N，1 月约 22°N。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 北半球夏季气压带风带南移。</p>
      <p class="er-v">✓ 北半球夏季北移、冬季南移。</p>
      <p class="er-w">错在哪：把“夏季”和“直射南半球”配错了。北半球夏季太阳直射北半球，带子跟着向北。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 风带只受水平气压梯度力影响，与地转偏向力无关。</p>
      <p class="er-v">✓ 风向由水平气压梯度力和地转偏向力共同决定。</p>
      <p class="er-w">错在哪：风一旦运动就受地转偏向力；没有它，信风、西风都不会有东西分量，也解释不了东北信风。</p>
    </div>
  </div>
</section>

<footer class="gx-foot">
  对应 人教版（2019）选择性必修1 第三章第二节「气压带和风带」 · 生成自 <code>eli5-high</code> skill<br>
  数据口径：位移公式 s = 8°·sin(2π(t−3)/12)，t = 月份−1（1 月 t=0，7 月 t=6），7 月 +8.0°、1 月 −8.0°，落在教材“约 5°–10°”的范围内；气压带色带宽度 8°、副高控制区“赤道侧 10°／极侧 6°”为示意判据。教材只给移动方向与幅度范围，未给正弦公式。
</footer>

<div class="gx-zoom" id="gxZoom" hidden>
  <span class="gx-zoom-tip">双指放大 · 左右滑动看全图</span>
  <button class="gx-zoom-x" type="button" aria-label="关闭">✕</button>

<script src="../../assets/gx.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var GX = window.GX, el = GX.el, tx = GX.tx, $ = GX.$;
  var stage = $("gxStage");
  if (!stage) return;

  var WIDE = { vb: "0 0 880 440", w: 880, h: 440, x0: 60, x1: 820, yTop: 95, yBot: 300,
               axis: 328, titleY: 32, subY: 52, titleFs: 13, subFs: 9, axisFs: 8.5,
               legFs: 8.5, legY: 414, legX: [60, 220, 390], obsLabY: 73 };
  var NARROW = { vb: "0 0 360 520", w: 360, h: 520, x0: 22, x1: 338, yTop: 120, yBot: 360,
                 axis: 388, titleY: 30, subY: 49, titleFs: 12, subFs: 8.2, axisFs: 7.2,
                 legFs: 7.5, legY: 496, legX: [22, 128, 248], obsLabY: 98 };
  var L = WIDE, month = 7, obsLat = 30, tmr = null;

  var BELTS = [
    { lat: -90, name: "极地高压", cause: "热力", kind: "H" },
    { lat: -60, name: "副极地低压", cause: "动力", kind: "L" },
    { lat: -30, name: "副热带高压", cause: "动力", kind: "H" },
    { lat: 0, name: "赤道低压", cause: "热力", kind: "L" },
    { lat: 30, name: "副热带高压", cause: "动力", kind: "H" },
    { lat: 60, name: "副极地低压", cause: "动力", kind: "L" },
    { lat: 90, name: "极地高压", cause: "热力", kind: "H" }
  ];
  var WINDS = [
    { from: -90, to: -60, name: "极地东风" },
    { from: -30, to: -60, name: "盛行西风" },
    { from: -30, to: 0, name: "东南信风" },
    { from: 30, to: 0, name: "东北信风" },
    { from: 30, to: 60, name: "盛行西风" },
    { from: 90, to: 60, name: "极地东风" }
  ];
  var TONE = {
    H: { fill: "#fdf3e3", stroke: "#d9b06a", text: "#8a5c14" },
    L: { fill: "#e8f6fb", stroke: "#8ec8dd", text: "#0b6580" }
  };

  function shift() {
    var t = month - 1;
    return 8 * Math.sin(2 * Math.PI * (t - 3) / 12);
  }
  function X(lat) { return L.x0 + (lat + 90) / 180 * (L.x1 - L.x0); }
  function fmt(v) { return (v >= 0 ? "+" : "-") + Math.abs(v).toFixed(1) + "°"; }

  function classify(lat) {
    var s = shift(), eq = s, sh = 30 + s, sl = 60 + s;
    if (Math.abs(lat - eq) <= 6) {
      return { name: "赤道低压带", tone: "L", state: "上升气流，多对流雨" };
    }
    if (lat - sh >= -10 && lat - sh <= 6) {
      return { name: "副热带高压带", tone: "H", state: "下沉气流，干燥" };
    }
    if (Math.abs(lat - sl) <= 6) {
      return { name: "副极地低压带", tone: "L", state: "冷暖气流相遇抬升，多锋面雨" };
    }
    if (lat > eq && lat < sh) {
      return { name: "东北信风带", tone: "W", state: "由副高吹向赤道，干燥" };
    }
    if (lat > sh && lat < sl) {
      return { name: "盛行西风带", tone: "W", state: "由副高吹向副极地低压，湿润" };
    }
    if (lat > sl) {
      return { name: "极地东风带", tone: "W", state: "由极地高压吹向副极地低压，干冷" };
    }
    return { name: "—", tone: "W", state: "—" };
  }

  function shortName(n) {
    return n.replace("副热带高压带", "副高").replace("赤道低压带", "赤道低压")
            .replace("副极地低压带", "副极地低压").replace("东北信风带", "东北信风")
            .replace("盛行西风带", "西风").replace("极地东风带", "极地东风");
  }

  function drawCard(name, sub, tone) {
    var col = tone === "H" ? "#8a5c14" : (tone === "L" ? "#0b6580" : "#1e6640");
    var bg = tone === "H" ? "#fdf3e3" : (tone === "L" ? "#e8f6fb" : "#e6f6ee");
    $("gxVs").textContent = name;
    $("gxVsn").textContent = obsLat + "°N 受" + shortName(name) + "控制，" + sub;
    $("gxVs").style.color = col;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
  }

  function draw() {
    var s = shift(), gA = $("gxA"), gB = $("gxB"), i;
    gA.textContent = ""; gB.textContent = "";
    var yMid = (L.yTop + L.yBot) / 2;
    var halfW = (L.x1 - L.x0) / 180 * 4;

    var defs = el("defs", {}, gA);
    var mk = el("marker", { id: "gxArr", viewBox: "0 0 10 10", refX: "8", refY: "5",
                            markerWidth: "5", markerHeight: "5", orient: "auto" }, defs);
    el("path", { d: "M0 0 10 5 0 10z", fill: "#2f8a5b" }, mk);

    el("rect", { x: 12, y: 12, width: L.w - 24, height: L.h - 24, rx: 12,
                 fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    tx(gA, 22, L.titleY, "七个气压带、六个风带随月份平移", "#151a21", "start", L.titleFs, 700);
    tx(gA, 22, L.subY, "虚线 = 观测纬度 · 箭头 = 风带（由高压吹向低压）", "#6b7280", "start", L.subFs, 400);

    for (i = -90; i <= 90; i += 30) {
      var gx = X(i);
      el("line", { x1: GX.n1(gx), y1: L.yTop, x2: GX.n1(gx), y2: L.yBot,
                   stroke: "#e3edf3", "stroke-dasharray": "3 5" }, gA);
      el("line", { x1: GX.n1(gx), y1: L.yBot, x2: GX.n1(gx), y2: L.yBot + 4,
                   stroke: "#b9cbd8" }, gA);
      tx(gA, gx, L.axis + 12, i === 0 ? "0°" : (Math.abs(i) + "°" + (i > 0 ? "N" : "S")),
         "#3a3a35", "middle", L.axisFs, 400);
    }

    for (i = 0; i < BELTS.length; i++) {
      var b = BELTS[i], t = TONE[b.kind];
      var lat = GX.clamp(b.lat + s, -90, 90), bx = X(lat);
      var x1 = GX.clamp(bx - halfW, L.x0, L.x1), x2 = GX.clamp(bx + halfW, L.x0, L.x1);
      el("rect", { x: GX.n1(x1), y: L.yTop, width: GX.n1(Math.max(2, x2 - x1)),
                   height: L.yBot - L.yTop, rx: 3, fill: t.fill, stroke: t.stroke }, gA);
      var cx = (x1 + x2) / 2;
      var lab = tx(gA, cx, yMid, b.name + "（" + b.cause + "）", t.text, "middle",
                   L.w > 500 ? 8 : 6.3, 600);
      lab.setAttribute("transform", "rotate(-90 " + GX.n1(cx) + " " + yMid + ")");
    }

    for (i = 0; i < WINDS.length; i++) {
      var w = WINDS[i];
      var fx = X(GX.clamp(w.from + s, -90, 90)), tx2 = X(GX.clamp(w.to + s, -90, 90));
      var dir = tx2 > fx ? 1 : -1;
      var sx = fx + dir * (halfW + 7), ex = tx2 - dir * (halfW + 7);
      if (Math.abs(ex - sx) < 9) continue;
      var wy = yMid + (L.w > 500 ? 14 : 34);
      el("path", { d: "M" + GX.n1(sx) + " " + wy + " L" + GX.n1(ex) + " " + wy,
                   stroke: "#2f8a5b", "stroke-width": 2, fill: "none",
                   "marker-end": "url(#gxArr)" }, gA);
      tx(gA, (sx + ex) / 2, L.w > 500 ? wy - 8 : wy + 12, w.name, "#1e6640", "middle",
         L.w > 500 ? 8.5 : 7.2, 600);
    }

    var ox = X(obsLat);
    el("line", { x1: GX.n1(ox), y1: L.yTop - 14, x2: GX.n1(ox), y2: L.yBot + 4,
                 stroke: "#b8791f", "stroke-width": 1.6, "stroke-dasharray": "4 4" }, gB);
    el("circle", { cx: GX.n1(ox), cy: L.yBot + 4, r: 4, fill: "#b8791f" }, gB);
    tx(gB, ox, L.obsLabY, obsLat + "°N 观测点", "#8a5c14", "middle",
       L.w > 500 ? 9.5 : 8.5, 700, true);

    var lx = L.legX;
    el("rect", { x: lx[0], y: L.legY - 8, width: 10, height: 10, rx: 2,
                 fill: "#fdf3e3", stroke: "#d9b06a" }, gA);
    tx(gA, lx[0] + 14, L.legY, "高压带（下沉）", "#3a3a35", "start", L.legFs, 400);
    el("rect", { x: lx[1], y: L.legY - 8, width: 10, height: 10, rx: 2,
                 fill: "#e8f6fb", stroke: "#8ec8dd" }, gA);
    tx(gA, lx[1] + 14, L.legY, "低压带（上升）", "#3a3a35", "start", L.legFs, 400);
    el("line", { x1: lx[2], y1: L.legY - 3, x2: lx[2] + 22, y2: L.legY - 3,
                 stroke: "#2f8a5b", "stroke-width": 2, "marker-end": "url(#gxArr)" }, gA);
    tx(gA, lx[2] + 28, L.legY, "风带→低压", "#3a3a35", "start", L.legFs, 400);

    $("gxVa").textContent = month + " 月";
    $("gxVb").textContent = fmt(s);
    var info = classify(obsLat);
    drawCard(info.name, info.state, info.tone);
  }

  function syncButtons() {
    var ids = [["gxP1", 10], ["gxP2", 30], ["gxP3", 60]];
    for (var i = 0; i < ids.length; i++) {
      var on = obsLat === ids[i][1], btn = $(ids[i][0]);
      btn.setAttribute("aria-pressed", on ? "true" : "false");
      btn.style.background = on ? "#e6f6ee" : "";
      btn.style.borderColor = on ? "#9ccdb2" : "";
      btn.style.color = on ? "#1e6640" : "";
    }
  }

  function applyLayout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? WIDE : NARROW;
    stage.setAttribute("viewBox", L.vb);
    draw();
  }

  $("gxSl").addEventListener("input", function () {
    month = +this.value;
    draw();
  });
  $("gxP1").addEventListener("click", function () { obsLat = 10; syncButtons(); draw(); });
  $("gxP2").addEventListener("click", function () { obsLat = 30; syncButtons(); draw(); });
  $("gxP3").addEventListener("click", function () { obsLat = 60; syncButtons(); draw(); });
  stage.addEventListener("keydown", function (ev) {
    if (ev.key === "ArrowLeft" || ev.key === "ArrowRight") {
      ev.preventDefault();
      month = GX.clamp(month + (ev.key === "ArrowRight" ? 1 : -1), 1, 12);
      $("gxSl").value = String(month);
      draw();
    }
  });
  window.addEventListener("resize", function () {
    clearTimeout(tmr);
    tmr = setTimeout(applyLayout, 180);
  });
  syncButtons();
  applyLayout();
});
</script>
