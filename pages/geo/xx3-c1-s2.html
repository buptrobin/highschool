<section class="gx-sec" id="a">
  <h2><span class="sn">01</span>课本怎么说</h2>
  <p class="gx-h2s">先背标准表述，再看它怎样被拆成判断题。</p>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 自然资源的含义<span class="q-src">人教版（2019）选择性必修3 · 第一章第二节</span></p>
    <p class="q-b">自然资源是指存在于自然界中、在现有技术条件下能够被人类利用的物质和能量。</p>
    <p class="q-n">→ 两个条件必须同时成立：<b>来源在自然界</b>，把小麦、钢铁、电力这类人类劳动产品排除；<b>技术上可利用</b>，把目前无法利用的岩石、海水中绝大部分元素排除。"可利用"的门槛由技术决定，所以资源的外延会随技术进步而扩大。</p>
  </div>

  <div style="overflow-x:auto">
  <table class="gx-cmp">
    <thead><tr><th>比什么</th><th>可再生资源</th><th>非可再生资源</th></tr></thead>
    <tbody>
      <tr><td>更新速度</td><td>能在人类时间尺度内自我更新</td><td>形成周期以百万年计，相对人类历史不更新</td></tr>
      <tr><td>典型例子</td><td>太阳能、水、生物、土地</td><td>金属与非金属矿产、煤炭石油天然气等化石能源</td></tr>
      <tr class="key"><td>用超的后果</td><td>存量跌破阈值，更新能力被破坏，退化为不可再生</td><td>直接枯竭，无替代来源</td></tr>
      <tr><td>利用底线</td><td>取用量 ≤ 再生量，且不破坏再生条件</td><td>提高效率、循环利用、寻找替代</td></tr>
    </tbody>
  </table>
  </div>
  <p class="gx-note">这张表的关键不在例子，在"更新"二字：可再生讲的是<b>速率</b>，不是总量。一条河每年补给的量有限，抽得更快，水位就年年下降。</p>

  <p class="gx-h2s">五个属性：判断"能不能用、怎么用、用了会怎样"</p>
  <div style="overflow-x:auto">
  <table class="gx-cmp">
    <thead><tr><th>属性</th><th>含义</th><th>常考落点</th></tr></thead>
    <tbody>
      <tr><td>有限性</td><td>总量或再生速率有上限</td><td>任何资源都不是无限的，包括可再生</td></tr>
      <tr><td>地域性</td><td>分布不均，有空间差异</td><td>解释运输、跨区域调配、进口依赖</td></tr>
      <tr><td>整体性</td><td>一个要素变化会牵动其他要素</td><td>森林砍伐影响水、土、生物</td></tr>
      <tr><td>多用性</td><td>同一资源有多种用途，用途间竞争</td><td>水用于农业、工业、生活、生态</td></tr>
      <tr><td>可变性</td><td>资源量与可利用性随技术、价格、需求变化</td><td>技术进步使"非资源"变成"资源"</td></tr>
    </tbody>
  </table>
  </div>
  <p class="gx-take">把定义和属性连起来读：定义回答"是不是"，属性回答"为什么不能随便用"。</p>
</section>

  <h2><span class="sn">04</span>一道题走一遍</h2>
  <p class="gx-h2s">先自己读题干想 30 秒，再点"下一步"。</p>

  <div class="gx-ex">

    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    $("gxSl").value = String(Math.round(S * 100));
    draw();
  }

  $("gxSl").addEventListener("input", function () { S = (+this.value) / 100; update(); });
  $("gxP1").addEventListener("click", function () { S = 0; update(); });
  $("gxP2").addEventListener("click", function () { S = 0.25; update(); });
  stage.addEventListener("keydown", function (ev) {
    if (ev.key === "ArrowLeft" || ev.key === "ArrowRight") {
      ev.preventDefault();
      S = GX.clamp(S + (ev.key === "ArrowRight" ? 0.01 : -0.01), 0, 0.3);
      update();
    }
  });
  update();
});
</script>
</body>
</html>
