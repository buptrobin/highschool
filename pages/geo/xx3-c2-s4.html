<section class="gx-sec" id="a">
  <h2><span class="sn">01</span>课本怎么说</h2>
  <p class="gx-h2s">先背标准表述，再看解释。</p>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 海洋空间资源<span class="q-src">人教版（2019）选择性必修3 · 第二章第四节</span></p>
    <p class="q-b">海洋空间资源是指与海洋开发利用有关的海岸带、海域、海岛、海底等空间及其承载的功能。海洋空间资源的开发方式包括港口与航运、围填海与人工岛、海洋渔业与养殖、海底油气与矿产、海洋旅游、海底光缆等。</p>
    <p class="q-n">→ 三个关键词：<b>立体</b>（不止水面）、<b>功能</b>（能干什么才算资源）、<b>权益</b>（归谁、谁能用）。</p>
  </div>

  <div style="overflow-x:auto">
  <table class="gx-cmp">
    <thead><tr><th>空间类型</th><th>范围</th><th>承载的功能</th><th>典型开发</th></tr></thead>
    <tbody>
      <tr><td>海岸带</td><td>海陆过渡带，含潮间带及邻近陆域与浅水</td><td>港口、城镇、滨海湿地、养殖、旅游</td><td>建港、围填海、海堤</td></tr>
      <tr><td>海域</td><td>领海、毗连区、专属经济区等的水面与水体</td><td>航运、捕捞、养殖、旅游、国防</td><td>航道、养殖区、海上游览</td></tr>
      <tr class="key"><td>海岛</td><td>四面环水的陆域及其周边海域</td><td>主权载体、海洋权益基点、渔业与旅游基地</td><td>海岛旅游、渔业基地、码头</td></tr>
      <tr><td>海底</td><td>海床与底土</td><td>油气、矿产、光缆、管道</td><td>钻井平台、海底光缆</td></tr>
    </tbody>
  </table>
  </div>
  <p class="gx-note">最容易背错的是<b>海岛</b>：它不是"一块地"，而是划设领海基线、主张专属经济区的依托。只写"面积"必丢分。</p>

  <div class="gx-ex">
    <p class="ex-t">例题<span class="bdg bdg-must">必考</span></p>
    <p class="ex-q">某海湾为建港区实施围填海 20 km²。此后湾内渔业产量下降，部分岸段海岸侵蚀加剧。分析：（1）说明该开发对海洋空间资源的影响；（2）分析其对国家安全的影响；（3）提出合理开发建议。</p>

    var press = 100 * Math.pow(S / 100, 1.5);
    gA.textContent = ""; gB.textContent = "";
    drawLeft(gA, L.L);
    drawRight(gB, L.R, prod, press);

    va.textContent = String(S);
    vb.textContent = prod.toFixed(1);
    vc.textContent = press.toFixed(0);

    var st, col, bg, sn;
    if (S < 35) { st = "保护为主"; col = "#3f6f92"; bg = "#eef6fb"; sn = "压力低，产值也低"; }
    else if (S <= 75) { st = "平衡"; col = "#1e6640"; bg = "#e6f6ee"; sn = "压力随强度加速上升"; }
    else { st = "超载"; col = "#b8402f"; bg = "#fbeae7"; sn = "压力近上限，边际收益变小"; }
    vs.textContent = st;
    vsn.textContent = sn;
    vs.style.color = col;
    vsn.style.color = col;
    stBox.style.background = bg;
    stBox.style.borderColor = col + "44";
    sl.value = String(S);
  }

  function applyLayout() {
    var w = stage.parentElement.getBoundingClientRect().width;
    L = w >= 640 ? WIDE : NARROW;
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  sl.addEventListener("input", function () { S = +this.value; render(); });
  $("gxP1").addEventListener("click", function () { S = 20; render(); });
  $("gxP2").addEventListener("click", function () { S = 55; render(); });
  $("gxP3").addEventListener("click", function () { S = 90; render(); });

  var tmr = null;
  window.addEventListener("resize", function () {
    clearTimeout(tmr); tmr = setTimeout(applyLayout, 180);
  });
  applyLayout();
});
</script>
</body>
</html>
