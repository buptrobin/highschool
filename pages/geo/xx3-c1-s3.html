  <h2><span class="sn">01</span>课本怎么说<span class="bdg bdg-must">必考</span></h2>

    <p class="q-t">课本原话 · 环境问题的含义<span class="q-src">人教版（2019）选择性必修3 · 第一章第三节</span></p>
    <p class="q-b">由于自然或人为原因，环境质量下降、生态平衡破坏，并对人类造成危害的现象，称为环境问题。</p>
    <p class="q-n">→ 拆成三截：<b>原因</b>（自然或人为）、<b>变化</b>（环境质量下降、生态平衡破坏）、<b>后果</b>（对人类造成危害）。少了“对人类造成危害”，那只是环境变化，不构成环境问题。</p>
  </div>

  <div style="overflow-x:auto">

      <tr><td>作用方式</td><td>排入环境的污染物与能量超过环境容量</td><td>索取资源的速度超过生态承载力</td></tr>
      <tr class="key"><td>共同本质</td><td colspan="2">人类活动超过环境容量或生态承载力，导致环境质量下降、生态平衡破坏</td></tr>
      <tr><td>典型后果</td><td>危害人体健康、影响农业生产</td><td>生态服务功能下降，加剧贫困与生态退化</td></tr>
    </tbody>
  </table>

    <p class="ex-q">某河流上游新建化工厂，投产后下游河段鱼虾绝迹，沿岸地下水出现异味；当地居民仍用河水灌溉农田。问：（1）指出该环境问题的主要类型；（2）分析其形成原因；（3）说明危害并提出治理措施。</p>
    <ol class="steps" id="gxSteps">
      <li class="step"><p class="s-h">第 1 步 · 先定性，不被现象带着走</p><p class="s-b">化工厂废水排入河流，属于水污染；鱼虾绝迹、地下水异味是后果，不是类型。若河岸植被同时被破坏，可叠加生态破坏，但主要类型应写“水污染（环境污染）”。</p><p class="s-k">用到：环境污染的类型与判断依据</p></li>
      <li class="step" hidden><p class="s-h">第 2 步 · 找源、找路径、找受体</p><p class="s-b">污染源是化工厂废水；路径是“河流→下渗→地下水”；受体是鱼虾、居民和农田。鱼虾绝迹提示溶解氧下降或毒性作用，地下水异味提示污染物已经下渗。</p><p class="s-k">用到：污染源—路径—受体</p></li>
      <li class="step" hidden><p class="s-h">第 3 步 · 原因分人为与自然</p><p class="s-b">人为：废水未处理或偷排、技术水平低、化工厂布局在河流上游、监管不足、片面追求经济增长。自然：河流流量小、自净能力有限，地下水更新慢，污染物容易累积。</p><p class="s-k">用到：成因四要素 + 自然背景</p></li>
      <li class="step" hidden><p class="s-h">第 4 步 · 危害按四类展开</p><p class="s-b">人体健康：饮水与异味带来健康风险；农业生产：污水灌溉影响农产品安全与产量；经济损失：渔业减产、治理费用上升；社会问题：饮水困难、跨区域纠纷。再补一句生态后果：生物多样性减少。</p><p class="s-k">用到：危害四类 + 累积性、滞后性、扩散性</p></li>
      <li class="step" hidden><p class="s-h">第 5 步 · 措施按“源头—过程—末端—管理”收口</p><p class="s-b">源头：清洁生产、废水处理达标、限期整改或搬迁；过程：在线监测、总量控制、河长制；末端：河道与地下水修复、寻找替代水源；管理：严格执法、流域协同、生态补偿。</p><p class="s-k">用到：环境问题的治理框架</p></li>
