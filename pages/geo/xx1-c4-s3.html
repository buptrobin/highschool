  <div class="gx-quote">
    <p class="q-t">课本原话 · 海—气相互作用<span class="q-src">人教版（2019）选择性必修1 · 第四章第三节</span></p>
    <p class="q-b">“海洋是大气最主要的热量和水汽来源。海洋与大气之间进行着物质和能量的交换，这种交换称为海—气相互作用。”</p>
    <p class="q-n">→ 抓住两个方向：海洋→大气，靠<b>蒸发</b>输送水汽和潜热；大气→海洋，靠<b>风应力</b>驱动洋流、靠<b>降水</b>把水送回海面。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">教材表述 · 沃克环流<span class="q-src">人教版（2019）选择性必修1 · 第四章第三节</span></p>
    <p class="q-b">正常年份，赤道太平洋西部（印尼—西太平洋暖池）海面温度高，空气受热上升；东部（秘鲁沿岸）海面温度低，空气冷却下沉。近地面空气由东向西运动，形成东南信风；高空空气由西向东回流，构成东西向的<b>沃克环流</b>。</p>
    <p class="q-n">→ 因果链要连着写：<b>海温</b>西暖东冷 → <b>气流</b>西升东沉 → <b>降水</b>西多东少。海温距平一变号，这条链的每一环都跟着变，答题时按“海温→气流→降水”顺序推，不要跳步。</p>
  </div>

    <p class="ex-t">例题<span class="bdg bdg-must">必考</span></p>
    <p class="ex-q">某年，赤道东太平洋海温距平达到 +1.5℃，秘鲁沿岸降水明显偏多，印度尼西亚出现严重干旱。判断该现象，说明沃克环流的变化，并分析其对秘鲁渔场和我国夏季风的可能影响。</p>
    <ol class="steps" id="gxSteps">

    drawLeft(gA); drawRight(gB);
    var st = stateOf(dT), strength = clamp(1 - 0.30 * dT, 0.1, 1.6), west = 2200 - 300 * dT;
    $("gxVd").textContent = (dT > 0 ? "+" : "") + dT.toFixed(1);
    $("gxVw").textContent = strength.toFixed(2);
    $("gxVp").textContent = String(Math.round(west));
    $("gxVs").textContent = st.name;
    $("gxVsn").textContent = st.note;
    $("gxStBox").style.background = st.bg;
    $("gxStBox").style.borderColor = st.col + "44";
    $("gxVs").style.color = st.col;
    $("gxSl").value = String(dT);
  }

  function applyLayout() {
    var w = stage.parentElement.getBoundingClientRect().width || 900;
    L = w >= 640 ? WIDE : NARROW;
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  $("gxSl").addEventListener("input", function () { dT = +this.value; render(); });
  $("gxP1").addEventListener("click", function () { dT = 0; render(); });
  $("gxP2").addEventListener("click", function () { dT = 1.5; render(); });
  $("gxP3").addEventListener("click", function () { dT = -1.5; render(); });
  stage.addEventListener("keydown", function (ev) {
    if (ev.key === "ArrowLeft" || ev.key === "ArrowRight") {
      ev.preventDefault();
      dT = clamp(Math.round((dT + (ev.key === "ArrowRight" ? 0.1 : -0.1)) * 10) / 10, -3, 3);
      render();
    }
  });
  var tmr = null;
  window.addEventListener("resize", function () {
    clearTimeout(tmr); tmr = setTimeout(applyLayout, 180);
  });
  applyLayout();
});
</script>
</body>
</html>
