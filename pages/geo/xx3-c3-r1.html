    <ol class="steps" id="gxSteps">
      <li class="step"><p class="s-h">第 1 步 · 先读结构</p><p class="s-b">四个数字排下来，第一眼是"一煤独大"：煤电 60%，低碳电源合计只有 40%（水 20 + 风 15 + 核 5）。结构问题先定性，不急着评价核电。</p><p class="s-k">用到：电源结构（装机占比）</p></li>

      <li class="step" hidden><p class="s-h">第 5 步 · 落判断</p><p class="s-b">答案不是"要"或"不要"，而是"在什么条件下、以什么节奏发展"。把四个条件写出来，判断才站得住。</p><p class="s-k">用到：环境安全与国家安全</p></li>

  }

  $("gxSl").addEventListener("input", function () { S = +this.value; render(); });
  $("gxP1").addEventListener("click", function () { S = 0; render(); });
  $("gxP2").addEventListener("click", function () { S = 30; render(); });
  $("gxP3").addEventListener("click", function () { S = 60; render(); });
  stage.addEventListener("keydown", function (ev) {
    if (ev.key === "ArrowLeft" || ev.key === "ArrowRight") {
      ev.preventDefault();
      S = GX.clamp(S + (ev.key === "ArrowRight" ? 1 : -1), 0, 60);
      render();
    }
  });
  var tmr = null;
  window.addEventListener("resize", function () {
    clearTimeout(tmr); tmr = setTimeout(applyLayout, 180);
  });
  applyLayout();
  render();
});
</script>
</body>
</html>
