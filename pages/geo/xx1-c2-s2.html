<section class="gx-sec" id="a">
  <h2><span class="sn">01</span>课本怎么说</h2>
  <p class="gx-h2s">四段标准表述：褶皱、判据、断层、地形倒置。</p>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 褶皱<span class="q-src">人教版（2019）选择性必修1 · 第二章第二节</span></p>
    <p class="q-b">岩层受到水平方向的挤压，发生弯曲变形，形成褶皱。背斜的岩层向上拱起，向斜的岩层向下弯曲。</p>
    <p class="q-n">→ 一个条件（水平挤压）、两种形态（上拱/下弯）。这里说的是"长相"，不是判据，判据在下一张卡。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 判据<span class="q-src">人教版（2019）选择性必修1 · 第二章第二节</span></p>
    <p class="q-b">背斜中心部分（核部）的岩层较老，两翼岩层较新；向斜中心部分的岩层较新，两翼岩层较老。</p>
    <p class="q-n">→ 一条新老关系定案：从核部向两翼，岩层由老变新就是背斜，由新变老就是向斜。这句话与"现在是不是山"完全无关。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 断层<span class="q-src">人教版（2019）选择性必修1 · 第二章第二节</span></p>
    <p class="q-b">岩层受力断裂，并沿断裂面发生明显位移，形成断层。</p>
    <p class="q-n">→ 两个条件缺一不可：① 岩层断裂；② 沿断裂面有明显位移。只有裂缝、没有位移，是节理，不是断层。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 地形倒置<span class="q-src">人教版（2019）选择性必修1 · 第二章第二节</span></p>
    <p class="q-b">背斜顶部受张力，岩层破碎，容易被侵蚀成谷地；向斜槽部受挤压，岩性坚实，不易被侵蚀，反而形成山岭。</p>
    <p class="q-n">→ 两条相反的因果链：背斜顶部→张力→岩层破碎→抗侵蚀弱→成谷；向斜槽部→挤压→岩性坚实→抗侵蚀强→成山。</p>
  </div>

  <div style="overflow-x:auto">
  <table class="gx-cmp">
    <thead><tr><th>比什么</th><th>背斜</th><th>向斜</th></tr></thead>
    <tbody>
      <tr><td>岩层形态</td><td>向上拱起</td><td>向下弯曲</td></tr>
      <tr class="key"><td>核部与两翼</td><td>核部老、两翼新（<b>唯一判据</b>）</td><td>核部新、两翼老</td></tr>
      <tr><td>未倒置时</td><td>常成山岭</td><td>常成谷地</td></tr>
      <tr><td>倒置以后</td><td>顶部张力破碎，成谷地</td><td>槽部岩性坚实，成山岭</td></tr>
      <tr><td>修隧道</td><td>宜选：拱形结构稳定，不易积水</td><td>不宜：向斜汇水，易积水</td></tr>
    </tbody>
  </table>
  </div>
  <p class="gx-note">这张表最容易背错的是第 2 行：判据是<b>岩层新老关系</b>，第 1 行的弯曲方向只是长相。剖面被侵蚀削平后，拱形可能已经看不出来，仍然能靠新老关系定案——③ 自己拖一下的模型就在演示这件事。</p>
</section>

      <p class="er-x">✗ 背斜一定成山，向斜一定成谷。</p>

      <p class="er-w">错在哪：把"未倒置"当成必然。背斜顶部张力破碎易成谷，向斜槽部岩性坚实可成山。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 岩层断了就是断层。</p>
      <p class="er-v">✓ 岩层断裂并沿断裂面发生明显位移，才是断层。</p>
      <p class="er-w">错在哪：漏掉"明显位移"这一条。只有裂缝、没有位移的是节理。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 地垒是中间下降的岩块，地堑是中间上升的岩块。</p>
      <p class="er-v">✓ 地垒中间岩块相对上升成山，地堑中间岩块相对下降成谷。</p>
      <p class="er-w">错在哪：两者说反。判断只看中间岩块相对两侧是升还是降：华山、庐山是地垒，渭河平原、汾河谷地是地堑。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 板块边界只会形成山脉。</p>
      <p class="er-v">✓ 生长边界形成海岭、裂谷；消亡边界形成海沟、岛弧、褶皱山脉。</p>
      <p class="er-w">错在哪：只记住消亡边界的一种产物，漏掉海岭、裂谷与海沟。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 喜马拉雅山位于板块生长边界。</p>
      <p class="er-v">✓ 喜马拉雅山位于印度洋板块与亚欧板块的消亡边界，是碰撞挤压形成的褶皱山脉。</p>
      <p class="er-w">错在哪：把碰撞带当成张裂带。生长边界是板块张裂，不会挤出高大山脉。</p>
    </div>
  </div>
  <p class="gx-note">六张卡里有四张都在问同一件事：<b>你用形态判断，还是用证据判断</b>。形态会变，证据不会。</p>
</section>

  对应 人教版（2019）选择性必修1 第二章第二节「构造地貌的形成」 · 生成自 <code>eli5-high</code> skill<br>
  数据口径：褶皱幅度 300 m、波长 6 km、单层厚 200 m 为示意值；侵蚀权重（背斜顶部 1.0、向斜槽部 0.2）是教学设定的相对抗侵蚀能力，不是实测值。页内海拔均为相对示意值，不对应真实地点；板块名称、边界类型与实例取自教材表述。

<div class="gx-zoom" id="gxZoom" hidden>
  <span class="gx-zoom-tip">双指放大 · 左右滑动看全图</span>

<script src="../../assets/gx.js"></script>
<script>
/* 互动：侵蚀深度 → 地形倒置（剖面示意模型） */
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var GX = window.GX, el = GX.el, tx = GX.tx, n1 = GX.n1, $ = GX.$;
  var stage = $("gxStage");
  if (!stage) return;

  var AMP = 300, TH0 = -Math.PI / 2, TH1 = 1.5 * Math.PI, THR = 2 * Math.PI;
  var BED = 200, NBED = 3, EMAX = 400, EMIN = -1000;
  var D = 0, REF = {}, L = null;

  var WIDE = {
    vb: "0 0 880 440", x0: 70, x1: 850, y0: 80, y1: 384,
    panel: [12, 12, 856, 416], tx0: 26, ty0: 36, tsz: 11.5, ts: "褶皱剖面 · 侵蚀深度 d 与地形倒置（示意）",
    leg: [512, 622, 724], legY: 54, legSz: 9,
    labY: 402, labY2: 418, br: 36,
    ticks: [300, -300, -600, -900]
  };
  var NARROW = {
    vb: "0 0 360 520", x0: 38, x1: 336, y0: 100, y1: 430,
    panel: [8, 8, 344, 504], tx0: 20, ty0: 30, tsz: 10.5, ts: "褶皱剖面 · 侵蚀深度 d",
    leg: [22, 132, 242], legY: 52, legSz: 8.5,
    labY: 452, labY2: 470, br: 26,
    ticks: []
  };

  function X(th) { return L.x0 + (th - TH0) / THR * (L.x1 - L.x0); }
  function Y(e) { return L.y0 + (EMAX - e) / (EMAX - EMIN) * (L.y1 - L.y0); }
  function wgt(th) { return 0.2 + 0.4 * (1 + Math.cos(th)); }
  function foldAt(th) { return AMP * Math.cos(th); }
  function surfAt(th, d) { return foldAt(th) - d * wgt(th); }
  function show(n, on) { n.style.display = on ? "" : "none"; }
  function curve(fn) {
    var pts = [], i, th, N = 120;
    for (i = 0; i <= N; i++) { th = TH0 + THR * i / N; pts.push([X(th), Y(fn(th))]); }
    return pts;
  }

  function build() {
    var gA = $("gxA"), gB = $("gxB"), i;
    gA.textContent = ""; gB.textContent = "";
    var defs = el("defs", {}, gA);
    REF.clip = el("path", { d: "" }, el("clipPath", { id: "gxclip" }, defs));

    el("rect", { x: L.panel[0], y: L.panel[1], width: L.panel[2], height: L.panel[3], rx: 10,
      fill: "#fbfdfe", stroke: "#dbe7ef" }, gA);

    REF.tickL = []; REF.tickT = [];
    for (i = 0; i < L.ticks.length; i++) {
      REF.tickL.push(el("path", { d: "", stroke: "#dbe3ea", "stroke-width": 1 }, gA));
      REF.tickT.push(tx(gB, X(TH0) - 8, 0, "", "#9aa5b1", "end", 8.5));
    }
    REF.zero = el("path", { d: "", stroke: "#dfe7ee", "stroke-width": 1, "stroke-dasharray": "4 4" }, gA);
    REF.zeroT = tx(gA, X(TH0) - 8, 0, "0 m", "#9aa5b1", "end", 8.5);

    REF.removed = el("path", { d: "", fill: "#f2f7fb" }, gA);

    var gs = el("g", { "clip-path": "url(#gxclip)" }, gA);
    REF.base = el("path", { d: "", fill: "#eef2f6" }, gs);
    var cols = ["#d9ecf5", "#efe4cf", "#b9c8d8"];
    REF.bed = []; REF.line = [];
    for (i = 0; i < NBED; i++) {
      REF.bed.push(el("path", { d: "", fill: "none", stroke: cols[i], "stroke-width": 12 }, gs));
      REF.line.push(el("path", { d: "", fill: "none", stroke: "#9fb3c4", "stroke-width": 0.9 }, gs));
    }

    REF.ghost = el("path", { d: "", fill: "none", stroke: "#aebbc8", "stroke-width": 1.3, "stroke-dasharray": "6 4" }, gA);
    REF.surf = el("path", { d: "", fill: "none", stroke: "#0891b2", "stroke-width": 2.6, "stroke-linejoin": "round" }, gA);
    REF.ax = [
      el("path", { d: "", stroke: "#dbe3ea", "stroke-width": 1, "stroke-dasharray": "4 4" }, gA),
      el("path", { d: "", stroke: "#dbe3ea", "stroke-width": 1, "stroke-dasharray": "4 4" }, gA)
    ];

    tx(gB, L.tx0, L.ty0, L.ts, "#151a21", "start", L.tsz, 700);
    var names = ["①上覆·新", "②中部", "③下伏·老"];
    for (i = 0; i < 3; i++) {
      el("rect", { x: L.leg[i], y: L.legY - 8, width: 11, height: 11, fill: cols[i], stroke: "#9fb3c4", "stroke-width": 0.8 }, gB);
      tx(gB, L.leg[i] + 15, L.legY + 1, names[i], "#3a3a35", "start", L.legSz);
    }

    REF.axN = [tx(gB, 0, L.labY, "背斜轴", "#3a3a35", "middle", 10.5, 700),
               tx(gB, 0, L.labY, "向斜轴", "#3a3a35", "middle", 10.5, 700)];
    REF.axV = [tx(gB, 0, L.labY2, "", "#0b6580", "middle", 10.5, 700),
               tx(gB, 0, L.labY2, "", "#0b6580", "middle", 10.5, 700)];
    REF.dot = el("circle", { cx: 0, cy: 0, r: 4.2, fill: "#b8791f", stroke: "#fff", "stroke-width": 1.6 }, gB);
    REF.dotT = tx(gB, 0, 0, "最高点", "#151a21", "start", 9.5, 700, true);

    REF.brLine = el("path", { d: "", stroke: "#b8791f", "stroke-width": 1.4 }, gB);
    REF.brCap = [el("path", { d: "", stroke: "#b8791f", "stroke-width": 1.4 }, gB),
                 el("path", { d: "", stroke: "#b8791f", "stroke-width": 1.4 }, gB)];
    REF.brT = tx(gB, 0, 0, "", "#8a5c14", "end", 9.5, 700, true);
    REF.ghostT = tx(gB, X(TH0) + 6, Y(0) - 8, "原始褶皱面", "#6b7280", "start", 9, 400, true);
  }

  function render() {
    var d = D, i, j, th, pts = [], fold = [], back = [], sp, pw, c;
    for (i = 0; i <= 120; i++) {
      th = TH0 + THR * i / 120;
      pts.push([X(th), Y(surfAt(th, d))]);
      fold.push([X(th), Y(foldAt(th))]);
    }
    for (i = pts.length - 1; i >= 0; i--) back.push(pts[i]);
    sp = GX.poly(pts);
    REF.surf.setAttribute("d", sp);
    REF.ghost.setAttribute("d", GX.poly(fold));
    REF.ghost.setAttribute("opacity", d < 20 ? 0 : 1);
    show(REF.ghostT, d >= 60);
    REF.clip.setAttribute("d", sp + " L " + n1(X(TH1)) + " " + n1(L.y1 + 2) + " L " + n1(X(TH0)) + " " + n1(L.y1 + 2) + " Z");
    REF.removed.setAttribute("d", GX.poly(fold.concat(back)) + " Z");

    pw = BED / (EMAX - EMIN) * (L.y1 - L.y0);
    REF.base.setAttribute("d", GX.poly(curve(function (t) { return foldAt(t) - NBED * BED; })) +
      " L " + n1(X(TH1)) + " " + n1(L.y1 + 2) + " L " + n1(X(TH0)) + " " + n1(L.y1 + 2) + " Z");
    for (j = 0; j < NBED; j++) {
      c = j * BED + BED / 2;
      REF.bed[j].setAttribute("stroke-width", n1(pw + 1));
      REF.bed[j].setAttribute("d", GX.poly(curve(function (t) { return foldAt(t) - c; })));
      REF.line[j].setAttribute("d", GX.poly(curve(function (t) { return foldAt(t) - j * BED; })));
    }

    REF.zero.setAttribute("d", "M " + n1(X(TH0)) + " " + n1(Y(0)) + " L " + n1(X(TH1)) + " " + n1(Y(0)));
    REF.zeroT.setAttribute("y", n1(Y(0) + 3));
    for (i = 0; i < L.ticks.length; i++) {
      REF.tickL[i].setAttribute("d", "M " + n1(X(TH0) - 5) + " " + n1(Y(L.ticks[i])) + " L " + n1(X(TH0)) + " " + n1(Y(L.ticks[i])));
      REF.tickT[i].setAttribute("y", n1(Y(L.ticks[i]) + 3));
      REF.tickT[i].textContent = (L.ticks[i] > 0 ? "+" : "") + L.ticks[i];
    }

    var cv = Math.round(surfAt(0, d)), tv = Math.round(surfAt(Math.PI, d));
    var relief = Math.abs(tv - cv), top = cv > tv ? "背斜" : (tv > cv ? "向斜" : "—");
    var xc = X(0), xt = X(Math.PI);

    REF.axN[0].setAttribute("x", n1(xc)); REF.axN[1].setAttribute("x", n1(xt));
    REF.axV[0].setAttribute("x", n1(xc)); REF.axV[1].setAttribute("x", n1(xt));
    REF.axV[0].textContent = (cv > 0 ? "+" : "") + cv + " m";
    REF.axV[1].textContent = (tv > 0 ? "+" : "") + tv + " m";
    REF.ax[0].setAttribute("d", "M " + n1(xc) + " " + n1(L.y1) + " L " + n1(xc) + " " + n1(L.y1 + 5));
    REF.ax[1].setAttribute("d", "M " + n1(xt) + " " + n1(L.y1) + " L " + n1(xt) + " " + n1(L.y1 + 5));

    var hx = cv > tv ? xc : xt;
    show(REF.dot, relief > 80); show(REF.dotT, relief > 80);
    REF.dot.setAttribute("cx", n1(hx));
    REF.dot.setAttribute("cy", n1(Y(Math.max(cv, tv))));
    REF.dotT.setAttribute("x", n1(hx + 9));
    REF.dotT.setAttribute("y", n1(Y(Math.max(cv, tv)) - 8));

    var bx = xc - L.br, yt = Y(foldAt(0)), yb = Y(surfAt(0, d));
    show(REF.brLine, d >= 20); show(REF.brT, d >= 20);
    show(REF.brCap[0], d >= 20); show(REF.brCap[1], d >= 20);
    REF.brLine.setAttribute("d", "M " + n1(bx) + " " + n1(yt) + " L " + n1(bx) + " " + n1(yb));
    REF.brCap[0].setAttribute("d", "M " + n1(bx - 5) + " " + n1(yt) + " L " + n1(bx + 5) + " " + n1(yt));
    REF.brCap[1].setAttribute("d", "M " + n1(bx - 5) + " " + n1(yb) + " L " + n1(bx + 5) + " " + n1(yb));
    REF.brT.setAttribute("x", n1(bx - 6));
    REF.brT.setAttribute("y", n1((yt + yb) / 2 + 3));
    REF.brT.textContent = "d = " + d + " m";

    var st, col, bg, sub;
    if (relief <= 80) {
      st = "已被夷平"; col = "#6b7280"; bg = "#f4f6f8"; sub = "起伏不超过 80 m，两轴几乎等高";
    } else if (cv > tv) {
      st = "正常褶皱"; col = "#0b6580"; bg = "#eef6fb"; sub = "背斜成山 · 向斜成谷";
    } else {
      st = "地形倒置"; col = "#8a5c14"; bg = "#fdf3e3"; sub = "背斜成谷 · 向斜成山";
    }
    REF.surf.setAttribute("stroke", relief <= 80 ? "#6b7280" : (cv > tv ? "#0891b2" : "#b8791f"));
    REF.dot.setAttribute("fill", col);

    $("gxVa").textContent = d + " m";
    $("gxVb").textContent = top;
    $("gxVbs").textContent = "地表起伏 " + relief + " m";
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sub;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    $("gxSl").value = String(d);
  }

  function applyLayout() {
    var box = stage.parentElement.getBoundingClientRect().width;
    L = box >= 640 ? WIDE : NARROW;
    stage.setAttribute("viewBox", L.vb);
    build();
    render();
  }

  $("gxSl").addEventListener("input", function () { D = +this.value; render(); });
  $("gxP1").addEventListener("click", function () { D = 0; render(); });
  $("gxP2").addEventListener("click", function () { D = 900; render(); });
  stage.addEventListener("keydown", function (ev) {
    if (ev.key === "ArrowLeft" || ev.key === "ArrowRight") {
      ev.preventDefault();
      D = GX.clamp(D + (ev.key === "ArrowRight" ? 10 : -10), 0, 1200);
      render();
    }
  });
  var tmr = null;
  window.addEventListener("resize", function () {
    clearTimeout(tmr); tmr = setTimeout(applyLayout, 180);
  });
  applyLayout();
});
</script>
