<!-- ================= A ================= -->
<section class="gx-sec" id="a">
  <h2><span class="sn">01</span>课本怎么说</h2>
  <p class="gx-h2s">先背标准表述，再看解释。顺序反了，答题时就写不出术语。</p>

  <div class="gx-quote">
    <p class="q-t">课本要点 · 服务业及其分类<span class="q-src">人教版（2019）必修第二册 · 第三章第三节</span></p>
    <p class="q-b">服务业是指利用设备、工具、场所、信息或技能等，为社会生产和居民生活提供服务的行业。按服务对象可分为生产性服务业、生活性服务业和公共服务业。</p>
    <p class="q-n">→ 定义里两个关键词：<b>"提供服务"</b>（不生产实物）、<b>"社会生产 + 居民生活"</b>（两类对象）。
    分类是 <b>3 类</b>，这是答"分类"题的第一句；只写"第三产业"等于没分类。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本要点 · 服务业的区位因素<span class="q-src">人教版（2019）必修第二册 · 第三章第三节</span></p>
    <p class="q-b">影响服务业区位选择的因素主要有市场、交通运输、劳动力、政策、技术以及地价等。</p>
    <p class="q-n">→ 常考 <b>6 个</b>，<b>市场排第一</b>。服务业卖的是"人到店"或"货到人"，
    所以人口密度、消费能力、可达性是核心；<b>地价</b>决定"付不付得起租金"，
    这也是便利店开在街角、大商场才敢进市中心的原因。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本要点 · 门槛人口与服务范围<span class="q-src">人教版（2019）必修第二册 · 第三章第三节</span></p>
    <p class="q-b">门槛人口是指维持一家服务企业正常经营所需的最低顾客数量；服务范围是指顾客愿意到该企业消费的最大距离。</p>
    <p class="q-n">→ 两个概念是一对：<b>门槛人口决定"能不能活"，服务范围决定"能辐射多远"</b>。
    门槛低 → 店多、范围小（便利店）；门槛高 → 店少、范围大（大型商场、影院）。
    两者是一对，一个变了另一个跟着变。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本要点 · 服务业区位的变化<span class="q-src">人教版（2019）必修第二册 · 第三章第三节</span></p>
    <p class="q-b">随着电子商务、现代物流和信息技术的发展，服务业的区位选择更加灵活，市场范围不断扩大，对交通、信息和人才的要求提高。</p>
    <p class="q-n">→ "更灵活"不等于"<b>不需要区位</b>"：门店从"临街"变成"<b>仓配</b>"，
    市场从 3 km 变成全国，但<b>交通枢纽、地价、网络</b>一样都不能少。变化的是"靠什么活"，不是"不用选地方"。</p>
  </div>

  <p class="gx-h2s" style="margin-top:18px">三类服务业，先分清"它靠谁吃饭"：</p>
  <div style="overflow-x:auto">
  <table class="gx-cmp">
    <thead><tr><th>类型</th><th>服务对象</th><th>典型行业</th><th>区位关键词</th></tr></thead>
    <tbody>
      <tr><td>生产性服务业</td><td>企业和生产活动</td><td>物流、金融、商务、设计、法律</td><td>产业园区、交通枢纽、中心商务区</td></tr>
      <tr class="key"><td>生活性服务业</td><td>居民日常生活</td><td>零售、餐饮、住宿、旅游、家政</td><td>居民区、商业街、人流量、可达性</td></tr>
      <tr><td>公共服务业</td><td>全体居民</td><td>教育、医疗、文化、体育、政务</td><td>政府主导、均衡布局、兼顾公平</td></tr>
    </tbody>
  </table>
  </div>
  <p class="gx-note">分类的真正用途是<b>判断主导因素</b>：生活性看市场，生产性看交通和信息，
  公共性看政策和公平。先分类，再答区位，答案才不会跑偏。</p>
</section>

        <p class="s-b">它<b>门槛人口高</b>，要覆盖全城甚至周边，所以选在<b>人口密集、消费能力强</b>的地方；

<script>
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var sl = document.getElementById("svcSl");
  if (!sl) return;

  var X0 = 44, X1 = 214, TMIN = 2000, TMAX = 50000;
  var Y0 = 250, YTOP = 64, RMAX = 3;
  var CX = 320, CY = 160, PXKM = 34;

  function xOf(t) { return X0 + (t - TMIN) / (TMAX - TMIN) * (X1 - X0); }
  function yOf(r) { return Y0 - r / RMAX * (Y0 - YTOP); }
  function nOf(t) { return Math.max(1, Math.floor(1000000 / t)); }
  function rOf(t) { return Math.sqrt(500 / (Math.PI * nOf(t))); }

  var curve = document.getElementById("svcCurve");
  var marker = document.getElementById("svcMark");
  var dot = document.getElementById("svcDot");
  var circle = document.getElementById("svcCircle");
  var rad = document.getElementById("svcRad");
  var read = document.getElementById("svcRead");
  var slv = document.getElementById("svcSlv");
  var v1 = document.getElementById("svcV1");
  var v2 = document.getElementById("svcV2");
  var v3 = document.getElementById("svcV3");
  var w3 = document.getElementById("svcW3");

  var d = "", t;
  for (t = TMIN; t <= TMAX; t += 250) {
    d += (t === TMIN ? "M " : " L ") + xOf(t).toFixed(1) + " " + yOf(rOf(t)).toFixed(1);
  }
  curve.setAttribute("d", d);

  function render() {
    var T = parseFloat(sl.value);
    if (!isFinite(T)) T = 10000;
    var n = nOf(T);
    var r = rOf(T);
    var px = xOf(T);

    marker.setAttribute("x1", px.toFixed(1));
    marker.setAttribute("x2", px.toFixed(1));
    dot.setAttribute("cx", px.toFixed(1));
    dot.setAttribute("cy", yOf(r).toFixed(1));
    var cr = Math.max(8, r * PXKM);
    circle.setAttribute("r", cr.toFixed(1));
    rad.setAttribute("x2", (CX + cr).toFixed(1));
    rad.setAttribute("y2", CY);

    read.textContent = "T = " + T + " 人 → " + n + " 个网点";
    slv.textContent = T + " 人";
    v1.textContent = T + " 人";
    v2.textContent = n + " 个";

    var label, sub;
    if (T <= 5000) { label = "社区级"; sub = "步行可达"; }
    else if (T <= 15000) { label = "街坊级"; sub = "步行可达"; }
    else if (T <= 30000) { label = "片区级"; sub = "骑车或公交可达"; }
    else { label = "城市级"; sub = "需开车前往"; }
    v3.textContent = label + " · " + r.toFixed(2) + " km";
    w3.textContent = sub + " · 平均服务半径";
  }

  sl.addEventListener("input", render);
  render();
});
</script>
