  <h2><span class="sn">01</span>课本怎么说</h2>
  <p class="gx-h2s">先背标准表述，再看解释。</p>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 陆地水体<span class="q-src">人教版（2019）选择性必修1 · 第四章第一节</span></p>
    <p class="q-b">陆地水体包括河流、湖泊、沼泽、冰川、地下水等。陆地水体水量只占全球水量的很小一部分，却与人类生产生活的关系最为密切。</p>
    <p class="q-n">→ 翻成人话：占比小 ≠ 作用小。人类取用的淡水几乎全部来自陆地水体；其中冰川是陆地淡水的主体，河流水更新最快。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 河流的补给<span class="q-src">同上</span></p>
    <p class="q-b">河流的补给类型主要有雨水补给、冰雪融水补给、湖泊水补给和地下水补给。汛期河流水位高于潜水位，河水补给地下水；枯水期河流水位低于潜水位，地下水补给河流。</p>
    <p class="q-n">→ 翻成人话：四类补给不是并列背诵，而是各有主导变量——雨水看降水，冰雪融水看气温，湖泊水与地下水看水位差。</p>
  </div>

      if (idx < items.length) {
        items[idx].hidden = false;
        idx++;
        $("gxCnt").textContent = idx + " / " + items.length;
        if (idx === items.length) {
          $("gxAns").hidden = false;
          this.textContent = "已展开全部";
          this.disabled = true;
        }
      }
    });
  }
});
</script>
</body>
</html>
