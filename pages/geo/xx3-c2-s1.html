<section class="gx-sec" id="a">
  <h2><span class="sn">01</span>课本怎么说<span class="bdg bdg-must">必考</span></h2>
  <p class="gx-h2s">先背标准表述，再看它拆成哪几个条件。</p>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 资源安全<span class="q-src">人教版（2019）选择性必修3 · 第二章第一节</span></p>
    <p class="q-b">资源安全是指一个国家或地区可以持续、稳定、及时、足量和经济地获取所需自然资源的状态，以及保障这一状态的能力。</p>
    <p class="q-n">→ 两个落点：一是"状态"（现在拿得到），二是"能力"（以后也拿得到）。五个状语——持续、稳定、及时、足量、经济——就是五把尺子，缺一把都不算安全。</p>
  </div>

  <div style="overflow-x:auto">
  <table class="gx-cmp">
    <thead><tr><th>尺子</th><th>问的是什么</th><th>不安全的表现</th></tr></thead>
    <tbody>
      <tr><td>持续</td><td>长期有没有接续供给</td><td>资源枯竭、无接替来源</td></tr>
      <tr><td>稳定</td><td>供应会不会大起大落</td><td>价格暴涨暴跌、突然断供</td></tr>
      <tr><td>及时</td><td>需要时能不能马上到位</td><td>运输受阻、储备不足</td></tr>
      <tr><td>足量</td><td>数量能不能满足需求</td><td>缺口只能靠进口、限量供应</td></tr>
      <tr class="key"><td>经济</td><td>拿得到，是否买得起</td><td>成本过高、企业亏损、民生承压</td></tr>
    </tbody>
  </table>
  </div>
  <p class="gx-note">五个词并列，答题逐条对照，比只写"资源不足"完整。资源安全是国家安全的重要基础。</p>

  <div class="gx-ex">
    <p class="ex-t">例题 · 石油供应风险<span class="bdg bdg-must">必考</span></p>
    <p class="ex-q">某国一年消费石油 5 亿吨，国内自产 1.5 亿吨，其余靠进口；进口来源前三位的国家合计占进口量的 70%。该国战略石油储备约可用 30 天。<br>（1）计算该国石油对外依存度，并判断供应风险高低。（2）分析影响该国资源安全的主要因素。（3）提出保障该国资源安全的措施。</p>
    <ol class="steps" id="gxSteps">
      <li class="step">
        <p class="s-h">第 1 步 · 先算缺口</p>
        <p class="s-b">消费 5 亿吨，自产 1.5 亿吨，缺口 = 5 − 1.5 = 3.5 亿吨，必须靠进口。先只做减法，别急着下结论。</p>
        <p class="s-k">用到：供需矛盾</p>
      </li>
      <li class="step" hidden>
