<p class="gx-claim">定义里藏着一条时间门槛：<b>长期或永久</b>改变居住地，才叫人口迁移。</p>
<div class="gx-meta">
  <span><i></i>人教版必修第二册 第一章第二节</span>

最容易丢分的是把“人口流动”写成“人口迁移”——去外地开三天会、出差两个月，都只算<b>流动</b>。

<!-- ================= A ================= -->
<section class="gx-sec" id="a">
  <h2><span class="sn">01</span>课本怎么说</h2>
  <p class="gx-h2s">先背标准表述，再看解释。顺序反了，答题时就写不出术语。</p>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 人口迁移<span class="q-src">人教版（2019）必修第二册 · 第一章第二节</span></p>
    <p class="q-b">人口迁移是人口在两个地区之间的空间移动，这种移动通常涉及人口居住地由迁出地到迁入地的永久性或长期性的改变。</p>
    <p class="q-n">→ 定义里有<b>三个条件</b>，缺一条就不是迁移：
    ① <b>跨地区</b>（换了个地方，不是同城搬家）；② <b>居住地改变</b>（常住地跟着搬）；
    ③ <b>长期或永久</b>。前两条好判断，丢分全在第三条——所以判断第一步永远是<b>看时间</b>。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本要点 · 人口迁移的分类<span class="q-src">人教版（2019）必修第二册 · 第一章第二节</span></p>
    <p class="q-b">按是否跨越国界，人口迁移分为国际人口迁移和国内人口迁移；按迁移的时间长短，分为永久性迁移和暂时性迁移；按迁移的意愿，分为自愿迁移和被迫迁移。</p>
    <p class="q-n">→ 分类是<b>三组轴</b>：<b>国界</b>（国际／国内）、<b>时间</b>（永久／暂时）、<b>意愿</b>（自愿／被迫）。
    考试常把三组轴混着问：“叙利亚难民涌向欧洲属于哪一类？”标准答法是三句话都写：
    <b>国际迁移 + 被迫迁移 + 相对长期</b>。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本要点 · 影响人口迁移的因素<span class="q-src">人教版（2019）必修第二册 · 第一章第二节</span></p>
    <p class="q-b">影响人口迁移的因素包括经济因素、政治因素、社会文化因素和生态环境因素。迁出地的推力与迁入地的拉力共同作用，决定了人口迁移的方向和规模。</p>
    <p class="q-n">→ 这一句要拆成<b>两栏 × 四类</b>：<b>推力</b>（老家推你走：收入低、地少、灾害）和
    <b>拉力</b>（城市拉你来：工资高、机会多、学校医院好），每一栏再分
    <b>经济、政治、社会文化、生态环境</b>四类。只写“经济发达”，等于只写了八格中的一格。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本要点 · 人口迁移的时空特点<span class="q-src">人教版（2019）必修第二册 · 第一章第二节</span></p>
    <p class="q-b">19 世纪以前，人口迁移的主流是从旧大陆流向新大陆；第二次世界大战以后，人口迁移的主流是从发展中国家流向发达国家。我国国内人口迁移的方向，主要表现为从农村到城市、从内陆到沿海。</p>
    <p class="q-n">→ 两条时间线要背准：<b>二战前：旧大陆 → 新大陆</b>（欧洲、非洲、亚洲 → 美洲、大洋洲）；
    <b>二战后：发展中国家 → 发达国家</b>。国内那条线是<b>农村→城市、内陆→沿海</b>，
    1978 年以后规模最大，主体就是<b>农民工</b>。</p>
  </div>

  <p class="gx-h2s" style="margin-top:18px">迁移和流动，差在一个“搬”字上：</p>
  <div style="overflow-x:auto">
  <table class="gx-cmp">
    <thead><tr><th>比什么</th><th>人口迁移</th><th>人口流动</th></tr></thead>
    <tbody>
      <tr><td>居住地</td><td>迁出地 → 迁入地，<b>常住地跟着改</b></td><td>常住地不变，人去人回</td></tr>
      <tr class="key"><td>时间</td><td><b>长期或永久</b>（考试按“长期居住”理解）</td><td>短期、季节性、往返性</td></tr>
      <tr><td>例子</td><td>四川农民到广东进厂并落户、定居</td><td>出差、旅游、探亲、开会、通勤</td></tr>
      <tr><td>统计口径</td><td>看“常住地是否改变”</td><td>2020 年七普把“人户分离、离开户口登记地半年以上”计入<b>流动人口</b></td></tr>
    </tbody>
  </table>
  </div>
  <p class="gx-note">这张表只高亮了一行：<b>真正的分界线是时间</b>。所以答题时先写“该人口移动<u>长期改变了居住地</u>”，
  再写其他特征，判据就站得住。注意：<b>农民工进城打工，多数在统计上被计入“流动人口”</b>，
  但在人文地理分析里常被当作迁移现象研究——两套口径不同，别混着说。</p>
</section>

        <text class="mh" x="54" y="50" text-anchor="middle" fill="#b8402f">✗ 流动</text>
        <text class="mh" x="196" y="50" text-anchor="middle" fill="#1e6640">✓ 迁移</text>

    <div class="qac">
      <p class="q">「人口迁移和人口流动，到底差在哪？」</p>
      <p class="a">差在一个“<b>搬</b>”字：迁移是<b>常住地搬到别处</b>（长期或永久），
      流动是<b>人去了又回来</b>（短期、季节、往返）。所以“农民工进城打工”在统计上常归入<b>流动人口</b>，
      但在人文地理分析里被当作迁移现象研究——<b>两套口径，别混着答</b>。</p>
      <svg viewBox="0 0 240 132" role="img" aria-label="迁移是单向搬走，流动是往返">

    <div class="qac">
      <p class="q">「人口迁入，对迁入地就只有好处吗？」</p>
      <p class="a"><b>不是。</b>迁入地拿到的是<b>劳动力和消费</b>，付出的是<b>住房、交通、公共服务</b>的压力。
      所以标准答案必须写两面：<b>利</b>是补充劳动力、扩大消费；<b>弊</b>是住房紧张、交通拥堵、
      教育医疗压力大、社会融合难。</p>
      <svg viewBox="0 0 240 132" role="img" aria-label="迁入地同时得到劳动力和承受公共设施压力">

        <text class="ms" x="68" y="64" text-anchor="middle">劳动力</text>

    <div class="qac">

      <p class="a"><b>不是，这是最容易漏的一格。</b>好处有三条：<b>缓解人地矛盾</b>（人少了，地和水都不那么紧张）、
      <b>汇款回流</b>（务工收入寄回家里）、<b>带回技术与观念</b>（有人返乡创业）。
      坏处是青壮年流失、耕地撂荒、留守老人儿童。</p>
      <svg viewBox="0 0 240 132" role="img" aria-label="迁出地既缓解人地矛盾也流失青壮年">
        <rect x="18" y="24" width="204" height="30" rx="5" fill="#e6f6ee" stroke="#bfe0cd"/>
        <text class="ms" x="120" y="44" text-anchor="middle" fill="#1e6640">✓ 缓解人地矛盾 · 汇款回流</text>
        <rect x="18" y="64" width="204" height="30" rx="5" fill="#fdf3e0" stroke="#f0dcb4"/>
        <text class="ms" x="120" y="84" text-anchor="middle" fill="#8a5c14">✓ 带回技术 · 返乡创业</text>
        <rect x="18" y="104" width="204" height="22" rx="5" fill="#fbeae7" stroke="#f0cbc4"/>
        <text class="ms" x="120" y="119" text-anchor="middle" fill="#8f3226">✗ 青壮年流失 · 土地撂荒</text>
      </svg>
    </div>

    <div class="qac">
      <p class="q">「国际迁移的方向，一直是“发达国家 → 发展中国家”吗？」</p>
      <p class="a"><b>正好相反。</b>二战<b>以后</b>的主流方向是<b>发展中国家 → 发达国家</b>：
      亚非拉人口增长快、就业不足，而西欧、北美、海湾国家缺劳动力。
      二战<b>以前</b>才是旧大陆（欧洲为主）→ 新大陆（美洲、大洋洲）。<b>方向随时代翻转，原因都是经济差距。</b></p>
      <svg viewBox="0 0 240 132" role="img" aria-label="二战前后国际迁移方向相反">

        <text class="ms" x="204" y="46" text-anchor="end" fill="#0b6580">新大陆</text>
        <text class="ms" x="20" y="76" fill="#5a6472">二战后</text>
        <line x1="196" y1="92" x2="76" y2="92" stroke="#b8791f" stroke-width="1.8"/>
        <text class="ms" x="60" y="96" text-anchor="end" fill="#8a5c14">发达</text>
        <text class="ms" x="204" y="96" text-anchor="end">发展中</text>
        <text class="ms" x="120" y="124" text-anchor="middle">箭头掉头，原因没变：往收入高的地方走</text>
      </svg>
    </div>

  </div>
  <p class="gx-note">这六问其实是同一句话：<b>先看时间（是不是迁移），再看两端（推力和拉力），最后看后果（利弊两面）</b>。
  所有关于人口迁移的判断，第一步都是<b>“常住地有没有长期改变”</b>。</p>

<script>
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var stage = document.getElementById("migStage");
  if (!stage) return;

  var sp = document.getElementById("migPush");
  var sl = document.getElementById("migPull");
  var bar = document.getElementById("migBar");
  var arrow = document.getElementById("migArrow");
  var v1 = document.getElementById("migV1");
  var v2 = document.getElementById("migV2");
  var v3 = document.getElementById("migV3");
  var why = document.getElementById("migWhy");
  var pushT = document.getElementById("migPushT");
  var pullT = document.getElementById("migPullT");
  var nt = document.getElementById("migNT");
  var flowTxt = document.getElementById("migFlowTxt");

  var ZERO = 210, UNIT = 16;   // 横条：零点在 210，每 1 个单位 16px

  function fmt(n) { return n > 0 ? "+" + n : String(n); }

  function render() {
    var p = +sp.value, l = +sl.value, N = l - p;

    pushT.textContent = "推力 push = " + p;
    pullT.textContent = "拉力 pull = " + l;
    nt.textContent = "净迁移倾向 N = " + fmt(N);
    v1.textContent = p + " / " + l;
    v2.textContent = fmt(N);

    var w = Math.abs(N) * UNIT;
    bar.setAttribute("x", N >= 0 ? ZERO : ZERO - w);
    bar.setAttribute("width", w);
    bar.setAttribute("opacity", N === 0 ? "0" : "1");

    var state, color, wtext, bcolor;
    if (N >= 3) {
      state = "净迁入"; color = "#1e6640"; bcolor = "#0891b2";
      wtext = "拉力明显更强，人口从老家流向城市";
    } else if (N <= -3) {
      state = "净迁出"; color = "#b8402f"; bcolor = "#b8791f";
      wtext = "推力更大，人口离开城市（返乡或流向别处）";
    } else {
      state = "大致平衡"; color = "#8a5c14"; bcolor = "#9aa3ae";
      wtext = "推拉接近，人流方向不明显，要看中间障碍（户籍、路费、家庭）";
    }
    v3.textContent = state;
    v3.style.color = color;
    why.textContent = wtext;
    bar.setAttribute("fill", bcolor);

    // N 变号，箭头掉头：N<0 表示净流出，箭头由迁入地指回迁出地
    if (N < 0) {
      arrow.setAttribute("y1", "146");
      arrow.setAttribute("y2", "106");
    } else {
      arrow.setAttribute("y1", "106");
      arrow.setAttribute("y2", "146");
    }
    arrow.setAttribute("opacity", N === 0 ? "0.3" : "1");
    flowTxt.textContent = N > 0 ? "人口流向" : (N < 0 ? "回流方向" : "流向不定");
  }

  sp.addEventListener("input", render);
  sl.addEventListener("input", render);
  render();
});
</script>
