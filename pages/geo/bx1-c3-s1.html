<p class="gx-claim">水循环不是"水在转圈"，而是<b>太阳在往上抽、重力在往下放</b>的一部永动机。</p>
<div class="gx-meta">
  <span><i></i>人教版必修第一册 第三章第一节</span>
  <span><i></i>高一 · 地球上的水</span>
  <span><i></i>阅读 12 分钟</span>
  <span><i></i>含 1 个互动模型</span>
</div>
<p class="gx-lede">这一节只讲一件事：<b>水从海里出去、再从陆地上回来</b>。六个环节、三种循环、四条意义，全部挂在这条链上。
考试真正考的不是背环节名，而是<b>改一个环节，别的环节会怎么变</b>——比如城市铺满水泥，为什么一下雨就内涝。</p>

<!-- ================= A ================= -->
<section class="gx-sec" id="a">
  <h2><span class="sn">01</span>课本怎么说</h2>
  <p class="gx-h2s">先背标准表述，再看解释。顺序反了，答题时就写不出术语。</p>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 定义<span class="q-src">人教版（2019）必修第一册 · 第三章第一节</span></p>
    <p class="q-b">水循环是指自然界的水在水圈、大气圈、岩石圈、生物圈中，通过蒸发（蒸腾）、水汽输送、降水、下渗、径流等环节连续运动的过程。</p>
    <p class="q-n">→ 定义里有 <b>三个要素</b>：<b>① 四个圈层</b>（水、大气、岩石、生物，说明它把圈层串起来了）、
    <b>② 六个环节</b>（蒸发/蒸腾 — 水汽输送 — 降水 — 下渗 — 径流）、<b>③ "连续"</b>（没有起点也没有终点）。
    答题时写"水从海洋蒸发到陆地降水"，只写了半个循环，会丢分。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 三种类型<span class="q-src">人教版（2019）必修第一册 · 第三章第一节</span></p>
    <p class="q-b">根据发生的空间范围，水循环可分为海陆间循环、陆地内循环和海上内循环。海陆间循环是指发生在海洋与陆地之间的水循环……这种海陆间的循环又称为大循环。通过这种循环运动，陆地上的水就不断得到补充，水资源得以再生。</p>
    <p class="q-n">→ 三种循环的<b>唯一区别是"发生在哪"</b>，不是环节不一样。所以判断类型只看两件事：
    <b>起止在哪</b>、<b>有没有跨过海岸线</b>。三者里只有<b>海陆间循环</b>能让陆地水"补得上"，
    所以它最重要；而<b>参与水量最大的是海上内循环</b>（海洋面积占 71%，蒸发量最大）。</p>
  </div>

  <p class="gx-note">意义那一段有四句话，对应四个不同的"作用方向"，答题时按问法挑：
  <b>水量</b>（维持全球水量动态平衡）· <b>热量</b>（缓解不同纬度热量收支不平衡）·
  <b>物质</b>（海陆间联系的主要纽带，进行物质迁移）· <b>地貌</b>（不断塑造地表形态）。</p>

  <p class="gx-h2s" style="margin-top:18px">三类循环的差别，一张表看完（背"参与水量"和"是否涉及岩石圈"就够）：</p>
  <div style="overflow-x:auto">
  <table class="gx-cmp">
    <thead><tr><th>类型</th><th>发生领域</th><th>主要环节</th><th style="white-space:nowrap">水量</th><th>关键意义</th></tr></thead>
    <tbody>
      <tr class="key"><td>海陆间循环</td><td>海洋与陆地之间</td><td>蒸发、水汽输送、降水、地表径流、下渗、地下径流（<b>最全</b>）</td><td style="white-space:nowrap">居中</td><td><b>陆地水不断补充，水资源得以再生</b>（又称大循环）</td></tr>
      <tr><td>陆地内循环</td><td>陆地与陆地上空</td><td>蒸发、植物蒸腾、降水（<b>没有下渗与径流</b>，环节最少）</td><td style="white-space:nowrap">最小</td><td>对内陆干旱地区的水分补给很重要</td></tr>
      <tr><td>海上内循环</td><td>海洋与海洋上空</td><td>蒸发、降水（<b>没有下渗</b>）</td><td style="white-space:nowrap"><b>最大</b></td><td>全球热量输送的主要途径</td></tr>
    </tbody>
  </table>
  </div>
  <p class="gx-note">"参与水量最大的是海上内循环"和"最重要的是海陆间循环"<b>不矛盾</b>——
  一个说数量，一个说对人类的意义。考题问"水量最大"答海上内，问"使水资源再生"答海陆间，别混。</p>
</section>

<!-- ================= B ================= -->
<section class="gx-sec" id="b">
  <h2><span class="sn">02</span>拆开看</h2>
  <p class="gx-h2s">四张图：三种循环套在一起长什么样、人类能改哪几个环节、砂田为什么能保水、水泥地为什么招涝。</p>

  <!-- 图1 三类循环 -->

    <p class="gx-take">砂田这道题的答法是<b>按环节逐个写</b>：砂石覆盖层 →
    ① <b>增加下渗</b>（缝隙大、地表糙度大，拦住了地表径流）；② <b>减少蒸发</b>（遮挡阳光、切断毛细管）；
    ③ 因此<b>土壤含水量增加</b>，<b>地表径流减少</b>。三个环节，一个都不能少。</p>
    <p class="gx-note">别把"砂田"答成"砂田能增加降水"。<b>降水是天上决定的，砂田改不了</b>——

        <text class="ms" x="58" y="90" text-anchor="middle" fill="#9aa3ae">不流向海洋</text>
        <rect x="200" y="28" width="22" height="52" fill="#dcedf5" stroke="#7fb5c9"/>
        <path d="M 132 70 C 156 58, 178 52, 200 46" stroke="#0891b2" stroke-width="2.4" fill="none"/>
        <text class="ms" x="166" y="76" text-anchor="middle">外流区</text>
        <text class="ms" x="166" y="90" text-anchor="middle" fill="#9aa3ae">水最终入海</text>
        <text class="mm" x="120" y="118" text-anchor="middle" fill="#b8402f">"内流 / 外流"≠"内陆 / 沿海"</text>
      </svg>
    </div>

  </div>
  <p class="gx-note">这六问其实是同一句话：<b>水循环考的是"分配"，不是"总量"。</b>
  降水几乎改不了，但水落到地面之后往哪儿去，人类能改——而所有能改的地方，都是得分点。</p>
</section>

<!-- ================= F ================= -->
<section class="gx-sec" id="f">
  <h2><span class="sn">06</span>易错清单</h2>
  <p class="gx-h2s">左边是考试里真的会写出来的错句，右边是应该写的样子。后者可以直接背。</p>

  <div style="overflow-x:auto;margin-bottom:16px">
  <table class="gx-cmp">
    <thead><tr><th>问法</th><th>要答的</th><th>一句话判据</th></tr></thead>
    <tbody>
      <tr><td>环节最多最全</td><td>海陆间循环</td><td>六个环节全有</td></tr>
      <tr class="key"><td>参与水量最大</td><td><b>海上内循环</b></td><td>海洋面积占 71%</td></tr>
      <tr><td>使水资源再生</td><td>海陆间循环</td><td>只有它给陆地补水</td></tr>
      <tr><td>不涉及岩石圈</td><td>海上内循环</td><td>没有下渗和径流</td></tr>
      <tr><td>修水库 / 调水</td><td>地表径流（时间 / 空间分布）</td><td>一个调时间，一个调空间</td></tr>
      <tr><td>砂田 / 植树 / 海绵城市</td><td>下渗 ↑、蒸发（蒸腾）↓、地表径流 ↓</td><td>都是"让水渗下去"</td></tr>
    </tbody>
  </table>
  </div>

  <div class="gx-errs">
    <div class="er">
      <p class="er-x">✗ 水循环从海洋蒸发开始，到径流入海结束</p>
      <p class="er-v">✓ 水循环是<b>连续运动的过程</b>，是闭合回路，<b>没有起点也没有终点</b></p>
      <p class="er-w">错在哪：把回路说成了线段。而且只有海陆间循环才回到海洋，另两种不回到海洋。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 海上内循环水量最大，所以最重要</p>
      <p class="er-v">✓ 水量最大是海上内循环；<b>对陆地水资源最重要的是海陆间循环</b></p>
      <p class="er-w">错在哪：把"数量"当成了"意义"。一个问多少，一个问有没有用。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 修水库增加了当地的水资源总量</p>
      <p class="er-v">✓ 水库只<b>调节地表径流的时间分布</b>（削峰补枯），不增加总水量，也不改变降水</p>
      <p class="er-w">错在哪：把"存得住"当成了"变多了"。水还是那些水，只是换了个时间到。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 城市内涝是因为降水强度变大</p>
      <p class="er-v">✓ 很多内涝是<b>下渗减少、地表径流增加</b>造成的，降水量可以基本不变</p>
      <p class="er-w">错在哪：只盯着天上，没看地面。硬化率是内涝最直接的原因。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 下渗减少，地下径流就一定同比例减少</p>
      <p class="er-v">✓ 下渗的水先补给<b>土壤水</b>，多余部分才形成地下径流；两者变化幅度不同</p>
      <p class="er-w">错在哪：跳过了"土壤蓄水"这一环。干旱区下渗的水可能全部被土壤截留。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 植被破坏只影响地表径流</p>
      <p class="er-v">✓ 植被破坏同时使<b>下渗减少、蒸腾减少、地表径流增加、地下径流减少</b>，河流"陡涨陡落"</p>
      <p class="er-w">错在哪：只答一个环节。这类题通常按环节给分，答全才拿满。</p>
    </div>
  </div>
</section>

  <span class="gx-zoom-tip">双指放大 · 左右滑动看全图</span>

<script src="../../assets/geo-autopilot.js"></script>
<script>
/* 水循环 · 讲义交互（等 page.js 把 #md 渲染成正文之后再跑） */
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var NS = "http://www.w3.org/2000/svg";
  function $(id) { return document.getElementById(id); }
  function el(tag, attrs, parent) {
    var n = document.createElementNS(NS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }
  function n1(v) { return (Math.round(v * 10) / 10).toString(); }

  if (!$("gxStage")) return;

  /* ================= 手机的图放大 ================= */
  (function () {
    var zoom = $("gxZoom"), inner = $("gxZoomInner");
    if (!zoom || !inner) return;
    Array.prototype.forEach.call(document.querySelectorAll(".gx-svgbox"), function (box) {
      box.style.cursor = "zoom-in";
      box.addEventListener("click", function () {
        if (window.innerWidth > 760) return;
        var svg = box.querySelector("svg");
        if (!svg) return;
        inner.textContent = "";
        inner.appendChild(svg.cloneNode(true));
        zoom.hidden = false;
        document.body.style.overflow = "hidden";
      });
    });
    function close() { zoom.hidden = true; document.body.style.overflow = ""; }
    zoom.addEventListener("click", function (e) {
      if (e.target === zoom || e.target.classList.contains("gx-zoom-x")) close();
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && !zoom.hidden) close();
    });
  })();

  /* ================= 分步揭示 ================= */
  (function () {
    var steps = document.querySelectorAll("#gxSteps .step");
    var ans = $("gxAns"), btn = $("gxNext"), cnt = $("gxCnt");
    if (!steps.length || !btn) return;
    var i = 1;
    function paint() { if (cnt) cnt.textContent = Math.min(i, steps.length) + " / " + steps.length; }
    steps[0].hidden = false;
    paint();
    btn.addEventListener("click", function () {
      if (i < steps.length) { steps[i].hidden = false; i++; }
      if (i >= steps.length) {
        if (ans) ans.hidden = false;
        btn.textContent = "已全部展开";
        btn.disabled = true;
      }
      paint();
    });
  })();

  /* ================= 互动：硬化率 → 水的四个去向 ================= */
  (function () {
    var stage = $("gxStage"), gSplit = $("gxSplit"), gHydro = $("gxHydro");
    var sl = $("gxSl"), vP = $("gxVp"), vR = $("gxVr"), vS = $("gxVs"), vSn = $("gxVsn"), box = $("gxStBox");

    var WIDE = {
      vb: "0 0 880 420", FS: 1,
      sp: { x: 28, y: 62, w: 430, lab: 78, bar: 296, gap: 46, bh: 26 },
      hy: { x: 516, y: 62, w: 336, h: 236 }, bp: 620
    };
    var NARROW = {
      vb: "0 0 360 566", FS: 1.15,
      sp: { x: 10, y: 44, w: 340, lab: 68, bar: 212, gap: 40, bh: 22 },
      hy: { x: 32, y: 276, w: 310, h: 236 }, bp: 620
    };
    var L = WIDE, FS = 1, H = 20, dragging = false, R = {};

    var P = 100;                  /* 固定降水 */
    var QMAX = 90;                /* 过程线纵轴上限 */
    var KEYS = [
      { id: "ev", name: "蒸发蒸腾", col: "#b8791f", soft: "#f3e4c4" },
      { id: "inf", name: "下渗", col: "#0891b2", soft: "#d6eef6" },
      { id: "run", name: "地表径流", col: "#b8402f", soft: "#f6ded8" },
      { id: "gw", name: "地下径流", col: "#3f6f92", soft: "#dbe6ee" }
    ];

    /* 分配模型：三项随硬化率变化，地表径流吃掉差额 */
    function parts(hv) {
      var inf = 45 * (1 - 0.9 * hv);
      var ev = 30 * (1 - 0.5 * hv);
      var run = P - inf - ev;
      var gw = inf * 0.55;
      return { inf: inf, ev: ev, run: run, gw: gw };
    }

    /* 过程线：涨水段幂函数 + 退水段指数衰减 */
    function qOf(t, qp, tp, kd) {
      if (t <= 0) return 0;
      if (t <= tp) return qp * Math.pow(t / tp, 1.6);
      return qp * Math.exp(-(t - tp) / kd);
    }

    function tx(parent, x, y, s, col, anchor, size, weight, halo) {
      var o = { x: n1(x), y: n1(y), "font-size": (size || 11) * FS, fill: col,
                "text-anchor": anchor || "start", "font-weight": weight || 400 };
      if (halo) o["class"] = "halo";
      var t = el("text", o, parent);
      t.textContent = s;
      return t;
    }

    function build() {
      gSplit.textContent = ""; gHydro.textContent = "";
      var S = L.sp, Y = L.hy;

      /* ---------- 左：四个去向 ---------- */
      tx(gSplit, S.x, S.y - 22, "一次 100 mm 的雨，分成四份", "#151a21", "start", 12, 700);
      R.bar = []; R.val = [];
      var i, kk;
      for (i = 0; i < 4; i++) {
        kk = KEYS[i];
        var by = S.y + i * S.gap;
        el("rect", { x: S.x, y: by, width: S.lab - 8, height: S.bh + 12, rx: 6,
                     fill: "#fff", stroke: "#e6e9ee" }, gSplit);
        tx(gSplit, S.x + 8, by + 17, kk.name, "#3a3a35", "start", 10.5, 700);
        el("rect", { x: S.x + S.lab, y: by + 6, width: S.bar, height: S.bh, rx: 5,
                     fill: "#f2f4f6" }, gSplit);
        R.bar.push(el("rect", { x: S.x + S.lab, y: by + 6, width: 10, height: S.bh, rx: 5,
                                fill: kk.col }, gSplit));
        R.val.push(tx(gSplit, 0, by + 25, "", kk.col, "start", 10.5, 700));
      }
      tx(gSplit, S.x, S.y + 4 * S.gap + 14, "四份加起来始终 = 100 mm", "#9aa3ae", "start", 10);

      /* ---------- 右：过程线 ---------- */
      tx(gHydro, Y.x, Y.y - 22, "地表径流过程线（洪水过程）", "#151a21", "start", 12, 700);
      /* 轴 */
      el("line", { x1: Y.x, y1: Y.y + Y.h, x2: Y.x + Y.w, y2: Y.y + Y.h,
                   stroke: "#c9c2b0", "stroke-width": 1.2 }, gHydro);
      el("line", { x1: Y.x, y1: Y.y, x2: Y.x, y2: Y.y + Y.h,
                   stroke: "#c9c2b0", "stroke-width": 1.2 }, gHydro);
      var g, gy;
      for (g = 0; g <= QMAX; g += 30) {
        gy = Y.y + Y.h - (g / QMAX) * Y.h;
        el("line", { x1: Y.x, y1: n1(gy), x2: Y.x + Y.w, y2: n1(gy),
                     stroke: "#eceff3", "stroke-width": 1 }, gHydro);
        tx(gHydro, Y.x - 6, gy + 4, String(g), "#9aa3ae", "end", 9.5);
      }
      [0, 6, 12, 18, 24].forEach(function (t) {
        var xx = Y.x + (t / 24) * Y.w;
        tx(gHydro, xx, Y.y + Y.h + 15, t + "", "#9aa3ae", "middle", 9.5);
      });
      tx(gHydro, Y.x + Y.w, Y.y + Y.h + 32, "时间（小时）", "#5a6472", "end", 10);
      tx(gHydro, Y.x - 10, Y.y - 4, "流量", "#5a6472", "start", 9.5);

      /* 参照曲线：不硬化（草地） */
      R.ref = el("path", { fill: "none", stroke: "#b8c4cc", "stroke-width": 1.8,
                           "stroke-dasharray": "5 4" }, gHydro);
      tx(gHydro, Y.x + Y.w - 6, Y.y + 14, "虚线：不硬化（草地）", "#9aa3ae", "end", 9.5);

      R.curve = el("path", { fill: "none", stroke: "#b8402f", "stroke-width": 2.6 }, gHydro);
      R.area = el("path", { fill: "#b8402f", opacity: 0.10 }, gHydro);
      R.peak = el("line", { stroke: "#b8402f", "stroke-width": 1.2,
                            "stroke-dasharray": "3 3" }, gHydro);
      R.peakT = tx(gHydro, 0, 0, "", "#b8402f", "middle", 10, 700, true);
      R.cursor = el("path", { fill: "#b8402f" }, gHydro);
      R.cline = el("line", { stroke: "#b8402f", "stroke-width": 1.4 }, gHydro);
    }

    function path4(qp, tp, kd) {
      var Y = L.hy, d = "", t, q, px, py, started = false;
      for (t = 0; t <= 24.001; t += 0.4) {
        q = qOf(t, qp, tp, kd);
        px = Y.x + (t / 24) * Y.w;
        py = Y.y + Y.h - (Math.min(q, QMAX) / QMAX) * Y.h;
        d += (started ? " L " : "M ") + n1(px) + " " + n1(py);
        started = true;
      }
      return d;
    }

    function render() {
      var S = L.sp, Y = L.hy, hv = H / 100;
      var p = parts(hv);

      /* 左：条形 */
      var arr = [p.ev, p.inf, p.run, p.gw];
      for (var i = 0; i < 4; i++) {
        var w = Math.max(6, arr[i] / P * S.bar);
        R.bar[i].setAttribute("width", n1(w));
        R.val[i].setAttribute("x", n1(S.x + S.lab + w + 8));
        R.val[i].textContent = arr[i].toFixed(1) + " mm";
      }

      /* 右：两条曲线 */
      R.ref.setAttribute("d", path4(25, 9, 3.2));
      var qp = p.run;
      var tp = 9 - 5 * hv;
      var kd = 3.2 - 1.6 * hv;
      var d = path4(qp, tp, kd);
      R.curve.setAttribute("d", d);
      R.area.setAttribute("d", d + " L " + n1(Y.x + Y.w) + " " + n1(Y.y + Y.h) +
                               " L " + n1(Y.x) + " " + n1(Y.y + Y.h) + " Z");

      var px = Y.x + (tp / 24) * Y.w;
      var py = Y.y + Y.h - (Math.min(qp, QMAX) / QMAX) * Y.h;
      R.peak.setAttribute("x1", n1(px)); R.peak.setAttribute("y1", n1(py));
      R.peak.setAttribute("x2", n1(px)); R.peak.setAttribute("y2", n1(Y.y + Y.h));
      var labR = px > Y.x + Y.w * 0.62;
      R.peakT.setAttribute("x", n1(labR ? px - 10 : px + 10));
      R.peakT.setAttribute("y", n1(py - 9));
      R.peakT.setAttribute("text-anchor", labR ? "end" : "start");
      R.peakT.textContent = "峰 " + qp.toFixed(0) + " · " + tp.toFixed(1) + " h 后";

      /* 游标 */
      var cx = Math.max(Y.x + 7, Math.min(Y.x + Y.w - 7, Y.x + (H / 100) * Y.w));
      R.cline.setAttribute("x1", n1(cx)); R.cline.setAttribute("x2", n1(cx));
      R.cline.setAttribute("y1", n1(Y.y - 2)); R.cline.setAttribute("y2", n1(Y.y + 12));
      R.cursor.setAttribute("d", "M " + n1(cx) + " " + n1(Y.y - 2) + " l -6 -10 l 12 0 z");

      /* 数值卡 */
      vP.textContent = P + " mm";
      vR.textContent = Math.round(p.run) + "%";

      var st, sn, cc, bg;
      if (H < 10) { st = "近自然地表"; sn = "下渗充分，洪峰低而缓"; cc = "#1e6640"; bg = "#e6f6ee"; }
      else if (H < 45) { st = "轻度硬化"; sn = "洪峰抬升，峰现略提前"; cc = "#1e6640"; bg = "#e6f6ee"; }
      else if (H < 70) { st = "中度硬化"; sn = "下渗减半，峰现明显提前"; cc = "#8a5c14"; bg = "#fdf3e0"; }
      else if (H < 90) { st = "高度硬化"; sn = "径流陡涨，易超排水能力"; cc = "#b8402f"; bg = "#fbeae7"; }
      else { st = "满铺不透水"; sn = "几乎全部成径流，内涝高发"; cc = "#b8402f"; bg = "#fbeae7"; }
      vS.textContent = st; vSn.textContent = sn;
      vS.style.color = cc;
      box.style.background = bg;
      box.style.borderColor = cc + "44";
      if (sl.value !== String(H)) sl.value = H;
    }

    function applyLayout() {
      var w = stage.parentElement.getBoundingClientRect().width;
      L = w >= WIDE.bp ? WIDE : NARROW;
      FS = L.FS;
      stage.setAttribute("viewBox", L.vb);
      build();
      render();
    }

    sl.addEventListener("input", function () { H = +this.value; render(); });
    $("gxP1").addEventListener("click", function () { H = 0; render(); });
    $("gxP2").addEventListener("click", function () { H = 50; render(); });
    $("gxP3").addEventListener("click", function () { H = 85; render(); });
    $("gxP4").addEventListener("click", function () { H = 100; render(); });

    function setFromX(clientX) {
      var bb = stage.getBoundingClientRect();
      var vbw = parseFloat(L.vb.split(" ")[2]);
      var x = (clientX - bb.left) * (vbw / bb.width);
      var frac = (x - L.hy.x) / L.hy.w;
      H = Math.max(0, Math.min(100, Math.round(frac * 100)));
      render();
    }
    stage.addEventListener("pointerdown", function (ev) {
      dragging = true;
      try { stage.setPointerCapture(ev.pointerId); } catch (e) {}
      setFromX(ev.clientX);
    });
    stage.addEventListener("pointermove", function (ev) {
      if (!dragging) return;
      ev.preventDefault();
      setFromX(ev.clientX);
    });
    ["pointerup", "pointercancel"].forEach(function (e) {
      stage.addEventListener(e, function () { dragging = false; });
    });
    window.addEventListener("blur", function () { dragging = false; });

    var tmr = null;
    window.addEventListener("resize", function () {
      clearTimeout(tmr);
      tmr = setTimeout(applyLayout, 180);
    });

    applyLayout();
  })();
});
</script>
