<p class="gx-lede">这一节只考两件事：一是世界人口分布的<b>三条规律</b>（纬度、海陆、地形），

<!-- ================= A ================= -->
<section class="gx-sec" id="a">
  <h2><span class="sn">01</span>课本怎么说</h2>
  <p class="gx-h2s">先背标准表述，再看解释。顺序反了，答题时就写不出术语。</p>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 人口分布与人口密度<span class="q-src">人教版（2019）必修第二册 · 第一章第一节</span></p>
    <p class="q-b">人口分布是指一定时间内人口在一定地区范围的空间分布状况。人口密度是指单位土地面积上居住的人口数，通常以每平方千米常住人口数表示。</p>
    <p class="q-n">→ 两句话各管一件事：<b>分布</b>看“人住在哪”，<b>密度</b>看“挤不挤”。
    密度是一条<b>除法</b>：<b>人口密度 = 人口数 ÷ 土地面积</b>。所以面积一大，密度立刻被稀释——
    这就是为什么新疆人口不少，密度却只有每平方千米十几人。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 世界人口分布<span class="q-src">人教版（2019）必修第二册 · 第一章第一节</span></p>
    <p class="q-b">世界人口分布很不均匀。从全球来看，人口主要分布在北半球中低纬度的沿海平原地区；干旱的荒漠、寒冷的极地、空气稀薄的高山高原、湿热的热带雨林地区，人口稀少。</p>
    <p class="q-n">→ 后面那串“人口稀少区”正好是<b>四种极端条件</b>：<b>干、冷、缺氧、湿热</b>。
    注意“湿热”也是极端——很多人以为越热越热闹，其实热带雨林恰恰住不了多少人。
    答“哪里人口稠密”时，把<b>纬度、海陆、地形</b>三个词写全，比写“自然条件好”多拿分。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 影响人口分布的因素<span class="q-src">人教版（2019）必修第二册 · 第一章第一节</span></p>
    <p class="q-b">影响人口分布的因素，既有自然因素，也有人文因素。自然因素包括气候、地形、水源、土壤等；人文因素包括生产方式、经济发展水平、历史、政治、文化等。</p>
    <p class="q-n">→ 这句话本身就是<b>答题框架</b>：<b>自然 4 个 + 人文 5 个</b>。
    自然因素决定“<b>能不能住</b>”，人文因素决定“<b>住得挤不挤</b>”。
    只写自然，最多拿一半分；只写“经济发达”，连一半都拿不到。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 我国人口分布<span class="q-src">人教版（2019）必修第二册 · 第一章第一节</span></p>
    <p class="q-b">我国人口分布很不均匀。以黑河—腾冲一线为界，东南半壁人口稠密，西北半壁人口稀少。</p>
    <p class="q-n">→ 这条线就是<b>胡焕庸线</b>（1935 年提出）。它不只是一条线，还是一组数字：
    东南侧<b>面积约 43.8%、人口约 94.1%</b>；西北侧<b>面积约 56.2%、人口约 5.9%</b>（2010 年第六次全国人口普查口径）。
    <b>不到一半的土地，住了九成多的人</b>——这就是“不均匀”四个字的全部含义。</p>
  </div>

  <p class="gx-h2s" style="margin-top:18px">把密度除出来看一眼（2020 年第七次全国人口普查数据，单位：人/km²）：</p>
  <div style="overflow-x:auto">
  <table class="gx-cmp">
    <thead><tr><th>地区</th><th>人口密度</th><th>为什么是这个数</th></tr></thead>
    <tbody>
      <tr><td>全国</td><td>约 147</td><td>14.1 亿人 ÷ 约 960 万 km²</td></tr>
      <tr><td>上海</td><td>约 3923</td><td>面积只有 0.63 万 km²，人口 2487 万</td></tr>
      <tr class="key"><td>江苏</td><td>约 790</td><td>平原 + 沿海 + 经济强，典型“又平又富”</td></tr>
      <tr><td>河南</td><td>约 595</td><td>黄淮海平原，农业开发历史久</td></tr>
      <tr><td>新疆</td><td>约 16</td><td>面积 166 万 km²，人口集中在绿洲</td></tr>
      <tr><td>西藏</td><td>约 3</td><td>高原缺氧、热量不足，人口集中在河谷</td></tr>
    </tbody>
  </table>
  </div>
  <p class="gx-note">看这张表要抓<b>两个反直觉</b>：① 西藏人口密度全国最低，但拉萨河谷并不“荒”，
  人口是<b>沿着河谷集中</b>的；② 新疆密度低，不等于“没人”，1600 多万人只是摊在了很大的面积上。
  <b>“密度低”和“人口少”是两件事。</b><br>
  还要记住：密度是<b>平均数</b>，会掩盖内部差异——江苏全省约 790 人/km²，但苏南远高于苏北；
  上海约 3923 人/km²，崇明岛却低得多。所以题目给“平均密度”时，别急着推“每个地方都这么挤”。</p>
</section>
