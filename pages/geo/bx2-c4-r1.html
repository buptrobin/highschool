<div class="gx-meta">

<p class="gx-lede">早高峰 8 点，一个绿灯周期只能放行几十辆车，后面却排着几百辆——这就是“疏堵”要解决的问题。
问题研究不给标准答案，只给你材料，让你<b>自己拿主意</b>。它考的是一件很具体的事：
面对限行、收费、修路、上智能系统这些方案，你能按<b>见效速度、公平性、实施难度</b>比较，
最后写出<b>有条件的结论</b>。只写“应该综合治理”而不写“在什么条件下、先做哪一步”，基本不给分。</p>

<!-- ================= A ================= -->
<section class="gx-sec" id="a">
  <h2><span class="sn">01</span>材料与问题</h2>
  <p class="gx-h2s">三份材料，三种思路。先看清它们各自想动哪个“开关”，再回答后面的三个问题。</p>

  <div class="gx-quote">
    <p class="q-t">材料一 · 一组数字<span class="q-src">人教版（2019）必修第二册 · 第四章 问题研究（课本要点转述）</span></p>
    <p class="q-b">我国大城市中心城区的道路面积率多在 10%—20% 之间，而小汽车保有量仍在增长；早晚高峰时段，中心城区主干路的平均车速常降到每小时 20 千米上下。</p>
    <p class="q-n">→ 这句话里藏着三个判断：<b>供给有天花板</b>（路已经密到拆不动）、<b>需求还在涨</b>（车还在多）、
    <b>矛盾集中在时空上</b>（不是全天堵，是早高峰、是向心方向）。答题时先说这三个，再说措施。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">材料二 · 伦敦收“拥堵费”<span class="q-src">公开评估报告口径 · 伦敦交通局</span></p>
    <p class="q-b">2003 年 2 月起，伦敦对工作日白天进入中心区的车辆按日收费，最初每天 5 英镑，2020 年提高到 15 英镑。监测显示，实施首年进入收费区的小汽车流量下降约 15%，区内交通拥堵下降约 30%。</p>
    <p class="q-n">→ 它动的是“<b>需求</b>”这个开关：不禁止你进城，但让你<b>为占用稀缺路权付费</b>。
    注意数字的区别——<b>车流降 15%，拥堵降 30%</b>，因为路网越接近饱和，少一点车就能换来速度的大幅回升。
    这是“非线性”的典型例子，也是最容易被出题人拿来做比较的地方。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">材料三 · 北京的两步<span class="q-src">公开政策口径 · 北京市</span></p>
    <p class="q-b">2008 年起，北京在工作日按车牌尾号限制部分小汽车上路；2011 年起对小客车实行数量调控（摇号、竞价）。同期大力推进轨道交通与公交专用道建设。</p>
    <p class="q-n">→ 两步合起来才是一套：<b>限行管“用车”</b>（存量），<b>摇号管“买车”</b>（增量），
    <b>轨道和专用道管“替代”</b>（给出不开车的选项）。
    只写限行不写替代方案，答案就少了最关键的一半——限行的前提是“有别的办法出门”。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">本课要回答的三个问题<span class="q-src">探究任务</span></p>
    <p class="q-b">问题 1：材料中的做法，分别想改变<b>道路供给</b>、<b>出行需求</b>，还是<b>通行效率</b>？<br>
    问题 2：如果只允许保留一项措施，你选哪一项？判据是什么？<br>
    问题 3：限行、收费常被指“不公平”，不公平在哪？有没有减轻的办法？</p>
    <p class="q-n">→ 问题 2 没有唯一答案，但<b>判据必须是可比的三项</b>：见效速度、公平性、实施难度。
    只说“我觉得公交好”，是态度不是论证；说“公交优先见效慢、但受益面广、投入大”，才是论证。</p>
  </div>

  <figure class="gx-fig">
    <div class="fig-cap">
      <span class="fig-no">图 1</span><span class="fig-t">一条路的一天：拥堵是“时段性”的</span>
      <span class="bdg bdg-must">必考</span>
    </div>
    <p class="fig-s">横轴是一天 24 小时，纵轴是主干路<b>平均车速</b>。曲线有两个明显的坑：<b>7—9 时</b>和<b>17—19 时</b>，
    最低点都在 20 km/h 以下。中午和深夜车速接近自由流状态，说明堵的不是“路不够”，而是<b>某个时段的路不够</b>。</p>

    <p class="gx-take">同一个路口，中午不缺、早高峰缺——所以“堵”是<b>时段性、方向性的供需失衡</b>，
    不是全天的总量不足。这条结论决定了措施：<b>要么把需求挪走（错峰、收费），要么把同一条路的运力做大（公交优先）</b>。</p>
    <p class="gx-note">曲线形状按城市主干路早晚高峰的<b>典型形态</b>绘制，最低车速取 20 km/h 上下，
    与材料一的量级一致；具体数值属<b>教学示意值，不是某条路的实测数据</b>。</p>

  <h2><span class="sn">03</span>数据与案例</h2>

      <tr class="key"><td>拥堵费</td><td>伦敦（2003 年起）、新加坡 ERP（1998 年起）、斯德哥尔摩（2007 年起）</td><td>需求管理：为占用稀缺路权付费</td><td>伦敦首年进入收费区的小汽车流量约 −15%，区内拥堵约 −30%</td><td>对低收入者不公平；须有成熟的公交替代</td></tr>

  <p class="gx-note">读这张表要抓两个“非线性”：① 伦敦<b>车流只降 15%，拥堵却降 30%</b>——路网越接近饱和，
  减一点车就能换回很多速度；② 限行的效果<b>先大后小</b>，因为家庭会买第二辆车。
  只写“限行有效”或“限行无效”，都不对；正确的是<b>“短期有效、长期衰减”</b>。</p>

  <p class="gx-h2s">同一套措施，落在不同的城市，优先级不一样：</p>

      <p class="q-b">机动化早已完成，路网基本定型，<b>增量供给几乎没有</b>；公交系统成熟、收费技术可靠，所以更常用<b>经济手段</b>（拥堵费、停车费）调节需求。</p>
      <p class="q-n">→ 前提是“有车可换”：公交能替代，收费才推得动。</p>
    </div>
    <div class="gx-quote" style="margin:0">

<section class="gx-sec" id="f">
  <h2><span class="sn">06</span>评价清单</h2>
  <p class="gx-h2s">左边是问题研究里最常见的“看着写了、其实没分”的答法，右边是好答案长什么样。</p>

  <div class="gx-errs">
    <div class="er">
      <p class="er-x">✗ 应该大力发展公共交通，限制私家车</p>
      <p class="er-v">✓ 在中心城区路网容量接近饱和的条件下，应优先<b>提高公交分担率</b>：建设轨道与 BRT、设公交专用道，同时用<b>差别化停车收费</b>引导小汽车短途出行</p>
      <p class="er-w">差在哪：只有口号，没有<b>条件</b>、没有<b>具体手段</b>，也没有说明“限制”怎么落地。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 限行最有效，全国都应该推广</p>
      <p class="er-v">✓ 限行<b>见效快</b>但效果<b>逐年衰减</b>（家庭购置第二辆车），适合作为<b>过渡性需求管理</b>手段，须评估对无车群体的公平性</p>
      <p class="er-w">差在哪：只看短期效果，忽略了<b>副作用</b>与<b>适用条件</b>。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 多修路就能解决堵车</p>
      <p class="er-v">✓ 中心城区道路面积率已接近上限，且新增道路会<b>诱发新的小汽车出行（诱导需求）</b>，供给存在天花板</p>
      <p class="er-w">差在哪：把交通问题当成纯工程问题，没看到“路修到哪、车跟到哪”。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 国外收拥堵费很成功，我国照搬即可</p>
      <p class="er-v">✓ 拥堵费的前提是<b>公交替代成熟、收费技术可靠、公众接受度足够</b>，且收费收入应回流补贴公共交通</p>
      <p class="er-w">差在哪：迁移国外经验时不核对<b>前提条件</b>，这是比较类题目最常见的失分点。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 堵车是人口太多造成的</p>
      <p class="er-v">✓ 堵车是特定<b>时段、方向、走廊</b>上的路权供需失衡，与<b>城市形态、职住分布、公交分担率</b>直接相关</p>
      <p class="er-w">差在哪：把结构性问题推给人口总量，结论只能落到“控制人口”，跑题。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 上智慧交通系统就能根治拥堵</p>
      <p class="er-v">✓ 智慧交通提高<b>既有路网</b>的运行效率，属于<b>存量优化</b>，不能替代供给扩容与需求管理</p>
      <p class="er-w">差在哪：高估技术边界。信号优化能让路口多用 10%，却变不出第 9 条车道。</p>
