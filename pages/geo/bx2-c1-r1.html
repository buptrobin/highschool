<section class="gx-sec" id="a">
  <h2><span class="sn">01</span>材料与问题</h2>
  <p class="gx-h2s">先看三份材料，再带着三个问题往下走。材料里的数字都要能说出处。</p>

  <div class="gx-quote">
    <p class="q-t">材料一 · 规模<span class="q-src">2020 年第七次全国人口普查、2020 年农民工监测调查报告</span></p>
    <p class="q-b">2020 年，全国流动人口约 3.76 亿人；农民工总量约 2.86 亿人，其中外出农民工约 1.70 亿人，本地农民工约 1.16 亿人。</p>
    <p class="q-n">→ 两个数字<b>不是一回事</b>：<b>流动人口</b>按“人户分离、离开户口登记地半年以上”统计，
    <b>农民工</b>按“户籍在农村、在本地或外出从事非农产业”统计。3.76 亿里有农民工，也有出差、求学、随迁家属。
    <b>答题时把两个口径混用，是硬伤。</b></p>
  </div>

  <div class="gx-quote">
    <p class="q-t">材料二 · 处境<span class="q-src">课本要点 · 问题研究背景材料</span></p>
    <p class="q-b">农民工大多在制造业、建筑业、批发零售、餐饮住宿等行业就业，工资收入是家庭现金收入的主要来源；但他们的户籍仍在农村，在城镇享受公共服务方面存在困难。</p>
    <p class="q-n">→ 这段说的是“<b>半</b>”字：<b>工作在城市，户籍在农村</b>。于是三件事悬空——
    <b>社保能不能转、住房怎么解决、子女在哪上学</b>。评价农民工现象，绕不开这三个具体问题。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">材料三 · 政策<span class="q-src">课本要点 · 问题研究背景材料</span></p>
    <p class="q-b">国家逐步推进户籍制度改革，放宽中小城市落户条件，推动随迁子女平等接受义务教育，扩大农民工参加社会保险的覆盖面，并支持农民工返乡创业。</p>
    <p class="q-n">→ 政策这一段是<b>对策题的答案库</b>，可以拆成四条：<b>落户（户籍）、学位（教育）、
    社保（医疗养老）、返乡创业（就业）</b>。答题时按这四条写，不会漏。</p>
  </div>

  <p class="gx-h2s" style="margin-top:18px">2020 年的四个数（单位：亿人），记住量级就够：</p>
  <div style="overflow-x:auto">
  <table class="gx-cmp">
    <thead><tr><th>指标</th><th>数量</th><th>统计口径</th></tr></thead>
    <tbody>
      <tr class="key"><td>流动人口</td><td>约 3.76 亿</td><td><b>人户分离</b>、离开户口登记地半年以上（七普）</td></tr>
      <tr><td>农民工总量</td><td>约 2.86 亿</td><td>户籍在农村、从事<b>非农产业</b>（监测调查）</td></tr>
      <tr><td>外出农民工</td><td>约 1.70 亿</td><td>离开本乡镇、到外地务工</td></tr>
      <tr><td>本地农民工</td><td>约 1.16 亿</td><td>在本乡镇内从事非农产业</td></tr>
    </tbody>
  </table>
  </div>
  <p class="gx-note">只高亮第一行，因为<b>最容易错的就是口径</b>：问“我国有多少农民工”，答 2.86 亿；
  问“我国流动人口多少”，答 3.76 亿。两个数不能互相替代，也不能相加（有重叠）。</p>

  <p class="gx-h2s" style="margin-top:16px">本节要探究的三个问题：</p>
  <div class="gx-ex" style="background:#fff">
    <p class="ex-q" style="margin:0">
      <b>问题 1</b>　农民工为什么大规模地从农村流向城市？<br>
      <b>问题 2</b>　这种流动对城市、对乡村分别有什么影响？<br>
      <b>问题 3</b>　应该怎样看待农民工现象，又该怎样应对？
    </p>
  </div>
</section>

      color: "#8a5c14", why: "户籍、承包地、宅基地仍在老家，市民化还没完成" },
    { view: "迁入地城市", key: "劳动力 · 消费 · 学位", state: "既受益，也承压",
      color: "#0b6580", why: "补充劳动力、扩大消费，同时加大住房交通与学位压力" },
    { view: "迁出地乡村", key: "汇款 · 老龄化 · 土地", state: "有得有失",
      color: "#1e6640", why: "收入增加、人地矛盾缓解，但青壮年外流、土地撂荒" }
  ];

  var cards = grid.querySelectorAll(".pickcard");
  var vView = document.getElementById("nmView");
  var vKey = document.getElementById("nmKey");
  var vState = document.getElementById("nmState");
  var vWhy = document.getElementById("nmWhy");

  function show(i) {
    var d = DATA[i];
    vView.textContent = d.view;
    vKey.textContent = d.key;
    vState.textContent = d.state;
    vState.style.color = d.color;
    vWhy.textContent = d.why;
    Array.prototype.forEach.call(cards, function (c) {
      var on = +c.getAttribute("data-view") === i;
      c.classList.toggle("is-on", on);
      c.setAttribute("aria-pressed", on ? "true" : "false");
    });
  }

  Array.prototype.forEach.call(cards, function (c) {
    c.addEventListener("click", function () { show(+c.getAttribute("data-view")); });
  });

  show(0);
});
</script>
</body>
</html>
