<section class="gx-sec" id="a">
  <h2><span class="sn">01</span>课本怎么说</h2>
  <p class="gx-h2s">先背标准表述，再看解释。</p>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 生态脆弱区的含义<span class="q-src">人教版（2019）选择性必修2 · 第二章第二节</span></p>
    <p class="q-b">生态脆弱区也称生态交错带，是两种不同类型生态系统交界过渡的区域。这些区域生态系统抗干扰能力弱、易于退化且难以恢复。</p>
    <p class="q-n">→ 一句话拆成三件事：<b>位置</b>在两套系统的交界处；<b>抗干扰弱</b>，一碰就坏；<b>难以恢复</b>，坏了修不回来。</p>
  </div>

  <p class="gx-h2s">四类区，四张"病历"（必背）</p>
  <div style="overflow-x:auto">
  <table class="gx-cmp">
    <thead><tr><th>脆弱区</th><th>交界的两种生态系统</th><th>主要生态问题</th><th>主导人为原因</th></tr></thead>
    <tbody>
      <tr><td>北方农牧交错带</td><td>草原与农田</td><td>土地荒漠化、风蚀</td><td>过垦、过牧、水资源过度利用</td></tr>
      <tr><td>黄土高原</td><td>森林草原与干旱草原</td><td>水土流失</td><td>陡坡开垦、植被破坏、开矿修路</td></tr>
      <tr><td>西南喀斯特地区</td><td>森林与石山</td><td>石漠化</td><td>陡坡开垦、樵采薪柴</td></tr>
      <tr class="key"><td>西北荒漠—绿洲过渡带</td><td>荒漠与绿洲</td><td>荒漠化、土壤盐碱化</td><td>过度引水、大水漫灌、过牧</td></tr>
    </tbody>
  </table>
  </div>
  <p class="gx-note">这张表最容易背错的是最后一列：把"降水少、大风多"当原因——那是<b>背景</b>；"过垦、过牧、过樵、水资源利用不当"才是<b>主导因素</b>。答题两层都写。</p>

<script>
/* 互动：放牧强度 → 植被盖度 → 风蚀量 */
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var GX = window.GX, el = GX.el, tx = GX.tx, $ = GX.$;
  var stage = $("gxStage");
  if (!stage) return;

  var WIDE={vb:"0 0 880 440",fs:1,t1:[28,24],t2:[448,24],sky:{x:16,y:38,w:408,h:214},gnd:{x:16,y:252,w:408,h:150},tuft:{x0:44,y:252,n:11,dx:36,h:38},wind:{x0:30,y0:76,dy:28,n:6,len0:50,k:13,max:300},plot:{x:492,y:76,w:344,h:250},leg:[456,406]};
  var NARROW={vb:"0 0 360 632",fs:1,t1:[14,22],t2:[14,330],sky:{x:8,y:32,w:344,h:150},gnd:{x:8,y:182,w:344,h:116},tuft:{x0:26,y:182,n:8,dx:42,h:30},wind:{x0:18,y0:58,dy:22,n:5,len0:36,k:7,max:150},plot:{x:56,y:352,w:284,h:196},leg:[14,614]};
  var L = WIDE, A = 30;

  function coverOf(v) { return 100 - 0.75 * Math.max(0, v - 40); }
  function windOf(c) { return 100 * Math.pow(1 - c / 100, 2); }

  function drawLeft(g,c,w){
    var fs=L.fs,T=L.tuft,P=L.wind,i,x,yb,hh,vis=Math.round(c/100*T.n);
    tx(g,L.t1[0],L.t1[1],"① 地表：草地剖面（示意）","#151a21","start",11.5*fs,700);
    el("rect",{x:L.sky.x,y:L.sky.y,width:L.sky.w,height:L.sky.h,fill:"#eef7fd"},g);
    el("rect",{x:L.gnd.x,y:L.gnd.y,width:L.gnd.w,height:L.gnd.h,fill:c>=95?"#e5f1de":(c>=80?"#eaefdc":"#f0e9d9")},g);
    tx(g,L.sky.x+L.sky.w-12,L.sky.y+20,"盖度 "+c.toFixed(0)+"%","#2a6b8a","end",10*fs,700);
    var wn=w>0.5?Math.min(P.n,Math.max(1,Math.round(w/3.2))):0,len=Math.min(P.max,P.len0+w*P.k);
    for(i=0;i<wn;i++){var wy=P.y0+i*P.dy;
      el("line",{x1:P.x0,y1:wy,x2:P.x0+len,y2:wy,stroke:"#8fb7cc","stroke-width":1.8,"stroke-linecap":"round"},g);
      el("polygon",{points:(P.x0+len)+","+wy+" "+(P.x0+len-8)+","+(wy-4)+" "+(P.x0+len-8)+","+(wy+4),fill:"#8fb7cc"},g);}
    for(i=0;i<T.n;i++){x=T.x0+i*T.dx;yb=T.y;hh=T.h;
      if(i<vis){
        el("line",{x1:x,y1:yb,x2:x,y2:yb-hh,stroke:"#3f7a55","stroke-width":2,"stroke-linecap":"round"},g);
        el("path",{d:"M"+x+" "+(yb-hh*0.3)+"l-7 -"+(hh*0.38).toFixed(1)+"M"+x+" "+(yb-hh*0.52)+"l7 -"+(hh*0.34).toFixed(1),fill:"none",stroke:"#5b9a72","stroke-width":1.6},g);
      }else{
        el("line",{x1:x,y1:yb,x2:x,y2:yb-6,stroke:"#b9a878","stroke-width":2,"stroke-linecap":"round"},g);}
    }
    if(c<82)for(i=0;i<5;i++)el("circle",{cx:L.gnd.x+36+i*((L.gnd.w-66)/4),cy:L.gnd.y+20+(i*23)%38,r:1.8,fill:"#c9b58a"},g);
    tx(g,L.gnd.x+14,L.gnd.y+L.gnd.h-14,c<82?"地表裸露，风蚀起沙":"草层完整，地表少裸露",c<82?"#b8402f":"#1e6640","start",9.5*fs,700);
  }

  function drawRight(g,I,c,w){
    var fs=L.fs,P=L.plot,X=function(v){return P.x+v/100*P.w;},YC=function(v){return P.y+P.h-v*P.h*0.009;},YW=function(v){return P.y+P.h-v/25*P.h*0.9;},v,cc,ww;
    tx(g,L.t2[0],L.t2[1],"② 强度—盖度 / 风蚀 曲线（示意）","#151a21","start",11.5*fs,700);
    [0,50,100].forEach(function(t){el("line",{x1:P.x,x2:P.x+P.w,y1:YC(t),y2:YC(t),stroke:"#e6ecf1"},g);
      tx(g,P.x-6,YC(t)+3.5,String(t),"#8a949c","end",9*fs);});
    [0,10,20].forEach(function(t){tx(g,P.x+P.w+6,YW(t)+3.5,String(t),"#b07a72","start",9*fs);});
    el("line",{x1:P.x,y1:P.y+P.h,x2:P.x+P.w,y2:P.y+P.h,stroke:"#c9d3dc"},g);
    el("line",{x1:P.x,y1:P.y,x2:P.x,y2:P.y+P.h,stroke:"#c9d3dc"},g);
    el("line",{x1:X(40),y1:P.y,x2:X(40),y2:P.y+P.h,stroke:"#d8b878","stroke-dasharray":"4 4"},g);
    tx(g,X(40)+5,P.y+14,"载畜量临界","#a8792c","start",8.5*fs,700);
    var pc=[],pw=[];
    for(v=0;v<=100;v+=2){cc=coverOf(v);ww=windOf(cc);
      pc.push(X(v).toFixed(1)+","+YC(cc).toFixed(1));pw.push(X(v).toFixed(1)+","+YW(ww).toFixed(1));}
    el("polyline",{points:pc.join(" "),fill:"none",stroke:"#1a6f9c","stroke-width":2.2},g);
    el("polyline",{points:pw.join(" "),fill:"none",stroke:"#b8402f","stroke-width":2.2,"stroke-dasharray":"6 4"},g);
    var mx=X(I),cy=YC(c),wy=YW(w),rt=I>68;
    el("line",{x1:mx,y1:P.y,x2:mx,y2:P.y+P.h,stroke:"#b9c3cc","stroke-dasharray":"3 3"},g);
    el("circle",{cx:mx,cy:cy,r:4,fill:"#1a6f9c"},g);
    el("circle",{cx:mx,cy:wy,r:4,fill:"#b8402f"},g);
    tx(g,mx+(rt?-8:8),cy-9,"盖度 "+c.toFixed(0)+"%","#1a6f9c",rt?"end":"start",9*fs,700);
    tx(g,mx+(rt?-8:8),wy>P.y+P.h-26?wy-11:wy+16,"风蚀 "+w.toFixed(1),"#b8402f",rt?"end":"start",9*fs,700);
    [0,40,60,100].forEach(function(t){tx(g,X(t),P.y+P.h+14,String(t),"#8a949c","middle",9*fs);});
    tx(g,P.x+P.w/2,P.y+P.h+30,"放牧强度（%，理论载畜量 = 100）","#6b727a","middle",9*fs);
    el("line",{x1:L.leg[0],y1:L.leg[1]-4,x2:L.leg[0]+18,y2:L.leg[1]-4,stroke:"#1a6f9c","stroke-width":2.4},g);
    tx(g,L.leg[0]+24,L.leg[1],"植被盖度 %","#1a6f9c","start",9.5*fs);
    el("line",{x1:L.leg[0]+102,y1:L.leg[1]-4,x2:L.leg[0]+120,y2:L.leg[1]-4,stroke:"#b8402f","stroke-width":2.4,"stroke-dasharray":"6 4"},g);
    tx(g,L.leg[0]+126,L.leg[1],"风蚀指数（右轴）","#b8402f","start",9.5*fs);
  }

  function render() {
    var gA = $("gxA"), gB = $("gxB"), c = coverOf(A), w = windOf(c), st, sn, col, bg;
    gA.textContent = ""; gB.textContent = "";
    drawLeft(gA, c, w);
    drawRight(gB, A, c, w);
    $("gxVa").textContent = A.toFixed(0);
    $("gxVb").textContent = c.toFixed(0);
    $("gxVw").textContent = w.toFixed(1);
    if (A <= 40) { st = "未超载"; sn = "草场有余量"; col = "#1e6640"; bg = "#e6f6ee"; }
    else if (A <= 65) { st = "轻度过牧"; sn = "盖度开始下降"; col = "#8a6a1f"; bg = "#fbf4e2"; }
    else if (A <= 85) { st = "临界"; sn = "风蚀明显加快"; col = "#b0741f"; bg = "#fbf0e0"; }
    else { st = "严重退化"; sn = "盖度与风蚀双双失控"; col = "#b8402f"; bg = "#fbeae7"; }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    $("gxSl").value = String(A);
  }

  function applyLayout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? WIDE : NARROW;
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  $("gxSl").addEventListener("input", function () { A = +this.value; render(); });
  $("gxP1").addEventListener("click", function () { A = 0; render(); });
  $("gxP2").addEventListener("click", function () { A = 100; render(); });
  stage.addEventListener("keydown", function (ev) {
    if (ev.key === "ArrowLeft" || ev.key === "ArrowRight") {
      ev.preventDefault();
      A = GX.clamp(A + (ev.key === "ArrowRight" ? 1 : -1), 0, 100);
      render();
    }
  });
  var tmr = null;
  window.addEventListener("resize", function () {
    clearTimeout(tmr); tmr = setTimeout(applyLayout, 180);
  });
  applyLayout();
});
</script>
