<p class="gx-claim">植被不是"植物的名单"，而是<b>水热条件写在叶子上的答案</b>。</p>
<div class="gx-meta">
  <span><i></i>人教版必修第一册 第五章第一节</span>
  <span><i></i>高一 · 植被与土壤</span>
  <span><i></i>阅读 12 分钟</span>
  <span><i></i>含 1 个互动模型</span>
</div>
<p class="gx-lede">这一节的所有内容，都是在回答同一件事：<b>这块地方的水热条件，会长出什么样的植物</b>。
森林分四型、草原分两类、荒漠一类——名字不同，判据其实只有两条：<b>够不够湿</b>、<b>够不够暖</b>。
记住这条主线，比背七个名字有用得多。</p>

<!-- ================= A ================= -->
<section class="gx-sec" id="a">
  <h2><span class="sn">01</span>课本怎么说</h2>
  <p class="gx-h2s">先背标准表述，再看解释。顺序反了，答题时就写不出术语。</p>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 定义与分类<span class="q-src">人教版（2019）必修第一册 · 第五章第一节</span></p>
    <p class="q-b">自然界成群生长的各种植物的整体，称为植被。天然植被是天然形成的植被，如森林、草原、荒漠等；人工植被是人工栽培和经营管理的植被，如经济林、人工草场等。</p>
    <p class="q-n">→ 定义里有 <b>三个词缺一不可</b>：<b>① 成群生长</b>（不是单株）、<b>② 各种植物</b>（不是一种）、
    <b>③ 整体</b>（是一个有结构的群落）。所以"植被就是指植物"这句话<b>一定是错的</b>——
    一棵树叫植物，一片互相争光的树才叫植被。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 植被与环境<span class="q-src">人教版（2019）必修第一册 · 第五章第一节</span></p>
    <p class="q-b">植被是自然环境的重要组成部分，对自然环境具有改造作用。环境影响植被的分布：气温越高、降水量越多的地方，植被高度越大，植物种的数量越多，垂直结构越丰富。天然植被一般按类型有规律地分布在适宜其生长的地方，并具有适应当地环境的特征，所以它对环境有一定的指示作用。</p>
    <p class="q-n">→ 这段是 <b>双向关系 + 一个功能</b>：<b>环境 → 植被</b>（决定分布）、<b>植被 → 环境</b>（改造水热与土壤）、
    外加一个 <b>指示作用</b>（看到椰子树就知道在热带）。答题时问"关系"，三个方向都要写，
    只写"环境决定植被"会丢掉一半分。</p>
  </div>

  <p class="gx-note">最容易忽略的是那句<b>「气温越高、降水量越多，垂直结构越丰富」</b>——
  它把"植被长什么样"和"水热条件"直接挂了钩。后面所有森林类型的特征，
  本质上都是这句话的具体展开：<b>热 + 湿 → 层次多；冷或干 → 层次少</b>。</p>

  <p class="gx-h2s" style="margin-top:18px">四种森林的判据，一张表看完（背气候区 + 一个"标志性特征"就够）：</p>
  <div style="overflow-x:auto">
  <table class="gx-cmp">
    <thead><tr><th>森林类型</th><th>气候区</th><th>标志性特征</th></tr></thead>
    <tbody>
      <tr><td>热带雨林</td><td>热带雨林气候区、热带季风气候区</td><td>全年旺盛生长、深绿色；种类丰富、<b>垂直结构复杂</b>；藤本附生多，常见茎花、板根</td></tr>
      <tr><td>常绿阔叶林</td><td>亚热带季风气候区、亚热带湿润气候区</td><td>森林常绿、<b>多革质叶片</b>；花期集中在春末夏初；垂直结构较简单</td></tr>
      <tr class="key"><td>落叶阔叶林</td><td>温带季风气候区、温带海洋性气候区</td><td>叶片宽阔；<b>春季发叶、秋冬季落叶</b>，季相变化明显</td></tr>
      <tr><td>亚寒带针叶林</td><td>亚欧大陆和北美大陆的亚寒带地区</td><td>以松、杉类为主；<b>叶片缩小为针状</b>，以抗寒抗旱</td></tr>
    </tbody>
  </table>
  </div>
  <p class="gx-note">高亮那一行是四种里<b>唯一有"季相变化"</b>的：夏绿冬枯、一眼能看出来。
  考试给照片时，<b>看有没有落叶</b>是最快的判据——有落叶就不是常绿，没落叶再看叶子是革质还是针状。</p>
</section>

  <p class="gx-h2s">四张图：怎么认森林、草原和荒漠差在哪、层次怎么数、植被怎么反过来改环境。</p>

    冬春有没有光秃期。<b>热带雨林靠"层次多 + 藤本附生"</b>认，<b>落叶阔叶林靠"冬季落叶"</b>认，
    中间两种看叶子厚不厚。</p>

  <!-- 图2 草原与荒漠 -->

    <p class="fig-s">课本的判据只有一句：<b>水分条件不能满足森林生长 → 草原；水分更少 → 荒漠</b>。
    草原的主角是草本，<b>根系密而浅</b>；荒漠的主角是旱生灌木，<b>根系极深极广</b>，把水"抢"在手里。
    两者的区别不在"有没有绿色"，而在<b>谁是主角、根往哪长</b>。</p>

  <!-- 图3 垂直结构 -->
  <figure class="gx-fig">
    <div class="fig-cap">
      <span class="fig-no">图 3</span><span class="fig-t">垂直结构：层数就是水热条件的"体温计"</span>
      <span class="bdg bdg-diff">辨析</span>
    </div>
    <p class="fig-s">同一片森林里，不同高度的植物为了<b>争夺阳光</b>，长成一层层的，这就是<b>垂直结构</b>。
    课本的规律是：<b>气温越高、降水越多，垂直结构越丰富</b>。所以从热带雨林到亚寒带针叶林，
    层数是一路减少的——这也是判断"这片林子在哪"的间接证据。</p>

    <p class="gx-take"><b>层数多 = 水热条件好</b>。热带雨林 4–5 层且藤本附生多，常绿阔叶林 3–4 层，
    落叶阔叶林 2–3 层且<b>草本层冬季消失</b>。所以"垂直结构"既是特征，也是判据。</p>
    <p class="gx-note">别把"层数多"理解成"树多"。雨林的乔木密度未必比人工林大，
    但<b>不同高度的植物分层明确</b>——层次是"结构"，不是"数量"。</p>

    <p class="ex-q">三个考察点的资料如下：<br>
    ① 甲：大兴安岭北部，年均温约 −2 ℃，年降水量约 450 mm；<br>
    ② 乙：海南岛中部，年均温约 24 ℃，年降水量约 1800 mm；<br>
    ③ 丙：内蒙古中部，年均温约 6 ℃，年降水量约 300 mm。<br><br>
    （1）分别指出三地的天然植被类型。<br>
    （2）说明甲、乙两地植被垂直结构差异的原因。<br>

    <ol class="steps" id="gxSteps">

        <p class="s-b">把三组数据按两条线排一排：<b>450 mm、1800 mm 都超过 400 mm</b>（能长树），
        <b>300 mm 落在 200–400 mm 之间</b>（只能是草原）。再看温度：甲年均温 −2 ℃ 极冷，乙 24 ℃ 终年高温，
        丙 6 ℃ 温和。<b>先用水分定大类，再用温度定小类</b>，顺序不能反。</p>
        <p class="s-k">用到：水分条件决定森林/草原/荒漠；热量决定森林的具体类型</p>
      </li>
      <li class="step" hidden>
        <p class="s-h">第 2 步 · 对号入座</p>
        <p class="s-b">乙：高温多雨 → <b>热带雨林</b>；甲：冷、降水不算多 → <b>亚寒带针叶林</b>；
        丙：年降水 300 mm，不够长树但能长草 → <b>温带草原</b>。
        注意甲<b>不能写"温带落叶阔叶林"</b>——年均温 −2 ℃ 已经在亚寒带，阔叶树扛不住。</p>
        <p class="s-k">用到：四种森林的气候区对应</p>
      </li>
      <li class="step" hidden>
        <p class="s-h">第 3 步 · 解释"为什么层次不一样"</p>
        <p class="s-b">课本的原话是：<b>气温越高、降水量越多，植被高度越大，植物种的数量越多，垂直结构越丰富</b>。
        乙地水热条件远好于甲地，所以植物种类多、植株高大、可以分出多层；甲地冷、生长期短，
        只有耐寒的针叶树能活，种类少，自然就只有一两层。<b>要写"水热条件"四个字，不能只写"气候不同"。</b></p>
        <p class="s-k">用到：环境对植被的作用（水热 → 高度、种类、垂直结构）</p>
      </li>
      <li class="step" hidden>
        <p class="s-h">第 4 步 · 用根系解释"草原为什么是草原"</p>
        <p class="s-b">丙地是草原，主角是草本，根系<b>密而浅</b>，集中在表层 20–40 cm。

<script>
/* 植被 · 讲义交互（等 page.js 把 #md 渲染成正文之后再跑） */
document.addEventListener("DOMContentLoaded", function () {

  function el(tag, attrs, parent) {

    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }
  function n1(v) { return (Math.round(v * 10) / 10).toString(); }

  if (!$("gxStage")) return;

  /* ================= 手机的图放大 ================= */

    function close() { zoom.hidden = true; document.body.style.overflow = ""; }
    zoom.addEventListener("click", function (e) {
      if (e.target === zoom || e.target.classList.contains("gx-zoom-x")) close();

      if (e.key === "Escape" && !zoom.hidden) close();

  /* ================= 分步揭示 ================= */

    paint();
    btn.addEventListener("click", function () {
      if (i < steps.length) { steps[i].hidden = false; i++; }

        if (ans) ans.hidden = false;

    });
  })();

  /* ================= 互动：降水 → 植被 ================= */
  (function () {
    var stage = $("gxStage"), gVeg = $("gxVeg"), gAxis = $("gxAxis");
    var sl = $("gxSl"), vP = $("gxVp"), vA = $("gxVa"), vS = $("gxVs"), vSn = $("gxVsn"), box = $("gxStBox");

    var WIDE = {
      vb: "0 0 880 360", FS: 1, k: 1,
      veg: { x: 20, y: 20, w: 500, h: 320, gy: 215 },
      ax: { x: 556, y: 210, w: 296 }, bp: 620
    };
    var NARROW = {
      vb: "0 0 360 560", FS: 1.2, k: 0.8,
      veg: { x: 6, y: 16, w: 348, h: 300, gy: 196 },
      ax: { x: 16, y: 420, w: 328 }, bp: 620
    };
    var L = WIDE, FS = 1, P = 450, dragging = false, R = {};

    function tx(x, y, s, col, anchor, size, weight, halo) {
      var o = { x: n1(x), y: n1(y), "font-size": (size || 10.5) * FS, fill: col,
                "text-anchor": anchor || "start", "font-weight": weight || 400 };
      if (halo) o["class"] = "halo";
      var t = el("text", o, null);
      t.textContent = s;
      return t;
    }

    function build() {
      gVeg.textContent = ""; gAxis.textContent = "";
      var V = L.veg, A = L.ax;

      /* 天空与土 */
      el("rect", { x: V.x, y: V.y, width: V.w, height: V.gy - V.y, fill: "#fbfcfd" }, gVeg);
      el("rect", { x: V.x, y: V.gy, width: V.w, height: V.y + V.h - V.gy, fill: "#efe6d4" }, gVeg);
      el("line", { x1: V.x, y1: V.gy, x2: V.x + V.w, y2: V.gy, stroke: "#c9bda3", "stroke-width": 1.6 }, gVeg);
      var t1 = tx(V.x + 8, V.y + 16, "地表以上：植被", "#9aa3ae", "start", 10);
      gVeg.appendChild(t1);
      var t2 = tx(V.x + 8, V.y + V.h - 10, "地表以下：根系", "#a8987c", "start", 10);
      gVeg.appendChild(t2);

      /* 轴线 */
      var ay = A.y, aw = A.w;
      var seg = [[0, 200, "#f3e4c4", "荒漠"], [200, 400, "#dceccf", "草原"], [400, 1000, "#bcdcb8", "森林"]];
      seg.forEach(function (s) {
        var x1 = A.x + s[0] / 1000 * aw, x2 = A.x + s[1] / 1000 * aw;
        el("rect", { x: n1(x1), y: ay - 16, width: n1(x2 - x1), height: 32, fill: s[2] }, gAxis);
        var lb = tx((x1 + x2) / 2, ay + 5, s[3], "#3a3a35", "middle", 11, 700);
        gAxis.appendChild(lb);
      });
      el("line", { x1: A.x, y1: ay + 16, x2: A.x + aw, y2: ay + 16, stroke: "#c9c2b0", "stroke-width": 1.2 }, gAxis);
      [200, 400].forEach(function (v) {
        var xx = A.x + v / 1000 * aw;
        el("line", { x1: n1(xx), y1: ay - 22, x2: n1(xx), y2: ay + 16,
                     stroke: "#5a6472", "stroke-width": 1, "stroke-dasharray": "4 3" }, gAxis);
        var lt = tx(xx, ay + 34, v + " mm", "#5a6472", "middle", 10, 700);
        gAxis.appendChild(lt);
      });
      var t0 = tx(A.x, ay + 34, "0", "#9aa3ae", "middle", 10);
      gAxis.appendChild(t0);
      var t9 = tx(A.x + aw, ay + 34, "1000 mm", "#9aa3ae", "end", 10);
      gAxis.appendChild(t9);
      var cap = tx(A.x, ay + 52, "年降水量（mm）→", "#5a6472", "start", 10);
      gAxis.appendChild(cap);

      R.cursor = el("path", { fill: "#b8402f" }, gAxis);
      R.cline = el("line", { stroke: "#b8402f", "stroke-width": 1.6 }, gAxis);
      R.txt = el("text", { "font-size": 11 * FS, fill: "#b8402f", "font-weight": 700,

    }

    function shrub(x, y, h, col, rootD, g) {
      el("path", { d: "M " + n1(x) + " " + n1(y) + " L " + n1(x) + " " + n1(y - h * 0.55),
                   stroke: "#8a7a55", "stroke-width": 2.4, fill: "none" }, g);
      el("path", { d: "M " + n1(x) + " " + n1(y - h * 0.5) + " L " + n1(x - h * 0.42) + " " + n1(y - h)
                   + " M " + n1(x) + " " + n1(y - h * 0.5) + " L " + n1(x + h * 0.42) + " " + n1(y - h * 0.92),
                   stroke: "#8a7a55", "stroke-width": 2, fill: "none", "stroke-linecap": "round" }, g);
      el("circle", { cx: n1(x - h * 0.42), cy: n1(y - h), r: n1(h * 0.16), fill: col }, g);
      el("circle", { cx: n1(x + h * 0.42), cy: n1(y - h * 0.92), r: n1(h * 0.15), fill: col }, g);
      el("path", { d: "M " + n1(x) + " " + n1(y) + " L " + n1(x) + " " + n1(y + rootD)
                   + " M " + n1(x) + " " + n1(y + rootD * 0.4) + " L " + n1(x - rootD * 0.75) + " " + n1(y + rootD)
                   + " M " + n1(x) + " " + n1(y + rootD * 0.55) + " L " + n1(x + rootD * 0.7) + " " + n1(y + rootD),
                   stroke: "#b08b5e", "stroke-width": 1.5, fill: "none", "stroke-linecap": "round" }, g);
    }

    function grass(x, y, h, col, rootD, g) {
      var i, dx;
      for (i = -3; i <= 3; i++) {
        dx = i * (h * 0.15);
        el("path", { d: "M " + n1(x) + " " + n1(y) + " Q " + n1(x + dx * 0.4) + " " + n1(y - h * 0.62)
                     + " " + n1(x + dx) + " " + n1(y - h * (1 - Math.abs(i) * 0.07)),
                     stroke: col, "stroke-width": 2, fill: "none", "stroke-linecap": "round" }, g);
      }
      for (i = -1; i <= 1; i++) {
        dx = i * (h * 0.22);
        el("path", { d: "M " + n1(x) + " " + n1(y) + " L " + n1(x + dx) + " " + n1(y + rootD),
                     stroke: "#b08b5e", "stroke-width": 1.2, fill: "none" }, g);
      }
    }

    function tree(x, y, h, col, rootD, g) {
      el("path", { d: "M " + n1(x) + " " + n1(y) + " L " + n1(x) + " " + n1(y - h * 0.58),
                   stroke: "#7a6a4e", "stroke-width": 5, "stroke-linecap": "round" }, g);
      el("ellipse", { cx: n1(x), cy: n1(y - h * 0.74), rx: n1(h * 0.24), ry: n1(h * 0.22), fill: col }, g);
      el("ellipse", { cx: n1(x - h * 0.14), cy: n1(y - h * 0.66), rx: n1(h * 0.16), ry: n1(h * 0.15), fill: col, opacity: 0.92 }, g);
      el("ellipse", { cx: n1(x + h * 0.15), cy: n1(y - h * 0.86), rx: n1(h * 0.15), ry: n1(h * 0.14), fill: col, opacity: 0.92 }, g);
      el("path", { d: "M " + n1(x) + " " + n1(y) + " L " + n1(x) + " " + n1(y + rootD)
                   + " M " + n1(x) + " " + n1(y + rootD * 0.3) + " L " + n1(x - rootD * 0.8) + " " + n1(y + rootD * 0.9)
                   + " M " + n1(x) + " " + n1(y + rootD * 0.4) + " L " + n1(x + rootD * 0.8) + " " + n1(y + rootD * 0.85),
                   stroke: "#b08b5e", "stroke-width": 1.6, fill: "none", "stroke-linecap": "round" }, g);
    }

    function render() {
      var V = L.veg, A = L.ax, k = L.k;

      while (g.childNodes.length > 5) g.removeChild(g.lastChild);

      var n, h, rootD, type, col, gy2;

        if (type === "shrub") shrub(px, y, hh, col, rootD, g);
        else if (type === "grass") grass(px, y, hh, col, rootD, g);
        else tree(px, y, hh, col, rootD, g);
      }

      /* 根系下界：让"土层有多空"变成可视信息 */
      el("line", { x1: n1(x0 - 10), y1: n1(y + rootD), x2: n1(x0 + w + 10), y2: n1(y + rootD),
                   stroke: "#c2b299", "stroke-width": 1, "stroke-dasharray": "5 5" }, g);
      var rl = tx(x0 + w + 10, y + rootD + 13, "根系下界", "#a8987c", "end", 9.5);
      g.appendChild(rl);

      /* 标注株高与根深 */
      var lab = tx(x0, V.y + 40, (type === "tree" ? "株高约 " + Math.round(4 + (P - 400) / 600 * 26) + " m"
                 : type === "shrub" ? "株高约 " + (0.3 + P / 200 * 0.6).toFixed(1) + " m"
                 : "株高约 " + (0.3 + (P - 200) / 200 * 0.5).toFixed(1) + " m"),

      R.cline.setAttribute("y1", n1(A.y - 17)); R.cline.setAttribute("y2", n1(A.y + 16));
      R.cursor.setAttribute("d", "M " + n1(cx) + " " + n1(A.y - 17) + " l -6 -11 l 12 0 z");
      R.txt.setAttribute("x", n1(cx));
      R.txt.setAttribute("y", n1(A.y - 33));
      R.txt.textContent = P + " mm";

      /* 数值卡 */
      var cov;
      if (P < 200) cov = 4 + P / 200 * 21;
      else if (P < 400) cov = 25 + (P - 200) / 200 * 40;
      else cov = 65 + (P - 400) / 600 * 30;
      vP.textContent = P + " mm";
      vA.textContent = Math.round(cov) + "%";

      var st, sn, cc, bg;
      if (P < 200) { st = "荒漠"; sn = "旱生灌木 · 根系深而广"; cc = "#8a5c14"; bg = "#fdf3e0"; }
      else if (P < 400) { st = "草原"; sn = "草本为主 · 根系密而浅"; cc = "#1e6640"; bg = "#e6f6ee"; }
      else { st = "森林"; sn = "乔木为主 · 层次明显"; cc = "#1e6640"; bg = "#e6f6ee"; }
      vS.textContent = st; vSn.textContent = sn;
      vS.style.color = cc;
      box.style.background = bg;
      box.style.borderColor = cc + "44";
      if (sl.value !== String(P)) sl.value = P;
    }

    function applyLayout() {
      var w = stage.parentElement.getBoundingClientRect().width;
      L = w >= WIDE.bp ? WIDE : NARROW;
      FS = L.FS;
      stage.setAttribute("viewBox", L.vb);
      build();
      render();
    }

    sl.addEventListener("input", function () { P = +this.value; render(); });
    $("gxP1").addEventListener("click", function () { P = 120; render(); });
    $("gxP2").addEventListener("click", function () { P = 300; render(); });
    $("gxP3").addEventListener("click", function () { P = 450; render(); });
    $("gxP4").addEventListener("click", function () { P = 900; render(); });

    function setFromX(clientX) {
      var bb = stage.getBoundingClientRect();
      var vbw = parseFloat(L.vb.split(" ")[2]);
      var x = (clientX - bb.left) * (vbw / bb.width);
      var frac = (x - L.ax.x) / L.ax.w;
      P = Math.max(0, Math.min(1000, Math.round((frac * 1000) / 10) * 10));
      render();
    }
    stage.addEventListener("pointerdown", function (ev) {
      dragging = true;
      try { stage.setPointerCapture(ev.pointerId); } catch (e) {}
      setFromX(ev.clientX);
    });
    stage.addEventListener("pointermove", function (ev) {
      if (!dragging) return;
      ev.preventDefault();
      setFromX(ev.clientX);
    });
    ["pointerup", "pointercancel"].forEach(function (e) {
      stage.addEventListener(e, function () { dragging = false; });
    });
    window.addEventListener("blur", function () { dragging = false; });

    var tmr = null;
    window.addEventListener("resize", function () {
      clearTimeout(tmr);
      tmr = setTimeout(applyLayout, 180);
    });

    applyLayout();
  })();
});
</script>
