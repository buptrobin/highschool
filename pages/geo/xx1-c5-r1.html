    <p class="q-b">"我国西北地区深居内陆，气候干旱，水资源短缺。近年来，一些城市为改善人居环境，大量引进原产欧洲的冷季型草坪……草坪生长旺盛期需水量大，夏季高温高湿时易发生病害，冬季枯黄，养护管理成本较高。"（要点转述，非逐字原文）</p>

  <div class="gx-ex">
    <p class="ex-t">例题<span class="bdg bdg-must">必考</span></p>
    <p class="ex-q">某西北城市年降水量约 280 mm，年蒸发量约 2 000 mm，计划在城区建设 300 万 m² 冷季型草坪，灌溉定额按 600 mm/年设计。（1）分析该计划带来的水资源压力；（2）说明冷季型草坪在当地的适应性；（3）提出替代方案并说明理由。</p>
    <ol class="steps" id="gxSteps">
      <li class="step"><p class="s-h">第 1 步 · 先立三笔账</p><p class="s-b">把材料拆成需求（300 万 m²、600 mm）、供给（降水 280 mm、蒸发 2 000 mm）、代价（水从哪来）。先不急着下"该不该种"的结论。</p><p class="s-k">用到：需求—供给—代价框架</p></li>
      <li class="step" hidden><p class="s-h">第 2 步 · 算出年需水量</p><p class="s-b">300 万 m² × 600 mm ÷ 1 000 = <b>1 800 万 m³/年</b>。若可用生态水量按 1 500 万 m³ 计，已超出约 20%；若城市生活用水为 3 000 万 m³，草坪一项就占 60%。</p><p class="s-k">用到：需水 = 面积 × 定额 ÷ 1 000</p></li>
      <li class="step" hidden><p class="s-h">第 3 步 · 算降水能顶多少</p><p class="s-b">300 万 m² × 0.28 m ≈ <b>84 万 m³</b>，只占需水的 5% 左右；缺口约 <b>1 716 万 m³</b> 必须靠地表水、地下水或调水补，这就是"挤占"的来源。</p><p class="s-k">用到：降水量换算 + 缺口分析</p></li>
      <li class="step" hidden><p class="s-h">第 4 步 · 判适应性，分季节说</p><p class="s-b">有利：冬季寒冷但冷季型草坪耐寒，绿期可达 8–9 个月；不利：夏季高温、高温高湿易发褐斑病与腐霉病，蒸发强使灌溉依赖度高；原产欧洲海洋性气候，与当地<b>水热组合不匹配</b>，部分草种还不耐盐碱。</p><p class="s-k">用到：气候—植被—水文整体性</p></li>
      <li class="step" hidden><p class="s-h">第 5 步 · 给替代方案，落到"以水定绿"</p><p class="s-b">植物：碱茅、冰草、沙打旺、柽柳、沙棘等乡土耐旱植物；工程：滴灌、喷灌、再生水回用；管理：按水资源定绿地规模、控制草坪比例、只在河岸公园等重点地段保留小面积冷季型草坪。</p><p class="s-k">用到：因地制宜 + 节水优先</p></li>

      <p class="er-w">错在：把"绿化就好"当成无条件成立，漏掉了水资源的稀缺性。</p>
    </div>
    <div class="er">

      <p class="er-v">✓ 除建设费外，还要算多年灌溉水费、修剪施肥、病虫害防治与补植费用，运维成本往往超过建设成本。</p>
      <p class="er-w">错在：只算一次性建设成本，不算全生命周期成本，更不算水的机会成本。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 冷季型草坪在西北很常见，应该算本地物种。</p>
      <p class="er-v">✓ 早熟禾、高羊茅、黑麦草原产欧洲，是引进的外来种；本地乡土草种是碱茅、冰草、沙打旺等。</p>

    </div>
    <div class="er">
      <p class="er-x">✗ 只要多浇水，冷季型草坪在西北夏天也能常绿。</p>
      <p class="er-v">✓ 夏季高温高湿易发褐斑病、腐霉病，多浇水反而加重病害与烂根；冬季枯黄由低温决定，浇水改不了。</p>
      <p class="er-w">错在：把"温度—湿度—病害"的整体性丢掉，以为水能替代气候条件。</p>
    </div>
  </div>
  <p class="gx-note">还有一条常被漏掉：<b>节水不等于少浇水</b>。节水是灌溉定额、灌溉方式（滴灌、喷灌）、植物选择一起改；单靠减量，草要么旱死、要么靠补植回填，总耗水反而更高。五条错句对应五个必答要点：水资源约束、全成本、物种来源、尺度分寸、整体性。</p>
</section>

  数据口径：降水 200–400 mm、灌溉定额 600–800 mm/年、蒸发约 2 000 mm 为教材与常见资料的量级值；互动中的 1 500 万 m³ 生态水量、3 000 万 m³ 生活用水、300 万 m² 面积均为教学示意值，仅用于比较。

<div class="gx-zoom" id="gxZoom" hidden>
  <span class="gx-zoom-tip">双指放大 · 左右滑动看全图</span>
  <button class="gx-zoom-x" type="button" aria-label="关闭">✕</button>

<script src="../../assets/gx.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var GX = window.GX, el = GX.el, tx = GX.tx, $ = GX.$, clamp = GX.clamp;
  var stage = $("gxStage");

  if (stage) {
    var WIDE = {
      vb: "0 0 880 440", fs: 1,
      left: { x: 24, y: 24, w: 396, h: 392 }, lt: [48, 60],
      grid: { x: 54, y: 96, cell: 60, gap: 9, cols: 5 },
      res: { x: 54, y: 268, w: 336, h: 52 }, rn: [54, 348],
      right: { x: 440, y: 24, w: 416, h: 392 }, rt: [462, 60],
      plot: { x: 520, y: 104, w: 300, h: 250 }, barW: 96
    };
    var NARROW = {
      vb: "0 0 360 560", fs: 0.94,
      left: { x: 12, y: 12, w: 336, h: 240 }, lt: [28, 40],
      grid: { x: 32, y: 64, cell: 48, gap: 8, cols: 5 },
      res: { x: 32, y: 196, w: 272, h: 36 }, rn: [32, 236],
      right: { x: 12, y: 264, w: 336, h: 284 }, rt: [28, 292],
      plot: { x: 78, y: 330, w: 220, h: 180 }, barW: 66
    };
    var MAXV = 4000, AVAIL = 1500, LIFE = 3000, CELL = 50;
    var L = WIDE, A = 300, Q = 500;
    var REF = { cells: [] };

    function yOf(v) { return L.plot.y + L.plot.h - Math.min(v, MAXV) / MAXV * L.plot.h; }

    function build() {
      var gA = $("gxA"), gB = $("gxB");
      gA.textContent = ""; gB.textContent = "";
      REF.cells = [];
      var f = L.fs, pad = 10;

      el("rect", { x: L.left.x, y: L.left.y, width: L.left.w, height: L.left.h, rx: pad, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
      tx(gA, L.lt[0], L.lt[1], "① 草坪与水源（示意）", "#151a21", "start", 11 * f, 700);
      tx(gA, L.lt[0], L.lt[1] + 18, "每格 = 50 万 m² 草坪", "#7a8896", "start", 8.6 * f, 400);

      for (var k = 0; k < 10; k++) {
        var gx = L.grid.x + (k % L.grid.cols) * (L.grid.cell + L.grid.gap);
        var gy = L.grid.y + Math.floor(k / L.grid.cols) * (L.grid.cell + L.grid.gap);
        el("rect", { x: gx, y: gy, width: L.grid.cell, height: L.grid.cell, rx: 4, fill: "#eef2f5", stroke: "#dde4ea" }, gA);
        REF.cells.push(el("rect", { x: gx, y: gy, width: L.grid.cell, height: L.grid.cell, rx: 4, fill: "#dff3e4", stroke: "#b9dcc6", opacity: 0 }, gA));
        tx(gA, gx + L.grid.cell - 5, gy + L.grid.cell - 5, "50", "#9aa8b4", "end", 7.4 * f, 400);
      }

      el("rect", { x: L.res.x, y: L.res.y, width: L.res.w, height: L.res.h, rx: 5, fill: "#ffffff", stroke: "#b8d8e8" }, gA);
      REF.water = el("rect", { x: L.res.x + 1, y: L.res.y + 1, width: L.res.w - 2, height: L.res.h - 2, rx: 4, fill: "#7fb8d6" }, gA);
      tx(gA, L.res.x, L.res.y - 7, "可用生态水量 " + AVAIL + " 万 m³", "#0b6580", "start", 8.6 * f, 700);
      REF.resTxt = tx(gA, L.res.x + L.res.w / 2, L.res.y + L.res.h / 2 + 3, "", "#ffffff", "middle", 10 * f, 700);
      tx(gA, L.rn[0], L.rn[1], "水位越低，能留给河流与湿地的水越少", "#b8402f", "start", 8.4 * f, 400);

      el("rect", { x: L.right.x, y: L.right.y, width: L.right.w, height: L.right.h, rx: pad, fill: "#f8fbfd", stroke: "#dbe7ef" }, gB);
      tx(gB, L.rt[0], L.rt[1], "② 年需水 vs 可用水量（万 m³）", "#151a21", "start", 11 * f, 700);

      var p = L.plot;
      el("line", { x1: p.x, y1: p.y + p.h, x2: p.x + p.w, y2: p.y + p.h, stroke: "#c9d6e0" }, gB);
      var ticks = [0, 1000, 2000, 3000, 4000];
      for (var t = 0; t < ticks.length; t++) {
        var ty = yOf(ticks[t]);
        el("line", { x1: p.x, y1: ty, x2: p.x + p.w, y2: ty, stroke: "#eef2f6" }, gB);
        tx(gB, p.x - 6, ty + 3.5, String(ticks[t]), "#8a96a3", "end", 8 * f, 400);
      }

      var lineY = yOf(AVAIL);
      el("line", { x1: p.x, y1: lineY, x2: p.x + p.w, y2: lineY, stroke: "#1e6640", "stroke-width": 1.6, "stroke-dasharray": "5 4" }, gB);
      tx(gB, p.x + 6, lineY - 7, "可用生态水量 1 500", "#1e6640", "start", 8.4 * f, 700);

      var cx = p.x + p.w / 2;
      REF.bar = el("rect", { x: cx - L.barW / 2, y: p.y + p.h, width: L.barW, height: 0, rx: 3, fill: "#e0a33a" }, gB);
      REF.barTxt = tx(gB, cx, p.y + p.h - 8, "", "#151a21", "middle", 10 * f, 700);
      tx(gB, cx, p.y + p.h + 16, "草坪年灌溉需水", "#55616d", "middle", 8.6 * f, 400);
      tx(gB, p.x + p.w, p.y + p.h + 30, "柱 = 需水　虚线 = 可用", "#7a8896", "end", 7.8 * f, 400);
    }

    function render() {
      var need = A * Q / 1000;
      var filled = clamp(Math.round(A / CELL), 0, 10);
      var used = need / AVAIL;
      var level = need <= 0 ? 1 : clamp(AVAIL / need, 0, 1);

      for (var k = 0; k < REF.cells.length; k++) {
        REF.cells[k].setAttribute("opacity", k < filled ? 1 : 0);
      }
      var wh = Math.max(0, (L.res.h - 2) * level);
      REF.water.setAttribute("height", wh);
      REF.water.setAttribute("y", L.res.y + L.res.h - 1 - wh);
      REF.resTxt.textContent = need <= 0 ? "满库" : "剩余 " + Math.round(level * 100) + "%";

      var st, col, bg;
      if (need <= AVAIL * 0.8) { st = "可承受"; col = "#1e6640"; bg = "#e6f6ee"; }
      else if (need <= AVAIL) { st = "接近上限"; col = "#a26a10"; bg = "#fdf3e2"; }
      else { st = "超出水资源"; col = "#b8402f"; bg = "#fbeae7"; }

      var top = yOf(need);
      REF.bar.setAttribute("y", top);
      REF.bar.setAttribute("height", Math.max(1, yOf(0) - top));
      REF.bar.setAttribute("fill", col);
      var vy = Math.max(L.plot.y + 12, top - 8);
      REF.barTxt.setAttribute("y", vy);
      REF.barTxt.setAttribute("fill", top <= L.plot.y + 26 ? "#ffffff" : "#151a21");
      REF.barTxt.textContent = Math.round(need);

      $("gxVa").textContent = String(Math.round(A));
      $("gxVb").textContent = Math.round(need).toLocaleString("en-US").replace(/,/g, " ");
      $("gxVc").textContent = String(Math.round(need / LIFE * 100));
      $("gxVs").textContent = st;
      $("gxVsn").textContent = "生态水已用 " + Math.round(used * 100) + "%";
      $("gxStBox").style.background = bg;
      $("gxStBox").style.borderColor = col + "44";
      $("gxVs").style.color = col;
      $("gxSl").value = String(A);
      $("gxSlLb").textContent = "草坪面积 " + Math.round(A) + " 万 m² · 定额 " + Q + " mm";
      setPressed();
    }

    function setPressed() {
      ["gxP1", "gxP2", "gxP3"].forEach(function (id) {
        var b = $(id);
        b.setAttribute("aria-pressed", String(+b.getAttribute("data-q") === Q));
        b.style.opacity = +b.getAttribute("data-q") === Q ? "1" : ".62";
      });
    }

    function applyLayout() {
      L = stage.parentElement.getBoundingClientRect().width >= 640 ? WIDE : NARROW;
      stage.setAttribute("viewBox", L.vb);
      build(); render();
    }

    $("gxSl").addEventListener("input", function () { A = +this.value; render(); });
    ["gxP1", "gxP2", "gxP3"].forEach(function (id) {
      $(id).addEventListener("click", function () { Q = +this.getAttribute("data-q"); render(); });
    });
    stage.addEventListener("keydown", function (ev) {
      if (ev.key !== "ArrowLeft" && ev.key !== "ArrowRight") return;
      ev.preventDefault();
      A = clamp(A + (ev.key === "ArrowRight" ? 10 : -10), 0, 500);
      render();
    });
    var tmr = null;
    window.addEventListener("resize", function () {
      clearTimeout(tmr); tmr = setTimeout(applyLayout, 180);
    });
    applyLayout();
  }

  var steps = Array.prototype.slice.call(document.querySelectorAll("#gxSteps .step"));
  var nextBtn = $("gxNext"), cnt = $("gxCnt"), ans = $("gxAns");
  if (steps.length && nextBtn) {
    var i = 0;
    function paint() {
      steps.forEach(function (s, k) { s.hidden = k > i; });
      cnt.textContent = (i + 1) + " / " + steps.length;
      nextBtn.textContent = i < steps.length - 1 ? "下一步" : (ans.hidden ? "看答案" : "重做");
    }
    nextBtn.addEventListener("click", function () {
      if (i < steps.length - 1) { i++; paint(); return; }
      if (ans.hidden) { ans.hidden = false; } else { ans.hidden = true; i = 0; paint(); }
      paint();
    });
    paint();
  }
});
</script>
