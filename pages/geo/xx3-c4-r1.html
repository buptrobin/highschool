<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先记住链子，再看每一步的关键动作。</p>

<div class="gx-quote">
  <p class="q-t">课本怎么说 · 问题研究栏目<span class="q-src">人教版（2019）选择性必修3 · 第四章「保障国家安全的资源、环境战略与行动」</span></p>
  <p class="q-b">教材在本章「问题研究」中给出的研究思路是：明确调查目的 → 设计调查问卷 → 确定调查对象（抽样）→ 发放与回收问卷 → 整理与分析数据 → 提出结论与建议。</p>
  <p class="q-n">→ 翻成人话：问卷调查不是"发张纸问一问"，而是<b>六个环节串成的一条链</b>。前一环的产出物就是后一环的输入，任何一环偷工，后面的百分比都只是"看起来精确的数字"。</p>
</div>
<p class="gx-note">上列步骤按教材「问题研究」栏目的思路归纳整理，引用时以课本原文为准。近三年各地模拟卷把这一节考成"调查方法评价题"：给你一段调查描述，让你挑毛病、算回收率、提改进意见——<b>考的全是流程，不是结论</b>。</p>

<div style="overflow-x:auto">
<table class="gx-cmp">
  <thead><tr><th>比什么</th><th>问卷调查法</th><th>访谈法</th><th>观察法</th></tr></thead>
  <tbody>
    <tr><td>能拿到什么</td><td>态度、认知、意愿（"怎么想"）</td><td>深层原因，可追问</td><td>实际行为（"怎么做"）</td></tr>
    <tr><td>样本规模</td><td>大，几百到几千份</td><td>小，十几人</td><td>小，几个点位</td></tr>

<p class="gx-note">这张表最容易背错的是最后一行：<b>问态度只能靠问，问不出行为</b>。学生问卷里"我每次都分类"的比例，永远高于桶里的实际分类率——这不是学生撒谎，是"自报"和"实测"本就是两个量。</p>

  <p class="ex-q">某中学地理小组研究"中学生资源、环境安全意识"，在本校发放问卷 500 份，回收 380 份。统计发现，其中 62% 的学生认为垃圾分类"很有必要"。请回答：（1）指出该调查在设计上的不足；（2）计算回收率，并说明它对结论的影响；（3）提出两条改进建议。</p>
  <ol class="steps" id="gxSteps">
    <li class="step"><p class="s-h">第 1 步 · 先把回收率算出来</p><p class="s-b">380÷500＝0.76，回收率 76%。这是全题唯一能算的数，先拿到手，后面所有讨论才有落点。</p><p class="s-k">用到：回收率＝回收份数÷发放份数</p></li>
    <li class="step" hidden><p class="s-h">第 2 步 · 判断 76% 合不合格</p><p class="s-b">76% 高于调查方法学常用的 70% 经验下限，不算失败；但仍有 120 份没回来。关键不是"少了 120 份"，而是这 120 份<b>可能和回来的 380 份不一样</b>——对环境问题不关心的人更可能不填。这种差异会把 62% 系统性地抬高。</p><p class="s-k">用到：无回答偏差（未回收者与已回收者态度不同）</p></li>
    <li class="step" hidden><p class="s-h">第 3 步 · 挑不足之一：抽样</p><p class="s-b">只在一所中学发放，属<b>方便抽样／整群抽样</b>：样本只代表"本校"，不能推及全市；材料也没交代年级、性别、城乡结构，无法判断样本与总体是否一致。500 份看着不少，但同班同校的学生同质性高，<b>有效样本远小于 500</b>。</p><p class="s-k">用到：代表性 ≠ 数量多</p></li>

  if (e > 8) { st = "误差过大"; col = "#b8402f"; bg = "#fbeae7"; sub = "结论只能描述这份样本"; }
  else if (!can) { st = "基本可用"; col = "#b7791f"; bg = "#fff8e6"; sub = "可描述总体，慎做细分"; }
  else { st = "精度较高"; col = "#1e6640"; bg = "#e6f6ee"; sub = "达到分城市比较门槛"; }
  $("gxVs").textContent = st;
  $("gxVsn").textContent = sub;
  var box = $("gxStBox");
  box.style.background = bg;
  box.style.borderColor = col + "44";
  $("gxVs").style.color = col;
  $("gxSl").value = String(N);
}

function applyLayout() {
  L = stage.parentElement.getBoundingClientRect().width >= 640 ? WIDE : NARROW;
  stage.setAttribute("viewBox", L.vb);
  build(); render();
}

$("gxSl").addEventListener("input", function () { N = Math.round(+this.value); render(); });
$("gxP1").addEventListener("click", function () { N = 400; render(); });
$("gxP2").addEventListener("click", function () { N = 1067; render(); });
stage.addEventListener("keydown", function (ev) {
  if (ev.key === "ArrowLeft" || ev.key === "ArrowRight") {
    ev.preventDefault();
    N = GX.clamp(N + (ev.key === "ArrowRight" ? 10 : -10), 30, 3000);
    render();
  }
});
var tmr = null;
window.addEventListener("resize", function () {
  clearTimeout(tmr); tmr = setTimeout(applyLayout, 180);
});
applyLayout();
});
</script>
</body>
</html>
