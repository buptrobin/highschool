<h2><span class="sn">01</span>课本怎么说<span class="bdg bdg-must">必考</span></h2>
<p class="gx-h2s">先背标准表述，再看解释。</p>
<div class="gx-quote">
<p class="q-t">课本原话 · 为什么必须合作<span class="q-src">人教版（2019）选择性必修3 · 第四章第三节</span></p>
<p class="q-b">全球性资源、环境问题……影响范围广、持续时间长，<b>任何一个国家都无法独自解决</b>，必须加强国际合作。（节选）</p>
<p class="q-n">→ 判断一道题该不该答"国际合作"，看三条——问题<b>跨不跨国界</b>、后果<b>跨不跨代</b>、代价是不是<b>落在没受益的人头上</b>。三条占一条，单国方案就不成立。</p>
</div>
<div style="overflow-x:auto">

<tr><td><b>跨国界</b></td><td>气候变暖、海洋塑料、跨境河流污染：排放国和受害国不是同一国</td><td>治理成本一国付、降温收益全球享，谁先付谁吃亏</td></tr>
<tr><td><b>跨代际</b></td><td>臭氧层破坏、生物多样性丧失：后果延后几十年才显现</td><td>做决定的人不承担后果，市场也不为"未来"定价</td></tr>
<tr><td><b>外部性强</b></td><td>上游排污下游受害；一国减排、全球降温</td><td>成本留在国内、收益溢出国外，必须有外部约束</td></tr>
<tr class="key"><td>三条同时成立</td><td>全球性"公地"问题</td><td>只能靠集体行动：定目标、分责任、给钱给技术、查履约</td></tr>

<p class="gx-note">最容易背错的是"跨代际"——重点不是"时间长"，而是<b>做决定的人和承担后果的人不是同一批人</b>。</p>
<div class="gx-quote">
<p class="q-t">课本原话 · 合作的原则<span class="q-src">人教版（2019）选择性必修3 · 第四章第三节</span></p>
<p class="q-b">发达国家与发展中国家对全球资源、环境问题负有<b>共同但有区别的责任</b>；发达国家应向发展中国家提供<b>资金和技术</b>支持。（节选）</p>
<p class="q-n">→ <b>共同</b>＝都要减排、都要履约；<b>有区别</b>＝力度、时间表和出钱出技术的份额不同。依据是<b>历史累积排放</b>与<b>现实能力</b>，不是"穷就不做"。</p>
</div>

<p class="gx-h2s">五问，每问一句话答案。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「国际合作就是发达国家给发展中国家援助吗？」</p>
<p class="a">不是。合作是各国对全球公地的<b>共同治理</b>：都要减排、都要履约；资金与技术是发达国家依"共同但有区别的责任"承担的义务，不是恩赐。</p>

<text class="ms" x="22" y="82" style="fill:#1e6640">✓ 双向：共同履约</text>
<line x1="26" y1="96" x2="206" y2="96" stroke="#1e6640"/><polygon points="206,92 214,96 206,100" fill="#1e6640"/>

</div>
<div class="qac">
<p class="q">「小岛国排放只占 0.02%，为什么也要减排、也要参会？」</p>
<p class="a">占比小不等于责任为零——"共同"就是所有国家都行动；参会才有<b>话语权</b>，才能把损失与损害、资金技术支持写进议程。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="排放占比极小与受损极重的对比">

<text class="ms" x="22" y="116" style="fill:#1e6640">细到看不见，却先被淹</text>
</svg>
</div>
<div class="qac">
<p class="q">「签署了国际公约，减排就一定有约束力吗？」</p>
<p class="a">不一定。气候公约以<b>国家自主贡献</b>为核心，靠透明度、盘点和声誉形成"软约束"，无超国家机构处罚。执行较好的是《蒙特利尔议定书》——有淘汰时间表与资金机制。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="公约有目标但强制力有限">

<text class="ms" x="104" y="44" style="fill:#1e6640">✓ 有目标、有盘点</text>
<text class="ms" x="104" y="68" style="fill:#b8402f">✗ 无强制罚则</text>

<p class="q">「"共同但有区别的责任"＝发展中国家可以先不减排？」</p>
<p class="a">理解反了。<b>共同</b>：都要行动、都要履约；<b>有区别</b>：力度、时间与出资份额不同。发展中国家也要减排，只是时间表更晚、可优先保障发展。</p>

<p class="a">因为减排<b>成本落在本国</b>（能源转型、产业调整），而降温<b>收益全球共享</b>，不减排的国家照样享受。人人都想当 B 国，所以需要监督与激励。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="搭便车：一国付费他国受益">

<p class="gx-note">这五问是同一件事：<b>全球公地的成本与收益错位</b>——它决定了必须合作，也决定了合作为什么难。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<p class="er-x">✗ 减排责任应该按国家数量或人口平均分摊</p>
<p class="er-v">✓ 责任要综合考虑历史累积排放、当前人均排放、发展阶段与现实能力，即"共同但有区别的责任"和"各自能力"原则。</p>
<p class="er-w">错在哪：漏掉"历史排放"这一依据；平均分摊让排放最少的国家付最大代价。</p>

<div class="er">
<p class="er-x">✗ 只要签署了国际公约，减排就具有法律约束力</p>

<p class="er-w">错在哪：把"政治承诺"当成"法律强制"，于是解释不了履约难、监督弱。</p>

<div class="er">

<p class="er-w">错在哪：只读"区别"漏掉"共同"，把原则读成了免责条款。</p>

tx(gB, p.x0 - 7, p.yTop - 8, "℃", "#3a3a35", "end", 8.2 * L.fs, 500);
REF.dot = el("circle", {
cx: px(F), cy: py(4.0 - 0.025 * F), r: 5.5, fill: "#b8402f", stroke: "#fff", "stroke-width": 1.6
}, gB);
REF.tag = tx(gB, px(F) + 9, py(4.0 - 0.025 * F) - 9, "", "#b8402f", "start", 9 * L.fs, 700);
}
function render() {
var T = 4.0 - 0.025 * F;
var miss = Math.round(195 * (T - 1.5) / 2.5);
if (miss < 0) { miss = 0; }
var st, sn, col, bg;
if (T >= 3.0) { st = "失控"; sn = "升温 ≥ 3℃"; col = "#b8402f"; bg = "#fbeae7"; }
else if (T >= 2.0) { st = "接近 2℃"; sn = "仍未达标"; col = "#a06a12"; bg = "#fdf4e3"; }
else { st = "有望 1.5℃"; sn = "接近《巴黎协定》"; col = "#1e6640"; bg = "#e6f6ee"; }
REF.big.textContent = F + "%";
for (var i = 0; i < REF.cards.length; i++) {
REF.cards[i].rc.setAttribute("fill-opacity", (0.05 + 0.45 * F / 100).toFixed(3));
REF.cards[i].v.textContent = F + "%";
}
$("gxVa").textContent = String(F);
$("gxVb").textContent = T.toFixed(2);
$("gxVc").textContent = String(miss);
$("gxVs").textContent = st;
$("gxVsn").textContent = sn;
$("gxStBox").style.background = bg;
$("gxStBox").style.borderColor = col + "44";
$("gxVs").style.color = col;
var x = px(F), y = py(T);
REF.dot.setAttribute("cx", x);
REF.dot.setAttribute("cy", y);
REF.dot.setAttribute("fill", col);
REF.tag.textContent = T.toFixed(2) + "℃";
REF.tag.setAttribute("fill", col);
if (F >= 84) {
REF.tag.setAttribute("x", x - 9);
REF.tag.setAttribute("y", y + 18);
REF.tag.setAttribute("text-anchor", "end");
} else {
REF.tag.setAttribute("x", x + 9);
REF.tag.setAttribute("y", y - 9);
REF.tag.setAttribute("text-anchor", "start");
}
$("gxSl").value = String(F);
}
function applyLayout() {
L = stage.parentElement.getBoundingClientRect().width >= 640 ? WIDE : NARROW;
stage.setAttribute("viewBox", L.vb);
build();
render();
}
$("gxSl").addEventListener("input", function () { F = +this.value; render(); });
$("gxP1").addEventListener("click", function () { F = 0; render(); });
$("gxP2").addEventListener("click", function () { F = 80; render(); });
$("gxP3").addEventListener("click", function () { F = 100; render(); });
stage.addEventListener("keydown", function (ev) {
if (ev.key === "ArrowLeft" || ev.key === "ArrowRight") {
ev.preventDefault();
F = GX.clamp(F + (ev.key === "ArrowRight" ? 2 : -2), 0, 100);
render();
}
});
var tmr = null;
window.addEventListener("resize", function () {
clearTimeout(tmr); tmr = setTimeout(applyLayout, 180);
});
applyLayout();
});</script>
