  var L = WIDE, h = 0.5;

  function value(t) {
    var cap = t <= 0.8 ? 1 : 1 - 0.3 * Math.pow((t - 0.8) / 0.2, 2);
    return 100 * (1 - t) + 800 * t * cap;
  }
  function clay(t) { return 100 - 65 * t; }
  function margin(t) { return 4 + 22 * Math.pow(t, 0.7); }

  function panel(g, p) {
    el("rect", { x: p[0], y: p[1], width: p[2], height: p[3], rx: 10, fill: "#fff", stroke: "#e3ebf1" }, g);
  }

  function drawA() {
    var g = $("gxA"); g.textContent = "";
    panel(g, L.pA);
    tx(g, L.tA[0], L.tA[1], "① 产品结构（按产量）", "#151a21", "start", 11.5 * L.fs, 700);
    var low = L.aw * (1 - h), high = L.aw * h;
    el("rect", { x: L.ax, y: L.ay, width: L.aw, height: L.ah, fill: "#edf2f5", stroke: "#c9d6df" }, g);
    if (low > 0.5) el("rect", { x: L.ax, y: L.ay, width: low, height: L.ah, fill: "#9db4c4" }, g);
    if (high > 0.5) el("rect", { x: L.ax + low, y: L.ay, width: high, height: L.ah, fill: "#d98a2b" }, g);
    if (low > 70) tx(g, L.ax + low / 2, L.ay + L.ah / 2 + 4, "低端 " + Math.round((1 - h) * 100) + "%", "#17303f", "middle", 10 * L.fs, 700);
    if (high > 70) tx(g, L.ax + low + high / 2, L.ay + L.ah / 2 + 4, "高端 " + Math.round(h * 100) + "%", "#fff", "middle", 10 * L.fs, 700);
    tx(g, L.ax, L.ay + L.ah + 22, "低端 " + Math.round((1 - h) * 100) + "%", "#3f5566", "start", 9.5 * L.fs);
    tx(g, L.ax + L.aw, L.ay + L.ah + 22, "高端 " + Math.round(h * 100) + "%", "#8a4b12", "end", 9.5 * L.fs);
    tx(g, L.ax, L.ay + L.ah + 50, "低端单价 1 · 高端单价 8（示意）", "#6b6b66", "start", 9.5 * L.fs);
    tx(g, L.ax, L.ay + L.ah + 70, "总产能按 100 万件计", "#6b6b66", "start", 9.5 * L.fs);
    tx(g, L.ax, L.ay + L.ah + 90, "产值 = 低端量×1 + 高端量×8", "#6b6b66", "start", 9.5 * L.fs);
    if (L === WIDE) {
      el("rect", { x: 40, y: 252, width: 340, height: 112, rx: 8, fill: "#f8fbfd", stroke: "#e3ebf1" }, g);
      tx(g, 56, 276, "两端各看一次", "#151a21", "start", 10, 700);
      tx(g, 56, 298, "0%：产值 100、耗土 100、利润 4%", "#3f5566", "start", 9.5);
      tx(g, 56, 316, "→ 拼产量，用资源换产值", "#b8402f", "start", 9);
      tx(g, 56, 340, "100%：产值 560、耗土 35、利润 26%", "#3f5566", "start", 9.5);
      tx(g, 56, 358, "→ 容量有限，产值回落", "#1e6640", "start", 9);
    } else {
      tx(g, 24, L.ay + L.ah + 48, "低端 1 / 高端 8（示意）", "#6b6b66", "start", 8.5);
      tx(g, 24, L.ay + L.ah + 66, "总产能 100 万件", "#6b6b66", "start", 8.5);
    }
  }

  function drawB() {
    var g = $("gxB"); g.textContent = "";
    panel(g, L.pB);
    tx(g, L.tB[0], L.tB[1], "② 高端占比 → 利润 / 资源", "#151a21", "start", 11.5 * L.fs, 700);
    var x0 = L.x0, y0 = L.y0, x1 = L.x1, y1 = L.y1, W = x1 - x0, H = y1 - y0;
    var i, k, yy, xx;
    for (k = 0; k <= 4; k++) {
      yy = y0 + H * k / 4;
      el("line", { x1: x0, y1: yy, x2: x1, y2: yy, stroke: "#eef2f5" }, g);
    }
    el("line", { x1: x0, y1: y1, x2: x1, y2: y1, stroke: "#c9d6df" }, g);
    el("line", { x1: x0, y1: y0, x2: x0, y2: y1, stroke: "#c9d6df" }, g);
    el("line", { x1: x1, y1: y0, x2: x1, y2: y1, stroke: "#c9d6df" }, g);

    var xs = [0, 25, 50, 75, 100];
    for (i = 0; i < xs.length; i++) {
      xx = x0 + W * xs[i] / 100;
      el("line", { x1: xx, y1: y1, x2: xx, y2: y1 + 4, stroke: "#c9d6df" }, g);
      tx(g, xx, y1 + 18, String(xs[i]), "#6b6b66", "middle", 8.5);
    }
    var ps = [0, 10, 20, 30];
    for (i = 0; i < ps.length; i++) {
      yy = y1 - H * ps[i] / 30;
      el("line", { x1: x0 - 4, y1: yy, x2: x0, y2: yy, stroke: "#c9d6df" }, g);
      tx(g, x0 - 7, yy + 3, String(ps[i]), "#b45309", "end", 8.5);
    }
    var rs = [0, 50, 100];
    for (i = 0; i < rs.length; i++) {
      yy = y1 - H * rs[i] / 100;
      el("line", { x1: x1, y1: yy, x2: x1 + 4, y2: yy, stroke: "#c9d6df" }, g);
      tx(g, x1 + 7, yy + 3, String(rs[i]), "#0b6580", "start", 8.5);
    }
    tx(g, x0, y0 - 8, "利润率 %", "#b45309", "start", 9);
    tx(g, x1, y0 - 8, "资源 万吨", "#0b6580", "end", 9);
    tx(g, (x0 + x1) / 2, y1 + 34, "高端产品占比 %", "#3f5566", "middle", 9);

    var xc = x0 + W * 0.8;
    el("line", { x1: xc, y1: y0, x2: xc, y2: y1, stroke: "#e0b071", "stroke-dasharray": "2 5" }, g);
    tx(g, xc - 3, y0 + 12, "容量约八成", "#8a4b12", "end", 8.5);

    function curve(fy, color) {
      var d = "", j, t, x, y;
      for (j = 0; j <= 50; j++) {
        t = j / 50; x = x0 + W * t; y = fy(t);
        d += (j ? "L" : "M") + x.toFixed(1) + "," + y.toFixed(1);
      }
      el("path", { d: d, fill: "none", stroke: color, "stroke-width": 2.2, "stroke-linecap": "round" }, g);
    }
    curve(function (t) { return y1 - H * margin(t) / 30; }, "#b45309");
    curve(function (t) { return y1 - H * clay(t) / 100; }, "#0b6580");

    var xm = x0 + W * h;
    el("line", { x1: xm, y1: y0, x2: xm, y2: y1, stroke: "#8a8f98", "stroke-width": 1, "stroke-dasharray": "4 4" }, g);
    el("circle", { cx: xm, cy: y1 - H * margin(h) / 30, r: 4, fill: "#b45309", stroke: "#fff", "stroke-width": 1.5 }, g);
    el("circle", { cx: xm, cy: y1 - H * clay(h) / 100, r: 4, fill: "#0b6580", stroke: "#fff", "stroke-width": 1.5 }, g);

    tx(g, x1 - 5, y1 - H * margin(1) / 30 - 7, "26%", "#b45309", "end", 9, 700);
    tx(g, x1 - 5, y1 - H * clay(1) / 100 + 14, "35 万吨", "#0b6580", "end", 9, 700);

    el("line", { x1: x0, y1: y1 + 48, x2: x0 + 18, y2: y1 + 48, stroke: "#b45309", "stroke-width": 2.4 }, g);
    tx(g, x0 + 24, y1 + 52, "利润率", "#b45309", "start", 9.5, 700);
    el("line", { x1: x0 + 92, y1: y1 + 48, x2: x0 + 110, y2: y1 + 48, stroke: "#0b6580", "stroke-width": 2.4 }, g);
    tx(g, x0 + 116, y1 + 52, "高岭土消耗", "#0b6580", "start", 9.5, 700);
  }

  function draw() {
    drawA(); drawB();
    var v = value(h), r = clay(h), p = margin(h);
    $("gxVh").textContent = Math.round(h * 100) + "%";
    $("gxVv").textContent = String(Math.round(v));
    $("gxVr").textContent = String(Math.round(r));
    $("gxVp").textContent = p.toFixed(1);
    var st, sub, col, bg;
    if (h < 0.3) { st = "拼产量"; sub = "低价走量"; col = "#b8402f"; bg = "#fbeae7"; }
    else if (h < 0.7) { st = "结构升级"; sub = "设计与品牌在补课"; col = "#b45309"; bg = "#fdf3e3"; }
    else { st = "高端主导"; sub = h >= 0.9 ? "市场容量接近上限" : "品牌与渠道决定溢价"; col = "#1e6640"; bg = "#e6f6ee"; }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sub;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
  }

  function setH(v) {
    h = GX.clamp(v, 0, 1);
    $("gxSl").value = String(Math.round(h * 100));
    draw();
  }

  function applyLayout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? WIDE : NARROW;
    stage.setAttribute("viewBox", L.vb);
    draw();
  }

  $("gxSl").addEventListener("input", function () { setH(+this.value / 100); });
  $("gxP1").addEventListener("click", function () { setH(0.08); });
  $("gxP2").addEventListener("click", function () { setH(0.85); });
  stage.addEventListener("keydown", function (ev) {
    if (ev.key === "ArrowLeft" || ev.key === "ArrowRight") {
      ev.preventDefault();
      setH(h + (ev.key === "ArrowRight" ? 0.02 : -0.02));
    }
  });
  var tmr = null;
  window.addEventListener("resize", function () {
    clearTimeout(tmr); tmr = setTimeout(applyLayout, 180);
  });
  applyLayout();
});
</script>
</body>
</html>
