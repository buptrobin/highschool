<p class="gx-claim">台风<b>眼里</b>风最小、天最晴——但气压最低，真正撕房子的是它<b>周围那道云墙</b>。</p>
<div class="gx-meta">

<p class="gx-lede">这一节讲四种灾害：<b>洪涝、干旱、台风、寒潮</b>。它们看起来毫不相干，
但考试只用一套模板问你：<b>成因（什么天气系统）→ 时空分布（哪、哪个月）→ 危害（原生 + 次生）→ 防御（工程 + 非工程）</b>。
把这四条按顺序背下来，任何一道"分析某地某灾害"的题都能套。
换一句话说：<b>这一节考的不是四种灾害，是一条答题链。</b></p>

<!-- ================= A ================= -->
<section class="gx-sec" id="a">
  <h2><span class="sn">01</span>课本怎么说</h2>
  <p class="gx-h2s">先背标准表述，再看解释。顺序反了，答题时就写不出术语。</p>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 洪涝与干旱<span class="q-src">人教版（2019）必修第一册 · 第六章第一节</span></p>
    <p class="q-b">洪涝是由于连续性降水或短时强降水导致江河洪水泛滥、土壤水分饱和，造成城镇和农田积水、淹没的现象。
    干旱是因长时间无降水或降水异常偏少造成的空气干燥、土壤缺水的现象。</p>
    <p class="q-n">→ 两句定义只改了几个词，但方向完全相反，<b>考试就考这几个词</b>：
    <b>洪涝看"多"</b>（降水多、汇流快、排不出去），<b>干旱看"少 + 久"</b>（降水少、<b>持续时间长</b>）。
    注意干旱定义里的<b>"长时间"</b>三个字——短期少雨叫"旱情"，不叫干旱。
    另外洪涝的定义里还藏着<b>两个致灾条件</b>：降水是"老天给的"，而"泛滥、积水"是<b>地面排不掉</b>，
    所以后面讲措施时，<b>工程措施（修堤、疏浚、蓄洪）和非工程措施（预警、退耕还湖、海绵城市）各占一半</b>。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 台风<span class="q-src">人教版（2019）必修第一册 · 第六章第一节</span></p>
    <p class="q-b">台风是形成在热带或副热带海面温度在 26 ℃ 以上的广阔洋面上的热带气旋，中心附近最大风力可达 12 级或以上。</p>
    <p class="q-n">→ 这句话有<b>四个可判分的点</b>，一个都不能漏：
    <b>①热带或副热带</b>（低纬）<b>②海面温度 26 ℃ 以上</b>（要有热量和水汽）
    <b>③广阔洋面</b>（要有足够空间和地转偏向力）<b>④热带气旋</b>（本质是<b>低压涡旋</b>）。
    答题时若只写"台风是热带气旋"，<b>26 ℃ 和"海面"这两个条件就白丢了</b>——
    而"为什么台风登陆后就减弱"这道题的答案，恰恰就是这两个条件被破坏。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 寒潮<span class="q-src">人教版（2019）必修第一册 · 第六章第一节</span></p>
    <p class="q-b">寒潮是因强冷空气迅速入侵造成大范围剧烈降温，并伴有大风、雨雪、霜冻等现象的天气过程。
    我国寒潮多发生在冬半年，其标准通常是 24 小时内降温幅度达 10 ℃ 以上、最低气温降到 5 ℃ 以下。</p>
    <p class="q-n">→ 两个数字要成对记：<b>24 小时 / 10 ℃ 以上 / 最低气温 5 ℃ 以下</b>。
    注意它是<b>"天气过程"</b>，不是"一股冷空气"——<b>冷空气没达到这个标准，就只能叫"冷空气活动"</b>，
    这在选择题里是常设的坑。另外"剧烈降温"后面跟的<b>大风、雨雪、霜冻</b>是<b>伴随现象</b>，
    答"寒潮的危害"时必须把它们分条列出，不能只写"很冷"。</p>
  </div>

  <p class="gx-h2s" style="margin-top:18px">四种灾害的"成因—时空—危害"三列，背这张表比背四段话快：</p>
  <div style="overflow-x:auto">
  <table class="gx-cmp">

    <tbody>

  <h2><span class="sn">04</span>一道题走一遍</h2>

    <p class="ex-t">例题<span class="bdg bdg-must">必考</span></p>
    <p class="ex-q">某超强台风在东南沿海登陆，中心气压 915 hPa，中心附近最大风力 16 级。
    受其影响，沿海出现 8—11 级大风和特大暴雨，部分山区发生滑坡，城区多处内涝。
    登陆 12 小时后，台风强度明显减弱。<br><br>
    （1）指出该台风形成需要的主要条件。<br>
    （2）比较台风中心（眼区）与云墙处的风力大小，并说明理由。<br>
    （3）分析该台风带来的危害（分原生、次生两类）。<br>
    （4）说明台风登陆后迅速减弱的原因。</p>

    <ol class="steps" id="gxSteps">

        <p class="s-h">第 1 步 · 生成条件写成"热量 + 水汽 + 旋转"三条</p>
        <p class="s-b">台风是<b>热带气旋</b>，它的能量来自暖洋面。所以三条缺一不可：
        <b>① 广阔的暖洋面（海面温度 26 ℃ 以上）</b>，提供热量与水汽；
        <b>② 有足够的水汽供应</b>，水汽凝结释放潜热、维持上升；
        <b>③ 地转偏向力使气流旋转、辐合加强</b>（低纬才有）。
        <b>纬度太低（近赤道）地转偏向力太小，反而不易生成</b>——这一句能加分。</p>
        <p class="s-k">用到：台风的定义与形成条件</p>
      </li>
      <li class="step" hidden>
        <p class="s-h">第 2 步 · 别被"中心"两个字骗了</p>
        <p class="s-b">台风中心是<b>眼区</b>，为<b>下沉气流</b>控制，风力<b>微弱</b>、天气晴朗；
        <b>云墙（眼壁）</b>处上升气流最强、<b>气压梯度最大</b>，因而<b>风力最大</b>。
        所以答案的方向是：<b>云墙处风力大于（远大于）眼区</b>。
        理由必须落到"<b>气压梯度</b>"或"<b>眼区为下沉气流</b>"，不能只写"中心反而小"。</p>
        <p class="s-k">用到：台风的结构</p>
      </li>

        <p class="s-h">第 3 步 · 危害分两层，一层三句</p>
        <p class="s-b"><b>原生</b>：狂风（掀翻建筑、吹倒树木与电力设施）+ 暴雨（强度大、易致城市内涝）+
        <b>风暴潮</b>（海水倒灌、淹没低地）。
        <b>次生</b>：暴雨诱发<b>滑坡、泥石流</b>；内涝造成<b>交通中断、供水污染、疫病风险</b>；
        农田受淹导致减产。<b>按"风、水、潮 → 地质灾害 → 社会影响"分层写，条理分清楚。</b></p>
        <p class="s-k">用到：气象灾害的危害与次生灾害</p>
      </li>
      <li class="step" hidden>
        <p class="s-h">第 4 步 · 减弱的原因就是"燃料断了 + 摩擦大了"</p>
        <p class="s-b">登陆后，<b>①失去暖湿洋面的水汽与热量供应</b>（能量来源没了）；
        <b>②地表（山地、建筑）摩擦力增大</b>，近地面风速被削弱；
        <b>③水汽减少后凝结放热减少</b>，上升运动随之减弱。
        三句话按这个顺序写，不会漏。</p>

      <b>②充足的水汽供应</b>，水汽凝结释放潜热维持上升；

      （3）<b>原生灾害</b>：狂风（破坏建筑、树木、电力通信设施）；暴雨（造成城市内涝、洪水）；
      <b>风暴潮</b>（海水倒灌、淹没沿海低地）。<br>
      <b>次生灾害</b>：暴雨诱发<b>滑坡、泥石流</b>；内涝导致<b>交通中断、供水污染、疫病流行</b>；农田受淹、作物减产。<br>
      （4）<b>登陆后失去暖湿海洋的水汽与热量供应</b>，凝结放热减少，上升运动减弱；

      G.vline.setAttribute("x1", n1(x));

      G.vdot.setAttribute("cx", n1(x));
      G.vdot.setAttribute("cy", n1(S.gy - 4));

      var len = 4 + (v / 60) * 60;
      G.wind.setAttribute("d",
        "M " + n1(x) + " " + n1(yA) + " L " + n1(x + len) + " " + n1(yA) +
        " M " + n1(x + len) + " " + n1(yA) + " l -9 -4" +
        " M " + n1(x + len) + " " + n1(yA) + " l -9 4");
      G.windT.setAttribute("x", n1(Math.min(x + 2, S.x1 - 52)));
      G.windT.setAttribute("y", n1(yA - 8));
      G.windT.textContent = n1(v) + " m/s";

      var cx = xCh(R);
      G.cv.setAttribute("x1", n1(cx));
      G.cv.setAttribute("x2", n1(cx));
      G.cw.setAttribute("cx", n1(cx));
      G.cw.setAttribute("cy", n1(yWind(v)));
      G.cp.setAttribute("cx", n1(cx));
      G.cp.setAttribute("cy", n1(yPres(p)));
      G.cwt.setAttribute("x", n1(Math.min(cx + 7, C.x1 - 44)));
      G.cwt.setAttribute("y", n1(yWind(v) - 9));
      G.cwt.textContent = n1(v) + " / " + Math.round(p);

      vD.textContent = Math.round(R) + " km";
      vW.textContent = n1(v) + " / " + Math.round(p);
      vS.textContent = z.n;
      vSn.textContent = z.st;
      if (box) {
        box.style.background = z.n === "云墙（眼壁）" ? "#fbeae7" : "#eef6fb";
        box.style.borderColor = z.c + "44";
        var kv = box.querySelector(".v");
        if (kv) kv.style.color = z.c;
      }
      if (sl.value !== String(Math.round(R))) sl.value = String(Math.round(R));
    }

    function applyLayout() {
      var w = stage.parentElement.getBoundingClientRect().width;
      L = w >= 690 ? WIDE : NARROW;
      FS = L.FS;
      stage.setAttribute("viewBox", L.vb);
      build();
      render();
    }

    sl.addEventListener("input", function () { R = +this.value; render(); });
    $("gxP1").addEventListener("click", function () { R = 0; render(); });
    $("gxP2").addEventListener("click", function () { R = 45; render(); });
    $("gxP3").addEventListener("click", function () { R = 150; render(); });
    $("gxP4").addEventListener("click", function () { R = 400; render(); });

    function setFromX(clientX) {
      var bb = stage.getBoundingClientRect();
      var vbw = parseFloat(L.vb.split(" ")[2]);
      var xx = (clientX - bb.left) * (vbw / bb.width);
      var f = (xx - L.sec.x0) / (L.sec.x1 - L.sec.x0);
      R = Math.max(0, Math.min(RMAX, Math.round(f * RMAX)));
      render();
    }
    stage.addEventListener("pointerdown", function (ev) {
      dragging = true;
      try { stage.setPointerCapture(ev.pointerId); } catch (e) {}
      setFromX(ev.clientX);
    });
    stage.addEventListener("pointermove", function (ev) {
      if (!dragging) return;
      ev.preventDefault();
      setFromX(ev.clientX);
    });
    ["pointerup", "pointercancel"].forEach(function (e) {
      stage.addEventListener(e, function () { dragging = false; });
    });
    window.addEventListener("blur", function () { dragging = false; });
    stage.addEventListener("keydown", function (ev) {
      if (ev.key === "ArrowLeft" || ev.key === "ArrowRight") {
        ev.preventDefault();
        R = Math.max(0, Math.min(RMAX, R + (ev.key === "ArrowRight" ? 10 : -10)));
        render();
      }
    });

    var tmr = null;
    window.addEventListener("resize", function () {
      clearTimeout(tmr);
      tmr = setTimeout(applyLayout, 180);
    });

    applyLayout();
  })();
});

</script>
