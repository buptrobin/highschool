<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">两个定义，先分清“看哪里”。</p>
<div class="gx-quote">
<p class="q-t">教材表述 · 区域整体性<span class="q-src">人教版（2019）选择性必修2 · 第一章第二节</span></p>
<p class="q-b">区域内部各要素之间相互联系、相互制约、相互影响，使区域成为具有一定结构和功能的整体。</p>
<p class="q-n">→ 这里的“要素”既包括气候、地形、水文、土壤、植被，也包括人口、产业、交通、贫困等人文要素。一个要素变化，会沿要素链传到其他要素，甚至改变整个区域。</p>
</div>
<div class="gx-quote">
<p class="q-t">教材表述 · 区域关联性<span class="q-src">人教版（2019）选择性必修2 · 第一章第二节</span></p>
<p class="q-b">区域之间通过物质、能量、信息等的流动，形成多种形式的联系。</p>
<p class="q-n">→ 关键词是“流”：没有流动，就谈不上关联；流动的方向、规模与频率，决定关联的强弱。人流、资金流也是现代区域联系的重要载体。</p>
</div>
<div style="overflow-x:auto">

<tr><td>典型例子</td><td>黄土高原植被破坏→水土流失→农业减产→贫困</td><td>长三角一体化；流域上下游的水与污染</td></tr>
<tr><td>答题落点</td><td>相互联系、相互制约、整体功能变化</td><td>流的方向与强弱、优势互补、协同治理</td></tr>
</tbody>
</table>

<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<p class="er-w">错在哪：把“整体”偷换成“均质”。区域内仍有差异，整体性强调的是要素之间的关系。</p>

<div class="er">
<p class="er-x">✗ 关联性就是两个区域的特征很相似。</p>
<p class="er-v">✓ 关联性是区域之间通过物质、能量、人流、资金、信息等发生的联系。</p>
<p class="er-w">错在哪：相似是特征比较，关联是流动与分工。两个区域可以很不像，却因互补而联系紧密。</p>
</div>
<div class="er">
<p class="er-x">✗ 距离越近，关联就一定越强。</p>
<p class="er-v">✓ 关联强弱由空间距离、交通与通信条件、经济发展水平差异、政策与制度共同决定。</p>
<p class="er-w">错在哪：忽略了时间距离。高铁、航空和数字网络会压缩时间距离；政策与制度也能降低或提高交易成本。</p>
</div>
<div class="er">
<p class="er-x">✗ 写区域联系时，只写河流、矿产等自然联系就够了。</p>

<p class="er-w">错在哪：漏掉人文联系。资金流和信息流速度快、影响大，往往是分工深化和市场扩大的关键。</p>
</div>
<div class="er">
<p class="er-x">✗ 区域关联越强越好，最好只和一个区域合作。</p>
<p class="er-v">✓ 关联增强有收益，也可能带来单一依赖、低端锁定和风险传导，应保持多元与韧性。</p>
<p class="er-w">错在哪：只看到分工收益，没看到风险。关联越单一，外部冲击越容易沿产业链放大。</p>
