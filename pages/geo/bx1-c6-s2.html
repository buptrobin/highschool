<p class="gx-claim">一次地震只有<b>一个震级</b>，却可以有<b>很多个烈度</b>——这就是这一节全部的考点。</p>
<div class="gx-meta">

<p class="gx-lede">第一节讲"老天给的水、风、冷"，这一节讲<b>地壳和山地给的震动与滑动</b>：
<b>地震、滑坡、泥石流</b>。三者的答题模板和上一节同一套，但判据变了——
地震要看<b>震级（能量）与烈度（破坏）</b>两个概念，滑坡和泥石流要看<b>三个形成条件</b>。
<b>把"震级 ≠ 烈度"这一条弄懂，这一节一半的分就拿到了。</b></p>

<section class="gx-sec" id="a">
  <h2><span class="sn">01</span>课本怎么说</h2>
  <p class="gx-h2s">先背标准表述，再看解释。顺序反了，答题时就写不出术语。</p>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 地震<span class="q-src">人教版（2019）必修第一册 · 第六章第二节</span></p>
    <p class="q-b">地震是地壳快速释放能量过程中造成的震动，期间会产生地震波。
    地震释放能量的大小用震级表示，一次地震只有一个震级。
    地震时地面受到的影响和破坏程度用烈度表示，一次地震可以有多个烈度。</p>
    <p class="q-n">→ 三句话，三个必答点：
    <b>①成因是"快速释放能量"</b>（不是"地壳移动"）；
    <b>②震级 = 能量大小，一次地震只有一个</b>；
    <b>③烈度 = 影响与破坏程度，一次地震有多个</b>。
    判分的词是"<b>能量</b>"和"<b>影响和破坏程度</b>"——把这两个词写对，后面所有题都好答。
    反过来说，只要题目里出现"<b>同一地震、不同地点破坏不同</b>"，考的一定是烈度差异，不是震级。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 滑坡与泥石流<span class="q-src">人教版（2019）必修第一册 · 第六章第二节</span></p>
    <p class="q-b">滑坡是斜坡上的岩体或土体，因河流冲刷、地下水活动、地震及人类活动等原因，
    在重力作用下，整体下滑的现象。
    泥石流是山区沟谷中由暴雨或冰雪融水等激发的，含有大量泥沙、石块的特殊洪流。</p>
    <p class="gx-n">→ 两个词卡住全部区别：
    <b>滑坡是"整体下滑"</b>（岩体土体成块地滑下去，物质没有完全解体）；
    <b>泥石流是"特殊洪流"</b>（水和泥沙石块<b>混在一起流</b>，是"流"不是"滑"）。
    所以：<b>滑坡可以没有水，泥石流必须有大量水</b>。这一句是选择题的分水岭。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 地质灾害的分布与成因<span class="q-src">人教版（2019）必修第一册 · 第六章第二节</span></p>
    <p class="q-b">我国地质灾害多发，且分布广泛。其中，地震主要分布在板块交界地带；
    滑坡、泥石流多发生在山区，尤其是地形起伏大、岩体破碎、降水集中的地区，西南地区最为集中。</p>
    <p class="gx-n">→ "多发"要落到<b>三个成因条件</b>上，缺一不可：
    <b>①地形（坡陡、沟谷深）②物质（岩体破碎、松散堆积物多）③水（降水集中，暴雨激发）</b>，
    再叠加<b>人类活动（切坡建房、修路、采矿、毁林）</b>。
    答"西南地区多滑坡泥石流的原因"，写这四条＋"板块交界、地壳活跃、岩体破碎"就能得满分。</p>
  </div>

  <p class="gx-h2s" style="margin-top:18px">三种地质灾害，按"关键判据—形成条件—多发区"三列对照：</p>
  <div style="overflow-x:auto">
  <table class="gx-cmp">
    <thead><tr><th>灾害</th><th>关键判据（一句话）</th><th>形成条件</th><th>危害</th></tr></thead>
    <tbody>
      <tr class="key"><td>地震</td><td>地壳<b>快速释放能量</b>，产生地震波</td><td>板块交界、<b>断层活动</b>；破坏程度看<b>烈度</b></td><td>房屋倒塌、人员伤亡、次生火灾与堰塞湖</td></tr>
      <tr><td>滑坡</td><td>斜坡岩体土体在重力下<b>整体下滑</b></td><td><b>陡坡 + 软弱面 + 重力</b>；水、地震、切坡诱发</td><td>掩埋村庄、堵塞河道、毁坏道路</td></tr>

      <tr><td>泥石流判据</td><td>沟谷中含泥沙石块的<b>特殊洪流</b></td><td>必须有大量水</td></tr>
      <tr><td>西南多灾害原因</td><td>地形 + 地质 + 气候 + 人为</td><td>四条缺一不可</td></tr>
      <tr><td>我国地震多的原因</td><td><b>位于两大地震带交汇、断裂发育</b></td><td>板块交界</td></tr>
      <tr><td>堰塞湖的危害</td><td>溃决洪水 + 上游淹没 + 库岸滑坡</td><td>次生灾害</td></tr>
    </tbody>
  </table>
  </div>

  <div class="gx-errs">
    <div class="er">
      <p class="er-x">✗ 震级越大，烈度一定越大</p>
      <p class="er-v">✓ 震级<b>大</b>只是"总量"大；烈度还看<b>震源深度、震中距、场地与建筑</b></p>
      <p class="er-w">错在哪：把"总量"当成"结果"。深源地震震级不低，地表烈度可能很小。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 一次地震有多个震级</p>
      <p class="er-v">✓ <b>一次地震只有一个震级</b>，有多个烈度</p>
      <p class="er-w">错在哪：把"不同台站测定的结果略有差异"当成了"多个震级"。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 滑坡就是泥石流，都是"山体滑下来"</p>
      <p class="er-v">✓ 滑坡是<b>整体下滑</b>，泥石流是<b>含泥沙石块的特殊洪流</b></p>
      <p class="er-w">错在哪：只看"都在山上"，没看物质的运动方式。有没有"流"是硬判据。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 泥石流是滑坡的一种</p>
      <p class="er-v">✓ 两者是并列的<b>不同灾种</b>；泥石流常有"形成区—流通区—堆积区"三段</p>
      <p class="er-w">错在哪：混淆了从属关系。题目问"该地易发哪些地质灾害"，两个都要写。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 西南多滑坡只是因为雨多</p>
      <p class="er-v">✓ <b>地形 + 地质（板块交界、岩体破碎）+ 暴雨 + 人类活动</b></p>
      <p class="er-w">错在哪：只写触发器，不写"孕灾环境"。雨多的地方很多，但不是都多滑坡。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 堰塞湖只要"炸开"就行，越早越好</p>
      <p class="er-v">✓ 应先<b>监测预警 + 有序泄流</b>，溃决洪水是最大的次生风险</p>
      <p class="er-w">错在哪：把工程处置想成"一炸了之"。突然溃决对下游是灾难，必须控制泄流。</p>
    </div>
  </div>
</section>

<footer class="gx-foot">
  对应 <b>人教版（2019）必修第一册 第六章第二节「地质灾害」</b>（地震、滑坡、泥石流）· 生成自 <code>eli5-high</code> skill<br>
  数据口径：地震震级与烈度的定义按教材；烈度描述参照《中国地震烈度表》常用表述作了简化。<br>
  图 5 的烈度曲线按经验衰减式 <code>I = 1.5M + 1.6 − 3.4·lg(R+10)</code> 计算，
  <b>仅为教学示意</b>，未考虑震源深度、方位与场地放大效应，<b>不代表任何一次地震的实际烈度评定</b>。
</footer>

<div class="gx-zoom" id="gxZoom" hidden>
  <span class="gx-zoom-tip">双指放大 · 左右滑动看全图</span>
  <button class="gx-zoom-x" type="button" aria-label="关闭">✕</button>

<script src="../../assets/page.js"></script>
<script src="../../assets/geo-autopilot.js"></script>
<script>
/* 地质灾害 · 讲义交互（等 page.js 把 #md 渲染成正文之后再跑） */
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var NS = "http://www.w3.org/2000/svg";
  function $(id) { return document.getElementById(id); }
  function el(tag, attrs, parent) {
    var n = document.createElementNS(NS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }
  function n1(v) { return (Math.round(v * 10) / 10).toString(); }

  if (!$("gxStage")) return;

  /* ================= 手机上的图放大 ================= */
  (function () {
    var zoom = $("gxZoom"), inner = $("gxZoomInner");
    if (!zoom || !inner) return;
    Array.prototype.forEach.call(document.querySelectorAll(".gx-svgbox"), function (box) {
      box.style.cursor = "zoom-in";
      box.addEventListener("click", function () {
        if (window.innerWidth > 760) return;
        var svg = box.querySelector("svg");
        if (!svg) return;
        inner.textContent = "";
        inner.appendChild(svg.cloneNode(true));
        zoom.hidden = false;
        document.body.style.overflow = "hidden";
      });
    });
    function close() { zoom.hidden = true; document.body.style.overflow = ""; }
    zoom.addEventListener("click", function (e) {
      if (e.target === zoom || e.target.classList.contains("gx-zoom-x")) close();
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && !zoom.hidden) close();
    });
  })();

  /* ================= 分步揭示 ================= */
  (function () {
    var steps = document.querySelectorAll("#gxSteps .step");
    var ans = $("gxAns"), btn = $("gxNext"), cnt = $("gxCnt");
    if (!steps.length || !btn) return;
    var i = 1;
    function paint() { if (cnt) cnt.textContent = Math.min(i, steps.length) + " / " + steps.length; }
    steps[0].hidden = false;
    paint();
    btn.addEventListener("click", function () {
      if (i < steps.length) { steps[i].hidden = false; i++; }
      if (i >= steps.length) {
        if (ans) ans.hidden = false;
        btn.textContent = "已全部展开";
        btn.disabled = true;
      }
      paint();
    });
  })();

  /* ================= 互动：震级 × 震中距 → 烈度 ================= */
  (function () {
    var stage = $("gxStage"), gL = $("gxL"), gR = $("gxR");
    var sl = $("gxSl"), vM = $("gxVm"), vD = $("gxVd"), vS = $("gxVs"), vSn = $("gxVsn"), box = $("gxStBox");

    var WIDE = {
      vb: "0 0 880 440", FS: 1,
      sec: { x0: 40, x1: 466, gy: 150, srcX: 130, srcY: 262 },
      ch: { x0: 540, x1: 830, top: 90, gy: 300 },
      secT: 30, chT: 30
    };
    var NARROW = {
      vb: "0 0 360 540", FS: 1.05,
      sec: { x0: 16, x1: 344, gy: 132, srcX: 66, srcY: 240 },
      ch: { x0: 54, x1: 300, top: 320, gy: 462 },
      secT: 22, chT: 296
    };
    var L = WIDE, FS = 1, M = 6, R = 50, dragging = false, G = {};

    var RMAX = 300;
    var ROMAN = ["", "Ⅰ", "Ⅱ", "Ⅲ", "Ⅳ", "Ⅴ", "Ⅵ", "Ⅶ", "Ⅷ", "Ⅸ", "Ⅹ", "Ⅺ", "Ⅻ"];

    function Iof(m, r) {
      var v = 1.5 * m + 1.6 - 3.4 * Math.log(r + 10) / Math.LN10;
      return Math.max(1, Math.min(12, Math.round(v)));
    }
    function Ifrac(m, r) {
      return Math.max(0, Math.min(12, 1.5 * m + 1.6 - 3.4 * Math.log(r + 10) / Math.LN10));
    }
    function xSec(r) { return L.sec.srcX + (r / RMAX) * (L.sec.x1 - L.sec.srcX - 10); }
    function xCh(r) { return L.ch.x0 + (r / RMAX) * (L.ch.x1 - L.ch.x0); }
    function yI(v) { return L.ch.gy - (v / 12) * (L.ch.gy - L.ch.top); }

    function descOf(i) {
      if (i <= 2) return "无感或极少数人察觉";
      if (i === 3) return "室内少数人有感，悬挂物轻微摆动";
      if (i === 4) return "室内多数人有感，门窗作响";
      if (i === 5) return "室外多数人有感，不稳器物翻倒";
      if (i === 6) return "惊慌失措，个别房屋损坏";
      if (i === 7) return "房屋轻微至中等破坏，烟囱倒塌";
      if (i === 8) return "房屋中等破坏，地面出现裂缝";
      if (i === 9) return "房屋严重破坏，喷沙冒水";
      if (i === 10) return "房屋普遍毁坏，地形改观";
      return "毁灭性破坏";
    }
    function colOf(i) {
      if (i >= 8) return "#b8402f";
      if (i >= 6) return "#b8791f";
      if (i >= 4) return "#0b6580";
      return "#2f8a5b";
    }

    function tx(parent, x, y, s, col, anchor, size, weight, halo) {
      var o = { x: n1(x), y: n1(y), "font-size": (size || 10) * FS, fill: col,
                "text-anchor": anchor || "start", "font-weight": weight || 400 };
      if (halo) o["class"] = "halo";
      var t = el("text", o, parent);
      t.textContent = s;
      return t;
    }

    function build() {
      gL.textContent = ""; gR.textContent = "";
      var S = L.sec, C = L.ch, i;

      /* ---------- 左：剖面 ---------- */
      tx(gL, S.x0, L.secT, "地震剖面：你站在哪儿", "#151a21", "start", 10.5, 700);
      tx(gL, S.x0, L.secT + 15, "地面色带 = 不同烈度区", "#5a6472", "start", 9);

      el("rect", { x: n1(S.x0), y: n1(S.gy), width: n1(S.x1 - S.x0), height: n1(Math.max(60, S.srcY - S.gy + 40)),
                   fill: "#f7f2e8" }, gL);
      el("line", { x1: n1(S.x0), y1: n1(S.gy), x2: n1(S.x1), y2: n1(S.gy),
                   stroke: "#b9a988", "stroke-width": 1.4 }, gL);

      /* 烈度色带：按 M 分段 */
      var cuts = [0, 20, 50, 100, 170, RMAX];
      var cols = ["#f0cbc4", "#f6d9c9", "#fbe9d2", "#e8f0f4", "#eef6f0"];
      for (i = 0; i < 5; i++) {
        var xa = xSec(cuts[i]), xb = xSec(cuts[i + 1]);
        el("rect", { x: n1(xa), y: n1(S.gy - 9), width: n1(Math.max(2, xb - xa)), height: 9,
                     fill: cols[i] }, gL);
      }

      /* 震中 / 震源 */
      el("path", { d: "M " + n1(S.srcX) + " " + n1(S.gy) + " l -6 -11 l 12 0 z", fill: "#b8402f" }, gL);
      tx(gL, S.srcX, S.gy - 17, "震中", "#b8402f", "middle", 9.5, 700);
      el("circle", { cx: n1(S.srcX), cy: n1(S.srcY), r: 5, fill: "#b8402f" }, gL);
      tx(gL, S.srcX, S.srcY + 18, "震源", "#b8402f", "middle", 9, 700);
      el("line", { x1: n1(S.srcX), y1: n1(S.gy + 2), x2: n1(S.srcX), y2: n1(S.srcY - 8),
                   stroke: "#b8402f", "stroke-width": 1.1, "stroke-dasharray": "3 3" }, gL);
      tx(gL, S.srcX + 9, (S.gy + S.srcY) / 2, "深 10 km", "#8f3226", "start", 8.5);

      /* 波（弧） */
      for (i = 1; i <= 3; i++) {
        el("path", { d: "M " + n1(S.srcX) + " " + n1(S.srcY + i * 16) +
                        " q -" + (28 + i * 16) + " 14 -" + (56 + i * 30) + " 12", fill: "none",
                     stroke: "#e0b79f", "stroke-width": 1, "stroke-dasharray": "4 4" }, gL);
        el("path", { d: "M " + n1(S.srcX) + " " + n1(S.srcY + i * 16) +
                        " q " + (28 + i * 16) + " 14 " + (56 + i * 30) + " 12", fill: "none",
                     stroke: "#e0b79f", "stroke-width": 1, "stroke-dasharray": "4 4" }, gL);
      }

      /* 游标位置 */
      G.vline = el("line", { x1: 0, y1: n1(S.gy - 64), x2: 0, y2: n1(S.gy + 6),
                             stroke: "#5a6472", "stroke-width": 1.2, "stroke-dasharray": "5 4" }, gL);
      G.house = el("rect", { x: 0, y: n1(S.gy - 26), width: 26, height: 26, rx: 2,
                             fill: "#dfe6ec", stroke: "#9aa3ae" }, gL);
      G.roof = el("path", { d: "", fill: "#c9d3dc" }, gL);
      G.you = tx(gL, 0, S.gy - 34, "你在这里", "#5a6472", "middle", 8.5, 700, true);
      G.iv = tx(gL, 0, S.gy - 70, "", "#b8402f", "middle", 12, 700, true);

      /* ---------- 右：烈度曲线 ---------- */
      tx(gR, C.x0, L.chT, "烈度随震中距衰减", "#151a21", "start", 10.5, 700);
      tx(gR, C.x0, L.chT + 15, "纵轴：烈度（罗马数字）", "#5a6472", "start", 9);

      [2, 4, 6, 8, 10, 12].forEach(function (v) {
        var y = yI(v);
        el("line", { x1: n1(C.x0), y1: n1(y), x2: n1(C.x1), y2: n1(y),
                     stroke: "#eef2f5", "stroke-width": 1 }, gR);
        tx(gR, C.x0 - 5, y + 3, String(v), "#9aa3ae", "end", 8);
      });
      [0, 100, 200, 300].forEach(function (r) {
        var x = xCh(r);
        el("line", { x1: n1(x), y1: n1(C.top), x2: n1(x), y2: n1(C.gy),
                     stroke: "#f2f5f7", "stroke-width": 1 }, gR);
        tx(gR, x, C.gy + 15, String(r), "#9aa3ae", "middle", 8);
      });
      tx(gR, C.x1, C.gy + 29, "震中距 km", "#9aa3ae", "end", 8);
      el("line", { x1: n1(C.x0), y1: n1(C.gy), x2: n1(C.x1), y2: n1(C.gy), stroke: "#c9d3dc" }, gR);
      el("line", { x1: n1(C.x0), y1: n1(C.top), x2: n1(C.x0), y2: n1(C.gy), stroke: "#c9d3dc" }, gR);

      G.path = el("path", { d: "", fill: "none", stroke: "#b8402f", "stroke-width": 2.4,
                            "stroke-linejoin": "round" }, gR);
      G.cv = el("line", { x1: 0, y1: n1(C.top), x2: 0, y2: n1(C.gy),
                          stroke: "#5a6472", "stroke-width": 1.1, "stroke-dasharray": "5 4" }, gR);
      G.cd = el("circle", { r: 4.2, fill: "#b8402f", stroke: "#fff", "stroke-width": 1.3 }, gR);
      G.ct = tx(gR, 0, 0, "", "#b8402f", "start", 9, 700, true);
    }

    function render() {
      var S = L.sec, C = L.ch, i;
      var I = Iof(M, R), x = xSec(R), cxi = xCh(R);

      /* 曲线 */
      var d = "";
      for (i = 0; i <= RMAX; i += 2) {
        d += (i === 0 ? "M " : " L ") + n1(xCh(i)) + " " + n1(yI(Ifrac(M, i)));
      }
      G.path.setAttribute("d", d);

      /* 游标 */
      G.vline.setAttribute("x1", n1(x));
      G.vline.setAttribute("x2", n1(x));
      G.house.setAttribute("x", n1(x - 13));
      G.house.setAttribute("fill", colOf(I));
      G.house.setAttribute("opacity", 0.9);
      G.roof.setAttribute("d", "M " + n1(x - 15) + " " + n1(S.gy - 26) +
                               " l 15 -10 l 15 10 z");
      G.roof.setAttribute("fill", colOf(I));
      G.you.setAttribute("x", n1(x));
      G.iv.setAttribute("x", n1(x));
      G.iv.textContent = ROMAN[I];
      G.iv.setAttribute("fill", colOf(I));

      G.cv.setAttribute("x1", n1(cxi));
      G.cv.setAttribute("x2", n1(cxi));
      G.cd.setAttribute("cx", n1(cxi));
      G.cd.setAttribute("cy", n1(yI(Ifrac(M, R))));
      G.ct.setAttribute("x", n1(Math.min(cxi + 8, C.x1 - 40)));
      G.ct.setAttribute("y", n1(yI(Ifrac(M, R)) - 8));
      G.ct.textContent = ROMAN[I] + " 度";

      vM.textContent = M.toFixed(1);
      vD.textContent = Math.round(R) + " km";
      vS.textContent = ROMAN[I] + " 度";
      vSn.textContent = descOf(I);
      if (box) {
        box.style.background = I >= 8 ? "#fbeae7" : (I >= 6 ? "#fdf3e0" : "#eef6fb");
        box.style.borderColor = colOf(I) + "44";
        var kv = box.querySelector(".v");
        if (kv) kv.style.color = colOf(I);
      }
      if (sl.value !== String(Math.round(R))) sl.value = String(Math.round(R));
    }

    function applyLayout() {
      var w = stage.parentElement.getBoundingClientRect().width;
      L = w >= 690 ? WIDE : NARROW;
      FS = L.FS;
      stage.setAttribute("viewBox", L.vb);
      build();
      render();
    }

    sl.addEventListener("input", function () { R = +this.value; render(); });
    $("gxP1").addEventListener("click", function () { M = 5; render(); });
    $("gxP2").addEventListener("click", function () { M = 6; render(); });
    $("gxP3").addEventListener("click", function () { M = 7; render(); });

    function setFromX(clientX) {
      var bb = stage.getBoundingClientRect();
      var vbw = parseFloat(L.vb.split(" ")[2]);
      var xx = (clientX - bb.left) * (vbw / bb.width);
      var f = (xx - L.sec.srcX) / (L.sec.x1 - L.sec.srcX);
      R = Math.max(0, Math.min(RMAX, Math.round(f * RMAX)));
      render();
    }
    stage.addEventListener("pointerdown", function (ev) {
      dragging = true;
      try { stage.setPointerCapture(ev.pointerId); } catch (e) {}
      setFromX(ev.clientX);
    });
    stage.addEventListener("pointermove", function (ev) {
      if (!dragging) return;
      ev.preventDefault();
      setFromX(ev.clientX);
    });
    ["pointerup", "pointercancel"].forEach(function (e) {
      stage.addEventListener(e, function () { dragging = false; });
    });
    window.addEventListener("blur", function () { dragging = false; });
    stage.addEventListener("keydown", function (ev) {
      if (ev.key === "ArrowLeft" || ev.key === "ArrowRight") {
        ev.preventDefault();
        R = Math.max(0, Math.min(RMAX, R + (ev.key === "ArrowRight" ? 10 : -10)));
        render();
      }
    });

    var tmr = null;
    window.addEventListener("resize", function () {
      clearTimeout(tmr);
      tmr = setTimeout(applyLayout, 180);
    });

    applyLayout();
  })();
});

</script>
