  <h2><span class="sn">01</span>课本怎么说</h2>
  <p class="gx-h2s">先背标准表述，再看解释。</p>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 产业转移<span class="q-src">人教版（2019）选择性必修2 · 第四章第三节</span></p>
    <p class="q-b">“产业转移是指企业将产品生产的部分或全部由原产地转移到其他地区的现象。……影响产业转移的因素主要有劳动力、市场、政策、环境标准等。”（节选）</p>
    <p class="q-n">→ 翻成人话，定义里有三个条件：主体是<b>企业</b>（不是政府、不是消费者）；内容是<b>生产环节</b>（不是把成品卖过去）；方向是<b>跨区域</b>（国家之间或国内区域之间都行）。三个条件缺一个，就不是产业转移——把产品卖到外地，那叫贸易。</p>
  </div>

  <div style="overflow-x:auto">
  <table class="gx-cmp">
    <thead><tr><th>比什么</th><th>国际产业转移</th><th>国内区域产业转移</th></tr></thead>
    <tbody>
      <tr><td>谁迁到谁</td><td>发达国家 → 发展中国家</td><td>我国东部 → 中西部</td></tr>
      <tr><td>典型路径</td><td>服装、鞋帽、家电组装迁往东南亚、南亚</td><td>珠三角 → 粤东西北；长三角 → 皖江</td></tr>
      <tr><td>主要动因</td><td>工资与地价差、关税与贸易壁垒、环境标准差异</td><td>东部成本上升、中西部园区与税收优惠</td></tr>
      <tr class="key"><td>共同点</td><td>都是“生产环节”搬家，都在算综合成本</td><td>同左：算的是总账，不是单项工资</td></tr>
    </tbody>
  </table>
  </div>

    <p class="ex-q">某服装企业原在珠三角生产，2023 年把成衣加工环节迁到粤西某产业转移工业园：人工成本下降约 40%，物流成本上升约 15%，土地与厂房租金明显下降。<br>（1）分析该企业转移的原因；（2）说明对转出地与转入地的影响；（3）为转入地避免“污染转移”提出措施。</p>

    if (p < 10) { st = "不转移"; col = "#3f6f92"; bg = "#eef6fb"; sub = "成本差太小，企业没有动力搬"; }
    else if (p < 60) { st = "部分转移"; col = "#8a5a12"; bg = "#fdf6e7"; sub = "成本敏感的行业先走，其余观望"; }
    else { st = "大规模转移"; col = "#b8402f"; bg = "#fbeae7"; sub = "就业涨，污染负荷也涨"; }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sub;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    $("gxSl").value = String(A);
    draw();
  }

  function applyLayout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? WIDE : NARROW;
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  $("gxSl").addEventListener("input", function () { A = +this.value; render(); });
  $("gxP1").addEventListener("click", function () { A = 0; render(); });
  $("gxP2").addEventListener("click", function () { A = 80; render(); });
  stage.addEventListener("keydown", function (ev) {
    if (ev.key === "ArrowLeft" || ev.key === "ArrowRight") {
      ev.preventDefault();
      A = GX.clamp(A + (ev.key === "ArrowRight" ? 1 : -1), 0, 100);
      render();
    }
  });
  var tmr = null;
  window.addEventListener("resize", function () {
    clearTimeout(tmr); tmr = setTimeout(applyLayout, 180);
  });
  applyLayout();
});
</script>

</body>
</html>
