<!-- ================= A ================= -->
<section class="gx-sec" id="a">
  <h2><span class="sn">01</span>课本怎么说</h2>
  <p class="gx-h2s">先背标准表述，再看解释。顺序反了，答题时就写不出术语。</p>

  <div class="gx-quote">
    <p class="q-t">课本要点 · 促进经济发展<span class="q-src">人教版（2019）必修第二册 · 第四章第二节</span></p>
    <p class="q-b">交通运输布局的改善，可以促进区域资源的开发利用，带动相关产业发展，使产业在交通沿线集聚，并扩大产品的市场范围，从而推动区域经济发展。</p>
    <p class="q-n">→ 这是一条<b>四环链条</b>：<b>交通改善 → 资源开发 → 产业集聚 → 市场扩大</b>。
    四个环节要按顺序写，不能只写头尾。链条中间任何一环断了，交通再好也带不动——
    这就是“路通了还是穷”的原因，答案在<b>中间两环</b>。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本要点 · 影响聚落形态与兴衰<span class="q-src">人教版（2019）必修第二册 · 第四章第二节</span></p>
    <p class="q-b">交通运输布局的变化，会影响聚落的形态和发展。沿交通线延伸的聚落多呈带状；位于交通枢纽的聚落容易发展壮大；而交通地位下降的聚落则可能走向衰落。</p>
    <p class="q-n">→ 这句话里有<b>三件事</b>：<b>形态</b>（沿路带状、枢纽处成团）、<b>兴</b>（枢纽带来人流物流）、
    <b>衰</b>（交通优势被替代）。答题时“兴”和“衰”要分开写，
    只写“交通促进城市发展”是不完整的，因为<b>交通改道也能让城市衰落</b>。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本要点 · 促进区际联系<span class="q-src">人教版（2019）必修第二册 · 第四章第二节</span></p>
    <p class="q-b">交通运输的发展缩短了区域之间的时空距离，加强了区域之间的人员、物资、资金和信息联系，扩大了市场范围，促进了区域之间的分工与协作。</p>
    <p class="q-n">→ 关键词是<b>“时空距离”</b>四个字——交通改变的不是地图上的公里数，是<b>走一趟要多久</b>。
    时空距离一缩短，<b>人员、物资、资金、信息</b>四类要素才流动起来，区域之间才谈得上分工。
    中欧班列、一带一路考的就是这一条。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本要点 · 三个必背案例<span class="q-src">人教版（2019）必修第二册 · 第四章第二节</span></p>
    <p class="q-b">株洲被称为“火车拉来的城市”；石家庄因铁路交汇而取代正定成为区域中心；扬州则因运河淤塞、铁路改线而衰落。</p>
    <p class="q-n">→ 三个案例正好是<b>两种命运</b>：株洲、石家庄是“<b>被交通选中</b>”，
    扬州是“<b>被交通绕过</b>”。答题时把它们当作“兴”和“衰”的证据，
    而不是当作三个孤立的地名背——<b>案例的价值在于证明机制</b>。</p>
  </div>

  <p class="gx-h2s" style="margin-top:18px">三个城市，一条判据（这张表就是“兴衰题”的答题提纲）：</p>
  <div style="overflow-x:auto">
  <table class="gx-cmp">
    <thead><tr><th>城市</th><th>交通变化</th><th>结果</th></tr></thead>
    <tbody>
      <tr><td>株洲</td><td>京广线与浙赣线、湘黔线在此交汇</td><td>从小镇发展为工业城市</td></tr>
      <tr><td>石家庄</td><td>京汉铁路与正太铁路交汇</td><td>取代正定，成为区域中心</td></tr>
      <tr class="key"><td>扬州</td><td>运河淤塞；津浦铁路走浦口，绕开扬州</td><td>由全国性商业都会降为区域城市</td></tr>
    </tbody>
  </table>
  </div>
  <p class="gx-note">三行看的是同一件事：<b>交通优势在不在你这里</b>。
  株洲、石家庄是“新线路经过我”，扬州是“新线路不经过我”。
  高亮那一行最反直觉——<b>衰落不是因为城市不努力，是因为路线改了</b>。
  答题写“扬州衰落的原因”，必须写到“运河淤塞 + 铁路改线 + 海运兴起”至少两点。</p>
</section>

      海运兴起又分走了货运。三条叠加，扬州的枢纽地位没了。
      这题的正确答法是写<b>“交通地位下降”</b>，而不是写“城市管理不好”。</p>

      也可能<b>被带动</b>。判据是<b>本地有没有承接能力</b>，不是“高铁一定好／一定坏”。</p>

  <p class="gx-note">这六问其实是同一句话：<b>交通改变的是“机会的分布”，不是“必然的结果”</b>。

<script>
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var sl = document.getElementById("atlSl");
  if (!sl) return;
  var circle = document.getElementById("atlCircle");
  var label = document.getElementById("atlLabel");
  var v1 = document.getElementById("atlV");
  var v2 = document.getElementById("atlR");
  var v3 = document.getElementById("atlS");
  var why = document.getElementById("atlWhy");
  var area = document.getElementById("atlA");
  var SCALE = 120 / 350;

  var STATES = [
    { max: 50,  name: "普速 · 县域内", color: "#b8791f",
      why: "1 小时只覆盖本县范围，出行以短途为主" },
    { max: 200, name: "快速 · 同城化", color: "#0891b2",
      why: "1 小时能到周边城市，通勤和产业开始跨城" },
    { max: 999, name: "高铁 · 跨城通勤", color: "#2f8a5b",
      why: "1 小时覆盖 200 km 以上，形成跨城通勤圈" }
  ];

  function render() {
    var v = +sl.value;
    var a = Math.PI * v * v / 10000;
    circle.setAttribute("r", (v * SCALE).toFixed(1));
    label.textContent = "半径 " + v + " km · 覆盖 " + a.toFixed(1) + " 万 km²";
    v1.textContent = v + " km/h";
    v2.textContent = v + " km";
    area.textContent = a.toFixed(1);
    var st = STATES[0];
    for (var i = 0; i < STATES.length; i++) {
      if (v < STATES[i].max) { st = STATES[i]; break; }
    }
    circle.setAttribute("stroke", st.color);
    circle.setAttribute("fill", st.color);
    label.setAttribute("fill", st.color);
    v3.textContent = st.name;
    v3.style.color = st.color;
    why.textContent = st.why;
  }

  sl.addEventListener("input", render);
  render();
});
</script>
