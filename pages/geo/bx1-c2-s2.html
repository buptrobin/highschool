<p class="gx-claim">太阳晒的是地面，<b>地面才是大气的暖气片</b>。这一句懂了，整节就通了。</p>
<div class="gx-meta">
  <span><i></i>人教版必修第一册 第二章第二节</span>

<p class="gx-lede">这一节有三块，是一条链：<b>大气怎么变热</b>（受热过程）→ <b>冷热不均怎么动</b>（热力环流）→ <b>动起来就是风</b>（水平运动）。
三块之间是因果，不是并列。<b>最爱考的一句是"地面是近地面大气主要的、直接的热源"</b>——
它同时解释了昼夜温差、阴晴差异、以及为什么越往高处越冷。</p>

<!-- ================= A ================= -->
<section class="gx-sec" id="a">
  <h2><span class="sn">01</span>课本怎么说</h2>
  <p class="gx-h2s">三段原文对应三块内容。注意每段的"谁给谁热量"。</p>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 受热过程与保温作用<span class="q-src">人教版（2019）必修第一册 · 第二章第二节</span></p>
    <p class="q-b">大气对太阳短波辐射吸收较少，太阳短波辐射能够透过大气到达地面；大气对地面长波辐射吸收较多，绝大部分地面长波辐射被大气截留。所以，地面长波辐射是近地面大气主要的、直接的热源。……大气在增温的同时，也向外辐射长波辐射。大气辐射除一小部分向上射向宇宙空间外，大部分向下射向地面，其方向与地面辐射方向相反，故称大气逆辐射。大气逆辐射把热量传给地面，这就在一定程度上补偿了地面辐射损失的热量，对地面起到了保温作用。</p>
    <p class="q-n">→ 记住<b>两个"不一样"</b>：大气对太阳短波<b>吸收少</b>（所以能晒到地面），
    对地面长波<b>吸收多</b>（所以被截留）。这一进一出，就定下了
    <b>"太阳是根本热源、地面是直接热源"</b>这个结论。答题时这两个"热源"不能混。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 大气热力环流<span class="q-src">人教版（2019）必修第一册 · 第二章第二节</span></p>
    <p class="q-b">由于地面冷热不均而形成的空气环流，称为大气热力环流。它是大气运动的一种最简单的形式。……A 地近地面空气膨胀上升，到上空聚积，使上空空气密度增大，形成高气压；B、C 两地空气收缩下沉，上空空气密度减小，形成低气压。于是空气从气压高的 A 地上空向气压低的 B、C 两地上空扩散。</p>
    <p class="q-n">→ 这条链有<b>四个环节，顺序不能乱</b>：<b>冷热不均 → 垂直运动 → 同一水平面产生气压差 → 水平运动</b>。
    最容易错的是最后一步的"<b>同一水平面</b>"——气压高低<b>只能在同一高度上比较</b>，
    不能说"近地面气压比高空高"（那是必然的，没有意义）。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 大气的水平运动<span class="q-src">人教版（2019）必修第一册 · 第二章第二节</span></p>
    <p class="q-b">大气的水平运动即是风。形成风的直接原因是水平气压梯度力。风一旦形成，就会受到地转偏向力的作用，使风向逐渐偏离气压梯度力的方向：北半球向右偏，南半球向左偏。近地面的风还受摩擦力的影响，风向与等压线斜交。</p>
    <p class="q-n">→ 三个力各管一件事，<b>不要混</b>：<b>水平气压梯度力</b>是"发动机"（决定风的大小和初始方向，垂直等压线由高压指向低压）；
    <b>地转偏向力</b>只改方向、不改速度（北右南左，纬度越高越明显）；
    <b>摩擦力</b>只减速度、同时让风向更偏向低压。</p>
  </div>

  <p class="gx-h2s" style="margin-top:18px">三个"力"的作用，一张表分清（这张表是判断风向的唯一依据）：</p>
  <div style="overflow-x:auto">
  <table class="gx-cmp">
    <thead><tr><th>力</th><th>方向</th><th>对风速</th><th>对风向</th></tr></thead>
    <tbody>
      <tr class="key"><td>水平气压梯度力</td><td><b>垂直等压线，由高压指向低压</b></td><td><b>决定风速大小</b></td><td>使空气开始运动（原动力）</td></tr>
      <tr><td>地转偏向力</td><td>与风向垂直（北半球右侧、南半球左侧）</td><td><b>不改变风速</b></td><td>使风向偏转</td></tr>
      <tr><td>摩擦力</td><td>与风向<b>相反</b></td><td>减小风速</td><td>使风向与等压线<b>斜交</b></td></tr>
    </tbody>
  </table>
  </div>
  <p class="gx-note">两个结论直接背：<b>高空风</b>（无摩擦力）→ 风向最终<b>平行</b>等压线；
  <b>近地面风</b>（有摩擦力）→ 风向<b>斜穿</b>等压线，与等压线成一定夹角。
  考试给等压线图问风向，就是按这个顺序推：先画梯度力 → 再偏转 → 再看有没有摩擦力。</p>
</section>

<section class="gx-sec" id="d">
  <h2><span class="sn">04</span>一道题走一遍</h2>
  <p class="gx-h2s">先自己读题干想 30 秒，再点"下一步"。每一步只推进一个判断。</p>

  <div class="gx-ex">
    <p class="ex-t">例题<span class="bdg bdg-must">必考</span></p>
    <p class="ex-q">某沿海城市记录到两组数据：<br>
    ① 晴天：白天最高 <b>32 ℃</b>，夜间最低 <b>12 ℃</b>；<br>
    ② 阴天：白天最高 <b>24 ℃</b>，夜间最低 <b>18 ℃</b>。<br>
    同时，城区年均气温比郊区高约 <b>2 ℃</b>，市区高楼密集。<br><br>
    （1）从大气受热过程角度，解释晴天昼夜温差比阴天大的原因。<br>
    （2）说明城区与郊区之间近地面和高空的气流方向，并指出城区近地面的气压状况。<br>
    （3）从热力环流角度，说明该市规划中"污染企业不宜建在城区外围近处"的理由。</p>

    <ol class="steps" id="gxSteps">
      <li class="step">
        <p class="s-h">第 1 步 · 先把"温差"拆成白天和夜间两段</p>
        <p class="s-b">昼夜温差 = <b>白天最高 − 夜间最低</b>，所以要分别解释白天和夜间。
        晴天：<b>白天云少 → 削弱作用弱 → 到达地面太阳辐射多 → 气温高</b>；
        <b>夜间云少 → 大气逆辐射弱 → 保温作用差 → 气温低</b>。两头一起拉大，温差就大。
        阴天正好相反，两头都往中间收。</p>
        <p class="s-k">用到：大气的削弱作用与保温作用</p>
      </li>
      <li class="step" hidden>
        <p class="s-h">第 2 步 · 别漏掉"水汽"这个变量</p>
        <p class="s-b">阴天空气湿度大，<b>水汽和云都能强烈吸收地面长波辐射</b>，所以夜间逆辐射更强；
        白天云层还会<b>反射</b>掉大量太阳辐射。所以阴天的温差小，是<b>"白天被挡住 + 夜里被盖住"</b>共同作用。
        只写"云多"不够，要写出<b>削弱</b>和<b>保温</b>两个机制。</p>
        <p class="s-k">用到：削弱（反射）与保温（逆辐射）</p>
      </li>
      <li class="step" hidden>
        <p class="s-h">第 3 步 · 城市热岛 → 环流方向</p>
        <p class="s-b">城区气温高（人为热排放 + 建筑密集 + 下垫面吸热快），是<b>热源</b>。
        按热力环流：<b>城区空气受热上升 → 近地面形成低压</b>；郊区相对冷、空气下沉 → 近地面形成高压。
        所以<b>近地面：郊区 → 城区</b>；<b>高空：城区 → 郊区</b>。
        <b>注意高空和近地面方向相反，这是最容易写反的一步。</b></p>
        <p class="s-k">用到：热力环流的形成过程与方向</p>
      </li>
      <li class="step" hidden>
        <p class="s-h">第 4 步 · 为什么污染企业要"远离"</p>
        <p class="s-b">因为近地面风<b>从郊区吹向城区</b>，高空又从城区流回郊区，形成一个<b>闭合环流</b>。
        如果把污染企业建在城区外围不远，它的污染物会<b>被近地面风直接带进城区</b>；
        即使排到高空，也会随高空气流回到郊区后<b>再次下沉</b>，形成循环污染。
        所以厂址应选在<b>城市风环流之外（下沉距离之外）</b>。</p>
        <p class="s-k">用到：热力环流的实际应用</p>
      </li>
    </ol>

    <div class="exbar">
      <button id="gxNext" type="button">下一步</button>
      <span class="cnt" id="gxCnt">1 / 4</span>
    </div>

    <div class="ans" id="gxAns" hidden>
      <p class="ans-t">标准答案（可抄进答题卡）</p>
      <p class="ans-b">
      （1）晴天云量少：<b>白天大气对太阳辐射的削弱作用弱</b>（云层反射、散射少），
      到达地面的太阳辐射多，地面增温快，<b>白天气温高</b>；
      <b>夜间大气逆辐射弱</b>，对地面的保温作用差，地面辐射散失的热量多，<b>夜间气温低</b>。
      阴天则云层厚、水汽多，<b>白天削弱强、夜间逆辐射强</b>，昼夜温差小。<br>
      （2）城区气温高于郊区，空气受热<b>上升</b>，近地面形成<b>低压</b>；郊区空气<b>下沉</b>，近地面形成高压。
      故<b>近地面气流由郊区流向城区，高空气流由城区流向郊区</b>。<br>
      （3）近地面风由郊区吹向城区，污染物会被带入城区；高空气流由城区流向郊区并在外围下沉，
      污染物随之<b>下沉到郊区近地面</b>后又会被吹回城区，形成<b>循环污染</b>。
      因此污染企业应布局在<b>城市热力环流的影响范围（下沉距离）之外</b>。
      </p>

      <b>地面长波辐射</b>——因为大气对太阳短波吸收很少（能穿透），对地面长波吸收很多（被截留）。
      这个区别是所有"越往高处越冷""昼夜温差"题的根。</p>

      <p class="a">因为云的<b>反射作用</b>。反射<b>没有选择性</b>，各种波长的太阳辐射都会被反射回宇宙，
      云越厚越密，反射越强，到达地面的太阳辐射就越少，气温自然低。
      <b>注意这跟"保温"是两回事</b>：白天是削弱，夜间才是保温。</p>
      <svg viewBox="0 0 240 132" role="img" aria-label="云层反射太阳辐射使白天气温低">
        <circle cx="40" cy="40" r="16" fill="#fbe3a8" stroke="#d8a03a"/>

        <text class="ms" x="120" y="126" text-anchor="middle">到达地面变少 → 气温低</text>
      </svg>
    </div>

    <div class="qac">
      <p class="q">「天空为什么是蓝的，晚霞为什么是红的？」</p>
      <p class="a">都是<b>散射</b>。波长越短越容易被散射：<b>蓝紫光</b>被空气分子散射到四面八方，

      R.dnLine.setAttribute("opacity", op);
      R.dnHead.setAttribute("d", "M " + F.bx + " " + yBot + " l -7 -14 l 14 0 z");
      R.dnHead.setAttribute("opacity", op);

      /* 水平气流 */
      var yU = F.ty - 4, yL = F.gy - 6;
      R.huLine.setAttribute("d", "M " + (F.ax + 26) + " " + yU + " L " + (F.bx - 18) + " " + yU);
      R.huLine.setAttribute("stroke-width", sw * 0.9);
      R.huLine.setAttribute("opacity", op);
      R.huHead.setAttribute("d", "M " + (F.bx - 4) + " " + yU + " l -14 -6 l 0 12 z");
      R.huHead.setAttribute("opacity", op);

      R.hlLine.setAttribute("d", "M " + (F.bx - 26) + " " + yL + " L " + (F.ax + 18) + " " + yL);
      R.hlLine.setAttribute("stroke-width", sw * 0.9);
      R.hlLine.setAttribute("opacity", op);
      R.hlHead.setAttribute("d", "M " + (F.ax + 4) + " " + yL + " l 14 -6 l 0 12 z");
      R.hlHead.setAttribute("opacity", op);

      /* 文字随强度淡出 */
      R.upT.setAttribute("y", n1(F.ty + 40));
      R.upT.setAttribute("opacity", op);
      R.dnT.setAttribute("y", n1(F.gy - 44));
      R.dnT.setAttribute("opacity", op);
      R.huT.setAttribute("opacity", op);
      R.hlT.setAttribute("opacity", op);

      /* 数值卡 */
      var dp = 0.4 * D;
      vD.textContent = D.toFixed(1) + " ℃";
      vP.textContent = dp.toFixed(1) + " hPa";

      var st, sn, cc, bg;
      if (D < 0.5) {
        st = "无环流"; sn = "等压面水平，空气没有相对运动"; cc = "#9aa3ae"; bg = "#f6f8fa";
      } else if (D < 3) {
        st = "弱环流"; sn = "等压面轻微弯曲，风很弱"; cc = "#0b6580"; bg = "#ecfbff";
      } else if (D < 7) {
        st = "明显环流"; sn = "近地面风由 B 吹向 A"; cc = "#8a5c14"; bg = "#fdf3e0";
      } else {
        st = "强环流"; sn = "弯曲明显，近地面风强劲"; cc = "#b8402f"; bg = "#fbeae7";
      }
      vS.textContent = st; vSn.textContent = sn;
      vS.style.color = cc;
      box.style.background = bg;
      box.style.borderColor = cc + "44";

      if (L.rd) {
        R.bigV.textContent = dp.toFixed(1) + " hPa";
        R.bigV.setAttribute("fill", cc);
        R.barFg.setAttribute("width", n1(Math.max(8, L.rd.w * Math.min(1, dp / 4))));
        R.barFg.setAttribute("fill", cc);
        var lines = [
          "· A 地受热 → 空气上升",
          "· 近地面 A 低 B 高",
          "· 高空气流 A → B",
          "· 近地面气流 B → A"
        ];
        for (var j = 0; j < 4; j++) {
          R.li[j].textContent = lines[j];
          R.li[j].setAttribute("opacity", D < 0.5 && j > 0 ? 0.35 : 1);
        }
      }

      if (sl.value !== String(D)) sl.value = D;
    }

    function applyLayout() {
      var w = stage.parentElement.getBoundingClientRect().width;
      L = w >= WIDE.bp ? WIDE : NARROW;
      FS = L.FS;
      stage.setAttribute("viewBox", L.vb);
      build();
      render();
    }

    sl.addEventListener("input", function () { D = +this.value; render(); });
    $("gxP1").addEventListener("click", function () { D = 0; render(); });
    $("gxP2").addEventListener("click", function () { D = 2; render(); });
    $("gxP3").addEventListener("click", function () { D = 6; render(); });
    $("gxP4").addEventListener("click", function () { D = 10; render(); });

    function setFromX(clientX) {
      var bb = stage.getBoundingClientRect();
      var vbw = parseFloat(L.vb.split(" ")[2]);
      var x = (clientX - bb.left) * (vbw / bb.width);
      var frac = (x - L.f.x0) / (L.f.x1 - L.f.x0);
      D = Math.max(0, Math.min(10, Math.round(frac * 10 * 2) / 2));
      render();
    }
    stage.addEventListener("pointerdown", function (ev) {
      dragging = true;
      try { stage.setPointerCapture(ev.pointerId); } catch (e) {}
      setFromX(ev.clientX);
    });
    stage.addEventListener("pointermove", function (ev) {
      if (!dragging) return;
      ev.preventDefault();
      setFromX(ev.clientX);
    });
    ["pointerup", "pointercancel"].forEach(function (e) {
      stage.addEventListener(e, function () { dragging = false; });
    });
    window.addEventListener("blur", function () { dragging = false; });

    var tmr = null;
    window.addEventListener("resize", function () {
      clearTimeout(tmr);
      tmr = setTimeout(applyLayout, 180);
    });

    applyLayout();
  })();
});
</script>
</body>
</html>
