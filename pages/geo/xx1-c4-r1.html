      <p class="er-w">错在哪：忽略法律与生态，把自然可行性当成实施许可。</p>
    </div>

  对应 人教版（2019）选择性必修1 第四章「水的运动」·问题研究「能否利用南极冰山解决沙特阿拉伯的缺水问题」 · 生成自 <code>eli5-high</code> skill<br>
  数据口径：教材值/量级——冰盖约 70% 淡水、沙特年用水约 200 亿 m³、淡化 0.5–1.0 美元/m³、航程 7 000–9 000 km、拖速 1–2 km/h、损耗 20%–40%；示意值——互动模型的损耗与成本公式；非实测报价。

  <span class="gx-zoom-tip">双指放大 · 左右滑动看全图</span>

<script src="../../assets/gx.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var GX = window.GX, el = GX.el, tx = GX.tx, $ = GX.$;
  var stage = $("gxStage");
  if (!stage) return;

  var WIDE = { vb: "0 0 880 440", narrow: false, r: { x: 16, y: 22, w: 504, h: 336 }, c: { x: 532, y: 22, w: 332, h: 336 } };
  var NARROW = { vb: "0 0 360 520", narrow: true, r: { x: 6, y: 4, w: 348, h: 246 }, c: { x: 6, y: 262, w: 348, h: 250 } };
  var D = 6000, V = 1, L = WIDE, REF = {};

  function loss(d) { return 1 - Math.exp(-0.09 * d / 1000); }
  function price(d) { return 0.6 + 0.00008 * d; }

  function cp(p0, p1, p2, p3, t) {
    var u = 1 - t, a = u * u * u, b = 3 * u * u * t, c = 3 * u * t * t, e = t * t * t;
    return [a * p0[0] + b * p1[0] + c * p2[0] + e * p3[0], a * p0[1] + b * p1[1] + c * p2[1] + e * p3[1]];
  }

  function berg(g, x, y, s) {
    el("path", {
      d: "M" + x + "," + (y - s * 0.6) + "L" + (x + s * 0.8) + "," + (y + s * 0.05) + "L" + (x + s * 0.4) + "," + (y + s * 0.6) + "L" + (x - s * 0.5) + "," + (y + s * 0.5) + "L" + (x - s * 0.85) + "," + (y - s * 0.05) + "Z",
      fill: "#f2fbfe", stroke: "#7fb3c9", "stroke-width": 1
    }, g);
  }

  function route(r) {
    var g = $("gxA"); g.textContent = "";
    tx(g, r.x + 2, r.y + 14, "① 拖运路径与融化损失", "#151a21", "start", 11, 700);
    el("rect", { x: r.x, y: r.y + 22, width: r.w, height: r.h - 22, rx: 8, fill: "#eef6fb", stroke: "#cfe3ee" }, g);
    var p0 = [r.x + r.w * 0.10, r.y + r.h - 28],
        p1 = [r.x + r.w * 0.30, r.y + r.h - 76],
        p2 = [r.x + r.w * 0.64, r.y + 46],
        p3 = [r.x + r.w * 0.86, r.y + 44];
    el("path", { d: "M" + p0[0] + "," + p0[1] + "C" + p1[0] + "," + p1[1] + " " + p2[0] + "," + p2[1] + " " + p3[0] + "," + p3[1], fill: "none", stroke: "#0b6580", "stroke-width": 2, "stroke-dasharray": "7 6", "stroke-linecap": "round" }, g);
    el("path", { d: "M" + (r.x + 6) + "," + (r.y + r.h - 20) + "L" + (r.x + r.w * 0.20) + "," + (r.y + r.h - 24) + "L" + (r.x + r.w * 0.26) + "," + (r.y + r.h - 10) + "L" + (r.x + 6) + "," + (r.y + r.h - 6) + "Z", fill: "#e8f2f6", stroke: "#b8d8e8" }, g);
    el("path", { d: "M" + (p3[0] + 2) + "," + (p3[1] - 14) + "l30,4l-4,18l-24,4Z", fill: "#f3e7cf", stroke: "#d9c39a" }, g);
    tx(g, p0[0] + 14, p0[1] + 24, "南极冰盖", "#3f6f92", "start", 8.5, 700);
    tx(g, p3[0] + 20, p3[1] + 28, "阿拉伯半岛", "#8a6a2f", "end", 8.5, 700);
    var ts = [0.02, 0.28, 0.55, 0.82], ss = [26, 23, 17, 11];
    for (var i = 0; i < ts.length; i++) {
      var q = cp(p0, p1, p2, p3, ts[i]);
      berg(g, q[0], q[1], ss[i] * (L.narrow ? 0.85 : 1));
    }
    REF.dist = tx(g, r.x + 10, r.y + 42, "", "#0b6580", "start", 9.5, 700);
    var q3 = cp(p0, p1, p2, p3, 1);
    REF.pct = tx(g, q3[0] - 6, q3[1] + 42, "", "#1e6640", "end", 9.5, 700);
  }

  function cost(r) {
    var g = $("gxB"); g.textContent = "";
    tx(g, r.x + 2, r.y + 14, "② 每 m³ 成本（美元）", "#151a21", "start", 11, 700);
    var x0 = r.x + 62, pw = r.w - 78, u = pw / 1.6;
    REF.u = u; REF.x0 = x0;
    var by = r.y + 48, bh = 22;
    tx(g, r.x + 2, by + 15, "拖冰山", "#3a3a35", "start", 9);
    REF.bar = el("rect", { x: x0, y: by, width: 10, height: bh, rx: 3, fill: "#b8402f" }, g);
    REF.val = tx(g, x0 + 12, by + 15, "", "#b8402f", "start", 10, 700);

    var dy = r.y + 108, dh = 40;
    tx(g, r.x + 2, dy + 16, "海水淡化", "#3a3a35", "start", 9);
    tx(g, r.x + 2, dy + 30, "0.5–1.0", "#5a6b78", "start", 7.8);
    el("rect", { x: x0 + 0.5 * u, y: dy, width: 0.5 * u, height: dh, rx: 3, fill: "#e6f6ee", stroke: "#1e6640" }, g);
    tx(g, x0 + 0.75 * u, dy + 24, "0.5–1.0", "#1e6640", "middle", 8.5, 700);

    var ay = r.y + 186;
    el("line", { x1: x0, y1: ay, x2: x0 + pw, y2: ay, stroke: "#9db4c2" }, g);
    for (var k = 0; k <= 3; k++) {
      var v = k * 0.5, xx = x0 + v * u;
      el("line", { x1: xx, y1: ay, x2: xx, y2: ay + 4, stroke: "#9db4c2" }, g);
      tx(g, xx, ay + 16, v.toFixed(1), "#5a6b78", "middle", 8);
    }
    tx(g, r.x + 2, r.y + r.h - 18, "未计拖船队、港口取水设施与保险", "#5a6b78", "start", 8);
    tx(g, r.x + 2, r.y + r.h - 4, "红条越短，方案越接近可行", "#5a6b78", "start", 8);
  }

  function render() {
    var l = loss(D), arr = V * (1 - l), c = price(D);
    var w = Math.max(3, c * REF.u);
    REF.bar.setAttribute("width", w);
    REF.val.setAttribute("x", REF.x0 + w + 6);
    REF.val.textContent = c.toFixed(2);
    REF.pct.textContent = "到达 " + Math.round((1 - l) * 100) + "%";
    REF.dist.textContent = D.toLocaleString("en-US") + " km · 拖速 1–2 km/h · 数月";
    $("gxVa").textContent = V.toFixed(1);
    $("gxVb").textContent = (arr * 10).toFixed(1);
    $("gxVbn").textContent = "亿 m³ · 损耗 " + Math.round(l * 100) + "%";
    $("gxVc").textContent = c.toFixed(2);
    var st, col, bg;
    if (c < 0.5) { st = "比淡化便宜"; col = "#1e6640"; bg = "#e6f6ee"; }
    else if (c <= 1.0) { st = "与淡化相当"; col = "#8a5a12"; bg = "#fdf3e3"; }
    else { st = "远高于淡化"; col = "#b8402f"; bg = "#fbeae7"; }
    $("gxVs").textContent = st;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    $("gxSl").value = String(V);
    var bs = document.querySelectorAll("#gxP1,#gxP2,#gxP3");
    for (var i = 0; i < bs.length; i++) {
      var on = +bs[i].getAttribute("data-d") === D;
      bs[i].style.background = on ? "#0b6580" : "";
      bs[i].style.color = on ? "#fff" : "";
      bs[i].style.borderColor = on ? "#0b6580" : "";
    }
  }

  function build() {
    REF = {};
    route(L.r); cost(L.c); render();
  }

  function applyLayout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? WIDE : NARROW;
    stage.setAttribute("viewBox", L.vb);
    build();
  }

  $("gxSl").addEventListener("input", function () { V = +this.value; render(); });
  $("gxP1").addEventListener("click", function () { D = 3000; build(); });
  $("gxP2").addEventListener("click", function () { D = 6000; build(); });
  $("gxP3").addEventListener("click", function () { D = 9000; build(); });
  stage.addEventListener("keydown", function (ev) {
    if (ev.key === "ArrowLeft" || ev.key === "ArrowRight") {
      ev.preventDefault();
      V = GX.clamp(V + (ev.key === "ArrowRight" ? 0.1 : -0.1), 0.1, 2);
      render();
    }
  });
  var tmr = null;
  window.addEventListener("resize", function () {
    clearTimeout(tmr); tmr = setTimeout(applyLayout, 180);
  });
  applyLayout();
});
</script>
</body>
