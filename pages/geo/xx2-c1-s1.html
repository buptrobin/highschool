<section class="gx-sec" id="a">
  <h2><span class="sn">01</span>课本怎么说</h2>
  <p class="gx-h2s">先背标准表述，再看它拆成哪几层。</p>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 区域的含义<span class="q-src">人教版（2019）选择性必修2 · 第一章第一节</span></p>
    <p class="q-b">区域是地球表面的空间单位，它是人们在地理差异的基础上，按一定的指标和方法划分出来的。区域具有一定的区位特征，以及一定的面积、形状和边界。有的区域的边界是明确的，有的区域的边界具有过渡性质。</p>
    <p class="q-n">→ 三层意思：①区域是"空间单位"，有面积、形状、边界；②划分靠"指标＋方法"，指标变了区域就变；③边界两类——明确与过渡，不能互相替代。</p>
  </div>

  <p class="gx-note">教材还有一句常被改写丢掉的话：<b>区域内部的特定性质相对一致，区域之间具有差异性</b>。它也是判断均质区的依据。</p>

  <div style="overflow-x:auto">
  <table class="gx-cmp">
    <thead><tr><th>比什么</th><th>明确界线</th><th>过渡界线</th></tr></thead>
    <tbody>
      <tr><td>界线形态</td><td>图上一条线，线内线外同时确定</td><td>图上是一条带，带宽由指标变化快慢决定</td></tr>
      <tr><td>怎么定出来</td><td>法律、行政程序、双方约定</td><td>按某一指标的临界值（等值线）划出</td></tr>
      <tr><td>典型区域</td><td>行政区、社区、学区、省界</td><td>气候区、干湿地区、方言区、城市腹地</td></tr>
      <tr><td>会不会漂移</td><td>不随自然过程漂移，靠程序调整</td><td>随指标年际变化、随人口流动缓慢漂移</td></tr>
      <tr class="key"><td>答题时的说法</td><td>边界明确，区域之间界线清晰</td><td>边界具有过渡性质，两侧存在渐变带，难以截然分开</td></tr>
    </tbody>
  </table>
  </div>
  <p class="gx-note">最容易背错的是第三行：<b>行政区也可能很大也可能很小</b>，"大区域＝过渡边界"不成立——界线类型看<b>指标性质</b>，不看面积。</p>
</section>
