    <p class="ex-q">新疆某地年降水量约 100 mm，年蒸发量约 2 000 mm，耕地完全依赖灌溉；西南某河年径流约 600 亿 m³。<br>（1）分析该地缺水的自然原因。（2）从工程与生态两方面评价引藏水入疆。（3）提出更优先的措施并说明理由。</p>
    <ol class="steps" id="gxSteps">
      <li class="step"><p class="s-h">第 1 步 · 先拆题干，别急着写</p><p class="s-b">三问对应三条线索：（1）需求；（2）可能＋代价；（3）时序判断。第（2）问的"工程与生态"是划好的两个得分框，各写两点。</p><p class="s-k">用到：问题研究的"利弊分析"框架</p></li>

    if (Q < 0.5) { st = "不调"; col = "#3f6f92"; bg = "#eef6fb"; sub = "维持现状，水仍是短板"; }
    else if (Q <= 100) { st = "改善有限"; col = "#8a6d1f"; bg = "#fbf3e2"; sub = "约合现有耕地 " + Math.round(ar / CULT * 100) + "%"; }
    else { st = "代价过大"; col = "#b8402f"; bg = "#fbeae7"; sub = "下游减水超过一成"; }

    $("gxVa").textContent = String(Math.round(Q));
    $("gxVb").textContent = num(ar);
    $("gxVc").textContent = pc.toFixed(1);
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sub;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    if ($("gxSl").value !== String(Math.round(Q))) $("gxSl").value = String(Math.round(Q));
  }

  function applyLayout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? WIDE : NARROW;
    FS = L === WIDE ? 1 : 1;
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  $("gxSl").addEventListener("input", function () { Q = +this.value; render(); });
  $("gxP1").addEventListener("click", function () { Q = 50; render(); });
  $("gxP2").addEventListener("click", function () { Q = 300; render(); });
  stage.addEventListener("keydown", function (ev) {
    if (ev.key === "ArrowLeft" || ev.key === "ArrowRight") {
      ev.preventDefault();
      Q = GX.clamp(Q + (ev.key === "ArrowRight" ? 5 : -5), 0, 300);
      render();
    }
  });
  var tmr = null;
  window.addEventListener("resize", function () {
    clearTimeout(tmr); tmr = setTimeout(applyLayout, 180);
  });
  applyLayout();
});
</script>
</body>
</html>
