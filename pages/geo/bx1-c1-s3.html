<p class="gx-claim">地球 46 亿年的历史，被压进了<b>两样东西</b>里：一层一层的岩石，和岩石里的化石。</p>
<div class="gx-meta">
  <span><i></i>人教版必修第一册 第一章第三节</span>
  <span><i></i>高一 · 宇宙中的地球</span>
  <span><i></i>阅读 13 分钟</span>
  <span><i></i>含 1 个互动模型</span>
</div>
<p class="gx-lede">这一节的考点只有一条逻辑链：<b>地层有顺序 → 化石能定年 → 生物演化有方向 → 大气成分跟着变</b>。
所以考的不是"背年代"，而是<b>给你一段地层剖面，让你推断它形成时是什么环境</b>。
把这条链走通，年代数字记不住也能做题。</p>

<section class="gx-sec" id="a">
  <h2><span class="sn">01</span>课本怎么说</h2>
  <p class="gx-h2s">先背标准表述，再看解释。顺序反了，答题时就写不出术语。</p>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 地层与化石<span class="q-src">人教版（2019）必修第一册 · 第一章第三节</span></p>
    <p class="q-b">地层是具有时间顺序的层状岩石。在正常情况下，地层是按顺序排列的，先形成的在下，后形成的在上。地层中保存的化石，是记录地球历史的"书页"。</p>
    <p class="q-n">→ 两个关键词：<b>时间顺序</b>（下老上新）和<b>化石</b>。
    注意"<b>正常情况下</b>"这四个字——如果岩层被地壳运动掀翻、倒转，顺序就会反过来。
    所以判年龄不能只看上下，还要看<b>化石的演化等级</b>。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 地质年代<span class="q-src">人教版（2019）必修第一册 · 第一章第三节</span></p>
    <p class="q-b">地球约有 46 亿年的历史。地质学家把地球的历史划分为不同的地质年代，从大到小依次为宙、代、纪。显生宙包括古生代、中生代和新生代。</p>
    <p class="q-n">→ 单位大小必须记牢：<b>宙 &gt; 代 &gt; 纪</b>。
    所以"<b>中生代</b>"是代，"<b>侏罗纪</b>"是纪，<b>不能混着说"侏罗代"</b>。
    前寒武纪（冥古宙、太古宙、元古宙）占了地球历史的 <b>约 88%</b>，
    但化石极少——因为那时生物多为软体，且岩层多已变质。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 生物的演化<span class="q-src">人教版（2019）必修第一册 · 第一章第三节</span></p>
    <p class="q-b">地球生物经历了从低级到高级、从简单到复杂、从海洋到陆地的演化过程。不同地质年代的地层中含有不同的化石，因此可以根据化石确定地层的时代和顺序。</p>
    <p class="q-n">→ 这句话是<b>"化石定年"的原理</b>：生物演化<b>有方向、不回退</b>，
    所以<b>越古老的地层，化石越低级、越简单</b>。
    这条推理是本节所有材料题的地基——<b>不需要记住具体年代数字，只要判断"谁比谁高级"</b>。</p>
  </div>

  <p class="gx-h2s" style="margin-top:18px">五个代，一张表（"生物"和"海陆"两栏是采分点）：</p>
  <div style="overflow-x:auto">
  <table class="gx-cmp">
    <thead><tr><th>地质年代</th><th>距今</th><th>代表性生物</th><th>海陆与气候</th></tr></thead>
    <tbody>
      <tr><td>冥古宙·太古宙</td><td>4600–2500 Ma</td><td>最早的单细胞生命（约 38 亿年前）</td><td>海洋广阔，陆地极少，大气无氧</td></tr>
      <tr><td>元古宙</td><td>2500–541 Ma</td><td>真核生物、多细胞生物出现</td><td><b>大氧化事件</b>后大气开始含氧</td></tr>
      <tr class="key"><td>古生代</td><td>541–252 Ma</td><td>早期<b>海洋无脊椎动物</b>（三叶虫）→ 鱼类 → 两栖类 → 爬行类；<b>蕨类</b>繁盛</td><td>陆地面积扩大，<b>末期形成大片煤田</b></td></tr>
      <tr><td>中生代</td><td>252–66 Ma</td><td><b>爬行动物</b>时代（恐龙）；<b>裸子植物</b>繁盛</td><td>联合古陆解体，气候温暖干燥</td></tr>
      <tr><td>新生代</td><td>66 Ma–现在</td><td><b>哺乳动物</b>时代；<b>被子植物</b>繁盛；<b>人类</b>出现</td><td>形成现代海陆格局，第四纪有多次冰期</td></tr>
    </tbody>
  </table>
  </div>
  <p class="gx-note">两个"末期"事件别记混：<b>古生代末期</b>是<b>二叠纪末大灭绝</b>（约 96% 的海洋物种消失，

    <p class="ex-q">某地进行地质考察，发现一处未受扰动的沉积岩剖面，自上而下依次为：<br>
    <b>① 砂岩，含哺乳动物化石</b>；<b>② 泥岩，含恐龙化石</b>；
    <b>③ 页岩夹煤层，含蕨类植物化石</b>；<b>④ 石灰岩，含三叶虫化石</b>。<br><br>
    （1）判断四层岩石由老到新的顺序，并说明理由。<br>
    （2）推测③层形成时的地理环境，并说明依据。<br>
    （3）该剖面缺少前寒武纪的地层，可能的原因是什么？</p>

    <ol class="steps" id="gxSteps">
      <li class="step">
        <p class="s-h">第 1 步 · 先排序，理由要写"两条"</p>
        <p class="s-b">由老到新是 <b>④ → ③ → ② → ①</b>。理由有两条，都要写：
        <b>①沉积岩正常层序下老上新</b>，剖面未受扰动，所以最下面的④最老；
        <b>②化石的演化等级</b>：三叶虫（古生代）早于蕨类繁盛（古生代晚期）早于恐龙（中生代）
        早于哺乳动物（新生代）。<b>两条理由互相印证，才叫"说明理由"。</b></p>
        <p class="s-k">用到：地层的层序律 + 化石的定年作用</p>
      </li>
      <li class="step" hidden>
        <p class="s-h">第 2 步 · 环境推断必须"岩性 + 化石"双证据</p>
        <p class="s-b">③层是<b>页岩夹煤层，含蕨类化石</b>。页岩说明<b>水体安静、颗粒细</b>；
        煤层说明有<b>大量植物遗体堆积并被埋藏</b>；蕨类植物<b>高大、喜湿热</b>。
        三条合起来：<b>当时是温暖湿润、植物茂盛的森林沼泽环境</b>。
        这也是地质史上重要的<b>成煤期</b>。</p>
        <p class="s-k">用到：岩性与化石的古环境指示意义</p>
      </li>
      <li class="step" hidden>

        <b>②后来被侵蚀掉了</b>（地壳抬升 → 风化剥蚀）；
        <b>③发生了变质</b>（前寒武纪岩层年代久，多已变质，原始层理和化石难以保存）。

        <p class="s-k">用到：地层的形成条件与后期改造</p>
      </li>
      <li class="step" hidden>
        <p class="s-h">第 4 步 · 这类题的"通用模板"</p>
        <p class="s-b">所有地层剖面题都走同一条路：
        <b>排序（下老上新）→ 定年（化石等级）→ 定环境（岩性 + 化石）→ 解释异常（缺失、倒转、变质）</b>。

        <b>先看题干给了哪个前提，再选哪条判据。</b></p>
        <p class="s-k">用到：地层判读的一般方法</p>

    </ol>

      （3）可能原因：① 前寒武纪时该地<b>尚未形成沉积环境</b>，没有沉积；② 已形成的地层后来
      <b>被抬升侵蚀</b>而缺失；③ 前寒武纪岩层年代久远，<b>多已变质</b>，原始层理与化石难以保存。

  (function () {

    var NARROW = {

    function frac(t) {

      if (t > 66) return { n: "中生代", c: "#e8dcc8", s: "爬行动物（恐龙）与裸子植物时代" };
      return { n: "新生代", c: "#cfe0ec", s: "哺乳动物与被子植物时代" };
    }
    function lifeOf(t) {
      if (t >= 4000) return ["没有生命", "大气以二氧化碳、甲烷为主，几乎没有氧气"];

      if (t > 541) return ["真核生物、多细胞生物", "约 24 亿年前发生大氧化事件，氧气第一次明显上升"];
      if (t >= 485) return ["海洋无脊椎动物（三叶虫）", "寒武纪生命大爆发，海洋生物门类迅速增多"];
      if (t >= 252) return ["鱼类 → 两栖类 → 爬行类；蕨类森林", "晚期森林繁盛，形成大片煤田；末期发生二叠纪大灭绝"];
      if (t >= 66) return ["爬行动物（恐龙）；裸子植物", "联合古陆逐渐解体，末期恐龙灭绝"];

      el("line", { x1: n1(c.x), y1: n1(c.gy), x2: n1(c.x + c.w), y2: n1(c.gy),
                   stroke: "#c9c2b0", "stroke-width": 1.1 }, gC);

      /* 曲线 */
      var pts = [], k;

      G.ev = [];
      ev.forEach(function (e, j) {

      });

    function wrap(s, n) {

        var d = ev.key === "ArrowLeft" ? 2 : -2;   /* 左 = 更古老 */
        var f0 = frac(TT);
        var t = TT + d * 23;
        TT = Math.max(0, Math.min(4600, t));
        render();
      }
    });

    var tmr = null;
    window.addEventListener("resize", function () {
      clearTimeout(tmr);
      tmr = setTimeout(applyLayout, 180);
    });

    applyLayout();
  })();
});
