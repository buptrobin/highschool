<!-- ================= A ================= -->
<section class="gx-sec" id="a">
  <h2><span class="sn">01</span>课本怎么说</h2>
  <p class="gx-h2s">先背标准表述，再看解释。定义的每个词都是采分点，少一个就扣分。</p>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 可持续发展的定义<span class="q-src">人教版（2019）必修第二册 · 第五章第二节</span></p>
    <p class="q-b">可持续发展是既满足当代人的需求，而又不危及后代人满足其需求能力的发展。</p>
    <p class="q-n">→ 定义里有<b>三个关键词</b>：<b>当代人的需求</b>、<b>后代人的需求</b>、<b>不危及</b>。
    注意它<b>没有</b>写“少发展”“不发展”——它限制的是“透支”，不是“速度”。
    这句话出自 1987 年联合国世界环境与发展委员会的报告《我们共同的未来》（布伦特兰报告）。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本要点 · 可持续发展的内涵<span class="q-src">人教版（2019）必修第二册 · 第五章第二节</span></p>
    <p class="q-b">可持续发展包括生态持续发展、经济持续发展和社会持续发展三个方面。生态持续发展是基础，经济持续发展是条件，社会持续发展是目的。</p>
    <p class="q-n">→ 三个维度，各有一个“管什么”：<b>生态</b>管“资源环境够不够用”，<b>经济</b>管“有没有钱继续做”，
    <b>社会</b>管“老百姓有没有受益”。答题时三个词都要出现，只写“保护环境”最多拿三分之一的分。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本要点 · 可持续发展的三个原则<span class="q-src">人教版（2019）必修第二册 · 第五章第二节</span></p>
    <p class="q-b">实现可持续发展必须遵循公平性、持续性、共同性三个基本原则。</p>
    <p class="q-n">→ <b>三个原则，各管一件事</b>：<b>公平性</b>管“谁”——同代人之间、当代与后代之间；
    <b>持续性</b>管“度”——不超出资源环境承载力；<b>共同性</b>管“谁来”——全球性问题要各国一起动手。
    案例题里出现“发达国家/发展中国家”就想公平性，出现“排放量/捕捞量”就想持续性，出现“国际合作”就想共同性。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本要点 · 实现途径<span class="q-src">人教版（2019）必修第二册 · 第五章第二节</span></p>
    <p class="q-b">实现可持续发展的主要途径有清洁生产、循环经济和绿色消费。</p>
    <p class="q-n">→ 三条途径对应<b>三个环节</b>：<b>清洁生产</b>在工厂（生产端，全过程减排）；
    <b>循环经济</b>在产业链（把废物接回原料）；<b>绿色消费</b>在你我（消费端，用购买投票）。
    三条是一根链条，缺哪一段，物质都回不到系统里。</p>
  </div>

  <p class="gx-h2s" style="margin-top:18px">三原则最容易混，先按“管什么”分开：</p>
  <div style="overflow-x:auto">
  <table class="gx-cmp">
    <thead><tr><th>原则</th><th>一句话判据</th><th>典型反例</th></tr></thead>
    <tbody>
      <tr class="key"><td>公平性</td><td>同代人之间、当代与后代之间，<b>机会和资源要公平</b></td><td>发达国家把高污染产业转到发展中国家</td></tr>
      <tr><td>持续性</td><td>发展<b>不超出资源环境承载力</b>，不破坏自我修复能力</td><td>捕捞量超过鱼类再生量，渔场崩溃</td></tr>
      <tr><td>共同性</td><td>全球性问题<b>需要各国共同行动</b>，责任共担但有区别</td><td>只有一国减排，全球升温仍继续</td></tr>
    </tbody>
  </table>
  </div>
  <p class="gx-note">看这张表要抓一个反直觉：<b>“公平性”不是“平均分配”</b>。
  公平性说的是<b>机会与责任</b>——排放少、受影响大的国家，不该和排放多的国家承担一样的减排义务。</p>
</section>

        <text class="ms" x="112" y="112">停止发展</text>
        <text class="ms" x="212" y="32" text-anchor="end" fill="#1e6640">可持续</text>
        <text class="ms" x="120" y="18" text-anchor="middle">两条路，不是同一条</text>
      </svg>
    </div>

    <div class="qac">
      <p class="q">「可持续发展不就是环境保护吗？」</p>
      <p class="a"><b>不止。</b>生态是<b>基础</b>，经济是<b>条件</b>，社会是<b>目的</b>。
      只讲环保，答不出“发展”两个字，也解释不了为什么贫困地区也要发展。
      答题时“生态—经济—社会”三栏各写一句，才叫完整。</p>
      <svg viewBox="0 0 240 132" role="img" aria-label="可持续发展的三个维度：生态、经济、社会">
        <rect x="30" y="52" width="44" height="56" rx="5" fill="#e6f6ee" stroke="#bfe0cd"/>
        <rect x="98" y="36" width="44" height="72" rx="5" fill="#fdf3e0" stroke="#f0dcb4"/>
        <rect x="166" y="60" width="44" height="48" rx="5" fill="#ecfbff" stroke="#b8e6f2"/>
        <text class="ms" x="52" y="122" text-anchor="middle">生态</text>
        <text class="ms" x="120" y="122" text-anchor="middle">经济</text>
        <text class="ms" x="188" y="122" text-anchor="middle">社会</text>
        <text class="ms" x="120" y="22" text-anchor="middle">三条腿，缺一不可</text>
      </svg>
    </div>

    <div class="qac">
      <p class="q">「公平性就是把资源平均分给每个人吗？」</p>
      <p class="a"><b>不是。</b>“平均”是分东西，“公平”是<b>机会与责任</b>。
      发达国家历史排放多、抗灾能力强，发展中国家排放少、受气候变化冲击大——
      要求两国承担<b>同样的减排量</b>，反而不公平。这就是“共同但有区别的责任”。</p>
      <svg viewBox="0 0 240 132" role="img" aria-label="平均分配与公平分配的区别">
        <rect x="20" y="34" width="90" height="76" rx="6" fill="#fdf3e0" stroke="#f0dcb4"/>
        <rect x="130" y="34" width="90" height="76" rx="6" fill="#e6f6ee" stroke="#bfe0cd"/>
        <g fill="#b8791f"><rect x="36" y="56" width="26" height="26" rx="3"/><rect x="68" y="56" width="26" height="26" rx="3"/></g>
        <text class="ms" x="65" y="102" text-anchor="middle">平均：一样多</text>
        <g fill="#2f8a5b"><rect x="146" y="56" width="14" height="26" rx="3"/><rect x="168" y="56" width="38" height="26" rx="3"/></g>
        <text class="ms" x="175" y="102" text-anchor="middle">公平：按需与责任</text>
        <text class="ms" x="120" y="22" text-anchor="middle">量相同 ≠ 事公平</text>
      </svg>
    </div>

    <div class="qac">
      <p class="q">「循环经济就是垃圾分类吗？」</p>
      <p class="a"><b>不止。</b>垃圾分类只是回收端的一环。循环经济的核心是 <b>3R</b>：
      <b>减量化</b>（源头少用）、<b>再利用</b>（延长寿命）、<b>资源化</b>（废物变原料）。
      只做分类、不做源头减量，仍然是在“末端”打转。</p>
      <svg viewBox="0 0 240 132" role="img" aria-label="循环经济3R：减量化、再利用、资源化">
        <rect x="24" y="86" width="60" height="28" rx="5" fill="#e6f6ee" stroke="#bfe0cd"/>
        <rect x="90" y="56" width="60" height="58" rx="5" fill="#e6f6ee" stroke="#bfe0cd"/>
        <rect x="156" y="26" width="60" height="88" rx="5" fill="#e6f6ee" stroke="#bfe0cd"/>
        <text class="ms" x="54" y="104" text-anchor="middle">再生</text>
        <text class="ms" x="120" y="88" text-anchor="middle">再用</text>
        <text class="ms" x="186" y="60" text-anchor="middle">减量</text>
        <text class="ms" x="120" y="18" text-anchor="middle">越靠源头，越省碳</text>
      </svg>
    </div>

    <div class="qac">
      <p class="q">「清洁生产就是把排放物处理达标吗？」</p>
      <p class="a"><b>不是。</b>“处理达标”是<b>末端治理</b>——污染物已经产生了。
      清洁生产是<b>全过程控制</b>：选清洁原料、改工艺、降能耗，让污染物在源头就少产生。
      末端治理是补充，不是主体。</p>
      <svg viewBox="0 0 240 132" role="img" aria-label="末端治理与清洁生产的区别">
        <text class="ms" x="18" y="32">末端治理</text>
        <path d="M 18 50 L 148 50" stroke="#b8402f" stroke-width="3"/>
        <rect x="148" y="38" width="26" height="24" rx="3" fill="#fff" stroke="#b8402f"/>
        <text class="ms" x="182" y="55" fill="#b8402f">达标</text>
        <text class="ms" x="18" y="92">清洁生产</text>
        <path d="M 18 110 L 212 110" stroke="#2f8a5b" stroke-width="3" stroke-dasharray="2 6"/>
        <circle cx="62" cy="110" r="7" fill="#2f8a5b"/>
        <text class="ms" x="120" y="96" fill="#1e6640">源头就少排</text>
      </svg>
    </div>

    <div class="qac">
      <p class="q">「我一个人少用一个塑料袋，有用吗？」</p>
      <p class="a"><b>有用，但不够。</b>共同性说的是全球问题要<b>各国、各环节一起动</b>。
      个人属于需求端的一环：需求变了，企业才会改产品、政府才敢加政策。
      但把责任全推给个人，就会放过生产端和制度端。</p>
      <svg viewBox="0 0 240 132" role="img" aria-label="共同性：个人、企业、国家三层一起行动">
        <circle cx="46" cy="64" r="16" fill="#ecfbff" stroke="#b8e6f2"/>
        <circle cx="120" cy="64" r="22" fill="#fdf3e0" stroke="#f0dcb4"/>
        <circle cx="202" cy="64" r="28" fill="#e6f6ee" stroke="#bfe0cd"/>
        <text class="ms" x="46" y="104" text-anchor="middle">个人</text>
        <text class="ms" x="120" y="104" text-anchor="middle">企业</text>
        <text class="ms" x="202" y="104" text-anchor="middle">国家</text>
        <text class="ms" x="120" y="22" text-anchor="middle">共同性：三层一起动</text>
      </svg>
    </div>

  </div>
  <p class="gx-note">这六问其实是同一句话：<b>可持续＝在承载力之内、把物质接回系统、让后代还有得用。</b>
  所有判断的第一步，永远是问<b>“这条链闭不闭合、有没有超过承载力”</b>。</p>

  <p class="gx-h2s">左边是考试里真的会写出来的错句，右边是应该写的样子。后者可以直接背。</p>

  <div class="gx-errs">

      <p class="er-x">✗ 可持续发展就是保护环境、少开发</p>

    </div>
    <div class="er">

      <p class="er-w">错在哪：把“公平”当成了“平均”。排放少、受害大的国家反而该少担责任。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 循环经济就是垃圾分类、废物回收</p>
