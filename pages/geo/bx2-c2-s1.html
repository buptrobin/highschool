<p class="gx-lede">这一节考两件事：乡村和城镇的<b>土地利用差在哪</b>，城镇内部三个功能区<b>为什么这样摆</b>。
最容易丢分的是把“地租”只理解成“离市中心近”——地租高低由<b>距市中心远近</b>和<b>交通通达度</b>两个因素决定，
少写一个就少一个采分点。还有一句要提前记住：<b>商业区不一定在几何中心</b>。</p>

<!-- ================= A ================= -->
<section class="gx-sec" id="a">
  <h2><span class="sn">01</span>课本怎么说</h2>
  <p class="gx-h2s">先背标准表述，再看解释。顺序反了，答题时就写不出术语。</p>

  <div class="gx-quote">
    <p class="q-t">课本要点 · 乡村的土地利用<span class="q-src">人教版（2019）必修第二册 · 第二章第一节</span></p>
    <p class="q-b">乡村土地利用以农业用地为主，包括耕地、林地、草地、水域等；居住用地和公共服务设施用地规模较小，多与农业用地交错分布。</p>
    <p class="q-n">→ 两个要点：① 乡村的地<b>首先用来生产</b>，农业用地占大头；
    ② 居住用地<b>小而且散</b>，和农田混在一起。所以乡村不是“没有分区”，而是“<b>分区不明显</b>”。
    答题时把“以农业用地为主”“居住与生产混杂”两个词写出来，就到位了。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本要点 · 城镇功能区<span class="q-src">人教版（2019）必修第二册 · 第二章第一节</span></p>
    <p class="q-b">城镇内部按土地利用方式的不同，可划分为商业区、住宅区、工业区等不同类型的功能区。</p>
    <p class="q-n">→ 一句话点出<b>三个功能区</b>，注意那个“等”字：还有行政区、文化区、绿地等。
    判据是<b>土地利用方式</b>，不是“楼高不高”。而且功能区之间<b>没有明确界线</b>，
    一个区只是“以某种用地为主”。这一句常被出成判断题。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本要点 · 影响城镇空间结构的经济因素<span class="q-src">人教版（2019）必修第二册 · 第二章第一节</span></p>
    <p class="q-b">影响城镇内部空间结构的经济因素主要是地租。地租的高低，取决于距市中心的远近和交通通达度。</p>
    <p class="q-n">→ <b>两个因素，缺一不可</b>：① <b>距市中心远近</b>——越远，能吸引到的顾客越少，付得起的租金越低；
    ② <b>交通通达度</b>——同样的距离，地铁口、主干道沿线的地租<b>明显更高</b>。
    只写“离市中心近地租高”，是把第二个因素丢掉了。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本要点 · 其他因素<span class="q-src">人教版（2019）必修第二册 · 第二章第一节</span></p>
    <p class="q-b">除经济因素外，历史、社会、行政等因素也会影响城镇内部空间结构。</p>
    <p class="q-n">→ <b>三个补充因素</b>：<b>历史</b>（老城门、老商业街改不动）、
    <b>社会</b>（收入差异把住宅分成高级区和低级区）、<b>行政</b>（规划、 zoning、开发区）。
    经济因素是“<b>一般规律</b>”，这三个是“<b>为什么这个城市不按规律来</b>”的解释。</p>
  </div>

  <p class="gx-h2s" style="margin-top:18px">三个功能区摆在一起看（付租能力是核心判据）：</p>
  <div style="overflow-x:auto">
  <table class="gx-cmp">
    <thead><tr><th>功能区</th><th>付租能力</th><th>一般位置</th><th>占地与形态</th></tr></thead>
    <tbody>
      <tr class="key"><td>商业区</td><td><b>最强</b>，曲线最陡</td><td>市中心、交通干线交汇处、环路沿线</td><td>占地最小，向高空发展</td></tr>
      <tr><td>住宅区</td><td>中等</td><td>商业区外围；高级住宅区在城市外缘</td><td>占地最大，常占城镇用地一半左右</td></tr>
      <tr><td>工业区</td><td><b>最弱</b>，曲线最平</td><td>城市外围、交通线两侧、下风向或河流下游</td><td>占地大，成片分布</td></tr>
    </tbody>
  </table>
  </div>
  <p class="gx-note">高亮那一行是这张表的“钥匙”：<b>商业付租能力最强，所以抢到市中心；工业最弱，只能去外围</b>。
  住宅夹在中间，所以它面积最大、位置也最“中庸”。记住这一条因果链，比背三行位置有用。</p>
</section>

<section class="gx-sec" id="d">
  <h2><span class="sn">04</span>一道题走一遍</h2>
  <p class="gx-h2s">题干先只给材料，你自己想；点“下一步”才展开这一步的推理。</p>

  <div class="gx-ex">
    <p class="ex-t">例题 <span class="bdg bdg-must">必考</span></p>
    <p class="ex-q">某城市盛行<b>西南风</b>，河流<b>自南向北</b>流。该市在城区<b>东北部</b>规划了一个工业区，
    在城区<b>西南部</b>规划了一个住宅区。
    <b>判断工业区的位置是否合理，并说明理由。（8 分）</b><br>
    <span style="color:#5a6472;font-size:12.5px">提示：8 分至少要答出“风向、河流、地租与交通”三组理由。</span></p>

    <ol class="steps" id="gxSteps">
      <li class="step">
        <p class="s-h">第 1 步 · 先把“下风向”画出来</p>
        <p class="s-b">西南风是<b>从西南吹向东北</b>。所以城市的<b>西南部是上风向</b>，空气最干净；
        <b>东北部是下风向</b>，污染物会被风吹向城外。大气有污染的工业放在下风向，才不会熏到城区。</p>
        <p class="s-k">用到：盛行风与功能区布局</p>
      </li>
      <li class="step" hidden>
        <p class="s-h">第 2 步 · 再把“上、下游”标出来</p>
        <p class="s-b">河流<b>自南向北</b>流，所以<b>南是上游、北是下游</b>。工业区在城区的北部，属于<b>下游</b>，
        污水不会经过城区取水口；住宅区在西南部，属于<b>上游</b>，水质有保障。</p>
        <p class="s-k">用到：河流流向与水质保护</p>
      </li>
      <li class="step" hidden>
        <p class="s-h">第 3 步 · 补上经济因素：地租和交通</p>
        <p class="s-b">工业区付租能力最弱，放在<b>城市外围</b>地价低、占地大，还能靠近铁路、公路等<b>货运交通线</b>；
        住宅区放在西南部，处在上风向、上游，环境好，容易发展成<b>高级住宅区</b>。
        这一层是从“<b>经济因素</b>”和“<b>社会因素</b>”补分。</p>
        <p class="s-k">用到：地租、交通通达度、社会因素</p>
      </li>
      <li class="step" hidden>
        <p class="s-h">第 4 步 · 收口，并留一句“限定条件”</p>
        <p class="s-b">三组理由都成立，才能说“<b>合理</b>”。但要注意一个限定：如果这个工业区是<b>无污染</b>的
        （服装、电子装配），它完全可以靠近城区甚至住宅区，<b>“工业区都必须搬到郊外”是错的</b>。
        答案里带上这句，说明你分得清“污染工业”和“所有工业”。</p>
        <p class="s-k">用到：功能区布局的综合分析</p>
      </li>
    </ol>

    <div class="exbar">

    </div>

    <div class="ans" id="gxAns" hidden>
      <p class="ans-t">标准答案（可抄进答题卡）</p>
      <p class="ans-b">
      <b>判断：</b>合理。<br>
      <b>① 风向：</b>该市盛行西南风，工业区位于城区东北部，处在<b>下风向</b>，污染物不易进入城区。<br>
      <b>② 河流：</b>河流自南向北流，工业区位于城区<b>下游</b>，不污染城区水源；住宅区位于<b>上游</b>，水质好。<br>
      <b>③ 地租与交通：</b>工业区位于城市<b>外围</b>，地价较低，且靠近交通线，便于原料和产品运输；
      住宅区位于上风向、上游，环境较好。<br>
      <b>补充：</b>若该工业为<b>无污染</b>工业，则布局可以更灵活，不必强调“必须远离城区”。
      </p>
    </div>
  </div>
  <p class="gx-note">这类题的通用套路：<b>先风向、再河流、后地租交通、最后加一句限定</b>。
  最容易丢分的是只答“工业区在郊区，地价低”——那是经济因素，<b>风向和河流才是环境因素的两个采分点</b>。</p>
</section>

<!-- ================= E ================= -->
<section class="gx-sec" id="e">
  <h2><span class="sn">05</span>会怎么考</h2>
  <p class="gx-h2s">六问，第二问和第三问是“凭感觉就错”的典型。</p>
  <div class="gx-qa">

    <div class="qac">
      <p class="q">「商业区一定在城市的几何中心吗？」</p>
      <p class="a"><b>不一定。</b>商业区要的是<b>交通通达度最高、人流最大</b>，
      几何中心只是最常见的一种情况。如果交通干线交汇处、环路交叉口偏在一侧，商业区就会跟着偏过去。
      判断依据是<b>付租能力</b>，不是“地图正中间”。</p>
      <svg viewBox="0 0 240 132" role="img" aria-label="商业区可能在几何中心，也可能在交通干线交汇处">
        <rect x="10" y="10" width="220" height="94" rx="6" fill="#f8fbfd" stroke="#dbe7ef"/>
        <circle cx="64" cy="57" r="22" fill="#fdf3e0" stroke="#f0dcb4"/>
        <text class="ms" x="64" y="61" text-anchor="middle" fill="#8a5c14">几何中心</text>
        <circle cx="178" cy="57" r="22" fill="#fdf3e0" stroke="#f0dcb4"/>
        <text class="ms" x="178" y="61" text-anchor="middle" fill="#8a5c14">干线交汇</text>
        <line x1="30" y1="57" x2="210" y2="57" stroke="#c9d2da" stroke-width="3"/>
        <line x1="178" y1="20" x2="178" y2="94" stroke="#c9d2da" stroke-width="3"/>
        <text class="mm" x="120" y="120" text-anchor="middle" fill="#b8402f">都可能是商业区</text>
      </svg>
    </div>

    <div class="qac">
      <p class="q">「住宅区越靠近市中心越好吗？」</p>
      <p class="a"><b>不是。</b>市中心地租高、噪声大、绿地少，所以<b>高级住宅区反而往城市外缘走</b>：
      地势高、上风向、靠近绿地或湖滨，环境好而地价低。靠近内城、工业区的多是<b>低级住宅区</b>。
      “越靠中心越好”是把<b>地租</b>当成了<b>居住质量</b>。</p>
      <svg viewBox="0 0 240 132" role="img" aria-label="高级住宅区在城市外缘，低级住宅区靠近内城">
        <circle cx="120" cy="66" r="46" fill="#eef6fb" stroke="#cfe0ec"/>
        <circle cx="120" cy="66" r="18" fill="#fdf3e0" stroke="#f0dcb4"/>
        <text class="ms" x="120" y="70" text-anchor="middle" fill="#8a5c14">市中心</text>
        <circle cx="196" cy="42" r="12" fill="#e6f6ee" stroke="#bfe0cd"/>
        <text class="ms" x="196" y="46" text-anchor="middle" fill="#1e6640">高级</text>
        <circle cx="62" cy="96" r="12" fill="#fbeae7" stroke="#f0cbc4"/>
        <text class="ms" x="62" y="100" text-anchor="middle" fill="#b8402f">低级</text>
        <text class="mm" x="120" y="126" text-anchor="middle" fill="#0b6580">高级反而在外缘</text>
      </svg>
    </div>

    <div class="qac">
      <p class="q">「工业区都污染，所以都要搬到郊外吗？」</p>
      <p class="a"><b>不是。</b>要分<b>污染工业</b>和<b>无污染工业</b>：钢铁、化工、造纸要放在下风向、河流下游；
      服装、电子装配、精密仪器这类几乎无污染的，可以靠近城区甚至住宅区，方便工人上下班。
      “工业区＝污染源”是把<b>一部分</b>当成了<b>全部</b>。</p>
      <svg viewBox="0 0 240 132" role="img" aria-label="污染工业在下风向，无污染工业可以靠近城区">
        <rect x="12" y="16" width="216" height="100" rx="6" fill="#fbfcfd" stroke="#e6e9ee"/>
        <rect x="26" y="30" width="88" height="34" rx="4" fill="#fbeae7" stroke="#f0cbc4"/>
        <text class="ms" x="70" y="51" text-anchor="middle" fill="#b8402f">钢铁 · 化工</text>
        <text class="ms" x="70" y="78" text-anchor="middle" fill="#5a6472">下风向 · 下游</text>
        <rect x="126" y="30" width="88" height="34" rx="4" fill="#e6f6ee" stroke="#bfe0cd"/>
        <text class="ms" x="170" y="51" text-anchor="middle" fill="#1e6640">服装 · 电子</text>
        <text class="ms" x="170" y="78" text-anchor="middle" fill="#5a6472">可近城区</text>
        <text class="mm" x="120" y="106" text-anchor="middle" fill="#0b6580">先问“污不污染”</text>
      </svg>
    </div>

    <div class="qac">
      <p class="q">「功能区之间有明确的分界线吗？」</p>
      <p class="a"><b>没有。</b>功能区是“<b>以某种土地利用方式为主</b>”的地块，边界往往是渐变、交错的，
      还会有住宅楼下开商铺这种混合。所以答题要写“<b>以……为主</b>”，不能写“<b>这里只有</b>商业”。
      判读地图时看的是<b>面积占比</b>，不是找一条线。</p>
      <svg viewBox="0 0 240 132" role="img" aria-label="功能区之间边界模糊，存在混合用地">
        <rect x="14" y="20" width="212" height="86" rx="6" fill="#f8fbfd" stroke="#dbe7ef"/>
        <rect x="14" y="20" width="106" height="86" fill="#fdf3e0" opacity=".7"/>
        <rect x="120" y="20" width="106" height="86" fill="#eef6fb" opacity=".8"/>
        <g stroke="#b8791f" stroke-width="1" stroke-dasharray="3 4">
          <line x1="120" y1="20" x2="120" y2="106"/>
        </g>
        <g fill="#b8791f" opacity=".8"><circle cx="106" cy="46" r="3"/><circle cx="132" cy="62" r="3"/><circle cx="112" cy="84" r="3"/></g>
        <g fill="#0891b2" opacity=".8"><circle cx="148" cy="42" r="3"/><circle cx="96" cy="66" r="3"/><circle cx="160" cy="86" r="3"/></g>
        <text class="ms" x="66" y="36" text-anchor="middle" fill="#8a5c14">商业为主</text>
        <text class="ms" x="176" y="36" text-anchor="middle" fill="#0b6580">住宅为主</text>
        <text class="mm" x="120" y="122" text-anchor="middle" fill="#5a6472">边界是渐变，不是刀切</text>
      </svg>
    </div>

    <div class="qac">
      <p class="q">「地租曲线为什么不是一条直线往下掉？」</p>
      <p class="a">因为除了距离，还有<b>交通通达度</b>。每一条主干道、地铁线都会让沿线的地租<b>局部抬高</b>，
      曲线于是出现“台阶”和“鼓包”。所以只看“离市中心多远”会判断错，
      还要看<b>这块地挨着什么路</b>。</p>
      <svg viewBox="0 0 240 132" role="img" aria-label="地租曲线沿交通线出现局部凸起">
        <rect x="14" y="14" width="212" height="90" rx="6" fill="#f8fbfd" stroke="#dbe7ef"/>
        <line x1="26" y1="96" x2="216" y2="96" stroke="#9aa3ae" stroke-width="1.2"/>
        <line x1="26" y1="22" x2="26" y2="96" stroke="#9aa3ae" stroke-width="1.2"/>
        <path d="M 26 34 L 52 48 L 74 70 L 88 58 L 110 76 L 128 64 L 152 82 L 176 88 L 214 92"
              fill="none" stroke="#0891b2" stroke-width="2"/>
        <text class="ms" x="74" y="112" fill="#5a6472">干线口地租被抬高</text>
        <text class="mm" x="196" y="30" text-anchor="end" fill="#8a5c14">不是直线</text>
      </svg>
    </div>

    <div class="qac">
      <p class="q">「乡村就没有空间结构吗？」</p>
      <p class="a"><b>有，只是不明显。</b>乡村以<b>农业用地为主</b>，居住用地小而分散，和农田、水塘交错；
      生产（种地、养殖）和生活（住房）<b>混在一起</b>。所以乡村的空间结构特点是“<b>以农业用地为主、居住与生产混杂</b>”，
      而不是“没有结构”。</p>
      <svg viewBox="0 0 240 132" role="img" aria-label="乡村农业用地与宅基地交错分布">
        <rect x="14" y="18" width="212" height="86" rx="6" fill="#f2f8f2" stroke="#d7e8dc"/>
        <g stroke="#b9d4b5" stroke-width="1">
          <line x1="30" y1="18" x2="30" y2="104"/><line x1="70" y1="18" x2="70" y2="104"/>
          <line x1="110" y1="18" x2="110" y2="104"/><line x1="150" y1="18" x2="150" y2="104"/>
          <line x1="190" y1="18" x2="190" y2="104"/>
        </g>
        <g fill="#fff" stroke="#b8791f">
          <rect x="46" y="52" width="14" height="11"/><rect x="126" y="70" width="14" height="11"/>
          <rect x="166" y="40" width="14" height="11"/>
        </g>
        <text class="ms" x="64" y="38" text-anchor="middle" fill="#1e6640">农田</text>
        <text class="ms" x="126" y="96" text-anchor="middle" fill="#8a5c14">宅基地</text>
        <text class="mm" x="120" y="126" text-anchor="middle" fill="#0b6580">农业为主，居住混在其中</text>
      </svg>
    </div>

  </div>
  <p class="gx-note">这六问其实是同一件事：<b>位置由“谁付得起、谁需要什么”共同决定</b>。
  商业要人流、工业要地价低和排污条件、住宅要环境——三个需求撞在同一张地租曲线上，位置就被切出来了。</p>
</section>

<script>
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var sl = document.getElementById("rentSl");
  if (!sl) return;

  var v1 = document.getElementById("rentV1");
  var v2 = document.getElementById("rentV2");
  var v3 = document.getElementById("rentV3");
  var why = document.getElementById("rentWhy");
  var mark = document.getElementById("rentMark");
  var dots = [
    document.getElementById("rentD0"),
    document.getElementById("rentD1"),
    document.getElementById("rentD2")
  ];

  var NAMES = ["商业区", "住宅区", "工业区"];
  var COLORS = ["#8a5c14", "#0b6580", "#b8402f"];
  var K = [120, 70, 40];
  var T = [2.2, 4.5, 7];
  var X0 = 44, XW = 364, Y0 = 220, YH = 190;

  function xOf(d) { return X0 + XW * d / 20; }
  function yOf(v) { return Y0 - YH * v / 120; }
  function val(i, d) { return K[i] * Math.exp(-d / T[i]); }

  var i, k;
  for (i = 0; i < 3; i++) {
    var path = document.getElementById("rentC" + i);
    var dsp = "";
    for (k = 0; k <= 100; k++) {
      var d = 20 * k / 100;
      dsp += (k ? " L " : "M ") + xOf(d).toFixed(1) + " " + yOf(val(i, d)).toFixed(1);
    }
    path.setAttribute("d", dsp);
  }

  function render() {
    var d = parseFloat(sl.value);
    var vs = [val(0, d), val(1, d), val(2, d)];
    var best = 0;
    for (i = 1; i < 3; i++) { if (vs[i] > vs[best] + 1e-9) best = i; }
    var x = xOf(d);
    mark.setAttribute("x1", x);
    mark.setAttribute("x2", x);
    for (i = 0; i < 3; i++) {
      dots[i].setAttribute("cx", x);
      dots[i].setAttribute("cy", yOf(vs[i]));
    }
    v1.textContent = d.toFixed(1) + " km";
    v2.textContent = vs[best].toFixed(1);
    v3.textContent = NAMES[best];
    v3.style.color = COLORS[best];
    why.textContent = "商业 " + vs[0].toFixed(1) + " · 住宅 " + vs[1].toFixed(1) +
      " · 工业 " + vs[2].toFixed(1) + "，最高的是" + NAMES[best];
  }

  sl.addEventListener("input", render);
  render();
});
