<p class="gx-lede">问题研究不考“标准答案”，考的是<b>你会不会比较</b>。这一节要把“住哪儿”拆成四个能比的量：
<b>房价、通勤、配套、环境</b>，再用<b>总成本</b>和<b>约束条件</b>做决定。

<!-- ================= A ================= -->
<section class="gx-sec" id="a">
  <h2><span class="sn">01</span>材料与问题</h2>
  <p class="gx-h2s">先看三份材料：一个真实案例、一组数据、一个概念。读完再回答问题。</p>

  <div class="gx-quote">
    <p class="q-t">材料一 · 真实案例：北京的“睡城”<span class="q-src">课本外补充 · 公开报道常见案例</span></p>
    <p class="q-b">北京北部的回龙观、天通苑是超大型居住区，居住人口达数十万。大量居民每天早晨向中心城区通勤，傍晚返回，早晚高峰的地铁 13 号线、5 号线长期拥挤。</p>
    <p class="q-n">→ 这种“<b>白天进城上班、晚上回郊区睡觉</b>”的大型居住区，常被叫作“<b>睡城</b>”。
    它不是规划出来的坏例子，而是<b>房价 + 通勤</b>共同作用的结果：中心城区住不起，就只能住到外面去。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">材料二 · 一组数据：人在往哪走<span class="q-src">2020 年第七次全国人口普查</span></p>
    <p class="q-b">2020 年我国流动人口约 3.76 亿。北京、上海等特大城市出现中心城区人口占比下降、郊区人口增长的趋势。</p>
    <p class="q-n">→ 两个信息：① <b>人口在流动</b>，3.76 亿不是小数目；② 在特大城市内部，人不是“涌向中心”，
    而是<b>从中心向外扩散</b>。这和上一节讲的<b>郊区化</b>是同一件事的两面。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">材料三 · 一个概念：住得远，省下的和花掉的<span class="q-src">课本要点 + 常识推算</span></p>
    <p class="q-b">住房成本随距市中心距离增加而下降，通勤成本随距离增加而上升；两者相加，就是“住在哪里”的总成本。</p>
    <p class="q-n">→ 这是一对<b>反向的量</b>：<b>住的成本</b>往下走，<b>行的成本</b>往上走。
    两个方向相反的箭头加在一起，总成本就可能出现一个<b>最低点</b>——它不一定在市中心，也不一定在最远的郊区。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">探究问题<span class="q-src">本节要回答的三个问题</span></p>
    <p class="q-b">① 同样收入的人，住在市中心和住在郊区，各自要付出什么代价？<br>
    ② 为什么大城市会出现“睡城”？它合理吗？<br>
    ③ 如果你来选，你会把家安在哪里？需要哪些条件，这个选择才成立？</p>
    <p class="q-n">→ 三个问题一层比一层深：<b>先算账、再解释现象、最后做决策并说明条件</b>。
    第三个问题才是这类题真正想考的——<b>结论必须带条件</b>。</p>
  </div>
</section>

  <!-- 图3 权衡散点 -->

    <div class="fig-cap">

      <p class="q-n">→ 成立条件：<b>收入能覆盖房价</b>，且<b>时间的机会成本很高</b>（比如加班多、要接送孩子）。</p>

      <p class="q-n">→ 成立条件：<b>通勤在上限之内</b>，且<b>配套能满足家庭需求</b>（否则“省下的钱”会被时间补回去）。</p>

    <div class="qac">
      <p class="q">「刚毕业的人和三口之家，选择一样吗？」</p>
      <p class="a"><b>不一样。</b>刚毕业的人：预算紧、通勤重要、对学区无需求，市中心合租或近郊小户型都行；
      三口之家：<b>学区、房间数、通勤上限</b>同时约束，往往被迫在“近郊 + 长通勤”之间取舍。
      <b>家庭阶段不同，四个量的权重就不同。</b></p>
      <svg viewBox="0 0 240 132" role="img" aria-label="刚毕业的人与三口之家的选择权重不同">
        <rect x="24" y="26" width="90" height="54" rx="6" fill="#eef6fb" stroke="#b8d8e8"/>
        <text class="ms" x="69" y="48" text-anchor="middle" fill="#0b6580">刚毕业</text>
        <text class="ms" x="69" y="66" text-anchor="middle" fill="#5a6472">通勤 &gt; 面积</text>
        <rect x="126" y="26" width="90" height="54" rx="6" fill="#fdf3e0" stroke="#f0dcb4"/>
        <text class="ms" x="171" y="48" text-anchor="middle" fill="#8a5c14">三口之家</text>
        <text class="ms" x="171" y="66" text-anchor="middle" fill="#5a6472">学区 &gt; 面积</text>
        <text class="mm" x="120" y="112" text-anchor="middle" fill="#0b6580">阶段不同，权重不同</text>
      </svg>
    </div>

    <div class="qac">
      <p class="q">「城市应该怎么改，才能让人少纠结？」</p>
      <p class="a">三个方向：<b>职住平衡</b>（把产业和公共服务一起疏解到郊区）、
      <b>TOD</b>（沿轨道交通站点高强度开发，降低通勤成本）、
      <b>保障房</b>（让低收入者在通勤半径内住得起）。</p>
      <svg viewBox="0 0 240 132" role="img" aria-label="职住平衡、TOD与保障房三个方向">
        <rect x="18" y="26" width="62" height="52" rx="6" fill="#e6f6ee" stroke="#bfe0cd"/>
        <text class="ms" x="49" y="56" text-anchor="middle" fill="#1e6640">职住平衡</text>
        <rect x="89" y="26" width="62" height="52" rx="6" fill="#eef6fb" stroke="#b8d8e8"/>
        <text class="ms" x="120" y="56" text-anchor="middle" fill="#0b6580">TOD</text>
        <rect x="160" y="26" width="62" height="52" rx="6" fill="#fdf3e0" stroke="#f0dcb4"/>
        <text class="ms" x="191" y="56" text-anchor="middle" fill="#8a5c14">保障房</text>
        <text class="mm" x="120" y="108" text-anchor="middle" fill="#5a6472">降低通勤成本 + 补齐配套</text>
      </svg>
    </div>

  </div>
  <p class="gx-note">六个追问其实是同一件事：<b>把“偏好”换成“权重”，把“结论”换成“条件”</b>。
  条件一变，答案就该变——这不是摇摆，是严谨。</p>
</section>

<section class="gx-sec" id="f">
  <h2><span class="sn">06</span>评价清单</h2>
  <p class="gx-h2s">左边是“只能拿一半分”的答法，右边是“能拿满”的答法。</p>

  <div style="overflow-x:auto;margin-bottom:16px">
  <table class="gx-cmp">
    <thead><tr><th>维度</th><th>市中心</th><th>郊区</th><th>判据</th></tr></thead>

      <tr><td>配套</td><td>齐全</td><td>看新区成熟度</td><td>学校、医院、商业</td></tr>

  </table>

  <div class="gx-errs">
    <div class="er">
      <p class="er-x">✗ 住在市中心最好，因为方便</p>
      <p class="er-v">✓ 选择要看<b>预算、通勤上限、家庭阶段</b>；市中心买到时间，付出房价和空间</p>
      <p class="er-w">为什么弱：只给了一个维度，也没有条件。换个家庭，结论就反了。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 郊区房价低，所以总花费少</p>

      <p class="er-w">为什么弱：漏掉“行的成本”，这是本题最核心的一笔账。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 睡城是因为郊区环境好，大家愿意住</p>

    </div>
    <div class="er">
      <p class="er-x">✗ 选房主要看房价，其他以后再说</p>

    </div>
    <div class="er">

      <p class="er-w">为什么弱：把“建房子”当成了“建城市”，没有就业就还是睡城。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 这个问题没有标准答案，怎么写都行</p>
      <p class="er-v">✓ 结论要写<b>成立条件</b>：在什么收入、什么通勤上限、什么家庭阶段下成立</p>

<script>
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var grid = document.getElementById("locCards");
  if (!grid) return;

  var DATA = [
    { name: "市中心老城区", price: "100", why: "省时间，但贵、挤",
      who: "适合：时间比面积更重要的人", color: "#b8402f" },
    { name: "近郊新区", price: "65", why: "性价比高，但要等配套",
      who: "适合：能接受 30–40 分钟通勤的三口之家", color: "#0b6580" },
    { name: "远郊新城", price: "40", why: "便宜、远，依赖通勤",
      who: "适合：预算优先、能远程办公的人", color: "#8a5c14" },

      who: "适合：工作就在本地的人", color: "#1e6640" }
  ];

  var picks = grid.querySelectorAll(".pickcard");
  var vName = document.getElementById("locName");
  var vPrice = document.getElementById("locPrice");
  var vWhy = document.getElementById("locWhy");
  var vWho = document.getElementById("locWho");

  function show(i) {
    var d = DATA[i];
    vName.textContent = d.name;
    vPrice.textContent = d.price;
    vWhy.textContent = d.why;
    vWhy.style.color = d.color;
    vWho.textContent = d.who;
    Array.prototype.forEach.call(picks, function (b) {
      var on = +b.getAttribute("data-site") === i;
      b.classList.toggle("is-on", on);
      b.setAttribute("aria-pressed", on ? "true" : "false");
    });
  }

  Array.prototype.forEach.call(picks, function (b) {
    b.addEventListener("click", function () { show(+b.getAttribute("data-site")); });
  });

  show(0);
});
