<div class="gx-kicker">ELI5-HIGH · 讲给要考试的人</div>
<p class="gx-claim">海水有三个"脾气"：温度、盐度、密度。三个各有各的规律，<b>别用一个套另一个</b>。</p>
<div class="gx-meta">
  <span><i></i>人教版必修第一册 第三章第二节</span>
  <span><i></i>高一 · 地球上的水</span>
  <span><i></i>阅读 13 分钟</span>
  <span><i></i>含 1 个互动模型</span>
</div>
<p class="gx-lede">这一节最容易混的地方只有一个：<b>温度随纬度一路降，密度也一路升，但盐度不是</b>。
盐度在<b>副热带最高</b>，赤道反而低一点——因为赤道雨多，把盐稀释了。
把这条"马鞍形"记住，这一节就过了一半。</p>

<!-- ================= A ================= -->
<section class="gx-sec" id="a">
  <h2><span class="sn">01</span>课本怎么说</h2>
  <p class="gx-h2s">三段原文，分别对应温度、盐度、密度。每一段都要记"随什么变"。</p>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 海水温度<span class="q-src">人教版（2019）必修第一册 · 第三章第二节</span></p>
    <p class="q-b">海水温度反映海水的冷热程度。表层水温由低纬向高纬递减；同海区表层水温夏季高、冬季低。垂直方向上，海水温度随深度增加而降低，1000 米以下水温变化幅度很小，保持低温稳定。</p>
    <p class="q-n">→ 三个方向，一句话一个：<b>水平</b>（低纬→高纬递减）、<b>季节</b>（夏高冬低）、
    <b>垂直</b>（随深度降低，1000 m 以下基本不变）。热量来源是<b>太阳辐射</b>，
    所以温度本质上是"纬度决定"的——这是三个性质里最"听话"的一个。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 海水盐度<span class="q-src">人教版（2019）必修第一册 · 第三章第二节</span></p>
    <p class="q-b">海水盐度是指海水中溶解盐类物质的质量分数，世界大洋平均盐度约为 35‰。表层盐度分布呈"马鞍形"：副热带海区盐度最高，由副热带向赤道和两极递减。影响盐度的因素主要有降水量与蒸发量、入海径流、结冰与融冰等。</p>
    <p class="q-n">→ 这段的关键词是 <b>"马鞍形"</b>：<b>两头低、中间高</b>。
    为什么赤道不高？<b>赤道降水多，雨水把盐冲淡了</b>；为什么副热带最高？<b>那里蒸发远大于降水，水走了盐留下</b>。
    一句话概括：<b>盐度看的是"蒸发减降水"的差额，不是温度。</b></p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 海水密度<span class="q-src">人教版（2019）必修第一册 · 第三章第二节</span></p>
    <p class="q-b">海水密度是指单位体积海水的质量。表层海水密度随纬度增高而增大。深层海水密度比表层大，海水密度随深度增加而增大。</p>
    <p class="q-n">→ 密度是<b>温度、盐度、深度</b>三者的合成结果：<b>温度越低、盐度越高、深度越大，密度越大</b>。
    表层主要看<b>温度</b>（温度的影响最大），所以密度大致<b>从赤道向两极递增</b>。
    注意它和盐度的区别：盐度是"马鞍形"，密度是"一路升"——<b>这两条曲线形状不同</b>。</p>
  </div>

  <p class="gx-h2s" style="margin-top:18px">三个性质放一起对比（这张表的"随纬度"一列是最大考点）：</p>
  <div style="overflow-x:auto">
  <table class="gx-cmp">
    <thead><tr><th>性质</th><th>随纬度</th><th>随深度</th><th>主导因素</th></tr></thead>
    <tbody>
      <tr><td>温度</td><td><b>低纬向高纬递减</b></td><td>随深度降低，1000 m 以下稳定</td><td>太阳辐射（热量收支）</td></tr>
      <tr class="key"><td>盐度</td><td><b>副热带最高，向赤道与两极递减</b>（马鞍形）</td><td>变化较小（受径流与蒸发影响）</td><td>蒸发量与降水量的对比</td></tr>
      <tr><td>密度</td><td><b>随纬度增高而增大</b></td><td>随深度增加而增大</td><td>温度（其次盐度、压力）</td></tr>
    </tbody>
  </table>
  </div>
  <p class="gx-note">看这一列就能发现：<b>温度一路降、密度一路升、盐度中间高</b>。
  考题如果问"随纬度怎么变"，这三句几乎年年出现，必须能默写。</p>
</section>

<section class="gx-sec" id="b">
  <h2><span class="sn">02</span>拆开看</h2>
  <p class="gx-h2s">四张图：温度的两个方向、盐度为什么是马鞍形、密度跟谁走、两个极端海区怎么解释。</p>

  <!-- 图1 温度 -->

    <p class="gx-take">判断盐度高低的唯一标准是<b>"蒸发与降水的差额"</b>：蒸发 &gt; 降水 → 盐度高；蒸发 &lt; 降水 → 盐度低。
    温度高只是"蒸发强"的原因，<b>不能直接推出"盐度高"</b>——赤道就是反例。</p>
    <p class="gx-note">另外三个次要因素也要记：<b>入海径流</b>（有河注入 → 盐度低，如河口）、
    <b>结冰与融冰</b>（结冰时盐析出 → 周围海水盐度升高；融冰 → 盐度降低）、<b>海区封闭程度</b>（越封闭，越容易被蒸发/径流带偏）。</p>

        <p class="s-k">用到：副热带海区盐度最高的原因</p>

      <tr class="key"><td>密度随纬度</td><td><b>递增</b>（一路升）</td><td>温度降，密度升</td></tr>
      <tr><td>温度随纬度</td><td>递减</td><td>太阳辐射减少</td></tr>
      <tr><td>红海盐度高</td><td>蒸发强 + 无淡水 + 封闭</td><td>三条缺一不可</td></tr>
      <tr><td>波罗的海盐度低</td><td>蒸发弱 + 降水多 + 淡水多</td><td>不是"因为冷"</td></tr>
      <tr><td>船吃水变浅</td><td>驶入密度更大的海区</td><td>密度↑ → 浮力↑</td></tr>
    </tbody>
  </table>
  </div>

  <div class="gx-errs">
    <div class="er">
      <p class="er-x">✗ 赤道温度最高，所以盐度也最高</p>
      <p class="er-v">✓ 盐度最高在<b>副热带</b>；赤道<b>降水多</b>，稀释了盐分</p>
      <p class="er-w">错在哪：把"蒸发强"当成了"盐度高"。真正起作用的是<b>蒸发与降水的差额</b>。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 海水密度随纬度增高而增大，是因为盐度升高</p>
      <p class="er-v">✓ 主因是<b>温度降低</b>；盐度向两极其实是下降的</p>
      <p class="er-w">错在哪：没注意到盐度是"马鞍形"。若只靠盐度，密度不会单调上升。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 红海盐度高是因为水温高</p>
      <p class="er-v">✓ 是<b>蒸发远大于降水 + 几乎无河流注入 + 海区封闭</b>三者叠加</p>
      <p class="er-w">错在哪：只答了"蒸发强"的原因，漏了降水、径流、封闭三条。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 波罗的海盐度低是因为纬度高、水温低</p>
      <p class="er-v">✓ 是<b>蒸发弱 + 降水大于蒸发 + 大量河流注入</b></p>
      <p class="er-w">错在哪：低温只说明"蒸发弱"，真正稀释海水的是<b>降水和径流</b>。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 海水温度随深度一直降低</p>
      <p class="er-v">✓ 1000 m <b>以下变化幅度很小</b>，稳定在 2–4 ℃ 的低温</p>
      <p class="er-w">错在哪：把"降低"理解成"无限降"。深层是"稳定低温"，不是"越来越冷"。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 船从高纬驶向低纬，吃水变浅</p>
      <p class="er-v">✓ 低纬海水<b>密度小、浮力小</b>，吃水<b>变深</b></p>
      <p class="er-w">错在哪：方向反了。记法：<b>水"重"（密度大）船就浮得高（吃水浅）</b>。</p>
    </div>
  </div>
</section>

  数据口径：温度、盐度、密度的分布规律与影响因素均按教材表述；世界大洋平均盐度约 35‰，
  红海约 41‰、波罗的海约 10‰ 为教材与教学常用数值。<br>
  图 5 为<b>教学示意模型</b>：三条曲线用经验公式拟合分布趋势，只保证形状与量级，
  <b>不是实测海洋数据</b>；各海区具体数值会随季节与年份变化。

  <span class="gx-zoom-tip">双指放大 · 左右滑动看全图</span>

<script>
/* 海水的性质 · 讲义交互（等 page.js 把 #md 渲染成正文之后再跑） */
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var NS = "http://www.w3.org/2000/svg";
  function $(id) { return document.getElementById(id); }
  function el(tag, attrs, parent) {
    var n = document.createElementNS(NS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }
  function n1(v) { return (Math.round(v * 10) / 10).toString(); }

  if (!$("gxStage")) return;

  /* ================= 手机的图放大 ================= */
  (function () {
    var zoom = $("gxZoom"), inner = $("gxZoomInner");
    if (!zoom || !inner) return;
    Array.prototype.forEach.call(document.querySelectorAll(".gx-svgbox"), function (box) {
      box.style.cursor = "zoom-in";
      box.addEventListener("click", function () {
        if (window.innerWidth > 760) return;
        var svg = box.querySelector("svg");
        if (!svg) return;
        inner.textContent = "";
        inner.appendChild(svg.cloneNode(true));
        zoom.hidden = false;
        document.body.style.overflow = "hidden";
      });
    });
    function close() { zoom.hidden = true; document.body.style.overflow = ""; }
    zoom.addEventListener("click", function (e) {
      if (e.target === zoom || e.target.classList.contains("gx-zoom-x")) close();
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && !zoom.hidden) close();
    });
  })();

  /* ================= 分步揭示 ================= */
  (function () {
    var steps = document.querySelectorAll("#gxSteps .step");
    var ans = $("gxAns"), btn = $("gxNext"), cnt = $("gxCnt");
    if (!steps.length || !btn) return;
    var i = 1;
    function paint() { if (cnt) cnt.textContent = Math.min(i, steps.length) + " / " + steps.length; }
    steps[0].hidden = false;
    paint();
    btn.addEventListener("click", function () {
      if (i < steps.length) { steps[i].hidden = false; i++; }
      if (i >= steps.length) {
        if (ans) ans.hidden = false;
        btn.textContent = "已全部展开";
        btn.disabled = true;
      }
      paint();
    });
  })();

  /* ================= 互动：纬度 → 温度 / 盐度 / 密度 ================= */
  (function () {
    var stage = $("gxStage"), gG = $("gxGauge"), gC = $("gxCurves");
    var sl = $("gxSl"), vT = $("gxVt"), vS = $("gxVs"), vR = $("gxVr"), vSn = $("gxVsn"), box = $("gxStBox");

    var WIDE = {
      vb: "0 0 880 420", FS: 1,
      gg: { x: 28, y: 76, w: 232, gap: 100, bh: 20 },
      cv: { x: 372, y: 84, w: 466, h: 268 }, lg: { x: 640, gap: 70 }, bp: 620
    };
    var NARROW = {
      vb: "0 0 360 600", FS: 1.12,
      gg: { x: 14, y: 48, w: 196, gap: 66, bh: 16 },
      cv: { x: 44, y: 286, w: 300, h: 256 }, lg: { x: 186, gap: 55 }, bp: 620
    };
    var L = WIDE, FS = 1, PHI = 25, dragging = false, R = {};
    var PHI0 = 0, PHI1 = 80;

    var SER = [
      { key: "t", name: "温度", unit: "℃", col: "#0891b2", lo: 0, hi: 28 },
      { key: "s", name: "盐度", unit: "‰", col: "#b8791f", lo: 32.5, hi: 36.0 },
      { key: "r", name: "密度", unit: "kg/m³", col: "#2f8a5b", lo: 1023, hi: 1028 }
    ];

    /* 三条经验曲线 */
    function Tof(p) { return Math.max(0, 28 - 0.35 * p); }
    function Sof(p) {
      return 34.8 + Math.exp(-Math.pow((p - 25) / 14, 2)) - 2.3 * Math.pow(p / 90, 2);
    }
    function Rof(p) { return 1023 + 0.056 * p + 0.4 * (Sof(p) - 34.9); }
    function valOf(k, p) {
      if (k === "t") return Tof(p);
      if (k === "s") return Sof(p);
      return Rof(p);
    }
    function normOf(k, v) {
      var s = null, i;
      for (i = 0; i < SER.length; i++) if (SER[i].key === k) s = SER[i];
      return (v - s.lo) / (s.hi - s.lo);
    }

    function tx(parent, x, y, s, col, anchor, size, weight, halo) {
      var o = { x: n1(x), y: n1(y), "font-size": (size || 10.5) * FS, fill: col,
                "text-anchor": anchor || "start", "font-weight": weight || 400 };
      if (halo) o["class"] = "halo";
      var t = el("text", o, parent);
      t.textContent = s;
      return t;
    }

    function build() {
      gG.textContent = ""; gC.textContent = "";
      var G = L.gg, C = L.cv;

      /* ---------- 左：三个仪表 ---------- */
      tx(gG, G.x, G.y - 24, "当前值在量程中的位置", "#151a21", "start", 11.5, 700);
      R.fill = []; R.num = [];
      for (var i = 0; i < 3; i++) {
        var s = SER[i], gy = G.y + i * G.gap;
        tx(gG, G.x, gy - 6, s.name, "#3a3a35", "start", 11, 700);
        tx(gG, G.x + G.w, gy - 6, s.unit, "#9aa3ae", "end", 9.5);
        el("rect", { x: G.x, y: gy, width: G.w, height: G.bh, rx: 4, fill: "#eef2f5" }, gG);
        R.fill.push(el("rect", { x: G.x, y: gy, width: 20, height: G.bh, rx: 4, fill: s.col }, gG));
        R.num.push(tx(gG, G.x, gy + G.bh + 16, "", s.col, "start", 12.5, 700));
        tx(gG, G.x + G.w, gy + G.bh + 16, String(s.hi), "#9aa3ae", "end", 9);
      }

      /* ---------- 右：三条曲线 ---------- */
      tx(gC, C.x, C.y - 24, L === WIDE ? "随纬度的变化：形状不一样" : "三个量随纬度",
         "#151a21", "start", 11.5, 700);
      el("line", { x1: C.x, y1: C.y + C.h, x2: C.x + C.w, y2: C.y + C.h,
                   stroke: "#c9c2b0", "stroke-width": 1.2 }, gC);
      el("line", { x1: C.x, y1: C.y, x2: C.x, y2: C.y + C.h,
                   stroke: "#c9c2b0", "stroke-width": 1.2 }, gC);
      var g, gy2;
      [0, 25, 50, 75, 100].forEach(function (p) {
        var gx = C.x + (p / 100) * C.w;
        el("line", { x1: n1(gx), y1: C.y, x2: n1(gx), y2: C.y + C.h,
                     stroke: "#f2f4f6", "stroke-width": 1 }, gC);
      });
      [0, 0.5, 1].forEach(function (v) {
        gy2 = C.y + C.h - v * C.h;
        el("line", { x1: C.x, y1: n1(gy2), x2: C.x + C.w, y2: n1(gy2),
                     stroke: "#f2f4f6", "stroke-width": 1 }, gC);
      });
      [0, 20, 40, 60, 80].forEach(function (p) {
        var gx2 = C.x + (p / 100) * C.w;
        tx(gC, gx2, C.y + C.h + 15, p + "°", "#9aa3ae", "middle", 9.5);
      });
      tx(gC, C.x + C.w, C.y + C.h + 32, "纬度 →", "#5a6472", "end", 10);
      if (L === WIDE) {
        tx(gC, C.x, C.y + C.h + 38, "纵轴：各自量程归一化，只比形状不比数值", "#c3cad2", "start", 9.5);
      }

      /* 曲线 */
      R.curve = [];
      SER.forEach(function (s) {
        var d = "", first = true, p, v, px, py;
        for (p = 0; p <= 80.001; p += 1) {
          v = valOf(s.key, p);
          px = C.x + (p / 100) * C.w;
          py = C.y + C.h - normOf(s.key, v) * C.h;
          d += (first ? "M " : " L ") + n1(px) + " " + n1(py);
          first = false;
        }
        R.curve.push({ key: s.key, node: el("path", { d: d, fill: "none", stroke: s.col,
                                                       "stroke-width": 2.6 }, gC) });
      });

      /* 图例：与标题同一行，横排 */
      var lx0 = L.lg.x, ly0 = C.y - 28;
      SER.forEach(function (s, i) {
        var lx = lx0 + i * L.lg.gap;
        el("line", { x1: lx, y1: ly0, x2: lx + 16, y2: ly0,
                     stroke: s.col, "stroke-width": 3 }, gC);
        tx(gC, lx + 20, ly0 + 4, s.name, s.col, "start", 9.5, 700);
      });

      /* 游标 */
      R.vline = el("line", { stroke: "#5a6472", "stroke-width": 1.2,
                             "stroke-dasharray": "4 4" }, gC);
      R.dots = SER.map(function (s) {
        return el("circle", { r: 4.2, fill: "#fff", stroke: s.col, "stroke-width": 2.2 }, gC);
      });
      R.pLab = tx(gC, 0, 0, "", "#3a3a35", "middle", 10.5, 700, true);
    }

    function render() {
      var G = L.gg, C = L.cv;
      var t = Tof(PHI), s = Sof(PHI), r = Rof(PHI);

      /* 仪表 */
      var vals = [t, s, r];
      for (var i = 0; i < 3; i++) {
        var nv = Math.max(0.02, Math.min(1, normOf(SER[i].key, vals[i])));
        R.fill[i].setAttribute("width", n1(G.w * nv));
        R.num[i].textContent = (SER[i].key === "r" ? r.toFixed(1) : vals[i].toFixed(1)) +
                               " " + SER[i].unit;
      }

      /* 游标 */
      var cx = C.x + (PHI / 100) * C.w;
      R.vline.setAttribute("x1", n1(cx)); R.vline.setAttribute("x2", n1(cx));
      R.vline.setAttribute("y1", n1(C.y)); R.vline.setAttribute("y2", n1(C.y + C.h));
      SER.forEach(function (sv, k) {
        var py = C.y + C.h - normOf(sv.key, vals[k]) * C.h;
        R.dots[k].setAttribute("cx", n1(cx));
        R.dots[k].setAttribute("cy", n1(py));
      });
      R.pLab.setAttribute("x", n1(cx));
      R.pLab.setAttribute("y", n1(C.y - 6));
      R.pLab.textContent = PHI + "°N";

      /* 数值卡 */
      vT.textContent = t.toFixed(1) + " ℃";
      vS.textContent = s.toFixed(1) + "‰";

      var name, sn, cc, bg;
      if (PHI < 10) {
        name = "赤道海区"; sn = "高温多雨，盐度略低于副热带"; cc = "#0b6580"; bg = "#ecfbff";
      } else if (PHI < 35) {
        name = "副热带海区"; sn = "蒸发远大于降水，盐度最高"; cc = "#8a5c14"; bg = "#fdf3e0";
      } else if (PHI < 60) {
        name = "中纬海区"; sn = "温度下降，盐度回落"; cc = "#1e6640"; bg = "#e6f6ee";
      } else {
        name = "高纬海区"; sn = "蒸发弱、融冰稀释，盐度最低"; cc = "#3f6f92"; bg = "#eef4f8";
      }
      vR.textContent = name; vSn.textContent = sn;
      vR.style.color = cc;
      box.style.background = bg;
      box.style.borderColor = cc + "44";
      if (sl.value !== String(PHI)) sl.value = PHI;
    }

    function applyLayout() {
      var w = stage.parentElement.getBoundingClientRect().width;
      L = w >= WIDE.bp ? WIDE : NARROW;
      FS = L.FS;
      stage.setAttribute("viewBox", L.vb);
      build();
      render();
    }

    sl.addEventListener("input", function () { PHI = +this.value; render(); });
    $("gxP1").addEventListener("click", function () { PHI = 0; render(); });
    $("gxP2").addEventListener("click", function () { PHI = 25; render(); });
    $("gxP3").addEventListener("click", function () { PHI = 45; render(); });
    $("gxP4").addEventListener("click", function () { PHI = 75; render(); });

    function setFromX(clientX) {
      var bb = stage.getBoundingClientRect();
      var vbw = parseFloat(L.vb.split(" ")[2]);
      var x = (clientX - bb.left) * (vbw / bb.width);
      var frac = (x - L.cv.x) / L.cv.w;
      PHI = Math.max(0, Math.min(80, Math.round(frac * 80)));
      render();
    }
    stage.addEventListener("pointerdown", function (ev) {
      dragging = true;
      try { stage.setPointerCapture(ev.pointerId); } catch (e) {}
      setFromX(ev.clientX);
    });
    stage.addEventListener("pointermove", function (ev) {
      if (!dragging) return;
      ev.preventDefault();
      setFromX(ev.clientX);
    });
    ["pointerup", "pointercancel"].forEach(function (e) {
      stage.addEventListener(e, function () { dragging = false; });
    });
    window.addEventListener("blur", function () { dragging = false; });

    var tmr = null;
    window.addEventListener("resize", function () {
      clearTimeout(tmr);
      tmr = setTimeout(applyLayout, 180);
    });

    applyLayout();
  })();
});
</script>
