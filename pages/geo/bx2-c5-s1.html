<p class="gx-lede">1952 年 12 月，伦敦连续几天大雾不散，工厂和家庭的煤烟被压在近地面，

<!-- ================= A ================= -->
<section class="gx-sec" id="a">
  <h2><span class="sn">01</span>课本怎么说</h2>
  <p class="gx-h2s">先背标准表述，再看解释。顺序反了，答题时就写不出术语。</p>

  <div class="gx-quote">
    <p class="q-t">课本要点 · 环境问题的含义<span class="q-src">人教版（2019）必修第二册 · 第五章第一节</span></p>
    <p class="q-b">环境问题是指人类在生产和生活过程中，向环境索取资源、排放废弃物的数量或方式超出了环境的承载能力，使环境质量下降、生态平衡遭到破坏，并对人类自身的生存和发展造成危害的现象。</p>
    <p class="q-n">→ 定义里有<b>三件事</b>：① <b>人类活动</b>引起（不是纯自然现象）；
    ② 出现了<b>“超出”</b>——排放超过自净能力，或索取超过再生能力；
    ③ 结果是<b>危害人类</b>。判断某现象算不算环境问题，就看有没有第 ② 条“超出”。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本要点 · 环境问题的三类<span class="q-src">人教版（2019）必修第二册 · 第五章第一节</span></p>
    <p class="q-b">环境问题主要表现为环境污染、生态破坏和资源短缺三大类。环境污染包括大气污染、水污染、土壤污染、固体废弃物污染、噪声污染等；生态破坏包括森林减少、水土流失、土地荒漠化、生物多样性减少等；资源短缺包括水资源、土地资源、矿产资源与能源短缺等。</p>
    <p class="q-n">→ 记忆用三个动词分开：<b>排放多了 → 环境污染</b>；<b>索取多了 → 生态破坏</b>；<b>取用超过储量 → 资源短缺</b>。
    三类的<b>主体相同</b>（都是人类活动），<b>作用方向不同</b>（向外排、向自然取、取到不够用）。
    答题时先判断“这个材料属于哪一类”，再谈成因，才不会被判“分类错误”。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本要点 · 产生的三个原因<span class="q-src">人教版（2019）必修第二册 · 第五章第一节</span></p>
    <p class="q-b">环境问题的产生，既有自然原因，也有人为原因。人为原因主要有：人口压力过大，资源的不合理利用，以及片面追求经济增长。</p>
    <p class="q-n">→ <b>一条自然背景 + 三条人为原因</b>，这就是标准答案的骨架。
    自然背景（干旱、地形封闭、气候条件）是“放大器”，人为原因是“扳机”：
    <b>干旱区 + 大水漫灌 = 次生盐碱化</b>，缺了任何一半都解释不通。
    只写“人口太多”是最常见的一刀切，三条里只答了一条。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本要点 · 全球性环境问题<span class="q-src">人教版（2019）必修第二册 · 第五章第一节</span></p>
    <p class="q-b">有些环境问题的影响超出国界，成为全球性问题，如全球气候变暖、臭氧层破坏、酸雨、生物多样性减少、土地荒漠化、海洋污染等。</p>
    <p class="q-n">→ “全球性”的判据不是“问题大”，而是<b>影响范围跨越国界、成因与后果互相牵连</b>，
    所以只能靠国际合作解决。目前全球大气二氧化碳平均浓度已达<b>约 420 ppm</b>，
    全球平均气温比工业化前升高<b>约 1.1 ℃</b>——这两个数字就是“全球变暖”最硬的证据。</p>
  </div>

  <p class="gx-h2s" style="margin-top:18px">三类环境问题，用一条判据分开（考场上先分类，再答成因）：</p>
  <div style="overflow-x:auto">
  <table class="gx-cmp">
    <thead><tr><th>类型</th><th>主要表现</th><th>典型事例</th><th>一句话判据</th></tr></thead>
    <tbody>
      <tr><td>环境污染</td><td>大气、水、土壤、固废、噪声污染</td><td>伦敦烟雾事件、日本水俣病、太湖蓝藻</td><td>排放量 &gt; 环境自净能力</td></tr>
      <tr class="key"><td>生态破坏</td><td>森林减少、水土流失、荒漠化、生物多样性减少</td><td>黄土高原水土流失、亚马孙雨林减少</td><td>索取量 &gt; 生态系统再生能力</td></tr>
      <tr><td>资源短缺</td><td>水资源、耕地、矿产、能源不足</td><td>华北地下水超采、耕地数量减少</td><td>取用量 &gt; 储量或补给速度</td></tr>
    </tbody>
  </table>
  </div>
  <p class="gx-note">这张表最好背的是<b>最后一列</b>，不是“典型事例”。事例记再多，判据没记住，遇到新材料仍然归不了类。
  另外注意：三类常常<b>同时出现、互为因果</b>——植被破坏（生态）会加剧水土流失、减少耕地（短缺），
  焚烧秸秆又造成大气污染。所以题目问“主要环境问题”，通常要答出<b>两类以上</b>。</p>
</section>

    <div class="qac">
      <p class="q">「发达国家已经没有环境问题了吗？」</p>
      <p class="a"><b>不是。</b>发达国家工业化早期污染严重（伦敦烟雾、洛杉矶光化学烟雾），
      现在常规污染大幅治理，但<b>高消费带来较高的人均碳排放</b>，还把高污染产业<b>转移到发展中国家</b>。
      所以它们的环境问题从“本地可见”变成“全球分散”。</p>
      <svg viewBox="0 0 240 132" role="img" aria-label="发达国家污染转移示意：高污染产业转向发展中国家">

        <rect x="140" y="40" width="86" height="52" rx="6" fill="#fdf7f4" stroke="#f0d6cc"/>

    </div>

    <div class="qac">
      <p class="q">「城市和乡村的环境问题一样吗？」</p>
      <p class="a"><b>不一样，主次不同。</b>城市人口产业集中，以<b>环境污染</b>为主（大气、噪声、垃圾）；
      乡村以<b>生态破坏</b>为主（水土流失、荒漠化），同时有化肥农药、畜禽养殖带来的<b>面源污染</b>。
      说“乡村没有污染”也不对。</p>

    <div class="qac">
      <p class="q">「资源短缺也算环境问题吗？」</p>
      <p class="a"><b>算，而且是三大类之一。</b>判据是<b>取用量超过储量或补给速度</b>：
      华北地下水超采形成漏斗区、耕地被占用导致数量减少、矿产与能源供给紧张。
      它不是“污染”，但同样是<b>人类需求超过环境供给能力</b>。</p>
      <svg viewBox="0 0 240 132" role="img" aria-label="地下水超采导致水位下降，形成资源短缺">

    <div class="qac">
      <p class="q">「先污染后治理是必然规律吗？」</p>
      <p class="a"><b>不是必然，但它是很多国家走过的弯路。</b>后发国家可以借<b>技术引进</b>和<b>制度约束</b>
      少走这段路——把污染治理设施与产业同步建设，比事后治理便宜得多。所以答题时写“<b>可以避免</b>”，
      而不是“必须经历”。</p>
      <svg viewBox="0 0 240 132" role="img" aria-label="两种路径对比：先污染后治理与同步治理">

  环境问题的所有设问，第一步永远是<b>分类</b>，而不是背事例。</p>

<script>
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var sP = document.getElementById("envP");
  var sA = document.getElementById("envA");
  var sT = document.getElementById("envT");
  if (!sP || !sA || !sT) return;

  var barP = document.getElementById("envBarP");
  var barA = document.getElementById("envBarA");
  var barT = document.getElementById("envBarT");
  var vP = document.getElementById("envPv");
  var vA = document.getElementById("envAv");
  var vT = document.getElementById("envTv");
  var mark = document.getElementById("envMark");
  var dot = document.getElementById("envDot");

  var o1 = document.getElementById("envV1");
  var o1s = document.getElementById("envV1s");
  var o2 = document.getElementById("envV2");
  var o2s = document.getElementById("envV2s");
  var o3 = document.getElementById("envV3");
  var o3s = document.getElementById("envV3s");

  var BASE = 186;   // 柱子基线 y
  var UNIT = 44;    // 1 个单位 = 44 px
  var IAX0 = 44;    // I 条起点 x
  var IAXW = 352;   // I 条总长（对应 0—300）

  function bar(rect, txt, v) {
    var h = v * UNIT;
    rect.setAttribute("y", String(BASE - h));
    rect.setAttribute("height", String(h));
    txt.setAttribute("y", String(BASE - h - 8));
    txt.textContent = v.toFixed(1);
  }

  function render() {
    var P = +sP.value, A = +sA.value, T = +sT.value;
    var I = P * A * T * 100;

    bar(barP, vP, P);
    bar(barA, vA, A);
    bar(barT, vT, T);

    var x = IAX0 + Math.min(I, 300) / 300 * IAXW;
    mark.setAttribute("x1", String(x));
    mark.setAttribute("x2", String(x));
    dot.setAttribute("cx", String(x));

    o1.textContent = Math.round(I);
    o1s.textContent = "P " + P.toFixed(1) + " × A " + A.toFixed(1) + " × T " + T.toFixed(1);

    if (I < 80) {
      o2.textContent = "低压力";
      o2.style.color = "#1e6640";
      o2s.textContent = "I < 80，仍在环境可承载区间";
    } else if (I <= 120) {
      o2.textContent = "中等压力";
      o2.style.color = "#b8791f";
      o2s.textContent = "80—120，接近临界，需警惕";
    } else {
      o2.textContent = "高压力";
      o2.style.color = "#b8402f";
      o2s.textContent = "I > 120，已超出环境承载能力";
    }

    var mx = Math.max(P, A, T);
    var tied = (mx - Math.min(P, A, T)) < 0.05;
    var names = { P: "人口规模 P", A: "人均消耗 A", T: "技术影响 T" };
    if (tied) {
      o3.textContent = "三者相当";
      o3s.textContent = "三个因子几乎相等，没有一个明显主导";
    } else {
      var key = mx === P ? "P" : (mx === A ? "A" : "T");
      o3.textContent = names[key];
      o3s.textContent = "该因子为 " + mx.toFixed(1) + " 倍，是当前的短板";
    }
  }

  [sP, sA, sT].forEach(function (el) {
    el.addEventListener("input", render);
  });

  render();
});
</script>
