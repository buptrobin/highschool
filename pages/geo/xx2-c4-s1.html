    <p class="q-b">河流及其集水区域称为流域，流域以分水岭为界；流域具有整体性强、上下游关联紧密的特点。</p>
    <p class="q-n">→ 三个条件：①边界是分水岭（自然界线）；②内部靠水流连成一个系统；③上游的任何改变都会传给下游。</p>

  <div class="gx-ex">
    <p class="ex-t">例题 · 流域整体性与协调<span class="bdg bdg-must">必考</span></p>
    <p class="ex-q">某河上游灌溉面积扩大，下游断流天数增加，河口湿地萎缩。（1）说明流域整体性的表现；（2）分析上游用水增加对下游的影响；（3）提出流域协调发展的措施。</p>
    <ol class="steps" id="gxSteps">
      <li class="step"><p class="s-h">第 1 步 · 先定一条链</p><p class="s-b">把材料拆成"上游灌溉—中游来水—下游断流—河口湿地"四个环节，确认它们由同一股水流串起来。</p><p class="s-k">用到：流域以分水岭为界，上下游关联紧密。</p></li>
      <li class="step" hidden><p class="s-h">第 2 步 · 答第（1）问</p><p class="s-b">整体性有两层：自然要素（气候、水文、土壤、生物）相互影响；人类活动通过水流从上游传到下游。所以上游一变，下游跟着变。</p><p class="s-k">用到：整体性＝牵一发而动全身。</p></li>
