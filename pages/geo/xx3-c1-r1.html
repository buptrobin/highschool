<section class="gx-sec" id="a">
  <h2><span class="sn">01</span>课本怎么说</h2>
  <p class="gx-h2s">先背标准表述，再看解释。</p>

  <div class="gx-quote">
    <p class="q-t">课本表述 · 生态足迹与生物承载力<span class="q-src">人教版（2019）选择性必修3 · 第一章问题研究</span></p>
    <p class="q-b">生态足迹，是指维持一定人口所需的生产性土地面积，包括耕地、草地、林地、渔业水域、建设用地和碳汇用地，通常以全球公顷（gha）计量。生物承载力，是指一个地区所能提供的生产性土地面积。</p>
    <p class="q-n">→ 翻成人话：足迹是需求侧，把人口消费折算成土地——消费量 ÷ 单位面积产量 = 所需面积，六类分别算完再加碳汇用地；承载力是供给侧，是地区拿得出的土地。两者单位相同，才能相减。</p>
  </div>

  <div style="overflow-x:auto">
  <table class="gx-cmp">
    <thead><tr><th>比什么</th><th>生态足迹</th><th>生物承载力</th></tr></thead>
    <tbody>
      <tr><td>含义</td><td>维持人口消费所需的土地</td><td>地区可提供的生产性土地</td></tr>
      <tr><td>侧别</td><td>需求</td><td>供给</td></tr>
      <tr><td>单位</td><td>全球公顷（gha）</td><td>全球公顷（gha）</td></tr>
      <tr><td>全球人均</td><td>约 2.7 gha</td><td>约 1.6 gha</td></tr>
      <tr class="key"><td>判断</td><td>大于承载力 → 生态赤字</td><td>大于足迹 → 生态盈余</td></tr>
    </tbody>
  </table>
  </div>
  <p class="gx-note">这张表最容易背反的是减法方向：生态赤字 = 足迹 − 承载力（结果为正）；生态盈余 = 承载力 − 足迹（结果为正）。</p>
</section>

<section class="gx-sec" id="d">
  <h2><span class="sn">04</span>一道题走一遍</h2>
  <p class="gx-h2s">先读题干想 30 秒，再点「下一步」；每一步只推进一个判断。</p>

  <div class="gx-ex">
    <p class="ex-t">例题<span class="bdg bdg-must">必考</span></p>
    <p class="ex-q">某国人均生态足迹为 5.0 gha，人均生物承载力为 1.2 gha，人口 5 000 万。问：（1）计算该国生态赤字总量；（2）说明人均生态足迹的构成；（3）提出缩小生态赤字的措施。</p>
    <ol class="steps" id="gxSteps">
      <li class="step"><p class="s-h">第 1 步 · 先分清「人均」与「总量」</p><p class="s-b">题干给了人均足迹、人均承载力和人口，问的是总量。先把人均赤字算出来，再乘人口；不要一上来就拿 5.0 去乘人口。</p><p class="s-k">用到：生态赤字 = 足迹 − 承载力。</p></li>
      <li class="step" hidden><p class="s-h">第 2 步 · 算人均赤字</p><p class="s-b">5.0 − 1.2 = 3.8 gha/人。结果为正，说明是赤字；若为负，才是盈余。</p><p class="s-k">用到：正负号判断盈余与赤字。</p></li>
      <li class="step" hidden><p class="s-h">第 3 步 · 乘人口，盯住单位</p><p class="s-b">5 000 万 = 5×10⁷ 人；3.8 × 5×10⁷ = 1.9×10⁸ gha，即 1.9 亿 gha。答案必须带 gha。</p><p class="s-k">用到：总量 = 人均 × 人口。</p></li>

document.addEventListener("DOMContentLoaded", function () {

  var BASE = 1.0, PPM = 0.02, CAP = 1.6;
  var SEGS = [

    { k: "草地", v: 0.14, c: "#7aa35a" },
    { k: "林地", v: 0.18, c: "#1f6f8b" },
    { k: "渔业水域", v: 0.08, c: "#4aa3c0" },
    { k: "建设用地", v: 0.08, c: "#8d8d86" }
  ];
  var CARBON_C = "#c08a3e";

  var WIDE = {
    vb: "0 0 880 400", fs: 1,
    t1: [30, 32], t2: [470, 32],
    bar: { x: 40, y: 80, w: 360, h: 44 },
    legend: { cols: [40, 170, 300], rows: [158, 190, 222], sw: 11, n: 3 },
    note: [40, 252],
    chart: { base: 330, scale: 80, axisX: 470, top: 86, lineX2: 840, barX: 620, barW: 90 }
  };
  var NARROW = {
    vb: "0 0 360 540", fs: 0.94,
    t1: [20, 26], t2: [20, 268],
    bar: { x: 24, y: 60, w: 312, h: 36 },
    legend: { cols: [24, 180], rows: [130, 158, 186], sw: 10, n: 2 },
    note: [24, 214],
    chart: { base: 500, scale: 60, axisX: 40, top: 300, lineX2: 336, barX: 200, barW: 70 }

  var L = WIDE, A = 60;

  function foot() { return BASE + PPM * A; }
  function carbon() { return 0.20 + PPM * A; }
  function stateOf(f) {
    if (Math.abs(f - CAP) < 0.001) return { t: "收支平衡", c: "#9a6a12", bg: "#fdf3e2", s: "足迹 = 承载力" };
    if (f < CAP) return { t: "生态盈余", c: "#1e6640", bg: "#e6f6ee", s: "足迹 < 承载力" };
    return { t: "生态赤字", c: "#b8402f", bg: "#fbeae7", s: "足迹 > 承载力" };
  }

  function T(p, x, y, s, fill, anchor, size, weight) {
    return tx(p, x, y, s, fill, anchor || "start", size || 9.5 * L.fs, weight || 400);
  }

  function build(f, st) {
    var fs = L.fs, gA = $("gxA"), gB = $("gxB");

    T(gA, L.t1[0], L.t1[1], "① 六类用地（人均，gha）", "#151a21", "start", 11.5 * fs, 700);

    el("rect", { x: bar.x, y: bar.y, width: bar.w, height: bar.h, fill: "#eef3f6", stroke: "#c9d8e2" }, gA);

      var cx = lg.cols[i % lg.n], cy = lg.rows[Math.floor(i / lg.n)];

    T(gA, L.note[0], L.note[1], "碳汇用地随消费强度增加而扩大", "#6b7280", "start", 9 * fs);

    T(gB, L.t2[0], L.t2[1], "② 足迹 vs 承载力（gha）", "#151a21", "start", 11.5 * fs, 700);
    el("line", { x1: ch.axisX, y1: ch.top, x2: ch.axisX, y2: ch.base + 4, stroke: "#b9c8d3", "stroke-width": 1 }, gB);
    for (i = 0; i <= 3; i++) {
      var gy = ch.base - i * ch.scale;
      el("line", { x1: ch.axisX, y1: gy, x2: ch.lineX2, y2: gy, stroke: "#e3ebf1", "stroke-width": 1 }, gB);
      T(gB, ch.axisX - 8, gy + 3, String(i), "#6b7280", "end", 9 * fs);
    }

    var capY = ch.base - CAP * ch.scale;
    el("line", { x1: ch.axisX, y1: capY, x2: ch.lineX2, y2: capY, stroke: "#1e6640", "stroke-width": 1.2, "stroke-dasharray": "5 4" }, gB);
    T(gB, ch.axisX + 8, capY - 7, "承载力 1.6 gha", "#1e6640", "start", 9.5 * fs, 700);

    var top = ch.base - f * ch.scale;
    el("rect", { x: ch.barX, y: top, width: ch.barW, height: f * ch.scale, rx: 2, fill: st.c }, gB);
    T(gB, ch.barX + ch.barW / 2, top - 8, f.toFixed(2), st.c, "middle", 12 * fs, 700);
    T(gB, ch.barX + ch.barW / 2, ch.base + 18, "人均足迹", "#6b7280", "middle", 9 * fs);

    var bx = ch.barX + ch.barW + 16;
    if (f > CAP + 0.001) {
      el("line", { x1: bx, y1: capY, x2: bx, y2: top, stroke: "#9a6a12", "stroke-width": 1.2 }, gB);
      el("line", { x1: bx - 5, y1: top, x2: bx + 5, y2: top, stroke: "#9a6a12", "stroke-width": 1.2 }, gB);
      el("line", { x1: bx - 5, y1: capY, x2: bx + 5, y2: capY, stroke: "#9a6a12", "stroke-width": 1.2 }, gB);
      T(gB, bx + 8, (capY + top) / 2 + 3, "赤字 " + (f - CAP).toFixed(2), "#9a6a12", "start", 9.2 * fs, 700);
    } else if (f < CAP - 0.001) {
      el("line", { x1: bx, y1: top, x2: bx, y2: capY, stroke: "#1e6640", "stroke-width": 1.2 }, gB);
      el("line", { x1: bx - 5, y1: top, x2: bx + 5, y2: top, stroke: "#1e6640", "stroke-width": 1.2 }, gB);
      el("line", { x1: bx - 5, y1: capY, x2: bx + 5, y2: capY, stroke: "#1e6640", "stroke-width": 1.2 }, gB);
      T(gB, bx + 8, (top + capY) / 2 + 3, "盈余 " + (CAP - f).toFixed(2), "#1e6640", "start", 9.2 * fs, 700);
    } else {
      T(gB, bx + 4, capY - 6, "收支平衡", "#9a6a12", "start", 9.2 * fs, 700);
    }
  }

  function render() {
    var f = foot(), st = stateOf(f);
    build(f, st);
    $("gxVi").textContent = String(A);
    $("gxVf").textContent = f.toFixed(2);
    $("gxVc").textContent = CAP.toFixed(2);
    $("gxVs").textContent = st.t;
    $("gxVsn").textContent = st.s;
    $("gxStBox").style.background = st.bg;
    $("gxStBox").style.borderColor = st.c + "44";
    $("gxVs").style.color = st.c;
    $("gxSl").value = String(A);
  }

  function applyLayout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? WIDE : NARROW;
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  $("gxSl").addEventListener("input", function () { A = +this.value; render(); });
  $("gxP1").addEventListener("click", function () { A = 30; render(); });

  stage.addEventListener("keydown", function (ev) {

  var tmr = null;
  window.addEventListener("resize", function () {
    clearTimeout(tmr); tmr = setTimeout(applyLayout, 180);
  });
  applyLayout();
});
