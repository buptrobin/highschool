<script type="text/markdown" id="md">
<div class="gx">

<div class="gx-kicker">ELI5-HIGH · 讲给要考试的人</div>
<p class="gx-claim">人口容量不是一个固定的数，而是<b>一条随消费水平下滑的曲线</b>：同一块地，吃得越讲究，装的人越少。</p>
<div class="gx-meta">
  <span><i></i>人教版必修第二册 第一章第三节</span>
  <span><i></i>高一 · 人文地理</span>
  <span><i></i>阅读 12 分钟</span>
  <span><i></i>含 1 个动手点</span>
</div>
<p class="gx-lede">这一节考的是<b>三个概念分不清</b>：资源环境承载力、人口容量、人口合理容量。
最大的区别只有一个词——<b>“最大”还是“最适宜”</b>。最容易丢分的是把“人口容量”和“人口合理容量”当成同一个数，
其次是把“科技发达”当成“容量可以无限大”。</p>

<nav class="gx-toc">
  <a href="#a">① 课本怎么说</a><a href="#b">② 拆开看</a><a href="#c">③ 自己拖一下</a>
  <a href="#d">④ 一道题走一遍</a><a href="#e">⑤ 会怎么考</a><a href="#f">⑥ 易错清单</a>

<!-- ================= A ================= -->
<section class="gx-sec" id="a">
  <h2><span class="sn">01</span>课本怎么说</h2>
  <p class="gx-h2s">先背标准表述，再看解释。顺序反了，答题时就写不出术语。</p>

  <div class="gx-quote">
    <p class="q-t">课本要点 · 资源环境承载力<span class="q-src">人教版（2019）必修第二册 · 第一章第三节</span></p>
    <p class="q-b">资源环境承载力，是指一定时期内，在维持相对稳定的前提下，资源环境所能容纳的人口规模和经济规模的大小。</p>
    <p class="q-n">→ 这句的重点是“<b>资源环境</b>”：只算<b>水、土、矿产、能源、生态</b>能撑住多少人，
    不管技术多先进、生活多讲究。它是<b>最硬的那条上限</b>，也是另外两个概念的地基。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本要点 · 人口容量<span class="q-src">人教版（2019）必修第二册 · 第一章第三节</span></p>
    <p class="q-b">人口容量，是指在一定的自然资源和经济社会条件下，一个国家或地区所能容纳的最高人口数量。</p>
    <p class="q-n">→ 关键词是<b>“最高”</b>。它比资源环境承载力多考虑了两样：
    <b>科技水平</b>（能不能把资源用得更省）和<b>消费水平</b>（每人要消耗多少）。
    所以“人口容量”是一个<b>上限</b>，不是“合适的人数”。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本要点 · 人口合理容量<span class="q-src">人教版（2019）必修第二册 · 第一章第三节</span></p>
    <p class="q-b">人口合理容量，是指按照合理的生活方式、保障健康的生活水平，同时又不妨碍未来人口生活质量的前提下，一个国家或地区最适宜的人口数量。</p>
    <p class="q-n">→ 关键词是<b>“最适宜”</b>，而且带着两个条件：<b>保障健康的生活水平</b>、<b>不妨碍未来人口</b>。
    它永远<b>小于</b>人口容量。一句话区分：容量是“<b>最多能装多少</b>”，合理容量是“<b>装多少最舒服、最可持续</b>”。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本要点 · 影响因素与木桶效应<span class="q-src">人教版（2019）必修第二册 · 第一章第三节</span></p>
    <p class="q-b">影响人口容量的因素主要有：自然资源、科技发展水平、人口的生活和文化消费水平、地区的对外开放程度。木桶效应表明，一个地区的人口容量，取决于最短缺的那种资源。</p>
    <p class="q-n">→ 这一句给了<b>四个因素 + 一条定律</b>：<b>资源、科技、消费、开放</b>，
    加上“<b>短板决定容量</b>”。答题时按“哪一项是短板 → 能不能补 → 怎么补”的顺序写，条理立刻清楚。</p>
  </div>

  <p class="gx-h2s" style="margin-top:18px">三个概念摆在一起看，区别只有两个词：</p>
  <div style="overflow-x:auto">
  <table class="gx-cmp">
    <thead><tr><th>概念</th><th>是什么</th><th>关键词</th></tr></thead>
    <tbody>
      <tr><td>资源环境承载力</td><td>资源环境<b>持续支撑</b>的最大人口规模</td><td>只看资源环境，最硬的上限</td></tr>
      <tr><td>人口容量</td><td>一定资源与经济社会条件下<b>能容纳的最高人口数量</b></td><td>“<b>最高</b>”——上限，不是合适</td></tr>
      <tr class="key"><td>人口合理容量</td><td>保障健康生活、又不妨碍后代前提下的<b>最适宜人口数量</b></td><td>“<b>最适宜</b>”——小于容量，可持续</td></tr>
    </tbody>
  </table>
  </div>
  <p class="gx-note">这张表只高亮了一行，因为<b>整节的分水岭就在“合理”两个字</b>：
  问“最多能装多少”答容量；问“多少最合适、最可持续”答合理容量。这两个答案<b>数值不同</b>，写错就整题跑偏。</p>
</section>

<script>
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var stage = document.getElementById("capStage");
  if (!stage) return;

  var sl = document.getElementById("capSl");
  var dot = document.getElementById("capDot");
  var curve = document.getElementById("capCurve");
  var pt = document.getElementById("capPt");
  var v1 = document.getElementById("capV1");
  var v2 = document.getElementById("capV2");
  var v3 = document.getElementById("capV3");
  var why = document.getElementById("capWhy");

  var R = 100, X0 = 58, X1 = 396, YB = 252, YT = 40, MAX = 10000;
  var unitX = (X1 - X0) / 9;          // c 从 1 到 10
  var unitY = (YB - YT) / MAX;        // 容量 0 到 10000 万

  function xOf(c) { return X0 + (c - 1) * unitX; }
  function yOf(v) { return YB - v * unitY; }
  function capacity(c) { return R * 100 / c; }

  // 曲线只建一次：容量 = R*100/c
  var d = "";
  for (var i = 0; i <= 180; i++) {
    var cc = 1 + i / 180 * 9;
    d += (i ? " L " : "M ") + xOf(cc).toFixed(1) + " " + yOf(capacity(cc)).toFixed(1);
  }
  curve.setAttribute("d", d);

  function render() {
    var c = +sl.value;
    var cap = capacity(c);
    var capR = Math.round(cap);

    dot.setAttribute("cx", xOf(c).toFixed(1));
    dot.setAttribute("cy", yOf(cap).toFixed(1));
    pt.textContent = "c＝" + c + " → 容量 " + capR + " 万";
    v1.textContent = c;
    v2.textContent = capR;

    var state, color, wtext;
    if (cap >= 2400) {
      state = "宽松"; color = "#1e6640";
      wtext = "余量约 " + (capR - 2000) + " 万，资源尚有潜力";
    } else if (cap >= 1800) {
      state = "临界"; color = "#8a5c14";
      wtext = "与实际人口大致持平，几乎没有余量";
    } else {
      state = "超载"; color = "#b8402f";
      wtext = "缺口约 " + (2000 - capR) + " 万，靠透支资源维持";
    }
    v3.textContent = state;
    v3.style.color = color;
    why.textContent = wtext;
    dot.setAttribute("fill", color);
  }

  sl.addEventListener("input", render);
  render();
});
</script>
