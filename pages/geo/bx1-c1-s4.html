<section class="gx-sec" id="a">
  <h2><span class="sn">01</span>课本怎么说</h2>
  <p class="gx-h2s">先背标准表述，再看解释。顺序反了，答题时就写不出术语。</p>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 地震波<span class="q-src">人教版（2019）必修第一册 · 第一章第四节</span></p>
    <p class="q-b">地震发生时，地下岩石受到强烈冲击，产生弹性震动，并以波的形式向四周传播，这种波叫地震波。地震波分为纵波和横波。纵波的传播速度较快，可以通过固体、液体和气体传播；横波的传播速度较慢，只能通过固体传播。</p>
    <p class="q-n">→ 两句话就是全部判据：<b>纵波（P 波）快、三态都能过；横波（S 波）慢、只能过固体</b>。
    正因为这个差别，<b>横波消失的地方一定是液态</b>——这是人类"看见"地核的唯一办法。
    答题时必须写清"<b>纵波</b>"和"<b>横波</b>"，不能只写"地震波"。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 两个界面与三个圈层<span class="q-src">人教版（2019）必修第一册 · 第一章第四节</span></p>
    <p class="q-b">地震波传播速度突然发生变化的地方，就是地球内部的两个不连续面：莫霍界面和古登堡界面。莫霍界面平均深度约 33 km（大陆部分），纵波和横波的传播速度都明显增加；古登堡界面深度约 2900 km，纵波的传播速度突然下降，横波完全消失。这两个界面把地球内部分为地壳、地幔和地核三个圈层。</p>
    <p class="q-n">→ <b>两个界面、两组数字、两种变化</b>，必须一一对应：
    <b>莫霍 33 km → 两波都变快</b>；<b>古登堡 2900 km → P 波变慢、S 波消失</b>。
    注意"<b>增加</b>"和"<b>下降</b>"这两个方向词，写反了就是没读懂图。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 岩石圈与外部圈层<span class="q-src">人教版（2019）必修第一册 · 第一章第四节</span></p>
    <p class="q-b">地壳和上地幔顶部（软流层以上），由坚硬的岩石组成，合称岩石圈。地球外部圈层包括大气圈、水圈和生物圈。生物圈是地球上所有生物及其生存环境的总称。</p>
    <p class="q-n">→ 这是本节<b>最容易丢分</b>的一句：<b>岩石圈 ≠ 地壳</b>。
    岩石圈 = <b>地壳 + 上地幔顶部（软流层以上）</b>，比地壳厚。
    而<b>软流层</b>在上地幔上部、岩石圈之下，是<b>岩浆的主要发源地</b>，它<b>不属于</b>岩石圈。</p>
  </div>

  <p class="gx-h2s" style="margin-top:18px">把"界面—波速—圈层"三列对上，这张表就是全部考点：</p>
  <div style="overflow-x:auto">
  <table class="gx-cmp">
    <thead><tr><th>界面 / 位置</th><th>波速怎么变</th><th>说明什么</th><th>对应圈层</th></tr></thead>
    <tbody>
      <tr><td>莫霍界面<br>约 33 km</td><td><b>P 波和 S 波都明显增加</b></td><td>往下物质更致密、更坚硬</td><td>地壳 / 地幔的分界</td></tr>
      <tr class="key"><td>古登堡界面<br>约 2900 km</td><td><b>P 波突然下降，S 波完全消失</b></td><td>界面以下<b>呈液态</b>（S 波不能过液体）</td><td>地幔 / 地核的分界</td></tr>
      <tr><td>约 5150 km</td><td>S 波重新出现</td><td>又变回固态</td><td>外核 / 内核的分界</td></tr>
    </tbody>
  </table>
  </div>
  <p class="gx-note">注意：<b>地壳厚度不均</b>——大陆地壳平均约 33 km（青藏高原可达 60–70 km），
  大洋地壳只有约 6 km。所以"33 km"是<b>大陆部分的平均值</b>，不是全球统一深度。

<section class="gx-sec" id="d">
  <h2><span class="sn">04</span>一道题走一遍</h2>
  <p class="gx-h2s">先自己读题干想 30 秒，再点"下一步"。每一步只推进一个判断。</p>

  <div class="gx-ex">
    <p class="ex-t">例题<span class="bdg bdg-must">必考</span></p>
    <p class="ex-q">某次地震后，地震台记录到两类地震波。科学家发现：在地面下约 33 km 处，
    两类波的速度都突然增大；在地下约 2900 km 处，一类波速度突然减小，另一类波完全消失。<br><br>
    （1）指出这两类地震波的名称及主要区别。<br>
    （2）说明 33 km 和 2900 km 处分别是哪个界面，并指出界面两侧的圈层名称。<br>
    （3）推测 2900 km 以下物质的形态，并说明理由。<br>
    （4）为什么说"岩石圈不等于地壳"？</p>

    <ol class="steps" id="gxSteps">
      <li class="step">
        <p class="s-h">第 1 步 · 先分清两种波，别只写"地震波"</p>
        <p class="s-b"><b>纵波（P 波）</b>：速度快，能通过固体、液体、气体；<b>横波（S 波）</b>：速度慢，
    只能通过固体。题干里"速度突然减小"的是 P 波，"完全消失"的是 S 波——
    <b>能消失的只有 S 波</b>，这是识别的关键。</p>
        <p class="s-k">用到：纵波与横波的传播特点</p>
      </li>
      <li class="step" hidden>
        <p class="s-h">第 2 步 · 两个深度对应两个界面</p>
        <p class="s-b"><b>33 km → 莫霍界面</b>，是<b>地壳与地幔</b>的分界；
        <b>2900 km → 古登堡界面</b>，是<b>地幔与地核</b>的分界。
        别把"界面名字"和"两侧圈层"写串——<b>莫霍上面是地壳、下面是地幔</b>；
        <b>古登堡上面是地幔、下面是地核</b>。</p>
        <p class="s-k">用到：两个不连续面的位置与意义</p>
      </li>
      <li class="step" hidden>
        <p class="s-h">第 3 步 · 形态推断是一条"排除法"</p>
        <p class="s-b">2900 km 以下 <b>S 波完全消失</b>，而 S 波<b>只能通过固体</b>，
        说明那里的物质<b>不是固态</b>；同时 <b>P 波仍能通过</b>，说明它<b>不是气态</b>（气体中 P 波极慢）。
        两者合起来：<b>外核呈液态</b>（准确地说是"熔融状态"）。<b>推理链必须写出"因为…所以…"。</b></p>
        <p class="s-k">用到：地震波对物质状态的指示</p>
      </li>
      <li class="step" hidden>
        <p class="s-h">第 4 步 · 岩石圈这道题每年都考</p>
        <p class="s-b"><b>岩石圈 = 地壳 + 上地幔顶部（软流层以上）</b>，是一层坚硬的岩石；
        <b>地壳只是它的上半部分</b>。所以岩石圈<b>比地壳厚</b>，且<b>包含地壳</b>。
        补充一句更好：<b>软流层位于岩石圈之下，物质可缓慢流动，是岩浆的主要发源地，不属于岩石圈</b>。</p>
        <p class="s-k">用到：岩石圈与地壳的关系</p>
      </li>
    </ol>

    <div class="exbar">
      <button id="gxNext" type="button">下一步</button>
      <span class="cnt" id="gxCnt">1 / 4</span>
    </div>

    <div class="ans" id="gxAns" hidden>
      <p class="ans-t">标准答案（可抄进答题卡）</p>
      <p class="ans-b">
      （1）<b>纵波（P 波）</b>和<b>横波（S 波）</b>。纵波<b>传播速度较快</b>，
      可以通过<b>固体、液体和气体</b>传播；横波<b>传播速度较慢</b>，<b>只能通过固体</b>传播。<br>
      （2）33 km 处为<b>莫霍界面</b>，是<b>地壳与地幔</b>的分界；
      2900 km 处为<b>古登堡界面</b>，是<b>地幔与地核</b>的分界。<br>
      （3）2900 km 以下（外核）物质呈<b>液态（熔融状态）</b>。
      理由：<b>横波只能通过固体传播</b>，而该深度以下<b>横波完全消失</b>，说明物质不是固态；
      同时<b>纵波仍能通过</b>（速度下降但未消失），说明不是气态。故为液态。<br>
      （4）<b>岩石圈由地壳和上地幔顶部（软流层以上）组成</b>，是一层坚硬的岩石；
      <b>地壳只是岩石圈的上部</b>，因此岩石圈<b>比地壳厚</b>。
      岩石圈之下的<b>软流层</b>物质可缓慢流动，是<b>岩浆的主要发源地</b>，<b>不属于岩石圈</b>。
      </p>
    </div>
  </div>
  <p class="gx-note">这类题的通用套路：<b>先认波（谁消失）→ 再认界面（33 / 2900）→ 最后推状态（能不能过）</b>。
  最容易丢分的是第（3）问只写"是液体"——<b>没有"S 波不能过液体"这个理由，等于没答</b>。</p>
</section>

      <p class="er-w">错在哪：人类最深钻孔只有约 12 km，连地壳都没打穿。所有深部认识都来自地震波。</p>

    <div class="er">
      <p class="er-x">✗ 地球外部三个圈层一层包一层</p>

      <p class="er-w">错在哪：把圈层想成了洋葱。生物圈没有独立的空间边界，它就在另外两个圈层的交界处。</p>
    </div>

<script>
/* 地球的圈层结构 · 讲义交互（等 page.js 把 #md 渲染成正文之后再跑） */
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var NS = "http://www.w3.org/2000/svg";
  function $(id) { return document.getElementById(id); }
  function el(tag, attrs, parent) {
    var n = document.createElementNS(NS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }
  function n1(v) { return (Math.round(v * 10) / 10).toString(); }

  if (!$("gxStage")) return;

  /* ================= 手机的图放大 ================= */
  (function () {
    var zoom = $("gxZoom"), inner = $("gxZoomInner");
    if (!zoom || !inner) return;
    Array.prototype.forEach.call(document.querySelectorAll(".gx-svgbox"), function (box) {
      box.style.cursor = "zoom-in";
      box.addEventListener("click", function () {
        if (window.innerWidth > 760) return;
        var svg = box.querySelector("svg");
        if (!svg) return;
        inner.textContent = "";
        inner.appendChild(svg.cloneNode(true));
        zoom.hidden = false;
        document.body.style.overflow = "hidden";
      });
    });
    function close() { zoom.hidden = true; document.body.style.overflow = ""; }
    zoom.addEventListener("click", function (e) {
      if (e.target === zoom || e.target.classList.contains("gx-zoom-x")) close();
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && !zoom.hidden) close();
    });
  })();

  /* ================= 分步揭示 ================= */
  (function () {
    var steps = document.querySelectorAll("#gxSteps .step");
    var ans = $("gxAns"), btn = $("gxNext"), cnt = $("gxCnt");
    if (!steps.length || !btn) return;
    var i = 1;
    function paint() { if (cnt) cnt.textContent = Math.min(i, steps.length) + " / " + steps.length; }
    steps[0].hidden = false;
    paint();
    btn.addEventListener("click", function () {
      if (i < steps.length) { steps[i].hidden = false; i++; }
      if (i >= steps.length) {
        if (ans) ans.hidden = false;
        btn.textContent = "已全部展开";
        btn.disabled = true;
      }
      paint();
    });
  })();

  /* ================= 互动：深度 → 波速与圈层 ================= */
  (function () {
    var stage = $("gxStage"), gL = $("gxL"), gV = $("gxV");
    var sl = $("gxSl"), vD = $("gxVd"), vW = $("gxVw"), vS = $("gxVs"), vSn = $("gxVsn"), box = $("gxStBox");

    var WIDE = {
      vb: "0 0 880 460", FS: 1,
      col: { x: 56, w: 104, ty: 76, gy: 416 },
      ch: { x: 240, w: 352, ty: 76, gy: 416 },
      info: { x: 640, w: 216 },
      bp: 690
    };
    var NARROW = {
      vb: "0 0 360 540", FS: 1.08,
      col: { x: 16, w: 66, ty: 70, gy: 330 },
      ch: { x: 104, w: 238, ty: 70, gy: 330 },
      info: { x: 20, w: 320, y0: 372 },
      bp: 690
    };
    var L = WIDE, FS = 1, D = 0, dragging = false, G = {};

    /* 非等比例深度映射：0-33 / 33-100 / 100-350 / 350-2900 / 2900-5150 / 5150-6371 */
    var SEG = [[0, 33, 0.07], [33, 100, 0.07], [100, 350, 0.08],
               [350, 2900, 0.48], [2900, 5150, 0.20], [5150, 6371, 0.10]];
    function fr(d) {
      var acc = 0;
      for (var i = 0; i < SEG.length; i++) {
        var s = SEG[i];
        if (d <= s[1]) return acc + (d - s[0]) / (s[1] - s[0]) * s[2];
        acc += s[2];
      }
      return 1;
    }
    function yOf(d) { return L.col.ty + fr(d) * (L.col.gy - L.col.ty); }

    var PSEG = [[0, 33, 5.8, 6.8], [33, 100, 8.1, 8.0], [100, 410, 8.0, 9.1], [410, 660, 9.1, 10.3],
                [660, 1000, 10.3, 11.5], [1000, 2000, 11.5, 12.8], [2000, 2891, 12.8, 13.7],
                [2891, 4000, 8.0, 9.4], [4000, 5150, 9.4, 10.3], [5150, 6371, 11.0, 11.3]];
    var SSEG = [[0, 33, 3.4, 3.9], [33, 100, 4.5, 4.4], [100, 410, 4.4, 5.0], [410, 660, 5.0, 5.9],
                [660, 1000, 5.9, 6.4], [1000, 2000, 6.4, 7.0], [2000, 2891, 7.0, 7.3],
                [2891, 5150, 0, 0], [5150, 6371, 3.5, 3.7]];
    function vAt(segs, d) {
      for (var i = 0; i < segs.length; i++) {
        var s = segs[i];
        if (d >= s[0] && d < s[1]) {
          if (s[1] === s[0]) return s[3];
          return s[2] + (s[3] - s[2]) * (d - s[0]) / (s[1] - s[0]);
        }
      }
      return segs[segs.length - 1][3];
    }
    function xOf(v) { return L.ch.x + Math.min(15, Math.max(0, v)) / 15 * L.ch.w; }

    var LAYERS = [
      { d0: 0, d1: 33, n: "地壳", fill: "#e0d4bd", line: "#c9b99c" },
      { d0: 33, d1: 670, n: "上地幔", fill: "#fdf3e0", line: "#e8d3a8" },
      { d0: 670, d1: 2900, n: "下地幔", fill: "#f7e3c8", line: "#e8c9a0" },
      { d0: 2900, d1: 5150, n: "外核", fill: "#f7d98a", line: "#d9a832" },
      { d0: 5150, d1: 6371, n: "内核", fill: "#f0c98a", line: "#d8a95a" }
    ];

    function layerOf(d) {
      if (d < 33) return { n: "地壳", st: "固态岩石", note: "厚度不均：大陆约 33 km，大洋约 6 km" };
      if (d < 2900) {
        if (d < 100) return { n: "地幔（上地幔顶部）", st: "固态 · 属于岩石圈", note: "岩石圈 = 地壳 + 上地幔顶部（软流层以上）" };
        if (d < 350) return { n: "地幔（软流层）", st: "塑性 · 可缓慢流动", note: "岩浆的主要发源地，不属于岩石圈" };
        if (d < 670) return { n: "地幔（上地幔）", st: "固态", note: "上地幔与下地幔的分界约在 670 km" };
        return { n: "地幔（下地幔）", st: "固态 · 密度更大", note: "地幔厚约 2860 km，是体积最大的圈层" };
      }
      if (d < 5150) return { n: "地核（外核）", st: "液态 · 熔融", note: "S 波完全消失，是判断液态的直接证据" };
      return { n: "地核（内核）", st: "固态", note: "约 5150 km 以下 S 波重新出现，说明又变回固态" };
    }

    function tx(parent, x, y, s, col, anchor, size, weight, halo) {
      var o = { x: n1(x), y: n1(y), "font-size": (size || 10.5) * FS, fill: col,
                "text-anchor": anchor || "start", "font-weight": weight || 400 };
      if (halo) o["class"] = "halo";
      var t = el("text", o, parent);
      t.textContent = s;
      return t;
    }

    function build() {
      gL.textContent = ""; gV.textContent = "";
      var c = L.col, h = L.ch, I = L.info, i;

      /* ---------- 左：圈层柱 ---------- */
      tx(gL, c.x, 44, L === WIDE ? "圈层（纵轴非等比例）" : "圈层", "#151a21", "start", 10.5, 700);

      LAYERS.forEach(function (ly) {
        var y0 = yOf(ly.d0), y1 = yOf(ly.d1);
        el("rect", { x: n1(c.x), y: n1(y0), width: n1(c.w), height: n1(y1 - y0),
                     fill: ly.fill, stroke: ly.line, "stroke-width": 1 }, gL);
        if (y1 - y0 > 16) {
          tx(gL, c.x + c.w / 2, n1((y0 + y1) / 2 + 4), ly.n, "#6b5533", "middle", 9.5, 700);
        }
      });

      /* 岩石圈括号 */
      var yr0 = yOf(0), yr1 = yOf(100);
      el("path", { d: "M " + n1(c.x - 6) + " " + n1(yr0) + " L " + n1(c.x - 14) + " " + n1(yr0) +
                      " L " + n1(c.x - 14) + " " + n1(yr1) + " L " + n1(c.x - 6) + " " + n1(yr1),
                   stroke: "#0891b2", "stroke-width": 1.5, fill: "none" }, gL);
      tx(gL, c.x - 17, n1((yr0 + yr1) / 2), "岩石圈", "#0b6580", "end", 8.5, 700);

      /* 深度刻度放到曲线左侧，和波速图对齐 */
      [[0, "0"], [6371, "6371"]].forEach(function (t) {
        var y = yOf(t[0]);
        tx(gV, h.x - 8, n1(y + 3), t[1], "#9aa3ae", "end", 7.5);
      });
      tx(gV, h.x - 8, n1(h.ty - 10), "km", "#9aa3ae", "end", 7.5);

      /* ---------- 右：波速曲线 ---------- */
      tx(gV, h.x, 44, L === WIDE ? "地震波速度（km/s）" : "波速 km/s", "#151a21", "start", 10.5, 700);

      [0, 3, 6, 9, 12, 15].forEach(function (v) {
        var x = xOf(v);
        el("line", { x1: n1(x), y1: n1(h.ty), x2: n1(x), y2: n1(h.gy),
                     stroke: "#e4e9ee", "stroke-width": 1 }, gV);
        tx(gV, x, n1(h.gy + 14), v + "", "#9aa3ae", "middle", 8);
      });
      el("line", { x1: n1(h.x), y1: n1(h.gy), x2: n1(h.x + h.w), y2: n1(h.gy),
                   stroke: "#c9c2b0", "stroke-width": 1.1 }, gV);

      /* 界面横线：跨越圈层柱与曲线，把两边对齐 */
      [[33, "莫霍界面"], [2900, "古登堡界面"], [5150, ""]].forEach(function (b) {
        var y = yOf(b[0]);
        el("line", { x1: n1(c.x), y1: n1(y), x2: n1(h.x + h.w), y2: n1(y),
                     stroke: "#b8402f", "stroke-width": 1, "stroke-dasharray": "4 4", opacity: 0.55 }, gV);
        if (b[1]) tx(gV, h.x + 3, n1(y - 5), b[1] + " " + b[0] + " km", "#b8402f", "start", 8.5, 700, true);
      });

      /* 曲线 */
      function path(segs, col, w) {
        segs.forEach(function (s) {
          var x1 = xOf(s[2]), y1 = yOf(s[0]), x2 = xOf(s[3]), y2 = yOf(s[1]);
          el("line", { x1: n1(x1), y1: n1(y1), x2: n1(x2), y2: n1(y2),
                       stroke: col, "stroke-width": w, "stroke-linecap": "round" }, gV);
        });
      }
      path(PSEG, "#0891b2", 2.6);
      path(SSEG, "#b8791f", 2.6);

      tx(gV, xOf(13.9) + 4, n1(yOf(2000)) + 3, "P", "#0891b2", "start", 10, 700, true);
      tx(gV, xOf(7.0) + 4, n1(yOf(1500)) + 3, "S", "#b8791f", "start", 10, 700, true);
      /* 外核段：S 波归零，用一段虚线示意"断掉" */
      el("line", { x1: n1(h.x), y1: n1(yOf(2891)), x2: n1(h.x), y2: n1(yOf(5150)),
                   stroke: "#b8402f", "stroke-width": 2.4, "stroke-dasharray": "4 5" }, gV);
      tx(gV, h.x + 8, n1(yOf(3800)), "S 波消失", "#b8402f", "start", 9.5, 700, true);
      if (L === WIDE) {
        tx(gV, h.x + 8, n1(yOf(4400)), "外核为液态", "#b8402f", "start", 8.5, 500, true);
        tx(gV, h.x + 8, n1(yOf(5300)), "S 波重现", "#2f8a5b", "start", 8.5, 700, true);
      }

      /* 游标 */
      G.hline = el("line", { stroke: "#b8402f", "stroke-width": 1.2, "stroke-dasharray": "5 4" }, gV);
      G.pdot = el("circle", { r: 4.4, fill: "#0891b2", stroke: "#fff", "stroke-width": 1.4 }, gV);
      G.sdot = el("circle", { r: 4.4, fill: "#b8791f", stroke: "#fff", "stroke-width": 1.4 }, gV);

      /* ---------- 信息 ---------- */
      var y0 = L === WIDE ? 76 : I.y0;
      tx(gV, I.x, y0, "这一刻在哪里", "#151a21", "start", 10.5, 700);
      G.n = tx(gV, I.x, y0 + 30, "", "#0b6580", "start", 14, 700);
      G.st = tx(gV, I.x, y0 + 52, "", "#3a3a35", "start", 10, 700);
      G.pv = tx(gV, I.x, y0 + 86, "", "#0891b2", "start", 9.5);
      G.sv = tx(gV, I.x, y0 + 104, "", "#b8791f", "start", 9.5);
      G.note = [];
      for (i = 0; i < 3; i++) G.note.push(tx(gV, I.x, y0 + 134 + i * 18, "", "#5a6472", "start", 9));
    }

    function wrap(s, n) {
      var out = [], cur = "", bad = "，。；、）";
      for (var i = 0; i < s.length; i++) {
        cur += s[i];
        if (cur.length >= n) { out.push(cur); cur = ""; }
      }
      if (cur) out.push(cur);
      for (var j = 1; j < out.length; j++) {
        while (out[j] && bad.indexOf(out[j][0]) >= 0) {
          out[j - 1] += out[j][0];
          out[j] = out[j].slice(1);
        }
      }
      return out;
    }

    function render() {
      var h = L.ch, I = L.info;
      var p = vAt(PSEG, D), s = vAt(SSEG, D), y = yOf(D), ly = layerOf(D);

      G.hline.setAttribute("x1", n1(h.x));
      G.hline.setAttribute("y1", n1(y));
      G.hline.setAttribute("x2", n1(h.x + h.w));
      G.hline.setAttribute("y2", n1(y));
      G.pdot.setAttribute("cx", n1(xOf(p)));
      G.pdot.setAttribute("cy", n1(y));
      var hasS = D < 2891 || D > 5150;
      G.sdot.setAttribute("cx", n1(xOf(s)));
      G.sdot.setAttribute("cy", n1(y));
      G.sdot.setAttribute("opacity", hasS ? 1 : 0);

      G.n.textContent = ly.n;
      G.n.setAttribute("fill", D >= 2900 ? "#8a5c14" : "#0b6580");
      G.st.textContent = ly.st;
      G.pv.textContent = "P 波  " + p.toFixed(1) + " km/s";
      G.sv.textContent = hasS ? ("S 波  " + s.toFixed(1) + " km/s") : "S 波  消失（0）";
      G.sv.setAttribute("fill", hasS ? "#b8791f" : "#b8402f");

      var lines = wrap(ly.note, L === WIDE ? 12 : 20);
      for (var i = 0; i < 3; i++) G.note[i].textContent = lines[i] || "";

      /* 数值卡 */
      vD.textContent = Math.round(D) + " km";
      vW.textContent = hasS ? (p.toFixed(1) + " / " + s.toFixed(1)) : (p.toFixed(1) + " / 0");
      vS.textContent = ly.n.replace("（软流层）", "").replace("（上地幔顶部）", "");
      vSn.textContent = ly.st;
      var col = D >= 5150 ? "#8a5c14" : (D >= 2900 ? "#b8791f" : "#0b6580");
      if (box) {
        box.style.background = D >= 2900 ? "#fdf3e0" : "#eef6fb";
        box.style.borderColor = col + "44";
        var kv = box.querySelector(".v");
        if (kv) kv.style.color = col;
      }
      if (sl.value !== String(Math.round(D))) sl.value = String(Math.round(D));
    }

    function applyLayout() {
      var w = stage.parentElement.getBoundingClientRect().width;
      L = w >= WIDE.bp ? WIDE : NARROW;
      FS = L.FS;
      stage.setAttribute("viewBox", L.vb);
      build();
      render();
    }

    sl.addEventListener("input", function () { D = +this.value; render(); });
    $("gxP1").addEventListener("click", function () { D = 0; render(); });
    $("gxP2").addEventListener("click", function () { D = 33; render(); });
    $("gxP3").addEventListener("click", function () { D = 2900; render(); });
    $("gxP4").addEventListener("click", function () { D = 6371; render(); });

    function setFromY(clientY) {
      var bb = stage.getBoundingClientRect();
      var vbh = parseFloat(L.vb.split(" ")[3]);
      var yy = (clientY - bb.top) * (vbh / bb.height);
      var f = (yy - L.col.ty) / (L.col.gy - L.col.ty);
      f = Math.max(0, Math.min(1, f));
      /* 反解 f → 深度 */
      var acc = 0, d = 6371;
      for (var i = 0; i < SEG.length; i++) {
        var s = SEG[i];
        if (f <= acc + s[2]) { d = s[0] + (f - acc) / s[2] * (s[1] - s[0]); break; }
        acc += s[2];
      }
      D = Math.max(0, Math.min(6371, Math.round(d)));
      render();
    }
    stage.addEventListener("pointerdown", function (ev) {
      dragging = true;
      try { stage.setPointerCapture(ev.pointerId); } catch (e) {}
      setFromY(ev.clientY);
    });
    stage.addEventListener("pointermove", function (ev) {
      if (!dragging) return;
      ev.preventDefault();
      setFromY(ev.clientY);
    });
    ["pointerup", "pointercancel"].forEach(function (e) {
      stage.addEventListener(e, function () { dragging = false; });
    });
    window.addEventListener("blur", function () { dragging = false; });
    stage.addEventListener("keydown", function (ev) {
      if (ev.key === "ArrowLeft" || ev.key === "ArrowRight") {
        ev.preventDefault();
        D = Math.max(0, Math.min(6371, D + (ev.key === "ArrowRight" ? 50 : -50)));
        render();
      }
    });

    var tmr = null;
    window.addEventListener("resize", function () {
      clearTimeout(tmr);
      tmr = setTimeout(applyLayout, 180);
    });

    applyLayout();
  })();
});

</script>
