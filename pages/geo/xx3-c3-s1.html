<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再看解释。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 环境安全<span class="q-src">人教版（2019）选择性必修3 · 第三章第一节</span></p>
<p class="q-b">环境安全，是指一个国家或地区赖以生存与发展的环境处于不受威胁、没有危险的状态，以及维持这种状态的能力。</p>
<p class="q-n">→ 这句话有两个落点：一是"状态"，二是"能力"。状态是现在没出事；能力是出了事扛得住、恢复得回来。所以环境安全不等于"零污染"，而是<b>污染与生态退化没有越过国家能够承受的阈值</b>。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>资源安全</th><th>环境安全</th></tr></thead>
<tbody>
<tr><td>追问的核心</td><td>够不够用</td><td>能不能承受</td></tr>
<tr><td>典型指标</td><td>储量、产量、进口依存度、运输通道</td><td>污染物浓度、环境容量、生态退化面积</td></tr>
<tr><td>出问题的样子</td><td>供给缺口、价格暴涨、断供</td><td>健康损害、经济受损、跨境争端</td></tr>
<tr class="key"><td>一句话</td><td>是"量"的问题，看总量与结构</td><td>是"质"与"容量"的问题，看阈值与恢复力</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">最易背错的是最后一行：<b>两者是同一片国土上的两把尺子，不是并列两件事</b>。水量足但水质超标，完全可能。</p>
</section>

<p class="ex-q">某跨界河流上游国家在干流沿岸新建大型金属矿，投产后下游邻国境内河水重金属超标，渔业大幅减产，沿河村庄饮水困难，边民聚集抗议，两国就责任与赔偿问题多次交涉。问：（1）说明该事件如何威胁国家安全；（2）分析环境安全的特点；（3）提出解决途径。</p>
<ol class="steps" id="gxSteps">
<li class="step"><p class="s-h">第 1 步 · 审题：先分清"环境事件"和"安全问题"</p><p class="s-b">题干是跨界河流、上游建矿、下游超标。要论证的不是"污染重"，而是它落到谁身上、落到哪一层关系，所以答案必须有"人、经济、社会、国际"四个落点。</p><p class="s-k">用到：环境安全的定义（状态 + 能力）</p></li>
<li class="step" hidden><p class="s-h">第 2 步 · 路径一：直接危害国民健康与生命财产</p><p class="s-b">重金属进入饮用水与灌溉水源，居民长期暴露、患病风险上升，沿河村庄饮水困难——基本生存条件受威胁。这条最直接，放第一条。</p><p class="s-k">用到：威胁路径 ① 健康与生命财产</p></li>
<li class="step" hidden><p class="s-h">第 3 步 · 路径二：削弱经济基础</p><p class="s-b">渔业减产减少渔民生计与地方财政；水产品被拒收，加工、旅游、餐饮连带萎缩；治理与赔偿挤占公共投资。环境损失转成经济的双重损失。</p><p class="s-k">用到：威胁路径 ② 经济基础（农业、渔业、旅游）</p></li>
<li class="step" hidden><p class="s-h">第 4 步 · 路径三：社会矛盾与跨境争端</p><p class="s-b">边民抗议是环境转成社会问题的信号；渔民外迁成为环境难民；两国交涉属跨境争端。上游国"发展优先"、下游国"受害在先"，谈判地位不对称。</p><p class="s-k">用到：威胁路径 ③④ 社会矛盾、跨境争端</p></li>
