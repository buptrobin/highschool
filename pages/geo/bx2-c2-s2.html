<p class="gx-lede">这一节考两件事：城镇化的<b>三个标志</b>，和 <b>S 曲线的三个阶段</b>加城市病。
最容易丢分的是把城镇化说成“城市面积扩大”——面积只是标志之一，
<b>衡量城镇化水平最重要的指标是城镇人口占总人口的比重</b>。还有一个坑：<b>逆城镇化不是城镇化倒退</b>。</p>

<!-- ================= A ================= -->
<section class="gx-sec" id="a">
  <h2><span class="sn">01</span>课本怎么说</h2>
  <p class="gx-h2s">先背标准表述，再看解释。顺序反了，答题时就写不出术语。</p>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 城镇化的概念<span class="q-src">人教版（2019）必修第二册 · 第二章第二节</span></p>
    <p class="q-b">城镇化是指人口向城镇集聚和城镇范围不断扩大、乡村变为城镇的过程。</p>
    <p class="q-n">→ 这句话里藏着<b>三件事</b>：① <b>人口</b>向城镇集聚；② <b>城镇范围</b>扩大；③ <b>乡村变为城镇</b>。
    考试问“城镇化的表现”，就从这三件事展开；只写“城市变大了”，只答到了第②件。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本要点 · 三个主要标志<span class="q-src">人教版（2019）必修第二册 · 第二章第二节</span></p>
    <p class="q-b">城镇化的三个主要标志是：城镇人口增加、城镇人口占总人口的比重上升、城镇建设用地规模扩大。其中，城镇人口占总人口的比重是衡量城镇化水平的最重要指标。</p>
    <p class="q-n">→ 三个标志对应“<b>人、比重、地</b>”，但<b>最重要的只有一个：比重</b>。
    答题时如果问“衡量城镇化水平的标志”，答“城镇人口占总人口的比重”，
    不要答建成区面积，也不要答 GDP。比重是<b>除出来</b>的：城镇人口 ÷ 总人口。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本要点 · 发达国家与发展中国家的差异<span class="q-src">人教版（2019）必修第二册 · 第二章第二节</span></p>
    <p class="q-b">发达国家城镇化起步早、水平高，目前速度放缓，出现逆城镇化现象；发展中国家城镇化起步晚、水平低，但速度快。</p>
    <p class="q-n">→ 记住两组对比：<b>水平</b>（发达国家高）和<b>速度</b>（发展中国家快）。
    这两个词经常被互换，一换就错。另外，“<b>逆城镇化</b>”指人口从城市中心迁往郊区或小城镇，
    是城镇化<b>发展到后期</b>的一种现象，<b>不是</b>城镇化倒退。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本要点 · 城镇化对地理环境的影响<span class="q-src">人教版（2019）必修第二册 · 第二章第二节</span></p>
    <p class="q-b">城镇化对地理环境的影响既有有利的一面，也有不利的一面。合理的城镇化可以集约利用土地、集中治理污染、改善生活条件；不合理的城镇化会带来大气污染、水污染、噪声污染，以及城市热岛、内涝等问题。</p>
    <p class="q-n">→ 又是<b>两栏</b>：<b>有利</b>（集约用地、集中治污、公共服务改善）和
    <b>不利</b>（污染、热岛、内涝、交通住房紧张）。答题必须两栏都写，
    只写坏处会被判“不全面”，这是 8 分题里最常见的丢分方式。</p>
  </div>

  <p class="gx-h2s" style="margin-top:18px">发达国家和发展中国家，四个维度对一遍：</p>
  <div style="overflow-x:auto">
  <table class="gx-cmp">
    <thead><tr><th>对比项</th><th>发达国家</th><th>发展中国家</th></tr></thead>
    <tbody>
      <tr><td>起步</td><td>早（工业革命后）</td><td>晚（20 世纪中期后）</td></tr>
      <tr><td>目前水平</td><td>高，多在 75% 以上</td><td>较低，多在 50% 上下</td></tr>
      <tr class="key"><td>当前速度</td><td><b>慢</b>，甚至出现逆城镇化</td><td><b>快</b>，城镇人口迅速增加</td></tr>
      <tr><td>主要问题</td><td>内城衰落、人口老龄化</td><td>交通拥堵、住房紧张、污染</td></tr>
      <tr><td>人口流向</td><td>市中心 → 郊区、小城镇</td><td>乡村 → 城市</td></tr>
    </tbody>
  </table>
  </div>
  <p class="gx-note">高亮那一行是“反直觉”所在：<b>水平最高的国家，速度反而最慢</b>。
  因为城镇化率有上限（接近 100% 就到顶了），越接近上限，能上升的空间越小——这正是 S 曲线后半段变平的原因。</p>
</section>

        <text class="ms" x="120" y="120" text-anchor="middle">2020 年 · 七普</text>
      </svg>
    </div>

    <div class="qac">
      <p class="q">「城镇化就是盖楼、扩城吗？」</p>
      <p class="a"><b>不完整。</b>城镇化有三个标志：<b>城镇人口增加、比重上升、建设用地扩大</b>。
      “盖楼扩城”只对应第三个。判断城镇化水平，看的是<b>比重</b>——
      一个城市楼盖得再多，如果人没进城，城镇化水平也不会提高。</p>
      <svg viewBox="0 0 240 132" role="img" aria-label="城镇化的三个标志">
        <rect x="20" y="26" width="60" height="60" rx="6" fill="#eef6fb" stroke="#b8d8e8"/>
        <text class="ms" x="50" y="60" text-anchor="middle" fill="#0b6580">人口</text>
        <rect x="90" y="26" width="60" height="60" rx="6" fill="#fdf3e0" stroke="#f0dcb4"/>
        <text class="ms" x="120" y="60" text-anchor="middle" fill="#8a5c14">比重</text>
        <rect x="160" y="26" width="60" height="60" rx="6" fill="#e6f6ee" stroke="#bfe0cd"/>
        <text class="ms" x="190" y="60" text-anchor="middle" fill="#1e6640">用地</text>
        <text class="mm" x="120" y="112" text-anchor="middle" fill="#3a3a35">三个都算，比重要看</text>
      </svg>
    </div>

    <div class="qac">
      <p class="q">「发达国家城镇化速度更快吗？」</p>
      <p class="a"><b>正好相反。</b>发达国家城镇化<b>水平高</b>（多在 75% 以上），但<b>速度慢</b>，
      甚至出现逆城镇化；发展中国家<b>水平较低</b>，但<b>速度快</b>。
      “水平”和“速度”是两个指标，答题时写错一个词就整句作废。</p>
      <svg viewBox="0 0 240 132" role="img" aria-label="发达国家水平高但速度慢，发展中国家水平较低但速度快">
        <rect x="52" y="36" width="36" height="76" fill="#b8d8e8"/>
        <rect x="152" y="62" width="36" height="50" fill="#0891b2"/>
        <text class="ms" x="70" y="30" text-anchor="middle" fill="#0b6580">80%</text>
        <text class="ms" x="170" y="56" text-anchor="middle" fill="#0b6580">55%</text>
        <text class="ms" x="70" y="126" text-anchor="middle">发达国家</text>
        <text class="ms" x="170" y="126" text-anchor="middle">发展中国家</text>
        <text class="mm" x="120" y="112" text-anchor="middle" fill="#b8402f">水平 ≠ 速度</text>
      </svg>
    </div>

    <div class="qac">
      <p class="q">「逆城镇化就是城镇化倒退了吗？」</p>
      <p class="a"><b>不是。</b>逆城镇化指人口从<b>城市中心迁往郊区、小城镇或乡村</b>，
      是城镇化<b>发展到后期</b>的一种现象，往往伴随城市更新和郊区化。
      城镇化率可能不再快速上升，但<b>城镇的生活方式和空间范围仍在扩展</b>，
      所以不能叫“倒退”。</p>
      <svg viewBox="0 0 240 132" role="img" aria-label="逆城镇化是人口从市中心迁往郊区">
        <circle cx="86" cy="66" r="26" fill="#fdf3e0" stroke="#f0dcb4"/>
        <text class="ms" x="86" y="70" text-anchor="middle" fill="#8a5c14">市中心</text>
        <circle cx="186" cy="66" r="18" fill="#e6f6ee" stroke="#bfe0cd"/>
        <text class="ms" x="186" y="70" text-anchor="middle" fill="#1e6640">郊区</text>
        <path d="M 114 66 L 162 66" stroke="#2f8a5b" stroke-width="1.8" marker-end="url(#arwE4)"/>
        <defs><marker id="arwE4" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#2f8a5b"/></marker></defs>
        <text class="mm" x="120" y="112" text-anchor="middle" fill="#1e6640">人口外迁，不是倒退</text>
      </svg>
    </div>

    <div class="qac">
      <p class="q">「城镇化率能超过 100% 吗？」</p>
      <p class="a"><b>不能。</b>它是<b>比重</b>，城镇人口最多等于总人口，所以上限是 100%。
      这也解释了 S 曲线为什么后段必然变平：<b>越接近 100%，可上升的空间越小</b>。
      但“城镇化速度”可以很快，两者不要混。</p>
      <svg viewBox="0 0 240 132" role="img" aria-label="城镇化率是比重，上限为百分之百">
        <line x1="30" y1="70" x2="210" y2="70" stroke="#c9d2da" stroke-width="4"/>
        <line x1="30" y1="70" x2="196" y2="70" stroke="#0891b2" stroke-width="4"/>
        <line x1="196" y1="54" x2="196" y2="86" stroke="#b8402f" stroke-width="2"/>
        <text class="ms" x="30" y="98" text-anchor="middle">0</text>
        <text class="ms" x="196" y="98" text-anchor="middle">100%</text>
        <text class="mm" x="110" y="40" text-anchor="middle" fill="#b8402f">上限 = 100%</text>
        <text class="ms" x="120" y="122" text-anchor="middle">比重不可能超过 100%</text>
      </svg>
    </div>

    <div class="qac">
      <p class="q">「城市病是城镇化本身的错吗？」</p>
      <p class="a"><b>不是。</b>城市病来自<b>城镇化的速度超过了基础设施和环境承载力</b>：
      人搬进来了，管网、住房、公交、绿地没跟上。所以对策是<b>补短板</b>（海绵城市、公交优先、卫星城），
      而不是“停止城镇化”。</p>
      <svg viewBox="0 0 240 132" role="img" aria-label="城镇化速度超过承载力就会出现城市病">
        <rect x="26" y="26" width="76" height="46" rx="6" fill="#fbeae7" stroke="#f0cbc4"/>
        <text class="ms" x="64" y="54" text-anchor="middle" fill="#b8402f">人口涌入</text>
        <rect x="138" y="26" width="76" height="46" rx="6" fill="#e6f6ee" stroke="#bfe0cd"/>
        <text class="ms" x="176" y="54" text-anchor="middle" fill="#1e6640">设施承载</text>
        <text class="mm" x="120" y="94" text-anchor="middle" fill="#b8402f">速度 &gt; 承载力</text>
        <text class="ms" x="120" y="118" text-anchor="middle">→ 交通、住房、污染、内涝</text>
      </svg>
    </div>

  </div>
  <p class="gx-note">这六问其实是同一件事：<b>先分清“水平”和“速度”，再看“阶段”，最后看“承载力跟不跟得上”</b>。
  城镇化题的所有判断，第一步永远是<b>把“比重”和“面积”分开</b>。</p>
</section>

<script>
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var sl = document.getElementById("urbSl");
  if (!sl) return;

  var v1 = document.getElementById("urbV1");
  var v2 = document.getElementById("urbV2");
  var v3 = document.getElementById("urbV3");
  var why = document.getElementById("urbWhy");
  var now = document.getElementById("urbNow");
  var dot = document.getElementById("urbDot");
  var drop = document.getElementById("urbDrop");
  var rung = document.getElementById("urbRung");
  var curve = document.getElementById("urbCurve");

  var X0 = 44, XW = 364, Y0 = 228, YH = 200;
  var DATA = [
    { name: "初期阶段", color: "#8a5c14", why: "城镇化率低、速度慢；城镇数量少，城市病不明显" },
    { name: "加速阶段", color: "#0b6580", why: "交通拥堵、住房紧张、环境污染集中出现" },
    { name: "后期阶段", color: "#1e6640", why: "速度放缓，出现逆城镇化、内城衰落" }
  ];

  function xOf(t) { return X0 + XW * t / 100; }
  function yOf(r) { return Y0 - YH * r / 100; }

  var dsp = "", k;
  for (k = 0; k <= 100; k++) {
    var r = 100 / (1 + Math.exp(-(k - 50) / 9.5));
    dsp += (k ? " L " : "M ") + xOf(k).toFixed(1) + " " + yOf(r).toFixed(1);
  }
  curve.setAttribute("d", dsp);

  function stageOf(u) {
    if (u < 30) return 0;
    if (u <= 70) return 1;
    return 2;
  }

  function render() {
    var u = parseFloat(sl.value);
    var st = stageOf(u);
    var t = 50;
    if (u <= 0) { t = 0; }
    else if (u >= 100) { t = 100; }
    else { t = 50 + 9.5 * Math.log(u / (100 - u)); }
    if (t < 0) { t = 0; }
    if (t > 100) { t = 100; }

    var x = xOf(t), y = yOf(u);
    dot.setAttribute("cx", x);
    dot.setAttribute("cy", y);
    drop.setAttribute("x1", x);
    drop.setAttribute("x2", x);
    drop.setAttribute("y1", y);
    drop.setAttribute("y2", Y0);
    rung.setAttribute("x2", x);
    rung.setAttribute("y1", y);
    rung.setAttribute("y2", y);

    v1.textContent = u + "%";
    v2.textContent = (4 * u * (100 - u) / 10000).toFixed(2);
    v3.textContent = DATA[st].name;
    v3.style.color = DATA[st].color;
    why.textContent = DATA[st].why;
    now.textContent = "城镇化率 " + u + "%";
  }

  sl.addEventListener("input", render);
  render();
});
</script>
