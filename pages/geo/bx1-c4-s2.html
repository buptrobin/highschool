<div class="gx-kicker">ELI5-HIGH · 讲给要考试的人</div>
<p class="gx-claim">观察地貌不是"从远看到近"，而是<b>先算什么地形，再算多高，最后量多陡、朝哪边</b>。</p>
<div class="gx-meta">
  <span><i></i>人教版必修第一册 第四章第二节</span>
  <span><i></i>高一 · 地貌</span>
  <span><i></i>阅读 12 分钟</span>
  <span><i></i>含 1 个互动模型</span>
</div>
<p class="gx-lede">上一节认了四种地貌，这一节学<b>怎么把它量出来</b>。内容只有两块：
<b>顺序</b>（从宏观到微观、从面到点）和<b>内容</b>（高度、坡度、坡向）。
所有题都从这两块里出——尤其是<b>绝对高度定"是什么"，相对高度定"起伏大不大"</b>这一条。</p>

<!-- ================= A ================= -->
<section class="gx-sec" id="a">
  <h2><span class="sn">01</span>课本怎么说</h2>
  <p class="gx-h2s">先背标准表述，再看解释。顺序反了，答题时就写不出术语。</p>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 顺序<span class="q-src">人教版（2019）必修第一册 · 第四章第二节</span></p>
    <p class="q-b">观察地貌时，宜选择一个视野比较广阔的地方，按照从宏观到微观、从面到点的顺序进行观察。一般先观察视野内大的地貌，再观察和描述次一级地貌，最后描述更小的地貌特征。</p>
    <p class="q-n">→ 这句里有 <b>两组各两个词</b>，缺一个就扣分：<b>宏观 → 微观</b>（看的是"多大范围"）、
    <b>面 → 点</b>（看的是"多具体的位置"）。教材举的三级例子是
    <b>山地（大）→ 山岭（次一级）→ 陡崖（更小）</b>，答题时把这三个词写进去最稳。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 内容<span class="q-src">人教版（2019）必修第一册 · 第四章第二节</span></p>
    <p class="q-b">高度有绝对高度和相对高度之分。绝对高度是划分高原、山地和平原等地貌的主要依据；相对高度能够反映地面的起伏状况。坡度是划分坡的重要标准，坡度大小一般用坡度角或者垂直距离和水平距离的比值来表示。</p>
    <p class="q-n">→ 这段话其实给了 <b>三个要素、三种用途</b>：<b>绝对高度</b>用来"定性"（这是山地还是平原）、
    <b>相对高度</b>用来"看起伏"（这块地颠不颠）、<b>坡度</b>用来"分坡"（陡坡还是缓坡）。
    三者各管一件事，不能互相替代。</p>
  </div>

  <p class="gx-note">还有第三条常被漏掉：<b>坡向</b>。课本要求重点观察<b>阳坡和阴坡、迎风坡和背风坡</b>——
  注意这是<b>两套判据</b>：前者看太阳辐射，后者看盛行风。<b>同一面坡可以既是阳坡又是背风坡</b>，
  这句话是选择题的高频陷阱，后面第六节专门讲。</p>

  <p class="gx-h2s" style="margin-top:18px">五种基本地形的分界，全靠"绝对高度"划出来（超过 500 m 才可能是山地或高原）：</p>
  <div style="overflow-x:auto">
  <table class="gx-cmp">
    <thead><tr><th>地形</th><th>海拔</th><th>形态特征</th></tr></thead>
    <tbody>
      <tr><td>平原</td><td>200 m 以下</td><td>地势平坦开阔，起伏很小</td></tr>
      <tr><td>丘陵</td><td>200–500 m</td><td>起伏不大，坡度和缓</td></tr>
      <tr class="key"><td>山地 / 高原</td><td>500 m 以上</td><td>山地：起伏大、坡陡、沟谷深；高原：顶面宽阔平缓、边缘陡峭</td></tr>
      <tr><td>盆地</td><td>四周高、中间低</td><td>由高地和低地两部分组成，周围被山地、高原或丘陵环绕</td></tr>
    </tbody>
  </table>
  </div>
  <p class="gx-note">注意最后一行的高亮：<b>山地和高原海拔都是 500 m 以上</b>，
  光看绝对高度分不开它们，得再看<b>"顶面平不平、边缘陡不陡"</b>。
  这就是为什么课本说"高度和坡度的组合，才能反映地貌的形态特征"。</p>
</section>

<!-- ================= B ================= -->
<section class="gx-sec" id="b">
  <h2><span class="sn">02</span>拆开看</h2>
  <p class="gx-h2s">四张图对应四件事：怎么排顺序、怎么量高、怎么看坡向、怎么读等高线。</p>

  <!-- 图1 观察顺序 -->
  <figure class="gx-fig">
    <div class="fig-cap">
      <span class="fig-no">图 1</span><span class="fig-t">观察顺序：三级放大，一级比一级具体</span>
      <span class="bdg bdg-must">必考</span>
    </div>
    <p class="fig-s">地貌本身是<b>分层嵌套</b>的：一座山地由若干山岭组合而成，一条山岭上又有陡崖、陡坎。
    所以观察要先框住大范围（宏观、面），再逐级聚焦（微观、点）。

  <h2><span class="sn">04</span>一道题走一遍</h2>
  <p class="gx-h2s">先自己读题干想 30 秒，再点"下一步"。每一步只推进一个判断。</p>

  <div class="gx-ex">
    <p class="ex-t">例题<span class="bdg bdg-must">必考</span></p>
    <p class="ex-q">某地理小组在一面山坡上测得两组数据：<br>
    ① A、B 两点高差 40 m，水平距离 300 m；<br>
    ② 同一面坡的另一处，C、D 两点高差 40 m，水平距离 50 m。<br><br>
    （1）分别算出 A、B 与 C、D 之间的坡度（用 tan 值表示，并估算坡度角）。<br>
    （2）若要在这面坡上开垦耕地，应选哪一侧？说明理由。<br>
    （3）若要修一条从山脚通往山顶的公路，选线时还要注意什么？<br>
    （4）已知 A 点海拔 1200 m，能否据此判断该地的地形类型？为什么？</p>

    <ol class="steps" id="gxSteps">
      <li class="step">
        <p class="s-h">第 1 步 · 先把"坡度"算成一个数</p>
        <p class="s-b">坡度 = <b>垂直距离 ÷ 水平距离</b>（也可用坡度角表示）。两组数据高差都是 40 m，
        所以差别全在水平距离：<b>AB：40 ÷ 300 ≈ 0.13</b>，<b>CD：40 ÷ 50 = 0.80</b>。
        换算成角度，AB 约 <b>7.6°</b>，CD 约 <b>38.7°</b>——差了五倍多。</p>
        <p class="s-k">用到：坡度的两种表示法（比值 / 坡度角）</p>
      </li>
      <li class="step" hidden>
        <p class="s-h">第 2 步 · 拿两个临界值去卡</p>
        <p class="s-b">把结果对着两条线比：AB 的 7.6° <b>远低于 15°</b>，属于缓坡；
        CD 的 38.7° <b>远高于 25°</b>，属于陡坡。这一步不能跳——一旦定性错了，
        后面"能不能耕作、怎么修路"全跟着错。</p>
        <p class="s-k">用到：15°（坡耕地水土流失）与 25°（退耕还林还草）两条界线</p>
      </li>
      <li class="step" hidden>
        <p class="s-h">第 3 步 · 落到"能干什么"</p>
        <p class="s-b">选 <b>AB 一侧</b>。理由要写两层：<b>①</b> 坡度约 7.6°，坡缓，耕作时水土流失轻、土层易保持；
        <b>②</b> CD 一侧坡度约 38.7°，陡坡开垦会加剧水土流失，按政策应<b>退耕还林还草</b>，本来就不该开。
        只写"AB 坡缓"太单薄，要点出"缓所以流失轻"这个因果。</p>
        <p class="s-k">用到：坡度对农业生产的影响</p>
      </li>
      <li class="step" hidden>
        <p class="s-h">第 4 步 · 公路选线 + 高度怎么用</p>
        <p class="s-b">修公路同样选<b>坡度小的一侧</b>，并且要<b>尽量与等高线平行</b>延伸，用<b>"之"字形盘山</b>
        把长距离的高差拆成许多小段来爬，同时<b>避开陡崖、陡坡</b>，少占农田、少建桥。
        至于第（4）问：1200 m &gt; 500 m，可以判断属于<b>山地或高原</b>，但<b>仅凭 A 一点的高度判不到底</b>——
        山地和高原的绝对高度都在 500 m 以上，还得看<b>顶面是否宽阔平缓、边缘是否陡峭</b>，
        也就是必须用<b>"高度 + 坡度"的组合</b>。</p>
        <p class="s-k">用到：坡度对交通线的影响；高度和坡度的组合反映形态特征</p>
      </li>
    </ol>

    <div class="exbar">
      <button id="gxNext" type="button">下一步</button>
      <span class="cnt" id="gxCnt">1 / 4</span>
    </div>

    <div class="ans" id="gxAns" hidden>
      <p class="ans-t">标准答案（可抄进答题卡）</p>
      <p class="ans-b">
      （1）AB：坡度 = 40÷300 ≈ <b>0.13</b>（约 7.6°）；CD：坡度 = 40÷50 = <b>0.80</b>（约 38.7°）。<br>
      （2）应选 <b>AB 一侧</b>。该侧坡度小（约 7.6°，低于 15°），坡面缓，耕作时水土流失较轻、土层易保持；
      CD 一侧坡度大（约 38.7°，超过 25°），陡坡开垦会严重加剧水土流失，应退耕还林还草。<br>
      （3）应选<b>坡度较小的一侧</b>，并<b>尽量与等高线平行</b>延伸，采用<b>"之"字形盘山</b>的方式减小坡度，
      <b>避开陡崖和陡坡</b>，尽量少占农田、少建桥梁。<br>
      （4）只能判断为<b>山地或高原</b>（海拔高于 500 m），<b>不能确定是哪一种</b>。
      因为二者绝对高度都在 500 m 以上，还需观察顶面是否宽阔平缓、边缘是否陡峭，
      即需要<b>高度与坡度组合</b>才能确定形态类型。
      </p>
    </div>
  </div>
  <p class="gx-note">这类题的通用套路：<b>先算数（坡度、相对高度）→ 再卡临界值（15°、25°、500 m）→ 最后落到用途（耕作、修路、植被）</b>。
  只写"坡陡坡缓"不写数值、不写后果，是最常见的丢分方式。</p>
</section>

<section class="gx-sec" id="e">
  <h2><span class="sn">05</span>会怎么考</h2>
  <p class="gx-h2s">六问，全是"觉得懂了、一做就错"的角度。第二、三、五问最容易被追着问。</p>
  <div class="gx-qa">

    <div class="qac">
      <p class="q">「观察顺序就是"从远到近"吗？」</p>
      <p class="a">不是。<b>从宏观到微观</b>说的是"观察范围由大到小"，<b>从面到点</b>说的是"描述对象由整体到局部"。
      它跟"站得远还是近"没有关系——站在近处也可能先看整体。<b>写"从远到近"就是没答到点上。</b></p>
      <svg viewBox="0 0 240 132" role="img" aria-label="观察范围由大到小逐级聚焦">
        <rect x="14" y="26" width="64" height="72" rx="6" fill="#eef2f5" stroke="#c9c2b0"/>
        <text class="ms" x="46" y="112" text-anchor="middle">宏观·面</text>
        <path d="M 82 62 L 96 62" stroke="#9aa3ae" stroke-width="1.4"/><path d="M 96 62 l -8 -3 l 0 6 z" fill="#9aa3ae"/>
        <rect x="100" y="38" width="46" height="48" rx="5" fill="#e9e2d0" stroke="#c9c2b0"/>
        <text class="ms" x="123" y="112" text-anchor="middle">次一级</text>
        <path d="M 148 62 L 162 62" stroke="#9aa3ae" stroke-width="1.4"/><path d="M 162 62 l -8 -3 l 0 6 z" fill="#9aa3ae"/>
        <rect x="166" y="50" width="26" height="26" rx="4" fill="#f7e9cf" stroke="#c9a35f"/>
        <text class="ms" x="179" y="112" text-anchor="middle">微观·点</text>
        <text class="mm" x="120" y="20" text-anchor="middle" fill="#0b6580">范围越缩越小</text>
      </svg>
    </div>

    <div class="qac">
      <p class="q">「相对高度大，说明这里海拔高吗？」</p>
      <p class="a">不说明。<b>相对高度只反映地面起伏</b>，跟"离海平面多高"完全无关。
      一块海拔 4000 m 的高原，内部可能只起伏几十米（相对高度小）；一条海拔 300 m 的沟谷，两岸可能陡落 200 m（相对高度大）。
      <b>判断地形类型只能用绝对高度。</b></p>
      <svg viewBox="0 0 240 132" role="img" aria-label="左：地面平坦，相对高度小；右：地面起伏剧烈，相对高度大">
        <line x1="12" y1="100" x2="112" y2="100" stroke="#c9c7bf" stroke-width="1.1"/>
        <path d="M 16 96 Q 43 90 70 94 Q 97 98 108 95" fill="none" stroke="#b8791f" stroke-width="2"/>
        <path d="M 104 82 L 104 98" stroke="#b8402f" stroke-width="1.3"/>
        <path d="M 104 82 l -3 6 l 6 0 z" fill="#b8402f"/><path d="M 104 98 l -3 -6 l 6 0 z" fill="#b8402f"/>
        <text class="ms" x="62" y="118" text-anchor="middle">相对高度小</text>
        <line x1="128" y1="100" x2="228" y2="100" stroke="#c9c7bf" stroke-width="1.1"/>
        <path d="M 132 96 L 146 48 L 160 92 L 174 40 L 188 96 L 202 62 L 224 96"
              fill="none" stroke="#b8791f" stroke-width="2"/>
        <path d="M 218 40 L 218 98" stroke="#b8402f" stroke-width="1.3"/>
        <path d="M 218 40 l -3 6 l 6 0 z" fill="#b8402f"/><path d="M 218 98 l -3 -6 l 6 0 z" fill="#b8402f"/>
        <text class="ms" x="178" y="118" text-anchor="middle">相对高度大</text>
        <text class="mm" x="120" y="22" text-anchor="middle" fill="#b8402f">只看起伏，不看海拔</text>
      </svg>
    </div>

    <div class="qac">
      <p class="q">「等高线越密，说明这里的高差越大吗？」</p>
      <p class="a">不是。同一幅图上<b>等高距是固定的</b>，相邻两条线的高差永远相同。
      线密只说明<b>同样的高差占用更短的水平距离</b>——也就是更陡，不是更高。
      这是本节最值钱的一句话：<b>密 = 陡，密 ≠ 高差大。</b></p>
      <svg viewBox="0 0 240 132" role="img" aria-label="等高距相同的情况下，线密表示水平距离短、坡陡">
        <g stroke="#b8791f" stroke-width="1.5"><path d="M 40 34 L 40 98"/><path d="M 54 34 L 54 98"/><path d="M 68 34 L 68 98"/></g>
        <g stroke="#b8791f" stroke-width="1.5"><path d="M 140 34 L 140 98"/><path d="M 176 34 L 176 98"/><path d="M 212 34 L 212 98"/></g>
        <text class="mm" x="54" y="114" text-anchor="middle" fill="#b8402f">陡</text>
        <text class="mm" x="176" y="114" text-anchor="middle" fill="#1e6640">缓</text>
        <text class="ms" x="120" y="20" text-anchor="middle">等高距都是一样的</text>
        <text class="ms" x="120" y="128" text-anchor="middle">变的只有水平距离</text>
      </svg>
    </div>

    <div class="qac">
      <p class="q">「南坡一定是阳坡吗？」</p>
      <p class="a">只在<b>北半球</b>成立。南半球太阳偏北，<b>北坡才是阳坡</b>。
      所以答题时必须先看半球，写成"南坡是阳坡"而不限定半球，是常见扣分点。
      另外，同一高度上阳坡与阴坡的温差可达 3–4 ℃，这正是植被差异的原因。</p>
      <svg viewBox="0 0 240 132" role="img" aria-label="北半球南坡为阳坡，南半球北坡为阳坡">
        <path d="M 22 96 L 66 40 L 110 96 Z" fill="#f2efe6" stroke="#b9b2a2"/>
        <text class="ms" x="66" y="114" text-anchor="middle" fill="#b8402f">北半球：南坡阳</text>
        <path d="M 130 96 L 174 40 L 218 96 Z" fill="#f2efe6" stroke="#b9b2a2"/>
        <text class="ms" x="174" y="114" text-anchor="middle" fill="#0b6580">南半球：北坡阳</text>
        <text class="mm" x="120" y="22" text-anchor="middle" fill="#5a6472">先看半球</text>
      </svg>
    </div>

    <div class="qac">
      <p class="q">「迎风坡一定就是阳坡吗？」</p>
      <p class="a">不一定。这是<b>两套完全独立的判据</b>：阳坡看太阳（南北半球），迎风坡看盛行风（哪个方向）。
      我国北方冬季盛行西北风时，<b>南坡既是阳坡又是背风坡</b>——暖而干；北坡既是阴坡又是迎风坡——冷而湿。
      所以"哪面坡植被好"必须说清是光还是水。</p>
      <svg viewBox="0 0 240 132" role="img" aria-label="同一面坡可以同时是阳坡和背风坡">
        <path d="M 30 102 L 120 36 L 210 102 Z" fill="#f2efe6" stroke="#b9b2a2"/>
        <circle cx="42" cy="34" r="10" fill="#fbeed7" stroke="#d8a03a"/>
        <path d="M 52 40 L 76 62" stroke="#d8a03a" stroke-width="1.5"/><path d="M 76 62 l -9 -2 l 4 -7 z" fill="#d8a03a"/>
        <path d="M 206 60 L 168 78" stroke="#0891b2" stroke-width="1.5"/><path d="M 168 78 l 9 -2 l -1 8 z" fill="#0891b2"/>
        <text class="ms" x="86" y="96" fill="#b8402f">阳坡+背风坡</text>
        <text class="mm" x="120" y="24" text-anchor="middle" fill="#5a6472">两套判据可叠加</text>
      </svg>
    </div>

    <div class="qac">
      <p class="q">「坡度 25° 和坡度 25% 是一回事吗？」</p>
      <p class="a">不是，差得很远。坡度用<b>比值</b>表示时用的是 tan 值：tan25° ≈ 0.466，也就是 <b>46.6%</b>；
      反过来，25% 对应的坡度角只有约 <b>14°</b>。教材里"铁路最大坡度不超过 2.5%–3%"用的是<b>比值</b>，
      换成角度只有 1.4°–1.7°——所以铁路才能跑得动。</p>
      <svg viewBox="0 0 240 132" role="img" aria-label="25度的坡明显比25%的坡陡，25%只相当于约14度">
        <line x1="16" y1="100" x2="112" y2="100" stroke="#c9c7bf" stroke-width="1"/>
        <path d="M 24 100 L 104 100 L 104 62 Z" fill="#e9e2d0" stroke="#b9b2a2"/>
        <path d="M 40 100 A 16 16 0 0 0 38 92" fill="none" stroke="#b8402f" stroke-width="1.4"/>
        <text class="mm" x="56" y="88" fill="#b8402f">25°</text>
        <text class="ms" x="64" y="116" text-anchor="middle">tan=46.6%</text>
        <line x1="128" y1="100" x2="228" y2="100" stroke="#c9c7bf" stroke-width="1"/>
        <path d="M 136 100 L 216 100 L 216 80 Z" fill="#e9e2d0" stroke="#b9b2a2"/>
        <path d="M 152 100 A 16 16 0 0 0 150 96" fill="none" stroke="#1e6640" stroke-width="1.4"/>
        <text class="mm" x="168" y="94" fill="#1e6640">14°</text>
        <text class="ms" x="176" y="116" text-anchor="middle">tan=25%</text>
        <text class="ms" x="120" y="22" text-anchor="middle">两个坡度完全不是一回事</text>
      </svg>
    </div>

  </div>
  <p class="gx-note">这六问其实是同一句话：<b>每个量各管一件事，不要拿它去回答别的问题。</b>
  绝对高度管"是什么"，相对高度管"颠不颠"，坡度管"陡不陡"，坡向管"光和水"——问什么就答什么。</p>
</section>

  阳坡与阴坡同高度温差 3–4 ℃、铁路最大坡度 2.5%–3% 均为教材所述数值。<br>
  图 5 为<b>教学示意模型</b>：垂直高差固定取 50 m，坡度角按 α = arctan(50 ÷ 水平距离) 计算；
  剖面纵向作了放大以看清陡缓，<b>图上角度不代表真实坡度角</b>，请以数值卡为准。
</footer>

<div class="gx-zoom" id="gxZoom" hidden>
  <span class="gx-zoom-tip">双指放大 · 左右滑动看全图</span>
  <button class="gx-zoom-x" type="button" aria-label="关闭">✕</button>
  <div id="gxZoomInner"></div>
</div>

</div>

</script>
<script src="../../assets/page.js"></script>
<script src="../../assets/geo-autopilot.js"></script>
<script>
/* 地貌的观察 · 讲义交互（等 page.js 把 #md 渲染成正文之后再跑） */
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var NS = "http://www.w3.org/2000/svg";
  function $(id) { return document.getElementById(id); }
  function el(tag, attrs, parent) {
    var n = document.createElementNS(NS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }
  function n1(v) { return (Math.round(v * 10) / 10).toString(); }

  if (!$("gxStage")) return;

  /* ================= 手机的图放大 ================= */
  (function () {
    var zoom = $("gxZoom"), inner = $("gxZoomInner");
    if (!zoom || !inner) return;
    Array.prototype.forEach.call(document.querySelectorAll(".gx-svgbox"), function (box) {
      box.style.cursor = "zoom-in";
      box.addEventListener("click", function () {
        if (window.innerWidth > 760) return;
        var svg = box.querySelector("svg");
        if (!svg) return;
        inner.textContent = "";
        inner.appendChild(svg.cloneNode(true));
        zoom.hidden = false;
        document.body.style.overflow = "hidden";
      });
    });
    function close() { zoom.hidden = true; document.body.style.overflow = ""; }
    zoom.addEventListener("click", function (e) {
      if (e.target === zoom || e.target.classList.contains("gx-zoom-x")) close();
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && !zoom.hidden) close();
    });
  })();

  /* ================= 分步揭示 ================= */
  (function () {
    var steps = document.querySelectorAll("#gxSteps .step");
    var ans = $("gxAns"), btn = $("gxNext"), cnt = $("gxCnt");
    if (!steps.length || !btn) return;
    var i = 1;
    function paint() { if (cnt) cnt.textContent = Math.min(i, steps.length) + " / " + steps.length; }
    steps[0].hidden = false;
    paint();
    btn.addEventListener("click", function () {
      if (i < steps.length) { steps[i].hidden = false; i++; }
      if (i >= steps.length) {
        if (ans) ans.hidden = false;
        btn.textContent = "已全部展开";
        btn.disabled = true;
      }
      paint();
    });
  })();

  /* ================= 互动：坡度 ================= */
  (function () {
    var stage = $("gxStage"), gSlope = $("gxSlope"), gCont = $("gxContour");
    var sl = $("gxSl"), vD = $("gxVd"), vA = $("gxVa"), vS = $("gxVs"), vSn = $("gxVsn"), box = $("gxStBox");

    var WIDE = {
      vb: "0 0 880 340", FS: 1,
      sp: { x: 20, y: 36, w: 450, h: 250, hpx: 125, dx: 0.5, lx: 60 },
      ct: { x: 490, y: 36, w: 370, h: 250, dc0: 24, dc1: 160 }, bp: 620
    };
    var NARROW = {
      vb: "0 0 360 580", FS: 1.2,
      sp: { x: 8, y: 16, w: 344, h: 236, hpx: 90, dx: 0.29, lx: 74 },
      ct: { x: 8, y: 288, w: 344, h: 270, dc0: 18, dc1: 110 }, bp: 620
    };
    var L = WIDE, FS = 1, D = 200, dragging = false, R = {};
    var DH = 50;   /* 固定的垂直高差（米） */

    function geo() {
      var S = L.sp;
      return {
        x0: S.x + S.lx,
        yb: S.y + S.h - 34,
        hpx: S.hpx,
        dp: Math.max(12, D * S.dx)
      };
    }
    function dpc() {
      var C = L.ct;
      return C.dc0 + (D - 50) / 550 * (C.dc1 - C.dc0);
    }

    function tx(parent, x, y, s, col, anchor, size, weight, halo) {
      var o = { x: n1(x), y: n1(y), "font-size": (size || 11) * FS, fill: col,
                "text-anchor": anchor || "start", "font-weight": weight || 400 };
      if (halo) o["class"] = "halo";
      var t = el("text", o, parent);
      t.textContent = s;
      return t;
    }

    function build() {
      gSlope.textContent = ""; gCont.textContent = "";
      var S = L.sp, C = L.ct, g0 = geo();

      /* ---------- 左：剖面 ---------- */
      el("line", { x1: S.x + 6, y1: g0.yb, x2: S.x + S.w - 6, y2: g0.yb,
                   stroke: "#c9c2b0", "stroke-width": 1.2 }, gSlope);
      R.rock = el("path", { fill: "#f2efe6", stroke: "#c9c2b0", "stroke-width": 1.2 }, gSlope);
      R.arc = el("path", { fill: "none", stroke: "#0891b2", "stroke-width": 1.8 }, gSlope);
      R.line = el("line", { stroke: "#b8791f", "stroke-width": 2.8, "stroke-linecap": "round" }, gSlope);
      R.hDash = el("line", { stroke: "#9aa3ae", "stroke-width": 1, "stroke-dasharray": "4 4" }, gSlope);
      R.vDash = el("line", { stroke: "#9aa3ae", "stroke-width": 1, "stroke-dasharray": "4 4" }, gSlope);

      R.dBar = el("line", { stroke: "#5a6472", "stroke-width": 1.4 }, gSlope);
      R.dCapL = el("path", { fill: "#5a6472" }, gSlope);
      R.dCapR = el("path", { fill: "#5a6472" }, gSlope);
      R.hBar = el("line", { stroke: "#b8402f", "stroke-width": 1.4 }, gSlope);
      R.hCap1 = el("path", { fill: "#b8402f" }, gSlope);
      R.hCap2 = el("path", { fill: "#b8402f" }, gSlope);

      R.aText = tx(gSlope, 0, 0, "", "#0b6580", "middle", 12.5, 700, true);
      R.dText = tx(gSlope, 0, 0, "", "#5a6472", "middle", 11, 700);
      R.hText = tx(gSlope, 0, 0, "", "#b8402f", "start", 10.5, 700, true);

      R.pA = el("circle", { r: 4.5, fill: "#fff", stroke: "#0891b2", "stroke-width": 2 }, gSlope);
      R.pB = el("circle", { r: 4.5, fill: "#fff", stroke: "#b8791f", "stroke-width": 2 }, gSlope);
      R.lA = tx(gSlope, 0, 0, "A · 100 m", "#0b6580", "end", 11, 700, true);
      R.lB = tx(gSlope, 0, 0, "B · 150 m", "#8a5c14", "end", 11, 700, true);

      tx(gSlope, S.x + 8, S.y + 14, "剖面（沿坡面看）", "#5a6472", "start", 10.5);
      tx(gSlope, S.x + 8, S.y + 30, "纵向已放大 ×5，图中的角只表示陡缓", "#b8791f", "start", 9.5);

      /* ---------- 右：等高线 ---------- */
      var ccx = C.x + C.w / 2;
      R.cl = []; R.cLab = [];
      for (var i = 0; i < 3; i++) {
        R.cl.push(el("line", { stroke: "#b8791f", "stroke-width": 1.8 }, gCont));
        R.cLab.push(tx(gCont, 0, 0, ["100 m", "150 m", "200 m"][i], "#8a5c14", "middle", 10.5, 700));
      }
      R.gap = el("line", { stroke: "#5a6472", "stroke-width": 1.3 }, gCont);
      R.gapL = el("path", { fill: "#5a6472" }, gCont);
      R.gapR = el("path", { fill: "#5a6472" }, gCont);
      R.gapT = tx(gCont, 0, 0, "", "#5a6472", "middle", 11, 700);

      tx(gCont, C.x + 8, C.y + 14, "等高线（俯视）", "#5a6472", "start", 10.5);
      tx(gCont, C.x + C.w - 8, C.y + 14, "等高距固定", "#9aa3ae", "end", 9.5);
      R.dir = tx(gCont, ccx, C.y + C.h - 10, "上坡方向 →", "#5a6472", "middle", 10.5, 700);
    }

    function render() {
      var S = L.sp, C = L.ct, g0 = geo();
      var x0 = g0.x0, yBase = g0.yb, hpx = g0.hpx, dp = g0.dp;
      var xb = x0 + dp, yb = yBase - hpx;
      var a = Math.atan2(hpx, dp);
      var deg = Math.atan(DH / D) * 180 / Math.PI;

      R.rock.setAttribute("d",
        "M " + n1(x0) + " " + n1(yBase) + " L " + n1(xb) + " " + n1(yb) +
        " L " + n1(xb) + " " + n1(yBase) + " Z");
      R.line.setAttribute("x1", n1(x0)); R.line.setAttribute("y1", n1(yBase));
      R.line.setAttribute("x2", n1(xb)); R.line.setAttribute("y2", n1(yb));

      var r = Math.min(44, Math.max(16, dp * 0.85));
      R.arc.setAttribute("d", "M " + n1(x0 + r) + " " + n1(yBase) +
        " A " + r + " " + r + " 0 0 0 " +
        n1(x0 + r * Math.cos(a)) + " " + n1(yBase - r * Math.sin(a)));

      R.hDash.setAttribute("x1", n1(xb)); R.hDash.setAttribute("y1", n1(yb));
      R.hDash.setAttribute("x2", n1(xb + 28)); R.hDash.setAttribute("y2", n1(yb));
      R.vDash.setAttribute("x1", n1(xb)); R.vDash.setAttribute("y1", n1(yb));
      R.vDash.setAttribute("x2", n1(xb + 30)); R.vDash.setAttribute("y2", n1(yb));

      var dy = yBase + 22;
      R.dBar.setAttribute("x1", n1(x0)); R.dBar.setAttribute("y1", n1(dy));
      R.dBar.setAttribute("x2", n1(xb)); R.dBar.setAttribute("y2", n1(dy));
      R.dCapL.setAttribute("d", "M " + n1(x0) + " " + n1(dy) + " l 8 -4 l 0 8 z");
      R.dCapR.setAttribute("d", "M " + n1(xb) + " " + n1(dy) + " l -8 -4 l 0 8 z");
      R.dText.setAttribute("x", n1((x0 + xb) / 2));
      R.dText.setAttribute("y", n1(dy + 16));
      R.dText.textContent = "水平距离 " + D + " m";

      var hx = xb + 12;
      R.hBar.setAttribute("x1", n1(hx)); R.hBar.setAttribute("y1", n1(yb));
      R.hBar.setAttribute("x2", n1(hx)); R.hBar.setAttribute("y2", n1(yBase));
      R.hCap1.setAttribute("d", "M " + n1(hx) + " " + n1(yb) + " l -4 8 l 8 0 z");
      R.hCap2.setAttribute("d", "M " + n1(hx) + " " + n1(yBase) + " l -4 -8 l 8 0 z");
      R.hText.setAttribute("x", n1(hx + 6));
      R.hText.setAttribute("y", n1((yb + yBase) / 2 + 4));
      R.hText.textContent = "ΔH 50 m";

      R.pA.setAttribute("cx", n1(x0)); R.pA.setAttribute("cy", n1(yBase));
      R.pB.setAttribute("cx", n1(xb)); R.pB.setAttribute("cy", n1(yb));
      R.lA.setAttribute("x", n1(x0 - 8)); R.lA.setAttribute("y", n1(yBase + 5));
      R.lB.setAttribute("x", n1(xb - 4)); R.lB.setAttribute("y", n1(yb - 10));
      R.aText.setAttribute("x", n1(x0 + r * 1.45 * Math.cos(a / 2)));
      R.aText.setAttribute("y", n1(yBase - r * 1.45 * Math.sin(a / 2) + 4));
      R.aText.textContent = deg.toFixed(1) + "°";

      /* 等高线 */
      var ccx = C.x + C.w / 2, dc = dpc();
      var top = C.y + 40, bot = C.y + C.h - 72;
      for (var i = 0; i < 3; i++) {
        var lx = ccx + (i - 1) * dc;
        R.cl[i].setAttribute("x1", n1(lx)); R.cl[i].setAttribute("y1", n1(top));
        R.cl[i].setAttribute("x2", n1(lx)); R.cl[i].setAttribute("y2", n1(bot));
        R.cLab[i].setAttribute("x", n1(lx));
        R.cLab[i].setAttribute("y", n1(top - (dc < 48 && i === 1 ? 24 : 8)));
      }
      var gy = bot + 20;
      R.gap.setAttribute("x1", n1(ccx - dc)); R.gap.setAttribute("y1", n1(gy));
      R.gap.setAttribute("x2", n1(ccx)); R.gap.setAttribute("y2", n1(gy));
      R.gapL.setAttribute("d", "M " + n1(ccx - dc) + " " + n1(gy) + " l 7 -4 l 0 8 z");
      R.gapR.setAttribute("d", "M " + n1(ccx) + " " + n1(gy) + " l -7 -4 l 0 8 z");
      R.gapT.setAttribute("x", n1(ccx - dc / 2));
      R.gapT.setAttribute("y", n1(gy + 18));
      R.gapT.textContent = "间距 " + D + " m";

      vD.textContent = D + " m";
      vA.textContent = deg.toFixed(1) + "°";

      var st, sn, col, bg;
      if (deg < 5) { st = "平缓地"; sn = "宜耕作 · 基本无水蚀风险"; col = "#1e6640"; bg = "#e6f6ee"; }
      else if (deg < 15) { st = "缓坡"; sn = "宜耕作 · 等高耕作即可"; col = "#1e6640"; bg = "#e6f6ee"; }
      else if (deg < 25) { st = "较陡"; sn = "宜修梯田 · 或种果林"; col = "#8a5c14"; bg = "#fdf3e0"; }
      else if (deg < 40) { st = "陡坡"; sn = "应退耕还林还草"; col = "#b8402f"; bg = "#fbeae7"; }
      else { st = "近陡崖"; sn = "不宜开垦 · 工程需避让"; col = "#b8402f"; bg = "#fbeae7"; }
      vS.textContent = st; vSn.textContent = sn;
      vS.style.color = col;
      box.style.background = bg;
      box.style.borderColor = col + "44";
      if (sl.value !== String(D)) sl.value = D;
    }

    function applyLayout() {
      var w = stage.parentElement.getBoundingClientRect().width;
      L = w >= WIDE.bp ? WIDE : NARROW;
      FS = L.FS;
      stage.setAttribute("viewBox", L.vb);
      build();
      render();
    }

    /* ---- 输入 ---- */
    sl.addEventListener("input", function () { D = +this.value; render(); });
    $("gxP1").addEventListener("click", function () { D = 600; render(); });
    $("gxP2").addEventListener("click", function () { D = 190; render(); });
    $("gxP3").addEventListener("click", function () { D = 110; render(); });
    $("gxP4").addEventListener("click", function () { D = 50; render(); });

    function setFromX(clientX) {
      var bb = stage.getBoundingClientRect();
      var vbw = parseFloat(L.vb.split(" ")[2]);
      var x = (clientX - bb.left) * (vbw / bb.width);
      var frac = (x - L.ct.x) / L.ct.w;
      D = Math.max(50, Math.min(600, Math.round((50 + frac * 550) / 5) * 5));
      render();
    }
    stage.addEventListener("pointerdown", function (ev) {
      dragging = true;
      try { stage.setPointerCapture(ev.pointerId); } catch (e) {}
      setFromX(ev.clientX);
    });
    stage.addEventListener("pointermove", function (ev) {
      if (!dragging) return;
      ev.preventDefault();
      setFromX(ev.clientX);
    });
    ["pointerup", "pointercancel"].forEach(function (e) {
      stage.addEventListener(e, function () { dragging = false; });
    });
    window.addEventListener("blur", function () { dragging = false; });

    var tmr = null;
    window.addEventListener("resize", function () {
      clearTimeout(tmr);
      tmr = setTimeout(applyLayout, 180);
    });

    applyLayout();
  })();
});
</script>
</body>
