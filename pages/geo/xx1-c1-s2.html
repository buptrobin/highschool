<p class="q-b">"地球是一个不透明、不发光的球体，在同一时间里，太阳只能照亮地球表面的一半。向着太阳的半球是白昼，背着太阳的半球是黑夜。地球不停地自转，昼夜也就不断地交替。"……"由于地球自西向东自转，在同一纬度地区，相对来说，东边的地点比西边地点先看到日出。"</p>
<p class="q-n">→ 三件事分开记：<b>昼夜现象</b>来自"不透明、不发光"；<b>昼夜交替</b>来自自转，周期 24 时；<b>昼夜长短</b>来自公转与黄赤交角，周期一年。</p>

  <div class="gx-ex">
<p class="ex-t">例题 · 北京冬至日的太阳高度与昼长<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">北京（约 40°N）某中学地理小组在冬至日正午测得旗杆影子朝正北，长度约为杆高的 2 倍。据此完成：（1）计算该日北京的正午太阳高度；（2）估算该日的昼长；（3）有同学认为"冬至日地球位于近日点附近，所以北京最冷"，这一说法是否成立？说明理由。</p>
<ol class="steps" id="gxSteps">
<li class="step"><p class="s-h">第 1 步 · 先定 δ 和 φ</p><p class="s-b">冬至日太阳直射南回归线，δ = −23.44°；北京 φ = +40°。符号先写对，后面才不会加错。</p><p class="s-k">用到：太阳直射点在南北回归线之间移动</p></li>
<li class="step" hidden><p class="s-h">第 2 步 · 求纬度差</p><p class="s-b">|φ − δ| = |40° − (−23.44°)| = 63.44°。两地异半球，纬度差等于两者绝对值相加；同半球才是相减。</p><p class="s-k">用到：纬度差 = |φ − δ|</p></li>

REF.ring.setAttribute("r", (L.R * (90 - PHI) / 180).toFixed(1));
REF.sub.setAttribute("cy", (L.cy - L.R * (90 - DEL) / 180).toFixed(1));
REF.cap.textContent = t >= 1 ? "极昼：太阳终日不落" : (t <= -1 ? "极夜：太阳终日不出" : "");

var px = L.px, py = L.py, pw = L.pw, phh = L.ph, pts = [], i, dd;
for (i = 0; i <= 120; i++) {
dd = -23.44 + 46.88 * i / 120;
pts.push([px + pw * i / 120, py + phh * (1 - dayLen(PHI, dd) / 24)]);
}
REF.curve.setAttribute("d", poly(pts));

var xm = px + pw * (DEL + 23.44) / 46.88;
var ym = py + phh * (1 - dl / 24);
REF.vline.setAttribute("x1", xm); REF.vline.setAttribute("x2", xm);
REF.vline.setAttribute("y1", ym); REF.vline.setAttribute("y2", py + phh);
REF.dot.setAttribute("cx", xm); REF.dot.setAttribute("cy", ym);
REF.mlab.setAttribute("x", Math.max(px + 20, Math.min(px + pw - 20, xm)));
REF.mlab.setAttribute("y", ym > py + 26 ? ym - 9 : ym + 16);
REF.mlab.textContent = dl.toFixed(1) + " 时";
  }

  function applyLayout() {
var w = stage.parentElement.getBoundingClientRect().width;
L = w >= 600 ? WIDE : NARROW;
stage.setAttribute("viewBox", L.vb);
build(); render();
  }

  $("gxSl").addEventListener("input", function () { DEL = parseFloat(this.value); render(); });
  Array.prototype.forEach.call(document.querySelectorAll("#gxP1,#gxP2,#gxP3"), function (b) {
b.addEventListener("click", function () { PHI = parseFloat(this.getAttribute("data-phi")); render(); });
  });
  stage.addEventListener("keydown", function (ev) {
if (ev.key === "ArrowLeft" || ev.key === "ArrowRight") {
ev.preventDefault();
DEL = GX.clamp(DEL + (ev.key === "ArrowRight" ? 0.5 : -0.5), -23.44, 23.44);
render();
}
  });
  var tmr = null;
  window.addEventListener("resize", function () {
clearTimeout(tmr); tmr = setTimeout(applyLayout, 180);
  });
  applyLayout();
});
</script>
</body>
</html>
