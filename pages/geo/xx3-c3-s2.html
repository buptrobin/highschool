<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再看解释。</p>
<div class="gx-quote">
<p class="q-t">课本原话 · 环境污染<span class="q-src">人教版（2019）选择性必修3 · 第三章第二节</span></p>
<p class="q-b">环境污染，是指人类活动向环境中排放的物质和能量超过了环境的自净能力，使环境质量下降、生态系统遭到破坏，进而危害人体健康的现象。</p>
<p class="q-n">→ 拆成三个条件：①排放量<b>大于</b>自净能力；②环境质量<b>下降</b>；③影响从环境溢到人和社会，才进入"国家安全"这一层。少了第①条，"污染"就只是一次正常排放。</p>
</div>
<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>环境污染</th><th>生态破坏</th></tr></thead>
<tbody>
<tr><td>直接原因</td><td>排放的物质和能量超过环境自净能力</td><td>对生物及其生境的过度索取或破坏</td></tr>
<tr><td>主要表现</td><td>水、大气、土壤中污染物浓度升高</td><td>植被减少、土地退化、生物多样性下降</td></tr>
<tr class="key"><td>与国家安全</td><td>健康风险、跨境争端、突发事件</td><td>资源基础与生态服务功能被削弱</td></tr>
<tr><td>两者联系</td><td>都使环境质量下降，常互为因果（酸雨既污染大气又毁林）</td><td>不能互相替代，答题时不可混写</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">这张表最容易背错的是最后一行：两者<b>成因不同、指标不同</b>，只能说"相互影响"，不能说"是一回事"。</p>
</section>

<p class="ex-q">某沿江化工厂发生爆炸，大量苯类污染物随消防废水进入河流，下游城市自来水厂取水口检出苯超标，城市被迫停水。该河是下游多个城镇的唯一饮用水源。<br>（1）说明该事件的污染类型与主要特点。（2）分析该事件对国家安全的影响。（3）提出应急处置与长效防治措施。</p>
<ol class="steps" id="gxSteps">
<li class="step"><p class="s-h">第 1 步 · 先定类型，再定特点</p><p class="s-b">污染物的苯类有机物进入河流——这是<b>水污染</b>；由爆炸泄漏引发、短时间集中排放——属于<b>突发性</b>环境污染事件。特点写四个：突发性、扩散快、毒性强、沿河呈带状影响下游。</p><p class="s-k">用到：环境污染的类型与特点</p></li>
<li class="step" hidden><p class="s-h">第 2 步 · 找到"影响谁"</p><p class="s-b">①供水安全：城市停水，生活与公共服务中断；②生产基础：灌溉与渔业受影响；③社会：抢水、恐慌。</p><p class="s-k">用到：环境安全传导到国家安全的三条路径</p></li>
<li class="step" hidden><p class="s-h">第 3 步 · 分开时间与空间尺度</p><p class="s-b">短期是生命与设施的直接威胁；长期是流域水土与人群健康风险。答题要写清"直接／间接""短期／长期"，不要只写"污染严重"。</p><p class="s-k">用到：影响的时间与空间尺度</p></li>
<li class="step" hidden><p class="s-h">第 4 步 · 应急四件事</p><p class="s-b">源头封堵（切断泄漏、围堵消防废水）、河道拦截（筑坝、活性炭吸附）、切换水源并发布停水通告、加密监测（取水口苯浓度）。</p><p class="s-k">用到：突发环境事件的应急处置</p></li>
<li class="step" hidden><p class="s-h">第 5 步 · 长效三条线</p><p class="s-b">源头：清洁生产、风险排查与厂址远离水源；制度：应急预案、物资储备与演练、依法追责；区域：流域联合监测与信息共享。</p><p class="s-k">用到：源头减排 + 制度与区域协作</p></li>

<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）类型：突发性水污染。特点：突发性强、毒性大、扩散快、沿河下游呈带状分布。<br>（2）①直接威胁居民生命健康与供水设施，造成城市停水；②破坏灌溉、渔业等生产基础，带来经济损失；③引发抢水与恐慌，影响社会稳定；④污染物若顺流跨境或跨区域，可能引发地区纠纷。<br>（3）应急：封堵源头、拦截吸附、切换水源、停水通告、加密监测。长效：清洁生产、风险排查、合理选址、应急预案与演练、流域联合监测、依法追责。</p>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">五问，每问都配一张小图。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「环境污染和生态破坏，答题时能混着写吗？」</p>
<p class="a">不能。污染看"排放是否超过自净能力"，指标是浓度；生态破坏看"对生物及其生境的索取"，指标是结构与功能。两者相互影响，不能互相替代。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="左为排污入河，右为植被被破坏">
<rect x="14" y="14" width="212" height="104" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<rect x="28" y="38" width="24" height="18" rx="2" fill="#dbe4ea" stroke="#9fb3c2"/>
<line x1="52" y1="50" x2="74" y2="50" stroke="#b8402f" stroke-width="2"/>
<rect x="76" y="30" width="16" height="62" rx="4" fill="#cfe6f0" stroke="#8fb9cc"/>
<text class="ms" x="56" y="104" text-anchor="middle">污染：浓度</text>
<line x1="126" y1="92" x2="218" y2="92" stroke="#cfd8e0" stroke-width="2"/>
<rect x="146" y="62" width="7" height="30" fill="#b08a5a"/>
<rect x="170" y="70" width="7" height="22" fill="#b08a5a"/>
<text class="ms" x="176" y="108" text-anchor="middle">破坏：结构</text>
</svg>
</div>
<div class="qac">
<p class="q">「污染物为什么会"跨境"？」</p>
<p class="a">因为介质会流动：洋流带走近海污染物，大气环流把酸雨和颗粒物送到下风向国家；危险废物还能被主动运出国境。国界拦得住人，拦不住浓度梯度。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="污染物越过国界从A国到达B国">
<rect x="14" y="14" width="212" height="104" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="120" y1="24" x2="120" y2="108" stroke="#b8402f" stroke-width="1.4" stroke-dasharray="5 4"/>
<text class="ms" x="120" y="22" text-anchor="middle" style="fill:#b8402f">国界</text>
<text class="ms" x="52" y="66" text-anchor="middle">A 国</text>
<text class="ms" x="186" y="66" text-anchor="middle">B 国</text>
<path d="M60,88 q30,-14 58,0 t56,0" fill="none" stroke="#3f8fb0" stroke-width="2"/>
<path d="M150,80 l10,0 l-4,-4 m4,4 l-4,4" fill="none" stroke="#3f8fb0" stroke-width="1.6"/>
<text class="ms" x="120" y="106" text-anchor="middle">洋流 / 大气环流</text>
</svg>
</div>
<div class="qac">
<p class="q">「突发环境事件就是环境安全问题的全部吗？」</p>
<p class="a">不是。突发事件可见度高，但占比小；长期累积（土壤重金属、地下水污染）更隐蔽，会持续削弱农业与渔业基础、抬高健康风险，同样威胁国家安全。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="突发污染占比小，长期污染占比大">
<rect x="14" y="14" width="212" height="104" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="40" y1="96" x2="212" y2="96" stroke="#9fb3c2" stroke-width="1.6"/>
<rect x="60" y="70" width="34" height="26" fill="#e2b3a9" stroke="#b8402f"/>
<text class="ms" x="77" y="112" text-anchor="middle">突发</text>
<rect x="132" y="34" width="34" height="62" fill="#b8d8e8" stroke="#3f6f92"/>
<text class="ms" x="149" y="112" text-anchor="middle">长期</text>
<text class="ms" x="188" y="52" text-anchor="middle" style="fill:#3f6f92">更隐蔽</text>
</svg>
</div>
<div class="qac">
<p class="q">「治理投入越多越好吗？」</p>
<p class="a">边际递减。负荷随投入指数下降，每多投 1% 的降幅越来越小，治理成本却近似线性上升，所以存在"边际收益＝边际成本"的平衡点。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="投入增加后负荷下降变缓，曲线趋于平">
<rect x="14" y="14" width="212" height="104" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="36" y1="98" x2="212" y2="98" stroke="#9fb3c2" stroke-width="1.6"/>
<line x1="36" y1="98" x2="36" y2="32" stroke="#9fb3c2" stroke-width="1.6"/>
<path d="M36,36 C80,78 130,90 208,93" fill="none" stroke="#0b6580" stroke-width="2.2"/>
<text class="ms" x="150" y="80" text-anchor="middle">降幅变小</text>
<text class="ms" x="124" y="118" text-anchor="middle">治理投入 →</text>
</svg>
</div>
<div class="qac">
<p class="q">「排放量恰好等于自净能力，算污染吗？」</p>
<p class="a">不算"超过"，但已在临界点：枯水期水量减少、水温升高都会让自净能力下降，同样的排放就变成超标。所以标准要留余量。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="排放量正好压在自净能力临界线上">
<rect x="14" y="14" width="212" height="104" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<line x1="30" y1="66" x2="210" y2="66" stroke="#b8402f" stroke-width="1.6" stroke-dasharray="6 4"/>
<text class="ms" x="196" y="60" text-anchor="end" style="fill:#b8402f">自净能力</text>
<rect x="68" y="66" width="44" height="34" fill="#b8d8e8" stroke="#3f6f92"/>
<text class="ms" x="90" y="62" text-anchor="middle">=</text>
<text class="ms" x="90" y="116" text-anchor="middle">临界，不是安全</text>
</svg>
</div>
</div>
<p class="gx-note">这五问其实是同一件事：先越过"自净能力"这条线，再沿路径传导到人和社会。</p>
</section>
<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>
<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 环境污染只是环境问题，跟国家安全没关系</p>

<p class="er-w">错在哪：把"环境"当终点。国家安全还包括资源、生态与国民健康。</p>
</div>
<div class="er">
<p class="er-x">✗ 污染的影响只在本国境内</p>
<p class="er-v">✓ 污染物可经洋流、大气环流跨境输送，危险废物还可被越境转移，需国际公约与联合监测</p>
<p class="er-w">错在哪：忽略了水与大气的流动性，也忽略了危废贸易这条人为通道。</p>
</div>
<div class="er">
<p class="er-x">✗ 环境安全就是防范爆炸、泄漏这类突发事件</p>
<p class="er-v">✓ 突发事件只是路径之一；长期累积污染更隐蔽，同样削弱基础、抬高健康风险</p>
<p class="er-w">错在哪：把"应急"当成全部，漏掉源头减排与长期治理。</p>
</div>
<div class="er">
<p class="er-x">✗ 治理投入越多越好，投到 3% 就万事大吉</p>
<p class="er-v">✓ 负荷随投入指数下降，边际收益递减而成本上升，要讲"边际收益＝边际成本"的平衡</p>
<p class="er-w">错在哪：只看效果不看成本，忽略了曲线在高投入段已经变平。</p>
</div>
<div class="er">
<p class="er-x">✗ 环境污染就是生态破坏，写哪个都行</p>
<p class="er-v">✓ 污染是"排放超过自净能力"，生态破坏是"对生物及其生境的过度索取"，两者相互影响但不能混写</p>
<p class="er-w">错在哪：成因与指标不同，混写会直接丢"概念辨析"的分。</p>

var steps=[].slice.call(document.querySelectorAll("#gxSteps .step")),ans=$("gxAns"),cnt=$("gxCnt"),nx=$("gxNext"),cur=0;
