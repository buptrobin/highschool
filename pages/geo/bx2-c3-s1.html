<!-- ================= A ================= -->
<section class="gx-sec" id="a">
  <h2><span class="sn">01</span>课本怎么说</h2>
  <p class="gx-h2s">先背标准表述，再看解释。顺序反了，答题时就写不出术语。</p>

  <div class="gx-quote">
    <p class="q-t">课本要点 · 什么是农业区位<span class="q-src">人教版（2019）必修第二册 · 第三章第一节</span></p>
    <p class="q-b">农业区位有两层含义：一是指农业生产所选定的地理位置；二是指农业与地理环境各因素的相互联系。</p>
    <p class="q-n">→ <b>两层含义，缺一不可</b>。第一层答"在哪里"（位置），第二层答"那里有什么"（与气候、地形、市场、交通的联系）。
    题目问"分析区位"，真正要你写的是第二层；只写"该地位于某省"，等于没答。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本要点 · 自然因素<span class="q-src">人教版（2019）必修第二册 · 第三章第一节</span></p>
    <p class="q-b">影响农业生产的自然因素主要有气候、地形、土壤、水源等。其中气候中的热量、光照、降水对农业影响最大。</p>
    <p class="q-n">→ 自然因素 <b>4 个</b>，气候一个顶三个：<b>热量</b>决定"一年能种几熟"，<b>光照</b>决定"甜不甜、花色艳不艳"，
    <b>降水</b>决定"要不要灌溉"。所以答气候时，把这三个词拆开写，比写"气候适宜"多拿分。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本要点 · 社会经济因素<span class="q-src">人教版（2019）必修第二册 · 第三章第一节</span></p>
    <p class="q-b">影响农业生产的社会经济因素主要有市场、交通运输、劳动力、政策、科技等。</p>
    <p class="q-n">→ 社会经济因素常考 <b>5 个</b>。它们的共同点是"<b>由人决定、变化快</b>"：
    市场变了你改种，路修通了你扩种，政策补贴了你才敢种。附加因素还有土地价格、资金、管理经验，答"土地租金低"也算对。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本要点 · 区位因素的变化<span class="q-src">人教版（2019）必修第二册 · 第三章第一节</span></p>
    <p class="q-b">自然因素比较稳定，社会经济因素变化较快。随着社会经济发展，市场、交通运输、科技等对农业区位的影响越来越强。</p>
    <p class="q-n">→ 这就是标题里"<b>及其变化</b>"的答案，也是新高考最爱考的一句。自然因素几百年才变一点；
    市场、交通、科技十几年就能把一片地的用途整个换掉——<b>大棚破热量、滴灌破水源、冷链破距离、电商破市场半径</b>。</p>
  </div>

  <p class="gx-h2s" style="margin-top:18px">先学会找"主导因素"——一个地方能种什么，往往由一个因素卡死：</p>
  <div style="overflow-x:auto">
  <table class="gx-cmp">
    <thead><tr><th>案例</th><th>主导因素</th><th>一句话理由</th></tr></thead>
    <tbody>
      <tr><td>新疆哈密瓜</td><td>光照、昼夜温差</td><td>白天制造糖分多，夜里消耗少，糖分积累</td></tr>
      <tr><td>青藏高原青稞</td><td>热量</td><td>海拔高、气温低，只能种耐寒作物</td></tr>
      <tr><td>南方水稻</td><td>水热（气候）</td><td>雨热同期，水田为主</td></tr>
      <tr><td>以色列花卉蔬菜</td><td>技术、水源</td><td>滴灌 + 温室，把沙漠变成菜园</td></tr>
      <tr><td>荷兰鲜花</td><td>市场、交通</td><td>欧洲中心，空运 + 拍卖市场当天成交</td></tr>
      <tr class="key"><td>城郊蔬菜</td><td>市场</td><td>叶菜不耐储运，必须靠近城市</td></tr>
      <tr><td>内蒙古乳品</td><td>市场、交通、饲料</td><td>靠近消费市场，冷链运输，牧草充足</td></tr>
    </tbody>
  </table>
  </div>
  <p class="gx-note">"主导因素"不是"唯一因素"，而是<b>缺了就办不成的那一个</b>。
  答这类题的标准动作：先写主导因素，再补一句"此外还有……"，让阅卷老师看到你分得清主次。</p>
</section>

<section class="gx-sec" id="d">
  <h2><span class="sn">04</span>一道题走一遍</h2>
  <p class="gx-h2s">题干先只给材料，你自己想；点"下一步"才展开这一步的推理。</p>

  <div class="gx-ex">
    <p class="ex-t">例题 <span class="bdg bdg-must">必考</span></p>
    <p class="ex-q">云南昆明附近是我国重要的鲜切花生产基地。当地鲜切花当天采切，翌日即可空运至北京、上海等地。
    <b>分析该地发展鲜切花生产的区位优势。（8 分）</b><br>
    <span style="color:#5a6472;font-size:12.5px">提示：8 分通常要答出 4–5 个点，自然和社会经济都要有。</span></p>

    <ol class="steps" id="gxSteps">
      <li class="step">
        <p class="s-h">第 1 步 · 先抓住鲜切花这个"东西"的特点</p>
        <p class="s-b">鲜切花有三个特点：<b>不耐储运</b>（几天就蔫）、<b>价值密度高</b>（一公斤能卖几十元）、
        <b>对品质敏感</b>（花大、色艳才卖得上价）。这三个特点决定了答案的重点——
        <b>气候（品质）+ 交通（速度）+ 市场（需求）</b>。先想清楚"产品特性"，再套框架，答案才不会散。</p>
        <p class="s-k">用到：农业区位因素的分析框架</p>
      </li>
      <li class="step" hidden>
        <p class="s-h">第 2 步 · 自然因素：为什么偏偏是昆明</p>
        <p class="s-b">昆明位于<b>低纬高原</b>（海拔约 1900 m）：纬度低 → <b>冬季温和、无霜期长</b>，可周年生产；
        海拔高 → <b>光照强、紫外线强、昼夜温差大</b>，花色更艳、花茎更长；<b>水源充足</b>，土壤适宜。
        四个自然因素里，真正"卡"住其他产区的，是<b>热量</b>和<b>光照</b>。</p>
        <p class="s-k">用到：自然因素四要素（气候、地形、土壤、水源）</p>
      </li>
      <li class="step" hidden>
        <p class="s-h">第 3 步 · 社会经济因素：花怎么变成钱</p>
        <p class="s-b"><b>市场</b>：国内大城市和东南亚、东亚需求大，价格高；<b>交通</b>：长水国际机场 + <b>冷链</b>，
        次日可达主要城市；<b>劳动力</b>：花农多、采切分级有经验；<b>科技</b>：育种、设施栽培、保鲜技术；
        <b>政策</b>：花卉产业扶持、斗南交易市场。五个因素里，<b>市场</b>和<b>交通</b>是主导。</p>
        <p class="s-k">用到：社会经济因素五要素（市场、交通、劳动力、政策、科技）</p>
      </li>
      <li class="step" hidden>
        <p class="s-h">第 4 步 · 收口：把"能种"和"能卖"扣在一起</p>
        <p class="s-b">最后补一句总括：<b>自然条件保证"能周年产好花"，社会经济条件解决"运得快、卖得远"，
        两者叠加才形成产业优势</b>。这句话告诉阅卷老师：你知道区位是自然与社会经济<b>共同作用</b>的结果，
        而不是只靠"气候好"。</p>
        <p class="s-k">用到：区位的两层含义 + 主导因素</p>
      </li>
    </ol>

    <div class="exbar">
      <button id="gxNext" type="button">下一步</button>
      <span class="cnt" id="gxCnt">1 / 4</span>
    </div>

    <div class="ans" id="gxAns" hidden>
      <p class="ans-t">标准答案（可抄进答题卡）</p>
      <p class="ans-b">
      <b>自然因素：</b>① 地处低纬高原，<b>冬季温和、无霜期长</b>，可周年生产；
      ② <b>光照强、昼夜温差大</b>，花卉品质好；③ 水源充足，土壤适宜。<br>
      <b>社会经济因素：</b>④ <b>市场需求大</b>，国内大城市及东南亚、东亚市场广阔；
      ⑤ <b>航空 + 冷链运输</b>便捷，鲜切花可次日到达主要市场；
      ⑥ <b>劳动力丰富</b>，采切、分级经验足；⑦ <b>科技与政策</b>支持（育种、保鲜、交易市场）。<br>
      <b>结论：</b>优越的自然条件使该地<b>能产出高品质鲜花</b>，发达的交通和市场使鲜花<b>能快速卖到远方</b>，
      自然与社会经济条件共同作用，形成鲜切花生产优势。
      </p>
    </div>
  </div>
  <p class="gx-note">这类题的通用套路：<b>先看产品特性 → 自然四要素 → 社会经济五要素 → 点出主导因素 → 一句话收口</b>。
  最容易丢分的是只写"气候温和、交通便利"，没写<b>哪种气候、便利在哪</b>——术语不到位，不给分。</p>

        <text class="ms" x="188" y="112" text-anchor="middle">何时卖</text>

    <div class="qac">
      <p class="q">「交通只影响运输费用吗？」</p>
      <p class="a"><b>不只。</b>交通决定<b>市场半径</b>：没有冷链，鲜菜只能卖到几十公里内；
      有了冷链和航空，同样的菜能卖到几千公里外。<b>交通改善 = 市场变大 = 区位改变</b>。</p>
      <svg viewBox="0 0 240 132" role="img" aria-label="交通改善使市场半径变大">
        <circle cx="86" cy="72" r="30" fill="none" stroke="#9aa3ae" stroke-dasharray="4 3"/>
        <circle cx="86" cy="72" r="54" fill="none" stroke="#0891b2" stroke-dasharray="4 3"/>
        <circle cx="86" cy="72" r="4" fill="#2f8a5b"/>

        <text class="ms" x="148" y="28" fill="#0b6580">冷链 + 空运</text>
        <text class="ms" x="150" y="104" fill="#0b6580">市场半径变大</text>
      </svg>
    </div>

    <div class="qac">
      <p class="q">「大棚是不是改变了当地气候？」</p>
      <p class="a"><b>没有。</b>大棚改变的是<b>局部小气候</b>（棚内温度、湿度、光照时间），
      一个地方的<b>区域气候类型</b>没变。所以准确说法是"<b>改造（改善）了热量条件</b>"，
      不是"改变了气候"。</p>
      <svg viewBox="0 0 240 132" role="img" aria-label="大棚内外的温度曲线：棚内更高更平">
        <line x1="24" y1="104" x2="216" y2="104" stroke="#9aa3ae"/>

    <div class="qac">
      <p class="q">「农业区位因素会变吗？」</p>
      <p class="a"><b>会。</b>自然因素变得慢，社会经济因素变得快。同一块地，1980 年种粮、2020 年种花，
      主导因素从"<b>土壤气候</b>"换成了"<b>市场交通</b>"。所以老题给"近年来"，答案就要写"变化"。</p>
      <svg viewBox="0 0 240 132" role="img" aria-label="同一块地的主导因素从土壤变成市场">
        <line x1="30" y1="62" x2="210" y2="62" stroke="#9aa3ae" stroke-width="1.4"/>
        <circle cx="52" cy="62" r="4" fill="#b8791f"/><circle cx="188" cy="62" r="4" fill="#0891b2"/>
        <text class="ms" x="52" y="46" text-anchor="middle">1980</text>
        <text class="ms" x="188" y="46" text-anchor="middle">2020</text>
        <rect x="24" y="76" width="56" height="26" fill="#f3e6c8" stroke="#d9c08a"/>
        <text class="ms" x="52" y="94" text-anchor="middle">种粮</text>
        <rect x="160" y="76" width="56" height="26" fill="#e6f6ee" stroke="#9cc3a4"/>
        <text class="ms" x="188" y="94" text-anchor="middle">种花</text>
        <text class="ms" x="120" y="122" text-anchor="middle">主导因素：土壤 → 市场</text>
      </svg>
    </div>

    <div class="qac">
      <p class="q">「新疆的瓜为什么特别甜？」</p>
      <p class="a">因为<b>光照强、昼夜温差大</b>：白天光合作用制造糖分多，夜里气温低、呼吸消耗少，糖分积累下来。
      但要注意<b>水源是限制因素</b>——瓜田都分布在<b>绿洲灌溉区</b>，没有水就没有瓜。</p>
      <svg viewBox="0 0 240 132" role="img" aria-label="新疆瓜甜的原因：光照强、温差大、水源受限">

        <circle cx="120" cy="78" r="18" fill="#e6f6ee" stroke="#2f8a5b"/>

        <text class="ms" x="42" y="94" text-anchor="middle" fill="#8a5c14">光照强</text>
        <text class="ms" x="176" y="48" text-anchor="middle">温差大</text>

      </svg>
    </div>

  <p class="gx-note">这六问其实是同一句话：<b>自然因素定上限，社会经济因素定收益，而社会经济因素一直在变。</b>

<script>
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var sl = document.getElementById("agrSl");
  if (!sl) return;

  var X0 = 48, X1 = 424, Y0 = 232, Y1 = 44, VMIN = -60, VMAX = 80;
  function xOf(d) { return X0 + d / 30 * (X1 - X0); }
  function yOf(v) { return Y0 - (v - VMIN) / (VMAX - VMIN) * (Y0 - Y1); }

  var SER = [
    { n: "蔬菜", a: 70, b: 4, c: "#2f8a5b", line: "agrL0", dot: "agrD0" },
    { n: "乳畜", a: 50, b: 1.5, c: "#0891b2", line: "agrL1", dot: "agrD1" },
    { n: "粮食", a: 25, b: 0.4, c: "#b8791f", line: "agrL2", dot: "agrD2" }
  ];
  SER.forEach(function (s) {
    s.l = document.getElementById(s.line);
    s.d = document.getElementById(s.dot);
    s.l.setAttribute("x1", X0);
    s.l.setAttribute("y1", yOf(s.a).toFixed(1));
    s.l.setAttribute("x2", X1);
    s.l.setAttribute("y2", yOf(s.a - s.b * 30).toFixed(1));
  });

  var v1 = document.getElementById("agrV1");
  var v2 = document.getElementById("agrV2");
  var v3 = document.getElementById("agrV3");
  var w3 = document.getElementById("agrW3");
  var mark = document.getElementById("agrMark");
  var read = document.getElementById("agrRead");
  var slv = document.getElementById("agrSlv");

  function render() {
    var d = parseFloat(sl.value);
    if (!isFinite(d)) d = 0;
    var best = 0, bv = -1e9;

    SER.forEach(function (s, i) {
      var v = s.a - s.b * d;
      s.d.setAttribute("cx", xOf(d).toFixed(1));
      s.d.setAttribute("cy", yOf(v).toFixed(1));
      s.d.setAttribute("r", "4");
      s.l.setAttribute("stroke-width", "2");
      s.l.setAttribute("opacity", ".4");
      if (v > bv) { bv = v; best = i; }
    });

    var B = SER[best];
    B.d.setAttribute("r", "6");
    B.l.setAttribute("stroke-width", "3.4");
    B.l.setAttribute("opacity", "1");

    mark.setAttribute("x1", xOf(d).toFixed(1));
    mark.setAttribute("x2", xOf(d).toFixed(1));
    read.textContent = "d = " + d.toFixed(1) + " km";
    slv.textContent = d.toFixed(1) + " km";

    v1.textContent = d.toFixed(1) + " km";
    v2.textContent = bv.toFixed(1);
    v3.textContent = B.n + (bv < 0 ? " · 亏本" : "");
    v3.style.color = bv < 0 ? "#b8402f" : "#2f8a5b";
    w3.textContent = bv < 0 ? "净收益为负：这个距离种什么都亏" : "净收益为正：这一距离种它最划算";
  }

  sl.addEventListener("input", render);
  render();
});
</script>
