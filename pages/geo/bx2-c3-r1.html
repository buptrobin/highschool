<p class="gx-claim">实体店不是"要不要电商"的问题，而是<b>拿哪条腿站着</b>的问题：电商拿走了标准化商品，留下的三样它送不来。</p>
<div class="gx-meta">
  <span><i></i>人教版必修第二册 第三章 问题研究</span>

<p class="gx-lede">2023 年，全国实物商品网上零售额 <b>13.0 万亿元</b>，占社会消费品零售总额的 <b>27.6%</b>——
每 4 元消费里有 1 元多花在网上。但反过来看：<b>还有七成多在线下</b>。这一年，
限额以上便利店零售额还涨了 <b>7.5%</b>，超市却降了 <b>0.4%</b>。所以真问题不是"实体店会不会死"，
而是<b>哪一类实体店在死、哪一类在长</b>。</p>

<!-- ================= A ================= -->
<section class="gx-sec" id="a">
  <h2><span class="sn">01</span>材料与问题</h2>
  <p class="gx-h2s">先看三份材料，数字都标了出处。读的时候只做一件事：分清"冲击"和"取代"。</p>

  <div class="gx-quote">
    <p class="q-t">材料一 · 网上零售的规模与占比<span class="q-src">国家统计局 · 2023 年社会消费品零售总额数据（2024-01-17 发布）</span></p>
    <p class="q-b">2023 年，全国网上零售额 154264 亿元，其中实物商品网上零售额 130174 亿元，比上年增长 8.4%，占社会消费品零售总额的比重为 27.6%。同年社会消费品零售总额 471495 亿元。</p>
    <p class="q-n">→ 两个数一起记：<b>13.0 万亿元</b>是"被电商拿走的"，<b>27.6%</b>是"拿走的比例"。
    换个说法：<b>每 4 元社零里有 1 元多在网上花掉，剩下的 7 成多仍在线下</b>。
    冲击是真的，但"取代"还远没发生。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">材料二 · 2023 年限额以上零售业态增速<span class="q-src">国家统计局 · 2023 年 12 月社会消费品零售总额数据</span></p>
    <p class="q-b">2023 年，限额以上零售业单位中，百货店、便利店、专业店、品牌专卖店零售额比上年分别增长 8.8%、7.5%、4.9%、4.5%，超市零售额比上年下降 0.4%。</p>
    <p class="q-n">→ 这张表是本节最值钱的材料：<b>实体店不是"团灭"，是"分化"</b>。
    百货和便利店在涨，超市在跌（"限额以上"指规模较大的零售企业，不是全部小店）。为什么？<b>超市卖的东西最标准化、最方便快递</b>——
    水、纸巾、零食，网上买更便宜，还能送到家。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">材料三 · 一间社区超市的成本<span class="q-src">教学示意数据（按常见社区超市量级设定，非某家店真实账本）</span></p>
    <p class="q-b">一间约 200 m² 的社区超市：月租金 3 万元、人工 4 万元、水电杂费约 1 万元，月固定成本约 8 万元；毛利率按 20% 计。</p>
    <p class="q-n">→ 算一下：<b>每天一开门就欠约 2600 元</b>，按 20% 毛利，<b>每天要卖到约 1.3 万元才保本</b>。
    实体店的成本是<b>固定的</b>（房租、人工照付），客流一少立刻亏；电商的成本是<b>变动的</b>（卖一单付一单的流量费和快递费）。
    这是两种完全不同的生意模型。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">探究问题<span class="q-src">问题研究 · 实体商店何去何从</span></p>
    <p class="q-b">① 电商抢走的到底是哪一部分生意？<br>
    ② 为什么超市受冲击最大，便利店和百货反而在增长？<br>
    ③ 实体店还有哪些电商替代不了的价值？它该往哪里转？</p>
    <p class="q-n">→ 三个问题对应三条分析线：<b>冲击机制 → 分化原因 → 转型方向</b>。
    本页的分析框架、数据表和结论都围绕这三条线展开；答题时也按这个顺序写。</p>
  </div>
</section>

    <ol class="steps" id="gxSteps">
      <li class="step">
        <p class="s-h">第 1 步 · 先定性：冲击是真的，取代是假的</p>

        <p class="s-k">用到：材料数据的解读（比例 vs 总量）</p>
      </li>
      <li class="step" hidden>
        <p class="s-h">第 2 步 · 找冲击点：电商赢在哪三件事</p>
        <p class="s-b"><b>比价</b>让价格透明，<b>无限货架</b>让品类无限，<b>快递</b>让距离失效。
        所以被打得最惨的是<b>标准化、可快递、单价不高</b>的商品——水、纸、零食、家电、化妆品。
        材料二里<b>超市 −0.4%</b>，正是这个逻辑的证据。</p>
        <p class="s-k">用到：电商的三件武器 + 实体店的成本结构</p>
      </li>
      <li class="step" hidden>
        <p class="s-h">第 3 步 · 找优势：哪三样电商送不来</p>
        <p class="s-b"><b>即时</b>（现在就要，等不了明天）、<b>体验</b>（试穿、试吃、带孩子玩）、
        <b>信任与服务</b>（安装、维修、熟人推荐）。这三样恰好对应<b>便利店 +7.5%</b>、
        <b>百货 +8.8%</b> 的增长——不是所有实体店都在退，活下来的都抓住了其中至少一样。</p>
        <p class="s-k">用到：实体店的不可替代性</p>

        <rect x="94" y="44" width="52" height="34" rx="5" fill="#eef7fb" stroke="#7fb5c9"/><text class="ms" x="120" y="65" text-anchor="middle">零食</text>
        <rect x="164" y="44" width="52" height="34" rx="5" fill="#eef7fb" stroke="#7fb5c9"/><text class="ms" x="190" y="65" text-anchor="middle">日化</text>
        <path d="M 120 86 L 120 100" stroke="#b8791f" stroke-width="1.5" marker-end="url(#mr3)"/>
        <defs><marker id="mr3" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#b8791f"/></marker></defs>
        <text class="ms" x="120" y="120" text-anchor="middle" fill="#8a5c14">可囤、可寄、可退货 → 网购</text>
      </svg>
    </div>

    <div class="qac">
      <p class="q">「市中心的大商场还有必要吗？」</p>
      <p class="a"><b>有，但要换活法。</b>从"卖货"变成"<b>卖体验</b>"：餐饮、影院、亲子、展览，
      靠人流和<b>停留时间</b>赚钱。2023 年百货店还能 <b>+8.8%</b>，说明"逛"的需求没消失。</p>
      <svg viewBox="0 0 240 132" role="img" aria-label="商场靠餐饮、影院、亲子等体验业态吸引人流">
        <rect x="70" y="26" width="100" height="76" rx="6" fill="#fff" stroke="#b8791f"/>
        <rect x="84" y="38" width="26" height="20" fill="#fdf3e0" stroke="#d9c08a"/><text class="ms" x="97" y="52" text-anchor="middle">餐饮</text>
        <rect x="118" y="38" width="26" height="20" fill="#fdf3e0" stroke="#d9c08a"/><text class="ms" x="131" y="52" text-anchor="middle">影院</text>
        <rect x="84" y="66" width="60" height="20" fill="#fdf3e0" stroke="#d9c08a"/><text class="ms" x="114" y="80" text-anchor="middle">亲子 / 展览</text>
        <text class="ms" x="120" y="120" text-anchor="middle">卖"待得住的时间"，不只卖货</text>
      </svg>
    </div>

    <div class="qac">
      <p class="q">「实体店转型就是开个网店吗？」</p>
      <p class="a"><b>不是。</b>开网店只是多一个渠道；真正的转型是<b>用线下的独有优势做线上做不到的事</b>，
      或者让门店<b>既卖货又发货</b>。只开网店、不改供应链，等于用短处拼别人的长处。</p>
      <svg viewBox="0 0 240 132" role="img" aria-label="门店和网店要双向融合，不只是单向开网店">
        <rect x="40" y="46" width="60" height="46" rx="5" fill="#eef7fb" stroke="#7fb5c9"/><text class="ms" x="70" y="74" text-anchor="middle">门店</text>
        <rect x="140" y="46" width="60" height="46" rx="5" fill="#e6f6ee" stroke="#2f8a5b"/><text class="ms" x="170" y="74" text-anchor="middle">网店</text>
        <path d="M 104 62 L 134 62" stroke="#5a6472" stroke-width="1.5" marker-end="url(#mr5)"/>
        <path d="M 136 78 L 106 78" stroke="#5a6472" stroke-width="1.5" marker-end="url(#mr5)"/>
        <defs><marker id="mr5" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#5a6472"/></marker></defs>
        <text class="ms" x="120" y="32" text-anchor="middle">双向，不是单向</text>
        <text class="ms" x="120" y="118" text-anchor="middle">渠道融合 ≠ 转型的全部</text>
      </svg>
    </div>

    <div class="qac">
      <p class="q">「社区小店该怎么活？」</p>
      <p class="a">把"<b>近</b>"做到极致：<b>24 小时</b>、<b>30 分钟送达</b>、代收快递、热食、
      上门维修。门槛人口低、网点密，正好接住"现在就要"的需求——这是电商最难抢的一块。</p>
      <svg viewBox="0 0 240 132" role="img" aria-label="社区小店靠近、快、服务活下来">
        <circle cx="60" cy="58" r="24" fill="#ecfbff" stroke="#0891b2"/><text class="ms" x="60" y="62" text-anchor="middle">近</text>
        <circle cx="120" cy="58" r="24" fill="#e6f6ee" stroke="#2f8a5b"/><text class="ms" x="120" y="62" text-anchor="middle">快</text>
        <circle cx="180" cy="58" r="24" fill="#fdf3e0" stroke="#d9a832"/><text class="ms" x="180" y="62" text-anchor="middle">服务</text>
        <text class="ms" x="60" y="102" text-anchor="middle">社区</text>
        <text class="ms" x="120" y="102" text-anchor="middle">30 分钟</text>
        <text class="ms" x="180" y="102" text-anchor="middle">代收/热食</text>
      </svg>
    </div>

  </div>
  <p class="gx-note">这六问最后落到一个<b>有条件的结论</b>：实体店不会整体消失，但会<b>按"标准化程度"分化</b>——
  越标准化越难活，越依赖即时、体验、服务越站得住。转型不是"要不要上网"，而是"<b>留下什么、放大什么</b>"。</p>
</section>

<script>
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var grid = document.getElementById("r1Cards");
  if (!grid) return;

  var cards = grid.querySelectorAll(".pickcard");
  var btns = document.querySelectorAll("#r1Bar button");
  var vSite = document.getElementById("r1Site");
  var vHit = document.getElementById("r1Hit");
  var vWhy = document.getElementById("r1Why");
  var vWay = document.getElementById("r1Way");
  var vWayS = document.getElementById("r1WayS");

  var D = [
    {
      site: "社区便利店", hit: "低", color: "#2f8a5b",
      why: "标品被分流，但“现在就要”的需求还在",
      way: "即时零售 + 社区服务", ways: "门店当前置仓，30 分钟送达；代收、热食"
    },
    {
      site: "大型超市", hit: "高", color: "#b8402f",
      why: "水、纸、零食标准化，最适合比价和快递（2023 超市 −0.4%）",
      way: "会员店 / 折扣店 + 门店配送", ways: "生鲜加工、线上下单、门店发货"
    },
    {
      site: "百货商场", hit: "中", color: "#b8791f",
      why: "服装、化妆品被比价，但“逛”和体验还在（2023 百货 +8.8%）",
      way: "体验业态 + 首店旗舰店", ways: "餐饮、影院、亲子、展览，卖停留时间"
    },
    {
      site: "家电 / 3C 卖场", hit: "高", color: "#b8402f",
      why: "参数透明、型号统一，网上更便宜（标准化程度最高）",
      way: "体验 + 安装售后 + 同价", ways: "场景化展示，线上比价、线下服务"
    }
  ];

  function show(i) {
    var d = D[i];
    if (!d) return;
    vSite.textContent = d.site;
    vHit.textContent = d.hit;
    vHit.style.color = d.color;
    vWhy.textContent = d.why;
    vWay.textContent = d.way;
    vWayS.textContent = d.ways;
    Array.prototype.forEach.call(cards, function (c) {
      var on = +c.getAttribute("data-site") === i;
      c.classList.toggle("is-on", on);
      c.setAttribute("aria-pressed", on ? "true" : "false");
    });
    Array.prototype.forEach.call(btns, function (b) {
      b.classList.toggle("is-on", +b.getAttribute("data-site") === i);
    });
  }

  Array.prototype.forEach.call(cards, function (c) {
    c.addEventListener("click", function () { show(+c.getAttribute("data-site")); });
  });
  Array.prototype.forEach.call(btns, function (b) {
    b.addEventListener("click", function () { show(+b.getAttribute("data-site")); });
  });

  show(0);
});
