<p class="gx-claim">海水三种动法：<b>风推的浪、日月拉的潮、风带的流</b>。三个的动力源完全不同。</p>
<div class="gx-meta">
  <span><i></i>人教版必修第一册 第三章第三节</span>
  <span><i></i>高一 · 地球上的水</span>
  <span><i></i>阅读 13 分钟</span>
  <span><i></i>含 1 个互动模型</span>
</div>
<p class="gx-lede">这一节最容易混的是<b>"谁在推"</b>：海浪靠<b>风</b>，潮汐靠<b>月球和太阳的引力</b>，
洋流靠<b>盛行风</b>加地转偏向力。搞清动力源，三种运动就再也不会张冠李戴。
另外记住一句反直觉的：<b>大潮在初一和十五，小潮在初八和廿三</b>——不是"月圆才有大潮"，新月一样大。</p>

<!-- ================= A ================= -->
<section class="gx-sec" id="a">
  <h2><span class="sn">01</span>课本怎么说</h2>
  <p class="gx-h2s">三段原文对应三种运动。注意每段的"动力"是从哪来的。</p>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 海浪<span class="q-src">人教版（2019）必修第一册 · 第三章第三节</span></p>
    <p class="q-b">海浪就是海里的波浪。最常见的海浪是由风力形成的，浪高越高，能量越大。海底地震、火山爆发或水下滑坡、坍塌可能会引起海水的波动，甚至形成巨浪，这种巨浪称为海啸。在强风等作用下，近岸地区海面水位急剧升降，形成风暴潮。</p>
    <p class="q-n">→ 三种浪，三个成因，<b>不能互换</b>：<b>风浪</b>（风直接吹出来）、
    <b>海啸</b>（海底地震/火山/滑坡，<b>与风无关</b>）、<b>风暴潮</b>（强风 + 近岸浅水，水位暴涨）。
    答题时"海啸是强风引起的"是硬伤——海啸的成因在海底，不在天上。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 潮汐<span class="q-src">人教版（2019）必修第一册 · 第三章第三节</span></p>
    <p class="q-b">潮汐是海水的一种周期性涨落现象，它的成因与月球和太阳对地球的引力有关。一天中，通常可以观察到两次海水涨落。古人将白天的海水涨落称为潮，夜晚的海水涨落称为汐，合称潮汐。</p>
    <p class="q-n">→ 两个关键词：<b>周期性</b>（一天两次、一月两轮大小潮）、<b>引力</b>（月球为主，太阳为辅）。
    大潮在<b>朔（初一）和望（十五）</b>——日月地成一条直线，两个引力<b>叠加</b>；
    小潮在<b>上弦（初八）和下弦（廿三）</b>——日月地成直角，两个引力<b>互相抵消一部分</b>。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 洋流<span class="q-src">人教版（2019）必修第一册 · 第三章第三节</span></p>
    <p class="q-b">海洋中的海水，常年比较稳定地沿着一定方向做大规模的流动，叫做洋流。洋流按性质可以分为暖流和寒流：从水温高的海区流向水温低的海区的洋流，叫做暖流；从水温低的海区流向水温高的海区的洋流，叫做寒流。</p>
    <p class="q-n">→ 判断暖寒流只看<b>方向</b>，不看温度绝对值：<b>低纬 → 高纬 = 暖流</b>，<b>高纬 → 低纬 = 寒流</b>。
    注意"常年比较稳定"这五个字——一次台风引起的海水流动不叫洋流。</p>
  </div>

  <p class="gx-h2s" style="margin-top:18px">三种运动对比（"动力"这一列是最大的考点）：</p>
  <div style="overflow-x:auto">
  <table class="gx-cmp">
    <thead><tr><th>运动</th><th>动力来源</th><th>周期 / 规律</th><th>主要影响</th></tr></thead>
    <tbody>
      <tr><td>海浪</td><td><b>风力</b>（海啸为海底地震等）</td><td>短周期、随机</td><td>塑造海岸地貌、影响航行与渔业、波浪能</td></tr>
      <tr class="key"><td>潮汐</td><td><b>月球与太阳的引力</b></td><td>一天两次；一月两轮大小潮</td><td>潮间带采集养殖、港口航运、潮汐发电</td></tr>
      <tr><td>洋流</td><td><b>盛行风</b> + 地转偏向力</td><td>常年稳定</td><td>气候（暖流增温增湿）、渔场、航行、污染扩散</td></tr>
    </tbody>
  </table>
  </div>
  <p class="gx-note">记法：<b>浪看天、潮看月、流看风</b>。三句话对应三种动力，考"成因"时先想这一句。</p>
</section>

  <!-- 图2 潮汐 -->
  <figure class="gx-fig">
    <div class="fig-cap">
      <span class="fig-no">图 2</span><span class="fig-t">大潮小潮：看的是日月地三者的"夹角"</span>
      <span class="bdg bdg-must">必考</span>
    </div>
    <p class="fig-s">潮差大小只取决于一件事：<b>月球引潮力和太阳引潮力是"叠加"还是"抵消"</b>。
    <b>三者成一条直线</b>（初一、十五）→ 两个力同向叠加 → <b>大潮</b>；
    <b>三者成直角</b>（初八、廿三）→ 两个力互相抵消一部分 → <b>小潮</b>。
    注意：<b>新月和满月都是大潮</b>，不是只有月圆才大。</p>

        <text x="120" y="132" text-anchor="middle" font-size="9" fill="#5a6472">月球</text>

        <line x1="76" y1="150" x2="340" y2="150" stroke="#b8791f" stroke-width="1.4" stroke-dasharray="5 4"/>

    <p class="gx-take">判断潮差大小只看<b>夹角</b>：<b>0° 或 180°（共线）→ 叠加 → 大潮</b>；
    <b>90°（垂直）→ 抵消 → 小潮</b>。不用背日期，按夹角推就能出来。</p>
    <p class="gx-note">月球引潮力约为太阳的 <b>2.2 倍</b>，所以潮汐主要由月球决定，太阳起"加强或削弱"的作用。
    这也是为什么大潮小潮跟着<b>月相</b>走，而不是跟着季节走。</p>

    <b>从高纬指向低纬的是寒流</b>（蓝）。所以同一个环上，<b>西侧（大陆东岸）是暖流、东侧（大陆西岸）是寒流</b>。</p>

      <p class="er-w">错在哪：只记了中低纬。北半球两套环流方向是反的。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 潮汐一天涨落一次</p>
      <p class="er-v">✓ <b>一天两次</b>：正对月球与背对月球两侧都隆起</p>
      <p class="er-w">错在哪：漏掉了"背对月球那一侧也会涨"。所以高潮每天推迟约 50 分钟。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 所有大渔场都是寒暖流交汇形成的</p>
      <p class="er-v">✓ 还有<b>上升流</b>型（秘鲁渔场）；两者共同点是<b>把营养盐带到表层</b></p>
      <p class="er-w">错在哪：把两类机制合并成一句。答题时"上升流"三个字不能少。</p>
    </div>
  </div>
</section>

  数据口径：海浪、潮汐、洋流的定义与成因，大潮小潮的日期，洋流按性质的分类，均按教材表述；
  太阴日约 24 小时 50 分、月球引潮力约为太阳 2.2 倍为天文学通行数值。<br>
  图 5 为<b>教学示意模型</b>：潮差按 H = 2.8 + 0.9·cos(2θ) 估算，月相按平均朔望月 29.5 天推算，
  <b>不是实际潮汐预报</b>；真实潮差受海岸地形、水深等影响，各地差异很大。

<div class="gx-zoom" id="gxZoom" hidden>
  <span class="gx-zoom-tip">双指放大 · 左右滑动看全图</span>
  <button class="gx-zoom-x" type="button" aria-label="关闭">✕</button>

<script src="../../assets/page.js"></script>
<script>
/* 海水的运动 · 讲义交互（等 page.js 把 #md 渲染成正文之后再跑） */
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var NS = "http://www.w3.org/2000/svg";
  function $(id) { return document.getElementById(id); }
  function el(tag, attrs, parent) {
    var n = document.createElementNS(NS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }
  function n1(v) { return (Math.round(v * 10) / 10).toString(); }

  if (!$("gxStage")) return;

  /* ================= 手机的图放大 ================= */
  (function () {
    var zoom = $("gxZoom"), inner = $("gxZoomInner");
    if (!zoom || !inner) return;
    Array.prototype.forEach.call(document.querySelectorAll(".gx-svgbox"), function (box) {
      box.style.cursor = "zoom-in";
      box.addEventListener("click", function () {
        if (window.innerWidth > 760) return;
        var svg = box.querySelector("svg");
        if (!svg) return;
        inner.textContent = "";
        inner.appendChild(svg.cloneNode(true));
        zoom.hidden = false;
        document.body.style.overflow = "hidden";
      });
    });
    function close() { zoom.hidden = true; document.body.style.overflow = ""; }
    zoom.addEventListener("click", function (e) {
      if (e.target === zoom || e.target.classList.contains("gx-zoom-x")) close();
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && !zoom.hidden) close();
    });
  })();

  /* ================= 分步揭示 ================= */
  (function () {
    var steps = document.querySelectorAll("#gxSteps .step");
    var ans = $("gxAns"), btn = $("gxNext"), cnt = $("gxCnt");
    if (!steps.length || !btn) return;
    var i = 1;
    function paint() { if (cnt) cnt.textContent = Math.min(i, steps.length) + " / " + steps.length; }
    steps[0].hidden = false;
    paint();
    btn.addEventListener("click", function () {
      if (i < steps.length) { steps[i].hidden = false; i++; }
      if (i >= steps.length) {
        if (ans) ans.hidden = false;
        btn.textContent = "已全部展开";
        btn.disabled = true;
      }
      paint();
    });
  })();

  /* ================= 互动：农历日期 → 月相 → 潮差 ================= */
  (function () {
    var stage = $("gxStage"), gGeo = $("gxGeo"), gTide = $("gxTide");
    var sl = $("gxSl"), vD = $("gxVd"), vH = $("gxVh"), vS = $("gxVs"), vSn = $("gxVsn"), box = $("gxStBox");

    var WIDE = {
      vb: "0 0 880 420", FS: 1,
      geo: { sx: 76, sy: 208, sr: 28, ex: 300, ey: 208, er: 30, orb: 112 },
      tide: { x: 500, y: 74, w: 336, h: 262 }, bp: 620
    };
    var NARROW = {
      vb: "0 0 360 600", FS: 1.02,
      geo: { sx: 48, sy: 168, sr: 19, ex: 208, ey: 168, er: 22, orb: 86 },
      tide: { x: 42, y: 316, w: 298, h: 236 }, bp: 620
    };
    var L = WIDE, FS = 1, D = 1, dragging = false, R = {};

    var LUNAR = 29.5;

    function theta(d) { return 2 * Math.PI * (d - 1) / LUNAR; }
    function tideH(d) { return 2.8 + 0.9 * Math.cos(2 * theta(d)); }
    function cnDay(d) {
      var a = ["", "初一", "初二", "初三", "初四", "初五", "初六", "初七", "初八", "初九", "初十",
               "十一", "十二", "十三", "十四", "十五", "十六", "十七", "十八", "十九", "二十",
               "廿一", "廿二", "廿三", "廿四", "廿五", "廿六", "廿七", "廿八", "廿九", "三十"];
      return a[d] || (d + " 日");
    }
    function phaseName(d) {
      if (d <= 2 || d >= 29) return "新月（朔）";
      if (d >= 6 && d <= 10) return "上弦月";
      if (d >= 14 && d <= 17) return "满月（望）";
      if (d >= 21 && d <= 25) return "下弦月";
      if (d < 6) return "蛾眉月";
      if (d < 14) return "凸月";
      if (d < 21) return "凸月";
      return "残月";
    }

    function tx(parent, x, y, s, col, anchor, size, weight, halo) {
      var o = { x: n1(x), y: n1(y), "font-size": (size || 10.5) * FS, fill: col,
                "text-anchor": anchor || "start", "font-weight": weight || 400 };
      if (halo) o["class"] = "halo";
      var t = el("text", o, parent);
      t.textContent = s;
      return t;
    }

    function build() {
      gGeo.textContent = ""; gTide.textContent = "";
      var G = L.geo, T = L.tide;

      /* ---------- 左：日地月 ---------- */
      tx(gGeo, G.sx - G.sr - 6, 40, "日地月位置", "#151a21", "start", 11.5, 700);

      /* 月轨 */
      el("circle", { cx: G.ex, cy: G.ey, r: G.orb, fill: "none",
                     stroke: "#dbe7ef", "stroke-width": 1.2, "stroke-dasharray": "4 4" }, gGeo);
      /* 日地连线 */
      el("line", { x1: G.sx, y1: G.sy, x2: G.ex + G.er + 40, y2: G.ey,
                   stroke: "#b8791f", "stroke-width": 1.2, "stroke-dasharray": "5 4" }, gGeo);

      /* 潮汐隆起（在地球上，沿日地方向拉长） */
      R.bulge = el("ellipse", { cx: G.ex, cy: G.ey, rx: 50, ry: 26,
                                fill: "#0891b2", opacity: 0.13 }, gGeo);

      /* 太阳 */
      el("circle", { cx: G.sx, cy: G.sy, r: G.sr + 8, fill: "#fdf3e0", opacity: 0.6 }, gGeo);
      el("circle", { cx: G.sx, cy: G.sy, r: G.sr, fill: "#fbeed7",
                     stroke: "#d8a03a", "stroke-width": 1.8 }, gGeo);
      tx(gGeo, G.sx, G.sy + 4, "太阳", "#8a5c14", "middle", 9.5, 700);

      /* 地球 */
      el("circle", { cx: G.ex, cy: G.ey, r: G.er, fill: "#dcedf5",
                     stroke: "#7fb5c9", "stroke-width": 1.8 }, gGeo);
      tx(gGeo, G.ex, G.ey + 4, "地球", "#0b6580", "middle", 9.5, 700);

      /* 月球 */
      R.moon = el("circle", { cx: G.ex - G.orb, cy: G.ey, r: 10, fill: "#e6e9ee",
                              stroke: "#9aa3ae", "stroke-width": 1.4 }, gGeo);
      R.moonLab = tx(gGeo, 0, 0, "月球", "#5a6472", "middle", 9.5, 700, true);
      R.phase = tx(gGeo, G.ex, 0, "", "#8a5c14", "middle", 11, 700);

      /* 引潮力示意：地球两侧向外拉 */
      R.aline = el("path", { fill: "none", stroke: "#0891b2", "stroke-width": 2.4 }, gGeo);
      R.atri = el("path", { fill: "#0891b2" }, gGeo);

      if (L === WIDE) {
        tx(gGeo, G.ex, G.ey + G.orb + 34, "月球绕地球一圈 ≈ 29.5 天", "#9aa3ae", "middle", 9.5);
      }

      /* ---------- 右：潮差曲线 ---------- */
      tx(gTide, T.x, T.y - 26, "一个月里的潮差", "#151a21", "start", 11.5, 700);
      el("line", { x1: T.x, y1: T.y + T.h, x2: T.x + T.w, y2: T.y + T.h,
                   stroke: "#c9c2b0", "stroke-width": 1.2 }, gTide);
      el("line", { x1: T.x, y1: T.y, x2: T.x, y2: T.y + T.h,
                   stroke: "#c9c2b0", "stroke-width": 1.2 }, gTide);

      function Yof(hv) { return T.y + T.h - (hv - 1.6) / 2.4 * T.h; }
      function Xof(d) { return T.x + (d - 1) / 29 * T.w; }

      [2, 3, 4].forEach(function (g) {
        var gy = Yof(g);
        el("line", { x1: T.x, y1: n1(gy), x2: T.x + T.w, y2: n1(gy),
                     stroke: "#f2f4f6", "stroke-width": 1 }, gTide);
        tx(gTide, T.x - 6, n1(gy + 4), g + " m", "#9aa3ae", "end", 9.5);
      });
      [1, 8, 15, 23, 30].forEach(function (d) {
        tx(gTide, Xof(d), T.y + T.h + 15, cnDay(d), "#9aa3ae", "middle", 9);
      });

      /* 大潮 / 小潮 标注 */
      tx(gTide, Xof(8), Yof(1.9) + 16, "小潮", "#0b6580", "middle", 9.5, 700, true);
      tx(gTide, Xof(15), Yof(3.66) - 8, "大潮", "#b8402f", "middle", 9.5, 700, true);
      tx(gTide, Xof(23), Yof(1.9) + 16, "小潮", "#0b6580", "middle", 9.5, 700, true);

      /* 曲线 */
      var d = "", first = true, dd, hh, px, py;
      for (dd = 1; dd <= 30.001; dd += 0.25) {
        hh = tideH(dd); px = Xof(dd); py = Yof(hh);
        d += (first ? "M " : " L ") + n1(px) + " " + n1(py);
        first = false;
      }
      el("path", { d: d + " L " + n1(T.x + T.w) + " " + n1(T.y + T.h) +
                      " L " + n1(T.x) + " " + n1(T.y + T.h) + " Z",
                   fill: "#0891b2", opacity: 0.07 }, gTide);
      el("path", { d: d, fill: "none", stroke: "#0891b2", "stroke-width": 2.6 }, gTide);

      /* 游标 */
      R.vline = el("line", { stroke: "#b8402f", "stroke-width": 1.4,
                             "stroke-dasharray": "4 4" }, gTide);
      R.dot = el("circle", { r: 5, fill: "#fff", stroke: "#b8402f", "stroke-width": 2.4 }, gTide);
      R.dLab = tx(gTide, 0, 0, "", "#b8402f", "middle", 10, 700, true);
    }

    function render() {
      var G = L.geo, T = L.tide;
      var th = theta(D), hv = tideH(D);
      var k = Math.max(0, Math.min(1, (hv - 1.9) / 1.8));

      /* 月球位置：α = π + θ */
      var al = Math.PI + th;
      var mx = G.ex + G.orb * Math.cos(al);
      var my = G.ey + G.orb * Math.sin(al);
      R.moon.setAttribute("cx", n1(mx));
      R.moon.setAttribute("cy", n1(my));
      R.moonLab.setAttribute("x", n1(mx));
      R.moonLab.setAttribute("y", n1(my - 16));

      /* 潮汐隆起：大潮更扁长 */
      R.bulge.setAttribute("rx", n1(40 + 26 * k));
      R.bulge.setAttribute("ry", n1(20 + 12 * k));

      /* 引潮力箭头：沿日地连线两侧 */
      var ar = G.er + 12 + 24 * k;
      R.aline.setAttribute("d",
        "M " + n1(G.ex - ar) + " " + n1(G.ey) + " L " + n1(G.ex - ar - 20) + " " + n1(G.ey) +
        " M " + n1(G.ex + ar) + " " + n1(G.ey) + " L " + n1(G.ex + ar + 20) + " " + n1(G.ey));
      R.atri.setAttribute("d",
        "M " + n1(G.ex - ar - 26) + " " + n1(G.ey) + " l 9 -5 l 0 10 z" +
        " M " + n1(G.ex + ar + 26) + " " + n1(G.ey) + " l -9 -5 l 0 10 z");

      /* 月相标注 */
      R.phase.setAttribute("x", n1(G.ex));
      R.phase.setAttribute("y", n1(G.ey - G.orb - 18));
      R.phase.textContent = phaseName(D) + " · 第 " + D + " 天";

      /* 潮差游标 */
      var cx = T.x + (D - 1) / 29 * T.w;
      var cy = T.y + T.h - (hv - 1.6) / 2.4 * T.h;
      R.vline.setAttribute("x1", n1(cx)); R.vline.setAttribute("x2", n1(cx));
      R.vline.setAttribute("y1", n1(T.y)); R.vline.setAttribute("y2", n1(T.y + T.h));
      R.dot.setAttribute("cx", n1(cx)); R.dot.setAttribute("cy", n1(cy));
      R.dLab.setAttribute("x", n1(Math.max(T.x + 24, Math.min(T.x + T.w - 24, cx))));
      R.dLab.setAttribute("y", n1(cy - T.y < 62 ? cy + 26 : cy - 12));
      R.dLab.textContent = hv.toFixed(1) + " m";

      /* 数值卡 */
      vD.textContent = cnDay(D);
      vH.textContent = hv.toFixed(1) + " m";

      var st, sn, cc, bg;
      if (hv > 3.35) { st = "大潮"; sn = "日月地共线，引潮力叠加"; cc = "#b8402f"; bg = "#fbeae7"; }
      else if (hv < 2.25) { st = "小潮"; sn = "日月地成直角，引潮力抵消"; cc = "#0b6580"; bg = "#ecfbff"; }
      else { st = "过渡期"; sn = "夹角介于两者之间，潮差中等"; cc = "#8a5c14"; bg = "#fdf3e0"; }
      vS.textContent = st; vSn.textContent = sn;
      vS.style.color = cc;
      box.style.background = bg;
      box.style.borderColor = cc + "44";
      if (sl.value !== String(D)) sl.value = D;
    }

    function applyLayout() {
      var w = stage.parentElement.getBoundingClientRect().width;
      L = w >= WIDE.bp ? WIDE : NARROW;
      FS = L.FS;
      stage.setAttribute("viewBox", L.vb);
      build();
      render();
    }

    sl.addEventListener("input", function () { D = +this.value; render(); });
    $("gxP1").addEventListener("click", function () { D = 1; render(); });
    $("gxP2").addEventListener("click", function () { D = 8; render(); });
    $("gxP3").addEventListener("click", function () { D = 15; render(); });
    $("gxP4").addEventListener("click", function () { D = 23; render(); });

    function setFromX(clientX) {
      var bb = stage.getBoundingClientRect();
      var vbw = parseFloat(L.vb.split(" ")[2]);
      var x = (clientX - bb.left) * (vbw / bb.width);
      var frac = (x - L.tide.x) / L.tide.w;
      D = Math.max(1, Math.min(30, Math.round(1 + frac * 29)));
      render();
    }
    stage.addEventListener("pointerdown", function (ev) {
      dragging = true;
      try { stage.setPointerCapture(ev.pointerId); } catch (e) {}
      setFromX(ev.clientX);
    });
    stage.addEventListener("pointermove", function (ev) {
      if (!dragging) return;
      ev.preventDefault();
      setFromX(ev.clientX);
    });
    ["pointerup", "pointercancel"].forEach(function (e) {
      stage.addEventListener(e, function () { dragging = false; });
    });
    window.addEventListener("blur", function () { dragging = false; });

    var tmr = null;
    window.addEventListener("resize", function () {
      clearTimeout(tmr);
      tmr = setTimeout(applyLayout, 180);
    });

    applyLayout();
  })();
});
</script>
