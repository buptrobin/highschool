  <h2><span class="sn">01</span>课本怎么说</h2>
  <p class="gx-h2s">先背标准表述，再看三个采分点。</p>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 自然环境的整体性<span class="q-src">人教版（2019）选择性必修1 · 第五章第一节</span></p>
    <p class="q-b">自然地理环境由大气、水、岩石、生物、土壤、地形等要素组成。这些要素相互联系、相互制约、相互渗透，构成一个有机整体。某一要素的变化，会导致其他要素甚至整个自然地理环境状态的改变。</p>
    <p class="q-n">→ 三个采分点：<b>要素组成</b>（有哪些）、<b>相互联系</b>（怎样连）、<b>整体响应</b>（变了会怎样）。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">教材表述 · 牵一发而动全身<span class="q-src">人教版（2019）选择性必修1 · 第五章第一节</span></p>
    <p class="q-b">某一自然地理要素发生变化，会通过物质循环与能量交换引起其他要素乃至整个自然地理环境状态的改变，即“牵一发而动全身”。</p>
    <p class="q-n">→ 答题落点：<b>变量要素</b>（谁先变）→ <b>传导过程</b>（物质循环与能量交换）→ <b>整体响应</b>（其他要素与整体状态同变）。</p>
  </div>

<section class="gx-sec" id="f">
  <h2><span class="sn">06</span>易错清单</h2>
  <p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

  <div class="gx-errs">
    <div class="er">
      <p class="er-x">✗ 整体性就是各要素整齐划一，某一要素变化不会影响其他要素。</p>
      <p class="er-v">✓ 整体性指各要素相互联系、相互制约、相互渗透；任一要素变化都会通过物质循环与能量交换影响其他要素，甚至改变整体状态。</p>
      <p class="er-w">错在哪：把"整体"误解为"同质、同步"，忽略联系与传导。整体性恰恰以要素差异和分工为前提。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 生产功能是绿色植物单独完成的，与其他要素无关。</p>
      <p class="er-v">✓ 生产功能是整体功能：光合作用需要大气提供 CO₂、水提供原料、土壤提供矿质养分、气候提供光照与热量。</p>
      <p class="er-w">错在哪：把"主要执行者"当成"唯一承担者"。植物是光合作用的场所，但原料与条件来自其他要素。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 平衡功能说明自然环境永远保持稳定，不会变化。</p>
      <p class="er-v">✓ 平衡是动态的相对稳定；干扰超过阈值，平衡被打破，系统发生演替。</p>
      <p class="er-w">错在哪：把"相对稳定"读成"绝对静止"。平衡靠物质循环与能量交换维持，本身也在变化。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 气候决定植被，植被对气候没有影响。</p>
      <p class="er-v">✓ 气候影响植被的类型与分布，植被通过蒸腾、反照率、截留等反馈气候，二者是双向作用。</p>
      <p class="er-w">错在哪：单向因果，漏掉反馈。答"植被的作用"时至少写两条，不能只写"保持水土"。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 整体性与差异性是一回事，都是讲自然环境的不均一。</p>
      <p class="er-v">✓ 整体性讲要素之间的联系与整体状态；差异性讲不同区域之间的分异规律。二者回答的问题不同。</p>
      <p class="er-w">错在哪：概念混用。设问出现"整体性"时，不要答纬度地带性、经度地带性。</p>
    </div>
  </div>

    slope: { x1: 46, y1: 296, x2: 336, y2: 186 },
    plot: { x: 512, y: 68, w: 316, h: 292 },
    lx: 30, ly: 38, rx: 440, ry: 38
  };
  var NARROW = {
    vb: "0 0 360 630",
    left: { x: 8, y: 8, w: 344, h: 296 },
    right: { x: 8, y: 316, w: 344, h: 306 },
    slope: { x1: 28, y1: 250, x2: 286, y2: 176 },
    plot: { x: 62, y: 362, w: 270, h: 194 },
    lx: 20, ly: 32, rx: 22, ry: 340
  };
  var L = WIDE, P = WIDE.plot, C = 0.45, PCP = 600, REF = {};

  function runoff(c) { return PCP * (0.65 - 0.45 * c); }
  function sediment(c) { return 12 * Math.pow(1 - c, 1.5); }
  function som(c) { return 0.8 + 2.2 * c; }

  function build() {
    var gA = $("gxA"), gB = $("gxB");
    gA.textContent = ""; gB.textContent = "";
    stage.setAttribute("viewBox", L.vb);

    el("rect", { x: L.left.x, y: L.left.y, width: L.left.w, height: L.left.h, rx: 12, fill: "#f8fbfd", stroke: "#dbe7ef" }, gA);
    tx(gA, L.lx, L.ly, "坡面：植被、径流与泥沙", "#151a21", "start", 11.2, 700);

    var s = L.slope;
    var bx = L.left.x + 46, by = L.left.y + 76;
    el("ellipse", { cx: bx, cy: by, rx: 22, ry: 14, fill: "#e3f1f8", stroke: "#b8d8e8" }, gA);
    el("ellipse", { cx: bx + 24, cy: by - 8, rx: 26, ry: 18, fill: "#e3f1f8", stroke: "#b8d8e8" }, gA);
    el("ellipse", { cx: bx + 52, cy: by, rx: 20, ry: 13, fill: "#e3f1f8", stroke: "#b8d8e8" }, gA);
    el("rect", { x: bx - 20, y: by, width: 72, height: 14, rx: 7, fill: "#e3f1f8", stroke: "#b8d8e8" }, gA);
    function sy(x) { return s.y1 + (s.y2 - s.y1) * (x - s.x1) / (s.x2 - s.x1); }
    for (var i = 0; i < 5; i++) {
      var rx0 = bx + i * 17;
      el("line", { x1: rx0, y1: by + 16, x2: rx0 - 6, y2: sy(rx0) - 5, stroke: "#7fb3cc", "stroke-width": 1.1, "stroke-dasharray": "2 3" }, gA);
    }

    el("polygon", { points: s.x1 + "," + s.y1 + " " + s.x2 + "," + s.y2 + " " + s.x2 + "," + (s.y1 + 34) + " " + s.x1 + "," + (s.y1 + 34), fill: "#e9dfcd", stroke: "none" }, gA);
    el("line", { x1: s.x1, y1: s.y1, x2: s.x2, y2: s.y2, stroke: "#b08d5f", "stroke-width": 2 }, gA);
    el("rect", { x: s.x2, y: s.y2 - 10, width: 30, height: s.y1 + 34 - s.y2 + 10, fill: "#cfe8f5", stroke: "#9fc9dc" }, gA);
    tx(gA, s.x2 + 8, s.y2 + 48, "河流", "#1f6f9e", "start", 9, 700);

    el("rect", { x: L.right.x, y: L.right.y, width: L.right.w, height: L.right.h, rx: 12, fill: "#f8fbfd", stroke: "#dbe7ef" }, gB);
    tx(gB, L.rx, L.ry, "三项指标随覆盖率变化", "#151a21", "start", 11.2, 700);

    el("rect", { x: P.x, y: P.y, width: P.w, height: P.h, fill: "#fff", stroke: "#dbe7ef" }, gB);
    for (i = 0; i <= 4; i++) {
      var gy = P.y + P.h * i / 4;
      el("line", { x1: P.x, y1: gy, x2: P.x + P.w, y2: gy, stroke: "#eef2f5" }, gB);
      tx(gB, P.x - 7, gy + 3, String(100 - i * 25), "#8a9aa5", "end", 7.5, 400);
    }
    var yt = tx(gB, P.x - 34, P.y + P.h / 2, "占自身最大值", "#5b6b76", "middle", 7.8, 400);
    yt.setAttribute("transform", "rotate(-90 " + (P.x - 34) + " " + (P.y + P.h / 2) + ")");

    for (i = 0; i <= 4; i++) {
      var gx = P.x + P.w * i / 4;
      el("line", { x1: gx, y1: P.y + P.h, x2: gx, y2: P.y + P.h + 4, stroke: "#c9d8e2" }, gB);
      tx(gB, gx, P.y + P.h + 15, String(i * 25), "#8a9aa5", "middle", 7.5, 400);
    }
    tx(gB, P.x + P.w / 2, P.y + P.h + 32, "植被覆盖率 c / %", "#5b6b76", "middle", 8, 400);

    var lg = P.y + P.h + 52;
    function legend(x, col, label) {
      el("line", { x1: x, y1: lg, x2: x + 16, y2: lg, stroke: col, "stroke-width": 2.4 }, gB);
      tx(gB, x + 21, lg + 3, label, "#3a3a35", "start", 8, 400);
    }
    legend(P.x, "#1f6f9e", "年径流");
    legend(P.x + 78, "#b5651d", "含沙量");
    legend(P.x + 156, "#2f7d4f", "有机质");

    function path(fn, max) {
      var d = "", n = 50, k, x, y;
      for (k = 0; k <= n; k++) {
        x = P.x + P.w * k / n;
        y = P.y + P.h * (1 - fn(k / n) / max);
        d += (k ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
      }
      return d;
    }
    el("path", { d: path(runoff, runoff(0)), fill: "none", stroke: "#1f6f9e", "stroke-width": 2.2, "stroke-linecap": "round" }, gB);
    el("path", { d: path(sediment, 12), fill: "none", stroke: "#b5651d", "stroke-width": 2.2, "stroke-linecap": "round" }, gB);
    el("path", { d: path(som, som(1)), fill: "none", stroke: "#2f7d4f", "stroke-width": 2.2, "stroke-linecap": "round" }, gB);

    REF.veg = el("g", {}, gA);
    REF.flow = el("g", {}, gA);
    REF.sed = el("g", {}, gA);
    REF.mark = el("g", {}, gB);
    REF.lnote = tx(gA, L.left.x + 18, L.left.y + L.left.h - 14, "", "#3f6f92", "start", 9, 600);
  }

  function render() {
    var c = C, s = L.slope, coef = 0.65 - 0.45 * c;
    var veg = REF.veg, flow = REF.flow, sed = REF.sed, mark = REF.mark;
    veg.textContent = ""; flow.textContent = ""; sed.textContent = ""; mark.textContent = "";

    var n = Math.round(c * 18), i, t, x, y;
    for (i = 0; i < n; i++) {
      t = (i + 0.5) / n;
      x = s.x1 + (s.x2 - s.x1) * t;
      y = s.y1 + (s.y2 - s.y1) * t;
      el("path", { d: "M" + (x - 3.5) + " " + (y - 1) + " q-3 -7 -5 -9 M" + x + " " + (y - 1) + " q0 -8 0 -10 M" + (x + 3.5) + " " + (y - 1) + " q3 -7 5 -9", fill: "none", stroke: "#2f7d4f", "stroke-width": 1.5, "stroke-linecap": "round" }, veg);
    }

    var ux = s.x2 - s.x1, uy = s.y2 - s.y1, len = Math.sqrt(ux * ux + uy * uy);
    ux /= len; uy /= len;
    var ox = -uy * 7, oy = ux * 7;
    var ax = s.x1 + (s.x2 - s.x1) * 0.12 + ox, ay = s.y1 + (s.y2 - s.y1) * 0.12 + oy;
    var bx2 = s.x1 + (s.x2 - s.x1) * 0.9 + ox, by2 = s.y1 + (s.y2 - s.y1) * 0.9 + oy;
    var w = 1.6 + 5.6 * coef;
    el("line", { x1: ax, y1: ay, x2: bx2, y2: by2, stroke: "#1f6f9e", "stroke-width": w.toFixed(2), "stroke-linecap": "round", opacity: 0.9 }, flow);
    el("polygon", { points: bx2 + "," + by2 + " " + (bx2 - ux * 10 - uy * 4.5) + "," + (by2 - uy * 10 + ux * 4.5) + " " + (bx2 - ux * 10 + uy * 4.5) + "," + (by2 - uy * 10 - ux * 4.5), fill: "#1f6f9e" }, flow);
    tx(flow, (ax + bx2) / 2 - 18, (ay + by2) / 2 + 24, "地表径流", "#1f6f9e", "middle", 8.6, 700);

    var m = Math.round((1 - c) * 12);
    for (i = 0; i < m; i++) {
      t = (i + 0.5) / m;
      x = s.x1 + (s.x2 - s.x1) * t + (i % 2 ? 5 : -2);
      y = s.y1 + (s.y2 - s.y1) * t + 13 + (i % 3) * 5;
      el("circle", { cx: x, cy: y, r: 1.6 + (i % 3) * 0.5, fill: "#a9713f", opacity: 0.9 }, sed);
    }

    var note, col;
    if (c >= 0.7) { note = "覆盖良好：截留、下渗强，径流与泥沙少"; col = "#1e6640"; }
    else if (c >= 0.4) { note = "植被中等：侵蚀开始增强"; col = "#8a5a12"; }
    else { note = "裸地为主：径流大、泥沙多"; col = "#b8402f"; }
    REF.lnote.textContent = note;
    REF.lnote.setAttribute("fill", col);

    var mx = P.x + P.w * c;
    el("line", { x1: mx, y1: P.y, x2: mx, y2: P.y + P.h, stroke: "#8a9aa5", "stroke-width": 1, "stroke-dasharray": "3 3" }, mark);
    function dot(v, max, color) {
      el("circle", { cx: mx, cy: P.y + P.h * (1 - v / max), r: 3.4, fill: "#fff", stroke: color, "stroke-width": 2 }, mark);
    }
    dot(runoff(c), runoff(0), "#1f6f9e");
    dot(sediment(c), 12, "#b5651d");
    dot(som(c), som(1), "#2f7d4f");

    $("gxVa").textContent = Math.round(c * 100) + "%";
    $("gxVb").textContent = String(Math.round(runoff(c)));
    $("gxVc").textContent = sediment(c).toFixed(1);
    $("gxVom").textContent = som(c).toFixed(1);
    var st, sn, bg;
    if (c >= 0.7) { st = "涵养良好"; sn = "截留、下渗强"; bg = "#e6f6ee"; }
    else if (c >= 0.4) { st = "开始退化"; sn = "侵蚀增强"; bg = "#fdf3dc"; }
    else { st = "严重流失"; sn = "径流与泥沙激增"; bg = "#fbeae7"; }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    $("gxSl").value = String(Math.round(c * 100));
  }

  $("gxSl").addEventListener("input", function () { C = (+this.value) / 100; render(); });
  $("gxP1").addEventListener("click", function () { C = 0; render(); });
  $("gxP2").addEventListener("click", function () { C = 1; render(); });
  stage.addEventListener("keydown", function (ev) {
    if (ev.key !== "ArrowLeft" && ev.key !== "ArrowRight") return;
    ev.preventDefault();
    C = Math.max(0, Math.min(1, C + (ev.key === "ArrowRight" ? 0.05 : -0.05)));
    render();
  });

  function applyLayout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? WIDE : NARROW;
    P = L.plot;
    build();
    render();
  }
  var tmr = null;
  window.addEventListener("resize", function () {
    clearTimeout(tmr);
    tmr = setTimeout(applyLayout, 180);
  });
  applyLayout();
});
</script>
</body>
</html>
