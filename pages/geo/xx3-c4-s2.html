<!-- A -->
<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再看它靠什么落地。</p>
<div class="gx-quote">
<p class="q-t">教材表述 · 国家战略与政策<span class="q-src">人教版（2019）选择性必修3 · 第四章第二节</span></p>
<p class="q-b">国家战略是国家为实现安全与发展目标而作出的全局性、长远性谋划；政策是国家为实现战略目标而制定的行动准则和采取的措施。我国通过法律法规、规划与区划、经济手段和行政手段，把战略要求落实到具体空间和具体主体。<span class="q-src">（按教材要点整理）</span></p>
<p class="q-n">→ 翻成人话：战略回答"往哪走、走到什么程度"，政策回答"谁来干、用什么工具干、干不好怎么办"。</p>
</div>
<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>国家战略</th><th>政策</th></tr></thead>
<tbody>
<tr><td>谁制定</td><td>党中央、国务院</td><td>各级政府及主管部门</td></tr>
<tr><td>时间尺度</td><td>长远、全局</td><td>中短期、具体</td></tr>
<tr><td>表现形式</td><td>战略规划、纲要、目标指标</td><td>法律、规划区划、标准、经济与行政措施</td></tr>
<tr><td>怎么检验</td><td>目标是否实现</td><td>指标是否达标、能否考核</td></tr>
<tr class="key"><td>两者关系</td><td>定方向</td><td>落地并接受考核</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">最容易背错的是把"战略"和"政策"当成同义词。题目问"说明某战略如何落实"，必须写出至少两类政策工具，否则只有方向、没有动作。</p>
<p class="gx-h2s" style="margin-top:16px">六项常考国家战略，一句话记法</p>
<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>战略</th><th>要解决的安全问题</th><th>抓手（政策接口）</th></tr></thead>
<tbody>
<tr><td>主体功能区战略</td><td>国土空间开发失序</td><td>四类功能区 + 三条控制线</td></tr>
<tr><td>区域协调发展战略</td><td>区域差距过大</td><td>转移支付、对口协作、重大工程</td></tr>
<tr><td>可持续发展战略</td><td>资源环境与发展的矛盾</td><td>循环经济、清洁生产、绿色考核</td></tr>
<tr><td>"双碳"战略</td><td>碳排放与气候安全</td><td>碳市场、能耗双控、绿色信贷</td></tr>
<tr><td>粮食安全战略</td><td>饭碗问题</td><td>永久基本农田、占补平衡、种粮补贴</td></tr>
<tr><td>能源安全战略</td><td>能源供应与转型</td><td>储备体系、可再生能源、节能提效</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">记法：每项战略后面都跟一个"安全"理由和一个"政策抓手"，答题把两端写出来，中间就不会空。</p>
</section>

<h2><span class="sn">02</span>拆开看</h2>
<p class="gx-h2s">三张图：战略先分地盘 → 政策有四类工具 → 两者接成闭环。</p>

<p class="gx-note">作答"划分依据"必须写出资源环境承载能力、现有开发密度、发展潜力三个词；限制开发不是不能发展，禁止开发也不是划了就不管。</p>

<h2><span class="sn">04</span>一道题走一遍</h2>
<p class="gx-h2s">先自己读题干想 30 秒，再点"下一步"。</p>
<div class="gx-ex">
<p class="ex-t">例题 · 三条控制线<span class="bdg bdg-must">必考</span></p>
<p class="ex-q">某市国土空间规划划定：生态保护红线占市域面积 25%，永久基本农田占 30%，城镇开发边界占 15%。但近三年该市违规占用耕地 2000 亩，其中约六成位于永久基本农田内。<br>（1）说明三条控制线的作用。（2）分析违规占用耕地的主要原因。（3）提出完善相关政策的建议。</p>
<ol class="steps" id="gxSteps">
<li class="step"><p class="s-h">第 1 步 · 拆题：三问各问什么</p><p class="s-b">作用问"线管住什么"，原因问"线为什么被突破"，建议问"哪类工具补位"。先在草稿上写下四个词：法律、规划、经济、行政。</p><p class="s-k">用到：政策工具分类</p></li>
<li class="step" hidden><p class="s-h">第 2 步 · 三条线各管一类空间</p><p class="s-b">生态保护红线划生态空间，保生态安全；永久基本农田划农业空间，保粮食安全；城镇开发边界划城镇集中建设区上限，控无序扩张。三条线合起来是国土空间的刚性约束，要"一张图"管理、不得随意调整。</p><p class="s-k">用到：主体功能区战略、粮食安全战略</p></li>
<li class="step" hidden><p class="s-h">第 3 步 · 找原因：需求—成本—监管—考核</p><p class="s-b">① 建设用地需求大，15% 的开发边界与项目布局错位；② 违法占用成本低于收益，经济约束不足；③ 基层发现晚、查处软，占补平衡把关不严；④ 部门数据不共享、职责交叉，考核问责不到位。</p><p class="s-k">用到：政策执行与考核</p></li>
<li class="step" hidden><p class="s-h">第 4 步 · 建议按工具分类写</p><p class="s-b">法律：完善地方条例、提高处罚标准、行刑衔接。规划：控制线落图入库、年度监测评估。经济：提高占用成本、完善耕地保护补偿、探索指标交易。行政：环评许可前置、田长制、督察问责。考核：纳入干部考核、终身追责。</p><p class="s-k">用到：战略定方向，政策落地</p></li>

<div class="exbar"><button id="gxNext" type="button">下一步</button><span class="cnt" id="gxCnt">1 / 5</span></div>

<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）①生态保护红线划定生态空间，保障生态安全；②永久基本农田划定农业空间，稳定耕地数量和质量，保障粮食安全；③城镇开发边界划定城镇集中建设区上限，控制城镇无序扩张；④三条线共同构成国土空间刚性约束，须"一张图"管理，不得随意突破。<br>（2）①建设用地需求大，开发边界指标偏紧，指标分配与布局错位；②违法成本低、收益高，经济约束不足；③基层发现不及时、查处偏软，占补平衡不严；④数据不共享、职责交叉，考核问责不到位。<br>（3）①法律：完善地方条例、提高处罚标准、行刑衔接；②规划：控制线落图入库、年度监测评估；③经济：提高占用成本、完善耕地保护补偿、探索指标交易；④行政：环评许可前置、田长制、督察问责；⑤考核：纳入干部考核、终身追责。</p>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">五问，覆盖辨析、反直觉、易错、边界和极端。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「主体功能区和行政区是一回事吗？」</p>
<p class="a">不是。功能区按资源环境承载能力、开发密度、发展潜力划分，可跨行政区；同一行政区内部可同时存在重点开发区域和限制开发区域，政策跟着"区"走。</p>
<svg viewBox="0 0 240 132"><rect x="16" y="16" width="208" height="96" rx="8" fill="#f6f8fa" stroke="#dde4ea"/><rect x="38" y="34" width="92" height="52" rx="6" fill="#eef6fb" stroke="#b8d8e8"/><rect x="106" y="46" width="94" height="52" rx="6" fill="#e6f6ee" stroke="#b9dfc9"/><text class="ms" x="84" y="64" text-anchor="middle" style="fill:#0b6580">行政区</text><text class="ms" x="152" y="76" text-anchor="middle" style="fill:#1e6640">功能区</text><text class="ms" x="120" y="30" text-anchor="middle" style="fill:#6b7785">两套边界</text><text class="ms" x="120" y="106" text-anchor="middle" style="fill:#b8402f">功能可跨行政区</text></svg>
</div>
<div class="qac">
<p class="q">「政策是不是越多越好？」</p>
<p class="a">不是。政策要协调配套：多头审批、重复补贴会互相抵消，抬高执行成本。强度从 30 拉到 100，达标率只从 63% 升到 96%，边际递减明显，应先补最缺的那类工具。</p>
<svg viewBox="0 0 240 132"><rect x="16" y="16" width="208" height="96" rx="8" fill="#f6f8fa" stroke="#dde4ea"/><polyline points="40,96 72,74 104,60 136,52 168,47 200,44" fill="none" stroke="#0b6580" stroke-width="1.6"/><line x1="40" y1="96" x2="204" y2="96" stroke="#c9d6df"/><line x1="40" y1="30" x2="40" y2="96" stroke="#c9d6df"/><circle cx="40" cy="96" r="2.6" fill="#b8402f"/><circle cx="104" cy="60" r="2.6" fill="#1e6640"/><circle cx="200" cy="44" r="2.6" fill="#9a6a12"/><text class="ms" x="48" y="108" style="fill:#6b7785">弱</text><text class="ms" x="176" y="108" style="fill:#6b7785">强 →</text><text class="ms" x="120" y="28" text-anchor="middle" style="fill:#b8402f">越往上越平</text></svg>
</div>
<div class="qac">
<p class="q">「生态补偿就是政府发钱吗？」</p>
<p class="a">不只是资金补偿。还包括产业扶持、对口协作、技术转移、人才培训和基础设施共建；资金可来自财政转移支付、生态产品交易和碳汇收益，并且要考核生态保护成效。</p>
<svg viewBox="0 0 240 132"><rect x="16" y="16" width="208" height="96" rx="8" fill="#f6f8fa" stroke="#dde4ea"/><rect x="30" y="30" width="86" height="28" rx="6" fill="#eef6fb" stroke="#b8d8e8"/><text class="ms" x="73" y="48" text-anchor="middle" style="fill:#0b6580">资金补偿</text><rect x="124" y="30" width="86" height="28" rx="6" fill="#e6f6ee" stroke="#b9dfc9"/><text class="ms" x="167" y="48" text-anchor="middle" style="fill:#1e6640">产业扶持</text><rect x="30" y="66" width="86" height="28" rx="6" fill="#fdf3e0" stroke="#ecd6a8"/><text class="ms" x="73" y="84" text-anchor="middle" style="fill:#9a6a12">技术人才</text><rect x="124" y="66" width="86" height="28" rx="6" fill="#fbeae7" stroke="#eec4bb"/><text class="ms" x="167" y="84" text-anchor="middle" style="fill:#b8402f">设施共建</text><text class="ms" x="120" y="108" text-anchor="middle" style="fill:#6b7785">四类并用，才叫"补偿"</text></svg>
</div>
<div class="qac">
<p class="q">「三条控制线能不能都"占满"？」</p>
<p class="a">不能。生态保护红线和永久基本农田是"底线"，城镇开发边界是"上限"；开发边界不得侵入前两类线，调整要依法依规并落实占补平衡。</p>
<svg viewBox="0 0 240 132"><rect x="16" y="16" width="208" height="96" rx="8" fill="#f6f8fa" stroke="#dde4ea"/><rect x="30" y="28" width="180" height="16" rx="4" fill="#fbeae7" stroke="#eec4bb" stroke-dasharray="4 3"/><text class="ms" x="120" y="40" text-anchor="middle" style="fill:#b8402f">城镇开发边界（上限）</text><rect x="38" y="52" width="164" height="22" rx="4" fill="#e6f6ee" stroke="#b9dfc9"/><text class="ms" x="120" y="67" text-anchor="middle" style="fill:#1e6640">永久基本农田（底线）</text><rect x="38" y="80" width="96" height="22" rx="4" fill="#eef6fb" stroke="#b8d8e8"/><text class="ms" x="86" y="95" text-anchor="middle" style="fill:#0b6580">生态保护红线</text></svg>

<div class="qac">
<p class="q">「强度拉到 100，达标率能到 100% 吗？」</p>

<svg viewBox="0 0 240 132"><rect x="16" y="16" width="208" height="96" rx="8" fill="#f6f8fa" stroke="#dde4ea"/><line x1="40" y1="96" x2="204" y2="96" stroke="#c9d6df"/><line x1="40" y1="26" x2="40" y2="96" stroke="#c9d6df"/><polyline points="40,96 104,60 200,44" fill="none" stroke="#0b6580" stroke-width="1.6"/><circle cx="40" cy="96" r="2.6" fill="#b8402f"/><circle cx="104" cy="60" r="2.6" fill="#1e6640"/><circle cx="200" cy="44" r="2.6" fill="#9a6a12"/><text class="ms" x="40" y="112" text-anchor="middle" style="fill:#b8402f">0</text><text class="ms" x="104" y="112" text-anchor="middle" style="fill:#1e6640">63</text><text class="ms" x="200" y="112" text-anchor="middle" style="fill:#9a6a12">96</text><text class="ms" x="120" y="34" text-anchor="middle" style="fill:#6b7785">不会碰到天花板顶</text></svg>
</div>
</div>
<p class="gx-note">这五问其实是同一件事：战略要有指标，政策要有工具，工具要能被考核——所以问来问去都落在"怎么落地、怎么检验"上。</p>

el("line",{x1:gx,y1:y1,x2:gx,y2:gy,stroke:"#9a6a12","stroke-dasharray":"4 3"},g);
el("circle",{cx:gx,cy:gy,r:2.8,fill:"#9a6a12"},g);
tx(g,gx+5,gy-8,"30 → 63","#9a6a12","start",8.4*L.fs,700);
REF.line=el("line",{x1:x0,y1:y1,x2:x0,y2:y1,stroke:"#b8402f","stroke-width":1,"stroke-dasharray":"3 3"},g);
REF.dot=el("circle",{cx:x0,cy:y1,r:5,fill:"#b8402f",stroke:"#fff","stroke-width":1.5},g);
REF.val=tx(g,x0,y1-10,"","#b8402f","middle",9.6*L.fs,700);
REF.x0=x0;REF.x1=x1;REF.y0=y0;REF.y1=y1;
}
function build(){var a=$("gxA"),b=$("gxB");a.textContent="";b.textContent="";drawLeft(a);drawRight(b);}
function render(){
var r=rate(S),c=0.9*r;
var x=REF.x0+S/100*(REF.x1-REF.x0),y=REF.y1-r/100*(REF.y1-REF.y0);
REF.dot.setAttribute("cx",x);REF.dot.setAttribute("cy",y);
REF.line.setAttribute("x2",x);REF.line.setAttribute("y2",y);
REF.val.setAttribute("x",Math.max(REF.x0+16,Math.min(x,REF.x1-16)));
REF.val.setAttribute("y",Math.max(y-10,REF.y0+10));
REF.val.textContent=r.toFixed(0)+"%";
$("gxVa").textContent=String(S);$("gxVb").textContent=r.toFixed(0);$("gxVc").textContent=c.toFixed(0);
var st,col,bg,sub;
if(S<30){st="推进缓慢";col="#3f6f92";bg="#eef6fb";sub="强度 < 30";}
else if(S<75){st="基本达标";col="#1e6640";bg="#e6f6ee";sub="强度 30–74";}
else{st="超额完成";col="#9a6a12";bg="#fdf3e0";sub="强度 ≥ 75";}
$("gxVs").textContent=st;$("gxVsn").textContent=sub;
$("gxStBox").style.background=bg;$("gxStBox").style.borderColor=col+"44";
$("gxVs").style.color=col;$("gxSl").value=String(S);
}
function applyLayout(){L=stage.parentElement.getBoundingClientRect().width>=640?WIDE:NARROW;stage.setAttribute("viewBox",L.vb);build();render();}
$("gxSl").addEventListener("input",function(){S=+this.value;render();});
$("gxP1").addEventListener("click",function(){S=30;render();});
$("gxP2").addEventListener("click",function(){S=100;render();});
stage.addEventListener("keydown",function(e){if(e.key==="ArrowLeft"||e.key==="ArrowRight"){e.preventDefault();S=GX.clamp(S+(e.key==="ArrowRight"?2:-2),0,100);render();}});
var t=null;window.addEventListener("resize",function(){clearTimeout(t);t=setTimeout(applyLayout,180);});
applyLayout();
});
</script>
</body>
