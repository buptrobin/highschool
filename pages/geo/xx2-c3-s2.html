  <h2><span class="sn">01</span>课本怎么说</h2>
  <p class="gx-h2s">先背标准表述，再学会用三个数读一个地区。</p>

  <div class="gx-quote">
    <p class="q-t">课本要点 · 地区产业结构<span class="q-src">人教版（2019）选择性必修2 · 第三章第二节</span></p>
    <p class="q-b">地区产业结构，指一个地区第一、第二、第三产业之间的比例关系。随着经济发展和人均收入提高，劳动力与产值比重依次由第一产业向第二、第三产业转移：第一产业比重持续下降，第二产业比重先升后降，第三产业比重持续上升。</p>
    <p class="q-n">→ 翻成人话：判断一个地区处在哪个阶段，先读三个比重；比重变化的背后，是劳动力、资本、技术往收益更高的部门流动。配第—克拉克定理讲「往哪走」，产业结构升级讲「走上去」。</p>

  <div class="gx-ex">
    <p class="ex-t">例题<span class="bdg bdg-must">必考</span></p>
    <p class="ex-q">甲省三次产业比重为 12∶48∶40，乙省为 4∶36∶60。比较两省产业结构差异，说明产业结构变化的一般规律，并为甲省提出产业升级建议。</p>
    <ol class="steps" id="gxSteps">
      <li class="step"><p class="s-h">第 1 步 · 先给两省定性</p><p class="s-b">甲省二产 48% 最高、一产仍占 12%；乙省三产 60% 最高、一产只有 4%。一句话：乙省的产业结构层次高于甲省。</p><p class="s-k">用到：三次产业划分、比重判读</p></li>
      <li class="step" hidden><p class="s-h">第 2 步 · 差异要逐项比</p><p class="s-b">按「一产—二产—三产」各说一句：甲省一产比重明显高于乙省，二产比重高于乙省，三产比重低于乙省。不要只写「甲比乙落后」这种没有数据的空话。</p><p class="s-k">用到：产业结构比较的描述框架</p></li>
      <li class="step" hidden><p class="s-h">第 3 步 · 一般规律怎么答</p><p class="s-b">配第—克拉克定理：劳动力和产值比重依次由一产向二产、三产转移。具体到比重：一产持续下降，二产先升后降，三产持续上升；主导产业由一产到二产再到三产，要素由劳动密集向资本、技术密集升级，附加值由低到高。</p><p class="s-k">用到：配第—克拉克定理 + 升级路径</p></li>

    p1 = Math.round(p1 * 10) / 10;
    p2 = Math.round(p2 * 10) / 10;
    var p3 = Math.round((100 - p1 - p2) * 10) / 10;
    var mx = Math.max(p1, p2, p3);

      dom: mx === p1 ? "第一产业" : (mx === p2 ? "第二产业" : "第三产业"),
