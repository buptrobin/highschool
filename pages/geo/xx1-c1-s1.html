<section class="gx-sec" id="a">
  <h2><span class="sn">01</span>课本怎么说</h2>
  <p class="gx-h2s">先背标准表述，再看解释。顺序反了，答题时就写不出术语。</p>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 地球的自转<span class="q-src">人教版（2019）选择性必修1 · 第一章第一节</span></p>
    <p class="q-b">地球绕其自转轴的旋转运动，叫作地球的自转。地球自转方向为自西向东。</p>
    <p class="q-n">→ 这句话有三个要件：<b>绕地轴</b>、<b>自西向东</b>、<b>周期性</b>。
    "自西向东"在图上怎么认？只有一条判据：<b>从北极上空看是逆时针，从南极上空看是顺时针</b>。
    两种说法不是矛盾，而是同一个方向从两端看的样子。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 自转的周期<span class="q-src">人教版（2019）选择性必修1 · 第一章第一节</span></p>
    <p class="q-b">以太阳为参照物，地球自转一周的时间为24时，叫作一个太阳日；以恒星为参照物，地球自转一周的时间为23时56分4秒，叫作一个恒星日。</p>
    <p class="q-n">→ 两个"一天"差 <b>3 分 56 秒</b>，原因只有一句话：<b>地球一边自转、一边在公转</b>。
    转满 360° 时，太阳已经在星空背景上向东挪了约 0.9856°，地球还得再多转这一点，太阳才回到同一位置。
    <b>问"自转一周"答恒星日，问"昼夜交替周期"才答 24 时</b>——这是第一个必考陷阱。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 自转的速度<span class="q-src">人教版（2019）选择性必修1 · 第一章第一节</span></p>
    <p class="q-b">地球自转的角速度，除极点为0外，其他地区均约为15°/时。地球自转的线速度，自赤道向两极递减。</p>
    <p class="q-n">→ 一句话里同时成立两条相反的规律：<b>角速度几乎处处相等</b>（15°/时），<b>线速度处处不等</b>（赤道最大 1670 km/h，越往两极越小）。
    原因是半径：纬度 φ 处的自转半径是 <b>R·cosφ</b>，转一圈走的路短了，角速度却没变。
    注意课本那句"除极点为0外"不能丢——<b>极点的角速度是 0，不是 15°</b>。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 公转与黄赤交角<span class="q-src">人教版（2019）选择性必修1 · 第一章第一节</span></p>
    <p class="q-b">地球绕太阳的运动，叫作地球的公转。地球公转方向为自西向东。……每年1月初，地球距离太阳最近，这个位置叫近日点；每年7月初，地球距离太阳最远，这个位置叫远日点。地球自转的赤道平面与公转的轨道平面（黄道平面）之间的夹角，叫黄赤交角。目前黄赤交角是23°26′。</p>
    <p class="q-n">→ 公转要记四个数：<b>方向</b>自西向东、<b>周期</b>1 恒星年（365 日 6 时 9 分 10 秒）、
    <b>轨道</b>近圆椭圆（太阳在一个焦点上）、<b>速度</b>近日点快、远日点慢。
    而 <b>23°26′</b> 是"四季"的总开关：它决定太阳直射点只能在南北回归线之间往返，
    也决定了极圈出现在 66°34′ 而不是别处。</p>
  </div>

  <p class="gx-h2s" style="margin-top:18px">把两件事并排放，差别一眼就出来了（<b>高亮那一行是最容易混的</b>）：</p>

  但两者的"变"完全不是一回事——自转的角速度<b>不变</b>，公转的角速度<b>在变</b>（近日点快）。</p>

        <p class="s-k">用到：自转线速度与纬度的关系</p>

      <li class="step" hidden>
        <p class="s-h">第 2 步 · 把四个数算出来</p>
        <p class="s-b">甲 0°：1670 × cos0° = <b>1670</b> km/h；乙 30°N：1670 × cos30° ≈ <b>1446</b>；
        丙 60°N：1670 × cos60° = <b>835</b>；丁 90°N：1670 × cos90° = <b>0</b>。

        <p class="s-k">用到：特殊角余弦值（cos30°≈0.866、cos60°=0.5、cos90°=0）</p>

    var d = "M " + n1(p[0][0]) + " " + n1(p[0][1]);
    for (k = 1; k < p.length; k++) d += " L " + n1(p[k][0]) + " " + n1(p[k][1]);
    var vc = document.getElementById("gxVc");
    if (vc) vc.setAttribute("d", d);

    var q = [];
    for (k = 1; k <= 365; k += 2) {
      var dec = 23.44 * Math.sin(2 * Math.PI * (k - 80.5) / 365.25);
      q.push([470 + (k - 1) / 364 * 320, 190 - dec / 23.44 * 110]);
    }
    var dd = "M " + n1(q[0][0]) + " " + n1(q[0][1]);
    for (k = 1; k < q.length; k++) dd += " L " + n1(q[k][0]) + " " + n1(q[k][1]);
    var dc = document.getElementById("gxDecl");
    if (dc) dc.setAttribute("d", dd);
  })();

  applyLayout();
});
</script>
