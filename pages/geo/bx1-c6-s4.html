<p class="gx-claim"><b>遥感是眼睛，导航是坐标，GIS 是大脑</b>——三样配合，才是"3S"。</p>
<div class="gx-meta">
  <span><i></i>人教版（2019）必修第一册 第六章第四节</span>
  <span><i></i>高一 · 自然灾害</span>
  <span><i></i>阅读 12 分钟</span>

<p class="gx-lede">这一节是"技术名词题"，考法很固定：
<b>给一个情境，问你用了哪种技术、起了什么作用</b>。
所以必须把<b>遥感（RS）、全球卫星导航系统（GNSS）、地理信息系统（GIS）</b>三者的功能
<b>一句话锁死</b>：<b>RS = 获取信息（看），GNSS = 定位与导航（在哪），GIS = 分析与管理数据（算）</b>。
凡是答"用了 GIS 拍照"或"用遥感定位"，都是零分。</p>

<!-- ================= A ================= -->
<section class="gx-sec" id="a">
  <h2><span class="sn">01</span>课本怎么说</h2>
  <p class="gx-h2s">先背标准表述，再看解释。顺序反了，答题时就写不出术语。</p>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 遥感技术（RS）<span class="q-src">人教版（2019）必修第一册 · 第六章第四节</span></p>
    <p class="q-b">遥感技术是人们在航空器或航天器上，利用一定的技术装备，对地表物体进行远距离的感知。
    遥感技术具有探测范围大、获取信息速度快、周期短、受地面条件限制少等优点，
    在防灾减灾中主要用于灾害监测与灾情评估。</p>
    <p class="gx-n">→ <b>四个优点要背成一串</b>：<b>范围大、速度快、周期短、受地面限制少</b>。
    这四个词是"为什么用遥感而不用人工调查"的标准答案。
    功能只记一个字：<b>看</b>——看洪水淹到哪、看山体有没有裂缝、看火烧面积有多大。
    <b>它只"看"，不"算"，也不"定"。</b></p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 全球卫星导航系统（GNSS）<span class="q-src">人教版（2019）必修第一册 · 第六章第四节</span></p>
    <p class="q-b">全球卫星导航系统是利用卫星在全球范围内进行定位、导航的系统。
    我国的北斗卫星导航系统具有定位、导航、授时和短报文通信等功能，在防灾减灾中可用于灾害救援的定位与导航。</p>
    <p class="gx-n">→ 功能记两个字：<b>定位 + 导航</b>（外加北斗特有的<b>短报文通信</b>）。
    在灾害中的典型用法是：<b>救援队在哪、受灾点在哪、怎么走过去</b>。
    <b>短报文</b>是北斗的独家优势——通信基站断了也能发消息，这一条常被当成"我国北斗特点"来考。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 地理信息系统（GIS）<span class="q-src">人教版（2019）必修第一册 · 第六章第四节</span></p>
    <p class="q-b">地理信息系统是对地理空间数据进行输入、管理、分析和表达的系统。
    它可以把不同来源的地理数据叠加在一起进行分析，为防灾减灾提供决策支持。</p>
    <p class="gx-n">→ 关键词是<b>"分析"</b>与<b>"叠加"</b>：把地形、降雨、人口、道路<b>叠在一起</b>，
    算出"哪里最危险、走哪条路最快"。
    这是三者中<b>唯一会"算"的</b>，所以凡是问"评估、区划、选点、最优路线"，
    答案几乎都是 GIS。</p>
  </div>

  <p class="gx-h2s" style="margin-top:18px">三者"一句话功能"对照，这张表是本节的命门：</p>
  <div style="overflow-x:auto">
  <table class="gx-cmp">
    <thead><tr><th>技术</th><th>一句话功能</th><th>典型用法</th><th>常见错答</th></tr></thead>
    <tbody>
      <tr class="key"><td>RS 遥感</td><td><b>获取地表信息（看）</b></td><td>监测洪水范围、滑坡体、火场、作物长势</td><td>说它"分析数据"</td></tr>
      <tr><td>GNSS 导航</td><td><b>定位与导航（在哪）</b></td><td>救援队定位、车辆导航、大坝形变监测</td><td>说它"拍照片"</td></tr>
      <tr><td>GIS 地理信息系统</td><td><b>输入、管理、分析、表达（算）</b></td><td>风险区划、灾情评估、撤离路线优选</td><td>说它"获取影像"</td></tr>
    </tbody>
  </table>
  </div>
  <p class="gx-note">三者的关系可以这样串：
  <b>RS 把"看见的"变成数据 → GNSS 给每个数据一个准确坐标 → GIS 把这些数据叠起来算结论</b>。
  少了任何一环，链条就断：数据没有坐标就是废数据，有坐标不分析就只是地图。</p>

<!-- ================= D ================= -->
<section class="gx-sec" id="d">
  <h2><span class="sn">04</span>一道题走一遍</h2>
  <p class="gx-h2s">先自己读题干想 30 秒，再点"下一步"。每一步只推进一个判断。</p>

  <div class="gx-ex">
    <p class="ex-t">例题<span class="bdg bdg-must">必考</span></p>
    <p class="ex-q">某年 7 月，长江中下游发生严重洪涝。有关部门用卫星影像获取了洪水淹没范围，
    救援队携带装有北斗终端的设备进入灾区，指挥部在电脑上把淹没范围、地形、居民点分布叠在一起，
    确定优先救援的村庄和运输路线。<br><br>
    （1）指出获取洪水淹没范围所用的地理信息技术，并说明其优势。<br>
    （2）说明北斗终端在此次救援中的作用。<br>
    （3）指挥部"叠加分析"用的是什么技术？举出它在此次灾害中的两项用途。<br>
    （4）为什么说这三项技术必须配合使用？</p>

    <ol class="steps" id="gxSteps">
      <li class="step">
        <p class="s-h">第 1 步 · "获取淹没范围"就是"看"</p>
        <p class="s-b">用的是<b>遥感技术（RS）</b>。优势写课本四句：<b>探测范围大、获取信息速度快、
        周期短、受地面条件限制少</b>。洪水期间地面交通中断，人工调查进不去，
        <b>这正是"受地面条件限制少"要考的场合</b>。</p>
        <p class="s-k">用到：遥感的功能与优点</p>
      </li>
      <li class="step" hidden>
        <p class="s-h">第 2 步 · 北斗干的是"定位置、指路线"</p>
        <p class="s-b">两个作用：<b>①定位</b>——确定救援队与受灾点的准确位置，便于调度；
        <b>②导航</b>——规划并指引通往灾区的路线。
        加一句更好：<b>北斗具有短报文通信功能，可在通信中断时发送位置与求救信息。</b></p>
        <p class="s-k">用到：GNSS 的功能</p>
      </li>
      <li class="step" hidden>
        <p class="s-h">第 3 步 · "叠加"两个字就是 GIS 的名片</p>
        <p class="s-b">用的是<b>地理信息系统（GIS）</b>，它负责对地理空间数据进行<b>输入、管理、分析和表达</b>。
        两项用途举例：<b>①灾情评估</b>（淹没范围 × 居民点 → 受灾人口与财产）；
        <b>②救援路线优选</b>（淹没范围 × 道路 × 地形 → 最安全的运输路线）；
        也可以是<b>避难场所选址</b>或<b>风险区划</b>。<b>要写成"×× × ××"的叠加关系，最像 GIS。</b></p>
        <p class="s-k">用到：GIS 的功能</p>
      </li>
      <li class="step" hidden>
        <p class="s-h">第 4 步 · 三条链缺一不可</p>
        <p class="s-b">因为三者的<b>功能互补</b>：<b>RS 提供"哪里淹了"的信息，但没有坐标就不能用；
        GNSS 提供"在哪"，但不知道周围淹成什么样；GIS 能分析，但没有前两者的数据就是空的</b>。
        一句话总结：<b>RS 出数据 → GNSS 给坐标 → GIS 算结论</b>，
        灾害应急正是"看得见、找得到、算得清"三者同时需要。</p>
        <p class="s-k">用到：3S 技术的配合</p>
      </li>
    </ol>

    <div class="exbar">
      <button id="gxNext" type="button">下一步</button>
      <span class="cnt" id="gxCnt">1 / 4</span>
    </div>

    <div class="ans" id="gxAns" hidden>
      <p class="ans-t">标准答案（可抄进答题卡）</p>
      <p class="ans-b">
      （1）<b>遥感技术（RS）</b>。优势：<b>探测范围大、获取信息速度快、周期短、受地面条件限制少</b>，
      能在大范围、交通中断的条件下快速获取洪水淹没范围。<br>
      （2）<b>定位</b>：确定救援队伍与受灾点的准确位置，便于统一调度；
      <b>导航</b>：为救援车辆规划并指引行进路线；
      此外北斗的<b>短报文通信</b>功能可在通信中断时传递位置与灾情信息。<br>
      （3）<b>地理信息系统（GIS）</b>。用途：<b>①灾情评估</b>——将淹没范围与居民点、耕地叠加，估算受灾人口与损失；
      <b>②救援路线优选</b>——将淹没范围、道路与地形叠加，选择安全快捷的运输路线（也可用于避难场所选址、风险区划）。<br>
      （4）三者<b>功能互补</b>：<b>RS 负责获取灾情信息（看），GNSS 负责确定位置与导航（在哪），GIS 负责分析与管理数据（算结论）</b>。
      缺少 RS 就没有灾情数据，缺少 GNSS 数据没有准确坐标，缺少 GIS 则无法把多源数据综合分析、支撑决策。
      </p>
    </div>
  </div>
  <p class="gx-note">这类题的通用套路：<b>看 → RS；定 → GNSS；算 → GIS</b>，三个动词先定技术，再补功能与用途。
  最容易丢分的是第（3）问只写"用了 GIS"，<b>没有写出"谁和谁叠加"</b>。</p>
</section>

<section class="gx-sec" id="e">
  <h2><span class="sn">05</span>会怎么考</h2>

  <div class="gx-qa">

    <div class="qac">
      <p class="q">「RS 和 GIS 到底差在哪？」</p>
      <p class="a"><b>RS 是"眼睛"，GIS 是"大脑"。</b>RS <b>获取</b>地表信息（拍下来、扫出来）；

      所以"获取影像"是 RS，"叠加分析、出图、选址"是 GIS。
      <b>说"GIS 拍到了洪水"是最典型的错答。</b></p>

      <p class="a"><b>反了。</b>分辨率指<b>一个像元覆盖的地面边长</b>，

      <p class="q">「GIS 能"定位"吗？」</p>

      <p class="er-w">错在哪：把"提供数据"当成"替代决策"。答案里加一句"需要与人工核查结合"更稳。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 北斗的作用只是导航</p>
      <p class="er-v">✓ <b>定位、导航、授时，还有短报文通信</b></p>
      <p class="er-w">错在哪：只记住了民用导航。救援中最关键的是能在无通信条件下报出位置。</p>
    </div>
  </div>

  对应 <b>人教版（2019）必修第一册 第六章第四节「地理信息技术在防灾减灾中的应用」</b> · 生成自 <code>eli5-high</code> skill<br>
  数据口径：遥感优点、GNSS 与 GIS 的功能表述按教材；"最小可判读目标 ≈ 3 像元"为<b>判读经验法则</b>，

  图 5 的像元网格为<b>示意</b>（3 m 以下不再画格），场景内容不代表真实影像；

  <span class="gx-zoom-tip">双指放大 · 左右滑动看全图</span>

<script src="../../assets/page.js"></script>
<script src="../../assets/geo-autopilot.js"></script>
<script>
/* 地理信息技术 · 讲义交互（等 page.js 把 #md 渲染成正文之后再跑） */
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var NS = "http://www.w3.org/2000/svg";
  function $(id) { return document.getElementById(id); }
  function el(tag, attrs, parent) {
    var n = document.createElementNS(NS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }
  function n1(v) { return (Math.round(v * 10) / 10).toString(); }
  function lg(v) { return Math.log(v) / Math.LN10; }

  if (!$("gxStage")) return;

  /* ================= 手机上的图放大 ================= */
  (function () {
    var zoom = $("gxZoom"), inner = $("gxZoomInner");
    if (!zoom || !inner) return;
    Array.prototype.forEach.call(document.querySelectorAll(".gx-svgbox"), function (box) {
      box.style.cursor = "zoom-in";
      box.addEventListener("click", function () {
        if (window.innerWidth > 760) return;
        var svg = box.querySelector("svg");
        if (!svg) return;
        inner.textContent = "";
        inner.appendChild(svg.cloneNode(true));
        zoom.hidden = false;
        document.body.style.overflow = "hidden";
      });
    });
    function close() { zoom.hidden = true; document.body.style.overflow = ""; }
    zoom.addEventListener("click", function (e) {
      if (e.target === zoom || e.target.classList.contains("gx-zoom-x")) close();
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && !zoom.hidden) close();
    });
  })();

  /* ================= 分步揭示 ================= */
  (function () {
    var steps = document.querySelectorAll("#gxSteps .step");
    var ans = $("gxAns"), btn = $("gxNext"), cnt = $("gxCnt");
    if (!steps.length || !btn) return;
    var i = 1;
    function paint() { if (cnt) cnt.textContent = Math.min(i, steps.length) + " / " + steps.length; }
    steps[0].hidden = false;
    paint();
    btn.addEventListener("click", function () {
      if (i < steps.length) { steps[i].hidden = false; i++; }
      if (i >= steps.length) {
        if (ans) ans.hidden = false;
        btn.textContent = "已全部展开";
        btn.disabled = true;
      }
      paint();
    });
  })();

  /* ================= 互动：分辨率 → 可判读目标 ================= */
  (function () {
    var stage = $("gxStage"), gL = $("gxL"), gR = $("gxR");
    var sl = $("gxSl"), vP = $("gxVp"), vL = $("gxVl"), vS = $("gxVs"), vSn = $("gxVsn"), box = $("gxStBox");

    var WIDE = {
      vb: "0 0 880 440", FS: 1,
      sc: { x0: 40, y0: 100, x1: 400, y1: 280 },
      ch: { x0: 500, x1: 830, top: 90, gy: 300 },
      scT: 30, chT: 30
    };
    var NARROW = {
      vb: "0 0 360 540", FS: 1.05,
      sc: { x0: 16, y0: 90, x1: 344, y1: 250 },
      ch: { x0: 54, x1: 300, top: 336, gy: 476 },
      scT: 22, chT: 312
    };
    var L = WIDE, FS = 1, P = 10, dragging = false, G = {};

    var PMIN = 0.3, PMAX = 30, SMIN = 1, SMAX = 100, K = 3;

    function pOf(v) { return Math.pow(10, -0.5 + (v / 100) * 2); }
    function vOf(p) { return Math.round((lg(p) + 0.5) / 2 * 100); }
    function xP(p) { return L.ch.x0 + (lg(p) - lg(PMIN)) / (lg(PMAX) - lg(PMIN)) * (L.ch.x1 - L.ch.x0); }
    function yS(s) { return L.ch.gy - (lg(s) - lg(SMIN)) / (lg(SMAX) - lg(SMIN)) * (L.ch.gy - L.ch.top); }

    function bandOf(p) {
      if (p <= 0.5) return { n: "单栋房屋与车辆", st: "能分辨单栋房屋、车辆与田埂", c: "#2f8a5b" };
      if (p <= 2) return { n: "房屋群与街巷", st: "能识别房屋群、街巷与乡村道路", c: "#0b6580" };
      if (p <= 5) return { n: "街区与桥梁", st: "能识别街区轮廓、大型桥梁与主干道", c: "#0b6580" };
      if (p <= 10) return { n: "田块与道路", st: "能识别农田地块、宽路面与大型建筑", c: "#b8791f" };
      return { n: "大片地物", st: "只能识别水体、大片建成区与林地", c: "#b8402f" };
    }

    function tx(parent, x, y, s, col, anchor, size, weight, halo) {
      var o = { x: n1(x), y: n1(y), "font-size": (size || 10) * FS, fill: col,
                "text-anchor": anchor || "start", "font-weight": weight || 400 };
      if (halo) o["class"] = "halo";
      var t = el("text", o, parent);
      t.textContent = s;
      return t;
    }

    /* 场景里的目标：name / 尺寸 / 位置 */
    var OBJ = [
      { n: "汽车", s: 5, x: 120, y: 200, w: 5, h: 2.5, c: "#5a6472" },
      { n: "房屋", s: 8, x: 186, y: 170, w: 8, h: 8, c: "#b8402f" },
      { n: "道路宽", s: 6, x: 60, y: 186, w: 0, h: 0, c: "#cfd6dc" },
      { n: "田块", s: 50, x: 70, y: 120, w: 90, h: 50, c: "#e6ebdd" },
      { n: "水体", s: 100, x: 40, y: 224, w: 0, h: 0, c: "#cfe8f2" }
    ];

    function build() {
      gL.textContent = ""; gR.textContent = "";
      var S = L.sc, C = L.ch, i;

      /* ---------- 左：判读面板 ---------- */
      tx(gL, S.x0, L.scT, "同一片灾区：网格就是像元", "#151a21", "start", 10.5, 700);
      tx(gL, S.x0, L.scT + 15, "格子越粗，细节越糊", "#5a6472", "start", 9);

      el("rect", { x: n1(S.x0), y: n1(S.y0), width: n1(S.x1 - S.x0), height: n1(S.y1 - S.y0),
                   fill: "#eef1e8" }, gL);
      /* 场景（随框缩放） */
      G.scene = el("g", {}, gL);
      G.grid = el("g", {}, gL);

      /* ---------- 右：曲线 ---------- */
      tx(gR, C.x0, L.chT, "可判读最小目标 ≈ 3 倍像元", "#151a21", "start", 10.5, 700);
      tx(gR, C.x0, L.chT + 15, "两条轴都是对数刻度", "#5a6472", "start", 9);

      [1, 2, 5, 10, 20, 50, 100].forEach(function (s) {
        var y = yS(s);
        el("line", { x1: n1(C.x0), y1: n1(y), x2: n1(C.x1), y2: n1(y),
                     stroke: "#eef2f5", "stroke-width": 1 }, gR);
        tx(gR, C.x0 - 5, y + 3, String(s), "#9aa3ae", "end", 8);
      });
      [0.5, 1, 2, 5, 10, 30].forEach(function (p) {
        var x = xP(p);
        el("line", { x1: n1(x), y1: n1(C.top), x2: n1(x), y2: n1(C.gy),
                     stroke: "#f2f5f7", "stroke-width": 1 }, gR);
        tx(gR, x, C.gy + 15, String(p), "#9aa3ae", "middle", 8);
      });
      tx(gR, C.x1, C.gy + 29, "空间分辨率 m", "#9aa3ae", "end", 8);
      tx(gR, C.x1, C.top - 8, "目标尺寸 m", "#9aa3ae", "end", 8);
      el("line", { x1: n1(C.x0), y1: n1(C.gy), x2: n1(C.x1), y2: n1(C.gy), stroke: "#c9d3dc" }, gR);
      el("line", { x1: n1(C.x0), y1: n1(C.top), x2: n1(C.x0), y2: n1(C.gy), stroke: "#c9d3dc" }, gR);

      /* 不可判读区（目标小于 3p） */
      G.shade = el("path", { d: "", fill: "#fbeae7", opacity: 0.75 }, gR);
      /* 目标线 */
      [[5, "汽车 5 m"], [8, "房屋 8 m"], [50, "田块 50 m"]].forEach(function (o) {
        var y = yS(o[0]);
        el("line", { x1: n1(C.x0), y1: n1(y), x2: n1(C.x1), y2: n1(y),
                     stroke: "#b8791f", "stroke-width": 1, "stroke-dasharray": "5 4" }, gR);
        tx(gR, C.x1 - 4, y - 4, o[1], "#8a5c14", "end", 8.5, 700);
      });

      G.line = el("line", { stroke: "#b8402f", "stroke-width": 2.2,
                            x1: n1(xP(PMIN)), y1: n1(yS(PMIN * K)),
                            x2: n1(xP(PMAX)), y2: n1(yS(Math.min(SMAX, PMAX * K))) }, gR);
      G.cv = el("line", { y1: n1(C.top), y2: n1(C.gy), stroke: "#5a6472",
                          "stroke-width": 1.1, "stroke-dasharray": "5 4" }, gR);
      G.cd = el("circle", { r: 4.2, fill: "#b8402f", stroke: "#fff", "stroke-width": 1.3 }, gR);
      G.ct = tx(gR, 0, 0, "", "#8f3226", "start", 9, 700, true);
    }

    function drawScene() {
      var S = L.sc, g = G.scene;
      g.textContent = "";
      var sx = (S.x1 - S.x0) / 360, sy = (S.y1 - S.y0) / 180;
      function X(v) { return S.x0 + (v - 40) * sx; }
      function Y(v) { return S.y0 + (v - 100) * sy; }

      /* 田块 */
      el("rect", { x: n1(X(70)), y: n1(Y(120)), width: n1(90 * sx), height: n1(50 * sy),
                   fill: "#e6ebdd", stroke: "#cdd6c6", "stroke-width": 0.8 }, g);
      /* 林地/大片地物 */
      el("rect", { x: n1(X(300)), y: n1(Y(108)), width: n1(84 * sx), height: n1(52 * sy),
                   fill: "#dfe8d8", stroke: "#c8d4c0", "stroke-width": 0.8 }, g);
      /* 河流 */
      el("path", { d: "M " + n1(X(40)) + " " + n1(Y(244)) + " L " + n1(X(400)) + " " + n1(Y(224)) +
                      " L " + n1(X(400)) + " " + n1(Y(244)) + " L " + n1(X(40)) + " " + n1(Y(264)) + " Z",
                   fill: "#cfe8f2", stroke: "#a9d5e6", "stroke-width": 0.8 }, g);
      /* 道路 */
      el("line", { x1: n1(X(40)), y1: n1(Y(190)), x2: n1(X(400)), y2: n1(Y(150)),
                   stroke: "#cfd6dc", "stroke-width": Math.max(3, 6 * sx) }, g);
      /* 房屋 */
      [[150, 170], [180, 172], [210, 168], [150, 186], [210, 186]].forEach(function (h) {
        el("rect", { x: n1(X(h[0])), y: n1(Y(h[1])), width: n1(Math.max(2, 8 * sx)),
                     height: n1(Math.max(2, 8 * sy)), fill: "#f3f6f8",
                     stroke: "#b8402f", "stroke-width": 1 }, g);
      });
      /* 汽车 */
      [[120, 200], [126, 204]].forEach(function (c) {
        el("rect", { x: n1(X(c[0])), y: n1(Y(c[1])), width: n1(Math.max(2, 5 * sx)),
                     height: n1(Math.max(1.5, 2.5 * sy)), fill: "#5a6472" }, g);
      });

      /* 像元网格 */
      G.grid.textContent = "";
      if (P >= 3) {
        var step = P * sx, x, y;
        for (x = S.x0; x <= S.x1 + 0.5; x += step) {
          el("line", { x1: n1(x), y1: n1(S.y0), x2: n1(x), y2: n1(S.y1),
                       stroke: "#ffffff", "stroke-width": 0.7, opacity: 0.85 }, G.grid);
        }
        for (y = S.y0; y <= S.y1 + 0.5; y += step) {
          el("line", { x1: n1(S.x0), y1: n1(y), x2: n1(S.x1), y2: n1(y),
                       stroke: "#ffffff", "stroke-width": 0.7, opacity: 0.85 }, G.grid);
        }
        tx(g, S.x0 + 4, S.y1 - 5, "像元 " + n1(P) + " m", "#5a6472", "start", 8.5, 700, true);
      } else {
        tx(g, S.x0 + 4, S.y1 - 5, "像元 " + n1(P) + " m（细于 3 m 不画格）", "#5a6472", "start", 8.5, 700, true);
      }
      el("rect", { x: n1(S.x0), y: n1(S.y0), width: n1(S.x1 - S.x0), height: n1(S.y1 - S.y0),
                   fill: "none", stroke: "#cdd6c6" }, g);

      /* 图例 */
      var need = K * P, rows = OBJ, col, i;
      for (i = 0; i < rows.length; i++) {
        col = i < 3 ? 0 : 1;
        var yy = (L === WIDE ? 316 : 258) + (i % 3) * 20;
        var xx = (L === WIDE ? (col ? 240 : 40) : (col ? 190 : 4));
        var ok = rows[i].s >= need;
        tx(g, xx, yy, (ok ? "✓ " : "✗ ") + rows[i].n + " " + rows[i].s + " m",
           ok ? "#1e6640" : "#8f3226", "start", 9.5, 700);
      }
    }

    function render() {
      var C = L.ch, b = bandOf(P), need = K * P;
      drawScene();

      /* 曲线 */
      var x1 = xP(PMIN), y1 = yS(Math.max(SMIN, PMIN * K));
      var x2 = xP(PMAX), y2 = yS(Math.min(SMAX, PMAX * K));
      G.line.setAttribute("x1", n1(x1)); G.line.setAttribute("y1", n1(y1));
      G.line.setAttribute("x2", n1(x2)); G.line.setAttribute("y2", n1(y2));

      /* 不可判读区：目标尺寸 < 3p，即曲线以上 */
      G.shade.setAttribute("d", "M " + n1(x1) + " " + n1(y1) + " L " + n1(x2) + " " + n1(y2) +
                                " L " + n1(x2) + " " + n1(C.gy) + " L " + n1(x1) + " " + n1(C.gy) + " Z");

      var cx = xP(P), cy = yS(Math.max(SMIN, need));
      G.cv.setAttribute("x1", n1(cx));
      G.cv.setAttribute("x2", n1(cx));
      G.cd.setAttribute("cx", n1(cx));
      G.cd.setAttribute("cy", n1(cy));
      G.ct.setAttribute("x", n1(Math.min(cx + 7, C.x1 - 44)));
      G.ct.setAttribute("y", n1(cy - 8));
      G.ct.textContent = "3×" + n1(P) + " = " + n1(need) + " m";

      vP.textContent = n1(P) + " m";
      vL.textContent = n1(need) + " m";
      vS.textContent = b.n;
      vSn.textContent = b.st;
      if (box) {
        box.style.background = P > 10 ? "#fbeae7" : (P > 5 ? "#fdf3e0" : "#eef6fb");
        box.style.borderColor = b.c + "44";
        var kv = box.querySelector(".v");
        if (kv) kv.style.color = b.c;
      }
    }

    function applyLayout() {
      var w = stage.parentElement.getBoundingClientRect().width;
      L = w >= 690 ? WIDE : NARROW;
      FS = L.FS;
      stage.setAttribute("viewBox", L.vb);
      build();
      render();
    }

    function onSlide() {
      P = Math.min(PMAX, Math.max(PMIN, pOf(+sl.value)));
      /* 吸附到整齐的刻度附近，便于读数 */
      var nice = [0.3, 0.5, 0.75, 1, 1.5, 2, 3, 5, 8, 10, 15, 20, 25, 30];
      for (var i = 0; i < nice.length; i++) {
        if (Math.abs(P - nice[i]) / nice[i] < 0.05) { P = nice[i]; break; }
      }
      render();
    }
    sl.addEventListener("input", onSlide);
    $("gxP1").addEventListener("click", function () { sl.value = vOf(0.5); onSlide(); });
    $("gxP2").addEventListener("click", function () { sl.value = vOf(2); onSlide(); });
    $("gxP3").addEventListener("click", function () { sl.value = vOf(10); onSlide(); });
    $("gxP4").addEventListener("click", function () { sl.value = vOf(30); onSlide(); });

    function setFromX(clientX) {
      var bb = stage.getBoundingClientRect();
      var vbw = parseFloat(L.vb.split(" ")[2]);
      var xx = (clientX - bb.left) * (vbw / bb.width);
      var f = (xx - L.ch.x0) / (L.ch.x1 - L.ch.x0);
      sl.value = String(Math.max(0, Math.min(100, Math.round(f * 100))));
      onSlide();
    }
    stage.addEventListener("pointerdown", function (ev) {
      dragging = true;
      try { stage.setPointerCapture(ev.pointerId); } catch (e) {}
      setFromX(ev.clientX);
    });
    stage.addEventListener("pointermove", function (ev) {
      if (!dragging) return;
      ev.preventDefault();
      setFromX(ev.clientX);
    });
    ["pointerup", "pointercancel"].forEach(function (e) {
      stage.addEventListener(e, function () { dragging = false; });
    });
    window.addEventListener("blur", function () { dragging = false; });
    stage.addEventListener("keydown", function (ev) {
      if (ev.key === "ArrowLeft" || ev.key === "ArrowRight") {
        ev.preventDefault();
        sl.value = String(Math.max(0, Math.min(100, +sl.value + (ev.key === "ArrowRight" ? 4 : -4))));
        onSlide();
      }
    });

    var tmr = null;
    window.addEventListener("resize", function () {
      clearTimeout(tmr);
      tmr = setTimeout(applyLayout, 180);
    });

    sl.value = vOf(10);
    applyLayout();
    onSlide();
  })();
});

</script>
