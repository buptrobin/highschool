    V = Math.max(10, Math.min(200, V + (ev.key === "ArrowRight" ? 5 : -5)));
    $("gxSl").value = String(V);
    render();
  });
  var tmr = null;
  window.addEventListener("resize", function () {
    clearTimeout(tmr); tmr = setTimeout(applyLayout, 180);
  });
  applyLayout();
});
</script>
