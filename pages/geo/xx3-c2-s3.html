    var total = area * yieldKg / 1000;
    var rate = total / DEMAND * 100;

    var gap = total - DEMAND, gapTxt;

    $("gxStBox").style.background = bg;

  function applyLayout() {

  $("gxArea").addEventListener("input", function () { area = +this.value; render(); });
  $("gxYield").addEventListener("input", function () { yieldKg = +this.value; render(); });

  });

  var timer = null;

    clearTimeout(timer); timer = setTimeout(applyLayout, 180);
  });
  applyLayout();

  var steps = $("gxSteps"), ans = $("exAns"), cnt = $("exCnt"), next = $("exNext");

    next.addEventListener("click", function () {
      if (shown >= all.length) return;
      all[shown].hidden = false;
      shown++;
      cnt.textContent = shown + " / " + all.length;
      if (shown === all.length) {

        next.textContent = "已到末步";
        next.disabled = true;
        next.setAttribute("aria-disabled", "true");
      }
    });
