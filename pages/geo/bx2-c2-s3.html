<p class="gx-lede">这一节考两件事：地域文化<b>是什么</b>，以及它怎么体现在<b>建筑、空间格局、土地利用</b>上。
最容易丢分的是把“景观”说成“自然景观”、把“保护传统村落”答成“不许动”。
答民居题永远走两条线：<b>自然环境给材料和限制，地域文化给做法和意义</b>。</p>

<!-- ================= A ================= -->
<section class="gx-sec" id="a">
  <h2><span class="sn">01</span>课本怎么说</h2>
  <p class="gx-h2s">先背标准表述，再看解释。顺序反了，答题时就写不出术语。</p>

  <div class="gx-quote">
    <p class="q-t">课本要点 · 地域文化<span class="q-src">人教版（2019）必修第二册 · 第二章第三节</span></p>
    <p class="q-b">地域文化是指在一定地域范围内，人们在长期的生产生活中形成的、具有地方特色的文化。</p>
    <p class="q-n">→ 三个关键词：<b>一定地域</b>（有范围）、<b>长期</b>（不是一天形成的）、<b>地方特色</b>（和别处不一样）。
    所以地域文化<b>不等于民族文化</b>：同一片地域里可以有多个民族，同一个民族分布在不同地域也会形成不同的地域文化。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本要点 · 城乡景观<span class="q-src">人教版（2019）必修第二册 · 第二章第三节</span></p>
    <p class="q-b">城乡景观是城乡地区自然景观与人文景观的综合体，包括聚落、建筑、道路、田野等。</p>
    <p class="q-n">→ 一句话：景观 = <b>自然那一层 + 人文那一层</b>，两层叠在一起才叫“景观”。
    所以“景观”<b>不是自然景观</b>；看到一座村子，既要看到山、水、田，也要看到房子怎么盖、路怎么走。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本要点 · 地域文化的三个体现<span class="q-src">人教版（2019）必修第二册 · 第二章第三节</span></p>
    <p class="q-b">地域文化在城乡景观上主要体现在建筑、空间格局和土地利用三个方面。</p>
    <p class="q-n">→ <b>三个层面，答题先分层</b>：<b>建筑</b>（形态、材料、朝向）、
    <b>空间格局</b>（街巷走向、村落布局、城市轴线）、<b>土地利用</b>（农田、水域、牧场怎么分）。
    题目问“体现在哪些方面”，就按这三层各写一句，比堆形容词有效得多。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本要点 · 民居案例<span class="q-src">人教版（2019）必修第二册 · 第二章第三节</span></p>
    <p class="q-b">北京四合院、福建土楼、云南傣族竹楼、陕北窑洞等民居，都体现了当地的自然环境和地域文化。</p>
    <p class="q-n">→ 这句话是民居题的<b>总纲</b>：每个案例都要拆成“<b>自然环境</b>”和“<b>地域文化</b>”两条线，
    再落到“<b>建筑做法</b>”上。只写“因为当地气候湿润”是一半答案，补上“因为当地有干栏式居住传统”才完整。</p>
  </div>

  <p class="gx-h2s" style="margin-top:18px">四种民居，两条线对一遍：</p>
  <div style="overflow-x:auto">
  <table class="gx-cmp">
    <thead><tr><th>民居</th><th>自然环境</th><th>地域文化</th><th>关键做法</th></tr></thead>
    <tbody>
      <tr><td>北京四合院</td><td>华北平原，冬季寒冷、多风沙</td><td>宗族礼制、合院居住传统</td><td>围合、坐北朝南、外墙厚</td></tr>
      <tr><td>福建土楼</td><td>闽西山区，多雨、地形起伏</td><td>客家宗族聚居、防御需求</td><td>夯土厚墙、内向开窗、圆形</td></tr>
      <tr class="key"><td>傣族竹楼</td><td><b>热带季风，湿热多雨</b></td><td><b>稻作农业、干栏式传统</b></td><td><b>架空、陡屋顶、开窗大</b></td></tr>
      <tr><td>陕北窑洞</td><td>黄土高原，干旱少雨、黄土深厚</td><td>节俭、穴居传统</td><td>靠崖挖洞、拱形、冬暖夏凉</td></tr>
    </tbody>
  </table>
  </div>
  <p class="gx-note">高亮这一行是下面例题要用的案例。注意四行的<b>结构完全一样</b>：
  “什么自然条件 → 什么文化传统 → 什么建筑做法”。答题时照这个三段式写，就不会漏线。</p>
</section>
