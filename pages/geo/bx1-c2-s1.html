<div class="gx-kicker">ELI5-HIGH · 讲给要考试的人</div>
<p class="gx-claim">大气不是"一层空气"，而是<b>三层脾气完全不同的壳</b>——只看一件事：温度往上走是升还是降。</p>
<div class="gx-meta">
  <span><i></i>人教版必修第一册 第二章第一节</span>
  <span><i></i>高一 · 地球上的大气</span>
  <span><i></i>阅读 12 分钟</span>
  <span><i></i>含 1 个互动模型</span>
</div>
<p class="gx-lede">这一节有两块：<b>大气由什么组成</b>（干洁空气 + 水汽 + 杂质）、<b>大气分几层</b>（对流层、平流层、高层大气）。
分层那块的判据只有一条：<b>温度随高度是升还是降</b>。升就是稳定层，降就是对流层。
抓住这一条，三层的特点全是推出来的，不用背。</p>

<!-- ================= A ================= -->
<section class="gx-sec" id="a">
  <h2><span class="sn">01</span>课本怎么说</h2>
  <p class="gx-h2s">先背标准表述，再看解释。顺序反了，答题时就写不出术语。</p>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 大气的组成<span class="q-src">人教版（2019）必修第一册 · 第二章第一节</span></p>
    <p class="q-b">大气是由干洁空气、水汽和杂质组成的。干洁空气的主要成分是氮气和氧气，其中氮气约占 78%，氧气约占 21%。二氧化碳、臭氧等含量很少，但作用重要。</p>
    <p class="q-n">→ 三段式记法：<b>① 干洁空气</b>（氮 78%、氧 21%、其他 1%）、<b>② 水汽</b>、<b>③ 杂质</b>。
    注意"<b>含量少</b>"和"<b>作用重要</b>"经常同时出现在答案里——CO₂ 和臭氧都不到 1%，
    但一个是保温主力，一个是生命的保护伞。<b>比例小 ≠ 作用小</b>，这是这一节的第一个考点。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 分层依据与三层<span class="q-src">人教版（2019）必修第一册 · 第二章第一节</span></p>
    <p class="q-b">依据温度、密度和大气运动状况在垂直方向上的差异，将大气自下而上依次划分为对流层、平流层和高层大气。</p>
    <p class="q-n">→ 分层的依据是<b>三个量</b>：温度、密度、运动状况。<b>但实操时只看温度</b>——
    因为温度决定运动（上冷下热就会对流），运动决定其他特点。
    所以三层的特点不是三条要背的话，而是<b>由"温度怎么变"推出来的一条链</b>。</p>
  </div>

  <p class="gx-note">对流层那一段的四个特征必须能默写：<b>①气温随高度增加而降低</b>（每升高 100 m 降约 0.6 ℃）、
  <b>②对流运动旺盛</b>、<b>③集中了大气质量的 3/4 和几乎全部水汽、杂质</b>、<b>④天气现象复杂多变，与人类关系最密切</b>。</p>

  <p class="gx-h2s" style="margin-top:18px">三层对比，一张表看完（"温度怎么变"是判据，"为什么"是得分点）：</p>
  <div style="overflow-x:auto">
  <table class="gx-cmp">
    <thead><tr><th>层次</th><th>温度怎么变</th><th>为什么</th><th>与人类关系</th></tr></thead>
    <tbody>
      <tr class="key"><td>对流层</td><td><b>随高度升高而降低</b>（每 100 m 约 −0.6 ℃）</td><td><b>地面是它的直接热源</b>，离地面越远获取热量越少</td><td>天气现象都发生在这里；人类生活在其底部</td></tr>
      <tr><td>平流层</td><td><b>随高度升高而升高</b></td><td><b>臭氧层吸收太阳紫外线</b>而增温</td><td>大气平稳、天气晴朗，<b>适合飞机高空飞行</b></td></tr>
      <tr><td>高层大气</td><td>先降低，后升高</td><td>底层无臭氧吸热故降温，再往上吸收更短波长的紫外线而升温</td><td>有<b>电离层</b>，能反射无线电波</td></tr>
    </tbody>
  </table>
  </div>
  <p class="gx-note">"<b>温度随高度递减</b>"这句话<b>只适用于对流层</b>。平流层正好相反——
  这是本节最高频的陷阱：题里出现"大气温度随高度增加而降低"，必须先问"说的是哪一层"。</p>
</section>

<section class="gx-sec" id="b">
  <h2><span class="sn">02</span>拆开看</h2>
  <p class="gx-h2s">四张图：大气由什么组成、三层怎么分、对流层为什么忽厚忽薄、人类把大气改成了什么样。</p>

  <!-- 图1 组成 -->
  <figure class="gx-fig">
    <div class="fig-cap">
      <span class="fig-no">图 1</span><span class="fig-t">大气的组成：两成是氧，四成是"零头"</span>

    <p class="fig-s">干洁空气里<b>氮和氧合起来占 99%</b>，剩下 1% 是氩、二氧化碳、臭氧等。

      <tr><td>飞机巡航在哪层</td><td>平流层</td><td>平稳 + 晴朗</td></tr>
      <tr><td>臭氧层位置</td><td>平流层 22–27 km</td><td>不在对流层</td></tr>

<script>
/* 大气的组成和垂直分层 · 讲义交互（等 page.js 把 #md 渲染成正文之后再跑） */
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var NS = "http://www.w3.org/2000/svg";
  function $(id) { return document.getElementById(id); }
  function el(tag, attrs, parent) {
    var n = document.createElementNS(NS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }
  function n1(v) { return (Math.round(v * 10) / 10).toString(); }

  if (!$("gxStage")) return;

  /* ================= 手机的图放大 ================= */
  (function () {
    var zoom = $("gxZoom"), inner = $("gxZoomInner");
    if (!zoom || !inner) return;
    Array.prototype.forEach.call(document.querySelectorAll(".gx-svgbox"), function (box) {
      box.style.cursor = "zoom-in";
      box.addEventListener("click", function () {
        if (window.innerWidth > 760) return;
        var svg = box.querySelector("svg");
        if (!svg) return;
        inner.textContent = "";
        inner.appendChild(svg.cloneNode(true));
        zoom.hidden = false;
        document.body.style.overflow = "hidden";
      });
    });
    function close() { zoom.hidden = true; document.body.style.overflow = ""; }
    zoom.addEventListener("click", function (e) {
      if (e.target === zoom || e.target.classList.contains("gx-zoom-x")) close();
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && !zoom.hidden) close();
    });
  })();

  /* ================= 分步揭示 ================= */
  (function () {
    var steps = document.querySelectorAll("#gxSteps .step");
    var ans = $("gxAns"), btn = $("gxNext"), cnt = $("gxCnt");
    if (!steps.length || !btn) return;
    var i = 1;
    function paint() { if (cnt) cnt.textContent = Math.min(i, steps.length) + " / " + steps.length; }
    steps[0].hidden = false;
    paint();
    btn.addEventListener("click", function () {
      if (i < steps.length) { steps[i].hidden = false; i++; }
      if (i >= steps.length) {
        if (ans) ans.hidden = false;
        btn.textContent = "已全部展开";
        btn.disabled = true;
      }
      paint();
    });
  })();

  /* ================= 互动：探空气球 ================= */
  (function () {
    var stage = $("gxStage"), gCol = $("gxCol"), gInfo = $("gxInfo");
    var sl = $("gxSl"), vH = $("gxVh"), vT = $("gxVt"), vS = $("gxVs"), vSn = $("gxVsn"), box = $("gxStBox");

    var WIDE = {
      vb: "0 0 880 430", FS: 1,
      col: { x: 56, w: 216, gy: 388, ty: 48, s1: 190, s2: 90, s3: 60, cx: 164 },
      info: { x: 340, w: 500, barY: 104, barH: 28, barX: 356, barW: 462, tx: 356 },
      bp: 620
    };
    var NARROW = {
      vb: "0 0 360 600", FS: 1.0,
      col: { x: 16, w: 132, gy: 520, ty: 76, s1: 220, s2: 130, s3: 90, cx: 82 },
      info: { x: 168, w: 184, barY: 130, barH: 22, barX: 172, barW: 172, tx: 172 },
      bp: 620
    };
    var L = WIDE, FS = 1, H = 0, dragging = false, R = {};

    /* ---- 高度 → 屏幕 y（分段非线性） ---- */
    function h2y(h) {
      var C = L.col;
      if (h <= 12) return C.gy - h / 12 * C.s1;
      if (h <= 50) return C.gy - C.s1 - (h - 12) / 38 * C.s2;
      return C.gy - C.s1 - C.s2 - (h - 50) / 50 * C.s3;
    }
    /* ---- 标准大气温度（分段近似） ---- */
    function tempAt(h) {
      if (h <= 12) return 15 - 6.5 * h;
      if (h <= 20) return -63;
      if (h <= 50) return -63 + (h - 20) * 2.1;
      if (h <= 85) return -(h - 50) * 2.5714;
      return -90 + (h - 85) * 8;
    }
    function layerOf(h) {
      if (h < 12) return 0;
      if (h < 50) return 1;
      return 2;
    }
    var LAY = [
      { name: "对流层", col: "#b8791f", soft: "#fdf6ea", line: "#f0dcb4",
        sn: "天气现象都发生在这一层",
        wide: ["空气对流旺盛，上下翻腾", "集中了大气质量的 3/4 和几乎全部水汽、杂质",
               "云、雨、雪、雾都发生在这里", "气温随高度升高而降低（每 100 m 约 −0.6 ℃）"],
        narrow: ["对流旺盛", "云雨都在这层", "气温随高度降低"] },
      { name: "平流层", col: "#0b6580", soft: "#eef6fb", line: "#cfe0ec",
        sn: "大气平稳，适合飞机巡航",
        wide: ["以平流运动为主，大气平稳", "水汽、杂质极少，天气晴朗、能见度好",
               "22–27 km 处有臭氧层，吸收紫外线", "适合飞机高空飞行"],
        narrow: ["气流平稳", "天气晴朗", "臭氧层吸收紫外线"] },
      { name: "高层大气", col: "#5a6472", soft: "#f6f8fa", line: "#dde4ea",
        sn: "空气稀薄，含电离层",
        wide: ["空气极其稀薄，气压很低", "有若干电离层，能反射无线电波",
               "流星在 80–120 km 高度燃烧", "温度先降低、后升高"],
        narrow: ["空气极稀薄", "电离层反射无线电波", "温度先降后升"] }
    ];

    function tx(parent, x, y, s, col, anchor, size, weight, halo) {
      var o = { x: n1(x), y: n1(y), "font-size": (size || 10.5) * FS, fill: col,
                "text-anchor": anchor || "start", "font-weight": weight || 400 };
      if (halo) o["class"] = "halo";
      var t = el("text", o, parent);
      t.textContent = s;
      return t;
    }

    function build() {
      gCol.textContent = ""; gInfo.textContent = "";
      var C = L.col, I = L.info;

      /* ---------- 左：垂直柱 ---------- */
      tx(gCol, C.x - 8, 34, "垂直剖面（纵轴非等距）", "#5a6472", "start", 10);

      /* 三层色带 */
      var bands = [
        { y0: C.ty, y1: h2y(50), fill: "#f6f8fa", name: "高层大气", sub: "50 km 以上" },
        { y0: h2y(50), y1: h2y(12), fill: "#eef6fb", name: "平流层", sub: "12–50 km" },
        { y0: h2y(12), y1: C.gy, fill: "#fdf6ea", name: "对流层", sub: "0–12 km" }
      ];
      bands.forEach(function (b) {
        el("rect", { x: C.x, y: n1(b.y0), width: C.w, height: n1(b.y1 - b.y0),
                     fill: b.fill, stroke: "#e6e9ee", "stroke-width": 1 }, gCol);
      });

      /* 臭氧层高亮 */
      var oy0 = h2y(27), oy1 = h2y(22);
      el("rect", { x: C.x + 3, y: n1(oy0), width: C.w - 6, height: n1(oy1 - oy0),
                   fill: "#bfe0cd", opacity: 0.85 }, gCol);
      tx(gCol, C.x + C.w - 6, n1(oy0 + (oy1 - oy0) / 2 + 3), "臭氧层", "#1e6640", "end", 8.5, 700);

      /* 层名 */
      tx(gCol, C.x + 8, n1(h2y(6)), "对流层", "#8a5c14", "start", 11, 700);
      tx(gCol, C.x + 8, n1(h2y(31)), "平流层", "#0b6580", "start", 11, 700);
      tx(gCol, C.x + 8, n1(h2y(75)), "高层大气", "#5a6472", "start", 11, 700);

      /* 地面 */
      el("line", { x1: C.x - 6, y1: C.gy, x2: C.x + C.w + 6, y2: C.gy,
                   stroke: "#8a8272", "stroke-width": 2.4 }, gCol);
      tx(gCol, C.x + C.w / 2, C.gy + 15, "地面", "#5a6472", "middle", 9.5);

      /* 高度刻度 */
      [0, 12, 50, 100].forEach(function (h) {
        var yy = h2y(h);
        el("line", { x1: C.x, y1: n1(yy), x2: C.x + C.w, y2: n1(yy),
                     stroke: "#dde4ea", "stroke-width": 1, "stroke-dasharray": "4 3" }, gCol);
        tx(gCol, C.x - 4, n1(yy + 3), h + "", "#9aa3ae", "end", 8.5);
      });

      /* 气球 */
      R.balloon = el("g", {}, gCol);
      el("circle", { cx: C.cx, cy: 0, r: 9, fill: "#fff", stroke: "#b8402f", "stroke-width": 2.2 }, R.balloon);
      el("path", { d: "M " + C.cx + " 9 L " + C.cx + " 15", stroke: "#b8402f", "stroke-width": 1.4 }, R.balloon);
      el("rect", { x: C.cx - 4, y: 15, width: 8, height: 6, rx: 1.5,
                   fill: "#b8791f", stroke: "#8a5c14", "stroke-width": 0.8 }, R.balloon);
      R.hline = el("line", { stroke: "#b8402f", "stroke-width": 1,
                             "stroke-dasharray": "4 4", opacity: 0.7 }, gCol);

      /* ---------- 右：信息面板 ---------- */
      tx(gInfo, I.x, 34, "此刻在这里会发生什么", "#151a21", "start", 11.5, 700);

      /* 层次徽标 */
      R.badge = el("rect", { x: I.x, y: 44, width: 96, height: 24, rx: 12,
                             fill: "#eef6fb", stroke: "#cfe0ec" }, gInfo);
      R.badgeT = tx(gInfo, I.x + 48, 60, "", "#0b6580", "middle", 10.5, 700);

      /* 温度条 */
      el("rect", { x: I.barX, y: I.barY, width: I.barW, height: I.barH, rx: 4,
                   fill: "#f2f4f6", stroke: "#e6e9ee" }, gInfo);
      /* 冷暖渐变 */
      var defs = el("defs", {}, gInfo);
      var lg = el("linearGradient", { id: "gxTg", x1: "0", y1: "0", x2: "1", y2: "0" }, defs);
      el("stop", { offset: "0%", "stop-color": "#7fa9c9" }, lg);
      el("stop", { offset: "55%", "stop-color": "#cfe4ee" }, lg);
      el("stop", { offset: "100%", "stop-color": "#f6d7c8" }, lg);
      el("rect", { x: I.barX, y: I.barY, width: I.barW, height: I.barH, rx: 4,
                   fill: "url(#gxTg)" }, gInfo);
      el("rect", { x: I.barX, y: I.barY, width: I.barW, height: I.barH, rx: 4,
                   fill: "none", stroke: "#dde4ea" }, gInfo);

      [-100, -50, 0, 40].forEach(function (t) {
        var xx = xT(t);
        el("line", { x1: n1(xx), y1: I.barY + I.barH, x2: n1(xx), y2: I.barY + I.barH + 5,
                     stroke: "#c9c2b0", "stroke-width": 1 }, gInfo);
        tx(gInfo, xx, I.barY + I.barH + 17, t + "", "#9aa3ae", "middle", 8.5);
      });
      tx(gInfo, I.barX + I.barW, I.barY - 8, "气温 ℃", "#9aa3ae", "end", 9);

      R.cur = el("path", { fill: "#b8402f" }, gInfo);
      R.curLine = el("line", { stroke: "#b8402f", "stroke-width": 1.6 }, gInfo);
      R.curT = tx(gInfo, 0, 0, "", "#b8402f", "middle", 11, 700, true);

      /* 要点 */
      R.bullet = [];
      for (var i = 0; i < 4; i++) {
        R.bullet.push(tx(gInfo, I.tx, 0, "", "#3a3a35", "start", 10.5));
      }
    }

    function xT(t) {
      var I = L.info;
      return I.barX + (Math.max(-100, Math.min(40, t)) + 100) / 140 * I.barW;
    }

    function render() {
      var C = L.col, I = L.info;
      var T = tempAt(H), li = layerOf(H), lay = LAY[li];
      var y = h2y(H);

      /* 气球 */
      R.balloon.setAttribute("transform", "translate(0," + n1(y - h2y(0)) + ")");
      R.hline.setAttribute("x1", n1(C.cx + 14));
      R.hline.setAttribute("y1", n1(y));
      R.hline.setAttribute("x2", n1(I.x - 8));
      R.hline.setAttribute("y2", n1(y));

      /* 徽标 */
      R.badge.setAttribute("fill", lay.soft);
      R.badge.setAttribute("stroke", lay.line);
      R.badge.setAttribute("width", li === 2 ? 78 : 62);
      R.badgeT.textContent = lay.name;
      R.badgeT.setAttribute("x", I.x + (li === 2 ? 39 : 31));
      R.badgeT.setAttribute("fill", lay.col);

      /* 温度游标 */
      var cx = xT(T);
      R.curLine.setAttribute("x1", n1(cx)); R.curLine.setAttribute("x2", n1(cx));
      R.curLine.setAttribute("y1", I.barY - 2);
      R.curLine.setAttribute("y2", I.barY + I.barH + 2);
      R.cur.setAttribute("d", "M " + n1(cx) + " " + n1(I.barY - 2) + " l -6 -9 l 12 0 z");
      R.curT.setAttribute("x", n1(Math.max(I.barX + 22, Math.min(I.barX + I.barW - 22, cx))));
      R.curT.setAttribute("y", n1(I.barY - 14));
      R.curT.textContent = (T >= 0 ? "+" : "") + T.toFixed(0) + " ℃";

      /* 要点 */
      var lines = (L === WIDE) ? lay.wide : lay.narrow;
      for (var i = 0; i < 4; i++) {
        if (i < lines.length) {
          R.bullet[i].setAttribute("x", I.tx);
          R.bullet[i].setAttribute("y", n1((L === WIDE ? 186 : 196) + i * 26));
          R.bullet[i].textContent = "· " + lines[i];
          R.bullet[i].setAttribute("fill", "#3a3a35");
        } else {
          R.bullet[i].textContent = "";
        }
      }

      /* 数值卡 */
      vH.textContent = H + " km";
      vT.textContent = (T >= 0 ? "+" : "") + T.toFixed(0) + " ℃";

      var name = lay.name, sn = lay.sn, cc = lay.col, bg = lay.soft;
      if (H === 12) { name = "对流层顶"; sn = "对流层与平流层的分界"; }
      if (H === 50) { name = "平流层顶"; sn = "平流层与高层大气的分界"; }
      vS.textContent = name; vSn.textContent = sn;
      vS.style.color = cc;
      box.style.background = bg;
      box.style.borderColor = cc + "44";
      if (sl.value !== String(H)) sl.value = H;
    }

    function applyLayout() {
      var w = stage.parentElement.getBoundingClientRect().width;
      L = w >= WIDE.bp ? WIDE : NARROW;
      FS = L.FS;
      stage.setAttribute("viewBox", L.vb);
      build();
      render();
    }

    sl.addEventListener("input", function () { H = +this.value; render(); });
    $("gxP1").addEventListener("click", function () { H = 0; render(); });
    $("gxP2").addEventListener("click", function () { H = 12; render(); });
    $("gxP3").addEventListener("click", function () { H = 25; render(); });
    $("gxP4").addEventListener("click", function () { H = 90; render(); });

    function setFromY(clientY) {
      var bb = stage.getBoundingClientRect();
      var vbh = parseFloat(L.vb.split(" ")[3]);
      var yy = (clientY - bb.top) * (vbh / bb.height);
      /* 反解高度（分段） */
      var C = L.col, hh;
      if (yy >= C.gy - C.s1) {
        hh = (C.gy - yy) / C.s1 * 12;
      } else if (yy >= C.gy - C.s1 - C.s2) {
        hh = 12 + (C.gy - C.s1 - yy) / C.s2 * 38;
      } else {
        hh = 50 + (C.gy - C.s1 - C.s2 - yy) / C.s3 * 50;
      }
      H = Math.max(0, Math.min(100, Math.round(hh)));
      render();
    }
    stage.addEventListener("pointerdown", function (ev) {
      dragging = true;
      try { stage.setPointerCapture(ev.pointerId); } catch (e) {}
      setFromY(ev.clientY);
    });
    stage.addEventListener("pointermove", function (ev) {
      if (!dragging) return;
      ev.preventDefault();
      setFromY(ev.clientY);
    });
    ["pointerup", "pointercancel"].forEach(function (e) {
      stage.addEventListener(e, function () { dragging = false; });
    });
    window.addEventListener("blur", function () { dragging = false; });

    var tmr = null;
    window.addEventListener("resize", function () {
      clearTimeout(tmr);
      tmr = setTimeout(applyLayout, 180);
    });

    applyLayout();
  })();
});
