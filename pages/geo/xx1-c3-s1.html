<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再看解释。</p>

<div class="gx-quote">
<p class="q-t">课本原话 · 锋与天气<span class="q-src">人教版（2019）选择性必修1 · 第三章第一节</span></p>
<p class="q-b">冷气团主动向暖气团移动的锋叫冷锋。冷锋过境时，常出现阴天、刮风、雨雪、降温等天气现象；过境后，冷气团替代了原来暖气团的位置，气温降低，气压升高，天气转晴。暖气团主动向冷气团移动的锋叫暖锋。暖锋过境时，常出现连续性降水；过境后，暖气团替代了原来冷气团的位置，气温升高，气压降低，天气转晴。冷、暖气团势力相当，锋面移动缓慢，或较长时间在一个地区徘徊，这种锋叫准静止锋。</p>
<p class="q-n">→ 抓三件事：谁主动、雨区落在哪一侧、过境后气温与气压怎么变。</p>
</div>

<div class="gx-quote">
<p class="q-t">课本原话 · 气旋与反气旋<span class="q-src">同上</span></p>
<p class="q-b">气旋是中心气压低、四周气压高的大气水平涡旋，中心气流上升，多阴雨天气；反气旋是中心气压高、四周气压低的大气水平涡旋，中心气流下沉，多晴朗天气。</p>
<p class="q-n">→ 先看中心气压高低，再看垂直气流方向，阴晴随之确定。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>冷锋</th><th>暖锋</th><th>准静止锋</th></tr></thead>
<tbody>
<tr><td>主动气团</td><td>冷气团主动</td><td>暖气团主动</td><td>势力相当</td></tr>
<tr class="key"><td>雨区位置</td><td>锋后，冷气团一侧</td><td>锋前，冷气团一侧</td><td>锋面附近，历时较长</td></tr>
<tr><td>过境时</td><td>大风、降温、雨雪</td><td>连续性降水</td><td>连续性阴雨</td></tr>
<tr><td>过境后</td><td>气温降、气压升、转晴</td><td>气温升、气压降、转晴</td><td>雨带少动，阴雨持续</td></tr>
<tr><td>我国实例</td><td>北方夏季暴雨、寒潮、沙尘暴</td><td>东北、江淮春季连续性降水</td><td>江淮梅雨（6月中—7月上）、昆明准静止锋（冬半年）</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">最易背错的是雨区：雨区始终在冷气团一侧。冷锋冷气团在锋后，暖锋冷气团在锋前，雨区方向相反。</p>
</section>

<p class="a">降水由暖气团抬升凝结形成，雨滴落到下方冷气团一侧；冷锋的冷气团在锋后，暖锋的冷气团在锋前，所以雨区位置相反。</p>

    if (A < -2) { pname = "锋前暖区"; pcol = "#b06a12"; pbg = "#fdf3e3"; psub = "冷气团尚未到达"; }
    else if (A <= 3) { pname = "过境中"; pcol = "#b8402f"; pbg = "#fbeae7"; psub = "锋面正在过境"; }
    else { pname = "锋后冷区"; pcol = "#1f5f8b"; pbg = "#e8f4fb"; psub = "冷气团控制，转晴"; }
    $("gxVa").textContent = (A >= 0 ? "+" : "−") + Math.abs(A) + " h";
    $("gxVb").textContent = temp.toFixed(1) + " ℃";
    $("gxVc").textContent = pres.toFixed(0) + " hPa";
    $("gxVd").textContent = rain.toFixed(1) + " mm/h";
    $("gxVs").textContent = pname;
    $("gxVsn").textContent = psub;
    $("gxStBox").style.background = pbg;
    $("gxStBox").style.borderColor = pcol + "44";
    $("gxVs").style.color = pcol;
    $("gxSl").value = String(A);
  }

  function applyLayout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? W : N;
    stage.setAttribute("viewBox", L.vb);
    draw();
  }

  $("gxSl").addEventListener("input", function () { A = +this.value; draw(); });
  $("gxP1").addEventListener("click", function () { A = -12; draw(); });
  $("gxP2").addEventListener("click", function () { A = 0; draw(); });
  $("gxP3").addEventListener("click", function () { A = 8; draw(); });
  stage.addEventListener("keydown", function (ev) {
    if (ev.key === "ArrowLeft" || ev.key === "ArrowRight") {
      ev.preventDefault();
      A = Math.max(-24, Math.min(24, A + (ev.key === "ArrowRight" ? 1 : -1)));
      draw();
    }
  });
  var tmr = null;
  window.addEventListener("resize", function () {
    clearTimeout(tmr);
    tmr = setTimeout(applyLayout, 180);
  });
  applyLayout();
});
