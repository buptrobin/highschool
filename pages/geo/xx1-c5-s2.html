      <li class="step"><p class="s-h">第 1 步 · 先读基带</p><p class="s-b">基带是常绿阔叶林，对应亚热带季风气候，分布在大陆东岸 25°–35° 一带。基带一定，纬度范围就定了。</p><p class="s-k">用到：基带与当地水平自然带一致</p></li>

      <li class="step" hidden><p class="s-h">第 3 步 · 说成因</p><p class="s-b">海拔升高，气温按每 1000 m 约 6℃ 递减，降水先增后减，水热组合改变，自然带自下而上更替，形成垂直带谱。</p><p class="s-k">用到：垂直地带性以水热随海拔变化为基础</p></li>
      <li class="step" hidden><p class="s-h">第 4 步 · 比雪线</p><p class="s-b">阳坡太阳辐射强、气温高，积雪消融快，雪线位置高；阴坡气温低，雪线位置低。若阳坡同时是迎风坡，降水多会压低雪线，此时要看哪个因素占主导。</p><p class="s-k">用到：雪线高低由气温与降水共同决定</p></li>

    <div class="ans" id="gxAns" hidden>

      <p class="ans-b">（1）25°–35°N 大陆东岸，亚热带季风气候。<br>（2）随海拔升高，气温降低、降水变化，水热组合随之改变，自然带自下而上更替，形成垂直带谱；基带与当地水平自然带一致。<br>（3）阳坡雪线高于阴坡。阳坡太阳辐射强、气温高，积雪融化快，雪线位置高；阴坡气温低，雪线位置低。（若阳坡为迎风坡，降水多，雪线可能低于阴坡。）</p>
    </div>
  </div>
</section>

<section class="gx-sec" id="e">
  <h2><span class="sn">05</span>会怎么考</h2>
  <p class="gx-h2s">五问，都是同一套判断。</p>
  <div class="gx-qa">
    <div class="qac">
      <p class="q">「纬度地带性和干湿度地带性，分别以什么为基础？」</p>
      <p class="a">前者热量、后者水分；热量沿南北变，水分沿东西变。</p>
      <svg viewBox="0 0 240 132" role="img" aria-label="纬度对应热量、经度对应水分">
        <rect x="14" y="14" width="212" height="104" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
        <rect x="26" y="30" width="88" height="70" rx="6" fill="#eef6fb" stroke="#b8d8e8"/>
        <text x="70" y="56" text-anchor="middle" font-size="9" fill="#0b6580">纬度</text>
        <text x="70" y="72" text-anchor="middle" font-size="10" font-weight="700" fill="#0b6580">热量</text>
        <rect x="126" y="30" width="88" height="70" rx="6" fill="#f1f7ec" stroke="#c9dcc0"/>
        <text x="170" y="56" text-anchor="middle" font-size="9" fill="#3f6f52">经度</text>
        <text x="170" y="72" text-anchor="middle" font-size="10" font-weight="700" fill="#3f6f52">水分</text>
      </svg>
    </div>
    <div class="qac">
      <p class="q">「基带为什么必须和当地水平自然带一致？」</p>
      <p class="a">山麓海拔接近当地地面，水热条件就是当地的水平条件，所以基带即当地水平带。基带读错，整条带谱都错。</p>
      <svg viewBox="0 0 240 132" role="img" aria-label="山麓基带与当地水平自然带一致">
        <rect x="14" y="14" width="212" height="104" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
        <polygon points="120,26 196,100 44,100" fill="#eef3f0" stroke="#9fb3aa"/>
        <polygon points="88,100 152,100 139,68 101,68" fill="#5d8f5f"/>
        <text x="120" y="114" text-anchor="middle" font-size="8" fill="#1e6640">基带 = 当地水平自然带</text>
      </svg>
    </div>
    <div class="qac">
      <p class="q">「雪线是阳坡高还是阴坡高？」</p>
      <p class="a">阳坡高。阳坡太阳辐射强、气温高，积雪消融快，常年积雪的下界被抬高；阴坡相反。</p>
      <svg viewBox="0 0 240 132" role="img" aria-label="阳坡雪线高于阴坡">
        <rect x="14" y="14" width="212" height="104" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
        <polygon points="72,30 112,100 32,100" fill="#eef3f0" stroke="#9fb3aa"/>
        <polygon points="166,30 206,100 126,100" fill="#eef3f0" stroke="#9fb3aa"/>
        <line x1="38" y1="52" x2="106" y2="52" stroke="#0b6580" stroke-width="1.2" stroke-dasharray="4 3"/>
        <line x1="132" y1="70" x2="200" y2="70" stroke="#0b6580" stroke-width="1.2" stroke-dasharray="4 3"/>
        <text x="72" y="118" text-anchor="middle" font-size="8" fill="#b8402f">阳坡 · 雪线高</text>
        <text x="166" y="118" text-anchor="middle" font-size="8" fill="#0b6580">阴坡 · 雪线低</text>
      </svg>
    </div>
    <div class="qac">
      <p class="q">「山体海拔越高，带谱一定越多吗？」</p>
      <p class="a">不一定。还要看基带所处纬度与相对高度：高纬山地基带已是针叶林，上方可排的带少；相对高度不足时也排不出多条。</p>
      <svg viewBox="0 0 240 132" role="img" aria-label="同海拔下低纬带谱多、高纬带谱少">
        <rect x="14" y="14" width="212" height="104" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
        <polygon points="72,26 108,100 36,100" fill="#eef3f0" stroke="#9fb3aa"/>
        <line x1="62" y1="44" x2="82" y2="44" stroke="#8fbe70"/><line x1="55" y1="60" x2="89" y2="60" stroke="#6f9a63"/>
        <line x1="48" y1="76" x2="96" y2="76" stroke="#4f8a5e"/><line x1="41" y1="92" x2="103" y2="92" stroke="#2f7d4f"/>
        <text x="72" y="116" text-anchor="middle" font-size="8" fill="#1e6640">低纬 · 带谱多</text>
        <polygon points="170,26 206,100 134,100" fill="#eef3f0" stroke="#9fb3aa"/>
        <line x1="160" y1="60" x2="180" y2="60" stroke="#3f6f52"/><line x1="146" y1="82" x2="194" y2="82" stroke="#2f7d4f"/>
        <text x="170" y="116" text-anchor="middle" font-size="8" fill="#b8402f">高纬 · 带谱少</text>
      </svg>
    </div>
    <div class="qac">
      <p class="q">「南美西岸热带荒漠带南北延伸，是地带性还是非地带性？」</p>
      <p class="a">非地带性。秘鲁寒流降温减湿、离岸风与安第斯山阻挡水汽，使荒漠带沿西海岸南北延伸，打断了纬向更替。</p>
      <svg viewBox="0 0 240 132" role="img" aria-label="南美西岸荒漠带受洋流与地形影响南北延伸">
        <rect x="14" y="14" width="212" height="104" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
        <path d="M84 24 L128 22 L138 58 L122 100 L96 100 L86 62 Z" fill="#eaf0ea" stroke="#b9c8bd"/>
        <path d="M84 24 L94 24 L100 62 L94 100 L86 62 Z" fill="#e3cf9a" stroke="#d8bf7f"/>
        <text x="150" y="52" font-size="8" fill="#3a3a35">寒流 + 离岸风</text>
        <text x="150" y="66" font-size="8" fill="#3a3a35">荒漠带南北延伸</text>
        <text x="150" y="82" font-size="8" font-weight="700" fill="#b8402f">→ 非地带性</text>
      </svg>
    </div>
  </div>
  <p class="gx-note">这五问其实是同一件事：先定<b>基础和方向</b>，再定<b>基带</b>，最后看<b>谁把规律打断了</b>。</p>
</section>

<section class="gx-sec" id="f">
  <h2><span class="sn">06</span>易错清单</h2>
  <p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

  <div class="gx-errs">
    <div class="er">
      <p class="er-x">✗ 垂直带谱的基带可以不是当地的水平自然带</p>
      <p class="er-v">✓ 基带与当地水平自然带一致，读图先读基带</p>
      <p class="er-w">错在：山麓海拔接近当地地面，水热条件就是当地水平条件，基带不可能"另起一套"。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 雪线阳坡低、阴坡高</p>
      <p class="er-v">✓ 阳坡雪线高、阴坡低（阳坡迎风且降水多时例外）</p>
      <p class="er-w">错在：把"阳坡热量多"用反了方向。热量多→融雪多→常年积雪下界被抬高。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 山体海拔越高，垂直带谱一定越多</p>
      <p class="er-v">✓ 带谱数量由纬度、海拔和相对高度共同决定</p>
      <p class="er-w">错在：只看海拔，没看基带之上还剩几种自然带可排。高纬山地基带已是针叶林，再高也排不出几条。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 南美西岸荒漠带南北延伸属于纬度地带性</p>
      <p class="er-v">✓ 属于非地带性（地方性分异）</p>
      <p class="er-w">错在：见到"南北延伸"就套纬度地带性。成因是寒流、离岸风与山地阻挡，不是热量随纬度变化。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 纬度地带性以水分为基础，干湿度地带性以热量为基础</p>
      <p class="er-v">✓ 纬度地带性以热量为基础，干湿度地带性以水分为基础</p>
      <p class="er-w">错在：两个"基础"互换。这是本节最高频的一分丢分点，默写时按"纬度—热量、经度—水分"配对。</p>
    </div>
  </div>
</section>

<script>
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var NS = "http://www.w3.org/2000/svg";
  function E(tag, at, pa) {
    var e = document.createElementNS(NS, tag);
    for (var k in at) e.setAttribute(k, at[k]);
    if (pa) pa.appendChild(e);
    return e;
  }
  function T(pa, x, y, s, o) {
    o = o || {};
    var t = E("text", {
      x: x, y: y,
      "font-size": o.fs || 9,
      fill: o.fill || "#3a3a35",
      "text-anchor": o.anchor || "start",
      "font-weight": o.fw || 400
    }, pa);
    t.textContent = s;
    return t;
  }

  var ZONES = [
    { n: "热带雨林带", s: "雨林", c: "#2f7d4f", f: "#ffffff" },
    { n: "热带草原带", s: "草原", c: "#c3ad5c", f: "#151a21" },
    { n: "热带荒漠带", s: "荒漠", c: "#e3cf9a", f: "#151a21" },
    { n: "亚热带常绿硬叶林带", s: "硬叶林", c: "#6f9a63", f: "#ffffff" },
    { n: "温带落叶阔叶林带", s: "落叶林", c: "#8fbe70", f: "#151a21" },
    { n: "亚寒带针叶林带", s: "针叶林", c: "#3f6f52", f: "#ffffff" },
    { n: "苔原带", s: "苔原", c: "#a9b6ae", f: "#151a21" },
    { n: "冰原带", s: "冰原", c: "#eef5f9", f: "#151a21" }
  ];
  function baseIdx(lat) {
    return lat < 10 ? 0 : lat < 20 ? 1 : lat < 30 ? 2 : lat < 40 ? 3 : lat < 50 ? 4 : 5;
  }
  function snowline(lat) { return 5200 - 60 * lat; }

  var tries = 0;
  (function start() {
    var stage = document.getElementById("gxStage");
    if (!stage) { if (tries++ < 20) setTimeout(start, 60); return; }
    init(stage);
  })();

  function init(stage) {
    var gA = document.getElementById("gxA");
    var gB = document.getElementById("gxB");
    var sl = document.getElementById("gxSl");
    var p1 = document.getElementById("gxP1");
    var p2 = document.getElementById("gxP2");
    var p3 = document.getElementById("gxP3");
    var vA = document.getElementById("gxVa");
    var vB = document.getElementById("gxVb");
    var vC = document.getElementById("gxVc");
    var vD = document.getElementById("gxVd");
    var vS = document.getElementById("gxVs");
    var vSn = document.getElementById("gxVsn");
    var box = document.getElementById("gxStBox");
    var LAT = 30, ALT = 4000;

    var APEX = 78, BASE = 392, CX = 220, HB = 148, HGT = BASE - APEX;
    function hw(y) { return Math.max(0, (y - APEX) / HGT * HB); }

    function model(lat, alt) {
      var bi = baseIdx(lat);
      return {
        bi: bi,
        n: Math.max(1, Math.min(Math.floor(alt / 800), 8 - bi)),
        SL: snowline(lat)
      };
    }

    function drawMountain(alt, m) {
      T(gA, 24, 30, "① 山体垂直带谱", { fs: 11.5, fw: 700, fill: "#151a21" });
      E("line", { x1: 50, y1: BASE, x2: 392, y2: BASE, stroke: "#b8c4cf", "stroke-width": 1.2 }, gA);
      E("polygon", {
        points: CX + "," + APEX + " " + (CX + HB) + "," + BASE + " " + (CX - HB) + "," + BASE,
        fill: "#eef3f0", stroke: "#9fb3aa"
      }, gA);
      for (var i = 0; i < m.n; i++) {
        var y1 = BASE - i / m.n * HGT;
        var y2 = BASE - (i + 1) / m.n * HGT;
        var z = ZONES[Math.min(7, m.bi + i)];
        E("polygon", {
          points: [
            (CX - hw(y1)).toFixed(1) + "," + y1.toFixed(1),
            (CX + hw(y1)).toFixed(1) + "," + y1.toFixed(1),
            (CX + hw(y2)).toFixed(1) + "," + y2.toFixed(1),
            (CX - hw(y2)).toFixed(1) + "," + y2.toFixed(1)
          ].join(" "),
          fill: z.c, stroke: "#ffffff", "stroke-width": 1
        }, gA);
        if (y1 - y2 > 15) T(gA, CX, (y1 + y2) / 2 + 3, z.s, { fs: 8.5, fill: z.f, anchor: "middle" });
      }
      if (m.SL < alt) {
        var ys = BASE - (1 - m.SL / alt) * HGT;
        E("polygon", {
          points: (CX - hw(ys)).toFixed(1) + "," + ys.toFixed(1) + " " +
                  (CX + hw(ys)).toFixed(1) + "," + ys.toFixed(1) + " " + CX + "," + APEX,
          fill: "#f4fafd", opacity: 0.94, stroke: "#cfe3ee"
        }, gA);
        E("line", { x1: 56, y1: ys, x2: 384, y2: ys, stroke: "#0b6580", "stroke-width": 1.2, "stroke-dasharray": "5 4" }, gA);
        T(gA, 300, ys - 5, "雪线 " + m.SL + " m", { fs: 8.5, fill: "#0b6580", anchor: "middle" });
      }
      T(gA, CX, 412, "基带 " + ZONES[m.bi].n, { fs: 9, fw: 700, fill: "#0b6580", anchor: "middle" });
      T(gA, CX, 428, "海拔 " + alt + " m · 带谱 " + m.n + " 条", { fs: 8.5, fill: "#6b7684", anchor: "middle" });
    }

    function drawCurve(lat, SL) {
      var x0 = 64, x1 = 400, y0 = 76, y1 = 352;
      function X(v) { return x0 + v / 60 * (x1 - x0); }
      function Y(v) { return y1 - (v - 1000) / 4400 * (y1 - y0); }
      T(gB, 24, 30, "② 纬度—雪线", { fs: 11.5, fw: 700, fill: "#151a21" });
      T(gB, 24, 62, "雪线 / m", { fs: 9, fill: "#6b7684" });
      for (var s = 1000; s <= 5000; s += 1000) {
        E("line", { x1: x0, y1: Y(s), x2: x1, y2: Y(s), stroke: "#e6eef4" }, gB);
        T(gB, x0 - 4, Y(s) + 3, s / 1000 + " 000", { fs: 8, fill: "#6b7684", anchor: "end" });
      }
      E("line", { x1: x0, y1: y0, x2: x0, y2: y1, stroke: "#9fb0bd" }, gB);
      E("line", { x1: x0, y1: y1, x2: x1, y2: y1, stroke: "#9fb0bd" }, gB);
      [0, 15, 30, 45, 60].forEach(function (v) {
        T(gB, X(v), y1 + 15, v + "°", { fs: 8.5, fill: "#6b7684", anchor: "middle" });
      });
      T(gB, (x0 + x1) / 2, y1 + 32, "纬度 / °N", { fs: 8.5, fill: "#6b7684", anchor: "middle" });
      var pts = [];
      for (var v = 0; v <= 60; v += 5) pts.push(X(v).toFixed(1) + "," + Y(snowline(v)).toFixed(1));
      E("polyline", { points: pts.join(" "), fill: "none", stroke: "#0891b2", "stroke-width": 2 }, gB);
      E("line", { x1: X(lat), y1: Y(SL), x2: X(lat), y2: y1, stroke: "#0b6580", "stroke-dasharray": "3 3" }, gB);
      E("circle", { cx: X(lat), cy: Y(SL), r: 5, fill: "#0b6580", stroke: "#ffffff", "stroke-width": 1.5 }, gB);
      T(gB, Math.min(X(lat) + 9, 356), Y(SL) - 9, SL + " m", { fs: 9, fw: 700, fill: "#0b6580" });
    }

    function render() {
      var m = model(LAT, ALT);
      gA.textContent = "";
      gB.textContent = "";
      drawMountain(ALT, m);
      drawCurve(LAT, m.SL);

      vA.textContent = LAT + "°N";
      vB.textContent = ZONES[m.bi].n;
      vC.textContent = m.n + " 条";
      vD.textContent = m.SL;

      var st, sub, col, bg;
      if (m.SL >= ALT) {
        st = "无常年积雪"; sub = "雪线高于山顶"; col = "#3f6f92"; bg = "#eef6fb";
      } else if (ALT - m.SL < 800) {
        st = "有雪线"; sub = "雪线以上仅 " + (ALT - m.SL) + " m"; col = "#b07f2a"; bg = "#fdf4e3";
      } else {
        st = "冰川发育"; sub = "雪线以上高差 " + (ALT - m.SL) + " m"; col = "#1e6640"; bg = "#e6f6ee";
      }
      vS.textContent = st;
      vSn.textContent = sub;
      box.style.background = bg;
      box.style.borderColor = col + "44";
      vS.style.color = col;

      [[p1, 2000], [p2, 4000], [p3, 6000]].forEach(function (b) {
        var on = b[1] === ALT;
        b[0].style.background = on ? "#0891b2" : "";
        b[0].style.color = on ? "#ffffff" : "";
        b[0].style.borderColor = on ? "#0891b2" : "";
      });
      sl.value = String(LAT);
    }

    function layout() {
      var wide = stage.parentElement.getBoundingClientRect().width >= 640;
      stage.setAttribute("viewBox", wide ? "0 0 880 440" : "0 0 440 900");
      gA.setAttribute("transform", "translate(0,0)");
      gB.setAttribute("transform", wide ? "translate(440,0)" : "translate(0,450)");
      render();
    }

    sl.addEventListener("input", function () { LAT = +this.value; render(); });
    p1.addEventListener("click", function () { ALT = 2000; render(); });
    p2.addEventListener("click", function () { ALT = 4000; render(); });
    p3.addEventListener("click", function () { ALT = 6000; render(); });
    stage.addEventListener("keydown", function (ev) {
      if (ev.key === "ArrowLeft" || ev.key === "ArrowRight") {
        ev.preventDefault();
        LAT = Math.max(0, Math.min(60, LAT + (ev.key === "ArrowRight" ? 1 : -1)));
        render();
      }
    });
    var tm = null;
    window.addEventListener("resize", function () {
      clearTimeout(tm);
      tm = setTimeout(layout, 180);
    });
    layout();
  }

  var steps = document.getElementById("gxSteps");
  if (steps) {
    var li = steps.querySelectorAll(".step");
    var cnt = document.getElementById("gxCnt");
    var nx = document.getElementById("gxNext");
    var ans = document.getElementById("gxAns");
    var idx = 0;
    for (var k = 0; k < li.length; k++) {
      li[k].removeAttribute("hidden");
      li[k].style.display = k === 0 ? "" : "none";
    }
    if (ans) ans.removeAttribute("hidden");
    if (ans) ans.style.display = "none";
    nx.addEventListener("click", function () {
      if (idx < li.length - 1) {
        idx++;
        li[idx].style.display = "";
        cnt.textContent = (idx + 1) + " / " + li.length;
        if (idx === li.length - 1) nx.textContent = "看答案";
      } else {
        if (ans) ans.style.display = "";
        nx.textContent = "已展开";
        nx.disabled = true;
      }
    });
  }
});
</script>
