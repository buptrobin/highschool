<section class="gx-sec" id="a">
  <h2><span class="sn">01</span>课本怎么说</h2>
  <p class="gx-h2s">先背标准表述，再看解释。</p>

  <div class="gx-quote">
    <p class="q-t">教材表述 · 两个核心概念<span class="q-src">人教版（2019）选择性必修2 · 第二章第三节</span></p>
    <p class="q-b">资源型城市是因矿产资源开发而兴起，并以资源型产业为主导产业的城市。当资源开发进入后期，资源趋于枯竭、开采成本上升，城市发展面临困境，这类城市被称为资源枯竭型城市。</p>
    <p class="q-n">→ 翻成人话：三件事——<b>因矿而兴</b>、<b>资源型产业主导</b>、<b>面临困境</b>。前两条定"资源型城市"，第三条定"资源枯竭型城市"。</p>
  </div>

  <div style="overflow-x:auto">
  <table class="gx-cmp">
    <thead><tr><th>比什么</th><th>资源型城市（成长—成熟期）</th><th>资源枯竭型城市（衰退期）</th></tr></thead>
    <tbody>
      <tr><td>资源条件</td><td>储量大、品位高、开采成本低</td><td>剩余储量少、品位下降、成本上升</td></tr>
      <tr><td>产业结构</td><td>资源型产业占主导，仍有延伸空间</td><td>产业单一，接续替代产业尚未形成</td></tr>
      <tr><td>人口与就业</td><td>劳动力净流入，矿区城镇扩张</td><td>失业增加，青壮年与人才外流</td></tr>
      <tr><td>生态与财政</td><td>生态欠账累积但财力尚可</td><td>沉陷区、固废堆存，治理欠账多、财政困难</td></tr>
      <tr class="key"><td>出路</td><td>提前布局接续产业，拉长产业链</td><td>转型（再生）或继续衰落</td></tr>
    </tbody>
  </table>
  </div>
  <p class="gx-note">这张表最容易背错的是把"资源枯竭"理解成"资源为零"：教材说的是"趋于枯竭"，<b>经济可采性</b>下降也算，政策性关闭、环境约束同样会让城市提前进入枯竭型。</p>
</section>

    <p class="ex-q">某煤炭城市：煤炭剩余可采年限约 20 年；第二产业占 GDP 的 70%，其中煤炭开采及初加工占工业产值的 80%；采煤沉陷区约 30 km²；近五年常住人口减少 8%。<br>（1）判断该市所处的发展阶段，并说明依据。（2）分析其面临的主要问题。（3）提出转型措施，并说明理由。</p>
    <ol class="steps" id="gxSteps">
      <li class="step"><p class="s-h">第 1 步 · 先定阶段</p><p class="s-b">剩余可采年限 20 年，说明资源尚未耗尽但已进入<b>后期</b>；煤炭及初加工占工业产值 80%、二产占 GDP 70%，说明<b>资源型产业仍主导</b>。两者合起来→<b>衰退期</b>，不是成长期，也不是"已枯竭"。</p><p class="s-k">用到：生命周期四阶段的判读依据</p></li>

if(L===WIDE)tx(gB,L.R.x0+5,L.R.y0+22,"强度越小，年限越长",fs-1,C.green);
tx(gB,L.R.x1,L.R.y1-22,"强度 ≥1.6×：25 年内采完",fs-1,C.red,"end");
}
function render(){
var rem=Math.max(0,R0-K*Q0*T0),life=rem<=0?0:rem/(K*Q0),p=Math.min(1,(R0-rem)/R0),st,col,bg;
if(rem<=0){st="已枯竭";col="#5b6672";bg="#eef1f4";}
else if(p<.35){st="成长期";col=C.green;bg="#e6f6ee";}
else if(p<.65){st="成熟期";col=C.amber;bg="#fdf3df";}
else{st="衰退期";col=C.red;bg="#fbeae7";}
var u,uc,ub,us;
if(rem<=0||life<10){u="高";uc=C.red;ub="#fbeae7";us=rem<=0?"储量耗尽，窗口已关闭":"年限不足 10 年，须立即转型";}
else if(life<35){u="中";uc=C.amber;ub="#fdf3df";us="年限 "+Math.round(life)+" 年，窗口收窄";}
else{u="低";uc=C.green;ub="#e6f6ee";us="年限 "+Math.round(life)+" 年，窗口较宽";}
$("gxVa").textContent=K.toFixed(1)+"×";
$("gxVb").textContent=rem<=0?"0":String(Math.round(life));
$("gxVb").nextElementSibling.textContent=rem<=0?"年（已无经济可采储量）":"年（按当前强度）";
$("gxVs").textContent=st;$("gxVsn").textContent="累计采出 "+(p*100).toFixed(1)+"%";
$("gxVu").textContent=u;$("gxVun").textContent=us;
var b1=$("gxStBox"),b2=$("gxUrBox");
b1.style.background=bg;b1.style.borderColor=col+"44";b1.querySelector(".v").style.color=col;
b2.style.background=ub;b2.style.borderColor=uc+"44";b2.querySelector(".v").style.color=uc;
$("gxSl").value=String(K);
draw();
}
function applyLayout(){L=stage.parentElement.getBoundingClientRect().width>=640?WIDE:NARROW;stage.setAttribute("viewBox",L.vb);render();}
$("gxSl").addEventListener("input",function(){K=+this.value;render();});
$("gxP1").addEventListener("click",function(){K=2.4;render();});
$("gxP2").addEventListener("click",function(){K=.6;render();});
stage.addEventListener("keydown",function(ev){if(ev.key==="ArrowLeft"||ev.key==="ArrowRight"){ev.preventDefault();K=GX.clamp(K+(ev.key==="ArrowRight"? .1:-.1),.5,3);K=Math.round(K*10)/10;render();}});
var tmr=null;window.addEventListener("resize",function(){clearTimeout(tmr);tmr=setTimeout(applyLayout,180);});
applyLayout();
});
</script>
</body>
</html>
