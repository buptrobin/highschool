<!-- ================= A ================= -->
<section class="gx-sec" id="a">
  <h2><span class="sn">01</span>课本怎么说</h2>
  <p class="gx-h2s">先背标准表述，再看解释。四个名称一个字都不能改。</p>

  <div class="gx-quote">
    <p class="q-t">课本要点 · 主体功能区<span class="q-src">人教版（2019）必修第二册 · 第五章第三节</span></p>
    <p class="q-b">主体功能区是依据资源环境承载能力、现有开发密度和发展潜力，将国土空间划分为优化开发、重点开发、限制开发和禁止开发四类区域。</p>
    <p class="q-n">→ 注意<b>三个依据的先后</b>：<b>承载力</b>（能承受多少）→ <b>开发密度</b>（已经用了多少）→
    <b>发展潜力</b>（还能干什么）。<b>承载力排第一，不是 GDP 排第一</b>——这就是整节的逻辑起点。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本要点 · 四类区域的定位<span class="q-src">人教版（2019）必修第二册 · 第五章第三节</span></p>
    <p class="q-b">优化开发区域：开发密度较高、资源环境承载能力开始减弱。重点开发区域：资源环境承载能力较强、集聚经济和人口条件较好。限制开发区域：资源环境承载能力较弱、大规模集聚经济和人口条件不够好。禁止开发区域：依法设立的各类自然保护区域。</p>
    <p class="q-n">→ 四类的差别，本质是<b>“开发强度”该给多少</b>：优化＝<b>提质不扩量</b>，重点＝<b>承接新增</b>，
    限制＝<b>只做农业和生态</b>，禁止＝<b>不许工业化城镇化开发</b>。
    <b>“限制”限制的是“大规模高强度”，不是一切开发。</b></p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本要点 · 区域协调发展战略<span class="q-src">人教版（2019）必修第二册 · 第五章第三节</span></p>
    <p class="q-b">我国先后实施京津冀协同发展、长江经济带发展、粤港澳大湾区建设、长三角一体化发展、黄河流域生态保护和高质量发展等区域重大战略。</p>
    <p class="q-n">→ <b>五个战略，五组矛盾</b>：京津冀解决“北京太挤、河北太弱”；长江经济带解决“上游要保护、下游要发展”；
    粤港澳解决“三种制度、三个关税区怎么合作”；长三角解决“同质竞争、重复建设”；黄河解决“水少、沙多、生态脆”。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本要点 · 一带一路、海洋强国、乡村振兴<span class="q-src">人教版（2019）必修第二册 · 第五章第三节</span></p>
    <p class="q-b">一带一路是丝绸之路经济带和 21 世纪海上丝绸之路的简称，坚持共商共建共享。建设海洋强国，要关心海洋、认识海洋、经略海洋。乡村振兴要按照产业兴旺、生态宜居、乡风文明、治理有效、生活富裕的总要求推进。</p>
    <p class="q-n">→ 三件事各管一头：<b>一带一路</b>管“对外联通”，<b>海洋强国</b>管“向海要空间”，
    <b>乡村振兴</b>管“城乡不脱节”。乡村振兴的<b>20 字总要求</b>要背全，答题时五个词就是五个采分点。</p>
  </div>

  <p class="gx-h2s" style="margin-top:18px">四类主体功能区，按“开发强度”排一下：</p>
  <div style="overflow-x:auto">
  <table class="gx-cmp">
    <thead><tr><th>类型</th><th>承载力 / 开发现状</th><th>该做什么</th></tr></thead>
    <tbody>
      <tr><td>优化开发</td><td>承载力开始减弱，开发密度已高</td><td>提质增效、腾笼换鸟，不再铺摊子</td></tr>
      <tr><td>重点开发</td><td>承载力较强，集聚条件好</td><td>承接人口和产业，建城市群、产业集群</td></tr>
      <tr class="key"><td>限制开发</td><td>承载力较弱，<b>大规模集聚条件不够好</b></td><td>农产品主产区、重点生态功能区，<b>限制的是高强度开发</b></td></tr>
      <tr><td>禁止开发</td><td>依法设立的自然保护区域</td><td>禁止工业化城镇化开发，可保护、科研、适度旅游</td></tr>
    </tbody>
  </table>
  </div>
  <p class="gx-note"><b>两个最容易被背成名字的：</b><b>海洋强国</b>——关心海洋、认识海洋、经略海洋，落点是海洋经济、海洋科技、海洋生态、海洋权益四条腿，不是“多造几艘船”；<b>乡村振兴</b>——20 字总要求里“产业兴旺”排第一，没有产业就留不住人，五个词最好各能配一个具体例子。</p>

  <p class="gx-note">看这张表要抓一个反直觉：<b>“限制开发”不是“不开发”</b>。
  三江平原限制的是“把湿地排干建开发区”，不是“不许种水稻”；三江源限制的是“开矿建厂”，不是“不许牧民生活”。</p>
</section>

    <b>说明长江经济带为什么必须“共抓大保护”，并分析这一战略对区域协调发展的意义。（10 分）</b></p>

    <ol class="steps" id="gxSteps">
      <li class="step">
        <p class="s-h">第 1 步 · 先定位：这条带到底是一条什么带</p>
        <p class="s-b">长江经济带依托<b>长江黄金水道</b>，横贯<b>东、中、西</b>，覆盖 11 省市，
        面积约占全国 21%、人口和经济总量都超过全国 40%。它的特点是<b>上中下游差异大</b>：
        上游生态脆弱、中游农业与湿地集中、下游城市和产业密集。</p>
        <p class="s-k">用到：区域的空间定位</p>
      </li>
      <li class="step" hidden>
        <p class="s-h">第 2 步 · 为什么不能“大开发”：承载力这条线</p>
        <p class="s-b">上游<b>水土流失、山地灾害</b>多，一旦破坏很难恢复；中游<b>湖泊湿地萎缩</b>，
        调蓄洪水能力下降；下游<b>水污染、岸线过度占用</b>。全流域<b>资源环境承载力有限</b>，
        继续高强度开发会穿破承载力——这正是<b>持续性原则</b>要防的事。</p>
        <p class="s-k">用到：资源环境承载力 / 持续性</p>
      </li>
      <li class="step" hidden>
        <p class="s-h">第 3 步 · 为什么又不是“不开发”</p>
        <p class="s-b">带内中西部人均收入仍低于东部，<b>发展需求真实存在</b>。“不搞大开发”限制的是
        <b>高污染、高耗能、低水平的铺摊子</b>，不是不许发展。正确路径是<b>绿色低碳、产业升级、
        承接东部产业转移时提高门槛</b>。这就是三维度里的“经济是条件”。</p>
        <p class="s-k">用到：可持续发展的三维度（经济与社会）</p>
      </li>
