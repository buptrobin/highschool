<section class="gx-sec" id="a">
  <h2><span class="sn">01</span>课本怎么说<span class="bdg bdg-must">必考</span></h2>
  <p class="gx-h2s">先背标准表述，再看解释。</p>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 节选<span class="q-src">人教版（2019）选择性必修2 · 第二章第一节</span></p>
    <p class="q-b">区域的自然条件和自然资源，是区域发展的基础。自然条件主要包括气候、地形、水源、土壤、生物等要素；自然资源主要包括土地资源、水资源、矿产资源、能源资源和生物资源。……随着生产力水平的提高和科学技术的进步，自然条件和自然资源对区域发展的影响也会发生变化。</p>
    <p class="q-n">→ 翻成人话：三件事。① 自然条件给的是<b>可能性</b>；② 其中被人类利用、因而有价值的那一部分，才叫<b>自然资源</b>；③ 这份价值随技术、市场、政策、交通<b>变动</b>，不是天生固定。</p>
  </div>

  <div style="overflow-x:auto">
  <table class="gx-cmp">
    <thead><tr><th>比什么</th><th>自然条件</th><th>自然资源</th></tr></thead>
    <tbody>
      <tr><td>是什么</td><td>气候、地形、水源、土壤、生物等环境要素本身</td><td>其中被人类利用、能产生价值的部分：土地、水、矿产、能源、生物</td></tr>
      <tr><td>是否都有用</td><td>不一定，条件存在≠可以利用</td><td>要过"技术—市场—政策—交通"这一关才成为资源</td></tr>
      <tr><td>对区域发展的作用</td><td>给出可能性的<b>上限</b>与限制</td><td>提供物质基础，决定产业起点与类型</td></tr>
      <tr class="key"><td>能不能改变</td><td>总量难改，<b>限制程度</b>可改</td><td>价值可改，<b>资源是动态的</b></td></tr>
    </tbody>
  </table>
  </div>
  <p class="gx-note">这张表最容易背错的是"自然条件＝自然资源"。前者是环境要素本身，后者是其中被利用的那一部分；生物资源两头都算，正好说明二者是<b>包含</b>关系，不是并列关系。</p>
</section>

  <h2><span class="sn">04</span>一道题走一遍</h2>
  <p class="gx-h2s">先自己读题干想 30 秒，再点"下一步"。</p>

  <div class="gx-ex">
    <p class="ex-t">例题<span class="bdg bdg-must">必考</span></p>
    <p class="ex-q">甲地年降水量约 200 mm，光照充足，土地广阔，地表水少但有地下水；乙地年降水量约 1200 mm，水热条件好，但地形破碎、耕地零散、人多地少。<br>（1）比较两地自然条件的优劣。（2）说明技术如何改变自然条件的限制。（3）为甲地提出发展方向并说明理由。</p>
    <ol class="steps" id="gxSteps">
      <li class="step"><p class="s-h">第 1 步 · 先立尺子，再下判断</p><p class="s-b">比较自然条件，必须按同一组维度逐项过：气候（光、热、水）、地形、水源、土壤、生物。不列维度就写"甲地条件差"，一定丢分。</p><p class="s-k">用到：自然条件的 5 类要素</p></li>

    REF.mW.setAttribute("cx", x); REF.mW.setAttribute("cy", yW);

    $("gxVa").textContent = String(Math.round(T));
    $("gxVb").textContent = N.toFixed(0);
    $("gxVc").textContent = Wt.toFixed(0);

    var st, sn, col, bg;
    if (T < 25) { st = "靠天吃饭"; sn = "只靠降水，产出低"; col = "#5a6f7d"; bg = "#eef3f7"; }
    else if (T < 70) { st = "技术改善"; sn = "灌溉与良种起作用"; col = "#b26a00"; bg = "#fdf3e3"; }
    else { st = "高效集约"; sn = "产出高、耗水低"; col = "#1e6640"; bg = "#e6f6ee"; }
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    $("gxSl").value = String(Math.round(T));
  }

  function applyLayout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? WIDE : NARROW;
    stage.setAttribute("viewBox", L.vb);
    build(); render();
  }

  $("gxSl").addEventListener("input", function () { T = +this.value; render(); });
  $("gxP1").addEventListener("click", function () { T = 0; render(); });
  $("gxP2").addEventListener("click", function () { T = 100; render(); });
  stage.addEventListener("keydown", function (ev) {
    if (ev.key === "ArrowLeft" || ev.key === "ArrowRight") {
      ev.preventDefault();
      T = clamp(T + (ev.key === "ArrowRight" ? 5 : -5), 0, 100);
      render();
    }
  });
  var tmr = null;
  window.addEventListener("resize", function () {
    clearTimeout(tmr);
    tmr = setTimeout(applyLayout, 180);
  });
  applyLayout();
});
</script>
</body>
</html>
