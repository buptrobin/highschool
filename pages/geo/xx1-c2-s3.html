<section class="gx-sec" id="a">
  <h2><span class="sn">01</span>课本怎么说</h2>
  <p class="gx-h2s">先背标准表述，再看三段式的因果链。</p>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 河谷的演变<span class="q-src">人教版（2019）选择性必修1 · 第二章第三节</span></p>
    <p class="q-b">河流侵蚀按方向分为溯源侵蚀、下蚀和侧蚀：溯源侵蚀使河谷向源头方向延长，下蚀使河谷加深，侧蚀使河谷展宽。上游落差大、流速快，侵蚀以溯源侵蚀和下蚀为主，河谷横剖面呈「V」形；中游下蚀减弱、侧蚀增强，河谷展宽，河道弯曲；下游地势平缓，堆积作用为主。</p>
    <p class="q-n">→ 三个变量在换挡：<b>落差决定流速，流速决定下蚀强弱，下蚀与侧蚀的比例决定河谷是「深窄」还是「宽浅」</b>。记住比例，不要死背三段的名字。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 冲积平原与三角洲<span class="q-src">人教版（2019）选择性必修1 · 第二章第三节</span></p>
    <p class="q-b">河流搬运的泥沙，在流速减慢的地方堆积，形成冲积平原；在河流入海（湖）口，因流速减慢、海水顶托，泥沙堆积形成三角洲。</p>
    <p class="q-n">→ 三角洲只答「泥沙多」拿不到满分，要答全<b>四个条件</b>：泥沙来源丰富、河口地势平缓、海水顶托作用弱、河口宽阔水浅。缺一个，泥沙就被带到外海。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 河流阶地<span class="q-src">人教版（2019）选择性必修1 · 第二章第三节</span></p>
    <p class="q-b">河流阶地是河流下切侵蚀，使原来的河谷底部超出一般洪水位，呈阶梯状分布在河谷谷坡上。</p>
    <p class="q-n">→ 因果链只有两环：<b>地壳间歇性抬升（或侵蚀基准面下降）→ 河流下切增强</b>。抬升一下、下切一段，就多出一级阶地；不是「河流变宽」留下的。</p>
  </div>

  <div style="overflow-x:auto">
  <table class="gx-cmp">
    <thead><tr><th>比什么</th><th>上游</th><th>中游</th><th>下游</th></tr></thead>
    <tbody>
      <tr><td>落差与流速</td><td>大 / 快</td><td>减小 / 变慢</td><td>小 / 慢</td></tr>
      <tr class="key"><td>主导作用</td><td>溯源侵蚀、下蚀</td><td>侧蚀增强、下蚀减弱</td><td>堆积为主</td></tr>
      <tr><td>河谷横剖面</td><td>V 形，窄而深</td><td>槽形，展宽弯曲</td><td>宽浅，河漫滩发育</td></tr>
      <tr><td>典型地貌</td><td>峡谷、瀑布</td><td>河曲、牛轭湖</td><td>冲积平原、三角洲</td></tr>
    </tbody>
  </table>
  </div>
  <p class="gx-note">这张表还有一个高频错点：把河流的 V 形谷记成冰川的 U 形谷。<b>V 是下蚀切出来的，谷底窄、谷坡陡；U 是冰川刨蚀的，谷底宽平、谷坡陡直</b>。判断先看谷底宽窄，再看谷坡形态。</p>
</section>

  };

  function model(s) {
    var p = s / (s + 1);
    var w = 40 + 240 * (1 - p);
    var d = 24 + 36 * p;
    return { p: p, w: w, d: d, r: w / d };
  }

  function stateOf(s) {
    if (s >= 2.5) return { t: "下蚀为主 · V 形谷", n: "谷底窄、谷坡陡，下蚀与溯源侵蚀占优势", c: "#0b6580", bg: "#e9f6fb", bd: "#bfe2ee" };
    if (s >= 0.6) return { t: "侧蚀增强 · 河谷展宽", n: "下蚀减弱，河道开始弯曲，凹岸侵蚀、凸岸堆积", c: "#b8791f", bg: "#fdf3e3", bd: "#ecd3a8" };
    return { t: "堆积为主 · 宽浅谷", n: "流速慢，泥沙在谷底与河漫滩堆积，向冲积平原过渡", c: "#1e6640", bg: "#e9f6ee", bd: "#bfe0cc" };
  }

  function line(g, x1, y1, x2, y2, col, w, dash) {
    var o = { x1: n1(x1), y1: n1(y1), x2: n1(x2), y2: n1(y2), stroke: col || C.line, "stroke-width": w || 1.2 };
    if (dash) o["stroke-dasharray"] = dash;
    return el("line", o, g);
  }

  function arrow(g, x1, y1, x2, y2, col, w) {
    var sw = w || 1.8;
    line(g, x1, y1, x2, y2, col, sw);
    var a = Math.atan2(y2 - y1, x2 - x1), h = 7;
    var p1 = [x2 - h * Math.cos(a - 0.45), y2 - h * Math.sin(a - 0.45)];
    var p2 = [x2 - h * Math.cos(a + 0.45), y2 - h * Math.sin(a + 0.45)];
    el("polyline", {
      points: n1(p1[0]) + "," + n1(p1[1]) + " " + n1(x2) + "," + n1(y2) + " " + n1(p2[0]) + "," + n1(p2[1]),
      fill: "none", stroke: col, "stroke-width": sw, "stroke-linecap": "round", "stroke-linejoin": "round"
    }, g);
  }

  function drawCross(g, m, narrow) {
    var cx = narrow ? 180 : 300;
    var bedY = narrow ? 290 : 320;
    var xk = narrow ? 0.42 : 0.625;
    var yk = narrow ? 1.6 : 2.0;
    var x0 = narrow ? 14 : 26, x1 = narrow ? 346 : 590;
    var bottom = narrow ? 352 : 420;
    var hw = m.w * xk;
    var depth = m.d * yk;
    var rimY = bedY - depth;
    var run = depth * 0.55;

    var pts = [
      [x0, rimY], [cx - hw - run, rimY], [cx - hw, bedY], [cx + hw, bedY],
      [cx + hw + run, rimY], [x1, rimY], [x1, bottom], [x0, bottom]
    ];
    var s = "";
    for (var i = 0; i < pts.length; i++) s += n1(pts[i][0]) + "," + n1(pts[i][1]) + " ";
    el("polygon", { points: s, fill: C.ground, stroke: "#c3d2dc", "stroke-width": 1.2 }, g);

    el("rect", { x: n1(cx - hw + 1), y: n1(bedY - 7), width: n1(hw * 2 - 2), height: 7, fill: C.water, stroke: C.waterLine, "stroke-width": 1 }, g);

    line(g, cx - hw, bedY + 20, cx + hw, bedY + 20, "#7f95a5", 1.1);
    line(g, cx - hw, bedY + 15, cx - hw, bedY + 25, "#7f95a5", 1.1);
    line(g, cx + hw, bedY + 15, cx + hw, bedY + 25, "#7f95a5", 1.1);
    tx(g, cx, bedY + 14, "谷底宽 " + Math.round(m.w) + " m", C.blueD, "middle", 9, 700);

    line(g, cx, rimY + 4, cx, bedY - 20, "#9fb3c0", 1, "4 4");
    tx(g, cx + 5, rimY + 20, "D", C.mid, "start", 8.5, 700);

    tx(g, x0 + 2, 30, narrow ? "河谷横剖面（垂向放大）" : "河谷横剖面 · 垂向放大", C.ink, "start", 11 * (narrow ? 0.95 : 1), 700);
    tx(g, x0 + 2, 48, "S " + S.toFixed(1) + "% · 谷底宽 " + Math.round(m.w) + " m · 谷深 " + Math.round(m.d) + " m", C.mid, "start", 9);

    var st = stateOf(S);
    tx(g, cx, rimY - 12, st.t.split(" · ")[0], st.c, "middle", 9.5, 700);

    if (S >= 2.5) {
      var off = Math.min(20, hw * 0.5);
      arrow(g, cx - off, rimY + 8, cx - off, bedY - 12, C.blue, 1.8);
      arrow(g, cx + off, rimY + 8, cx + off, bedY - 12, C.blue, 1.8);
    } else if (S >= 0.6) {
      var yy = bedY - depth * 0.55;
      arrow(g, cx, yy, cx - hw + 8, yy, C.amber, 1.8);
      arrow(g, cx, yy, cx + hw - 8, yy, C.amber, 1.8);
    } else {
      for (var k = 0; k <= 4; k++) {
        var dx = cx - hw + (hw * 2) * (k / 4);
        el("circle", { cx: n1(dx), cy: n1(bedY - 4), r: 2.2, fill: C.amber }, g);
      }
    }
  }

  function drawCurve(g, m) {
    var px0 = 646, px1 = 852, py0 = 74, py1 = 330, rMax = 10;
    tx(g, 618, 44, "宽深比 R 随坡度变化", C.ink, "start", 10.5, 700);

    function lx(v) { return Math.log(v / 0.1) / Math.log(50); }
    function X(v) { return px0 + lx(v) * (px1 - px0); }
    function Y(r) { return py1 - (Math.min(r, rMax) / rMax) * (py1 - py0); }

    line(g, px0, py0, px0, py1, C.line, 1);
    line(g, px0, py1, px1, py1, C.line, 1);

    var xs = [0.1, 0.2, 0.5, 1, 2, 5], i;
    for (i = 0; i < xs.length; i++) {
      line(g, X(xs[i]), py1, X(xs[i]), py1 + 4, C.line, 1);
      tx(g, X(xs[i]), py1 + 15, String(xs[i]), C.mid, "middle", 8);
    }
    var ys = [0, 2, 4, 6, 8, 10];
    for (i = 0; i < ys.length; i++) {
      line(g, px0 - 4, Y(ys[i]), px0, Y(ys[i]), C.line, 1);
      tx(g, px0 - 7, Y(ys[i]) + 3, String(ys[i]), C.mid, "end", 8);
    }

    line(g, px0, Y(2), px1, Y(2), C.faint, 1, "3 3");
    line(g, px0, Y(6), px1, Y(6), C.faint, 1, "3 3");

    var pts = [], j;
    for (j = 0; j <= 80; j++) {
      var sv = 0.1 * Math.pow(50, j / 80);
      pts.push([X(sv), Y(model(sv).r)]);
    }
    el("path", { d: GX.poly(pts), fill: "none", stroke: C.blue, "stroke-width": 2.1, "stroke-linejoin": "round" }, g);

    var px = X(S), py = Y(m.r);
    line(g, px, py, px, py1, C.blueD, 1, "3 3");
    el("circle", { cx: n1(px), cy: n1(py), r: 5, fill: C.blue, stroke: "#fff", "stroke-width": 2 }, g);
    tx(g, px > px1 - 56 ? px - 8 : px + 8, py - 9, "R " + m.r.toFixed(1), C.blueD, px > px1 - 56 ? "end" : "start", 9.5, 700);
    tx(g, px1, py1 + 31, "S / %", C.mid, "end", 8.5);
  }

  function drawSpectrum(g, m) {
    var x0 = 30, x1 = 330, y = 414, h = 12, rMax = 10;
    function X(r) { return x0 + (Math.min(r, rMax) / rMax) * (x1 - x0); }
    tx(g, x0, 390, "宽深比形态谱", C.ink, "start", 9.5, 700);
    el("rect", { x: x0, y: y, width: n1(X(2) - x0), height: h, fill: "#e9f6fb" }, g);
    el("rect", { x: n1(X(2)), y: y, width: n1(X(6) - X(2)), height: h, fill: "#fdf3e3" }, g);
    el("rect", { x: n1(X(6)), y: y, width: n1(x1 - X(6)), height: h, fill: "#e9f6ee" }, g);
    line(g, X(2), y, X(2), y + h, "#fff", 1.5);
    line(g, X(6), y, X(6), y + h, "#fff", 1.5);
    var mx = X(m.r);
    el("polygon", { points: n1(mx) + "," + (y - 2) + " " + n1(mx - 5) + "," + (y - 9) + " " + n1(mx + 5) + "," + (y - 9), fill: C.blueD }, g);
    tx(g, mx, y - 14, "R " + m.r.toFixed(1), C.blueD, "middle", 9, 700);
    tx(g, (x0 + X(2)) / 2, y + 26, "V 形", C.blueD, "middle", 8);
    tx(g, (X(2) + X(6)) / 2, y + 26, "槽形", C.amber, "middle", 8);
    tx(g, (X(6) + x1) / 2, y + 26, "宽浅", C.green, "middle", 8);
  }

  function draw() {
    var m = model(S);
    var gA = $("gxA"), gB = $("gxB");
    gA.textContent = ""; gB.textContent = "";
    drawCross(gA, m, L.narrow);
    if (L.narrow) drawSpectrum(gB, m); else drawCurve(gB, m);
  }

  function render() {
    var m = model(S), st = stateOf(S);
    $("gxVa").textContent = S.toFixed(1);
    $("gxVb").textContent = String(Math.round(m.w));
    $("gxVc").textContent = m.r.toFixed(1);
    $("gxVs").textContent = st.t;
    $("gxVsn").textContent = st.n;
    var box = $("gxStBox");
    box.style.background = st.bg;
    box.style.borderColor = st.bd;
    $("gxVs").style.color = st.c;
    $("gxSl").value = String(S);
    draw();
  }

  function applyLayout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? WIDE : NARROW;
    stage.setAttribute("viewBox", L.vb);
    render();
  }

  $("gxSl").addEventListener("input", function () { S = +this.value; render(); });
  $("gxP1").addEventListener("click", function () { S = 5; render(); });
  $("gxP2").addEventListener("click", function () { S = 0.2; render(); });
  stage.addEventListener("keydown", function (ev) {
    if (ev.key === "ArrowLeft" || ev.key === "ArrowRight") {
      ev.preventDefault();
      S = clamp(Math.round((S + (ev.key === "ArrowRight" ? 0.1 : -0.1)) * 10) / 10, 0.1, 5);
      render();
    }
  });

  var tmr = null;
  window.addEventListener("resize", function () {
    clearTimeout(tmr);
    tmr = setTimeout(applyLayout, 180);
  });
  applyLayout();
});
</script>
</body>
</html>
