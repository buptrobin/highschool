<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再看解释。</p>

<div class="gx-quote">
<p class="q-t">教材要点 · 国际合作（归纳）<span class="q-src">人教版（2019）选择性必修2 · 第四章第四节</span></p>
<p class="q-b">国际合作是指不同国家或地区之间，为了共同利益，在生产、贸易、投资、技术、资源开发、环境治理等领域开展的协作与协调。其基础是各国<b>资源、市场、技术、资本</b>等要素分布不均，以及<b>经济全球化</b>背景下的产业链分工。</p>
<p class="q-n">→ 翻成人话：前提是"你有我缺"，动力是"合起来更划算"，底线是"双方都要得到"。三句话分别对应条件、原因、意义。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>要素</th><th>全球分布的特点</th><th>怎样促成合作</th></tr></thead>
<tbody>
<tr><td>资源</td><td>石油、矿产、耕地、水热集中在少数地区</td><td>出口国换资金与技术，进口国保供给安全</td></tr>
<tr><td>市场</td><td>人口与购买力分布不均</td><td>企业跨出国界找消费者，形成贸易与投资</td></tr>
<tr><td>技术</td><td>研发能力集中在少数发达国家</td><td>技术转让、联合研发、工程承包</td></tr>
<tr class="key"><td>资本</td><td>资金供给国与需求国错位</td><td>国际投资、发展援助、基础设施融资</td></tr>
<tr><td>产业链</td><td>研发—制造—组装—销售分处不同国家</td><td>分工协作，中间品多次跨境，形成全球价值链</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">这张表最容易背错的是：把"资源互补"只理解成自然资源。市场、技术、资本同样是禀赋，缺一项，合作就缺一条腿。</p>
</section>

<p class="ex-q">中欧班列开行量持续增长，从中国出发经阿拉山口出境，通达欧洲多个城市；运输时间比海运缩短约一半。据此回答：（1）说明中欧班列对双边贸易的作用；（2）分析国际合作的条件；（3）说明合作中应注意的问题。</p>
<ol class="steps" id="gxSteps">
<li class="step"><p class="s-h">第 1 步 · 拆问题</p><p class="s-b">三问分别对应"作用—条件—注意"三套框架，材料里的"时间缩短一半"只服务于第（1）问，不要拿它去答条件。</p><p class="s-k">用到：区域联系与区域协调发展</p></li>
<li class="step" hidden><p class="s-h">第 2 步 · 作用怎么答</p><p class="s-b">时间缩短 → 时间成本下降、时效提高 → 高附加值货物和冷链货物改走铁路 → 贸易规模扩大、结构优化、市场拓展、沿线枢纽兴起。</p><p class="s-k">用到：交通运输条件改善对贸易的影响</p></li>
<li class="step" hidden><p class="s-h">第 3 步 · 条件怎么答</p><p class="s-b">从"要素—设施—制度—环境"四层找：资源与市场互补、铁路口岸等基础设施、通关与规则对接、资金技术与稳定的政治环境。</p><p class="s-k">用到：国际合作的条件</p></li>
<li class="step" hidden><p class="s-h">第 4 步 · 注意怎么答</p><p class="s-b">互利共赢、债务可持续、生态保护、安全与合规、尊重主权与国情。每一点都要落到"怎样做"，不能只喊口号。</p><p class="s-k">用到：合作的风险与可持续</p></li>
<li class="step" hidden><p class="s-h">第 5 步 · 组织成答案</p><p class="s-b">按设问分三段，每段先写术语再解释，一个要点一句话。第（3）问至少写三点，且要有利弊两面。</p><p class="s-k">用到：规范作答</p></li>

<p class="ans-t">标准答案（可抄进答题卡）</p>
<p class="ans-b">（1）缩短运输时间，降低时间成本，提高贸易时效；扩大双边贸易规模，优化贸易结构，适合高附加值、冷链等货物；拓展市场，带动沿线节点城市与相关产业，促进生产要素跨国流动。<br>（2）资源、市场、技术、资本等要素互补；有稳定的市场需求；铁路、口岸、仓储等基础设施完善；政策支持、通关便利、规则与标准对接；资金、技术与运营能力；稳定的政治与安全环境。<br>（3）坚持互利共赢，兼顾双方收益；评估债务可持续性，量力而行；保护生态，绿色低碳；防范地缘政治、安全与合规风险；尊重各国主权、法律与国情，因地制宜。</p>

<section class="gx-sec" id="e">
<h2><span class="sn">05</span>会怎么考</h2>
<p class="gx-h2s">五问，都是围绕"互补—形式—风险"换角度。</p>
<div class="gx-qa">
<div class="qac">
<p class="q">「国际合作就是发达国家给钱给物吗？」</p>
<p class="a">不是。发展援助只是五类形式之一，合作还包括贸易、投资、工程承包、技术合作，本质是双向的要素流动。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="援助只是合作的一种形式">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text class="ms" x="120" y="30" text-anchor="middle">合作 ≠ 援助</text>
<rect x="30" y="42" width="180" height="26" rx="5" fill="#eef6fb" stroke="#b8d8e8"/>
<text x="120" y="59" font-size="8" text-anchor="middle" fill="#0b6580">贸易·投资·承包·技术·援助</text>
<rect x="30" y="84" width="54" height="22" rx="5" fill="#fff8e8" stroke="#f0d9a8"/>
<text x="57" y="99" font-size="8" text-anchor="middle" fill="#8a5a00">援助</text>
<text x="92" y="99" font-size="8" fill="#6b6b63">← 只是其中一类</text>
</svg>
</div>
<div class="qac">
<p class="q">「运输成本降一半，贸易额会翻倍吗？」</p>
<p class="a">不会。按指数关系，成本从 45 降到 22.5，贸易额从约 736 升到约 1214 亿美元，只增约 65%；越接近零运费，边际收益越小。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="成本下降与贸易额的非线性关系">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<path d="M32 104 C60 96 78 70 104 58 S150 44 208 40" fill="none" stroke="#0891b2" stroke-width="2"/>
<line x1="32" y1="104" x2="208" y2="104" stroke="#b9c6d0"/>
<line x1="32" y1="104" x2="32" y2="32" stroke="#b9c6d0"/>
<circle cx="86" cy="66" r="3.5" fill="#1e6640"/><circle cx="126" cy="50" r="3.5" fill="#b8402f"/>

<text x="150" y="112" font-size="7.5" fill="#6b6b63">成本指数</text>
</svg>
</div>
<div class="qac">
<p class="q">「"一带一路"就是修铁路、建港口？」</p>
<p class="a">不止。五通并列：政策沟通、设施联通、贸易畅通、资金融通、民心相通；修路只是设施联通，答题要写全，再落到项目。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="五通并列，设施联通只是其中之一">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<text class="ms" x="120" y="30" text-anchor="middle">五通并列</text>
<g>
<circle cx="52" cy="62" r="13" fill="#fff" stroke="#b8d8e8"/><circle cx="86" cy="62" r="13" fill="#0891b2"/>
<circle cx="120" cy="62" r="13" fill="#fff" stroke="#b8d8e8"/><circle cx="154" cy="62" r="13" fill="#fff" stroke="#b8d8e8"/>
<circle cx="188" cy="62" r="13" fill="#fff" stroke="#b8d8e8"/>
</g>
<g font-size="7.5" text-anchor="middle" fill="#3a3a35">
<text x="52" y="65">政策</text><text x="86" y="65" fill="#fff">设施</text><text x="120" y="65">贸易</text>
<text x="154" y="65">资金</text><text x="188" y="65">民心</text>
</g>
<text x="120" y="96" font-size="8" text-anchor="middle" fill="#b8402f">设施只是 1 / 5，不能只写修路</text>
</svg>
</div>
<div class="qac">
<p class="q">「合作收益能一直增长吗？」</p>
<p class="a">不能。受市场容量、资源环境承载力、债务与治理能力约束，收益有上限；超过阈值，增量变小，风险反而上升。</p>
<svg viewBox="0 0 240 132" role="img" aria-label="合作收益存在上限">
<rect x="8" y="8" width="224" height="116" rx="8" fill="#f6f8fa" stroke="#dde4ea"/>
<path d="M32 102 C64 100 78 74 110 58 S160 46 208 46" fill="none" stroke="#0891b2" stroke-width="2"/>

<div class="qac">
<p class="q">「资源互补就一定能合作吗？」</p>
<p class="a">不一定。还要有可通达的通道、可支付的资金、可执行的制度；缺一项，互补只停留在"潜力"。</p>

<text x="82" y="42" font-size="10" fill="#6b6b63">+</text><text x="153" y="42" font-size="10" fill="#6b6b63">+</text>

</div>
<p class="gx-note">这五问其实是同一件事：合作 = 互补性 × 可达性 × 制度保障，再减去风险。</p>

<section class="gx-sec" id="f">
<h2><span class="sn">06</span>易错清单</h2>
<p class="gx-h2s">左边是学生真会写的错句，右边是应该写的样子。</p>

<div class="gx-errs">
<div class="er">
<p class="er-x">✗ 国际合作就是发达国家对发展中国家的援助。</p>
<p class="er-v">✓ 国际合作包括国际贸易、国际投资、工程承包、技术合作、发展援助等形式，援助只是其中一类，主体与收益都是双向的。</p>
<p class="er-w">错在哪：把"形式之一"当成"全部"，漏掉贸易、投资、承包、技术四类，也丢了互利共赢。</p>
</div>
<div class="er">
<p class="er-x">✗ 合作只对中国有利，对方只是配合。</p>
<p class="er-v">✓ 合作是双向互利：中方获得市场、资源与通道，东道国获得就业、税收、基础设施与产业升级。</p>
<p class="er-w">错在哪：只站在一方算账，答"意义"时写不出对方收益，答"风险"时又看不见对方关切。</p>
</div>
<div class="er">
<p class="er-x">✗ 只要合作，就一定越来越好，不用管债务和环境。</p>
<p class="er-v">✓ 合作要评估债务可持续性、政治与安全风险、生态影响，坚持互利共赢、量力而行、绿色可持续。</p>
<p class="er-w">错在哪：只写收益不写风险，遇到"应注意的问题"就丢分；风险不是否定合作，而是合作方式要改进。</p>
</div>
<div class="er">
<p class="er-x">✗ "一带一路"就是修路、建港口、铺铁路。</p>
<p class="er-v">✓ "一带一路"以政策沟通、设施联通、贸易畅通、资金融通、民心相通为内容，设施联通只是"五通"之一。</p>
<p class="er-w">错在哪：把"设施"当成"全部"，答题时写不出规则对接、通关便利、金融支持与人文交流。</p>
</div>
<div class="er">
<p class="er-x">✗ 所有国家都适合同一种合作方式。</p>
<p class="er-v">✓ 要因地制宜：资源型国家可做资源开发与加工，交通枢纽可做通道与物流，缺乏资金技术的可优先基础设施与人才培训。</p>
<p class="er-w">错在哪：忽略国情、主权与发展阶段差异，把"合作"写成一套模板。</p>
</div>
</div>
</section>

n=C>=70?0:Math.max(1,Math.round(ratio*6));
for(i=0;i<n;i++)el("circle",{cx:L.dots.x+i*L.dots.dx,cy:L.dots.y,r:3.2,fill:col,opacity:.9},dyn);
if(C>=70)tx(dyn,L.block[0],L.block[1],"通道受阻：运费吃掉利润","#b8402f","start",9.5,700);
px=X(C);py=Y(t);
el("line",{x1:px,y1:py,x2:px,y2:L.ch.y1,stroke:col,"stroke-width":1,"stroke-dasharray":"4 4"},dyn);
el("line",{x1:L.ch.x0,y1:py,x2:px,y2:py,stroke:col,"stroke-width":1,"stroke-dasharray":"4 4"},dyn);
el("circle",{cx:px,cy:py,r:2.5,fill:col},dyn);
anchor=px>L.ch.x1-72?"end":"start";lx=anchor==="end"?px-10:px+10;
lab=tx(dyn,lx,py-10,fmt(t),col,anchor,11,700);
lab.setAttribute("stroke","#fff");lab.setAttribute("stroke-width","3");lab.setAttribute("paint-order","stroke");
}
function applyLayout(){
var w=stage.parentElement?stage.parentElement.getBoundingClientRect().width:0;
L=w>=640?W:N;
stage.setAttribute("viewBox",L.vb);
build();render();
}
$("gxSl").addEventListener("input",function(){C=+this.value;render();});
$("gxP1").addEventListener("click",function(){C=0;render();});
$("gxP2").addEventListener("click",function(){C=45;render();});
$("gxP3").addEventListener("click",function(){C=100;render();});
stage.addEventListener("keydown",function(ev){
if(ev.key==="ArrowLeft"||ev.key==="ArrowRight"){ev.preventDefault();C=GX.clamp(C+(ev.key==="ArrowRight"?2:-2),0,100);render();}
});
var tmr=null;
window.addEventListener("resize",function(){clearTimeout(tmr);tmr=setTimeout(applyLayout,180);});
applyLayout();
});
</script>
