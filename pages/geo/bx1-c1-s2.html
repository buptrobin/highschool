<p class="gx-lede">这一节分成两半：<b>太阳辐射</b>（一直在给，是地球的能量总开关）和<b>太阳活动</b>（隔一阵闹一次，是干扰源）。
前者考"能量从哪来、给地球带来了什么"，后者考"<b>发生在哪一层、影响了地球的什么</b>"。

<section class="gx-sec" id="a">
  <h2><span class="sn">01</span>课本怎么说</h2>
  <p class="gx-h2s">先背标准表述，再看解释。顺序反了，答题时就写不出术语。</p>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 太阳辐射<span class="q-src">人教版（2019）必修第一册 · 第一章第二节</span></p>
    <p class="q-b">太阳辐射是以电磁波的形式向外传递能量。太阳辐射的能量来自太阳内部的核聚变反应。太阳辐射为地球提供了光和热，维持着地表温度，是地球上水、大气运动和生命活动的主要动力。</p>
    <p class="q-n">→ 三个采分点，一个都不能少：<b>①形式</b>（电磁波）、<b>②来源</b>（内部核聚变）、
    <b>③作用</b>（光热 + 维持地表温度 + 水、大气运动与生命活动的主要动力）。
    最常见的错法是写"太阳燃烧释放能量"——<b>太阳不是在烧，是在聚变</b>：4 个氢核聚变成 1 个氦核，
    亏损的质量变成能量。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 太阳大气层<span class="q-src">人教版（2019）必修第一册 · 第一章第二节</span></p>
    <p class="q-b">太阳大气层从里到外分为光球、色球和日冕三层。我们肉眼看到的太阳圆面是光球层。色球层和日冕层只有在日全食时或用特殊仪器才能观测到。</p>
    <p class="q-n">→ 三层有个<b>反直觉</b>的特点：<b>越往外，温度越高、亮度越低</b>。光球 6000 K，
    色球上万 K，日冕上百万 K。所以"看不见"不是因为不热，而是因为<b>太稀薄、太暗</b>——
    亮度从光球到日冕掉了几百万倍，压过了温度。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 太阳活动及其影响<span class="q-src">人教版（2019）必修第一册 · 第一章第二节</span></p>
    <p class="q-b">太阳活动是太阳大气层的变化，其主要类型有黑子、耀斑、日珥和太阳风等。黑子和耀斑是太阳活动的重要标志，太阳活动的平均周期约为 11 年。太阳活动会扰动电离层，影响无线电短波通信；会扰乱地球磁场，产生"磁暴"现象；高能带电粒子冲进两极高空大气，产生极光。</p>
    <p class="q-n">→ 这段话本身就是一张<b>对应表</b>：<b>黑子→光球</b>、<b>耀斑和日珥→色球</b>、<b>太阳风→日冕</b>。
    而"影响"必须落到<b>三个具体对象</b>上：<b>电离层 / 地球磁场 / 两极高空大气</b>。
    只写"影响地球"四个字，一分不给。</p>
  </div>

  <p class="gx-h2s" style="margin-top:18px">三层大气 + 四种活动，一张表锁死（考太阳活动必查这张表）：</p>
  <div style="overflow-x:auto">
  <table class="gx-cmp">
    <thead><tr><th>层次</th><th>太阳活动</th><th>看起来是什么</th><th>对地球的主要影响</th></tr></thead>
    <tbody>
      <tr class="key"><td>光球</td><td><b>黑子</b></td><td>明亮的圆面上出现的暗斑（温度约 4000–4500 K，比周围低）</td><td>太阳活动<b>强弱的标志</b>，数量变化周期约 11 年</td></tr>
      <tr><td>色球</td><td><b>耀斑</b>、日珥</td><td>局部区域突然增亮 / 喷出的巨大火焰状气流</td><td>抛出高能带电粒子，<b>扰动电离层</b>，影响短波通信</td></tr>
      <tr><td>日冕</td><td><b>太阳风</b></td><td>高温使带电粒子挣脱引力，向外持续流动</td><td>到达地球后<b>扰动磁场产生磁暴</b>，并在两极产生<b>极光</b></td></tr>
    </tbody>
  </table>
  </div>

<section class="gx-sec" id="d">
  <h2><span class="sn">04</span>一道题走一遍</h2>
  <p class="gx-h2s">先自己读题干想 30 秒，再点"下一步"。每一步只推进一个判断。</p>

  <div class="gx-ex">
    <p class="ex-t">例题<span class="bdg bdg-must">必考</span></p>
    <p class="ex-q">2024 年 5 月，太阳表面出现一个巨大的黑子群，随后连续爆发多次强耀斑，
    大量高能带电粒子到达地球。<br><br>
    （1）指出黑子和耀斑分别出现在太阳大气的哪一层，并说明二者的关系。<br>
    （2）此次太阳活动可能对地球产生哪些影响？<br>
    （3）同期我国黑龙江、新疆等地出现极光，而海南没有。从太阳活动与地球磁场的角度解释原因。</p>

    <ol class="steps" id="gxSteps">
      <li class="step">
        <p class="s-h">第 1 步 · 先定位层次，这是送分题也是送命题</p>
        <p class="s-b"><b>黑子在光球层，耀斑在色球层。</b>记住对应关系就不会错：
        <b>光球—黑子、色球—耀斑和日珥、日冕—太阳风</b>。至于"关系"，
        教材的说法是<b>黑子和耀斑都是太阳活动的重要标志</b>，二者往往<b>相伴发生</b>——
        黑子多的年份，耀斑也频繁。</p>
        <p class="s-k">用到：太阳大气的分层与太阳活动的类型</p>
      </li>
      <li class="step" hidden>
        <p class="s-h">第 2 步 · 影响要分三条链，不要笼统写"干扰地球"</p>
        <p class="s-b">三条链对应三个对象：<b>①扰动电离层 → 影响无线电短波通信</b>；
        <b>②扰乱地球磁场 → 产生磁暴，指南针不能正确指示方向</b>；
        <b>③高能带电粒子冲进两极高空大气 → 产生极光</b>。
        如果题目分值高，还可以补：<b>干扰卫星、影响输电线路与导航</b>，
        以及<b>与部分自然灾害（如水旱灾害）存在一定相关性</b>。</p>
        <p class="s-k">用到：太阳活动对地球的影响</p>
      </li>
      <li class="step" hidden>
        <p class="s-h">第 3 步 · 极光为什么只在"高纬"出现</p>
        <p class="s-b">关键是<b>地球磁场</b>。地球磁场像一把伞，把带电粒子挡在外面；
        但<b>磁力线在两极附近汇聚并垂直穿入大气</b>，粒子就沿着磁力线"漏"进两极高空，
        与氧、氮分子碰撞发光。所以极光优先出现在<b>高磁纬地区</b>。</p>
        <p class="s-k">用到：地球磁场对带电粒子的作用</p>
      </li>
      <li class="step" hidden>
        <p class="s-h">第 4 步 · 黑龙江有、海南没有，怎么答才完整</p>
        <p class="s-b">不能只写"黑龙江纬度高"。完整的逻辑是：
        <b>极光带的位置由地磁活动强度决定</b>；此次磁暴特别强，<b>极光赤道侧边界被压到较低纬度</b>，

    function yOf(lat, C) { return C.cy - C.r * Math.sin(lat * Math.PI / 180); }
    function halfW(lat, C) { return C.r * Math.cos(lat * Math.PI / 180); }

    function tx(parent, x, y, s, col, anchor, size, weight, halo) {
      var o = { x: n1(x), y: n1(y), "font-size": (size || 10.5) * FS, fill: col,
                "text-anchor": anchor || "start", "font-weight": weight || 400 };
      if (halo) o["class"] = "halo";
      var t = el("text", o, parent);
      t.textContent = s;
      return t;
    }

    function build() {
      gE.textContent = ""; gI.textContent = "";
      var C = L.earth, I = L.info;

      /* ---- 地球 ---- */
      var defs = el("defs", {}, gE);
      var cp = el("clipPath", { id: "gxAurClip" }, defs);
      el("circle", { cx: n1(C.cx), cy: n1(C.cy), r: n1(C.r) }, cp);

      el("circle", { cx: n1(C.cx), cy: n1(C.cy), r: n1(C.r),
                     fill: "#eef6fb", stroke: "#7fb5c9", "stroke-width": 1.6 }, gE);

      /* 纬线 */
      [-60, -30, 30, 60].forEach(function (lat) {
        var y = yOf(lat, C), hw = halfW(lat, C);
        el("line", { x1: n1(C.cx - hw), y1: n1(y), x2: n1(C.cx + hw), y2: n1(y),
                     stroke: "#dbe7ef", "stroke-width": 1, "stroke-dasharray": "4 4" }, gE);
      });
      el("line", { x1: n1(C.cx - C.r), y1: n1(C.cy), x2: n1(C.cx + C.r), y2: n1(C.cy),
                   stroke: "#b8d8e8", "stroke-width": 1.2 }, gE);
      tx(gE, C.cx - C.r + 4, C.cy - 5, "赤道", "#8fb7d4", "start", 8);

      /* 地轴 */
      el("line", { x1: n1(C.cx), y1: n1(C.cy - C.r - 12), x2: n1(C.cx), y2: n1(C.cy + C.r + 12),
                   stroke: "#c9c2b0", "stroke-width": 1, "stroke-dasharray": "5 5" }, gE);
      tx(gE, C.cx, C.cy - C.r - 18, "北极", "#9aa3ae", "middle", 8.5);
      tx(gE, C.cx, C.cy + C.r + 18, "南极", "#9aa3ae", "middle", 8.5);

      /* 极光带（用裁剪的矩形表示球冠） */
      G.ncap = el("rect", { x: n1(C.cx - C.r), y: n1(C.cy - C.r), width: n1(2 * C.r),
                            height: 10, fill: "#5fbf8a", opacity: 0.55,
                            "clip-path": "url(#gxAurClip)" }, gE);
      G.scap = el("rect", { x: n1(C.cx - C.r), y: n1(C.cy + C.r - 10), width: n1(2 * C.r),
                            height: 10, fill: "#5fbf8a", opacity: 0.55,
                            "clip-path": "url(#gxAurClip)" }, gE);

      el("circle", { cx: n1(C.cx), cy: n1(C.cy), r: n1(C.r),
                     fill: "none", stroke: "#7fb5c9", "stroke-width": 1.6 }, gE);

      /* 北京纬线 */
      G.bj = el("line", { stroke: "#b8402f", "stroke-width": 1.8 }, gE);
      G.bjd = el("circle", { r: 3.4, fill: "#b8402f" }, gE);
      G.bjt = tx(gE, 0, 0, "北京 40°N", "#b8402f", "end", 9, 700, true);

      /* 边界标注 */
      G.eline = el("line", { stroke: "#2f8a5b", "stroke-width": 1.2,
                             "stroke-dasharray": "5 4" }, gE);
      G.et = tx(gE, 0, 0, "", "#1e6640", "start", 9, 700, true);

      /* ---- 右侧信息 ---- */
      var y0 = I.y0, bh = I.barH;
      tx(gI, I.x, y0, "太阳活动 → 地球的电磁环境", "#151a21", "start", 11.5, 700);

      tx(gI, I.x, y0 + 34, "短波通信质量", "#3a3a35", "start", 10, 700);
      el("rect", { x: n1(I.x), y: n1(y0 + 42), width: n1(I.w), height: bh, rx: 4,
                   fill: "#f2f4f6", stroke: "#e6e9ee" }, gI);
      G.qbar = el("rect", { x: n1(I.x), y: n1(y0 + 42), width: 10, height: bh, rx: 4, fill: "#2f8a5b" }, gI);
      G.qt = tx(gI, I.x + I.w, n1(y0 + 36), "", "#1e6640", "end", 10, 700);

      tx(gI, I.x, y0 + 92, "磁暴强度", "#3a3a35", "start", 10, 700);
      el("rect", { x: n1(I.x), y: n1(y0 + 100), width: n1(I.w), height: bh, rx: 4,
                   fill: "#f2f4f6", stroke: "#e6e9ee" }, gI);
      G.sbar = el("rect", { x: n1(I.x), y: n1(y0 + 100), width: 10, height: bh, rx: 4, fill: "#b8402f" }, gI);
      G.st = tx(gI, I.x + I.w, n1(y0 + 94), "", "#b8402f", "end", 10, 700);

      G.note = [];
      for (var k = 0; k < 4; k++) {
        G.note.push(tx(gI, I.x, 0, "", "#3a3a35", "start", 9.5));
      }
      G.verdict = tx(gI, I.x, 0, "", "#151a21", "start", 10.5, 700);
    }

    function render() {
      var C = L.earth, I = L.info;
      var phi = phiAt(S), yN = yOf(phi, C), capH = C.r - C.r * Math.sin(phi * Math.PI / 180);

      G.ncap.setAttribute("height", n1(capH));
      G.scap.setAttribute("y", n1(C.cy + C.r * Math.sin(phi * Math.PI / 180)));
      G.scap.setAttribute("height", n1(capH));

      /* 北京 */
      var yb = yOf(BJ, C), hwb = halfW(BJ, C);
      G.bj.setAttribute("x1", n1(C.cx - hwb));
      G.bj.setAttribute("y1", n1(yb));
      G.bj.setAttribute("x2", n1(C.cx + hwb));
      G.bj.setAttribute("y2", n1(yb));
      G.bjd.setAttribute("cx", n1(C.cx + hwb));
      G.bjd.setAttribute("cy", n1(yb));
      G.bjt.setAttribute("x", n1(C.cx - hwb - 6));
      G.bjt.setAttribute("y", n1(yb + 3));

      var inside = BJ >= phi;
      G.bj.setAttribute("stroke", inside ? "#2f8a5b" : "#b8402f");
      G.bj.setAttribute("stroke-width", inside ? 2.6 : 1.8);
      G.bjd.setAttribute("fill", inside ? "#2f8a5b" : "#b8402f");
      G.bjt.setAttribute("fill", inside ? "#1e6640" : "#b8402f");
      G.bjt.textContent = L === WIDE
        ? (inside ? "北京 40°N · 在极光带内" : "北京 40°N")
        : (inside ? "北京·带内" : "北京 40°N");

      /* 边界线 */
      var hwp = halfW(phi, C);
      G.eline.setAttribute("x1", n1(C.cx - hwp));
      G.eline.setAttribute("y1", n1(yN));
      G.eline.setAttribute("x2", n1(C.cx + hwp));
      G.eline.setAttribute("y2", n1(yN));
      G.et.setAttribute("x", n1(C.cx + hwp + 5));
      G.et.setAttribute("y", n1(yN + 3));
      G.et.textContent = "边界 " + phi.toFixed(0) + "°";

      /* 信息条 */
      var q = qAt(S), st = S;
      G.qbar.setAttribute("width", n1(Math.max(3, I.w * q / 100)));
      G.qbar.setAttribute("fill", q >= 60 ? "#2f8a5b" : (q >= 35 ? "#b8791f" : "#b8402f"));
      G.qt.textContent = Math.round(q) + "%";
      G.qt.setAttribute("fill", q >= 60 ? "#1e6640" : (q >= 35 ? "#8a5c14" : "#b8402f"));

      G.sbar.setAttribute("width", n1(Math.max(3, I.w * st / 100)));
      G.sbar.setAttribute("fill", st >= 70 ? "#b8402f" : (st >= 40 ? "#b8791f" : "#5a7f9b"));
      G.st.textContent = Math.round(st) + "%";

      var qs = q >= 85 ? "良好" : (q >= 60 ? "轻度受扰" : (q >= 35 ? "明显受扰" : "中断风险"));
      var ss = st < 20 ? "磁场平静" : (st < 45 ? "磁场活跃" : (st < 75 ? "发生磁暴" : "强磁暴"));

      var notes = [
        "· 电离层" + (st < 20 ? "稳定，反射层几乎不变" : (st < 45 ? "轻度扰动，高频段衰减" : "强烈扰动，可用频段变窄")),
        "· 地磁" + (st < 45 ? "基本正常，指南针可用" : "扰动明显，指南针可能偏差"),
        "· 极光" + (phi > 55 ? "只在极区可见" : (phi > 45 ? "高纬地区可见" : (phi > 40 ? "中高纬可见" : "可扩展到中纬")))
      ];
      var base = I.y0 + 150;
      var step = 24;
      for (var k = 0; k < 3; k++) {
        G.note[k].setAttribute("x", I.x);
        G.note[k].setAttribute("y", n1(base + k * step));
        G.note[k].textContent = notes[k];
      }
      G.verdict.setAttribute("x", I.x);
      G.verdict.setAttribute("y", n1(base + 3 * step + 4));
      G.verdict.textContent = "极光带：" + ss + "　|　通信：" + qs;
      G.verdict.setAttribute("fill", st >= 75 ? "#b8402f" : "#151a21");

      /* 数值卡 */
      vS.textContent = String(Math.round(S));
      vL.textContent = phi.toFixed(0) + "°";
      vC.textContent = qs;
      vSn.textContent = ss + (inside ? "　·　北京在极光带内" : "");
      if (box) {
        var col = q >= 60 ? "#1e6640" : (q >= 35 ? "#8a5c14" : "#b8402f");
        box.style.background = q >= 60 ? "#e6f6ee" : (q >= 35 ? "#fdf3e0" : "#fbeae7");
        box.style.borderColor = col + "44";
        var kv = box.querySelector(".v");
        if (kv) kv.style.color = col;
      }
      if (sl.value !== String(Math.round(S))) sl.value = String(Math.round(S));
    }

    function applyLayout() {
      var w = stage.parentElement.getBoundingClientRect().width;
      L = w >= WIDE.bp ? WIDE : NARROW;
      FS = L.FS;
      stage.setAttribute("viewBox", L.vb);
      build();
      render();
    }

    sl.addEventListener("input", function () { S = +this.value; render(); });
    $("gxP1").addEventListener("click", function () { S = 10; render(); });
    $("gxP2").addEventListener("click", function () { S = 40; render(); });
    $("gxP3").addEventListener("click", function () { S = 80; render(); });
    $("gxP4").addEventListener("click", function () { S = 100; render(); });

    function setFromY(clientY) {
      var bb = stage.getBoundingClientRect();
      var vbh = parseFloat(L.vb.split(" ")[3]);
      var yy = (clientY - bb.top) * (vbh / bb.height);
      var C = L.earth;
      var f = (yy - (C.cy - C.r)) / (2 * C.r);
      S = Math.max(0, Math.min(100, Math.round(f * 100)));
      render();
    }
    stage.addEventListener("pointerdown", function (ev) {
      dragging = true;
      try { stage.setPointerCapture(ev.pointerId); } catch (e) {}
      setFromY(ev.clientY);
    });
    stage.addEventListener("pointermove", function (ev) {
      if (!dragging) return;
      ev.preventDefault();
      setFromY(ev.clientY);
    });
    ["pointerup", "pointercancel"].forEach(function (e) {
      stage.addEventListener(e, function () { dragging = false; });
    });
    window.addEventListener("blur", function () { dragging = false; });
    stage.addEventListener("keydown", function (ev) {
      if (ev.key === "ArrowLeft" || ev.key === "ArrowRight") {
        ev.preventDefault();
        S = Math.max(0, Math.min(100, S + (ev.key === "ArrowRight" ? 2 : -2)));
        render();
      }
    });

    var tmr = null;
    window.addEventListener("resize", function () {
      clearTimeout(tmr);
      tmr = setTimeout(applyLayout, 180);
    });

    applyLayout();
  })();
});

</script>
</body>
</html>
