<p class="gx-lede">这一节考两件事：一是交通运输布局<b>由哪几样东西组成</b>，二是<b>三类因素</b>怎么分工。
最容易丢分的是把答案写成“自然条件复杂所以难修”——自然只决定<b>代价</b>，
真正决定“修不修、先修哪条”的是<b>区域发展水平</b>（需求、资金、技术三个条件）。
青藏铁路 2006 年才全线通车，京沪高铁 2011 年就开通，差别不在山高，在<b>需求和钱</b>。</p>

<!-- ================= A ================= -->
<section class="gx-sec" id="a">
  <h2><span class="sn">01</span>课本怎么说</h2>
  <p class="gx-h2s">先背标准表述，再看解释。顺序反了，答题时就写不出术语。</p>

  <div class="gx-quote">
    <p class="q-t">课本要点 · 交通运输布局的组成<span class="q-src">人教版（2019）必修第二册 · 第四章第一节</span></p>
    <p class="q-b">交通运输布局，是指各种运输方式的线路、站点（车站、港口、机场）以及由它们连接而成的运输网络，在地域上的空间分布与组合。</p>
    <p class="q-n">→ 这句话拆开正好是<b>三样东西</b>：<b>线</b>（铁路、公路、航道、管道）、
    <b>点</b>（车站、港口、机场、枢纽）、<b>网</b>（点线连成的整体，分等级、有密度）。
    判断“某地交通布局好不好”，就要这三样都看——只数“有没有路”，一定漏分。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本要点 · 影响交通运输布局的因素<span class="q-src">人教版（2019）必修第二册 · 第四章第一节</span></p>
    <p class="q-b">交通运输布局受自然因素、社会经济因素和技术因素的共同影响。自然因素提供基础条件与限制；社会经济因素决定布局的必要性与规模；技术因素使布局突破自然障碍成为可能。</p>
    <p class="q-n">→ <b>三类因素各管一件事</b>：自然管“<b>代价</b>”，社会经济管“<b>要不要</b>”，技术管“<b>能不能</b>”。
    只写“沿线自然条件复杂”最多拿三分之一分；三类各写一句，才是完整答案。
    这也是本节的<b>答题框架</b>，任何“分析某工程区位条件”的题都套它。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本要点 · 区域发展水平怎么起作用<span class="q-src">人教版（2019）必修第二册 · 第四章第一节</span></p>
    <p class="q-b">区域发展水平越高，运输需求越大，可用于交通建设的资金越多，技术水平也越高，交通运输布局就越完善；交通运输布局的改善，又会反过来促进区域发展。</p>
    <p class="q-n">→ 一句话：区域发展水平同时给出了<b>需求、资金、技术三个条件</b>。
    三个条件齐了，工程才排得上日程。这就是为什么东部高铁能先成网，
    而青藏铁路要等到 2006 年才全线通车——不是山没变矮，是<b>钱和技术到位了</b>。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本要点 · 三个必须记住的工程<span class="q-src">人教版（2019）必修第二册 · 第四章第一节</span></p>
    <p class="q-b">青藏铁路要克服多年冻土、高寒缺氧、生态脆弱三大难题；港珠澳大桥采用桥、岛、隧集群方案跨越伶仃洋；京沪高铁在人口稠密、经济发达的东部平原上建成。</p>
    <p class="q-n">→ 三个案例各代表一种“<b>卡点</b>”：青藏铁路卡在<b>自然</b>（冻土、缺氧、生态），
    港珠澳大桥卡在“<b>要给船和飞机让路</b>”，京沪高铁卡在“<b>人多地少、还不能停运</b>”。
    答题时先认出卡点，再写解法，比背一串工程名有用得多。</p>
  </div>

  <p class="gx-h2s" style="margin-top:18px">三类因素分工表（这张表就是答题提纲）：</p>
  <div style="overflow-x:auto">
  <table class="gx-cmp">
    <thead><tr><th>因素</th><th>管什么</th><th>典型表现</th><th>答题句式</th></tr></thead>
    <tbody>
      <tr><td>自然</td><td><b>代价</b></td><td>冻土、缺氧、台风、通航、地震</td><td>“沿线多冻土，路基易融沉，造价高”</td></tr>
      <tr><td>社会经济</td><td><b>要不要 · 多大规模</b></td><td>运输需求、资金、政策、国防</td><td>“区域发展水平高，客货流量大，资金充足”</td></tr>
      <tr class="key"><td>技术</td><td><b>能不能</b></td><td>热棒、隧道、无砟轨道、列控</td><td>“以桥代路、热棒降温，把冻土难题控制住”</td></tr>
    </tbody>
  </table>
  </div>
  <p class="gx-note">三行是<b>并列</b>关系，不是“自然最重要”。题目问“分析区位条件”时，
  三行各写一句＝结构分到手；只写一行，写得再长也补不回来。
  高亮那一行是学生最常漏的：<b>技术不是背景，是采分点</b>。</p>
</section>

    <p class="ex-q">青藏铁路格尔木至拉萨段全长 1142 km，穿越青藏高原，于 2006 年建成通车。
    <b>分析该段铁路建设的主要区位条件。（10 分）</b><br>
    <span style="color:#5a6472;font-size:12.5px">提示：10 分通常要答到自然、社会经济、技术三个方面，只写“自然条件恶劣”拿不到一半。</span></p>

    <ol class="steps" id="gxSteps">
      <li class="step">
        <p class="s-h">第 1 步 · 先拆题：区位条件 = 自然 + 社会经济 + 技术</p>
        <p class="s-b">看到“分析区位条件”，先在草稿上写三栏标题。这一节的三类因素就是三栏的名字：
        <b>自然</b>写卡点，<b>社会经济</b>写为什么必须修，<b>技术</b>写怎么修成。
        三栏都写到，结构分先保住。</p>
        <p class="s-k">用到：影响交通运输布局的三类因素</p>
      </li>
      <li class="step" hidden>
        <p class="s-h">第 2 步 · 自然：以不利为主，但要写具体</p>
        <p class="s-b">沿线<b>海拔高、气温低、氧气少</b>（高寒缺氧，施工人员作业困难）；
        <b>多年冻土</b>广布，路基受热会融沉、变形；<b>生态脆弱</b>，植被一旦破坏极难恢复；
        还有<b>地形起伏、地震与崩塌</b>等灾害。
        结论写“<b>自然条件差，工程难度大、造价高</b>”，而不是“自然条件差所以不能修”。</p>
        <p class="s-k">用到：自然因素（气候、地形、冻土、生态）</p>
      </li>
      <li class="step" hidden>
        <p class="s-h">第 3 步 · 社会经济：为什么非修不可</p>
        <p class="s-b">西藏与内地之间<b>人员和物资运输需求大</b>，公路运输成本高、受季节影响大；
        修铁路能<b>降低运输成本、带动资源开发与旅游</b>；还有<b>加强民族团结、巩固国防、促进边疆发展</b>的作用；
        国家有<b>资金和政策支持</b>（西部大开发）。这一段是“必要性 + 可能性”。</p>
        <p class="s-k">用到：社会经济因素（需求、资金、政策、国防）</p>
      </li>
      <li class="step" hidden>
        <p class="s-h">第 4 步 · 技术：把“不能建”变成“贵一点能建”</p>
        <p class="s-b">针对冻土用<b>片石通风路基</b>（让冷空气进、热量出）和<b>热棒</b>（主动降温，保持地基冻结）；
        部分路段<b>以桥代路</b>，减少对冻土和草皮的扰动；列车配<b>供氧设备</b>，解决高寒缺氧；
        施工避开生态敏感区并做<b>植被恢复</b>。技术没有消除冻土，只是把它的危害<b>控制住</b>。</p>
        <p class="s-k">用到：技术因素（工程措施对自然障碍的改造）</p>
      </li>
    </ol>

    <div class="exbar">
      <button id="gxNext" type="button">下一步</button>
      <span class="cnt" id="gxCnt">1 / 4</span>
    </div>

    <div class="ans" id="gxAns" hidden>
      <p class="ans-t">标准答案（可抄进答题卡）</p>
      <p class="ans-b">
      ① <b>自然条件</b>：沿线高寒缺氧、多年冻土广布、生态脆弱，地形地质条件复杂，工程难度大、造价高。<br>
      ② <b>社会经济条件</b>：西藏与内地运输需求大，公路运价高、受季节限制；铁路可降低运输成本，带动资源开发、旅游和边疆经济发展；有加强民族团结、巩固国防的意义；国家资金与西部大开发政策支持。<br>
      ③ <b>技术条件</b>：片石通风路基、热棒降温、以桥代路、列车供氧等措施，使冻土与缺氧问题得到控制，把自然障碍转化为可控的工程成本。<br>
      ④ <b>结论</b>：自然条件不利是<b>限制</b>，社会经济需求是<b>动力</b>，技术是<b>保障</b>；三者共同决定该铁路能够建成。</p>
    </div>
  </div>
</section>

<!-- ================= E ================= -->
<section class="gx-sec" id="e">
  <h2><span class="sn">05</span>会怎么考</h2>
  <p class="gx-h2s">六问，覆盖定义辨析、反直觉、易错点和极端情况。每问都配一张小图。</p>

  <div class="gx-qa">
    <div class="qac">
      <p class="q">「交通运输布局就是修路吗？」</p>
      <p class="a"><b>不是。</b>布局包括<b>线</b>（铁路、公路、航道、管道）、<b>点</b>（车站、港口、机场、枢纽）
      和由它们连成的<b>网</b>。只修一条线、不建站，货装不上也卸不下；
      节点位置选错，整条线的效率都会被拖住。</p>
      <svg viewBox="0 0 240 132" role="img" aria-label="线路、节点、网络三者缺一不可">
        <line x1="24" y1="56" x2="216" y2="56" stroke="#b8791f" stroke-width="2.6"/>
        <g fill="#fff" stroke="#0891b2" stroke-width="2"><circle cx="60" cy="56" r="6"/><circle cx="120" cy="56" r="6"/><circle cx="180" cy="56" r="6"/></g>
        <circle cx="120" cy="56" r="15" fill="none" stroke="#b8402f" stroke-width="1.4" stroke-dasharray="4 3"/>
        <text class="ms" x="120" y="28" text-anchor="middle">线 + 点 + 网</text>
        <text class="ms" x="120" y="98" text-anchor="middle" fill="#b8402f">只修线不建站</text>
        <text class="ms" x="120" y="116" text-anchor="middle" fill="#b8402f">线也用不上</text>
      </svg>
    </div>

    <div class="qac">
      <p class="q">「自然条件差就修不了铁路？」</p>
      <p class="a"><b>不是。</b>自然条件决定的是<b>代价</b>，不是<b>结论</b>。
      青藏铁路在多年冻土上建成，靠的是热棒、片石路基、以桥代路。
      “修不了”要改成“<b>造价高、工期长、需要专门技术</b>”——这才是能得分的表述。</p>
      <svg viewBox="0 0 240 132" role="img" aria-label="自然条件差时技术可以降低建设代价">
        <path d="M 14 98 L 52 40 L 82 74 L 112 30 L 146 78 L 176 46 L 226 98 Z" fill="#efece2" stroke="#b9b3a6"/>
        <path d="M 112 30 L 124 52 L 100 52 Z" fill="#fff"/>
        <line x1="14" y1="100" x2="226" y2="100" stroke="#b8791f" stroke-width="2.4"/>
        <text class="ms" x="120" y="118" text-anchor="middle">自然给的是“代价”</text>
        <text class="ms" x="120" y="18" text-anchor="middle" fill="#1e6640">技术决定“付不付得起”</text>
      </svg>
    </div>

    <div class="qac">
      <p class="q">「为什么东部高铁都成网了，青藏铁路却很晚才通车？」</p>
      <p class="a">因为建设要<b>同时</b>具备三个条件：<b>需求</b>够大、<b>资金</b>够多、<b>技术</b>够用。
      东部的需求密度和财力先到了，高铁网就先长出来；青藏铁路的难度和造价，要等国家财力和冻土技术都到位。
      <b>不是地理上“该修”就会修，而是条件齐了才修。</b></p>
      <svg viewBox="0 0 240 132" role="img" aria-label="需求、资金、技术三个条件同时具备才开工">
        <rect x="20" y="26" width="60" height="34" rx="6" fill="#ecfbff" stroke="#7fb5c9"/>
        <rect x="90" y="26" width="60" height="34" rx="6" fill="#fdf8ec" stroke="#d9a832"/>
        <rect x="160" y="26" width="60" height="34" rx="6" fill="#f6fbf8" stroke="#9cc3a4"/>
        <text class="ms" x="50" y="48" text-anchor="middle" fill="#0b6580">需求</text>
        <text class="ms" x="120" y="48" text-anchor="middle" fill="#8a5c14">资金</text>
        <text class="ms" x="190" y="48" text-anchor="middle" fill="#1e6640">技术</text>
        <text class="ms" x="120" y="88" text-anchor="middle">三者齐了，工程才排上日程</text>
        <text class="ms" x="120" y="112" text-anchor="middle" fill="#b8402f">少一个，就得等</text>
      </svg>
    </div>

    <div class="qac">
      <p class="q">「港珠澳大桥为什么有一段要钻到海底去？」</p>
      <p class="a">因为这一段海面<b>既要过大船，又靠近机场</b>：桥面太高会挡住飞机起降，
      桥墩太低会卡住主航道，台风又多。所以改成<b>桥—岛—隧</b>组合：
      远处架桥，中间 6.7 km 沉入海底，两端用人工岛衔接。
      <b>不是技术炫技，是被“通航 + 限高”逼出来的方案。</b></p>
      <svg viewBox="0 0 240 132" role="img" aria-label="港珠澳大桥中间一段为海底隧道">
        <rect x="16" y="54" width="208" height="50" fill="#eef6fb" stroke="#cfe0ec"/>
        <path d="M 16 68 H 92" stroke="#b8791f" stroke-width="2.4"/>
        <path d="M 148 68 H 224" stroke="#b8791f" stroke-width="2.4"/>
        <path d="M 92 68 Q 120 104 148 68" fill="none" stroke="#2f8a5b" stroke-width="2.2" stroke-dasharray="5 4"/>
        <rect x="84" y="60" width="10" height="8" rx="2" fill="#e8f2e8" stroke="#9cc3a4"/>
        <rect x="146" y="60" width="10" height="8" rx="2" fill="#e8f2e8" stroke="#9cc3a4"/>
        <text class="ms" x="120" y="28" text-anchor="middle">船要过 · 飞机限高</text>
        <text class="ms" x="120" y="122" text-anchor="middle" fill="#1e6640">中间一段钻进海底</text>
      </svg>
    </div>

    <div class="qac">
      <p class="q">「同样一笔钱，先修高铁还是先修公路？」</p>
      <p class="a">看<b>需求密度</b>：人口和客流密集、距离又长的通道，高铁效益高；
      地广人稀、点分散的地方，公路覆盖面大、更划算。
      判据不是“哪个技术先进”，而是<b>“有多少人、多少货要走”</b>——这仍然是区域发展水平在说话。</p>
      <svg viewBox="0 0 240 132" role="img" aria-label="按需求密度选择高铁或公路">
        <text class="ms" x="120" y="24" text-anchor="middle" fill="#0b6580">钱先花在哪</text>
        <rect x="22" y="40" width="92" height="46" rx="7" fill="#ecfbff" stroke="#7fb5c9"/>
        <rect x="126" y="40" width="92" height="46" rx="7" fill="#fdf8ec" stroke="#d9a832"/>
        <text class="ms" x="68" y="60" text-anchor="middle" fill="#0b6580">人口密、客流大</text>
        <text class="ms" x="68" y="78" text-anchor="middle" font-weight="700" fill="#0b6580">修高铁</text>
        <text class="ms" x="172" y="60" text-anchor="middle" fill="#8a5c14">地广人稀</text>
        <text class="ms" x="172" y="78" text-anchor="middle" font-weight="700" fill="#8a5c14">修公路</text>
        <text class="ms" x="120" y="112" text-anchor="middle">判据是“需求密度”</text>
        <text class="ms" x="120" y="128" text-anchor="middle" fill="#5a6472">不是“技术高低”</text>
      </svg>
    </div>

    <div class="qac">
      <p class="q">「交通线越密越好吗？」</p>
      <p class="a"><b>不是。</b>需求跟不上，线路就闲置；线路多了还要<b>占地、切割生态、花钱养护</b>。
      所以评价布局好坏的标准是“<b>与需求匹配</b>”，不是“密度越大越好”。
      答题写“进一步完善交通网”时，最好加一句“<b>与区域运输需求相适应</b>”。</p>
      <svg viewBox="0 0 240 132" role="img" aria-label="交通线过多会闲置，还会带来生态与养护成本">
        <g stroke="#b8791f" stroke-width="1.6">
          <line x1="20" y1="34" x2="220" y2="34"/><line x1="20" y1="52" x2="220" y2="52"/>
          <line x1="20" y1="70" x2="220" y2="70"/><line x1="20" y1="88" x2="220" y2="88"/>
        </g>
        <text class="ms" x="120" y="24" text-anchor="middle">线越铺越多</text>
        <text class="ms" x="120" y="110" text-anchor="middle" fill="#b8402f">需求不足 → 闲置</text>
        <text class="ms" x="120" y="128" text-anchor="middle" fill="#b8402f">还有生态与养护成本</text>
      </svg>
    </div>

  </div>
  <p class="gx-note">这六问其实是同一句话：<b>先问“有没有需求”，再问“付不付得起”，最后问“怎么修”</b>。
  任何“分析某交通工程”的题，都从这三步往下走，顺序别倒。</p>
</section>

<section class="gx-sec" id="f">
  <h2><span class="sn">06</span>易错清单</h2>
  <p class="gx-h2s">左边是考试里真的会写出来的错句，右边是应该写的样子。后者可以直接背。</p>

  <div style="overflow-x:auto;margin-bottom:16px">

    <thead><tr><th>工程</th><th>主要障碍</th><th>关键技术</th><th>一句话意义</th></tr></thead>

      <tr><td>青藏铁路</td><td>多年冻土、高寒缺氧、生态脆弱</td><td>片石路基、热棒、以桥代路</td><td>西藏接入全国铁路网</td></tr>
      <tr class="key"><td>港珠澳大桥</td><td>主航道通航、机场限高、台风</td><td>桥—岛—隧集群（隧道 6.7 km）</td><td>珠海到香港约 45 分钟</td></tr>

  </div>

  <div class="gx-errs">
    <div class="er">
      <p class="er-x">✗ 自然条件决定交通运输布局</p>
      <p class="er-v">✓ 自然只决定<b>代价</b>；<b>社会经济</b>决定要不要建，<b>技术</b>决定能不能建</p>

    </div>
    <div class="er">
      <p class="er-x">✗ 有了技术，什么自然障碍都能消除</p>

      <p class="er-w">错在哪：热棒只是让地基保持冻结，冻土还在；台风、地震也依然要设防。技术抬高的是“可支付上限”。</p>
    </div>
    <div class="er">
      <p class="er-x">✗ 交通线修得越密越好</p>

    </div>
    <div class="er">

      <p class="er-x">✗ 交通运输布局只受自然条件影响，与区域发展无关</p>
      <p class="er-v">✓ <b>区域发展水平</b>决定运输需求、资金和技术，从而决定布局</p>
      <p class="er-w">错在哪：把交通当成纯工程问题。先有需求和钱，才谈得上修哪条、修多快。</p>
