<!-- ================= A ================= -->
<section class="gx-sec" id="a">
  <h2><span class="sn">01</span>课本怎么说</h2>
  <p class="gx-h2s">先背标准表述，再看解释。顺序反了，答题时就写不出术语。</p>

  <div class="gx-quote">
    <p class="q-t">课本要点 · 工业区位因素<span class="q-src">人教版（2019）必修第二册 · 第三章第二节</span></p>
    <p class="q-b">影响工业生产的区位因素主要有原料、动力、劳动力、市场、交通运输、技术、政策、环境等。</p>
    <p class="q-n">→ 一共 <b>8 个</b>，可以分三组记：<b>原料与动力</b>（越靠近越省运费、省电费）、
    <b>市场与交通</b>（决定产品卖给谁、怎么运）、<b>技术、政策、环境</b>（越来越重要）。
    答题时按组写，比逐个罗列更像"分析"。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本要点 · 五种导向型<span class="q-src">人教版（2019）必修第二册 · 第三章第二节</span></p>
    <p class="q-b">根据影响工业区位的主导因素，工业可分为原料导向型、市场导向型、动力导向型、劳动力导向型和技术导向型。</p>
    <p class="q-n">→ <b>5 种类型，判据只有一句</b>：哪种成本占比最高、最不方便搬，工厂就靠近谁。
    注意"导向"说的是<b>选址倾向</b>，不是说其他因素不存在——饮料厂也要交通，只是市场更"卡"。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">延伸工具 · 原料指数<span class="q-src">人教版（2019）必修第二册 · 第三章第二节（拓展）<span class="bdg bdg-ext">延伸</span></span></p>
    <p class="q-b">原料指数 = 原料重量 ÷ 产品重量。原料指数大于 1 的为失重原料，工业宜靠近原料地；小于 1 的为增重原料，工业宜靠近市场。</p>
    <p class="q-n">→ 这是把"失重、增重"变成<b>一个除法</b>：<b>M &gt; 1 靠原料地，M &lt; 1 靠市场</b>。
    甘蔗制糖 M ≈ 8（8 吨甘蔗出 1 吨糖），啤酒 M ≈ 0.1，所以糖厂在田间、啤酒厂在城市。
    注意它<b>只算运费</b>，不解释电费和技术费——这一点下面会考。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本要点 · 工业区位因素的变化<span class="q-src">人教版（2019）必修第二册 · 第三章第二节</span></p>
    <p class="q-b">随着科技进步和交通运输的发展，原料、动力对工业区位的影响逐渐减弱，市场、交通、技术的影响不断增强；环境因素也越来越受到重视。</p>
    <p class="q-n">→ 一句话记"<b>两个减弱、三个增强、一个变严</b>"。钢铁工业从"煤铁复合型"到"临海型"再到"市场型"，
    就是这三个增强（市场、交通、技术）把工厂一步步从矿山边拉到了海边和城市边。</p>
  </div>

  <p class="gx-h2s" style="margin-top:18px">算一算：原料指数告诉你"运费该靠谁"，但不一定等于最终选址——</p>
  <div style="overflow-x:auto">
  <table class="gx-cmp">
    <thead><tr><th>产品</th><th>原料指数 M</th><th>只看运费该靠谁</th><th>实际主导因素</th></tr></thead>
    <tbody>
      <tr><td>甘蔗制糖</td><td>约 8（8 吨甘蔗 → 1 吨糖）</td><td>原料地</td><td>原料导向</td></tr>
      <tr><td>啤酒</td><td>约 0.1</td><td>市场</td><td>市场导向</td></tr>
      <tr class="key"><td>电解铝</td><td>约 1.9（按氧化铝计）</td><td>原料地</td><td><b>动力导向</b>（电费比运费更贵）</td></tr>
      <tr><td>芯片</td><td>远小于 1</td><td>市场</td><td><b>技术导向</b>（研发比运费更贵）</td></tr>
    </tbody>
  </table>
  </div>
  <p class="gx-note">这张表的用法：<b>先用原料指数判断"运费指向"，再看哪种成本占大头</b>。
  两种判断冲突时，听成本占比最大的那一个——这就是"主导因素"的真正含义。</p>
</section>

  <h2><span class="sn">04</span>一道题走一遍</h2>

    <p class="ex-q">某企业集团拟分别建设<b>炼铝厂、瓶装饮料厂、芯片厂</b>各一座。
    <b>请指出三者各自的主导区位因素，并说明布局原则。（9 分）</b><br>
    <span style="color:#5a6472;font-size:12.5px">提示：9 分通常每个厂 3 分——主导因素、理由、布局原则各 1 分。</span></p>

    <ol class="steps" id="gxSteps">
      <li class="step">
        <p class="s-h">第 1 步 · 先判断"哪项成本最大"</p>
        <p class="s-b">三个厂的成本结构完全不同：炼铝<b>电费</b>占大头（电解铝耗电极高）；
        瓶装饮料<b>水和瓶子都重</b>，运费占大头；芯片<b>研发</b>占大头，原料几乎没重量。
        所以它们分别指向<b>动力、市场、技术</b>。</p>
        <p class="s-k">用到：五种导向型的判断依据（主导因素 = 成本占比最大的那一项）</p>
      </li>
      <li class="step" hidden>
        <p class="s-h">第 2 步 · 炼铝厂：动力导向</p>
        <p class="s-b">电解铝要消耗大量电力（一吨铝约需一万多度电，示意量级），电费比运费贵得多。
        所以炼铝厂<b>靠近水电站、火电基地</b>（如云南、新疆、内蒙古），
        而不是靠近铝土矿——这就是"原料指数大、却不靠原料"的典型。</p>
        <p class="s-k">用到：动力导向型 + 原料指数的局限</p>
      </li>
      <li class="step" hidden>
        <p class="s-h">第 3 步 · 饮料厂：市场导向</p>
        <p class="s-b">饮料里九成是水，瓶子、箱子又沉又占体积，<b>运成品比运原料贵得多</b>（原料指数小于 1）。
        所以瓶装厂<b>靠近城市市场</b>，同时要靠近<b>清洁水源</b>和公路，供货半径通常只有几百公里。</p>
        <p class="s-k">用到：市场导向型 + 增重原料</p>
      </li>
      <li class="step" hidden>
        <p class="s-h">第 4 步 · 芯片厂：技术导向，还要交通和环境</p>
        <p class="s-b">芯片的原料（硅片）很轻，运费几乎可以忽略，<b>值钱的是设计和工艺</b>。
        所以芯片厂靠近<b>高校、科研机构</b>和<b>机场</b>（空运、人才往来），并要求<b>环境洁净</b>。

        <p class="s-k">用到：技术导向型 + 环境因素</p>
      </li>

      <b>② 瓶装饮料厂：市场导向型。</b>产品以水为主、瓶箱重，运输成本高（原料指数小于 1）；
      应布局在<b>城市市场附近</b>，同时靠近清洁水源和交通线。<br>
      <b>③ 芯片厂：技术导向型。</b>研发和工艺占成本比重最高，原料运费可忽略；
      应布局在<b>高校和科研机构密集、机场附近、环境洁净</b>的地区。<br>
      <b>结论：</b>三座厂分别对应动力、市场、技术三种导向，判断依据都是"<b>哪项成本占比最大、最难搬运</b>"。

      <p class="a"><b>不是。</b>判据是<b>产品重、体积大、易碎、不耐储</b>，运起来比原料贵。

      <p class="a"><b>不只看工资。</b>还要看<b>数量、技能、稳定性</b>：工资低但招不到人、工人干两个月就走，
      培训成本反而更高。现在自动化也在替代部分流水线岗位。</p>
      <svg viewBox="0 0 240 132" role="img" aria-label="劳动力导向不只看工资，还要看技能和稳定性">

<script>
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var sl = document.getElementById("indSl");
  if (!sl) return;

  var X0 = 40, X1 = 400, MMIN = 0.2, MMAX = 5;
  function xOf(m) { return X0 + (m - MMIN) / (MMAX - MMIN) * (X1 - X0); }

  var fac = document.getElementById("indFactory");
  var facT = document.getElementById("indFactoryT");
  var mark = document.getElementById("indMark");
  var read = document.getElementById("indRead");
  var slv = document.getElementById("indSlv");
  var v1 = document.getElementById("indV1");
  var v2 = document.getElementById("indV2");
  var v3 = document.getElementById("indV3");
  var w3 = document.getElementById("indW3");
  var B = [document.getElementById("indB0"), document.getElementById("indB1"), document.getElementById("indB2")];

  function render() {
    var m = parseFloat(sl.value);
    if (!isFinite(m)) m = 1;
    var t = (m - MMIN) / (MMAX - MMIN);
    var fx = 280 - t * 130;

    fac.setAttribute("x", (fx - 24).toFixed(1));
    facT.setAttribute("x", fx.toFixed(1));
    mark.setAttribute("cx", xOf(m).toFixed(1));
    read.textContent = "M = " + m.toFixed(1);
    slv.textContent = m.toFixed(1);

    B[0].setAttribute("opacity", m < 0.8 ? ".95" : ".28");
    B[1].setAttribute("opacity", (m >= 0.8 && m <= 1.2) ? ".95" : ".28");
    B[2].setAttribute("opacity", m > 1.2 ? ".95" : ".28");

    v1.textContent = m.toFixed(1);
    v2.textContent = m.toFixed(1) + " t";

    if (m > 1.2) {
      v3.textContent = "原料导向";
      v3.style.color = "#8a5c14";
      w3.textContent = "失重原料：靠近原料地建厂";
    } else if (m < 0.8) {
      v3.textContent = "市场导向";
      v3.style.color = "#0b6580";
      w3.textContent = "增重原料：靠近市场建厂";
    } else {
      v3.textContent = "两者之间";
      v3.style.color = "#5a6472";
      w3.textContent = "运费差别不大：看地价、政策、劳动力";
    }
  }

  sl.addEventListener("input", render);
  render();
});
</script>
