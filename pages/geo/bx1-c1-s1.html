<p class="gx-claim">地球之所以特别，不是因为它特殊，而是因为它<b>在太阳系里站对了位置、又长对了体重</b>。</p>
<div class="gx-meta">
  <span><i></i>人教版必修第一册 第一章第一节</span>
  <span><i></i>高一 · 宇宙中的地球</span>
  <span><i></i>阅读 13 分钟</span>

</div>
<p class="gx-lede">这一节只考两件事：一是<b>天体系统的四级套娃</b>（谁包含谁、各多大），
二是<b>地球为什么有生命</b>。后者必须分成<b>外部条件</b>和<b>自身条件</b>两栏答——
混成一段写，采分点就丢一半。
而"自身条件"那三条，本质上是<b>两个数字</b>决定的：<b>日地距离</b>定温度，<b>质量体积</b>定大气。</p>

<section class="gx-sec" id="a">
  <h2><span class="sn">01</span>课本怎么说</h2>
  <p class="gx-h2s">先背标准表述，再看解释。顺序反了，答题时就写不出术语。</p>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 宇宙与天体<span class="q-src">人教版（2019）必修第一册 · 第一章第一节</span></p>
    <p class="q-b">宇宙是时间和空间的统一体，是运动、发展和变化着的物质世界。宇宙中的物质以多种形式存在，如星云、恒星、行星、卫星、彗星、流星体、星际物质等，这些物质统称为天体。</p>
    <p class="q-n">→ 判断"是不是天体"只有<b>一条铁律</b>：<b>它是否独立存在于宇宙空间之中</b>。
    按这条铁律，<b>待发射的航天器不是天体</b>（还在地面上），<b>进入轨道的才是</b>；
    <b>流星体是天体</b>（在太空中运行），而<b>流星现象</b>（发光的那道光）和<b>陨石</b>（落到地面的残骸）
    <b>都不是</b>——它们已经不是"独立存在于宇宙空间"的东西了。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 天体系统<span class="q-src">人教版（2019）必修第一册 · 第一章第一节</span></p>
    <p class="q-b">宇宙中的天体都在运动着。运动中的天体相互吸引、相互绕转，形成天体系统。天体系统有不同的级别。</p>
    <p class="q-n">→ 关键词是<b>"相互吸引、相互绕转"</b>——光有"一堆天体"不算系统，必须<b>绕着一个中心转</b>。
    级别从大到小是四级：<b>可观测宇宙 → 银河系（与河外星系同级）→ 太阳系 → 地月系</b>。
    注意<b>河外星系不是银河系的一部分</b>，它和银河系是<b>同一级</b>的兄弟。</p>
  </div>

  <div class="gx-quote">
    <p class="q-t">课本原话 · 地球的普通性与特殊性<span class="q-src">人教版（2019）必修第一册 · 第一章第一节</span></p>
    <p class="q-b">地球是太阳系中一颗普通的行星。它与太阳系其他行星在运动特征和结构特征上有很多相似之处。地球是太阳系中唯一存在生命的行星，这与地球所处的宇宙环境以及地球自身的条件密切相关。</p>
    <p class="q-n">→ 这句话本身就是<b>答题模板</b>：先说"<b>普通</b>"（运动特征 + 结构特征相似），
    再说"<b>特殊</b>"（唯一有生命），而"特殊"的原因必须拆成<b>外部（宇宙环境）</b>和<b>自身（自身条件）</b>两部分。
    <b>顺序不能反</b>：先证明它不特殊，再说它为什么偏偏特殊——这是这套题的逻辑骨架。</p>
  </div>

  <p class="gx-h2s" style="margin-top:18px">八大行星的家底（考试常给这种表让你分析，数字不用背，<b>排序要记住</b>）：</p>
  <div style="overflow-x:auto">
  <table class="gx-cmp">
    <thead><tr><th>行星</th><th>距日（AU）</th><th>公转周期</th><th>分类</th><th>表面均温</th></tr></thead>
    <tbody>
      <tr><td>水星</td><td>0.39</td><td>88 天</td><td>类地行星</td><td>约 167 ℃</td></tr>
      <tr><td>金星</td><td>0.72</td><td>225 天</td><td>类地行星</td><td>约 464 ℃</td></tr>
      <tr class="key"><td>地球</td><td>1.00</td><td>365 天</td><td>类地行星</td><td>约 15 ℃</td></tr>
      <tr><td>火星</td><td>1.52</td><td>687 天</td><td>类地行星</td><td>约 −63 ℃</td></tr>
      <tr><td>木星</td><td>5.20</td><td>11.9 年</td><td>巨行星</td><td>约 −110 ℃</td></tr>
      <tr><td>土星</td><td>9.58</td><td>29.5 年</td><td>巨行星</td><td>约 −140 ℃</td></tr>
      <tr><td>天王星</td><td>19.2</td><td>84 年</td><td>远日行星</td><td>约 −195 ℃</td></tr>

        st = "偏离：太冷"; sn = "在宜居带外侧，水多以固态存在"; col = "#3f6f92"; bg = "#eef6fb";
      } else {
        st = "在宜居带内"; sn = "温度范围允许液态水长期存在"; col = "#1e6640"; bg = "#e6f6ee";
      }
      if (Math.abs(A - 1) < 0.012) { st = "地球：在宜居带内"; sn = "但靠近内边缘——再近一点就太热了"; }
      vSn.textContent = sn;
      if (box) {
        box.style.background = bg;
        box.style.borderColor = col + "44";
        var kv = box.querySelector(".v");
        if (kv) kv.style.color = col;
      }
      if (sl.value !== String(A)) sl.value = String(A);
    }

    function applyLayout() {
      var w = stage.parentElement.getBoundingClientRect().width;
      L = w >= WIDE.bp ? WIDE : NARROW;
      FS = L.FS;
      stage.setAttribute("viewBox", L.vb);
      build();
      render();
    }

    sl.addEventListener("input", function () { A = +this.value; render(); });
    $("gxP1").addEventListener("click", function () { A = 0.72; render(); });
    $("gxP2").addEventListener("click", function () { A = 1.00; render(); });
    $("gxP3").addEventListener("click", function () { A = 1.52; render(); });
    $("gxP4").addEventListener("click", function () { A = 5.20; render(); });

    function setFromX(clientX) {
      var bb = stage.getBoundingClientRect();
      var vbw = parseFloat(L.vb.split(" ")[2]);
      var xx = (clientX - bb.left) * (vbw / bb.width);
      var f = (xx - L.ax.x) / L.ax.w;
      f = Math.max(0, Math.min(1, f));
      A = AMIN * Math.pow(AMAX / AMIN, f);
      A = Math.round(A * 100) / 100;
      render();
    }
    stage.addEventListener("pointerdown", function (ev) {
      dragging = true;
      try { stage.setPointerCapture(ev.pointerId); } catch (e) {}
      setFromX(ev.clientX);
    });
    stage.addEventListener("pointermove", function (ev) {
      if (!dragging) return;
      ev.preventDefault();
      setFromX(ev.clientX);
    });
    ["pointerup", "pointercancel"].forEach(function (e) {
      stage.addEventListener(e, function () { dragging = false; });
    });
    window.addEventListener("blur", function () { dragging = false; });
    stage.addEventListener("keydown", function (ev) {
      if (ev.key === "ArrowLeft" || ev.key === "ArrowRight") {
        ev.preventDefault();
        A = Math.max(AMIN, Math.min(AMAX, A + (ev.key === "ArrowRight" ? 0.02 : -0.02)));
        A = Math.round(A * 100) / 100;
        render();
      }
    });

    var tmr = null;
    window.addEventListener("resize", function () {
      clearTimeout(tmr);
      tmr = setTimeout(applyLayout, 180);
    });

    applyLayout();
  })();
});

</script>
