<section class="gx-sec" id="a">
<h2><span class="sn">01</span>课本怎么说</h2>
<p class="gx-h2s">先背标准表述，再拆条件。</p>

<div class="gx-quote">
<p class="q-t">课本表述 · 生态保护<span class="q-src">人教版（2019）选择性必修3 · 第三章第三节</span></p>
<p class="q-b">生态保护，是指人类对生态系统加以保护，以<b>维持生态系统结构与功能的完整性、稳定性</b>，<b>维护生物多样性</b>，保障生态安全。</p>
<p class="q-n">→ 三件事：对象是<b>生态系统</b>；标准是<b>结构完整、功能稳定、生物多样</b>；目的是<b>生态安全</b>，它是国家安全的组成部分。"完整性"与"稳定性"是两个词，别只写一个。</p>
</div>

<div style="overflow-x:auto">
<table class="gx-cmp">
<thead><tr><th>比什么</th><th>国家公园</th><th>自然保护区</th><th>自然公园</th></tr></thead>
<tbody>
<tr><td>保护对象</td><td>国家代表性的大尺度自然生态系统、旗舰物种</td><td>典型的自然生态系统、珍稀濒危野生动植物</td><td>自然遗迹、自然景观</td></tr>
<tr class="key"><td>管控强度</td><td>最严：核心保护区原则上禁止人为活动</td><td>核心区、缓冲区、实验区分级管控</td><td>可持续利用，允许科研、教育、生态旅游</td></tr>
<tr><td>典型例子</td><td>三江源、大熊猫、东北虎豹</td><td>卧龙、长白山</td><td>张家界、镜泊湖</td></tr>
</tbody>
</table>
</div>
<p class="gx-note">最容易背错的是<b>管控强度</b>：三类不是"等级高低"，而是<b>对象不同、规则不同</b>。问"为什么建国家公园"，要答"国家代表性 + 大尺度 + 旗舰物种"。</p>
<p class="gx-note">空间底线：<b>生态保护红线</b>——具有特殊重要生态功能、必须严格保护的区域，陆域约占 <b>25%</b>，只能优化不能突破。配套措施：<b>天然林保护、退耕还林还草、湿地修复、生态廊道建设</b>。</p>

    var n = Math.ceil(p / 40 * PATCH.length);
    REF.patches.forEach(function (c, i) { c.setAttribute("opacity", i < n ? "1" : "0"); });
    var co = clamp((p - 14) / 11, 0, 1);
    REF.corr.forEach(function (ln) { ln.setAttribute("opacity", n1(co * 0.9)); });
    REF.pct.textContent = p + "%";

    var x = pl.x0 + (p / 40) * (pl.x1 - pl.x0);
    var y = pl.y1 - (I / 100) * (pl.y1 - pl.y0);
    REF.dot.setAttribute("cx", n1(x)); REF.dot.setAttribute("cy", n1(y));
    REF.gl.setAttribute("x1", n1(x)); REF.gl.setAttribute("x2", n1(x));
    REF.gl.setAttribute("y1", n1(y)); REF.gl.setAttribute("y2", pl.y1);
    var right = x > pl.x1 - 46;
    REF.dv.textContent = String(Math.round(I));
    REF.dv.setAttribute("x", n1(right ? x - 9 : x + 9));
    REF.dv.setAttribute("y", n1(y - 10));
    REF.dv.setAttribute("text-anchor", right ? "end" : "start");

    var st, col, bg, sn;
    if (p < 15) { st = "不足"; col = "#3f6f92"; bg = "#eef6fb"; sn = "低于 15%：斑块孤立，屏障功能弱"; }
    else if (p < 25) { st = "接近目标"; col = "#8a5c14"; bg = "#fbf1e2"; sn = "还差 " + (25 - p) + " 个百分点到 25% 红线"; }
    else { st = "达标"; col = "#1e6640"; bg = "#e6f6ee"; sn = "已达 25% 红线，重点转向连通与管理"; }
    $("gxVa").textContent = String(p);
    $("gxVb").textContent = String(Math.round(I));
    $("gxVc").textContent = String(Math.round(S));
    $("gxVs").textContent = st;
    $("gxVsn").textContent = sn;
    $("gxStBox").style.background = bg;
    $("gxStBox").style.borderColor = col + "44";
    $("gxVs").style.color = col;
    $("gxSl").value = String(p);
  }

  function applyLayout() {
    L = stage.parentElement.getBoundingClientRect().width >= 640 ? WIDE : NARROW;
    stage.setAttribute("viewBox", L.vb);
    build(); render();
  }

  $("gxSl").addEventListener("input", function () { A = +this.value; render(); });
  $("gxP1").addEventListener("click", function () { A = 0; render(); });
  $("gxP2").addEventListener("click", function () { A = 25; render(); });
  $("gxP3").addEventListener("click", function () { A = 40; render(); });
  stage.addEventListener("keydown", function (ev) {
    if (ev.key === "ArrowLeft" || ev.key === "ArrowRight") {
      ev.preventDefault();
      A = clamp(A + (ev.key === "ArrowRight" ? 1 : -1), 0, 40);
      render();
    }
  });
  var tmr = null;
  window.addEventListener("resize", function () {
    clearTimeout(tmr); tmr = setTimeout(applyLayout, 180);
  });
  applyLayout();
});
</script>
</body>
</html>
