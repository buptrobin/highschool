# Cloudflare Workers 静态资源发布配置
#
# 站点就是仓库根目录本身（index.html / subject.html / assets/ / pages/ / quiz/），
# 所以直接把 "." 当上传目录，不需要打包、没有 dist/。
#
# 发布（首次需要先 `npx wrangler login` 登录一次）：
#   npx wrangler deploy        # PowerShell 拦 npm.ps1 时用 npx.cmd
#
# 根目录下的源码和本地中间产物（tools/、content/、.workbuddy/ …）由
# 同目录的 .assetsignore 排除，不会被公开。

name = "highschool"
compatibility_date = "2026-10-25"

[assets]
directory = "."

# 找不到的路径返回 404.html（同时带上 404 状态码）
not_found_handling = "404-page"
